---
# Store one field of one canonical Vaultwarden item, from job parameters.
#
# WHY THIS EXISTS. `vaultwarden-cutover.yml` is the platform's importer, and it is a
# ONE-TIME job: `rundeck/jobs/vaultwarden-cutover.yaml` exports LAB_SEED_MODE=1 and
# `lab-run.sh` refuses that outright once the vault-mode marker exists ("runner is
# already in Vault mode; LAB_SEED_MODE cannot bypass Vaultwarden", measured as
# execution 147). So a secret AUTHORED AFTER the cutover — a second estate's ACME
# token, a firewall API key for an estate that gained DNS later — had no supported
# route into the vault at all, and the only answer available was a credential
# hand-written into config/infrastructure.yml on the runner's disk, which is exactly
# what the cutover exists to end.
#
# This play is that route. It runs in Vault mode like every other job (lab-run unlocks
# the vault and exports the session), writes through the same
# tasks/bitwarden/upsert-item.yml every role uses, and never touches a file.
#
# Usage:
#   ansible-playbook playbooks/maintenance/store-secret.yml \
#     -e vault_item=estates/foxglove/dns -e vault_field=api_key -e vault_value=...
#
# Rundeck: Config group, "Store Secret". `vault_value` is a secure option — Rundeck
# masks it in the form and in the log, and the write is no_log, so the secret appears
# in neither the job output nor Ansible's recorded module arguments.
#
# Parameters:
#   vault_item   canonical item name WITHOUT the homelab-infra/ prefix, e.g. `dns`,
#                `estates/foxglove/dns`, `media/sonarr`
#   vault_field  field name within that item, e.g. api_key
#   vault_value  the secret
#   merge        true (default) keeps the item's other fields; false makes the item
#                exactly this one field
#
# ONE FIELD PER RUN, deliberately: a survey cannot carry a variable number of secure
# options, and merge=true means a two-field credential is two runs converging on one
# item rather than a job that has to know every credential shape in the platform.
#
# It stores; it does not interpret. Which items exist and which fields they carry is
# ansible/vars/CONTRACT.md's business — this play refuses a malformed NAME, not an
# unrecognised one, so a new item shape needs no change here.
#
# The parameters are `vault_*` rather than the obvious item/field/value because `item`
# is Ansible's loop variable: an extra-var named `item` is shadowed inside every
# `loop:` in every file this play includes.

- name: "Store secret | Write one field of homelab-infra/<item>"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    # The Rundeck step passes the secret through the ENVIRONMENT, not through
    # --extra-vars: an -e argument is in ansible-playbook's argv, and argv is readable
    # by every local account through /proc. An explicit `-e vault_value=...` still wins
    # (extra vars outrank play vars), so the command line in the usage note above works
    # for an interactive run.
    vault_value: "{{ lookup('ansible.builtin.env', 'LAB_SECRET_VALUE') }}"

  tasks:
    - name: Assert the item name is canonical
      ansible.builtin.assert:
        that:
          - vault_item is defined
          - vault_item is string
          - vault_item is match('^[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+){0,2}$')
        fail_msg: >-
          vault_item is the canonical item name WITHOUT the homelab-infra/ prefix —
          one to three path segments of letters, digits, dot, dash or underscore
          (e.g. dns, estates/foxglove/dns, media/sonarr). Got:
          {{ vault_item | default('<unset>') }}

    - name: Assert the field name is usable
      ansible.builtin.assert:
        that:
          - vault_field is defined
          - vault_field is string
          - vault_field is match('^[A-Za-z0-9_.-]+$')
        fail_msg: >-
          vault_field is the field name inside the item (e.g. api_key). Got:
          {{ vault_field | default('<unset>') }}

    # Length only, and under no_log — a fail_msg that echoed the value would put the
    # secret in the job log, which is the one thing this play exists to avoid.
    - name: Assert a value was supplied
      ansible.builtin.assert:
        that:
          - vault_value is defined
          - vault_value | string | length > 0
        fail_msg: "vault_value is required and must not be empty."
      no_log: true

    - name: Store the field
      ansible.builtin.include_tasks: ../../tasks/bitwarden/upsert-item.yml
      vars:
        vault_item_name: "homelab-infra/{{ vault_item }}"
        vault_item_fields: "{{ {vault_field: vault_value | string} }}"
        vault_item_secret_fields: ["{{ vault_field }}"]
        vault_item_merge: "{{ merge | default(true) | bool }}"

    # upsert-item.yml reads the item back and asserts the stored fields equal what was
    # sent, so reaching here means the vault holds it. Naming it is the whole report:
    # the value must not be echoed, and `changed` alone does not say what changed.
    - name: Report what was stored
      ansible.builtin.debug:
        msg: >-
          homelab-infra/{{ vault_item }} now carries field '{{ vault_field }}'
          ({{ 'other fields preserved' if (merge | default(true) | bool)
              else 'item replaced with this field only' }}).
          It reaches Ansible as
          homelabinfra_vault.{{ vault_item | replace('/', '.') }}.{{ vault_field }}
          on the next run.
