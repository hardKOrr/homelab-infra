---
# Run one application's backup now, instead of waiting for its schedule.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/maintenance/backup-app.yml -e instance=mixpost
#
# Rundeck: job parameters
#   instance — the app instance to back up (required)
#   app      — only when the instance was deployed under a different name from the app.
#              Defaults to `instance`.
#
# WHY THIS EXISTS AND WHAT IT IS NOT
#
# For Kubernetes it runs the CronJob the deploy already installed, with
# `kubectl create job --from=cronjob/…`, so the on-demand backup and the scheduled one are
# byte-for-byte the same pod template. An explicitly selected Docker application instead
# dispatches to its role-owned recovery task. Two copies of a backup definition is how the
# tested one and the nightly one quietly stop matching, and the difference is discovered on
# the night the wrong one runs.
#
# It exists because three ordinary things need a snapshot at a moment somebody chose:
#
#   - proving the backup contract at all, which needs a snapshot before a restore can be
#     attempted, and 03:00 tomorrow is not a test cycle
#   - taking a known-good point before a risky change to an application
#   - confirming a fix after a backup failed overnight
#
# The job waits for the result and prints everything the pod said, so a failure is visible
# here rather than in a notification the operator has to go and correlate.

- name: "Backup App | Run the application backup now"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    _ba_app: "{{ app | default(instance, true) }}"

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance to back up: -e instance=mixpost"

    - name: Load app defaults (optional — absent for an app with no defaults file)
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/{{ _ba_app }}.yml"
        name: _app_defaults
      failed_when: false

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ (_app_defaults | default({})).get(_ba_defaults_key, {})
             | combine(_instance_config | default({}), recursive=True) }}
      vars:
        _ba_defaults_key: "{{ _ba_app | replace('-', '_') }}_defaults"

    - name: Resolve the hosting kind
      ansible.builtin.set_fact:
        _ba_kind: >-
          {{ app_config.hosting
             | default('docker' if app_config.stack is defined else 'native', true) }}

    - name: Assert this app has an application backup
      ansible.builtin.assert:
        that:
          - >-
            (_ba_kind == 'kubernetes' and app_config.backup.enabled | default(false) | bool)
            or
            (_ba_kind == 'docker'
             and app_config.backup.enabled | default(false) | bool
             and app_config.backup.application_consistent | default(false) | bool)
        fail_msg: >-
          {{ instance }} has no application backup to run. Kubernetes apps use their
          declared backup CronJob; a Docker app must explicitly own an
          application-consistent backup task.

    - name: Resolve the Docker application target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
      when: _ba_kind == 'docker'

  tasks:
    - name: Resolve the cluster and its API host
      when: _ba_kind == 'kubernetes'
      ansible.builtin.include_tasks: ../../tasks/kubernetes/resolve-cluster.yml

    - name: Derive the instance's namespace
      when: _ba_kind == 'kubernetes'
      ansible.builtin.include_tasks: ../../tasks/kubernetes/derive-namespace.yml
      vars:
        k8s_namespace_for: "{{ instance }}"

    # `kubectl create job --from=cronjob/…` against a namespace that is not there, or a
    # CronJob the deploy never installed, answers with a bare NotFound naming neither the
    # application nor what to do about it. Both cases have the same cause and it is worth
    # saying out loud: this instance's backup is declared in config but is not deployed.
    - name: Read the instance's backup CronJob
      when: _ba_kind == 'kubernetes'
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - get
          - "cronjob/{{ instance }}-backup"
          - -o
          - jsonpath={.spec.schedule}
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _ba_cronjob
      failed_when: false
      changed_when: false

    - name: Assert the backup is deployed
      when: _ba_kind == 'kubernetes'
      ansible.builtin.assert:
        that: _ba_cronjob.rc == 0
        fail_msg: >-
          No CronJob `{{ instance }}-backup` exists in namespace {{ k8s_namespace }}, so
          there is no backup definition to run. {{ instance }} declares a backup, so either
          it has never been deployed, or the deploy that ran found no Proxmox Backup Server
          to push to and said so at the time. Deploy the app and re-run this job.

    # Named for the run rather than for the app, so this Job's NAME never collides with one
    # the CronJob controller created and the two are told apart in `kubectl get jobs`.
    #
    # It does not make them mutually exclusive, and that is worth stating rather than
    # implying: `concurrencyPolicy: Forbid` governs only the Jobs the CronJob owns, and a
    # Job created with `--from=` is not one of them. Clicking this at 03:00 can therefore
    # run alongside the schedule. Both would take a consistent dump and file a separate
    # snapshot, so the cost is duplicated work rather than a damaged backup — but it is a
    # reason not to schedule this job.
    - name: Run the backup job
      when: _ba_kind == 'kubernetes'
      ansible.builtin.include_tasks: ../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ instance }}-backup-manual"
        k8s_job_from_cronjob: "{{ instance }}-backup"
        k8s_job_timeout: "{{ app_config.backup.timeout_seconds | default(3600) | int }}"

    - name: State where the snapshot went
      when: _ba_kind == 'kubernetes'
      ansible.builtin.debug:
        msg:
          - "Backup complete. The job's own output above names the PBS group it wrote to."
          - "This was the same definition the schedule runs
             ({{ _ba_cronjob.stdout | default('?') }}), started early — not a second copy."
          - "List what PBS now holds, and restore from it, with the `Restore App` job:
             instance={{ instance }}, overwrite=false."

    - name: Notify
      when: _ba_kind == 'kubernetes'
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ instance }} backed up"
        notify_message: >-
          An on-demand application backup of {{ instance }} completed and was pushed to the
          lab's PBS datastore. Restore it with the `Restore App` job.

    # The last task of the play. notify.yml records an undelivered notification as a FATAL
    # degradation rather than raising it, so without this gate a backup whose "it worked"
    # message never reached anyone reports green — the "catch it, print it, exit 0" shape
    # this repo forbids. The snapshot is already in PBS by the time this runs, so failing
    # here aborts nothing: it refuses to call the run successful when nobody was told.
    - name: Fail if anything about this backup did not work
      when: _ba_kind == 'kubernetes'
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ instance }} backup"

- name: "Backup App | Run the Docker application backup"
  hosts: "apptarget_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  tasks:
    # A dispatched Docker recovery task must set this generic completion fact only after
    # its archive is complete. Keeping the contract generic prevents a future role from
    # silently skipping the notification and degradation gate.
    - name: Run the application-owned Docker backup
      ansible.builtin.include_role:
        name: "{{ hostvars['localhost']._ba_app }}"
        tasks_from: backup
      vars:
        app_config: "{{ hostvars['localhost'].app_config }}"
        homelabinfra_infra: "{{ hostvars['localhost'].homelabinfra_infra }}"
      when: app_target_kind | default('native') == 'docker'

    - name: Notify Docker backup
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ app_target_instance }} backed up"
        notify_message: >-
          An application-consistent backup of {{ app_target_instance }} completed and was
          pushed to the lab's PBS datastore. Restore it with the Restore App job.
      when: _application_backup_complete | default(false) | bool

    - name: Fail if Docker backup degraded
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ app_target_instance }} backup"
      when: _application_backup_complete | default(false) | bool
