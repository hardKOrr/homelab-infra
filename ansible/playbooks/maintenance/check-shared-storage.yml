---
# Read-only cluster-wide shared storage check; fails after reporting all nodes.
# Usage: lab-run playbooks/maintenance/check-shared-storage.yml
- name: Shared storage | Check every cluster node
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

  tasks:
    - name: Check shared storage availability
      ansible.builtin.include_tasks: ../../tasks/proxmox/check-shared-storage.yml
