---
# Write or check one instance's recovery drill canary. tools/lab-drill calls it; it changes
# only drill-owned data.
#
# Usage:
#   lab-run playbooks/maintenance/drill-canary.yml -e instance=tautulli \
#       -e drill_action=create -e drill_id=d20261114-1530 -e drill_epoch=1763130600
#
# Inputs:
#   instance       the instance (required); app when it differs from instance
#   drill_action  create (write it), fresh (require it absent), verify (require it
#                  exactly as written); owner makes the Authentik login a browser
#                  canary signs in with (tasks/drill/sso-owner.yml) and writes no canary
#   drill_id      the drill run's id; the same value for all three actions
#   drill_epoch   the drill run's start time in seconds, for canaries that need a time
#   drill_final   true on the last verify, after the final Deploy: only then is a marker
#                  file deleted
#
# Dispatch: roles/<role>/tasks/drill-canary.yml when the role has it (it gets
# drill_canary_action, drill_canary_id and drill_canary_epoch, plus the target that
# tasks/maintenance/resolve-app-target.yml resolved). Otherwise an app that declares
# `drill.canary_path` in its app-defaults (a path, the name of an `app` key holding one, or
# a mapping of hosting method to either) gets a marker file there: a path the role's backup
# archives, on the Docker or native guest, or inside the pod for a `kubernetes:` entry
# (tasks/drill/pod-marker.yml). That proves the backup and restore transport, not that the
# application reads the data. A browser canary (roles/<role>/browser/*recovery.js) runs
# from tools/lab-drill instead of this playbook.

- name: "Drill Canary | {{ instance | default('(no instance)') }}"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Validate the canary inputs
      ansible.builtin.assert:
        that:
          - drill_action | default('') in ['create', 'fresh', 'verify', 'owner']
          - drill_id | default('') is match('^[A-Za-z0-9-]{1,40}$')
          - drill_epoch | default('0') | int > 0
        fail_msg: Pass drill_action=create|fresh|verify|owner, a plain drill_id and drill_epoch.

    - name: Resolve the instance's target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
      vars:
        resolve_app_target_kinds: [native, docker, kubernetes]

    - name: Make the browser canary's Authentik login
      when: drill_action == 'owner'
      block:
        - name: Make the drill owner
          ansible.builtin.include_tasks: ../../tasks/drill/sso-owner.yml

        - name: Stop before the canary
          ansible.builtin.meta: end_playbook

    - name: Resolve the canary
      ansible.builtin.set_fact:
        _dc_role: >-
          {{ ((app_config.recovery | default({})).native | default({})).role
             | default(_rat_app, true) }}
        # A bare name is an app key (config_path), so an instance that moves that
        # directory moves its marker with it.
        _dc_marker_dir: >-
          {{ (app_config.app | default({})).get(_dc_path, '')
             if _dc_path | length > 0 and not _dc_path.startswith('/') else _dc_path }}
      vars:
        _dc_declared: "{{ (app_config.drill | default({})).canary_path | default('', true) }}"
        _dc_path: >-
          {{ _dc_declared.get(app_config.hosting.method | default('native'), '')
             if _dc_declared is mapping else _dc_declared }}

    - name: Find the role's canary hook
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../roles/{{ _dc_role }}/tasks/drill-canary.yml"
      register: _dc_hook

    - name: Require a canary for this instance
      ansible.builtin.assert:
        that: >-
          _dc_hook.stat.exists
          or _dc_marker_dir | length > 0
        fail_msg: >-
          {{ instance }} has no drill canary for {{ _rat_kind }}: add
          roles/{{ _dc_role }}/tasks/drill-canary.yml, a browser recovery spec, or a
          drill.canary_path for this hosting method in its app-defaults.

    # The marker play writes on the resolved host, which the resolver takes from
    # inventory by name; only a guest homelab-infra owns may be changed.
    - name: Require a homelab-infra guest for the marker
      ansible.builtin.assert:
        that: _rat_host in groups['lab_managed'] | default([])
        fail_msg: >-
          {{ _rat_host }} does not carry _+lab; the drill writes its marker only on a guest
          homelab-infra owns.
      when: not _dc_hook.stat.exists and _rat_kind != 'kubernetes'

    - name: Write or check the marker inside the pod
      ansible.builtin.include_tasks: ../../tasks/drill/pod-marker.yml
      when: not _dc_hook.stat.exists and _rat_kind == 'kubernetes'

    - name: Run the role's canary hook
      ansible.builtin.include_role:
        name: "{{ _dc_role }}"
        tasks_from: drill-canary
      vars:
        drill_canary_action: "{{ drill_action }}"
        drill_canary_id: "{{ drill_id }}"
        drill_canary_epoch: "{{ drill_epoch | int }}"
      when: _dc_hook.stat.exists

- name: "Drill Canary | Marker file"
  hosts: "apptarget_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  vars:
    _dc: "{{ hostvars['localhost'] }}"
    _dc_file: "{{ _dc._dc_marker_dir }}/.lab-drill-canary"
  tasks:
    - name: Marker canary
      when: not _dc._dc_hook.stat.exists and _dc._rat_kind != 'kubernetes'
      block:
        - name: Require the marker directory
          ansible.builtin.stat:
            path: "{{ _dc._dc_marker_dir }}"
          register: _dc_dir
          failed_when: not (_dc_dir.stat.isdir | default(false))

        - name: Write the marker
          ansible.builtin.copy:
            dest: "{{ _dc_file }}"
            content: "{{ drill_id }}\n"
            mode: "0644"
          when: drill_action == 'create'

        # Existence first, so a marker that cannot be read is an error, not an absence.
        - name: Look for the marker
          ansible.builtin.stat:
            path: "{{ _dc_file }}"
          register: _dc_stat
          when: drill_action != 'create'

        - name: Require the marker absent on a fresh instance
          ansible.builtin.assert:
            that: not _dc_stat.stat.exists
            fail_msg: "{{ _dc_file }} exists on a fresh {{ instance }}: data survived Remove."
          when: drill_action == 'fresh'

        - name: Read the marker
          ansible.builtin.slurp:
            src: "{{ _dc_file }}"
          register: _dc_read
          when: drill_action == 'verify' and _dc_stat.stat.isreg | default(false)

        - name: Require the restored marker
          ansible.builtin.assert:
            that: (_dc_read.content | default('') | b64decode | trim) == drill_id
            fail_msg: "{{ _dc_file }} does not hold {{ drill_id }} after Restore."
          when: drill_action == 'verify'

        - name: Delete the marker after the last verify
          ansible.builtin.file:
            path: "{{ _dc_file }}"
            state: absent
          when: drill_action == 'verify' and drill_final | default(false) | bool
