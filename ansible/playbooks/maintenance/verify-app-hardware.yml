---
# Run the application's hardware playback check on its resolved guest. The hook owns
# source/codec validation and cleanup. Invoke through tools/lab-jellyfin-transcode.
- name: Verify application hardware playback
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Resolve the application's target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
      vars:
        resolve_app_target_kinds: [docker]

    - name: Require a source path
      ansible.builtin.assert:
        that:
          - hardware_check_source | default('') is match('^/')
        fail_msg: Supply hardware_check_source as an absolute path inside the application.

    - name: Run the role's hardware playback check
      ansible.builtin.include_tasks: "../../roles/{{ _rat_app }}/tasks/verify-hardware.yml"
