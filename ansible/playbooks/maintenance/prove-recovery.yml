---
# Repository-only dispatcher entry point. Plan is read-only; execute requires the exact
# owned disposable VMID and complete workload acknowledgement. Child playbooks inherit
# the wrapper's private vault snapshot/SSH environment; no second lab-run/refresh occurs.
- name: Prove Recovery | Dispatch the declared guest recovery method
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Run the bounded recovery proof dispatcher
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../files/recovery/proof.py"
        stdin: >-
          {{ {'app': app | default(''), 'instance': instance | default(''),
              'vmid': vmid | default('') | string, 'method': method | default('auto'),
              'execute': execute | default(false) | bool,
              'disposable': disposable | default(false) | bool,
              'workloads': workloads | default(''),
              'destination': destination | default('existing'),
              'target_vmid': target_vmid | default('') | string,
              'target_node': target_node | default(''),
              'target_storage': target_storage | default(''),
              'target_name': target_name | default(''),
              'target_network': target_network | default(''),
              'target_tags': target_tags | default(''),
              'backup_storage': backup_storage | default('pbs-homelab')}
             | to_json }}
      register: _proof_dispatch
      changed_when: execute | default(false) | bool
      failed_when: false

    - name: Report recovery proof evidence and retained recovery points
      ansible.builtin.debug:
        msg: "{{ _proof_dispatch.stdout | from_json }}"

    - name: Require the selected proof sequence to succeed
      ansible.builtin.assert:
        that: _proof_dispatch.rc == 0
        fail_msg: Recovery proof is incomplete. Use the reported retained points and retry boundary.
