---
# Run the installed BookStack application-consistent backup immediately.
#
# The scheduled and on-demand paths call the same root-owned helper on the services stack
# host. It stops only BookStack, dumps only its named database, and sends the dump plus
# /config to one PBS snapshot. It never stops or mutates the shared backend guest.

- name: "BookStack Backup | Resolve"
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide the BookStack instance: -e instance=bookstack"
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/bookstack.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.bookstack_defaults | combine(_instance_config | default({}), recursive=True) }}"
  tasks:
    - name: Resolve the existing services stack host
      ansible.builtin.include_tasks: ../../tasks/stack/resolve-existing-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        resolve_stack_deploy_group: "bookstack_recovery_{{ instance }}"

- name: "BookStack Backup | Run"
  hosts: "bookstack_recovery_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Run the BookStack recovery helper
      ansible.builtin.command:
        argv: [/usr/local/sbin/homelab-infra-bookstack-recovery, --backup]
      environment:
        BOOKSTACK_INSTANCE: "{{ instance }}"
      register: bookstack_backup_result
      changed_when: true

- name: "BookStack Backup | Notify"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Notify completed BookStack backup
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ instance }} backed up"
        notify_message: "Application-consistent BookStack backup for {{ instance }} was written to PBS."
      when: hostvars[groups['bookstack_recovery_' ~ instance][0]].bookstack_backup_result.rc | default(1) == 0
    - name: Fail if BookStack backup did not complete
      ansible.builtin.assert:
        that: hostvars[groups['bookstack_recovery_' ~ instance][0]].bookstack_backup_result.rc | default(1) == 0
        fail_msg: "BookStack backup failed; no success notification was sent."
