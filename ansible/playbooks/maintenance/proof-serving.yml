---
- name: Recovery Proof | Resolve serving target
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Resolve app hosting target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
    - name: Probe the application HTTP listener
      ansible.builtin.uri:
        url: "http://{{ hostvars[_rat_host].ansible_host }}:{{ proof_port }}/"
        status_code: [200, 301, 302, 303, 307, 308, 401, 403]
      changed_when: false
      no_log: true
    - name: Record serving evidence only
      ansible.builtin.debug:
        msg:
          proof_observation:
            serving: true
            url: "http://{{ hostvars[_rat_host].ansible_host }}:{{ proof_port }}"
