---
# Read-only lab status report. Safe to run at any time — makes no changes.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/maintenance/status.yml
#
# Semaphore/Rundeck: no parameters. Output goes to the job console.
#
# Reports:
#   - Every homelab-infra tagged Proxmox guest (running / stopped, vmid, node, IP)
#   - Docker containers on each guest that runs Docker (name, image, state)
#   - Native LXC apps with an update available (lab-update-check, same source as
#     playbooks/maintenance/check-native-updates.yml — this one only displays)
#   - The Kubernetes cluster: node readiness, the workloads in every managed namespace,
#     and every PersistentVolume no claim is using — the volumes a removal with
#     delete_data: false deliberately retained, which nothing else in the platform would
#     ever mention (tasks/kubernetes/list-orphan-volumes.yml)
#   - Uptime Kuma monitors (via the REST API)
#   - PBS snapshots per guest, newest first (via the PBS API)
#
# Best-effort throughout: an unreachable guest, a down Kuma or an absent PBS
# reports as much and the run continues. A status report must never fail — a
# red job teaches nothing about the lab.
#
# Sends no notification: this is a pull action, not an event.

# ── Play 1: Proxmox guest inventory ────────────────────────────────────────────
- name: "Status | Refresh Proxmox inventory"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

  tasks:
    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory


# ── Play 2: Per-guest state ────────────────────────────────────────────────────
# Runs against every tagged guest. Unreachable guests are recorded as such by
# Play 3 (their facts below are simply never set) rather than failing the run.
- name: "Status | Gather guest detail"
  hosts: tag_homelab_infra
  become: true
  gather_facts: false
  ignore_unreachable: true

  vars:
    # The Proxmox dynamic inventory carries no connection user, and unlike the deploy
    # playbooks nothing here add_hosts these guests with one — without this the play
    # connects as the account running Ansible (rundeck on a runner) and every guest
    # is unreachable. Play 1 loaded homelabinfra_config on localhost.
    ansible_user: >-
      {{ hostvars['localhost'].homelabinfra_config.ansible.ssh_user | default('root') }}

  tasks:
    - name: Check whether this guest runs Docker
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: _st_docker_stat
      failed_when: false

    # The Go-template braces are escaped: Ansible templates this string before the
    # shell ever sees it.
    - name: List containers
      ansible.builtin.command:
        cmd: >-
          docker ps --all
          --format {% raw %}'{{.Names}}|{{.Image}}|{{.State}}|{{.Status}}'{% endraw %}
      register: _st_docker_ps
      changed_when: false
      failed_when: false
      when: _st_docker_stat.stat.exists | default(false)

    - name: Record container lines
      ansible.builtin.set_fact:
        _st_containers: "{{ _st_docker_ps.stdout_lines | default([]) }}"

    - name: Check whether this guest ships lab-update-check
      ansible.builtin.stat:
        path: /usr/local/bin/lab-update-check
      register: _st_check_stat
      failed_when: false

    - name: Run the update check
      ansible.builtin.command: /usr/local/bin/lab-update-check
      register: _st_check_raw
      changed_when: false
      failed_when: false
      when: _st_check_stat.stat.exists | default(false)

    - name: Parse the update check result
      ansible.builtin.set_fact:
        _st_update: "{{ _st_check_raw.stdout | from_json }}"
      when:
        - _st_check_stat.stat.exists | default(false)
        - _st_check_raw.rc | default(1) == 0


# ── Play 3: Platform services and rendering ────────────────────────────────────
- name: "Status | Report"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # absent pre-bootstrap — both sections report "not configured"

  vars:
    _st_guests: "{{ groups['tag_homelab_infra'] | default([]) | sort }}"
    # Play 2 sets _st_containers on every guest it reached, so its absence is the
    # reachability signal. The sections below distinguish "read nothing" from "read
    # an empty set" — those rendered identically before, and an unreachable estate
    # reported as a healthy one with nothing to say.
    _st_unreachable: >-
      {{ _st_guests | map('extract', hostvars)
         | rejectattr('_st_containers', 'defined')
         | map(attribute='inventory_hostname') | list }}
    # Set by tasks/kubernetes/list-orphan-volumes.yml, and undefined on a lab with no
    # cluster or a cluster that did not answer — both of which render as no section at all.
    # Play vars are templated where they are used, not where they are declared, so a fact
    # this play sets later is visible here.
    _st_k8s_orphans: "{{ k8s_orphan_volumes | default([]) }}"

  tasks:
    # ── Uptime Kuma ────────────────────────────────────────────────────────────
    # Over socket.io. This used to GET /api/monitors with the API key, which could only
    # ever report zero monitors: Uptime Kuma has no REST monitor API in any version, and
    # its catch-all route answers that path with the front end's HTML, so `.json` was
    # always absent and the list always empty. Slice 303 rebuilt the wiring on the
    # transport that does work, and this report reads through the same helpers.
    - name: Start with no monitors
      ansible.builtin.set_fact:
        _st_monitors: []

    - name: Read the Uptime Kuma monitors
      when:
        - homelabinfra_infra.monitoring is defined
        - homelabinfra_infra.monitoring.provider | default('none') == 'uptime_kuma'
        - homelabinfra_infra.monitoring.host | default('') | length > 0
        - homelabinfra_infra.monitoring.admin_user | default('') | length > 0
        - homelabinfra_infra.monitoring.admin_password | default('') | length > 0
      block:
        - name: Open an authenticated socket to Uptime Kuma
          ansible.builtin.include_tasks: ../../tasks/kuma/open-session.yml
          vars:
            kuma_base: "{{ homelabinfra_infra.monitoring.host }}"
            kuma_user: "{{ homelabinfra_infra.monitoring.admin_user }}"
            kuma_password: "{{ homelabinfra_infra.monitoring.admin_password }}"

        - name: Ask for the monitor list
          ansible.builtin.include_tasks: ../../tasks/kuma/call.yml
          vars:
            kuma_call_event: getMonitorList
            kuma_call_ack_id: 1
          when: kuma_session_ready | bool

        - name: Normalise the monitor list
          ansible.builtin.set_fact:
            _st_monitors: >-
              {{ ((kuma_session_frames | select('match', '42\["monitorList",') | list
                   | last | default('42["monitorList",{}]'))
                  | regex_replace('^42', '') | from_json | last).values() | list }}
          when: kuma_session_ready | bool

    # ── PBS ────────────────────────────────────────────────────────────────────
    - name: Query PBS snapshots
      ansible.builtin.uri:
        url: >-
          {{ homelabinfra_infra.backups.host }}/api2/json/admin/datastore/{{
             homelabinfra_infra.backups.datastore | default('homelab') }}/snapshots
        method: GET
        headers:
          Authorization: >-
            PBSAPIToken={{ homelabinfra_infra.backups.api_token_id | default('') }}:{{
               homelabinfra_infra.backups.api_token_secret | default('') }}
        validate_certs: false
        status_code: [200, 401, 403, 404]
        timeout: 10
      register: _st_pbs
      failed_when: false
      changed_when: false
      no_log: true
      when:
        - homelabinfra_infra.backups is defined
        - homelabinfra_infra.backups.host | default('') | length > 0
        - homelabinfra_infra.backups.api_token_id | default('') | length > 0

    - name: Reduce PBS snapshots to the newest per backup id
      ansible.builtin.set_fact:
        _st_backups: >-
          {{ ((_st_pbs.json.data | default([]))
              | sort(attribute='backup-time', reverse=true)
              | unique(attribute='backup-id') | list)
             if (_st_pbs.status | default(0)) == 200 else [] }}

    # ── Kubernetes ─────────────────────────────────────────────────────────────
    # Without this section a Kubernetes-hosted app is invisible to Lab Status. The three
    # cluster VMs show up under GUESTS because they are tagged like any other guest, and
    # the applications running inside them show up nowhere at all — which is precisely the
    # "untracked second platform" this slice is meant to avoid.
    #
    # One command, read-only, and skipped entirely when no cluster is recorded. A status
    # job must never be the thing that fails a lab report.
    - name: Start with no cluster
      ansible.builtin.set_fact:
        _st_k8s_nodes: []
        _st_k8s_apps: []

    - name: Read the cluster's nodes and app namespaces
      when:
        - homelabinfra_infra.kubernetes is defined
        - homelabinfra_infra.kubernetes.nodes | default([]) | length > 0
      block:
        # Through the shared resolver rather than delegating straight at the inventory
        # host: an inventory host carries no `ansible_user`, so the delegated kubectl
        # would connect as whoever the runner is and be refused. resolve-cluster.yml
        # registers the nodes with the platform's SSH user, exactly as
        # tasks/proxmox/register-nodes.yml does for Proxmox node delegation.
        - name: Resolve the cluster's delegation target
          ansible.builtin.include_tasks: ../../tasks/kubernetes/resolve-cluster.yml

        # custom-columns, not jsonpath. A jsonpath that emits one line per item has to
        # carry a literal `{"\n"}`, and a newline inside a YAML scalar inside a shell
        # heredoc is three layers of escaping to get wrong — it was wrong twice here
        # before this comment existed. custom-columns emits one row per item by
        # construction, with nothing to escape.
        - name: Read cluster node readiness
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - get
              - nodes
              - --no-headers
              - -o
              - custom-columns=NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,TAINTS:.spec.taints[*].key
          delegate_to: "{{ k8s_api_host }}"
          become: true
          register: _st_k8s_node_raw
          failed_when: false
          changed_when: false

        - name: Read the workloads in every homelab-infra namespace
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - get
              - deployments,statefulsets
              - --all-namespaces
              - -l
              - app.kubernetes.io/managed-by=homelab-infra
              - --no-headers
              - -o
              - custom-columns=NS:.metadata.namespace,KIND:.kind,NAME:.metadata.name,READY:.status.readyReplicas,WANT:.spec.replicas
          delegate_to: "{{ k8s_api_host }}"
          become: true
          register: _st_k8s_app_raw
          failed_when: false
          changed_when: false

        # Blank lines and any stray diagnostic are dropped by requiring at least two
        # whitespace-separated columns, which every real row has.
        - name: Normalise what the cluster reported
          ansible.builtin.set_fact:
            _st_k8s_nodes: >-
              {{ _st_k8s_node_raw.stdout_lines | default([])
                 | map('split') | selectattr('1', 'defined') | list }}
            _st_k8s_apps: >-
              {{ _st_k8s_app_raw.stdout_lines | default([])
                 | map('split') | selectattr('4', 'defined') | list }}

        # The volumes no claim is using. A `Retain` StorageClass means a removed app leaves
        # its data behind on purpose, and until this line existed the platform never
        # mentioned that anywhere: the namespace is gone, the app is gone, and several
        # hundred megabytes of it sit on one node with nothing pointing at them. Read-only
        # and tolerant of every failure — see the seam's header.
        - name: Read the volumes nothing is using
          ansible.builtin.include_tasks: ../../tasks/kubernetes/list-orphan-volumes.yml

    # ── Render ─────────────────────────────────────────────────────────────────
    # One debug of a pre-split line list: Semaphore and Rundeck both render a
    # msg list one line per entry, which a single embedded-newline string does not.
    - name: Render the status report
      ansible.builtin.debug:
        msg: "{{ _st_report.splitlines() }}"
      vars:
        _st_report: |
          ══════════════════════════════════════════════════════════════════
          LAB STATUS — {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          ══════════════════════════════════════════════════════════════════

          GUESTS ({{ _st_guests | length }} tagged homelab-infra{{
            ', %d unreachable' | format(_st_unreachable | length) if _st_unreachable | length > 0 else '' }})
          {% if _st_guests | length == 0 %}
            none — has bootstrap run? (or Proxmox credentials are not exported)
          {% endif %}
          {% for h in _st_guests %}
            {{ '%-22s' | format(h) }} {{ '%-8s' | format(hostvars[h].proxmox_status | default('?')) }} vmid {{ hostvars[h].proxmox_vmid | default('?') }}  node {{ hostvars[h].proxmox_node | default('?') }}  {{ hostvars[h].ansible_host | default('no ip') }}{{ '  UNREACHABLE' if hostvars[h]._st_containers is not defined else '' }}
          {% endfor %}

          CONTAINERS
          {% set _ctr_hosts = [] %}
          {% for h in _st_guests if hostvars[h]._st_containers | default([]) | length > 0 %}
          {% set _ = _ctr_hosts.append(h) %}
          {% endfor %}
          {% if _ctr_hosts | length == 0 and _st_unreachable | length == _st_guests | length %}
            unknown — no guest was reachable, so nothing could be read
          {% elif _ctr_hosts | length == 0 %}
            none — no Docker host reported a container
          {% endif %}
          {% for h in _ctr_hosts %}
            {{ h }}:
          {% for line in hostvars[h]._st_containers %}
              {{ '%-24s' | format(line.split('|')[0]) }} {{ '%-10s' | format(line.split('|')[2] | default('?')) }} {{ line.split('|')[1] | default('?') }}
          {% endfor %}
          {% endfor %}

          KUBERNETES
          {% if homelabinfra_infra.kubernetes is not defined %}
            no cluster deployed — the Kubernetes hosting backend is optional
          {% elif _st_k8s_nodes | length == 0 %}
            unreachable — a cluster is recorded ({{ homelabinfra_infra.kubernetes.host | default('?') }})
            but did not answer, so its workloads could not be read
          {% else %}
            ingress {{ homelabinfra_infra.kubernetes.ingress_vip | default('?') }}   storage {{ homelabinfra_infra.kubernetes.storage_class | default('?') }} ({{ homelabinfra_infra.kubernetes.storage_reclaim_policy | default('?') }}, node-pinned)   {{ homelabinfra_infra.kubernetes.failure_domain_mode | default('?') }}
          {% for n in _st_k8s_nodes %}
            {{ '%-22s' | format(n[0]) }} {{ '%-10s' | format('Ready' if n[1] == 'True' else 'NOT READY') }} {{ '' if n[2] | default('<none>') == '<none>' else n[2] }}
          {% endfor %}
          {% endif %}
          {% if _st_k8s_apps | length > 0 %}

          {% for a in _st_k8s_apps %}
            {{ '%-22s' | format(a[0]) }} {{ '%-30s' | format(a[1] ~ '/' ~ a[2]) }} {{ ('0' if a[3] == '<none>' else a[3]) }} of {{ a[4] }} ready
          {% endfor %}
          {% elif _st_k8s_nodes | length > 0 %}
            no applications deployed on the cluster yet
          {% endif %}
          {% if _st_k8s_orphans | length > 0 %}

            RETAINED VOLUMES ({{ _st_k8s_orphans | length }} unused, {{ k8s_orphan_total_human | default('?') }} on disk)
              Kept on purpose: the platform StorageClass is Retain, so removing an app with
              delete_data: false deletes its namespace and claims and leaves the volume holding
              the data. Nothing removes these for you — that is what makes them a restore point.
              Available = reusable now; reattach it with a PVC naming the volume.
              Released  = still points at the claim that was deleted, and cannot be reused
                          until that reference is cleared.
              {{ '%-40s' | format('VOLUME') }} {{ '%-9s' | format('PHASE') }} {{ '%-8s' | format('ON DISK') }} of {{ '%-6s' | format('ASKED') }} {{ '%-8s' | format('NODE') }} {{ '%-14s' | format('WAS APP') }} AGE
          {% for v in _st_k8s_orphans %}
              {{ '%-40s' | format(v.name) }} {{ '%-9s' | format(v.phase) }} {{ '%-8s' | format(v.used) }} of {{ '%-6s' | format(v.capacity) }} {{ '%-8s' | format(v.node | default('?', true)) }} {{ '%-14s' | format(v.instance | default('?', true)) }} {{ v.age }}{{ '   stale claim ' ~ v.claim if v.claim | length > 0 else '' }}
          {% endfor %}
              Clear or destroy one with the Reclaim Volume job:
                playbooks/maintenance/reclaim-volume.yml -e volume=<name> -e action=report|release|delete
          {% elif _st_k8s_nodes | length > 0 and k8s_volume_read_ok | default(false) | bool %}
            no retained volumes — nothing on {{ homelabinfra_infra.kubernetes.storage_class | default('the platform class') }} is unclaimed
          {% endif %}

          NATIVE APP UPDATES
          {% set _updates = hostvars.values() | selectattr('_st_update', 'defined') | map(attribute='_st_update') | selectattr('update_available', 'equalto', true) | list %}
          {% if _updates | length == 0 and _st_unreachable | length == _st_guests | length %}
            unknown — no guest was reachable, so nothing could be read
          {% elif _updates | length == 0 %}
            all native apps are current (or none report a version)
          {% endif %}
          {% for u in _updates %}
            {{ '%-22s' | format(u.app) }} {{ u.installed }} -> {{ u.latest }}   re-run its deploy job to update
          {% endfor %}

          MONITORS
          {% if _st_monitors | length == 0 %}
            unavailable — Uptime Kuma is not configured, not reachable, has no admin
            credentials on record, or has registered no monitors yet
          {% endif %}
          {% for m in _st_monitors %}
            {{ '%-24s' | format(m.name | default('?')) }} {{ 'active' if m.active | default(false) else 'paused' }}   {{ m.url | default('') }}
          {% endfor %}

          BACKUPS
          {% if _st_backups | length == 0 %}
            unavailable — PBS is not configured, not reachable, or has no snapshots yet
          {% endif %}
          {% for s in _st_backups %}
            {{ '%-22s' | format(s['backup-id'] | string) }} newest {{ '%Y-%m-%d %H:%M' | strftime(s['backup-time']) }}
          {% endfor %}
          ══════════════════════════════════════════════════════════════════
