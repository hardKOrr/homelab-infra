---
# Restart a native LXC app via its lab-restart-app script.
# Notifies via Ntfy on success or failure (silent no-op if ntfy is not the
# configured notifications provider).
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/maintenance/restart-app.yml -e instance=vaultwarden
#
# Semaphore/Rundeck: job parameter = instance (the app instance name)

# Play 1 asserts on localhost so a missing `instance` fails with the friendly
# message below — Play 2's hosts pattern would otherwise die first with an
# opaque inventory error.
- name: Restart App | Validate parameters
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert instance name provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Pass the app instance name: -e instance=<name>"

    # The connection user must be loaded here, before the guest play: the Proxmox
    # dynamic inventory carries no ansible_user, so Play 2 would connect as the
    # account running Ansible — rundeck on a runner — and every guest is
    # UNREACHABLE with "Permission denied (publickey)". Found live, execution 103.
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

# The default() can only fire during --syntax-check: Play 1 has already
# asserted `instance` is defined by the time this play's pattern is resolved.
- name: Restart App | {{ instance | default('(no instance)') }}
  hosts: "{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  vars:
    ansible_user: >-
      {{ hostvars['localhost'].homelabinfra_config.ansible.ssh_user | default('root') }}
  tasks:
    - name: Restart app
      ansible.builtin.command: /usr/local/bin/lab-restart-app
      changed_when: true
      register: _restart

# Runs even when the restart play failed (localhost is still healthy), so the
# outcome is read back from the target's hostvars to word the message honestly.
- name: Restart App | Notify
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # absent pre-bootstrap — notify below no-ops
  vars:
    _restart_ok: >-
      {{ hostvars[instance]._restart is defined
         and hostvars[instance]._restart is not failed }}
  tasks:
    - name: Notify via Ntfy
      ansible.builtin.uri:
        url: "{{ homelabinfra_infra.notifications.host }}/{{ homelabinfra_infra.notifications.topic | default('homelab') }}"
        method: POST
        # Ntfy is closed by default (slice 401) — carry the publish token when the
        # registry has one. An Ntfy predating that change has no token and stays open.
        headers: >-
          {{ {'Title': instance ~ ' restart ' ~ (_restart_ok | bool | ternary('complete', 'FAILED')),
              'Priority': _restart_ok | bool | ternary('default', 'high')}
             | combine({'Authorization': 'Bearer ' ~ homelabinfra_infra.notifications.token}
                       if homelabinfra_infra.notifications.token | default('') | length > 0
                       else {}) }}
        body: >-
          {{ _restart_ok | bool
             | ternary(instance ~ ' was restarted manually.',
                       instance ~ ' restart FAILED — check the job output.') }}
        body_format: raw
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.notifications is defined
        - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'
        - homelabinfra_infra.notifications.host is defined
