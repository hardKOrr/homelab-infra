---
- name: Recovery Proof | Read the exact guest unit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Register Proxmox delegates
      ansible.builtin.import_tasks: ../../tasks/proxmox/register-nodes.yml
    - name: Read cluster guests
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      register: _proof_inventory
      changed_when: false
      no_log: true
    - name: Select the explicit guest
      ansible.builtin.set_fact:
        _proof_matches: >-
          {{ (_proof_inventory.stdout | from_json)
             | selectattr('vmid', 'equalto', vmid | int) | list }}
      no_log: true
    - name: Require one existing guest
      ansible.builtin.assert:
        that: _proof_matches | length == 1
    - name: Read guest configuration
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ (_proof_matches | first).node }}/{{ (_proof_matches | first).type }}/{{ vmid }}/config"
          - --output-format
          - json
      delegate_to: "{{ (_proof_matches | first).node }}"
      register: _proof_config
      changed_when: false
      no_log: true
    - name: Read native artifact identities
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ (_proof_matches | first).node }}/storage/{{ backup_storage }}/content"
          - --content
          - backup
          - --vmid
          - "{{ vmid }}"
          - --output-format
          - json
      delegate_to: "{{ (_proof_matches | first).node }}"
      register: _proof_artifacts
      changed_when: false
      no_log: true
    - name: Read source PBS backend availability before mutation
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ (_proof_matches | first).node }}/storage"
          - --output-format
          - json
      delegate_to: "{{ (_proof_matches | first).node }}"
      register: _proof_source_storages
      changed_when: false
      no_log: true
    - name: Read destination storage availability before mutation
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ target_node | default((_proof_matches | first).node, true) }}/storage"
          - --output-format
          - json
      delegate_to: "{{ target_node | default((_proof_matches | first).node, true) }}"
      register: _proof_storages
      changed_when: false
      no_log: true
    - name: Publish private observation to the child transport
      ansible.builtin.debug:
        msg:
          proof_observation:
            guest: "{{ _proof_matches | first }}"
            config: >-
              {{ (_proof_config.stdout | from_json) | dict2items
                 | selectattr('key', 'match', '^(name|hostname|tags|onboot|rootfs|net[0-9]+|ipconfig[0-9]+|mp[0-9]+|scsi[0-9]+|sata[0-9]+|virtio[0-9]+|ide[0-9]+|hostpci[0-9]+|usb[0-9]+|dev[0-9]+|hookscript)$')
                 | items2dict }}
            units: >-
              {{ (_proof_inventory.stdout | from_json)
                 | selectattr('tags', 'defined')
                 | selectattr('tags', 'search', '(^|;)' ~ (proof_selector | default('_' ~ instance) | regex_escape) ~ '(;|$)') | list }}
            target_names: >-
              {{ (_proof_inventory.stdout | from_json)
                 | selectattr('name', 'defined')
                 | selectattr('name', 'equalto', target_name | default('')) | list }}
            targets: >-
              {{ (_proof_inventory.stdout | from_json)
                 | selectattr('vmid', 'equalto', target_vmid | default('0', true) | int) | list }}
            source_storages: "{{ _proof_source_storages.stdout | from_json }}"
            storages: "{{ _proof_storages.stdout | from_json }}"
            artifacts: "{{ _proof_artifacts.stdout | from_json }}"
