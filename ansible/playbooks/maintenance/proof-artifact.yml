---
- name: Recovery Proof | Verify artifact readability before the next phase
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Register Proxmox delegates
      ansible.builtin.import_tasks: ../../tasks/proxmox/register-nodes.yml
    - name: Read the selected native PBS configuration blob
      ansible.builtin.command:
        argv: [pvesm, extractconfig, "{{ backup_storage }}:{{ recovery_point }}"]
      delegate_to: "{{ proof_node }}"
      register: _proof_blob
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require readable artifact credentials and decryption material
      ansible.builtin.assert:
        that:
          - _proof_blob.rc == 0
          - _proof_blob.stdout | length > 0
        fail_msg: Artifact configuration could not be read; no next fixture/restore phase is authorized.
    - name: Record artifact readability only
      ansible.builtin.debug:
        msg:
          proof_observation:
            artifact_readable: true
