---
# Run the CronJob already deployed for Kometa once and print its complete output.
#
# Usage:
#   lab-run playbooks/maintenance/run-kometa.yml

- name: "Kometa | Run the scheduled job now"
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    instance: kometa
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Require the Kometa target
      ansible.builtin.assert:
        that: instance == 'kometa'
        fail_msg: This playbook runs only the Kometa instance.

    - name: Resolve the cluster and API host
      ansible.builtin.include_tasks: ../../tasks/kubernetes/resolve-cluster.yml

    - name: Verify the Kometa namespace is platform-owned
      ansible.builtin.include_tasks: ../../tasks/kubernetes/ensure-namespace.yml

    - name: Read the operator-owned Kometa configuration
      ansible.builtin.set_fact:
        _kometa_config_document: >-
          {{ homelabinfra_vault.apps[instance].config_yml | from_yaml }}
      no_log: true

    - name: Check Plex endpoint candidates from the cluster
      ansible.builtin.uri:
        url: >-
          {{ item.url | regex_replace('/+$', '') }}/identity
        method: GET
        headers:
          X-Plex-Token: "{{ hostvars['localhost'].homelabinfra_vault.media.plex.token }}"
        status_code: [200]
        return_content: false
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _kometa_plex_endpoint
      loop: >-
        {{ plex_endpoint_candidates | default([
             {'name': 'configured',
              'url': hostvars['localhost']._kometa_config_document.plex.url}
           ]) }}
      loop_control:
        label: "{{ item.name }}"
      failed_when: false
      changed_when: false
      no_log: true

    - name: Build a safe Plex endpoint status summary
      ansible.builtin.set_fact:
        _kometa_plex_endpoint_summary: >-
          {{ (_kometa_plex_endpoint_summary | default([]))
             + [item.item.name ~ '=' ~ (item.status | default(0) | string)] }}
      loop: "{{ _kometa_plex_endpoint.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Report endpoint labels and status codes
      ansible.builtin.debug:
        msg: "{{ _kometa_plex_endpoint_summary }}"

    - name: Require a Plex endpoint candidate to be reachable
      ansible.builtin.assert:
        that: >-
          _kometa_plex_endpoint.results
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | list | length > 0
        fail_msg: >-
          No Plex endpoint candidate was reachable from the cluster node.

  tasks:
    - name: Run the deployed Kometa CronJob
      ansible.builtin.include_tasks: ../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ instance }}-manual"
        k8s_job_from_cronjob: "{{ instance }}"
        k8s_job_timeout: 7200

    - name: Require a clean Kometa completion log
      ansible.builtin.assert:
        that:
          - k8s_job_log is search('(?im)\\bFinished\\b')
          - >-
            k8s_job_log is not search(
              '(?im)\\b(?:Config Error|Plex Error|TMDb Error|Critical Summary|Traceback|FATAL)\\b'
            )
        fail_msg: >-
          Kometa's Job completed, but its output contains a fatal, configuration or service
          error. Review the job output printed above.
