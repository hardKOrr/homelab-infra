---
# Run the CronJob already deployed for Kometa once and print its complete output.
#
# Usage:
#   lab-run playbooks/maintenance/run-kometa.yml

- name: "Kometa | Run the scheduled job now"
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    instance: kometa
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Require the Kometa target
      ansible.builtin.assert:
        that: instance == 'kometa'
        fail_msg: This playbook runs only the Kometa instance.

    - name: Load Kometa defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/kometa.yml
        name: _app_defaults

    - name: Load Kometa instance configuration
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Merge Kometa config and Vaultwarden values
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.kometa_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})},
                       recursive=True) }}

    - name: Resolve the cluster and API host
      ansible.builtin.include_tasks: ../../tasks/kubernetes/resolve-cluster.yml

    - name: Verify the Kometa namespace is platform-owned
      ansible.builtin.include_tasks: ../../tasks/kubernetes/ensure-namespace.yml

    - name: Read the operator-owned Kometa configuration
      ansible.builtin.set_fact:
        _kometa_config_document: >-
          {{ app_config.app.config_yml | from_yaml }}
      no_log: true

    - name: Require a configured Plex endpoint and token
      ansible.builtin.assert:
        that:
          - _kometa_config_document is mapping
          - _kometa_config_document.plex is mapping
          - _kometa_config_document.plex.url | default('', true) | length > 0
          - _kometa_config_document.plex.token | default('', true) | length > 0
        fail_msg: Kometa config.yml must define plex.url and plex.token.
      no_log: true

    - name: Check the configured Plex endpoint from the cluster
      ansible.builtin.uri:
        url: >-
          {{ _kometa_config_document.plex.url | regex_replace('/+$', '') }}/identity
        method: GET
        headers:
          X-Plex-Token: "{{ _kometa_config_document.plex.token }}"
        status_code: [200]
        return_content: false
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _kometa_plex_endpoint
      failed_when: false
      changed_when: false
      no_log: true

    - name: Report configured Plex endpoint status
      ansible.builtin.debug:
        msg: >-
          Configured Plex endpoint HTTP {{ _kometa_plex_endpoint.status | default(0) }}

    - name: Require the configured Plex endpoint to be reachable
      ansible.builtin.assert:
        that: _kometa_plex_endpoint.status | default(0) | int == 200
        fail_msg: >-
          The configured Plex endpoint was not reachable from the cluster node.

  tasks:
    - name: Run the deployed Kometa CronJob
      ansible.builtin.include_tasks: ../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ instance }}-manual"
        k8s_job_from_cronjob: "{{ instance }}"
        k8s_job_timeout: 7200

    - name: Require a clean Kometa completion log
      ansible.builtin.assert:
        that:
          - k8s_job_log is search('(?m)\\bFinished\\b')
          - >-
            k8s_job_log is not search(
              '(?m)^.*\\|\\s*(?:ERROR|CRITICAL|FATAL)\\s*\\|'
            )
          - k8s_job_log is not search('(?m)^Traceback \\(most recent call last\\):')
        fail_msg: >-
          Kometa's Job completed, but its output contains a fatal, configuration or service
          error. Review the job output printed above.
