---
# Reconcile the explicitly enabled lab-wide OPNsense base rules and aliases.
#
# Usage: lab-run playbooks/maintenance/reconcile-firewall-base.yml
# The default absent/false firewall.base.enabled flag is a no-op.

- name: Firewall base | Reconcile OPNsense rules
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

  tasks:
    - name: Reconcile enabled base rules
      ansible.builtin.include_tasks: ../../tasks/firewall/opnsense-base.yml
      when: >-
        homelabinfra_config.infrastructure.firewall.base.enabled
        | default(false) | bool
