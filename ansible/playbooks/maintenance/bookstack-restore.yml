---
# Plan or perform a restore of one BookStack instance from its own PBS snapshot.
#
# overwrite=false (the default) is read-only. overwrite=true requires a distinct,
# verified pre_restore_point from a fresh backup of this instance, then stops only the
# named BookStack service, replaces its /config data and named database, and leaves the
# shared backend and every other application untouched. On failure the helper restores
# the original data and database before starting the service; if rollback itself fails,
# it preserves the rollback files and leaves BookStack stopped for inspection.

- name: "BookStack Restore | Resolve"
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that:
          - instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
          - snapshot | default('') is match('^$|^host/[A-Za-z0-9_.-]+/[A-Za-z0-9T:_.+Z-]+$')
          - pre_restore_point | default('') is match('^$|^host/[A-Za-z0-9_.-]+/[A-Za-z0-9T:_.+Z-]+$')
          - overwrite | default(false) | string in ['false', 'true', 'False', 'True']
          - not (overwrite | default(false) | bool) or snapshot | default('') | length > 0
          - not (overwrite | default(false) | bool) or pre_restore_point | default('') | length > 0
          - not (overwrite | default(false) | bool) or pre_restore_point != snapshot
        fail_msg: >-
          Provide a BookStack instance and a valid PBS snapshot. An overwrite also needs
          a distinct pre_restore_point from host/<instance>/ captured by a fresh backup.
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/bookstack.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.bookstack_defaults | combine(_instance_config | default({}), recursive=True) }}"
    - name: Validate the BookStack safety snapshot belongs to this recovery group
      ansible.builtin.assert:
        that:
          - not (overwrite | default(false) | bool) or pre_restore_point.startswith('host/' ~ (app_config.backup.backup_id | default('', true) or instance) ~ '/')
        fail_msg: >-
          The pre_restore_point must be a readable snapshot from this BookStack instance's
          configured backup group. Back up this exact target and pass that recovery point.
  tasks:
    - name: Resolve the existing services stack host
      ansible.builtin.include_tasks: ../../tasks/stack/resolve-existing-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        resolve_stack_deploy_group: "bookstack_recovery_{{ instance }}"
        resolve_stack_app_instance: "{{ instance }}"

- name: "BookStack Restore | Run"
  hosts: "bookstack_recovery_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Run the BookStack restore plan
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/homelab-infra-bookstack-recovery
          - --plan
          - --snapshot
          - "{{ snapshot | default('') }}"
      environment:
        BOOKSTACK_INSTANCE: "{{ instance }}"
      register: bookstack_restore_plan_result
      changed_when: false
      when: not (overwrite | default(false) | bool)

    - name: Run the destructive BookStack restore
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/homelab-infra-bookstack-recovery
          - --restore
          - --snapshot
          - "{{ snapshot }}"
          - --pre-restore-point
          - "{{ pre_restore_point }}"
      environment:
        BOOKSTACK_INSTANCE: "{{ instance }}"
      register: bookstack_restore_result
      changed_when: true
      when: overwrite | default(false) | bool

- name: "BookStack Restore | Notify"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Notify completed BookStack restore
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ instance }} restored"
        notify_message: "BookStack {{ instance }} was restored from its application-consistent PBS snapshot."
      when:
        - overwrite | default(false) | bool
        - hostvars[groups['bookstack_recovery_' ~ instance][0]].bookstack_restore_result.rc | default(1) == 0
    - name: Fail if BookStack restore did not complete
      ansible.builtin.assert:
        that: >-
          (overwrite | default(false) | bool and
          hostvars[groups['bookstack_recovery_' ~ instance][0]].bookstack_restore_result.rc | default(1) == 0)
          or
          (not (overwrite | default(false) | bool) and
          hostvars[groups['bookstack_recovery_' ~ instance][0]].bookstack_restore_plan_result.rc | default(1) == 0)
        fail_msg: >-
          BookStack restore did not complete. It either rejected the recovery inputs before
          changing the target or restored the original data and database after an in-place
          failure. Inspect the target service before starting it; no success notification
          was sent.
