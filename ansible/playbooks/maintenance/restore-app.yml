---
# Restore one application's data from the lab's Proxmox Backup Server.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/maintenance/restore-app.yml -e instance=mixpost
#   ansible-playbook -i inventory/ playbooks/maintenance/restore-app.yml -e instance=mixpost \
#       -e snapshot=host/mixpost/2026-08-19T03:00:00Z -e target=mixpost-restore -e overwrite=true
#
# Rundeck: job parameters
#   instance   — the instance that OWNS the backup. Required.
#   app        — only when the instance was deployed under a different name from the app
#                (instance mixpost-restore of app mixpost). Defaults to `instance`.
#   method     — pbs_guest, native, or project_managed; defaults when only one is declared.
#   destination — new creates an isolated target through its existing app playbook;
#                existing replaces the exact target after pre-restore proof.
#   target     — the instance whose namespace receives the data. Defaults to `instance`,
#                which means restoring the application over itself.
#   recovery_point — artifact identifier; blank lists what PBS holds and changes nothing.
#   snapshot   — compatibility alias for recovery_point.
#   backup_datastore — optional PBS datastore name; blank uses the configured default.
#   overwrite  — false (default) plans and writes nothing. true performs the restore.
#   pre_restore_point — independent recovery point for an existing target replacement.
#
# ══════════════════════════════════════════════════════════════════════════════
# THE RESTORE PROCEDURE
# ══════════════════════════════════════════════════════════════════════════════
#
# What this restores is the application-consistent artifact the app's own backup CronJob
# pushes to PBS every night, filed together as one snapshot in the PBS group
# `host/<instance>`. The exact contents belong to the role: a stateful app may archive a
# database dump plus a storage volume, while LiteLLM archives its external PostgreSQL dump
# plus rendered routing ConfigMap. It is not the nightly whole-VM snapshot of the cluster
# nodes — that is the node rebuild path, it is crash-consistent only, and it cannot address
# one application's data.
#
# ── 1. Find the snapshot ──────────────────────────────────────────────────────
#
#   Restore App: instance=mixpost, overwrite=false, snapshot blank
#
# Lists every snapshot PBS holds for the application, newest last, and stops. Nothing is
# changed and nothing is scaled down. Copy the identifier you want.
#
# ── 2. Decide where it lands ──────────────────────────────────────────────────
#
# THE DRILL — a clean restore into a fresh namespace, which is what proves the backup:
#
#   Deploy Mixpost: instance=mixpost-restore
#
# gives a second, empty instance in its own namespace `app-mixpost-restore`, with its own
# database, its own volumes and its own published hostname. The live application is not
# involved at any point. Restore into that.
#
# THE RECOVERY — the live application has lost its data: leave `target` blank so it
# restores over itself. Everything below is identical; only the blast radius differs.
#
# ── 3. Check the plan ─────────────────────────────────────────────────────────
#
#   Restore App: instance=mixpost, snapshot=host/mixpost/…, target=mixpost-restore,
#                overwrite=false
#
# Runs a read-only Job in the target's namespace that authenticates to PBS, reads the
# named snapshot's index, and prints what the target holds right now — its tables with
# their row counts, and the size and file count of its storage volume. That is exactly
# what a real run replaces. If this step works, nothing about the credentials, the
# network path or the snapshot is what will fail in step 4.
#
# ── 4. Restore ────────────────────────────────────────────────────────────────
#
#   the same parameters, overwrite=true
#
# In order: the target's web Deployment is scaled to 0 and waited out, so nothing is
# reading the database or writing to the volume; the snapshot's database dump is fetched
# to scratch space; the storage volume is emptied and rewritten from the snapshot; the
# target's database is dropped, recreated and loaded from the dump; the source's
# application key is carried across when restoring into a different instance, so
# Laravel-encrypted columns remain readable; Redis is restarted to drop a cache built from
# the replaced data; and the application is scaled back to the replica count it had.
#
# If any of that fails, the target is LEFT SCALED TO 0 on purpose. Half-restored data
# in front of users is worse than an application that is plainly down.
#
# ── 5. Verify — this is the step that closes the row ──────────────────────────
#
# The job prints the restored database's tables and row counts and the storage volume's
# file count. That is the artifact's account of itself. Then check the application:
# open it, sign in with the credentials that worked on the source instance (the accounts
# came from the same database), and confirm the posts, their media and the connected
# accounts are all present. A restore is proved by the application, not by an exit code.
#
# ── Afterwards ────────────────────────────────────────────────────────────────
#
# The drill's second instance is a full deployment: remove it with `Remove App`,
# instance=mixpost-restore, delete_data=true, when you have finished verifying.
#
# ══════════════════════════════════════════════════════════════════════════════
#
# Only apps whose role ships a `restore.yml` can be restored this way. Kubernetes roles
# use their namespaced restore job; application-consistent Docker and native-LXC roles own
# their recovery mechanism. Apps without one remain on whole-guest PBS recovery.
#
# Per-app inputs live in role hooks (roles/<role>/tasks/<hook>), each run only when the
# role has it: restore-inputs.yml before the storage identity checks (source material,
# target path rewrites, an optional restore_source/target_storage_path), restore-provisioned.yml
# after a new target is provisioned, and restore-config.yml once the target is resolved
# (restore_app_config, the app_config the role's restore task gets; see
# tasks/recovery/rebase-target-path.yml). Play 1's phases are tasks/recovery/restore-app-*.yml.

# Immich's Docker restore replaces its named PostgreSQL database and explicitly attached
# durable originals/thumbnails from one application-consistent PBS snapshot. Plan mode lists
# snapshots only; overwrite mode validates the archive before replacing media and leaves
# services stopped after a failed destructive step.

- name: "Restore App | Restore application data from PBS"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    # Defaults live here rather than in every reference below, so the plan/restore
    # distinction is decided in exactly one place. Not passing `overwrite` means planning:
    # the destructive path is never what an incomplete invocation does.
    _ra_app: "{{ app | default(instance, true) }}"
    _ra_target: "{{ target | default(instance, true) }}"
    _ra_method: "{{ method | default('', true) }}"
    _ra_destination: "{{ destination | default('existing', true) }}"
    # snapshot remains an additive compatibility alias for existing callers.
    _ra_recovery_point: "{{ recovery_point | default(snapshot | default('', true), true) }}"
    _ra_backup_datastore: "{{ backup_datastore | default('', true) }}"
    _ra_overwrite: "{{ overwrite | default(false) | bool }}"
    _ra_pre_restore_point: "{{ pre_restore_point | default('', true) }}"
    # Per-app restore hooks (roles/<role>/tasks/<hook>). The role is the app's own until the
    # recovery capability is resolved, then the role that capability dispatches to.
    _ra_hooks: >-
      {{ playbook_dir }}/../../roles/{{ (recovery_capability | default({})).role
                                       | default(_ra_app, true) }}/tasks

  pre_tasks:
    - name: Load the source and target configs
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-app-load.yml

    - name: Validate the destination before mutation
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-app-validate.yml

    - name: Provision and resolve the restore target
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-app-target.yml

  tasks:
    - name: Restore the application
      ansible.builtin.include_role:
        name: "{{ _ra_app }}"
        tasks_from: "{{ recovery_capability.restore_role_task | default('restore') }}"
      vars:
        restore_target: "{{ _ra_target }}"
        restore_destination: "{{ recovery_destination_resolved }}"
        restore_method: "{{ recovery_method_resolved }}"
        restore_snapshot: "{{ _ra_recovery_point }}"
        restore_pre_restore_point: "{{ _ra_pre_restore_point }}"
        restore_overwrite: "{{ _ra_overwrite }}"
      when:
        - _ra_kind == 'kubernetes'
        - not (recovery_destination_resolved == 'new' and not (_ra_overwrite | bool))

    - name: State the read-only new-destination plan
      ansible.builtin.debug:
        msg:
          - "PLAN ONLY — no target was provisioned or changed."
          - >-
            Re-run with recovery_point=<artifact> and overwrite=true to provision
            {{ _ra_target }} in isolation, restore the selected point, and wire it only
            after application verification.
      when:
        - recovery_destination_resolved == 'new'
        - not (_ra_overwrite | bool)

    # The plan path changes nothing, and a read-only job does not notify.
    # A restore is about as state-changing as this
    # platform gets, so that one does.
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ _ra_target }} restored from backup"
        notify_priority: high
        notify_message: >-
          {{ _ra_target }} was restored from recovery point {{ _ra_recovery_point }},
          taken from {{ instance }}'s backups. Its application-owned durable state was
          replaced. Verify the application before trusting it.
      when:
        - _ra_kind == 'kubernetes'
        - _ra_overwrite | bool

    # The last task of the play, and it matters most here: a restore is the single most
    # consequential state change this platform makes. notify.yml records an undelivered
    # notification as a FATAL degradation, and without this gate the one job that replaced
    # an application's database could finish green with nobody having been told it ran.
    # The restore is already complete by this point, so this aborts nothing.
    - name: Fail if anything about this restore did not work
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ _ra_target }} restore"
      when: _ra_kind == 'kubernetes'

- name: "Restore App | Restore Docker or native-LXC application data from PBS"
  hosts: "apptarget_{{ target | default(instance if instance is defined else '_instance_unset', true) }}"
  become: true
  # Application role dependencies can require host facts before their task runs.
  gather_facts: true
  tasks:
    # A dispatched application recovery task must set this generic completion fact only after
    # its restore and health check are complete; the notification and degradation gate
    # below must not silently skip a future native-LXC or Docker role.
    - name: Restore the application-owned archive
      ansible.builtin.include_role:
        name: "{{ hostvars['localhost'].recovery_capability.role | default(hostvars['localhost']._ra_app) }}"
        tasks_from: "{{ hostvars['localhost'].recovery_capability.restore_role_task | default('restore') }}"
      vars:
        instance: "{{ hostvars['localhost']._ra_target }}"
        actual_budget_project_dir: "/opt/{{ hostvars['localhost']._ra_target }}"
        app_config: >-
          {{ hostvars['localhost'].restore_app_config
             | default(hostvars['localhost'].restore_target_config) }}
        home_assistant_project_dir: "/opt/{{ hostvars['localhost']._ra_target }}"
        frigate_project_dir: "/opt/{{ hostvars['localhost']._ra_target }}"
        homelabinfra_infra: "{{ hostvars['localhost'].homelabinfra_infra }}"
        homelabinfra_vault: "{{ hostvars['localhost'].homelabinfra_vault }}"
        restore_target: "{{ hostvars['localhost']._ra_target }}"
        restore_destination: "{{ hostvars['localhost'].recovery_destination_resolved }}"
        restore_method: "{{ hostvars['localhost'].recovery_method_resolved }}"
        restore_snapshot: "{{ hostvars['localhost']._ra_recovery_point }}"
        restore_source_instance: "{{ hostvars['localhost']._ra_source_instance }}"
        restore_source_database: "{{ hostvars['localhost'].restore_source_database | default({}) }}"
        restore_source_encryption_key: "{{ hostvars['localhost'].restore_source_encryption_key | default('') }}"
        restore_source_open_webui_secret_key: "{{ hostvars['localhost'].restore_source_open_webui_secret_key | default('') }}"
        restore_source_plane_secrets: "{{ hostvars['localhost'].restore_source_plane_secrets | default({}) }}"
        restore_source_emby_user: "{{ hostvars['localhost'].restore_source_emby_user | default('') }}"
        restore_source_emby_password: "{{ hostvars['localhost'].restore_source_emby_password | default('') }}"
        restore_source_jellyfin_user: "{{ hostvars['localhost'].restore_source_jellyfin_user | default('') }}"
        restore_source_jellyfin_password: "{{ hostvars['localhost'].restore_source_jellyfin_password | default('') }}"
        restore_target_backup_id: >-
          {{ hostvars['localhost'].restore_target_config.backup.backup_id | default('', true)
             or hostvars['localhost']._ra_target }}
        restore_source_redis: "{{ hostvars['localhost'].restore_source_redis | default({}) }}"
        restore_pre_restore_point: "{{ hostvars['localhost']._ra_pre_restore_point }}"
        restore_overwrite: "{{ hostvars['localhost']._ra_overwrite }}"
        restore_backup_id: "{{ hostvars['localhost']._ra_backup_id }}"
      when: app_target_kind | default('native') in ['docker', 'native']

    - name: Notify application restore
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ app_target_instance }} restored from backup"
        notify_priority: high
        notify_message: >-
          {{ app_target_instance }} was restored from recovery point
          {{ hostvars['localhost']._ra_recovery_point }}. Its complete application-native data
          directory was replaced. Verify the application before trusting it.
      when: _application_restore_complete | default(false) | bool

    - name: Fail if application restore degraded
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ app_target_instance }} restore"
      when: _application_restore_complete | default(false) | bool

- name: "Restore App | Establish intended connections after a verified new restore"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    # The first child deploy deliberately ended before its Wire play. Running the same
    # deployment seam again after the provider restore lets the app playbook establish
    # target-specific DNS, SSO, proxy, monitoring and guest records. It is not a cutover:
    # validation above rejected the source route collision and this run never changes the
    # source's identity.
    - name: Reconcile the restored target's intended connections
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - -i
          - inventory/
          - "playbooks/apps/{{ hostvars['localhost']._ra_app }}.yml"
          - -e
          - "instance={{ hostvars['localhost']._ra_target }}"
          - -e
          - recovery_isolated=false
          # LiteLLM's restore task applies the archived routing ConfigMap. This flag
          # tells its final convergence to preserve that restored artifact rather than
          # replacing it with the target's pre-restore declarative config. Other roles
          # ignore the app-specific recovery hint.
          - -e
          - recovery_restore_config=true
      changed_when: true
      when:
        - hostvars['localhost'].recovery_destination_resolved == 'new'
        - hostvars['localhost']._ra_overwrite | bool
