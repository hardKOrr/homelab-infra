---
# Restore one application's data from the lab's Proxmox Backup Server.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/maintenance/restore-app.yml -e instance=mixpost
#   ansible-playbook -i inventory/ playbooks/maintenance/restore-app.yml -e instance=mixpost \
#       -e snapshot=host/mixpost/2026-08-19T03:00:00Z -e target=mixpost-restore -e overwrite=true
#
# Rundeck: job parameters
#   instance   — the instance that OWNS the backup. Required.
#   app        — only when the instance was deployed under a different name from the app
#                (instance mixpost-restore of app mixpost). Defaults to `instance`.
#   method     — pbs_guest, native, or project_managed; defaults when only one is declared.
#   destination — new creates an isolated target through its existing app playbook;
#                existing replaces the exact target after pre-restore proof.
#   target     — the instance whose namespace receives the data. Defaults to `instance`,
#                which means restoring the application over itself.
#   recovery_point — artifact identifier; blank lists what PBS holds and changes nothing.
#   snapshot   — compatibility alias for recovery_point.
#   overwrite  — false (default) plans and writes nothing. true performs the restore.
#   pre_restore_point — independent recovery point for an existing target replacement.
#
# ══════════════════════════════════════════════════════════════════════════════
# THE RESTORE PROCEDURE
# ══════════════════════════════════════════════════════════════════════════════
#
# What this restores is the application-consistent artifact the app's own backup CronJob
# pushes to PBS every night, filed together as one snapshot in the PBS group
# `host/<instance>`. The exact contents belong to the role: a stateful app may archive a
# database dump plus a storage volume, while LiteLLM archives its external PostgreSQL dump
# plus rendered routing ConfigMap. It is not the nightly whole-VM snapshot of the cluster
# nodes — that is the node rebuild path, it is crash-consistent only, and it cannot address
# one application's data.
#
# ── 1. Find the snapshot ──────────────────────────────────────────────────────
#
#   Restore App: instance=mixpost, overwrite=false, snapshot blank
#
# Lists every snapshot PBS holds for the application, newest last, and stops. Nothing is
# changed and nothing is scaled down. Copy the identifier you want.
#
# ── 2. Decide where it lands ──────────────────────────────────────────────────
#
# THE DRILL — a clean restore into a fresh namespace, which is what proves the backup:
#
#   Deploy Mixpost: instance=mixpost-restore
#
# gives a second, empty instance in its own namespace `app-mixpost-restore`, with its own
# database, its own volumes and its own published hostname. The live application is not
# involved at any point. Restore into that.
#
# THE RECOVERY — the live application has lost its data: leave `target` blank so it
# restores over itself. Everything below is identical; only the blast radius differs.
#
# ── 3. Check the plan ─────────────────────────────────────────────────────────
#
#   Restore App: instance=mixpost, snapshot=host/mixpost/…, target=mixpost-restore,
#                overwrite=false
#
# Runs a read-only Job in the target's namespace that authenticates to PBS, reads the
# named snapshot's index, and prints what the target holds right now — its tables with
# their row counts, and the size and file count of its storage volume. That is exactly
# what a real run replaces. If this step works, nothing about the credentials, the
# network path or the snapshot is what will fail in step 4.
#
# ── 4. Restore ────────────────────────────────────────────────────────────────
#
#   the same parameters, overwrite=true
#
# In order: the target's web Deployment is scaled to 0 and waited out, so nothing is
# reading the database or writing to the volume; the snapshot's database dump is fetched
# to scratch space; the storage volume is emptied and rewritten from the snapshot; the
# target's database is dropped, recreated and loaded from the dump; the source's
# application key is carried across when restoring into a different instance, so
# Laravel-encrypted columns remain readable; Redis is restarted to drop a cache built from
# the replaced data; and the application is scaled back to the replica count it had.
#
# If any of that fails, the target is LEFT SCALED TO 0 on purpose. Half-restored data
# in front of users is worse than an application that is plainly down.
#
# ── 5. Verify — this is the step that closes the row ──────────────────────────
#
# The job prints the restored database's tables and row counts and the storage volume's
# file count. That is the artifact's account of itself. Then check the application:
# open it, sign in with the credentials that worked on the source instance (the accounts
# came from the same database), and confirm the posts, their media and the connected
# accounts are all present. A restore is proved by the application, not by an exit code.
#
# ── Afterwards ────────────────────────────────────────────────────────────────
#
# The drill's second instance is a full deployment: remove it with `Remove App`,
# instance=mixpost-restore, delete_data=true, when you have finished verifying.
#
# ══════════════════════════════════════════════════════════════════════════════
#
# Only apps whose role ships a `restore.yml` can be restored this way. Kubernetes roles
# use their namespaced restore job; application-consistent Docker roles such as Actual Budget,
# ComfyUI, Home Assistant, Immich, n8n, Odoo and Ollama own their recovery mechanism. Native
# apps and Docker apps without one remain on whole-guest PBS recovery.

# Immich's Docker restore replaces its named PostgreSQL database and explicitly attached
# durable originals/thumbnails from one application-consistent PBS snapshot. Plan mode lists
# snapshots only; overwrite mode validates the archive before replacing media and leaves
# services stopped after a failed destructive step.

- name: "Restore App | Restore application data from PBS"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    # Defaults live here rather than in every reference below, so the plan/restore
    # distinction is decided in exactly one place. Not passing `overwrite` means planning:
    # the destructive path is never what an incomplete invocation does.
    _ra_app: "{{ app | default(instance, true) }}"
    _ra_target: "{{ target | default(instance, true) }}"
    _ra_method: "{{ method | default('', true) }}"
    _ra_destination: "{{ destination | default('existing', true) }}"
    # snapshot remains an additive compatibility alias for existing callers.
    _ra_recovery_point: "{{ recovery_point | default(snapshot | default('', true), true) }}"
    _ra_overwrite: "{{ overwrite | default(false) | bool }}"
    _ra_pre_restore_point: "{{ pre_restore_point | default('', true) }}"

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: >-
          Provide the instance that owns the backup: -e instance=mixpost

    # Tolerated rather than required, so an unknown app name produces the assert below —
    # which names the actual problem — instead of an include_vars file-not-found crash.
    - name: Load app defaults (optional — absent for an app with no defaults file)
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/{{ _ra_app }}.yml"
        name: _app_defaults
      failed_when: false

    - name: Load the source instance's config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    # Loaded separately, because the target is a different deployment with its own
    # overrides — its own database image, its own storage sizing, possibly its own
    # database name. Assuming the source's config described the target is how a restore
    # writes into the wrong place while reporting success.
    - name: Load the target instance's config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ _ra_target }}.yml"
        name: _target_config
      failed_when: false

    - name: Check whether the target instance configuration is authored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../config/apps/{{ _ra_target }}.yml"
      register: _ra_target_config_file
      changed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Same merge as the deploy playbook, for both instances. The vault overlay matters
    # here in particular: the source's app_key and the target's db_root_password are both
    # canonical Vaultwarden values and neither exists anywhere else.
    - name: Merge the source and target configs
      ansible.builtin.set_fact:
        app_config: >-
          {{ (_app_defaults | default({})).get(_ra_defaults_key, {})
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
        restore_target_config: >-
          {{ (_app_defaults | default({})).get(_ra_defaults_key, {})
             | combine(_target_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[_ra_target] | default({})}, recursive=True) }}
      vars:
        # The same key derivation playbooks/apps/remove.yml uses: an app whose file name
        # carries a hyphen declares its defaults under an underscored name.
        _ra_defaults_key: "{{ _ra_app | replace('-', '_') }}_defaults"

    - name: Resolve the hosting kind
      ansible.builtin.set_fact:
        _ra_kind: >-
          {{ app_config.hosting
             | default('docker' if app_config.stack is defined else 'native', true) }}
        _ra_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
        _ra_source_instance: "{{ instance }}"
        # Safe identity only. Product restore tasks may use this to reject a new target
        # that would restore into the source's named external database; credentials stay
        # in the source/target Vaultwarden overlays and are never copied into this fact.
        restore_source_database: >-
          {{ {
               'provider': app_config.get('app', {}).get('database', {}).get('provider', ''),
               'instance': app_config.get('app', {}).get('database', {}).get('instance', ''),
               'name': app_config.get('app', {}).get('database', {}).get('name', ''),
               'host': (homelabinfra_infra.databases | default({})).get(
                 app_config.get('app', {}).get('database', {}).get('instance', ''), {}).host | default(''),
               'port': (homelabinfra_infra.databases | default({})).get(
                 app_config.get('app', {}).get('database', {}).get('instance', ''), {}).port | default(0)
             } }}

    - name: Resolve source n8n recovery key without exposing it in evidence
      ansible.builtin.set_fact:
        restore_source_encryption_key: "{{ app_config.app.encryption_key | default('') }}"
      no_log: true

    # Open WebUI encrypts application-owned credential state with its generated key.
    # Carry the source key through the protected Ansible variable path; the product role
    # upserts it into the target Vaultwarden item and rendered env before starting restore.
    - name: Resolve the source Open WebUI application key without exposing it
      ansible.builtin.set_fact:
        restore_source_open_webui_secret_key: "{{ app_config.app.secret_key | default('') }}"
      no_log: true
      when: _ra_app == 'open-webui'

    # Plane's local RabbitMQ/MinIO credentials and application keys must follow the
    # restored database and files to a new target. They never enter the recovery plan.
    - name: Resolve source Plane recovery material without exposing it in evidence
      ansible.builtin.set_fact:
        restore_source_plane_secrets:
          secret_key: "{{ app_config.app.secret_key | default('') }}"
          live_server_secret_key: "{{ app_config.app.live_server_secret_key | default('') }}"
          rabbitmq_password: "{{ app_config.app.rabbitmq_password | default('') }}"
          object_storage_access_key: "{{ app_config.app.object_storage_access_key | default('') }}"
          object_storage_secret_key: "{{ app_config.app.object_storage_secret_key | default('') }}"
        restore_source_redis:
          instance: "{{ app_config.app.redis.instance | default('') }}"
          host: >-
            {{ (homelabinfra_infra.databases | default({})).get(
                 app_config.app.redis.instance | default(''), {}).host | default('') }}
          port: >-
            {{ (homelabinfra_infra.databases | default({})).get(
                 app_config.app.redis.instance | default(''), {}).port | default(0) }}
      no_log: true
      when: _ra_app == 'plane'

    # Emby's account database is part of its /config snapshot. Retain the source
    # account only in the protected variable path so a new target can prove the restored
    # user and keep Vaultwarden aligned with the restored app-owned database.
    - name: Resolve source Emby credentials without exposing them
      ansible.builtin.set_fact:
        restore_source_emby_user: >-
          {{ (homelabinfra_vault.media | default({})).get(_ra_source_instance, {}).username
             | default('') }}
        restore_source_emby_password: >-
          {{ (homelabinfra_vault.media | default({})).get(_ra_source_instance, {}).password
             | default('') }}
      no_log: true
      when: _ra_app == 'emby'

    # Emby's config directory is target-owned. Rebind the defaulted source path when
    # restoring to a differently named instance; external media paths are never changed.
    - name: Normalize the target Emby config path
      ansible.builtin.set_fact:
        restore_target_config: >-
          {{ restore_target_config | combine({'app': {
               'config_path': (restore_target_config.app.config_path
                               | replace('/opt/' ~ _ra_source_instance ~ '/',
                                         '/opt/' ~ _ra_target ~ '/'))
             }}, recursive=True) }}
      when: _ra_app == 'emby'

    # Plane stores its two owned paths below /opt/<instance>. Normalize those paths for
    # a new target without changing the source config or putting secrets in the plan.
    - name: Normalize the target Plane storage paths
      ansible.builtin.set_fact:
        plane_restore_target_config: >-
          {{ restore_target_config | combine({'app': {
               'data_path': (restore_target_config.app.data_path
                             | replace('/opt/' ~ _ra_source_instance ~ '/',
                                       '/opt/' ~ _ra_target ~ '/')
                             | replace('{{ instance }}', _ra_target)),
               'object_storage_path': (restore_target_config.app.object_storage_path
                                       | replace('/opt/' ~ _ra_source_instance ~ '/',
                                                 '/opt/' ~ _ra_target ~ '/')
                                       | replace('{{ instance }}', _ra_target))
             }}, recursive=True) }}
      when: _ra_app == 'plane'

    - name: Resolve Plane source and target owned storage paths
      ansible.builtin.set_fact:
        _ra_plane_source_storage_paths:
          data: "{{ app_config.app.data_path | replace('{{ instance }}', _ra_source_instance) }}"
          object_storage: "{{ app_config.app.object_storage_path | replace('{{ instance }}', _ra_source_instance) }}"
        _ra_plane_target_storage_paths:
          data: "{{ plane_restore_target_config.app.data_path }}"
          object_storage: "{{ plane_restore_target_config.app.object_storage_path }}"
      when: _ra_app == 'plane'

    - name: Resolve target identities before mutation
      ansible.builtin.set_fact:
        _ra_source_route_key: >-
          {{ ((app_config.routing.estate | default('')) ~ '/' ~
              (app_config.routing.subdomain | default(instance, true)))
             if app_config.routing.proxy | default('none') != 'none' else '' }}
        _ra_target_route_key: >-
          {{ ((restore_target_config.routing.estate | default('')) ~ '/' ~
              (restore_target_config.routing.subdomain | default(_ra_target, true)))
             if restore_target_config.routing.proxy | default('none') != 'none' else '' }}
        _ra_requested_vmid: >-
          {{ restore_target_config.get('proxmox', {}).get('vm', {}).get('vmid',
             restore_target_config.get('proxmox', {}).get('lxc', {}).get('vmid', '')) | string }}
        _ra_requested_address: >-
          {{ (restore_target_config.get('proxmox', {}).get('vm', {}).get('ip_address',
             restore_target_config.get('proxmox', {}).get('lxc', {}).get('ip_address', '')) | string)
             | regex_replace('/.*$', '') }}
        _ra_source_storage_key: >-
          {{ (_ra_kind ~ ':' ~ _ra_source_instance)
             if _ra_kind == 'kubernetes'
             else (
               (_ra_plane_source_storage_paths.data ~ '|' ~
                _ra_plane_source_storage_paths.object_storage)
               if _ra_app == 'plane'
               else ((app_config.get('media_storage', {}).get('mounts', [{}]) | first).get('path', '')
                     or (app_config.get('app', {}).get('data_path', '')
                         | replace('{{ instance }}', _ra_source_instance))
                     or app_config.get('app', {}).get('config_path', '')
                     or (app_config.get('app', {}).get('filestore_path', '')
                         | replace('{{ instance }}', _ra_source_instance))
                     or (_ra_kind ~ ':' ~ _ra_source_instance))) | string }}
        _ra_target_storage_key: >-
          {{ (_ra_kind ~ ':' ~ _ra_target)
             if _ra_kind == 'kubernetes'
             else (
               ((_ra_plane_source_storage_paths.data ~ '|' ~
                 _ra_plane_source_storage_paths.object_storage)
                if (_ra_plane_target_storage_paths.data in [
                      _ra_plane_source_storage_paths.data,
                      _ra_plane_source_storage_paths.object_storage
                    ] or _ra_plane_target_storage_paths.object_storage in [
                      _ra_plane_source_storage_paths.data,
                      _ra_plane_source_storage_paths.object_storage
                    ])
                else (_ra_plane_target_storage_paths.data ~ '|' ~
                      _ra_plane_target_storage_paths.object_storage))
               if _ra_app == 'plane'
               else ((restore_target_config.get('media_storage', {}).get('mounts', [{}]) | first).get('path', '')
                     or (restore_target_config.get('app', {}).get('data_path', '')
                         | replace('{{ instance }}', _ra_target))
                     or restore_target_config.get('app', {}).get('config_path', '')
                     or (restore_target_config.get('app', {}).get('filestore_path', '')
                         | replace('{{ instance }}', _ra_target))
                     or (_ra_kind ~ ':' ~ _ra_target))) | string }}

    - name: Refresh inventory before checking a new target's ownership
      ansible.builtin.meta: refresh_inventory
      when: _ra_destination == 'new'

    - name: Resolve the target application ownership group
      ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars:
        tag_group_tag: "_{{ _ra_target }}"
      when:
        - _ra_destination == 'new'
        - _ra_kind != 'kubernetes'

    - name: Resolve the target Kubernetes namespace for a collision check
      ansible.builtin.include_tasks: ../../tasks/kubernetes/resolve-cluster.yml
      when:
        - _ra_destination == 'new'
        - _ra_kind == 'kubernetes'

    - name: Derive the target Kubernetes namespace for a collision check
      ansible.builtin.include_tasks: ../../tasks/kubernetes/derive-namespace.yml
      vars:
        k8s_namespace_for: "{{ _ra_target }}"
      when:
        - _ra_destination == 'new'
        - _ra_kind == 'kubernetes'

    - name: Check whether the target Kubernetes namespace already exists
      ansible.builtin.command:
        argv: [k3s, kubectl, get, namespace, "{{ k8s_namespace }}"]
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _ra_k8s_namespace
      changed_when: false
      failed_when: false
      when:
        - _ra_destination == 'new'
        - _ra_kind == 'kubernetes'

    - name: Collect existing VMIDs for a new-target collision check
      ansible.builtin.set_fact:
        _ra_existing_vmids: >-
          {{ _ra_existing_vmids | default([]) +
             ([hostvars[item].proxmox_vmid | string]
              if hostvars[item].proxmox_vmid is defined else []) }}
      loop: "{{ groups['proxmox_clients'] | default([]) }}"
      when: _ra_destination == 'new'

    - name: Collect existing addresses for a new-target collision check
      ansible.builtin.set_fact:
        _ra_existing_addresses: >-
          {{ _ra_existing_addresses | default([]) +
             ([hostvars[item].ansible_host | string]
              if hostvars[item].ansible_host | default('') | length > 0 else []) }}
      loop: "{{ groups['proxmox_clients'] | default([]) }}"
      when: _ra_destination == 'new'

    # This is the common method/destination gate. It deliberately runs before any role
    # task, so an undeclared path fails as a capability error rather than as an include_role
    # or missing-file error.
    - name: Resolve the declared recovery capability
      ansible.builtin.include_tasks: ../../tasks/recovery/resolve-method.yml
      vars:
        recovery_app: "{{ _ra_app }}"
        recovery_app_config: "{{ app_config }}"
        recovery_instance: "{{ instance }}"
        recovery_method_requested: "{{ _ra_method }}"
        recovery_destination_requested: "{{ _ra_destination }}"
        recovery_operation: restore

    - name: Require Restore App's native role dispatch
      ansible.builtin.assert:
        that: recovery_method_resolved in ['native', 'project_managed']
        fail_msg: >-
          Restore App cannot execute method={{ recovery_method_resolved }} for
          destination={{ recovery_destination_resolved }}. Use the method-specific recovery
          job declared by that method; this playbook dispatches native and project-managed
          role tasks only.

    - name: Assert this app has a restore path
      ansible.builtin.assert:
        that:
          - >-
            (_ra_kind == 'kubernetes' and app_config.backup is defined)
            or
            (_ra_kind == 'docker'
             and app_config.backup.enabled | default(false) | bool
             and app_config.backup.application_consistent | default(false) | bool)
        fail_msg: >-
          {{ _ra_app }} has no declared application restore path. Kubernetes roles use their
          backup contract; a declared Docker native/project-managed role owns its
          application-consistent archive and restore tasks. Other applications remain on
          whole-guest PBS recovery.

    - name: Validate the destination and replacement plan before mutation
      ansible.builtin.include_tasks: ../../tasks/recovery/validate-restore.yml
      vars:
        recovery_source_instance: "{{ instance }}"
        recovery_target_instance: "{{ _ra_target }}"
        recovery_destination: "{{ recovery_destination_resolved }}"
        recovery_overwrite: "{{ _ra_overwrite }}"
        recovery_point: "{{ _ra_recovery_point }}"
        recovery_pre_restore_point: "{{ _ra_pre_restore_point }}"
        recovery_target_config_present: "{{ _ra_target_config_file.stat.exists | default(false) }}"
        recovery_source_route_key: "{{ _ra_source_route_key }}"
        recovery_target_route_key: "{{ _ra_target_route_key }}"
        recovery_target_name_collision: >-
          {{ ((_ra_kind != 'kubernetes' and
               (groups[tag_group_name | default('')] | default([]) | length > 0))
              or
              (_ra_kind == 'kubernetes' and
               (_ra_k8s_namespace.rc | default(1) | int == 0)))
             | bool }}
        recovery_target_vmid_collision: >-
          {{ (_ra_requested_vmid | length > 0 and
              _ra_requested_vmid in (_ra_existing_vmids | default([]))) | bool }}
        recovery_target_address_collision: >-
          {{ (_ra_requested_address | length > 0 and
              _ra_requested_address | lower != 'dhcp' and
              _ra_requested_address in (_ra_existing_addresses | default([]))) | bool }}
        recovery_target_storage_collision: >-
          {{ (_ra_source_storage_key | length > 0 and
              _ra_source_storage_key == _ra_target_storage_key and
              '{{' not in _ra_source_storage_key) | bool }}
        recovery_source_storage_key: "{{ _ra_source_storage_key }}"
        recovery_target_storage_key: "{{ _ra_target_storage_key }}"
        recovery_affected_scope: "{{ app_config.recovery.affected_scope | default([instance]) }}"

    # New destinations use the same application provisioning seam as a normal deploy,
    # but the isolated flag suppresses route/SSO/DNS/monitor publication. The source is
    # never contacted; only the target's authored config and defaults are loaded by this
    # child playbook. Plan mode remains read-only and does not create the target.
    - name: Provision the isolated new restore target
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - inventory/
          - "playbooks/apps/{{ _ra_app }}.yml"
          - -e
          - "instance={{ _ra_target }}"
          - -e
          - recovery_isolated=true
      changed_when: true

    - name: Refresh inventory after provisioning the new restore target
      ansible.builtin.meta: refresh_inventory
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    # Provisioning runs in a child ansible-playbook process. Its Vaultwarden writes do
    # not update this controller process's localhost facts or the startup snapshot, so
    # read the canonical vault again before passing target credentials to the Docker
    # restore play. Missing or unreadable Vaultwarden state fails closed here.
    - name: Verify the Vaultwarden session before refreshing target credentials
      ansible.builtin.include_tasks: ../../tasks/bitwarden/authenticate.yml
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Synchronize Vaultwarden after isolated target provisioning
      ansible.builtin.command:
        argv: [bw, sync]
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Read the fresh Vaultwarden item snapshot
      ansible.builtin.command:
        argv: [bw, list, items]
      register: _ra_refreshed_vault_items
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Parse the refreshed Vaultwarden runtime contract
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/vault-runtime.py"
        stdin: "{{ _ra_refreshed_vault_items.stdout }}"
      register: _ra_refreshed_vault_runtime
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Publish the fresh Vaultwarden runtime contract
      ansible.builtin.set_fact:
        homelabinfra_vault: "{{ _ra_refreshed_vault_runtime.stdout | from_json }}"
        homelabinfra_infra: >-
          {{ homelabinfra_infra
             | combine(_ra_refreshed_vault_runtime.stdout | from_json, recursive=True) }}
      no_log: true
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Re-merge the target config with provisioned Vaultwarden credentials
      ansible.builtin.set_fact:
        restore_target_config: >-
          {{ (_app_defaults | default({})).get(_ra_defaults_key, {})
             | combine(_target_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({})).get(_ra_target, {})},
                       recursive=True) }}
      vars:
        _ra_defaults_key: "{{ _ra_app | replace('-', '_') }}_defaults"
      when:
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Re-normalize Plane target storage paths after provisioning
      ansible.builtin.set_fact:
        plane_restore_target_config: >-
          {{ restore_target_config | combine({'app': {
               'data_path': (restore_target_config.app.data_path
                             | replace('/opt/' ~ _ra_source_instance ~ '/',
                                       '/opt/' ~ _ra_target ~ '/')
                             | replace('{{ instance }}', _ra_target)),
               'object_storage_path': (restore_target_config.app.object_storage_path
                                       | replace('/opt/' ~ _ra_source_instance ~ '/',
                                                 '/opt/' ~ _ra_target ~ '/')
                                       | replace('{{ instance }}', _ra_target))
             }}, recursive=True) }}
      when:
        - _ra_app == 'plane'
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

    - name: Resolve the Docker target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
      vars:
        app: "{{ _ra_app }}"
        resolve_app_target_instance: "{{ _ra_target }}"
      when:
        - _ra_kind == 'docker'
        - recovery_destination_resolved == 'existing'

    - name: Resolve the newly provisioned Docker target
      ansible.builtin.include_tasks: ../../tasks/maintenance/resolve-app-target.yml
      vars:
        app: "{{ _ra_app }}"
        resolve_app_target_instance: "{{ _ra_target }}"
      when:
        - _ra_kind == 'docker'
        - recovery_destination_resolved == 'new'
        - _ra_overwrite | bool

  tasks:
    - name: Restore the application
      ansible.builtin.include_role:
        name: "{{ _ra_app }}"
        tasks_from: "{{ recovery_capability.restore_role_task | default('restore') }}"
      vars:
        restore_target: "{{ _ra_target }}"
        restore_destination: "{{ recovery_destination_resolved }}"
        restore_method: "{{ recovery_method_resolved }}"
        restore_snapshot: "{{ _ra_recovery_point }}"
        restore_pre_restore_point: "{{ _ra_pre_restore_point }}"
        restore_overwrite: "{{ _ra_overwrite }}"
      when:
        - _ra_kind == 'kubernetes'
        - not (recovery_destination_resolved == 'new' and not (_ra_overwrite | bool))

    - name: State the read-only new-destination plan
      ansible.builtin.debug:
        msg:
          - "PLAN ONLY — no target was provisioned or changed."
          - >-
            Re-run with recovery_point=<artifact> and overwrite=true to provision
            {{ _ra_target }} in isolation, restore the selected point, and wire it only
            after application verification.
      when:
        - recovery_destination_resolved == 'new'
        - not (_ra_overwrite | bool)

    # The plan path changes nothing, and a read-only job does not notify
    # (docs/specs/one-click-idempotent.md). A restore is about as state-changing as this
    # platform gets, so that one does.
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ _ra_target }} restored from backup"
        notify_priority: high
        notify_message: >-
          {{ _ra_target }} was restored from recovery point {{ _ra_recovery_point }},
          taken from {{ instance }}'s backups. Its application-owned durable state was
          replaced. Verify the application before trusting it.
      when:
        - _ra_kind == 'kubernetes'
        - _ra_overwrite | bool

    # The last task of the play, and it matters most here: a restore is the single most
    # consequential state change this platform makes. notify.yml records an undelivered
    # notification as a FATAL degradation, and without this gate the one job that replaced
    # an application's database could finish green with nobody having been told it ran.
    # The restore is already complete by this point, so this aborts nothing.
    - name: Fail if anything about this restore did not work
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ _ra_target }} restore"
      when: _ra_kind == 'kubernetes'

- name: "Restore App | Restore Docker application data from PBS"
  hosts: "apptarget_{{ target | default(instance if instance is defined else '_instance_unset', true) }}"
  become: true
  gather_facts: false
  tasks:
    # A dispatched Docker recovery task must set this generic completion fact only after
    # its restore and health check are complete; the notification and degradation gate
    # below must not silently skip a future Docker role.
    - name: Restore the application-owned Docker archive
      ansible.builtin.include_role:
        name: "{{ hostvars['localhost']._ra_app }}"
        tasks_from: "{{ hostvars['localhost'].recovery_capability.restore_role_task | default('restore') }}"
      vars:
        instance: "{{ hostvars['localhost']._ra_target }}"
        actual_budget_project_dir: "/opt/{{ hostvars['localhost']._ra_target }}"
        app_config: >-
          {{ hostvars['localhost'].plane_restore_target_config
             if hostvars['localhost']._ra_app == 'plane'
             else (hostvars['localhost'].restore_target_config
             | combine({'app': {
                 'data_path': (hostvars['localhost'].restore_target_config.app.data_path
                               | replace('/opt/' ~ hostvars['localhost']._ra_source_instance ~ '/',
                                         '/opt/' ~ hostvars['localhost']._ra_target ~ '/'))
               }}, recursive=True)
             if hostvars['localhost']._ra_app == 'actual-budget'
             else (hostvars['localhost'].restore_target_config
                   | combine({'app': {
                       'filestore_path': (hostvars['localhost'].restore_target_config.app.filestore_path
                                          | replace('/opt/odoo/' ~ hostvars['localhost']._ra_source_instance ~ '/',
                                                    '/opt/odoo/' ~ hostvars['localhost']._ra_target ~ '/')
                                          | replace('{{ instance }}', hostvars['localhost']._ra_target))
                     }}, recursive=True)
                   if hostvars['localhost']._ra_app == 'odoo'
                   else (hostvars['localhost'].restore_target_config
                         | combine({'app': {
                             'data_path': (hostvars['localhost'].restore_target_config.app.data_path
                                           | replace('/opt/' ~ hostvars['localhost']._ra_source_instance ~ '/',
                                                     '/opt/' ~ hostvars['localhost']._ra_target ~ '/')
                                           | replace('{{ instance }}', hostvars['localhost']._ra_target))
                           }}, recursive=True)
                         if hostvars['localhost']._ra_app == 'n8n'
                         else (hostvars['localhost'].restore_target_config
                               | combine({'app': {
                                   'config_path': (hostvars['localhost'].restore_target_config.app.config_path
                                                   | replace('/opt/' ~ hostvars['localhost']._ra_source_instance ~ '/',
                                                             '/opt/' ~ hostvars['localhost']._ra_target ~ '/'))
                                 }}, recursive=True)
                               if hostvars['localhost']._ra_app == 'home-assistant'
                               else hostvars['localhost'].restore_target_config)))) }}
        home_assistant_project_dir: "/opt/{{ hostvars['localhost']._ra_target }}"
        homelabinfra_infra: "{{ hostvars['localhost'].homelabinfra_infra }}"
        homelabinfra_vault: "{{ hostvars['localhost'].homelabinfra_vault }}"
        restore_target: "{{ hostvars['localhost']._ra_target }}"
        restore_destination: "{{ hostvars['localhost'].recovery_destination_resolved }}"
        restore_method: "{{ hostvars['localhost'].recovery_method_resolved }}"
        restore_snapshot: "{{ hostvars['localhost']._ra_recovery_point }}"
        restore_source_database: "{{ hostvars['localhost'].restore_source_database | default({}) }}"
        restore_source_encryption_key: "{{ hostvars['localhost'].restore_source_encryption_key | default('') }}"
        restore_source_open_webui_secret_key: "{{ hostvars['localhost'].restore_source_open_webui_secret_key | default('') }}"
        restore_source_plane_secrets: "{{ hostvars['localhost'].restore_source_plane_secrets | default({}) }}"
        restore_source_emby_user: "{{ hostvars['localhost'].restore_source_emby_user | default('') }}"
        restore_source_emby_password: "{{ hostvars['localhost'].restore_source_emby_password | default('') }}"
        restore_target_backup_id: >-
          {{ hostvars['localhost'].restore_target_config.backup.backup_id | default('', true)
             or hostvars['localhost']._ra_target }}
        restore_source_redis: "{{ hostvars['localhost'].restore_source_redis | default({}) }}"
        restore_pre_restore_point: "{{ hostvars['localhost']._ra_pre_restore_point }}"
        restore_overwrite: "{{ hostvars['localhost']._ra_overwrite }}"
        restore_backup_id: "{{ hostvars['localhost']._ra_backup_id }}"
      when: app_target_kind | default('native') == 'docker'

    - name: Notify Docker restore
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ app_target_instance }} restored from backup"
        notify_priority: high
        notify_message: >-
          {{ app_target_instance }} was restored from recovery point
          {{ hostvars['localhost']._ra_recovery_point }}. Its complete application-native data
          directory was replaced. Verify the application before trusting it.
      when: _application_restore_complete | default(false) | bool

    - name: Fail if Docker restore degraded
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "the {{ app_target_instance }} restore"
      when: _application_restore_complete | default(false) | bool

- name: "Restore App | Establish intended connections after a verified new restore"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    # The first child deploy deliberately ended before its Wire play. Running the same
    # deployment seam again after the provider restore lets the app playbook establish
    # target-specific DNS, SSO, proxy, monitoring and guest records. It is not a cutover:
    # validation above rejected the source route collision and this run never changes the
    # source's identity.
    - name: Reconcile the restored target's intended connections
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - inventory/
          - "playbooks/apps/{{ hostvars['localhost']._ra_app }}.yml"
          - -e
          - "instance={{ hostvars['localhost']._ra_target }}"
          - -e
          - recovery_isolated=false
          # LiteLLM's restore task applies the archived routing ConfigMap. This flag
          # tells its final convergence to preserve that restored artifact rather than
          # replacing it with the target's pre-restore declarative config. Other roles
          # ignore the app-specific recovery hint.
          - -e
          - recovery_restore_config=true
      changed_when: true
      when:
        - hostvars['localhost'].recovery_destination_resolved == 'new'
        - hostvars['localhost']._ra_overwrite | bool
