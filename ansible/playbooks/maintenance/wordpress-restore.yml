---
# Plan or perform a restore of one WordPress instance from a PBS snapshot, including a
# snapshot produced by another WordPress instance.
#
# overwrite=false (the default) is read-only. overwrite=true stops only the named target
# WordPress workload, replaces wp-content and its named database, repairs the target URL and
# administrator account, then starts it again. A fresh, readable pre-restore point is
# required; failures roll the target files and database back before restarting WordPress.
# The shared backend and other applications remain untouched.

- name: "WordPress Restore | Resolve"
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that:
          - instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
          - source_instance | default(instance) is match('^[A-Za-z0-9_.-]+$')
          - source_backup_id | default('') is match('^[A-Za-z0-9_.-]*$')
          - snapshot | default('') is match('^$|^host/[A-Za-z0-9_.-]+/[A-Za-z0-9T:_.+Z-]+$')
          - pre_restore_point | default('') is match('^$|^host/[A-Za-z0-9_.-]+/[A-Za-z0-9T:_.+Z-]+$')
          - overwrite | default(false) | string in ['false', 'true', 'False', 'True']
          - not (overwrite | default(false) | bool) or snapshot | default('') | length > 0
          - not (overwrite | default(false) | bool) or pre_restore_point | default('') | length > 0
          - not (overwrite | default(false) | bool) or pre_restore_point != snapshot
        fail_msg: >-
          Provide a WordPress target, optional source instance/backup id and PBS snapshot,
          plus overwrite=false|true. An overwrite also requires a distinct, recent
          pre_restore_point from the target WordPress backup group.
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/wordpress.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.wordpress_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
      no_log: true
    - ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: wordpress
  tasks:
    - name: Resolve the source backup group
      ansible.builtin.set_fact:
        wordpress_restore_backup_id: >-
          {{ source_backup_id | default('', true)
             or ((app_config.backup.backup_id | default('', true) or instance)
                 if (source_instance | default(instance)) == instance
                 else (source_instance | default(instance))) }}

    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        wordpress_fqdn: >-
          {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

    - name: Resolve the existing services stack host
      ansible.builtin.include_tasks: ../../tasks/stack/resolve-existing-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        resolve_stack_deploy_group: "wordpress_recovery_{{ instance }}"
        resolve_stack_app_instance: "{{ instance }}"
      when: app_config.hosting.method == 'docker'

- name: "WordPress Restore | Run"
  hosts: "wordpress_recovery_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Plan or perform the WordPress restore
      ansible.builtin.include_role:
        name: wordpress
        tasks_from: restore
      vars:
        app_config: "{{ hostvars['localhost'].app_config }}"
        homelabinfra_infra: "{{ hostvars['localhost'].homelabinfra_infra }}"
        homelabinfra_vault: "{{ hostvars['localhost'].homelabinfra_vault }}"
        wordpress_restore_backup_id: "{{ hostvars['localhost'].wordpress_restore_backup_id }}"
        wordpress_fqdn: "{{ hostvars['localhost'].wordpress_fqdn }}"
        restore_overwrite: "{{ overwrite | default(false) | bool }}"
        restore_snapshot: "{{ snapshot | default('') }}"
        restore_pre_restore_point: "{{ pre_restore_point | default('') }}"
        restore_destination: existing
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Record the completed WordPress plan or restore
      ansible.builtin.set_fact:
        wordpress_restore_complete: >-
          {{ _application_restore_complete | default(false) | bool
             or not (overwrite | default(false) | bool) }}
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

- name: "WordPress Restore | Run on Kubernetes"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Plan or perform the Kubernetes WordPress restore
      ansible.builtin.include_role:
        name: wordpress-kubernetes
        tasks_from: restore.yml
      vars:
        wordpress_fqdn: "{{ hostvars['localhost'].wordpress_fqdn }}"
        wordpress_restore_backup_id: "{{ hostvars['localhost'].wordpress_restore_backup_id }}"
        restore_overwrite: "{{ overwrite | default(false) | bool }}"
        restore_snapshot: "{{ snapshot | default('') }}"
        restore_pre_restore_point: "{{ pre_restore_point | default('') }}"
      when: hostvars['localhost'].app_config.hosting.method == 'kubernetes'

- name: "WordPress Restore | Notify"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Notify completed WordPress restore
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ instance }} restored"
        notify_message: "WordPress {{ instance }} was restored from its application-consistent PBS snapshot."
      when:
        - overwrite | default(false) | bool
        - >-
          (app_config.hosting.method == 'docker'
           and hostvars[groups['wordpress_recovery_' ~ instance][0]].wordpress_restore_complete | default(false) | bool)
          or
          (app_config.hosting.method == 'kubernetes'
           and wordpress_restore_result.rc | default(1) == 0)
    - name: Fail if WordPress restore did not complete
      ansible.builtin.assert:
        that: >-
          (app_config.hosting.method == 'docker'
           and hostvars[groups['wordpress_recovery_' ~ instance][0]].wordpress_restore_complete | default(false) | bool)
          or
          (app_config.hosting.method == 'kubernetes'
           and wordpress_restore_result.rc | default(1) == 0)
        fail_msg: >-
          WordPress restore did not complete; inspect the run for its rollback status before
          retrying. No success notification was sent.
