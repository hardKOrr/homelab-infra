---
# Restore one native PBS VM or LXC to an isolated new VMID or an exact existing target.
#
# The recovery unit is the guest, never an application. A new target is always stopped,
# gets a target-owned name/tags/network and requests a unique MAC. An existing target is
# owned and inspected before it is stopped; an independent PBS point is captured and
# verified before the Proxmox restore task is submitted. A failed worker leaves the target
# stopped and reports the retained recovery point; it never deletes the source artifact or
# unrelated resources.
#
# Shared contract inputs:
#   instance/source_vmid  source VMID recorded in the native artifact (source need not run)
#   backup_storage        PVE PBS storage ID; default pbs-homelab. Select the second copy
#                         explicitly with backup_storage=pbs-homelab-copy.
#   destination           new|existing (default existing)
#   target                target name (new) or target VMID alias; exact target_vmid wins
#   recovery_point        PBS native backup volume path
#   pre_restore_point     independent existing-target point; if blank, one is captured
#   overwrite             false plan-only, true execute
# Backend inputs:
#   target_vmid, target_node, target_storage, target_name, target_network, target_tags
#
# Phases, in order: tasks/recovery/restore-guest-{inputs,inspect,pre-restore-point,run}.yml.

- name: "Restore Guest | Validate a PBS VM/LXC restore"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    _rg_control_node: "{{ restore_node | default(homelabinfra_config.proxmox.node, true) }}"
    _rg_method: "{{ method | default('pbs_guest', true) }}"
    _rg_destination: "{{ destination | default('existing', true) }}"
    _rg_execute: "{{ overwrite | default(false) | bool }}"
    _rg_storage: "{{ backup_storage | default('pbs-homelab', true) }}"
    _rg_source_vmid: "{{ source_vmid | default(instance | default('', true), true) | string }}"
    _rg_target_vmid: "{{ target_vmid | default((vmid | default('', true) if _rg_destination == 'existing' else ''), true) | string }}"
    _rg_target_name: "{{ target_name | default(target | default('', true), true) | string }}"
    # Strip only a storage identifier, never a colon within the native PBS timestamp.
    _rg_artifact: "{{ recovery_point | default('', true) | regex_replace('^[A-Za-z0-9][A-Za-z0-9_.-]*:', '') }}"
    _rg_timestamp_pattern: '[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z'
    _rg_target_tags: "{{ target_tags | default('_+lab;_' ~ _rg_target_name, true) }}"

  pre_tasks:
    - name: Validate the restore contract and artifact identity
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-guest-inputs.yml

    - name: Inspect the destination and the artifact
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-guest-inspect.yml

    - name: Capture the pre-restore point and validate the plan
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-guest-pre-restore-point.yml

  tasks:
    - name: Restore the guest without activating the target
      ansible.builtin.import_tasks: ../../tasks/recovery/restore-guest-run.yml

    - name: Report the read-only guest restore plan
      ansible.builtin.debug:
        msg:
          - >-
            PLAN ONLY — {{ _rg_artifact }} would restore {{ _rg_target_type }} source
            VMID {{ _rg_source_vmid }} to {{ _rg_destination }} target VMID
            {{ _rg_target_vmid }} on node {{ _rg_target_node }}.
          - >-
            New targets remain stopped and isolated; production cutover is false and
            separate. Existing replacement requires an independent pre-restore point.
            Bind/device mounts, passthrough and external storage are outside the PBS
            artifact and application acceptance is separate.
      when: not (_rg_execute | bool)
