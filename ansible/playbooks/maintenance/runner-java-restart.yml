---
# Install the rundeckd restart after a Java upgrade on this host. Run as root by
# rundeck/bootstrap-rundeck.sh inside the runner; Guest Maintenance applies the same task
# file to the runner from outside.
- name: "Runner | Restart rundeckd after a Java upgrade"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install the restart check
      ansible.builtin.import_tasks: ../../tasks/maintenance/install-rundeckd-java-restart.yml
