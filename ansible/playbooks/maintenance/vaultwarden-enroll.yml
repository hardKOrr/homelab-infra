---
# Enrollment is a Seed-mode operation. The helper derives registration and
# organization encryption values locally, performs the server-side
# invite/register/create/confirm flow, and stages automation API credentials.
- name: Vaultwarden | Enroll owner and automation accounts unattended
  hosts: localhost
  gather_facts: false
  vars:
    _vault_public_url: "{{ lookup('ansible.builtin.env', 'BW_SERVER') | trim }}"
    _vault_owner_email: >-
      {{ lookup('ansible.builtin.env', 'VAULTWARDEN_OWNER_EMAIL')
         | default(homelabinfra_config.infrastructure.vaultwarden.owner_email | default(''), true) }}
    _vault_automation_email: >-
      {{ lookup('ansible.builtin.env', 'VAULTWARDEN_AUTOMATION_EMAIL')
         | default(homelabinfra_config.infrastructure.vaultwarden.automation_email
                   | default('homelab-infra@' ~ homelabinfra_config.infrastructure.domain), true) }}
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert enrollment inputs
      ansible.builtin.assert:
        that:
          - _vault_public_url is match('^https://')
          - _vault_owner_email is match('^[^@ ]+@[^@ ]+$')
          - _vault_automation_email is match('^[^@ ]+@[^@ ]+$')
          - _vault_owner_email | lower != _vault_automation_email | lower
          - lookup('ansible.builtin.env', 'VAULTWARDEN_ADMIN_TOKEN') | length > 0
          - lookup('ansible.builtin.env', 'RUNDECK_API_TOKEN') | length > 0
          - lookup('ansible.builtin.env', 'RUNDECK_URL') | length > 0
        fail_msg: >-
          Enrollment needs an HTTPS BW_SERVER, distinct owner and automation emails,
          the Vaultwarden admin token, and the Rundeck API token.
      no_log: true

  tasks:
    - name: Run the resumable Vaultwarden registration and organization flow
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../scripts/vaultwarden-enroll.py"
      environment:
        BW_SERVER: "{{ _vault_public_url }}"
        VAULTWARDEN_OWNER_EMAIL: "{{ _vault_owner_email }}"
        VAULTWARDEN_AUTOMATION_EMAIL: "{{ _vault_automation_email }}"
        VAULTWARDEN_ADMIN_TOKEN: "{{ lookup('ansible.builtin.env', 'VAULTWARDEN_ADMIN_TOKEN') }}"
        RUNDECK_API_TOKEN: "{{ lookup('ansible.builtin.env', 'RUNDECK_API_TOKEN') }}"
        RUNDECK_URL: "{{ lookup('ansible.builtin.env', 'RUNDECK_URL') }}"
        RUNDECK_PROJECT: "{{ lookup('ansible.builtin.env', 'RUNDECK_PROJECT') }}"
        LAB_SECRETS_DIR: "{{ lookup('ansible.builtin.env', 'LAB_SECRETS_DIR') | default('/etc/homelab-infra/secrets.d', true) }}"
        BW_CLIENTID: "{{ lookup('ansible.builtin.env', 'BW_CLIENTID') }}"
        BW_CLIENTSECRET: "{{ lookup('ansible.builtin.env', 'BW_CLIENTSECRET') }}"
        BW_PASSWORD: "{{ lookup('ansible.builtin.env', 'BW_PASSWORD') }}"
      register: _vault_enrollment
      failed_when: false
      changed_when: >-
        _vault_enrollment.rc == 0 and (_vault_enrollment.stdout | from_json).changed
      no_log: true

    - name: Report a safe Vaultwarden enrollment failure
      ansible.builtin.fail:
        msg: "{{ (_vault_enrollment.stderr | default('', true) | trim) or 'Vaultwarden enrollment failed without a safe diagnostic.' }}"
      when: _vault_enrollment.rc != 0

    - name: Report enrollment convergence
      ansible.builtin.debug:
        msg: >-
          Vaultwarden owner and automation accounts are registered, homelab-infra exists,
          automation Admin membership is confirmed, and automation credentials are staged
          in Rundeck Key Storage. Run Vaultwarden Cutover to import the Seed passwords.
