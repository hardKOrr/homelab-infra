---
# Seed-only enrollment. Invites both accounts through the admin facility, then performs
# the whole two-account ceremony with scripts/vaultwarden-enroll.py: registration with
# generated master passwords, organization, Admin membership, and the automation API key,
# which is staged in Rundeck Key Storage for Vaultwarden Cutover. The generated passwords
# live in secrets.d/vaultwarden-accounts.json until cutover imports them into the vault.
- name: Vaultwarden | Enroll the owner and automation accounts
  hosts: localhost
  gather_facts: false
  vars:
    _vault_public_url: "{{ lookup('ansible.builtin.env', 'BW_SERVER') | trim }}"
    _vault_admin_token: "{{ lookup('ansible.builtin.env', 'VAULTWARDEN_ADMIN_TOKEN') }}"
    _vault_accounts_file: >-
      {{ lookup('ansible.builtin.env', 'LAB_SECRETS_DIR')
         | default('/etc/homelab-infra/secrets.d', true) }}/vaultwarden-accounts.json
    _rundeck_url: "{{ lookup('ansible.builtin.env', 'RUNDECK_URL') }}"
    _rundeck_token: "{{ lookup('ansible.builtin.env', 'RUNDECK_API_TOKEN') }}"
    _rundeck_project: "{{ lookup('ansible.builtin.env', 'RUNDECK_PROJECT') | default('homelab-infra', true) }}"
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Resolve enrollment identities
      ansible.builtin.set_fact:
        _vault_owner_email: >-
          {{ lookup('ansible.builtin.env', 'VAULTWARDEN_OWNER_EMAIL')
             | default(homelabinfra_config.infrastructure.vaultwarden.owner_email
                       | default(''), true) }}
        _vault_automation_email: >-
          {{ lookup('ansible.builtin.env', 'VAULTWARDEN_AUTOMATION_EMAIL')
             | default(homelabinfra_config.infrastructure.vaultwarden.automation_email
                       | default('homelab-infra@' ~ homelabinfra_config.infrastructure.domain), true) }}

    - name: Assert enrollment inputs
      ansible.builtin.assert:
        that:
          - _vault_public_url is match('^https://')
          - _vault_owner_email is match('^[^@ ]+@[^@ ]+$')
          - _vault_automation_email is match('^[^@ ]+@[^@ ]+$')
          - _vault_owner_email != _vault_automation_email
          - _vault_admin_token | length > 0
        fail_msg: >-
          Enrollment needs an HTTPS BW_SERVER, a distinct owner and automation
          email, and the Vaultwarden admin token.
      no_log: true

  tasks:
    - name: Authenticate to the Vaultwarden admin facility
      ansible.builtin.uri:
        url: "{{ _vault_public_url }}/admin"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ _vault_admin_token }}"
        follow_redirects: all
        status_code: [200, 303]
      register: _vault_admin_login
      no_log: true

    - name: Invite the exact enrollment identities
      ansible.builtin.uri:
        url: "{{ _vault_public_url }}/admin/invite"
        method: POST
        headers:
          Cookie: "{{ _vault_admin_login.cookies_string }}"
        body_format: json
        body:
          # camelCase. Vaultwarden's admin InviteData deserializes `email`; the
          # PascalCase `Email` of the Bitwarden-compatible APIs is rejected here with
          # 422 Unprocessable Entity. Verified live against 2026.x: {"Email":...} -> 422,
          # {"email":...} -> 200.
          email: "{{ item }}"
        # 409 {"message":"User already exists"} is the already-invited case, and accepting
        # it is what makes re-running the job idempotent. 400 is deliberately NOT accepted:
        # a malformed address returns 400, and swallowing that would silently enroll nobody.
        status_code: [200, 409]
      loop:
        - "{{ _vault_owner_email }}"
        - "{{ _vault_automation_email }}"
      no_log: true

    # Generated once and never rotated here: an account that already exists only accepts
    # the password it was registered with, so a regenerated one would lock enrollment out.
    - name: Read generated master passwords
      ansible.builtin.slurp:
        src: "{{ _vault_accounts_file }}"
      register: _vault_accounts_raw
      failed_when: false
      no_log: true

    - name: Resolve master passwords, generating any that are missing
      ansible.builtin.set_fact:
        _vault_passwords: >-
          {{ {'VAULTWARDEN_OWNER_PASSWORD': lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits'),
              'VAULTWARDEN_AUTOMATION_PASSWORD': lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits')}
             | combine(_vault_accounts_raw.content | default('e30=') | b64decode | from_json) }}
      no_log: true

    - name: Persist generated master passwords as Seed material
      ansible.builtin.copy:
        dest: "{{ _vault_accounts_file }}"
        mode: "0600"
        content: "{{ _vault_passwords | to_nice_json }}\n"
      no_log: true

    - name: Register accounts, create the organization, and confirm the automation Admin
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../scripts/vaultwarden-enroll.py"
      environment:
        BW_SERVER: "{{ _vault_public_url }}"
        VAULTWARDEN_OWNER_EMAIL: "{{ _vault_owner_email }}"
        VAULTWARDEN_OWNER_PASSWORD: "{{ _vault_passwords.VAULTWARDEN_OWNER_PASSWORD }}"
        VAULTWARDEN_AUTOMATION_EMAIL: "{{ _vault_automation_email }}"
        VAULTWARDEN_AUTOMATION_PASSWORD: "{{ _vault_passwords.VAULTWARDEN_AUTOMATION_PASSWORD }}"
      register: _vault_enrolled
      changed_when: "'registered' in _vault_enrolled.stderr or 'created' in _vault_enrolled.stderr or 'invited' in _vault_enrolled.stderr"
      no_log: true

    - name: Report enrollment progress
      ansible.builtin.debug:
        msg: "{{ _vault_enrolled.stderr_lines }}"

    - name: Assert the Rundeck API is available for staging
      ansible.builtin.assert:
        that:
          - _rundeck_url | length > 0
          - _rundeck_token | length > 0
        fail_msg: >-
          Accounts are enrolled, but RUNDECK_URL or the Rundeck API token is missing, so the
          automation credentials cannot be staged in Key Storage. Re-run Vaultwarden Enrollment.
      no_log: true

    - name: Check which automation credentials are already staged
      ansible.builtin.uri:
        url: "{{ _rundeck_url }}/api/58/storage/keys/project/{{ _rundeck_project }}/vaultwarden-machine/{{ item }}"
        headers:
          X-Rundeck-Auth-Token: "{{ _rundeck_token }}"
        status_code: [200, 404]
      loop: [client-id, client-secret, master-password]
      register: _vault_ks_existing
      no_log: true

    - name: Stage the automation credentials in Rundeck Key Storage
      ansible.builtin.uri:
        url: "{{ _rundeck_url }}/api/58/storage/keys/project/{{ _rundeck_project }}/vaultwarden-machine/{{ item.0 }}"
        method: "{{ 'PUT' if item.2 == 200 else 'POST' }}"
        headers:
          X-Rundeck-Auth-Token: "{{ _rundeck_token }}"
          Content-Type: application/x-rundeck-data-password
        body: "{{ item.1 }}"
        status_code: [200, 201]
      loop: >-
        {{ ['client-id', 'client-secret', 'master-password']
           | zip([_vault_api_key.client_id, _vault_api_key.client_secret,
                  _vault_passwords.VAULTWARDEN_AUTOMATION_PASSWORD],
                 _vault_ks_existing.results | map(attribute='status'))
           | list }}
      vars:
        _vault_api_key: "{{ _vault_enrolled.stdout | from_json }}"
      no_log: true

    - name: Report the next step
      ansible.builtin.debug:
        msg:
          - "Enrollment is complete for owner {{ _vault_owner_email }} and automation account {{ _vault_automation_email }}."
          - "The automation API key and master password are staged in Key Storage under keys/project/{{ _rundeck_project }}/vaultwarden-machine/."
          - "Both generated master passwords stay in {{ _vault_accounts_file }} until Vaultwarden Cutover imports them into the vault item homelab-infra/vaultwarden."
          - "Next: run Setup > Credentials > Vaultwarden Cutover, then Setup > Platform > Bootstrap Platform."
