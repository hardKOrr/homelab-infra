---
# Bootstrap playbook — run once to set up the homelab-infra platform baseline.
# After this completes, all app deploys (playbooks/apps/*.yml) are available.
#
# Prerequisites:
#   - config/proxmox.yml exists and is filled in
#   - config/infrastructure.yml exists and is filled in (provider choices)
#   - Proxmox API token is set (config/proxmox.yml or env PROXMOX_API_TOKEN)
#
# What this deploys (in order):
#   1. Vaultwarden   — secrets store (ENFORCED, always deployed)
#   2. Ntfy          — notification hub
#   3. Reverse proxy — Caddy or Nginx per infrastructure.yml
#   4. Authentik     — SSO (if infrastructure.sso.provider: authentik)
#   5. Uptime Kuma   — uptime monitoring
#   6. Grafana stack — Prometheus + Grafana
#   7. PBS           — Proxmox Backup Server (VM)
#
# ONE PASS, NO HUMAN IN THE LOOP (slice 013):
#   Vaultwarden deploys first and has no prior secret to authenticate with — the
#   chicken-and-egg this playbook has to solve. Its admin token is generated during
#   the deploy and written to the controller-side sink
#   (tasks/vaultwarden/token-sink.yml); the gate below reads it back and the run
#   continues straight into step 2. Nothing is pasted and nothing is re-run.
#
#   The gate still fails hard if no token is readable — that means the sink write
#   failed, and the role prints the token in exactly that case so it is not lost.
#
# Re-running after any failure is safe — each step finds-or-creates its guest and
# re-applies config without destructive operations.
#
# Each app playbook records its own service registry key in its Play 3, before it
# wires. Bootstrap therefore only orders the imports — it does not write facts on
# their behalf — and deploying any one app standalone registers it identically.

# ── Play 0: Fail at the front door ────────────────────────────────────────────
# config-doctor validates the whole authored set in one pass and names every missing key
# by file and key path. It runs FIRST so an incomplete config aborts here, before
# Vaultwarden provisions anything — a missing key used to surface as a stack trace
# somewhere mid-provision, which is the expensive place to learn it.
#
# lab-run.sh runs the same check before every job, so on a UI-driven run this play is a
# second, redundant pass. It stays because a bare CLI run has no lab-run.sh in front of
# it, and this is the playbook where the cost of a late failure is highest.
- name: Bootstrap | Validate authored config
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Run config-doctor
      ansible.builtin.import_tasks: ../tasks/config/run-doctor.yml
      vars:
        doctor_script_dir: "{{ playbook_dir }}/../scripts"
        doctor_config_dir: "{{ playbook_dir }}/../../config"


# ── Play 1: Load + validate platform config ───────────────────────────────────
- name: Bootstrap | Load platform config
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../tasks/load-user-vars.yml
  tasks:
    - name: Assert required config is present
      ansible.builtin.assert:
        that:
          - homelabinfra_config.proxmox.api_host is defined
          - homelabinfra_config.proxmox.api_token_id is defined
          - homelabinfra_config.infrastructure.domain is defined
        fail_msg: "config/proxmox.yml and config/infrastructure.yml must be filled in before running bootstrap."

    # Catch provider typos up front — a misspelled provider would otherwise skip
    # its bootstrap step silently (conditional imports below) instead of failing.
    - name: Assert provider choices are recognized
      ansible.builtin.assert:
        that:
          - homelabinfra_config.infrastructure.reverse_proxy.provider | default('none') in ['caddy', 'nginx', 'none']
          - homelabinfra_config.infrastructure.sso.provider | default('none') in ['authentik', 'none']
          - homelabinfra_config.infrastructure.notifications.provider | default('none') in ['ntfy', 'gotify', 'discord', 'none']
          - homelabinfra_config.infrastructure.dns.provider | default('none') in ['pihole', 'adguard', 'opnsense', 'none']
        fail_msg: >-
          Unrecognized provider in config/infrastructure.yml. Allowed values —
          reverse_proxy: caddy|nginx|none, sso: authentik|none,
          notifications: ntfy|gotify|discord|none, dns: pihole|adguard|opnsense|none.

    # Wiring tasks read homelabinfra_infra.domain, so record it before the first
    # app deploy. Idempotent — deep-merge rewrite of the same value.
    - name: Record platform domain in generated facts
      ansible.builtin.import_tasks: ../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_service: domain
        generated_facts_data: "{{ homelabinfra_config.infrastructure.domain }}"


# ── Step 1: Vaultwarden — secrets store (enforced) ────────────────────────────
- import_playbook: apps/vaultwarden.yml
  vars:
    instance: vaultwarden

- name: Bootstrap | Vaultwarden admin token gate
  hosts: localhost
  gather_facts: false
  tasks:
    # The Vaultwarden deploy above wrote the generated token to the sink, so this
    # reads back what it just stored and the run continues (slice 013). The gate
    # remains, rather than being deleted, because it is the one place that proves the
    # token reached durable storage before six more services depend on it.
    - name: Resolve the admin token sink
      ansible.builtin.import_tasks: ../tasks/vaultwarden/token-sink.yml
      vars:
        vaultwarden_token_config_dir: "{{ playbook_dir }}/../../config"

    - name: Resolve the effective admin token
      ansible.builtin.set_fact:
        _bootstrap_vw_token: >-
          {{ lookup('ansible.builtin.env', 'VAULTWARDEN_ADMIN_TOKEN')
             | default(homelabinfra_config.infrastructure.vaultwarden.admin_token
                       | default(''), true)
             | default(vaultwarden_token_stored, true) }}
      no_log: true

    # A hard fail, so Semaphore/Rundeck surface the job as "needs attention" with the
    # instructions in the output. Ntfy cannot carry this message — it does not exist
    # until step 2. Reaching this now means the sink write failed, which is rare and
    # is why the role prints the token in that case and only that case.
    - name: Halt if no Vaultwarden admin token is available
      ansible.builtin.assert:
        that: _bootstrap_vw_token | length > 0
        success_msg: "Vaultwarden admin token available — continuing bootstrap."
        fail_msg: |
          Vaultwarden is deployed, but its admin token is not readable from any
          source, and every later step needs it to store secrets.

          Expected sink: {{ vaultwarden_token_sink }}

          If the Vaultwarden deploy above printed a token, save it now — either in
          config/infrastructure.yml under vaultwarden.admin_token, or as the
          VAULTWARDEN_ADMIN_TOKEN env var on this Semaphore/Rundeck job — and re-run.
          Bootstrap is idempotent: it skips what is already deployed.

          If nothing was printed, the guest already had a token whose plaintext is
          lost. Reset it: clear ADMIN_TOKEN from /etc/vaultwarden.env on the
          Vaultwarden guest, then re-run this job to generate a fresh one.

    # Later plays read the merged config off localhost, so put the resolved token
    # where they expect it. Without this, a one-pass run would have the token in the
    # sink but not in homelabinfra_config, and slice 014's vault writes would not see
    # it until the next job picked it up from the environment.
    - name: Publish the admin token into the merged config for later steps
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config
             | combine({'infrastructure': {'vaultwarden':
                        {'admin_token': _bootstrap_vw_token}}}, recursive=True) }}
      no_log: true


# ── Step 2: Ntfy — notification hub ───────────────────────────────────────────
# Records `notifications` itself (host, topic, and the publish credentials every
# later notifier authenticates with — Ntfy ships closed by default).
- import_playbook: apps/ntfy.yml
  vars:
    instance: "{{ hostvars['localhost'].homelabinfra_config.infrastructure.notifications.instance | default('ntfy') }}"
  when: hostvars['localhost'].homelabinfra_config.infrastructure.notifications.provider | default('none') == 'ntfy'


# ── Step 3: Reverse proxy — Caddy or Nginx per infrastructure.yml ─────────────
# Conditions anchor on localhost's merged config so they evaluate identically on
# every host the imported plays target. Records `reverse_proxy` itself.
#
# The nginx import stays staged: slice 301 shipped the nginx WIRING pair, but no
# nginx app playbook exists yet. import_playbook is parsed at load time, so
# importing a missing file would break --syntax-check for this whole playbook.
- import_playbook: apps/caddy.yml
  vars:
    instance: "{{ hostvars['localhost'].homelabinfra_config.infrastructure.reverse_proxy.instance | default('caddy') }}"
  when: hostvars['localhost'].homelabinfra_config.infrastructure.reverse_proxy.provider | default('none') == 'caddy'

# - import_playbook: apps/nginx.yml
#   vars:
#     instance: "{{ hostvars['localhost'].homelabinfra_config.infrastructure.reverse_proxy.instance | default('nginx') }}"
#   when: hostvars['localhost'].homelabinfra_config.infrastructure.reverse_proxy.provider | default('none') == 'nginx'


# ── Step 4: Authentik — SSO (optional) ────────────────────────────────────────
# Records `sso` itself (API base URL and the bootstrap token the wiring tasks use).
- import_playbook: apps/authentik.yml
  vars:
    instance: "{{ hostvars['localhost'].homelabinfra_config.infrastructure.sso.instance | default('authentik') }}"
  when: hostvars['localhost'].homelabinfra_config.infrastructure.sso.provider | default('none') == 'authentik'


# ── Step 5: Uptime Kuma — uptime monitoring ───────────────────────────────────
# Records `monitoring` itself, so every app deployed after this point
# auto-registers a monitor.
- import_playbook: apps/uptime-kuma.yml
  vars:
    instance: uptime-kuma


# ── Step 6: Prometheus + Grafana — metrics ────────────────────────────────────
# One app, not two (slice 405): Grafana's only datasource is Prometheus.
# Deployed after the services above so its first scrape config already covers them.
- import_playbook: apps/observability.yml
  vars:
    instance: observability


# ── Step 7: PBS — Proxmox Backup Server (VM) ──────────────────────────────────
# Last on purpose: its backup job is built from the vmid list of every
# homelab-infra-tagged guest that exists at configure time. The playbook calls
# tasks/bootstrap/configure-pbs.yml and records `backups` itself.
- import_playbook: apps/pbs.yml
  vars:
    instance: pbs


# ── Wrap-up: report what this pass bootstrapped ───────────────────────────────
- name: Bootstrap | Summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load generated facts written this pass
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../config/.generated/facts.yml"
        name: _bootstrap_facts
      failed_when: false

    - name: Report bootstrapped services
      ansible.builtin.debug:
        msg: >-
          Bootstrap pass complete. Services recorded in config/.generated/facts.yml:
          {{ (_bootstrap_facts | default({})).keys() | list | join(', ') }}.
          Re-running bootstrap is always safe (idempotent).
