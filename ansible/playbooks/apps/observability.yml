---
# Deploy the observability stack — Prometheus + Grafana + node_exporter
# (bootstrap step 6). Docker on the monitoring stack host (PATH A), Kubernetes (PATH B)
# when hosting.method is kubernetes, or the Grafana package and the Prometheus release
# binary on the instance's own LXC or VM (PATH C) when hosting.method is native.
#
# One app, not two: Grafana's only datasource is Prometheus and neither is useful
# alone. See the role header and https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/done/405-app-grafana/notes.md.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/observability.yml -e instance=observability
#
# `instance` becomes the hostname, Caddy subdomain, Authentik app slug and Uptime Kuma
# monitor name; config/apps/<instance>.yml is merged over the defaults.
#
# Play 3 records the `metrics` registry key (CONTRACT.md §3) BEFORE wiring, so a
# standalone deploy registers the stack exactly as a bootstrap run does.
#
# Only Grafana is wired to the reverse proxy — Prometheus is loopback-bound and has
# no authentication of its own.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Finds or creates the stack host (or native guest) and groups it for Play 2.
- name: "Observability | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=observability"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/observability.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.observability_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: observability

    - name: Assert the native guest contract
      when: app_config.hosting.method == 'native'
      ansible.builtin.assert:
        that:
          - (_instance_config | default({})).get('proxmox', {}).get('guest_type', '') in ['lxc', 'vm']
        fail_msg: >-
          Native Observability runs on its own guest: set proxmox.guest_type to lxc or vm in
          the instance config.
  tasks:
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"
      when: app_config.hosting.method == 'kubernetes'

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        observability_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        observability_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}
      when: app_config.hosting.method == 'kubernetes'

    # PATH A: DOCKER — containers on a shared stack host found or created by tag.
    - name: Find or create stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    # PATH C: NATIVE — Grafana and Prometheus run on the instance's own LXC or VM.
    - name: Provision or reuse the native guest
      ansible.builtin.include_role:
        name: _template-native
        tasks_from: provision
      vars:
        native_guest_network_app: observability
      when: app_config.hosting.method == 'native'

    # PATH B: KUBERNETES — the workload runs in the cluster; no stack host.
    - name: Refresh inventory for Kubernetes access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'

    - name: Deploy the observability stack on Kubernetes
      ansible.builtin.include_role:
        name: observability
        tasks_from: kubernetes
      vars:
        observability_fqdn: "{{ hostvars['localhost'].observability_fqdn }}"
      when: app_config.hosting.method == 'kubernetes'


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
- name: "Observability | Deploy"
  # Per-instance group: bootstrap.yml chains these playbooks, and a shared group would
  # run this role on every earlier app's guest. The default() only fires in --syntax-check.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # Unconditional, unlike the guest bootstrap above: its Ntfy notify hook depends
    # on homelabinfra_infra.notifications, which does not exist yet when the first
    # baseline guests are created. Running it every deploy is what gives them the
    # hook once Ntfy is up. Idempotent copy/file tasks only.
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    # Unconditional, not gated on homelabinfra_stack_host_created: a host created by a run
    # that failed before this play is an existing host on every later run, and the docker
    # role is idempotent. State is read from the host, not inferred from this run.
    - name: Ensure Docker is installed on the stack host
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy observability stack
      ansible.builtin.include_role:
        name: observability


# ── Play 3: Record facts + wire ────────────────────────────────────────────────
# Registers the stack in the service registry, then registers the app with platform
# services. Runs on localhost (API calls). All wiring tasks are idempotent.
- name: "Observability | Record facts and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # Load infra facts in this play rather than relying on Play 1's localhost fact.
    # Tolerate absence: on a clean checkout / pre-bootstrap
    # run there is no facts.yml, homelabinfra_infra stays undefined, and every provider
    # when-condition below falls through its `| default('none')` to a silent no-op.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Shape B `metrics` per ansible/vars/CONTRACT.md §3. host is Grafana (the
    # user-facing piece, and the one this key's consumers would link to);
    # prometheus_host is recorded for humans and on-host debugging only.
    - name: Record metrics facts
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      when: not (recovery_isolated | default(false) | bool)
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: metrics
        generated_facts_data:
          provider: prometheus_grafana
          instance: "{{ instance }}"
          host: "{{ _obs_deploy_host.observability_grafana_url }}"
          prometheus_host: "{{ _obs_deploy_host.observability_prometheus_url }}"
          admin_user: "{{ _obs_deploy_host.observability_admin_username }}"

    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Overlay estate-scoped facts (domain, sso, dns) for the app's routing.estate.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _obs_deploy_host.app_config.routing.estate | default('') }}"

  vars:
    _obs_deploy_host: >-
      {{ hostvars[groups['deploy_' ~ instance][0]]
         if groups.get('deploy_' ~ instance, []) | length > 0
         else hostvars['localhost'] }}
    _obs_kubernetes: "{{ _obs_deploy_host.app_config.hosting.method == 'kubernetes' }}"

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Set them here.
    # Do not change the variable names — wiring tasks depend on them.
    # Grafana is the only piece routed: Prometheus is loopback-bound.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _obs_kubernetes
         else _obs_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _obs_kubernetes else _obs_deploy_host.app_config.app.port }}"
    wiring_subdomain: "{{ _obs_deploy_host.app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Grafana ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/api/health"
    wiring_auth_group: "homelab-users"   # Authentik group granted access
    wiring_identity_mode: "{{ _obs_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _obs_deploy_host.app_config.routing.access | default('internal') }}"

  tasks:
    # New-instance recovery provisions the workload without publishing the target route.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: _obs_kubernetes | bool and (recovery_isolated | default(false) | bool)

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    # Catalog mode by default: Grafana has its own login and user model. Set
    # routing.identity: forward_auth in config/apps/<instance>.yml to put
    # Authentik in front as well.
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    # Bookkeeping: stamps this instance onto the Proxmox guest (see the task file).
    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ (homelabinfra_infra.kubernetes.nodes | map(attribute='name') | list)
             if _obs_kubernetes else groups['deploy_' ~ instance] }}
        record_guest_kind: "{{ _obs_deploy_host.app_config.hosting.method }}"
        record_guest_url: "https://{{ wiring_domain }}"

    - name: Notify deployment complete
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Observability deployed ({{ instance }})"
        notify_message: >-
          Grafana is at https://{{ instance }}.{{ homelabinfra_infra.domain }},
          signed in as {{ _obs_deploy_host.observability_admin_username }}
          (password in Vaultwarden item homelab-infra/metrics).
          Prometheus is scraping
          {{ _obs_deploy_host.observability_scrape_target_count }} host(s);
          re-run this deploy after adding guests to pick them up.

    # Last task, deliberately: wiring records failures instead of aborting; this fails the run
    # afterwards (tasks/report-degradation.yml).
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
