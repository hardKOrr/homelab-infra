---
# Deploy Deemix — the media stack's Deezer download client for Lidarr's
# plugins-branch integration. Docker on LXC (PATH A) on the media host.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/deemix.yml -e instance=deemix
#   ansible-playbook -i inventory/ playbooks/apps/deemix.yml -e instance=deemix-4k
#
# The `instance` parameter is the unique name for this deployment. It becomes the
# hostname, Caddy subdomain, Authentik app slug and Uptime Kuma monitor name. If
# the user has a config/apps/<instance>.yml, it is loaded and merged over defaults.
#
# To enable downloads, store a current Deezer ARL as the hidden `arl` field of
# Vaultwarden item homelab-infra/apps/<instance> — see roles/deemix/tasks/main.yml
# for why this platform never generates one. Settings-only use leaves ARL empty.
#
# Docker (default) records the `media` registry key that wire-media-stack.yml reads;
# `hosting.method: kubernetes` runs it in the cluster and is not wired there.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Runs on localhost against the Proxmox API to find or create the stack host.
# Adds the target host to a group for Play 2 to use.
- name: "Deemix | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=deemix"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/deemix.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.deemix_defaults
             | combine({'media_storage':
                        homelabinfra_config.infrastructure.media_storage | default({})},
                       recursive=True)
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: deemix
  tasks:
    # PATH A: DOCKER APP — the app runs as a container on a shared stack host.
    # The stack host is found (or created) by tag. The app is deployed in Play 2.
    - name: Find or create stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    # ── Storage the lab already provides ──────────────────────────────────────
    # A download client gets all of media_storage so imports hardlink.
    - name: Resolve the storage this app needs on the stack host
      ansible.builtin.set_fact:
        _dmx_host_mounts: >-
          {{ app_config.app.mounts
             | default((app_config.media_storage | default({})).mounts | default([]), true) }}

    - name: Attach the lab's storage to the stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/attach-host-mounts.yml
      vars:
        attach_mounts_guest: "{{ homelabinfra_instance.stack.hostname }}"
        attach_mounts_list: "{{ _dmx_host_mounts }}"
        attach_mounts_owner: "{{ (app_config.media_storage | default({})).owner | default({}) }}"
      when:
        - app_config.hosting.method == 'docker'
        - _dmx_host_mounts | length > 0

- name: "Deemix | Prepare Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Resolve Deemix's download share for Kubernetes
      ansible.builtin.include_role:
        name: deemix
        tasks_from: resolve-kubernetes-media
      when: app_config.hosting.method == 'kubernetes'
    - name: Refresh inventory for cluster access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'
    - name: Open Deemix's declared access from the Kubernetes node alias
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the stack host to install and configure Deemix.
- name: "Deemix | Deploy"
  # Per-instance group: add_host groups persist across chained playbooks.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    - name: Ensure Docker is installed on the stack host
      ansible.builtin.include_role:
        name: docker

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy Deemix
      ansible.builtin.include_role:
        name: deemix
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

- name: "Deemix | Deploy on Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Deploy Deemix into its Kubernetes namespace
      ansible.builtin.include_role:
        name: deemix
        tasks_from: kubernetes
      vars:
        deemix_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}
      when: app_config.hosting.method == 'kubernetes'


# ── Play 3: Record facts + wire ────────────────────────────────────────────────
# Registers the app in the media registry, then registers it with platform
# services. Runs on localhost (API calls). All wiring tasks are idempotent.
- name: "Deemix | Record facts and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Topology only (CONTRACT.md §3); the ARL lives in homelab-infra/media/<instance>.
    - name: Record the media registry entry
      when: hostvars['localhost'].app_config.hosting.method == 'docker'
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: media
        # Built as an expression, never as a literal `"{{ instance }}":` key —
        # Ansible does not template a YAML MAPPING KEY, so that spelling writes the
        # entry under the literal string `{{ instance }}` and every app overwrites
        # the one before it (execution 67, 2026-08-09).
        generated_facts_data: >-
          {{ {instance: {'app': _dmx_deploy_host.deemix_media_kind,
                         'host': _dmx_deploy_host.deemix_media_host}} }}

    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _dmx_cfg.routing.estate | default('') }}"

  vars:
    _dmx_k8s: "{{ hostvars['localhost'].app_config.hosting.method == 'kubernetes' }}"
    _dmx_cfg: "{{ hostvars['localhost'].app_config }}"
    _dmx_deploy_host: >-
      {{ {} if _dmx_k8s | bool else hostvars[groups['deploy_' ~ instance][0]] }}

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Do not rename them.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _dmx_k8s | bool
         else _dmx_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _dmx_k8s | bool else _dmx_cfg.app.port }}"
    wiring_subdomain: "{{ _dmx_cfg.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Deemix ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/"
    wiring_auth_group: "homelab-users"   # Authentik group granted access
    wiring_auth_users: >-
      {{ [homelabinfra_infra.sso.admin_user]
         if homelabinfra_infra.sso.admin_user | default('') | length > 0 else [] }}
    wiring_identity_mode: "{{ _dmx_cfg.routing.identity | default('forward_auth') }}"
    wiring_access: "{{ _dmx_cfg.routing.access | default('internal') }}"

  tasks:
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      when: not (_dmx_k8s | bool)

    - name: Record Deemix on the Kubernetes nodes
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ homelabinfra_infra.kubernetes.nodes | default([]) | map(attribute='name') | list }}
        record_guest_kind: kubernetes
        record_guest_url: "https://{{ wiring_domain }}/"
      when: _dmx_k8s | bool

    # App-to-app wiring belongs to playbooks/stacks/wire-media-stack.yml.
    - name: Report how to wire this app into the media stack
      when: not (_dmx_k8s | bool)
      ansible.builtin.debug:
        msg: >-
          {{ instance }} is registered in the media registry. Run the Wire Media
          Stack job to register it as a download client in every Lidarr running
          the plugins branch. Deemix Deploy reports the automatic Deezer sign-in
          result above when an ARL is configured.

    # Last task: see tasks/report-degradation.yml.
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
