---
# Deploy Hi.Events — an event ticketing and registration platform — onto the Kubernetes
# hosting backend (default), or on Docker on a stack host (LXC or VM) with
# `hosting.method: docker` and `stack: <name>`, or natively on its own LXC or VM with
# `hosting.method: native` and `proxmox.guest_type: lxc|vm`.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/hi-events.yml -e instance=hi-events
#
# STRUCTURALLY IDENTICAL TO playbooks/apps/jellyseerr.yml, WITH ONE ADDITION
#
# No guest to provision and no guest to run a role on: its resources live in a namespace
# on a cluster that outlives any deployment of it, so the whole thing runs on localhost and
# reaches the cluster through tasks/kubernetes/, which delegates kubectl to a cluster node.
# The addition is tasks/database/provision.yml, run before the role — the same
# backend-independent contract playbooks/apps/odoo.yml proved for a Docker consumer, now
# proved for a Kubernetes one, ahead of roles/mixpost's own namespaced MySQL.

# ── Play 1: Resolve and deploy ─────────────────────────────────────────────────
- name: "Hi.Events | Deploy"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=hi-events"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/hi-events.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.hi_events_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: hi-events

    - name: Assert the native guest contract
      when: app_config.hosting.method == 'native'
      ansible.builtin.assert:
        that:
          - (_instance_config | default({})).get('proxmox', {}).get('guest_type', '') in ['lxc', 'vm']
        fail_msg: >-
          Native Hi.Events runs on its own guest: set proxmox.guest_type to lxc or vm in the
          instance config.
  tasks:
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        hi_events_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        hi_events_fqdn: >-
          {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

    - name: Provision the named PostgreSQL database and role
      ansible.builtin.include_tasks: ../../tasks/database/provision.yml
      vars:
        database_provision_app_instance: "{{ instance }}"
        database_provision_config: "{{ app_config.app.database }}"

    - name: Add database connection to Hi.Events config
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'app': {
            'database_host': database_provision_connection.host,
            'database_port': database_provision_connection.port,
            'database_user': database_provision_connection.user,
            'database_password': database_provision_connection.password
          }}, recursive=True) }}
      no_log: true

    - name: Find or create the stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    - name: Provision or reuse the native guest
      ansible.builtin.include_role:
        name: _template-native
        tasks_from: provision
      vars:
        native_guest_network_app: hi-events
      when: app_config.hosting.method == 'native'

    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'

    - name: Open the app's declared network access
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'

    - name: Deploy Hi.Events onto the cluster
      ansible.builtin.include_role:
        name: hi-events
        tasks_from: kubernetes
      vars:
        hi_events_fqdn: "{{ hostvars['localhost'].hi_events_fqdn }}"
      when: app_config.hosting.method == 'kubernetes'


# Before Deploy: the declared access plus SMTP egress to the platform relay, which
# Hi.Events needs to send tickets and confirmations (tasks/firewall/open-app-access.yml).
- name: "Hi.Events | Open native network access"
  hosts: localhost
  gather_facts: false
  vars:
    app_config: "{{ hostvars['localhost'].app_config }}"
    wiring_app_name: "{{ instance }}"
    wiring_firewall: "{{ app_config.firewall | default({}) }}"
    firewall_sends_mail: true
  tasks:
    - name: Open the app's network access
      ansible.builtin.include_tasks: ../../tasks/firewall/open-app-access.yml
      vars:
        wiring_upstream_host: "{{ hostvars[groups['deploy_' ~ instance][0]].ansible_host }}"
      when: hostvars['localhost'].app_config.hosting.method == 'native'


- name: "Hi.Events | Deploy on Docker or natively"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Bootstrap the stack host
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
        and hostvars['localhost'].app_config.hosting.method in ['docker', 'native']

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
      when: hostvars['localhost'].app_config.hosting.method in ['docker', 'native']

    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Deploy Hi.Events
      ansible.builtin.include_role:
        name: hi-events
      vars:
        hi_events_fqdn: "{{ hostvars['localhost'].hi_events_fqdn }}"
      when: hostvars['localhost'].app_config.hosting.method in ['docker', 'native']


# ── Play 2: Wire ───────────────────────────────────────────────────────────────
- name: "Hi.Events | Wire"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    _he_guest: "{{ hostvars['localhost'].app_config.hosting.method in ['docker', 'native'] }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ hostvars[groups['deploy_' ~ instance][0]].ansible_host
         if _he_guest | bool else homelabinfra_infra.kubernetes.ingress_vip }}
    wiring_upstream_port: >-
      {{ hostvars['localhost'].app_config.app.port if _he_guest | bool else 80 }}
    wiring_subdomain: "{{ hostvars['localhost'].hi_events_subdomain }}"
    wiring_domain: "{{ hostvars['localhost'].hi_events_fqdn }}"
    wiring_app_display: "Hi.Events ({{ instance }})"
    # `/`, not an /api/status-style route — the pinned image ships no such route.
    # Necessarily weaker than roles/hi-events' own in-cluster readinessProbe: Uptime
    # Kuma is an external HTTP client and cannot run the `migrate:status` exec check
    # that probe uses to catch a silently-failed migration (see that probe's comment in
    # roles/hi-events/templates/manifest.yaml.j2), so this monitor confirms the app is
    # reachable, not that its schema is caught up. The Kubernetes probe is what keeps a
    # broken pod out of the Service in the meantime.
    wiring_monitor_url: "https://{{ hostvars['localhost'].hi_events_fqdn }}/"
    wiring_auth_group: "homelab-users"
    wiring_identity_mode: "{{ hostvars['localhost'].app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ hostvars['localhost'].app_config.routing.access | default('public') }}"

  tasks:
    # New-instance recovery provisions the workload without letting it publish the target
    # route or modify shared wiring before the restored data verifies.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra.monitoring is defined
        - homelabinfra_infra.monitoring.provider | default('none') != 'none'

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Record the app on every node of its cluster or its stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ groups['deploy_' ~ instance] if _he_guest | bool
             else (homelabinfra_infra.kubernetes | default({})).nodes | default([])
                  | map(attribute='name') | list }}
        record_guest_kind: "{{ hostvars['localhost'].app_config.hosting.method if _he_guest | bool else 'kubernetes' }}"
        record_guest_url: "https://{{ hostvars['localhost'].hi_events_fqdn }}"

    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Hi.Events deployed"
        notify_message: >-
          {{ instance }} is running on {{ {'docker': 'Docker', 'native': 'its own guest'}[hostvars['localhost'].app_config.hosting.method] | default('the Kubernetes backend') }} at
          https://{{ hostvars['localhost'].hi_events_fqdn }}

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
