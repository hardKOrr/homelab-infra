---
# Remove a deployed app instance — inverse of the app deploy playbook.
# Safe to re-run: if already removed, every step is a no-op.
# config/apps/<instance>.yml is NOT deleted — it is your restore point.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k -e app=radarr
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k -e delete_data=true
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=mysql -e delete_data=true -e destroy_guest=true
#
# Rundeck: job parameters
#   instance     — the app instance name (required)
#   app          — the app whose vars/app-defaults/<app>.yml describes this instance.
#                  Defaults to `instance`, which is correct whenever the instance was
#                  deployed under the app's own name. Pass it for renamed instances
#                  (-e instance=radarr-4k -e app=radarr).
#   delete_data  — false (default) keeps volumes and data paths, so re-running the
#                  deploy restores the app with its data. true wipes them.
#   destroy_guest — false (default) keeps its LXC. true is allowed only with
#                   delete_data=true and a native LXC carrying both _+lab and
#                   _<instance>; a live ownership and sharing check runs again
#                   immediately before Proxmox destroys it.
#
# Order of operations — unwire first, then stop:
#   1. Resolve the instance's config and locate its host
#   2. Unwire (localhost, each step conditional on its provider):
#      a. Caddy/Nginx route      d. DNS record
#      b. Authentik application + provider
#      c. Uptime Kuma monitor    f. firewall rules the instance owns
#      e. its entries in config/.generated/facts.yml — the service registry. Added
#         2026-08-15: a removal used to leave the registry claiming the app was still
#         there, and an orphaned media entry is not inert (Wire Media Stack registers
#         it as a live download client). See tasks/unwiring/registry.yml.
#   3. Withdraw the instance's row and `_<instance>` tag from its Proxmox guest, unless
#      it is a PostgreSQL guest that this playbook leaves in place for redeployment
#   4. Stop and remove the app on its host (compose down, or stop+disable the service)
#   5. Notify via Ntfy: "<instance> removed"
#
# Traffic is drained before the backend disappears, and the uptime monitor is gone
# before the app stops answering — so removal does not page the operator.
#
# Docker vs native is decided by the merged config: an app_config with a `stack:`
# key is a Docker app on a shared stack host; anything else is a native LXC app on
# its own guest. This is the same key the deploy playbooks branch on.
#
# By default, Remove does NOT:
#   - Delete config/apps/<instance>.yml (restore point — user deletes manually)
#   - Destroy any Proxmox guest, including a now-empty stack host or a native app's
#     own LXC (pass destroy_guest=true with delete_data=true to remove one native LXC)
#   - Remove data unless -e delete_data=true

# ── Play 1: Resolve the instance, unwire it ────────────────────────────────────
- name: "Remove App | Unwire"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Pass the app instance name: -e instance=<name> (e.g. radarr-4k)"

    - name: Load app defaults (optional — absent for an app with no defaults file)
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/{{ app | default(instance) }}.yml"
        name: _app_defaults
      failed_when: false

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # absent pre-bootstrap — every unwire step below no-ops

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ (_app_defaults | default({})).get(_defaults_key, {})
             | combine(_instance_config | default({}), recursive=True) }}
      vars:
        _defaults_key: "{{ (app | default(instance)) | replace('-', '_') }}_defaults"

    - name: Assert the instance is known
      ansible.builtin.assert:
        that: app_config | length > 0
        fail_msg: >-
          Nothing describes instance '{{ instance }}': neither
          vars/app-defaults/{{ app | default(instance) }}.yml nor
          config/apps/{{ instance }}.yml exists. If the instance was deployed under
          a different app name, pass it: -e app=<app>.

    - name: Resolve the app's GPU stack before locating its host
      ansible.builtin.include_tasks: ../../tasks/stack/resolve-app-stack.yml
      vars:
        stack_resolution_config: "{{ app_config }}"
        stack_resolution_default_name: "{{ app_config.stack | default('', true) }}"

    - name: Apply the effective stack for removal
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'stack': _stack_resolution_name}, recursive=True)
             if app_config.stack is defined else app_config }}

    # Hi.Events owns one named database and role on a separately managed PostgreSQL
    # guest. Resolve that exact pair before unwiring; deleting the app must never touch
    # another registered consumer or the shared backend guest.
    - name: Resolve Hi.Events' named database removal inputs
      ansible.builtin.set_fact:
        _rm_hi_events_database_config: "{{ app_config.app.database | default({}) }}"
        _rm_hi_events_database_backend: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.database.instance | default(''), {}) }}
        _rm_hi_events_database_item: >-
          {{ (homelabinfra_vault.apps | default({})).get(instance, {}) }}
      no_log: true
      when:
        - (app | default(instance)) == 'hi-events'
        - delete_data | default(false) | bool

    - name: Validate Hi.Events' named database removal inputs
      ansible.builtin.assert:
        that:
          - _rm_hi_events_database_config.provider | default('') == 'postgresql'
          - _rm_hi_events_database_config.instance | default('') | length > 0
          - _rm_hi_events_database_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_hi_events_database_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_hi_events_database_backend.provider | default('') == 'postgresql'
          - _rm_hi_events_database_backend.host | default('') | length > 0
          - _rm_hi_events_database_backend.port | default(0) | int > 0
          - _rm_hi_events_database_item.database_host | default('') == _rm_hi_events_database_backend.host
          - _rm_hi_events_database_item.database_name | default('') == _rm_hi_events_database_config.name
          - _rm_hi_events_database_item.database_user | default('') == _rm_hi_events_database_config.role
        fail_msg: >-
          Refusing to remove Hi.Events data without a registered PostgreSQL backend and
          safe database and role names.
      no_log: true
      when:
        - (app | default(instance)) == 'hi-events'
        - delete_data | default(false) | bool

    - name: Check Hi.Events' database and role are not shared by another app
      ansible.builtin.set_fact:
        _rm_hi_events_shared_databases: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_hi_events_database_backend.host)
             | selectattr('value.database_name', 'defined')
             | selectattr('value.database_name', 'equalto', _rm_hi_events_database_config.name)
             | list }}
        _rm_hi_events_shared_roles: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_hi_events_database_backend.host)
             | selectattr('value.database_user', 'defined')
             | selectattr('value.database_user', 'equalto', _rm_hi_events_database_config.role)
             | list }}
      no_log: true
      when:
        - (app | default(instance)) == 'hi-events'
        - delete_data | default(false) | bool

    - name: Refuse to remove a shared Hi.Events database or role
      ansible.builtin.assert:
        that:
          - _rm_hi_events_shared_databases | length == 0
          - _rm_hi_events_shared_roles | length == 0
        fail_msg: >-
          Refusing to remove Hi.Events' named database or role because another canonical
          app item references it.
      no_log: true
      when:
        - (app | default(instance)) == 'hi-events'
        - delete_data | default(false) | bool

    - name: Add Hi.Events' database backend as a removal target
      ansible.builtin.add_host:
        name: hi_events_database_removal_target
        ansible_host: "{{ _rm_hi_events_database_backend.host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
        groups: hi_events_database_removal_targets
      changed_when: false
      no_log: true
      when:
        - (app | default(instance)) == 'hi-events'
        - delete_data | default(false) | bool

    # Plane uses a named PostgreSQL database outside its Compose project. Resolve and
    # validate that exact resource before unwiring anything; delete_data must never turn
    # into dropping an unregistered backend or a database shared with another app.
    - name: Resolve Plane's named database removal inputs
      ansible.builtin.set_fact:
        _rm_plane_database_config: "{{ app_config.app.database | default({}) }}"
        _rm_plane_database_backend: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.database.instance | default(''), {}) }}
      no_log: true
      when:
        - (app | default(instance)) == 'plane'
        - delete_data | default(false) | bool

    - name: Validate Plane's named database removal inputs
      ansible.builtin.assert:
        that:
          - _rm_plane_database_config.provider | default('') == 'postgresql'
          - _rm_plane_database_config.instance | default('') | length > 0
          - _rm_plane_database_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_plane_database_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_plane_database_backend.provider | default('') == 'postgresql'
          - _rm_plane_database_backend.host | default('') | length > 0
          - _rm_plane_database_backend.port | default(0) | int > 0
        fail_msg: >-
          Refusing to remove Plane data because its named PostgreSQL database or backend
          is not registered with safe identifiers.
      no_log: true
      when:
        - (app | default(instance)) == 'plane'
        - delete_data | default(false) | bool

    - name: Check Plane's database and role are not shared by another app
      ansible.builtin.set_fact:
        _rm_plane_shared_database_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_plane_database_backend.host)
             | selectattr('value.database_name', 'defined')
             | selectattr('value.database_name', 'equalto', _rm_plane_database_config.name)
             | list }}
        _rm_plane_shared_role_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_plane_database_backend.host)
             | selectattr('value.database_user', 'defined')
             | selectattr('value.database_user', 'equalto', _rm_plane_database_config.role)
             | list }}
      no_log: true
      when:
        - (app | default(instance)) == 'plane'
        - delete_data | default(false) | bool

    - name: Refuse to remove a shared Plane database or role
      ansible.builtin.assert:
        that:
          - _rm_plane_shared_database_consumers | length == 0
          - _rm_plane_shared_role_consumers | length == 0
        fail_msg: >-
          Refusing to remove Plane's named database or role because another canonical app
          item references it.
      no_log: true
      when:
        - (app | default(instance)) == 'plane'
        - delete_data | default(false) | bool

    - name: Add Plane's named database backend to the removal inventory
      ansible.builtin.add_host:
        name: plane_database_removal_target
        ansible_host: "{{ _rm_plane_database_backend.host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
        groups: plane_database_removal_targets
      changed_when: false
      no_log: true
      when:
        - (app | default(instance)) == 'plane'
        - delete_data | default(false) | bool

    # Odoo's application database is stored on its separately managed PostgreSQL guest.
    # Resolve and guard that exact database and role before Remove unwires the instance.
    - name: Resolve Odoo's named database removal inputs
      ansible.builtin.set_fact:
        _rm_odoo_database_config: "{{ app_config.app.database | default({}) }}"
        _rm_odoo_database_backend: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.database.instance | default(''), {}) }}
      no_log: true
      when:
        - (app | default(instance)) == 'odoo'
        - delete_data | default(false) | bool

    - name: Validate Odoo's named database removal inputs
      ansible.builtin.assert:
        that:
          - _rm_odoo_database_config.provider | default('') == 'postgresql'
          - _rm_odoo_database_config.instance | default('') | length > 0
          - _rm_odoo_database_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_odoo_database_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_odoo_database_backend.provider | default('') == 'postgresql'
          - _rm_odoo_database_backend.host | default('') | length > 0
          - _rm_odoo_database_backend.port | default(0) | int > 0
        fail_msg: >-
          Refusing to remove Odoo data because its named PostgreSQL database or backend
          is not registered with safe identifiers.
      no_log: true
      when:
        - (app | default(instance)) == 'odoo'
        - delete_data | default(false) | bool

    - name: Check Odoo's database and role are not shared by another app
      ansible.builtin.set_fact:
        _rm_odoo_shared_database_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_odoo_database_backend.host)
             | selectattr('value.database_name', 'defined')
             | selectattr('value.database_name', 'equalto', _rm_odoo_database_config.name)
             | list }}
        _rm_odoo_shared_role_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_odoo_database_backend.host)
             | selectattr('value.database_user', 'defined')
             | selectattr('value.database_user', 'equalto', _rm_odoo_database_config.role)
             | list }}
      no_log: true
      when:
        - (app | default(instance)) == 'odoo'
        - delete_data | default(false) | bool

    - name: Refuse to remove a shared Odoo database or role
      ansible.builtin.assert:
        that:
          - _rm_odoo_shared_database_consumers | length == 0
          - _rm_odoo_shared_role_consumers | length == 0
        fail_msg: >-
          Refusing to remove Odoo's named database or role because another canonical app
          item references it.
      no_log: true
      when:
        - (app | default(instance)) == 'odoo'
        - delete_data | default(false) | bool

    - name: Add Odoo's named database backend to the removal inventory
      ansible.builtin.add_host:
        name: odoo_database_removal_target
        ansible_host: "{{ _rm_odoo_database_backend.host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
        groups: odoo_database_removal_targets
      changed_when: false
      no_log: true
      when:
        - (app | default(instance)) == 'odoo'
        - delete_data | default(false) | bool

    # BookStack owns one named MariaDB database and login on its shared backend.
    # Resolve and check only those resources before Remove unwires the instance.
    - name: Resolve BookStack's named database removal inputs
      ansible.builtin.set_fact:
        _rm_bookstack_database_config: "{{ app_config.app.database | default({}) }}"
        _rm_bookstack_database_backend: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.database.instance | default(''), {}) }}
      no_log: true
      when:
        - (app | default(instance)) == 'bookstack'
        - delete_data | default(false) | bool

    - name: Validate BookStack's named database removal inputs
      ansible.builtin.assert:
        that:
          - _rm_bookstack_database_config.provider | default('') == 'mariadb'
          - _rm_bookstack_database_config.instance | default('') | length > 0
          - _rm_bookstack_database_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_bookstack_database_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_bookstack_database_backend.provider | default('') == 'mariadb'
          - _rm_bookstack_database_backend.host | default('') | length > 0
          - _rm_bookstack_database_backend.port | default(0) | int > 0
          - _rm_bookstack_database_backend.client_hosts | default([]) | length > 0
        fail_msg: >-
          Refusing to remove BookStack data because its named MariaDB database or backend
          is not registered with safe identifiers and client networks.
      no_log: true
      when:
        - (app | default(instance)) == 'bookstack'
        - delete_data | default(false) | bool

    - name: Check BookStack's database and role are not shared by another app
      ansible.builtin.set_fact:
        _rm_bookstack_shared_database_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_bookstack_database_backend.host)
             | selectattr('value.database_name', 'defined')
             | selectattr('value.database_name', 'equalto', _rm_bookstack_database_config.name)
             | list }}
        _rm_bookstack_shared_role_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_bookstack_database_backend.host)
             | selectattr('value.database_user', 'defined')
             | selectattr('value.database_user', 'equalto', _rm_bookstack_database_config.role)
             | list }}
      no_log: true
      when:
        - (app | default(instance)) == 'bookstack'
        - delete_data | default(false) | bool

    - name: Refuse to remove a shared BookStack database or role
      ansible.builtin.assert:
        that:
          - _rm_bookstack_shared_database_consumers | length == 0
          - _rm_bookstack_shared_role_consumers | length == 0
        fail_msg: >-
          Refusing to remove BookStack's named database or role because another canonical
          app item references it.
      no_log: true
      when:
        - (app | default(instance)) == 'bookstack'
        - delete_data | default(false) | bool

    - name: Add BookStack's named database backend to the removal inventory
      ansible.builtin.add_host:
        name: bookstack_database_removal_target
        ansible_host: "{{ _rm_bookstack_database_backend.host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
        groups: bookstack_database_removal_targets
      changed_when: false
      no_log: true
      when:
        - (app | default(instance)) == 'bookstack'
        - delete_data | default(false) | bool

    # WordPress owns one named MariaDB database and login on its backend. Resolve and
    # check only those resources before Remove unwires the instance.
    - name: Resolve WordPress's named database removal inputs
      ansible.builtin.set_fact:
        _rm_wordpress_database_config: "{{ app_config.app.database | default({}) }}"
        _rm_wordpress_database_backend: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.database.instance | default(''), {}) }}
      no_log: true
      when:
        - (app | default(instance)) == 'wordpress'
        - delete_data | default(false) | bool

    - name: Validate WordPress's named database removal inputs
      ansible.builtin.assert:
        that:
          - _rm_wordpress_database_config.provider | default('') == 'mariadb'
          - _rm_wordpress_database_config.instance | default('') | length > 0
          - _rm_wordpress_database_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_wordpress_database_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _rm_wordpress_database_backend.provider | default('') == 'mariadb'
          - _rm_wordpress_database_backend.host | default('') | length > 0
          - _rm_wordpress_database_backend.port | default(0) | int > 0
          - _rm_wordpress_database_backend.client_hosts | default([]) | length > 0
        fail_msg: >-
          Refusing to remove WordPress data because its named MariaDB database or backend
          is not registered with safe identifiers and client networks.
      no_log: true
      when:
        - (app | default(instance)) == 'wordpress'
        - delete_data | default(false) | bool

    - name: Check WordPress's database and role are not shared by another app
      ansible.builtin.set_fact:
        _rm_wordpress_shared_database_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_wordpress_database_backend.host)
             | selectattr('value.database_name', 'defined')
             | selectattr('value.database_name', 'equalto', _rm_wordpress_database_config.name)
             | list }}
        _rm_wordpress_shared_role_consumers: >-
          {{ (homelabinfra_vault.apps | default({}) | dict2items)
             | rejectattr('key', 'equalto', instance)
             | selectattr('value.database_host', 'defined')
             | selectattr('value.database_host', 'equalto', _rm_wordpress_database_backend.host)
             | selectattr('value.database_user', 'defined')
             | selectattr('value.database_user', 'equalto', _rm_wordpress_database_config.role)
