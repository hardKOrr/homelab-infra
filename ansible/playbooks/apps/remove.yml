    - name: Refuse to remove a shared WordPress database or role
      ansible.builtin.assert:
        that:
          - _rm_wordpress_shared_database_consumers | length == 0
          - _rm_wordpress_shared_role_consumers | length == 0
        fail_msg: >-
          Refusing to remove WordPress's named database or role because another canonical
          app item references it.
      no_log: true
      when:
        - (app | default(instance)) == 'wordpress'
        - delete_data | default(false) | bool

    - name: Add WordPress's named database backend to the removal inventory
      ansible.builtin.add_host:
        name: wordpress_database_removal_target
        ansible_host: "{{ _rm_wordpress_database_backend.host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
        groups: wordpress_database_removal_targets
      changed_when: false
