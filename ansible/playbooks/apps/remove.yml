---
# Remove a deployed app instance — inverse of the app deploy playbook.
# Safe to re-run: if already removed, every step is a no-op.
# config/apps/<instance>.yml is NOT deleted — it is your restore point.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k -e app=radarr
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=radarr-4k -e delete_data=true
#   ansible-playbook -i inventory/ playbooks/apps/remove.yml -e instance=mysql -e delete_data=true -e destroy_guest=true
#
# Rundeck: job parameters
#   instance     — the app instance name (required)
#   app          — the app whose vars/app-defaults/<app>.yml describes this instance.
#                  Defaults to `instance`, which is correct whenever the instance was
#                  deployed under the app's own name. Pass it for renamed instances
#                  (-e instance=radarr-4k -e app=radarr).
#   delete_data  — false (default) keeps volumes and data paths, so re-running the
#                  deploy restores the app with its data. true wipes them.
#   destroy_guest — false (default) keeps its native guest. true is allowed only with
#                   delete_data=true and a native LXC or VM carrying both _+lab and
#                   _<instance>; a live ownership and sharing check runs again
#                   immediately before Proxmox destroys it.
#                   Destroying a database backend also removes its exact generated database
#                   registry entry after the guest is gone.
#
# Order of operations — unwire first, then stop:
#   1. Resolve the instance's config and locate its host
#   2. Unwire (localhost, each step conditional on its provider):
#      a. Caddy/Nginx route      d. DNS record
#      b. Authentik application + provider
#      c. Uptime Kuma monitor    f. firewall rules the instance owns
#      e. its entries in config/.generated/facts.yml — the service registry. Added
#         2026-08-15: a removal used to leave the registry claiming the app was still
#         there, and an orphaned media entry is not inert (Wire Media Stack registers
#         it as a live download client). See tasks/unwiring/registry.yml.
#   3. Withdraw the instance's row and `_<instance>` tag from its Proxmox guest, unless
#      it is a PostgreSQL guest that this playbook leaves in place for redeployment
#      (a kept guest's next Deploy finds it again by exact name through
#      tasks/proxmox/resolve-instance-guest.yml)
#   4. Stop and remove the app on its host (compose down, or stop+disable the service)
#   5. Notify via Ntfy: "<instance> removed"
#
# Traffic is drained before the backend disappears, and the uptime monitor is gone
# before the app stops answering — so removal does not page the operator.
#
# Docker vs native is decided by the merged config: an app_config with a `stack:`
# key is a Docker app on a shared stack host; anything else is a native LXC app on
# its own guest. This is the same key the deploy playbooks branch on.
#
# By default, Remove does NOT:
#   - Delete config/apps/<instance>.yml (restore point — user deletes manually)
#   - Destroy any Proxmox guest, including a now-empty stack host or a native app's
#     own guest (pass destroy_guest=true with delete_data=true for one native guest)
#   - Remove data unless -e delete_data=true

# ── Play 1: Resolve the instance, unwire it ────────────────────────────────────
- name: "Remove App | Unwire"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Pass the app instance name: -e instance=<name> (e.g. radarr-4k)"

    - name: Load app defaults (optional — absent for an app with no defaults file)
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/{{ app | default(instance) }}.yml"
        name: _app_defaults
      failed_when: false

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # absent pre-bootstrap — every unwire step below no-ops

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ (_app_defaults | default({})).get(_defaults_key, {})
             | combine(_instance_config | default({}), recursive=True) }}
      vars:
        _defaults_key: "{{ (app | default(instance)) | replace('-', '_') }}_defaults"

    - name: Assert the instance is known
      ansible.builtin.assert:
        that: app_config | length > 0
        fail_msg: >-
          Nothing describes instance '{{ instance }}': neither
          vars/app-defaults/{{ app | default(instance) }}.yml nor
          config/apps/{{ instance }}.yml exists. If the instance was deployed under
          a different app name, pass it: -e app=<app>.

    - name: Resolve the app's GPU stack before locating its host
      ansible.builtin.include_tasks: ../../tasks/stack/resolve-app-stack.yml
      vars:
        stack_resolution_config: "{{ app_config }}"
        stack_resolution_default_name: "{{ app_config.stack | default('', true) }}"

    - name: Apply the effective stack for removal
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'stack': _stack_resolution_name}, recursive=True)
             if app_config.stack is defined else app_config }}

    # Immich keeps originals and thumbnails on one separately mounted durable path. Validate
    # that exact target before unwiring; delete_data must never turn into removing a path
    # outside the declared Immich mount. Its named database is dropped like any other app's.
    - name: Resolve Immich's media removal inputs
      ansible.builtin.set_fact:
        _rm_immich_media_mounts: "{{ app_config.media_storage.mounts | default([]) }}"
        _rm_immich_media_path: >-
          {{ ((app_config.media_storage.mounts | default([]) | first | default({})).path
               | default('') | regex_replace('/+$', '')) }}
      no_log: true
      when:
        - (app | default(instance)) == 'immich'
        - delete_data | default(false) | bool

    - name: Validate Immich's dedicated media mount
      ansible.builtin.assert:
        that:
          - _rm_immich_media_mounts | length == 1
          - _rm_immich_media_path is match('^/')
          - _rm_immich_media_path | length > 1
          - _rm_immich_media_path.split('/') | select('equalto', '..') | list | length == 0
          - app_config.media_storage.owner.uid | default(0) | int > 0
          - app_config.media_storage.owner.gid | default(0) | int > 0
        fail_msg: >-
          Refusing to remove Immich data without exactly one safe, owned durable media mount.
      no_log: true
      when:
        - (app | default(instance)) == 'immich'
        - delete_data | default(false) | bool


    # An app with a named database on a registered backend owns only that database and
    # login, never the backend guest. Check ownership before unwiring anything, so a
    # refused drop leaves the app in place; Play 4 drops it after the app has stopped.
    - name: Decide whether Remove drops a named database
      ansible.builtin.set_fact:
        _rm_drops_database: >-
          {{ (delete_data | default(false) | bool)
             and (app_config.app.database.provider | default('')) in ['postgresql', 'mariadb', 'mysql']
             and (app_config.app.database.instance | default('') | length > 0) }}

    - name: Resolve the app's named database before unwiring
      ansible.builtin.include_tasks: ../../tasks/database/resolve-app-database.yml
      vars:
        database_app_instance: "{{ instance }}"
        database_app_config: "{{ app_config.app.database }}"
      when: _rm_drops_database | bool

    - name: Check the app's named database ownership before unwiring
      ansible.builtin.include_tasks: ../../tasks/database/guard-app-database.yml
      vars:
        database_app_instance: "{{ instance }}"
      when: _rm_drops_database | bool


    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Classify app hosting before any guest destruction request
      ansible.builtin.set_fact:
        _rm_destroy_guest_host: ""
        _rm_kind: >-
          {{ 'appliance'
             if (app_config.get('proxmox', {}).get('installer')
                 or app_config.get('install', {}).get('method') == 'official-iso')
             else app_config.hosting.method
                  | default('docker' if app_config.stack is defined else 'native', true) }}

    - name: Refresh inventory before validating an explicit guest destruction request
      ansible.builtin.meta: refresh_inventory
      when: destroy_guest | default(false) | bool

    - name: Resolve the exact guest selected for explicit destruction
      ansible.builtin.set_fact:
        _rm_destroy_guest_host: "{{ instance if instance in (groups['all'] | default([])) else '' }}"
      when: destroy_guest | default(false) | bool

    - name: Identify a registered database backend missing from the inventory
      ansible.builtin.set_fact:
        _rm_database_backend_inventory_absence_candidate: >-
          {{ (app | default(instance)) in ['influxdb', 'mariadb', 'mysql', 'postgresql', 'redis']
             and instance in ((homelabinfra_infra | default({})).get('databases', {}))
             and _rm_destroy_guest_host | length == 0
             and (groups['all'] | default([])
                  | map('extract', hostvars)
                  | selectattr('proxmox_name', 'defined')
                  | selectattr('proxmox_name', 'equalto', instance)
                  | list | length == 0) }}
      when: destroy_guest | default(false) | bool

    - name: Register Proxmox nodes before checking an absent database backend
      ansible.builtin.include_tasks: ../../tasks/proxmox/register-nodes.yml
      when: _rm_database_backend_inventory_absence_candidate | default(false) | bool

    - name: Read Proxmox cluster guests before pruning an absent database backend
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      register: _rm_database_backend_cluster_resources
      changed_when: false
      no_log: true
      when: _rm_database_backend_inventory_absence_candidate | default(false) | bool

    - name: Require Proxmox to return its current cluster guests
      ansible.builtin.assert:
        that:
          - (_rm_database_backend_cluster_resources.stdout | from_json | type_debug) == 'list'
          - _rm_database_backend_cluster_resources.stdout | from_json | length > 0
        fail_msg: >-
          Refusing to unregister the database backend because Proxmox did not return a
          nonempty cluster guest list.
      when: _rm_database_backend_inventory_absence_candidate | default(false) | bool

    - name: Check Proxmox resources for the registered backend name or tag
      ansible.builtin.set_fact:
        _rm_database_backend_live_guest_matches: >-
          {{ (_rm_database_backend_live_guest_matches | default([]))
             + ([item] if item.name | default('') == instance
                or ('_' ~ instance) in ((item.tags | default('', true)).split(';'))
                else []) }}
      loop: "{{ _rm_database_backend_cluster_resources.stdout | from_json }}"
      loop_control:
        label: "database backend identity check"
      no_log: true
      when: _rm_database_backend_inventory_absence_candidate | default(false) | bool

    - name: Refuse absent-backend cleanup while Proxmox reports the guest
      ansible.builtin.assert:
        that: _rm_database_backend_live_guest_matches | default([]) | length == 0
        fail_msg: >-
          Refusing to unregister the database backend because Proxmox still reports a
          guest with its instance name or tag; repair inventory before retrying Remove.
      when: _rm_database_backend_inventory_absence_candidate | default(false) | bool

    - name: Confirm the registered database backend is absent from Proxmox
      ansible.builtin.set_fact:
        _rm_database_backend_missing_guest: >-
          {{ _rm_database_backend_inventory_absence_candidate | default(false) | bool
             and _rm_database_backend_live_guest_matches | default([]) | length == 0 }}
      when: destroy_guest | default(false) | bool

    - name: Validate the explicit guest destruction request before unwiring
      ansible.builtin.assert:
        that:
          - delete_data | default(false) | bool
          - _rm_kind == 'native'
          - >-
            (_rm_destroy_guest_host | length > 0)
            or (_rm_database_backend_missing_guest | default(false) | bool)
          - _rm_destroy_guest_host | length == 0 or _rm_destroy_guest_host == instance
        fail_msg: >-
          destroy_guest=true requires delete_data=true and a native app instance that
          resolves to its matching inventory guest, or an already absent registered
          database backend for registry cleanup; Docker stack hosts, appliances and
          Kubernetes nodes cannot be destroyed through Remove App.
      when: destroy_guest | default(false) | bool

    - name: Verify ownership and non-shared tags before unwiring
      ansible.builtin.assert:
        that:
          - hostvars[_rm_destroy_guest_host].proxmox_vmtype | default('') in ['lxc', 'qemu']
          - hostvars[_rm_destroy_guest_host].proxmox_vmid | default(0) | int > 0
          - hostvars[_rm_destroy_guest_host].proxmox_name | default(_rm_destroy_guest_host, true) == instance
          - "'_+lab' in (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([]))"
          - "('_' ~ instance) in (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([]))"
          - "'_.shared' not in (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([]))"
          - >-
            (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([])
             | select('match', '^_[.]stack[+]') | list | length) == 0
          - >-
            (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([])
             | select('match', '^_[.]cluster[+]') | list | length) == 0
          - >-
            (hostvars[_rm_destroy_guest_host].proxmox_tags_parsed | default([])
             | select('match', '^_[A-Za-z0-9]')
             | reject('equalto', '_' ~ instance) | list | length) == 0
        fail_msg: >-
          Refusing destroy_guest=true because the native instance does not resolve to its
          own LXC or VM with the _+lab ownership tag and exact instance tag.
      when:
        - destroy_guest | default(false) | bool
        - _rm_destroy_guest_host | length > 0

    - name: Record the verified guest identity for the final destroy check
      ansible.builtin.set_fact:
        _rm_destroy_guest_name: "{{ hostvars[_rm_destroy_guest_host].proxmox_name | default(_rm_destroy_guest_host, true) }}"
        _rm_destroy_guest_vmid: "{{ hostvars[_rm_destroy_guest_host].proxmox_vmid }}"
        _rm_destroy_guest_node: "{{ hostvars[_rm_destroy_guest_host].proxmox_node }}"
        _rm_destroy_guest_tags: "{{ hostvars[_rm_destroy_guest_host].proxmox_tags_parsed }}"
      when:
        - destroy_guest | default(false) | bool
        - _rm_destroy_guest_host | length > 0

  vars:
    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # Unwire tasks read the same variable names the wire halves do. They need only
    # the identity of the app (name + domain) — no upstream host or port, which is
    # what lets removal work even when the guest is already gone.
    wiring_app_name: "{{ instance }}"
    wiring_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain | default('invalid') }}"
    # Remove App stops PostgreSQL and may drop its cluster, but it deliberately keeps the
    # guest. Keep the guest's app row/tag as its deployment identity so PostgreSQL Deploy
    # reuses that LXC instead of refusing it at the creation seam as an unrecorded guest.
    _rm_preserve_guest_identity: >-
      {{ _rm_kind == 'native' and (app | default(instance)) == 'postgresql' }}

  tasks:
    - name: Unwire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/unwiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    # Unconditional on routing.identity, unlike the wire half: one pass removes
    # whichever shape exists, so an instance whose identity mode changed between
    # deploys still gets its stale Authentik objects cleaned up.
    - name: Unwire SSO
      ansible.builtin.include_tasks: ../../tasks/unwiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - homelabinfra_infra.sso.token | default('') | length > 0
        # Authentik is the identity provider, with routing.identity=none. Removing an
        # Authentik instance must not send its slug to another provider's API, where an
        # unrelated same-named application could be deleted.
        - not ((app | default(instance)) is match('^authentik(?:-|$)'))

    - name: Unregister uptime monitor
      ansible.builtin.include_tasks: ../../tasks/unwiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Unwire DNS
      ansible.builtin.include_tasks: "../../tasks/unwiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Unwire firewall
      ansible.builtin.include_tasks: "../../tasks/unwiring/firewall-{{ homelabinfra_infra.firewall.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.firewall is defined
        - homelabinfra_infra.firewall.provider | default('none') != 'none'

    # The runner is an app-to-app registration, not a proxy route. Remove exactly this
    # named registration while its Forgejo API credential still exists; the shared
    # Forgejo instance and all other runners are left untouched.
    - name: Deregister Forgejo Runner
      ansible.builtin.include_tasks: ../../tasks/app-wiring/forgejo-runner-remove.yml
      vars:
        runner_remove_instance: "{{ instance }}"
        runner_remove_forgejo_instance: "{{ app_config.app.forgejo.instance }}"
      when:
        - (app | default(instance)) == 'forgejo-runner'
        - homelabinfra_infra is defined
        - homelabinfra_infra.apps is defined

    # After the provider unwiring, deliberately: the registry is what the unwire steps
    # above read to find those providers, so pruning it first would remove the app's own
    # entry while the reverse proxy and DNS still carried its route.
    - name: Withdraw SABnzbd from deployed Usenet consumers
      ansible.builtin.include_tasks: ../../tasks/unwiring/sabnzbd-clients.yml
      when: (app | default(instance)) == 'sabnzbd'

    - name: Withdraw qBittorrent from its deployed consumers
      ansible.builtin.include_tasks: ../../tasks/unwiring/qbittorrent-clients.yml
      when: (app | default(instance)) == 'qbittorrent'

    - name: Unregister from the service registry
      ansible.builtin.include_tasks: ../../tasks/unwiring/registry.yml
      vars:
        unwire_registry_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"

    # ── Locate the host that runs the app ──────────────────────────────────────
    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory

    # `hosting.method` selects the app contract. Docker and native are still told apart by
    # the presence of `stack:` for the host target. An ISO appliance has no SSH service
    # contract, so it is stopped through
    # Proxmox rather than being treated as a native LXC.
    #
    # A Kubernetes app has NO Proxmox guest of its own. Its resources live in a namespace
    # on a cluster that outlives it, so `_rm_hosts` is deliberately empty: Play 2, which
    # stops a container or a systemd unit on a guest, has nothing to do and is skipped.
    # The cluster-side removal happens in the unwiring step below.
    # The stack host an estate-scoped app runs on carries its estate, exactly as the
    # deploy resolved it: `media` is `stack-media-foxglove` in a lab with two estates and
    # plain `stack-media` in a lab with one. A stack that declares `shared: true` is the
    # single lab-wide host for every estate and takes no suffix.
    - name: Load stack sizing defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vars/stack-defaults.yml"
        name: _rm_stack_defaults_file

    - name: Resolve the stack identity this app was placed on
      ansible.builtin.set_fact:
        _rm_stack_id: >-
          {{ (app_config.stack | default(''))
             if (_rm_stack_sizing.shared | default(false) | bool) or _rm_estates | length < 2
             else (app_config.stack | default('')) ~ '-' ~ _rm_estate }}
      vars:
        _rm_estates: "{{ (homelabinfra_config.infrastructure | default({})).domains | default({}) }}"
        _rm_stack_sizing: >-
          {{ ((_rm_stack_defaults_file.stack_defaults | default({}))[app_config.stack | default('')] | default({}))
             | combine(((homelabinfra_config.infrastructure | default({})).stacks | default({}))[app_config.stack | default('')]
                       | default({}), recursive=True) }}
        _rm_default_estate: >-
          {{ ((_rm_estates | dict2items
               | selectattr('value.default', 'defined') | selectattr('value.default')
               | map(attribute='key') | list) | first)
             | default(_rm_estates | list | first | default(''), true) }}
        _rm_estate: >-
          {{ ((app_config.routing | default({})).estate | default('', true)) or _rm_default_estate }}

    # Removal resolves a shared Docker stack through the SAME estate-aware identity the
    # deploy used. Docker-on-VM apps have no stack tag; their own VM carries _<instance>,
    # so removal never creates a host while trying to empty it.
    - name: Resolve the stack host's inventory group
      ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars:
        tag_group_tag: "_.stack+{{ _rm_stack_id }}"
      when:
        - _rm_kind == 'docker'
        - app_config.stack | default('') | length > 0

    - name: Resolve the Docker-on-VM inventory group
      ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars:
        tag_group_tag: "_{{ instance }}"
      when:
        - _rm_kind == 'docker'
        - app_config.stack | default('') | length == 0

    - name: Select the host running the app
      ansible.builtin.set_fact:
        _rm_hosts: >-
          {{ []
             if _rm_kind in ['kubernetes', 'appliance']
             else (groups[tag_group_name] | default([])
                   if _rm_kind == 'docker'
                   else ([instance] if instance in (groups['all'] | default([])) else [])) }}

    # A GPU assignment belongs to the stack host. Removing one GPU-backed app may detach
    # it only when no sibling app remains on that host; shared media stacks keep the device
    # for their other applications.
    - name: Resolve whether this stack host still has sibling applications
      ansible.builtin.set_fact:
        _rm_stack_has_other_apps: >-
          {{ (hostvars[_rm_hosts[0]].proxmox_tags_parsed | default([])
              | select('match', '^_[A-Za-z0-9]')
              | reject('equalto', '_' ~ instance) | list | length) > 0 }}
      when:
        - _rm_kind == 'docker'
        - app_config.stack | default('', true) | length > 0
        - _rm_hosts | length > 0

    - name: Resolve the Proxmox node for the app guest
      ansible.builtin.set_fact:
        _rm_guest_node: "{{ hostvars[_rm_hosts[0]].proxmox_node | default('') }}"
      when: _rm_hosts | length > 0

    - name: Require the app guest's Proxmox node
      ansible.builtin.assert:
        that: _rm_guest_node | length > 0
        fail_msg: >-
          Proxmox inventory did not provide the node for {{ _rm_hosts[0] }}. Removal of
          node-local device assignments requires the guest's actual node.
      when: _rm_hosts | length > 0

    - name: Use the app guest's Proxmox node for removal operations
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config | combine({'proxmox': {'node': _rm_guest_node}}, recursive=True) }}
      when: _rm_hosts | length > 0

    # This is the Kubernetes equivalent of Play 2's compose-down, and it sits here because
    # there is no guest for Play 2 to run on. It runs AFTER the unwiring above, which is
    # this playbook's deliberate order: the route is withdrawn and the uptime monitor is
    # deleted while the app still answers, so traffic drains and the removal does not page
    # the operator. Stopping first would invert both.
    - name: Remove the app's Kubernetes resources
      ansible.builtin.include_tasks: ../../tasks/unwiring/kubernetes.yml
      vars:
        unwire_delete_data: "{{ delete_data | default(false) | bool }}"
      when: _rm_kind == 'kubernetes'

    # DEGRADATION BY DESIGN — and in fact not a degradation at all: a host that is not
    # there is the success case for a removal. The guest may already be gone, or never
    # have existed. The unwiring above still ran, which is the part that leaves stale
    # state behind. Do not convert this to tasks/report-degradation.yml.
    - name: Report a missing host
      ansible.builtin.debug:
        msg: >-
          No {{ ('stack host tagged _.stack+' ~ _rm_stack_id
                  if app_config.stack | default('') | length > 0
                  else 'Docker-on-VM guest tagged _' ~ instance)
                if _rm_kind == 'docker'
                else 'Proxmox guest named ' ~ instance }} is in inventory —
          nothing to stop. Unwiring completed; {{ instance }} is fully removed.
      when: _rm_hosts | length == 0

    # Keep the app identity on localhost. Passing conditional Jinja expressions as
    # add_host vars defers their evaluation until the remote host context, where `app`
    # and `instance` can resolve to unrelated inventory values.
    - name: Resolve removal identity for the app host
      ansible.builtin.set_fact:
        _rm_app_name: "{{ app | default(instance) }}"

    - name: Add the app host to the removal group
      ansible.builtin.add_host:
        name: "{{ _rm_hosts[0] }}"
        groups: "remove_{{ instance }}"
        ansible_host: >-
          {{ hostvars[_rm_hosts[0]].ansible_host
             | default(hostvars[_rm_hosts[0]].ansible_default_ipv4.address | default('')) }}
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        proxmox_vmtype: "{{ hostvars[_rm_hosts[0]].proxmox_vmtype }}"
        proxmox_node: "{{ _rm_guest_node }}"
        remove_destroy_guest: "{{ destroy_guest | default(false) | bool }}"
        remove_guest_name: >-
          {{ _rm_destroy_guest_name | default(
               hostvars[_rm_hosts[0]].proxmox_name | default(_rm_hosts[0], true), true) }}
        remove_guest_vmid: >-
          {{ _rm_destroy_guest_vmid | default(hostvars[_rm_hosts[0]].proxmox_vmid | default(0), true) }}
        remove_guest_node: >-
          {{ _rm_destroy_guest_node | default(_rm_guest_node, true) }}
        remove_guest_original_tags: >-
          {{ _rm_destroy_guest_tags | default(
               hostvars[_rm_hosts[0]].proxmox_tags_parsed | default([]), true) }}
        app_config: "{{ app_config }}"
        homelabinfra_config: "{{ homelabinfra_config }}"
        remove_kind: "{{ _rm_kind }}"
      when: _rm_hosts | length > 0
      # Inventory bookkeeping, not a lab change — the same reason
      # tasks/stack/find-or-create-host.yml marks its add_host unchanged. Without
      # this, a second Remove App on an already-removed app reports changed=1 with
      # every unwiring step skipped, and "a re-run is a clean no-op" cannot be read
      # off the recap (execution 171, 2026-08-16).
      changed_when: false

    # Withdrawn here rather than beside the other unwiring steps, because this is the
    # only point in the play that knows WHICH guest ran the app - _rm_hosts resolves the
    # shared stack host and the native app's own LXC through the same lookup, so the
    # withdrawal does not have to re-derive that distinction and get it subtly wrong.
    # A Kubernetes app has no guest of its own, so `_rm_hosts` is empty — but the deploy
    # stamped it on every node of the cluster, and the withdrawal has to reach exactly the
    # same set. Withdrawing from one node would leave the other two claiming to host an app
    # that no longer exists.
    # This runs before Play 2 stops the service and tears down PostgreSQL's cluster. A
    # PostgreSQL guest survives Remove App, so retain its record/tag for that whole time;
    # its next Deploy will find the same owned guest and create a fresh cluster if needed.
    - name: Withdraw the app's record from its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/unwiring/guest-record.yml
      vars:
        record_guest_names: >-
          {{ ((homelabinfra_infra.kubernetes | default({})).nodes | default([])
              | map(attribute='name') | list)
             if _rm_kind == 'kubernetes'
             else ([instance] if _rm_kind == 'appliance' else _rm_hosts[:1]) }}
      when:
        - _rm_hosts | length > 0 or _rm_kind in ['kubernetes', 'appliance']
        - not (_rm_preserve_guest_identity | bool)

    - name: Stop an ISO appliance through Proxmox
      ansible.builtin.command:
        argv: [qm, shutdown, "{{ app_config.proxmox.vm.vmid }}"]
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      register: _rm_appliance_shutdown
      changed_when: _rm_appliance_shutdown.rc == 0
      failed_when:
        - _rm_appliance_shutdown.rc != 0
        - "'not running' not in (_rm_appliance_shutdown.stderr | lower)"
      when: _rm_kind == 'appliance'


# ── Play 2: Stop and remove the app ────────────────────────────────────────────
# Empty group when Play 1 found no host — the play is then skipped entirely,
# which is what makes a second `remove` run a clean no-op.
# The default() can only fire during --syntax-check — Play 1 has already asserted
# `instance` is defined by the time this pattern is resolved for real.
- name: "Remove App | Stop {{ instance | default('(no instance)') }}"
  hosts: "remove_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: false

  vars:
    _rm_delete_data: "{{ delete_data | default(false) | bool }}"
    _rm_destroy_guest: "{{ remove_destroy_guest | default(false) | bool }}"
    _rm_project_dir: "/opt/{{ instance }}"
    _rm_is_postgresql: "{{ (app | default(instance)) == 'postgresql' }}"

  pre_tasks:
    # PostgreSQL's instantiated unit is derived from the cluster configuration
    # and is not reliably listed by systemctl list-unit-files. Discover the
    # cluster before removal so a legacy PostgreSQL 15 guest is stopped before
    # delete_data can remove its files.
    - name: Discover PostgreSQL clusters
      ansible.builtin.command:
        argv:
          - pg_lsclusters
          - --no-header
      register: _rm_postgresql_clusters
      failed_when: false
      changed_when: false
      when:
        - remove_kind == 'native'
        - _rm_is_postgresql | bool

    - name: Resolve every PostgreSQL cluster removal unit
      ansible.builtin.set_fact:
        _rm_service_names: "{{ _rm_service_names | default([]) + ['postgresql@' ~ _rm_postgresql_cluster[0] ~ '-' ~ _rm_postgresql_cluster[1]] }}"
      vars:
        _rm_postgresql_cluster: "{{ item | split() }}"
      loop: >-
        {{ _rm_postgresql_clusters.stdout_lines | default([])
           | select('match', '^[0-9]+[ ]+') | list }}
      when:
        - remove_kind == 'native'
        - _rm_is_postgresql | bool

    - name: Fall back to the configured PostgreSQL removal unit
      ansible.builtin.set_fact:
        _rm_service_names:
          - "postgresql@{{ app_config.app.version | default('16') }}-main"
      when:
        - remove_kind == 'native'
        - _rm_is_postgresql | bool
        - _rm_service_names | default([]) | length == 0

    - name: Resolve the ordinary native removal unit
      ansible.builtin.set_fact:
        _rm_service_names:
          - "{{ app_config.app.service_name | default(instance) }}"
      when:
        - remove_kind == 'native'
        - not (_rm_is_postgresql | bool)

  tasks:
    # ── Docker app on a shared stack host ──────────────────────────────────────
    - name: Remove the Compose project
      when: remove_kind == 'docker'
      block:
        - name: Stat the Compose file
          ansible.builtin.stat:
            path: "{{ _rm_project_dir }}/docker-compose.yml"
          register: _rm_compose_stat

        - name: Report an already-removed Compose project
          ansible.builtin.debug:
            msg: "{{ _rm_project_dir }}/docker-compose.yml is already gone — nothing to stop."
          when: not _rm_compose_stat.stat.exists

        - name: Stop and remove the containers
          community.docker.docker_compose_v2:
            project_src: "{{ _rm_project_dir }}"
            # Exited init services still belong to the project. Without their profiles,
            # down can leave containers referencing the network it just removed.
            profiles: ["*"]
            state: absent
            remove_volumes: "{{ _rm_delete_data | bool }}"
            remove_orphans: true
          when: _rm_compose_stat.stat.exists

        # Immich's library lives outside Compose. Its dedicated removal tasks run only
        # after the app containers have stopped; Play 4 drops its named database.
        - name: Remove Immich's durable media
          ansible.builtin.include_tasks: ../../roles/immich/tasks/remove.yml
          when:
            - hostvars['localhost']._rm_app_name == 'immich'
            - _rm_delete_data | bool

        # A stopped runner must not leave a registration token or the local registration
        # marker behind. Removing these files even when delete_data is false makes a later
        # deploy perform a fresh, token-backed registration after the API deregistration.
        - name: Remove Forgejo Runner registration state
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ app_config.app.registration_config_path | default(_rm_project_dir ~ '/data/runner-config.yml') }}"
            - "{{ app_config.app.registration_marker_path | default(_rm_project_dir ~ '/data/.homelab-infra-registered') }}"
            - "{{ app_config.app.registration_env_path | default(_rm_project_dir ~ '/runner.env') }}"
          when: hostvars['localhost']._rm_app_name == 'forgejo-runner'

        # BookStack's application-consistent backup timer and its root-only runtime
        # credential copy live outside /opt/<instance>. Remove both on every BookStack
        # removal, even when delete_data is false, so an unwired application cannot keep
        # stopping the shared stack host and writing snapshots after it was removed.
        - name: Remove BookStack recovery schedule
          ansible.builtin.cron:
            name: "homelab-infra BookStack backup {{ instance }}"
            cron_file: "homelab-infra-bookstack-{{ instance }}"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'bookstack'

        - name: Remove BookStack recovery configuration
          ansible.builtin.file:
            path: "/etc/homelab-infra/bookstack/{{ instance }}.env"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'bookstack'

        # WordPress's application-consistent backup timer and root-only runtime
        # credential copy live outside /opt/<instance>. Remove both on every WordPress
        # removal, even when delete_data is false, so an unwired application cannot keep
        # stopping the shared stack host and writing snapshots after it was removed.
        - name: Remove WordPress recovery schedule
          ansible.builtin.cron:
            name: "homelab-infra WordPress backup {{ instance }}"
            cron_file: "homelab-infra-wordpress-{{ instance }}"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'wordpress'

        - name: Remove WordPress recovery configuration
          ansible.builtin.file:
            path: "/etc/homelab-infra/wordpress/{{ instance }}.env"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'wordpress'

        # Plane's native backup timer and root-only configuration also live outside
        # /opt/<instance>. Remove the per-instance state while retaining its shared helper.
        - name: Remove Plane recovery schedule
          ansible.builtin.cron:
            name: "homelab-infra Plane backup {{ instance }}"
            cron_file: "homelab-infra-plane-{{ instance }}"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'plane'

        - name: Remove Plane recovery configuration
          ansible.builtin.file:
            path: "/etc/homelab-infra/plane/{{ instance }}.env"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'plane'

        # Open WebUI's backup timer and root-only configuration live outside /opt/<instance>
        # in the same way.
        - name: Remove Open WebUI recovery schedule
          ansible.builtin.cron:
            name: "homelab-infra Open WebUI backup {{ instance }}"
            cron_file: "homelab-infra-open-webui-{{ instance }}"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'open-webui'

        - name: Remove Open WebUI recovery configuration
          ansible.builtin.file:
            path: "/etc/homelab-infra/open-webui/{{ instance }}.env"
            state: absent
          when: hostvars['localhost']._rm_app_name == 'open-webui'

        # The shared PBS client's root-only settings (tasks/backup/pbs-client-script.yml)
        # hold the PBS credentials for this instance's recovery script; they go with it.
        - name: Remove the instance's PBS client settings
          ansible.builtin.file:
            path: "/etc/homelab-infra/pbs-client/{{ instance }}.env"
            state: absent

        - name: Delete the project directory
          ansible.builtin.file:
            path: "{{ _rm_project_dir }}"
            state: absent
          when: _rm_delete_data | bool

        # A bind-mounted data path is neither a named volume nor part of the project
        # directory, so neither of the two tasks above touches it. Older app defaults
        # hard-coded the app name (`/opt/authentik/data`) while the project directory
        # is `/opt/<instance>`, which put the app's whole database outside everything
        # removal deleted: `delete_data: true` reported success and the data survived.
        # The next deploy then generated fresh credentials the surviving database did
        # not accept, and Authentik never came up (executions 153 then 155).
        # `state: absent` on a path already gone is a no-op, so this is safe for apps
        # whose data does live under the project directory.
        - name: Delete bind-mounted data and config paths
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ app_config.app.data_path | default('') }}"
            - "{{ app_config.app.config_path | default('') }}"
          when:
            - _rm_delete_data | bool
            - item | length > 0

    # Home Assistant's USB coordinator is a dedicated VM mapping. Detach it only after
    # Compose has stopped and only when the USB seam can prove this platform created the
    # mapping; an untagged operator assignment remains in place for manual recovery.
    - name: Detach Home Assistant's project-owned Zigbee USB mapping
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-usb-passthrough.yml
      vars:
        usb_passthrough_guest: "{{ inventory_hostname }}"
        usb_passthrough_device:
          mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
      when:
        - remove_kind == 'docker'
        - hostvars['localhost']._rm_app_name == 'home-assistant'
        - app_config.app.usb_mapping | default('', true) | length > 0

    # These dedicated assignments are detached only after their app's containers stop.
    # Stack devices are detached only for the two one-app GPU stacks; media stack GPUs may
    # still be used by another app on the shared VM.
    - name: Detach ComfyUI's project-owned PCI GPU
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-pci-passthrough.yml
      vars:
        pci_passthrough_guest: "{{ inventory_hostname }}"
        pci_passthrough_device:
          id: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].identifiers
               | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
               | list | first }}
          mapping: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pci_mapping
               | default(app_config.app.gpu_device) }}
      when:
        - remove_kind == 'docker'
        - hostvars['localhost']._rm_app_name == 'comfyui'
        - app_config.app.gpu_device | default('') | length > 0

    # Ollama's GPU is a dedicated PCI assignment. Detach it only after the Compose
    # service has stopped, and only when the passthrough seam can prove this platform
    # created the exact hostpciN entry. An untagged operator assignment remains in place.
    - name: Detach Ollama's project-owned PCI GPU
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-pci-passthrough.yml
      vars:
        pci_passthrough_guest: "{{ inventory_hostname }}"
        pci_passthrough_device:
          id: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].identifiers
               | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
               | list | first }}
          mapping: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pci_mapping
               | default(app_config.app.gpu_device) }}
      when:
        - remove_kind == 'docker'
        - hostvars['localhost']._rm_app_name == 'ollama'
        - app_config.app.gpu_device | default('') | length > 0

    - name: Detach Frigate's project-owned PCI iGPU
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-pci-passthrough.yml
      vars:
        pci_passthrough_guest: "{{ inventory_hostname }}"
        pci_passthrough_device:
          id: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].identifiers
               | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
               | list | first }}
          mapping: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pci_mapping
               | default(app_config.app.gpu_device) }}
      when:
        - remove_kind == 'docker'
        - (remove_app | default(instance)) == 'frigate'
        - app_config.app.gpu_device | default('') | length > 0
        - not (hostvars['localhost']._rm_stack_has_other_apps | default(false) | bool)

    - name: Detach Frigate's project-owned Coral USB mapping
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-usb-passthrough.yml
      vars:
        usb_passthrough_guest: "{{ inventory_hostname }}"
        usb_passthrough_device:
          mapping: "{{ app_config.app.coral_usb_mapping }}"
      when:
        - remove_kind == 'docker'
        - (remove_app | default(instance)) == 'frigate'
        - app_config.app.coral_usb_mapping | default('') | length > 0

    - name: Detach Immich's project-owned PCI iGPU
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-pci-passthrough.yml
      vars:
        pci_passthrough_guest: "{{ inventory_hostname }}"
        pci_passthrough_device:
          id: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].identifiers
               | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
               | list | first }}
          mapping: >-
            {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pci_mapping
               | default(app_config.app.gpu_device) }}
      when:
        - remove_kind == 'docker'
        - (remove_app | default(instance)) == 'immich'
        - app_config.app.gpu_device | default('') | length > 0
        - not (hostvars['localhost']._rm_stack_has_other_apps | default(false) | bool)

    # Legacy shared device declarations remain accepted for non-GPU users. GPU-capable
    # apps no longer call this LXC bind seam.
    - name: Detach the app's project-owned shared device
      ansible.builtin.include_tasks: ../../tasks/proxmox/detach-shared-device.yml
      vars:
        shared_device_guest: "{{ inventory_hostname }}"
        shared_device_list:
          - host: "{{ app_config.app.shared_device }}"
      when:
        - remove_kind == 'docker'
        - app_config.app.shared_device | default('') | length > 0

    # ── Native app on its own LXC ──────────────────────────────────────────────
    - name: Stop the native service
      when: remove_kind == 'native'
      block:
        # app.service_name is declared in vars/app-defaults/<app>.yml for every
        # native baseline app, because a unit name does not always match the app
        # (PBS runs proxmox-backup-proxy). The instance name is the fallback.
        - name: Stop and disable every service unit
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
            enabled: false
          register: _rm_service_stop
          loop: "{{ _rm_service_names | default([]) }}"
          failed_when:
            - _rm_service_stop is failed
            - >-
              'could not be found' not in (_rm_service_stop.msg | default('') | lower)
              and 'could not find the requested service' not in
              (_rm_service_stop.msg | default('') | lower)

        - name: Report an already-removed service
          ansible.builtin.debug:
            msg: >-
              No systemd unit named
              {{ item.item }} on
              {{ inventory_hostname }} — nothing to stop.
          loop: "{{ _rm_service_stop.results | default([]) }}"
          when: >-
            'could not be found' in (item.msg | default('') | lower)
            or 'could not find the requested service' in
            (item.msg | default('') | lower)

        # PostgreSQL's data directory is not the cluster's whole identity: Debian keeps
        # its cluster registration and configuration under /etc/postgresql. Drop each
        # discovered cluster before deleting the parent data path, so a later Deploy can
        # create a fresh main cluster even when the server package remains installed.
        - name: Require PostgreSQL cluster discovery before deleting its data
          ansible.builtin.assert:
            that: _rm_postgresql_clusters.rc == 0
            fail_msg: >-
              Could not enumerate PostgreSQL clusters safely. No PostgreSQL data or
              cluster configuration was deleted.
          when:
            - _rm_is_postgresql | bool
            - _rm_delete_data | bool

        - name: Drop PostgreSQL clusters with their configuration when deleting data
          ansible.builtin.command:
            argv:
              - pg_dropcluster
              - --stop
              - "{{ _rm_postgresql_cluster[0] }}"
              - "{{ _rm_postgresql_cluster[1] }}"
          vars:
            _rm_postgresql_cluster: "{{ item | split() }}"
          loop: >-
            {{ _rm_postgresql_clusters.stdout_lines | default([])
               | select('match', '^[0-9]+[ ]+') | list }}
          when:
            - _rm_is_postgresql | bool
            - _rm_delete_data | bool
          changed_when: true

        # A native app's recovery unit can span more than data_path (Ntfy keeps its
        # message cache in cache_path), so delete every declared state path.
        - name: Delete the data and cache paths
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ app_config.app.data_path | default('') }}"
            - "{{ app_config.app.cache_path | default('') }}"
          when:
            - _rm_delete_data | bool
            - item | length > 0

    - name: Destroy the explicitly selected native LXC
      ansible.builtin.include_tasks: ../../tasks/proxmox/destroy-owned-lxc.yml
      vars:
        destroy_lxc_instance: "{{ instance }}"
        destroy_lxc_name: "{{ remove_guest_name }}"
        destroy_lxc_node: "{{ remove_guest_node }}"
        destroy_lxc_vmid: "{{ remove_guest_vmid }}"
        destroy_lxc_original_tags: "{{ remove_guest_original_tags }}"
      when:
        - _rm_destroy_guest | bool
        - _rm_delete_data | bool
        - remove_kind == 'native'
        - proxmox_vmtype == 'lxc'

    - name: Destroy the explicitly selected native VM
      ansible.builtin.include_tasks: ../../tasks/proxmox/destroy-owned-vm.yml
      vars:
        destroy_vm_instance: "{{ instance }}"
        destroy_vm_name: "{{ remove_guest_name }}"
        destroy_vm_node: "{{ remove_guest_node }}"
        destroy_vm_vmid: "{{ remove_guest_vmid }}"
        destroy_vm_original_tags: "{{ remove_guest_original_tags }}"
      when:
        - _rm_destroy_guest | bool
        - _rm_delete_data | bool
        - remove_kind == 'native'
        - proxmox_vmtype == 'qemu'


# ── Play 3: Forget a destroyed database backend after its guest is gone ────────
- name: "Remove Database Backend | Unregister destroyed backend"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Forget the destroyed database backend's generated registry entry
      ansible.builtin.include_tasks: ../../tasks/unwiring/registry.yml
      vars:
        unwire_registry_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        unwire_registry_database_backend: true
      when:
        - delete_data | default(false) | bool
        - destroy_guest | default(false) | bool
        - (app | default(instance)) in ['influxdb', 'mariadb', 'mysql', 'postgresql', 'redis']

# ── Play 4: Drop the app's named database from its registered backend ──────────
# Runs on the controller after Play 2 has stopped the app (or found its guest already
# gone) and after Play 1 removed a Kubernetes namespace. tasks/database/drop.yml rechecks
# ownership and delegates to the backend guest, which survives Remove App.
- name: "Remove App | Drop its named database"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Drop the app's named database and login
      ansible.builtin.include_tasks: ../../tasks/database/drop.yml
      vars:
        database_app_instance: "{{ instance }}"
        database_app_config: "{{ app_config.app.database }}"
      when: _rm_drops_database | default(false) | bool

- name: "Remove App | Notify"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # absent pre-bootstrap — notify.yml no-ops

  tasks:
    - name: Notify removal complete
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ instance }} removed"
        notify_message: >-
          {{ instance }} was stopped and unwired from the reverse proxy, SSO,
