---
# Deploy Lidarr — music management. Docker on the media stack host, or on Kubernetes when
# `hosting.method: kubernetes`. A Kubernetes instance has no stack host, so it records no
# media registry entry and Wire Media Stack does not discover it.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/lidarr.yml -e instance=lidarr
#   ansible-playbook -i inventory/ playbooks/apps/lidarr.yml -e instance=lidarr-lossless
#
# `instance` names the deployment (hostname, Caddy subdomain, Authentik slug, Kuma
# monitor); config/apps/<instance>.yml is merged over the defaults.
# Play 3 records the `media` registry key (CONTRACT.md §3) that wire-media-stack.yml reads.
# Drives the shared `servarr` role (roles/servarr/tasks/main.yml says why).
- name: "Lidarr | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=lidarr (or lidarr-lossless for a second instance)"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/lidarr.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.lidarr_defaults
             | combine({'media_storage':
                        homelabinfra_config.infrastructure.media_storage | default({})},
                       recursive=True)
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: lidarr

    # The workload's ingress host must be the estate's published hostname.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published Lidarr hostname
      ansible.builtin.set_fact:
        servarr_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain
             | default(homelabinfra_config.infrastructure.domain) }}
  tasks:
    # The stack host is found (or created) by tag. The app is deployed in Play 2.
    - name: Find or create stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    # The lab's library and download directories are already mounted on the Proxmox
    # node; this attaches them to the stack host at the same paths.
    - name: Resolve the storage this app needs on the stack host
      ansible.builtin.set_fact:
        _servarr_host_mounts: >-
          {{ app_config.app.mounts
             | default([] if (app_config.app.library_subpath | default('') | length == 0)
                       else ((app_config.media_storage | default({})).mounts | default([])),
                       true) }}

    - name: Attach the lab's storage to the stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/attach-host-mounts.yml
      vars:
        attach_mounts_guest: "{{ homelabinfra_instance.stack.hostname }}"
        attach_mounts_list: "{{ _servarr_host_mounts }}"
        attach_mounts_owner: "{{ (app_config.media_storage | default({})).owner | default({}) }}"
      when:
        - app_config.hosting.method == 'docker'
        - _servarr_host_mounts | length > 0

- name: "Lidarr | Prepare Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Resolve Lidarr's existing media shares and library folder for Kubernetes
      ansible.builtin.include_role:
        name: servarr
        tasks_from: kubernetes-media
      when: app_config.hosting.method == 'kubernetes'
    - name: Refresh inventory for cluster access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'
    - name: Open Lidarr's declared access from the Kubernetes node alias
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the stack host to install and configure Lidarr.
- name: "Lidarr | Deploy"
  # Per-instance group: a shared one would accumulate every earlier app's guest.
  # The default() can only fire during --syntax-check.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # Unconditional, so a baseline guest gets its Ntfy hook once Ntfy is up.
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    # Unconditional: "created in this run" is not "has Docker".
    - name: Ensure Docker is installed on the stack host
      ansible.builtin.include_role:
        name: docker

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy Lidarr
      ansible.builtin.include_role:
        name: servarr


- name: "Lidarr | Deploy on Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Deploy Lidarr into its Kubernetes namespace
      ansible.builtin.include_role:
        name: servarr
      when: app_config.hosting.method == 'kubernetes'


# Play 3: record the media registry entry, then wire platform services (idempotent).
- name: "Lidarr | Record facts and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # Absent pre-bootstrap: every provider condition below then no-ops.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # The `media` key is instance-keyed (CONTRACT.md §3). Topology only — the API key
    # lives in homelab-infra/media/<instance>, written by the role.
    - name: Record the media registry entry
      when: not (_lidarr_k8s | bool)
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: media
        # An expression, never a literal `"{{ instance }}":` key: Ansible does not
        # template a mapping key, so every app would overwrite one nameless entry.
        generated_facts_data: >-
          {{ {instance: {'app': _lidarr_deploy_host.servarr_media_kind,
                         'host': _lidarr_deploy_host.servarr_media_host,
                         'config_path': _lidarr_deploy_host.servarr_media_config_path}} }}

    # Belt-and-braces: include_vars cannot override the entry already merged by set_fact.
    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Overlay estate-scoped facts (domain, sso, dns) for the app's routing.estate.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _lidarr_cfg.routing.estate | default('') }}"

  vars:
    _lidarr_k8s: "{{ hostvars['localhost'].app_config.hosting.method == 'kubernetes' }}"
    _lidarr_cfg: "{{ hostvars['localhost'].app_config }}"
    _lidarr_deploy_host: >-
      {{ {} if _lidarr_k8s | bool else hostvars[groups['deploy_' ~ instance][0]] }}

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Do not rename them.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _lidarr_k8s | bool
         else _lidarr_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _lidarr_k8s | bool else _lidarr_cfg.app.port }}"
    wiring_subdomain: "{{ _lidarr_cfg.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Lidarr ({{ instance }})"
    # /ping is Servarr's own unauthenticated liveness endpoint.
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/ping"
    wiring_auth_group: "homelab-users"   # Authentik group granted access
    # forward_auth: the app runs AuthenticationMethod External (vars/app-defaults/lidarr.yml).
    wiring_identity_mode: "{{ _lidarr_cfg.routing.identity | default('forward_auth') }}"
    wiring_access: "{{ _lidarr_cfg.routing.access | default('internal') }}"

  tasks:
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    # Bookkeeping: stamps this instance onto the Proxmox guest.
    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      when: not (_lidarr_k8s | bool)

    - name: Record Lidarr on the Kubernetes nodes
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ homelabinfra_infra.kubernetes.nodes | default([]) | map(attribute='name') | list }}
        record_guest_kind: kubernetes
        record_guest_url: "https://{{ wiring_domain }}/"
      when: _lidarr_k8s | bool

    # App-to-app wiring belongs to playbooks/stacks/wire-media-stack.yml, which finds
    # this app through the registry entry written above.
    - name: Report how to wire this app into the media stack
      ansible.builtin.debug:
        msg: >-
          {{ instance }} is registered in the media registry. Run the Wire Media
          Stack job to connect it to Prowlarr, the download clients and Bazarr.
      when: not (_lidarr_k8s | bool)

    # Last task: wiring records what it could not do; this stops the run reporting success.
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
