---
# Deploy Caddy — the default reverse proxy (bootstrap step 3).
# Native LXC (default): dedicated container, official apt repo, JSON admin API
# configuration (see the role header for why there is no Caddyfile). With
# `hosting.method: docker` and `stack: <name>` (guest_type lxc or vm) Caddy runs as a
# host-network container on that stack host instead; keep the stack dedicated to Caddy,
# which binds the host's 80, 443 and admin port.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/caddy.yml -e instance=caddy
#
# The `instance` parameter is the unique name for this deployment.
# It becomes the hostname, Caddy subdomain, Authentik app slug, and Uptime Kuma monitor name.
# If the user has a config/apps/<instance>.yml, it is loaded and merged over defaults.
#
# Play 3 records the `reverse_proxy` registry key (CONTRACT.md §3) BEFORE wiring, so
# a standalone deploy registers Caddy exactly as a bootstrap run does. Every later
# app deploy reads host + port from there to POST its route.
# After Caddy records its new admin endpoint, it also discovers every deployed app tag
# and replays the shared Caddy route task. Bootstrap imports this playbook, so both
# entry points restore routes after a fresh Caddy guest.
#
# Caddy does not route itself: app-defaults set routing.proxy: none, and the reverse
# proxy wiring step below is gated on that.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Runs on localhost against the Proxmox API to provision or locate the guest. The node-local
# pct waits inside lxc-create.yml delegate to homelabinfra_config.proxmox.node.
# Adds the target host to a group for Play 2 to use.
- name: "Caddy | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=caddy"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/caddy.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.caddy_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: caddy
  tasks:
    # PATH B: NATIVE LXC APP — dedicated container per instance. Mirrors
    # find-or-create-host.yml: an existing `_<instance>` host is reused so
    # re-runs are idempotent (a fresh generate-ip would otherwise allocate a
    # second IP/VMID and provision a duplicate guest).
    - name: Provision a dedicated native LXC
      ansible.builtin.include_tasks: ../../roles/caddy/tasks/provision-native.yml
      when: app_config.hosting.method | default('native') == 'native'

    # Docker: the stack host (LXC or VM per the stack's guest_type), found or created.
    - name: Find or create the stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method | default('native') == 'docker'


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the target guest to install and configure Caddy.
- name: "Caddy | Deploy"
  # Per-instance group, not a shared one: add_host groups persist for the whole
  # run and bootstrap.yml chains these playbooks with import_playbook, so a shared
  # group would accumulate every earlier app's guest and run this role on all of
  # them. The default() can only fire during --syntax-check — Play 1 has already
  # asserted `instance` is defined by the time this pattern is resolved for real.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # Unconditional, unlike the guest bootstrap above: its Ntfy notify hook depends
    # on homelabinfra_infra.notifications, which does not exist yet when the first
    # baseline guests are created. Running it every deploy is what gives them the
    # hook once Ntfy is up. Idempotent copy/file tasks only.
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
      when: app_config.hosting.method | default('native') == 'docker'

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy Caddy
      ansible.builtin.include_role:
        name: caddy


# ── Play 3: Record facts + wire ────────────────────────────────────────────────
# Registers Caddy in the service registry, then registers the app with platform
# services. Runs on localhost (API calls). All wiring tasks are idempotent.
- name: "Caddy | Record facts and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # Load infra facts in this play rather than relying on Play 1's localhost fact.
    # Tolerate absence: on a clean checkout / pre-bootstrap
    # run there is no facts.yml, homelabinfra_infra stays undefined, and every provider
    # when-condition below falls through its `| default('none')` to a silent no-op.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Shape B `reverse_proxy` per ansible/vars/CONTRACT.md §3. host carries the
    # scheme and port is the ADMIN API port — tasks/wiring/caddy.yml builds its
    # base URL as `{{ host }}:{{ port }}` (slice 300 decision). The public
    # 80/443 listeners are not recorded; nothing reads them.
    - name: Record reverse proxy facts
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: reverse_proxy
        generated_facts_data:
          provider: caddy
          instance: "{{ instance }}"
          host: "{{ _caddy_deploy_host.caddy_admin_host }}"
          port: "{{ _caddy_deploy_host.caddy_admin_port | int }}"
          # The fallback maps over EVERY declared network, and a band declares only what
          # differs from `default` — so it has to skip the entries that carry no cidr of
          # their own rather than fail on them. Once the bands are really segmented each
          # one has its own cidr and all of them appear here, which is the intent.
          internal_cidrs: >-
            {{ _caddy_deploy_host.homelabinfra_config.infrastructure.reverse_proxy.internal_cidrs
               | default(_caddy_deploy_host.homelabinfra_config.networks.values()
                         | selectattr('cidr', 'defined')
                         | map(attribute='cidr') | unique | list, true) }}

    # Belt-and-braces only. The key just written is already in the live
    # homelabinfra_infra — tasks/bootstrap/write-generated-facts.yml merges it there
    # with set_fact — and this include_vars CANNOT override that, because set_fact
    # outranks include_vars in Ansible's precedence order. It stays for a play that
    # never loaded the registry at all; it is not what makes the wiring below see
    # this deploy's own key.
    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Overlay estate-scoped facts (domain, sso, dns) for the app's routing.estate.
    # No-op for the default estate and for labs without a `domains:` map.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _caddy_deploy_host.app_config.routing.estate | default('') }}"

  vars:
    _caddy_deploy_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Set them here.
    # Do not change the variable names — wiring tasks depend on them.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _caddy_deploy_host.ansible_host }}"
    wiring_upstream_port: "{{ _caddy_deploy_host.app_config.app.port }}"
    wiring_subdomain: "{{ _caddy_deploy_host.app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_identity_mode: "{{ _caddy_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _caddy_deploy_host.app_config.routing.access | default('internal') }}"
    wiring_app_display: "Caddy ({{ instance }})"
    # The admin API is the only endpoint that reliably answers 200 — Caddy replies
    # 404 on :80 for a host it has no route for. Monitored over the LAN, not the
    # public domain, because the admin API is never published.
    wiring_monitor_url: >-
      {{ _caddy_deploy_host.caddy_admin_host }}:{{
         _caddy_deploy_host.caddy_admin_port }}/config/apps/http/servers/srv0/routes
    wiring_auth_group: "homelab-users"   # Authentik group granted access

  tasks:
    # Skipped for Caddy: routing.proxy is none in app-defaults — a reverse proxy
    # must not be routed through itself.
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
        - _caddy_deploy_host.app_config.routing.proxy | default('internal') != 'none'

    # Skipped for Caddy: routing.identity is none in app-defaults — Authentik in
    # front of the admin API would break every app's route wiring.
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    # Every app domain resolves to this host, so its own record is created here too.
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    # This bookkeeping is independent of route replay. Record the fresh guest first so an
    # aggregated per-app route failure cannot leave Caddy itself unrecorded.
    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml

    # A fresh Caddy has an empty admin route table. Rebuild each deployed application's
    # route from its Proxmox instance tag and the same defaults/config used by Deploy.
    - name: Rebuild routes for deployed applications
      ansible.builtin.include_tasks: ../../tasks/wiring/rebuild-caddy-routes.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') == 'caddy'

    - name: Notify deployment complete
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Caddy deployed ({{ instance }})"
        notify_message: >-
          Reverse proxy {{ instance }} is running at
          {{ _caddy_deploy_host.caddy_admin_host }} with TLS mode
          '{{ _caddy_deploy_host.app_config.app.tls_mode | default('acme') }}'.
          Routes for deployed applications were reconciled from their instance records.

    # Last task in the play, deliberately. Wiring records what it could not do rather than
    # aborting, so a failure in one provider does not strand the others; this is what stops
    # the run reporting success afterwards. See tasks/report-degradation.yml for why.
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
