---
# Deploy Tautulli on the estate-resolved media stack, or on Kubernetes when
# `hosting.method: kubernetes` (no stack host). It observes the selected Plex instance
# using the server token Plex has published to Vaultwarden.
- name: "Tautulli | Provision"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=tautulli"
    - name: Load app defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/tautulli.yml
        name: _app_defaults
    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - name: Merge Tautulli config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.tautulli_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: tautulli
  tasks:
    - name: Find or create the media stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    - name: Prepare and deploy Tautulli on Kubernetes
      when: app_config.hosting.method == 'kubernetes'
      block:
        - name: Load infrastructure facts
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
            name: homelabinfra_infra
          failed_when: false
        - name: Resolve estate scope
          ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
          vars:
            resolve_estate_name: "{{ app_config.routing.estate | default('') }}"
        - name: Derive the published hostname
          ansible.builtin.set_fact:
            tautulli_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
            tautulli_fqdn: "{{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}"
        # The firewall egress to Plex needs the endpoint the pod will call.
        - name: Resolve the Plex endpoint the pod calls
          ansible.builtin.include_role:
            name: tautulli
            tasks_from: plex
        - name: Refresh inventory for Kubernetes access
          ansible.builtin.meta: refresh_inventory
        - name: Open Tautulli's declared Kubernetes network access
          ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
        - name: Deploy Tautulli on Kubernetes
          ansible.builtin.include_role:
            name: tautulli
            tasks_from: kubernetes

- name: "Tautulli | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Bootstrap the stack host
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
    - name: Deploy Tautulli
      ansible.builtin.include_role:
        name: tautulli

- name: "Tautulli | Wire"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _tautulli_cfg.routing.estate | default('') }}"
  vars:
    _tautulli_k8s: "{{ hostvars['localhost'].app_config.hosting.method == 'kubernetes' }}"
    _tautulli_deploy_host: >-
      {{ hostvars['localhost'] if _tautulli_k8s | bool else hostvars[groups['deploy_' ~ instance][0]] }}
    _tautulli_cfg: "{{ hostvars['localhost'].app_config }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _tautulli_k8s | bool
         else _tautulli_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _tautulli_k8s | bool else _tautulli_cfg.app.port }}"
    wiring_subdomain: "{{ _tautulli_cfg.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Tautulli ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _tautulli_cfg.routing.identity | default('catalog') }}"
    wiring_access: "{{ _tautulli_cfg.routing.access | default('internal') }}"
  tasks:
    # New-instance recovery provisions the workload without publishing its route.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'
    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'
    - name: Record the app on its Proxmox guests
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ homelabinfra_infra.kubernetes.nodes | map(attribute='name') | list
             if _tautulli_k8s | bool else groups['deploy_' ~ instance] }}
        record_guest_kind: "{{ 'kubernetes' if _tautulli_k8s | bool else 'docker' }}"
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
