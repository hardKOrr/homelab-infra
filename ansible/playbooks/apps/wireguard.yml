---
- name: WireGuard | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that: instance is defined and instance is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: "Provide a safe WireGuard instance name: -e instance=wireguard"
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/wireguard.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.wireguard_defaults | combine(_instance_config | default({}), recursive=True) | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
      no_log: true
    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: wireguard
  tasks:
    - name: Provision a dedicated native LXC
      ansible.builtin.include_tasks: ../../roles/wireguard/tasks/provision-native.yml
      when: app_config.hosting.method | default('native') == 'native'

    # Docker: the stack host (LXC or VM per the stack's guest_type), found or created.
    - name: Find or create the stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method | default('native') == 'docker'

# Before Deploy: the forward of the listen port is what makes the server reachable.
- name: WireGuard | Open network access
  hosts: localhost
  gather_facts: false
  vars:
    _wg_fw_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _wg_fw_host.ansible_host }}"
    wiring_firewall: "{{ _wg_fw_host.app_config.firewall | default({}) }}"
  tasks:
    - name: Open the app's network access
      ansible.builtin.include_tasks: ../../tasks/firewall/open-app-access.yml
      vars:
        firewall_inbound_ports:
          wireguard: "{{ _wg_fw_host.app_config.app.port }}"

- name: WireGuard | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
      when: app_config.hosting.method | default('native') == 'docker'
    - ansible.builtin.include_role: {name: wireguard}

- name: WireGuard | Record managed hosting unit
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_kind: "{{ 'docker' if hostvars[groups['deploy_' ~ instance][0]].app_config.hosting.method | default('native') == 'docker' else 'native' }}"
        record_guest_url: ''

- name: WireGuard | Wire UDP endpoint
  hosts: localhost
  gather_facts: false
  vars:
    _wg_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    wiring_app_name: "{{ instance }}"
    wiring_domain: "{{ _wg_host.app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}"
    wiring_upstream_host: "{{ _wg_host.ansible_host }}"
    wiring_ip: "{{ wiring_upstream_host }}"
    wiring_monitor_type: ping
    wiring_monitor_url: "{{ wiring_upstream_host }}"
  tasks:
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool
    - name: Wire DNS directly to the UDP host
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when: homelabinfra_infra.dns.provider | default('none') != 'none'
    - name: Monitor the UDP host
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when: homelabinfra_infra.monitoring.provider | default('none') != 'none'
    - ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
