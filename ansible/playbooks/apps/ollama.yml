---
# Deploy Ollama as Docker on its own VM, or as a pod on the k3s cluster (hosting.method:
# kubernetes, CPU mode only; GPU mode needs a dedicated device passed to a VM). An instance that sets `stack:` instead lands on
# that stack's host, so a stack with guest_type: lxc runs CPU-mode Ollama as Docker on an
# LXC (a GPU needs a VM). CPU mode uses ordinary floating-VM placement.
# When a dedicated PCIe GPU is named, it is assigned to this VM only; Ollama is not placed
# on the shared ai-stack LXC and the play never selects a free device automatically.
#
# Before live binding a GPU, record the Ollama instance, Proxmox node, VM/VMID, exact PCI
# address, GPU console recovery path, and model-storage path in the acceptance evidence.

- name: "Ollama | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe Ollama instance name: -e instance=ollama"

    - name: Load Ollama defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/ollama.yml
        name: _app_defaults

    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge Ollama config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.ollama_defaults
             | combine(_instance_config | default({}), recursive=True) }}
      no_log: true

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: ollama
    - name: Assert the VM, optional PCI, and model-storage contract
      when: app_config.hosting.method == 'docker'
      ansible.builtin.assert:
        that:
          - app_config.proxmox.vm is mapping
          - app_config.app.storage_path | default('') | length > 0
          - app_config.app.models_path | default('') | length > 0
        fail_msg: >-
          Ollama requires its own Docker-capable VM and an explicit persistent model-storage
          path. GPU mode additionally requires an exact PCI device declared dedicated in
          proxmox.devices.

    - name: Refuse a GPU on Kubernetes
      when: app_config.hosting.method == 'kubernetes'
      ansible.builtin.assert:
        that: app_config.app.gpu_device | default('', true) | trim | length == 0
        fail_msg: >-
          Ollama on Kubernetes runs in CPU mode. A dedicated GPU is passed to a VM only;
          clear app.gpu_device or set hosting.method to docker.

    - name: Refuse a GPU on a stack-hosted Ollama
      ansible.builtin.assert:
        that:
          - app_config.stack | default('', true) | length == 0
            or app_config.app.gpu_device | default('', true) | trim | length == 0
        fail_msg: >-
          A dedicated GPU is passed to a VM only. Clear app.gpu_device to run Ollama on a
          stack, or remove stack: to keep Ollama on its own VM.

  tasks:
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"
      when: app_config.hosting.method == 'kubernetes'

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        ollama_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        ollama_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}
      when: app_config.hosting.method == 'kubernetes'

    - name: Provision Ollama's own VM
      ansible.builtin.include_role:
        name: ollama
        tasks_from: provision-vm
      when:
        - app_config.hosting.method == 'docker'
        - app_config.stack | default('', true) | length == 0

    - name: Find or create the Docker stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when:
        - app_config.hosting.method == 'docker'
        - app_config.stack | default('', true) | length > 0

    - name: Refresh inventory for Kubernetes access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'

    - name: Open Ollama's declared Kubernetes network access
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'

    - name: Deploy Ollama on Kubernetes
      ansible.builtin.include_role:
        name: ollama
        tasks_from: kubernetes
      vars:
        ollama_fqdn: "{{ hostvars['localhost'].ollama_fqdn }}"
      when: app_config.hosting.method == 'kubernetes'


- name: "Ollama | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    - name: Bootstrap the Ollama VM
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
      when: app_config.stack | default('', true) | length == 0

    - name: Ensure Docker is installed on the VM
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Deploy Ollama
      ansible.builtin.include_role:
        name: ollama
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

- name: "Ollama | Wire"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _ollama_deploy_host.app_config.routing.estate | default('') }}"

  vars:
    _ollama_deploy_host: >-
      {{ hostvars[groups['deploy_' ~ instance][0]]
         if hostvars['localhost'].app_config.hosting.method == 'docker'
            and groups.get('deploy_' ~ instance, []) | length > 0
         else hostvars['localhost'] }}
    _ollama_kubernetes: "{{ _ollama_deploy_host.app_config.hosting.method == 'kubernetes' }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip
         if _ollama_kubernetes | bool else _ollama_deploy_host.ansible_host }}
    wiring_upstream_port: >-
      {{ 80 if _ollama_kubernetes | bool else _ollama_deploy_host.app_config.app.port }}
    wiring_subdomain: >-
      {{ _ollama_deploy_host.app_config.routing.subdomain | default(instance, true) }}
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Ollama ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/api/tags"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _ollama_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _ollama_deploy_host.app_config.routing.access | default('internal') }}"

  tasks:
    # A new restore target is isolated until its model/config archive and service health pass.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Record Ollama endpoint for named AI consumers
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: apps
        generated_facts_data:
          "{{ instance }}":
            provider: ollama
            instance: "{{ instance }}"
            host: "http://{{ _ollama_deploy_host.ansible_host }}"
            port: "{{ _ollama_deploy_host.app_config.app.port }}"
            url: "http://{{ _ollama_deploy_host.ansible_host }}:{{ _ollama_deploy_host.app_config.app.port }}/"
      when: not (_ollama_kubernetes | bool)

    - name: Record the Kubernetes Ollama endpoint for named AI consumers
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: apps
        generated_facts_data:
          "{{ instance }}":
            provider: ollama
            instance: "{{ instance }}"
            host: "https://{{ wiring_domain }}"
            port: "443"
            url: "https://{{ wiring_domain }}/"
      when: _ollama_kubernetes | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Record Ollama on its Docker guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ (homelabinfra_infra.kubernetes.nodes | map(attribute='name') | list)
             if _ollama_kubernetes | bool else [groups['deploy_' ~ instance][0]] }}
        record_guest_kind: "{{ _ollama_deploy_host.app_config.hosting.method }}"
        record_guest_url: "https://{{ wiring_domain }}"

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
