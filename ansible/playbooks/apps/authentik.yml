---
# Deploy Authentik — SSO for every app with a routing.identity mode other than
# none (bootstrap step 4).
# Docker on LXC (PATH A): server + worker + PostgreSQL + Redis on the sso host.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/authentik.yml -e instance=authentik
#
# The `instance` parameter is the unique name for this deployment.
# It becomes the hostname, Caddy subdomain, Authentik app slug, and Uptime Kuma monitor name.
# If the user has a config/apps/<instance>.yml, it is loaded and merged over defaults.
#
# Play 3 records the `sso` registry key (CONTRACT.md §3) BEFORE wiring, so a
# standalone deploy registers Authentik exactly as a bootstrap run does. Every later
# app deploy reads host + token from there to register per its routing.identity mode.
# A deploy with routing.estate set records the key under estates.<name>.sso — that
# instance serves only its own estate.
#
# The canonical hostname is auth.<domain> (routing.subdomain: auth in app-defaults),
# independent of the instance name. Authentik does not authenticate itself:
# app-defaults set routing.identity: none.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Runs on localhost against the Proxmox API to find or create the stack host.
# Adds the target host to a group for Play 2 to use.
- name: "Authentik | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=authentik"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/authentik.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.authentik_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

  tasks:
    # PATH A: DOCKER APP — app runs as containers on a shared stack host.
    # The stack host is found (or created) by tag. App is deployed in Play 2.
    - name: Find or create stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        # Placement is resolved from the stack AND the estate, so an estate-scoped app
        # cannot land on another estate's stack host. See tasks/stack/find-or-create-host.yml.
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        # Per-instance group: add_host groups persist for the whole run, and
        # bootstrap.yml chains app playbooks via import_playbook.
        deploy_group: "deploy_{{ instance }}"


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the stack host to install and configure Authentik.
- name: "Authentik | Deploy"
  # Per-instance group, not a shared one: add_host groups persist for the whole
  # run and bootstrap.yml chains these playbooks with import_playbook, so a shared
  # group would accumulate every earlier app's guest and run this role on all of
  # them. The default() can only fire during --syntax-check — Play 1 has already
  # asserted `instance` is defined by the time this pattern is resolved for real.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # Unconditional, unlike the guest bootstrap above: its Ntfy notify hook depends
    # on homelabinfra_infra.notifications, which does not exist yet when the first
    # baseline guests are created. Running it every deploy is what gives them the
    # hook once Ntfy is up. Idempotent copy/file tasks only.
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    # Unconditional, and deliberately not gated on homelabinfra_stack_host_created.
    # That fact means "I created this host in THIS run", which is not the same question as
    # "does this host have Docker". A host created by a run that then failed before Play 2
    # is an existing host on every later run, so the install was skipped forever and the
    # deploy died at the first compose task with
    #
    #   Cannot find docker CLI in path
    #
    # Same shape as the guest-reuse defect that never started a stopped guest: state was
    # inferred from what this run did rather than from what is actually there. The docker
    # role is idempotent, so running it every deploy costs an apt check and removes the
    # failure mode.
    - name: Ensure Docker is installed on the stack host
      ansible.builtin.include_role:
        name: docker

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy Authentik
      ansible.builtin.include_role:
        name: authentik


# ── Play 3: Record facts + wire ────────────────────────────────────────────────
# Registers Authentik in the service registry, then registers the app with platform
# services. Runs on localhost (API calls). All wiring tasks are idempotent.
- name: "Authentik | Record facts and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # Load infra facts in this play rather than relying on Play 1's localhost fact.
    # Tolerate absence per docs/specs/provider-noop-wiring.md: on a clean checkout / pre-bootstrap
    # run there is no facts.yml, homelabinfra_infra stays undefined, and every provider
    # when-condition below falls through its `| default('none')` to a silent no-op.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Shape B `sso` per ansible/vars/CONTRACT.md §3. host is the direct LAN URL
    # (see the role's export task for why, not the public domain) and carries the
    # scheme; tasks/wiring/authentik.yml appends /api/v3 to it.
    - name: Record SSO facts
      ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: sso
        # Estate-scoped: a non-default routing.estate lands this key under
        # estates.<name>.sso, read back by tasks/resolve-estate.yml.
        generated_facts_estate: "{{ _authentik_deploy_host.app_config.routing.estate | default('') }}"
        generated_facts_data:
          provider: authentik
          instance: "{{ instance }}"
          host: "{{ _authentik_deploy_host.authentik_api_url }}"
          admin_user: "{{ _authentik_deploy_host.authentik_admin_username }}"

    # Belt-and-braces only. The key just written is already in the live
    # homelabinfra_infra — tasks/bootstrap/write-generated-facts.yml merges it there
    # with set_fact — and this include_vars CANNOT override that, because set_fact
    # outranks include_vars in Ansible's precedence order. It stays for a play that
    # never loaded the registry at all; it is not what makes the wiring below see
    # this deploy's own key.
    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Overlay estate-scoped facts (domain, sso, dns) for the app's routing.estate.
    # No-op for the default estate and for labs without a `domains:` map.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _authentik_deploy_host.app_config.routing.estate | default('') }}"

  vars:
    _authentik_deploy_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Set them here.
    # Do not change the variable names — wiring tasks depend on them.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _authentik_deploy_host.ansible_host }}"
    wiring_upstream_port: "{{ _authentik_deploy_host.app_config.app.port }}"
    # Hostname comes from routing.subdomain (default `auth` in app-defaults,
    # overridable per instance), falling back to the instance name.
    wiring_subdomain: "{{ _authentik_deploy_host.app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Authentik ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/-/health/live/"
    wiring_auth_group: "homelab-users"   # Authentik group granted access
    # Where this instance's admin credentials actually live — same estate scoping
    # as the role's canonical item (roles/authentik/tasks/main.yml).
    _authentik_sso_vault_item: >-
      {{ 'homelab-infra/sso'
         if (_authentik_deploy_host.app_config.routing.estate | default('', true)) | length == 0
         else 'homelab-infra/estates/'
              ~ _authentik_deploy_host.app_config.routing.estate ~ '/sso' }}
    wiring_identity_mode: "{{ _authentik_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _authentik_deploy_host.app_config.routing.access | default('internal') }}"

  tasks:
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    # Skipped for Authentik: routing.identity is none in app-defaults. Putting the
    # SSO provider behind its own forward-auth would deadlock the login flow.
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    # Bookkeeping, not wiring: stamps this instance onto the Proxmox guest so the UI
    # shows what each host actually runs. Defaults cover every input - see the task file.
    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml

    - name: Notify deployment complete
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Authentik deployed ({{ instance }})"
        notify_message: >-
          SSO provider {{ instance }} is running and registered. Sign in at
          https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }} as
          {{ _authentik_deploy_host.authentik_admin_username }} — the generated password
          is in the Vaultwarden item {{ _authentik_sso_vault_item }}, under
          admin_password. facts.yml is topology only and never holds it.
          Apps register per their routing.identity mode from their next deploy
          onward. Accounts, groups, MFA, login sources, flows and brands are
          declared in config/apps/{{ instance }}.yml and applied by this deploy —
          an account reaches a published application only through the group
          '{{ wiring_auth_group }}', so put every person in it. Each generated
          account password is in {{ _authentik_sso_vault_item }} as
          user_<username>_password.

    # Last task in the play, deliberately. Wiring records what it could not do rather than
    # aborting, so a failure in one provider does not strand the others; this is what stops
    # the run reporting success afterwards. See tasks/report-degradation.yml for why.
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
