---
# Deploy an instanced WordPress service on the services Docker stack.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/wordpress.yml -e instance=wordpress
#
# The named MariaDB backend must already be deployed. Database provisioning writes the
# generated application role password to Vaultwarden before changing the backend; the
# WordPress role does the same for its initial administrator password.

- name: "WordPress | Provision"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Assert instance name
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe WordPress instance name: -e instance=wordpress"
    - name: Load WordPress defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/wordpress.yml
        name: _app_defaults
    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Merge WordPress config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.wordpress_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
  tasks:
    - name: Require the named MariaDB backend
      ansible.builtin.assert:
        that:
          - app_config.app.database.provider == 'mariadb'
          - app_config.app.database.instance | length > 0
        fail_msg: >-
          WordPress requires a separately deployed MariaDB instance. Set
          app.database.provider to mariadb and name its backend instance.

    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        wordpress_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        wordpress_fqdn: >-
          {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

    - name: Provision the named MariaDB database and role
      ansible.builtin.include_tasks: ../../tasks/database/provision.yml
      vars:
        database_provision_app_instance: "{{ instance }}"
        database_provision_config: "{{ app_config.app.database }}"

    - name: Add database connection to WordPress config
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'app': {
            'database_host': database_provision_connection.host,
            'database_port': database_provision_connection.port,
            'database_user': database_provision_connection.user,
            'database_password': database_provision_connection.password
          }}, recursive=True) }}
      no_log: true

    # The resolver is shared with the Kubernetes recovery implementation because it is the
    # one place that turns the registry's PBS entry into a verified client endpoint. The
    # WordPress role receives these values from localhost; no secret enters generated facts.
    - name: Resolve the lab PBS target for application-consistent recovery
      ansible.builtin.include_tasks: ../../tasks/backup/resolve-pbs-target.yml
      vars:
        k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('', true) }}"
      when: app_config.backup.enabled | default(false) | bool

    - name: Find or create services stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"

- name: "WordPress | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Bootstrap Docker guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - name: Deploy WordPress
      ansible.builtin.include_role:
        name: wordpress
      vars:
        wordpress_fqdn: "{{ hostvars['localhost'].wordpress_fqdn }}"
        wordpress_pbs_available: "{{ hostvars['localhost'].k8s_pbs_available | default(false) }}"
        wordpress_pbs_repository: "{{ hostvars['localhost'].k8s_pbs_repository | default('') }}"
        wordpress_pbs_fingerprint: "{{ hostvars['localhost'].k8s_pbs_fingerprint | default('') }}"
        wordpress_pbs_password: "{{ hostvars['localhost'].k8s_pbs_password | default('') }}"

- name: "WordPress | Wire"
  hosts: localhost
  gather_facts: false
  vars:
    _wordpress_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _wordpress_host.ansible_host }}"
    wiring_upstream_port: "{{ _wordpress_host.app_config.app.port }}"
    wiring_subdomain: "{{ hostvars['localhost'].wordpress_subdomain }}"
    wiring_domain: "{{ hostvars['localhost'].wordpress_fqdn }}"
    wiring_app_display: "WordPress ({{ instance }})"
    wiring_monitor_url: "https://{{ hostvars['localhost'].wordpress_fqdn }}/wp-login.php"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _wordpress_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _wordpress_host.app_config.routing.access | default('internal') }}"
  tasks:
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when: homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'
    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when: homelabinfra_infra.monitoring.provider | default('none') != 'none'
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when: homelabinfra_infra.dns.provider | default('none') != 'none'
    - name: Record WordPress on its stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: ["{{ _wordpress_host.inventory_hostname }}"]
        record_guest_kind: docker
        record_guest_url: "https://{{ hostvars['localhost'].wordpress_fqdn }}"
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "WordPress deployed"
        notify_message: "{{ instance }} is running at https://{{ hostvars['localhost'].wordpress_fqdn }}"
    - name: Fail on wiring degradations
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
