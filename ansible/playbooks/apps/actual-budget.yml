---
# Deploy an instanced Actual Budget server on the services Docker stack.
#
# Actual is intentionally self-contained: its account.sqlite, server files, and budget
# blobs live in one durable /data mount, and its native server password is generated once
# and stored in Vaultwarden. No platform database or cache is provisioned.
- name: "Actual Budget | Provision"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Assert instance name
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe Actual Budget instance name: -e instance=actual-budget"
    - name: Load Actual Budget defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/actual-budget.yml
        name: _app_defaults
    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Merge Actual Budget config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.actual_budget_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
  tasks:
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        actual_budget_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        actual_budget_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}

    - name: Find or create services stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"

- name: "Actual Budget | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Bootstrap Docker guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - name: Deploy Actual Budget
      ansible.builtin.include_role:
        name: actual-budget
      vars:
        actual_budget_fqdn: "{{ hostvars['localhost'].actual_budget_fqdn }}"

- name: "Actual Budget | Wire"
  hosts: localhost
  gather_facts: false
  vars:
    _actual_budget_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _actual_budget_host.ansible_host }}"
    wiring_upstream_port: "{{ _actual_budget_host.app_config.app.port }}"
    wiring_subdomain: "{{ hostvars['localhost'].actual_budget_subdomain }}"
    wiring_domain: "{{ hostvars['localhost'].actual_budget_fqdn }}"
    wiring_app_display: "Actual Budget ({{ instance }})"
    wiring_monitor_url: "https://{{ hostvars['localhost'].actual_budget_fqdn }}/"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _actual_budget_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _actual_budget_host.app_config.routing.access | default('internal') }}"
  tasks:
    # New-instance recovery provisions the workload without allowing it to publish
    # the target route or contact production peers before its selected artifact verifies.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when: homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'
    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when: homelabinfra_infra.monitoring.provider | default('none') != 'none'
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when: homelabinfra_infra.dns.provider | default('none') != 'none'
    - name: Record Actual Budget on its stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: ["{{ _actual_budget_host.inventory_hostname }}"]
        record_guest_kind: docker
        record_guest_url: "https://{{ hostvars['localhost'].actual_budget_fqdn }}"
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Actual Budget deployed"
        notify_message: >-
          {{ instance }} is running at https://{{ hostvars['localhost'].actual_budget_fqdn }}
    - name: Fail on wiring degradations
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
