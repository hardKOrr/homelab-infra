---
# Deploy Home Assistant as Docker on its own VM (stack: home-assistant-lxc: on an LXC), as
# a pod on the k3s cluster (hosting.method: kubernetes), or natively on its own LXC or VM
# (hosting.method: native with proxmox.guest_type). A Zigbee coordinator uses a Proxmox USB
# resource mapping, never a raw vendor:product pair; an empty mapping disables passthrough. See ansible/roles/home-assistant/README.md.

- name: "Home Assistant | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe Home Assistant instance name: -e instance=home-assistant"

    - name: Load Home Assistant defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/home-assistant.yml
        name: _app_defaults

    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge Home Assistant config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.home_assistant_defaults
             | combine(_instance_config | default({}), recursive=True) }}
      no_log: true

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: home-assistant
    - name: Assert the native guest contract
      when: app_config.hosting.method == 'native'
      ansible.builtin.assert:
        that:
          - (app_config.stack | default('', true) | length) == 0
          - (_instance_config | default({})).get('proxmox', {}).get('guest_type', '') in ['lxc', 'vm']
          - >-
            (app_config.app.usb_mapping | default('', true) | length == 0)
            or (app_config.app.usb_device_path | default('') is match('^/dev/'))
        fail_msg: >-
          Native Home Assistant runs on its own guest: set no stack and set
          proxmox.guest_type to lxc or vm in the instance config. When usb_mapping is set,
          usb_device_path must name the coordinator's serial node.

    - name: Assert the explicit VM and optional USB contract
      when: app_config.hosting.method == 'docker'
      ansible.builtin.assert:
        that:
          - app_config.hosting.method == 'docker'
          - app_config.proxmox.vm is mapping
          - >-
            (app_config.app.usb_mapping | default('', true) | length == 0)
            or (app_config.app.usb_device_path | default('') is match('^/dev/'))
        fail_msg: >-
          Home Assistant requires its own Docker-capable VM. When usb_mapping is set, it
          also requires an exact dedicated Proxmox USB resource mapping and the coordinator's
          guest serial path. Do not use a raw vendor:product pair or adopt a pre-existing
          untagged device.

  tasks:
    - name: Deploy Home Assistant on Kubernetes and skip the guest path
      when: app_config.hosting.method == 'kubernetes'
      block:
        - name: Deploy on the k3s cluster
          ansible.builtin.include_role:
            name: home-assistant
            tasks_from: kubernetes
        - name: Skip the guest plays
          ansible.builtin.meta: end_play

    - name: Deploy Home Assistant natively and skip the Docker VM path
      when: app_config.hosting.method == 'native'
      block:
        - name: Provision or reuse the native guest
          ansible.builtin.include_role:
            name: _template-native
            tasks_from: provision
          vars:
            native_guest_network_app: home-assistant

        - name: Attach the optional Zigbee USB mapping to the native VM
          ansible.builtin.include_tasks: ../../tasks/proxmox/attach-usb-passthrough.yml
          vars:
            usb_passthrough_guest: "{{ groups['deploy_' ~ instance][0] }}"
            usb_passthrough_device:
              mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
          when:
            - app_config.app.usb_mapping | default('', true) | length > 0
            - _native_guest_guest_type == 'vm'

        - name: Bind the optional Zigbee USB device into the native LXC
          ansible.builtin.include_tasks: ../../tasks/proxmox/attach-usb-passthrough-lxc.yml
          vars:
            usb_lxc_guest: "{{ groups['deploy_' ~ instance][0] }}"
            usb_lxc_device:
              mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
              serial_path: "{{ app_config.app.usb_device_path }}"
          when:
            - app_config.app.usb_mapping | default('', true) | length > 0
            - _native_guest_guest_type == 'lxc'

        - name: Skip the Docker VM path
          ansible.builtin.meta: end_play

    - name: Provision on the opt-in stack host, or fall through to the dedicated VM
      ansible.builtin.include_tasks: ../../roles/home-assistant/tasks/provision-stack.yml

    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory

    - name: Resolve this instance's guest, reusing one Remove kept
      ansible.builtin.include_tasks: ../../tasks/proxmox/resolve-instance-guest.yml
      vars:
        resolve_guest_instance: "{{ instance }}"

    - name: Check for an existing Home Assistant VM
      ansible.builtin.set_fact:
        _ha_existing_hosts: "{{ resolve_guest_hosts }}"

    - name: Refuse ambiguous existing Home Assistant VMs
      ansible.builtin.assert:
        that:
          - _ha_existing_hosts | length <= 1
        fail_msg: >-
          Multiple guests match the Home Assistant instance tag. Refusing to reuse an
          arbitrary VM; remove the stale app record and retry.

    - name: Add the existing VM to the deploy group
      ansible.builtin.add_host:
        name: "{{ _ha_existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: >-
          {{ hostvars[_ha_existing_hosts[0]].ansible_host
             | default(hostvars[_ha_existing_hosts[0]].ansible_default_ipv4.address | default('')) }}
        proxmox_vmid: "{{ hostvars[_ha_existing_hosts[0]].proxmox_vmid }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
      when: _ha_existing_hosts | length > 0
      changed_when: false

    - name: Ensure the existing VM is running
      ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars:
        ensure_guest_host: "{{ _ha_existing_hosts[0] }}"
      when: _ha_existing_hosts | length > 0

    - name: Set the existing VM guest name
      ansible.builtin.set_fact:
        _ha_guest: "{{ _ha_existing_hosts[0] }}"
      when: _ha_existing_hosts | length > 0

    - name: Provision a new Home Assistant VM
      ansible.builtin.include_tasks: ../../roles/home-assistant/tasks/provision-vm.yml
      when: _ha_existing_hosts | length == 0

    # After VM creation/reuse: the shared task preflights the mapping before any qm set.
    - name: Attach the optional Zigbee USB resource mapping
      ansible.builtin.include_tasks: ../../tasks/proxmox/attach-usb-passthrough.yml
      vars:
        usb_passthrough_guest: "{{ _ha_guest }}"
        usb_passthrough_device:
          mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
      when: app_config.app.usb_mapping | default('', true) | length > 0

- name: "Home Assistant | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    - name: Bootstrap the Home Assistant guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    - name: Ensure Docker is installed on the VM
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Deploy Home Assistant
      ansible.builtin.include_role:
        name: home-assistant

- name: "Home Assistant | Wire"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: >-
          {{ _ha_deploy_host.app_config.routing.estate | default('') }}

  vars:
    _ha_k8s: "{{ hostvars['localhost'].app_config.hosting.method == 'kubernetes' }}"
    _ha_deploy_host: >-
      {{ hostvars['localhost'] if _ha_k8s | bool else hostvars[groups['deploy_' ~ instance][0]] }}
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _ha_k8s | bool
         else _ha_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _ha_k8s | bool else _ha_deploy_host.app_config.app.port }}"
    wiring_subdomain: >-
      {{ _ha_deploy_host.app_config.routing.subdomain | default(instance, true) }}
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Home Assistant ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _ha_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _ha_deploy_host.app_config.routing.access | default('internal') }}"

  tasks:
    # An isolated restore target must not publish its route before its artifact verifies.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Record Home Assistant on its dedicated VM, stack host or Kubernetes nodes
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ (homelabinfra_infra.kubernetes.nodes | map(attribute='name') | list)
             if _ha_k8s | bool else [groups['deploy_' ~ instance][0]] }}
        record_guest_kind: >-
          {{ 'kubernetes' if _ha_k8s | bool
             else 'native' if hostvars['localhost'].app_config.hosting.method == 'native'
             else 'docker' }}

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
