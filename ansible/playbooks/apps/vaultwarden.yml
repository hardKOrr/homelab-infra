---
# Deploy Vaultwarden — the enforced first baseline app (platform secrets store).
# Native LXC (PATH B): dedicated container, static binary install (see role header).
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/vaultwarden.yml -e instance=vaultwarden
#
# The `instance` parameter is the unique name for this deployment.
# It becomes the hostname, Caddy subdomain, Authentik app slug, and Uptime Kuma monitor name.
# If the user has a config/apps/<instance>.yml, it is loaded and merged over defaults.
#
# Bootstrap chicken-and-egg: on first deploy the admin token is generated and
# printed to console (role task "FIRST BOOTSTRAP — save this admin token now");
# the user pastes it into config/infrastructure.yml. Re-runs read it from there
# (or the VAULTWARDEN_ADMIN_TOKEN env var) and never print again.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Runs on localhost against the Proxmox API to provision or locate the guest. The node-local
# pct/qm waits inside lxc-create.yml delegate to homelabinfra_config.proxmox.node.
# Adds the target host to a group for Play 2 to use.
- name: "Vaultwarden | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=vaultwarden"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/vaultwarden.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.vaultwarden_defaults | combine(_instance_config | default({}), recursive=True) }}"

  tasks:
    # PATH B: NATIVE LXC APP — dedicated container per instance. Mirrors
    # find-or-create-host.yml: an existing tag_<instance> host is reused so
    # re-runs are idempotent (a fresh generate-ip would otherwise allocate a
    # second IP/VMID and provision a duplicate guest).
    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory

    - name: Check for existing instance host
      ansible.builtin.set_fact:
        _existing_hosts: "{{ groups['tag_' + instance] | default([]) }}"

    - name: Add existing instance host to deploy group
      ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: app_deploy
        ansible_host: >-
          {{ hostvars[_existing_hosts[0]].ansible_host
             | default(hostvars[_existing_hosts[0]].ansible_default_ipv4.address | default('')) }}
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
      when: _existing_hosts | length > 0

    - name: Provision new LXC
      when: _existing_hosts | length == 0
      block:
        # Tag with the instance name so the reuse check above (and remove.yml)
        # can find this guest via the tag_<instance> inventory group.
        - name: Set LXC identity from app config
          ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({'proxmox': {'lxc':
                   app_config.proxmox | combine({
                     'hostname': instance,
                     'tags': ((app_config.proxmox.tags | default(['homelab-infra'])) + [instance]) | unique
                   }, recursive=True)
                 }}, recursive=True) }}

        - name: Generate IP address
          ansible.builtin.import_tasks: ../../tasks/network/generate-ip.yml
          vars:
            network_name: "{{ app_config.proxmox.network | default('default') }}"

        - name: Set instance IP in config
          ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({
                'proxmox': {'lxc': {'ip_address': homelabinfra_instance.network.ip_address}}
              }, recursive=True) }}

        - name: Derive VMID from IP
          ansible.builtin.include_tasks: ../../tasks/proxmox/ip-to-vmid.yml

        - name: Create LXC container
          ansible.builtin.include_tasks: ../../tasks/proxmox/lxc-create.yml

        # ansible_host here is the app LXC's own IP — Play 3 reads it as the wiring upstream.
        - name: Add LXC to deploy group
          # Play 3 reads ansible_host and app_config back from this hostvars handoff.
          ansible.builtin.add_host:
            name: "{{ homelabinfra_instance.lxc.hostname }}"
            groups: app_deploy
            ansible_host: "{{ homelabinfra_instance.network.ip_address }}"
            ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
            app_config: "{{ app_config }}"
            homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the target guest to install and configure Vaultwarden.
- name: "Vaultwarden | Deploy"
  hosts: app_deploy
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy Vaultwarden
      ansible.builtin.include_role:
        name: vaultwarden


# ── Play 3: Wire ───────────────────────────────────────────────────────────────
# Registers the app with platform services. Runs on localhost (API calls).
# All wiring tasks are idempotent — safe to re-run.
- name: "Vaultwarden | Wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    # Load infra facts in this play rather than relying on Play 1's localhost fact.
    # Tolerate absence per specs/provider-noop-wiring.md: on a clean checkout / pre-bootstrap
    # run there is no facts.yml, homelabinfra_infra stays undefined, and every provider
    # when-condition below falls through its `| default('none')` to a silent no-op.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  vars:
    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Set them here.
    # Do not change the variable names — wiring tasks depend on them.
    #
    # upstream host/port come from the deploy target Play 1 registered in the
    # app_deploy group (both branches call add_host). Its ansible_host is the
    # app LXC's own IP, so this one read is correct for both provisioning paths.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ hostvars[groups['app_deploy'][0]].ansible_host }}"
    wiring_upstream_port: "{{ hostvars[groups['app_deploy'][0]].app_config.app.port }}"
    wiring_domain: "{{ instance }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Vaultwarden ({{ instance }})"
    wiring_monitor_url: "https://{{ instance }}.{{ homelabinfra_infra.domain }}"
    wiring_auth_group: "homelab-users"   # Authentik group granted access

  tasks:
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    # Skipped for Vaultwarden: routing.auth is false in app-defaults (own auth).
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - hostvars[groups['app_deploy'][0]].app_config.routing.auth | default(true)

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'
