---
# Deploy Mixpost — the first application on the Kubernetes hosting backend (slice 204).
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/mixpost.yml -e instance=mixpost
#
# STRUCTURALLY DIFFERENT FROM EVERY OTHER APP PLAYBOOK, AND DELIBERATELY SO
#
# The native and Docker playbooks are three plays: provision a guest, run a role on it,
# wire it from localhost. This one has no guest to provision and no guest to run a role
# on. Its resources live in a namespace on a cluster that was deployed separately and
# outlives any deployment of this app, so the whole thing runs on localhost and reaches
# the cluster through tasks/kubernetes/, which delegates kubectl to a cluster node.
#
# What is NOT different: the config merge, the one-job-per-app UI, the wiring contract, and
# the idempotent re-run. A converged deploy reports no change, and the app is published
# through the same Caddy, Authentik, Uptime Kuma and DNS steps as any other.

# ── Play 1: Resolve and deploy ─────────────────────────────────────────────────
- name: "Mixpost | Deploy"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=mixpost"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/mixpost.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.mixpost_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

  tasks:
    # The estate overlay has to run before the FQDN is built, not after: a multi-domain lab
    # resolves `routing.estate` into the domain, SSO and DNS this app is published under,
    # and Mixpost is a foxglove-estate app on a lab whose default estate is a different
    # domain entirely. Building the hostname from the top-level domain would publish it on
    # the wrong one.
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        mixpost_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        mixpost_fqdn: >-
          {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

    # The dynamic inventory is what makes the cluster node delegable — it is a
    # homelab-infra-tagged guest like any other.
    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory

    - name: Deploy Mixpost onto the cluster
      ansible.builtin.include_role:
        name: mixpost


# ── Play 2: Wire ───────────────────────────────────────────────────────────────
# Identical in shape to every other app's wiring play. That is the point of the slice: a
# Kubernetes-hosted app must produce the same user-visible result as an LXC- or
# Docker-hosted one.
#
# The one difference is the upstream. A Docker app's route points at the guest that runs
# it; this one points at the cluster's ingress VIP, because that address is stable across
# rescheduling, node loss and a full cluster rebuild, and the pod's address is none of
# those things.
- name: "Mixpost | Wire"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ homelabinfra_infra.kubernetes.ingress_vip }}"
    wiring_upstream_port: 80
    wiring_subdomain: "{{ hostvars['localhost'].mixpost_subdomain }}"
    wiring_domain: "{{ hostvars['localhost'].mixpost_fqdn }}"
    wiring_app_display: "Mixpost ({{ instance }})"
    wiring_monitor_url: "https://{{ hostvars['localhost'].mixpost_fqdn }}/"
    wiring_auth_group: "homelab-users"
    wiring_identity_mode: "{{ hostvars['localhost'].app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ hostvars['localhost'].app_config.routing.access | default('internal') }}"

  tasks:
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra.monitoring is defined
        - homelabinfra_infra.monitoring.provider | default('none') != 'none'

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "Mixpost deployed"
        notify_message: >-
          {{ instance }} is running on the Kubernetes backend at
          https://{{ hostvars['localhost'].mixpost_fqdn }}
