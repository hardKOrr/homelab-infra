---
# Deploy BookStack through the hosting method selected by hosting.method. Existing configs
# keep Docker on the services VM; Kubernetes has no per-app guest.
#
# The named MariaDB/MySQL backend must already be deployed. Database provisioning records
# its generated role password before either application backend receives it.

- name: "BookStack | Resolve and provision"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Assert instance name
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe BookStack instance name: -e instance=bookstack"
    - name: Load BookStack defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/bookstack.yml
        name: _app_defaults
    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
    - name: Merge BookStack config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.bookstack_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
      no_log: true
    - name: Validate supported hosting method before provisioning resources
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: bookstack
  tasks:
    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

    - name: Derive the published hostname
      ansible.builtin.set_fact:
        bookstack_subdomain: "{{ app_config.routing.subdomain | default(instance, true) }}"
        bookstack_fqdn: >-
          {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

    - name: Provision the named MySQL-compatible database and role
      ansible.builtin.include_tasks: ../../tasks/database/provision.yml
      vars:
        database_provision_app_instance: "{{ instance }}"
        database_provision_config: "{{ app_config.app.database }}"

    - name: Add database connection to BookStack config
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'app': {
            'database_host': database_provision_connection.host,
            'database_port': database_provision_connection.port,
            'database_user': database_provision_connection.user,
            'database_password': database_provision_connection.password
          }}, recursive=True) }}
      no_log: true

    - name: Resolve the lab PBS target for application-consistent recovery
      ansible.builtin.include_tasks: ../../tasks/backup/resolve-pbs-target.yml
      vars:
        k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('', true) }}"
      when: app_config.backup.enabled | default(false) | bool

    - name: Find or create the Docker stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

- name: "BookStack | Open Docker network access"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Open the app's declared access and SMTP egress from its Docker host
      ansible.builtin.include_tasks: ../../tasks/firewall/open-app-access.yml
      vars:
        _bks_fw_host: "{{ hostvars[groups['deploy_' ~ instance][0]] if hostvars['localhost'].app_config.hosting.method == 'docker' else {} }}"
        app_config: "{{ hostvars['localhost'].app_config }}"
        wiring_app_name: "{{ instance }}"
        wiring_upstream_host: "{{ _bks_fw_host.ansible_host }}"
        wiring_firewall: "{{ app_config.firewall | default({}) }}"
        firewall_sends_mail: true
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

- name: "BookStack | Open Kubernetes network access"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Open the app's declared access and SMTP egress from every cluster node
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      vars:
        app_config: "{{ hostvars['localhost'].app_config }}"
        firewall_sends_mail: true
      when: hostvars['localhost'].app_config.hosting.method == 'kubernetes'

- name: "BookStack | Deploy on Docker"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Bootstrap the Docker guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - name: Deploy BookStack
      ansible.builtin.include_role:
        name: bookstack
      vars:
        bookstack_fqdn: "{{ hostvars['localhost'].bookstack_fqdn }}"
        bookstack_pbs_available: "{{ hostvars['localhost'].k8s_pbs_available | default(false) }}"
        bookstack_pbs_repository: "{{ hostvars['localhost'].k8s_pbs_repository | default('') }}"
        bookstack_pbs_fingerprint: "{{ hostvars['localhost'].k8s_pbs_fingerprint | default('') }}"
        bookstack_pbs_password: "{{ hostvars['localhost'].k8s_pbs_password | default('') }}"
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

- name: "BookStack | Deploy on Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Deploy BookStack into its Kubernetes namespace
      ansible.builtin.include_role:
        name: bookstack-kubernetes
      vars:
        bookstack_fqdn: "{{ hostvars['localhost'].bookstack_fqdn }}"
        bookstack_pbs_available: "{{ hostvars['localhost'].k8s_pbs_available | default(false) }}"
        bookstack_pbs_repository: "{{ hostvars['localhost'].k8s_pbs_repository | default('') }}"
        bookstack_pbs_fingerprint: "{{ hostvars['localhost'].k8s_pbs_fingerprint | default('') }}"
        bookstack_pbs_password: "{{ hostvars['localhost'].k8s_pbs_password | default('') }}"
      when: hostvars['localhost'].app_config.hosting.method == 'kubernetes'

- name: "BookStack | Wire"
  hosts: localhost
  gather_facts: false
  vars:
    app_config: "{{ hostvars['localhost'].app_config }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip
         if app_config.hosting.method == 'kubernetes'
         else hostvars[groups['deploy_' ~ instance][0]].ansible_host }}
    wiring_upstream_port: >-
      {{ app_config.app.container_port if app_config.hosting.method == 'kubernetes'
         else app_config.app.port }}
    wiring_subdomain: "{{ hostvars['localhost'].bookstack_subdomain }}"
    wiring_domain: "{{ hostvars['localhost'].bookstack_fqdn }}"
    wiring_app_display: "BookStack ({{ instance }})"
    wiring_monitor_url: "https://{{ hostvars['localhost'].bookstack_fqdn }}/login"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ app_config.routing.access | default('internal') }}"
  tasks:
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when: homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'
    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when: homelabinfra_infra.monitoring.provider | default('none') != 'none'
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when: homelabinfra_infra.dns.provider | default('none') != 'none'
    - name: Record BookStack on its Docker stack host
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: ["{{ hostvars[groups['deploy_' ~ instance][0]].inventory_hostname }}"]
        record_guest_kind: docker
        record_guest_url: "https://{{ hostvars['localhost'].bookstack_fqdn }}"
      when: app_config.hosting.method == 'docker'
    - name: Record BookStack on each Kubernetes node
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ homelabinfra_infra.kubernetes.nodes | default([])
             | map(attribute='name') | list }}
        record_guest_kind: kubernetes
        record_guest_url: "https://{{ hostvars['localhost'].bookstack_fqdn }}"
      when: app_config.hosting.method == 'kubernetes'
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "BookStack deployed"
        notify_message: "{{ instance }} is running at https://{{ hostvars['localhost'].bookstack_fqdn }}"
    - name: Fail on wiring degradations
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
