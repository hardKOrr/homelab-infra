---
# Deploy Proxmox Backup Server — the backup target (bootstrap step 7).
# VM, not LXC: PBS wants a full kernel and its own storage stack.
#
# Usage:
#   ansible-playbook -i inventory/ playbooks/apps/pbs.yml -e instance=pbs
#
# The `instance` parameter is the unique name for this deployment.
# It becomes the hostname, Caddy subdomain, Authentik app slug, and Uptime Kuma monitor name.
# If the user has a config/apps/<instance>.yml, it is loaded and merged over defaults.
#
# PROVISIONING — PBS ships as an ISO installer, which cannot be driven unattended.
# Play 1 instead builds (once) a Debian cloud-init template on the Proxmox node and
# clones it; Play 2 installs the PBS packages from Proxmox's apt repository. The
# template build is idempotent and shared — any future VM app clones the same one.
#
# Play 3 provisions the datastore, backup job and notification routing via
# tasks/bootstrap/configure-pbs.yml, then records the `backups` registry key.

# ── Play 1: Provision ──────────────────────────────────────────────────────────
# Runs on localhost against the Proxmox API to provision or locate the VM. The
# node-local qm waits inside vm-clone.yml delegate to homelabinfra_config.proxmox.node.
# Adds the target host to a group for Play 2 to use.
- name: "PBS | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance | length > 0
        fail_msg: "Provide the instance name: -e instance=pbs"

    - name: Load app defaults
      ansible.builtin.include_vars:
        file: "../../vars/app-defaults/pbs.yml"
        name: _app_defaults

    - name: Load instance config (optional — all defaults used if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false   # optional — absent on a clean checkout / pre-bootstrap run

    - name: Merge app config (instance overrides defaults)
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.pbs_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}

    - name: Validate the optional PBS datastore disk declaration
      ansible.builtin.assert:
        that:
          - app_config.proxmox.vm.datastore_disk.storage | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - app_config.proxmox.vm.datastore_disk.size_gib | default(0) | string is match('^[1-9][0-9]*$')
          - app_config.proxmox.vm.datastore_disk.source_vmid is defined
          - app_config.proxmox.vm.datastore_disk.source_vmid | string is match('^[1-9][0-9]*$')
        fail_msg: >-
          PBS datastore_disk requires an image storage, positive size_gib and a stable
          source_vmid reserved for the volume, distinct from every PBS guest VMID.
          Refusing an unsafe volume identity.
      when: app_config.proxmox.vm.datastore_disk is defined

    - name: Validate the optional PBS second copy declaration
      ansible.builtin.assert:
        that:
          - app_config.proxmox.vm.datastore_disk is defined
          - app_config.proxmox.vm.datastore_disk.source_vmid is defined
          - app_config.second_copy.storage | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - app_config.second_copy.storage != app_config.proxmox.vm.datastore_disk.storage
          - app_config.second_copy.size | default(0) | string is match('^[1-9][0-9]*$')
          - app_config.second_copy.schedule | default('', true) | length > 0
          - app_config.second_copy.datastore_name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - app_config.second_copy.pve_storage_id | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - app_config.second_copy.datastore_path | default('') is match('^/[^/].*$')
          - >-
            app_config.second_copy.datastore_path
            != homelabinfra_config.infrastructure.backups.datastore_path
          - "'..' not in app_config.second_copy.datastore_path.split('/')"
        fail_msg: >-
          PBS second_copy requires the primary retained datastore disk and its reserved
          source_vmid, a different Proxmox storage ID, a positive GiB size, a PBS calendar
          schedule, and a distinct absolute datastore path. Refusing an unsafe second copy.
      when: app_config.second_copy.enabled | default(false) | bool

  tasks:
    # VM PATH — dedicated VM per instance. Mirrors the native LXC playbooks: an
    # existing `_<instance>` host is reused so re-runs are idempotent (a fresh
    # generate-ip would otherwise allocate a second IP/VMID and clone a duplicate).
    - name: Refresh inventory to get current Proxmox state
      ansible.builtin.meta: refresh_inventory

    # The application tag is `_<instance>`; the inventory group it produces is derived by
    # one seam for the whole repository, because Ansible's group-name sanitiser is what
    # turns punctuation in a tag into something a `groups[...]` lookup can spell.
    - name: Resolve the inventory group for this instance
      ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars:
        tag_group_tag: "_{{ instance }}"

    - name: Check for existing instance host
      ansible.builtin.set_fact:
        _existing_hosts: "{{ groups[tag_group_name] | default([]) }}"

    - name: Require a stable retained volume identity for datastore reuse
      ansible.builtin.assert:
        that:
          - app_config.proxmox.vm.datastore_disk is defined
          - app_config.proxmox.vm.datastore_disk.source_vmid is defined
          - app_config.proxmox.vm.datastore_disk.source_vmid | string is match('^[1-9][0-9]*$')
        fail_msg: >-
          PBS datastore_mode: reuse requires proxmox.vm.datastore_disk with its reserved
          source_vmid. Refusing to create a guest before the retained volume is identified.
      when: app_config.app.datastore_mode | default('create') == 'reuse'

    - name: Resolve the stable PBS volume identity before provisioning
      ansible.builtin.set_fact:
        _pbs_datastore_source_vmid: "{{ app_config.proxmox.vm.datastore_disk.source_vmid }}"
        _pbs_datastore_volume_id: >-
          {{ app_config.proxmox.vm.datastore_disk.storage }}:vm-{{ app_config.proxmox.vm.datastore_disk.source_vmid }}-disk-1
        _pbs_disk_preflight_node: >-
          {{ hostvars[_existing_hosts[0]].proxmox_node
             if _existing_hosts | length > 0 else homelabinfra_config.proxmox.node }}
      when: app_config.proxmox.vm.datastore_disk is defined

    - name: Resolve the PBS second-copy disk identity
      ansible.builtin.set_fact:
        _pbs_second_copy_disk_config:
          storage: "{{ app_config.second_copy.storage }}"
          size_gib: "{{ app_config.second_copy.size }}"
          source_vmid: "{{ app_config.proxmox.vm.datastore_disk.source_vmid }}"
        _pbs_second_copy_volume_id: >-
          {{ app_config.second_copy.storage }}:vm-{{ app_config.proxmox.vm.datastore_disk.source_vmid }}-disk-2
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Register the PBS volume preflight node
      ansible.builtin.import_tasks: ../../tasks/proxmox/register-nodes.yml
      when: app_config.proxmox.vm.datastore_disk is defined

    - name: Read Proxmox storage available to the PBS node for the second copy
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ _pbs_disk_preflight_node }}/storage"
          - --output-format
          - json
      delegate_to: "{{ _pbs_disk_preflight_node }}"
      register: _pbs_second_copy_node_storages
      changed_when: false
      no_log: true
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Require second-copy storage to be active on the PBS node
      ansible.builtin.assert:
        that:
          - >-
            (_pbs_second_copy_node_storages.stdout | from_json)
            | selectattr('storage', 'equalto', app_config.second_copy.storage)
            | selectattr('active', 'equalto', 1) | list | length == 1
        fail_msg: >-
          PBS second_copy.storage must be active on the PBS VM's Proxmox node and must be
          a distinct pool from the primary datastore storage. No guest was created or changed.
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Check PBS datastore owner identity against current guests
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - /cluster/resources
          - --type
          - vm
          - --output-format
          - json
      delegate_to: "{{ _pbs_disk_preflight_node }}"
      register: _pbs_datastore_owner_guests
      changed_when: false
      no_log: true
      when: app_config.proxmox.vm.datastore_disk is defined

    - name: Refuse a PBS datastore owner VMID assigned to a guest
      ansible.builtin.assert:
        that:
          - >-
            _pbs_datastore_source_vmid | int not in
            (_pbs_datastore_owner_guests.stdout | from_json
             | map(attribute='vmid') | map('int') | list)
        fail_msg: >-
          PBS datastore source_vmid must remain reserved for the volume and must not be
          assigned to a guest. Proxmox may free disks owned by a guest when it is destroyed.
          No PBS guest was created or modified.
      when: app_config.proxmox.vm.datastore_disk is defined

    - name: Check the retained PBS volume before creating a replacement guest
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ _pbs_disk_preflight_node }}/storage/{{ app_config.proxmox.vm.datastore_disk.storage }}/content"
          - --content
          - images
          - --output-format
          - json
      delegate_to: "{{ _pbs_disk_preflight_node }}"
      register: _pbs_datastore_preflight_content
      changed_when: false
      no_log: true
      when: app_config.app.datastore_mode | default('create') == 'reuse'

    - name: Refuse provisioning without the exact retained PBS volume
      ansible.builtin.assert:
        that:
          - >-
            (_pbs_datastore_preflight_content.stdout | from_json)
            | selectattr('volid', 'equalto', _pbs_datastore_volume_id) | list | length == 1
        fail_msg: >-
          PBS reuse volume is absent or ambiguous. The existing guest remains untouched;
          restore the exact retained volume before retrying Deploy PBS.
      when: app_config.app.datastore_mode | default('create') == 'reuse'

    - name: Check the retained PBS second-copy volume before creating a replacement guest
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ _pbs_disk_preflight_node }}/storage/{{ app_config.second_copy.storage }}/content"
          - --content
          - images
          - --output-format
          - json
      delegate_to: "{{ _pbs_disk_preflight_node }}"
      register: _pbs_second_copy_preflight_content
      changed_when: false
      no_log: true
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Require a unique retained PBS second-copy volume
      ansible.builtin.assert:
        that:
          - >-
            (_pbs_second_copy_preflight_content.stdout | from_json)
            | selectattr('volid', 'equalto', _pbs_second_copy_volume_id) | list | length <= 1
        fail_msg: >-
          PBS second-copy volume is ambiguous. Refusing to attach or replace a retained disk.
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Resolve whether the PBS second-copy disk is new or retained
      ansible.builtin.set_fact:
        _pbs_second_copy_volume_exists: >-
          {{ (_pbs_second_copy_preflight_content.stdout | from_json)
             | selectattr('volid', 'equalto', _pbs_second_copy_volume_id) | list | length == 1 }}
      changed_when: false
      when: app_config.second_copy.enabled | default(false) | bool

    - name: Select safe modes for the PBS second-copy disk and datastore
      ansible.builtin.set_fact:
        _pbs_second_copy_disk_mode: "{{ 'reuse' if _pbs_second_copy_volume_exists | bool else 'create' }}"
        _pbs_second_copy_mount_mode: "{{ 'attach' if _pbs_second_copy_volume_exists | bool else 'create' }}"
        _pbs_second_copy_datastore_mode: >-
          {{ app_config.app.datastore_mode | default('create')
             if _pbs_second_copy_volume_exists | bool else 'create' }}
      changed_when: false
      when: app_config.second_copy.enabled | default(false) | bool

    # Resolve without allocating, for both reuse and creation. The same effective
    # network (including default inheritance) must guard a reused running VM too.
    - name: Resolve the network this guest belongs on
      ansible.builtin.include_tasks: ../../tasks/network/resolve-network.yml
      vars:
        resolve_network_app: "pbs"
        resolve_network_estate: "{{ app_config.routing.estate | default('', true) }}"
        resolve_network_requested: "{{ app_config.proxmox.network | default('', true) }}"

    - name: Require the selected network declaration
      ansible.builtin.assert:
        that: network_selected in (homelabinfra_config.networks | default({}))
        fail_msg: "config/proxmox.yml declares no network named {{ network_selected }}. Refusing PBS provisioning."

    - name: Require a declared bridge after network inheritance
      ansible.builtin.assert:
        that: network_effective.bridge | default('', true) | length > 0
        fail_msg: >-
          config/proxmox.yml must declare a bridge for network {{ network_selected }},
          directly or through networks.default.bridge (ansible/vars/CONTRACT.md).
          Refusing PBS provisioning before template creation, guest start or deployment.

    - name: Validate the existing PBS VM network before reuse
      ansible.builtin.include_tasks: ../../tasks/proxmox/validate-vm-network.yml
      vars:
        validate_vm_host: "{{ _existing_hosts[0] }}"
        validate_vm_tag: "_{{ instance }}"
        validate_vm_network:
          # vm-clone.yml creates virtio net0; vm.net is not a clone model override.
          model: virtio
          bridge: "{{ network_effective.bridge }}"
          vlan: "{{ network_effective.vlan | default(0) }}"
      when: _existing_hosts | length > 0

    - name: Add existing instance host to deploy group
      ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: >-
          {{ hostvars[_existing_hosts[0]].ansible_host
             | default(hostvars[_existing_hosts[0]].ansible_default_ipv4.address | default('')) }}
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        pbs_second_copy_disk_mode: "{{ _pbs_second_copy_disk_mode | default('create') }}"
        pbs_second_copy_mount_mode: "{{ _pbs_second_copy_mount_mode | default('create') }}"
        pbs_second_copy_datastore_mode: "{{ _pbs_second_copy_datastore_mode | default('create') }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
      when: _existing_hosts | length > 0
      # Inventory bookkeeping, not a lab change: add_host always reports changed,
      # which alone keeps a fully converged re-run off changed=0.
      changed_when: false

    # A reused guest is not necessarily a RUNNING guest — this branch skips
    # lxc-create.yml/vm-create.yml, which is where starting lives. See the header of
    # tasks/proxmox/ensure-guest-running.yml for the failure this prevents.
    - name: Ensure the existing instance host is running
      ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars:
        ensure_guest_host: "{{ _existing_hosts[0] }}"
      when: _existing_hosts | length > 0

    - name: Attach the retained PBS datastore disk to the existing guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-pbs-datastore-disk.yml
      vars:
        pbs_disk_vmid: "{{ hostvars[_existing_hosts[0]].proxmox_vmid }}"
        pbs_disk_node: "{{ hostvars[_existing_hosts[0]].proxmox_node }}"
        pbs_disk_guest_ip: "{{ hostvars[_existing_hosts[0]].ansible_host | default('') }}"
        pbs_disk_config: "{{ app_config.proxmox.vm.datastore_disk }}"
        pbs_disk_mode: "{{ app_config.app.datastore_mode | default('create') }}"
        pbs_disk_index: 1
        pbs_disk_device: scsi1
        pbs_disk_serial: homelab-pbs-store
      when: app_config.proxmox.vm.datastore_disk is defined and _existing_hosts | length > 0

    - name: Attach the retained PBS second-copy disk to the existing guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-pbs-datastore-disk.yml
      vars:
        pbs_disk_vmid: "{{ hostvars[_existing_hosts[0]].proxmox_vmid }}"
        pbs_disk_node: "{{ hostvars[_existing_hosts[0]].proxmox_node }}"
        pbs_disk_guest_ip: "{{ hostvars[_existing_hosts[0]].ansible_host | default('') }}"
        pbs_disk_config: "{{ _pbs_second_copy_disk_config }}"
        pbs_disk_mode: "{{ _pbs_second_copy_disk_mode }}"
        pbs_disk_index: 2
        pbs_disk_device: scsi2
        pbs_disk_serial: homelab-pbs-copy
      when:
        - app_config.second_copy.enabled | default(false) | bool
        - _existing_hosts | length > 0

    - name: Provision new VM
      when: _existing_hosts | length == 0
      block:
        # Stamp the application's tags and effective per-VM overrides before placement so
        # explicit node or storage pins constrain both the local template and its clone.
        - name: Set VM identity from app config
          ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({'proxmox': {'vm':
                   app_config.proxmox.vm | combine({
                     'name': instance,
                     'tags': ((app_config.proxmox.vm.tags | default(['_+lab', '_-debian']))
                               + ['_' ~ instance]) | unique
                   }, recursive=True)
                 }}, recursive=True) }}

        # Built once and reused by every VM app afterwards; a no-op when it exists.
        - name: Ensure the Debian cloud-init template exists
          ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-cloud-template.yml
          vars:
            proxmox_placement_class: floating_vm
            cloud_template_vmid: "{{ app_config.proxmox.cloud_template.vmid | default('', true) }}"
            cloud_template_name: "{{ app_config.proxmox.cloud_template.name }}"
            cloud_template_image_url: "{{ app_config.proxmox.cloud_template.image_url }}"
            cloud_template_storage: "{{ app_config.proxmox.cloud_template.storage }}"
            cloud_template_bridge: >-
              {{ network_effective.bridge }}

        - name: Generate IP address
          ansible.builtin.import_tasks: ../../tasks/network/generate-ip.yml
          vars:
            network_name: "{{ app_config.proxmox.network | default('', true) }}"
            pool_name: "{{ app_config.proxmox.pool | default('') }}"
            pool_hint: "{{ app_config.stack | default('') }}"
            requested_ip_address: "{{ app_config.proxmox.ip_address | default('') }}"

        - name: Set instance IP in config
          ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({
                'proxmox': {'vm': {'ip_address': homelabinfra_instance.network.ip_address}}
              }, recursive=True) }}

        - name: Derive VMID from IP
          ansible.builtin.include_tasks: ../../tasks/proxmox/ip-to-vmid.yml

        # A retained disk reserves its source VMID even while the PBS guest is absent.
        # Resolve an IP-derived collision before cloning so Proxmox cannot create the
        # replacement at the disk owner's ID.
        - name: Avoid colliding with the retained PBS datastore VMID
          ansible.builtin.include_tasks: ../../tasks/proxmox/avoid-vmid-collision.yml
          vars:
            avoid_vmid_requested: "{{ homelabinfra_config.proxmox.vm.vmid }}"
            avoid_vmid_reserved: "{{ app_config.proxmox.vm.datastore_disk.source_vmid }}"
            avoid_vmid_source_ip: "{{ homelabinfra_config.proxmox.vm.vmid_source_ip | default('') }}"
            avoid_vmid_current_ip: "{{ homelabinfra_instance.network.ip_address }}"
            avoid_vmid_node: "{{ homelabinfra_config.proxmox.node }}"
          when: app_config.proxmox.vm.datastore_disk is defined

        - name: Clone the VM from the cloud-init template
          ansible.builtin.include_tasks: ../../tasks/proxmox/vm-clone.yml
          vars:
            proxmox_placement_class: floating_vm
            proxmox_placement_node: "{{ _guest_placement.node }}"

        # ansible_host here is the PBS VM's own IP — Play 3 reads it as the wiring upstream.
        - name: Add VM to deploy group
          # Play 3 reads ansible_host and app_config back from this hostvars handoff.
          ansible.builtin.add_host:
            name: "{{ instance }}"
            groups: "deploy_{{ instance }}"
            ansible_host: "{{ homelabinfra_instance.vm_ansible_host }}"
            ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
            app_config: "{{ app_config }}"
            pbs_second_copy_disk_mode: "{{ _pbs_second_copy_disk_mode | default('create') }}"
            pbs_second_copy_mount_mode: "{{ _pbs_second_copy_mount_mode | default('create') }}"
            pbs_second_copy_datastore_mode: "{{ _pbs_second_copy_datastore_mode | default('create') }}"
            homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"

        - name: Attach the retained PBS datastore disk to the new guest
          ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-pbs-datastore-disk.yml
          vars:
            pbs_disk_vmid: "{{ homelabinfra_instance.vm.vmid }}"
            pbs_disk_node: "{{ homelabinfra_config.proxmox.node }}"
            pbs_disk_guest_ip: "{{ homelabinfra_instance.vm_ansible_host | default('') }}"
            pbs_disk_config: "{{ app_config.proxmox.vm.datastore_disk }}"
            pbs_disk_mode: "{{ app_config.app.datastore_mode | default('create') }}"
            pbs_disk_index: 1
            pbs_disk_device: scsi1
            pbs_disk_serial: homelab-pbs-store
          when: app_config.proxmox.vm.datastore_disk is defined

        - name: Attach the retained PBS second-copy disk to the new guest
          ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-pbs-datastore-disk.yml
          vars:
            pbs_disk_vmid: "{{ homelabinfra_instance.vm.vmid }}"
            pbs_disk_node: "{{ homelabinfra_config.proxmox.node }}"
            pbs_disk_guest_ip: "{{ homelabinfra_instance.vm_ansible_host | default('') }}"
            pbs_disk_config: "{{ _pbs_second_copy_disk_config }}"
            pbs_disk_mode: "{{ _pbs_second_copy_disk_mode }}"
            pbs_disk_index: 2
            pbs_disk_device: scsi2
            pbs_disk_serial: homelab-pbs-copy
          when: app_config.second_copy.enabled | default(false) | bool


# ── Play 2: Deploy ─────────────────────────────────────────────────────────────
# Runs on the PBS VM to install and configure Proxmox Backup Server.
- name: "PBS | Deploy"
  # Per-instance group, not a shared one: add_host groups persist for the whole
  # run and bootstrap.yml chains these playbooks with import_playbook, so a shared
  # group would accumulate every earlier app's guest and run this role on all of
  # them. The default() can only fire during --syntax-check — Play 1 has already
  # asserted `instance` is defined by the time this pattern is resolved for real.
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load user vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    # ── Guest Bootstrap (runs once — skipped if already bootstrapped) ──────────
    - name: Bootstrap guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    # Unconditional, unlike the guest bootstrap above: its Ntfy notify hook depends
    # on homelabinfra_infra.notifications, which does not exist yet when the first
    # baseline guests are created. Running it every deploy is what gives them the
    # hook once Ntfy is up. Idempotent copy/file tasks only.
    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    # ── App Deployment ─────────────────────────────────────────────────────────
    - name: Deploy PBS
      ansible.builtin.include_role:
        name: pbs


# ── Play 3: Record facts, configure, wire ──────────────────────────────────────
# Records the API token, configures the datastore and backup job, then registers
# the app with platform services. Runs on localhost (API calls). Idempotent.
- name: "PBS | Record facts, configure and wire"
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    # Load infra facts in this play rather than relying on Play 1's localhost fact.
    # Tolerate absence: on a clean checkout / pre-bootstrap
    # run there is no facts.yml, homelabinfra_infra stays undefined, and every provider
    # when-condition below falls through its `| default('none')` to a silent no-op.
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Overlay estate-scoped facts (domain, sso, dns) for the app's routing.estate.
    # No-op for the default estate and for labs without a `domains:` map.
    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _pbs_deploy_host.app_config.routing.estate | default('') }}"

  vars:
    _pbs_deploy_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"

    # ── WIRING CONTRACT ────────────────────────────────────────────────────────
    # These are the variables all wiring tasks read. Set them here.
    # Do not change the variable names — wiring tasks depend on them.
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _pbs_deploy_host.ansible_host }}"
    wiring_upstream_port: "{{ _pbs_deploy_host.app_config.app.port }}"
    wiring_subdomain: "{{ _pbs_deploy_host.app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "Proxmox Backup Server ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_auth_group: "homelab-users"   # Authentik group granted access
    wiring_identity_mode: "{{ _pbs_deploy_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _pbs_deploy_host.app_config.routing.access | default('internal') }}"

  tasks:
    # Datastore, retention, Ntfy routing, PVE storage backend and the vzdump job.
    # PBS runs the backups itself afterwards — Ansible never executes one.
    - name: Configure datastore, backup job and notifications
      ansible.builtin.include_tasks: ../../tasks/bootstrap/configure-pbs.yml
      vars:
        # configure-pbs.yml records the `backups` key itself; include vars are visible to
        # the tasks it includes, so this is what anchors that write.
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        pbs_api_host: "{{ _pbs_deploy_host.pbs_url }}"
        pbs_api_token_id: "{{ _pbs_deploy_host.pbs_token_id }}"
        pbs_api_token_secret: "{{ _pbs_deploy_host.pbs_token_secret }}"
        pbs_instance: "{{ instance }}"
        pbs_datastore_name: "{{ _pbs_deploy_host.app_config.app.datastore_name }}"
        pbs_datastore_mode: "{{ _pbs_deploy_host.app_config.app.datastore_mode | default('create') }}"
        pbs_second_copy: "{{ _pbs_deploy_host.app_config.second_copy | default({}) }}"
        pbs_second_copy_datastore_mode: "{{ _pbs_deploy_host.pbs_second_copy_datastore_mode | default('create') }}"
        pbs_token_rotated: "{{ _pbs_deploy_host.pbs_token_rotated | default(false) }}"

    - name: Reload infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    # Backup CronJobs read the PBS certificate fingerprint from a namespace-local
    # ConfigMap. Refresh every marked namespace now that configure-pbs.yml has read the
    # active certificate, so a PBS certificate rotation does not require app redeploys.
    - name: PBS | Refresh the fingerprint used by Kubernetes backup CronJobs
      ansible.builtin.include_tasks: ../../tasks/backup/refresh-k8s-pbs-fingerprint.yml
      vars:
        pbs_backup_fingerprint: "{{ _pbs_pve_fingerprint }}"
      when: >-
        ((homelabinfra_infra | default({})).kubernetes | default({})).nodes
        | default([]) | length > 0

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    # Catalog mode for PBS: an Application tile only. PBS has its own login and
    # API tokens, and forward-auth would also intercept the API that configure-pbs
    # and the PVE storage backend use.
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    # Bookkeeping, not wiring: stamps this instance onto the Proxmox guest so the UI
    # shows what each host actually runs. Defaults cover every input - see the task file.
    - name: Record the app on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml

    # configure-pbs.yml already sends its own "backups configured" message with the
    # job details, so this one reports the deploy itself.
    - name: Notify deployment complete
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "PBS deployed ({{ instance }})"
        notify_message: >-
          Proxmox Backup Server {{ instance }} is running at
          {{ _pbs_deploy_host.pbs_url }} and registered as a PVE storage backend.
          Backups run on the configured schedule without further action.

    # Last task in the play, deliberately. Wiring records what it could not do rather than
    # aborting, so a failure in one provider does not strand the others; this is what stops
    # the run reporting success afterwards. See tasks/report-degradation.yml for why.
    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
