---
- name: InfluxDB | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe backend instance name: -e instance=influxdb"
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/influxdb.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.influxdb_defaults
             | combine(_instance_config | default({}), recursive=True)
             | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}
      no_log: true
    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: influxdb
  tasks:
    - ansible.builtin.meta: refresh_inventory
    - name: Resolve this instance's guest, reusing one Remove kept
      ansible.builtin.include_tasks: ../../tasks/proxmox/resolve-instance-guest.yml
      vars: {resolve_guest_instance: "{{ instance }}"}
    - ansible.builtin.set_fact:
        _existing_hosts: "{{ resolve_guest_hosts }}"

    # Remove deliberately leaves the lab-owned guest in place after deleting the app's
    # data and withdrawing its instance tag. Resolve the declared network before looking
    # for that guest; the shared provisioner allocates an address only for a new guest.
    - name: Resolve InfluxDB network before checking for a removed guest
      ansible.builtin.include_tasks: ../../tasks/network/resolve-network.yml
      vars: {resolve_network_app: influxdb, resolve_network_estate: ''}
      when: _existing_hosts | length == 0

    - name: Find a removed InfluxDB guest that still has exact lab ownership
      ansible.builtin.include_tasks: ../../roles/influxdb/tasks/reuse-removed-guest.yml
      when: _existing_hosts | length == 0

    - name: Reuse the exact lab-owned guest left by Remove
      ansible.builtin.set_fact:
        _existing_hosts: "{{ _influxdb_removed_guest_hosts }}"
      when: _existing_hosts | length == 0

    - name: Resolve InfluxDB guest placement and check existing type
      ansible.builtin.include_tasks: ../../tasks/database/resolve-backend-placement.yml

    - ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: >-
          {{ hostvars[_existing_hosts[0]].ansible_host
             | default(hostvars[_existing_hosts[0]].proxmox_net0.ip | default('') | regex_replace('/.*$', '')) }}
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        _database_backend_guest_type: "{{ _database_backend_guest_type }}"
        app_config: "{{ app_config }}"
      changed_when: false
      when: _existing_hosts | length > 0

    - ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars: {ensure_guest_host: "{{ _existing_hosts[0] }}"}
      when: _existing_hosts | length > 0

    - name: Provision a new InfluxDB backend guest
      ansible.builtin.include_tasks: ../../tasks/database/provision-backend-guest.yml
      vars:
        database_backend_network_app: influxdb

- name: InfluxDB | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - ansible.builtin.include_role: {name: influxdb}

- name: InfluxDB | Register backend
  hosts: localhost
  gather_facts: false
  vars: {_influxdb_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"}
  tasks:
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: >-
          {{ {instance: {'provider': 'influxdb',
             'host': _influxdb_host.ansible_host,
             'port': _influxdb_host.app_config.app.port}} }}

- name: InfluxDB | Wire
  hosts: localhost
  gather_facts: false
  vars:
    _influxdb_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: "{{ _influxdb_host.ansible_host }}"
    wiring_upstream_port: "{{ _influxdb_host.app_config.app.port }}"
    wiring_subdomain: "{{ _influxdb_host.app_config.routing.subdomain | default(instance, true) }}"
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "InfluxDB ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_domain }}/health"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _influxdb_host.app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ _influxdb_host.app_config.routing.access | default('internal') }}"
  pre_tasks:
    - name: Resolve the InfluxDB routing estate
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ _influxdb_host.app_config.routing.estate | default('') }}"
  tasks:
    # Even an isolated restore target needs its ownership tag so inventory can find it
    # for the final deploy. Only shared external wiring is skipped during isolation.
    - name: Record InfluxDB on its Proxmox guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_kind: native

    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool
    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'
    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'
    - name: Wire uptime monitoring
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined
        - homelabinfra_infra.monitoring.provider | default('none') != 'none'
    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
