---
- name: Redis | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert: {that: "instance is defined and instance is match('^[A-Za-z0-9_.-]+$')", fail_msg: "Provide a safe backend instance name: -e instance=redis"}
    - ansible.builtin.include_vars: {file: ../../vars/app-defaults/redis.yml, name: _app_defaults}
    - ansible.builtin.include_vars: {file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml", name: _instance_config}
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.redis_defaults | combine(_instance_config | default({}), recursive=True) | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}"
      no_log: true
    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: redis
  tasks:
    - ansible.builtin.meta: refresh_inventory
    - ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars: {tag_group_tag: "_{{ instance }}"}
    - ansible.builtin.set_fact: {_existing_hosts: "{{ groups[tag_group_name] | default([]) }}"}
    - name: Resolve Redis guest placement and check existing type
      ansible.builtin.include_tasks: ../../tasks/database/resolve-backend-placement.yml
    - ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: "{{ hostvars[_existing_hosts[0]].ansible_host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        _database_backend_guest_type: "{{ _database_backend_guest_type }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
      changed_when: false
      when: _existing_hosts | length > 0
    - ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars: {ensure_guest_host: "{{ _existing_hosts[0] }}"}
      when: _existing_hosts | length > 0
    - name: Provision a new Redis backend guest
      ansible.builtin.include_tasks: ../../tasks/database/provision-backend-guest.yml
      vars:
        database_backend_network_app: redis

- name: Redis | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - ansible.builtin.include_role: {name: redis}
- name: Redis | Register backend
  hosts: localhost
  gather_facts: false
  vars: {_redis_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"}
  tasks:
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: >-
          {{ {instance: {'provider': 'redis', 'host': _redis_host.ansible_host,
             'port': _redis_host.app_config.app.port}} }}
    - ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
