---
- name: Redis | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert: {that: "instance is defined and instance is match('^[A-Za-z0-9_.-]+$')", fail_msg: "Provide a safe backend instance name: -e instance=redis"}
    - ansible.builtin.include_vars: {file: ../../vars/app-defaults/redis.yml, name: _app_defaults}
    - ansible.builtin.include_vars: {file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml", name: _instance_config}
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.redis_defaults | combine(_instance_config | default({}), recursive=True) | combine({'app': (homelabinfra_vault.apps | default({}))[instance] | default({})}, recursive=True) }}"
      no_log: true
  tasks:
    - ansible.builtin.meta: refresh_inventory
    - ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars: {tag_group_tag: "_{{ instance }}"}
    - ansible.builtin.set_fact: {_existing_hosts: "{{ groups[tag_group_name] | default([]) }}"}
    - ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: "{{ hostvars[_existing_hosts[0]].ansible_host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
      changed_when: false
      when: _existing_hosts | length > 0
    - ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars: {ensure_guest_host: "{{ _existing_hosts[0] }}"}
      when: _existing_hosts | length > 0
    - name: Provision Redis VM
      when: _existing_hosts | length == 0
      block:
        - name: Set Redis VM identity and sizing
          ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({'proxmox': {'vm':
                 (app_config.proxmox.vm | default({})) | combine({
                   'name': instance,
                   'cores': app_config.proxmox.cores | default(app_config.proxmox.vm.cores | default(2)) | int,
                   'memory': app_config.proxmox.memory | default(app_config.proxmox.vm.memory | default(1024)) | int,
                   'disk_size': app_config.proxmox.disk_size
                     | default(app_config.proxmox.vm.disk_size
                     | default((app_config.proxmox.disk_volume | default({})).size | default(16))) | int,
                   'boot_order': app_config.proxmox.boot_order
                     | default(app_config.proxmox.vm.boot_order | default(40)) | int,
                   'tags': ((app_config.proxmox.vm.tags | default(app_config.proxmox.tags
                     | default(['_+lab', '_-debian']))) + ['_' ~ instance]) | unique
                 }, recursive=True)}}, recursive=True) }}
        - ansible.builtin.include_tasks: ../../tasks/network/resolve-network.yml
          vars: {resolve_network_app: redis, resolve_network_estate: ''}
        - ansible.builtin.import_tasks: ../../tasks/network/generate-ip.yml
          vars: {network_name: "{{ app_config.proxmox.network | default('', true) }}", pool_name: "{{ app_config.proxmox.pool | default('') }}", requested_ip_address: "{{ app_config.proxmox.ip_address | default('') }}"}
        - ansible.builtin.set_fact:
            homelabinfra_config: "{{ homelabinfra_config | combine({'proxmox': {'vm': {'ip_address': homelabinfra_instance.network.ip_address}}}, recursive=True) }}"
        - ansible.builtin.include_tasks: ../../tasks/proxmox/ip-to-vmid.yml
        - name: Ensure the Debian cloud-init template exists
          ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-cloud-template.yml
          vars:
            proxmox_placement_class: database_vm
            cloud_template_name: "{{ app_config.proxmox.cloud_template.name | default('debian-12-cloud') }}"
            cloud_template_image_url: >-
              {{ app_config.proxmox.cloud_template.image_url
                 | default('https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2') }}
            cloud_template_storage: "{{ app_config.proxmox.cloud_template.storage | default(homelabinfra_config.proxmox.storage_ids.database_vm, true) }}"
            cloud_template_bridge: "{{ network_effective.bridge }}"
        - ansible.builtin.include_tasks: ../../tasks/proxmox/vm-clone.yml
          vars:
            proxmox_placement_class: database_vm
        - ansible.builtin.add_host:
            name: "{{ homelabinfra_instance.vm.name }}"
            groups: "deploy_{{ instance }}"
            ansible_host: "{{ homelabinfra_instance.vm_ansible_host }}"
            ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
            app_config: "{{ app_config }}"
- name: Redis | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - ansible.builtin.include_role: {name: redis}
- name: Redis | Register backend
  hosts: localhost
  gather_facts: false
  vars: {_redis_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"}
  tasks:
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: >-
          {{ {instance: {'provider': 'redis', 'host': _redis_host.ansible_host,
             'port': _redis_host.app_config.app.port}} }}
    - ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
