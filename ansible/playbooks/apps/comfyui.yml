---
# Deploy ComfyUI as Docker on its own VM. The dedicated PCIe GPU is assigned to this VM
# only; ComfyUI is not placed on the shared ai-stack LXC and the play never selects a free
# device automatically. With `hosting.method: native` it runs from ComfyUI's manual install
# on its own LXC or VM (`proxmox.guest_type`), in CPU mode. An instance that sets `stack:`
# instead lands on that stack's host,
# so a stack with guest_type: lxc runs CPU-mode ComfyUI as Docker on an LXC. With
# `hosting.method: kubernetes` it runs in CPU mode on the cluster and no guest is made.
#
# Before live binding, record the ComfyUI instance, Proxmox node, VM/VMID, exact PCI
# address, GPU console recovery path, and model-storage path in the acceptance evidence.

- name: "ComfyUI | Provision"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert instance name is provided
      ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe ComfyUI instance name: -e instance=comfyui"

    - name: Load ComfyUI defaults
      ansible.builtin.include_vars:
        file: ../../vars/app-defaults/comfyui.yml
        name: _app_defaults

    - name: Load instance config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Merge ComfyUI config
      ansible.builtin.set_fact:
        app_config: >-
          {{ _app_defaults.comfyui_defaults
             | combine(_instance_config | default({}), recursive=True) }}
      no_log: true

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: comfyui
    - name: Derive the published ComfyUI hostname
      ansible.builtin.set_fact:
        comfyui_fqdn: >-
          {{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain | default(homelabinfra_config.infrastructure.domain) }}
    - name: Assert the native accelerator
      when: app_config.hosting.method == 'native'
      ansible.builtin.assert:
        that:
          - app_config.app.accelerator | default('cuda') == 'cpu'
          - (_instance_config | default({})).get('proxmox', {}).get('guest_type', '') in ['lxc', 'vm']
        fail_msg: >-
          Native ComfyUI runs in CPU mode (app.accelerator: cpu, or use Docker on a VM for
          the dedicated GPU) and needs proxmox.guest_type: lxc or vm in its instance config.
    - name: Assert the VM, accelerator, and model-storage contract
      when: app_config.hosting.method == 'docker'
      ansible.builtin.assert:
        that:
          - app_config.proxmox.vm is mapping
          - app_config.app.accelerator | default('cuda') in ['cuda', 'cpu']
          - >-
            app_config.app.accelerator | default('cuda') != 'cuda'
            or app_config.app.gpu_device | default('') | length > 0
          - app_config.app.storage_path | default('') | length > 0
          - app_config.app.models_path | default('') | length > 0
        fail_msg: >-
          ComfyUI requires its own Docker-capable VM, accelerator cuda or cpu, a dedicated
          proxmox.devices mapping in cuda mode, and an explicit persistent model-storage path.

  tasks:
    - name: Provision ComfyUI's own VM
      ansible.builtin.include_role:
        name: comfyui
        tasks_from: provision-vm
      when:
        - app_config.hosting.method == 'docker'
        - app_config.stack | default('', true) | length == 0

    - name: Provision or reuse the native guest
      ansible.builtin.include_role:
        name: _template-native
        tasks_from: provision
      vars:
        native_guest_network_app: comfyui
      when: app_config.hosting.method == 'native'

    - name: Find or create the Docker stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when:
        - app_config.hosting.method == 'docker'
        - app_config.stack | default('', true) | length > 0

- name: "ComfyUI | Prepare Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Refresh inventory for cluster access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'
    - name: Open ComfyUI's declared access from the Kubernetes node alias
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'

- name: "ComfyUI | Deploy"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

  tasks:
    - name: Bootstrap the ComfyUI VM
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
      when: app_config.stack | default('', true) | length == 0

    - name: Ensure Docker is installed on the VM
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Deploy ComfyUI
      ansible.builtin.include_role:
        name: comfyui
      when: hostvars['localhost'].app_config.hosting.method in ['docker', 'native']

- name: "ComfyUI | Deploy on Kubernetes"
  hosts: localhost
  become: false
  gather_facts: false
  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false
  tasks:
    - name: Deploy ComfyUI into its Kubernetes namespace
      ansible.builtin.include_role:
        name: comfyui
        tasks_from: kubernetes
      vars:
        comfyui_fqdn: "{{ hostvars['localhost'].comfyui_fqdn }}"
      when: app_config.hosting.method == 'kubernetes'

- name: "ComfyUI | Wire"
  hosts: localhost
  become: false
  gather_facts: false

  pre_tasks:
    - name: Load infrastructure facts
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        name: homelabinfra_infra
      failed_when: false

    - name: Resolve estate scope
      ansible.builtin.import_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: >-
          {{ _comfyui_cfg.routing.estate | default('') }}

  vars:
    _comfyui_k8s: "{{ hostvars['localhost'].app_config.hosting.method == 'kubernetes' }}"
    _comfyui_cfg: "{{ hostvars['localhost'].app_config }}"
    _comfyui_deploy_host: >-
      {{ {} if _comfyui_k8s | bool else hostvars[groups['deploy_' ~ instance][0]] }}
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _comfyui_k8s | bool
         else _comfyui_deploy_host.ansible_host }}
    wiring_upstream_port: "{{ 80 if _comfyui_k8s | bool else _comfyui_cfg.app.port }}"
    wiring_subdomain: >-
      {{ _comfyui_cfg.routing.subdomain | default(instance, true) }}
    wiring_domain: "{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}"
    wiring_app_display: "ComfyUI ({{ instance }})"
    wiring_monitor_url: "https://{{ wiring_subdomain }}.{{ homelabinfra_infra.domain }}/system_stats"
    wiring_auth_group: homelab-users
    wiring_identity_mode: "{{ _comfyui_cfg.routing.identity | default('catalog') }}"
    wiring_access: "{{ _comfyui_cfg.routing.access | default('internal') }}"

  tasks:
    # A new restore target is isolated until its model/config archive and GPU health pass.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire reverse proxy
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.reverse_proxy is defined
        - homelabinfra_infra.reverse_proxy.provider | default('none') != 'none'

    - name: Wire SSO
      ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.sso is defined
        - homelabinfra_infra.sso.provider | default('none') == 'authentik'
        - wiring_identity_mode != 'none'

    - name: Register uptime monitor
      ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.monitoring is defined

    - name: Wire DNS
      ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
      when:
        - homelabinfra_infra is defined
        - homelabinfra_infra.dns is defined
        - homelabinfra_infra.dns.provider | default('none') != 'none'

    - name: Record ComfyUI on its Docker guest
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_kind: "{{ 'native' if _comfyui_cfg.hosting.method == 'native' else 'docker' }}"
      when: not (_comfyui_k8s | bool)

    - name: Record ComfyUI on the Kubernetes nodes
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ homelabinfra_infra.kubernetes.nodes | default([]) | map(attribute='name') | list }}
        record_guest_kind: kubernetes
        record_guest_url: "https://{{ wiring_domain }}/"
      when: _comfyui_k8s | bool

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"
