---
# Deploy one app instance on its configured hosting method. Each converted
# playbooks/apps/<app>.yml is a shim importing this playbook with `vars: {app: <app>}`, so
# its Rundeck job and drill command stay as they are. Until an app has its shim, its own
# playbook is the entry point. PBS, k3s, OPNsense, PDM and Caddy's Seed path keep their own.
#
# Plays:
#   1. Resolve and provision (localhost): config, hosting method, then estate and hostname
#      (tasks/apps/deploy-resolve.yml), the app's database; then the stack host (docker),
#      the app's own guest (native) or the cluster's firewall access (kubernetes), the
#      guest's storage and its declared firewall access.
#   2. Deploy on the guest: bootstrap, OS update notifications, Docker, the role's main.yml.
#   3. Deploy on the cluster: the role's kubernetes.yml.
#   4. Record and wire: reverse proxy, SSO, uptime monitor, DNS (only with a route:
#      routing.proxy is not none; an app without one needs no domain), the guest record.
#      Skipped while a restore target is isolated (recovery_isolated).
#   5. Notify, unless the restore target is isolated.
#
# Per-app behavior lives in the role (`deploy.role` in the app's defaults, default the app
# slug) and in these optional hooks, run only when the role has them:
#   deploy-prepare.yml  localhost, after the hostname is known, before provisioning. May set
#                       deploy_host_mounts (an attach-host-mounts.yml list) and
#                       deploy_host_mounts_owner for the Docker or native guest, and
#                       native_guest_database (database placement for a native guest).
#   deploy-record.yml   localhost, before wiring, also while the restore target is
#                       isolated: registry entries other jobs read (`media`, `databases`);
#                       deploy_notify_note, a note computed from app_config.
#
# An app with `app.database` gets its database and login role on the named backend before
# its guest is provisioned (tasks/database/deploy-consumer.yml), on the methods in
# deploy.database_methods (default every method).
#
# Per-app values are app-defaults keys (shared ones in vars/app-defaults/_base.yml):
# routing.monitor_path, routing.auth_group, deploy.notify_note (a sentence added to the
# deploy notification), vault.methods and platform_layers (tasks/apps/load-config.yml),
# firewall.methods (the methods whose Deploy opens the declared `firewall:` access; default
# every method), firewall.sends_mail (SMTP egress to the platform relay for a Docker or
# native guest). The display name is the catalog entry's `name`.

# ── Play 1: Resolve and provision ──────────────────────────────────────────────
- name: "Deploy {{ app | default('(no app)') }} | Resolve and provision"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    _deploy_firewall_methods: >-
      {{ (app_config.firewall | default({})).methods | default(['docker', 'kubernetes', 'native']) }}

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Assert the app and instance names
      ansible.builtin.assert:
        that:
          - app is defined and app is match('^[a-z0-9-]+$')
          - instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: >-
          Provide the app and a safe instance name: -e instance=<name>, through
          playbooks/apps/<app>.yml or with -e app=<app>.
        quiet: true

    - name: Load the app config
      ansible.builtin.include_tasks: ../../tasks/apps/load-config.yml
      vars:
        load_config_app: "{{ app }}"

    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: "{{ app }}"

    # Native by its own defaults: they choose the type. Else the instance file names it.
    - name: Assert the native guest contract
      when: app_config.hosting.method == 'native'
      ansible.builtin.assert:
        that:
          - >-
            (_instance_config | default({})).get('proxmox', {}).get('guest_type', '') in ['lxc', 'vm']
            or (_deploy_own_defaults.hosting.method | default('') == 'native'
                and _deploy_own_defaults.proxmox.guest_type | default('') in ['lxc', 'vm'])
        fail_msg: >-
          Native {{ app }} runs on its own guest: set proxmox.guest_type to lxc or vm in
          config/apps/{{ instance }}.yml.
        quiet: true
      vars:
        _deploy_own_defaults: "{{ _app_defaults[(app | replace('-', '_')) ~ '_defaults'] }}"

  tasks:
    - name: Resolve the estate, role and published hostname
      ansible.builtin.include_tasks: ../../tasks/apps/deploy-resolve.yml

    - name: Run the role's deploy-prepare hook
      ansible.builtin.include_role:
        name: "{{ _deploy_role }}"
        tasks_from: deploy-prepare
      when: (playbook_dir ~ '/../../roles/' ~ _deploy_role ~ '/tasks/deploy-prepare.yml') is file

    - name: Provision the app's database on its registered backend
      ansible.builtin.include_tasks: ../../tasks/database/deploy-consumer.yml
      when:
        - app_config.app.database is defined
        - >-
          app_config.hosting.method in (app_config.deploy | default({})).database_methods
          | default(['docker', 'kubernetes', 'native'])

    - name: Find or create the stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    - name: Provision or reuse the native guest
      ansible.builtin.include_role:
        name: _template-native
        tasks_from: provision
      vars:
        native_guest_network_app: "{{ app }}"
      when: app_config.hosting.method == 'native'

    - name: Attach the lab's storage the deploy-prepare hook named
      ansible.builtin.include_tasks: ../../tasks/proxmox/attach-host-mounts.yml
      vars:
        attach_mounts_guest: "{{ groups['deploy_' ~ instance][0] }}"
        attach_mounts_list: "{{ deploy_host_mounts }}"
        attach_mounts_owner: "{{ deploy_host_mounts_owner | default({}) }}"
      when:
        - app_config.hosting.method in ['docker', 'native']
        - deploy_host_mounts | default([]) | length > 0

    - name: Open the guest's declared network access
      ansible.builtin.include_tasks: ../../tasks/firewall/open-app-access.yml
      vars:
        wiring_app_name: "{{ instance }}"
        wiring_upstream_host: "{{ hostvars[groups['deploy_' ~ instance][0]].ansible_host }}"
        wiring_firewall: "{{ app_config.firewall | default({}) }}"
        firewall_sends_mail: "{{ app_config.firewall.sends_mail | default(false) }}"
      when:
        - app_config.hosting.method in ['docker', 'native']
        - app_config.hosting.method in _deploy_firewall_methods
        - >-
          (app_config.firewall.egress | default([]) | length > 0)
          or (app_config.firewall.inbound | default([]) | length > 0)
          or (app_config.firewall.sends_mail | default(false) | bool)

    - name: Refresh inventory for Kubernetes access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'

    - name: Open the app's declared cluster network access
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when:
        - app_config.hosting.method == 'kubernetes'
        - app_config.hosting.method in _deploy_firewall_methods

# ── Play 2: Deploy on the guest ────────────────────────────────────────────────
# Play 1 adds the guest to deploy_<instance> on the Docker and native paths only, so on
# Kubernetes this play has no hosts.
- name: "Deploy {{ app | default('(no app)') }} | Deploy on the guest"
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true

  vars:
    _deploy_role: "{{ hostvars['localhost']._deploy_role }}"

  pre_tasks:
    - name: Load platform vars
      ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml

    - name: Resolve the estate this app belongs to
      ansible.builtin.include_tasks: ../../tasks/resolve-estate.yml
      vars:
        resolve_estate_name: "{{ hostvars['localhost'].app_config.routing.estate | default('') }}"

  tasks:
    - name: Bootstrap the guest
      ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)

    - name: Configure OS update notifications
      ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml

    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'

    - name: Publish the hostname on the guest under the names the role reads
      ansible.builtin.set_fact:
        "{{ item | replace('-', '_') }}_fqdn": "{{ hostvars['localhost']._deploy_fqdn }}"
        "{{ item | replace('-', '_') }}_subdomain": "{{ hostvars['localhost']._deploy_subdomain }}"
      loop: "{{ [app, _deploy_role] | unique }}"

    - name: Deploy the app
      ansible.builtin.include_role:
        name: "{{ _deploy_role }}"

# ── Play 3: Deploy on the cluster ──────────────────────────────────────────────
- name: "Deploy {{ app | default('(no app)') }} | Deploy on the cluster"
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Deploy the app into its namespace
      ansible.builtin.include_role:
        name: "{{ _deploy_role }}"
        tasks_from: kubernetes
      when: app_config.hosting.method == 'kubernetes'

# ── Play 4: Record and wire ────────────────────────────────────────────────────
# The upstream of a Kubernetes app is the cluster's ingress VIP, which stays put across
# rescheduling, node loss and a cluster rebuild. Its guest record goes on every node of the
# cluster, since the assignment does not follow the scheduler.
- name: "Deploy {{ app | default('(no app)') }} | Record and wire"
  hosts: localhost
  become: false
  gather_facts: false

  vars:
    _deploy_k8s: "{{ app_config.hosting.method == 'kubernetes' }}"
    wiring_app_name: "{{ instance }}"
    wiring_upstream_host: >-
      {{ homelabinfra_infra.kubernetes.ingress_vip if _deploy_k8s | bool
         else hostvars[groups['deploy_' ~ instance][0]].ansible_host }}
    wiring_upstream_port: "{{ 80 if _deploy_k8s | bool else app_config.app.port }}"
    wiring_subdomain: "{{ _deploy_subdomain }}"
    wiring_domain: "{{ _deploy_fqdn }}"
    wiring_app_display: "{{ _deploy_display }} ({{ instance }})"
    wiring_monitor_url: "https://{{ _deploy_fqdn }}{{ app_config.routing.monitor_path }}"
    wiring_auth_group: "{{ app_config.routing.auth_group }}"
    wiring_identity_mode: "{{ app_config.routing.identity | default('catalog') }}"
    wiring_access: "{{ app_config.routing.access | default('internal') }}"

  tasks:
    - name: Run the role's deploy-record hook
      ansible.builtin.include_role:
        name: "{{ _deploy_role }}"
        tasks_from: deploy-record
      when: (playbook_dir ~ '/../../roles/' ~ _deploy_role ~ '/tasks/deploy-record.yml') is file

    # New-instance recovery provisions the workload without letting it publish the target
    # route or contact production peers before its selected artifact verifies.
    - name: Skip external wiring while the restore target is isolated
      ansible.builtin.meta: end_play
      when: recovery_isolated | default(false) | bool

    - name: Wire the route, sign-in, monitor and DNS name of an app that serves a UI
      when: _deploy_routed | bool
      block:
        - name: Wire reverse proxy
          ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.reverse_proxy.provider }}.yml"
          when: (homelabinfra_infra.reverse_proxy | default({})).provider | default('none') != 'none'
        - name: Wire SSO
          ansible.builtin.include_tasks: ../../tasks/wiring/authentik.yml
          when:
            - (homelabinfra_infra.sso | default({})).provider | default('none') == 'authentik'
            - wiring_identity_mode != 'none'
        - name: Wire uptime monitoring
          ansible.builtin.include_tasks: ../../tasks/wiring/uptime-kuma.yml
          when: (homelabinfra_infra.monitoring | default({})).provider | default('none') != 'none'
        - name: Wire DNS
          ansible.builtin.include_tasks: "../../tasks/wiring/{{ homelabinfra_infra.dns.provider }}.yml"
          when: (homelabinfra_infra.dns | default({})).provider | default('none') != 'none'

    - name: Record the app on its stack host, its own guest or every node of its cluster
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: >-
          {{ (homelabinfra_infra.kubernetes | default({})).nodes | default([])
             | map(attribute='name') | list
             if _deploy_k8s | bool else groups['deploy_' ~ instance] }}
        record_guest_kind: "{{ app_config.hosting.method }}"
        record_guest_url: "{{ 'https://' ~ _deploy_fqdn if _deploy_routed | bool else '' }}"

    - name: Fail if anything could not be wired
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: "{{ instance }}"

# ── Play 5: Notify ─────────────────────────────────────────────────────────────
- name: "Deploy {{ app | default('(no app)') }} | Notify"
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Notify
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: "{{ _deploy_display }} deployed"
        notify_message: >-
          {{ instance }} is running on {{ {'docker': 'Docker', 'native': 'its own guest',
          'kubernetes': 'the Kubernetes backend'}[app_config.hosting.method] }}{{
          (' at https://' ~ _deploy_fqdn) if _deploy_routed | bool else '' }}. {{ deploy_notify_note | default((app_config.deploy | default({})).notify_note | default('')) }}
      when: not (recovery_isolated | default(false) | bool)
