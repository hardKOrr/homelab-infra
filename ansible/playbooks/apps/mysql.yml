---
- name: MySQL | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe backend instance name: -e instance=mysql"
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/mysql.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.mysql_defaults | combine(_instance_config | default({}), recursive=True) }}"
    - name: Validate supported hosting method
      ansible.builtin.include_tasks: ../../tasks/hosting/validate-app.yml
      vars:
        hosting_app_slug: mysql
    # Kubernetes only: the server's root credential lives in the instance's canonical item.
    - name: Merge the instance's Vaultwarden item for the Kubernetes method
      ansible.builtin.set_fact:
        app_config: >-
          {{ app_config | combine({'app': (homelabinfra_vault.apps | default({})).get(instance, {})},
                                  recursive=True) }}
      no_log: true
      when: app_config.hosting.method == 'kubernetes'
  tasks:
    - ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'native'
    - name: Resolve this instance's guest, reusing one Remove kept
      ansible.builtin.include_tasks: ../../tasks/proxmox/resolve-instance-guest.yml
      vars: {resolve_guest_instance: "{{ instance }}"}
      when: app_config.hosting.method == 'native'
    - ansible.builtin.set_fact:
        _existing_hosts: "{{ resolve_guest_hosts }}"
      when: app_config.hosting.method == 'native'
    - ansible.builtin.include_tasks: ../../tasks/database/resolve-backend-placement.yml
      when: app_config.hosting.method == 'native'
    - ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: "{{ hostvars[_existing_hosts[0]].ansible_host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        _database_backend_guest_type: "{{ _database_backend_guest_type }}"
      changed_when: false
      when: app_config.hosting.method == 'native' and _existing_hosts | length > 0
    - ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars: {ensure_guest_host: "{{ _existing_hosts[0] }}"}
      when: app_config.hosting.method == 'native' and _existing_hosts | length > 0
    - name: Provision a new MySQL backend guest
      ansible.builtin.include_tasks: ../../tasks/database/provision-backend-guest.yml
      vars:
        database_backend_network_app: mysql
      when: app_config.hosting.method == 'native'

    # Docker: the stack host (LXC or VM per the stack's guest_type), found or created.
    - name: Find or create the stack host
      ansible.builtin.import_tasks: ../../tasks/stack/find-or-create-host.yml
      vars:
        stack_name: "{{ app_config.stack }}"
        stack_estate: "{{ app_config.routing.estate | default('', true) }}"
        deploy_group: "deploy_{{ instance }}"
      when: app_config.hosting.method == 'docker'

    # Kubernetes: no guest. The consumers' firewall access, then the workload on the cluster.
    - name: Refresh inventory for Kubernetes access
      ansible.builtin.meta: refresh_inventory
      when: app_config.hosting.method == 'kubernetes'

    - name: Open the backend's declared network access
      ansible.builtin.include_tasks: ../../tasks/kubernetes/open-app-access.yml
      when: app_config.hosting.method == 'kubernetes'

    - name: Open the port for the registered consumers
      ansible.builtin.include_tasks: ../../tasks/database/open-consumer-access.yml
      vars:
        database_consumer_provider: mysql
      when: app_config.hosting.method == 'kubernetes'

    - name: Deploy MySQL on Kubernetes
      ansible.builtin.include_role:
        name: mysql
        tasks_from: kubernetes
      when: app_config.hosting.method == 'kubernetes'

- name: MySQL | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.include_role:
        name: docker
      when: hostvars['localhost'].app_config.hosting.method == 'docker'
    - ansible.builtin.include_role: {name: mysql}

- name: MySQL | Register backend
  hosts: localhost
  gather_facts: false
  vars:
    _mysql_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
  tasks:
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: >-
          {{ {instance: {'provider': 'mysql',
             'host': _mysql_host.ansible_host,
             'port': _mysql_host.app_config.app.port,
             'client_hosts': _mysql_host.app_config.app.client_hosts}} }}
      when: app_config.hosting.method != 'kubernetes'
    - ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_kind: "{{ 'docker' if _mysql_host.app_config.hosting.method == 'docker' else 'native' }}"
      when: app_config.hosting.method != 'kubernetes'

    # `kubernetes` marks a backend that runs in the cluster, for the shared database tasks.
    # Facts merge recursively, so a guest backend writes an empty string over a marker an
    # earlier Kubernetes Deploy left instead of keeping it.
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: "{{ {instance: {'kubernetes': ''}} }}"
      when: app_config.hosting.method != 'kubernetes'

    # A backend on Kubernetes is reached at the ingress address, on app.port, and its SQL
    # runs in its pod.
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data: >-
          {{ {instance: {'provider': 'mysql',
                         'host': homelabinfra_infra.kubernetes.ingress_vip,
                         'port': app_config.app.port,
                         'client_hosts': app_config.app.client_hosts,
                         'kubernetes': {'namespace': 'app-' ~ instance}}} }}
      when: app_config.hosting.method == 'kubernetes'
    - name: Record the app on the Kubernetes nodes
      ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
      vars:
        record_guest_names: "{{ homelabinfra_infra.kubernetes.nodes | map(attribute='name') | list }}"
        record_guest_kind: kubernetes
        record_guest_url: ''
      when: app_config.hosting.method == 'kubernetes'
