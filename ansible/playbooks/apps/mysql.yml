---
- name: MySQL | Provision
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.assert:
        that: instance is defined and instance is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Provide a safe backend instance name: -e instance=mysql"
    - ansible.builtin.include_vars:
        file: ../../vars/app-defaults/mysql.yml
        name: _app_defaults
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../config/apps/{{ instance }}.yml"
        name: _instance_config
      failed_when: false
    - ansible.builtin.set_fact:
        app_config: "{{ _app_defaults.mysql_defaults | combine(_instance_config | default({}), recursive=True) }}"
  tasks:
    - ansible.builtin.meta: refresh_inventory
    - ansible.builtin.include_tasks: ../../tasks/proxmox/tag-group.yml
      vars: {tag_group_tag: "_{{ instance }}"}
    - ansible.builtin.set_fact:
        _existing_hosts: "{{ groups[tag_group_name] | default([]) }}"
    - ansible.builtin.add_host:
        name: "{{ _existing_hosts[0] }}"
        groups: "deploy_{{ instance }}"
        ansible_host: "{{ hostvars[_existing_hosts[0]].ansible_host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
      changed_when: false
      when: _existing_hosts | length > 0
    - ansible.builtin.include_tasks: ../../tasks/proxmox/ensure-guest-running.yml
      vars: {ensure_guest_host: "{{ _existing_hosts[0] }}"}
      when: _existing_hosts | length > 0
    - name: Provision MySQL LXC
      when: _existing_hosts | length == 0
      block:
        - ansible.builtin.set_fact:
            homelabinfra_config: >-
              {{ homelabinfra_config | combine({'proxmox': {'lxc': app_config.proxmox | combine({'hostname': instance, 'tags': (app_config.proxmox.tags + ['_' ~ instance]) | unique}, recursive=True)}}, recursive=True) }}
        - ansible.builtin.include_tasks: ../../tasks/network/resolve-network.yml
          vars: {resolve_network_app: mysql, resolve_network_estate: ''}
        - ansible.builtin.import_tasks: ../../tasks/network/generate-ip.yml
          vars:
            network_name: "{{ app_config.proxmox.network | default('', true) }}"
            pool_name: "{{ app_config.proxmox.pool | default('') }}"
            requested_ip_address: "{{ app_config.proxmox.ip_address | default('') }}"
        - ansible.builtin.set_fact:
            homelabinfra_config: "{{ homelabinfra_config | combine({'proxmox': {'lxc': {'ip_address': homelabinfra_instance.network.ip_address}}}, recursive=True) }}"
        - ansible.builtin.include_tasks: ../../tasks/proxmox/ip-to-vmid.yml
        - ansible.builtin.include_tasks: ../../tasks/proxmox/lxc-create.yml
        - ansible.builtin.add_host:
            name: "{{ homelabinfra_instance.lxc.hostname }}"
            groups: "deploy_{{ instance }}"
            ansible_host: "{{ homelabinfra_instance.network.ip_address }}"
            ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
            app_config: "{{ app_config }}"

- name: MySQL | Deploy
  hosts: "deploy_{{ instance | default('_instance_unset') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.import_tasks: ../../tasks/load-user-vars.yml
    - ansible.builtin.import_tasks: ../../tasks/guest-bootstrap.yml
      when: not (ansible_local.homelab_bootstrapped.bootstrapped | default(false) | bool)
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/configure-unattended-upgrades.yml
  tasks:
    - ansible.builtin.include_role: {name: mysql}

- name: MySQL | Register backend
  hosts: localhost
  gather_facts: false
  vars: {_mysql_host: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"}
  tasks:
    - ansible.builtin.import_tasks: ../../tasks/bootstrap/write-generated-facts.yml
      vars:
        generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
        generated_facts_service: databases
        generated_facts_data:
          "{{ instance }}":
            provider: mysql
            host: "{{ _mysql_host.ansible_host }}"
            port: "{{ _mysql_host.app_config.app.port }}"
            client_hosts: "{{ _mysql_host.app_config.app.client_hosts }}"
    - ansible.builtin.include_tasks: ../../tasks/proxmox/record-app-on-guest.yml
