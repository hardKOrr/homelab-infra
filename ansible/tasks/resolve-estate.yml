---
# Resolve the app's estate and overlay estate-scoped facts onto homelabinfra_infra.
# Called in Play 3 (Wire) after infrastructure facts are loaded, before any wiring
# task runs. Spec: ansible/vars/CONTRACT.md §3 (estates) and §5 (domains map).
#
# An ESTATE is a named domain scope declared in config/infrastructure.yml under
# `domains:` — its own domain and its own SSO instance (optionally its own DNS),
# sharing one reverse proxy, notifications, monitoring, metrics and backups with
# the rest of the lab. The plain `domain:` scalar remains valid shorthand for a
# single default estate, so a lab without `domains:` never reaches the overlay.
#
# Inputs:
#   resolve_estate_name — the app's routing.estate ('' or undefined = default estate)
#   homelabinfra_infra  — loaded facts (may be undefined pre-bootstrap)
#
# Effect (set_fact wins over the include_vars-loaded copy for the rest of the play):
#   homelabinfra_infra.domain — the estate's domain, so wiring_domain computes
#                               <subdomain>.<estate-domain> with no wiring changes
#   homelabinfra_infra.sso    — the estate's sso registry entry, replaced WHOLE
#                               (never merged — a default-estate token must not leak
#                               into another estate); {provider: none} until that
#                               estate's SSO service is deployed
#   homelabinfra_infra.dns    — the estate's dns entry when one is recorded;
#                               otherwise the global dns entry serves every estate,
#                               with the estate's authored `dns:` block (provider,
#                               host, validate_certs) overlaid on top of it
#
# Estate-scoped endpoints live in facts.yml under estates.<name>.<role_key>,
# written by tasks/bootstrap/write-generated-facts.yml (generated_facts_estate).
# The default estate always uses the top-level keys — for it, and for labs without
# a domains map, this file is a no-op and behavior is byte-identical to before.

- name: Resolve estate | Load domain declarations
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../config/infrastructure.yml"
    name: _estate_infra_cfg
  failed_when: false   # absent on a clean checkout — falls through to single-estate

# The single-estate domain is AUTHORED config, and this is the file that decides which
# domain applies — so it resolves it from the authored source rather than depending on a
# copy in the registry.
#
# Only bootstrap.yml's Play 1 ever wrote `domain` into facts.yml, so deploying any app on
# its own before a bootstrap run left homelabinfra_infra.domain unset and wiring failed
# with "needs the wiring contract vars: ... wiring_domain" — which names the symptom and
# not the cause, because wiring_domain is composed as <subdomain>.<domain> and it was the
# domain half that was empty. That contradicts the standing promise that deploying one app
# standalone registers it exactly as a bootstrap run does.
#
# Reading the authored value also means editing `domain:` in config/infrastructure.yml
# takes effect on the next deploy, instead of waiting for a bootstrap re-run to refresh
# the cached copy.
#
# Runs BEFORE the estate overlay below, so a multi-estate lab still replaces this with its
# estate's own domain and nothing about that path changes.
- name: Resolve estate | Default the domain from authored config
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ homelabinfra_infra | default({}, true)
         | combine({'domain': _estate_infra_cfg.domain}) }}
  when:
    - _estate_infra_cfg.domain is defined
    - (_estate_infra_cfg.domain | default('') | length) > 0
    - ((homelabinfra_infra | default({}, true)).domain | default('') | length) == 0

- name: Resolve estate | Compute estate names
  ansible.builtin.set_fact:
    _estate_domains: "{{ _estate_infra_cfg.domains | default({}) }}"
    # Default estate: the entry with `default: true`, else the first declared entry,
    # else '' (no domains map — the implicit single estate).
    _estate_default: >-
      {{ (_estate_infra_cfg.domains | default({}) | dict2items
          | selectattr('value.default', 'defined')
          | selectattr('value.default')
          | map(attribute='key') | list | first)
         | default(_estate_infra_cfg.domains | default({}) | list | first | default(''), true) }}

- name: Resolve estate | Select the app's estate
  ansible.builtin.set_fact:
    _estate_selected: "{{ resolve_estate_name | default('', true) or _estate_default }}"

- name: Resolve estate | Assert a named estate is declared
  ansible.builtin.assert:
    that: _estate_selected in _estate_domains
    fail_msg: >-
      routing.estate is '{{ _estate_selected }}' but config/infrastructure.yml declares
      no domains.{{ _estate_selected }} entry. Declare the estate or drop the key.
  when:
    - _estate_selected | length > 0
    - _estate_domains | length > 0

- name: Resolve estate | Overlay estate-scoped facts
  ansible.builtin.set_fact:
    # Non-recursive combine on purpose: domain/sso/dns are replaced whole so no
    # credential from the default estate survives into another estate's wiring.
    homelabinfra_infra: "{{ homelabinfra_infra | combine(_estate_overlay) }}"
  vars:
    _estate_scope: "{{ (homelabinfra_infra.estates | default({}))[_estate_selected] | default({}) }}"
    _estate_overlay: >-
      {{ {'domain': _estate_domains[_estate_selected].domain,
          'sso': _estate_scope.sso | default({'provider': 'none'})}
         | combine({'dns': _estate_scope.dns} if _estate_scope.dns is defined else {}) }}
  when:
    - homelabinfra_infra is defined
    - _estate_selected | length > 0
    - _estate_selected != _estate_default
    - _estate_selected in _estate_domains

# DNS is the one provider an estate shares with the rest of the lab BY DEFAULT and
# still has to be able to select per estate. `infrastructure.dns.provider` is global,
# so a lab whose default estate is already served by hand-built records cannot turn
# platform DNS on for a second estate without rewriting the first estate's zone as each
# of its apps is next deployed (the reason DNS scope was set to one estate on
# 2026-08-15).
#
# The split this makes possible: the CREDENTIAL stays in one place — the global
# `homelab-infra/dns` vault item, inherited by every estate through the merge in
# load-user-vars.yml — while the estate's authored `domains.<name>.dns` block carries
# only the non-secret half (provider, host, validate_certs). One OPNsense server serving
# two estates is therefore one stored credential and two provider declarations, not two
# copies of an API key.
#
# Applies to EVERY estate, the default one included, so `domains.<default>.dns:
# {provider: none}` holds the default estate out while the global entry drives another.
# A lab that declares no per-estate `dns:` block reaches none of this and behaves
# exactly as before.
- name: Resolve estate | Overlay the estate's authored DNS provider
  ansible.builtin.set_fact:
    # Non-recursive: the authored block replaces the fields it names and inherits the
    # rest — a provider switch must not leave the previous provider's host behind.
    homelabinfra_infra: "{{ homelabinfra_infra | combine({'dns': _estate_dns}) }}"
  vars:
    _estate_dns_authored: >-
      {{ (_estate_domains[_estate_selected] | default({})).dns | default({}) }}
    _estate_dns: >-
      {{ (homelabinfra_infra.dns | default({}, true)) | combine(_estate_dns_authored) }}
  when:
    - homelabinfra_infra is defined
    - _estate_selected | length > 0
    - _estate_selected in _estate_domains
    - _estate_dns_authored | length > 0
