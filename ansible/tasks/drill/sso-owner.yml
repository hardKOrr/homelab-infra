---
# Make the lab-only login a browser canary signs in with when the app's route is behind
# Authentik forward auth (routing.identity: forward_auth): Vaultwarden item
# homelab-infra/apps/<app>-drill-owner (username, password) and an active Authentik account
# of that name in the route's access group, holding that password.
# playbooks/maintenance/drill-canary.yml runs this for drill_action=owner, which
# tools/lab-drill sends before the first browser canary whose spec signs in as the drill
# owner. A second run keeps the stored password and sets it again, so a fresh Authentik
# (its own drill deletes its data) gets the account back.
#
# Inputs: instance, app_config and _rat_app from drill-canary.yml; homelabinfra_infra.sso
# already overlaid for the instance's estate.
- name: Drill SSO owner | Name the owner and the Authentik API
  ansible.builtin.set_fact:
    _dso_item: "{{ _rat_app }}-drill-owner"
    _dso_group: "{{ (app_config.routing | default({})).auth_group | default('homelab-users', true) }}"
    _dso_api: "{{ (homelabinfra_infra.sso | default({})).host | default('') }}/api/v3"
    _dso_headers:
      Authorization: "Bearer {{ (homelabinfra_infra.sso | default({})).token | default('') }}"
  no_log: true

- name: Drill SSO owner | Require Authentik as the SSO provider
  ansible.builtin.assert:
    that:
      - (app_config.routing | default({})).identity | default('') == 'forward_auth'
      - (homelabinfra_infra.sso | default({})).provider | default('none') == 'authentik'
      - _dso_api is match('^https?://')
    fail_msg: >-
      The drill owner is an Authentik account for a forward_auth route: {{ instance }}'s
      identity is '{{ (app_config.routing | default({})).identity | default('') }}' and the
      estate's SSO provider '{{ (homelabinfra_infra.sso | default({})).provider | default('none') }}'.

- name: Drill SSO owner | Store a new drill owner
  ansible.builtin.include_tasks: ../bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ _dso_item }}"
    vault_item_fields:
      username: "{{ _dso_item }}"
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    vault_item_secret_fields: [password]
  when: ((homelabinfra_vault.apps | default({})).get(_dso_item, {})).password | default('') | length == 0

- name: Drill SSO owner | Keep the drill owner
  ansible.builtin.set_fact:
    _dso_owner: "{{ homelabinfra_vault.apps[_dso_item] }}"
  no_log: true

- name: Drill SSO owner | Find the account and the access group
  ansible.builtin.uri:
    url: "{{ _dso_api }}/{{ item }}"
    headers: "{{ _dso_headers }}"
    return_content: true
  register: _dso_read
  changed_when: false
  loop:
    - "core/users/?username={{ _dso_item | urlencode }}"
    - "core/groups/?name={{ _dso_group | urlencode }}"

- name: Drill SSO owner | Require the access group
  ansible.builtin.assert:
    that: _dso_read.results[1].json.results | length == 1
    fail_msg: >-
      Authentik has no group '{{ _dso_group }}'. Deploy {{ instance }} first: its wiring
      creates the access group.

- name: Drill SSO owner | Create the account in the access group
  ansible.builtin.uri:
    url: "{{ _dso_api }}/core/users/"
    method: POST
    headers: "{{ _dso_headers }}"
    body_format: json
    body:
      username: "{{ _dso_item }}"
      name: "{{ _dso_item }}"
      is_active: true
      groups: ["{{ _dso_read.results[1].json.results[0].pk }}"]
    status_code: 201
  register: _dso_created
  changed_when: true
  when: _dso_read.results[0].json.results | length == 0

- name: Drill SSO owner | Keep the account
  ansible.builtin.set_fact:
    _dso_user: >-
      {{ _dso_created.json if _dso_created is not skipped
         else _dso_read.results[0].json.results[0] }}

- name: Drill SSO owner | Activate the account in the access group
  ansible.builtin.uri:
    url: "{{ _dso_api }}/core/users/{{ _dso_user.pk }}/"
    method: PATCH
    headers: "{{ _dso_headers }}"
    body_format: json
    body:
      is_active: true
      groups: "{{ (_dso_user.groups | default([])) | union([_dso_read.results[1].json.results[0].pk]) }}"
  changed_when: true
  when: >-
    not (_dso_user.is_active | default(false))
    or _dso_read.results[1].json.results[0].pk not in (_dso_user.groups | default([]))

# Hidden because the body is the password; the assert below prints the status.
- name: Drill SSO owner | Set the stored password
  ansible.builtin.uri:
    url: "{{ _dso_api }}/core/users/{{ _dso_user.pk }}/set_password/"
    method: POST
    headers: "{{ _dso_headers }}"
    body_format: json
    body: {password: "{{ _dso_owner.password }}"}
    status_code: [200, 204]
  register: _dso_password
  failed_when: false
  changed_when: false
  no_log: true

- name: Drill SSO owner | Require the password set
  ansible.builtin.assert:
    that: _dso_password.status | default(-1) in [200, 204]
    fail_msg: >-
      Setting {{ _dso_item }}'s Authentik password answered HTTP
      {{ _dso_password.status | default(-1) }}: {{ _dso_password.msg | default('') }}
