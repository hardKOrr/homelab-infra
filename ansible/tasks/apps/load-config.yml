---
# Load one app instance's merged config: the app's defaults, the instance file, and the
# instance's Vaultwarden item. Every deploy playbook loads its config here, after
# tasks/load-user-vars.yml (which supplies _luv_vars_file, _luv_config_dir and
# homelabinfra_vault).
#
# The merge order and its steps are in vars/contract/app-layering.md. The Vaultwarden
# item lands under `app`; an instance with no item still gets `app: {}`.
#
# Inputs: instance; load_config_app (the app slug); optional load_config_layer (default
# {}), load_config_vault_methods (the hosting methods that take the Vaultwarden item;
# default every method, [] for none), load_config_instance_required
# (default false), load_config_fact (default app_config).
# Results: the merged config in load_config_fact; _app_defaults and _instance_config as
# loaded, for steps that need the authored instance values alone.

- name: Load the app's defaults
  ansible.builtin.include_vars:
    file: "{{ _luv_vars_file | dirname }}/app-defaults/{{ load_config_app }}.yml"
    name: _app_defaults

- name: Load the instance config (optional unless the app requires one)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/apps/{{ instance }}.yml"
    name: _instance_config
  register: _load_config_instance
  failed_when:
    - load_config_instance_required | default(false) | bool
    - _load_config_instance.failed | default(false)

- name: Merge the defaults and the instance config
  ansible.builtin.set_fact:
    "{{ load_config_fact | default('app_config') }}": >-
      {{ _app_defaults[(load_config_app | replace('-', '_')) ~ '_defaults']
         | combine(load_config_layer | default({}), recursive=True)
         | combine(_instance_config | default({}), recursive=True) }}

- name: Overlay the instance's Vaultwarden item
  ansible.builtin.set_fact:
    "{{ load_config_fact | default('app_config') }}": >-
      {{ _load_config_merged
         | combine({'app': (homelabinfra_vault.apps | default({})).get(instance, {})},
                   recursive=True) }}
  vars:
    _load_config_merged: "{{ lookup('ansible.builtin.vars', load_config_fact | default('app_config')) }}"
  when: >-
    load_config_vault_methods is not defined
    or (_load_config_merged.hosting | default({})).method | default('') in load_config_vault_methods
  no_log: true
