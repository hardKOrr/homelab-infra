---
# Load one app instance's merged config: the defaults every app shares
# (vars/app-defaults/_base.yml), the app's defaults, the instance file, and the
# instance's Vaultwarden item. Every deploy playbook loads its config here, after
# tasks/load-user-vars.yml (which supplies _luv_vars_file, _luv_config_dir and
# homelabinfra_vault).
#
# The merge order and its steps are in vars/contract/app-layering.md. The Vaultwarden
# item lands under `app`; an instance with no item still gets `app: {}`.
#
# Inputs: instance; load_config_app (the app slug); optional load_config_layer (default
# {}, merged over the infrastructure.yml keys the defaults name in `platform_layers`),
# load_config_vault_methods (the hosting methods that take the Vaultwarden item;
# default the defaults' `vault.methods`, else every method; [] for none),
# load_config_instance_required
# (default false), load_config_fact (default app_config).
# Results: the merged config in load_config_fact; _app_defaults and _instance_config as
# loaded, for steps that need the authored instance values alone.

- name: Load the defaults every app shares
  ansible.builtin.include_vars:
    file: "{{ _luv_vars_file | dirname }}/app-defaults/_base.yml"
    name: _base_defaults_file

- name: Load the app's defaults
  ansible.builtin.include_vars:
    file: "{{ _luv_vars_file | dirname }}/app-defaults/{{ load_config_app }}.yml"
    name: _app_defaults

- name: Load the instance config (optional unless the app requires one)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/apps/{{ instance }}.yml"
    name: _instance_config
  register: _load_config_instance
  failed_when:
    - load_config_instance_required | default(false) | bool
    - _load_config_instance.failed | default(false)

# The platform layer: each infrastructure.yml key the app's defaults name in
# `platform_layers` (e.g. media_storage), under the same key or, for an entry
# {name: <key>, from: <infrastructure key>}, under `name`; then load_config_layer.
- name: Merge the defaults and the instance config
  ansible.builtin.set_fact:
    "{{ load_config_fact | default('app_config') }}": >-
      {{ _load_config_defaults
         | combine(_load_config_platform, recursive=True)
         | combine(load_config_layer | default({}), recursive=True)
         | combine(_instance_config | default({}), recursive=True) }}
  vars:
    _load_config_defaults: >-
      {{ _base_defaults_file._base_defaults
         | combine(_app_defaults[(load_config_app | replace('-', '_')) ~ '_defaults'],
                   recursive=True) }}
    _load_config_platform: >-
      {%- set infra = (homelabinfra_config | default({})).infrastructure | default({}) -%}
      {%- set out = {} -%}
      {%- for layer in _load_config_defaults.platform_layers | default([]) -%}
      {%- if layer is mapping -%}
      {%- set _ = out.update({layer.name: infra[layer.from] | default({})}) -%}
      {%- else -%}
      {%- set _ = out.update({layer: infra[layer] | default({})}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Overlay the instance's Vaultwarden item
  ansible.builtin.set_fact:
    "{{ load_config_fact | default('app_config') }}": >-
      {{ _load_config_merged
         | combine({'app': (homelabinfra_vault.apps | default({})).get(instance, {})},
                   recursive=True) }}
  vars:
    _load_config_merged: "{{ lookup('ansible.builtin.vars', load_config_fact | default('app_config')) }}"
    _load_config_methods: >-
      {{ load_config_vault_methods
         | default((_load_config_merged.vault | default({})).methods | default('every')) }}
  when: >-
    _load_config_methods == 'every'
    or (_load_config_merged.hosting | default({})).method | default('') in _load_config_methods
  no_log: true
