---
# Back up named host paths to one verified PBS recovery point.
#
# Inputs:
#   pbs_client_runtime        docker | native (see pbs-client-run.yml)
#   pbs_client_archives       [{name: data.pxar, path: /abs/dir}], one or more
#   pbs_client_backup_args    optional extra `backup` arguments, such as
#                             ['--exclude', '/logs'] or ['--all-file-systems', 'true']
#   pbs_client_backup_mounts  optional [{path, target}]: host directories seen read-only at
#                             `target`, an existing empty directory inside an archive path,
#                             so one archive holds several host directories. Pass
#                             ['--all-file-systems', 'true'] so the client enters them
#   pbs_client_backup_id      optional; default `backup.backup_id`, else `instance`
#   pbs_client_keep_last      optional, default 2 and never less
#   pbs_client_keep_daily     optional, default `backup.retention_days` (14); '' omits it
#   pbs_client_prune          optional, default true; false keeps every point, for an
#                             application whose points PBS's own retention prunes
#   pbs_client_stop_services  optional services stopped for the upload and started after:
#                             Compose services in pbs_client_compose_project (docker), or
#                             systemd units, restarted only when they were running (native)
#   pbs_client_compose_project  the Compose project directory for docker services
#   pbs_client_quiesced_hook  optional task file run after the stop, before the upload,
#                             for app-specific capture such as a database export
#
# Sets:
#   pbs_client_recovery_point  host/<backup id>/<UTC time>, verified to hold every archive
#
# Recovery point identity: the point is named by its UTC backup time, which this file
# chooses and passes as --backup-time, so the new point is known without parsing client
# output. Pruning keeps at least the two newest points, and the run proves the point that
# was newest before it still exists afterwards. A same-day pre-restore safety backup
# therefore never prunes away the point the operator is about to restore. The rules live
# in scripts/pbs-client.sh, which an application's guest-side cron backup also runs.

- name: PBS backup | Resolve the recovery identity
  ansible.builtin.set_fact:
    _pbs_backup_id: >-
      {{ pbs_client_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _pbs_backup_keep_last: "{{ pbs_client_keep_last | default(2) | int }}"
    _pbs_backup_keep_daily: >-
      {{ pbs_client_keep_daily | default(app_config.backup.retention_days | default(14), true) }}
    _pbs_backup_archives: "{{ pbs_client_archives | default([]) }}"
    _pbs_backup_services: "{{ pbs_client_stop_services | default([]) }}"
    _pbs_backup_mounts: "{{ pbs_client_backup_mounts | default([]) }}"
    _pbs_backup_prune: "{{ pbs_client_prune | default(true) | bool }}"
    pbs_client_recovery_point: ""

- name: PBS backup | Validate the backup request
  ansible.builtin.assert:
    that:
      - _pbs_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - _pbs_backup_keep_last | int >= 2
      - (_pbs_backup_keep_daily | string) is match('^([0-9]+)?$')
      - _pbs_backup_archives | length > 0
      - _pbs_backup_archives | map(attribute='name') | select('match', '^[A-Za-z0-9][A-Za-z0-9_.-]*\.(pxar|img|conf|log)$') | list | length == _pbs_backup_archives | length
      - _pbs_backup_archives | map(attribute='name') | unique | list | length == _pbs_backup_archives | length
      - _pbs_backup_services | length == 0 or pbs_client_runtime == 'native' or pbs_client_compose_project | default('') | length > 0
      - _pbs_backup_mounts | rejectattr('target', 'defined') | list | length == 0
      - >-
        _pbs_backup_mounts | map(attribute='target') | select('match',
        '^(' ~ (_pbs_backup_archives | map(attribute='path') | map('regex_escape') | join('|')) ~ ')/')
        | list | length == _pbs_backup_mounts | length
    fail_msg: >-
      PBS backup needs a safe backup id, keep_last of at least 2 so the previous point
      survives a same-day backup, and uniquely named archives
      (<name>.pxar|img|conf|log). Docker services to stop need their Compose project.
      Each extra mount needs a target inside an archive path.

- name: PBS backup | Resolve the PBS client target
  ansible.builtin.include_tasks: resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: PBS backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for {{ instance }}. Deploy PBS and retry; no local archive
      is treated as a recovery point.

- name: PBS backup | Check each archive source
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ _pbs_backup_archives }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pbs_backup_sources
  changed_when: false

- name: PBS backup | Check each extra mount source and target
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ (_pbs_backup_mounts | map(attribute='path') | list) + (_pbs_backup_mounts | map(attribute='target') | list) }}"
  register: _pbs_backup_mount_paths
  changed_when: false

- name: PBS backup | Require real extra mount directories
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: >-
      {{ item.item }} is missing, a link, or not a directory; refusing to create a recovery
      point without it.
  loop: "{{ _pbs_backup_mount_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: PBS backup | Require real archive sources
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.isdir | default(false) or not item.item.name.endswith('.pxar')
    fail_msg: >-
      {{ item.item.name }} source {{ item.item.path }} is missing, a link, or not a
      directory; refusing to create a recovery point without it.
  loop: "{{ _pbs_backup_sources.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: PBS backup | Read which native services are running
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop: "{{ _pbs_backup_services if pbs_client_runtime == 'native' else [] }}"
  register: _pbs_backup_service_state
  changed_when: false
  failed_when: false

- name: PBS backup | Quiesce, upload and verify
  block:
    - name: PBS backup | Stop the Compose services
      community.docker.docker_compose_v2:
        project_src: "{{ pbs_client_compose_project }}"
        state: stopped
        services: "{{ _pbs_backup_services }}"
      when:
        - pbs_client_runtime == 'docker'
        - _pbs_backup_services | length > 0

    - name: PBS backup | Stop the native services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ _pbs_backup_services if pbs_client_runtime == 'native' else [] }}"

    - name: PBS backup | Run the application capture hook
      ansible.builtin.include_tasks: "{{ pbs_client_quiesced_hook }}"
      when: pbs_client_quiesced_hook | default('') | length > 0

    - name: PBS backup | Upload, verify and prune
      ansible.builtin.include_tasks: pbs-client-run.yml
      vars:
        pbs_client_context: "PBS backup of host/{{ _pbs_backup_id }}"
        pbs_client_changes: true
        pbs_client_args: >-
          {{ (_pbs_backup_mounts | map(attribute='path') | zip(_pbs_backup_mounts | map(attribute='target'))
              | map('join', ':') | map('regex_replace', '^', '--mount=') | list)
             + ['backup', '--id', _pbs_backup_id, '--keep-last', _pbs_backup_keep_last | string]
             + (['--keep-daily', _pbs_backup_keep_daily | string] if _pbs_backup_keep_daily | string | length > 0 else [])
             + ([] if _pbs_backup_prune else ['--no-prune'])
             + (_pbs_backup_archives | map(attribute='name') | zip(_pbs_backup_archives | map(attribute='path'))
                | map('join', ':') | list)
             + (['--'] + pbs_client_backup_args if pbs_client_backup_args | default([]) | length > 0 else []) }}

    - name: PBS backup | Record the verified recovery point
      ansible.builtin.set_fact:
        pbs_client_recovery_point: "{{ pbs_client_output | trim | split('\n') | last }}"

    - name: PBS backup | Require the recovery point identity
      ansible.builtin.assert:
        that: >-
          pbs_client_recovery_point is match('^host/' ~ (_pbs_backup_id | regex_escape)
          ~ '/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
        fail_msg: >-
          PBS backup finished without reporting a recovery point in host/{{ _pbs_backup_id }}.

    - name: PBS backup | Report the verified recovery point
      ansible.builtin.debug:
        msg: "Recovery point {{ pbs_client_recovery_point }} is verified."
  always:
    - name: PBS backup | Start the Compose services
      community.docker.docker_compose_v2:
        project_src: "{{ pbs_client_compose_project }}"
        state: present
        services: "{{ _pbs_backup_services }}"
      when:
        - pbs_client_runtime == 'docker'
        - _pbs_backup_services | length > 0

    - name: PBS backup | Restart the native services that were running
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: started
      loop: "{{ _pbs_backup_service_state.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc | default(1) == 0
