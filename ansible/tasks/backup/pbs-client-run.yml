# Run one request of the shared PBS client script on the current host.
# pbs-client-backup.yml and pbs-client-restore.yml build the requests; a role calls those
# two files, not this one.
#
# Inputs:
#   pbs_client_runtime   docker | native (see scripts/pbs-client.sh)
#   pbs_client_args      the script's arguments: optional --mount pairs, then a command
#                        (backup, list, verify, extract) and its arguments
#   pbs_client_context   label for a failure message
#   pbs_client_changes   true when the request changes PBS or the host
#   pbs_client_source    optional overrides of vars/pbs-client.yml; default the
#                        application's `backup.client`
#   k8s_pbs_*            from resolve-pbs-target.yml
#
# Sets:
#   pbs_client_output    the script's stdout
#
# scripts/pbs-client.sh holds the tmpfs, pinned install and recovery-point rules, so an
# application's own guest-side recovery script (pbs-client-script.yml) runs exactly the
# same client path.

- name: PBS client | Load the client pins
  ansible.builtin.include_vars:
    file: ../../vars/pbs-client.yml

- name: PBS client | Resolve the client source
  ansible.builtin.set_fact:
    _pbs_client_run: >-
      {{ pbs_client_defaults | combine(pbs_client_source | default(app_config.backup.client | default({}), true), recursive=True) }}

- name: PBS client | Validate the run request
  ansible.builtin.assert:
    that:
      - pbs_client_runtime | default('') in ['docker', 'native']
      - pbs_client_args | default([]) | length > 0
      - _pbs_client_run.suite in _pbs_client_run.suites
      - k8s_pbs_available | default(false) | bool
    fail_msg: >-
      {{ pbs_client_context | default('PBS client') }}: the run needs runtime docker or
      native, a request, a pinned client suite and a resolved PBS target.

# Each run copies the script into its own directory and removes it after; only a guest
# whose own recovery script needs it keeps an installed copy (pbs-client-script.yml). The
# command module runs it without a terminal, so the client's stderr stays out of stdout.
# The directory is outside /tmp, which the native runtime covers with the client's tmpfs.
- name: PBS client | Run the client script
  block:
    - name: PBS client | Create this run's script directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        suffix: -pbs-client
      register: _pbs_client_run_dir

    - name: PBS client | Copy the client script
      ansible.builtin.copy:
        src: scripts/pbs-client.sh
        dest: "{{ _pbs_client_run_dir.path }}/pbs-client.sh"
        mode: "0700"

    - name: PBS client | Run the client
      ansible.builtin.command:
        argv: "{{ [_pbs_client_run_dir.path ~ '/pbs-client.sh'] + pbs_client_args | map('string') | list }}"
      vars:
        _pbs_client_run_pin: "{{ _pbs_client_run.suites[_pbs_client_run.suite] }}"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        PBS_CLIENT_RUNTIME: "{{ pbs_client_runtime }}"
        PBS_CLIENT_TMPFS_SIZE: "{{ _pbs_client_run.tmpfs_size }}"
        PBS_CLIENT_IMAGE: "{{ _pbs_client_run.image }}"
        PBS_CLIENT_VERSION: "{{ _pbs_client_run_pin.version }}"
        PBS_CLIENT_KEY_URL: "{{ _pbs_client_run_pin.key_url }}"
        PBS_CLIENT_APT_SOURCE: >-
          {{ _pbs_client_run.repository }} {{ _pbs_client_run.suite }} {{ _pbs_client_run.component }}
      register: _pbs_client_run_result
      failed_when: false
      changed_when: pbs_client_changes | default(false) | bool
      no_log: true
  always:
    - name: PBS client | Remove this run's script directory
      ansible.builtin.file:
        path: "{{ _pbs_client_run_dir.path }}"
        state: absent
      when: _pbs_client_run_dir.path is defined

- name: PBS client | Report a failed client run
  ansible.builtin.include_tasks: ../fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _pbs_client_run_result }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: "{{ pbs_client_context | default('PBS client') }} failed"

- name: PBS client | Publish the client output
  ansible.builtin.set_fact:
    pbs_client_output: "{{ _pbs_client_run_result.stdout | default('') }}"
  no_log: true
