---
# Backend-independent application database contract.
#
# Inputs from an application playbook:
#   database_provision_app_instance  application instance (Vaultwarden item owner)
#   database_provision_config        {provider, instance, name, role,
#                                     credential_action: reuse|rotate,
#                                     postgresql_superuser: bool,
#                                     extensions: []|[vector, earthdistance]}
#
# A backend is resolved from generated facts, creates the database and login role,
# and returns only the application connection fields through the canonical app item.
# No application Compose file creates a private database sidecar.
- name: Database | Assert provisioning request
  ansible.builtin.assert:
    that:
      - database_provision_app_instance is match('^[A-Za-z0-9_.-]+$')
      - database_provision_config is mapping
      - database_provision_config.provider | default('') in ['postgresql', 'mariadb', 'mysql']
      - database_provision_config.instance | default('') is match('^[A-Za-z0-9_.-]+$')
      - database_provision_config.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - database_provision_config.role | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - database_provision_config.version | default('') is match('^[0-9]+$') or database_provision_config.version | default('') == ''
      - database_provision_config.credential_action | default('reuse') in ['reuse', 'rotate']
      - database_provision_config.postgresql_superuser | default(false) is boolean
      - not (database_provision_config.postgresql_superuser | default(false)) or database_provision_config.provider == 'postgresql'
      - database_provision_config.extensions | default([]) is sequence
      - (database_provision_config.extensions | default([]) | difference(['vector', 'earthdistance']) | length) == 0
    fail_msg: >-
      Database provisioning needs a supported provider plus safe instance, name and role values.

- name: Database | Resolve backend from generated facts
  ansible.builtin.set_fact:
    _database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(database_provision_config.instance, {}) }}

- name: Database | Assert requested backend major version is registered
  ansible.builtin.assert:
    that:
      - database_provision_config.version | default('') | length == 0
        or _database_backend.version | default('') | string == database_provision_config.version | string
    fail_msg: >-
      Backend {{ database_provision_config.instance }} does not advertise the requested
      PostgreSQL major version {{ database_provision_config.version }}.
  when: database_provision_config.version | default('') | length > 0

- name: Database | Assert requested backend is registered
  ansible.builtin.assert:
    that:
      - _database_backend.provider | default('') == database_provision_config.provider
      - _database_backend.host | default('') | length > 0
      - _database_backend.port | default(0) | int > 0
    fail_msg: >-
      {{ database_provision_config.provider }} backend {{ database_provision_config.instance }} is not registered.
      Deploy that backend before deploying {{ database_provision_app_instance }}.

- name: Database | Resolve the requested credential action
  ansible.builtin.set_fact:
    _database_credential_action: "{{ database_provision_config.credential_action | default('reuse') }}"

- name: Database | Read the canonical application password
  ansible.builtin.set_fact:
    _database_existing_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(database_provision_app_instance, {}).database_password
         | default('', true) }}
  no_log: true

- name: Database | Generate an initial or rotated application password
  ansible.builtin.set_fact:
    _database_password: >-
      {{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')
         if (_database_existing_password | length == 0 or _database_credential_action == 'rotate')
         else _database_existing_password }}
  no_log: true

# Persist a generated value before it is applied to a backend. If backend mutation
# fails, a rerun reuses the exact recorded value instead of losing the only copy.
# Check mode uses the already-loaded credential snapshot and must not write to Vaultwarden.
- name: Database | Store application connection fields in Vaultwarden
  ansible.builtin.include_tasks: ../bitwarden/upsert-item.yml
  when: not ansible_check_mode
  vars:
    vault_item_name: "homelab-infra/apps/{{ database_provision_app_instance }}"
    vault_item_merge: true
    vault_item_fields:
      database_provider: "{{ database_provision_config.provider }}"
      database_host: "{{ _database_backend.host }}"
      database_port: "{{ _database_backend.port }}"
      database_name: "{{ database_provision_config.name }}"
      database_user: "{{ database_provision_config.role }}"
      database_password: "{{ _database_password }}"
    vault_item_secret_fields: [database_password]
  no_log: true

- name: Database | Register backend as a delegation target
  ansible.builtin.add_host:
    name: database_backend_target
    ansible_host: "{{ _database_backend.host }}"
    ansible_user: "{{ homelabinfra_config.ansible.ssh_user | default('root') }}"
    groups: database_delegates
  changed_when: false

- name: Database | Create the PostgreSQL role, database and extensions on a guest backend
  ansible.builtin.include_tasks: provision-postgresql.yml
  when:
    - database_provision_config.provider == 'postgresql'
    - _database_backend.kubernetes | default({}) | length == 0

- name: Database | Create the PostgreSQL role, database and extensions on a Kubernetes backend
  ansible.builtin.include_tasks: provision-kubernetes-postgresql.yml
  when:
    - database_provision_config.provider == 'postgresql'
    - _database_backend.kubernetes | default({}) | length > 0
  no_log: true

- name: Database | Create the MariaDB/MySQL database and login
  ansible.builtin.include_tasks: provision-mysql-compatible.yml
  when: database_provision_config.provider in ['mariadb', 'mysql']

- name: Database | Return the Vaultwarden-backed connection to the consumer
  ansible.builtin.set_fact:
    database_provision_connection:
      provider: "{{ database_provision_config.provider }}"
      host: "{{ _database_backend.host }}"
      port: "{{ _database_backend.port }}"
      name: "{{ database_provision_config.name }}"
      user: "{{ database_provision_config.role }}"
      password: "{{ _database_password }}"
  no_log: true
