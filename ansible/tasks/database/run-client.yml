---
# Run scripts/database-client.sh once with Docker on the current host. Called by dump.yml,
# verify-dump.yml and restore.yml after resolve-app-database.yml.
#
# Inputs:
#   database_client_action    dump | verify | restore
#   database_client_file      absolute path on the current host; its directory is mounted
#   database_client_password  the application login's password (not used by verify)
- name: Database client | Install the shared script
  ansible.builtin.copy:
    src: scripts/database-client.sh
    dest: /usr/local/lib/homelab-infra/database-client.sh
    owner: root
    group: root
    mode: "0755"

- name: Database client | Run {{ database_client_action }}
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - --entrypoint=/bin/sh
      - "--volume={{ database_client_file | dirname }}:/work{{ '' if database_client_action == 'dump' else ':ro' }}"
      - --volume=/usr/local/lib/homelab-infra/database-client.sh:/usr/local/bin/database-client.sh:ro
      - --env=DB_ENGINE
      - --env=DB_HOST
      - --env=DB_PORT
      - --env=DB_NAME
      - --env=DB_USER
      - --env=DB_PASSWORD
      - "{{ database_app_target.client_image }}"
      - /usr/local/bin/database-client.sh
      - "{{ database_client_action }}"
      - "/work/{{ database_client_file | basename }}"
  environment:
    DB_ENGINE: "{{ database_app_target.provider }}"
    DB_HOST: "{{ database_app_target.host }}"
    DB_PORT: "{{ database_app_target.port }}"
    DB_NAME: "{{ database_app_target.name }}"
    DB_USER: "{{ database_app_target.role }}"
    DB_PASSWORD: "{{ database_client_password | default('', true) }}"
  no_log: true
  register: _database_client_result
  failed_when: false
  changed_when: database_client_action != 'verify'

- name: Database client | Report a failed {{ database_client_action }}
  ansible.builtin.include_tasks: ../fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _database_client_result }}"
    scrub_failure_secrets: ["{{ database_client_password | default('', true) }}"]
    scrub_failure_context: >-
      Database {{ database_client_action }} of {{ database_app_target.name }}
      ({{ database_client_file | basename }}) failed
