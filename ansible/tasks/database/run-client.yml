---
# Run scripts/database-client.sh once on the current host: with Docker in the server-matched
# client image, or, for a native guest that has no Docker, directly with a version-matched
# PostgreSQL client (MariaDB/MySQL use the distribution client). Called by dump.yml, verify-dump.yml and restore.yml after
# resolve-app-database.yml.
#
# Inputs:
#   database_client_runtime   optional docker | native; default `recovery_swap_runtime`
#                             (the restore swap's service kind), else docker
#   database_client_action    dump | verify | restore
#   database_client_file      absolute path on the current host; its directory is mounted
#   database_client_password  the application login's password (not used by verify)
- name: Database client | Install the shared script
  ansible.builtin.include_tasks: install-client.yml

- name: Database client | Run {{ database_client_action }}
  ansible.builtin.command:
    argv: >-
      {{ [database_client_script, database_client_action, database_client_file]
         if _database_client_runtime == 'native' else
         ['docker', 'run', '--rm', '--network=host', '--entrypoint=/bin/sh',
          '--volume=' ~ (database_client_file | dirname) ~ ':/work' ~ ('' if database_client_action == 'dump' else ':ro'),
          '--volume=' ~ database_client_script ~ ':/usr/local/bin/database-client.sh:ro',
          '--env=DB_ENGINE', '--env=DB_HOST', '--env=DB_PORT', '--env=DB_NAME',
          '--env=DB_USER', '--env=DB_PASSWORD', database_app_target.client_image,
          '/usr/local/bin/database-client.sh', database_client_action,
          '/work/' ~ (database_client_file | basename)] }}
  environment:
    PATH: >-
      {{ ('/usr/lib/postgresql/' ~ database_app_target.server_version ~ '/bin:'
          if _database_client_runtime == 'native' and database_app_target.provider == 'postgresql' else '')
         ~ (ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin')) }}
    DB_ENGINE: "{{ database_app_target.provider }}"
    DB_HOST: "{{ database_app_target.host }}"
    DB_PORT: "{{ database_app_target.port }}"
    DB_NAME: "{{ database_app_target.name }}"
    DB_USER: "{{ database_app_target.role }}"
    DB_PASSWORD: "{{ database_client_password | default('', true) }}"
  no_log: true
  register: _database_client_result
  failed_when: false
  changed_when: database_client_action != 'verify'

- name: Database client | Report a failed {{ database_client_action }}
  ansible.builtin.include_tasks: ../fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _database_client_result }}"
    scrub_failure_secrets: ["{{ database_client_password | default('', true) }}"]
    scrub_failure_context: >-
      Database {{ database_client_action }} of {{ database_app_target.name }}
      ({{ database_client_file | basename }}) failed
