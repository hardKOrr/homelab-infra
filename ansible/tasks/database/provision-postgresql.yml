---
# The PostgreSQL half of provision.yml for a backend on a guest, included by it with its
# variables: the login role, the database and the extensions, run as the local `postgres`
# user on the backend guest. A backend on Kubernetes uses provision-kubernetes-postgresql.yml.
- name: Database | Read the PostgreSQL role superuser status
  ansible.builtin.command:
    argv:
      - psql
      - --tuples-only
      - --no-align
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
      - "--command=SELECT COALESCE((SELECT rolsuper::text FROM pg_roles WHERE rolname = '{{ database_provision_config.role }}'), 'missing')"
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: false
  register: _database_role_status

- name: Database | Create PostgreSQL application role
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - "--set=database_password={{ _database_password }}"
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
    stdin: >-
      CREATE ROLE {{ database_provision_config.role }} LOGIN
      {{ 'SUPERUSER' if (database_provision_config.postgresql_superuser | default(false) | bool) else 'NOSUPERUSER' }}
      NOCREATEDB
      NOCREATEROLE NOINHERIT PASSWORD :'database_password'
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  when:
    - _database_role_status.stdout | trim == 'missing'

- name: Database | Reconcile PostgreSQL application role superuser status
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
      - >-
        --command=ALTER ROLE {{ database_provision_config.role }}
        {{ 'SUPERUSER' if (database_provision_config.postgresql_superuser | default(false) | bool) else 'NOSUPERUSER' }}
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  when:
    - _database_role_status.stdout | trim != 'missing'
    - (_database_role_status.stdout | trim == 'true') != (database_provision_config.postgresql_superuser | default(false) | bool)

- name: Database | Rotate PostgreSQL application role password
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - "--set=database_password={{ _database_password }}"
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
    stdin: >-
      ALTER ROLE {{ database_provision_config.role }} PASSWORD :'database_password'
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  when:
    - _database_role_status.stdout | trim != 'missing'
    - _database_existing_password | length == 0 or _database_credential_action == 'rotate'

- name: Database | Check whether the PostgreSQL database exists
  ansible.builtin.command:
    argv:
      - psql
      - --tuples-only
      - --no-align
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
      - --command=SELECT 1 FROM pg_database WHERE datname = '{{ database_provision_config.name }}'
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: false
  register: _database_exists

- name: Database | Create PostgreSQL application database
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - --username=postgres
      - --dbname=postgres
      - "--port={{ _database_backend.port }}"
      - "--command=CREATE DATABASE {{ database_provision_config.name }} OWNER {{ database_provision_config.role }}"
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  when:
    - _database_exists.stdout | trim != '1'

# Immich requires pgvector for its face/CLIP embeddings. The extension is a backend
# capability, not an application-side package: install it on the named PostgreSQL host
# and create it in the named application database before the app starts. A Docker backend
# ships it in its image, so the host package would not reach the server.
- name: Database | Install the PostgreSQL vector extension package
  ansible.builtin.apt:
    name: "postgresql-{{ database_provision_config.version | default(_database_backend.version | default('16'), true) }}-pgvector"
    state: present
    update_cache: true
  delegate_to: database_backend_target
  become: true
  when:
    - "'vector' in (database_provision_config.extensions | default([]))"
    - _database_backend.runtime | default('native') != 'docker'

- name: Database | Check whether the PostgreSQL vector extension exists
  ansible.builtin.command:
    argv:
      - psql
      - --tuples-only
      - --no-align
      - --username=postgres
      - --dbname={{ database_provision_config.name }}
      - "--port={{ _database_backend.port }}"
      - --command=SELECT 1 FROM pg_extension WHERE extname = 'vector'
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: false
  register: _database_vector_extension_exists
  when:
    - "'vector' in (database_provision_config.extensions | default([]))"

- name: Database | Enable the PostgreSQL vector extension
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - --username=postgres
      - --dbname={{ database_provision_config.name }}
      - "--port={{ _database_backend.port }}"
      - --command=CREATE EXTENSION IF NOT EXISTS vector
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: true
  when:
    - "'vector' in (database_provision_config.extensions | default([]))"
    - _database_vector_extension_exists.stdout | trim != '1'

# Immich's migrations use earthdistance, which is not trusted for application roles.
# Register it as the PostgreSQL superuser before the non-superuser app starts. CASCADE
# installs cube, earthdistance's required companion extension, in the same schema.
- name: Database | Check whether the PostgreSQL earthdistance extension exists
  ansible.builtin.command:
    argv:
      - psql
      - --tuples-only
      - --no-align
      - --username=postgres
      - --dbname={{ database_provision_config.name }}
      - "--port={{ _database_backend.port }}"
      - --command=SELECT 1 FROM pg_extension WHERE extname = 'earthdistance'
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: false
  register: _database_earthdistance_extension_exists
  when:
    - "'earthdistance' in (database_provision_config.extensions | default([]))"

- name: Database | Enable the PostgreSQL earthdistance extension
  ansible.builtin.command:
    argv:
      - psql
      - --set=ON_ERROR_STOP=1
      - --username=postgres
      - --dbname={{ database_provision_config.name }}
      - "--port={{ _database_backend.port }}"
      - --command=CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE
  delegate_to: database_backend_target
  become: true
  become_user: postgres
  no_log: true
  changed_when: true
  when:
    - "'earthdistance' in (database_provision_config.extensions | default([]))"
    - _database_earthdistance_extension_exists.stdout | trim != '1'
