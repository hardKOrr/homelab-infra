---
# Install scripts/database-client.sh on the current host. run-client.yml uses it, and a
# host recovery script runs it the same way: in database_app_target.client_image with
# the file's directory mounted at /work (see run-client.yml for the exact Docker call).
# For the native runtime (see run-client.yml) it also installs the engine's client package
# and runs the script directly.
#
# Sets:
#   database_client_script  its path on the current host
- name: Database client | Record the script path and runtime
  ansible.builtin.set_fact:
    database_client_script: /usr/local/lib/homelab-infra/database-client.sh
    _database_client_runtime: >-
      {{ database_client_runtime | default(recovery_swap_runtime | default('docker', true), true) }}

- name: Database client | Create the script directory
  ansible.builtin.file:
    path: "{{ database_client_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Database client | Install the shared script
  ansible.builtin.copy:
    src: scripts/database-client.sh
    dest: "{{ database_client_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Database client | Install the engine's client package for the native runtime
  ansible.builtin.apt:
    name: "{{ 'postgresql-client' if database_app_target.provider == 'postgresql' else 'mariadb-client' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: _database_client_runtime == 'native'
