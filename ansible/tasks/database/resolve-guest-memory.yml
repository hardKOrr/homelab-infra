---
- name: Database backend | Resolve shared guest memory
  ansible.builtin.include_tasks: ../proxmox/resolve-native-memory.yml
  vars:
    _native_guest_guest_type: "{{ _database_backend_guest_type }}"

- name: Database backend | Validate engine memory inputs
  ansible.builtin.assert:
    that:
      - app_config.app is mapping
      - app_config.app.get('memory', {}) is mapping
    fail_msg: Database backend needs an app.memory mapping.

- name: Database backend | Publish guest memory for engine tuning
  ansible.builtin.set_fact:
    _database_backend_memory_mib: "{{ _native_guest_memory_mib }}"
