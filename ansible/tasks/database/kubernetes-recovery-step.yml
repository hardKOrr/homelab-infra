---
# The database half of a Kubernetes app's recovery point. It returns the container step
# that the shared recovery templates (templates/kubernetes/recovery-{backup,restore}.yaml.j2)
# run beside the PBS client: the dump before a backup push, and the load or read-only
# inspection in a restore Job. Every step runs scripts/database-client.sh, the same client
# guest roles run through dump.yml and restore.yml, in the official client image matched
# to the server.
#
# The step reads and writes ${DUMP_DIR}, which the templates point at the recovery point's
# `database` archive. File names inside it are part of existing recovery points:
# PostgreSQL writes `<database>.dump` (custom format), MariaDB/MySQL write `database.sql`.
#
# Inputs:
#   k8s_database_step_source     registered — the app's database on its registered backend
#                                             (app.database: provider, instance, name, role)
#                                namespace-mysql — a database pod in the app's own namespace
#                                namespace-server — the whole MariaDB, MySQL or PostgreSQL
#                                             server that runs in the instance's own
#                                             namespace (the role's own recovery point:
#                                             every schema or database and the grants or
#                                             roles, `<engine>.sql`; PostgreSQL is
#                                             `postgresql.sql`, one pg_dumpall script)
#   k8s_database_step_config     the merged config of the instance whose database this is
#   k8s_database_step_instance   that instance's name (namespace-mysql: its pod is
#                                `<instance>-db`)
#   k8s_database_step_root_password  namespace-mysql and namespace-server: that
#                                server's root password (the server step reads the
#                                image, Service port and root hosts from the config's `app`)
#
# Sets k8s_database_step:
#   image        the client image, matched to the server
#   env          plain environment for the step (DB_ENGINE, DB_HOST, DB_PORT, DB_NAME,
#                DB_USER)
#   secret_env   {ENV_NAME: key} read from the Job's credential Secret (DB_PASSWORD)
#   secret_files [{key, path}] mounted from that Secret under /etc/recovery-credentials
#   secret_data  the keys the caller adds to that Secret (no_log): the password and the
#                client script
#   dump, load, inspect  shell bodies; never `set -x` — credentials are in the env
#   describe     one line naming the database for operator messages

- name: Database recovery step | Assert inputs
  ansible.builtin.assert:
    that:
      - k8s_database_step_source | default('') in ['registered', 'namespace-mysql', 'namespace-server']
      - k8s_database_step_config is mapping
      - k8s_database_step_instance | default('') | length > 0
    fail_msg: >-
      kubernetes-recovery-step.yml needs a source (registered or namespace-mysql), the
      instance's merged config and the instance name.

- name: Database recovery step | Resolve the registered backend
  when: k8s_database_step_source == 'registered'
  block:
    - name: Database recovery step | Resolve the application database
      ansible.builtin.include_tasks: resolve-app-database.yml
      vars:
        database_app_instance: "{{ k8s_database_step_instance }}"
        database_app_config: "{{ k8s_database_step_config.app.database | default({}) }}"

    - name: Database recovery step | Read the application login
      ansible.builtin.set_fact:
        _kds:
          engine: "{{ database_app_target.provider }}"
          image: "{{ database_app_target.client_image }}"
          host: "{{ database_app_target.host }}"
          port: "{{ database_app_target.port }}"
          name: "{{ database_app_target.name }}"
          user: "{{ database_app_target.role }}"
          password: >-
            {{ database_app_target.password
               | default(k8s_database_step_config.app.database_password | default(''), true) }}
          describe: >-
            {{ database_app_target.provider }} database {{ database_app_target.name }} on
            {{ database_app_target.instance }}
      no_log: true

- name: Database recovery step | Resolve the in-namespace MySQL server
  when: k8s_database_step_source == 'namespace-mysql'
  block:
    - name: Database recovery step | Require the MySQL root credential
      ansible.builtin.assert:
        that:
          - k8s_database_step_root_password | default('') | length > 0
          - k8s_database_step_config.app.database.name | default('') is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - k8s_database_step_config.app.database.image | default('') | length > 0
        fail_msg: >-
          No root credential, database name or image is recorded for
          {{ k8s_database_step_instance }}'s database. Deploy the instance first; its
          deploy generates and stores that credential.
      no_log: true

    # The client is the server's own image. A MariaDB client cannot authenticate to MySQL
    # 8's default caching_sha2_password plugin, and that failure reads as a wrong password.
    - name: Database recovery step | Read the in-namespace server
      ansible.builtin.set_fact:
        _kds:
          engine: >-
            {{ 'mariadb' if 'mariadb' in (k8s_database_step_config.app.database.image | lower)
               else 'mysql' }}
          image: "{{ k8s_database_step_config.app.database.image }}"
          host: "{{ k8s_database_step_instance }}-db"
          port: "3306"
          name: "{{ k8s_database_step_config.app.database.name }}"
          user: root
          password: "{{ k8s_database_step_root_password }}"
          describe: >-
            database {{ k8s_database_step_config.app.database.name }} on
            {{ k8s_database_step_instance }}-db
      no_log: true

- name: Database recovery step | Resolve the server in this namespace
  when: k8s_database_step_source == 'namespace-server'
  block:
    - name: Database recovery step | Require the server's root credential and image
      ansible.builtin.assert:
        that:
          - k8s_database_step_root_password | default('') | length > 0
          - k8s_database_step_config.app.image | default('') | length > 0
        fail_msg: >-
          No root credential or image is recorded for {{ k8s_database_step_instance }}.
          Deploy the instance first; its deploy generates and stores that credential.
      no_log: true

    # The Service answers inside the namespace on app.port; the superuser's host pattern
    # admits only the pod network, so this is the one path that reaches it over TCP.
    - name: Database recovery step | Read the server
      vars:
        _kds_image: "{{ k8s_database_step_config.app.image | lower }}"
        _kds_engine: >-
          {{ 'mariadb' if 'mariadb' in _kds_image
             else 'postgresql' if _kds_image is match('^(docker.io/library/)?postgres:')
             else 'mysql' }}
      ansible.builtin.set_fact:
        _kds:
          engine: "{{ _kds_engine }}"
          image: "{{ k8s_database_step_config.app.image }}"
          host: "{{ k8s_database_step_instance }}"
          port: "{{ k8s_database_step_config.app.port | default(3306) | string }}"
          name: ""
          user: "{{ 'postgres' if _kds_engine == 'postgresql' else 'root' }}"
          password: "{{ k8s_database_step_root_password }}"
          root_hosts: "{{ k8s_database_step_config.kubernetes.root_host | default('10.42.%') }}"
          describe: >-
            the whole {{ {'mariadb': 'MariaDB', 'mysql': 'MySQL', 'postgresql': 'PostgreSQL'}[_kds_engine] }}
            server {{ k8s_database_step_instance }}
            ({{ 'every database and role' if _kds_engine == 'postgresql' else 'every schema and grant' }})
      no_log: true

- name: Database recovery step | Require the database login
  ansible.builtin.assert:
    that: _kds.password | length > 0
    fail_msg: >-
      No database password is recorded for {{ k8s_database_step_instance }}. Deploy the
      instance first.
  no_log: true

# The script travels in the Job's credential Secret: the templates already mount it
# read-only, and it stays the one copy guest roles install from.
- name: Database recovery step | Describe the server step
  when: k8s_database_step_source == 'namespace-server'
  ansible.builtin.set_fact:
    k8s_database_step:
      image: "{{ _kds.image }}"
      # DB_ROOT_HOSTS is MariaDB/MySQL's root account host list; PostgreSQL's access list is
      # its pg_hba.conf.
      env: >-
        {{ {'DB_ENGINE': _kds.engine, 'DB_HOST': _kds.host, 'DB_PORT': _kds.port, 'DB_USER': _kds.user}
           | combine({} if _kds.engine == 'postgresql' else {'DB_ROOT_HOSTS': _kds.root_hosts}) }}
      secret_env:
        DB_PASSWORD: db-password
      secret_files:
        - key: database-client.sh
          path: database-client.sh
      secret_data:
        db-password: "{{ _kds.password }}"
        database-client.sh: "{{ lookup('ansible.builtin.file', 'scripts/database-client.sh') }}"
      describe: "{{ _kds.describe }}"
      dump: sh /etc/recovery-credentials/database-client.sh server-dump "${DUMP_DIR}/{{ _kds.engine }}.sql"
      load: |
        set -- "${DUMP_DIR}"/{{ _kds.engine }}.sql
        if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
          echo "expected one {{ _kds.engine }} server dump in the recovery point, found: $*"
          exit 1
        fi
        sh /etc/recovery-credentials/database-client.sh server-verify "$1"
        sh /etc/recovery-credentials/database-client.sh server-load "$1"
        echo "=== {{ _kds.describe }} now holds ==="
        sh /etc/recovery-credentials/database-client.sh server-inspect
      inspect: |
        echo "=== {{ _kds.describe }}, which a restore would replace ==="
        sh /etc/recovery-credentials/database-client.sh server-inspect
  no_log: true

- name: Database recovery step | Describe the step
  when: k8s_database_step_source != 'namespace-server'
  vars:
    _kds_glob: "{{ '*.dump' if _kds.engine == 'postgresql' else 'database.sql' }}"
  ansible.builtin.set_fact:
    k8s_database_step:
      image: "{{ _kds.image }}"
      env:
        DB_ENGINE: "{{ _kds.engine }}"
        DB_HOST: "{{ _kds.host }}"
        DB_PORT: "{{ _kds.port | string }}"
        DB_NAME: "{{ _kds.name }}"
        DB_USER: "{{ _kds.user }}"
      secret_env:
        DB_PASSWORD: db-password
      secret_files:
        - key: database-client.sh
          path: database-client.sh
      secret_data:
        db-password: "{{ _kds.password }}"
        database-client.sh: "{{ lookup('ansible.builtin.file', 'scripts/database-client.sh') }}"
      describe: "{{ _kds.describe | trim }}"
      dump: >-
        sh /etc/recovery-credentials/database-client.sh dump
        "${DUMP_DIR}/{{ '${DB_NAME}.dump' if _kds.engine == 'postgresql' else 'database.sql' }}"
      load: |
        # A PostgreSQL dump is named for the SOURCE database, which a drill target need
        # not share.
        set -- "${DUMP_DIR}"/{{ _kds_glob }}
        if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
          echo "expected one database dump in the recovery point, found: $*"
          exit 1
        fi
        sh /etc/recovery-credentials/database-client.sh verify "$1"
        sh /etc/recovery-credentials/database-client.sh restore "$1"
        echo "=== {{ _kds.describe | trim }} now holds ==="
        sh /etc/recovery-credentials/database-client.sh inspect
      inspect: |
        echo "=== {{ _kds.describe | trim }}, which a restore would replace ==="
        sh /etc/recovery-credentials/database-client.sh inspect
  no_log: true
