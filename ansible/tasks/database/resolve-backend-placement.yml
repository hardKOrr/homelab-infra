---
- name: Database backend | Resolve shared guest placement
  ansible.builtin.include_tasks: ../proxmox/resolve-native-placement.yml
  vars:
    native_guest_database: true

- name: Database backend | Publish placement for engine callers
  ansible.builtin.set_fact:
    _database_backend_guest_type: "{{ _native_guest_guest_type }}"
    _database_backend_classed_placement: "{{ _native_guest_classed_placement }}"
    _database_backend_node: "{{ _native_guest_node }}"
    _database_backend_storage: "{{ _native_guest_storage }}"
