---
# Deploy step for an app that keeps its data in a registered database backend
# (playbooks/apps/deploy.yml, localhost, before the guest is provisioned, so the connection
# reaches the guest through add_host). Provisions the database and login role named in
# app.database (tasks/database/provision.yml) and merges the connection into app_config.app
# as database_provider, database_host, database_port, database_name, database_user and
# database_password.
#
# Inputs: instance, app_config (merged).
# Results: app_config with the connection fields.
- name: Database consumer | Provision the app's database and login role
  ansible.builtin.include_tasks: provision.yml
  vars:
    database_provision_app_instance: "{{ instance }}"
    database_provision_config: "{{ app_config.app.database }}"

- name: Database consumer | Add the connection to the app config
  ansible.builtin.set_fact:
    app_config: >-
      {{ app_config | combine({'app': {
        'database_provider': database_provision_connection.provider,
        'database_host': database_provision_connection.host,
        'database_port': database_provision_connection.port,
        'database_name': database_provision_connection.name,
        'database_user': database_provision_connection.user,
        'database_password': database_provision_connection.password
      }}, recursive=True) }}
  no_log: true
