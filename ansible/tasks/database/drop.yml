---
# Drop one application's named database and login from its registered backend.
#
# Inputs:
#   database_app_instance  application instance
#   database_app_config    the app's `app.database` mapping
#
# Runs from the controller and delegates to the backend guest, so it works after the
# application guest or namespace is already gone. The backend guest and every other
# database on it stay. A second run finds nothing to drop and changes nothing.
- name: Database drop | Resolve the application's database
  ansible.builtin.include_tasks: resolve-app-database.yml

- name: Database drop | Check ownership before deleting
  ansible.builtin.include_tasks: guard-app-database.yml

- name: Database drop | Drop the PostgreSQL database and role on a guest backend
  when:
    - database_app_target.provider == 'postgresql'
    - not (database_app_target.kubernetes | default(false) | bool)
  block:
    - name: Database drop | Drop the PostgreSQL database
      ansible.builtin.command:
        argv:
          - psql
          - --set=ON_ERROR_STOP=1
          - --username=postgres
          - --dbname=postgres
          - "--port={{ database_app_target.port }}"
          - "--command=DROP DATABASE {{ database_app_target.name }} WITH (FORCE)"
      delegate_to: database_app_target
      become: true
      become_user: postgres
      changed_when: true
      when: _database_guard_owner.stdout | trim != 'missing'

    - name: Database drop | Drop the PostgreSQL role
      ansible.builtin.command:
        argv:
          - psql
          - --set=ON_ERROR_STOP=1
          - --tuples-only
          - --no-align
          - --username=postgres
          - --dbname=postgres
          - "--port={{ database_app_target.port }}"
          - >-
            --command=SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname =
            '{{ database_app_target.role }}') THEN 'dropped' ELSE 'missing' END
          - "--command=DROP ROLE IF EXISTS {{ database_app_target.role }}"
      delegate_to: database_app_target
      become: true
      become_user: postgres
      register: _database_drop_role
      changed_when: "'dropped' in _database_drop_role.stdout"

- name: Database drop | Drop the MariaDB/MySQL database
  community.mysql.mysql_db:
    name: "{{ database_app_target.name }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  delegate_to: database_app_target
  become: true
  when:
    - database_app_target.provider in ['mariadb', 'mysql']
    - not (database_app_target.kubernetes | default(false) | bool)

- name: Database drop | Drop the MariaDB/MySQL login on every permitted client network
  community.mysql.mysql_user:
    name: "{{ database_app_target.role }}"
    host: "{{ item }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ database_app_target.client_hosts }}"
  delegate_to: database_app_target
  become: true
  when:
    - database_app_target.provider in ['mariadb', 'mysql']
    - not (database_app_target.kubernetes | default(false) | bool)

# A backend on Kubernetes has no guest to delegate to: the same drops run as SQL in the
# server pod (backend-sql.yml). IF EXISTS keeps a second run a no-op.
- name: Database drop | Drop the database and login on a Kubernetes backend
  ansible.builtin.include_tasks: backend-sql.yml
  vars:
    database_backend_instance: "{{ database_app_target.instance }}"
    database_backend_sql: |
      DROP DATABASE IF EXISTS `{{ database_app_target.name }}`;
      {% for host in database_app_target.client_hosts %}
      DROP USER IF EXISTS '{{ database_app_target.role }}'@'{{ host }}';
      {% endfor %}
  when:
    - database_app_target.provider in ['mariadb', 'mysql']
    - database_app_target.kubernetes | default(false) | bool

# The same drops as SQL in the PostgreSQL server pod (backend-psql.yml); IF EXISTS keeps a
# second run a no-op.
- name: Database drop | Drop the database and role on a Kubernetes PostgreSQL backend
  ansible.builtin.include_tasks: backend-psql.yml
  vars:
    database_backend_instance: "{{ database_app_target.instance }}"
    database_backend_sql: |
      DROP DATABASE IF EXISTS {{ database_app_target.name }} WITH (FORCE);
      DROP ROLE IF EXISTS {{ database_app_target.role }};
  when:
    - database_app_target.provider == 'postgresql'
    - database_app_target.kubernetes | default(false) | bool
