---
# Open a Kubernetes-hosted MariaDB, MySQL, PostgreSQL, Redis or InfluxDB backend's port on the firewall for every registered
# consumer: each application whose canonical item names this backend's address and port
# (`database_host` and `database_port`, `redis_host` and `redis_port` for Redis, `influxdb_host` and `influxdb_port` for InfluxDB).
# A consumer on a guest is allowed by its own address; one on the cluster by the
# cluster-node alias (ansible/tasks/kubernetes/README.md → Firewall access). Rules are
# egress rules from the consumer to the ingress address, described
# "homelab-infra: <instance> for <consumer> egress <provider>", so Remove withdraws them with
# the backend's own rules. A consumer deployed after this backend runs Deploy again (or
# its own Deploy opens nothing): re-run the backend's Deploy to cover it.
#
# Inputs (localhost): database_consumer_provider (mariadb, mysql, postgresql, redis or influxdb), instance, app_config
# (the backend's merged config), homelabinfra_infra
# with the cluster registered, an inventory refreshed this run. Does nothing without an
# OPNsense firewall.
- name: SQL consumers | Open the port for registered consumers
  when:
    - not (recovery_isolated | default(false) | bool)
    - homelabinfra_infra.firewall.provider | default('none') == 'opnsense'
  block:
    - name: SQL consumers | Find the registered consumers
      vars:
        _sql_prefix: "{{ database_consumer_provider if database_consumer_provider in ['redis', 'influxdb'] else 'database' }}"
      ansible.builtin.set_fact:
        _sql_consumers: >-
          {%- set found = [] -%}
          {%- for name, item in (homelabinfra_vault.apps | default({})).items() -%}
          {%-   if name != instance
                  and item.get(_sql_prefix ~ '_host', '') == homelabinfra_infra.kubernetes.ingress_vip
                  and (item.get(_sql_prefix ~ '_port', '') | string) == (app_config.app.port | string)
                  and (_sql_prefix != 'database' or item.get('database_provider', '') == database_consumer_provider) -%}
          {%-     set _ = found.append(name) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ found | to_json | from_json }}
      no_log: true

    - name: SQL consumers | Open each consumer's access
      ansible.builtin.include_tasks: open-one-consumer-access.yml
      loop: "{{ _sql_consumers }}"
      loop_control:
        loop_var: _sql_consumer
