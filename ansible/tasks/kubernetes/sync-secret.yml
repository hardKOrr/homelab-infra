---
# Put an application's credentials into its namespace as a Kubernetes Secret.
#
# A KUBERNETES SECRET IS NOT A SECOND CANONICAL SECRET STORE.
#
# The canonical value lives in the organization-owned Vaultwarden item and nowhere else.
# What this file creates is a runtime copy: the form a pod can consume, in the namespace
# the instance owns, deleted with that namespace. When the canonical value changes, the
# next deploy overwrites this copy — the Secret is downstream of Vaultwarden, never the
# other way round.
#
# Inputs:
#   k8s_secret_name    — Secret name inside the namespace
#   k8s_secret_data    — mapping of key to plaintext value
#   k8s_namespace      — from ensure-namespace.yml
#   k8s_api_host       — from resolve-cluster.yml
#
# Every task here is no_log. The values are the application's real credentials, and a
# deploy job's console is not a place they belong.

- name: k8s secret | Assert inputs
  ansible.builtin.assert:
    that:
      - k8s_secret_name is defined
      - k8s_secret_name is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
      - k8s_secret_data is mapping
      - k8s_secret_data | length > 0
      - k8s_namespace is defined
    fail_msg: >-
      sync-secret.yml needs k8s_secret_name (a legal Kubernetes object name), a non-empty
      k8s_secret_data mapping, and a namespace from ensure-namespace.yml.

# A rendered manifest on stdin, rather than `kubectl create secret --from-literal`.
#
# The literal form has to build one argument per key, which means either interpolating the
# values into a command line — where `ps` exposes them to every user on the node for the
# life of the call, and Ansible records them as module arguments — or smuggling them
# through environment variables named after the keys. The second is where the first draft
# of this file went wrong: a Secret key may legally contain `-` and `.`, neither of which
# is legal in a shell variable name, so `client-secret` produced an unusable variable and
# an empty credential.
#
# stdin has neither problem. It is not argv, it needs no name mangling, and it takes the
# keys exactly as given.
- name: k8s secret | Write the runtime copy of the canonical credentials
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - -f
      - "-"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ k8s_secret_name }}
        namespace: {{ k8s_namespace }}
        labels:
          app.kubernetes.io/instance: {{ instance }}
          app.kubernetes.io/managed-by: homelab-infra
      type: Opaque
      data:
      {% for key, value in k8s_secret_data.items() %}
        {{ key }}: {{ value | string | b64encode }}
      {% endfor %}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _k8s_secret_apply
  failed_when: false
  changed_when:
    - _k8s_secret_apply.rc == 0
    - "'unchanged' not in _k8s_secret_apply.stdout"
  no_log: true

# Under no_log a failure reads `censored`, which makes a rejected write undebuggable. The
# object name and namespace are not secret and kubectl does not echo the manifest it was
# given, so reporting them plus a bounded slice of stderr is safe and is the only way to
# see why a write was refused. Same reasoning, same shape as
# tasks/bitwarden/upsert-item.yml.
- name: k8s secret | Report a rejected Secret write
  ansible.builtin.fail:
    msg: >-
      Kubernetes refused the Secret write for {{ k8s_secret_name }} in
      {{ k8s_namespace }} (rc={{ _k8s_secret_apply.rc }}):
      {{ (_k8s_secret_apply.stderr | default('') | trim)[:400] }}
  when: _k8s_secret_apply.rc != 0
