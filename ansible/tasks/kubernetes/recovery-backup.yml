---
# Schedule, or unschedule, one Kubernetes app instance's nightly application backup:
# templates/kubernetes/recovery-backup.yaml.j2 applied into the instance's namespace.
# `Backup App` (playbooks/maintenance/backup-app.yml) runs one Job from the CronJob on
# demand; restore is tasks/kubernetes/recovery-restore.yml.
#
# Both ways of not having a backup — `backup.enabled: false`, or no PBS recorded in the
# generated facts — remove the CronJob, so a schedule never outlives the decision to have
# one.
#
# Inputs:
#   instance, app_config      the instance and its merged config (`backup:` block)
#   k8s_namespace, k8s_api_host
#   k8s_recovery:
#     archives    [{name, claim} | {name, config_map}] — each becomes <name>.pxar. Names are
#                 part of existing recovery points; keep them when changing a role.
#     database    optional k8s_database_step from tasks/database/kubernetes-recovery-step.yml
#     stop        optional Deployment names to quiesce while the PVC archive is read
#     stop_replicas optional positive declared replica count if a previous backup left a
#                   Deployment at zero (defaults to one)
#     describe    one line naming what the recovery point holds, for the operator

- name: k8s backup | Assert inputs
  ansible.builtin.assert:
    that:
      - k8s_recovery is mapping
      - k8s_recovery.archives | default([]) | length > 0
      - k8s_recovery.archives | map(attribute='name') | unique | length == k8s_recovery.archives | length
      - "'database' not in (k8s_recovery.archives | map(attribute='name'))"
      - k8s_recovery.stop | default([]) is sequence
      - k8s_recovery.stop | default([]) is not string
      - k8s_recovery.stop | default([]) | unique | length == k8s_recovery.stop | default([]) | length
      - >-
        (k8s_recovery.stop | default([])
         | reject('match', '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') | list | length) == 0
      - >-
        (k8s_recovery.stop | default([]) | length == 0)
        or (k8s_recovery.stop_replicas | default(1) | int > 0)
      - >-
        not (k8s_recovery.stop | default([]) | length > 0
             and k8s_recovery.database | default({}) | length > 0)
    fail_msg: >-
      recovery-backup.yml needs k8s_recovery.archives, each with a unique name other than
      `database` (the dump's archive). Optional stop names must be unique DNS-label
      Deployment names; quiescing does not combine with a database init-container dump,
      and stop_replicas must be positive.

- name: k8s backup | Resolve the lab's PBS target
  ansible.builtin.include_tasks: ../backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"
  when: app_config.backup.enabled | default(false) | bool

# A provider that is not there is a no-op rather than an error, as with wiring.
- name: k8s backup | Note that this lab has no backup target
  ansible.builtin.debug:
    msg: >-
      {{ instance }} declares backup.enabled, but no Proxmox Backup Server is recorded in
      config/.generated/facts.yml, so no backup was scheduled. Deploy PBS and re-run this
      job. Until then the application's state has no application recovery point.
  when:
    - app_config.backup.enabled | default(false) | bool
    - not (k8s_pbs_available | default(false) | bool)

- name: k8s backup | Configure the nightly application backup
  when:
    - app_config.backup.enabled | default(false) | bool
    - k8s_pbs_available | default(false) | bool
  block:
    - name: k8s backup | Read the notification publish token
      ansible.builtin.set_fact:
        _kr_ntfy_token: >-
          {{ ((homelabinfra_infra | default({})).notifications | default({})).token
             | default('') }}
      no_log: true

    - name: k8s backup | Resolve the backup's identity and destination
      ansible.builtin.set_fact:
        _kr:
          backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
          repository: "{{ k8s_pbs_repository }}"
          datastore: "{{ k8s_pbs_datastore }}"
          schedule: "{{ app_config.backup.schedule }}"
          timezone: >-
            {{ app_config.backup.timezone | default('', true)
               or homelabinfra_config.timezone | default('UTC') }}
          timeout: "{{ app_config.backup.timeout_seconds | default(3600) | int }}"
          retention_days: "{{ app_config.backup.retention_days | int }}"
          scratch_gi: "{{ app_config.backup.scratch_size | default(2) | int }}"
          secret: "{{ instance }}-backup"
          ntfy_url: >-
            {{ (homelabinfra_infra.notifications.host ~ '/'
                ~ (homelabinfra_infra.notifications.topic | default('homelab')))
               if (((homelabinfra_infra | default({})).notifications | default({})).provider
                   | default('none') == 'ntfy'
                   and (homelabinfra_infra.notifications.host | default('') | length > 0))
               else '' }}
          ntfy_token: "{{ _kr_ntfy_token | length > 0 }}"
          client: "{{ app_config.backup.client }}"
          archives: "{{ k8s_recovery.archives }}"
          database: "{{ k8s_recovery.database | default({}, true) }}"
          stop: "{{ k8s_recovery.stop | default([]) }}"
          stop_replicas: "{{ k8s_recovery.stop_replicas | default(1) | int }}"

    # The PBS token is canonical in the Vaultwarden item `homelab-infra/backups`, copied
    # here, never generated here. A namespace Secret is deleted with the namespace.
    - name: k8s backup | Sync the backup credentials into the namespace
      ansible.builtin.include_tasks: sync-secret.yml
      vars:
        k8s_secret_name: "{{ _kr.secret }}"
        k8s_secret_data: >-
          {{ {'pbs-password': k8s_pbs_password}
             | combine((k8s_recovery.database | default({}, true)).secret_data | default({}))
             | combine({'ntfy-token': _kr_ntfy_token} if _kr_ntfy_token | length > 0 else {}) }}

    - name: k8s backup | Apply the backup CronJob
      ansible.builtin.include_tasks: apply-manifest.yml
      vars:
        # Shared recovery files live under ansible/, while the calling playbook can be
        # anywhere in the tree. Every caller is an app role below ansible/roles/.
        _k8s_recovery_ansible_root: "{{ role_path | dirname | dirname }}"
        k8s_manifest: >-
          {{ lookup('ansible.builtin.template',
                    _k8s_recovery_ansible_root ~ '/templates/kubernetes/recovery-backup.yaml.j2') }}

    - name: k8s backup | State the backup contract
      ansible.builtin.debug:
        msg:
          - "Backup: {{ k8s_recovery.describe | default('the application state') }}, pushed
             to PBS datastore {{ _kr.datastore }} as host/{{ _kr.backup_id }}."
          - "Schedule: {{ _kr.schedule }} ({{ _kr.timezone }}). Retention:
             {{ _kr.retention_days }} daily snapshots, plus the previous point through a
             same-day backup."
          - "Run one now: the `Backup App` job, or
             playbooks/maintenance/backup-app.yml -e instance={{ instance }}."
          - "Restore: the `Restore App` job, or
             playbooks/maintenance/restore-app.yml -e instance={{ instance }}."

- name: k8s backup | Remove the backup CronJob when no backup was configured
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - delete
      - cronjob
      - "{{ instance }}-backup"
      - --ignore-not-found=true
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _kr_backup_removed
  when: not ((app_config.backup.enabled | default(false) | bool)
             and (k8s_pbs_available | default(false) | bool))
  changed_when: "'deleted' in (_kr_backup_removed.stdout | default(''))"

- name: k8s backup | Remove unused quiesce permissions
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - delete
      - "rolebinding/{{ instance }}-backup-quiesce"
      - "role/{{ instance }}-backup-quiesce"
      - "serviceaccount/{{ instance }}-backup"
      - --ignore-not-found=true
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _kr_quiesce_removed
  when: >-
    (k8s_recovery.stop | default([]) | length == 0)
    or not (app_config.backup.enabled | default(false) | bool)
    or not (k8s_pbs_available | default(false) | bool)
  changed_when: "'deleted' in (_kr_quiesce_removed.stdout | default(''))"
