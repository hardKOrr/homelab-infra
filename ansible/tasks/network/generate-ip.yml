---
# Allocate an IP address for a new guest: 'dhcp' pass-through when the network's
# cidr is the string 'dhcp', otherwise a static address chosen by
# scripts/allocate-ip.py from the pool the app belongs to.
#
# Addressing is static by decision. DHCP happens only where a network's cidr says
# the literal 'dhcp', never as a fallback when allocation is hard — a guest whose
# address the platform did not choose is a guest it cannot wire, route or monitor.
#
# Inputs:
#   network_name (optional) — key into homelabinfra_config.networks; the EXPLICIT choice,
#                             `proxmox.network` in an instance file. Empty means none, and
#                             a name that the lab does not define fails the run.
#   network_hint (optional) — the network this guest belongs on by SCOPE: its estate's
#                             name, or 'shared' for a lab-scoped guest and a shared stack.
#                             Resolved by tasks/network/resolve-network.yml. Used ONLY when
#                             the lab defines a network of that name, so a flat lab is
#                             untouched — the same asymmetry as pool_hint below.
#   pool_name    (optional) — a pool the caller demands; absent from the network is an error
#   pool_hint    (optional) — usually the app's stack name; used only when the network
#                             defines a pool of that name, so a pool-less lab is untouched
#   requested_ip_address (optional) — an exact address to pin; honoured or refused, never
#                             quietly replaced
#   homelabinfra_config.networks.<name>.cidr   — required; subnet CIDR or 'dhcp'
#   homelabinfra_config.networks.<name>.{gateway,dns_servers,bridge,vlan,
#     searchdomain,ip_offset,max_hosts,pools,reserved,default_pool}
#                                              — optional; merged over networks.default
#   groups['proxmox_clients'] hostvars          — existing IPs excluded from allocation
#
# Mutates (combine recursive per docs/specs/namespace-merge-discipline.md):
#   homelabinfra_instance.network.{name,cidr,ip_address}  — always
#   homelabinfra_instance.network.pool                    — when a pool was used
#   homelabinfra_instance.network.{gateway,dns_servers,bridge,vlan,searchdomain}
#     — only the keys the effective network config defines (never omit placeholders)
#
# Scratch facts left behind: _network_selected, network_config, final_ip_address,
# proxmox_client_ips, effective_pool_name — a second call in the same play overwrites them.

# The answer is written to `_network_selected`, NOT back into `network_name`. Callers hand
# `network_name` in through `vars:` on the import/include, and a task var outranks a fact
# for every task of the imported file — so writing the resolved name into the same variable
# would leave the caller's ORIGINAL value in force below this task. That was invisible while
# every caller passed an already-resolved name, and is wrong the moment one passes an empty
# one and expects the hint to decide.
- name: Set network selector
  ansible.builtin.set_fact:
    _network_selected: >-
      {{ _network_requested
         if _network_requested | length > 0
         else (_network_hint
               if (_network_hint | length > 0
                   and _network_hint in (homelabinfra_config.networks | default({})))
               else 'default') }}
  vars:
    _network_requested: "{{ network_name | default('', true) }}"
    _network_hint: "{{ network_hint | default('', true) }}"
  run_once: true

- name: Assert network config exists
  ansible.builtin.assert:
    that:
      - homelabinfra_config is defined
      - homelabinfra_config.networks is defined
      - homelabinfra_config.networks[_network_selected] is defined
      - homelabinfra_config.networks[_network_selected].cidr is defined
    fail_msg: >-
      config/proxmox.yml defines no network named {{ _network_selected }} with a cidr.
      Declared networks: {{ (homelabinfra_config.networks | default({})).keys() | list }}.
  run_once: true

- name: Build effective network config
  ansible.builtin.set_fact:
    network_config: "{{ homelabinfra_config.networks.default | default({}) | combine(homelabinfra_config.networks[_network_selected], recursive=True) }}"
  run_once: true

- name: Use DHCP for IP allocation
  ansible.builtin.set_fact:
    final_ip_address: "dhcp"
    effective_pool_name: ""
  when: network_config.cidr is string and network_config.cidr | lower == 'dhcp'
  run_once: true

- name: Allocate static IP in subnet
  when: network_config.cidr is not string or network_config.cidr | lower != 'dhcp'
  run_once: true
  block:
    - name: Collect existing client IPs from proxmox inventory
      ansible.builtin.set_fact:
        proxmox_client_ips: >-
          {{ (proxmox_client_ips | default([])) + [
              hostvars[item].ansible_host
              | default(hostvars[item].ip)
              | default(hostvars[item].ip_address)
            ] }}
      loop: "{{ groups['proxmox_clients'] | default([]) }}"
      when:
        - hostvars[item] is defined
        - hostvars[item].ansible_host is defined or hostvars[item].ip is defined or hostvars[item].ip_address is defined

    # A guest can be in the inventory with the KEY present and the value empty — a
    # template, or anything Proxmox reports no address for. `is defined` above says
    # nothing about that, and the allocator is strict on purpose: it refused the
    # whole run with "in-use address '' is not an address, range or CIDR" rather
    # than guessing. An unknown address occupies nothing, so drop it here.
    - name: Drop inventory entries that carry no address
      ansible.builtin.set_fact:
        proxmox_client_ips: >-
          {{ proxmox_client_ips | default([]) | reject('equalto', '') | list }}

    # A pool named in config is a requirement; a pool inherited from the app's stack
    # is advisory. That asymmetry is what lets a lab adopt pools one band at a time
    # while every stack keeps deploying, and still refuses a config that names a pool
    # the network has never heard of.
    - name: Resolve which pool this guest allocates from
      ansible.builtin.set_fact:
        effective_pool_name: >-
          {{ pool_name | default('', true)
             if (pool_name | default('', true) | length > 0)
             else (pool_hint
                   if (pool_hint | default('', true) | length > 0
                       and pool_hint in (network_config.pools | default({})))
                   else network_config.default_pool | default('', true)) }}

    - name: Assert the requested pool is defined on this network
      ansible.builtin.assert:
        that: effective_pool_name in (network_config.pools | default({}))
        fail_msg: >-
          Network {{ _network_selected }} defines no pool named
          {{ effective_pool_name }}. Declared pools:
          {{ (network_config.pools | default({})).keys() | list }}.
      when: effective_pool_name | length > 0

    - name: Choose the address
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/allocate-ip.py"
        stdin: >-
          {{ {
               'cidr': network_config.cidr,
               'gateway': network_config.gateway | default(''),
               'in_use': proxmox_client_ips | default([]),
               'reserved': network_config.reserved | default([]),
               'offset': network_config.ip_offset | default(1),
               'max_hosts': network_config.max_hosts | default(''),
               'pin': requested_ip_address | default('', true),
               'pool': ({'name': effective_pool_name}
                        | combine((network_config.pools | default({}))[effective_pool_name]))
                       if effective_pool_name | length > 0 else none,
             } | to_json }}
      register: ip_allocation
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Take the allocated address
      ansible.builtin.set_fact:
        final_ip_address: "{{ (ip_allocation.stdout | from_json).ip_address }}"

    - name: Assert an available IP was found in the subnet
      ansible.builtin.assert:
        that:
          - final_ip_address | length > 0
        fail_msg: "No available IPs found in {{ network_config.cidr }}"

# The `network` sub-dict is REPLACED, not merged into — the one deliberate exception
# to the recursive-combine rule, and it is still recursive at the level that matters:
# sibling keys of homelabinfra_instance survive untouched.
#
# create-docker-host.yml calls this twice in one play, and a merge left the second
# call wearing the first's keys: a guest allocated with no pool came back carrying
# the previous guest's `pool`, and the same would happen to gateway, vlan and bridge
# when two calls name different networks. Every key here is derived fresh from
# network_config, so a stale one is never right.
- name: Set network instance facts
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | default({}) | combine({
          'network': {
              'name': _network_selected,
              'cidr': network_config.cidr,
              'ip_address': final_ip_address
            }
            | combine((effective_pool_name | default('') | length > 0) | ternary({'pool': effective_pool_name}, {}))
            | combine((network_config.gateway is defined) | ternary({'gateway': network_config.gateway}, {}))
            | combine((network_config.dns_servers is defined) | ternary({'dns_servers': network_config.dns_servers}, {}))
            | combine((network_config.bridge is defined) | ternary({'bridge': network_config.bridge}, {}))
            | combine((network_config.vlan is defined) | ternary({'vlan': network_config.vlan}, {}))
            | combine((network_config.searchdomain is defined) | ternary({'searchdomain': network_config.searchdomain}, {}))
        }) }}
  run_once: true
