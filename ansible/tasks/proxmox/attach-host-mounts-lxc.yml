---
# Attach existing host directories to a guest as Proxmox mountpoints.
#
# The platform does not create, export or manage storage. The lab already has its
# library and download directories mounted on the Proxmox node — an NFS export, a
# ZFS dataset, whatever it is — and this makes them reachable from the guest that
# runs the apps. Declaring where they already are is configuration; provisioning
# them would be replicating a job the node already does.
#
# Idempotent and additive: a mountpoint already present is left exactly as it is,
# an unrelated mpN belonging to something else is never touched, and nothing is
# ever removed. Mountpoints are matched on the (host path, guest path) pair, not
# on index — PVE assigns indices in its own order.
#
# Inputs:
#   attach_mounts_guest — guest hostname to attach to
#   attach_mounts_list  — [{host: /mnt/media, path: /mnt/data/media}, ...]
#                         `host` is the path on the Proxmox node, `path` is where
#                         the guest sees it. Keeping them identical is what lets a
#                         migrated app database keep resolving its file paths.
#   attach_mounts_owner — {user: homelab-infra, uid: 1313, gid: 1313} or omitted.
#                         Who owns this storage. Supplying it is what makes the
#                         mount WRITABLE from inside an unprivileged guest; omit it
#                         and the mount is attached read-as-nobody, which is all a
#                         guest can do with a host uid outside its own id range.
#
# Runs on localhost, delegating node commands to the node itself.

# The caller guards on an empty list — see the servarr playbooks. This file always
# has work to do by the time it is included.
#
# JSON from pvesh rather than columns from `pct list`: that command's Lock column
# is empty for most containers, so a positional split yields three fields for some
# guests and four for others, and the name lands in a different position depending
# on whether the guest happens to be locked.
- name: Host mounts | List the node's containers
  ansible.builtin.command:
    cmd: "pvesh get /nodes/{{ homelabinfra_config.proxmox.node }}/lxc --output-format json"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _am_lxc_list
  changed_when: false

- name: Host mounts | Extract the vmid for {{ attach_mounts_guest }}
  ansible.builtin.set_fact:
    _am_vmid: >-
      {{ (_am_entry | map(attribute='vmid') | list | first)
         | default('') | string }}
    _am_was_running: >-
      {{ (_am_entry | map(attribute='status') | list | first)
         | default('') == 'running' }}
  vars:
    _am_entry: >-
      {{ _am_lxc_list.stdout | from_json
         | selectattr('name', 'defined')
         | selectattr('name', 'equalto', attach_mounts_guest) | list }}

- name: Host mounts | Assert the guest was found
  ansible.builtin.assert:
    that: _am_vmid | length > 0
    fail_msg: >-
      No container named {{ attach_mounts_guest }} on node
      {{ homelabinfra_config.proxmox.node }}. Mountpoints cannot be attached to a
      guest that `pct list` does not show.

# The paths are the lab's, and the lab is where they are mounted. A typo would
# otherwise produce a guest with an empty directory where its library should be,
# and an app that reports every file missing.
- name: Host mounts | Verify the host paths exist on the node
  ansible.builtin.stat:
    path: "{{ item.host }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _am_host_paths
  loop: "{{ attach_mounts_list }}"
  loop_control:
    label: "{{ item.host }}"

- name: Host mounts | Assert every host path is a directory on the node
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: >-
      {{ item.item.host }} does not exist as a directory on
      {{ homelabinfra_config.proxmox.node }}. This platform attaches storage the
      lab already provides; it does not create or mount it. Mount it on the node
      first, then re-run.
  loop: "{{ _am_host_paths.results }}"
  loop_control:
    label: "{{ item.item.host }}"

- name: Host mounts | Prepare the storage owner on the node
  ansible.builtin.import_tasks: attach-host-mounts-lxc/owner.yml

- name: Host mounts | Resolve the missing mountpoints and identity passthrough
  ansible.builtin.import_tasks: attach-host-mounts-lxc/plan.yml

# PVE attaches a mountpoint to a RUNNING container by hotplugging it, which has to
# re-apply the guest's apparmor profile and fails on an unprivileged container:
# `unable to hotplug mp0: failed to change apparmor profile: No such file or
# directory` (media-stack, execution 56, 2026-08-09). A stopped container takes the
# same `pct set` unconditionally, because there is no live profile to change. The
# guest was going to bounce either way — the mountpoint is invisible to a running
# container until it restarts — so stopping first costs no extra disruption and
# removes the whole failure mode. Nothing is stopped unless there is work to do.
- name: Host mounts | Stop the guest so the mountpoints can be attached
  ansible.builtin.command:
    cmd: "pct shutdown {{ _am_vmid }} --forceStop 1 --timeout 120"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _am_work | bool and _am_was_running
  changed_when: true

- name: Host mounts | Wait for the guest to reach stopped
  ansible.builtin.command:
    cmd: "pct status {{ _am_vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _am_stop_check
  until: _am_stop_check.stdout is search('stopped')
  retries: 30
  delay: 4
  when: _am_work | bool and _am_was_running
  changed_when: false

- name: Host mounts | Attach the missing mountpoints
  ansible.builtin.command:
    cmd: >-
      pct set {{ _am_vmid }}
      -mp{{ _am_next_index }} {{ item.host }},mp={{ item.path }}
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _am_missing }}"
  loop_control:
    label: "{{ item.host }} -> {{ item.path }}"
    index_var: _am_loop_index
  vars:
    _am_next_index: >-
      {{ ((_am_used_indices + range(0, 256) | list) | unique
          | difference(_am_used_indices))[_am_loop_index] }}
  changed_when: true

# `pct set` above rewrites /etc/pve/lxc/<vmid>.conf, so the snapshot taken at
# `Read the raw guest config file` is now stale by exactly the mountpoint lines
# just added — and the copy below rebuilds the whole file from that snapshot.
# Without this re-read the mp lines are written by `pct set` and deleted again
# milliseconds later: the guest starts with no storage, and the deploy fails the
# very mount assert the attach existed to satisfy (execution 168, 2026-08-16,
# qbittorrent onto a brand-new stack host).
#
# It only ever bit a FIRST attach, which is why the live media stack never showed
# it: both halves have to be missing in one run, and after any run has written the
# idmap the copy is skipped and the mountpoints survive. So the failure was
# reserved for a new lab's first media deploy, where it is fatal.
- name: Host mounts | Re-read the raw guest config after attaching mountpoints
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ _am_vmid }}.conf"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _am_raw_conf_post
  when: _am_idmap_missing | default(false) | bool

- name: Host mounts | Refresh the config lines from that re-read
  ansible.builtin.set_fact:
    # `.splitlines()` for the same reason as the first read — see above.
    _am_conf_lines: >-
      {{ (_am_raw_conf_post.content | default('') | b64decode).splitlines()
         | map('trim') | list }}
  when: _am_idmap_missing | default(false) | bool

# The whole `lxc.idmap:` set is replaced, not appended to, and no comment marker is
# involved. PVE owns this file: `pct set` rewrites it and hoists every `#` line into
# the description block at the top, which detaches a blockinfile marker pair from the
# lines it was supposed to bracket — after which blockinfile sees no block and appends
# a second, conflicting copy. LXC then refuses to start the guest with
# `container uid 0 is also mapped by entry` (media-stack, execution 60, 2026-08-09).
# Rewriting the set is idempotent under anything PVE does to the file, and it also
# repairs a guest already carrying duplicates. The stale markers are dropped on sight.
- name: Host mounts | Write the identity passthrough into the guest config
  ansible.builtin.copy:
    dest: "/etc/pve/lxc/{{ _am_vmid }}.conf"
    content: "{{ (_am_kept_lines + _am_idmap_lines) | join('\n') }}\n"
  vars:
    _am_kept_lines: >-
      {{ _am_conf_lines
         | reject('match', '^lxc\.idmap:')
         | reject('search', 'homelab-infra storage identity')
         | list }}
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _am_idmap_missing | default(false) | bool

# The mount roots only — never a recursive walk. The platform is pointed at the
# lab's storage and takes ownership of the directories it was handed, not of
# everything already inside them: a populated library keeps its files exactly as
# they are, and `chown -R` across an NFS export of two and a half thousand films
# is not something a deploy should ever start.
- name: Host mounts | Give the storage owner its directories
  ansible.builtin.file:
    path: "{{ item.host }}"
    owner: "{{ attach_mounts_owner.user }}"
    group: "{{ attach_mounts_owner.user }}"
    state: directory
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ attach_mounts_list }}"
  loop_control:
    label: "{{ item.host }}"
  when: attach_mounts_owner | default({}) | length > 0

# A container only sees a mountpoint from the boot that follows it being attached,
# so the guest comes back up holding the new mounts. Without the restart the deploy
# that added the mount would find an empty directory, configure a root folder inside
# it, and the app would report every file missing — while the next deploy, on a
# container that had been restarted for some unrelated reason, would work. The
# guest is returned to the state it was found in: one that was already stopped
# stays stopped, and starting it is the job of whoever wanted it running.
- name: Host mounts | Start the guest so it sees the new mountpoints
  ansible.builtin.command:
    cmd: "pct start {{ _am_vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _am_work | bool and _am_was_running
  changed_when: true

- name: Host mounts | Wait for the guest to answer SSH again
  ansible.builtin.wait_for:
    host: "{{ hostvars[attach_mounts_guest].ansible_host }}"
    port: 22
    delay: 5
    timeout: 300
  when: _am_work | bool and _am_was_running

- name: Host mounts | Report what is attached
  ansible.builtin.debug:
    msg: >-
      {{ attach_mounts_guest }} (vmid {{ _am_vmid }}):
      {{ _am_missing | length }} mountpoint(s) attached this run,
      {{ attach_mounts_list | length - (_am_missing | length) }} already present.
