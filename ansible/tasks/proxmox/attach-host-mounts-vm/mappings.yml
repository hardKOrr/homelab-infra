---
# Phase of attach-host-mounts-vm.yml: index the existing cluster directory mappings,
# create only the missing ones, extend a mapping homelab-infra created to new compute
# nodes and assign free virtiofs device slots. Inputs are listed in attach-host-mounts-
# vm.yml.

# One directory mapping per host path, found by that path rather than by a computed ID.
# The ID once hashed the compute node list too, so a node joining the cluster changed it:
# Deploy made a second mapping and the guest-mount guard below refused the mount the guest
# already had from the first. Prefer the mapping this VM already mounts, then any mapping
# of exactly that path, and create one only when none exists. A mapping this file created
# (ID `d` + 12 hex) gains any compute node it lacks; an operator's is only read.
- name: VM host mounts | Read existing directory mappings
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/mapping/dir, --output-format, json]
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _vmfs_mapping_list
  changed_when: false

- name: VM host mounts | Read each existing directory mapping without changing it
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/cluster/mapping/dir/{{ item }}"
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _vmfs_mapping_details
  loop: "{{ _vmfs_mapping_list.stdout | from_json | map(attribute='id') | list }}"
  changed_when: false

- name: VM host mounts | Index existing mappings by node and path
  ansible.builtin.set_fact:
    _vmfs_existing_mappings: >-
      {{ _vmfs_existing_mappings + [{
           'id': item.item,
           'entries': _entries,
           'nodes': _entries | map('split', ',') | map('first')
                    | map('regex_replace', '^node=', '') | list,
           'paths': _entries | map('split', ',') | map('last')
                    | map('regex_replace', '^path=', '') | map('regex_replace', '/+$', '')
                    | unique | list
         }] }}
  vars:
    _entries: "{{ (item.stdout | from_json).map | default([]) }}"
  loop: "{{ _vmfs_mapping_details.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: VM host mounts | Choose each host path's directory mapping
  ansible.builtin.set_fact:
    _vmfs_directory_mappings: >-
      {{ _vmfs_directory_mappings + [{
           'id': _chosen.id | default('d' ~ (item | hash('sha1'))[:12]),
           'host': item,
           'exists': _chosen | length > 0,
           'entries': _chosen.entries | default([]),
           'missing_nodes': _vmfs_compute_nodes | reject('in', _chosen.nodes | default([])) | list
         }] }}
  vars:
    _candidates: >-
      {{ _vmfs_existing_mappings | selectattr('paths', 'equalto', [item]) | list }}
    # Device order is slot order, so a VM with two devices for one path keeps its first.
    _attached_id: >-
      {{ _vmfs_existing_device_ids
         | select('in', _candidates | map(attribute='id') | list) | first | default('') }}
    _chosen: >-
      {{ ((_candidates | selectattr('id', 'equalto', _attached_id) | list)
          + _candidates) | first | default({}) }}
  loop: "{{ _vmfs_host_paths }}"
  loop_control:
    label: "{{ item }}"

- name: VM host mounts | Create only missing directory mappings
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'create', '/cluster/mapping/dir', '--id', item.id]
         + (_vmfs_compute_nodes
            | map('regex_replace', '$', ',path=' ~ item.host)
            | map('regex_replace', '^', 'node=')
            | map('regex_replace', '^', '--map ')
            | map('split', ' ') | flatten) }}
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _vmfs_directory_mappings | rejectattr('exists') | list }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: true

- name: VM host mounts | Refuse an operator mapping that lacks a compute node
  ansible.builtin.assert:
    that: item.missing_nodes | length == 0
    fail_msg: >-
      Directory mapping {{ item.id }} maps {{ item.host }} but not on
      {{ item.missing_nodes | join(', ') }}. It was not created by homelab-infra, so it is
      left unchanged; add those nodes to it before deploying this VM.
  loop: "{{ _vmfs_directory_mappings | selectattr('exists') | list }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id is not match('^d[0-9a-f]{12}$')

- name: VM host mounts | Add new compute nodes to a mapping homelab-infra created
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'set', '/cluster/mapping/dir/' ~ item.id]
         + ((item.entries
             + (item.missing_nodes
                | map('regex_replace', '$', ',path=' ~ item.host)
                | map('regex_replace', '^', 'node=') | list))
            | map('regex_replace', '^', '--map ')
            | map('split', ' ') | flatten) }}
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _vmfs_directory_mappings | selectattr('exists') | list }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - item.id is match('^d[0-9a-f]{12}$')
    - item.missing_nodes | length > 0
  changed_when: true

- name: VM host mounts | Assign free virtiofs device slots
  ansible.builtin.set_fact:
    _vmfs_missing_devices: >-
      {{ _vmfs_missing_mappings | zip(_vmfs_free_indexes) | map('list') | list }}
  vars:
    _vmfs_missing_mappings: >-
      {{ _vmfs_directory_mappings
         | rejectattr('id', 'in', _vmfs_existing_device_ids) | list }}
    _vmfs_free_indexes: >-
      {{ (range(0, 10) | list | difference(_vmfs_used_device_indexes))
         [:(_vmfs_missing_mappings | length)] }}

- name: VM host mounts | Require available virtiofs slots
  ansible.builtin.assert:
    that: _vmfs_missing_devices | length == _vmfs_missing_mappings | length
    fail_msg: >-
      VM {{ attach_mounts_guest }} has no free virtiofs slot for every requested directory.
      Proxmox supports virtiofs0 through virtiofs9; existing devices were not changed.
  vars:
    _vmfs_missing_mappings: >-
      {{ _vmfs_directory_mappings
         | rejectattr('id', 'in', _vmfs_existing_device_ids) | list }}
