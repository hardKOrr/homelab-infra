# Add one explicitly reviewed missing stack identity tag to exact owned guests.
# This task file is called by the maintenance playbook; it does not start the guest.
- name: Require exact repair inputs
  ansible.builtin.assert:
    that:
      - repair_stack | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
      - repair_vmids | default('') is match('^[1-9][0-9]*(,[1-9][0-9]*)*$')

- name: Load the authored stack defaults
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/stack-defaults.yml"
    name: _repair_stack_defaults_file

- name: Resolve the authored stack and estate identities
  ansible.builtin.set_fact:
    _repair_stack_defaults: "{{ _repair_stack_defaults_file.stack_defaults | default({}) }}"
    _repair_stack_estates: "{{ (homelabinfra_config.infrastructure | default({})).domains | default({}) }}"
    _repair_stack_overrides: "{{ (homelabinfra_config.infrastructure | default({})).stacks | default({}) }}"

- name: Resolve this stack's effective authored sizing
  ansible.builtin.set_fact:
    _repair_stack_sizing: >-
      {{ (_repair_stack_defaults._default | default({}))
         | combine(_repair_stack_defaults.get(repair_stack, {}), recursive=True)
         | combine(_repair_stack_overrides.get(repair_stack, {}), recursive=True) }}

- name: Resolve whether the authored stack is shared
  ansible.builtin.set_fact:
    _repair_stack_shared: "{{ _repair_stack_sizing.shared | default(false) | bool }}"

- name: Require a declared stack and an unambiguous estate identity
  ansible.builtin.assert:
    that:
      - repair_stack in _repair_stack_defaults
      - >-
        _repair_stack_shared
        or (_repair_stack_estates | length < 2)
        or repair_estate | default('') in (_repair_stack_estates.keys() | list)
      - >-
        not (repair_estate | default(''))
        or repair_estate in (_repair_stack_estates.keys() | list)
      - not (_repair_stack_shared and repair_estate | default(''))
    fail_msg: >-
      Select a stack from vars/stack-defaults.yml. In a multi-estate lab, provide the
      exact declared estate unless the stack is shared. Shared stacks do not take an
      estate suffix.

- name: Resolve the expected guest name and stack tag
  ansible.builtin.set_fact:
    _repair_stack_id: >-
      {{ repair_stack
         if _repair_stack_shared or _repair_stack_estates | length < 2
         else repair_stack ~ '-' ~ repair_estate }}
    _repair_vmids: "{{ repair_vmids.split(',') | map('int') | list }}"

- name: Require unique target identities and the exact execution confirmation
  ansible.builtin.assert:
    that:
      - _repair_vmids | unique | length == _repair_vmids | length
      - >-
        not (repair_execute | bool)
        or repair_confirmation | default('') == 'ADD STACK TAG _.stack+' ~ _repair_stack_id

- name: Read current cluster guest identities
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _repair_inventory
  changed_when: false
  no_log: true

- name: Resolve exact current targets
  ansible.builtin.set_fact:
    _repair_guests: "{{ _repair_inventory.stdout | from_json | selectattr('vmid', 'in', _repair_vmids) | list }}"
    _repair_expected_name: "stack-{{ _repair_stack_id }}"
    _repair_expected_tag: "_.stack+{{ _repair_stack_id }}"
  no_log: true

- name: Require every requested guest to exist exactly once
  ansible.builtin.assert:
    that: _repair_guests | length == _repair_vmids | length

- name: Require exact owned non-template guests with no conflicting stack identity
  ansible.builtin.assert:
    that:
      - item.type in ['lxc', 'qemu']
      - not (item.template | default(false) | bool)
      - item.name == _repair_expected_name
      - "'_+lab' in (item.tags | default('', true)).split(';')"
      - >-
        (item.tags | default('', true)).split(';')
        | select('match', '^_[.]stack[+]') | list | length <= 1
      - >-
        (item.tags | default('', true)).split(';')
        | select('match', '^_[.]stack[+]') | list
        | difference([_repair_expected_tag]) | length == 0
  loop: "{{ _repair_guests }}"
  loop_control:
    label: "{{ item.vmid }}"

- name: Read all target configurations before writing any
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config", --output-format, json]
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _repair_guests }}"
  register: _repair_configs
  changed_when: false
  no_log: true

- name: Refuse locked, unowned, or differently named guest configurations
  ansible.builtin.assert:
    that:
      - _cfg.digest is defined
      - _cfg.lock is not defined
      - "'_+lab' in (_cfg.tags | default('', true)).split(';')"
      - >-
        (_cfg.name if item.item.type == 'qemu' else _cfg.hostname)
        == _repair_expected_name
      - >-
        (_cfg.tags | default('', true)).split(';')
        | select('match', '^_[.]stack[+]') | list | length <= 1
      - >-
        (_cfg.tags | default('', true)).split(';')
        | select('match', '^_[.]stack[+]') | list
        | difference([_repair_expected_tag]) | length == 0
  vars:
    _cfg: "{{ item.stdout | from_json }}"
  loop: "{{ _repair_configs.results }}"
  loop_control:
    label: "{{ item.item.vmid }}"
  no_log: true

- name: Report the exact planned stack tag repair
  ansible.builtin.debug:
    msg: >-
      {{ 'Execute' if repair_execute | bool else 'Plan only' }}: add
      {{ _repair_expected_tag }} to VMID {{ item.vmid }} only when it is missing;
      preserve every other guest setting.
  loop: "{{ _repair_guests }}"
  loop_control:
    label: "{{ item.vmid }}"

- name: Repair the reviewed missing stack tag
  when: repair_execute | bool
  block:
    - name: Create the private node recovery directory
      ansible.builtin.file:
        path: /root/homelab-infra/missing-stack-tag-repair
        state: directory
        mode: '0700'
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"

    - name: Preserve each original guest configuration
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "/root/homelab-infra/missing-stack-tag-repair/{{ item.item.vmid }}.json"
        force: false
        mode: '0600'
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      loop: "{{ _repair_configs.results }}"
      no_log: true

    - name: Add only the reviewed tag with a configuration concurrency check
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - "/nodes/{{ item.item.node }}/{{ item.item.type }}/{{ item.item.vmid }}/config"
          - --tags
          - >-
            {{ (((_cfg.tags | default('', true)).split(';')
                 | reject('equalto', '') | list) + [_repair_expected_tag])
               | unique | sort | join(';') }}
          - --digest
          - "{{ _cfg.digest }}"
      vars:
        _cfg: "{{ item.stdout | from_json }}"
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      loop: "{{ _repair_configs.results }}"
      when: _repair_expected_tag not in (_cfg.tags | default('', true)).split(';')
      changed_when: true
      no_log: true

    - name: Read back every target configuration
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config", --output-format, json]
      delegate_to: "{{ homelabinfra_config.proxmox.node }}"
      loop: "{{ _repair_guests }}"
      register: _repair_after
      changed_when: false
      no_log: true

    - name: Verify the requested tag was the only configuration change
      ansible.builtin.assert:
        that:
          - _repair_expected_tag in (_after.tags | default('', true)).split(';')
          - >-
            _after | dict2items | rejectattr('key', 'in', ['tags', 'digest']) | items2dict
            == _before | dict2items | rejectattr('key', 'in', ['tags', 'digest']) | items2dict
          - >-
            ((_after.tags | default('', true)).split(';')
             | reject('equalto', '') | list | unique | sort)
            == (((_before.tags | default('', true)).split(';')
                 | reject('equalto', '') | list) + [_repair_expected_tag])
               | unique | sort
      vars:
        _before: "{{ _repair_configs.results[repair_index].stdout | from_json }}"
        _after: "{{ item.stdout | from_json }}"
      loop: "{{ _repair_after.results }}"
      loop_control:
        index_var: repair_index
        label: "{{ item.item.vmid }}"
      no_log: true

    - name: Notify completed stack tag repair
      ansible.builtin.include_tasks: ../../tasks/notify.yml
      vars:
        notify_title: Stack identity tag repaired
        notify_message: "Added a missing stack identity tag to the reviewed owned host."

    - name: Require successful notification
      ansible.builtin.include_tasks: ../../tasks/assert-no-degradations.yml
      vars:
        degradation_scope: missing stack identity repair
