---
# Make sure an EXISTING guest is running before a play tries to connect to it.
#
# Why this exists: every app playbook and stack/find-or-create-host.yml has a
# "reuse the guest we already made" branch, and that branch skips lxc-create.yml /
# vm-create.yml entirely — which is where starting a guest lives. So reuse assumed
# the guest was running, and a guest that was stopped for ANY reason stayed stopped:
# a host rebooted with onboot off, an operator stop, or — how this surfaced — a
# guest created by an earlier run that failed before it started anything. Every
# subsequent deploy then died identically at the first connection:
#
#     fatal: [ntfy]: UNREACHABLE! ... connect to host 192.0.2.11 port 22: No route to host
#
# That contradicts the promise bootstrap.yml makes in its header — "re-running after
# any failure is safe" — because the one thing a re-run could not do was recover a
# guest left stopped by the failure it is re-running after.
#
# Start goes through node-local pct/qm for the reason recorded in lxc-create.yml:
# the module's start path reads an eventually-consistent /cluster/resources entry.
#
# Inputs:
#   ensure_guest_host — inventory hostname of the existing guest. Its proxmox_*
#                       hostvars (vmid, node, status, vmtype) come from the dynamic
#                       inventory with want_facts: true.
#   app_config         — optional merged app config; a configured VM balloon minimum
#                       converges its memory maximum and balloon value on deploy.
#
# Idempotent: a running guest without VM config drift is a no-op, and the "already
# running" race between the status fact and the start is tolerated rather than treated
# as a failure.

- name: Make Proxmox nodes addressable for delegation
  ansible.builtin.import_tasks: register-nodes.yml

- name: Ensure running | Resolve the guest's identity from inventory facts
  ansible.builtin.set_fact:
    _egr_vmid: "{{ hostvars[ensure_guest_host].proxmox_vmid | default('') }}"
    _egr_node: "{{ hostvars[ensure_guest_host].proxmox_node | default('') }}"
    _egr_status: "{{ hostvars[ensure_guest_host].proxmox_status | default('') }}"
    _egr_vmtype: "{{ hostvars[ensure_guest_host].proxmox_vmtype | default('lxc') }}"
    # The comparison needs its own parentheses: Jinja binds `|` tighter than `==`, so
    # `x == 'qemu' | ternary('qm', 'pct')` groups as `x == ('qemu' | ternary(...))`, which
    # compares the vmtype against the string 'qm' and yields the BOOLEAN False — producing
    # the command `False start <vmid>`.
    _egr_command: "{{ ((hostvars[ensure_guest_host].proxmox_vmtype | default('lxc')) == 'qemu') | ternary('qm', 'pct') }}"
    # App deploys carry their effective per-instance config on localhost. Other callers
    # (for example the reviewed start-only helper) may not, so absence stays a no-op.
    _egr_balloon_requested: >-
      {{ (app_config | default({})).get('proxmox', {}).get('vm', {}).get('balloon') or '' }}

# A guest in the inventory always carries these. Missing them means the caller passed
# a host the Proxmox inventory did not produce, which is worth failing on rather than
# silently skipping the start and failing later at the connection.
- name: Ensure running | Assert the guest was resolved
  ansible.builtin.assert:
    that:
      - _egr_vmid | string | length > 0
      - _egr_node | string | length > 0
    fail_msg: >-
      Cannot determine the Proxmox vmid/node for '{{ ensure_guest_host }}'. Expected
      proxmox_vmid and proxmox_node hostvars from the dynamic inventory.

- name: Ensure running | Read the guest config needed for memory checks or balloon convergence
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ _egr_node }}/{{ _egr_vmtype }}/{{ _egr_vmid }}/config"
      - --output-format
      - json
  delegate_to: "{{ _egr_node }}"
  register: _egr_guest_config
  changed_when: false
  when:
    - _egr_status != 'running'
      or (_egr_vmtype == 'qemu' and (_egr_balloon_requested | string | length > 0))

- name: Ensure running | Decode current guest config for balloon convergence
  ansible.builtin.set_fact:
    _egr_guest_config_data: "{{ _egr_guest_config.stdout | default('{}') | from_json }}"
  when:
    - _egr_vmtype == 'qemu'
    - _egr_balloon_requested is not none
    - _egr_balloon_requested | string | length > 0

- name: Ensure running | Resolve the configured VM memory maximum
  ansible.builtin.set_fact:
    _egr_balloon_memory_mib: >-
      {{ (app_config | default({})).get('proxmox', {}).get('vm', {}).get('memory')
         | default(
             (app_config | default({})).get('proxmox', {}).get('memory')
             | default(_egr_guest_config_data.memory | default(512), true),
             true
           ) }}
  when:
    - _egr_vmtype == 'qemu'
    - _egr_balloon_requested is not none
    - _egr_balloon_requested | string | length > 0

- name: Ensure running | Validate the configured balloon minimum
  ansible.builtin.include_tasks: validate-vm-balloon.yml
  vars:
    proxmox_vm_balloon_mib: "{{ _egr_balloon_requested }}"
    proxmox_vm_memory_mib: "{{ _egr_balloon_memory_mib }}"
    proxmox_vm_guest: "{{ hostvars[ensure_guest_host].proxmox_name | default(ensure_guest_host) }}"
  when:
    - _egr_vmtype == 'qemu'
    - _egr_balloon_requested is not none
    - _egr_balloon_requested | string | length > 0

- name: Ensure running | Converge the configured VM balloon minimum
  community.proxmox.proxmox_kvm:
    api_host: "{{ homelabinfra_config.proxmox.api_host }}"
    api_port: "{{ homelabinfra_config.proxmox.api_port | default(8006) }}"
    api_user: "{{ homelabinfra_config.proxmox.api_user }}"
    api_token_id: "{{ homelabinfra_config.proxmox.api_token_id }}"
    api_token_secret: "{{ homelabinfra_config.proxmox.api_token_secret }}"
    validate_certs: "{{ homelabinfra_config.proxmox.validate_certs | default(false) }}"
    node: "{{ _egr_node }}"
    vmid: "{{ _egr_vmid | int }}"
    state: present
    update: true
    memory: "{{ _egr_balloon_memory_mib | int }}"
    balloon: "{{ _egr_balloon_requested | int }}"
  no_log: true
  when:
    - _egr_vmtype == 'qemu'
    - _egr_balloon_requested is not none
    - _egr_balloon_requested | string | length > 0
    - >-
      (_egr_guest_config_data.memory | default(512) | int) != (_egr_balloon_memory_mib | int)
      or (_egr_guest_config_data.balloon | default(0) | int) != (_egr_balloon_requested | int)

- name: Ensure running | Check node memory before starting the guest
  ansible.builtin.include_tasks: check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ _egr_node }}"
    proxmox_memory_guest: >-
      {{ hostvars[ensure_guest_host].proxmox_name
         | default(hostvars[ensure_guest_host].proxmox_hostname | default(ensure_guest_host)) }}
    proxmox_guest_memory_mib: >-
      {{ (_egr_balloon_memory_mib
          if (_egr_balloon_requested | string | length > 0)
          else ((_egr_guest_config.stdout | from_json).memory | default(512))) | int }}
  when: _egr_status != 'running'

- name: Ensure running | Start the guest if it is not running
  ansible.builtin.command:
    cmd: "{{ _egr_command }} start {{ _egr_vmid }}"
  delegate_to: "{{ _egr_node }}"
  register: _egr_start
  when: _egr_status != 'running'
  changed_when: _egr_start.rc == 0
  failed_when:
    - _egr_start.rc != 0
    - "'already running' not in (_egr_start.stderr | default('')) | lower"

# Only after an actual start: a guest that was already running has already passed this.
- name: Ensure running | Wait for the guest to accept exec
  ansible.builtin.command:
    cmd: >-
      {{ _egr_command }} {{ (_egr_command == 'qm') | ternary('guest exec', 'exec') }}
      {{ _egr_vmid }} -- /bin/true
  delegate_to: "{{ _egr_node }}"
  register: _egr_exec
  retries: 30
  delay: 2
  until: _egr_exec.rc == 0
  changed_when: false
  when: _egr_status != 'running'
