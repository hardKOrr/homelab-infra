---
# Deploy check for a media server that may transcode on the iGPU (deploy-prepare hooks of
# Plex, Jellyfin and Emby): app.gpu_device, when set, names a dedicated iGPU in
# proxmox.devices, and /dev/dri is declared only with it, since a Proxmox host's
# /dev/dri cannot be shared into the stack VM.
#
# Inputs: app_config, igpu_app_display.
- name: "{{ igpu_app_display }} | Validate the GPU placement declaration"
  ansible.builtin.assert:
    that:
      - >-
        (app_config.app.gpu_device | default('', true) | length == 0)
        or (app_config.app.gpu_device in (homelabinfra_config.proxmox.devices | default({}))
            and homelabinfra_config.proxmox.devices[app_config.app.gpu_device].mode == 'dedicated'
            and homelabinfra_config.proxmox.devices[app_config.app.gpu_device].kind == 'igpu')
      - >-
        (app_config.app.gpu_device | default('', true) | length > 0)
        or (app_config.app.devices | default([])
            | select('match', '^/dev/dri(?:/|$)') | list | length == 0)
    fail_msg: >-
      {{ igpu_app_display }} hardware transcoding requires app.gpu_device to name a
      dedicated iGPU declaration. /dev/dri cannot be shared from a Proxmox host into the VM.
    quiet: true
