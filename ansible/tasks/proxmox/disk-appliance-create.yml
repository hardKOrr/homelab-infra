---
# A preinstalled appliance disk has no guest-agent/SSH readiness contract.
# Inputs: appliance_vm (identity, size, storage, tags, net0/net1); result:
# _disk_appliance_config. Only an exact owned identity can resume a partial create.
- name: Disk appliance | Read cluster guest identities
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _disk_appliance_resources
  changed_when: false

- name: Disk appliance | Select the requested VMID
  ansible.builtin.set_fact:
    _disk_appliance_matches: >-
      {{ _disk_appliance_resources.stdout | from_json
         | selectattr('vmid', 'equalto', appliance_vm.vmid | int) | list }}

- name: Disk appliance | Refuse a foreign VMID or a different placement
  ansible.builtin.assert:
    that:
      - _disk_appliance_matches | length <= 1
      - >-
        _disk_appliance_matches | length == 0 or
        ((_disk_appliance_matches | first).type == 'qemu'
         and (_disk_appliance_matches | first).node == homelabinfra_config.proxmox.node
         and (_disk_appliance_matches | first).name == appliance_vm.name
         and '_+lab' in ((_disk_appliance_matches | first).tags | default('')).split(';')
         and ('_' ~ appliance_vm.name) in ((_disk_appliance_matches | first).tags | default('')).split(';')
         and not ((_disk_appliance_matches | first).template | default(false) | bool))
    fail_msg: The requested VMID is not this owned appliance on the selected node; refusing mutation.

- name: Disk appliance | Create the empty owned VM
  ansible.builtin.command:
    argv:
      - qm
      - create
      - "{{ appliance_vm.vmid | string }}"
      - --name
      - "{{ appliance_vm.name }}"
      - --cores
      - "{{ appliance_vm.cores | string }}"
      - --memory
      - "{{ appliance_vm.memory | string }}"
      - --scsihw
      - virtio-scsi-pci
      - --net0
      - "{{ appliance_vm.net0 }}"
      - --net1
      - "{{ appliance_vm.net1 }}"
      - --agent
      - '0'
      - --serial0
      - socket
      - --vga
      - serial0
      - --onboot
      - '1'
      - --tags
      - "{{ appliance_vm.tags | join(';') }}"
      - --description
      - "{{ appliance_vm.description }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _disk_appliance_matches | length == 0
  changed_when: true

- name: Disk appliance | Read the current VM configuration
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ homelabinfra_config.proxmox.node }}/qemu/{{ appliance_vm.vmid }}/config", --output-format, json]
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _disk_appliance_config_result
  changed_when: false

- name: Disk appliance | Decode the current VM configuration
  ansible.builtin.set_fact:
    _disk_appliance_config: "{{ _disk_appliance_config_result.stdout | from_json }}"

- name: Disk appliance | Verify ownership and immutable appliance wiring
  ansible.builtin.assert:
    that:
      - _disk_appliance_config.name == appliance_vm.name
      - "'_+lab' in (_disk_appliance_config.tags | default('')).split(';')"
      - "('_' ~ appliance_vm.name) in (_disk_appliance_config.tags | default('')).split(';')"
      - _disk_appliance_config.lock is not defined
      - _disk_appliance_config.cores | int == appliance_vm.cores | int
      - _disk_appliance_config.memory | int == appliance_vm.memory | int
      - _disk_appliance_config.agent | default('0') | string == '0'
      - _disk_appliance_config.onboot | default(0) | int == 1
      - _disk_appliance_config.net0.split(',')[1:] | sort == appliance_vm.net0.split(',')[1:] | sort
      - _disk_appliance_config.net1.split(',')[1:] | sort == appliance_vm.net1.split(',')[1:] | sort
      - _disk_appliance_config.net0 is match('^virtio=')
      - _disk_appliance_config.net1 is match('^virtio=')
      - _disk_appliance_config.keys() | select('match', '^hostpci') | list | length == 0
      - _disk_appliance_config.keys() | select('match', '^net[2-9]') | list | length == 0
      - _disk_appliance_config.keys() | select('match', '^unused') | list | length == 0
      - >-
        _disk_appliance_config.scsi0 is not defined or
        (_disk_appliance_config.boot | default('') == 'order=scsi0'
         and _disk_appliance_config.scsi0.split(':')[0] == appliance_vm.storage)
    fail_msg: Existing appliance configuration differs; refusing to replace disks or network wiring.
