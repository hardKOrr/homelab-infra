---
# Convert ONE Proxmox tag into the Ansible inventory group name it produces.
#
# The dynamic inventory sanitises `+`, `-` and `.` out of every group name, so a consumer
# that wants "the hosts tagged `_.stack+media-foxglove`" cannot spell the group by hand
# without re-deriving that translation — and six consumers re-deriving it is six subtly
# different regular expressions and one silent empty match. This file is the single lookup
# seam. The chain below is the same chain `compose.homelabinfra_groups` in
# inventory/proxmox.yml applies to a guest's whole tag list, differing only in its source
# term.
#
# Inputs:
#   tag_group_tag   one raw platform tag, e.g. `_+lab`, `_.stack+media`, `_sonarr-foxglove`
#
# Sets:
#   tag_group_name  the inventory group name, or '' for a tag outside the platform lane
#
# Callers look the result up as `groups[tag_group_name] | default([])`. An empty result is a
# tag this platform does not own, not an error: nothing here decides whether a group exists.

# No backslash appears below. Ansible's Jinja does not unescape string literals and stock
# Jinja does, so a capture-group replacement means different things in the two engines and
# the gate cannot judge it. Zero-width lookahead plus a literal prefix means the same thing
# in both. inventory/proxmox.yml carries the identical chain and the same constraint.

- name: Tag group | Require completed inventory
  ansible.builtin.import_tasks: assert-inventory.yml

- name: Tag group | Translate one platform tag into its inventory group name
  ansible.builtin.set_fact:
    tag_group_name: >-
      {{ (([tag_group_tag | default('', true)])
         | map('regex_replace', '^_[+]lab$', 'lab_managed')
         | map('regex_replace', '^_[-](?=.)', 'lab_fact_')
         | map('regex_replace', '^_[.]stack[+](?=.)', 'lab_stack_')
         | map('regex_replace', '^_[.]cluster[+](?=.)', 'lab_cluster_')
         | map('regex_replace', '^_[.]template$', 'lab_template')
         | map('regex_replace', '^_[.]shared$', 'lab_shared')
         | map('regex_replace', '^_(?=[0-9A-Za-z])', 'lab_app_')
         | map('regex_replace', '^(?!lab_).*$', '')
         | map('regex_replace', '[^A-Za-z0-9_]', '_')
         | reject('eq', '')
         | list
         | first | default('', true)) }}

- name: Tag group | Require owned guest identity for every matching host
  ansible.builtin.assert:
    that:
      - "'_+lab' in (hostvars[item].proxmox_tags_parsed | default([]))"
      - hostvars[item].proxmox_node | default('') | length > 0
      - hostvars[item].proxmox_vmid | default(0) | int > 0
      - hostvars[item].proxmox_vmtype | default('') in ['lxc', 'qemu']
    fail_msg: "Matching inventory host lacks established project-owned guest identity. Refusing reuse."
  loop: "{{ groups[tag_group_name] | default([]) }}"

- name: Tag group | Require unambiguous instance or stack identity
  ansible.builtin.assert:
    that:
      - groups[tag_group_name] | default([]) | length <= 1
    fail_msg: "Multiple guests match the instance or stack tag. Refusing to select an arbitrary guest."
  when: tag_group_name is match('^lab_(app|stack)_')
