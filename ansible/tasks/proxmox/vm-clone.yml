---
# Clone a Proxmox VM from a cloud-init template, apply per-VM configuration, and
# wait until it accepts commands.
#
# This is the VM counterpart to tasks/proxmox/lxc-create.yml. It exists alongside
# tasks/proxmox/vm-create.yml rather than inside it: vm-create.yml builds a blank
# VM from module parameters, which is the wrong shape for a clone (proxmox_kvm
# treats `vmid` as the SOURCE and `newid` as the target when cloning, and ignores
# most config parameters during the clone itself). Mixing the two into one task
# file made both harder to read than keeping the paths separate.
#
# Sequence — each step is a separate module call because Proxmox requires it:
#   1. clone template -> newid
#   2. update the clone with cores/memory/optional balloon/cloud-init/network
#   3. start it
#   4. wait for the guest agent, then resolve the address
#
# Inputs:
#   homelabinfra_cloud_template.{vmid,name}  — from ensure-cloud-template.yml
#   proxmox_placement_node                  — optional node selected for the local template
#   homelabinfra_config.proxmox.*            — API connection, node, vm.* settings
#   homelabinfra_config.ansible.*            — ssh_user, ssh_public_key
#   homelabinfra_instance.network.*          — from generate-ip.yml
#
# Mutates (combine recursive):
#   homelabinfra_instance.vm.*               — resolved vmid/name/ip_address
#   homelabinfra_instance.vm_ansible_host    — address later plays connect to
#   homelabinfra_instance.network.ip_address — replaced with the leased IP when DHCP

# Node names are not resolvable on their own — see the file's header. Every delegate_to
# below depends on this having run.
- name: VM clone | Resolve the optional balloon configuration
  ansible.builtin.include_tasks: resolve-vm-balloon.yml
  vars:
    proxmox_vm_balloon_memory_fallback: 2048

- name: Make Proxmox nodes addressable for delegation
  ansible.builtin.import_tasks: register-nodes.yml

- name: VM clone | Assert required inputs before placement lookup
  ansible.builtin.assert:
    that:
      - homelabinfra_cloud_template.vmid is defined
      - homelabinfra_config.ansible.ssh_public_key is defined
      - homelabinfra_config.proxmox.api_host is defined
      - homelabinfra_config.proxmox.api_token_id is defined
      - homelabinfra_config.proxmox.api_token_secret is defined
      - homelabinfra_config.proxmox.node is defined
      - homelabinfra_config.proxmox.vm.vmid is defined
      - homelabinfra_config.proxmox.vm.name is defined
    fail_msg: >-
      Required inputs: homelabinfra_cloud_template.vmid, ansible[ssh_public_key],
      proxmox[api_host,api_token_id,api_token_secret,node,vm[vmid,name]].

- name: VM clone | Validate the configured balloon minimum
  ansible.builtin.include_tasks: validate-vm-balloon.yml
  vars:
    proxmox_vm_balloon_mib: "{{ _proxmox_vm_balloon_requested }}"
    proxmox_vm_memory_mib: "{{ _proxmox_vm_memory_max_mib }}"
    proxmox_vm_guest: "{{ _proxmox_vm_balloon_guest }}"
  when: _proxmox_vm_balloon_configured | bool

- name: VM clone | Resolve the target node, connection and network settings
  ansible.builtin.import_tasks: vm-clone/target.yml

# Cloning onto an existing vmid fails, so a re-run must detect the clone it made
# last time and skip straight to the configuration update.
- name: VM clone | Check whether the target VM already exists
  ansible.builtin.command:
    cmd: "qm config {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_existing
  failed_when: false
  changed_when: false

- name: VM clone | Check node memory before cloning the VM
  ansible.builtin.include_tasks: check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ _vmc_api.node }}"
    proxmox_memory_guest: "{{ homelabinfra_config.proxmox.vm.name }}"
    proxmox_guest_memory_mib: "{{ homelabinfra_config.proxmox.vm.memory | default(2048) | int }}"
  when: _vmc_existing.rc != 0

- name: VM clone | Clone the template
  community.proxmox.proxmox_kvm:
    api_host: "{{ _vmc_api.api_host }}"
    api_port: "{{ _vmc_api.api_port }}"
    api_user: "{{ _vmc_api.api_user }}"
    api_token_id: "{{ _vmc_api.api_token_id }}"
    api_token_secret: "{{ _vmc_api.api_token_secret }}"
    validate_certs: "{{ _vmc_api.validate_certs }}"
    node: "{{ _vmc_api.node }}"
    # On a clone, `vmid` is the SOURCE template and `newid` is the VM being made.
    clone: "{{ homelabinfra_cloud_template.name }}"
    vmid: "{{ homelabinfra_cloud_template.vmid | int }}"
    newid: "{{ _vmc_vmid | int }}"
    name: "{{ homelabinfra_config.proxmox.vm.name }}"
    full: true
    storage: "{{ _guest_placement.storage | default(homelabinfra_config.proxmox.vm.storage | default(omit)) }}"
    timeout: "{{ homelabinfra_config.proxmox.vm.timeout | default(300) | int }}"
  register: _vmc_clone
  when: _vmc_existing.rc != 0

# An interrupted run can leave a clone behind before its NIC was configured. A
# stopped guest does not prove it has never booted, so do not replace its NIC/MAC
# on retry. Read back reused/no-op clones and refuse to boot a mismatched network.
- name: VM clone | Read the reused VM configuration
  ansible.builtin.command:
    cmd: "qm config {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_reused_config
  changed_when: false
  when: not (_vmc_clone.changed | default(false))

- name: VM clone | Read the reused VM status
  ansible.builtin.command:
    cmd: "qm status {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_reused_status
  changed_when: false
  when: not (_vmc_clone.changed | default(false))

- name: VM clone | Assert the reused VM network before starting
  ansible.builtin.assert:
    that:
      - _vmc_reused_net0 is match('^virtio(?:=|,|$)')
      - >-
        (_vmc_reused_net0 | regex_findall('(?:^|,)bridge=([^,]+)'))
        == (_vmc_net0 | regex_findall('(?:^|,)bridge=([^,]+)'))
      - >-
        (_vmc_reused_net0 | regex_findall('(?:^|,)tag=([0-9]+)(?:,|$)') | first | default('0') | int)
        == (_vmc_net0 | regex_findall('(?:^|,)tag=([0-9]+)(?:,|$)') | first | default('0') | int)
    fail_msg: >-
      Reused VM {{ homelabinfra_config.proxmox.vm.name }} ({{ _vmc_vmid }}) on
      {{ _vmc_api.node }} is not running and its net0 does not match the declared network.
      Actual net0={{ _vmc_reused_net0 }}; expected net0={{ _vmc_net0 }}.
      Refusing configuration and start; use the owning deployment/recovery workflow
      to reconcile this guest. Existing NIC/MAC and disks have not been replaced.
  vars:
    _vmc_reused_net0: >-
      {{ (_vmc_reused_config.stdout | regex_findall('(?m)^net0:\s*(.+)$')
          | first | default('')) | trim }}
  when:
    - not (_vmc_clone.changed | default(false))
    - "_vmc_reused_status.stdout | trim != 'status: running'"

# Boot order (slice 205) — a cloned VM is created from an explicit argument list rather
# than the create tasks' allowlist, so it resolves `startup` the same way by hand.
- name: VM clone | Resolve the boot order
  ansible.builtin.include_tasks: resolve-startup.yml
  vars:
    resolve_startup_guest: "{{ homelabinfra_config.proxmox.vm | default({}) }}"

# proxmox_kvm reports `changed` on every `update: true` call, even when it writes back the
# configuration the VM already has. Reading the config on both sides of the update is what
# lets a converged re-run report no changes.
- name: VM clone | Read the configuration before the update
  ansible.builtin.command:
    cmd: "qm config {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_config_before
  changed_when: false

# Apps record themselves on the guest after it exists (tasks/proxmox/record-app-on-guest.yml):
# a `_<instance>` tag and a marker-delimited region of the notes. Rewriting tags and notes
# from this deploy's declaration alone stripped both from every k3s node on each cluster
# Deploy, and the next app Deploy put them back. Keep the app and operator tags and the
# app region; the platform's own lanes (`_+`, `_-`, `_.`) still come only from the request.
- name: VM clone | Read the tags and notes an existing guest carries
  ansible.builtin.command:
    cmd: >-
      pvesh get /nodes/{{ _vmc_api.node }}/qemu/{{ _vmc_vmid }}/config
      --output-format json
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_existing_config
  changed_when: false
  when: _vmc_existing.rc == 0

- name: VM clone | Merge the recorded app tags and notes into the request
  vars:
    _vmc_current: "{{ (_vmc_existing_config.stdout | default('{}', true)) | from_json }}"
    _vmc_requested_tags: "{{ homelabinfra_config.proxmox.vm.tags | default(['_+lab', '_-debian']) }}"
    _vmc_kept_tags: >-
      {{ (_vmc_current.tags | default('')).split(';') | map('trim') | select
         | reject('match', '^_[+.-]') | list }}
    _vmc_current_notes: "{{ _vmc_current.description | default('') }}"
    # The separator files/proxmox/guest-app-record.py joins notes with (compose()).
    _vmc_notes_gap: "\n\n"
    _vmc_app_region: >-
      {{ ('<!-- homelab-infra:apps -->'
          ~ (_vmc_current_notes.split('<!-- homelab-infra:apps -->', 1)[1]
             .split('<!-- /homelab-infra:apps -->', 1)[0])
          ~ '<!-- /homelab-infra:apps -->')
         if '<!-- homelab-infra:apps -->' in _vmc_current_notes
            and '<!-- /homelab-infra:apps -->' in _vmc_current_notes else '' }}
  ansible.builtin.set_fact:
    _vmc_tags: "{{ (_vmc_requested_tags + _vmc_kept_tags) | unique | sort }}"
    _vmc_description: >-
      {{ (homelabinfra_config.proxmox.vm.description
          ~ (_vmc_notes_gap ~ _vmc_app_region if _vmc_app_region | length > 0 else ''))
         if homelabinfra_config.proxmox.vm.description is defined else '' }}

# A clone carries the template's sizing and no cloud-init identity, so everything
# that makes this VM itself is applied here.
- name: VM clone | Apply per-VM configuration
  community.proxmox.proxmox_kvm:
    api_host: "{{ _vmc_api.api_host }}"
    api_port: "{{ _vmc_api.api_port }}"
    api_user: "{{ _vmc_api.api_user }}"
    api_token_id: "{{ _vmc_api.api_token_id }}"
    api_token_secret: "{{ _vmc_api.api_token_secret }}"
    validate_certs: "{{ _vmc_api.validate_certs }}"
    node: "{{ _vmc_api.node }}"
    vmid: "{{ _vmc_vmid | int }}"
    update: true
    # The module drops net on safe updates, leaving the template's untagged NIC.
    # Permit NIC configuration only when this invocation actually created the clone;
    # reused guests (including a clone no-op after a race) keep their NIC/MAC. No disk
    # attachments are passed by this task, so the cloned OS/cloud-init drives stay intact.
    update_unsafe: "{{ _vmc_clone.changed | default(false) }}"
    cores: "{{ homelabinfra_config.proxmox.vm.cores | default(2) | int }}"
    # Proxmox's default CPU model is `kvm64`, a 2003-era baseline with no SSE4.2 and no
    # POPCNT — below x86-64-v2. Modern distribution images are increasingly built against
    # v2 and abort immediately on it:
    #
    #   Fatal glibc error: CPU does not support x86-64-v2
    #
    # which is what MySQL 8.4 did on the first Kubernetes app deploy, in a CrashLoopBackOff
    # whose cause was invisible from Kubernetes. Omitted by default so existing guests are
    # untouched; a caller that needs a modern baseline sets proxmox.vm.cpu.
    cpu: "{{ homelabinfra_config.proxmox.vm.cpu | default(omit) }}"
    memory: >-
      {{ _proxmox_vm_memory_max_mib | int
         if _proxmox_vm_balloon_configured | bool
         else (homelabinfra_config.proxmox.vm.memory | default(2048) | int) }}
    balloon: >-
      {{ _proxmox_vm_balloon_requested | int
         if _proxmox_vm_balloon_configured | bool else omit }}
    agent: "{{ homelabinfra_config.proxmox.vm.agent | default(1) }}"
    onboot: "{{ homelabinfra_config.proxmox.vm.onboot | default(true) }}"
    startup: "{{ _proxmox_startup if (_proxmox_startup | length > 0) else omit }}"
    tags: "{{ _vmc_tags }}"
    description: "{{ _vmc_description if _vmc_description | length > 0 else omit }}"
    ciuser: "{{ homelabinfra_config.proxmox.vm.ciuser | default(homelabinfra_config.ansible.ssh_user) }}"
    sshkeys: "{{ homelabinfra_config.ansible.ssh_public_key }}"
    net:
      net0: "{{ _vmc_net0 }}"
    ipconfig:
      ipconfig0: "{{ _vmc_ipconfig0 }}"
    nameservers: "{{ homelabinfra_instance.network.dns_servers | default(omit) }}"
    searchdomains: "{{ homelabinfra_instance.network.searchdomain | default(omit) }}"
  changed_when: false

# The configuration change, if any, is reported here rather than on the update itself.
- name: VM clone | Read the configuration after the update
  ansible.builtin.command:
    cmd: "qm config {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_config_after
  changed_when: >-
    (_vmc_config_before.stdout_lines | reject('match', '^digest:') | list)
    != (_vmc_config_after.stdout_lines | reject('match', '^digest:') | list)

- name: VM clone | Size, start and address the VM
  ansible.builtin.import_tasks: vm-clone/ready.yml
