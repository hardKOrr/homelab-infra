---
# Remove a shared device bind from an LXC guest — the recovery half of
# attach-shared-device.yml. See docs/specs/device-passthrough.md.
#
# Only the devN entries whose host path is in shared_device_list are removed, matched on
# content the same way attach-shared-device.yml attaches them, never on index. A devN
# entry this call did not write — because its host path is not in the list — is left
# exactly as it is: this platform detaches only bindings it can prove are the ones the
# caller named, never "every device on this guest".
#
# Idempotent: a device already absent is a no-op, not a failure. Detaching a guest with no
# matching device at all leaves it completely untouched.
#
# Inputs:
#   shared_device_guest — LXC guest hostname to detach from
#   shared_device_list  — [{host: /dev/dri/renderD128}, ...] — same shape as
#                         attach-shared-device.yml; only `host` is read here
#
# Runs on localhost, delegating node commands to the node itself.

- name: Detach shared device | Assert required input
  ansible.builtin.assert:
    that:
      - shared_device_guest is defined
      - shared_device_list is defined
      - shared_device_list | length > 0
    fail_msg: >-
      detach-shared-device.yml needs shared_device_guest and a non-empty
      shared_device_list.

- name: Detach shared device | List the node's containers
  ansible.builtin.command:
    cmd: "pvesh get /nodes/{{ homelabinfra_config.proxmox.node }}/lxc --output-format json"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _dsd_lxc_list
  changed_when: false

- name: Detach shared device | Extract the vmid for {{ shared_device_guest }}
  ansible.builtin.set_fact:
    _dsd_vmid: >-
      {{ (_dsd_entry | map(attribute='vmid') | list | first)
         | default('') | string }}
  vars:
    _dsd_entry: >-
      {{ _dsd_lxc_list.stdout | from_json
         | selectattr('name', 'defined')
         | selectattr('name', 'equalto', shared_device_guest) | list }}

- name: Detach shared device | Assert the guest was found
  ansible.builtin.assert:
    that: _dsd_vmid | length > 0
    fail_msg: >-
      No container named {{ shared_device_guest }} on node
      {{ homelabinfra_config.proxmox.node }}. Nothing can be detached from a guest that
      `pct list` does not show.

- name: Detach shared device | Read the guest's current configuration
  ansible.builtin.command:
    cmd: "pct config {{ _dsd_vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _dsd_config
  changed_when: false

- name: Detach shared device | Resolve which requested devices are bound, and at what index
  ansible.builtin.set_fact:
    _dsd_matched_indices: >-
      {{ _dsd_dev_lines
         | map('regex_replace', '^dev([0-9]+):\s*path=([^,]+).*$', '\1|\2')
         | select('search', '\|(' ~ (shared_device_list | map(attribute='host')
                                        | map('regex_escape') | join('|')) ~ ')$')
         | map('regex_replace', '^([0-9]+)\|.*$', '\1')
         | list }}
  vars:
    _dsd_dev_lines: >-
      {{ _dsd_config.stdout_lines | select('match', '^dev[0-9]+:') | list }}

- name: Detach shared device | Remove the matched devices
  ansible.builtin.command:
    cmd: >-
      pct set {{ _dsd_vmid }}
      -delete {{ _dsd_matched_indices | map('regex_replace', '^(.*)$', 'dev\1') | join(',') }}
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _dsd_matched_indices | length > 0
  changed_when: true

- name: Detach shared device | Report what was removed
  ansible.builtin.debug:
    msg: >-
      {{ shared_device_guest }} (vmid {{ _dsd_vmid }}):
      {{ _dsd_matched_indices | length }} device(s) detached,
      {{ shared_device_list | length - (_dsd_matched_indices | length) }} were already absent.
