---
# Attach one declared, retained PBS data volume to an owned PBS VM.
#
# Inputs: pbs_disk_vmid, pbs_disk_node, pbs_disk_guest_ip, pbs_disk_config, pbs_disk_mode,
# plus optional pbs_disk_index, pbs_disk_device and pbs_disk_serial (defaults select disk 1).
# The PVE volume is stable across guest replacement: storage:vm-<source_vmid>-disk-N.
# source_vmid is reserved for the datastore volume, not a PBS guest, so PVE guest destroy
# cannot free the retained disk. Reuse never allocates storage or overwrites a volume.

- name: PBS disk | Validate the retained volume declaration
  ansible.builtin.assert:
    that:
      - pbs_disk_mode in ['create', 'reuse']
      - pbs_disk_config.storage | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - pbs_disk_config.size_gib | default(0) | string is match('^[1-9][0-9]*$')
      - pbs_disk_vmid | string is match('^[1-9][0-9]*$')
      - pbs_disk_node | string | length > 0
      - pbs_disk_config.source_vmid is defined
      - pbs_disk_config.source_vmid | string is match('^[1-9][0-9]*$')
      - pbs_disk_config.source_vmid | int != pbs_disk_vmid | int
      - (pbs_disk_index | default(1) | int) in [1, 2]
      - (pbs_disk_device | default('scsi1')) in ['scsi1', 'scsi2']
      - >-
        (pbs_disk_device | default('scsi1'))
        == ('scsi' ~ (pbs_disk_index | default(1) | string))
      - (pbs_disk_serial | default('homelab-pbs-store')) is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    fail_msg: >-
      PBS datastore disks need image storage, positive size_gib, a stable source_vmid
      reserved for the volume, a supported SCSI slot and an owned PBS VM with a different
      VMID. Refusing to allocate or attach a guest-owned recovery volume.

- name: PBS disk | Resolve the stable storage identity
  ansible.builtin.set_fact:
    _pbs_disk_index: "{{ pbs_disk_index | default(1) | int }}"
    _pbs_disk_device: "{{ pbs_disk_device | default('scsi1') }}"
    _pbs_disk_serial: "{{ pbs_disk_serial | default('homelab-pbs-store') }}"
    _pbs_disk_source_vmid: "{{ pbs_disk_config.source_vmid | int }}"
    _pbs_disk_expected_volid: >-
      {{ pbs_disk_config.storage }}:vm-{{ pbs_disk_config.source_vmid }}-disk-{{ pbs_disk_index | default(1) | int }}

- name: PBS disk | Read target VM configuration from PVE
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pbs_disk_node }}/qemu/{{ pbs_disk_vmid }}/config"
      - --output-format
      - json
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_vm_config
  changed_when: false
  no_log: true

- name: PBS disk | Read active target VM configuration from PVE
  ansible.builtin.command:
    argv: [qm, config, "{{ pbs_disk_vmid }}", --current]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_active_config
  changed_when: false
  no_log: true

- name: PBS disk | Confirm live ownership and reject a different disk in the selected slot
  ansible.builtin.assert:
    that:
      - "'_+lab' in (_pbs_disk_config_parsed.tags | default('')).split(';')"
      - "('_' ~ instance) in (_pbs_disk_config_parsed.tags | default('')).split(';')"
      - >-
        _pbs_disk_config_parsed[_pbs_disk_device] is not defined
        or (_pbs_disk_config_parsed[_pbs_disk_device].split(',') | first)
           == _pbs_disk_expected_volid
    fail_msg: >-
      PBS datastore disk attach requires the live VM to retain _+lab and _{{ instance }}
      and {{ _pbs_disk_device }} to be empty or already reference the declared retained
      volume. No disk was attached or replaced.
  vars:
    _pbs_disk_config_parsed: "{{ _pbs_disk_vm_config.stdout | from_json }}"

- name: PBS disk | List images on the declared storage
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pbs_disk_node }}/storage/{{ pbs_disk_config.storage }}/content"
      - --content
      - images
      - --output-format
      - json
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_storage_content
  changed_when: false
  no_log: true

- name: PBS disk | Find the exact retained volume
  ansible.builtin.set_fact:
    _pbs_disk_vmid: "{{ pbs_disk_vmid }}"
    _pbs_disk_node: "{{ pbs_disk_node }}"
    _pbs_disk_volumes: >-
      {{ (_pbs_disk_storage_content.stdout | from_json)
         | selectattr('volid', 'equalto', _pbs_disk_expected_volid) | list }}
    _pbs_disk_current_config: "{{ _pbs_disk_config_parsed[_pbs_disk_device] | default('') }}"
    _pbs_disk_current_active_config: >-
      {{ _pbs_disk_active_config.stdout
         | regex_findall('(?m)^' ~ _pbs_disk_device ~ ':\s*(.+)$')
         | first | default('') | trim }}
    _pbs_disk_restart_required: >-
      {{ _pbs_disk_config_parsed[_pbs_disk_device] is defined and
         _pbs_disk_active_config.stdout is not search(
           '(?m)^' ~ _pbs_disk_device ~ ':[^\n]*,discard=on(,|$)') }}
    _pbs_disk_current: >-
      {{ (_pbs_disk_config_parsed[_pbs_disk_device] | default('')).split(',') | first }}
  vars:
    _pbs_disk_config_parsed: "{{ _pbs_disk_vm_config.stdout | from_json }}"

- name: PBS disk | Require a retained volume before reuse
  ansible.builtin.assert:
    that:
      - _pbs_disk_volumes | length <= 1
      - pbs_disk_mode != 'reuse' or _pbs_disk_volumes | length == 1
    fail_msg: >-
      The declared PBS datastore volume {{ _pbs_disk_expected_volid }} is missing or
      ambiguous. Reuse never creates a replacement disk. Keep the guest and storage
      unchanged while the volume owner is repaired.

- name: PBS disk | Read every VM reference to the retained volume
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/../../files/proxmox/pbs-datastore-volume-references.py
      {{ _pbs_disk_expected_volid | quote }}
    executable: python3
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_references
  changed_when: false
  no_log: true
  when: _pbs_disk_volumes | length == 1

- name: PBS disk | Require one exclusive writer
  ansible.builtin.assert:
    that:
      - _pbs_disk_reference_list | length <= 1
      - >-
        _pbs_disk_reference_list | length == 0
        or ((_pbs_disk_reference_list | first).vmid | int == pbs_disk_vmid | int
            and (_pbs_disk_reference_list | first).guest_type == 'qemu-server'
            and (_pbs_disk_reference_list | first).device == _pbs_disk_device)
    fail_msg: >-
      The retained PBS datastore volume is referenced by another VM or device. Refusing
      a second writer; inspect the volume owner before deploying PBS.
  vars:
    _pbs_disk_reference_list: "{{ _pbs_disk_references.stdout | default('[]') | from_json }}"
  when: _pbs_disk_volumes | length == 1

- name: PBS disk | Allocate the retained datastore volume
  ansible.builtin.command:
    argv:
      - pvesm
      - alloc
      - "{{ pbs_disk_config.storage }}"
      - "{{ _pbs_disk_source_vmid }}"
      - "vm-{{ _pbs_disk_source_vmid }}-disk-{{ _pbs_disk_index }}"
      - "{{ pbs_disk_config.size_gib | int }}G"
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_allocate
  changed_when: _pbs_disk_allocate.rc == 0
  when:
    - pbs_disk_mode == 'create'
    - _pbs_disk_volumes | length == 0
    - _pbs_disk_current | length == 0

- name: PBS disk | Read the new or retained volume after allocation
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pbs_disk_node }}/storage/{{ pbs_disk_config.storage }}/content"
      - --content
      - images
      - --output-format
      - json
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_storage_after
  changed_when: false
  no_log: true

- name: PBS disk | Verify the volume exists after allocation
  ansible.builtin.assert:
    that:
      - >-
        (_pbs_disk_storage_after.stdout | from_json)
        | selectattr('volid', 'equalto', _pbs_disk_expected_volid) | list | length == 1
    fail_msg: >-
      PVE did not expose the exact declared PBS datastore volume after attach/allocation.
      The guest was not configured to initialise another volume.

- name: PBS disk | Attach the retained volume
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ pbs_disk_vmid }}"
      - "--{{ _pbs_disk_device }}"
      - "{{ _pbs_disk_expected_volid }},backup=0,serial={{ _pbs_disk_serial }},discard=on"
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_attach
  changed_when: _pbs_disk_attach.rc == 0
  when:
    - _pbs_disk_current | length == 0

- name: PBS disk | Enable discard on the retained volume
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ pbs_disk_vmid }}"
      - "--{{ _pbs_disk_device }}"
      - >-
        {{ ((_pbs_disk_current_config.split(',') | reject('match', '^discard=') | list)
            + ['discard=on']) | join(',') }}
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_discard
  changed_when: _pbs_disk_discard.rc == 0
  when:
    - _pbs_disk_current | length > 0
    - _pbs_disk_current_config is not search('(^|,)discard=on(,|$)')

- name: PBS disk | Read back the attached disk configuration
  ansible.builtin.command:
    argv: [qm, config, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_config_after
  changed_when: false
  no_log: true

- name: PBS disk | Confirm volume, backup exclusion, guest serial and discard
  ansible.builtin.assert:
    that:
      - _pbs_disk_final | regex_search('(^|,)' ~ (_pbs_disk_expected_volid | regex_escape) ~ '(,|$)')
      - _pbs_disk_final is search('(^|,)backup=0(,|$)')
      - _pbs_disk_final is search('(^|,)serial=' ~ _pbs_disk_serial ~ '(,|$)')
      - _pbs_disk_final is search('(^|,)discard=on(,|$)')
    fail_msg: >-
      The PBS data disk did not read back with its exact retained volume identity,
      backup=0, the stable guest serial and discard=on. Refusing guest deployment.
  vars:
    _pbs_disk_final: >-
      {{ _pbs_disk_config_after.stdout
         | regex_findall('(?m)^' ~ _pbs_disk_device ~ ':\s*(.+)$')
         | first | default('') | trim }}

- name: PBS disk | Require a guest address before restarting QEMU for discard
  ansible.builtin.assert:
    that: pbs_disk_guest_ip | default('', true) | length > 0
    fail_msg: >-
      The retained PBS disk needs a QEMU restart to activate discard, but its guest
      address is unavailable. No guest restart was attempted.
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Read the current VM power state before applying discard
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_before_restart
  changed_when: false
  no_log: true
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Gracefully stop the running VM to apply discard
  ansible.builtin.command:
    argv:
      - qm
      - shutdown
      - "{{ pbs_disk_vmid }}"
      - --timeout
      - "300"
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_shutdown
  changed_when: _pbs_disk_shutdown.rc == 0
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"

- name: PBS disk | Wait for the VM to stop gracefully
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_after_shutdown
  changed_when: false
  no_log: true
  until: "'status: stopped' in _pbs_disk_status_after_shutdown.stdout"
  retries: 60
  delay: 5
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Start the VM with discard active
  ansible.builtin.command:
    argv: [qm, start, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_start
  changed_when: _pbs_disk_start.rc == 0
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"
    - "'status: stopped' in _pbs_disk_status_after_shutdown.stdout"

- name: PBS disk | Wait for the QEMU VM to start
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_after_start
  changed_when: false
  no_log: true
  until: "'status: running' in _pbs_disk_status_after_start.stdout"
  retries: 60
  delay: 5
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"

- name: PBS disk | Wait for PBS SSH after the QEMU restart
  ansible.builtin.wait_for:
    host: "{{ pbs_disk_guest_ip }}"
    port: 22
    state: started
    timeout: 600
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"
