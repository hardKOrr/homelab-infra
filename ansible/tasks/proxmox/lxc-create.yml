---
# Create a Proxmox LXC container and wait until it accepts exec.
#
# Inputs:
#   homelabinfra_config.proxmox.*      — API connection, node, and lxc.* settings
#                                        (full list in the assert below)
#   homelabinfra_instance.network.*    — from generate-ip.yml; drives netif/nameserver/
#                                        searchdomain and the DHCP lease discovery
#
# Mutates (combine recursive):
#   homelabinfra_instance.lxc.*        — module params + resolved ip_address
#   homelabinfra_instance.network.ip_address — replaced with the leased IP when DHCP

# Node names are not resolvable on their own — see the file's header. Every delegate_to
# below depends on this having run.
- name: Require completed inventory before LXC provisioning
  ansible.builtin.import_tasks: assert-inventory.yml

- name: Make Proxmox nodes addressable for delegation
  ansible.builtin.import_tasks: register-nodes.yml

- name: Preserve an existing LXC's current node
  ansible.builtin.include_tasks: preserve-existing-guest-node.yml
  vars:
    guest_existing_id: "{{ homelabinfra_config.proxmox.lxc.vmid | default('') }}"
    guest_existing_type: lxc
    guest_existing_config_key: lxc

- name: Resolve the declared placement for this LXC
  ansible.builtin.include_tasks: resolve-guest-placement.yml
  vars:
    guest_placement_class: "{{ proxmox_placement_class | default('floating_lxc') }}"
    guest_placement_devices: "{{ proxmox_placement_devices | default([]) }}"
    guest_placement_node: "{{ _existing_guest_current_node | default('', true) or proxmox_placement_node | default('') }}"
    guest_placement_storage: "{{ proxmox_placement_storage | default('') }}"
    guest_placement_use_app_config: "{{ proxmox_placement_use_app_config | default(true) | bool }}"
    guest_placement_database_backend: "{{ proxmox_placement_database_backend | default(false) | bool }}"

- name: LXC create | Build the container's module arguments
  ansible.builtin.import_tasks: lxc-create/arguments.yml

# This seam creates new guests; application/stack reuse is selected before it.
# Never let present silently become an update or pct mutate a colliding guest.
- name: Require project-owned LXC creation inputs
  ansible.builtin.assert:
    quiet: true
    that:
      - lxc_module_args.vmid | default(0, true) | int > 0
      - lxc_module_args.hostname | default('', true) | length > 0
      - "'_+lab' in (lxc_module_args.tags | default([], true))"
    fail_msg: >-
      LXC creation requires a positive VMID, a non-empty hostname and the exact
      _+lab ownership tag. Refusing creation with invalid inputs.

- name: Refuse existing identity at the LXC creation seam
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (hostvars[item].proxmox_vmid | default(0) | int) != (lxc_module_args.vmid | int)
        and (hostvars[item].proxmox_hostname | default(item)) != lxc_module_args.hostname
    fail_msg: >-
      LXC creation requires a new project-owned identity. An existing VMID or hostname
      must use the supported inventory reuse path; refusing mutation while checking
      inventory host {{ item }} against requested VMID {{ lxc_module_args.vmid }}
      and hostname {{ lxc_module_args.hostname }}.
  loop: "{{ groups['all'] | default([]) }}"

# The ostemplate sits on node-local storage (`local:vztmpl/...`), so a node that joined
# after the others has none until something downloads it. Fetch it from the Proxmox
# appliance index on the node this container lands on; a second run finds it and does
# nothing.
- name: Ensure the LXC template is on the target node
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      if pveam list "$storage" | awk '{print $1}' | grep -qxF "$storage:vztmpl/$file"; then
        echo present
        exit 0
      fi
      pveam update >/dev/null
      if ! pveam available --section system | awk '{print $2}' | grep -qxF "$file"; then
        echo "template $file is not in the Proxmox appliance index; upload it to $storage on this node" >&2
        exit 3
      fi
      pveam download "$storage" "$file"
      echo downloaded
  environment:
    storage: "{{ lxc_module_args.ostemplate.split(':', 1)[0] }}"
    file: "{{ lxc_module_args.ostemplate.split('/')[-1] }}"
  delegate_to: "{{ _guest_placement.node }}"
  register: _lxc_template_ensure
  changed_when: "'downloaded' in _lxc_template_ensure.stdout"

- name: Check node memory before creating the LXC container
  ansible.builtin.include_tasks: check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ _guest_placement.node }}"
    proxmox_memory_guest: "{{ lxc_module_args.hostname }}"
    proxmox_guest_memory_mib: "{{ lxc_module_args.memory | default(512) | int }}"

- name: Create LXC container
  community.proxmox.proxmox: "{{ lxc_module_args }}"
  register: create_lxc_result

# A resource may appear after inventory selection. update=false makes that lookup a
# no-op; stop before any delegated feature/start/metadata operation on that resource.
- name: Require a newly created LXC before node-local configuration
  ansible.builtin.assert:
    that:
      - create_lxc_result.changed | bool
    fail_msg: "LXC identity appeared after inventory selection. Refusing node-local mutation; refresh inventory and use reuse."

# Applied while the container is still STOPPED — pct refuses a feature change on a running
# container, and `present` above left it stopped, so this sits between create and start by
# necessity as well as by preference.
- name: Read the container's current feature flags
  ansible.builtin.command:
    cmd: "pct config {{ homelabinfra_instance.lxc.vmid }}"
  delegate_to: "{{ _guest_placement.node }}"
  register: _lxc_config_now
  changed_when: false

# Compared as SETS, not as strings: PVE stores the flags in its own canonical order, so
# comparing the joined text would differ from the order they were written in and re-set
# them on every run.
- name: Apply the feature flags the API could not set
  ansible.builtin.command:
    cmd: >-
      pct set {{ homelabinfra_instance.lxc.vmid }}
      --features {{ _lxc_features_desired | sort | join(',') }}
  delegate_to: "{{ _guest_placement.node }}"
  changed_when: true
  when:
    - _lxc_features_desired | length > 0
    - (_lxc_features_desired | sort) != _lxc_features_current
  vars:
    _lxc_features_current: >-
      {{ (_lxc_config_now.stdout_lines | select('match', '^features:') | list | first | default('features:'))
         | regex_replace('^features:\s*', '') | trim | split(',') | select() | sort }}

- name: LXC create | Start the container and resolve its address
  ansible.builtin.import_tasks: lxc-create/ready.yml
