---
# Create a Proxmox LXC container and wait until it accepts exec.
#
# Inputs:
#   homelabinfra_config.proxmox.*      — API connection, node, and lxc.* settings
#                                        (full list in the assert below)
#   homelabinfra_instance.network.*    — from generate-ip.yml; drives netif/nameserver/
#                                        searchdomain and the DHCP lease discovery
#
# Mutates (combine recursive per specs/namespace-merge-discipline.md):
#   homelabinfra_instance.lxc.*        — module params + resolved ip_address
#   homelabinfra_instance.network.ip_address — replaced with the leased IP when DHCP

# Node names are not resolvable on their own — see the file's header. Every delegate_to
# below depends on this having run.
- name: Make Proxmox nodes addressable for delegation
  ansible.builtin.import_tasks: register-nodes.yml

- name: Assert homelabinfra instance data is provided
  ansible.builtin.assert:
    that:
      - homelabinfra_config is defined
      - homelabinfra_config.ansible.ssh_public_key is defined
      - homelabinfra_config.proxmox.api_host is defined
      - homelabinfra_config.proxmox.api_token_id is defined
      - homelabinfra_config.proxmox.api_token_secret is defined
      - homelabinfra_config.proxmox.node is defined
      - homelabinfra_config.proxmox.lxc.vmid is defined
      - homelabinfra_config.proxmox.lxc.hostname is defined
      - homelabinfra_config.proxmox.lxc.ostemplate is defined
      - homelabinfra_config.proxmox.lxc.ip_address is defined
    fail_msg: "Required homelabinfra_config inputs: ansible[ssh_public_key], proxmox[api_host,api_token_id,api_token_secret,node,lxc[vmid,hostname,ostemplate,ip_address]]"

- name: Build facts for usage in proxmox lxc creation
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'lxc': dict(
          # 'started', not 'present': `present` creates a STOPPED container, and nothing
          # else here starts one — the "Wait for LXC to be running" below would spin for its
          # full 30 retries and then fail on every first deploy. `started` creates and starts
          # in one idempotent step, and is a no-op on a container already running.
          state = 'started',
          api_host = homelabinfra_config.proxmox.api_host,
          api_port = homelabinfra_config.proxmox.api_port,
          api_token_id = homelabinfra_config.proxmox.api_token_id,
          api_token_secret = homelabinfra_config.proxmox.api_token_secret,
          node = homelabinfra_config.proxmox.node,
          pubkey = homelabinfra_config.ansible.ssh_public_key,
          validate_certs = (homelabinfra_config.proxmox.validate_certs | default(false))
        ) | combine(homelabinfra_config.proxmox.lxc, recursive=True)}, recursive=True) }}

# Storage is a property of the LAB, not of the app: which pool holds container rootfs is
# the same answer for every guest on a node, and it cannot be guessed in a git-managed
# default — a stock Proxmox `local` carries vztmpl/iso/backup and rejects a rootfs with
# "storage 'local' does not support container directories". So app-defaults pin nothing and
# the lab-wide value, discovered and written by bootstrap-rundeck.sh, fills in here. An app
# that genuinely needs its own pool still sets proxmox.disk_volume.storage and wins.
- name: Default the rootfs storage to the lab-wide storage
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'lxc': {'disk_volume': {
           'storage': (homelabinfra_config.proxmox.storage | default('local'))
         }}}, recursive=True) }}
  when: (homelabinfra_instance.lxc.disk_volume | default({})).storage is not defined

# Deliberately its own task: keys set by one set_fact are templated against the variable
# context as it stood BEFORE the task, so a sibling key cannot reference this one. Folding
# this back into the task below reintroduces "'lxc_ip_cidr' is undefined" at the first
# guest creation.
- name: Resolve the LXC address in CIDR form
  ansible.builtin.set_fact:
    lxc_ip_cidr: >-
      {{
        'dhcp'
        if (homelabinfra_instance.network.ip_address | lower) == 'dhcp'
        else homelabinfra_instance.network.ip_address ~ '/' ~ (homelabinfra_instance.network.cidr | ansible.utils.ipaddr('prefix'))
      }}
  when: homelabinfra_instance.network is defined

- name: Build LXC network settings
  ansible.builtin.set_fact:
    lxc_netif: >-
      name=eth0,ip={{ lxc_ip_cidr }}
      {%- if homelabinfra_instance.network.gateway is defined and (homelabinfra_instance.network.ip_address | lower) != 'dhcp' -%}
      ,gw={{ homelabinfra_instance.network.gateway }}
      {%- endif -%}
      {%- if homelabinfra_instance.network.bridge is defined -%}
      ,bridge={{ homelabinfra_instance.network.bridge }}
      {%- endif -%}
      {%- if homelabinfra_instance.network.vlan is defined and (homelabinfra_instance.network.vlan | int) > 0 -%}
      ,tag={{ homelabinfra_instance.network.vlan }}
      {%- endif -%}
  when: homelabinfra_instance.network is defined

- name: Merge LXC network settings
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'lxc':
          homelabinfra_instance.lxc
          | combine(
              dict(netif=dict(net0=lxc_netif)),
              recursive=True
            )
          | combine(
              (homelabinfra_instance.network.dns_servers is defined and (homelabinfra_instance.network.dns_servers | length > 0))
              | ternary(dict(nameserver=(homelabinfra_instance.network.dns_servers | join(' '))), {}),
              recursive=True
            )
          | combine(
              homelabinfra_instance.network.searchdomain is defined
              | ternary(dict(searchdomain=homelabinfra_instance.network.searchdomain), {}),
              recursive=True
            )
        }, recursive=True) }}
  when: homelabinfra_instance.network is defined

- name: Build LXC module arguments from the community.proxmox.proxmox allowlist
  ansible.builtin.set_fact:
    lxc_module_args: >-
      {{ homelabinfra_instance.lxc | dict2items
         | selectattr('key', 'in', lxc_module_keys)
         | list
         | items2dict
         | combine({'api_user': homelabinfra_config.proxmox.api_user}) }}
  vars:
    # community.proxmox.proxmox parameters only. User/bookkeeping keys (network, ip_address)
    # are absent by design so they can never reach the module. Every key here is verified
    # against the community.proxmox 2.0.0 argument spec — see this plan's Verification step 2.
    lxc_module_keys:
      - state
      - api_host
      - api_port
      - api_user
      - api_token_id
      - api_token_secret
      # Proxmox serves a self-signed certificate out of the box, so the module's default of
      # verifying it fails every create on a stock node. The rest of the repo already assumes
      # this — inventory/proxmox.yml and every PBS task set validate_certs: false — and this
      # allowlist omitting the key was the one place that did not.
      - validate_certs
      - node
      - pubkey
      - vmid
      - hostname
      - ostemplate
      - cores
      - memory
      - tags
      - features
      - password
      - description
      - onboot
      - disk_volume
      - storage
      - netif
      - nameserver
      - searchdomain
      - swap
      - unprivileged
      - ostype
      - timezone
      - timeout
      - cpuunits
      - mounts
      - mount_volumes
      - pool
      - hookscript
      - startup

- name: Create LXC container
  community.proxmox.proxmox: "{{ lxc_module_args }}"
  register: create_lxc_result

- name: Wait for LXC to be running
  ansible.builtin.command:
    cmd: "pct status {{ homelabinfra_instance.lxc.vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: lxc_status
  retries: 30
  delay: 2
  until: "'status: running' in lxc_status.stdout"
  changed_when: false

- name: Wait for LXC to accept exec
  ansible.builtin.command:
    cmd: "pct exec {{ homelabinfra_instance.lxc.vmid }} -- /bin/true"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: lxc_exec_ready
  retries: 30
  delay: 2
  until: lxc_exec_ready.rc == 0
  changed_when: false

- name: Discover LXC DHCP lease
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ homelabinfra_instance.lxc.vmid }}"
      - --
      - /bin/sh
      - -c
      - |
        attempt=0
        while [ "$attempt" -lt 30 ]; do
          lease="$(ip -4 -o address show dev eth0 scope global | awk 'NR == 1 { sub(/\/.*/, "", $4); print $4 }')"
          if [ -n "$lease" ]; then
            printf '%s\n' "$lease"
            exit 0
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        exit 1
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: lxc_dhcp_lease
  changed_when: false
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Assert LXC DHCP lease was discovered
  ansible.builtin.assert:
    that:
      - lxc_dhcp_lease.stdout | trim | ansible.utils.ipaddr('address')
    fail_msg: "The LXC did not return a leased IPv4 address"
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Merge LXC DHCP lease into instance facts
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({
          'network': {'ip_address': lxc_dhcp_lease.stdout | trim},
          'lxc': {'ip_address': lxc_dhcp_lease.stdout | trim}
        }, recursive=True) }}
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Assert LXC connection address is resolved
  ansible.builtin.assert:
    that:
      - homelabinfra_instance.lxc.ip_address | string | trim | length > 0
      - homelabinfra_instance.lxc.ip_address | string | trim | lower != 'dhcp'
    fail_msg: "The LXC connection address is empty or still set to DHCP"

- name: Write sanitized LXC instance metadata to /root with mode 0600
  ansible.builtin.shell: |
    set -euo pipefail
    cat <<'EOF' | pct exec {{ homelabinfra_instance.lxc.vmid }} -- /bin/sh -c 'set -e; umask 077; cat > /root/homelabinfra_instance.lxc.json; chmod 0600 /root/homelabinfra_instance.lxc.json; rm -f /root/home/homelabinfra_instance.lxc.json'
    {{ homelabinfra_instance.lxc | dict2items | rejectattr('key', 'in', ['api_token_secret', 'api_token_id', 'password', 'cipassword', 'pubkey', 'sshkeys']) | list | items2dict | to_nice_json }}
    EOF
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  args:
    executable: /bin/bash
