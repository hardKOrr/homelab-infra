---
# Phase of ensure-pbs-datastore-disk.yml: enable discard on the attached retained volume,
# confirm the disk configuration, and gracefully restart a running VM so discard takes
# effect. Inputs are listed in ensure-pbs-datastore-disk.yml.

- name: PBS disk | Enable discard on the retained volume
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ pbs_disk_vmid }}"
      - "--{{ _pbs_disk_device }}"
      - >-
        {{ ((_pbs_disk_current_config.split(',') | reject('match', '^discard=') | list)
            + ['discard=on']) | join(',') }}
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_discard
  changed_when: _pbs_disk_discard.rc == 0
  when:
    - _pbs_disk_current | length > 0
    - _pbs_disk_current_config is not search('(^|,)discard=on(,|$)')

- name: PBS disk | Read back the attached disk configuration
  ansible.builtin.command:
    argv: [qm, config, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_config_after
  changed_when: false
  no_log: true

- name: PBS disk | Confirm volume, backup exclusion, guest serial and discard
  ansible.builtin.assert:
    that:
      - _pbs_disk_final | regex_search('(^|,)' ~ (_pbs_disk_expected_volid | regex_escape) ~ '(,|$)')
      - _pbs_disk_final is search('(^|,)backup=0(,|$)')
      - _pbs_disk_final is search('(^|,)serial=' ~ _pbs_disk_serial ~ '(,|$)')
      - _pbs_disk_final is search('(^|,)discard=on(,|$)')
    fail_msg: >-
      The PBS data disk did not read back with its exact retained volume identity,
      backup=0, the stable guest serial and discard=on. Refusing guest deployment.
  vars:
    _pbs_disk_final: >-
      {{ _pbs_disk_config_after.stdout
         | regex_findall('(?m)^' ~ _pbs_disk_device ~ ':\s*(.+)$')
         | first | default('') | trim }}

- name: PBS disk | Require a guest address before restarting QEMU for discard
  ansible.builtin.assert:
    that: pbs_disk_guest_ip | default('', true) | length > 0
    fail_msg: >-
      The retained PBS disk needs a QEMU restart to activate discard, but its guest
      address is unavailable. No guest restart was attempted.
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Read the current VM power state before applying discard
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_before_restart
  changed_when: false
  no_log: true
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Gracefully stop the running VM to apply discard
  ansible.builtin.command:
    argv:
      - qm
      - shutdown
      - "{{ pbs_disk_vmid }}"
      - --timeout
      - "300"
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_shutdown
  changed_when: _pbs_disk_shutdown.rc == 0
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"

- name: PBS disk | Wait for the VM to stop gracefully
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_after_shutdown
  changed_when: false
  no_log: true
  until: "'status: stopped' in _pbs_disk_status_after_shutdown.stdout"
  retries: 60
  delay: 5
  when: _pbs_disk_restart_required | bool

- name: PBS disk | Start the VM with discard active
  ansible.builtin.command:
    argv: [qm, start, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_start
  changed_when: _pbs_disk_start.rc == 0
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"
    - "'status: stopped' in _pbs_disk_status_after_shutdown.stdout"

- name: PBS disk | Wait for the QEMU VM to start
  ansible.builtin.command:
    argv: [qm, status, "{{ pbs_disk_vmid }}"]
  delegate_to: "{{ pbs_disk_node }}"
  register: _pbs_disk_status_after_start
  changed_when: false
  no_log: true
  until: "'status: running' in _pbs_disk_status_after_start.stdout"
  retries: 60
  delay: 5
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"

- name: PBS disk | Wait for PBS SSH after the QEMU restart
  ansible.builtin.wait_for:
    host: "{{ pbs_disk_guest_ip }}"
    port: 22
    state: started
    timeout: 600
  no_log: true
  when:
    - _pbs_disk_restart_required | bool
    - "'status: running' in _pbs_disk_status_before_restart.stdout"
