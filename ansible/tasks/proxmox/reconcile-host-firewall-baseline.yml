---
# Reconcile the opt-in Proxmox datacenter and host firewall baseline. Plan and arm the
# rollback here; reconcile-host-firewall-baseline/ adds and removes rules, then verifies
# access before cancelling the rollback. Behavior is described in README.md.

- name: Proxmox host firewall | Register control and peer nodes for delegation
  ansible.builtin.include_tasks:
    file: register-nodes.yml
    apply:
      no_log: true

- name: Proxmox host firewall | Read current cluster membership
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/status
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_cluster_status_read
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Save current cluster membership
  ansible.builtin.set_fact:
    _pve_fw_cluster_status: "{{ _pve_fw_cluster_status_read.stdout | from_json }}"
  no_log: true

# The first plan validates the config and obtains the live member list. No changes are
# possible until all current members, addresses and storage targets have been checked.
- name: Proxmox host firewall | Plan current cluster members
  ansible.builtin.include_tasks: plan-host-firewall-state.yml

- name: Proxmox host firewall | Save current cluster members
  ansible.builtin.set_fact:
    _pve_fw_members: "{{ _pve_fw_plan.members }}"
  no_log: true

- name: Proxmox host firewall | Read current API state
  ansible.builtin.include_tasks: read-host-firewall-state.yml

- name: Proxmox host firewall | Compare current state with the baseline
  ansible.builtin.include_tasks: plan-host-firewall-state.yml

- name: Proxmox host firewall | Save the initial reconciliation plan
  ansible.builtin.set_fact:
    _pve_fw_initial_plan: "{{ _pve_fw_plan }}"
  no_log: true

- name: Proxmox host firewall | Check for an existing rollback timer
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - homelab-infra-fw-rollback.timer
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_rollback_timer_status
  changed_when: false
  failed_when: false
  no_log: true

- name: Proxmox host firewall | Read an existing rollback action
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=ExecStart
      - --value
      - homelab-infra-fw-rollback.service
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_rollback_action
  changed_when: false
  when: _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Verify an existing rollback disables the datacenter firewall
  ansible.builtin.assert:
    that:
      - "'/cluster/firewall/options' in _pve_fw_rollback_action.stdout"
      - "'--enable 0' in _pve_fw_rollback_action.stdout"
    fail_msg: Refusing to reuse a rollback timer with an unexpected action.
  when: _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Refresh a verified rollback timer before retrying changes
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - homelab-infra-fw-rollback.timer
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  when:
    - _pve_fw_initial_plan.changed | bool
    - _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Arm the ten-minute rollback before any changes
  ansible.builtin.command:
    argv:
      - systemd-run
      - --unit=homelab-infra-fw-rollback
      - --on-active=10min
      - pvesh
      - set
      - /cluster/firewall/options
      - --enable
      - "0"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  when:
    - _pve_fw_initial_plan.changed | bool
    - _pve_fw_rollback_timer_status.rc != 0
  no_log: true

- name: Proxmox host firewall | Add the baseline, remove stale rules and enable the policy
  ansible.builtin.import_tasks: reconcile-host-firewall-baseline/apply.yml

- name: Proxmox host firewall | Verify access and cancel the rollback
  ansible.builtin.import_tasks: reconcile-host-firewall-baseline/verify.yml
