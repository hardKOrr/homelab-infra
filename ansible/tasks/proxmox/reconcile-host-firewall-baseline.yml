---
- name: Proxmox host firewall | Register control and peer nodes for delegation
  ansible.builtin.include_tasks:
    file: register-nodes.yml
    apply:
      no_log: true

- name: Proxmox host firewall | Read current cluster membership
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/status
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_cluster_status_read
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Save current cluster membership
  ansible.builtin.set_fact:
    _pve_fw_cluster_status: "{{ _pve_fw_cluster_status_read.stdout | from_json }}"
  no_log: true

# The first plan validates the config and obtains the live member list. No changes are
# possible until all current members, addresses and storage targets have been checked.
- name: Proxmox host firewall | Plan current cluster members
  ansible.builtin.include_tasks: plan-host-firewall-state.yml

- name: Proxmox host firewall | Save current cluster members
  ansible.builtin.set_fact:
    _pve_fw_members: "{{ _pve_fw_plan.members }}"
  no_log: true

- name: Proxmox host firewall | Read current API state
  ansible.builtin.include_tasks: read-host-firewall-state.yml

- name: Proxmox host firewall | Compare current state with the baseline
  ansible.builtin.include_tasks: plan-host-firewall-state.yml

- name: Proxmox host firewall | Save the initial reconciliation plan
  ansible.builtin.set_fact:
    _pve_fw_initial_plan: "{{ _pve_fw_plan }}"
  no_log: true

- name: Proxmox host firewall | Check for an existing rollback timer
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - homelab-infra-fw-rollback.timer
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_rollback_timer_status
  changed_when: false
  failed_when: false
  no_log: true

- name: Proxmox host firewall | Read an existing rollback action
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=ExecStart
      - --value
      - homelab-infra-fw-rollback.service
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_rollback_action
  changed_when: false
  when: _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Verify an existing rollback disables the datacenter firewall
  ansible.builtin.assert:
    that:
      - "'/cluster/firewall/options' in _pve_fw_rollback_action.stdout"
      - "'--enable 0' in _pve_fw_rollback_action.stdout"
    fail_msg: Refusing to reuse a rollback timer with an unexpected action.
  when: _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Refresh a verified rollback timer before retrying changes
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - homelab-infra-fw-rollback.timer
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  when:
    - _pve_fw_initial_plan.changed | bool
    - _pve_fw_rollback_timer_status.rc == 0
  no_log: true

- name: Proxmox host firewall | Arm the ten-minute rollback before any changes
  ansible.builtin.command:
    argv:
      - systemd-run
      - --unit=homelab-infra-fw-rollback
      - --on-active=10min
      - pvesh
      - set
      - /cluster/firewall/options
      - --enable
      - "0"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  when:
    - _pve_fw_initial_plan.changed | bool
    - _pve_fw_rollback_timer_status.rc != 0
  no_log: true

- name: Proxmox host firewall | Create missing datacenter rules first
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'create', '/cluster/firewall/rules',
          '--type', item.type, '--action', item.action]
         + (['--proto', item.proto] if item.proto is defined else [])
         + (['--dport', item.dport] if item.dport is defined else [])
         + (['--source', item.source] if item.source is defined else [])
         + (['--dest', item.dest] if item.dest is defined else [])
         + ['--enable', '1', '--comment', item.comment] }}
  loop: "{{ _pve_fw_initial_plan.cluster.create }}"
  loop_control:
    label: datacenter baseline rule
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  no_log: true

- name: Proxmox host firewall | Flatten missing node rules
  ansible.builtin.set_fact:
    _pve_fw_node_rules_to_create: "{{ _pve_fw_node_rules_to_create_json | from_json }}"
  vars:
    _pve_fw_node_rules_to_create_json: >-
      {%- set result = [] -%}
      {%- for node, state in _pve_fw_initial_plan.nodes.items() -%}
      {%- for rule in state.create -%}
      {%- set _ = result.append({'node': node, 'rule': rule}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ result | to_json }}
  no_log: true

- name: Proxmox host firewall | Create missing node rules first
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'create', '/nodes/' ~ item.node ~ '/firewall/rules',
          '--type', item.rule.type, '--action', item.rule.action]
         + (['--proto', item.rule.proto] if item.rule.proto is defined else [])
         + (['--dport', item.rule.dport] if item.rule.dport is defined else [])
         + (['--source', item.rule.source] if item.rule.source is defined else [])
         + (['--dest', item.rule.dest] if item.rule.dest is defined else [])
         + ['--enable', '1', '--comment', item.rule.comment] }}
  loop: "{{ _pve_fw_node_rules_to_create }}"
  loop_control:
    label: node baseline rule
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  no_log: true

- name: Proxmox host firewall | Refresh rules after adding the desired baseline
  ansible.builtin.include_tasks: read-host-firewall-state.yml
  when: _pve_fw_initial_plan.changed | bool

- name: Proxmox host firewall | Plan stale and legacy rule removal
  ansible.builtin.include_tasks: plan-host-firewall-state.yml
  when: _pve_fw_initial_plan.changed | bool

- name: Proxmox host firewall | Save the cleanup plan
  ansible.builtin.set_fact:
    _pve_fw_cleanup_plan: "{{ _pve_fw_plan }}"
  when: _pve_fw_initial_plan.changed | bool
  no_log: true

- name: Proxmox host firewall | Use the no-op plan when no rule writes are needed
  ansible.builtin.set_fact:
    _pve_fw_cleanup_plan: "{{ _pve_fw_initial_plan }}"
  when: not (_pve_fw_initial_plan.changed | bool)
  no_log: true

- name: Proxmox host firewall | Flatten stale node rules
  ansible.builtin.set_fact:
    _pve_fw_node_rules_to_delete: "{{ _pve_fw_node_rules_to_delete_json | from_json }}"
  vars:
    _pve_fw_node_rules_to_delete_json: >-
      {%- set result = [] -%}
      {%- for node, state in _pve_fw_cleanup_plan.nodes.items() -%}
      {%- for rule in state.delete -%}
      {%- set _ = result.append({'node': node, 'rule': rule}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ result | to_json }}
  no_log: true

- name: Proxmox host firewall | Remove stale datacenter baseline rules
  ansible.builtin.include_tasks: delete-host-firewall-rule.yml
  loop: "{{ _pve_fw_cleanup_plan.cluster.delete }}"
  loop_control:
    label: datacenter baseline rule
  vars:
    pve_fw_delete_path: /cluster/firewall/rules
    pve_fw_delete_rule: "{{ item }}"

- name: Proxmox host firewall | Remove stale node baseline rules
  ansible.builtin.include_tasks: delete-host-firewall-rule.yml
  loop: "{{ _pve_fw_node_rules_to_delete }}"
  loop_control:
    label: node baseline rule
  vars:
    pve_fw_delete_path: "/nodes/{{ item.node }}/firewall/rules"
    pve_fw_delete_rule: "{{ item.rule }}"

- name: Proxmox host firewall | Enable host rule processing on each node
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/nodes/{{ item.key }}/firewall/options"
      - --enable
      - "1"
  loop: "{{ _pve_fw_cleanup_plan.nodes | dict2items }}"
  loop_control:
    label: Proxmox node firewall options
  when: item.value.options_changed | bool
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  no_log: true

- name: Proxmox host firewall | Enable the datacenter policy after rules are ready
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - /cluster/firewall/options
      - --enable
      - "1"
      - --policy_in
      - DROP
      - --policy_out
      - ACCEPT
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: _pve_fw_cleanup_plan.cluster.options_changed | bool
  changed_when: true
  no_log: true

- name: Proxmox host firewall | Read back reconciled state
  ansible.builtin.include_tasks: read-host-firewall-state.yml

- name: Proxmox host firewall | Recheck cluster membership
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/status
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_final_cluster_status_read
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Save final cluster membership
  ansible.builtin.set_fact:
    _pve_fw_cluster_status: "{{ _pve_fw_final_cluster_status_read.stdout | from_json }}"
  no_log: true

- name: Proxmox host firewall | Plan and verify final API state
  ansible.builtin.include_tasks: plan-host-firewall-state.yml

- name: Proxmox host firewall | Require exact baseline readback
  ansible.builtin.assert:
    that:
      - not (_pve_fw_plan.changed | bool)
      - _pve_fw_plan.members | difference(_pve_fw_members) | length == 0
      - _pve_fw_members | difference(_pve_fw_plan.members) | length == 0
    fail_msg: Proxmox firewall API readback does not match the configured baseline.
  no_log: true

- name: Proxmox host firewall | Verify SSH access to every current node
  ansible.builtin.ping:
  loop: "{{ _pve_fw_plan.members }}"
  loop_control:
    label: Proxmox node SSH access
  delegate_to: "{{ item }}"
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Verify API access to every current node
  ansible.builtin.uri:
    url: >-
      https://{{ ('[' ~ _pve_fw_plan.node_addresses[item] ~ ']')
                  if ':' in _pve_fw_plan.node_addresses[item]
                  else _pve_fw_plan.node_addresses[item] }}:{{ homelabinfra_config.proxmox.api_port | default(8006) }}/api2/json/version
    method: GET
    headers:
      Authorization: >-
        PVEAPIToken={{ homelabinfra_config.proxmox.api_user }}!{{
          homelabinfra_config.proxmox.api_token_id }}={{
          homelabinfra_config.proxmox.api_token_secret }}
    validate_certs: "{{ homelabinfra_config.proxmox.validate_certs | default(false) | bool }}"
    status_code: 200
    return_content: false
  loop: "{{ _pve_fw_plan.members }}"
  loop_control:
    label: Proxmox node API access
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Verify NFS mounts on compute nodes
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --types
      - nfs,nfs4
  loop: "{{ _pve_fw_plan.compute_nodes }}"
  loop_control:
    label: NFS mount on compute node
  delegate_to: "{{ item }}"
  register: _pve_fw_nfs_mounts
  changed_when: false
  when: homelabinfra_config.proxmox.firewall.storage_clients | default([]) | length > 0
  no_log: true

- name: Proxmox host firewall | Require an NFS mount on each compute node
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length > 0
    fail_msg: An NFS mount is missing on a configured compute node.
  loop: "{{ _pve_fw_nfs_mounts.results | default([]) }}"
  loop_control:
    label: NFS mount verification
  when: homelabinfra_config.proxmox.firewall.storage_clients | default([]) | length > 0
  no_log: true

- name: Proxmox host firewall | Verify cluster quorum
  ansible.builtin.command:
    argv:
      - pvecm
      - status
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_quorum
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Require quorum before cancelling rollback
  ansible.builtin.assert:
    that:
      - _pve_fw_quorum.stdout | regex_search('(?im)^\s*Quorate:\s*Yes\s*$') is not none
    fail_msg: Proxmox cluster does not report quorum.
  no_log: true

- name: Proxmox host firewall | Recheck datacenter options after all health checks
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/firewall/options
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pve_fw_options_before_rollback_cancel
  changed_when: false
  no_log: true

- name: Proxmox host firewall | Keep the baseline enabled before cancelling rollback
  ansible.builtin.assert:
    that:
      - (_pve_fw_options_before_rollback_cancel.stdout | from_json).enable | int == 1
      - (_pve_fw_options_before_rollback_cancel.stdout | from_json).policy_in | upper == 'DROP'
      - (_pve_fw_options_before_rollback_cancel.stdout | from_json).policy_out | upper == 'ACCEPT'
    fail_msg: Datacenter firewall options changed during post-change verification.
  no_log: true

- name: Proxmox host firewall | Stop rollback only after access, storage and quorum pass
  ansible.builtin.command:
    argv:
      - systemctl
      - stop
      - homelab-infra-fw-rollback.timer
      - homelab-infra-fw-rollback.service
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  changed_when: true
  when:
    - _pve_fw_initial_plan.changed | bool or _pve_fw_rollback_timer_status.rc == 0
  no_log: true
