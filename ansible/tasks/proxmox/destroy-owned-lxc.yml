---
# Destroy one dedicated native LXC only after Remove App has stopped its service and
# withdrawn its instance row/tag. The caller proves the original target identity before
# unwiring; this task rechecks the live PVE config and refuses to destroy a newly shared
# guest.
- name: Register Proxmox nodes before native LXC destruction
  ansible.builtin.import_tasks: register-nodes.yml

- name: Destroy owned LXC | Validate the original guest identity
  ansible.builtin.assert:
    that:
      - destroy_lxc_vmid | int > 0
      - destroy_lxc_name | length > 0
      - destroy_lxc_node | length > 0
      - destroy_lxc_instance | length > 0
      - destroy_lxc_original_tags is sequence
      - destroy_lxc_original_tags is not string
      - "'_+lab' in destroy_lxc_original_tags"
      - "('_' ~ destroy_lxc_instance) in destroy_lxc_original_tags"
    fail_msg: >-
      Refusing to destroy the native guest because its original lab ownership or instance
      identity was not verified.

- name: Destroy owned LXC | Require a registered Proxmox connection
  ansible.builtin.assert:
    that:
      - destroy_lxc_node in (groups['proxmox_delegates'] | default([]))
      - hostvars[destroy_lxc_node].ansible_host | default('') | length > 0
    fail_msg: >-
      Refusing to destroy the native guest because its Proxmox node is not registered
      with a connection address.

- name: Destroy owned LXC | Read the live Proxmox config
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ destroy_lxc_node }}/lxc/{{ destroy_lxc_vmid }}/config"
      - --output-format
      - json
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_config
  changed_when: false

- name: Destroy owned LXC | Resolve the live tag set
  ansible.builtin.set_fact:
    _destroy_lxc_live_config: "{{ _destroy_lxc_config.stdout | from_json }}"
    _destroy_lxc_live_tags: >-
      {{ (_destroy_lxc_config.stdout | from_json).tags | default('', true)
         | split(';') | reject('equalto', '') | list }}
  no_log: true

- name: Destroy owned LXC | Require current lab ownership and an unshared guest
  ansible.builtin.assert:
    that:
      - _destroy_lxc_live_config.hostname | default('') == destroy_lxc_name
      - "'_+lab' in _destroy_lxc_live_tags"
      - "'_.shared' not in _destroy_lxc_live_tags"
      - >-
        (_destroy_lxc_live_tags | select('match', '^_[.]stack[+]') | list | length) == 0
      - >-
        (_destroy_lxc_live_tags | select('match', '^_[.]cluster[+]') | list | length) == 0
      - >-
        (_destroy_lxc_live_tags | select('match', '^_[A-Za-z0-9]')
         | reject('equalto', '_' ~ destroy_lxc_instance) | list | length) == 0
    fail_msg: >-
      Refusing to destroy the native guest: it changed identity, lost the _+lab ownership
      tag, or now carries another application's managed tag.

- name: Destroy owned LXC | Read the guest state
  ansible.builtin.command:
    argv: [pct, status, "{{ destroy_lxc_vmid }}"]
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_status_before
  changed_when: false

- name: Destroy owned LXC | Shut down the guest cleanly
  ansible.builtin.command:
    argv: [pct, shutdown, "{{ destroy_lxc_vmid }}", --timeout, "60"]
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_shutdown
  changed_when: true
  when: "_destroy_lxc_status_before.stdout is search('status: running')"

- name: Destroy owned LXC | Require the guest to be stopped
  ansible.builtin.command:
    argv: [pct, status, "{{ destroy_lxc_vmid }}"]
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_status_after
  changed_when: false

- name: Destroy owned LXC | Confirm shutdown completed
  ansible.builtin.assert:
    that:
      - _destroy_lxc_status_after.rc == 0
      - _destroy_lxc_status_after.stdout is search('status: stopped')
    fail_msg: >-
      Refusing to destroy the native guest because Proxmox did not confirm it is stopped.

- name: Destroy owned LXC | Destroy the stopped guest
  ansible.builtin.command:
    argv: [pct, destroy, "{{ destroy_lxc_vmid }}"]
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_result
  changed_when: true

- name: Destroy owned LXC | Verify the guest is absent from the cluster
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  delegate_to: "{{ destroy_lxc_node }}"
  register: _destroy_lxc_resources
  changed_when: false

- name: Destroy owned LXC | Require the VMID to be absent
  ansible.builtin.assert:
    that:
      - (_destroy_lxc_resources.stdout | from_json | type_debug) == 'list'
      - >-
        (_destroy_lxc_resources.stdout | from_json
         | selectattr('vmid', 'equalto', destroy_lxc_vmid | int) | list | length) == 0
    fail_msg: >-
      Proxmox still reports the destroyed native guest; inspect its configuration before
      deploying a replacement.

- name: Refresh the PBS backup job after destroying the LXC
  ansible.builtin.include_tasks: refresh-backup-job.yml
