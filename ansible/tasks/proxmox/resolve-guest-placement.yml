---
# Resolve the target of a new guest before the create seam and its memory preflight.
#
# Inputs:
#   guest_placement_class             — database_vm | floating_vm | floating_lxc | gpu_vm
#   guest_placement_preferred_node    — optional node for an intentionally spread member
#   guest_placement_device            — one proxmox.devices key (GPU compatibility input)
#   guest_placement_devices           — additional proxmox.devices keys for passthrough
#   guest_placement_storage            — explicit storage override
#   guest_placement_additional_storage — another store the selected node must reach
#   guest_placement_use_app_config     — false for shared hosts whose owner is not the app
#   guest_placement_database_backend   — use an explicit node/storage pin without class role maps
#
# Per-guest overrides come from the current app config or authored Proxmox config. The
# global proxmox.node remains the control node used for cluster-wide queries.

- name: Guest placement | Validate the declared class
  ansible.builtin.assert:
    that:
      - guest_placement_class in ['database_vm', 'floating_vm', 'floating_lxc', 'gpu_vm']
      - >-
        guest_placement_preferred_node is not defined
        or guest_placement_class in ['floating_vm', 'floating_lxc']
    fail_msg: Unsupported guest placement class or preferred-node request.

- name: Guest placement | Validate the declared placement role shape
  ansible.builtin.assert:
    that:
      - homelabinfra_config.proxmox.node_roles is mapping
      - homelabinfra_config.proxmox.storage_ids is mapping
      - homelabinfra_config.proxmox.node_roles.storage | default('') | string | trim | length > 0
      - homelabinfra_config.proxmox.node_roles.compute is sequence
      - homelabinfra_config.proxmox.node_roles.compute is not string
      - homelabinfra_config.proxmox.node_roles.compute | length > 0
      - >-
        (homelabinfra_config.proxmox.node_roles.compute | select('string') | list | length)
        == (homelabinfra_config.proxmox.node_roles.compute | length)
      - >-
        (homelabinfra_config.proxmox.node_roles.compute | unique | list | length)
        == (homelabinfra_config.proxmox.node_roles.compute | length)
      - >-
        homelabinfra_config.proxmox.node_roles.storage
        not in homelabinfra_config.proxmox.node_roles.compute
    fail_msg: >-
      config/proxmox.yml must declare node_roles.storage and an ordered, unique
      node_roles.compute list, and the pinned storage node must not be a compute node.
  when: not (guest_placement_database_backend | default(false) | bool)

- name: Guest placement | Require the database backend's pinned node and storage
  ansible.builtin.assert:
    that:
      - homelabinfra_config.proxmox.node | default('') | string | trim | length > 0
      - homelabinfra_config.proxmox.storage | default('') | string | trim | length > 0
    fail_msg: >-
      Database backend placement requires proxmox.node and proxmox.storage from the
      instance configuration or the lab-wide Proxmox configuration.
  when: guest_placement_database_backend | default(false) | bool

- name: Guest placement | Reset optional app placement inputs
  ansible.builtin.set_fact:
    _guest_placement_app_proxmox: {}
    _guest_placement_app_storage: ''
    _guest_placement_app_node: ''

- name: Guest placement | Load the current app's Proxmox settings
  ansible.builtin.set_fact:
    _guest_placement_app_proxmox: "{{ (app_config | default({})).get('proxmox', {}) }}"
  when: guest_placement_use_app_config | default(true) | bool

- name: Guest placement | Resolve per-guest Proxmox overrides
  ansible.builtin.set_fact:
    _guest_placement_app_storage: >-
      {{ _guest_placement_app_proxmox.get('storage', '')
         or (((_guest_placement_app_proxmox.get('disk_volume', {}).get('storage', '')
               or _guest_placement_app_proxmox.get('lxc', {}).get('disk_volume', {}).get('storage', ''))
              if guest_placement_class == 'floating_lxc'
              else _guest_placement_app_proxmox.get('vm', {}).get('storage', ''))) }}
    _guest_placement_app_node: >-
      {{ (_guest_placement_app_proxmox.get('lxc', {}).get('node', '')
          or _guest_placement_app_proxmox.get('node', ''))
         if guest_placement_class == 'floating_lxc'
         else (_guest_placement_app_proxmox.get('vm', {}).get('node', '')
               or _guest_placement_app_proxmox.get('node', '')) }}
  when: guest_placement_use_app_config | default(true) | bool

- name: Guest placement | Resolve guest type, storage and configured inputs
  ansible.builtin.set_fact:
    _guest_placement_compute_nodes: >-
      {{ homelabinfra_config.proxmox.get('node_roles', {}).get(
           'compute', [homelabinfra_config.proxmox.node]) | list }}
    _guest_placement_guest_type: >-
      {{ guest_placement_guest_type
         | default('lxc' if guest_placement_class == 'floating_lxc' else 'qemu', true) }}
    _guest_placement_storage: >-
      {{ guest_placement_storage
         | default(
             _guest_placement_app_storage | default(''),
             true)
         | default(
             ((_config_proxmox | default({})).get('proxmox', {}).get('lxc', {})
               .get('disk_volume', {}).get('storage', '')
               if guest_placement_class == 'floating_lxc'
               else (_config_proxmox | default({})).get('proxmox', {}).get('vm', {}).get('storage', '')),
             true)
         | default(
             homelabinfra_config.proxmox.get('storage_ids', {}).get(
               {'database_vm': 'database_vm', 'floating_vm': 'floating_vm',
                'floating_lxc': 'floating_lxc', 'gpu_vm': 'floating_vm'}.get(
                 guest_placement_class, ''), ''), true) }}
    _guest_placement_configured_node: >-
      {{ guest_placement_node
         | default(
             _guest_placement_app_node | default(''),
             true)
         | default(
             ((_config_proxmox | default({})).get('proxmox', {}).get('lxc', {}).get('node', '')
               if guest_placement_class == 'floating_lxc'
               else (_config_proxmox | default({})).get('proxmox', {}).get('vm', {}).get('node', '')),
             true)
         | default('', true) | string | trim }}
    _guest_placement_bridge: >-
      {{ guest_placement_bridge
         | default(homelabinfra_instance.network.bridge
                   | default(network_effective.bridge
                             | default(homelabinfra_config.networks.default.bridge, true), true), true)
         | string | trim }}
    _guest_placement_vlan: >-
      {{ guest_placement_vlan
         | default(homelabinfra_instance.network.vlan
                   | default(network_effective.vlan
                             | default(homelabinfra_config.networks.default.vlan | default(0), true), true), true)
         | default(0) | int }}

- name: Guest placement | Check the class storage, CPU model and dedicated GPU
  ansible.builtin.import_tasks: resolve-guest-placement/class.yml

- name: Guest placement | Find the nodes that reach the storage and devices
  ansible.builtin.import_tasks: resolve-guest-placement/candidates.yml

- name: Guest placement | Select the node and apply the target settings
  ansible.builtin.import_tasks: resolve-guest-placement/select.yml
