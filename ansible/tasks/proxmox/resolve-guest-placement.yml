---
# Resolve the target of a new guest before the create seam and its memory preflight.
#
# Inputs:
#   guest_placement_class             — database_vm | floating_vm | floating_lxc | gpu_vm
#   guest_placement_preferred_node    — optional node for an intentionally spread member
#   guest_placement_device            — one proxmox.devices key (GPU compatibility input)
#   guest_placement_devices           — additional proxmox.devices keys for passthrough
#   guest_placement_storage            — explicit storage override
#   guest_placement_additional_storage — another store the selected node must reach
#   guest_placement_use_app_config     — false for shared hosts whose owner is not the app
#
# Per-guest overrides come from the current app config or authored Proxmox config. The
# global proxmox.node remains the control node used for cluster-wide queries.

- name: Guest placement | Validate the declared class and role shape
  ansible.builtin.assert:
    that:
      - guest_placement_class in ['database_vm', 'floating_vm', 'floating_lxc', 'gpu_vm']
      - homelabinfra_config.proxmox.node_roles is mapping
      - homelabinfra_config.proxmox.storage_ids is mapping
      - homelabinfra_config.proxmox.node_roles.storage | default('') | string | trim | length > 0
      - homelabinfra_config.proxmox.node_roles.compute is sequence
      - homelabinfra_config.proxmox.node_roles.compute is not string
      - homelabinfra_config.proxmox.node_roles.compute | length > 0
      - >-
        (homelabinfra_config.proxmox.node_roles.compute | select('string') | list | length)
        == (homelabinfra_config.proxmox.node_roles.compute | length)
      - >-
        (homelabinfra_config.proxmox.node_roles.compute | unique | list | length)
        == (homelabinfra_config.proxmox.node_roles.compute | length)
      - >-
        homelabinfra_config.proxmox.node_roles.storage
        not in homelabinfra_config.proxmox.node_roles.compute
      - >-
        guest_placement_preferred_node is not defined
        or guest_placement_class in ['floating_vm', 'floating_lxc']
    fail_msg: >-
      config/proxmox.yml must declare node_roles.storage and an ordered, unique
      node_roles.compute list, and the pinned storage node must not be a compute node.

- name: Guest placement | Load the current app's Proxmox settings
  ansible.builtin.set_fact:
    _guest_placement_app_proxmox: "{{ (app_config | default({})).get('proxmox', {}) }}"
  when: guest_placement_use_app_config | default(true) | bool

- name: Guest placement | Resolve per-guest Proxmox overrides
  ansible.builtin.set_fact:
    _guest_placement_app_storage: >-
      {{ (_guest_placement_app_proxmox.get('disk_volume', {}).get('storage', '')
          or _guest_placement_app_proxmox.get('lxc', {}).get('disk_volume', {}).get('storage', ''))
         if guest_placement_class == 'floating_lxc'
         else _guest_placement_app_proxmox.get('vm', {}).get('storage', '') }}
    _guest_placement_app_node: >-
      {{ (_guest_placement_app_proxmox.get('lxc', {}).get('node', '')
          or _guest_placement_app_proxmox.get('node', ''))
         if guest_placement_class == 'floating_lxc'
         else (_guest_placement_app_proxmox.get('vm', {}).get('node', '')
               or _guest_placement_app_proxmox.get('node', '')) }}
  when: guest_placement_use_app_config | default(true) | bool

- name: Guest placement | Resolve guest type, storage and configured inputs
  ansible.builtin.set_fact:
    _guest_placement_compute_nodes: >-
      {{ homelabinfra_config.proxmox.node_roles.compute | list }}
    _guest_placement_guest_type: >-
      {{ guest_placement_guest_type
         | default('lxc' if guest_placement_class == 'floating_lxc' else 'qemu', true) }}
    _guest_placement_storage: >-
      {{ guest_placement_storage
         | default(
             _guest_placement_app_storage | default(''),
             true)
         | default(
             ((_config_proxmox | default({})).get('proxmox', {}).get('lxc', {})
               .get('disk_volume', {}).get('storage', '')
               if guest_placement_class == 'floating_lxc'
               else (_config_proxmox | default({})).get('proxmox', {}).get('vm', {}).get('storage', '')),
             true)
         | default(
             homelabinfra_config.proxmox.storage_ids[
               {'database_vm': 'database_vm', 'floating_vm': 'floating_vm',
                'floating_lxc': 'floating_lxc', 'gpu_vm': 'floating_vm'}[guest_placement_class]
             ], true) }}
    _guest_placement_configured_node: >-
      {{ guest_placement_node
         | default(
             _guest_placement_app_node | default(''),
             true)
         | default(
             ((_config_proxmox | default({})).get('proxmox', {}).get('lxc', {}).get('node', '')
               if guest_placement_class == 'floating_lxc'
               else (_config_proxmox | default({})).get('proxmox', {}).get('vm', {}).get('node', '')),
             true)
         | default('', true) | string | trim }}
    _guest_placement_bridge: >-
      {{ guest_placement_bridge
         | default(homelabinfra_instance.network.bridge
                   | default(network_effective.bridge
                             | default(homelabinfra_config.networks.default.bridge, true), true), true)
         | string | trim }}
    _guest_placement_vlan: >-
      {{ guest_placement_vlan
         | default(homelabinfra_instance.network.vlan
                   | default(network_effective.vlan
                             | default(homelabinfra_config.networks.default.vlan | default(0), true), true), true)
         | default(0) | int }}

- name: Guest placement | Require the class storage ID
  ansible.builtin.assert:
    that:
      - _guest_placement_storage | default('', true) | string | trim | length > 0
    fail_msg: >-
      No Proxmox storage is configured for guest class {{ guest_placement_class }}.

- name: Guest placement | Require the common migratable VM CPU model
  ansible.builtin.assert:
    that:
      - homelabinfra_config.proxmox.floating_vm_cpu_model | default('') | string | trim | length > 0
      - homelabinfra_config.proxmox.floating_vm_cpu_model | lower != 'host'
    fail_msg: >-
      config/proxmox.yml must set proxmox.floating_vm_cpu_model to one common,
      migratable model; 'host' is not allowed for floating or GPU VMs.
  when: guest_placement_class in ['floating_vm', 'gpu_vm']

- name: Guest placement | Require a dedicated declared GPU device
  ansible.builtin.assert:
    that:
      - guest_placement_device is defined
      - guest_placement_device in (homelabinfra_config.proxmox.devices | default({}))
      - _guest_gpu_declaration is mapping
      - _guest_gpu_declaration.mode == 'dedicated'
      - _guest_gpu_declaration.kind in ['igpu', 'gpu']
      - _guest_gpu_declaration.node is defined
      - _guest_gpu_declaration.node | string | trim | length > 0
      - _guest_gpu_pci_ids | length == 1
      - _guest_gpu_mapping_id is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      GPU VMs require guest_placement_device to name exactly one proxmox.devices
      declaration with mode: dedicated, kind: igpu or gpu, one exact PCI identifier,
      an explicit node, and a valid PCI resource mapping ID.
  vars:
    _guest_gpu_declaration: >-
      {{ (homelabinfra_config.proxmox.devices | default({})).get(guest_placement_device | default(''), {}) }}
    _guest_gpu_pci_ids: >-
      {{ _guest_gpu_declaration.identifiers | default([])
         | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$') | list }}
    _guest_gpu_mapping_id: >-
      {{ _guest_gpu_declaration.pci_mapping | default(guest_placement_device | default('')) }}
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Resolve the declared GPU node and mapping identity
  ansible.builtin.set_fact:
    _guest_gpu_declaration: >-
      {{ homelabinfra_config.proxmox.devices[guest_placement_device] }}
    _guest_gpu_node: >-
      {{ homelabinfra_config.proxmox.devices[guest_placement_device].node }}
    _guest_gpu_mapping_id: >-
      {{ homelabinfra_config.proxmox.devices[guest_placement_device].pci_mapping
         | default(guest_placement_device) }}
    _guest_gpu_pci_id: >-
      {{ homelabinfra_config.proxmox.devices[guest_placement_device].identifiers
         | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
         | list | first }}
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Read the Proxmox PCI resource mapping
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/cluster/mapping/pci/{{ _guest_gpu_mapping_id }}"
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _guest_gpu_mapping
  changed_when: false
  failed_when: false
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Parse the GPU PCI resource mapping
  ansible.builtin.include_tasks: parse-pci-mapping-entries.yml
  vars:
    proxmox_pci_mapping_result: "{{ _guest_gpu_mapping }}"
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Verify the PCI mapping names this device on its node
  ansible.builtin.assert:
    that:
      - _guest_gpu_mapping.rc == 0
      - _guest_gpu_map_entries | length == 1
      - _guest_gpu_map_entries[0].path == _guest_gpu_pci_id
    fail_msg: >-
      PCI resource mapping {{ _guest_gpu_mapping_id }} must map exactly
      {{ _guest_gpu_pci_id }} on the declared device node. The mapping is operator-owned;
      this task does not create or alter PCI mappings.
  vars:
    _guest_gpu_map_entries: >-
      {{ _proxmox_pci_mapping_entries
         | selectattr('node', 'equalto', _guest_gpu_node)
         | selectattr('path', 'equalto', _guest_gpu_pci_id) | list }}
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Read online Proxmox nodes and usable storage
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - "{{ item }}"
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop:
    - node
    - storage
  loop_control:
    label: "cluster {{ item }} resources"
  register: _guest_placement_resources
  changed_when: false

- name: Guest placement | Collect online node names
  ansible.builtin.set_fact:
    _guest_placement_online_nodes: >-
      {{ (_guest_placement_resources.results[0].stdout | from_json)
         | selectattr('type', 'defined')
         | selectattr('type', 'eq', 'node')
         | selectattr('status', 'defined')
         | selectattr('status', 'eq', 'online')
         | map(attribute='node') | list }}

- name: Guest placement | Require the GPU's declared node online
  ansible.builtin.assert:
    that: _guest_gpu_node in _guest_placement_online_nodes
    fail_msg: >-
      The node declared for GPU device {{ guest_placement_device }} is offline. GPU
      placement is pinned to the device node; refusing to place it elsewhere.
  when: guest_placement_class == 'gpu_vm'

- name: Guest placement | Build required storage constraints
  ansible.builtin.set_fact:
    _guest_placement_storage_requirements: >-
      {{ [{'storage': _guest_placement_storage, 'guest_type': _guest_placement_guest_type}]
         + ([{'storage': guest_placement_additional_storage,
              'guest_type': guest_placement_additional_guest_type | default('qemu')}]
            if guest_placement_additional_storage is defined
               and guest_placement_additional_storage | string | trim | length > 0
               and guest_placement_additional_storage != _guest_placement_storage
            else []) }}
    _guest_placement_storage_availability: []

- name: Guest placement | Collect each required storage's node reachability
  ansible.builtin.set_fact:
    _guest_placement_storage_availability: >-
      {{ _guest_placement_storage_availability + [{
           'storage': guest_placement_storage_requirement.storage,
           'guest_type': guest_placement_storage_requirement.guest_type,
           'nodes': (_guest_placement_resources.results[1].stdout | from_json
             | selectattr('storage', 'defined')
             | selectattr('storage', 'equalto', guest_placement_storage_requirement.storage)
             | selectattr('status', 'defined')
             | selectattr('status', 'equalto', 'available')
             | selectattr('content', 'defined')
             | selectattr('content', 'search', '(^|,)' ~ ('rootdir' if guest_placement_storage_requirement.guest_type == 'lxc' else 'images') ~ '(,|$)')
             | selectattr('node', 'in', _guest_placement_online_nodes)
             | map(attribute='node') | unique | list),
           'shared': (_guest_placement_resources.results[1].stdout | from_json
             | selectattr('storage', 'defined')
             | selectattr('storage', 'equalto', guest_placement_storage_requirement.storage)
             | selectattr('status', 'defined')
             | selectattr('status', 'equalto', 'available')
             | selectattr('content', 'defined')
             | selectattr('content', 'search', '(^|,)' ~ ('rootdir' if guest_placement_storage_requirement.guest_type == 'lxc' else 'images') ~ '(,|$)')
             | selectattr('node', 'in', _guest_placement_online_nodes)
             | selectattr('shared', 'defined')
             | selectattr('shared', 'truthy') | list | length > 0)
         }] }}
  loop: "{{ _guest_placement_storage_requirements }}"
  loop_control:
    loop_var: guest_placement_storage_requirement
    label: "{{ guest_placement_storage_requirement.storage }}"

- name: Guest placement | Require every requested storage on a compatible online node
  ansible.builtin.assert:
    that: item.nodes | length > 0
    fail_msg: >-
      Proxmox storage {{ item.storage }} is not available for
      {{ 'LXC root filesystems' if item.guest_type == 'lxc' else 'VM images' }}
      on any online node. Refusing to create the guest.
  loop: "{{ _guest_placement_storage_availability }}"
  loop_control:
    label: "{{ item.storage }}"

- name: Guest placement | Record storage node sets
  ansible.builtin.set_fact:
    _guest_placement_storage_node_sets: "{{ _guest_placement_storage_availability | map(attribute='nodes') | list }}"

- name: Guest placement | Initialize device placement constraints
  ansible.builtin.set_fact:
    _guest_placement_device_keys: >-
      {{ (([guest_placement_device]
           if guest_placement_device is defined and guest_placement_device | string | trim | length > 0
           else [])
          + (guest_placement_devices | default([]) | list)) | unique }}
    _guest_placement_device_node_sets: >-
      {{ [[_guest_gpu_node]] if guest_placement_class == 'gpu_vm' else [] }}

- name: Guest placement | Require every requested device declaration
  ansible.builtin.assert:
    that:
      - item in (homelabinfra_config.proxmox.devices | default({}))
    fail_msg: >-
      Guest placement device {{ item }} is not declared in proxmox.devices.
  loop: "{{ _guest_placement_device_keys }}"
  when: guest_placement_class != 'gpu_vm' or item != guest_placement_device

- name: Guest placement | Resolve each requested passthrough device
  ansible.builtin.include_tasks: resolve-one-guest-placement-device.yml
  loop: "{{ _guest_placement_device_keys }}"
  loop_control:
    loop_var: guest_placement_device_key
    label: "{{ guest_placement_device_key }}"
  when: guest_placement_class != 'gpu_vm' or guest_placement_device_key != guest_placement_device

- name: Guest placement | Verify a requested compute node is eligible
  ansible.builtin.assert:
    that:
      - guest_placement_preferred_node in _guest_placement_compute_nodes
      - guest_placement_preferred_node in _guest_placement_online_nodes
    fail_msg: >-
      Requested guest node is not an online member of proxmox.node_roles.compute.
      Refusing to create the guest outside the declared compute pool.
  when: guest_placement_preferred_node is defined

- name: Guest placement | Initialize single-node device pins
  ansible.builtin.set_fact:
    _guest_placement_device_pin_nodes: []

- name: Guest placement | Collect single-node device pins
  ansible.builtin.set_fact:
    _guest_placement_device_pin_nodes: >-
      {{ _guest_placement_device_pin_nodes
         + ([item[0]] if item | length == 1 else []) }}
  loop: "{{ _guest_placement_device_node_sets }}"
  loop_control:
    label: passthrough node set

- name: Guest placement | Initialize single-node storage pins
  ansible.builtin.set_fact:
    _guest_placement_storage_pin_nodes: []

- name: Guest placement | Collect single-node storage pins
  ansible.builtin.set_fact:
    _guest_placement_storage_pin_nodes: "{{ _guest_placement_storage_pin_nodes + [item.nodes[0]] }}"
  loop: "{{ _guest_placement_storage_availability }}"
  loop_control:
    label: "{{ item.storage }}"
  when: not item.shared and item.nodes | length == 1

- name: Guest placement | Collect explicit placement pins
  ansible.builtin.set_fact:
    _guest_placement_pins: >-
      {{ ([{'source': 'guest configuration', 'node': _guest_placement_configured_node}]
          if _guest_placement_configured_node | length > 0 else [])
         + ([{'source': 'requested cluster node', 'node': guest_placement_preferred_node}]
            if guest_placement_preferred_node is defined else [])
         + ([{'source': 'database node role', 'node': homelabinfra_config.proxmox.node_roles.storage}]
            if guest_placement_class == 'database_vm'
               and _guest_placement_configured_node | length == 0
               and _guest_placement_storage_pin_nodes | length == 0 else []) }}

- name: Guest placement | Add the node-local storage pins
  ansible.builtin.set_fact:
    _guest_placement_pins: "{{ _guest_placement_pins + [{'source': 'node-local storage', 'node': item}] }}"
  loop: "{{ _guest_placement_storage_pin_nodes }}"
  loop_control:
    label: storage node

- name: Guest placement | Add the passthrough device pins
  ansible.builtin.set_fact:
    _guest_placement_pins: "{{ _guest_placement_pins + [{'source': 'passthrough device', 'node': item}] }}"
  loop: "{{ _guest_placement_device_pin_nodes }}"
  loop_control:
    label: passthrough node

- name: Guest placement | Refuse conflicting node pins
  ansible.builtin.assert:
    that: _guest_placement_pins | map(attribute='node') | unique | list | length <= 1
    fail_msg: >-
      The guest's explicit node, local storage and passthrough device point to different
      Proxmox nodes. Correct the guest configuration before creating it.

- name: Guest placement | Choose the online candidate pool
  ansible.builtin.set_fact:
    _guest_placement_base_nodes: >-
      {{ [_guest_placement_pins | map(attribute='node') | list | first]
         if _guest_placement_pins | length > 0
         else _guest_placement_compute_nodes }}
    _guest_placement_device_nodes: >-
      {{ _guest_placement_online_nodes if _guest_placement_device_node_sets | length == 0
         else (_guest_placement_device_node_sets | first) }}

- name: Guest placement | Intersect multiple device node sets
  ansible.builtin.set_fact:
    _guest_placement_device_nodes: "{{ _guest_placement_device_nodes | select('in', item) | list }}"
  loop: "{{ _guest_placement_device_node_sets[1:] }}"

- name: Guest placement | Filter nodes by online status and devices
  ansible.builtin.set_fact:
    _guest_placement_storage_device_nodes: >-
      {{ _guest_placement_base_nodes
         | select('in', _guest_placement_online_nodes)
         | select('in', _guest_placement_device_nodes) | list }}

- name: Guest placement | Intersect every required storage's node set
  ansible.builtin.set_fact:
    _guest_placement_storage_device_nodes: >-
      {{ _guest_placement_storage_device_nodes | select('in', item) | list }}
  loop: "{{ _guest_placement_storage_node_sets }}"
  loop_control:
    label: required storage nodes

- name: Guest placement | Require a node with the requested storage and devices
  ansible.builtin.assert:
    that: _guest_placement_storage_device_nodes | length > 0
    fail_msg: >-
      No online node satisfies the guest's pinned node, passthrough devices and all
      required storage. Refusing to create the guest elsewhere.

- name: Guest placement | Read candidate node networks
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ item }}/network"
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _guest_placement_storage_device_nodes }}"
  loop_control:
    label: "{{ item }} network"
  register: _guest_placement_network_results
  changed_when: false
  failed_when: false

- name: Guest placement | Initialize bridge-compatible nodes
  ansible.builtin.set_fact:
    _guest_placement_network_nodes: []

- name: Guest placement | Check each candidate bridge and VLAN
  ansible.builtin.include_tasks: check-guest-placement-network.yml
  loop: "{{ _guest_placement_network_results.results }}"
  loop_control:
    loop_var: guest_placement_network_result
    label: "{{ guest_placement_network_result.item }}"
  when:
    - guest_placement_network_result.rc == 0
    - _guest_placement_bridge | length > 0

- name: Guest placement | Require the requested bridge on an eligible node
  ansible.builtin.assert:
    that: _guest_placement_network_nodes | default([]) | length > 0
    fail_msg: >-
      No online storage-compatible node has the active guest bridge
      {{ _guest_placement_bridge | default('(unset)') }}. Refusing to create the guest
      without its declared network.

- name: Guest placement | Read available memory on eligible nodes
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ item }}/status"
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop: "{{ _guest_placement_network_nodes }}"
  loop_control:
    label: "{{ item }} memory"
  register: _guest_placement_memory_results
  changed_when: false

- name: Guest placement | Build available-memory ranking
  ansible.builtin.set_fact:
    _guest_placement_memory_candidates: >-
      {{ _guest_placement_memory_candidates | default([])
         + [{'node': item.item,
             'available_bytes': ((item.stdout | from_json).memory.available
               | default((item.stdout | from_json).memory.total
                         - (item.stdout | from_json).memory.used, true) | int)}] }}
  loop: "{{ _guest_placement_memory_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Guest placement | Select the node with the most available memory
  ansible.builtin.set_fact:
    _guest_placement:
      class: "{{ guest_placement_class }}"
      node: "{{ (_guest_placement_memory_candidates
                 | sort(attribute='available_bytes', reverse=true) | first).node }}"
      storage: "{{ _guest_placement_storage }}"
      guest_type: "{{ _guest_placement_guest_type }}"
      cpu_model: >-
        {{ homelabinfra_config.proxmox.floating_vm_cpu_model
           if guest_placement_class in ['floating_vm', 'gpu_vm'] else '' }}
      device: "{{ guest_placement_device if guest_placement_class == 'gpu_vm' else '' }}"
      pci_mapping: "{{ _guest_gpu_mapping_id if guest_placement_class == 'gpu_vm' else '' }}"
      pci_id: "{{ _guest_gpu_pci_id if guest_placement_class == 'gpu_vm' else '' }}"
      available_memory_bytes: "{{ (_guest_placement_memory_candidates
                                    | sort(attribute='available_bytes', reverse=true) | first).available_bytes }}"

- name: Guest placement | Apply VM target settings
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config | combine({'proxmox': {
           'node': _guest_placement.node
         }}, recursive=True) }}
  when: _guest_placement_guest_type == 'qemu'

- name: Guest placement | Apply the common floating VM CPU model
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config | combine({'proxmox': {'vm': {
           'cpu': _guest_placement.cpu_model
         }}}, recursive=True) }}
  when: guest_placement_class in ['floating_vm', 'gpu_vm']

- name: Guest placement | Apply LXC target settings
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config | combine({'proxmox': {
           'node': _guest_placement.node
         }}, recursive=True) }}
  when: _guest_placement_guest_type == 'lxc'
