---
# Phase of vm-clone.yml: keep an existing VM on its live node or resolve a new placement,
# then build the API connection, NIC and cloud-init settings the clone and its update use.
# Inputs and outputs are listed in vm-clone.yml.

- name: VM clone | Read cluster resources to preserve an existing guest's node
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _vmc_cluster_resources
  changed_when: false

- name: VM clone | Find the requested VMID in cluster resources
  ansible.builtin.set_fact:
    _vmc_existing_resources: >-
      {{ _vmc_cluster_resources.stdout | from_json
         | selectattr('vmid', 'defined')
         | selectattr('vmid', 'equalto', homelabinfra_config.proxmox.vm.vmid | int)
         | list }}

- name: VM clone | Refuse a VMID already owned by another guest type
  ansible.builtin.assert:
    that:
      - _vmc_existing_resources | length <= 1
      - _vmc_existing_resources | length == 0 or _vmc_existing_resources[0].type == 'qemu'
    fail_msg: >-
      VMID {{ homelabinfra_config.proxmox.vm.vmid }} already belongs to a different
      Proxmox guest or has ambiguous cluster state. Refusing to create or update it.

- name: VM clone | Set the existing guest resource
  ansible.builtin.set_fact:
    _vmc_existing_guest: "{{ _vmc_existing_resources | first | default({}) }}"

- name: VM clone | Require the existing guest's Proxmox node
  ansible.builtin.assert:
    that:
      - _vmc_existing_guest.node | default('') | string | trim | length > 0
    fail_msg: >-
      Existing VM {{ homelabinfra_config.proxmox.vm.vmid }} has no node in Proxmox
      cluster resources. Refusing to resolve a new placement for it.
  when: _vmc_existing_guest | length > 0

- name: VM clone | Keep an existing guest on its current node
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config
         | combine({'proxmox': {'node': _vmc_existing_guest.node}}, recursive=True) }}
  when: _vmc_existing_guest | length > 0

- name: Resolve the declared placement for this cloned VM
  ansible.builtin.include_tasks: ../resolve-guest-placement.yml
  vars:
    guest_placement_class: "{{ proxmox_placement_class | default('floating_vm') }}"
    guest_placement_device: "{{ proxmox_placement_device | default('') }}"
    guest_placement_devices: "{{ proxmox_placement_devices | default([]) }}"
    guest_placement_node: "{{ proxmox_placement_node | default('') }}"
    guest_placement_storage: "{{ proxmox_placement_storage | default('') }}"
    guest_placement_database_backend: "{{ proxmox_placement_database_backend | default(false) | bool }}"
    guest_placement_use_app_config: "{{ proxmox_placement_use_app_config | default(true) | bool }}"
  when: _vmc_existing_guest | length == 0

# validate_certs is part of the connection, not an afterthought: Proxmox serves a
# self-signed certificate out of the box, so the module's default of verifying it fails
# every call with
#
#   SSLError(SSLCertVerificationError(1, '[SSL: CERTIFICATE_VERIFY_FAILED] ...
#   unable to get local issuer certificate'))
#
# The rest of the repo already assumes this — inventory/proxmox.yml sets it, and slice
# 012's blocker 8 added it to the lxc-create and vm-create module allowlists. This file
# was missed by that fix because it builds its module arguments by hand instead of
# filtering them through an allowlist, so there was no list to add the key to.
- name: VM clone | Set connection facts
  ansible.builtin.set_fact:
    _vmc_api:
      api_host: "{{ homelabinfra_config.proxmox.api_host }}"
      api_port: "{{ homelabinfra_config.proxmox.api_port | default(8006) }}"
      api_user: "{{ homelabinfra_config.proxmox.api_user }}"
      api_token_id: "{{ homelabinfra_config.proxmox.api_token_id }}"
      api_token_secret: "{{ homelabinfra_config.proxmox.api_token_secret }}"
      validate_certs: "{{ homelabinfra_config.proxmox.validate_certs | default(false) }}"
      node: >-
        {{ _vmc_existing_guest.node
           if _vmc_existing_guest | length > 0
           else (_guest_placement.node | default(homelabinfra_config.proxmox.node)) }}
    _vmc_vmid: "{{ homelabinfra_config.proxmox.vm.vmid | int }}"

- name: VM clone | Build network settings
  ansible.builtin.set_fact:
    _vmc_ip_cidr: >-
      {{
        'dhcp'
        if (homelabinfra_instance.network.ip_address | lower) == 'dhcp'
        else homelabinfra_instance.network.ip_address ~ '/'
             ~ (homelabinfra_instance.network.cidr | ansible.utils.ipaddr('prefix'))
      }}
    _vmc_net0: >-
      virtio
      {%- if homelabinfra_instance.network.bridge is defined -%}
      ,bridge={{ homelabinfra_instance.network.bridge }}
      {%- endif -%}
      {%- if homelabinfra_instance.network.vlan is defined and (homelabinfra_instance.network.vlan | int) > 0 -%}
      ,tag={{ homelabinfra_instance.network.vlan }}
      {%- endif -%}

- name: VM clone | Build the cloud-init IP configuration
  ansible.builtin.set_fact:
    _vmc_ipconfig0: >-
      ip={{ _vmc_ip_cidr }}
      {%- if homelabinfra_instance.network.gateway is defined and _vmc_ip_cidr != 'dhcp' -%}
      ,gw={{ homelabinfra_instance.network.gateway }}
      {%- endif -%}
