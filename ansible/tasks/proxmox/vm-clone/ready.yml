---
# Phase of vm-clone.yml: grow the disk, start the VM, wait until it answers, resolve its
# address, reconcile its HA resource and refresh the PBS backup job. Inputs and outputs
# are listed in vm-clone.yml.

# Proxmox writes sizes as an integer with an optional K/M/G/T suffix, e.g. `size=200G`.
# An unparsable size reads as 0, which falls back to issuing the resize.
- name: VM clone | Read the current disk size
  ansible.builtin.set_fact:
    _vmc_disk_bytes: >-
      {{ (_vmc_disk_size_parts[0] | int)
         * {'': 1, 'K': 1024, 'M': 1024 ** 2, 'G': 1024 ** 3, 'T': 1024 ** 4}[_vmc_disk_size_parts[1]] }}
  vars:
    _vmc_disk_size_parts: >-
      {{ _vmc_config_after.stdout
         | regex_search('(?m)^scsi0:.*[,\s]size=([0-9]+)([KMGT]?)', '\1', '\2')
         | default(['0', ''], true) }}
  when: homelabinfra_config.proxmox.vm.disk_size is defined

# A disk already at or above the requested size is the normal re-run case. Running
# `qm resize` to the current size exits 0 on some storages, which would report a change
# that did not happen, so it is skipped rather than issued.
- name: VM clone | Resize the disk
  ansible.builtin.command:
    cmd: >-
      qm resize {{ _vmc_vmid }} scsi0
      {{ homelabinfra_config.proxmox.vm.disk_size }}G
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_resize
  # Shrinking is refused by Proxmox; kept for a size the parse above misread.
  failed_when:
    - _vmc_resize.rc != 0
    - "'not supported' not in _vmc_resize.stderr"
    - "'shrink' not in _vmc_resize.stderr | lower"
  changed_when: _vmc_resize.rc == 0
  when:
    - homelabinfra_config.proxmox.vm.disk_size is defined
    - (_vmc_disk_bytes | int) < (homelabinfra_config.proxmox.vm.disk_size | int) * 1024 ** 3

- name: VM clone | Check node memory before starting the VM
  ansible.builtin.include_tasks: ../check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ _vmc_api.node }}"
    proxmox_memory_guest: "{{ homelabinfra_config.proxmox.vm.name }}"
    proxmox_guest_memory_mib: "{{ homelabinfra_config.proxmox.vm.memory | default(2048) | int }}"
  when: >-
    (_vmc_clone.changed | default(false))
    or (_vmc_reused_status.stdout | default('') | trim != 'status: running')

# Node-local `qm start` rather than the module's `state: started`: the module resolves the
# guest through the eventually-consistent /cluster/resources cache and reads its name
# unconditionally, which fails on a guest cloned seconds earlier. Same reasoning, same shape
# and same node as lxc-create/ready.yml — see the longer note there.
- name: VM clone | Start the VM
  ansible.builtin.command:
    cmd: "qm start {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_start
  changed_when: _vmc_start.rc == 0
  failed_when:
    - _vmc_start.rc != 0
    - "'already running' not in (_vmc_start.stderr | default('')) | lower"
  when: >-
    (_vmc_clone.changed | default(false))
    or (_vmc_reused_status.stdout | default('') | trim != 'status: running')

- name: VM clone | Wait for the VM to be running
  ansible.builtin.command:
    cmd: "qm status {{ _vmc_vmid }}"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_status
  retries: 30
  delay: 2
  until: "'status: running' in _vmc_status.stdout"
  changed_when: false

# Only the DHCP path needs the agent, and only to read back the lease. A stock Debian
# genericcloud image does NOT ship qemu-guest-agent — `qm guest exec` answers "QEMU guest
# agent is not running" forever — so waiting for it unconditionally spent 60 retries and
# then failed a VM that was up and correctly addressed. `agent: 1` in the VM config only
# adds the virtio device; it does not put the daemon in the image.
#
# tasks/guest-bootstrap.yml installs qemu-guest-agent on every VM it bootstraps, so the
# agent does arrive — just later than this point, on the first Ansible pass over the guest.
- name: VM clone | Wait for the guest agent to accept exec
  ansible.builtin.command:
    cmd: "qm guest exec {{ _vmc_vmid }} -- /bin/true"
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_agent
  retries: 60
  delay: 5
  until: _vmc_agent.rc == 0
  changed_when: false
  when: (homelabinfra_instance.network.ip_address | lower) == 'dhcp'

# The static path knows its own address, so readiness means SSH, which is what the next
# play connects with anyway. cloud-init installs the platform key during first boot.
- name: VM clone | Wait for SSH on the configured address
  ansible.builtin.wait_for:
    host: "{{ homelabinfra_instance.network.ip_address }}"
    port: 22
    timeout: 300
    sleep: 5
    msg: >-
      SSH readiness timed out after 300 seconds for VM
      {{ homelabinfra_config.proxmox.vm.name }} ({{ _vmc_vmid }}) on {{ _vmc_api.node }}
      at {{ homelabinfra_instance.network.ip_address }}:22.
      Expected net0={{ _vmc_net0 }}; ipconfig0={{ _vmc_ipconfig0 }}.
      Proxmox reported running, but guest SSH readiness failed; deployment cannot continue.
  when: (homelabinfra_instance.network.ip_address | lower) != 'dhcp'

- name: VM clone | Discover the DHCP lease
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ _vmc_vmid }}"
      - --synchronous
      - "1"
      - --timeout
      - "70"
      - --
      - /bin/sh
      - -c
      - |
        attempt=0
        while [ "$attempt" -lt 30 ]; do
          interface="$(ip -4 route show default | awk 'NR == 1 { for (i = 1; i <= NF; i++) if ($i == "dev") { print $(i + 1); exit } }')"
          if [ -n "$interface" ]; then
            lease="$(ip -4 -o address show dev "$interface" scope global | awk 'NR == 1 { sub(/\/.*/, "", $4); print $4 }')"
          else
            lease="$(ip -4 -o address show scope global | awk 'NR == 1 { sub(/\/.*/, "", $4); print $4 }')"
          fi
          if [ -n "$lease" ]; then
            printf '%s\n' "$lease"
            exit 0
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        exit 1
  delegate_to: "{{ _vmc_api.node }}"
  register: _vmc_lease
  changed_when: false
  when: (homelabinfra_instance.network.ip_address | lower) == 'dhcp'

- name: VM clone | Parse the DHCP lease result
  ansible.builtin.set_fact:
    _vmc_lease_result: "{{ _vmc_lease.stdout | from_json }}"
  when: (homelabinfra_instance.network.ip_address | lower) == 'dhcp'

- name: VM clone | Assert the DHCP lease was discovered
  ansible.builtin.assert:
    that:
      - _vmc_lease_result.exited | default(false) | bool
      - _vmc_lease_result.exitcode | default(1) | int == 0
      - _vmc_lease_result['out-data'] | default('') | trim | ansible.utils.ipaddr('address')
    fail_msg: "The VM guest agent did not return a leased IPv4 address"
  when: (homelabinfra_instance.network.ip_address | lower) == 'dhcp'

- name: VM clone | Merge the resolved address into instance facts
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({
          'network': {'ip_address': _vmc_resolved_ip},
          'vm': {
            'vmid': _vmc_vmid | int,
            'name': homelabinfra_config.proxmox.vm.name,
            'ip_address': _vmc_resolved_ip
          },
          'vm_ansible_host': _vmc_resolved_ip
        }, recursive=True) }}
  vars:
    _vmc_resolved_ip: >-
      {{ (_vmc_lease_result['out-data'] | trim)
         if (homelabinfra_instance.network.ip_address | lower) == 'dhcp'
         else homelabinfra_instance.network.ip_address }}

- name: VM clone | Assert the connection address is resolved
  ansible.builtin.assert:
    that:
      - homelabinfra_instance.vm_ansible_host | string | trim | length > 0
      - homelabinfra_instance.vm_ansible_host | string | trim | lower != 'dhcp'
    fail_msg: "The VM connection address is empty or still set to DHCP"

- name: VM clone | Reconcile the guest's optional HA resource
  ansible.builtin.include_tasks: ../reconcile-vm-ha.yml
  vars:
    proxmox_ha_node: "{{ _vmc_api.node }}"
    proxmox_ha_vmid: "{{ _vmc_vmid }}"
    proxmox_ha_name: "{{ homelabinfra_config.proxmox.vm.name }}"
    proxmox_ha_enabled: "{{ homelabinfra_config.proxmox.vm.ha | default(false) }}"

- name: Refresh the PBS backup job after creating the VM clone
  ansible.builtin.include_tasks: ../refresh-backup-job.yml
