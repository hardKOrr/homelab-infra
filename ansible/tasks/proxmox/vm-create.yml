---

# Node names are not resolvable on their own — see the file's header. Every delegate_to
# below depends on this having run.
- name: Make Proxmox nodes addressable for delegation
  ansible.builtin.import_tasks: register-nodes.yml

- name: Preserve an existing VM's current node
  ansible.builtin.include_tasks: preserve-existing-guest-node.yml
  vars:
    guest_existing_id: "{{ homelabinfra_config.proxmox.vm.vmid | default('') }}"
    guest_existing_type: qemu
    guest_existing_config_key: vm

- name: Resolve the declared placement for this VM
  ansible.builtin.include_tasks: resolve-guest-placement.yml
  vars:
    guest_placement_class: "{{ proxmox_placement_class | default('floating_vm') }}"
    guest_placement_device: "{{ proxmox_placement_device | default('') }}"
    guest_placement_devices: "{{ proxmox_placement_devices | default([]) }}"
    guest_placement_node: "{{ _existing_guest_current_node | default('') }}"

- name: Assert homelabinfra instance data is provided
  ansible.builtin.assert:
    that:
      - homelabinfra_config is defined
      - homelabinfra_config.proxmox.api_host is defined
      - homelabinfra_config.proxmox.api_token_id is defined
      - homelabinfra_config.proxmox.api_token_secret is defined
      - homelabinfra_config.proxmox.node is defined
      - homelabinfra_config.proxmox.vm.vmid is defined
      - homelabinfra_config.proxmox.vm.name is defined
      - homelabinfra_config.proxmox.vm.ansible_host is defined or homelabinfra_config.proxmox.vm.ip_address is defined
    fail_msg: "Required homelabinfra_config inputs: proxmox[api_host,api_token_id,api_token_secret,node,vm[vmid,name,ansible_host|ip_address]]"

- name: Validate the configured VM balloon minimum
  ansible.builtin.include_tasks: validate-vm-balloon.yml
  vars:
    proxmox_vm_balloon_mib: "{{ homelabinfra_config.proxmox.vm.balloon }}"
    proxmox_vm_memory_mib: "{{ homelabinfra_config.proxmox.vm.memory | default(512) }}"
    proxmox_vm_guest: "{{ homelabinfra_config.proxmox.vm.name }}"
  when: homelabinfra_config.proxmox.vm.balloon is defined

- name: Build facts for usage in proxmox vm creation
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({
          'vm': dict(
            state = 'present',
            api_host = homelabinfra_config.proxmox.api_host,
            api_port = homelabinfra_config.proxmox.api_port,
            api_token_id = homelabinfra_config.proxmox.api_token_id,
            api_token_secret = homelabinfra_config.proxmox.api_token_secret,
            node = homelabinfra_config.proxmox.node,
            sshkeys = homelabinfra_config.ansible.ssh_public_key,
            validate_certs = (homelabinfra_config.proxmox.validate_certs | default(false)),
            ciuser = homelabinfra_config.proxmox.vm.ciuser | default(homelabinfra_config.ansible.ssh_user)
          ) | combine(homelabinfra_config.proxmox.vm, recursive=True),
          'vm_ansible_host': (
            homelabinfra_config.proxmox.vm.ip_address
            if (homelabinfra_config.proxmox.vm.ansible_host | default('') | string | trim | lower) in ['', 'dhcp']
            else homelabinfra_config.proxmox.vm.ansible_host
          )
        }, recursive=True) }}

# Placement resolves the effective storage (an explicit VM pool or the class default).
# Keep it on this guest instance instead of writing it back into shared config facts.
- name: Apply the selected VM disk storage
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'vm': {
           'storage': _guest_placement.storage
         }}, recursive=True) }}

# Deliberately its own task: keys set by one set_fact are templated against the variable
# context as it stood BEFORE the task, so a sibling key cannot reference this one. Folding
# this back into the task below reintroduces "'vm_ip_cidr' is undefined" at the first
# VM creation — the same defect that stopped the first live LXC create.
- name: Resolve the VM address in CIDR form
  ansible.builtin.set_fact:
    vm_ip_cidr: >-
      {{
        'dhcp'
        if (homelabinfra_instance.network.ip_address | lower) == 'dhcp'
        else homelabinfra_instance.network.ip_address ~ '/' ~ (homelabinfra_instance.network.cidr | ansible.utils.ipaddr('prefix'))
      }}
  when: homelabinfra_instance.network is defined

- name: Build VM network settings
  ansible.builtin.set_fact:
    vm_net0: >-
      virtio
      {%- if homelabinfra_instance.network.bridge is defined -%}
      ,bridge={{ homelabinfra_instance.network.bridge }}
      {%- endif -%}
      {%- if homelabinfra_instance.network.vlan is defined and (homelabinfra_instance.network.vlan | int) > 0 -%}
      ,tag={{ homelabinfra_instance.network.vlan }}
      {%- endif -%}
    vm_ipconfig0: >-
      ip={{ vm_ip_cidr }}
      {%- if homelabinfra_instance.network.gateway is defined and (homelabinfra_instance.network.ip_address | lower) != 'dhcp' -%}
      ,gw={{ homelabinfra_instance.network.gateway }}
      {%- endif -%}
  when: homelabinfra_instance.network is defined

- name: Merge VM network settings
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'vm':
          homelabinfra_instance.vm
          | combine(
              dict(net=dict(net0=vm_net0), ipconfig=dict(ipconfig0=vm_ipconfig0)),
              recursive=True
            )
          | combine(
              (homelabinfra_instance.network.dns_servers is defined and (homelabinfra_instance.network.dns_servers | length > 0))
              | ternary(dict(nameservers=homelabinfra_instance.network.dns_servers), {}),
              recursive=True
            )
          | combine(
              homelabinfra_instance.network.searchdomain is defined
              | ternary(dict(searchdomains=homelabinfra_instance.network.searchdomain), {}),
              recursive=True
            )
        }, recursive=True) }}
  when: homelabinfra_instance.network is defined

# Boot order (slice 205) — same reasoning and same seam as lxc-create.yml.
- name: Resolve the VM's boot order
  ansible.builtin.include_tasks: resolve-startup.yml
  vars:
    resolve_startup_guest: "{{ homelabinfra_instance.vm }}"

- name: Apply the resolved boot order
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({'vm': {'startup': _proxmox_startup}}, recursive=True) }}
  when: _proxmox_startup | length > 0

- name: Build VM module arguments from the community.proxmox.proxmox_kvm allowlist
  ansible.builtin.set_fact:
    vm_module_args: >-
      {{ homelabinfra_instance.vm | dict2items
         | selectattr('key', 'in', vm_module_keys)
         | list
         | items2dict
         | combine({
             'api_user': homelabinfra_config.proxmox.api_user,
             'node': _guest_placement.node
           }) }}
  vars:
    # community.proxmox.proxmox_kvm parameters only. User/bookkeeping keys (network, ip_address,
    # ansible_host) are absent by design. vm_ansible_host is a sibling of .vm (not inside it), so
    # it is untouched. Every key here is verified against the 2.0.0 spec — see Verification step 2.
    vm_module_keys:
      - state
      - api_host
      - api_port
      - api_user
      - api_token_id
      - api_token_secret
      # See the note in lxc-create.yml: Proxmox is self-signed by default, and the module
      # verifies unless told otherwise.
      - validate_certs
      - node
      - sshkeys
      - ciuser
      - vmid
      - name
      - agent
      - onboot
      - autostart
      - description
      - tags
      - net
      - ipconfig
      - nameservers
      - searchdomains
      - cores
      - memory
      - sockets
      - vcpus
      - cpu
      - ostype
      - scsihw
      - boot
      - bootdisk
      - balloon
      - bios
      - machine
      - ide
      - sata
      - scsi
      - virtio
      - efidisk0
      - vga
      - serial
      - cipassword
      - cicustom
      - citype
      - ciupgrade
      - storage
      - pool
      - kvm
      - numa_enabled
      - hotplug
      - startup
      - timeout

- name: Read the target VM status before creation
  ansible.builtin.command:
    cmd: "qm status {{ homelabinfra_instance.vm.vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _vm_create_status
  failed_when: false
  changed_when: false

- name: Check node memory before creating the VM
  ansible.builtin.include_tasks: check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ homelabinfra_config.proxmox.node }}"
    proxmox_memory_guest: "{{ homelabinfra_instance.vm.name }}"
    proxmox_guest_memory_mib: "{{ vm_module_args.memory | default(512) | int }}"
  when: >-
    _vm_create_status.stdout | default('') | trim != 'status: running'

- name: Create VM
  community.proxmox.proxmox_kvm: "{{ vm_module_args }}"
  register: create_vm_result

- name: Check node memory before starting the VM
  ansible.builtin.include_tasks: check-node-free-memory.yml
  vars:
    proxmox_memory_node: "{{ homelabinfra_config.proxmox.node }}"
    proxmox_memory_guest: "{{ homelabinfra_instance.vm.name }}"
    proxmox_guest_memory_mib: "{{ vm_module_args.memory | default(512) | int }}"
  when: >-
    _vm_create_status.stdout | default('') | trim != 'status: running'

# `present` above created the VM stopped, exactly as it does for LXC in lxc-create.yml, and
# nothing else here starts it — without this the wait below spins its full 30 retries and
# fails on every first create.
#
# Node-local `qm start` rather than the module's `state: started`: the module resolves the
# guest through the eventually-consistent /cluster/resources cache and reads its name
# unconditionally, which fails on a guest created seconds earlier. Same reasoning, same
# shape and same node as lxc-create.yml — see the longer note there.
- name: Start the VM
  ansible.builtin.command:
    cmd: "qm start {{ homelabinfra_instance.vm.vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: vm_start
  changed_when: vm_start.rc == 0
  failed_when:
    - vm_start.rc != 0
    - "'already running' not in (vm_start.stderr | default('')) | lower"

- name: Wait for VM to be running
  ansible.builtin.command:
    cmd: "qm status {{ homelabinfra_instance.vm.vmid }}"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: vm_status
  retries: 30
  delay: 2
  until: "'status: running' in vm_status.stdout"
  changed_when: false

- name: Wait for VM guest agent to accept exec
  ansible.builtin.command:
    cmd: "qm guest exec {{ homelabinfra_instance.vm.vmid }} -- /bin/true"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: vm_guest_exec_ready
  retries: 30
  delay: 2
  until: vm_guest_exec_ready.rc == 0
  changed_when: false

- name: Discover VM DHCP lease
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ homelabinfra_instance.vm.vmid }}"
      - --synchronous
      - "1"
      - --timeout
      - "70"
      - --
      - /bin/sh
      - -c
      - |
        attempt=0
        while [ "$attempt" -lt 30 ]; do
          interface="$(ip -4 route show default | awk 'NR == 1 { for (i = 1; i <= NF; i++) if ($i == "dev") { print $(i + 1); exit } }')"
          if [ -n "$interface" ]; then
            lease="$(ip -4 -o address show dev "$interface" scope global | awk 'NR == 1 { sub(/\/.*/, "", $4); print $4 }')"
          else
            lease="$(ip -4 -o address show scope global | awk 'NR == 1 { sub(/\/.*/, "", $4); print $4 }')"
          fi
          if [ -n "$lease" ]; then
            printf '%s\n' "$lease"
            exit 0
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        exit 1
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: vm_dhcp_lease
  changed_when: false
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Parse VM DHCP lease result
  ansible.builtin.set_fact:
    vm_dhcp_lease_result: "{{ vm_dhcp_lease.stdout | from_json }}"
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Assert VM DHCP lease was discovered
  ansible.builtin.assert:
    that:
      - vm_dhcp_lease_result.exited | default(false) | bool
      - vm_dhcp_lease_result.exitcode | default(1) | int == 0
      - vm_dhcp_lease_result['out-data'] | default('') | trim | ansible.utils.ipaddr('address')
    fail_msg: "The VM guest agent did not return a leased IPv4 address"
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Merge VM DHCP lease into instance facts
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | combine({
          'network': {'ip_address': vm_dhcp_lease_result['out-data'] | trim},
          'vm': {'ip_address': vm_dhcp_lease_result['out-data'] | trim},
          'vm_ansible_host': (
            vm_dhcp_lease_result['out-data'] | trim
            if (homelabinfra_instance.vm_ansible_host | default('') | string | trim | lower) in ['', 'dhcp']
            else homelabinfra_instance.vm_ansible_host
          )
        }, recursive=True) }}
  when: homelabinfra_instance.network.ip_address | lower == 'dhcp'

- name: Assert VM connection address is resolved
  ansible.builtin.assert:
    that:
      - homelabinfra_instance.vm_ansible_host | string | trim | length > 0
      - homelabinfra_instance.vm_ansible_host | string | trim | lower != 'dhcp'
    fail_msg: "The VM connection address is empty or still set to DHCP"

- name: Write sanitized VM instance metadata to /root with mode 0600
  ansible.builtin.shell: |
    set -euo pipefail
    cat <<'EOF' | qm guest exec {{ homelabinfra_instance.vm.vmid }} --pass-stdin 1 --synchronous 1 --timeout 30 -- /bin/sh -c 'set -e; umask 077; cat > /root/homelabinfra_instance.vm.json; chmod 0600 /root/homelabinfra_instance.vm.json; rm -f /root/home/homelabinfra_instance.vm.json'
    {{ homelabinfra_instance.vm | dict2items | rejectattr('key', 'in', ['api_token_secret', 'api_token_id', 'password', 'cipassword', 'pubkey', 'sshkeys']) | list | items2dict | to_nice_json }}
    EOF
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: vm_instance_metadata_write
  args:
    executable: /bin/bash

- name: Assert VM instance metadata was written
  ansible.builtin.assert:
    that:
      - vm_instance_metadata_write_result.exited | default(false) | bool
      - vm_instance_metadata_write_result.exitcode | default(1) | int == 0
    fail_msg: "The VM guest agent failed to write protected instance metadata"
  vars:
    vm_instance_metadata_write_result: "{{ vm_instance_metadata_write.stdout | from_json }}"
