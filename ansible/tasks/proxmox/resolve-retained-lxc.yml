# Resolve the exact lab-owned native LXC left behind when Remove withdraws an
# application's instance tag. This is a reuse selector, not an allocation fallback.
#
# Inputs:
#   retained_lxc_name — exact Proxmox guest name whose instance tag was withdrawn
#
# Outputs:
#   retained_lxc_hosts — zero or one inventory host; non-LXC, claimed or ambiguous
#                        identities fail closed.

- name: Retained LXC | Require completed inventory
  ansible.builtin.import_tasks: assert-inventory.yml

- name: Retained LXC | Start with no selected identity
  ansible.builtin.set_fact:
    _retained_lxc_named_hosts: []
  changed_when: false

- name: Retained LXC | Collect exact lab-owned guest names
  ansible.builtin.set_fact:
    _retained_lxc_named_hosts: "{{ _retained_lxc_named_hosts + [item] }}"
  loop: "{{ groups['lab_managed'] | default([]) }}"
  when: hostvars[item].proxmox_name | default('') == retained_lxc_name
  changed_when: false

- name: Retained LXC | Refuse ambiguous exact names
  ansible.builtin.assert:
    quiet: true
    that:
      - _retained_lxc_named_hosts | length <= 1
    fail_msg: >-
      Multiple lab-owned guests have the exact retained identity {{ retained_lxc_name }}.
      Refusing to select an arbitrary guest.

- name: Retained LXC | Require an unclaimed native LXC identity
  ansible.builtin.assert:
    quiet: true
    that:
      - hostvars[_retained_lxc_named_hosts[0]].proxmox_vmtype | default('') == 'lxc'
      - hostvars[_retained_lxc_named_hosts[0]].proxmox_vmid | default(0) | int > 0
      - hostvars[_retained_lxc_named_hosts[0]].proxmox_node | default('') | length > 0
      - "'_+lab' in (hostvars[_retained_lxc_named_hosts[0]].proxmox_tags_parsed | default([]))"
      - >-
        (hostvars[_retained_lxc_named_hosts[0]].proxmox_tags_parsed | default([])
         | select('match', '^_[A-Za-z0-9]|^_[.]') | list | length) == 0
    fail_msg: >-
      The exact retained identity {{ retained_lxc_name }} is not an unclaimed,
      lab-owned native LXC. Refusing reuse.
  when: _retained_lxc_named_hosts | length == 1

- name: Retained LXC | Publish the selected identity
  ansible.builtin.set_fact:
    retained_lxc_hosts: "{{ _retained_lxc_named_hosts }}"
  changed_when: false
