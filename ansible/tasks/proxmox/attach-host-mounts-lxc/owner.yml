---
# Phase of attach-host-mounts-lxc.yml: when attach_mounts_owner is given, ensure its group
# and user exist on the node and let root map that id into a container.

# ── Who owns this storage ─────────────────────────────────────────────────────
# An unprivileged container maps its whole id range into the host's 100000+ block,
# so a host uid below that is not representable inside the guest at all: the
# library shows up owned by nobody:nogroup and every app that tries to write to it
# is refused. Radarr said so exactly — `Folder '/mnt/data/media/movies' is not
# writable by user 'abc'` (execution 57, 2026-08-09) — on a directory that was
# perfectly present and perfectly mounted.
#
# The fix is an identity that means the same thing on both sides of the boundary:
# one account, one uid, owning the storage on the node, mapped straight through to
# the same number inside the guest. The account is the platform's own rather than
# a borrowed one, because a borrowed uid belongs to somebody — this library was
# owned by an unrelated file-server account of a domain being decommissioned,
# purely because both defaulted to 1000.
- name: Host mounts | Ensure the storage owner's group exists on the node
  ansible.builtin.group:
    name: "{{ attach_mounts_owner.user }}"
    gid: "{{ attach_mounts_owner.gid }}"
    system: true
    state: present
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: attach_mounts_owner | default({}) | length > 0

- name: Host mounts | Ensure the storage owner exists on the node
  ansible.builtin.user:
    name: "{{ attach_mounts_owner.user }}"
    uid: "{{ attach_mounts_owner.uid }}"
    group: "{{ attach_mounts_owner.user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    state: present
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  when: attach_mounts_owner | default({}) | length > 0

# Root may only delegate ids it has been granted. Without these two lines the
# idmap below is refused and the container will not start at all.
- name: Host mounts | Grant root the right to map that id into a container
  ansible.builtin.lineinfile:
    path: "/etc/{{ item.file }}"
    line: "root:{{ item.id }}:1"
    regexp: "^root:{{ item.id }}:1$"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  loop:
    - { file: subuid, id: "{{ attach_mounts_owner.uid | default(0) }}" }
    - { file: subgid, id: "{{ attach_mounts_owner.gid | default(0) }}" }
  loop_control:
    label: "/etc/{{ item.file }} root:{{ item.id }}:1"
  when: attach_mounts_owner | default({}) | length > 0
