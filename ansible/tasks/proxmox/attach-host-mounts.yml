---
# Route existing host directories to the guest type discovered by Proxmox inventory.
# Docker stack hosts are VMs; the LXC implementation remains for native callers.

- name: Host mounts | Resolve the Proxmox guest type
  ansible.builtin.set_fact:
    _attach_mounts_guest_type: "{{ hostvars[attach_mounts_guest].proxmox_vmtype | default('') }}"

- name: Host mounts | Require a known guest type
  ansible.builtin.assert:
    that: _attach_mounts_guest_type in ['lxc', 'qemu']
    fail_msg: >-
      Cannot resolve the Proxmox guest type for {{ attach_mounts_guest }}. The host-mount
      seam only modifies guests present in the Proxmox inventory.

- name: Host mounts | Attach directories to an LXC
  ansible.builtin.include_tasks: attach-host-mounts-lxc.yml
  when: _attach_mounts_guest_type == 'lxc'

- name: Host mounts | Attach directories to a VM with virtiofs
  ansible.builtin.include_tasks: attach-host-mounts-vm.yml
  when: _attach_mounts_guest_type == 'qemu'
