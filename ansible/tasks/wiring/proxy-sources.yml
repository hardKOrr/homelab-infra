---
# Resolve the addresses the platform reverse proxy's requests come from, for an app that
# trusts X-Forwarded-Proto only from its proxy. Caddy on a guest connects from its own
# address (reverse_proxy.host). Caddy on Kubernetes is published on the ingress VIP, but
# its requests leave from whichever cluster node runs the pod, so every node counts.
# Sets: wiring_proxy_sources, a list of IP addresses (empty without a reverse proxy).
- name: Proxy sources | Resolve the reverse proxy's source addresses
  ansible.builtin.set_fact:
    wiring_proxy_sources: >-
      {{ ([_wps_host] if _wps_host | length > 0 else [])
         + ((homelabinfra_infra.kubernetes | default({})).nodes | default([])
            | map(attribute='ip_address') | list
            if _wps_host | length > 0
               and _wps_host == (homelabinfra_infra.kubernetes | default({})).ingress_vip | default('')
            else []) }}
  vars:
    _wps_host: "{{ homelabinfra_infra.reverse_proxy.host | default('', true) | urlsplit('hostname') | default('', true) }}"
