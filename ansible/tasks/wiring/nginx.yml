---
# Register an app proxy host with Nginx Proxy Manager via its REST API.
# Inverse: tasks/unwiring/nginx.yml. Spec: .claude/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:       app instance name (used only in messages)
#   wiring_upstream_host:  IP or hostname of the app container
#   wiring_upstream_port:  port the app listens on
#   wiring_domain:         full domain (e.g. radarr-4k.homelab.example.com) — the
#                          proxy host is identified by this domain, not by name
#   wiring_identity_mode:  catalog | oidc | forward_auth | none (default: catalog).
#                          Only `forward_auth` changes this file's output.
#
# forward_auth mode (slice 306). NPM has no Authentik integration of its own, so the
# enforcement lives in the proxy host's advanced_config: Authentik's documented nginx
# snippet — an `auth_request` against the outpost's /outpost.goauthentik.io/auth/nginx,
# a 401 handler that redirects to the outpost's sign-in start, and auth_request_set
# lines that lift the X-Authentik-* response headers onto the upstream request. The
# snippet's `location /` replaces NPM's own generated one, so it carries the
# proxy_pass to the app; NPM keeps serving the certificate and the domain matching.
# Every other identity mode leaves advanced_config empty, exactly as before.
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   reverse_proxy.host              — full base URL including scheme (e.g. http://192.168.1.11)
#   reverse_proxy.port              — NPM admin/API port (default 81)
#   reverse_proxy.token             — optional pre-issued NPM JWT; skips the login round-trip
#   reverse_proxy.admin_user        — NPM admin email (used when no token is present)
#   reverse_proxy.admin_password    — NPM admin password
#   reverse_proxy.letsencrypt_email — optional; when set, new proxy hosts request a
#                                     Let's Encrypt certificate (certificate_id: new) and
#                                     force SSL. Requires the NPM host to be reachable
#                                     from the internet on port 80 for the HTTP-01
#                                     challenge — omit it for internal-only labs and the
#                                     route is created HTTP-only (certificate_id: 0).
#
# Idempotent: the proxy host is matched by domain; identical managed fields → no change;
# drift → PUT; absent → POST. An existing certificate_id is preserved on update so a
# re-wire never re-issues a certificate. Silent no-op when the configured reverse proxy
# provider is not nginx.
#
# Authenticated requests carry no_log (they hold the JWT, per .claude/specs/secrets-handling.md);
# each is followed by an explicit status assert so failures stay diagnosable.

- name: Wire Nginx | Register proxy host
  when: homelabinfra_infra.reverse_proxy.provider | default('none') == 'nginx'
  vars:
    _npm_api: >-
      {{ homelabinfra_infra.reverse_proxy.host }}:{{
         homelabinfra_infra.reverse_proxy.port | default(81) }}/api
    _npm_le_email: "{{ homelabinfra_infra.reverse_proxy.letsencrypt_email | default('') }}"

    _npm_forward_auth: >-
      {{ (wiring_identity_mode | default('catalog')) == 'forward_auth'
         and (homelabinfra_infra.sso.provider | default('none')) == 'authentik' }}
    _npm_outpost: "{{ homelabinfra_infra.sso.host | default('') }}"

    # Authentik's documented nginx forward-auth snippet, rendered for this app.
    # Kept inline rather than in a template file so this task stays self-contained
    # wherever it is included from. nginx variables ($host, $auth_cookie, …) are
    # literal here — only the {{ }} expressions are Ansible's.
    _npm_forward_auth_config: |
      location /outpost.goauthentik.io {
          proxy_pass              {{ _npm_outpost }}/outpost.goauthentik.io;
          proxy_set_header        Host $host;
          proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
          add_header              Set-Cookie $auth_cookie;
          auth_request_set        $auth_cookie $upstream_http_set_cookie;
          proxy_pass_request_body off;
          proxy_set_header        Content-Length "";
      }

      location / {
          auth_request     /outpost.goauthentik.io/auth/nginx;
          error_page       401 = @goauthentik_proxy_signin;
          auth_request_set $auth_cookie $upstream_http_set_cookie;
          add_header       Set-Cookie $auth_cookie;

          auth_request_set $authentik_username $upstream_http_x_authentik_username;
          auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
          auth_request_set $authentik_email $upstream_http_x_authentik_email;
          auth_request_set $authentik_name $upstream_http_x_authentik_name;
          auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
          proxy_set_header X-authentik-username $authentik_username;
          proxy_set_header X-authentik-groups $authentik_groups;
          proxy_set_header X-authentik-email $authentik_email;
          proxy_set_header X-authentik-name $authentik_name;
          proxy_set_header X-authentik-uid $authentik_uid;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_pass http://{{ wiring_upstream_host }}:{{ wiring_upstream_port }};
      }

      location @goauthentik_proxy_signin {
          internal;
          add_header Set-Cookie $auth_cookie;
          return 302 /outpost.goauthentik.io/start?rd=$request_uri;
      }
    _npm_advanced_config: "{{ _npm_forward_auth_config if _npm_forward_auth | bool else '' }}"
  block:
    - name: Wire Nginx | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_app_name is defined and wiring_app_name | length > 0
          - wiring_upstream_host is defined and wiring_upstream_host | length > 0
          - wiring_upstream_port is defined and wiring_upstream_port | string | length > 0
          - wiring_domain is defined and wiring_domain | length > 0
        fail_msg: >-
          wiring/nginx.yml needs the wiring contract vars: wiring_app_name,
          wiring_upstream_host, wiring_upstream_port, wiring_domain.

    - name: Wire Nginx | Assert NPM credentials are available
      ansible.builtin.assert:
        that:
          - >-
            homelabinfra_infra.reverse_proxy.token | default('') | length > 0
            or (homelabinfra_infra.reverse_proxy.admin_user | default('') | length > 0
                and homelabinfra_infra.reverse_proxy.admin_password | default('') | length > 0)
        fail_msg: >-
          Nginx Proxy Manager wiring needs reverse_proxy.token, or
          reverse_proxy.admin_user + reverse_proxy.admin_password, in
          config/.generated/facts.yml.

    # Same reasoning as the Caddy path: a forward_auth app with no known outpost
    # would be published with an auth_request pointing at nothing.
    - name: Wire Nginx | Assert the outpost is known for forward_auth apps
      ansible.builtin.assert:
        that:
          - _npm_outpost | length > 0
        fail_msg: >-
          {{ wiring_app_name }} declares routing.identity: forward_auth, but
          sso.host is missing from config/.generated/facts.yml — Nginx Proxy Manager
          has no Authentik outpost to enforce against. Deploy Authentik first, or set
          routing.identity to catalog.
      when: _npm_forward_auth | bool

    - name: Wire Nginx | Mint API token
      ansible.builtin.uri:
        url: "{{ _npm_api }}/tokens"
        method: POST
        body_format: json
        body:
          identity: "{{ homelabinfra_infra.reverse_proxy.admin_user }}"
          secret: "{{ homelabinfra_infra.reverse_proxy.admin_password }}"
        status_code: 200
      register: _npm_login
      when: homelabinfra_infra.reverse_proxy.token | default('') | length == 0
      no_log: true

    - name: Wire Nginx | Select API token
      ansible.builtin.set_fact:
        _npm_token: >-
          {{ homelabinfra_infra.reverse_proxy.token
             | default(_npm_login.json.token | default(''), true) }}
      no_log: true

    - name: Wire Nginx | List existing proxy hosts
      ansible.builtin.uri:
        url: "{{ _npm_api }}/nginx/proxy-hosts"
        method: GET
        headers:
          Authorization: "Bearer {{ _npm_token }}"
        status_code: 200
        return_content: true
      register: _npm_hosts
      no_log: true

    - name: Wire Nginx | Locate proxy host for this domain
      ansible.builtin.set_fact:
        _npm_existing: >-
          {{ (_npm_hosts.json | default([]))
             | selectattr('domain_names', 'contains', wiring_domain)
             | list | first | default({}) }}

    # Built as one dict expression, not a YAML mapping of per-key templates: only the
    # outer template is rendered, so ints and bools reach the JSON body as ints and
    # bools (.claude/specs/jinja-string-typing.md).
    # certificate_id reuses whatever is already attached to this proxy host; only a
    # brand new host asks NPM to issue one, and only when a LE email is configured.
    - name: Wire Nginx | Build desired proxy host payload
      ansible.builtin.set_fact:
        _npm_payload: >-
          {{ {
               'domain_names': [wiring_domain],
               'forward_scheme': 'http',
               'forward_host': wiring_upstream_host,
               'forward_port': wiring_upstream_port | int,
               'access_list_id': 0,
               'certificate_id': _npm_existing.certificate_id
                                 | default('new' if _npm_le_email | length > 0 else 0, true),
               'ssl_forced': _npm_le_email | length > 0,
               'http2_support': true,
               'hsts_enabled': false,
               'hsts_subdomains': false,
               'block_exploits': true,
               'caching_enabled': false,
               'allow_websocket_upgrade': true,
               'advanced_config': _npm_advanced_config,
               'locations': [],
               'enabled': true,
               'meta': {'letsencrypt_agree': true, 'letsencrypt_email': _npm_le_email,
                        'dns_challenge': false}
                       if (_npm_le_email | length > 0
                           and _npm_existing.certificate_id is not defined)
                       else {},
             } }}

    - name: Wire Nginx | Create proxy host
      ansible.builtin.uri:
        url: "{{ _npm_api }}/nginx/proxy-hosts"
        method: POST
        headers:
          Authorization: "Bearer {{ _npm_token }}"
        body_format: json
        body: "{{ _npm_payload }}"
        status_code: [200, 201]
      register: _npm_create
      when: _npm_existing.id is not defined
      changed_when: _npm_existing.id is not defined
      no_log: true

    - name: Wire Nginx | Update drifted proxy host
      ansible.builtin.uri:
        url: "{{ _npm_api }}/nginx/proxy-hosts/{{ _npm_existing.id | default(0) }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _npm_token }}"
        body_format: json
        body: "{{ _npm_payload }}"
        status_code: 200
      register: _npm_update
      when:
        - _npm_existing.id is defined
        - >-
          _npm_existing.forward_host | default('') != wiring_upstream_host
          or _npm_existing.forward_port | default(0) | int != wiring_upstream_port | int
          or _npm_existing.forward_scheme | default('') != 'http'
          or not (_npm_existing.enabled | default(false))
          or _npm_existing.advanced_config | default('') != _npm_advanced_config
      changed_when: true
      no_log: true

    - name: Wire Nginx | Verify proxy host request succeeded
      ansible.builtin.assert:
        that:
          - _npm_create is skipped or _npm_create.status in [200, 201]
          - _npm_update is skipped or _npm_update.status == 200
        fail_msg: >-
          Nginx Proxy Manager rejected the proxy host for {{ wiring_domain }}
          (create status {{ _npm_create.status | default('skipped') }},
          update status {{ _npm_update.status | default('skipped') }}).

    - name: Wire Nginx | Verify proxy host is present
      ansible.builtin.uri:
        url: "{{ _npm_api }}/nginx/proxy-hosts"
        method: GET
        headers:
          Authorization: "Bearer {{ _npm_token }}"
        status_code: 200
      register: _npm_verify
      no_log: true

    - name: Wire Nginx | Assert proxy host is routable
      ansible.builtin.assert:
        that:
          - >-
            (_npm_verify.json | default([]))
            | selectattr('domain_names', 'contains', wiring_domain)
            | list | length > 0
        fail_msg: "No Nginx Proxy Manager proxy host serves {{ wiring_domain }} after wiring."
