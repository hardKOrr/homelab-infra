---
# Register an app monitor in Uptime Kuma over socket.io.
# Inverse: tasks/unwiring/uptime-kuma.yml. Spec: docs/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:     app instance name — becomes the monitor's friendly name
#   wiring_monitor_url:  URL to monitor (the public reverse-proxy route)
#   wiring_interval:     check interval in seconds (default 60, minimum 20)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   monitoring.provider        — uptime_kuma | none
#   monitoring.host            — full base URL including scheme
#   monitoring.admin_user      — admin username, overlaid from Vaultwarden
#   monitoring.admin_password  — admin password, overlaid from Vaultwarden
#   monitoring.notification_id — optional; falls back to a lookup by channel name
#
# TRANSPORT — socket.io, not REST. Uptime Kuma has no REST monitor API in ANY version;
# `GET /api/monitors` answers 200 text/html because its Vue front end is served from a
# catch-all route, so the REST implementation this file used to hold was probing a web
# page and passing against an instance with no database at all. Monitors are socket.io
# events, reached over engine.io long polling with plain `uri` calls — see
# tasks/kuma/call.yml. No Python socket.io client is involved; avoiding that dependency
# is why slice 303 exists in this shape.
#
# AUTHENTICATION — the admin credentials, not monitoring.token. An Uptime Kuma REST API
# key authorises /metrics and the badge endpoints; it cannot sign a socket in, and it
# cannot touch a monitor.
#
# DEGRADATION — an Uptime Kuma that is unreachable, still on its setup screen, or holding
# different credentials produces a warning and a skipped monitor. Monitoring is an add-on
# and must never be the thing that fails an app deploy (slice 303 acceptance item 5).
# An Uptime Kuma that is signed in and then REFUSES the monitor is the opposite case and
# does fail: that is a defect in this file's payload, not a property of the lab, and the
# lesson of 2026-08-08 is that silently swallowing it costs five days.
#
# Idempotent: monitor located by friendly name; absent → add, drifted → editMonitor,
# identical → no change. Silent no-op when the configured monitoring provider is not
# uptime_kuma.

- name: Wire Uptime Kuma | Register monitor
  when:
    - homelabinfra_infra.monitoring is defined
    - homelabinfra_infra.monitoring.provider | default('none') == 'uptime_kuma'
  block:
    - name: Wire Uptime Kuma | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_app_name is defined and wiring_app_name | length > 0
          - wiring_monitor_url is defined and wiring_monitor_url | length > 0
        fail_msg: >-
          wiring/uptime-kuma.yml needs wiring_app_name and wiring_monitor_url.

    # first_found, not a relative path: Ansible resolves a relative include_vars against
    # the CALLING PLAYBOOK's directory, and this file is included from playbooks at two
    # different depths (tasks/load-user-vars.yml carries the full account of that trap).
    - name: Wire Uptime Kuma | Load the Uptime Kuma object names
      ansible.builtin.include_vars:
        file: >-
          {{ lookup('ansible.builtin.first_found', {
               'files': ['uptime-kuma.yml'],
               'paths': [playbook_dir ~ '/../vars',
                         playbook_dir ~ '/../../vars',
                         playbook_dir ~ '/../../../vars']
             }) }}

    - name: Wire Uptime Kuma | Record what the registry supplies
      ansible.builtin.set_fact:
        _kuma_credentialed: >-
          {{ (homelabinfra_infra.monitoring.host | default('') | length > 0)
             and (homelabinfra_infra.monitoring.admin_user | default('') | length > 0)
             and (homelabinfra_infra.monitoring.admin_password | default('') | length > 0) }}

    # "Monitoring is an add-on" was the old justification for exiting 0 here. It does not
    # hold: an app with no monitor is an app whose outage nobody is told about, and the
    # operator who asked for monitoring has no way to notice it never happened. Recorded,
    # not raised, so the remaining wiring still runs.
    - name: Wire Uptime Kuma | Record missing credentials
      ansible.builtin.include_tasks: ../report-degradation.yml
      vars:
        degradation_component: "{{ wiring_app_name }} → uptime monitor"
        degradation_reason: >-
          The monitoring registry key has no host/admin_user/admin_password to sign in
          with, so no monitor was registered. Deploy Uptime Kuma
          (playbooks/apps/uptime-kuma.yml) so it records them, then re-run this deploy.
      when: not (_kuma_credentialed | bool)

    - name: Wire Uptime Kuma | Open an authenticated socket
      ansible.builtin.include_tasks: ../kuma/open-session.yml
      vars:
        kuma_base: "{{ homelabinfra_infra.monitoring.host }}"
        kuma_user: "{{ homelabinfra_infra.monitoring.admin_user }}"
        kuma_password: "{{ homelabinfra_infra.monitoring.admin_password }}"
      when: _kuma_credentialed | bool

    - name: Wire Uptime Kuma | Record an unusable Uptime Kuma
      ansible.builtin.include_tasks: ../report-degradation.yml
      vars:
        degradation_component: "{{ wiring_app_name }} → uptime monitor"
        degradation_reason: >-
          No monitor was registered —
          {{ kuma_session_reason | default('the session could not be opened') | trim }}.
      when:
        - _kuma_credentialed | bool
        - not (kuma_session_ready | default(false) | bool)

    - name: Wire Uptime Kuma | Register the monitor
      when: kuma_session_ready | default(false) | bool
      block:
        # The acknowledgement is only {"ok":true}; the list itself arrives as a separate
        # `monitorList` push, which is why kuma_session_frames rather than this call's own
        # frames is what gets read below.
        - name: Wire Uptime Kuma | Ask for the monitor list
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: getMonitorList
            kuma_call_ack_id: 1

        - name: Wire Uptime Kuma | Read the monitor and notification lists
          ansible.builtin.set_fact:
            # Keyed by monitor id; the values are full monitor objects.
            _kuma_monitors: >-
              {{ (kuma_session_frames | select('match', '42\["monitorList",') | list
                  | last | default('42["monitorList",{}]'))
                 | regex_replace('^42', '') | from_json | last }}
            # Pushed on sign-in, so it comes from the session's frames, not this call's.
            _kuma_notifications: >-
              {{ (kuma_session_frames | select('match', '42\["notificationList",') | list
                  | last | default('42["notificationList",[]]'))
                 | regex_replace('^42', '') | from_json | last }}

        # An id recorded in the registry is checked against the live list before it is
        # used. A rebuilt Uptime Kuma reuses ids from 1, and attaching one that no longer
        # exists fails the monitor's foreign key AFTER the monitor row is written —
        # leaving a monitor that exists, notifies nobody, and reported an error.
        - name: Wire Uptime Kuma | Resolve the notification channel
          ansible.builtin.set_fact:
            # By name first, then the recorded id if the channel was renamed — and either
            # way only an id the live list actually contains.
            _kuma_notification_id: >-
              {{ ((_kuma_notifications | selectattr('id', 'defined')
                   | selectattr('name', 'defined')
                   | selectattr('name', 'equalto', uptime_kuma_notification_name)
                   | map(attribute='id') | list)
                  + (_kuma_notifications | selectattr('id', 'defined')
                     | map(attribute='id')
                     | select('equalto',
                              homelabinfra_infra.monitoring.notification_id
                              | default(0) | int)
                     | list))
                 | first | default('') }}

        # Fatal despite the monitor existing. A monitor with no channel is the worst of
        # both worlds: the dashboard looks correct, and the outage notification never
        # arrives. 404 closed on a working channel (id 1), so this is a fallback path on
        # a system proven to work, not the normal case.
        - name: Wire Uptime Kuma | Record a missing notification channel
          ansible.builtin.include_tasks: ../report-degradation.yml
          vars:
            degradation_component: "{{ wiring_app_name }} → outage notifications"
            degradation_reason: >-
              Uptime Kuma has no '{{ uptime_kuma_notification_name }}' notification
              channel, so the monitor is registered without one — it shows state in the
              dashboard but sends nothing to Ntfy. Re-run playbooks/apps/uptime-kuma.yml
              to provision the channel.
          when: _kuma_notification_id | string | length == 0

        - name: Wire Uptime Kuma | Select the existing monitor and build the payload
          ansible.builtin.set_fact:
            _kuma_existing: >-
              {{ (_kuma_monitors.values() | list)
                 | selectattr('name', 'defined')
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}
            # One dict expression keeps ints as ints and bools as bools in the JSON body
            # (docs/specs/jinja-type-discipline.md). The field set is the one Uptime
            # Kuma's own front end sends; `accepted_statuscodes` must be present and all
            # strings or the add is rejected outright.
            _kuma_fields: >-
              {{ {
                   'type': 'http',
                   'name': wiring_app_name,
                   'url': wiring_monitor_url,
                   'method': 'GET',
                   'interval': _kuma_interval | int,
                   'retryInterval': _kuma_interval | int,
                   'resendInterval': 0,
                   'maxretries': 2,
                   'timeout': (((_kuma_interval | int) * 0.8) | round(0, 'floor') | int),
                   'accepted_statuscodes': ['200-299'],
                   'active': true,
                   'expiryNotification': false,
                   'ignoreTls': false,
                   'upsideDown': false,
                   'maxredirects': 10,
                   'parent': None,
                   'conditions': [],
                   'notificationIDList':
                     ({} if _kuma_notification_id | string | length == 0
                      else {_kuma_notification_id | string: true}),
                 } }}
          vars:
            # Uptime Kuma rejects anything below 20 seconds.
            _kuma_interval: "{{ [wiring_interval | default(60) | int, 20] | max }}"

        - name: Wire Uptime Kuma | Add the monitor
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: add
            kuma_call_args: ["{{ _kuma_fields }}"]
            kuma_call_ack_id: 2
          when: _kuma_existing.id is not defined

        # editMonitor assigns every column from the payload rather than merging, so a
        # partial object would blank out everything it does not mention. The full monitor
        # as Uptime Kuma reports it is the base, and only the wiring's own fields are
        # laid over the top.
        - name: Wire Uptime Kuma | Update the drifted monitor
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: editMonitor
            kuma_call_args: ["{{ _kuma_existing | combine(_kuma_fields) }}"]
            kuma_call_ack_id: 3
          when:
            - _kuma_existing.id is defined
            - _kuma_existing | combine(_kuma_fields) != _kuma_existing

        - name: Wire Uptime Kuma | Record whether the monitor changed
          ansible.builtin.set_fact:
            _kuma_wrote: >-
              {{ (_kuma_existing.id is not defined)
                 or (_kuma_existing | combine(_kuma_fields) != _kuma_existing) }}

        - name: Wire Uptime Kuma | Assert Uptime Kuma accepted the monitor
          ansible.builtin.assert:
            that: kuma_call_ok | bool
            fail_msg: >-
              Uptime Kuma refused the monitor for {{ wiring_app_name }}:
              {{ kuma_call_reason | default('no detail') | trim }}
          when: _kuma_wrote | bool

        - name: Wire Uptime Kuma | Report the monitor
          ansible.builtin.debug:
            msg: >-
              {{ 'Registered' if _kuma_wrote | bool else 'Confirmed' }} the Uptime Kuma
              monitor for {{ wiring_app_name }} on {{ wiring_monitor_url }}
              {{ 'with' if _kuma_notification_id | string | length > 0 else 'without' }}
              the '{{ uptime_kuma_notification_name }}' notification channel.
          changed_when: _kuma_wrote | bool

        # Read back from the server rather than trusting the acknowledgement. `add` writes
        # the monitor row before it attaches notifications, so a rejected attachment
        # returns ok:false over a monitor that does exist — the verify is what tells the
        # two apart.
        - name: Wire Uptime Kuma | Ask for the monitor list again
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: getMonitorList
            kuma_call_ack_id: 4
          when: _kuma_wrote | bool

        - name: Wire Uptime Kuma | Assert the monitor is present
          ansible.builtin.assert:
            that:
              - >-
                ((kuma_session_frames | select('match', '42\["monitorList",') | list
                  | last | default('42["monitorList",{}]'))
                 | regex_replace('^42', '') | from_json | last).values() | list
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', wiring_app_name)
                | list | length > 0
            fail_msg: "Uptime Kuma has no monitor named {{ wiring_app_name }} after wiring."
          when: _kuma_wrote | bool
