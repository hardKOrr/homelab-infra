---
# Register an app monitor in Uptime Kuma via its REST API.
# Inverse: tasks/unwiring/uptime-kuma.yml. Spec: .claude/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:     app instance name — becomes the monitor's friendly name
#   wiring_monitor_url:  URL to monitor (the public reverse-proxy route)
#   wiring_interval:     check interval in seconds (default 60)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   monitoring.provider         — uptime_kuma | none
#   monitoring.host             — full base URL including scheme
#   monitoring.token            — Uptime Kuma API key
#   monitoring.notification_id  — optional; id of the Ntfy notification channel to attach
#
# API-surface caveat (slice 303 / 404): Uptime Kuma v1 exposes no REST CRUD API — only
# socket.io — so this file targets the v2 REST surface and PROBES it first. When the
# probe does not return 200 (v1, unreachable, wrong key) the monitor is skipped with a
# console warning and the deploy continues: monitoring is an add-on, never the thing
# that fails an app deploy (slice 303 acceptance). A v1 Kuma needs a socket.io-based
# implementation here instead.
#
# Idempotent: monitor located by friendly name; absent → POST, drifted → PATCH,
# identical → no change. Silent no-op when the configured monitoring provider is not
# uptime_kuma.
#
# Authenticated requests carry no_log (they hold the API key, per
# .claude/specs/secrets-handling.md).

- name: Wire Uptime Kuma | Register monitor
  when:
    - homelabinfra_infra.monitoring is defined
    - homelabinfra_infra.monitoring.provider | default('none') == 'uptime_kuma'
  vars:
    _kuma_api: "{{ homelabinfra_infra.monitoring.host }}/api"
    _kuma_headers:
      Authorization: "Bearer {{ homelabinfra_infra.monitoring.token | default('') }}"
      Accept: "application/json"
  block:
    - name: Wire Uptime Kuma | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_app_name is defined and wiring_app_name | length > 0
          - wiring_monitor_url is defined and wiring_monitor_url | length > 0
        fail_msg: >-
          wiring/uptime-kuma.yml needs wiring_app_name and wiring_monitor_url.

    - name: Wire Uptime Kuma | Probe the REST API
      ansible.builtin.uri:
        url: "{{ _kuma_api }}/monitors"
        method: GET
        headers: "{{ _kuma_headers }}"
        status_code: [200, 401, 403, 404]
        timeout: 10
      register: _kuma_probe
      failed_when: false
      changed_when: false
      no_log: true
      when: homelabinfra_infra.monitoring.token | default('') | length > 0

    # A 200 from Uptime Kuma proves nothing on its own. Its Vue front end is served by a
    # catch-all route, so EVERY unmatched path — /api/monitors included — returns 200 with
    # index.html. Verified against 2.5.0: GET /api/monitors is 200 text/html, and
    # POST /api/monitors is "404 Cannot POST /api/monitors".
    #
    # The old status-only check therefore always passed, the block below ran, and the POST
    # failed the whole app deploy. That is the precise opposite of this file's contract
    # (slice 303): monitoring is an add-on and must never fail an app deploy.
    #
    # So usability means an authenticated request that came back as JSON, not merely a 200.
    - name: Wire Uptime Kuma | Decide whether the REST API is usable
      ansible.builtin.set_fact:
        _kuma_usable: >-
          {{ (homelabinfra_infra.monitoring.token | default('') | length > 0)
             and (_kuma_probe.status | default(0)) == 200
             and 'json' in (_kuma_probe.content_type | default('')) }}

    - name: Wire Uptime Kuma | Report unusable API
      ansible.builtin.debug:
        msg: >-
          Skipping the Uptime Kuma monitor for {{ wiring_app_name }} —
          {{ 'no monitoring.token is recorded in config/.generated/facts.yml'
             if (homelabinfra_infra.monitoring.token | default('') | length) == 0
             else 'GET ' ~ _kuma_api ~ '/monitors answered ' ~ (_kuma_probe.status | default('nothing'))
                  ~ ' as ' ~ (_kuma_probe.content_type | default('no content-type')) }}.
          Uptime Kuma serves its web UI from a catch-all route, so a 200 of text/html means
          the REST endpoint does not exist rather than that the request succeeded.
          The deploy continues: monitoring is an add-on, never a reason to fail an app.
      when: not _kuma_usable

    - name: Wire Uptime Kuma | Register monitor against the REST API
      when: _kuma_usable
      block:
        - name: Wire Uptime Kuma | Select existing monitor and build payload
          ansible.builtin.set_fact:
            _kuma_existing: >-
              {{ (_kuma_probe.json.monitors | default(_kuma_probe.json | default([]), true))
                 | selectattr('name', 'defined')
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}
            # One dict expression keeps ints as ints and bools as bools in the JSON body
            # (.claude/specs/jinja-string-typing.md).
            _kuma_payload: >-
              {{ {
                   'type': 'http',
                   'name': wiring_app_name,
                   'url': wiring_monitor_url,
                   'interval': wiring_interval | default(60) | int,
                   'retryInterval': wiring_interval | default(60) | int,
                   'maxretries': 2,
                   'accepted_statuscodes': ['200-299'],
                   'active': true,
                 }
                 | combine(
                     {'notificationIDList':
                        {homelabinfra_infra.monitoring.notification_id | string: true}}
                     if homelabinfra_infra.monitoring.notification_id is defined else {}) }}

        - name: Wire Uptime Kuma | Create monitor
          ansible.builtin.uri:
            url: "{{ _kuma_api }}/monitors"
            method: POST
            headers: "{{ _kuma_headers }}"
            body_format: json
            body: "{{ _kuma_payload }}"
            status_code: [200, 201]
          when: _kuma_existing.id is not defined
          changed_when: _kuma_existing.id is not defined
          no_log: true

        - name: Wire Uptime Kuma | Update drifted monitor
          ansible.builtin.uri:
            url: "{{ _kuma_api }}/monitors/{{ _kuma_existing.id | default(0) }}"
            method: PATCH
            headers: "{{ _kuma_headers }}"
            body_format: json
            body: "{{ _kuma_payload }}"
            status_code: 200
          when:
            - _kuma_existing.id is defined
            - >-
              _kuma_existing.url | default('') != wiring_monitor_url
              or _kuma_existing.interval | default(0) | int != wiring_interval | default(60) | int
              or not (_kuma_existing.active | default(true))
          changed_when: true
          no_log: true

        - name: Wire Uptime Kuma | Verify monitor is present
          ansible.builtin.uri:
            url: "{{ _kuma_api }}/monitors"
            method: GET
            headers: "{{ _kuma_headers }}"
            status_code: 200
          register: _kuma_verify
          changed_when: false
          no_log: true

        - name: Wire Uptime Kuma | Assert monitor exists
          ansible.builtin.assert:
            that:
              - >-
                (_kuma_verify.json.monitors | default(_kuma_verify.json | default([]), true))
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', wiring_app_name)
                | list | length > 0
            fail_msg: "Uptime Kuma has no monitor named {{ wiring_app_name }} after wiring."
