---
# Phase of authentik.yml: ensure the forward_auth proxy provider and resolve its pk.
# Imported in place; inputs are listed in authentik.yml.

# ── forward_auth: proxy provider ──────────────────────────────────────────
- name: Wire Authentik | Ensure proxy provider (forward_auth)
  when: _ak_mode == 'forward_auth'
  block:
    - name: Wire Authentik | Find existing proxy provider
      ansible.builtin.uri:
        url: "{{ _ak_api }}/providers/proxy/?name={{ wiring_app_name | urlencode }}"
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_provider_list
      no_log: true

    - name: Wire Authentik | Select existing provider
      ansible.builtin.set_fact:
        _ak_provider_matches: >-
          {{ (_ak_provider_list.json.results | default([]))
             | selectattr('name', 'equalto', wiring_app_name)
             | list }}
        _ak_provider: >-
          {{ (_ak_provider_list.json.results | default([]))
             | selectattr('name', 'equalto', wiring_app_name)
             | list | first | default({}) }}
      no_log: true

    - name: Wire Authentik | Reject duplicate proxy providers
      ansible.builtin.assert:
        that: _ak_provider_matches | length <= 1
        fail_msg: >-
          Authentik has multiple proxy providers named '{{ wiring_app_name }}'. In
          Authentik Admin > Applications > Providers > Proxy Providers, remove the
          stale duplicate, then rerun this application's Deploy.

    # Single dict expression so pks stay ints and flags stay bools in the JSON body.
    # forward_single = one app, one domain.
    - name: Wire Authentik | Build provider payload
      ansible.builtin.set_fact:
        _ak_provider_payload: >-
          {{ {
               'name': wiring_app_name,
               'mode': 'forward_single',
               'external_host': _ak_external_url,
               'internal_host': _ak_internal_url,
               'internal_host_ssl_validation': false,
               'authorization_flow': _ak_auth_flow.json.results[0].pk,
               'invalidation_flow': _ak_inval_flow.json.results[0].pk,
             } }}

    - name: Wire Authentik | Create proxy provider
      ansible.builtin.uri:
        url: "{{ _ak_api }}/providers/proxy/"
        method: POST
        headers: "{{ _ak_headers }}"
        body_format: json
        body: "{{ _ak_provider_payload }}"
        status_code: 201
      register: _ak_provider_create
      when: _ak_provider.pk is not defined
      changed_when: _ak_provider.pk is not defined
      no_log: true

    - name: Wire Authentik | Update drifted proxy provider
      ansible.builtin.uri:
        url: "{{ _ak_api }}/providers/proxy/{{ _ak_provider.pk | default(0) }}/"
        method: PATCH
        headers: "{{ _ak_headers }}"
        body_format: json
        body: "{{ _ak_provider_payload }}"
        status_code: 200
      when:
        - _ak_provider.pk is defined
        - >-
          _ak_provider.external_host | default('') != _ak_external_url
          or _ak_provider.internal_host | default('') != _ak_internal_url
          or _ak_provider.mode | default('') != 'forward_single'
      changed_when: true
      no_log: true

    - name: Wire Authentik | Read proxy providers after reconciliation
      ansible.builtin.uri:
        url: "{{ _ak_api }}/providers/proxy/?name={{ wiring_app_name | urlencode }}"
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_provider_verify
      no_log: true

    - name: Wire Authentik | Assert exactly one proxy provider is active
      ansible.builtin.assert:
        that:
          - >-
            (_ak_provider_verify.json.results | default([])
             | selectattr('name', 'equalto', wiring_app_name)
             | list | length) == 1
        fail_msg: >-
          Authentik did not end with exactly one proxy provider named
          '{{ wiring_app_name }}'. Inspect Authentik Admin > Applications > Providers
          > Proxy Providers, remove any stale duplicate, then rerun this application's
          Deploy.

    - name: Wire Authentik | Resolve provider pk
      ansible.builtin.set_fact:
        _ak_provider_pk: >-
          {{ _ak_provider.pk | default(_ak_provider_create.json.pk | default(''), true) }}
