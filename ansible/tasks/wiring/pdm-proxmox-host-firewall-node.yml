---
- name: PDM host firewall | Read node rules
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ pdm_firewall_node }}/firewall/rules"
      - --output-format
      - json
  delegate_to: "{{ pdm_config.proxmox.node }}"
  register: _pdm_host_firewall_read
  changed_when: false
  no_log: true

- name: PDM host firewall | Select owned API rules
  ansible.builtin.set_fact:
    _pdm_host_firewall_owned: >-
      {{ (_pdm_host_firewall_read.stdout | from_json)
         | selectattr('comment', 'defined')
         | selectattr('comment', 'equalto', _pdm_host_firewall_comment)
         | list }}
  vars:
    _pdm_host_firewall_comment: "homelab-infra: {{ instance }} pdm-proxmox-api"
  no_log: true

- name: PDM host firewall | Find exact desired API rule
  ansible.builtin.set_fact:
    _pdm_host_firewall_exact: "{{ _pdm_host_firewall_exact_json | from_json }}"
  vars:
    _pdm_host_firewall_comment: "homelab-infra: {{ instance }} pdm-proxmox-api"
    _pdm_host_firewall_exact_json: >-
      {%- set matches = [] -%}
      {%- for rule in _pdm_host_firewall_owned -%}
      {%-   set source = rule.get('source', '') | string -%}
      {%-   if rule.get('action', '') | upper == 'ACCEPT'
              and rule.get('type', '') == 'in'
              and rule.get('proto', '') | lower == 'tcp'
              and rule.get('dport', '') | string == '8006'
              and source.split('/') | first == pdm_config.proxmox.ip_address
              and (source.split('/') | length == 1 or source.split('/')[-1] == '32')
              and rule.get('enable', 0) | int == 1
              and rule.get('comment', '') == _pdm_host_firewall_comment -%}
      {%-     set _ = matches.append(rule) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ matches | to_json }}
  no_log: true

- name: PDM host firewall | Decide whether rules need repair
  ansible.builtin.set_fact:
    _pdm_host_firewall_reconcile: >-
      {{ _pdm_host_firewall_owned | length != 1 or _pdm_host_firewall_exact | length != 1 }}
  no_log: true

- name: PDM host firewall | Remove stale or duplicate owned rules
  ansible.builtin.include_tasks: ../proxmox/pdm-host-firewall-delete-rule.yml
  loop: "{{ _pdm_host_firewall_owned | sort(attribute='pos', reverse=true) }}"
  loop_control:
    loop_var: pdm_firewall_owned_rule
    label: owned PDM API rule
  when: _pdm_host_firewall_reconcile | bool

- name: PDM host firewall | Allow only PDM to the node API
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - "/nodes/{{ pdm_firewall_node }}/firewall/rules"
      - --action
      - ACCEPT
      - --type
      - in
      - --proto
      - tcp
      - --dport
      - "8006"
      - --source
      - "{{ pdm_config.proxmox.ip_address }}"
      - --enable
      - "1"
      - --comment
      - "homelab-infra: {{ instance }} pdm-proxmox-api"
  delegate_to: "{{ pdm_config.proxmox.node }}"
  changed_when: true
  when: _pdm_host_firewall_reconcile | bool
  no_log: true
