---
# Register an app with Authentik per its identity mode.
# Inverse: tasks/unwiring/authentik.yml. Spec: .claude/specs/provider-noop-wiring.md.
#
# Identity modes (wiring_identity_mode, from routing.identity — CONTRACT.md):
#   catalog       Application only: a launch tile in the Authentik user portal with
#                 the group binding. No provider, no outpost — the app keeps its
#                 own login. This is the default mode.
#   oidc          OAuth2 provider + Application. The provider's client_id/secret
#                 are handed back to the caller as authentik_oidc_client_id /
#                 authentik_oidc_client_secret facts for the app role to consume
#                 (store per the secrets model — Vaultwarden, or facts.yml when the
#                 consuming slice records them).
#   forward_auth  Proxy provider (forward_single) + Application + outpost
#                 membership. The reverse proxy enforces login (slice 306 emits the
#                 forward_auth handler).
# Mode `none` never reaches this file — the calling playbook skips the include.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:       app instance name — provider name and application slug
#   wiring_identity_mode:  catalog | oidc | forward_auth (default: forward_auth)
#   wiring_app_display:    human-readable name for the Authentik UI (default: wiring_app_name)
#   wiring_domain:         full external domain of the app
#   wiring_upstream_host:  IP or hostname of the app container
#   wiring_upstream_port:  port the app listens on
#   wiring_auth_group:     Authentik group granted access (default: homelab-users)
#   wiring_external_url:   optional override; default https://{{ wiring_domain }}
#   wiring_upstream_url:   optional override; default http://{{ host }}:{{ port }}
#   wiring_oidc_redirect_uris:  oidc only, optional — list of {matching_mode, url}
#                          dicts; default one regex entry scoped to the app's own
#                          domain (https://<wiring_domain>/.*)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   sso.host   — full base URL including scheme (e.g. https://auth.homelab.example.com)
#   sso.token  — Authentik API token
# For apps on a non-default estate, tasks/resolve-estate.yml has already replaced
# `sso` with that estate's entry — this file is estate-agnostic.
#
# Tunables (override per call if the lab renamed the stock objects):
#   wiring_authentik_auth_flow          default-provider-authorization-implicit-consent
#   wiring_authentik_invalidation_flow  default-provider-invalidation-flow
#     Verified against Authentik 2026.5.6. Pre-2024 installs shipped this flow as
#     `default-provider-invalidation` (no `-flow` suffix) — override there.
#   wiring_authentik_outpost            authentik Embedded Outpost
#   wiring_authentik_signing_key        authentik Self-signed Certificate (oidc)
#   wiring_authentik_public_url         https://auth.<estate domain> — the browser-facing
#     base URL of Authentik itself, written to the outpost's config.authentik_host
#     (forward_auth only). Default follows the estate doctrine: Authentik's own
#     routing.subdomain defaults to `auth` (ansible/vars/app-defaults/authentik.yml),
#     so the canonical hostname is auth.<domain>. Override only if this lab moved it.
#
# Idempotent: provider, application, policy binding and outpost membership are each
# located first and only created or patched when absent or drifted. Silent no-op when
# the configured SSO provider is not authentik.
#
# Authenticated requests carry no_log (they hold the API token, per
# .claude/specs/secrets-handling.md); asserts on registered results keep failures
# diagnosable without printing the token.

- name: Wire Authentik | Register application per identity mode
  when: homelabinfra_infra.sso.provider | default('none') == 'authentik'
  vars:
    _ak_mode: "{{ wiring_identity_mode | default('forward_auth') }}"
    _ak_api: "{{ homelabinfra_infra.sso.host }}/api/v3"
    _ak_headers:
      Authorization: "Bearer {{ homelabinfra_infra.sso.token | default('') }}"
      Accept: "application/json"
    _ak_auth_flow_slug: >-
      {{ wiring_authentik_auth_flow
         | default('default-provider-authorization-implicit-consent') }}
    _ak_invalidation_flow_slug: >-
      {{ wiring_authentik_invalidation_flow | default('default-provider-invalidation-flow') }}
    _ak_outpost_name: "{{ wiring_authentik_outpost | default('authentik Embedded Outpost') }}"
    _ak_signing_key_name: >-
      {{ wiring_authentik_signing_key | default('authentik Self-signed Certificate') }}
    _ak_external_url: "{{ wiring_external_url | default('https://' ~ wiring_domain) }}"
    # Authentik's OWN browser-facing base URL — deliberately not sso.host, which is the
    # LAN URL the control node uses for API calls (e.g. http://192.168.0.13:9000) and
    # which no browser off the LAN can reach. Estate-correct by construction: the app's
    # domain and its estate's Authentik share the estate domain, and resolve-estate.yml
    # has already put that estate's domain in homelabinfra_infra.domain.
    _ak_public_url: >-
      {{ wiring_authentik_public_url
         | default('https://auth.' ~ (homelabinfra_infra.domain
                                      | default(wiring_domain.split('.')[1:] | join('.'), true))) }}
    _ak_internal_url: >-
      {{ wiring_upstream_url
         | default('http://' ~ wiring_upstream_host ~ ':' ~ wiring_upstream_port) }}
    _ak_display: "{{ wiring_app_display | default(wiring_app_name, true) }}"
  block:
    - name: Wire Authentik | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - _ak_mode in ['catalog', 'oidc', 'forward_auth']
          - wiring_app_name is defined and wiring_app_name | length > 0
          - wiring_domain is defined and wiring_domain | length > 0
          - wiring_upstream_host is defined and wiring_upstream_host | length > 0
          - wiring_upstream_port is defined and wiring_upstream_port | string | length > 0
          - homelabinfra_infra.sso.host | default('') | length > 0
          - homelabinfra_infra.sso.token | default('') | length > 0
        fail_msg: >-
          wiring/authentik.yml needs wiring_identity_mode (catalog|oidc|forward_auth —
          got '{{ _ak_mode }}'), wiring_app_name, wiring_domain, wiring_upstream_host,
          wiring_upstream_port, and sso.host + sso.token in config/.generated/facts.yml.

    # ── Flows (provider modes only — catalog creates no provider) ─────────────
    - name: Wire Authentik | Look up provider flows
      when: _ak_mode in ['oidc', 'forward_auth']
      block:
        - name: Wire Authentik | Look up authorization flow
          ansible.builtin.uri:
            url: "{{ _ak_api }}/flows/instances/?slug={{ _ak_auth_flow_slug }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_auth_flow
          no_log: true

        - name: Wire Authentik | Look up invalidation flow
          ansible.builtin.uri:
            url: "{{ _ak_api }}/flows/instances/?slug={{ _ak_invalidation_flow_slug }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_inval_flow
          no_log: true

        - name: Wire Authentik | Assert both flows exist
          ansible.builtin.assert:
            that:
              - _ak_auth_flow.json.results | default([]) | length > 0
              - _ak_inval_flow.json.results | default([]) | length > 0
            fail_msg: >-
              Authentik has no flow with slug {{ _ak_auth_flow_slug }} and/or
              {{ _ak_invalidation_flow_slug }}. Pass wiring_authentik_auth_flow /
              wiring_authentik_invalidation_flow if this lab renamed the stock flows.

    # ── forward_auth: proxy provider ──────────────────────────────────────────
    - name: Wire Authentik | Ensure proxy provider (forward_auth)
      when: _ak_mode == 'forward_auth'
      block:
        - name: Wire Authentik | Find existing proxy provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/proxy/?name={{ wiring_app_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_provider_list
          no_log: true

        - name: Wire Authentik | Select existing provider
          ansible.builtin.set_fact:
            _ak_provider: >-
              {{ (_ak_provider_list.json.results | default([]))
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}

        # Single dict expression so pks stay ints and flags stay bools in the JSON body
        # (.claude/specs/jinja-string-typing.md). forward_single = one app, one domain.
        - name: Wire Authentik | Build provider payload
          ansible.builtin.set_fact:
            _ak_provider_payload: >-
              {{ {
                   'name': wiring_app_name,
                   'mode': 'forward_single',
                   'external_host': _ak_external_url,
                   'internal_host': _ak_internal_url,
                   'internal_host_ssl_validation': false,
                   'authorization_flow': _ak_auth_flow.json.results[0].pk,
                   'invalidation_flow': _ak_inval_flow.json.results[0].pk,
                 } }}

        - name: Wire Authentik | Create proxy provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/proxy/"
            method: POST
            headers: "{{ _ak_headers }}"
            body_format: json
            body: "{{ _ak_provider_payload }}"
            status_code: 201
          register: _ak_provider_create
          when: _ak_provider.pk is not defined
          changed_when: _ak_provider.pk is not defined
          no_log: true

        - name: Wire Authentik | Update drifted proxy provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/proxy/{{ _ak_provider.pk | default(0) }}/"
            method: PATCH
            headers: "{{ _ak_headers }}"
            body_format: json
            body: "{{ _ak_provider_payload }}"
            status_code: 200
          when:
            - _ak_provider.pk is defined
            - >-
              _ak_provider.external_host | default('') != _ak_external_url
              or _ak_provider.internal_host | default('') != _ak_internal_url
              or _ak_provider.mode | default('') != 'forward_single'
          changed_when: true
          no_log: true

        - name: Wire Authentik | Resolve provider pk
          ansible.builtin.set_fact:
            _ak_provider_pk: >-
              {{ _ak_provider.pk | default(_ak_provider_create.json.pk | default(''), true) }}

    # ── oidc: OAuth2 provider ─────────────────────────────────────────────────
    - name: Wire Authentik | Ensure OAuth2 provider (oidc)
      when: _ak_mode == 'oidc'
      block:
        - name: Wire Authentik | Find existing OAuth2 provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/?name={{ wiring_app_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_oauth_list
          no_log: true

        - name: Wire Authentik | Select existing OAuth2 provider
          ansible.builtin.set_fact:
            _ak_oauth: >-
              {{ (_ak_oauth_list.json.results | default([]))
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}

        # RS256 needs a signing key; the stock install ships a self-signed one.
        # Absent (renamed) key → provider is created without and Authentik falls
        # back to HS256 — functional, so a missing key is not fatal.
        - name: Wire Authentik | Find signing key
          ansible.builtin.uri:
            url: "{{ _ak_api }}/crypto/certificatekeypairs/?name={{ _ak_signing_key_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_signing_key_list
          no_log: true

        # Single dict expression keeps pks ints and the redirect list structured
        # (.claude/specs/jinja-string-typing.md). Default redirect scope: any path
        # on the app's own domain — override with wiring_oidc_redirect_uris.
        - name: Wire Authentik | Build OAuth2 provider payload
          ansible.builtin.set_fact:
            _ak_oauth_payload: >-
              {{ {
                   'name': wiring_app_name,
                   'client_type': 'confidential',
                   'authorization_flow': _ak_auth_flow.json.results[0].pk,
                   'invalidation_flow': _ak_inval_flow.json.results[0].pk,
                   'redirect_uris': wiring_oidc_redirect_uris
                     | default([{'matching_mode': 'regex',
                                 'url': 'https://' ~ wiring_domain ~ '/.*'}]),
                 }
                 | combine({'signing_key': (_ak_signing_key_list.json.results | first).pk}
                           if _ak_signing_key_list.json.results | default([]) | length > 0
                           else {}) }}
          no_log: true

        - name: Wire Authentik | Create OAuth2 provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/"
            method: POST
            headers: "{{ _ak_headers }}"
            body_format: json
            body: "{{ _ak_oauth_payload }}"
            status_code: 201
          register: _ak_oauth_create
          when: _ak_oauth.pk is not defined
          changed_when: _ak_oauth.pk is not defined
          no_log: true

        - name: Wire Authentik | Update drifted OAuth2 provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/{{ _ak_oauth.pk | default(0) }}/"
            method: PATCH
            headers: "{{ _ak_headers }}"
            body_format: json
            body: "{{ _ak_oauth_payload }}"
            status_code: 200
          when:
            - _ak_oauth.pk is defined
            - >-
              _ak_oauth.client_type | default('') != 'confidential'
              or _ak_oauth.redirect_uris | default([]) != _ak_oauth_payload.redirect_uris
          changed_when: true
          no_log: true

        - name: Wire Authentik | Resolve provider pk
          ansible.builtin.set_fact:
            _ak_provider_pk: >-
              {{ _ak_oauth.pk | default(_ak_oauth_create.json.pk | default(''), true) }}

        # Hand the client credentials back to the caller. The POST/GET responses
        # include client_secret for confidential providers; the app role consumes
        # these on its next run (store per the secrets model).
        - name: Wire Authentik | Read OAuth2 client credentials
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/{{ _ak_provider_pk }}/"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_oauth_detail
          no_log: true

        - name: Wire Authentik | Export OAuth2 client credentials
          ansible.builtin.set_fact:
            authentik_oidc_client_id: "{{ _ak_oauth_detail.json.client_id }}"
            authentik_oidc_client_secret: "{{ _ak_oauth_detail.json.client_secret }}"
          no_log: true

        - name: Wire Authentik | Store OAuth2 client credentials immediately
          ansible.builtin.include_tasks: ../bitwarden/upsert-item.yml
          vars:
            vault_item_name: "homelab-infra/apps/{{ wiring_app_name }}"
            vault_item_fields:
              identity_provider: authentik
              oidc_client_id: "{{ authentik_oidc_client_id }}"
              oidc_client_secret: "{{ authentik_oidc_client_secret }}"
            vault_item_secret_fields: [oidc_client_secret]

    - name: Wire Authentik | Assert provider pk resolved
      ansible.builtin.assert:
        that:
          - _ak_provider_pk | string | length > 0
        fail_msg: "Could not resolve the Authentik provider pk for {{ wiring_app_name }}."
      when: _ak_mode in ['oidc', 'forward_auth']

    # ── Application (all modes; catalog gets a tile with no provider) ─────────
    # superuser_full_list=true is REQUIRED, not a tuning flag. Authentik's application
    # list is filtered by per-object view permission, so a token that has just CREATED an
    # application cannot see it back on the next run. The response is doubly misleading:
    # pagination.count honours the ?slug= filter while results does not, so a lookup for
    # 'ntfy' came back count=1 with a body containing 'vaultwarden'. Measured live:
    #
    #   ?slug=ntfy                            count=1  results=['vaultwarden']
    #   ?slug=ntfy&superuser_full_list=true   count=1  results=['ntfy']
    #   ?slug=nope&superuser_full_list=true   count=0  results=[]
    #
    # Without it the lookup never matched, so every app's SECOND deploy tried to create an
    # application that already existed and failed the whole deploy on
    # "Application with this slug already exists" — the Authentik wiring was never
    # idempotent.
    #
    # Only this endpoint needs it. Verified live that /flows/instances/,
    # /outposts/instances/ and /providers/* return count == len(results) and filter
    # correctly; superuser_full_list is specific to Authentik's ApplicationViewSet.
    - name: Wire Authentik | Find existing application
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/applications/?slug={{ wiring_app_name | urlencode }}&superuser_full_list=true"
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_app_list
      no_log: true

    - name: Wire Authentik | Select existing application and build payload
      ansible.builtin.set_fact:
        _ak_app: >-
          {{ (_ak_app_list.json.results | default([]))
             | selectattr('slug', 'equalto', wiring_app_name)
             | list | first | default({}) }}
        _ak_app_payload: >-
          {{ {
               'name': _ak_display,
               'slug': wiring_app_name,
               'meta_launch_url': _ak_external_url,
             }
             | combine({'provider': _ak_provider_pk | int}
                       if _ak_mode in ['oidc', 'forward_auth']
                       else {'provider': none}) }}

    - name: Wire Authentik | Create application
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/applications/"
        method: POST
        headers: "{{ _ak_headers }}"
        body_format: json
        body: "{{ _ak_app_payload }}"
        status_code: 201
      when: _ak_app.slug is not defined
      changed_when: _ak_app.slug is not defined
      no_log: true

    - name: Wire Authentik | Update drifted application
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/applications/{{ wiring_app_name }}/"
        method: PATCH
        headers: "{{ _ak_headers }}"
        body_format: json
        body: "{{ _ak_app_payload }}"
        status_code: 200
      when:
        - _ak_app.slug is defined
        - >-
          _ak_app.provider | default(none) != _ak_app_payload.provider
          or _ak_app.name | default('') != _ak_display
          or _ak_app.meta_launch_url | default('') != _ak_external_url
      changed_when: true
      no_log: true

    - name: Wire Authentik | Re-read application for its pk
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/applications/{{ wiring_app_name }}/"
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_app_final
      no_log: true

    # Access policy: bind the configured group to the application, creating the group
    # when it is absent.
    #
    # This comment used to say the authentik role creates the standing groups at deploy
    # time. It does not — 403 removed directory-content management from the role — so
    # twelve playbooks hardcoded `wiring_auth_group` and nothing created it. That gap was
    # survivable while a missing binding only printed a message, and stopped being
    # survivable when W3 made it fatal: every app deploy on a fresh lab failed until an
    # operator made one group by hand in the UI (execution 77, 2026-08-11).
    #
    # The EMPTY group only, and this is the boundary rather than an exception to it. 403 is
    # about directory CONTENT — account names, who is in which group, social login sources,
    # MFA doctrine — all of which are the operator's and which a re-deploy must never
    # overwrite. The access group itself is not content; it is the platform's own ACL
    # primitive, the thing this wiring binds an application to, and a platform that names a
    # group in twelve playbooks has to be the thing that creates it. Membership stays
    # untouched here, on the first deploy and on every one after it.
    - name: Wire Authentik | Find access group
      ansible.builtin.uri:
        url: >-
          {{ _ak_api }}/core/groups/?name={{
             (wiring_auth_group | default('homelab-users')) | urlencode }}
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_group_list
      no_log: true

    - name: Wire Authentik | Select access group
      ansible.builtin.set_fact:
        _ak_group: "{{ (_ak_group_list.json.results | default([])) | list | first | default({}) }}"

    # is_superuser false, explicitly: this group is what grants access to one published
    # application, and an Authentik group carrying the superuser flag would hand every
    # member administrative rights over Authentik itself.
    #
    # 400 is accepted alongside 201 because it is what a name collision answers, which is
    # the benign race of two app deploys wiring at once. Either way the re-read below is
    # what decides, so no branch here has to know which one happened.
    - name: Wire Authentik | Create the access group when it does not exist
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/groups/"
        method: POST
        headers: "{{ _ak_headers }}"
        body_format: json
        body: >-
          {{ {'name': wiring_auth_group | default('homelab-users'),
              'is_superuser': false} }}
        status_code: [201, 400]
      register: _ak_group_created
      when: _ak_group.pk is not defined
      no_log: true

    - name: Wire Authentik | Re-read the access group after creating it
      ansible.builtin.uri:
        url: >-
          {{ _ak_api }}/core/groups/?name={{
             (wiring_auth_group | default('homelab-users')) | urlencode }}
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_group_recheck
      when: _ak_group.pk is not defined
      no_log: true

    - name: Wire Authentik | Select the access group it created
      ansible.builtin.set_fact:
        _ak_group: "{{ (_ak_group_recheck.json.results | default([])) | list | first | default({}) }}"
      when: _ak_group.pk is not defined

    # Fatal, not a warning, and now only reachable when Authentik refused to create the
    # group as well as not having it. Without the binding the application is published
    # through Authentik with no access policy at all — every Authentik user can reach an app
    # the operator asked to restrict to one group. Reporting that and exiting 0 hands back a
    # deploy that looks successful and is less restricted than it was asked to be.
    # Recorded rather than raised so the rest of the wiring still completes; the gate at
    # the end of the deploy is what fails.
    - name: Wire Authentik | Record an access group that could not be resolved
      ansible.builtin.include_tasks: ../report-degradation.yml
      vars:
        degradation_component: "{{ wiring_app_name }} → Authentik access policy"
        degradation_reason: >-
          Authentik group '{{ wiring_auth_group | default('homelab-users') }}' does not
          exist and could not be created, so {{ wiring_app_name }} is published with no
          group policy binding and is reachable by every Authentik user. Check what the
          create call returned — the API token needs permission to add groups.
      when: _ak_group.pk is not defined

    - name: Wire Authentik | Find existing policy binding
      ansible.builtin.uri:
        url: >-
          {{ _ak_api }}/policies/bindings/?target={{ _ak_app_final.json.pk }}&group={{ _ak_group.pk }}
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: 200
      register: _ak_binding_list
      when: _ak_group.pk is defined
      no_log: true

    - name: Wire Authentik | Bind access group to application
      ansible.builtin.uri:
        url: "{{ _ak_api }}/policies/bindings/"
        method: POST
        headers: "{{ _ak_headers }}"
        body_format: json
        body: >-
          {{ {
               'target': _ak_app_final.json.pk,
               'group': _ak_group.pk,
               'order': 0,
               'enabled': true,
               'negate': false,
               'timeout': 30,
             } }}
        status_code: 201
      when:
        - _ak_group.pk is defined
        - _ak_binding_list.json.results | default([]) | length == 0
      changed_when: true
      no_log: true

    # ── Outpost (forward_auth only) ───────────────────────────────────────────
    # The outpost is what actually serves forward-auth for the provider; a provider
    # missing from it authenticates nobody. Catalog and oidc need no outpost.
    - name: Wire Authentik | Ensure outpost membership (forward_auth)
      when: _ak_mode == 'forward_auth'
      block:
        - name: Wire Authentik | Find outpost
          ansible.builtin.uri:
            url: "{{ _ak_api }}/outposts/instances/?name={{ _ak_outpost_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_outpost_list
          no_log: true

        - name: Wire Authentik | Select outpost
          ansible.builtin.set_fact:
            _ak_outpost: >-
              {{ (_ak_outpost_list.json.results | default([]))
                 | selectattr('name', 'equalto', _ak_outpost_name)
                 | list | first | default({}) }}

        - name: Wire Authentik | Assert outpost exists
          ansible.builtin.assert:
            that:
              - _ak_outpost.pk is defined
            fail_msg: >-
              Authentik outpost '{{ _ak_outpost_name }}' not found. Pass wiring_authentik_outpost
              with the name of the outpost that should serve {{ wiring_app_name }}.

        - name: Wire Authentik | Add provider to outpost
          ansible.builtin.uri:
            url: "{{ _ak_api }}/outposts/instances/{{ _ak_outpost.pk }}/"
            method: PATCH
            headers: "{{ _ak_headers }}"
            body_format: json
            body: >-
              {{ {'providers': (_ak_outpost.providers | default([])) + [_ak_provider_pk | int]} }}
            status_code: 200
          when: (_ak_provider_pk | int) not in (_ak_outpost.providers | default([]))
          changed_when: true
          no_log: true

        # The outpost builds every sign-in redirect against config.authentik_host. An
        # empty value (the shipped default of the Embedded Outpost) makes it emit
        # `http://localhost/application/o/authorize/...`, so the browser is bounced to
        # localhost and login can never complete — while the reverse-proxy forward_auth
        # block and the provider-to-outpost membership both look perfectly correct. It
        # is invisible to any check short of following the 302 in a browser, and cost a
        # live run to find (2026-08-13).
        #
        # Merged, never replaced: config also carries log_level, the docker settings,
        # cookie domain and the object-naming template, and PATCHing a bare
        # {'authentik_host': ...} would drop them.
        - name: Wire Authentik | Point outpost at the public Authentik URL
          ansible.builtin.uri:
            url: "{{ _ak_api }}/outposts/instances/{{ _ak_outpost.pk }}/"
            method: PATCH
            headers: "{{ _ak_headers }}"
            body_format: json
            body: >-
              {{ {'config': (_ak_outpost.config | default({}, true))
                            | combine({'authentik_host': _ak_public_url})} }}
            status_code: 200
          when: >-
            (_ak_outpost.config | default({}, true)).authentik_host
            | default('', true) != _ak_public_url
          changed_when: true
          no_log: true
