---
# Create a DNS custom record in Pi-hole v6 via its REST API.
# Inverse: tasks/unwiring/pihole.yml. Spec: .claude/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_domain:         full domain of the app (the record's FQDN)
#   wiring_upstream_host:  app IP — the fallback record target when no reverse proxy runs
#
# Optional overrides:
#   wiring_ip:  address the record resolves to (default: the reverse proxy's IP when one
#               is configured, else wiring_upstream_host — apps are reached through the
#               proxy, so the record points there)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   dns.host            — Pi-hole address; bare IPs are assumed http
#   dns.api_key         — Pi-hole web/app password, exchanged for a session SID
#   dns.validate_certs  — default false (a lab Pi-hole serves its own certificate)
#
# Pi-hole v6+ only: v5's custom-DNS mechanism is not an API and is not supported. A v5
# host answers /api/auth with 404 and this file fails with that message.
#
# Idempotent: the record is one "<ip> <fqdn>" element of the dns.hosts config array.
# Any stale element for this FQDN is removed first, then the wanted element is added
# only when absent. The session is always closed in the always: block — Pi-hole allows
# a small fixed number of concurrent sessions and leaking them locks out the UI.
#
# Requests carry no_log (password and session SID, per .claude/specs/secrets-handling.md).

- name: Wire Pihole | Create DNS record
  when: homelabinfra_infra.dns.provider | default('none') == 'pihole'
  vars:
    _ph_base: >-
      {{ homelabinfra_infra.dns.host
         if homelabinfra_infra.dns.host is search('^https?://')
         else 'http://' ~ homelabinfra_infra.dns.host }}
    _ph_proxy_ip: >-
      {{ homelabinfra_infra.reverse_proxy.host | default('', true)
         | regex_replace('^https?://', '') | regex_replace(':.*$', '') }}
    _ph_ip: >-
      {{ wiring_ip | default(_ph_proxy_ip, true)
         | default(wiring_upstream_host | default(''), true) }}
    _ph_validate: "{{ homelabinfra_infra.dns.validate_certs | default(false) }}"
  block:
    - name: Wire Pihole | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_domain is defined and wiring_domain | length > 0
          - _ph_ip | length > 0
          - homelabinfra_infra.dns.api_key | default('') | length > 0
        fail_msg: >-
          wiring/pihole.yml needs wiring_domain, a record target (wiring_ip, a configured
          reverse proxy, or wiring_upstream_host), and dns.api_key (the Pi-hole app
          password) in config/.generated/facts.yml.

    - name: Wire Pihole | Open API session
      ansible.builtin.uri:
        url: "{{ _ph_base }}/api/auth"
        method: POST
        validate_certs: "{{ _ph_validate | bool }}"
        body_format: json
        body: >-
          {{ {'password': homelabinfra_infra.dns.api_key} }}
        status_code: [200, 401, 404]
      register: _ph_auth
      changed_when: false
      no_log: true

    - name: Wire Pihole | Assert a v6 session was granted
      ansible.builtin.assert:
        that:
          - _ph_auth.status != 404
          - _ph_auth.status == 200
        fail_msg: >-
          {{ 'Pi-hole v6+ required: ' ~ _ph_base ~ '/api/auth returned 404 (v5 has no REST API).'
             if _ph_auth.status == 404
             else 'Pi-hole rejected dns.api_key (status ' ~ _ph_auth.status ~ ').' }}

    - name: Wire Pihole | Manage the record on the open session
      vars:
        _ph_headers:
          X-FTL-SID: "{{ _ph_auth.json.session.sid }}"
          Accept: "application/json"
        _ph_entry: "{{ _ph_ip }} {{ wiring_domain }}"
      block:
        - name: Wire Pihole | Read current custom DNS records
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts"
            method: GET
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: 200
          register: _ph_hosts
          changed_when: false
          no_log: true

        - name: Wire Pihole | Select stale records for this FQDN
          ansible.builtin.set_fact:
            _ph_stale: >-
              {{ (_ph_hosts.json.config.dns.hosts | default([]))
                 | select('search', '\\s' ~ (wiring_domain | regex_escape) ~ '$')
                 | reject('equalto', _ph_entry) | list }}
            _ph_present: >-
              {{ _ph_entry in (_ph_hosts.json.config.dns.hosts | default([])) }}

        # A changed upstream IP would otherwise leave two records for the same FQDN and
        # Pi-hole would answer with both.
        - name: Wire Pihole | Delete stale records for this FQDN
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts/{{ item | urlencode }}"
            method: DELETE
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: [200, 204, 404]
          loop: "{{ _ph_stale }}"
          changed_when: true
          no_log: true

        - name: Wire Pihole | Add DNS record
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts/{{ _ph_entry | urlencode }}"
            method: PUT
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: [200, 201]
          when: not (_ph_present | bool)
          changed_when: true
          no_log: true

        - name: Wire Pihole | Verify record is present
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts"
            method: GET
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: 200
          register: _ph_verify
          changed_when: false
          no_log: true

        - name: Wire Pihole | Assert record is present
          ansible.builtin.assert:
            that:
              - _ph_entry in (_ph_verify.json.config.dns.hosts | default([]))
            fail_msg: "Pi-hole has no custom DNS record '{{ _ph_entry }}' after wiring."
      always:
        - name: Wire Pihole | Close API session
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/auth"
            method: DELETE
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: [200, 204, 401]
          changed_when: false
          failed_when: false
          no_log: true
