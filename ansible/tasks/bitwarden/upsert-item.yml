---
# Canonical organization-owned item upsert with exact readback verification.
# Inputs:
#   vault_item_name          homelab-infra/<role> or homelab-infra/media/<instance>
#   vault_item_fields        mapping of field names to values
#   vault_item_secret_fields names stored as hidden fields (default: every field)
# Optional: vault_organization_name, vault_collection_name
#   vault_item_merge         when true, fields already stored under names this call
#                            does not mention are preserved instead of dropped.
#                            Default false: the item is exactly vault_item_fields.
#                            Set it when a role writes the same item more than once
#                            in a run, each time with part of the field set.

- name: Vault | Assert upsert inputs
  ansible.builtin.assert:
    that:
      - vault_item_name is defined
      - vault_item_name is match('^homelab-infra/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+){0,2}$')
      - vault_item_fields is mapping
      - vault_item_fields | length > 0
    fail_msg: "Vault item upsert requires a canonical item name and non-empty field mapping."
  no_log: true

- name: Vault | Verify the execution session
  ansible.builtin.import_tasks: authenticate.yml

- name: Vault | List accessible organizations
  ansible.builtin.command:
    argv: [bw, list, organizations]
  register: _vault_orgs
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Resolve the canonical organization
  ansible.builtin.set_fact:
    _vault_org_id: >-
      {{ (_vault_orgs.stdout | from_json
          | selectattr('name', 'equalto', vault_organization_name | default('homelab-infra'))
          | map(attribute='id') | list | first) | default('') }}
  no_log: true

- name: Vault | Assert the canonical organization exists
  ansible.builtin.assert:
    that: _vault_org_id | length > 0
    fail_msg: >-
      The automation account cannot see organization
      {{ vault_organization_name | default('homelab-infra') }}.

# stderr carries the CLI's diagnostic string, never the listed items, so reporting a
# bounded slice of it is safe and is the only way to see why a read was refused.
- name: Vault | List organization collections
  ansible.builtin.command:
    argv: [bw, list, org-collections, --organizationid, "{{ _vault_org_id }}"]
  register: _vault_collections
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Report a refused collection listing
  ansible.builtin.fail:
    msg: >-
      Vaultwarden refused to list collections for organization
      {{ vault_organization_name | default('homelab-infra') }}
      (rc={{ _vault_collections.rc }}):
      {{ (_vault_collections.stderr | default('') | trim)[:500] }}
  when: _vault_collections.rc != 0

- name: Vault | Resolve the canonical collection
  ansible.builtin.set_fact:
    _vault_collection_id: >-
      {{ (_vault_collections.stdout | from_json
          | selectattr('name', 'equalto', vault_collection_name | default('platform-secrets'))
          | map(attribute='id') | list | first) | default('') }}
  no_log: true

# A freshly created organization contains only the web vault's auto-created
# "Default Collection". Requiring the operator to hand-create a collection named
# exactly platform-secrets made enrollment depend on an instruction that appeared
# only in job output. The canonical collection is platform state, so the platform
# creates it. Confirmed members are granted manage rights so the human owner keeps
# recovery access to everything stored here.
- name: Vault | List organization members
  ansible.builtin.command:
    argv: [bw, list, org-members, --organizationid, "{{ _vault_org_id }}"]
  register: _vault_members
  when: _vault_collection_id | length == 0
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

# The collection payload is assembled by python3 rather than Jinja: a {% %} loop
# renders to a string, and to_json would then emit the member list as a JSON
# string instead of an array. Status 2 is Confirmed; invited or accepted members
# cannot hold collection rights yet.
#
# `| from_json | to_json` on a captured stdout is load-bearing, not decoration, and
# every environment variable in this file that carries JSON needs it. Ansible
# converts a rendered template that parses as a data structure back INTO one, then
# stringifies it for the environment — so `{{ result.stdout }}` holding
# `{"a": "b"}` arrives at python as `{'a': 'b'}` and json.loads dies at column 2.
# Round-tripping through to_json marks the value as text and it survives intact.
# (This is why the item write below already works: its values are to_json output.)
- name: Vault | Create the canonical collection
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c '
    import json, os, sys
    members = json.loads(os.environ["VAULT_ORG_MEMBERS"])
    json.dump({
        "organizationId": os.environ["VAULT_ORG_ID"],
        "name": os.environ["VAULT_COLLECTION_NAME"],
        "externalId": None,
        "groups": [],
        "users": [{"id": m["id"], "readOnly": False,
                   "hidePasswords": False, "manage": True}
                  for m in members if m.get("status") == 2],
    }, sys.stdout)
    ' | bw encode | bw create org-collection --organizationid "$VAULT_ORG_ID"
  args:
    executable: /bin/bash
  environment:
    VAULT_ORG_ID: "{{ _vault_org_id }}"
    VAULT_COLLECTION_NAME: "{{ vault_collection_name | default('platform-secrets') }}"
    VAULT_ORG_MEMBERS: "{{ _vault_members.stdout | from_json | to_json }}"
  when: _vault_collection_id | length == 0
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Re-list organization collections after creation
  ansible.builtin.command:
    argv: [bw, list, org-collections, --organizationid, "{{ _vault_org_id }}"]
  register: _vault_collections_recheck
  when: _vault_collection_id | length == 0
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Resolve the created collection
  ansible.builtin.set_fact:
    _vault_collection_id: >-
      {{ (_vault_collections_recheck.stdout | from_json
          | selectattr('name', 'equalto', vault_collection_name | default('platform-secrets'))
          | map(attribute='id') | list | first) | default('') }}
  when: _vault_collection_id | length == 0
  no_log: true

- name: Vault | Assert the canonical collection exists
  ansible.builtin.assert:
    that: _vault_collection_id | length > 0
    fail_msg: >-
      Collection {{ vault_collection_name | default('platform-secrets') }} is
      neither visible to nor creatable by the automation account in organization
      {{ vault_organization_name | default('homelab-infra') }}.

# ── Collection scoping (slice 016, decided 2026-08-09) ────────────────────────
# The automation account reached platform items purely by being an organization
# Admin — organization-scoped access, not collection-scoped, so the slice's own
# criterion was unmet. An explicit grant on the canonical collection is what scopes
# it, and on a Manager or User membership these tasks establish and prove one on
# every run, self-healing rather than depending on a one-shot enrollment step.
#
# On an Owner or Admin membership no such grant can exist at all — see the note at
# the decision task below — so the tasks state that plainly instead of asserting
# something the server will not store.
#
# A collection this run creates already grants every confirmed member above, subject
# to the same rule. These tasks are the repair path for a collection that predates
# the decision, and they run once per play — the guard fact survives the whole run,
# so nine upserts cost one check, not nine.
- name: Vault | Identify the account the session belongs to
  ansible.builtin.command:
    argv: [bw, status]
  register: _vault_status
  when: not (_vault_collection_grant_verified | default(false))
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | List organization members to resolve the account's membership
  ansible.builtin.command:
    argv: [bw, list, org-members, --organizationid, "{{ _vault_org_id }}"]
  register: _vault_grant_members
  when: not (_vault_collection_grant_verified | default(false))
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Resolve the account's organization membership
  ansible.builtin.set_fact:
    _vault_self_member_id: "{{ (_vault_self_member | default({})).id | default('') }}"
    # Owner (0) and Admin (1) hold organization-wide access; `accessAll` states it
    # outright on servers whose CLI still reports the field.
    _vault_self_org_wide: >-
      {{ (_vault_self_member | default({})).accessAll
         | default(((_vault_self_member | default({})).type | default(9)) in [0, 1]) }}
  vars:
    _vault_self_member: >-
      {{ (_vault_grant_members.stdout | from_json
          | selectattr('email', 'equalto',
                       (_vault_status.stdout | from_json).userEmail | default(''))
          | list | first) | default({}) }}
  when: not (_vault_collection_grant_verified | default(false))
  no_log: true

- name: Vault | Assert the account is a member of the canonical organization
  ansible.builtin.assert:
    that: _vault_self_member_id | length > 0
    fail_msg: >-
      The session's account is not listed among the members of organization
      {{ vault_organization_name | default('homelab-infra') }}, so no
      collection grant can be resolved for it.
  when: not (_vault_collection_grant_verified | default(false))

# Vaultwarden will not store a per-collection grant for a member that already has
# organization-wide access. `post_organization_collection_update` walks the submitted
# `users` array and does `if member.access_all { continue; }` before CollectionUser::save
# (verified in 1.37.1, the version this lab runs), so the write is ACCEPTED, returns 200,
# and persists nothing. Asserting the grant afterwards therefore fails forever and takes
# every deploy that stores a secret down with it.
#
# What ships is organization-scoped Admin, and that is settled — see the decision in
# 016/notes.md. The grant is still established and asserted on a Manager or User
# membership, because a lab that runs one gets a working scoped account for free; an
# Owner/Admin membership simply proceeds. Neither path asks anyone to change a role.
- name: Vault | Decide whether an explicit collection grant can exist
  ansible.builtin.set_fact:
    _vault_grant_check_due: "{{ not _vault_self_org_wide }}"
  when: not (_vault_collection_grant_verified | default(false))

- name: Vault | Note that the account's access is organization-scoped
  ansible.builtin.debug:
    msg: >-
      The automation account holds an Owner/Admin membership in
      {{ vault_organization_name | default('homelab-infra') }}, so its access to
      {{ vault_collection_name | default('platform-secrets') }} is organization-scoped
      and Vaultwarden stores no explicit collection grant for it. This is the shipped
      arrangement; no action is required.
    verbosity: 1
  when:
    - not (_vault_collection_grant_verified | default(false))
    - _vault_self_org_wide

# `bw get org-collection` returns the collection with its `groups` and `users`
# arrays; `bw list org-collections` does not carry them. The edit below rewrites
# the object wholesale, so the read has to be the detailed one — a payload with no
# `users` key would silently erase every existing grant, which is why the next
# task fails on that shape instead of proceeding.
- name: Vault | Read the canonical collection's grants
  ansible.builtin.command:
    argv:
      - bw
      - get
      - org-collection
      - "{{ _vault_collection_id }}"
      - --organizationid
      - "{{ _vault_org_id }}"
  register: _vault_collection_detail
  when: _vault_grant_check_due | default(false)
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Determine whether the account already holds a grant
  ansible.builtin.set_fact:
    _vault_collection_users: >-
      {{ (_vault_collection_detail.stdout | from_json).users | default(none) }}
  when: _vault_grant_check_due | default(false)
  no_log: true

- name: Vault | Assert the collection detail carries its grant list
  ansible.builtin.assert:
    that: _vault_collection_users is not none
    fail_msg: >-
      Vaultwarden returned collection
      {{ vault_collection_name | default('platform-secrets') }} without a `users`
      list. Rewriting it would drop every existing grant, so the run stops here.
  when: _vault_grant_check_due | default(false)

# Manage rights, matching what the create path grants confirmed members: the
# account has to write items and keep the collection usable without depending on
# an administrator role.
- name: Vault | Grant the account explicit access to the canonical collection
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c '
    import json, os, sys
    collection = json.loads(os.environ["VAULT_COLLECTION_JSON"])
    users = [u for u in collection.get("users", [])
             if u.get("id") != os.environ["VAULT_SELF_MEMBER_ID"]]
    users.append({"id": os.environ["VAULT_SELF_MEMBER_ID"], "readOnly": False,
                  "hidePasswords": False, "manage": True})
    collection["users"] = users
    json.dump(collection, sys.stdout)
    ' | bw encode | bw edit org-collection "$VAULT_COLLECTION_ID" \
        --organizationid "$VAULT_ORG_ID"
  args:
    executable: /bin/bash
  environment:
    VAULT_COLLECTION_ID: "{{ _vault_collection_id }}"
    VAULT_COLLECTION_JSON: "{{ _vault_collection_detail.stdout | from_json | to_json }}"
    VAULT_ORG_ID: "{{ _vault_org_id }}"
    VAULT_SELF_MEMBER_ID: "{{ _vault_self_member_id }}"
  when:
    - _vault_grant_check_due | default(false)
    - _vault_collection_users | default([])
      | selectattr('id', 'equalto', _vault_self_member_id)
      | selectattr('manage', 'defined') | selectattr('manage') | list | length == 0
  register: _vault_grant_write
  failed_when: false
  changed_when: _vault_grant_write.rc == 0
  delegate_to: localhost
  become: false
  no_log: true

# Same reasoning as the item write below, and the reason this slice spent a run
# knowing only that the grant failed: under no_log every refusal reads `censored`.
# The CLI reports errors as short diagnostic strings and the collection object
# carries encrypted names, member ids and grant flags — no item material — so a
# bounded slice of stderr is safe and is the only way to see why a write was refused.
- name: Vault | Report a rejected collection grant
  ansible.builtin.fail:
    msg: >-
      Vaultwarden refused the collection grant for
      {{ vault_collection_name | default('platform-secrets') }}
      (rc={{ _vault_grant_write.rc }}, collection payload
      {{ _vault_collection_detail.stdout | default('') | length }} bytes):
      {{ (_vault_grant_write.stderr | default('') | trim)[-600:] }}
      {{ (_vault_grant_write.stdout | default('') | trim)[:200] }}
  when: _vault_grant_write.rc | default(0) != 0

# `bw get` answers from the CLI's local vault cache, so a readback issued straight
# after a successful write re-reads the pre-write copy and reports the grant
# missing. The item write below already sequences its readback behind a sync for
# the same reason.
- name: Vault | Synchronize after the collection grant
  ansible.builtin.command:
    argv: [bw, sync]
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  when: _vault_grant_write is changed

- name: Vault | Read the grants back
  ansible.builtin.command:
    argv:
      - bw
      - get
      - org-collection
      - "{{ _vault_collection_id }}"
      - --organizationid
      - "{{ _vault_org_id }}"
  register: _vault_collection_readback
  when: _vault_grant_check_due | default(false)
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Assert the account holds an explicit collection grant
  ansible.builtin.assert:
    that:
      - (_vault_collection_readback.stdout | from_json).users | default([])
        | selectattr('id', 'equalto', _vault_self_member_id)
        | selectattr('manage', 'defined') | selectattr('manage')
        | list | length == 1
    fail_msg: >-
      The automation account ({{ _vault_self_member_id }}) still holds no explicit
      grant on collection {{ vault_collection_name | default('platform-secrets') }}.
      Until it does, its access depends on the organization-wide admin flag.
      The collection came back holding:
      {{ (_vault_collection_readback.stdout | from_json).users | default([]) }}
  when: _vault_grant_check_due | default(false)

# Both facts: the second stops the later upserts in this run re-entering the grant
# tasks on a membership whose check already settled, whichever way it settled.
- name: Vault | Record that the collection grant was settled this run
  ansible.builtin.set_fact:
    _vault_collection_grant_verified: true
    _vault_grant_check_due: false

- name: Vault | List exact-name item candidates
  ansible.builtin.command:
    argv: [bw, list, items, --search, "{{ vault_item_name }}"]
  register: _vault_candidates
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Resolve existing canonical item
  ansible.builtin.set_fact:
    _vault_existing_items: >-
      {{ _vault_candidates.stdout | from_json
         | selectattr('name', 'equalto', vault_item_name) | list }}
  no_log: true

- name: Vault | Reject duplicate canonical items
  ansible.builtin.assert:
    that: _vault_existing_items | length <= 1
    fail_msg: "More than one Vaultwarden item is named {{ vault_item_name }}."

# The write replaces `fields` wholesale, so what it would store has to be resolved
# before it can be compared or sent. Under merge, fields already present under names
# this call does not mention are carried forward at their stored value and hidden-ness;
# otherwise the effective set is exactly what the caller asked for.
# Values are strings throughout because the payload stringifies them (`str(v)`).
- name: Vault | Resolve the stored and effective field sets
  ansible.builtin.set_fact:
    _vault_stored_values: >-
      {{ dict(_vault_stored_fields | map(attribute='name') | list
              | zip(_vault_stored_fields | map(attribute='value') | map('string') | list)) }}
    _vault_stored_hidden: >-
      {{ _vault_stored_fields | selectattr('type', 'equalto', 1)
         | map(attribute='name') | sort | list }}
    _vault_effective_values: >-
      {{ (dict(_vault_stored_fields | map(attribute='name') | list
               | zip(_vault_stored_fields | map(attribute='value') | map('string') | list))
           | combine(_vault_desired_values))
         if (vault_item_merge | default(false) | bool) else _vault_desired_values }}
    _vault_effective_hidden: >-
      {{ (((_vault_stored_fields | selectattr('type', 'equalto', 1) | map(attribute='name') | list)
            | reject('in', vault_item_fields.keys() | list) | list)
          + _vault_desired_hidden) | unique | sort
         if (vault_item_merge | default(false) | bool) else _vault_desired_hidden }}
  vars:
    _vault_stored_fields: "{{ (_vault_existing_items | first | default({})).fields | default([]) }}"
    _vault_desired_values: >-
      {{ dict(vault_item_fields.keys() | list
              | zip(vault_item_fields.values() | map('string') | list)) }}
    _vault_desired_hidden: >-
      {{ (vault_item_secret_fields | default(vault_item_fields.keys() | list))
         | sort | list }}
  no_log: true

# Comparing before writing is what makes a re-run converge: without it every
# bootstrap pass re-encrypts and re-uploads every platform secret, reporting
# `changed` forever and rewriting items that nothing asked to change.
- name: Vault | Compare the stored item with the effective one
  ansible.builtin.set_fact:
    _vault_item_matches: >-
      {{ _vault_existing_items | length == 1
         and (_vault_existing_items | first).name | default('') == vault_item_name
         and _vault_collection_id in ((_vault_existing_items | first).collectionIds | default([]))
         and _vault_stored_values == _vault_effective_values
         and _vault_stored_hidden == _vault_effective_hidden }}
  no_log: true

# The Bitwarden CLI requires encoded item JSON as a positional value. The payload
# is assembled by python3 for the same typing reason as the collection payload,
# and because it keeps the plaintext out of both the command line and Ansible's
# recorded module arguments. Field values are read from a JSON environment
# variable, so no secret is interpolated into the script text.
- name: Vault | Create or update the canonical item
  ansible.builtin.shell: |
    set -euo pipefail
    payload="$(python3 -c '
    import json, os, sys
    existing = json.loads(os.environ["VAULT_EXISTING_ITEM"])
    values = json.loads(os.environ["VAULT_ITEM_FIELDS"])
    hidden = set(json.loads(os.environ["VAULT_SECRET_FIELDS"]))
    existing.update({
        "type": 2,
        "name": os.environ["VAULT_ITEM_NAME"],
        "notes": "Managed by homelab-infra. Do not rename fields.",
        "organizationId": os.environ["VAULT_ORG_ID"],
        "collectionIds": [os.environ["VAULT_COLLECTION_ID"]],
        "secureNote": {"type": 0},
        "fields": [{"name": k, "value": str(v), "type": 1 if k in hidden else 0}
                   for k, v in values.items()],
    })
    json.dump(existing, sys.stdout)
    ')"
    encoded="$(printf '%s' "$payload" | bw encode)"
    if [ -n "$VAULT_ITEM_ID" ]; then
      bw edit item "$VAULT_ITEM_ID" "$encoded"
    else
      bw create item "$encoded"
    fi
  args:
    executable: /bin/bash
  environment:
    VAULT_ITEM_NAME: "{{ vault_item_name }}"
    VAULT_ORG_ID: "{{ _vault_org_id }}"
    VAULT_COLLECTION_ID: "{{ _vault_collection_id }}"
    VAULT_EXISTING_ITEM: "{{ _vault_existing_items | first | default({}) | to_json }}"
    VAULT_ITEM_ID: "{{ (_vault_existing_items | first | default({})).id | default('') }}"
    VAULT_ITEM_FIELDS: "{{ _vault_effective_values | to_json }}"
    VAULT_SECRET_FIELDS: "{{ _vault_effective_hidden | to_json }}"
  register: _vault_upsert
  failed_when: false
  changed_when: _vault_upsert.rc == 0
  delegate_to: localhost
  become: false
  no_log: true
  when: not _vault_item_matches

# no_log on the write hides the real rejection reason and turns every CLI error
# into an uninformative censored failure. The CLI reports errors as short
# diagnostic strings and never echoes the submitted item, so surfacing a bounded
# slice of stderr is safe and is the only way to debug a rejected write.
- name: Vault | Report a rejected canonical item write
  ansible.builtin.fail:
    msg: >-
      Vaultwarden rejected the write for {{ vault_item_name }}
      (rc={{ _vault_upsert.rc }}):
      {{ (_vault_upsert.stderr | default('') | trim)[:500] }}
      {{ (_vault_upsert.stdout | default('') | trim)[:200] }}
  when: _vault_upsert.rc | default(0) != 0

- name: Vault | Synchronize after write
  ansible.builtin.command:
    argv: [bw, sync]
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  when: not _vault_item_matches

# The readback and its assert run on every pass, including one that skipped the
# write: verifying what the vault actually holds is the point, and a converged run
# is exactly when an unnoticed drift would hide. The id therefore comes from the
# write when one happened and from the item already found when one did not.
- name: Vault | Resolve the stored item's id
  ansible.builtin.set_fact:
    _vault_item_id: >-
      {{ (_vault_upsert.stdout | from_json).id
         if (_vault_upsert.stdout | default('') | length > 0)
         else (_vault_existing_items | first).id }}
  no_log: true

- name: Vault | Read the stored item back
  ansible.builtin.command:
    argv: [bw, get, item, "{{ _vault_item_id }}"]
  register: _vault_readback
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Vault | Verify exact field readback
  ansible.builtin.assert:
    that:
      - _vault_readback_fields == _vault_effective_values
    fail_msg: "Vaultwarden readback verification failed for {{ vault_item_name }}."
  vars:
    _vault_readback_fields: >-
      {{ dict((_vault_readback.stdout | from_json).fields | default([])
              | map(attribute='name')
              | zip((_vault_readback.stdout | from_json).fields | default([])
                    | map(attribute='value'))) }}
  no_log: true
