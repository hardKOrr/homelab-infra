---
# Delete one canonical organization item by exact name, then read back that it is gone.
# A missing item is already the outcome: nothing changes.
# Inputs:
#   vault_item_name   homelab-infra/<...>, the exact item name (as upsert-item.yml takes it)
# The item's fields never reach the output: only its name and the CLI's stderr do.
- name: Vault delete | Require a canonical item name
  ansible.builtin.assert:
    that: vault_item_name | default('') is match('^homelab-infra/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+){0,2}$')
    fail_msg: "delete-item.yml needs a canonical item name, not '{{ vault_item_name | default('') }}'."

- name: Vault delete | Verify the execution session
  ansible.builtin.include_tasks: authenticate.yml

- name: Vault delete | Find the item
  ansible.builtin.command:
    argv: [bw, list, items, --search, "{{ vault_item_name }}"]
  register: _vault_delete_candidates
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true  # stdout lists the matching items with their fields

- name: Vault delete | Require the item listing
  ansible.builtin.assert:
    that: _vault_delete_candidates.rc == 0
    fail_msg: >-
      Vaultwarden refused to list items named {{ vault_item_name }} (rc
      {{ _vault_delete_candidates.rc }}): {{ _vault_delete_candidates.stderr | default('') | truncate(300) }}

- name: Vault delete | Resolve the exact item
  ansible.builtin.set_fact:
    _vault_delete_ids: >-
      {{ _vault_delete_candidates.stdout | from_json
         | selectattr('name', 'equalto', vault_item_name) | map(attribute='id') | list }}

- name: Vault delete | Delete the item
  ansible.builtin.command:
    argv: [bw, delete, item, "{{ item }}"]
  loop: "{{ _vault_delete_ids }}"
  register: _vault_deleted
  changed_when: true
  delegate_to: localhost
  become: false

# `bw list` answers from the CLI's local cache, so sync before reading back.
- name: Vault delete | Synchronize and read back
  ansible.builtin.shell: bw sync >/dev/null && bw list items --search "$VAULT_ITEM_NAME"
  environment:
    VAULT_ITEM_NAME: "{{ vault_item_name }}"
  register: _vault_delete_readback
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true  # stdout lists the matching items with their fields
  when: _vault_delete_ids | length > 0

- name: Vault delete | Require the item gone
  ansible.builtin.assert:
    that:
      - _vault_delete_readback.rc == 0
      - >-
        _vault_delete_readback.stdout | from_json
        | selectattr('name', 'equalto', vault_item_name) | list | length == 0
    fail_msg: >-
      {{ vault_item_name }} is still in Vaultwarden after the delete, or the readback
      failed (rc {{ _vault_delete_readback.rc }}): {{ _vault_delete_readback.stderr | default('') | truncate(300) }}
  when: _vault_delete_ids | length > 0
