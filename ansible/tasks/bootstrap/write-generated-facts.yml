---
# Write service connection details to config/.generated/facts.yml after a baseline
# service is deployed. Called by bootstrap.yml after each baseline service comes up.
#
# The file grows incrementally — each call deep-merges one top-level key. Subsequent
# services and all app deploys load the whole file into homelabinfra_infra
# (see ansible/vars/CONTRACT.md §3 — canonical Shape B, role-keyed).
#
# Inputs:
#   generated_facts_service:  top-level key to merge under — a Shape B role key
#                             (reverse_proxy | sso | notifications | monitoring |
#                             metrics | dns | backups | vaultwarden) or 'domain'
#   generated_facts_data:     dict to deep-merge under that key (scalar for 'domain')
#   generated_facts_estate:   optional estate name (the app's routing.estate). When it
#                             names a non-default estate from config/infrastructure.yml's
#                             domains map, the key merges under estates.<name>.<key>
#                             instead of top-level — estate-scoped facts read back by
#                             tasks/resolve-estate.yml. Empty/default estate writes
#                             top-level exactly as before.
#   generated_facts_file:     REQUIRED — absolute path of config/.generated/facts.yml.
#                             The caller supplies it because `playbook_dir` differs by
#                             caller: bootstrap.yml sits in playbooks/ and the app
#                             playbooks sit one level deeper in playbooks/apps/. This used
#                             to be derived here as `playbook_dir ~ '/../../config/...'`,
#                             which is right for bootstrap.yml and WRONG for every app —
#                             they silently wrote ansible/config/.generated/facts.yml, a
#                             path nothing reads, while reading the real file three levels
#                             up. Every registry key an app recorded was therefore lost, so
#                             no service could discover the endpoints of the one before it.
#                             Same reasoning as tasks/vaultwarden/token-sink.yml and
#                             tasks/config/run-doctor.yml, which already require it.
#
# Any `host` value written here is a full base URL including scheme
# (e.g. http://192.168.1.20) — consumers concatenate paths onto it directly.
#
# All writes happen on the control node. The file is topology only; credential-
# shaped fields are rejected before the existing file is touched.

- name: Generated facts | Assert inputs
  ansible.builtin.assert:
    that:
      - generated_facts_service is defined
      - generated_facts_service is string
      - generated_facts_service | length > 0
      - generated_facts_data is defined
      - generated_facts_file is defined
      - generated_facts_file | length > 0
    fail_msg: >-
      write-generated-facts.yml requires generated_facts_service (string),
      generated_facts_data (dict, or scalar for 'domain') and generated_facts_file
      (the path to config/.generated/facts.yml — the caller owns it, because
      playbook_dir differs between playbooks/ and playbooks/apps/).

- name: Generated facts | Resolve output path
  ansible.builtin.set_fact:
    _generated_facts_file: "{{ generated_facts_file }}"

- name: Generated facts | Reject credential-shaped fields
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ _generated_facts_file | dirname | dirname | dirname }}/ansible/scripts/secret-shape.py"
    stdin: "{{ generated_facts_data | to_json }}"
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

# Estate scoping mirrors tasks/resolve-estate.yml: a multi-estate map has one explicit
# default; a single estate is unambiguous without the marker.
- name: Generated facts | Load domain declarations
  ansible.builtin.include_vars:
    file: "{{ _generated_facts_file | dirname }}/../infrastructure.yml"
    name: _generated_facts_infra_cfg
  failed_when: false

- name: Generated facts | Compute estate defaults
  ansible.builtin.set_fact:
    _gf_domains: "{{ (_generated_facts_infra_cfg | default({})).domains | default({}) }}"
    _gf_defaults: >-
      {{ (_generated_facts_infra_cfg | default({})).domains | default({}) | dict2items
         | selectattr('value.default', 'defined')
         | selectattr('value.default')
         | map(attribute='key') | list }}

- name: Generated facts | Require one explicit multi-estate default
  ansible.builtin.assert:
    that: _gf_defaults | length == 1
    fail_msg: >-
      A multi-estate infrastructure.yml must declare exactly one domains.<estate>.default:
      true. Declaration order does not decide the default estate.
  when: _gf_domains | length > 1

- name: Generated facts | Resolve estate scope
  ansible.builtin.set_fact:
    _generated_facts_estate: >-
      {{ '' if _gf_estate == _gf_default else _gf_estate }}
  vars:
    _gf_estate: "{{ generated_facts_estate | default('', true) }}"
    _gf_default: >-
      {{ (_gf_defaults | first)
         | default(_gf_domains | list | first | default(''), true) }}

- name: Generated facts | Ensure config/.generated exists
  ansible.builtin.file:
    path: "{{ _generated_facts_file | dirname }}"
    state: directory
    mode: "0750"
  become: false
  delegate_to: localhost

- name: Generated facts | Merge and write facts for {{ generated_facts_service }}
  ansible.builtin.copy:
    dest: "{{ _generated_facts_file }}"
    mode: "0600"
    content: >-
      {{ (lookup('ansible.builtin.file', _generated_facts_file, errors='ignore')
          | from_yaml
          | default({}, true))
         | combine({'estates': {_generated_facts_estate:
                                {generated_facts_service: generated_facts_data}}}
                   if _generated_facts_estate | length > 0
                   else {generated_facts_service: generated_facts_data},
                   recursive=True)
         | to_nice_yaml(indent=2) }}
  become: false
  delegate_to: localhost
