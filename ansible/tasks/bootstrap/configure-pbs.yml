---
# Configure Proxmox Backup Server after its VM is deployed (bootstrap step 7).
# Runs in a localhost play after PBS is deployed.
#
# Architecture note: PBS cannot pull guest backups from PVE. Remote sync jobs use other
# PBS instances; an optional local sync job can copy between datastores on this PBS.
# The primary configuration direction is:
#   PBS side (REST API, port 8007 — NOT the PVE API):
#     1. Ensure datastore exists at infrastructure.backups.datastore_path
#     2. Apply the garbage-collection schedule on the datastore
#     3. Create/update a scheduled prune job with the effective retention policy
#     4. Point a webhook notification target + matcher at Ntfy
#   PVE side (REST API, port 8006):
#     5. Register PBS as a storage backend (with the PBS cert fingerprint)
#     6. Create a vzdump backup job covering every guest tagged `_+lab`
#
# PVE backup jobs cannot select guests by tag, so the job is created with the
# explicit vmid list of `_+lab`-tagged guests at configure time.
# Re-running this task refreshes the list (fire-and-forget: bootstrap runs PBS
# last, after all baseline guests exist).
#
# Inputs:
#   pbs_api_host          — PBS base URL, e.g. https://192.168.1.30:8007
#   pbs_api_token_id      — PBS API token, e.g. root@pam!ansible
#   pbs_api_token_secret  — token secret (from Vaultwarden; created by slice 406)
#   pbs_instance          — optional Proxmox hostname of the PBS VM, default 'pbs'
#   pbs_datastore_name    — optional, default 'homelab'
#   pbs_datastore_mode    — create (default) or reuse: require the recovered
#                           registration/path and never initialise a datastore
#   homelabinfra_config.infrastructure.backups.{datastore_path, schedule, retention,
#     prune_schedule, gc_schedule}
#   homelabinfra_config.proxmox.{api_host, api_port, api_user, api_token_id, api_token_secret}
#   homelabinfra_infra.notifications — optional (Shape B); when provider == 'ntfy',
#     PBS notifications and the configure-complete test message go to Ntfy
#
# PBS runs backups autonomously after this — Ansible does not execute backups.

- name: PBS | Assert required inputs
  ansible.builtin.assert:
    that:
      - pbs_api_host is defined
      - pbs_api_token_id is defined
      - pbs_api_token_secret is defined
      - homelabinfra_config.infrastructure.backups.datastore_path is defined
      - homelabinfra_config.proxmox.api_host is defined
      - homelabinfra_config.proxmox.api_user is defined
      - homelabinfra_config.proxmox.api_token_id is defined
      - homelabinfra_config.proxmox.api_token_secret is defined
      - pbs_datastore_mode | default('create') in ['create', 'reuse']
    fail_msg: >-
      configure-pbs.yml requires pbs_api_host, pbs_api_token_id,
      pbs_api_token_secret, infrastructure.backups.datastore_path and the
      proxmox.* connection keys; pbs_datastore_mode must be create or reuse.

- name: PBS | Set connection facts
  ansible.builtin.set_fact:
    _pbs_url: "{{ pbs_api_host }}/api2/json"
    _pbs_headers:
      Authorization: "PBSAPIToken={{ pbs_api_token_id }}:{{ pbs_api_token_secret }}"
    _pve_url: >-
      https://{{ homelabinfra_config.proxmox.api_host }}:{{
        homelabinfra_config.proxmox.api_port | default(8006) }}/api2/json
    _pve_headers:
      Authorization: >-
        PVEAPIToken={{ homelabinfra_config.proxmox.api_user }}!{{
          homelabinfra_config.proxmox.api_token_id }}={{
          homelabinfra_config.proxmox.api_token_secret }}
    _pbs_datastore: "{{ pbs_datastore_name | default('homelab') }}"
    _pbs_prune_job_id: "homelab-infra-{{ pbs_datastore_name | default('homelab') }}"

- name: PBS | Resolve effective retention and schedules
  ansible.builtin.set_fact:
    _pbs_retention: "{{ homelabinfra_config.infrastructure.backups.retention | default({}) }}"
    _pbs_prune_schedule: >-
      {{ homelabinfra_config.infrastructure.backups.prune_schedule | default('03:00') }}
    _pbs_gc_schedule: >-
      {{ homelabinfra_config.infrastructure.backups.gc_schedule | default('04:00') }}

- name: PBS | Resolve retention options for the prune job
  ansible.builtin.set_fact:
    _pbs_keep: >-
      {{ dict(_pbs_retention | dict2items | selectattr('key', 'match', '^keep_')
              | map(attribute='key') | map('replace', '_', '-')
              | zip(_pbs_retention | dict2items | selectattr('key', 'match', '^keep_')
                    | map(attribute='value'))) }}

# ── PBS side ──────────────────────────────────────────────────────────────────

- name: PBS | List existing datastores
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/datastore"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_datastores

- name: PBS | Validate the retained datastore registration
  ansible.builtin.assert:
    that:
      - _pbs_registered | length <= 1
      - >-
        _pbs_registered | length == 0
        or (((_pbs_registered | first).path | default(''))
            | regex_replace('(?<=.)/+$', ''))
           == (homelabinfra_config.infrastructure.backups.datastore_path
               | regex_replace('(?<=.)/+$', ''))
      - pbs_datastore_mode | default('create') != 'reuse' or _pbs_registered | length == 1
    fail_msg: >-
      PBS datastore {{ _pbs_datastore }} does not have the expected retained registration
      at {{ homelabinfra_config.infrastructure.backups.datastore_path }}
      (mode={{ pbs_datastore_mode | default('create') }}).
      Both create and reuse require any same-name registration to match the declared path,
      ignoring trailing slashes. Recovery reuse also requires an existing datastore;
      refusing datastore creation or initialisation. Recover the datastore/configuration through
      its independently verified owner path before retrying. No datastore data was changed.
  vars:
    # Compare trailing-slash spelling only, preserving '/' and a missing/empty path
    # as distinct values. Do not resolve symlinks, mount identity, '.' or '..'.
    _pbs_registered: >-
      {{ _pbs_datastores.json.data | selectattr('name', 'equalto', _pbs_datastore) | list }}

- name: PBS | Create datastore {{ _pbs_datastore }}
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/datastore"
    method: POST
    headers: "{{ _pbs_headers }}"
    body_format: form-urlencoded
    body:
      name: "{{ _pbs_datastore }}"
      path: "{{ homelabinfra_config.infrastructure.backups.datastore_path }}"
    validate_certs: false
  when:
    - pbs_datastore_mode | default('create') == 'create'
    - >-
      _pbs_datastores.json.data
      | map(attribute='name') | list
      is not contains(_pbs_datastore)

# POST /config/datastore returns as soon as PBS has QUEUED the creation — the response is a
# UPID for a background task that builds the chunk store directory tree. The datastore is
# not usable until that finishes, and nothing downstream waits for it.
#
# That surfaced as a failure attributed to the wrong component: "Register PBS as a PVE
# storage backend" came back
#
#   create storage failed: pbs-homelab:
#   Cannot find datastore 'homelab', check permissions and existence!
#
# which reads like a permissions problem on a datastore that does not exist. Both were
# fine — ACL was Admin on / with propagate, and the datastore was there seconds later. PVE
# simply asked PBS before PBS had finished. Confirmed by the timestamps: /mnt/backup
# created at 21:15, the PVE registration failing at 21:15:41.
#
# Polling /admin/datastore rather than /config/datastore on purpose: the config endpoint
# lists what has been DECLARED, which is true the instant the POST returns, while the admin
# endpoint lists what is actually serving.
- name: PBS | Wait for the datastore to serve
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/admin/datastore"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_datastore_ready
  until: >-
    _pbs_datastore_ready.json.data | default([])
    | map(attribute='store') | list
    is contains(_pbs_datastore)
  retries: 30
  delay: 5
  changed_when: false

# PBS 3.4 rejects keep-* parameters on datastore config: retention is configured on
# prune jobs now. Keep the datastore update limited to its garbage-collection schedule.
- name: PBS | Read current datastore configuration
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/datastore/{{ _pbs_datastore }}"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_datastore_config

- name: PBS | Apply only a drifted garbage-collection schedule
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/datastore/{{ _pbs_datastore }}"
    method: PUT
    headers: "{{ _pbs_headers }}"
    body_format: form-urlencoded
    body:
      gc-schedule: "{{ _pbs_gc_schedule }}"
    validate_certs: false
  when: >-
    (_pbs_datastore_config.json.data['gc-schedule'] | default(none) | string)
    != (_pbs_gc_schedule | string)

- name: PBS | Build the desired scheduled prune-job configuration
  ansible.builtin.set_fact:
    _pbs_prune_job_config: >-
      {{ {'store': _pbs_datastore, 'schedule': _pbs_prune_schedule}
         | combine(_pbs_keep, recursive=True) }}

- name: PBS | Read configured prune jobs
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/prune"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_prune_jobs

- name: PBS | Resolve the managed datastore prune job
  ansible.builtin.set_fact:
    _pbs_managed_prune_jobs: >-
      {{ _pbs_prune_jobs.json.data
         | selectattr('id', 'equalto', _pbs_prune_job_id) | list }}
  changed_when: false

- name: PBS | Validate the managed prune-job identity
  ansible.builtin.assert:
    that:
      - _pbs_managed_prune_jobs | length <= 1
      - >-
        _pbs_managed_prune_jobs | length == 0
        or (_pbs_managed_prune_jobs | first).store == _pbs_datastore
    fail_msg: >-
      PBS prune job {{ _pbs_prune_job_id }} already belongs to a different datastore;
      refusing to overwrite it.

- name: PBS | Create the scheduled datastore prune job
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/prune"
    method: POST
    headers: "{{ _pbs_headers }}"
    body_format: form-urlencoded
    body: "{{ _pbs_prune_job_config | combine({'id': _pbs_prune_job_id}) }}"
    validate_certs: false
  when: _pbs_managed_prune_jobs | length == 0

- name: PBS | Update only drifted prune-job settings
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/prune/{{ _pbs_prune_job_id }}"
    method: PUT
    headers: "{{ _pbs_headers }}"
    body_format: form-urlencoded
    body: "{{ {item.key: item.value} }}"
    validate_certs: false
  loop: "{{ _pbs_prune_job_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - _pbs_managed_prune_jobs | length == 1
    - >-
      ((_pbs_managed_prune_jobs | first)[item.key] | default(none) | string)
      != (item.value | string)

- name: PBS | Configure Ntfy notifications
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'
    - homelabinfra_infra.notifications.host is defined
  vars:
    _ntfy_target_url: >-
      {{ homelabinfra_infra.notifications.host }}/{{
        homelabinfra_infra.notifications.topic | default('homelab') }}
    # PBS webhook bodies are base64-encoded handlebars templates — the braces
    # below are for PBS, not Jinja.
    _ntfy_body: |-
      {% raw %}{{ title }}

      {{ message }}{% endraw %}
  block:
    - name: PBS | List webhook notification targets
      ansible.builtin.uri:
        url: "{{ _pbs_url }}/config/notifications/endpoints/webhook"
        headers: "{{ _pbs_headers }}"
        validate_certs: false
      register: _pbs_webhooks

    # PBS webhook headers are `name=<header>,value=<base64>` entries. The Ntfy
    # publish token goes here because Ntfy is closed by default (slice 401); an
    # Ntfy predating that has no token and the header is omitted entirely.
    - name: PBS | Create Ntfy webhook notification target
      ansible.builtin.uri:
        url: "{{ _pbs_url }}/config/notifications/endpoints/webhook"
        method: POST
        headers: "{{ _pbs_headers }}"
        body_format: form-urlencoded
        body: >-
          {{ {
               'name': 'ntfy',
               'url': _ntfy_target_url,
               'method': 'post',
               'body': _ntfy_body | b64encode,
               'comment': 'managed by homelab-infra',
             }
             | combine({'header': ['name=Authorization,value='
                                   ~ (('Bearer ' ~ _ntfy_token) | b64encode)]}
                       if _ntfy_token | length > 0 else {}) }}
        validate_certs: false
      vars:
        _ntfy_token: "{{ homelabinfra_infra.notifications.token | default('') }}"
      no_log: true
      when: >-
        _pbs_webhooks.json.data
        | map(attribute='name') | list
        is not contains('ntfy')

    - name: PBS | List notification matchers
      ansible.builtin.uri:
        url: "{{ _pbs_url }}/config/notifications/matchers"
        headers: "{{ _pbs_headers }}"
        validate_certs: false
      register: _pbs_matchers

    - name: PBS | Route all notifications to the Ntfy target
      ansible.builtin.uri:
        url: "{{ _pbs_url }}/config/notifications/matchers"
        method: POST
        headers: "{{ _pbs_headers }}"
        body_format: form-urlencoded
        body:
          name: homelab-infra-ntfy
          target: ntfy
          comment: managed by homelab-infra
        validate_certs: false
      when: >-
        _pbs_matchers.json.data
        | map(attribute='name') | list
        is not contains('homelab-infra-ntfy')

- name: PBS | Read PBS certificate fingerprint
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/nodes/localhost/certificates/info"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_certs

# ── PVE side ──────────────────────────────────────────────────────────────────

- name: PBS | List PVE storage backends
  ansible.builtin.uri:
    url: "{{ _pve_url }}/storage"
    headers: "{{ _pve_headers }}"
    validate_certs: false
  register: _pve_storages

- name: PBS | Resolve the existing PVE storage entry
  ansible.builtin.set_fact:
    _pbs_pve_server: "{{ pbs_api_host | regex_replace('^https?://', '') | regex_replace(':\\d+$', '') }}"
    _pbs_pve_fingerprint: >-
      {{ _pbs_certs.json.data | selectattr('fingerprint', 'defined')
         | map(attribute='fingerprint') | first }}
    _pbs_existing_storage: >-
      {{ _pve_storages.json.data
         | selectattr('storage', 'equalto', 'pbs-homelab') | list }}

- name: PBS | Validate the existing PVE storage identity
  ansible.builtin.assert:
    that:
      - _pbs_existing_storage | length <= 1
      - >-
        _pbs_existing_storage | length == 0
        or (_pbs_existing_storage | first).type == 'pbs'
      - >-
        _pbs_existing_storage | length == 0
        or (_pbs_existing_storage | first).datastore | default('') == _pbs_datastore
    fail_msg: >-
      PVE storage pbs-homelab is ambiguous or owned by a different storage type.
      Refusing to replace its configuration.

- name: PBS | Detect a changed PVE storage endpoint
  ansible.builtin.set_fact:
    _pbs_storage_endpoint_changed: >-
      {{ _pbs_existing_storage | length == 1
         and (_pbs_existing_storage | first).server | default('') != _pbs_pve_server }}

- name: PBS | Read running PVE backup tasks before replacing the storage entry
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/tasks
      - --output-format
      - json
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  register: _pbs_backup_tasks_before_storage_replacement
  changed_when: false
  failed_when: false
  become: false
  no_log: true
  when: _pbs_storage_endpoint_changed | bool

- name: PBS | Require the PVE backup task query to succeed
  ansible.builtin.assert:
    that:
      - _pbs_backup_tasks_before_storage_replacement.rc | default(1) | int == 0
    fail_msg: >-
      PVE backup task query failed before storage replacement
      (rc={{ _pbs_backup_tasks_before_storage_replacement.rc | default('unavailable') }};
      error_class={{
        'command_not_found'
          if 'not found' in (_pbs_backup_tasks_before_storage_replacement.stderr | default('') | lower)
          else 'permission_denied'
          if 'permission' in (_pbs_backup_tasks_before_storage_replacement.stderr | default('') | lower)
             or 'denied' in (_pbs_backup_tasks_before_storage_replacement.stderr | default('') | lower)
          else 'unsupported_option'
          if 'unknown option' in (_pbs_backup_tasks_before_storage_replacement.stderr | default('') | lower)
             or 'unknown parameter' in (_pbs_backup_tasks_before_storage_replacement.stderr | default('') | lower)
          else 'other'
      }}).
  when: _pbs_storage_endpoint_changed | bool

- name: PBS | Resolve running PVE backup tasks before replacing the storage entry
  ansible.builtin.set_fact:
    _pbs_running_backup_tasks: >-
      {{ _pbs_backup_tasks_before_storage_replacement.stdout | from_json
         | selectattr('type', 'equalto', 'vzdump')
         | selectattr('endtime', 'undefined') | list }}
  no_log: true
  when: _pbs_storage_endpoint_changed | bool

- name: PBS | Refuse to replace the storage entry during a backup
  ansible.builtin.assert:
    that:
      - _pbs_running_backup_tasks | length == 0
    fail_msg: >-
      A PVE vzdump task is still running. Wait for it to finish before replacing
      the PBS storage endpoint.
  when: _pbs_storage_endpoint_changed | bool

- name: PBS | Check existing PVE storage health
  ansible.builtin.uri:
    url: "{{ _pve_url }}/nodes/{{ homelabinfra_config.proxmox.node }}/storage/pbs-homelab/status"
    headers: "{{ _pve_headers }}"
    validate_certs: false
    status_code: [200, 400, 500]
  register: _pbs_pve_status_before
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - _pbs_existing_storage | length == 1
    - not (_pbs_storage_endpoint_changed | bool)

- name: PBS | Read the existing PVE storage health result
  ansible.builtin.set_fact:
    _pbs_existing_storage_active: >-
      {{ _pbs_pve_status_before.status | default(0) == 200
         and (_pbs_pve_status_before.json.data.active | default(0) | int == 1) }}

- name: PBS | Decide whether the PVE storage entry needs repair
  ansible.builtin.set_fact:
    _pbs_storage_needs_update: >-
      {{ _pbs_existing_storage | length == 1
         and not (_pbs_storage_endpoint_changed | bool)
         and (
           (pbs_token_rotated | default(false) | bool)
           or ((_pbs_existing_storage | first).username | default('') != pbs_api_token_id)
           or ((_pbs_existing_storage | first).fingerprint | default('') != _pbs_pve_fingerprint)
           or ('backup' not in ((_pbs_existing_storage | first).content | default('')).split(','))
           or not (_pbs_existing_storage_active | default(false) | bool)
         ) }}

- name: PBS | Remove the old PVE storage endpoint
  ansible.builtin.uri:
    url: "{{ _pve_url }}/storage/pbs-homelab"
    method: DELETE
    headers: "{{ _pve_headers }}"
    validate_certs: false
  no_log: true
  when: _pbs_storage_endpoint_changed | bool

- name: PBS | Register PBS as a PVE storage backend
  ansible.builtin.uri:
    url: "{{ _pve_url }}/storage"
    method: POST
    headers: "{{ _pve_headers }}"
    body_format: form-urlencoded
    body:
      storage: pbs-homelab
      type: pbs
      server: "{{ _pbs_pve_server }}"
      datastore: "{{ _pbs_datastore }}"
      username: "{{ pbs_api_token_id }}"
      password: "{{ pbs_api_token_secret }}"
      fingerprint: "{{ _pbs_pve_fingerprint }}"
      content: backup
    validate_certs: false
  no_log: true
  when: >-
    _pbs_existing_storage | length == 0
    or (_pbs_storage_endpoint_changed | bool)

- name: PBS | Repair PVE storage endpoint and rotated API credentials
  ansible.builtin.uri:
    url: "{{ _pve_url }}/storage/pbs-homelab"
    method: PUT
    headers: "{{ _pve_headers }}"
    body_format: form-urlencoded
    body:
      username: "{{ pbs_api_token_id }}"
      password: "{{ pbs_api_token_secret }}"
      fingerprint: "{{ _pbs_pve_fingerprint }}"
      content: backup
      disable: 0
    validate_certs: false
  no_log: true
  when: _pbs_storage_needs_update | bool

- name: PBS | List PVE storage backends after repair
  ansible.builtin.uri:
    url: "{{ _pve_url }}/storage"
    headers: "{{ _pve_headers }}"
    validate_certs: false
  register: _pbs_storages_after_repair
  no_log: true

- name: PBS | Require one storage entry at the expected endpoint and datastore
  ansible.builtin.assert:
    that:
      - >-
        _pbs_storages_after_repair.json.data
        | selectattr('storage', 'equalto', 'pbs-homelab') | list | length == 1
      - >-
        (_pbs_storages_after_repair.json.data
         | selectattr('storage', 'equalto', 'pbs-homelab') | first).type == 'pbs'
      - >-
        (_pbs_storages_after_repair.json.data
         | selectattr('storage', 'equalto', 'pbs-homelab') | first).server == _pbs_pve_server
      - >-
        (_pbs_storages_after_repair.json.data
         | selectattr('storage', 'equalto', 'pbs-homelab') | first).datastore == _pbs_datastore
    fail_msg: >-
      PVE storage pbs-homelab is not unique or does not point to the configured PBS
      server and datastore.

# Only a registration created by this task is recorded in the node-root-private journal.
- name: PBS | Register provenance delegation
  ansible.builtin.include_tasks: ../proxmox/register-nodes.yml
  when: >-
    _pve_storages.json.data | map(attribute='storage') | list
    is not contains('pbs-homelab')

- name: PBS | Record newly created registration identity
  ansible.builtin.script:
    cmd: >-
      {{ (_luv_vars_file | dirname | dirname) ~ "/files/decommission/lab.py" | quote }}
      --node {{ homelabinfra_config.proxmox.node | quote }}
      --record storage --identity pbs-homelab --source configure-pbs
    executable: python3
  delegate_to: "{{ homelabinfra_config.proxmox.node }}"
  become: true
  when: _pbs_existing_storage | length == 0

- name: PBS | Wait for the PVE storage backend to be active
  ansible.builtin.uri:
    url: "{{ _pve_url }}/nodes/{{ homelabinfra_config.proxmox.node }}/storage/pbs-homelab/status"
    headers: "{{ _pve_headers }}"
    validate_certs: false
    status_code: [200, 400, 500]
  register: _pbs_pve_status_after
  changed_when: false
  failed_when: false
  until: >-
    _pbs_pve_status_after.status | default(0) == 200
    and (_pbs_pve_status_after.json.data.active | default(0) | int == 1)
  retries: 12
  delay: 5
  no_log: true

- name: PBS | Require the PVE storage backend to be active
  ansible.builtin.assert:
    that: >-
      _pbs_pve_status_after.status | default(0) == 200
      and (_pbs_pve_status_after.json.data.active | default(0) | int == 1)
    fail_msg: >-
      PVE storage pbs-homelab is not active with the current PBS address, fingerprint and
      API token. PBS deployment cannot report success while scheduled backups are unable
      to reach the datastore.

- name: PBS | Configure the optional second-copy datastore and restore source
  ansible.builtin.include_tasks: configure-pbs-second-copy.yml
  when: pbs_second_copy.enabled | default(false) | bool

- name: PBS | Read the managed second-copy sync job when the option is disabled
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/sync"
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  register: _pbs_second_copy_sync_jobs_when_disabled
  changed_when: false
  when: not (pbs_second_copy.enabled | default(false) | bool)

- name: PBS | Resolve the managed second-copy sync job when the option is disabled
  ansible.builtin.set_fact:
    _pbs_second_copy_disabled_jobs: >-
      {{ _pbs_second_copy_sync_jobs_when_disabled.json.data
         | selectattr('id', 'equalto', 'homelab-infra-second-copy') | list }}
  changed_when: false
  when: not (pbs_second_copy.enabled | default(false) | bool)

- name: PBS | Validate the managed second-copy sync job before disabling it
  ansible.builtin.assert:
    that:
      - _pbs_second_copy_disabled_jobs | length <= 1
      - >-
        _pbs_second_copy_disabled_jobs | length == 0
        or (_pbs_second_copy_disabled_jobs | first).store
           == (pbs_second_copy.datastore_name | default('homelab-copy'))
      - >-
        _pbs_second_copy_disabled_jobs | length == 0
        or (_pbs_second_copy_disabled_jobs | first)['remote-store'] == _pbs_datastore
      - >-
        _pbs_second_copy_disabled_jobs | length == 0
        or ((_pbs_second_copy_disabled_jobs | first).remote | default('') | length) == 0
    fail_msg: >-
      PBS sync job homelab-infra-second-copy is not the managed local second-copy job;
      refusing to remove it.
  when: not (pbs_second_copy.enabled | default(false) | bool)

- name: PBS | Remove the managed second-copy sync schedule when the option is disabled
  ansible.builtin.uri:
    url: "{{ _pbs_url }}/config/sync/homelab-infra-second-copy"
    method: DELETE
    headers: "{{ _pbs_headers }}"
    validate_certs: false
  no_log: true
  when:
    - not (pbs_second_copy.enabled | default(false) | bool)
    - _pbs_second_copy_disabled_jobs | length == 1

- name: PBS | Refresh managed backup job from current guests
  ansible.builtin.include_tasks: ../proxmox/refresh-backup-job.yml
  vars:
    backup_job_create_if_missing: true

# ── Confirm + record ──────────────────────────────────────────────────────────

- name: PBS | Send configure-complete test notification to Ntfy
  ansible.builtin.uri:
    url: >-
      {{ homelabinfra_infra.notifications.host }}/{{
        homelabinfra_infra.notifications.topic | default('homelab') }}
    method: POST
    headers: >-
      {{ {'Title': 'PBS backups configured'}
         | combine({'Authorization': 'Bearer ' ~ homelabinfra_infra.notifications.token}
                   if homelabinfra_infra.notifications.token | default('') | length > 0
                   else {}) }}
    body: >-
      Datastore '{{ _pbs_datastore }}' ready;
      {{ ('backup job covers ' ~ (_backup_job_vmids | split(',') | length)
          ~ " guest(s) on schedule '" ~ _backup_job_schedule ~ "'")
         if _backup_job_vmids | length > 0 else
         'backup job is disabled or was not created because no eligible guests were found' }}.
      PBS notifications route to this topic.
    body_format: raw
  changed_when: false
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'
    - homelabinfra_infra.notifications.host is defined

- name: PBS | Record PBS facts
  ansible.builtin.include_tasks:
    file: write-generated-facts.yml
  vars:
    generated_facts_service: backups
    generated_facts_data:
      instance: "{{ pbs_instance | default('pbs') }}"
      host: "{{ pbs_api_host }}"
      datastore: "{{ _pbs_datastore }}"
      datastore_path: "{{ homelabinfra_config.infrastructure.backups.datastore_path }}"
      api_token_id: "{{ pbs_api_token_id }}"
