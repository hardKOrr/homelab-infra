---
# Configure unattended-upgrades on a guest for automatic OS package updates.
# Called from guest-bootstrap.yml — the unattended-upgrades and apt-listchanges
# packages are already installed by that file's baseline package task.
#
# Inputs:
#   homelabinfra_infra.notifications — optional. When provider == 'ntfy', installs a
#     notify script plus a systemd drop-in so each unattended-upgrades run posts
#     "N package(s) updated on <hostname>" to Ntfy. Any other provider (or absent
#     facts) is a silent no-op — the apt configuration itself is still applied.
#
# Guest-held credential (narrow, deliberate exception to docs/specs/secrets-handling.md
# "no secret is ever written to a managed guest's filesystem"): Ntfy is closed by
# default (auth-default-access: deny-all, slice 401), so a guest that reports its own
# OS updates must hold a publish credential. It is scoped as tightly as the mechanism
# allows — an Ntfy access token with publish rights on one topic, no read access, no
# bearing on any other service — and is stored in /etc/homelab-infra/ntfy.env, root-only
# 0600, never in the world-readable notify script. Rotate by re-running the Ntfy deploy
# after clearing notifications.token from config/.generated/facts.yml.
# An absent token falls back to an unauthenticated POST, which is what an Ntfy deployed
# before slice 401 (open by default) expects.
#
# REBOOTING IS NOT THIS FILE'S JOB (slice 205). `Automatic-Reboot "false"` below is
# already the effective behaviour when the directive is absent, and it is stated anyway:
# a guest must reboot inside the maintenance schedule its apps declared, decided by
# playbooks/maintenance/guest-maintenance.yml, and never because a package default
# changed underneath us. Packages are still installed continuously — only the reboot
# waits. `/var/run/reboot-required` is what this file leaves behind and what the
# maintenance job acts on.

# needrestart knows which systemd services still have deleted binaries or libraries
# mapped after apt replaced them. Its default interactive policy is unsuitable for an
# unattended guest: list (`l`) is both non-interactive and guarantees that installing
# updates never restarts a service outside the maintenance window.
- name: Install stale-service detector
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Configure needrestart to report without restarting
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/homelab-infra.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by homelab-infra. Restarts are scheduled by homelab-maintenance.
      $nrconf{restart} = 'l';

# Keep the parser in one root-owned helper. `needrestart -b` emits one
# NEEDRESTART-SVC record per stale host systemd unit; it does not enumerate the
# processes inside containers. Those remain Watchtower's update domain, while a stale
# docker.service or containerd.service is deliberately a host service and is returned.
- name: Write stale-service list helper
  ansible.builtin.copy:
    dest: /usr/local/bin/lab-stale-services
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Print one stale host systemd unit per line. Read-only: `-r l` forbids
      # needrestart from acting even if a local package default changes.
      set -uo pipefail
      NEEDRESTART=/usr/sbin/needrestart
      [ -x "$NEEDRESTART" ] || exit 0
      # needrestart diagnostics and service records share stdout. Keep only the
      # documented machine records, and make the result stable for messages/status.
      "$NEEDRESTART" -b -r l 2>/dev/null | sed -n 's/^NEEDRESTART-SVC: //p' | sort -u || true

- name: Enable automatic apt upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}";
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
        "${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Dpkg-Options {
        "--force-confdef";
        "--force-confold";
      };

# The token is kept OUT of the 0755 script (world-readable on the guest) and in a
# root-only credential file that the script sources. See this file's header for
# why a guest holds a publish credential at all.
- name: Create homelab-infra credential directory
  ansible.builtin.file:
    path: /etc/homelab-infra
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'

- name: Write Ntfy publish credential
  ansible.builtin.copy:
    dest: /etc/homelab-infra/ntfy.env
    owner: root
    group: root
    mode: "0600"
    content: |
      NTFY_URL={{ homelabinfra_infra.notifications.host | default('') }}/{{ homelabinfra_infra.notifications.topic | default('homelab') }}
      NTFY_TOKEN={{ homelabinfra_infra.notifications.token | default('') }}
  no_log: true
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'

- name: Write unattended-upgrades Ntfy notification script
  ansible.builtin.copy:
    dest: /usr/local/bin/unattended-upgrades-notify
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      CREDS=/etc/homelab-infra/ntfy.env
      [[ -r "$CREDS" ]] || exit 0
      # shellcheck disable=SC1090
      . "$CREDS"
      LOGFILE="/var/log/unattended-upgrades/unattended-upgrades.log"
      [[ -z "${NTFY_URL:-}" || ! -f "$LOGFILE" ]] && exit 0
      LINE=$(grep "^$(date +%Y-%m-%d).*Packages that will be upgraded:" "$LOGFILE" | tail -1 || true)
      [[ -z "$LINE" ]] && exit 0
      COUNT=$(echo "${LINE#*Packages that will be upgraded:}" | wc -w)
      [[ "$COUNT" -eq 0 ]] && exit 0
      STALE_SERVICES=$(/usr/local/bin/lab-stale-services | paste -sd, -)
      BODY="$COUNT package(s) updated on {{ inventory_hostname }}"
      if [[ -n "$STALE_SERVICES" ]]; then
        BODY+=$'\nStale services (running replaced code): '
        BODY+="$STALE_SERVICES"
      else
        BODY+=$'\nNo stale host services detected.'
      fi
      AUTH=()
      [[ -n "${NTFY_TOKEN:-}" ]] && AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
      curl -sf -X POST "$NTFY_URL" \
        "${AUTH[@]}" \
        -H "Title: OS updates installed on {{ inventory_hostname }}" \
        -d "$BODY" \
        > /dev/null
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'

- name: Create systemd drop-in directory for unattended-upgrades
  ansible.builtin.file:
    path: /etc/systemd/system/unattended-upgrades.service.d
    state: directory
    mode: "0755"
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'

- name: Install systemd drop-in to call Ntfy after unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/systemd/system/unattended-upgrades.service.d/ntfy-notify.conf
    mode: "0644"
    content: |
      [Service]
      ExecStartPost=/usr/local/bin/unattended-upgrades-notify
  register: _dropin_changed
  when:
    - homelabinfra_infra is defined
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'

- name: Reload systemd after drop-in change
  ansible.builtin.systemd:
    daemon_reload: true
  when: _dropin_changed is changed
