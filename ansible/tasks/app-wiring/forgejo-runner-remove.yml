---
# Forgejo Runner has no supported unregister command. Remove exactly the named runner
# through Forgejo's API before its Compose project is stopped. User-scoped registrations
# use runner_api_token; global registrations can use admin_api_token. Both are separate
# Vaultwarden-only fields on homelab-infra/apps/<forgejo-instance>.

- name: Forgejo Runner removal | Resolve named Forgejo endpoint
  ansible.builtin.set_fact:
    _runner_remove_endpoint: >-
      {{ (homelabinfra_infra.apps | default({})).get(runner_remove_forgejo_instance, {}) }}
  no_log: true

- name: Forgejo Runner removal | Resolve API tokens from Vaultwarden
  ansible.builtin.set_fact:
    _runner_remove_user_token: >-
      {{ (homelabinfra_vault.apps | default({})).get(runner_remove_forgejo_instance, {}).runner_api_token
         | default('', true) }}
    _runner_remove_admin_token: >-
      {{ (homelabinfra_vault.apps | default({})).get(runner_remove_forgejo_instance, {}).admin_api_token
         | default('', true) }}
  no_log: true

- name: Forgejo Runner removal | Select preferred API scope
  ansible.builtin.set_fact:
    _runner_remove_api_token: >-
      {{ _runner_remove_user_token
         if _runner_remove_user_token | length > 0
         else _runner_remove_admin_token }}
    _runner_remove_api_scope: >-
      {{ 'user' if _runner_remove_user_token | length > 0 else 'admin' }}
  no_log: true

- name: Forgejo Runner removal | Resolve the runner API base URL
  ansible.builtin.set_fact:
    _runner_remove_api_base: >-
      {{ _runner_remove_endpoint.url | default('') | regex_replace('/+$', '')
         }}/api/v1/{{ 'admin' if _runner_remove_api_scope == 'admin' else 'user' }}/actions/runners
  no_log: true

- name: Forgejo Runner removal | Require a Vaultwarden API token
  ansible.builtin.assert:
    that:
      - _runner_remove_endpoint.url | default('') | length > 0
      - _runner_remove_api_token | length > 0
    fail_msg: >-
      Cannot deregister runner {{ runner_remove_instance }}: named Forgejo instance
      {{ runner_remove_forgejo_instance }} or its Vaultwarden-only API token is
      unavailable. Store runner_api_token for a user-scoped runner or admin_api_token
      for a global runner in homelab-infra/apps/{{ runner_remove_forgejo_instance }};
      do not add either token to config/apps or generated facts.
  no_log: true

- name: Forgejo Runner removal | List registered runners
  ansible.builtin.uri:
    url: "{{ _runner_remove_api_base }}"
    method: GET
    headers:
      Authorization: "token {{ _runner_remove_api_token }}"
    status_code: 200
    return_content: true
  register: _runner_remove_listing
  no_log: true

- name: Forgejo Runner removal | Select only the exact runner name
  ansible.builtin.set_fact:
    _runner_remove_matches: >-
      {{ ((_runner_remove_listing.json.runners
           if (_runner_remove_listing.json is mapping and _runner_remove_listing.json.runners is defined)
           else _runner_remove_listing.json) | default([]))
         | selectattr('name', 'equalto', runner_remove_instance)
         | map(attribute='id') | list }}
  no_log: true

- name: Forgejo Runner removal | List global registrations when user scope has no exact match
  ansible.builtin.uri:
    url: "{{ _runner_remove_endpoint.url | regex_replace('/+$', '') }}/api/v1/admin/actions/runners"
    method: GET
    headers:
      Authorization: "token {{ _runner_remove_admin_token }}"
    status_code: 200
    return_content: true
  register: _runner_remove_admin_listing
  when:
    - _runner_remove_api_scope == 'user'
    - _runner_remove_matches | length == 0
    - _runner_remove_admin_token | length > 0
  no_log: true

- name: Forgejo Runner removal | Select exact global runner registrations
  ansible.builtin.set_fact:
    _runner_remove_admin_matches: >-
      {{ ((_runner_remove_admin_listing.json.runners
           if (_runner_remove_admin_listing.json is mapping and _runner_remove_admin_listing.json.runners is defined)
           else _runner_remove_admin_listing.json) | default([]))
         | selectattr('name', 'equalto', runner_remove_instance)
         | map(attribute='id') | list }}
  when:
    - _runner_remove_admin_listing is defined
    - not (_runner_remove_admin_listing.skipped | default(false))
  no_log: true

- name: Forgejo Runner removal | Use admin scope for an exact global runner match
  ansible.builtin.set_fact:
    _runner_remove_api_scope: admin
    _runner_remove_api_token: "{{ _runner_remove_admin_token }}"
    _runner_remove_api_base: >-
      {{ _runner_remove_endpoint.url | regex_replace('/+$', '') }}/api/v1/admin/actions/runners
    _runner_remove_matches: "{{ _runner_remove_admin_matches }}"
  when:
    - _runner_remove_admin_matches is defined
    - _runner_remove_admin_matches | length > 0
  no_log: true

- name: Forgejo Runner removal | Delete exact runner registrations
  ansible.builtin.uri:
    url: "{{ _runner_remove_api_base }}/{{ item }}"
    method: DELETE
    headers:
      Authorization: "token {{ _runner_remove_api_token }}"
    status_code: [204, 404]
  loop: "{{ _runner_remove_matches }}"
  register: _runner_remove_result
  changed_when: _runner_remove_result.status | default(0) == 204
  no_log: true
