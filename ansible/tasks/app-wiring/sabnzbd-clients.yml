---
# Wire just this deployed download client, preserving each consumer's other connections.
- name: SABnzbd clients | Resolve peers
  ansible.builtin.include_tasks: sabnzbd-peers.yml

- name: SABnzbd clients | Read configured categories
  ansible.builtin.uri:
    url: "{{ _sab_client.host }}/api?mode=get_cats&output=json&apikey={{ _sab_client.api_key | urlencode }}"
    return_content: true
    status_code: 200
  register: _sab_categories
  changed_when: false
  no_log: true

- name: SABnzbd clients | Require an authenticated category response
  ansible.builtin.assert:
    that:
      - (_sab_categories.json | default({})).categories is defined
      - _sab_categories.json.categories is sequence
      - _sab_categories.json.categories is not string
  no_log: true

- name: SABnzbd clients | Create missing consumer categories
  ansible.builtin.uri:
    url: >-
      {{ _sab_client.host }}/api?mode=set_config&section=categories&output=json&apikey={{
      _sab_client.api_key | urlencode }}&name={{ _sab_category | urlencode }}
    return_content: true
    status_code: 200
  vars:
    _sab_category: "{{ media_wiring.kinds[item.value.app].default_category }}"
  loop: "{{ _sab_consumers }}"
  loop_control:
    label: "{{ item.key }}"
  when: _sab_category not in _sab_categories.json.categories
  register: _sab_category_created
  failed_when: >-
    _sab_category not in ((_sab_category_created.json.config | default({})).categories
                         | default([]) | map(attribute='name') | list)
  changed_when: true
  no_log: true

- name: SABnzbd clients | Register the client in each consumer
  ansible.builtin.include_tasks: arr-download-client.yml
  vars:
    mw_client_name: "{{ instance }}"
    mw_client: "{{ _sab_client }}"
    mw_arr_name: "{{ item.key }}"
    mw_arr: "{{ item.value }}"
  loop: "{{ _sab_consumers }}"
  loop_control:
    label: "{{ instance }} → {{ item.key }}"

- name: SABnzbd clients | Record failed consumer connections
  ansible.builtin.include_tasks: ../report-degradation.yml
  vars:
    degradation_component: "{{ item.connection }}"
    degradation_reason: "{{ item.detail | default('Could not register the SABnzbd download client.') }}"
  loop: "{{ media_wire_results | selectattr('state', 'equalto', 'failed') | list }}"
  loop_control:
    label: "{{ item.connection }}"
