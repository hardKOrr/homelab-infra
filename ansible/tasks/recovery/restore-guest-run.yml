---
# Restore Guest (localhost): stop a running existing target, submit the Proxmox VM or
# LXC restore, apply the target identity and network, verify them, and restart only a
# target that was running. A failure leaves the target stopped and names the retained
# pre-restore point; nothing is deleted. Every mutation requires overwrite=true.

- name: Restore the guest without activating the target
  block:
    - name: Stop an existing running target
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - "/nodes/{{ _rg_target_node }}/{{ (_rg_targets | first).type }}/{{ _rg_target_vmid }}/status/stop"
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_stop_task
      changed_when: true
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Normalize the existing target stop task response
      ansible.builtin.set_fact:
        _rg_stop_task_upids: >-
          {{ _rg_stop_task.stdout | default('')
             | regex_findall('UPID:[^\s"\\]+:') }}
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Require exactly one existing target stop task identity
      ansible.builtin.assert:
        that: _rg_stop_task_upids | length == 1
        fail_msg: >-
          Proxmox did not return exactly one target stop task identity. The target
          remains stopped for inspection.
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Select the existing target stop task identity
      ansible.builtin.set_fact:
        _rg_stop_task_upid: "{{ (_rg_stop_task_upids | first | default('', true)) | trim }}"
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Wait for the existing target to stop
      ansible.builtin.include_tasks: ../proxmox/wait-for-task.yml
      vars:
        proxmox_task_node: "{{ _rg_target_node }}"
        proxmox_task_upid: "{{ _rg_stop_task_upid }}"
        proxmox_task_timeout: "{{ restore_timeout | default(900) }}"
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Report the effective Restore Guest bandwidth limit
      ansible.builtin.debug:
        msg: >-
          {{ 'Restore Guest restore limit: ' ~ _rg_restore_bandwidth_mib_s ~
             ' MiB/s (--bwlimit ' ~ _rg_restore_bwlimit_kib ~ ' KiB/s).'
             if _rg_restore_bwlimit_kib | length > 0 else
             'Restore Guest has no configured --bwlimit; Proxmox defaults apply.' }}
      when: _rg_execute | bool

    - name: Restore a VM from the native PBS artifact
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'create', '/nodes/' ~ _rg_target_node ~ '/qemu',
              '--vmid', _rg_target_vmid,
              '--archive', _rg_storage ~ ':' ~ _rg_artifact,
              '--storage', target_storage,
              '--unique', '1' if _rg_destination == 'new' else '0',
              '--force', '0' if _rg_destination == 'new' else '1',
              '--start', '0'] + _rg_restore_bwlimit_args }}
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_restore_vm_task
      changed_when: true
      when:
        - _rg_execute | bool
        - _rg_target_type == 'qemu'

    - name: Restore an LXC from the native PBS artifact
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'create', '/nodes/' ~ _rg_target_node ~ '/lxc',
              '--vmid', _rg_target_vmid,
              '--ostemplate', _rg_storage ~ ':' ~ _rg_artifact,
              '--storage', target_storage,
              '--restore', '1',
              '--unique', '1' if _rg_destination == 'new' else '0',
              '--force', '0' if _rg_destination == 'new' else '1',
              '--start', '0'] + _rg_restore_bwlimit_args }}
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_restore_lxc_task
      changed_when: true
      when:
        - _rg_execute | bool
        - _rg_target_type == 'lxc'

    - name: Select the guest restore task response
      ansible.builtin.set_fact:
        # The later skipped restore task must not replace the executed task's result.
        _rg_restore_task: >-
          {{ _rg_restore_vm_task if _rg_target_type == 'qemu'
             else _rg_restore_lxc_task }}
      when: _rg_execute | bool

    - name: Normalize the guest restore task response
      ansible.builtin.set_fact:
        _rg_restore_task_upids: >-
          {{ _rg_restore_task.stdout | default('')
             | regex_findall('UPID:[^\s"\\]+:') }}
      when: _rg_execute | bool

    - name: Require exactly one guest restore task identity
      ansible.builtin.assert:
        that: _rg_restore_task_upids | length == 1
        fail_msg: >-
          Proxmox did not return exactly one guest restore task identity. The target
          remains stopped for inspection.
      when: _rg_execute | bool

    - name: Select the guest restore task identity
      ansible.builtin.set_fact:
        _rg_restore_task_upid: "{{ (_rg_restore_task_upids | first | default('', true)) | trim }}"
      when: _rg_execute | bool

    - name: Wait for the guest restore task
      ansible.builtin.include_tasks: ../proxmox/wait-for-task.yml
      vars:
        proxmox_task_node: "{{ _rg_target_node }}"
        proxmox_task_upid: "{{ _rg_restore_task_upid }}"
        proxmox_task_timeout: "{{ restore_timeout | default(7200) }}"
      when: _rg_execute | bool

    - name: Apply the target identity and intended network
      ansible.builtin.command:
        argv: >-
          {{ ['pvesh', 'set', '/nodes/' ~ _rg_target_node ~ '/' ~ _rg_target_type ~ '/' ~ _rg_target_vmid ~ '/config']
             + (['--name', _rg_restore_name] if _rg_target_type == 'qemu' else ['--hostname', _rg_restore_name])
             + ['--tags', _rg_restore_tags, '--onboot', _rg_restore_onboot]
             + (item.key | ternary(['--' ~ item.key, item.value], [])) }}
      delegate_to: "{{ _rg_target_node }}"
      loop: "{{ _rg_restore_network }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
      when: _rg_execute | bool

    - name: Read the restored target configuration
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ _rg_target_node }}/{{ _rg_target_type }}/{{ _rg_target_vmid }}/config"
          - --output-format
          - json
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_restored_config
      changed_when: false
      no_log: true
      when: _rg_execute | bool

    - name: Verify restored identity, network and data volumes
      ansible.builtin.assert:
        that:
          - _rg_restored_config.rc == 0
          - >-
            ((_rg_restored_config.stdout | from_json).name | default(
             (_rg_restored_config.stdout | from_json).hostname, true)) == _rg_restore_name
          - "'_+lab' in ((_rg_restored_config.stdout | from_json).tags | default('')).split(';')"
          - >-
            (_rg_restored_config.stdout | from_json) | dict2items
            | selectattr('key', 'match', '^(rootfs|scsi|sata|virtio|ide)[0-9]*$') | list | length > 0
          - >-
            (_rg_restored_config.stdout | from_json).onboot | default(0, true) | int
            == _rg_restore_onboot | int
        fail_msg: >-
          The guest restore completed but its target identity, network/data configuration,
          ownership, or autostart configuration could not be verified. The target remains
          stopped; retry from the retained pre-restore point after inspection.
      when: _rg_execute | bool

    - name: Refresh PBS backup VMIDs after restoring a new managed guest
      ansible.builtin.include_tasks: ../proxmox/refresh-backup-job.yml
      vars:
        backup_job_create_if_missing: false
      when:
        - _rg_execute | bool
        - _rg_destination == 'new'

    - name: Start an existing target that was running before restore
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - "/nodes/{{ _rg_target_node }}/{{ _rg_target_type }}/{{ _rg_target_vmid }}/status/start"
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_start_task
      changed_when: true
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Normalize the existing target start task response
      ansible.builtin.set_fact:
        _rg_start_task_upids: >-
          {{ _rg_start_task.stdout | default('')
             | regex_findall('UPID:[^\s"\\]+:') }}
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Require exactly one existing target start task identity
      ansible.builtin.assert:
        that: _rg_start_task_upids | length == 1
        fail_msg: >-
          Proxmox did not return exactly one target start task identity. The target
          remains stopped for inspection.
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Select the existing target start task identity
      ansible.builtin.set_fact:
        _rg_start_task_upid: "{{ (_rg_start_task_upids | first | default('', true)) | trim }}"
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Wait for the existing target to start
      ansible.builtin.include_tasks: ../proxmox/wait-for-task.yml
      vars:
        proxmox_task_node: "{{ _rg_target_node }}"
        proxmox_task_upid: "{{ _rg_start_task_upid }}"
        proxmox_task_timeout: "{{ restore_timeout | default(900) }}"
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

    - name: Verify the intended existing-target connectivity state
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ _rg_target_node }}/{{ _rg_target_type }}/{{ _rg_target_vmid }}/status/current"
          - --output-format
          - json
      delegate_to: "{{ _rg_target_node }}"
      register: _rg_final_status
      changed_when: false
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'

    - name: Require an existing target to return to its prior running state
      ansible.builtin.assert:
        that: (_rg_final_status.stdout | from_json).status | default('') == 'running'
        fail_msg: >-
          The existing target was restored but did not return to running service. Leave
          it stopped and retry from {{ _rg_pre_restore_point }} after investigation.
      when:
        - _rg_execute | bool
        - _rg_destination == 'existing'
        - _rg_was_running | bool

  rescue:
    - name: Report a failed or partial guest restore without destructive cleanup
      ansible.builtin.fail:
        msg: >-
          PBS guest restore failed or timed out. No source artifact or unrelated
          resource was deleted. Target VMID={{ _rg_target_vmid }} remains stopped or
          partially restored for inspection. Existing-target recovery point={{
          _rg_pre_restore_point | default('not captured', true) }}; retry only after
          verifying that point and the target state.
