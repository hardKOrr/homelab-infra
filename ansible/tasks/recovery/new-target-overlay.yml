---
# Restore App, destination=new: the settings a new target must not share with its
# source, derived from the target's name so the target needs no hand-authored values.
# An app with an external database gets its own database name and login role; a Docker
# app that publishes a port gets its own host port, because the target can share the
# source's stack host. Values the target's own config file sets win. The target's
# credential item is homelab-infra/apps/<target>, never the source's.
#
# Inputs: _ra_target, _ra_app, _ra_destination, _app_defaults, _instance_config,
#   _target_config, _ra_defaults_key.
# Result: _ra_new_target_overlay ({} for destination=existing); restore-app-target.yml
#   writes it to config/apps/<target>.yml when that file is absent (write-new-target-config.yml),
#   so provisioning and every later Deploy read the same values. The target also gets a
#   routing.subdomain of its own, so its route never equals the source's.
- name: Derive the new restore target's own database login and port
  vars:
    _nto_source: >-
      {{ (_app_defaults | default({})).get(_ra_defaults_key, {})
         | combine(_instance_config | default({}), recursive=True) }}
    _nto_authored: "{{ (_target_config | default({})).get('app', {}) }}"
    # A letter or underscore first, at most 32 characters (MariaDB/MySQL login limit). A
    # name that is already a plain identifier is kept; any other gets a hash of the full
    # instance name, so plane-blue and plane.blue never normalize to the same login.
    _nto_slug: >-
      {%- set s = _ra_target | regex_replace('[^A-Za-z0-9_]', '_') -%}
      {%- set s = ('r_' ~ s) if s[0:1] | regex_search('[0-9]') else s -%}
      {{ s if (s == _ra_target and s | length <= 32) else (s[:23] ~ '_' ~ (_ra_target | hash('sha1'))[:8]) }}
    _nto_source_port: "{{ (_nto_source.get('app', {})).get('port', 0) | int }}"
    _nto_port: >-
      {%- set p = 20000 + ((_ra_target | hash('sha1'))[:6] | int(base=16)) % 10000 -%}
      {{ p + 1 if p == _nto_source_port | int else p }}
    _nto_src_db: "{{ _nto_source.get('app', {}).get('database', {}) }}"
    _nto_src_item: "{{ (homelabinfra_vault.apps | default({})).get(instance | default(''), {}) }}"
    # Every name and login the source uses, from its config and its canonical item.
    _nto_taken: >-
      {{ [_nto_src_db.get('name', ''), _nto_src_db.get('role', ''),
          _nto_src_item.get('database_name', ''), _nto_src_item.get('database_user', '')]
         | select | list }}
    # A generated value that equals one of the source's takes a suffix instead.
    _nto_generated: "{{ _nto_slug if _nto_slug not in _nto_taken else _nto_slug[:28] ~ '_new' }}"
    _nto_db_name: "{{ _nto_authored.get('database', {}).get('name', _nto_generated) }}"
    _nto_db_role: "{{ _nto_authored.get('database', {}).get('role', _nto_generated) }}"
    _nto_app: >-
      {%- set out = {} -%}
      {%- if _nto_src_db is mapping and _nto_src_db | length > 0 -%}
      {%-   set _ = out.update({'database': {'name': _nto_db_name, 'role': _nto_db_role}}) -%}
      {%- endif -%}
      {%- if _nto_src_redis | length > 0 -%}
      {%-   set _ = out.update({'redis': {'instance': _nto_redis}}) -%}
      {%- endif -%}
      {%- if _nto_source_port | int > 0
             and (_nto_source.get('hosting', {})).get('method', 'docker') == 'docker' -%}
      {%-   set _ = out.update({'port': _nto_authored.get('port', _nto_port) | int}) -%}
      {%- endif -%}
      {{ out | to_json }}
    # A routed source gives its target a route of its own; an authored subdomain wins and
    # the shared validator still refuses one that equals the source's.
    # A Redis backend is its own deployed app, so one is only chosen, never created: the
    # authored instance, else redis-<target> when that backend is registered, else the
    # source's, which the check below refuses.
    # Only an app whose restore replays Redis data (recovery.new_target_own_redis) needs one.
    _nto_src_redis: >-
      {{ _nto_source.get('app', {}).get('redis', {}).get('instance', '')
         if _nto_source.get('recovery', {}).get('new_target_own_redis', false) | bool else '' }}
    _nto_redis: >-
      {{ _nto_authored.get('redis', {}).get('instance',
           ('redis-' ~ _ra_target)
           if ('redis-' ~ _ra_target) in (homelabinfra_infra.databases | default({}))
           else _nto_src_redis) }}
    _nto_routing: >-
      {{ {'subdomain': _ra_target}
         if (_nto_source.get('routing', {})).get('proxy', 'none') != 'none'
            and 'subdomain' not in (_target_config | default({})).get('routing', {})
         else {} }}
  ansible.builtin.set_fact:
    _ra_new_target_overlay: >-
      {{ ({'app': _nto_app | from_json} if (_nto_app | from_json) | length > 0 else {})
         | combine({'routing': _nto_routing} if _nto_routing | length > 0 else {})
         if _ra_destination == 'new' else {} }}

# Fail closed before the child deploy provisions anything: the target's final database
# name or login (authored or derived) must not be one the source uses.
- name: Refuse a new target whose database name or login is the source's
  ansible.builtin.assert:
    that:
      - (_ra_new_target_overlay.app.database.name | default('')) not in _nto_taken
      - (_ra_new_target_overlay.app.database.role | default('')) not in _nto_taken
      # A real Redis backend of its own: registered, provider redis, an endpoint, and not
      # the source's endpoint under another key. The restore role checks again later, but
      # the child deploy changes PostgreSQL first.
      - >-
        _nto_src_redis == '' or (
          _nto_redis_new != _nto_src_redis
          and _nto_databases.get(_nto_redis_new, {}).get('provider', '') == 'redis'
          and _nto_databases.get(_nto_redis_new, {}).get('host', '') | length > 0
          and _nto_databases.get(_nto_redis_new, {}).get('port', 0) | int > 0
          and not (_nto_databases.get(_nto_redis_new, {}).get('host', '')
                     == _nto_databases.get(_nto_src_redis, {}).get('host', 'x')
                   and _nto_databases.get(_nto_redis_new, {}).get('port', 0) | int
                       == _nto_databases.get(_nto_src_redis, {}).get('port', -1) | int))
      - >-
        _nto_source_port | int == 0 or (_ra_new_target_overlay.app.port | default(0) | int)
        != _nto_source_port | int
    fail_msg: >-
      The new restore target {{ _ra_target }} would use a database name, login or published
      port the source uses (the target can share the source's stack host). Set a different
      app.database.name, app.database.role and app.port in config/apps/{{ _ra_target }}.yml.
      A Redis backend is a deployed app of its own: deploy redis-{{ _ra_target }} (or set
      app.redis.instance to another registered backend) before restoring to a new target.
  vars:
    _nto_source: >-
      {{ (_app_defaults | default({})).get(_ra_defaults_key, {})
         | combine(_instance_config | default({}), recursive=True) }}
    _nto_source_port: "{{ (_nto_source.get('app', {})).get('port', 0) | int }}"
    _nto_src_redis: >-
      {{ _nto_source.get('app', {}).get('redis', {}).get('instance', '')
         if _nto_source.get('recovery', {}).get('new_target_own_redis', false) | bool else '' }}
    _nto_redis_new: "{{ (_ra_new_target_overlay.app.redis.instance | default('')) if _nto_src_redis != '' else '' }}"
    _nto_databases: "{{ homelabinfra_infra.databases | default({}) }}"
    _nto_src_db: "{{ _nto_source.get('app', {}).get('database', {}) }}"
    _nto_src_item: "{{ (homelabinfra_vault.apps | default({})).get(instance | default(''), {}) }}"
    _nto_taken: >-
      {{ [_nto_src_db.get('name', ''), _nto_src_db.get('role', ''),
          _nto_src_item.get('database_name', ''), _nto_src_item.get('database_user', '')]
         | select | list }}
  when: _ra_destination == 'new'
