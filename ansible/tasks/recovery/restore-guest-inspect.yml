---
# Restore Guest (localhost): require a free new VMID or exactly one _+lab-owned
# existing guest, active destination storage and a readable PBS artifact, then
# publish the target identity, network and prior running state to restore.
# Results: _rg_targets, _rg_target_node, _rg_artifacts, _rg_target_type,
# _rg_restore_name/_tags/_onboot/_network and _rg_was_running.

- name: Read destination cluster resources
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
  delegate_to: "{{ _rg_control_node }}"
  register: _rg_inventory
  changed_when: false

- name: Resolve the exact destination node and guest
  ansible.builtin.set_fact:
    _rg_targets: >-
      {{ (_rg_inventory.stdout | from_json)
         | selectattr('vmid', 'equalto', (_rg_target_vmid | int)) | list }}

- name: Require a free new destination or owned existing destination
  ansible.builtin.assert:
    that:
      - >-
        (_rg_destination == 'new' and _rg_targets | length == 0)
        or
        (_rg_destination == 'existing' and _rg_targets | length == 1
         and '_+lab' in ((_rg_targets | first).tags | default('', true)).split(';')
         and not ((_rg_targets | first).template | default(0) | bool))
    fail_msg: >-
      New restore VMID {{ _rg_target_vmid }} must be unused; an existing restore must
      name exactly one _+lab-owned VM/LXC. Unmanaged or ambiguous targets are never
      stopped or replaced.

- name: Resolve the destination node
  ansible.builtin.set_fact:
    _rg_target_node: >-
      {{ target_node | default(
           (_rg_targets | first).node if _rg_targets | length == 1 else _rg_control_node,
           true) }}

- name: Validate destination identity and isolation inputs
  ansible.builtin.assert:
    that:
      - _rg_target_node in groups['proxmox_delegates']
      - _rg_target_node is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - >-
        _rg_destination == 'existing'
        or (_rg_target_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
            and target_network | default('', true) | length > 0
            and _rg_target_tags is string
            and '_+lab' in _rg_target_tags.split(';'))
    fail_msg: >-
      A new guest restore requires a target name, target network configuration and
      ownership tag. It is restored stopped and cannot inherit the source identity.

- name: Read destination storage inventory
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ _rg_target_node }}/storage", --output-format, json]
  delegate_to: "{{ _rg_target_node }}"
  register: _rg_storages
  changed_when: false

- name: Require destination storage availability
  ansible.builtin.assert:
    that:
      - >-
        (_rg_storages.stdout | from_json) | default([])
        | selectattr('storage', 'equalto', (target_storage | default('', true)))
        | selectattr('active', 'equalto', 1) | list | length == 1
      - target_storage | default('', true) | length > 0
    fail_msg: >-
      Destination storage {{ target_storage | default('(missing)') }} is not active on
      {{ _rg_target_node }}. No target was stopped or created.

- name: Verify the selected PBS artifact on the destination cluster
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ _rg_target_node }}/storage/{{ _rg_storage }}/content"
      - --content
      - backup
      - --output-format
      - json
  delegate_to: "{{ _rg_target_node }}"
  register: _rg_artifacts
  changed_when: false

- name: Require readable PBS credentials and artifact availability
  ansible.builtin.assert:
    that:
      - _rg_artifacts.rc == 0
      - >-
        (_rg_artifacts.stdout | from_json) | default([])
        | selectattr('volid', 'defined')
        | selectattr('volid', 'search', '(^|:)' ~ (_rg_artifact | regex_escape) ~ '$') | list | length > 0
    fail_msg: >-
      PBS artifact {{ recovery_point }} is unavailable from {{ _rg_target_node }} via
      {{ _rg_storage }}. Check PBS credentials, certificate and decryption material;
      no target was stopped or replaced.
  when: _rg_execute | bool

- name: Read the selected PBS configuration blob before mutation
  ansible.builtin.command:
    argv:
      - pvesm
      - extractconfig
      - "{{ _rg_storage }}:{{ _rg_artifact }}"
  delegate_to: "{{ _rg_target_node }}"
  register: _rg_artifact_config
  changed_when: false
  failed_when: false
  no_log: true
  when: _rg_execute | bool

- name: Require artifact credentials and decryption material
  ansible.builtin.assert:
    that:
      - _rg_artifact_config.rc == 0
      - _rg_artifact_config.stdout | length > 0
    fail_msg: >-
      PBS exposed the selected artifact index but its configuration blob could not be
      read with the destination credentials/decryption material. No target was stopped
      or replaced.
  when: _rg_execute | bool

- name: Read the existing target configuration before mutation
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ _rg_target_node }}/{{ (_rg_targets | first).type }}/{{ _rg_target_vmid }}/config"
      - --output-format
      - json
  delegate_to: "{{ _rg_target_node }}"
  register: _rg_existing_config
  changed_when: false
  no_log: true
  when:
    - _rg_destination == 'existing'

- name: Read the existing target state before mutation
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ _rg_target_node }}/{{ (_rg_targets | first).type }}/{{ _rg_target_vmid }}/status/current"
      - --output-format
      - json
  delegate_to: "{{ _rg_target_node }}"
  register: _rg_existing_status
  changed_when: false
  when:
    - _rg_destination == 'existing'

- name: Publish target identity and network to restore
  ansible.builtin.set_fact:
    _rg_target_type: >-
      {{ 'qemu' if _rg_artifact is match('^backup/vm/') else 'lxc' }}
    _rg_restore_name: >-
      {{ _rg_target_name if _rg_destination == 'new'
         else ((_rg_existing_config.stdout | from_json).name
               | default((_rg_existing_config.stdout | from_json).hostname, true)) }}
    _rg_restore_tags: >-
      {{ _rg_target_tags if _rg_destination == 'new'
         else (_rg_existing_config.stdout | from_json).tags | default('_+lab', true) }}
    _rg_restore_onboot: >-
      {{ '0' if _rg_destination == 'new'
         else ((_rg_existing_config.stdout | from_json).onboot | default(0, true) | int) }}
    _rg_restore_network: >-
      {{ [ {'key': 'net0', 'value': target_network} ]
         if _rg_destination == 'new' else
         (_rg_existing_config.stdout | from_json) | dict2items
         | selectattr('key', 'match', '^net[0-9]+$') | list }}
    _rg_was_running: >-
      {{ _rg_destination == 'existing'
         and (_rg_existing_status.stdout | from_json).status | default('stopped') == 'running' }}

- name: Validate source and destination backend match
  ansible.builtin.assert:
    that: _rg_target_type == (_rg_targets | first).type
    fail_msg: A VM artifact cannot replace an LXC or an LXC artifact replace a VM.
  when: _rg_destination == 'existing'

- name: Validate target identity before mutation
  ansible.builtin.assert:
    that:
      - _rg_restore_name is string
      - _rg_restore_name | length > 0
      - _rg_restore_network | length > 0
      - _rg_restore_tags is string
      - "'_+lab' in _rg_restore_tags.split(';')"
    fail_msg: >-
      The target identity or network is incomplete. Restore remains blocked until the
      destination name, ownership and intended connectivity are explicit.
  when: _rg_execute | bool
