---
- name: SABnzbd clients | Read consumer download clients
  ansible.builtin.uri:
    url: "{{ sab_consumer.value.host }}/api/{{ media_wiring.kinds[sab_consumer.value.app].api }}/downloadclient"
    headers:
      X-Api-Key: "{{ sab_consumer.value.api_key }}"
    status_code: 200
  register: _sab_consumer_clients
  changed_when: false
  no_log: true

- name: SABnzbd clients | Require the named entry to address the owned instance
  ansible.builtin.assert:
    that:
      - _sab_entry_fields.host == (_sab_client.host | ansible.builtin.urlsplit('hostname'))
      - _sab_entry_fields.port | int == (_sab_client.host | ansible.builtin.urlsplit('port') | int)
    fail_msg: "The named SABnzbd download client addresses another instance; refusing removal."
  vars:
    _sab_entry_fields: "{{ item.fields | items2dict(key_name='name', value_name='value') }}"
  loop: "{{ _sab_consumer_clients.json | selectattr('name', 'equalto', instance) | selectattr('implementation', 'equalto', 'Sabnzbd') | list }}"
  no_log: true

- name: SABnzbd clients | Delete only the selected instance's entries
  ansible.builtin.uri:
    url: "{{ sab_consumer.value.host }}/api/{{ media_wiring.kinds[sab_consumer.value.app].api }}/downloadclient/{{ item.id }}"
    method: DELETE
    headers:
      X-Api-Key: "{{ sab_consumer.value.api_key }}"
    status_code: [200, 204]
  loop: "{{ _sab_consumer_clients.json | selectattr('name', 'equalto', instance) | selectattr('implementation', 'equalto', 'Sabnzbd') | list }}"
  changed_when: true
  no_log: true
