---
# Remove a DNS custom record from Pi-hole v6 via its REST API.
# Inverse of tasks/wiring/pihole.yml. Called by playbooks/apps/remove.yml.
# Spec: specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_domain:  full domain of the record to remove
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   dns.host / dns.api_key / dns.validate_certs — see wiring/pihole.yml
#
# Every record for the FQDN is removed regardless of the address it points at, so a
# removal after an IP change still leaves nothing behind. Idempotent: no matching
# record → no-op success. The session is always closed in the always: block. Silent
# no-op when the configured DNS provider is not pihole.

- name: Unwire Pihole | Remove DNS record
  when: homelabinfra_infra.dns.provider | default('none') == 'pihole'
  vars:
    _ph_base: >-
      {{ homelabinfra_infra.dns.host
         if homelabinfra_infra.dns.host is search('^https?://')
         else 'http://' ~ homelabinfra_infra.dns.host }}
    _ph_validate: "{{ homelabinfra_infra.dns.validate_certs | default(false) }}"
  block:
    - name: Unwire Pihole | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_domain is defined and wiring_domain | length > 0
          - homelabinfra_infra.dns.api_key | default('') | length > 0
        fail_msg: >-
          unwiring/pihole.yml needs wiring_domain and dns.api_key (the Pi-hole app
          password) in config/.generated/facts.yml.

    - name: Unwire Pihole | Open API session
      ansible.builtin.uri:
        url: "{{ _ph_base }}/api/auth"
        method: POST
        validate_certs: "{{ _ph_validate | bool }}"
        body_format: json
        body: >-
          {{ {'password': homelabinfra_infra.dns.api_key} }}
        status_code: [200, 401, 404]
      register: _ph_auth
      changed_when: false
      no_log: true

    - name: Unwire Pihole | Assert a v6 session was granted
      ansible.builtin.assert:
        that:
          - _ph_auth.status != 404
          - _ph_auth.status == 200
        fail_msg: >-
          {{ 'Pi-hole v6+ required: ' ~ _ph_base ~ '/api/auth returned 404 (v5 has no REST API).'
             if _ph_auth.status == 404
             else 'Pi-hole rejected dns.api_key (status ' ~ _ph_auth.status ~ ').' }}

    - name: Unwire Pihole | Remove the record on the open session
      vars:
        _ph_headers:
          X-FTL-SID: "{{ _ph_auth.json.session.sid }}"
          Accept: "application/json"
      block:
        - name: Unwire Pihole | Read current custom DNS records
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts"
            method: GET
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: 200
          register: _ph_hosts
          changed_when: false
          no_log: true

        - name: Unwire Pihole | Select records for this FQDN
          ansible.builtin.set_fact:
            _ph_matching: >-
              {{ (_ph_hosts.json.config.dns.hosts | default([]))
                 | select('search', '\\s' ~ (wiring_domain | regex_escape) ~ '$') | list }}

        - name: Unwire Pihole | Delete DNS records
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts/{{ item | urlencode }}"
            method: DELETE
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: [200, 204, 404]
          loop: "{{ _ph_matching }}"
          changed_when: true
          no_log: true

        - name: Unwire Pihole | Verify records gone
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/config/dns/hosts"
            method: GET
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: 200
          register: _ph_verify
          changed_when: false
          no_log: true

        - name: Unwire Pihole | Assert no record remains for the FQDN
          ansible.builtin.assert:
            that:
              - >-
                (_ph_verify.json.config.dns.hosts | default([]))
                | select('search', '\\s' ~ (wiring_domain | regex_escape) ~ '$')
                | list | length == 0
            fail_msg: "Pi-hole still resolves {{ wiring_domain }} after unwiring."
      always:
        - name: Unwire Pihole | Close API session
          ansible.builtin.uri:
            url: "{{ _ph_base }}/api/auth"
            method: DELETE
            headers: "{{ _ph_headers }}"
            validate_certs: "{{ _ph_validate | bool }}"
            status_code: [200, 204, 401]
          changed_when: false
          failed_when: false
          no_log: true
