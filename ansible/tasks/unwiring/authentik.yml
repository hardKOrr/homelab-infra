---
# Remove an app's Authentik application, policy binding and provider — whichever
# shape its identity mode created (catalog: application only; oidc: OAuth2
# provider; forward_auth: proxy provider + outpost membership). Every lookup
# tolerates absence, so one pass covers all modes and mode changes between runs.
# Inverse of tasks/wiring/authentik.yml. Called by playbooks/apps/remove.yml.
# Spec: .claude/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:  app instance name — the Authentik application slug and provider name
#
# Tunables:
#   wiring_authentik_outpost  outpost to detach the provider from
#                             (default: authentik Embedded Outpost)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   sso.host   — full base URL including scheme
#   sso.token  — Authentik API token
#
# Teardown order is the inverse of wiring: detach the proxy provider from the outpost,
# delete the application (which takes its policy bindings with it), then delete
# whichever provider exists. Idempotent: every step is skipped when its object is
# already gone. Silent no-op when the configured SSO provider is not authentik.
#
# An unreachable Authentik warns and skips rather than failing the removal. remove.yml
# unwires BEFORE it stops the app, precisely so a half-removed app is never left serving
# traffic that still resolves through SSO — and a hard failure here inverted that: removing
# the SSO provider itself, or removing anything after it, aborted between unwire and stop
# and stranded every removal queued behind it. A stale application on an Authentik that is
# gone is a smaller problem than a removal that cannot proceed. Same stance, same reason,
# as unwiring/uptime-kuma.yml.

- name: Unwire Authentik | Remove application and provider
  when: homelabinfra_infra.sso.provider | default('none') == 'authentik'
  vars:
    _ak_api: "{{ homelabinfra_infra.sso.host }}/api/v3"
    _ak_headers:
      Authorization: "Bearer {{ homelabinfra_infra.sso.token | default('') }}"
      Accept: "application/json"
    _ak_outpost_name: "{{ wiring_authentik_outpost | default('authentik Embedded Outpost') }}"
  block:
    - name: Unwire Authentik | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_app_name is defined and wiring_app_name | length > 0
          - homelabinfra_infra.sso.host | default('') | length > 0
          - homelabinfra_infra.sso.token | default('') | length > 0
        fail_msg: >-
          unwiring/authentik.yml needs wiring_app_name, plus sso.host + sso.token in
          config/.generated/facts.yml.

    # `status` is absent entirely on a connection error, which is what distinguishes an
    # unreachable Authentik from an authentication failure. default(0) makes that case
    # explicit rather than an undefined-variable crash in the condition below.
    - name: Unwire Authentik | Probe the API
      ansible.builtin.uri:
        url: "{{ _ak_api }}/core/applications/?page_size=1"
        method: GET
        headers: "{{ _ak_headers }}"
        status_code: [200, 401, 403, 404]
        timeout: 10
      register: _ak_probe
      failed_when: false
      changed_when: false
      no_log: true

    # DEGRADATION BY DESIGN — reports instead of failing, and that is correct here. Reason
    # in the file header: removal unwires before it stops the app, so a hard failure here
    # strands every removal queued behind an unreachable Authentik. Do not convert this to
    # tasks/report-degradation.yml.
    - name: Unwire Authentik | Report unusable API
      ansible.builtin.debug:
        msg: >-
          Authentik at {{ homelabinfra_infra.sso.host }} did not answer
          GET /api/v3/core/applications/ with 200
          (got {{ _ak_probe.status | default('no response') }}) — the application and
          provider for {{ wiring_app_name }} were left in place. Remove them from the
          Authentik UI if it is still serving.
      when: _ak_probe.status | default(0) != 200

    - name: Unwire Authentik | Remove objects through the API
      when: _ak_probe.status | default(0) == 200
      block:
        - name: Unwire Authentik | Find proxy provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/proxy/?name={{ wiring_app_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_provider_list
          no_log: true

        - name: Unwire Authentik | Select proxy provider
          ansible.builtin.set_fact:
            _ak_provider: >-
              {{ (_ak_provider_list.json.results | default([]))
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}

        - name: Unwire Authentik | Find outpost
          ansible.builtin.uri:
            url: "{{ _ak_api }}/outposts/instances/?name={{ _ak_outpost_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_outpost_list
          no_log: true

        - name: Unwire Authentik | Select outpost
          ansible.builtin.set_fact:
            _ak_outpost: >-
              {{ (_ak_outpost_list.json.results | default([]))
                 | selectattr('name', 'equalto', _ak_outpost_name)
                 | list | first | default({}) }}

        - name: Unwire Authentik | Detach provider from outpost
          ansible.builtin.uri:
            url: "{{ _ak_api }}/outposts/instances/{{ _ak_outpost.pk }}/"
            method: PATCH
            headers: "{{ _ak_headers }}"
            body_format: json
            body: >-
              {{ {'providers': (_ak_outpost.providers | default([]))
                               | reject('equalto', _ak_provider.pk | int) | list} }}
            status_code: 200
          when:
            - _ak_provider.pk is defined
            - _ak_outpost.pk is defined
            - (_ak_provider.pk | int) in (_ak_outpost.providers | default([]))
          changed_when: true
          no_log: true

        # Deleting the application cascades to its policy bindings — no separate unbind step.
        - name: Unwire Authentik | Delete application
          ansible.builtin.uri:
            url: "{{ _ak_api }}/core/applications/{{ wiring_app_name }}/"
            method: DELETE
            headers: "{{ _ak_headers }}"
            status_code: [204, 404]
          register: _ak_app_delete
          changed_when: _ak_app_delete.status == 204
          no_log: true

        - name: Unwire Authentik | Delete proxy provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/proxy/{{ _ak_provider.pk | default(0) }}/"
            method: DELETE
            headers: "{{ _ak_headers }}"
            status_code: [204, 404]
          register: _ak_provider_delete
          when: _ak_provider.pk is defined
          changed_when: _ak_provider_delete.status | default(404) == 204
          no_log: true

        # oidc-mode apps have an OAuth2 provider under the same name instead.
        - name: Unwire Authentik | Find OAuth2 provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/?name={{ wiring_app_name | urlencode }}"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 200
          register: _ak_oauth_list
          no_log: true

        - name: Unwire Authentik | Select OAuth2 provider
          ansible.builtin.set_fact:
            _ak_oauth: >-
              {{ (_ak_oauth_list.json.results | default([]))
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}

        - name: Unwire Authentik | Delete OAuth2 provider
          ansible.builtin.uri:
            url: "{{ _ak_api }}/providers/oauth2/{{ _ak_oauth.pk | default(0) }}/"
            method: DELETE
            headers: "{{ _ak_headers }}"
            status_code: [204, 404]
          register: _ak_oauth_delete
          when: _ak_oauth.pk is defined
          changed_when: _ak_oauth_delete.status | default(404) == 204
          no_log: true

        - name: Unwire Authentik | Verify application is gone
          ansible.builtin.uri:
            url: "{{ _ak_api }}/core/applications/{{ wiring_app_name }}/"
            method: GET
            headers: "{{ _ak_headers }}"
            status_code: 404
          changed_when: false
          no_log: true
