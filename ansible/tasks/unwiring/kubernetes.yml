---
# Remove a Kubernetes-hosted app's cluster resources. The inverse of
# tasks/kubernetes/ensure-namespace.yml and apply-manifest.yml, called by
# playbooks/apps/remove.yml.
#
# WHAT `delete_data` MEANS HERE, EXACTLY
#
#   delete_data: false (default)  — the namespace and its workloads go; the PVCs stay.
#   delete_data: true             — the namespace goes and its PVCs go with it.
#
# Deleting a namespace deletes every namespaced object inside it, PVCs included, and no
# reclaim policy prevents that. What survives is the PersistentVolume behind the claim,
# and only because the platform StorageClass is `Retain` — that is the whole reason the
# class is Retain rather than Delete. The preserving path then clears each surviving
# volume's claimRef so it is `Available` for reuse rather than parked in `Released`
# pointing at a claim that no longer exists.
#
# The released volumes are then the operator's to reattach or remove. This file will not
# quietly garbage-collect them later; a volume that outlives its app is a restore point,
# and the job says where it is.
#
# Inputs:
#   instance                 — the app instance being removed
#   unwire_delete_data       — bool, from the removal job's option
#   homelabinfra_infra       — for the cluster registry entry

- name: k8s unwire | Resolve the cluster
  ansible.builtin.include_tasks: ../kubernetes/resolve-cluster.yml

- name: k8s unwire | Derive the instance's namespace
  ansible.builtin.include_tasks: ../kubernetes/derive-namespace.yml
  vars:
    k8s_namespace_for: "{{ instance }}"

- name: k8s unwire | Read the namespace's ownership label
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - namespace
      - "{{ k8s_namespace }}"
      - -o
      - jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _k8s_rm_owner
  failed_when: false
  changed_when: false

# Nothing to remove is a normal outcome for a removal job — the app may never have been
# deployed to this cluster, or may already be gone — so it is reported and skipped rather
# than failed.
- name: k8s unwire | Note that the namespace is already absent
  ansible.builtin.debug:
    msg: "Namespace {{ k8s_namespace }} does not exist; nothing to remove from the cluster."
  when: _k8s_rm_owner.rc != 0

- name: k8s unwire | Remove the instance's cluster resources
  when:
    - _k8s_rm_owner.rc == 0
  block:
    # The same rule as on the way in. A namespace without this platform's mark was made by
    # someone else, and deleting a whole namespace is not a thing to do on a guess.
    - name: k8s unwire | Refuse to delete a namespace this platform did not create
      ansible.builtin.assert:
        that: (_k8s_rm_owner.stdout | trim) == 'homelab-infra'
        fail_msg: >-
          Namespace {{ k8s_namespace }} is not labelled
          `app.kubernetes.io/managed-by: homelab-infra`. Refusing to delete a namespace
          this platform did not create.

    - name: k8s unwire | List the instance's persistent volume claims
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - get
          - pvc
          - -o
          - jsonpath={range .items[*]}{.metadata.name}={.spec.volumeName}{"\n"}{end}
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _k8s_pvcs
      changed_when: false

    # DELETING PATH, FIRST HALF. `Retain` keeps the backing directory on the node when the
    # PV object goes: the local-path provisioner only cleans up under `Delete`. So on the
    # explicit delete path the policy is flipped on each volume — the volume, not the
    # StorageClass, whose reclaimPolicy is immutable — BEFORE the namespace is deleted.
    # Deleting the namespace then deletes the claims, which releases volumes that now say
    # Delete, and the provisioner removes the directories. Without this the job would
    # delete the PV records, report success, and leave every byte on disk.
    - name: k8s unwire | Switch the volumes to Delete so their contents go with them
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - patch
          - pv
          - "{{ item.split('=')[1] }}"
          - --type
          - merge
          - -p
          - "{{ {'spec': {'persistentVolumeReclaimPolicy': 'Delete'}} | to_json }}"
      delegate_to: "{{ k8s_api_host }}"
      become: true
      loop: "{{ _k8s_pvcs.stdout_lines | select('search', '=.+') | list }}"
      loop_control:
        label: "{{ item.split('=')[0] }}"
      when: unwire_delete_data | default(false) | bool
      changed_when: true

    - name: k8s unwire | Delete the namespace and everything in it
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - delete
          - namespace
          - "{{ k8s_namespace }}"
          - --wait=true
          - --timeout=300s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    # PRESERVING PATH. `Retain` is what makes the PersistentVolume outlive the claim the
    # namespace deletion just destroyed; this patch is what makes the survivor reusable
    # rather than stuck in `Released` pointing at a claim that no longer exists.
    #
    # AFTER the namespace, not before. Clearing claimRef while the PVC still exists does
    # nothing durable: the PV controller sees a bound claim and writes the reference
    # straight back, and the volume ends up Released with a stale claimRef anyway. That is
    # what the first live removal produced, with this task reporting `changed` throughout.
    # By this point the claim is gone, so the cleared reference stays cleared.
    - name: k8s unwire | Release the volumes so they can be reused
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - patch
          - pv
          - "{{ item.split('=')[1] }}"
          - --type
          - merge
          - -p
          - "{{ {'spec': {'claimRef': none}} | to_json }}"
      delegate_to: "{{ k8s_api_host }}"
      become: true
      loop: "{{ _k8s_pvcs.stdout_lines | select('search', '=.+') | list }}"
      loop_control:
        label: "{{ item.split('=')[0] }}"
      when: not (unwire_delete_data | default(false) | bool)
      changed_when: true

    # DELETING PATH, SECOND HALF. A backstop for volumes the provisioner did not collect —
    # one whose claim was already gone, so deleting the namespace released nothing. The
    # usual case is that every volume is already absent, which is why this ignores that.
    - name: k8s unwire | Delete any volumes the provisioner did not collect
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - delete
          - pv
          - "{{ item.split('=')[1] }}"
          - --ignore-not-found=true
          - --wait=false
      delegate_to: "{{ k8s_api_host }}"
      become: true
      loop: "{{ _k8s_pvcs.stdout_lines | select('search', '=.+') | list }}"
      loop_control:
        label: "{{ item.split('=')[0] }}"
      when: unwire_delete_data | default(false) | bool
      changed_when: true

    # Where the data went, said plainly, in the job output the operator is already reading.
    # A restore point nobody can find is not a restore point.
    - name: k8s unwire | State what happened to the data
      ansible.builtin.debug:
        msg: >-
          {{ 'Deleted' if (unwire_delete_data | default(false) | bool) else 'RETAINED' }}
          {{ _k8s_pvcs.stdout_lines | select('search', '=.+') | list | length }} volume(s)
          for {{ instance }}.
          {{ 'The data is gone.'
             if (unwire_delete_data | default(false) | bool)
             else 'The PersistentVolumes survive the namespace and hold the data: '
                  ~ (_k8s_pvcs.stdout_lines | select('search', '=.+')
                     | map('regex_replace', '^.*=', '') | join(', '))
                  ~ '. Reattach them with a PVC naming the volume, or clear and destroy '
                    'one with the Reclaim Volume job. Do NOT use `kubectl delete pv`: '
                    'under Retain that removes the record and strands every byte on the '
                    'node, where nothing this platform runs can find it again.' }}
