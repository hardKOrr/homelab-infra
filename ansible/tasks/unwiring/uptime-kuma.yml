---
# Remove an app monitor from Uptime Kuma over socket.io.
# Inverse of tasks/wiring/uptime-kuma.yml. Called by playbooks/apps/remove.yml.
# Spec: specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_app_name:  app instance name — matches the monitor's friendly name
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   monitoring.provider        — uptime_kuma | none
#   monitoring.host            — full base URL including scheme
#   monitoring.admin_user      — admin username, overlaid from Vaultwarden
#   monitoring.admin_password  — admin password, overlaid from Vaultwarden
#
# Same transport and the same reason for it as the wire half: Uptime Kuma has no REST
# monitor API in any version, and monitoring.token cannot sign a socket in. Mechanics in
# tasks/kuma/call.yml.
#
# DEGRADATION — more forgiving than the wire half, deliberately. Where wiring fails on a
# monitor Uptime Kuma actively refuses, removal only warns: a stale monitor left in the
# dashboard is a smaller problem than a removal that aborts half-way through tearing an
# app down, and playbooks/apps/remove.yml is built around that (slice 501). Idempotent:
# absent monitor → no-op success. Silent no-op when the provider is not uptime_kuma.

- name: Unwire Uptime Kuma | Remove monitor
  when:
    - homelabinfra_infra.monitoring is defined
    - homelabinfra_infra.monitoring.provider | default('none') == 'uptime_kuma'
  block:
    - name: Unwire Uptime Kuma | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_app_name is defined and wiring_app_name | length > 0
        fail_msg: "unwiring/uptime-kuma.yml needs wiring_app_name to identify the monitor."

    - name: Unwire Uptime Kuma | Record what the registry supplies
      ansible.builtin.set_fact:
        _kuma_credentialed: >-
          {{ (homelabinfra_infra.monitoring.host | default('') | length > 0)
             and (homelabinfra_infra.monitoring.admin_user | default('') | length > 0)
             and (homelabinfra_infra.monitoring.admin_password | default('') | length > 0) }}

    - name: Unwire Uptime Kuma | Open an authenticated socket
      ansible.builtin.include_tasks: ../kuma/open-session.yml
      vars:
        kuma_base: "{{ homelabinfra_infra.monitoring.host }}"
        kuma_user: "{{ homelabinfra_infra.monitoring.admin_user }}"
        kuma_password: "{{ homelabinfra_infra.monitoring.admin_password }}"
      when: _kuma_credentialed | bool

    # DEGRADATION BY DESIGN — reports instead of failing, and that is correct here. Reason
    # in the file header: removal unwires before it stops the app, so a hard failure here
    # strands every removal queued behind an unreachable or uncredentialed Kuma. Do not
    # convert this to tasks/report-degradation.yml.
    - name: Unwire Uptime Kuma | Report a monitor left behind
      ansible.builtin.debug:
        msg: >-
          Could not sign in to Uptime Kuma at
          {{ homelabinfra_infra.monitoring.host | default('an unrecorded host') }}
          ({{ kuma_session_reason
              | default('the monitoring registry key has no admin credentials') | trim }}) —
          the monitor for {{ wiring_app_name }} was left in place. Remove it from the
          Uptime Kuma UI.
      when: not (kuma_session_ready | default(false) | bool)

    - name: Unwire Uptime Kuma | Delete the monitor
      when: kuma_session_ready | default(false) | bool
      block:
        - name: Unwire Uptime Kuma | Ask for the monitor list
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: getMonitorList
            kuma_call_ack_id: 1

        - name: Unwire Uptime Kuma | Select the existing monitor
          ansible.builtin.set_fact:
            _kuma_existing: >-
              {{ ((kuma_session_frames | select('match', '42\["monitorList",') | list
                   | last | default('42["monitorList",{}]'))
                  | regex_replace('^42', '') | from_json | last).values() | list
                 | selectattr('name', 'defined')
                 | selectattr('name', 'equalto', wiring_app_name)
                 | list | first | default({}) }}

        # `false` is the deleteChildren argument. Passing it explicitly rather than
        # relying on the handler's backward-compatible two-argument form keeps the intent
        # in the payload: never cascade into monitors this platform did not create.
        - name: Unwire Uptime Kuma | Delete the monitor
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: deleteMonitor
            kuma_call_args: ["{{ _kuma_existing.id | int }}", false]
            kuma_call_ack_id: 2
          when: _kuma_existing.id is defined

        # DEGRADATION BY DESIGN — same reason as the sign-in site above, one step later:
        # the socket worked and Kuma refused the delete. A stale monitor in the dashboard
        # is a smaller problem than a removal that aborts half-way through tearing the app
        # down. Do not convert this to tasks/report-degradation.yml.
        - name: Unwire Uptime Kuma | Report a monitor Uptime Kuma would not delete
          ansible.builtin.debug:
            msg: >-
              Uptime Kuma refused to delete the monitor for {{ wiring_app_name }}
              ({{ kuma_call_reason | default('no detail') | trim }}) — remove it from the
              Uptime Kuma UI. The removal continues.
          when:
            - _kuma_existing.id is defined
            - not (kuma_call_ok | bool)

        - name: Unwire Uptime Kuma | Report the deleted monitor
          ansible.builtin.debug:
            msg: "Deleted the Uptime Kuma monitor for {{ wiring_app_name }}."
          when:
            - _kuma_existing.id is defined
            - kuma_call_ok | bool
          changed_when: true

        - name: Unwire Uptime Kuma | Ask for the monitor list again
          ansible.builtin.include_tasks: ../kuma/call.yml
          vars:
            kuma_call_event: getMonitorList
            kuma_call_ack_id: 3
          when:
            - _kuma_existing.id is defined
            - kuma_call_ok | bool

        - name: Unwire Uptime Kuma | Assert the monitor is gone
          ansible.builtin.assert:
            that:
              - >-
                ((kuma_session_frames | select('match', '42\["monitorList",') | list
                  | last | default('42["monitorList",{}]'))
                 | regex_replace('^42', '') | from_json | last).values() | list
                | selectattr('name', 'defined')
                | selectattr('name', 'equalto', wiring_app_name)
                | list | length == 0
            fail_msg: "Uptime Kuma still has a monitor named {{ wiring_app_name }} after unwiring."
          when:
            - _kuma_existing.id is defined
            - kuma_call_ok | bool
