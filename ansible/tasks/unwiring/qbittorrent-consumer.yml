---
- name: qBittorrent clients | Read consumer download clients
  ansible.builtin.uri:
    url: "{{ qbt_consumer.value.host }}/api/{{ media_wiring.kinds[qbt_consumer.value.app].api }}/downloadclient"
    headers:
      X-Api-Key: "{{ qbt_consumer.value.api_key }}"
    status_code: 200
  register: _qbt_consumer_clients
  changed_when: false
  no_log: true

- name: qBittorrent clients | Require the named entry to address the owned instance
  ansible.builtin.assert:
    that:
      - _qbt_entry_fields.host == (_qbt_client.host | ansible.builtin.urlsplit('hostname'))
      - _qbt_entry_fields.port | int == (_qbt_client.host | ansible.builtin.urlsplit('port') | int)
    fail_msg: "The named qBittorrent download client addresses another instance; refusing removal."
  vars:
    _qbt_entry_fields: "{{ item.fields | selectattr('value', 'defined') | items2dict(key_name='name', value_name='value') }}"
  loop: "{{ _qbt_consumer_clients.json | selectattr('name', 'equalto', instance) | selectattr('implementation', 'equalto', 'QBittorrent') | list }}"
  no_log: true

- name: qBittorrent clients | Delete only the selected instance's entries
  ansible.builtin.uri:
    url: "{{ qbt_consumer.value.host }}/api/{{ media_wiring.kinds[qbt_consumer.value.app].api }}/downloadclient/{{ item.id }}"
    method: DELETE
    headers:
      X-Api-Key: "{{ qbt_consumer.value.api_key }}"
    status_code: [200, 204]
  loop: "{{ _qbt_consumer_clients.json | selectattr('name', 'equalto', instance) | selectattr('implementation', 'equalto', 'QBittorrent') | list }}"
  changed_when: true
  no_log: true
