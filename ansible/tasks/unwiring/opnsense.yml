---
# Remove a DNS host override from OPNsense Unbound via the OPNsense REST API.
# Inverse of tasks/wiring/opnsense.yml. Called by playbooks/apps/remove.yml.
# Spec: docs/specs/provider-noop-wiring.md.
#
# Wiring contract (vars supplied by the calling playbook):
#   wiring_domain:  full domain of the record to remove
#
# Optional overrides (must match what the wire half used):
#   wiring_hostname:    hostname portion  (default: first label of wiring_domain)
#   wiring_dns_domain:  zone portion      (default: remaining labels)
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   dns.host / dns.api_key / dns.api_secret / dns.validate_certs — see wiring/opnsense.yml
#
# Idempotent: absent override → no-op success, and Unbound is reconfigured only when a
# record was actually deleted. Silent no-op when the configured DNS provider is not
# opnsense.

- name: Unwire OPNsense | Remove Unbound host override
  when: homelabinfra_infra.dns.provider | default('none') == 'opnsense'
  vars:
    _opn_base: >-
      {{ homelabinfra_infra.dns.host
         if homelabinfra_infra.dns.host is search('^https?://')
         else 'https://' ~ homelabinfra_infra.dns.host }}
    _opn_hostname: "{{ wiring_hostname | default(wiring_domain.split('.')[0]) }}"
    _opn_zone: "{{ wiring_dns_domain | default(wiring_domain.split('.')[1:] | join('.')) }}"
    _opn_validate: "{{ homelabinfra_infra.dns.validate_certs | default(false) }}"
  block:
    - name: Unwire OPNsense | Assert wiring contract vars
      ansible.builtin.assert:
        that:
          - wiring_domain is defined and wiring_domain | length > 0
          - _opn_hostname | length > 0
          - _opn_zone | length > 0
          - homelabinfra_infra.dns.api_key | default('') | length > 0
          - homelabinfra_infra.dns.api_secret | default('') | length > 0
        fail_msg: >-
          unwiring/opnsense.yml needs wiring_domain (an FQDN) and dns.api_key +
          dns.api_secret in config/.generated/facts.yml.

    - name: Unwire OPNsense | Search existing host overrides
      ansible.builtin.uri:
        url: "{{ _opn_base }}/api/unbound/settings/searchHostOverride"
        method: POST
        url_username: "{{ homelabinfra_infra.dns.api_key }}"
        url_password: "{{ homelabinfra_infra.dns.api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ _opn_validate | bool }}"
        body_format: json
        body: >-
          {{ {'current': 1, 'rowCount': 1000, 'searchPhrase': _opn_hostname} }}
        status_code: 200
      register: _opn_search
      changed_when: false
      no_log: true

    - name: Unwire OPNsense | Select existing override
      ansible.builtin.set_fact:
        _opn_existing: >-
          {{ (_opn_search.json.rows | default([]))
             | selectattr('hostname', 'equalto', _opn_hostname)
             | selectattr('domain', 'equalto', _opn_zone)
             | list | first | default({}) }}

    - name: Unwire OPNsense | Delete host override
      ansible.builtin.uri:
        url: "{{ _opn_base }}/api/unbound/settings/delHostOverride/{{ _opn_existing.uuid | default('') }}"
        method: POST
        url_username: "{{ homelabinfra_infra.dns.api_key }}"
        url_password: "{{ homelabinfra_infra.dns.api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ _opn_validate | bool }}"
        body_format: json
        body: {}
        status_code: 200
      register: _opn_delete
      when: _opn_existing.uuid is defined
      changed_when: true
      no_log: true

    - name: Unwire OPNsense | Assert the delete was accepted
      ansible.builtin.assert:
        that:
          - _opn_delete is skipped or _opn_delete.json.result | default('') in ['deleted', 'saved']
        fail_msg: >-
          OPNsense rejected deletion of {{ _opn_hostname }}.{{ _opn_zone }}
          (result: {{ _opn_delete.json.result | default('none') }}).

    - name: Unwire OPNsense | Apply Unbound configuration
      ansible.builtin.uri:
        url: "{{ _opn_base }}/api/unbound/service/reconfigure"
        method: POST
        url_username: "{{ homelabinfra_infra.dns.api_key }}"
        url_password: "{{ homelabinfra_infra.dns.api_secret }}"
        force_basic_auth: true
        validate_certs: "{{ _opn_validate | bool }}"
        body_format: json
        body: {}
        status_code: 200
      when: _opn_delete is not skipped
      changed_when: true
      no_log: true
