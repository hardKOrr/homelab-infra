---
# Post-provisioning bootstrap — runs once on any newly created LXC or VM.
# Called from Play 2 of app deploy playbooks, guarded by the homelab_bootstrapped local fact.
# Assumes become: true and gather_facts: true on the calling play.

- name: Wait for SSH to be available
  ansible.builtin.wait_for_connection:
    timeout: 120
    sleep: 5

- name: Gather facts
  ansible.builtin.setup:

- name: Create facts directory
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Update apt cache and install baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - sudo
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts for new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    create: true
    mode: "0644"

- name: Set timezone
  community.general.timezone:
    name: "{{ homelabinfra_config.timezone | default('UTC') }}"

- name: Configure unattended-upgrades
  ansible.builtin.import_tasks: bootstrap/configure-unattended-upgrades.yml

- name: Write bootstrap marker
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/homelab_bootstrapped.fact
    mode: "0644"
    content: '{"bootstrapped": true}'
