---
# Publish one notification to the configured notification provider.
# Spec: specs/one-click-idempotent.md — "every automated state change
# notifies via the configured notification provider".
#
# Runs wherever it is called from; the POST goes out from that host, so call it
# from a localhost play unless the guest is the one with network access to Ntfy.
#
# Inputs:
#   notify_title:    short headline (becomes the Ntfy Title header)
#   notify_message:  body text
#   notify_priority: optional — min | low | default | high | max (default: 'default')
#
# Reads from homelabinfra_infra (Shape B, see ansible/vars/CONTRACT.md §3):
#   notifications.provider  — ntfy | gotify | discord | none
#   notifications.host      — full base URL including scheme
#   notifications.topic     — topic to publish to (default: homelab)
#   notifications.token     — optional publish token; Ntfy ships closed since slice
#                             401, but an older open server has no token recorded
#                             and the POST goes out unauthenticated
#
# Silent no-op when the provider is not ntfy or the registry has no notifications
# key — a lab that chose `none`, or a pre-bootstrap run, must not fail here
# (specs/provider-noop-wiring.md). Only ntfy is implemented; gotify and
# discord are declared providers with no publisher yet.
#
# The enabled check comes FIRST and the input assert is gated on it, because callers
# build notify_message from homelabinfra_infra — "deployed at {{ ... .domain }}" is the
# house style. Asserting first would template that message on the no-op path and fail
# the deploy on an undefined fact, which is precisely the bootstrap-step-1 case this
# no-op exists for: Ntfy is step 2, so nothing is registered when Vaultwarden calls in.

- name: Notify | Resolve whether a publisher is configured
  ansible.builtin.set_fact:
    _notify_enabled: >-
      {{ _notify_cfg.provider | default('none') == 'ntfy'
         and _notify_cfg.host | default('') | length > 0 }}
  vars:
    _notify_cfg: "{{ (homelabinfra_infra | default({})).notifications | default({}) }}"

- name: Notify | Assert inputs
  ansible.builtin.assert:
    that:
      - notify_title is defined and notify_title | length > 0
      - notify_message is defined and notify_message | length > 0
    fail_msg: "notify.yml requires notify_title and notify_message."
  when: _notify_enabled | bool

- name: Notify | Publish to Ntfy
  ansible.builtin.uri:
    url: "{{ homelabinfra_infra.notifications.host }}/{{ homelabinfra_infra.notifications.topic | default('homelab') }}"
    method: POST
    headers: >-
      {{ {'Title': notify_title, 'Priority': notify_priority | default('default')}
         | combine({'Authorization': 'Bearer ' ~ homelabinfra_infra.notifications.token}
                   if homelabinfra_infra.notifications.token | default('') | length > 0
                   else {}) }}
    body: "{{ notify_message }}"
    body_format: raw
    status_code: 200
  # Suppressed here so the publish never aborts the play mid-way; the outcome is judged
  # below and failed on at the end. Until 2026-08-10 the result was not even registered, so
  # a silently undelivered notification was indistinguishable from a delivered one. Every
  # day-2 promise in this repo (Watchtower updates, Kuma DOWN alerts, rollback hints)
  # arrives through here, so "we will tell you" was resting on a call whose outcome nobody
  # looked at.
  failed_when: false
  changed_when: false
  no_log: true
  register: _notify_result
  when: _notify_enabled | bool

# Fatal. The first pass here recorded this non-fatally, reasoning that the deploy had
# succeeded and marking the job red would punish a working run. That reasoning is what the
# ledger exists to retire: the gate is the LAST task of the play, so every task including
# this one has already done its work by the time anything fails. Nothing is aborted and
# nothing is half-done — the job simply refuses to report green when the operator was
# supposed to be told something and was not.
#
# The old comment above ("a notification must never fail a successful deploy") was written
# when failing meant aborting. It no longer does. An undelivered notification is a real
# failure of a thing this platform promises, and the whole point of catching it is that
# nobody discovers months later that alerts were never arriving.
- name: Notify | Record an undelivered notification
  ansible.builtin.include_tasks: report-degradation.yml
  vars:
    degradation_component: "notification: {{ notify_title | default('(untitled)') }}"
    degradation_reason: >-
      The notification could not be published to
      {{ homelabinfra_infra.notifications.provider | default('the notification provider') }}
      (HTTP {{ _notify_result.status | default('no response') }}). The work this run did was
      completed — but nothing was sent, so nobody was told. Fix the notification provider
      and re-run; re-running is the update path and is idempotent.
  when:
    - _notify_enabled | bool
    - _notify_result is not skipped
    - _notify_result.status | default(0) not in [200, 201, 202, 204]
