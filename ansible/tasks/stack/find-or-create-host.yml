---
# Find an existing stack host by tag, or create one if none exists.
# Called from Play 1 of Docker app playbooks (runs on localhost).
#
# The create path is an implicit state machine: it mutates homelabinfra_config
# step by step, and each mutation feeds the next include. Order matters:
#   1. set proxmox.lxc.hostname / .tags / .features from stack_name
#   2. generate-ip.yml — reads homelabinfra_config.networks[...], writes
#      homelabinfra_instance.network.*
#   3. set proxmox.lxc.ip_address from homelabinfra_instance.network.ip_address
#   4. ip-to-vmid.yml — derives proxmox.lxc.vmid from that IP (static IPs only)
#   5. lxc-create.yml — reads homelabinfra_config.proxmox.* and
#      homelabinfra_instance.network.*, writes homelabinfra_instance.lxc.*
#
# Inputs (required before calling):
#   stack_name                          — the logical stack, a bare concept: media, sso,
#                                         monitoring. NOT a hostname and NOT a tag; both
#                                         are derived below, and both add the estate when
#                                         the lab has more than one
#   stack_estate                        — optional; the app's routing.estate ('' = the
#                                         lab's default estate). Placement is resolved from
#                                         the stack AND the estate, so an estate-scoped app
#                                         can never silently land on another estate's host
#   deploy_group                        — optional; inventory group the host is added to.
#                                         Defaults to 'app_deploy' for back-compat, but every
#                                         app playbook passes a PER-INSTANCE name
#                                         (deploy_<instance>). add_host groups persist for the
#                                         whole run, and bootstrap.yml chains app playbooks via
#                                         import_playbook — a single shared group would
#                                         accumulate hosts across steps, so step N's Play 2
#                                         would run its role on every earlier app's guest and
#                                         its Play 3 would read [0], the FIRST app's host.
#   app_config                          — merged app config (handed to Play 2 via add_host)
#   homelabinfra_config.ansible.ssh_user
#   homelabinfra_config.proxmox.*       — API connection + lxc defaults (create path)
#   homelabinfra_config.networks.*      — for generate-ip.yml (create path)
#   homelabinfra_config.infrastructure.stacks.<stack_name>
#                                       — optional; sizing, `shared: true`, plus `network`,
#                                         `pool` and `ip_address` for this stack host's
#                                         address (create path)
#   homelabinfra_config.infrastructure.domains
#                                       — optional; the estates this lab declares
#   homelabinfra_infra                  — optional; forwarded to the host if defined
#
# Mutates (create path only, except .stack):
#   homelabinfra_config.proxmox.lxc.{hostname,tags,stack_tag,stack_id,features,ip_address,
#                                    vmid,vmid_source_ip}
#   homelabinfra_instance.{network,lxc}                — via generate-ip / lxc-create
#   homelabinfra_instance.stack.{hostname,ip_address}  — both paths
#
# Output (for Play 2 to consume):
#   homelabinfra_instance.stack.hostname   — hostname of the stack host
#   homelabinfra_instance.stack.ip_address — IP of the stack host
#   homelabinfra_stack_host_created         — hostvar on the added host; true only on create
#   deploy_group                            — host added so Play 2 can target it
#
# One-shot per play: it sets _stack_hosts and rewrites proxmox.lxc in place, so a
# second call in the same play reads stale state. Call once per app deploy.

# default('') also absorbs an undefined app_config.stack behind the template's
# lazy `stack_name: "{{ app_config.stack }}"` — without it the assert itself
# dies with a raw undefined-variable error instead of the fail_msg.
- name: Assert stack_name is provided
  ansible.builtin.assert:
    that: stack_name | default('') | length > 0
    fail_msg: >-
      stack_name is undefined or empty. Docker apps must declare `stack` in
      vars/app-defaults/<app>.yml (or config/apps/<instance>.yml). If you copied
      playbooks/apps/_template.yml for a native LXC app, delete PATH A (Docker)
      and uncomment PATH B (native LXC) in Play 1 — PATH A is what calls this
      task file.

# Sizing is a property of the STACK, not of whichever app reaches it first. A stack host is
# shared, and the first app to deploy creates it — so per-app sizing would make the host's
# size depend on deploy order, and every app on a stack would have to repeat the same
# numbers to stop that mattering. vars/stack-defaults.yml keys it by stack name; a lab
# overrides one stack with a `stacks:` map in config/infrastructure.yml.
#
# Resolved BEFORE the existence check rather than inside the create branch, because
# `shared:` lives here and it decides which host this app is even looking for.
#
# The global lxc defaults (1 core / 512M / 8G) size a single native service and are nowhere
# near a Docker host: Authentik alone runs a server, a worker, Postgres and Redis.
#
# Not tolerant of absence, unlike the optional config/ loads elsewhere: this file is
# git-managed and always present, and silently falling back would create the stack host at
# the single-service global defaults — a host too small to run what lands on it, which is
# far worse to debug than a missing-file error here.
- name: Load stack sizing defaults
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/stack-defaults.yml"
    name: _stack_defaults_file

- name: Resolve this stack's host sizing
  ansible.builtin.set_fact:
    _stack_sizing: >-
      {{ (_defaults._default | default({}))
         | combine(_defaults[stack_name] | default({}), recursive=True)
         | combine(_overrides[stack_name] | default({}), recursive=True) }}
  vars:
    _defaults: "{{ _stack_defaults_file.stack_defaults | default({}) }}"
    _overrides: "{{ homelabinfra_config.infrastructure.stacks | default({}) }}"

# ── Which host this app is allowed to land on ─────────────────────────────────
#
# ESTATE ISOLATION. An ordinary hosting unit hosts applications from exactly ONE estate.
# `media` is not one host in a two-estate lab — it is `stack-media-personal` and
# `stack-media-foxglove`, and an app in the foxglove estate resolves only to the second.
# Naming alone would not enforce that: the resolution below is what does, because the
# identity the lookup and the create path both use already carries the estate.
#
# Two things must stay true and are the reason this is arithmetic rather than a lookup:
#   - a single-estate lab is byte-identical to a lab with no `domains:` map at all, so
#     nothing gains a suffix it did not ask for;
#   - crossing the boundary requires `shared: true` on the STACK. There is no path by
#     which an app that did not declare it reaches another estate's host, and no path by
#     which `_.shared` is stamped on a host after the fact because two estates happened to
#     collide on one.
#
# The suffix rule is the repository's existing instance-naming rule, applied to a host:
# one estate (or none) means no suffix, and two or more means every estate-scoped identity
# carries its estate. A shared stack is exempt because it IS the lab-wide one.
- name: Resolve the stack's estate and effective identity
  ansible.builtin.set_fact:
    _stack_shared: "{{ _stack_sizing.shared | default(false) | bool }}"
    _stack_id: >-
      {{ stack_name
         if (_stack_sizing.shared | default(false) | bool) or _stack_estates | length < 2
         else stack_name ~ '-' ~ _stack_estate }}
  vars:
    _stack_estates: "{{ (homelabinfra_config.infrastructure | default({})).domains | default({}) }}"
    _stack_default_estate: >-
      {{ ((_stack_estates | dict2items
           | selectattr('value.default', 'defined') | selectattr('value.default')
           | map(attribute='key') | list) | first)
         | default(_stack_estates | list | first | default(''), true) }}
    _stack_estate: "{{ (stack_estate | default('', true)) or _stack_default_estate }}"

# The tag is the identity; the group name is what Ansible sanitised it into. One seam does
# that conversion for the whole repository — see tasks/proxmox/tag-group.yml.
- name: Resolve the inventory group for this stack
  ansible.builtin.include_tasks: ../proxmox/tag-group.yml
  vars:
    tag_group_tag: "_.stack+{{ _stack_id }}"

- name: Refresh inventory to get current Proxmox state
  ansible.builtin.meta: refresh_inventory

- name: Check for existing stack host
  ansible.builtin.set_fact:
    _stack_hosts: "{{ groups[tag_group_name] | default([]) }}"

# ── Use existing host ──────────────────────────────────────────────────────────
- name: Set facts from existing stack host
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | default({}) | combine({
        'stack': {
          'hostname': _stack_hosts[0],
          'ip_address': hostvars[_stack_hosts[0]].ansible_host
            | default(hostvars[_stack_hosts[0]].ansible_default_ipv4.address | default(''))
        }
      }, recursive=True) }}
  when: _stack_hosts | length > 0

- name: Add existing stack host to deploy group
  ansible.builtin.add_host:
    name: "{{ homelabinfra_instance.stack.hostname }}"
    groups: "{{ deploy_group | default('app_deploy') }}"
    ansible_host: "{{ homelabinfra_instance.stack.ip_address }}"
    ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
    app_config: "{{ app_config }}"
    homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
    homelabinfra_stack_host_created: false
  when: _stack_hosts | length > 0
  # Inventory bookkeeping, not a lab change: add_host always reports changed,
  # which alone keeps a fully converged re-run off changed=0.
  changed_when: false

# A reused stack host is not necessarily a RUNNING one — this branch skips the
# provisioning block below, which is where starting lives. See the header of
# tasks/proxmox/ensure-guest-running.yml for the failure this prevents.
- name: Ensure the existing stack host is running
  ansible.builtin.include_tasks: ../proxmox/ensure-guest-running.yml
  vars:
    ensure_guest_host: "{{ _stack_hosts[0] }}"
  when: _stack_hosts | length > 0

# ── Provision new stack host ───────────────────────────────────────────────────
- name: Provision new stack host
  when: _stack_hosts | length == 0
  block:
    - name: Set stack hostname and Docker LXC features
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{
            homelabinfra_config | combine(
              {
                'proxmox': {
                  'lxc': _stack_sizing | combine({
                    'hostname': 'stack-' ~ _stack_id,
                    'tags': _stack_tags,
                    'stack_tag': _stack_tag,
                    'stack_id': _stack_id,
                    'features': _stack_lxc_features
                  }, recursive=True)
                }
              },
              recursive=True
            )
          }}
      vars:
        # The tag list is APPENDED to, and homelabinfra_config survives from the previous
        # play (load-user-vars.yml merges the old dict over the freshly loaded layers). Two
        # stack hosts in one bootstrap therefore gave the second one the first one's stack
        # tag as well as its own — and `Check for existing stack host` matches on exactly
        # that tag, so from the next run on, both stacks would resolve to whichever host
        # inventory listed first. `stack_tag` records what this task last appended so the
        # next call can drop it; a lab-wide tag in config/proxmox.yml is left alone.
        #
        # `_.shared` is dropped from the inherited list for the same reason and re-added
        # only when THIS stack declares it: a shared stack created earlier in the same run
        # must not leave that declaration on the next, ordinary stack host. Both are
        # dropped by exact value, never by prefix — a prefix rule here would eat `_+lab`.
        _stack_tag: "_.stack+{{ _stack_id }}"
        _stack_prior_tag: "{{ homelabinfra_config.proxmox.lxc.stack_tag | default('') }}"
        _stack_base_tags: >-
          {{ (homelabinfra_config.proxmox.lxc.tags | default(['_+lab', '_-debian']))
             | reject('eq', _stack_prior_tag) | reject('eq', '_.shared') | list }}
        # `_-docker` is a declared machine fact, not a probe: this task is the one that
        # decides a guest is a Docker host, so it is the one that says so.
        _stack_tags: >-
          {{ (_stack_base_tags + ['_-docker', _stack_tag]
              + (['_.shared'] if _stack_shared | bool else [])) | unique }}
        _stack_existing_lxc_features: >-
          {{ homelabinfra_config.proxmox.lxc.features | default([]) }}
        _stack_lxc_features: >-
          {{
            _stack_existing_lxc_features | combine({'keyctl': true})
            if _stack_existing_lxc_features is mapping
            else (_stack_existing_lxc_features + ['keyctl=1']) | unique
          }}

    # A stack host sits on ONE estate's network, or on the shared one when the stack
    # declares `shared: true` — the same boundary its hostname and its `_.stack+<id>` tag
    # already carry. Advisory: a lab that has not declared those networks is unaffected.
    - name: Resolve the network this stack host belongs on
      ansible.builtin.include_tasks: ../network/resolve-network.yml
      vars:
        resolve_network_estate: "{{ stack_estate | default('', true) }}"
        resolve_network_shared: "{{ _stack_shared }}"

    # Address selection reads from _stack_sizing, not from homelabinfra_config.proxmox.lxc,
    # for the same reason `stack_tag` exists above: that dict survives between chained plays,
    # so a `pool` or `ip_address` left there by an earlier app's stack host would silently
    # steer this one. _stack_sizing is rebuilt per call from stack-defaults plus this lab's
    # `stacks:` overrides, so it carries only what THIS stack declares.
    #
    # Which network a stack host sits on, which pool it lands in, and whether its address is
    # pinned are all properties of the STACK, exactly like its sizing: the host is shared,
    # and the first app to deploy is the one that creates it. Declaring any of them per app
    # would make the address depend on deploy order.
    - name: Generate IP for new stack host
      ansible.builtin.include_tasks: ../network/generate-ip.yml
      vars:
        network_name: "{{ _stack_sizing.network | default('', true) }}"
        pool_name: "{{ _stack_sizing.pool | default('') }}"
        pool_hint: "{{ _stack_id }}"
        requested_ip_address: "{{ _stack_sizing.ip_address | default('') }}"

    - name: Set stack host IP in config
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config | combine({
            'proxmox': { 'lxc': { 'ip_address': homelabinfra_instance.network.ip_address } }
          }, recursive=True) }}

    - name: Derive VMID from IP
      ansible.builtin.include_tasks: ../proxmox/ip-to-vmid.yml

    - name: Create stack host LXC
      ansible.builtin.include_tasks: ../proxmox/lxc-create.yml

    - name: Set facts from new stack host
      ansible.builtin.set_fact:
        homelabinfra_instance: >-
          {{ homelabinfra_instance | combine({
            'stack': {
              'hostname': homelabinfra_instance.lxc.hostname,
              'ip_address': homelabinfra_instance.network.ip_address
            }
          }, recursive=True) }}

    - name: Add new stack host to deploy group
      ansible.builtin.add_host:
        name: "{{ homelabinfra_instance.stack.hostname }}"
        groups: "{{ deploy_group | default('app_deploy') }}"
        ansible_host: "{{ homelabinfra_instance.stack.ip_address }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
        homelabinfra_stack_host_created: true
