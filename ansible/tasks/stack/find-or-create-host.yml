---
# Find an existing stack host by tag, or create one if none exists.
# Called from Play 1 of Docker app playbooks (runs on localhost).
#
# The create path is an implicit state machine: it mutates homelabinfra_config
# step by step, and each mutation feeds the next include. Order matters:
#   1. set proxmox.lxc.hostname / .tags / .features from stack_name
#   2. generate-ip.yml — reads homelabinfra_config.networks[...], writes
#      homelabinfra_instance.network.*
#   3. set proxmox.lxc.ip_address from homelabinfra_instance.network.ip_address
#   4. ip-to-vmid.yml — derives proxmox.lxc.vmid from that IP (static IPs only)
#   5. lxc-create.yml — reads homelabinfra_config.proxmox.* and
#      homelabinfra_instance.network.*, writes homelabinfra_instance.lxc.*
#
# Inputs (required before calling):
#   stack_name                          — stack id, matches Proxmox tag (e.g. media_stack)
#   deploy_group                        — optional; inventory group the host is added to.
#                                         Defaults to 'app_deploy' for back-compat, but every
#                                         app playbook passes a PER-INSTANCE name
#                                         (deploy_<instance>). add_host groups persist for the
#                                         whole run, and bootstrap.yml chains app playbooks via
#                                         import_playbook — a single shared group would
#                                         accumulate hosts across steps, so step N's Play 2
#                                         would run its role on every earlier app's guest and
#                                         its Play 3 would read [0], the FIRST app's host.
#   app_config                          — merged app config (handed to Play 2 via add_host)
#   homelabinfra_config.ansible.ssh_user
#   homelabinfra_config.proxmox.*       — API connection + lxc defaults (create path)
#   homelabinfra_config.networks.*      — for generate-ip.yml (create path)
#   homelabinfra_infra                  — optional; forwarded to the host if defined
#
# Mutates (create path only, except .stack):
#   homelabinfra_config.proxmox.lxc.{hostname,tags,features,ip_address,vmid}
#   homelabinfra_instance.{network,lxc}                — via generate-ip / lxc-create
#   homelabinfra_instance.stack.{hostname,ip_address}  — both paths
#
# Output (for Play 2 to consume):
#   homelabinfra_instance.stack.hostname   — hostname of the stack host
#   homelabinfra_instance.stack.ip_address — IP of the stack host
#   homelabinfra_stack_host_created         — hostvar on the added host; true only on create
#   deploy_group                            — host added so Play 2 can target it
#
# One-shot per play: it sets _stack_hosts and rewrites proxmox.lxc in place, so a
# second call in the same play reads stale state. Call once per app deploy.

# default('') also absorbs an undefined app_config.stack behind the template's
# lazy `stack_name: "{{ app_config.stack }}"` — without it the assert itself
# dies with a raw undefined-variable error instead of the fail_msg.
- name: Assert stack_name is provided
  ansible.builtin.assert:
    that: stack_name | default('') | length > 0
    fail_msg: >-
      stack_name is undefined or empty. Docker apps must declare `stack` in
      vars/app-defaults/<app>.yml (or config/apps/<instance>.yml). If you copied
      playbooks/apps/_template.yml for a native LXC app, delete PATH A (Docker)
      and uncomment PATH B (native LXC) in Play 1 — PATH A is what calls this
      task file.

- name: Refresh inventory to get current Proxmox state
  ansible.builtin.meta: refresh_inventory

- name: Check for existing stack host
  ansible.builtin.set_fact:
    _stack_hosts: "{{ groups['tag_' + (stack_name | regex_replace('[^A-Za-z0-9_]', '_'))] | default([]) }}"

# ── Use existing host ──────────────────────────────────────────────────────────
- name: Set facts from existing stack host
  ansible.builtin.set_fact:
    homelabinfra_instance: >-
      {{ homelabinfra_instance | default({}) | combine({
        'stack': {
          'hostname': _stack_hosts[0],
          'ip_address': hostvars[_stack_hosts[0]].ansible_host
            | default(hostvars[_stack_hosts[0]].ansible_default_ipv4.address | default(''))
        }
      }, recursive=True) }}
  when: _stack_hosts | length > 0

- name: Add existing stack host to deploy group
  ansible.builtin.add_host:
    name: "{{ homelabinfra_instance.stack.hostname }}"
    groups: "{{ deploy_group | default('app_deploy') }}"
    ansible_host: "{{ homelabinfra_instance.stack.ip_address }}"
    ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
    app_config: "{{ app_config }}"
    homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
    homelabinfra_stack_host_created: false
  when: _stack_hosts | length > 0

# A reused stack host is not necessarily a RUNNING one — this branch skips the
# provisioning block below, which is where starting lives. See the header of
# tasks/proxmox/ensure-guest-running.yml for the failure this prevents.
- name: Ensure the existing stack host is running
  ansible.builtin.include_tasks: ../proxmox/ensure-guest-running.yml
  vars:
    ensure_guest_host: "{{ _stack_hosts[0] }}"
  when: _stack_hosts | length > 0

# ── Provision new stack host ───────────────────────────────────────────────────
- name: Provision new stack host
  when: _stack_hosts | length == 0
  block:
    # Sizing is a property of the STACK, not of whichever app reaches it first. A stack host
    # is shared, and the first app to deploy creates it — so per-app sizing would make the
    # host's size depend on deploy order, and every app on a stack would have to repeat the
    # same numbers to stop that mattering. vars/stack-defaults.yml keys it by stack name;
    # a lab overrides one stack with a `stacks:` map in config/infrastructure.yml.
    #
    # The global lxc defaults (1 core / 512M / 8G) size a single native service and are
    # nowhere near a Docker host: Authentik alone runs a server, a worker, Postgres and
    # Redis.
    #
    # Not tolerant of absence, unlike the optional config/ loads elsewhere: this file is
    # git-managed and always present, and silently falling back would create the stack host
    # at the single-service global defaults — a host too small to run what lands on it,
    # which is far worse to debug than a missing-file error here.
    - name: Load stack sizing defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vars/stack-defaults.yml"
        name: _stack_defaults_file

    - name: Resolve this stack's host sizing
      ansible.builtin.set_fact:
        _stack_sizing: >-
          {{ (_defaults._default | default({}))
             | combine(_defaults[stack_name] | default({}), recursive=True)
             | combine(_overrides[stack_name] | default({}), recursive=True) }}
      vars:
        _defaults: "{{ _stack_defaults_file.stack_defaults | default({}) }}"
        _overrides: "{{ homelabinfra_config.infrastructure.stacks | default({}) }}"

    - name: Set stack hostname and Docker LXC features
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{
            homelabinfra_config | combine(
              {
                'proxmox': {
                  'lxc': _stack_sizing | combine({
                    'hostname': stack_name | replace('_', '-'),
                    'tags': (
                      homelabinfra_config.proxmox.lxc.tags
                      | default(['homelab-infra'])
                    ) + [stack_name],
                    'features': _stack_lxc_features
                  }, recursive=True)
                }
              },
              recursive=True
            )
          }}
      vars:
        _stack_existing_lxc_features: >-
          {{ homelabinfra_config.proxmox.lxc.features | default([]) }}
        _stack_lxc_features: >-
          {{
            _stack_existing_lxc_features | combine({'keyctl': true})
            if _stack_existing_lxc_features is mapping
            else (_stack_existing_lxc_features + ['keyctl=1']) | unique
          }}

    - name: Generate IP for new stack host
      ansible.builtin.include_tasks: ../network/generate-ip.yml
      vars:
        network_name: "{{ homelabinfra_config.proxmox.lxc.network | default('default') }}"

    - name: Set stack host IP in config
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config | combine({
            'proxmox': { 'lxc': { 'ip_address': homelabinfra_instance.network.ip_address } }
          }, recursive=True) }}

    - name: Derive VMID from IP
      ansible.builtin.include_tasks: ../proxmox/ip-to-vmid.yml

    - name: Create stack host LXC
      ansible.builtin.include_tasks: ../proxmox/lxc-create.yml

    - name: Set facts from new stack host
      ansible.builtin.set_fact:
        homelabinfra_instance: >-
          {{ homelabinfra_instance | combine({
            'stack': {
              'hostname': homelabinfra_instance.lxc.hostname,
              'ip_address': homelabinfra_instance.network.ip_address
            }
          }, recursive=True) }}

    - name: Add new stack host to deploy group
      ansible.builtin.add_host:
        name: "{{ homelabinfra_instance.stack.hostname }}"
        groups: "{{ deploy_group | default('app_deploy') }}"
        ansible_host: "{{ homelabinfra_instance.stack.ip_address }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        app_config: "{{ app_config }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
        homelabinfra_stack_host_created: true
