---
# Loads the homelabinfra_config input layer per ansible/vars/CONTRACT.md §2/§4.
# Merge order (low -> high precedence):
#   1. vars/homelabinfra-defaults.yml   (seed; unwrap `homelabinfra_defaults:`)
#   2. config/proxmox.yml               (top-level proxmox/networks/ansible keys, injected as-is)
#   3. config/infrastructure.yml        (whole file wrapped under .infrastructure)
#   4. user_vars_file / pre-set homelabinfra_config  (legacy back-compat; wins on conflict)
#   5. PROXMOX_API_TOKEN / _TOKEN_ID / _USER, VAULTWARDEN_ADMIN_TOKEN and
#      CLOUDFLARE_API_TOKEN from the
#      environment (slice 010; secrets only, and only when actually set)
# config/ is gitignored and may be absent on a clean checkout, so the two config includes use
# `failed_when: false` and default to {} in the merge. Required-key validation is the CALLER's job
# (bootstrap.yml / app playbooks assert homelabinfra_config.proxmox.* / .infrastructure.*), not this
# loader's — the loader stays permissive so partial/absent config surfaces as a friendly caller-side
# assert, never an include_vars file-not-found crash.

# Paths are resolved from the tree, not written relative to the caller.
#
# These used to be `../../vars/...` and `../../../config/...`, which silently encoded an
# assumption about how deep the CALLING playbook sits. Ansible resolves a relative
# include_vars against the playbook's directory, so those paths were correct for
# playbooks/apps/*.yml (two levels under ansible/) and wrong for playbooks/bootstrap.yml
# (one level), where they resolved above the repo root:
#
#   Could not find or access '../../vars/homelabinfra-defaults.yml'
#   Searched in: .../ansible/playbooks/../../vars/homelabinfra-defaults.yml
#
# Every app playbook worked and bootstrap.yml could never have. --syntax-check does not
# catch it because include_vars resolves at runtime.
#
# first_found locates the defaults file wherever the caller happens to be, and every other
# path is derived from it, so a new playbook at any depth works without knowing this.
- name: Resolve the platform vars file from the tree
  ansible.builtin.set_fact:
    _luv_vars_file: >-
      {{ lookup('ansible.builtin.first_found', {
           'files': ['homelabinfra-defaults.yml'],
           'paths': [playbook_dir ~ '/../vars',
                     playbook_dir ~ '/../../vars',
                     playbook_dir ~ '/../../../vars']
         }) }}

# <repo>/ansible/vars/homelabinfra-defaults.yml -> <repo>/config
- name: Derive the config directory
  ansible.builtin.set_fact:
    _luv_config_dir: "{{ _luv_vars_file | dirname | dirname | dirname }}/config"

- name: Load non-secret generated topology if present
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/.generated/facts.yml"
    name: _luv_generated_facts
  failed_when: false

- name: Resolve the in-memory Vaultwarden contract
  ansible.builtin.set_fact:
    homelabinfra_vault: "{{ _luv_vault_runtime }}"
    homelabinfra_infra: >-
      {{ (_luv_generated_facts | default({}))
         | combine(_luv_vault_runtime, recursive=True) }}
  vars:
    # lab-run builds the environment snapshot once, before Ansible starts. Roles can
    # create or update canonical items later in that same process (Ntfy is the first
    # bootstrap example), so upsert-item.yml also publishes each verified write as a
    # localhost fact. That live copy wins here and makes the new credential available
    # to every later play and host without putting it in generated facts or waiting for
    # another job to rebuild HOMELABINFRA_VAULT_JSON.
    _luv_vault_snapshot: >-
      {{ lookup('ansible.builtin.env', 'HOMELABINFRA_VAULT_JSON')
         | default('{}', true) | from_json }}
    _luv_vault_live: "{{ hostvars['localhost'].homelabinfra_vault | default({}) }}"
    _luv_vault_runtime: >-
      {{ _luv_vault_snapshot | combine(_luv_vault_live, recursive=True) }}
  no_log: true

- name: Load homelabinfra defaults
  ansible.builtin.include_vars:
    file: "{{ _luv_vars_file }}"

- name: Load config/proxmox.yml if present (absent on a clean checkout)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/proxmox.yml"
    name: _config_proxmox
  failed_when: false

- name: Load config/infrastructure.yml if present (absent on a clean checkout)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/infrastructure.yml"
    name: _config_infrastructure
  failed_when: false

- name: Load user vars from file option (legacy back-compat — highest precedence)
  ansible.builtin.include_vars:
    file: "{{ user_vars_file }}"
  when: user_vars_file is defined and user_vars_file | length > 0

- name: Merge config layers into homelabinfra_config
  ansible.builtin.set_fact:
    homelabinfra_config: "{{
      homelabinfra_defaults | default({})
      | combine(_config_proxmox | default({}), recursive=True)
      | combine({'infrastructure': _config_infrastructure | default({})}, recursive=True)
      | combine(homelabinfra_config | default({}), recursive=True) }}"

# Secrets from the environment (slice 010). The recommended shape is a config/proxmox.yml
# with api_token_secret absent and PROXMOX_API_TOKEN supplied by Rundeck Key Storage or the
# environment, so the platform's most privileged credential never lands in a file.
# The same applies to the Vaultwarden admin token. These overlay LAST — an operator who
# exports one for a single run means it, and the file value is the fallback, not the winner.
# Absent env vars change nothing, so a lab that keeps its secrets in files is untouched.
- name: Overlay secrets supplied through the environment
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config
         | combine(_env_proxmox, recursive=True)
         | combine(_env_vaultwarden, recursive=True)
         | combine(_env_reverse_proxy, recursive=True) }}
  vars:
    _env_token: "{{ lookup('env', 'PROXMOX_API_TOKEN') | default('', true) }}"
    _env_token_id: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') | default('', true) }}"
    _env_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('', true) }}"
    _env_vw_token: "{{ lookup('env', 'VAULTWARDEN_ADMIN_TOKEN') | default('', true) }}"
    _env_cf_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) }}"
    _env_proxmox: >-
      {{ {'proxmox': {}
          | combine({'api_token_secret': _env_token} if _env_token | length > 0 else {})
          | combine({'api_token_id': _env_token_id} if _env_token_id | length > 0 else {})
          | combine({'api_user': _env_user} if _env_user | length > 0 else {}) } }}
    _env_vaultwarden: >-
      {{ {'infrastructure': {'vaultwarden': {'admin_token': _env_vw_token}}}
         if _env_vw_token | length > 0 else {} }}
    _env_reverse_proxy: >-
      {{ {'infrastructure': {'reverse_proxy': {'dns_challenge': {
           'api_token': _env_cf_token}}}}
         if _env_cf_token | length > 0 else {} }}
  no_log: true

- name: Overlay canonical reverse-proxy secrets into authored provider shape
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config
         | combine({'infrastructure': {'reverse_proxy': {'dns_challenge': {
             'api_token': homelabinfra_vault.reverse_proxy.dns_api_token}}}}, recursive=True) }}
  when:
    - homelabinfra_vault.reverse_proxy.dns_api_token | default('') | length > 0
    - lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) | length == 0
  no_log: true

# The authored DNS block is the ONLY declaration of which DNS provider serves the lab,
# and until 2026-08-15 it never reached the thing that reads it. Wiring reads
# `homelabinfra_infra.dns` (the registry), and nothing wrote a `dns` registry entry:
# bootstrap writes one key per baseline service it deploys, and an external firewall is
# not one it deploys. The vault item `homelab-infra/dns` carries the credential fields
# only — the cutover imports api_key/api_secret/token and nothing else — so
# `homelabinfra_infra.dns.provider` was always absent, every app playbook's
# `dns.provider | default('none') != 'none'` was always false, and DNS wiring could not
# fire in ANY lab regardless of what infrastructure.yml declared. Presumed working,
# never executed; found by reading, not by a run.
#
# Authored values are the BASE and the vault/facts copy is overlaid on top, so a
# credential in the vault still wins over one left in the file pre-cutover.
- name: Overlay the authored DNS provider onto the registry
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ homelabinfra_infra
         | combine({'dns': (_config_infrastructure | default({})).dns | default({}, true)
                           | combine(homelabinfra_infra.dns | default({}, true))}) }}
  when: ((_config_infrastructure | default({})).dns | default({}, true)) | length > 0
  no_log: true

# The Seed-mode source of the DNS provider's RECORD-WIRING credential, exactly as
# CLOUDFLARE_API_TOKEN is the Seed-mode source of the ACME DNS-01 credential above.
#
# Before cutover there is no vault to read, and `dns.provider` is authored in
# config/infrastructure.yml while its api_key/api_secret deliberately are NOT — the same
# shape-without-secret split proxmox.yml makes for the API token. Without this overlay a
# lab that declared a DNS provider failed on its first app deploy, because
# tasks/wiring/opnsense.yml asserts a credential nothing pre-cutover could supply; the
# only answer was hand-writing it into config/infrastructure.yml, which is what the
# cutover exists to end. rundeck/bootstrap-rundeck.sh asks for it beside the provider and
# writes /etc/homelab-infra/secrets.d/dns.env; lab-run.sh exports it only while the
# vault-mode marker is absent; vaultwarden-cutover.yml then reads it off
# homelabinfra_infra.dns and imports it into the canonical homelab-infra/dns item.
#
# After cutover the environment is empty and the vault copy (merged into
# homelabinfra_infra at the top of this file) is the only source, so this task is inert.
- name: Overlay the Seed-mode DNS credential onto the registry
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ homelabinfra_infra
         | combine({'dns': (homelabinfra_infra.dns | default({}, true)) | combine(_env_dns)},
                   recursive=True) }}
  vars:
    _env_dns_key: "{{ lookup('env', 'LAB_DNS_API_KEY') | default('', true) }}"
    _env_dns_secret: "{{ lookup('env', 'LAB_DNS_API_SECRET') | default('', true) }}"
    _env_dns: >-
      {{ {}
         | combine({'api_key': _env_dns_key} if _env_dns_key | length > 0 else {})
         | combine({'api_secret': _env_dns_secret} if _env_dns_secret | length > 0 else {}) }}
  when: >-
    (lookup('env', 'LAB_DNS_API_KEY') | default('', true) | length > 0)
    or (lookup('env', 'LAB_DNS_API_SECRET') | default('', true) | length > 0)
  no_log: true

- name: Overlay the authored mail provider onto the registry
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ homelabinfra_infra
         | combine({'mail': (_config_infrastructure | default({})).mail | default({}, true)
                            | combine(homelabinfra_infra.mail | default({}, true))}) }}
  when: ((_config_infrastructure | default({})).mail | default({}, true)) | length > 0
  no_log: true

# Same Seed-mode shape as the DNS record-wiring credential above: mail is always an
# external relay, so there is nothing for a baseline-service bootstrap play to write,
# and a lab that declares mail.provider before cutover still needs a credential the
# first time a mail-sending app deploys. Unlike LAB_DNS_API_KEY/LAB_DNS_API_SECRET,
# rundeck/bootstrap-rundeck.sh does not yet prompt for this one or write a
# secrets.d/mail.env sink -- that prompt is deferred (see docs/meta/
# 418-platform-mail-contract/README.md). An operator sets LAB_MAIL_PASSWORD by hand
# before a Seed-mode run that needs mail; vaultwarden-cutover.yml then imports whatever
# value it finds on homelabinfra_infra.mail.password into homelab-infra/mail.
- name: Overlay the Seed-mode mail credential onto the registry
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ homelabinfra_infra
         | combine({'mail': (homelabinfra_infra.mail | default({}, true))
                            | combine({'password': _env_mail_password} if _env_mail_password | length > 0 else {})},
                   recursive=True) }}
  vars:
    _env_mail_password: "{{ lookup('env', 'LAB_MAIL_PASSWORD') | default('', true) }}"
  when: lookup('env', 'LAB_MAIL_PASSWORD') | default('', true) | length > 0
  no_log: true

- name: Overlay canonical DNS secrets into authored provider shape
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config
         | combine({'infrastructure': {
             'dns': homelabinfra_vault.dns | default({}),
             'notifications': homelabinfra_vault.notifications | default({}),
             'mail': homelabinfra_vault.mail | default({}),
             'domains': _vault_estate_domains
           }}, recursive=True) }}
  vars:
    # Serialized deliberately. A template carrying {% %} statement blocks is not a single
    # full-expression template, so Ansible renders it to a STRING rather than converting it
    # back to a dict — `domains` then arrives as "  {}" and every consumer that expects a
    # mapping breaks on it (caddy's .values(), cutover's dict2items). Emitting JSON and
    # parsing it back in a full-expression template restores the real type.
    # The estate items mirror the global split, and that split is load-bearing:
    #   homelab-infra/estates/<n>/reverse_proxy.dns_api_token -> the ACME DNS-01
    #     challenge credential, exactly as homelab-infra/reverse_proxy.dns_api_token
    #     supplies the single-estate lab above.
    #   homelab-infra/estates/<n>/dns -> the DNS-RECORD-WIRING credential, read
    #     straight off homelabinfra_infra.estates.<n>.dns by tasks/resolve-estate.yml,
    #     exactly as homelab-infra/dns serves the default estate.
    # These were one item until 2026-08-15, and the conflation was not cosmetic: an
    # OPNsense key/secret stored for record wiring landed in the estate's dns_challenge
    # block, where the caddy role would have read `provider: opnsense` and issued the
    # estate's certificates against a DNS-01 module that is not its ACME provider.
    _vault_estate_domains_json: >-
      {%- set result = {} -%}
      {%- for estate in (homelabinfra_vault.estates | default({}) | dict2items) -%}
      {%- if estate.value.reverse_proxy is defined
             and estate.value.reverse_proxy.dns_api_token | default('') | length > 0 -%}
      {%- set _ = result.update({estate.key: {'dns_challenge':
            {'api_token': estate.value.reverse_proxy.dns_api_token}}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result | to_json }}
    _vault_estate_domains: "{{ _vault_estate_domains_json | from_json }}"
  no_log: true
