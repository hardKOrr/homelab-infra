---
# Loads the homelabinfra_config input layer per ansible/vars/CONTRACT.md §2/§4.
# Merge order (low -> high precedence):
#   1. vars/homelabinfra-defaults.yml   (seed; unwrap `homelabinfra_defaults:`)
#   2. config/proxmox.yml               (top-level proxmox/networks/ansible keys, injected as-is)
#   3. config/infrastructure.yml        (whole file wrapped under .infrastructure)
#   4. user_vars_file / pre-set homelabinfra_config  (legacy back-compat; wins on conflict)
#   5. PROXMOX_API_TOKEN / _TOKEN_ID / _USER and VAULTWARDEN_ADMIN_TOKEN from the
#      environment (slice 010; secrets only, and only when actually set)
# config/ is gitignored and may be absent on a clean checkout, so the two config includes use
# `failed_when: false` and default to {} in the merge. Required-key validation is the CALLER's job
# (bootstrap.yml / app playbooks assert homelabinfra_config.proxmox.* / .infrastructure.*), not this
# loader's — the loader stays permissive so partial/absent config surfaces as a friendly caller-side
# assert, never an include_vars file-not-found crash.

# Paths are resolved from the tree, not written relative to the caller.
#
# These used to be `../../vars/...` and `../../../config/...`, which silently encoded an
# assumption about how deep the CALLING playbook sits. Ansible resolves a relative
# include_vars against the playbook's directory, so those paths were correct for
# playbooks/apps/*.yml (two levels under ansible/) and wrong for playbooks/bootstrap.yml
# (one level), where they resolved above the repo root:
#
#   Could not find or access '../../vars/homelabinfra-defaults.yml'
#   Searched in: .../ansible/playbooks/../../vars/homelabinfra-defaults.yml
#
# Every app playbook worked and bootstrap.yml could never have. --syntax-check does not
# catch it because include_vars resolves at runtime.
#
# first_found locates the defaults file wherever the caller happens to be, and every other
# path is derived from it, so a new playbook at any depth works without knowing this.
- name: Resolve the platform vars file from the tree
  ansible.builtin.set_fact:
    _luv_vars_file: >-
      {{ lookup('ansible.builtin.first_found', {
           'files': ['homelabinfra-defaults.yml'],
           'paths': [playbook_dir ~ '/../vars',
                     playbook_dir ~ '/../../vars',
                     playbook_dir ~ '/../../../vars']
         }) }}

# <repo>/ansible/vars/homelabinfra-defaults.yml -> <repo>/config
- name: Derive the config directory
  ansible.builtin.set_fact:
    _luv_config_dir: "{{ _luv_vars_file | dirname | dirname | dirname }}/config"

- name: Load homelabinfra defaults
  ansible.builtin.include_vars:
    file: "{{ _luv_vars_file }}"

- name: Load config/proxmox.yml if present (absent on a clean checkout)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/proxmox.yml"
    name: _config_proxmox
  failed_when: false

- name: Load config/infrastructure.yml if present (absent on a clean checkout)
  ansible.builtin.include_vars:
    file: "{{ _luv_config_dir }}/infrastructure.yml"
    name: _config_infrastructure
  failed_when: false

- name: Load user vars from file option (legacy back-compat — highest precedence)
  ansible.builtin.include_vars:
    file: "{{ user_vars_file }}"
  when: user_vars_file is defined and user_vars_file | length > 0

- name: Merge config layers into homelabinfra_config
  ansible.builtin.set_fact:
    homelabinfra_config: "{{
      homelabinfra_defaults | default({})
      | combine(_config_proxmox | default({}), recursive=True)
      | combine({'infrastructure': _config_infrastructure | default({})}, recursive=True)
      | combine(homelabinfra_config | default({}), recursive=True) }}"

# Secrets from the environment (slice 010). The recommended shape is a config/proxmox.yml
# with api_token_secret absent and PROXMOX_API_TOKEN supplied by Rundeck Key Storage or the
# Semaphore environment, so the platform's most privileged credential never lands in a file.
# The same applies to the Vaultwarden admin token. These overlay LAST — an operator who
# exports one for a single run means it, and the file value is the fallback, not the winner.
# Absent env vars change nothing, so a lab that keeps its secrets in files is untouched.
- name: Overlay secrets supplied through the environment
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config
         | combine(_env_proxmox, recursive=True)
         | combine(_env_vaultwarden, recursive=True) }}
  vars:
    _env_token: "{{ lookup('env', 'PROXMOX_API_TOKEN') | default('', true) }}"
    _env_token_id: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') | default('', true) }}"
    _env_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('', true) }}"
    _env_vw_token: "{{ lookup('env', 'VAULTWARDEN_ADMIN_TOKEN') | default('', true) }}"
    _env_proxmox: >-
      {{ {'proxmox': {}
          | combine({'api_token_secret': _env_token} if _env_token | length > 0 else {})
          | combine({'api_token_id': _env_token_id} if _env_token_id | length > 0 else {})
          | combine({'api_user': _env_user} if _env_user | length > 0 else {}) } }}
    _env_vaultwarden: >-
      {{ {'infrastructure': {'vaultwarden': {'admin_token': _env_vw_token}}}
         if _env_vw_token | length > 0 else {} }}
  no_log: true
