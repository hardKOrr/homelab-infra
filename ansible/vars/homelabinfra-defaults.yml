homelabinfra_defaults:
  infrastructure:
    media_storage:
      # The identity that owns the media library, on the node and inside the
      # unprivileged stack host alike. A guest maps its ids into the node's
      # 100000+ block, so a library owned by anything outside that block reads as
      # nobody:nogroup inside the container and cannot be written; the platform
      # gives the guest a passthrough entry for this one id so both sides mean the
      # same account. See config.example/infrastructure.yml for how to choose one.
      #
      # An account of the platform's own, deliberately: this defaulted to 1000
      # once, which on a Debian node is whoever was created there first, and the
      # library ended up owned by an unrelated file-server account.
      owner:
        user: homelab-infra
        uid: 1313
        gid: 1313
    # Boot order (slice 205). Proxmox starts onboot guests in ascending `order`,
    # waiting `up` seconds after each before continuing. These are the values a guest
    # that declares no `proxmox.boot_order` of its own receives, so an ordinary app
    # starts after every platform service it depends on and before the monitoring that
    # would otherwise page about it.
    #
    # The tiers the platform services claim, for reference when placing a new one:
    #   10 reverse proxy · 20 secrets · 30 notifications · 40 SSO · 45 cluster nodes
    #   50 ordinary apps and stack hosts · 60 backups · 70 uptime monitoring
    #
    # Uptime Kuma is deliberately last: it must not alarm about services that are
    # still on their way up. Set `order: none` to switch ordering off lab-wide and
    # leave every guest exactly as Proxmox would have had it.
    maintenance:
      boot:
        order: 50
        up: 15
  networks: {}
  ansible:
    ssh_user: root
  proxmox:
    api_port: 8006
    api_user: root@pam
    lxc:
      # The OS image every container this platform creates starts from. It lives here, in
      # the GLOBAL defaults, because a Docker stack host has no app-defaults file to carry
      # it — the three native app-defaults each pinned their own copy and nothing supplied
      # one for tasks/stack/find-or-create-host.yml, so creating a stack host failed its
      # ostemplate assert and no Docker app could be deployed at all.
      ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
      disk_volume:
        size: 8
      cores: 1
      description: LXC Container created by Ansible
      features:
        - nesting=1
      memory: 512
      onboot: true
      tags:
        - homelab-infra
    vm: #TODO: EVerything about VM stuff
      agent: 1
      onboot: true
      autostart: true
      description: VM created by Ansible
      tags:
        - homelab-infra
  docker_hosts:
    docker_default_host:
      type: vm

