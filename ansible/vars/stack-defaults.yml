---
# Sizing for the LXC that hosts each Docker stack.
#
# A stack host is shared: several apps land on one container, and the first app to deploy
# is the one that creates it. Sizing therefore belongs to the STACK, not to whichever app
# happened to get there first — otherwise the host's size depends on deploy order, and
# every app on a stack has to repeat the same numbers to keep that order from mattering.
#
# The global lxc defaults in homelabinfra-defaults.yml size a single native service
# (1 core / 512M / 8G). A stack host runs a Docker engine plus every container its
# tenants bring, so it starts from here instead.
#
# This file is git-managed — git pull may update these defaults. To override for one lab,
# add a `stacks:` map to config/infrastructure.yml; it is deep-merged over these:
#
#   stacks:
#     monitoring_stack:
#       memory: 8192
#
# Resizing an existing stack host is a Proxmox operation, not a deploy-time one: these
# values apply when the host is CREATED. Changing them later does not move a running host.

stack_defaults:
  # Applied to any stack without an entry of its own, so a new stack works before anyone
  # has decided what it should be.
  _default:
    cores: 2
    memory: 2048
    disk_volume:
      size: 16

  # Authentik alone — server, worker, Postgres and Redis. It gets its own host because it
  # carries a database and is the greediest thing the platform runs: a co-tenant's restart
  # or a co-tenant's memory spike would land on the lab's login path. The worker is the
  # memory-hungry piece.
  sso_stack:
    # Boot tier 40 — SSO precedes the apps that authenticate through it.
    boot_order: 40
    cores: 4
    memory: 4096
    disk_volume:
      size: 32

  # Everything that watches the lab: Uptime Kuma, Prometheus and Grafana. These share
  # willingly — they are read-mostly, none of them carries a database the lab depends on,
  # and if the monitoring host restarts, nothing stops working except the watching.
  #
  # Disk is the number that matters: Prometheus' TSDB grows with retention and with every
  # node_exporter tasks/guest-bootstrap.yml adds to the lab.
  monitoring_stack:
    # Boot tier 70 — last on purpose. Uptime Kuma must not page about services that are
    # still on their way up, and Prometheus gaps during an ascent are expected.
    boot_order: 70
    cores: 4
    memory: 4096
    disk_volume:
      size: 64

  # The *arr suite, download clients and Bazarr. Many small containers, and the media
  # itself lives on mounted storage rather than the rootfs.
  media_stack:
    cores: 4
    memory: 4096
    disk_volume:
      size: 32
