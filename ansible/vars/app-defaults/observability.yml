---
# Default stack and app configuration for the observability stack — Prometheus,
# Grafana and a node exporter, deployed together as one app.
# Users override specific values in config/apps/observability.yml.
# This file is git-managed — git pull may update these defaults.
#
# One app, not two: Grafana's only datasource is Prometheus, nobody runs one
# without the other, and splitting them would mean two deploy jobs to stand up a
# single capability. Decision recorded in https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/done/405-app-grafana/notes.md.

observability_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  # Native hosting (hosting.method native, guest type from the instance's proxmox.guest_type)
  # gives the instance its own guest.
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 2048
    disk_volume:
      size: 16
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  # Docker app: no `proxmox:` block. The stack host is found or created by tag on
  # first deploy and reused afterwards (tasks/stack/find-or-create-host.yml).
  # Its own stack: Prometheus retention grows, and metrics collection should not
  # compete for disk with the login path on sso.
  stack: monitoring

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # The user-facing piece is Grafana, so app.port is Grafana's — it is what the
    # reverse proxy routes to and what the uptime monitor checks.
    port: 3000
    prometheus_port: 9090       # internal only; never published through the proxy
    node_exporter_port: 9100

    data_path: "/opt/{{ instance }}/data"
    config_path: "/opt/{{ instance }}/config"

    admin_user: admin
    retention: 30d              # how long Prometheus keeps samples
    scrape_interval: 30s

    # One exact release per component for every method: the images below and the native
    # Grafana APT package (https://grafana.com/docs/grafana/latest/setup-grafana/installation/debian/)
    # and Prometheus release binary (https://prometheus.io/docs/prometheus/latest/installation/).
    grafana_version: "13.3.0"
    prometheus_version: "3.16.0"
    prometheus_sha256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
    grafana_image: "docker.io/grafana/grafana:13.3.0"
    prometheus_image: "docker.io/prom/prometheus:v3.16.0"
    # Kubernetes backend only: one PVC per data tree, on the cluster's default
    # StorageClass (storageClassName omitted).
    # Used only to rewrite the administrator login in a restored Grafana database.
    sqlite_image: "docker.io/keinos/sqlite3:latest"
    grafana_storage: 2
    prometheus_storage: 10

    # No node_exporter_image: node_exporter is a PACKAGE on every guest, installed by
    # tasks/guest-bootstrap.yml, not a container this stack runs. node_exporter_port
    # above is still live — it is the port Prometheus scrapes every guest on.

  routing:
    subdomain: observability               # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal            # LAN-only: Grafana exposes metrics for every guest
    identity: catalog           # catalog tile only — Grafana has its own login and user
                                # model; set forward_auth to put Authentik in front as well

  # Kubernetes backend only: Prometheus scrapes every guest's node_exporter from a pod,
  # so the cluster-node alias needs that port (ansible/tasks/kubernetes/README.md).
  firewall:
    egress:
      - name: node-exporter
        protocol: TCP
        port: 9100

  # One stopped archive captures Grafana's saved dashboards and alert rules, and
  # Prometheus's TSDB. The configuration files are regenerated on Deploy.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timeout_seconds: 3600
    scratch_size: 5
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
