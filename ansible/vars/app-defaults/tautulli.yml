---
# Tautulli observes one Plex server. Its server token is published by the Plex
# role to Vaultwarden, never authored in this file or an instance config.
tautulli_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: media

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 2048
    disk_volume:
      size: 16
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  # Docker and native archive the config directory through the shared PBS operations
  # (roles/tautulli/tasks/backup.yml, restore-guest.yml).
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # Docker and native run the same upstream release. Native clones this tag of
    # https://github.com/Tautulli/Tautulli into /opt/Tautulli (its Linux install,
    # https://github.com/Tautulli/Tautulli/wiki/Installation#linux).
    image: "ghcr.io/tautulli/tautulli:v2.18.2"
    native_version: "v2.18.2"
    port: 8181
    container_port: 8181
    config_path: "/opt/{{ instance }}/config"
    puid: 1313
    pgid: 1313
    # Name of the Plex instance whose token the role reads from Vaultwarden.
    # Deploy that Plex instance first; its role records the server token after
    # proving that its claim completed.
    plex_instance: plex
    # Config PVC size in Gi on Kubernetes (the cluster's default StorageClass).
    storage: 2
  routing:
    subdomain: tautulli
    proxy: internal
    access: internal
    # Tautulli uses Plex authentication itself. A forward-auth proxy would
    # interfere with its Plex sign-in flow.

  # The Kubernetes pod reaches Plex's published port through the cluster-node alias; the
  # role resolves the address before the firewall step. Docker keeps its guest access.
  firewall:
    egress:
      - name: plex
        protocol: TCP
        port: "{{ _tautulli_plex_port | default(32400) }}"
        destination: "{{ _tautulli_plex_address | default('') }}"

  # Stop the one service and archive config, excluding disposable logs and cache.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    # The PBS client Job on Kubernetes.
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
