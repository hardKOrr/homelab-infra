---
# Home Assistant is Docker on a dedicated Debian VM, or Docker on the home-assistant-lxc
# stack LXC when the instance sets stack: home-assistant-lxc, or a pod on the k3s cluster
# with hosting.method: kubernetes, or a venv under systemd on its own LXC or VM with
# hosting.method: native and an explicit proxmox.guest_type. A USB coordinator on the VM
# uses a dedicated mapping; on the LXC it uses the shared LXC seam; on Kubernetes it is
# attached to the first cluster node and the pod is pinned there.
home_assistant_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    vm:
      cores: 2
      memory: 4096
      disk_size: 32
      agent: 1
      onboot: true
      description: "Home Assistant, created by homelab-infra"
      # Home Assistant owns this VM; it is not a shared Docker stack host.
      tags: [_+lab, _-debian]
    # Used only when hosting.method is native (the guest type comes from the instance's
    # proxmox.guest_type). The VM block above sizes a native VM too.
    cores: 2
    memory: 4096
    disk_volume:
      size: 32
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # One exact upstream version for both methods: the image tag and the native build of
    # the source release (https://github.com/home-assistant/core). native_sha256 verifies
    # that tag's source archive; native_python is the standalone interpreter the release
    # requires (requires-python in its pyproject.toml), as Frigate's native build does.
    image: ghcr.io/home-assistant/home-assistant:2026.11.0
    native_version: "2026.11.0"
    native_sha256: 82139b0d7b2d87376e9fa28fd70ab5415c3fe5ac0fede5d9fa33b938467df174
    native_python:
      version: "3.14"
      url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz
      sha256: 1b38024924eb7f4cf0cab45d7b871d1f1991354190fccd2625ac7529a43786e2
    port: 8123
    config_path: "/opt/{{ instance }}/config"
    initial_configuration: {}
    # Kubernetes only: the config volume size in GiB (default StorageClass), and the pod
    # network that may present X-Forwarded-For (the ingress controller's pod). Used to seed
    # configuration.yaml on a fresh instance that sets no initial_configuration.
    config_storage: 2
    kubernetes_trusted_proxies: ["10.42.0.0/16"]
    # An empty mapping disables passthrough. When set, it must name an operator-defined
    # dedicated mapping and the path must match the coordinator's guest node.
    usb_mapping: ""
    usb_device_path: /dev/ttyUSB0
    # Integration credentials are a JSON object in the hidden Vaultwarden field
    # integration_credentials, not in config/apps/<instance>.yml.

  routing:
    subdomain: home-assistant
    proxy: internal
    access: internal
    identity: catalog

  # The entire Home Assistant config directory is quiesced and archived as one PBS
  # recovery unit. It includes the generated secrets file and integration state.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
