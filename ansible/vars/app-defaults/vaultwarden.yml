---
# Default Proxmox and app configuration for Vaultwarden.
# Users override specific values in config/apps/vaultwarden.yml.
# This file is git-managed — git pull may update these defaults.

vaultwarden_defaults:
  proxmox:
    type: lxc                   # native LXC — single binary, no Docker needed
    # Boot tier 20 — every deploy and every service credential resolves through here,
    # so it precedes everything except the edge.
    boot_order: 20
    ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
    cores: 1
    memory: 512                 # MB — Vaultwarden is very lightweight
    disk_volume:
      size: 8                   # GB
    network: default
    # Ownership plus the declared machine fact. The application tag is NOT listed here:
    # the deploy appends `_<instance>`, so a second instance under another name is tagged
    # with the name it was actually deployed as. See inventory/proxmox.yml for the grammar.
    tags:
      - _+lab
      - _-debian

  app:
    port: 80                    # web vault + API + /admin panel (one port for everything)
    data_path: "/opt/{{ instance }}/data"
    signups_allowed: false      # open registration off by default — invite via /admin
    service_name: vaultwarden   # systemd unit — playbooks/apps/remove.yml stops this

  update:
    github_repo: dani-garcia/vaultwarden
    binary_path: /usr/local/bin/vaultwarden

  routing:
    subdomain: vaultwarden                 # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal            # LAN-only: the vault is the platform's root of trust
    identity: catalog           # catalog tile only — Vaultwarden has its own auth
                                # (master-password E2E); never wrap it in forward_auth
