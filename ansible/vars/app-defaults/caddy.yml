---
# Default Proxmox and app configuration for Caddy — the default reverse proxy.
# Users override specific values in config/apps/caddy.yml.
# This file is git-managed — git pull may update these defaults.

caddy_defaults:
  proxmox:
    type: lxc                   # native LXC — single Go binary from the official apt repo
    ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
    cores: 1
    memory: 512                 # MB — raise only for very high request volume
    disk_volume:
      size: 8                   # GB
    network: default
    tags:
      - homelab-infra
      - caddy

  app:
    # The admin API port. This is the port recorded as reverse_proxy.port in the
    # service registry — it is what tasks/wiring/caddy.yml talks to, and it is what
    # the uptime monitor checks. The public listeners are http_port/https_port.
    port: 2019
    http_port: 80
    https_port: 443
    service_name: caddy         # systemd unit — playbooks/apps/remove.yml stops this

    # tls_mode: acme | internal
    #   acme     — public certificates via Let's Encrypt. With the recommended
    #              infrastructure.reverse_proxy.dns_challenge configuration this
    #              uses DNS-01, so public records and inbound WAN ports are unnecessary.
    #   internal — Caddy's built-in CA issues certificates. Correct for labs with no
    #              public DNS; browsers warn until you trust the root at
    #              /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
    tls_mode: acme
    acme_email: ""              # optional; recommended for expiry notices from the CA

    # Legacy location for DNS-01. New configurations declare the non-secret provider
    # in infrastructure.reverse_proxy.dns_challenge and keep dns_api_token in the
    # canonical homelab-infra/reverse_proxy Vaultwarden item. The role installs the
    # matching caddy-dns module (caddy add-package) on deploy.
    # Estates declared in config/infrastructure.yml `domains:` carry their own
    # dns_challenge block there instead — each estate's token is referenced only
    # from its own domain's TLS policy.
    # dns_challenge:
    #   provider: cloudflare    # any github.com/caddy-dns/<provider> module
    #   api_token: ""           # provider-specific fields retain native names;
    #                           # legacy Seed/recovery input only; never commit it

  update:
    github_repo: caddyserver/caddy   # used by lab-update-check for the release notes link

  routing:
    proxy: none                 # Caddy IS the reverse proxy — never route it through itself
    identity: none              # the admin API is LAN-only; Authentik in front would break wiring
