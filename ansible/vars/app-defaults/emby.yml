---
# Emby is an independent media-server option on the shared media stack. It does
# not participate in the Servarr API registry and is never selected by default.
emby_defaults:
  platform_layers: [media_storage]
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes]
    impossible: {}
  stack: media
  # Recovery is owned by this deployment slice: the complete Emby config
  # database, including its own users and library definitions, is archived as
  # one quiesced application-consistent unit. Media libraries remain external.
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  media_storage: {}
  app:
    image: lscr.io/linuxserver/emby:latest
    # Keep the host port distinct from Jellyfin (8096), so the alternatives can coexist.
    port: 8097
    container_port: 8096
    config_path: "/opt/{{ instance }}/config"
    # Config PVC size in Gi on Kubernetes (the cluster's default StorageClass).
    storage: 10
    admin_user: admin
    puid: 1313
    pgid: 1313
    # Optional dedicated Proxmox iGPU. Deploy maps /dev/dri, adds its host device
    # groups and enables VA-API unless hardware_transcoding is false. On Kubernetes it
    # names the iGPU of one k3s node (cluster.nodes[].gpu_device) and pins the pod there.
    gpu_device: ""
    devices: []
    # Hardware transcoding requires Emby Premiere. False keeps device access only.
    hardware_transcoding: true
    libraries:
      - name: Movies
        collection_type: movies
        subpath: movies
      - name: TV
        collection_type: tvshows
        subpath: tv
      - name: Music
        collection_type: music
        subpath: music
  routing:
    monitor_path: /emby/System/Info/Public
    subdomain: emby
    proxy: internal
    access: internal
    # Emby's users and clients authenticate with Emby's own API. Authentik is
    # catalog-only and must not forward-auth/proxy-gate those clients.
    identity: catalog
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
