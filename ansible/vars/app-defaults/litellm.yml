---
# Default configuration for LiteLLM Proxy — the stateless AI gateway (Kubernetes by default,
# or Docker, or natively on its own LXC or VM).
# Users override specific values in config/apps/litellm.yml. Provider credentials are
# deliberately absent: the `app.credentials` map names Vaultwarden fields only.
#
# HOSTING DECISION
#
# LiteLLM's proxy process does not need a writable filesystem. Its routing configuration
# is rendered into a ConfigMap, provider credentials are read from a Vaultwarden-backed
# Kubernetes Secret, and virtual keys, key metadata, spend records and usage logs live in
# the named external PostgreSQL database. This makes the pod replaceable and avoids a PVC
# that would pin the gateway to one Kubernetes node. The database is backed up with the
# rendered routing ConfigMap by this role's PBS CronJob.
#
# See https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/145-litellm/README.md for the upstream validation and the recovery boundary.

litellm_defaults:

  hosting:
    method: kubernetes
    supported: [kubernetes, docker-lxc, docker-vm, native-lxc, native-vm]
    impossible: {}

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  cluster: k3s-cluster

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 2048
    disk_volume:
      size: 8
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # Docker and Kubernetes run the image of the same release the native install gets from
    # PyPI as litellm[proxy] (https://github.com/BerriAI/litellm#readme).
    image: "docker.litellm.ai/berriai/litellm:v1.109.0"
    native_version: "1.109.0"
    port: 4000

    # LiteLLM virtual keys, key metadata, spend logs and usage records. This is a named
    # database on a separately deployed PostgreSQL instance, never an in-namespace sidecar.
    database:
      provider: postgresql
      instance: postgresql-litellm
      version: "16"
      name: litellm
      role: litellm

    # Map runtime environment names used by model routes to hidden fields in
    # homelab-infra/apps/<instance>. The values are entered with Store Secret and are
    # never accepted from config/apps or this defaults file.
    credentials: {}

    # Each route may set model, api_base, api_version and other LiteLLM parameters. Set
    # `api_key_env` when the provider needs a key; it must name an entry in credentials.
    models: []

  routing:
    subdomain: litellm
    proxy: internal
    access: internal
    # Authentik supplies a catalog tile, but does not sit in front of the OpenAI-compatible
    # API: clients authenticate with LiteLLM's master/proxy key instead.
    identity: catalog

  # The backup is an application-consistent PostgreSQL dump plus the exact rendered
  # routing ConfigMap. Vaultwarden remains the source of provider keys and is not copied
  # into the archive.
  backup:
    enabled: true
    schedule: "0 3 * * *"
    retention_days: 14
    # Docker method: roles/litellm/tasks/backup.yml is the on-demand backup.
    application_consistent: true
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
