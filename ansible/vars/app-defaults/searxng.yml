---
# Default configuration for SearXNG — the metasearch engine, on the Kubernetes hosting
# backend. Users override specific values in config/apps/searxng.yml.
# This file is git-managed — git pull may update these defaults.
#
# WHY THIS IS A KUBERNETES CANDIDATE THAT SHIPPED, AND WHY IT STAYS INTERNAL-ONLY
#
# https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/408-app-catalog/README.md's searxng row: "Mostly stateless metasearch
# workload; usually internal-only. Keep any cache disposable or external." SearXNG's own
# state is exactly one thing: `secret_key`, the value it signs its own cookies and CSRF
# tokens with. That is generated once and kept in Vaultwarden like every other
# application credential (roles/searxng/tasks/main.yml) — it is a credential, not data,
# and losing it costs nothing but a session reset. Search results, engine state and the
# optional rate-limiter counters are never written to a volume.
#
# NO PERSISTENT VOLUME ANYWHERE IN THIS ROLE, DELIBERATELY
#
# The instance's Redis is a Deployment with no PersistentVolumeClaim — see
# roles/searxng/templates/manifest.yaml.j2. It backs SearXNG's own bot/rate limiter
# (server.limiter), and losing it on a pod restart only resets counters, never data a
# restore would need to recover. This is the "disposable" half of the catalog note; the
# other half — pointing it at a lab's own shared Redis/Valkey backend instead — remains a
# later option once this platform has a named-Redis consumer contract to point it at
# (ansible/vars/contract/recovery.md, "Application database provisioning"). Until then this role
# declares no `backup:` block at all, the same as roles/flaresolverr: there is nothing a
# nightly job would have to preserve.
searxng_defaults:

  # Recovery disposition: rebuild-only for the application, with the shared Kubernetes
  # cluster's PBS guest route as the whole-guest fallback. SearXNG has no product-native
  # export/import artifact and this role creates no persistent volume; a redeploy restores
  # the declared configuration and starts an empty limiter cache.

  hosting:
    method: kubernetes
    supported: [kubernetes, docker-lxc, docker-vm, native-lxc, native-vm]
    impossible: {}

  # NO `cluster:` HERE, DELIBERATELY — see the identical comment in
  # vars/app-defaults/jellyseerr.yml. The resolver has no per-app selector to read it.

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 1024
    disk_volume:
      size: 8
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # Every method runs the same exact upstream release. SearXNG publishes no git tags, so
    # the native install pins the release's commit (the image tag's suffix is its short form).
    image: "searxng/searxng:2026.11.9-57ff753ad"
    native_version: "2026.11.9"
    native_commit: "57ff753ad416b7bf27e59d72ae8c7cac93b56be4"
    port: 8080

    # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or
    # vm) publishes `port` on the stack host; `uid` owns the settings file (the image's user).
    # Native method: granian listens on `port` of the guest's own address.
    uid: 977

    # SearXNG's own instance name, shown in its UI and its opensearch descriptor. Distinct
    # from `instance` (the deployment identity) on purpose — a lab may rename the
    # deployment without renaming what its users see.
    instance_name: "SearXNG"

    limiter:
      image: "redis:7-alpine"

  routing:
    subdomain: searxng
    proxy: internal

    # Internal by default, and the catalog note's "usually" is doing real work: SearXNG
    # has no login of its own, so a public route would hand an anonymous metasearch proxy
    # to the whole internet. A lab that wants that makes it an explicit choice in its own
    # config/apps/searxng.yml, not this default.
    access: internal

    # `catalog`, not `forward_auth`. SearXNG's UI is a search box with no session or
    # account model to protect; an identity object exists only so the launcher can show a
    # tile.
    identity: catalog
