---
# Default stack and app configuration for qBittorrent — the media stack's torrent
# download client. Users override specific values in config/apps/qbittorrent.yml.
# This file is git-managed — git pull may update these defaults.

qbittorrent_defaults:
  stack: media

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # The key ansible/vars/media-wiring.yml is looked up by. It decides which
    # *arr apps this client is registered in (every one that speaks `torrent`)
    # and which download-client implementation they are told to use.
    media_kind: qbittorrent

    image: "lscr.io/linuxserver/qbittorrent:latest"
    port: 8080
    container_port: 8080

    # The BitTorrent listen port, published on TCP and UDP and unchanged on both
    # sides of the container — see the compose template. Incoming peer
    # connections need the opt-in `firewall.inbound` forward below; the client
    # works without it, more slowly.
    torrenting_port: 6881

    config_path: "/opt/{{ instance }}/config"

    # Where completed downloads land. It MUST be inside a media_storage mount
    # (config/infrastructure.yml): the *arr apps import from here into the
    # library, and an import is a hardlink rather than a copy only when both are
    # on one filesystem. The role refuses a path outside the declared mounts.
    #
    # Derived from the lab's own storage rather than hardcoded, because a literal
    # path cannot satisfy that rule in a lab that did not happen to mount at its
    # parent: the first shipped default was /mnt/downloads against a lab mounting
    # /mnt/data/media, and the deploy failed the assert below on the first click
    # (execution 75, 2026-08-11). A `downloads` directory under the first declared
    # mount is hardlink-capable by construction. The /mnt fallback applies only
    # when no mounts are declared at all, where the assert fails anyway and says so.
    download_path: >-
      {{ ((homelabinfra_config.infrastructure.media_storage | default({})).mounts
          | default([], true) | map(attribute='path') | list
          | first | default('/mnt', true)) | regex_replace('/+$', '') }}/downloads

    # The WebUI account. Its password is not here and is never authored: the role
    # generates one, proves the app accepts it, and stores it in Vaultwarden under
    # homelab-infra/media/<instance>, which is where wire-media-stack.yml reads it
    # from when it registers this client in each *arr.
    webui_user: admin

    # Matches media_storage.owner in infrastructure.yml, and must: this is the id
    # the downloads are written as, and the *arr apps have to be able to hardlink
    # them into the library afterwards.
    puid: 1313
    pgid: 1313

  # Opened on the firewall before Deploy (tasks/wiring/firewall-opnsense.yml).
  firewall:
    # Peers listen on any port, over TCP and UDP (uTP, DHT).
    egress:
      - name: bittorrent-peers
        protocol: TCP/UDP
        port: ""
    # Opt-in WAN forward of torrenting_port. To publish it, copy this list into
    # config/apps/<instance>.yml with `enabled: true`; keep `port` equal to
    # app.torrenting_port.
    inbound:
      - name: bittorrent-listen
        protocol: TCP/UDP
        port: 6881
        enabled: false

  routing:
    subdomain: qbittorrent                 # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal
    # catalog, NOT forward_auth — the opposite of the *arr apps, and deliberately.
    # Those are switched to AuthenticationMethod External so the reverse proxy is
    # their only login. qBittorrent cannot be: its API authenticates with the
    # username and password above, and that is the only credential the *arr apps
    # have for it, so its own login stays on. catalog publishes it in the
    # Authentik catalog and leaves the app to authenticate its own callers.
    identity: catalog

  # Stop only this service; downloads stay on the external media mount.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""

    # The backup client is installed inside a short-lived Debian container. This keeps the
    # media host free of a PBS apt source while using the same signed Proxmox client
    # source as the Kubernetes application backup roles.
    client:
      image: buildpack-deps:bookworm-curl
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
