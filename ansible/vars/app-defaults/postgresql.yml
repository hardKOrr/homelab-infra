---
# PostgreSQL is an instanced, shared backend. An application names an instance in
# its `database.instance` configuration; this role does not silently create one as
# a Compose sidecar.
postgresql_defaults:
  proxmox:
    type: lxc
    boot_order: 40
    ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
    cores: 2
    memory: 2048
    disk_volume:
      size: 32
    tags: [_+lab, _-debian]
  app:
    # PostgreSQL 16 is the repository baseline for applications that consume this
    # backend. Keep the major version explicit so a distro upgrade cannot silently
    # change the application compatibility pairing.
    version: "16"
    port: 5432
    data_path: /var/lib/postgresql
    # CIDRs allowed to connect to this backend. Keep this a lab-local range.
    client_cidrs: ["10.0.0.0/8"]
  routing:
    proxy: none
    identity: none
