---
# ComfyUI is Docker on its own Debian VM. CUDA mode uses a dedicated PCIe GPU; CPU mode
# uses ordinary floating-VM placement and never requests a GPU in Compose. The VM root disk
# is intentionally large enough for the model storage tree; the role exposes that tree as
# separate Compose mounts so checkpoints, custom nodes, inputs, and outputs survive image
# replacement and are covered by the application archive.
comfyui_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    # The lxc block applies only to hosting.method native with proxmox.guest_type: lxc,
    # which a native instance must set; the vm block is the Docker VM and the native VM.
    lxc:
      cores: 4
      memory: 8192
      disk_volume:
        size: 128
    vm:
      cores: 8
      memory: 16384
      disk_size: 512
      agent: 1
      onboot: true
      description: "ComfyUI, created by homelab-infra"
      tags: [_+lab, _-debian]
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    accelerator: cuda
    # Exact releases: the AI-Dock image tag (Docker) and the upstream ComfyUI release tag
    # `v<native_version>` that the native method clones. They are separate version schemes.
    image: ghcr.io/ai-dock/comfyui:v2-cuda-12.1.1-base-22.04-v0.2.7
    native_version: "0.44.0"
    # The native service's own account; the Docker image's uid/gid below are not used.
    native_uid: 1500
    native_gid: 1500
    port: 8188
    # Storage claim size in Gi on Kubernetes (the cluster's default StorageClass).
    storage: 100
    service_name: comfyui
    # A blank mapping name is deliberate: the deploy must name the dedicated GPU
    # declaration in proxmox.devices. No device is selected automatically.
    gpu_device: ""
    storage_path: "/opt/{{ instance }}/storage"
    models_path: "/opt/{{ instance }}/storage/models"
    config_path: "/opt/{{ instance }}/storage/user"
    custom_nodes_path: "/opt/{{ instance }}/storage/custom_nodes"
    input_path: "/opt/{{ instance }}/storage/input"
    output_path: "/opt/{{ instance }}/storage/output"
    # The ai-dock image runs ComfyUI as `user` (uid 1000) in group `ai-dock` (gid 1111);
    # the mounted directories belong to that identity so the app can save to them.
    run_uid: 1000
    run_gid: 1111
    # The application archive covers storage_path, including downloaded checkpoints and
    # LoRAs. A model cache is not treated as disposable for this recovery contract.

  routing:
    subdomain: comfyui
    proxy: internal
    access: internal
    identity: catalog

  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
