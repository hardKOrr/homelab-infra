---
# Default Proxmox and app configuration for Proxmox Backup Server.
# Users override specific values in config/apps/pbs.yml.
# This file is git-managed — git pull may update these defaults.
#
# PBS is the only baseline service that is a full VM. It ships as an ISO installer,
# so homelab-infra instead clones a Debian cloud-init template (built automatically
# by tasks/proxmox/ensure-cloud-template.yml) and installs the PBS packages from
# Proxmox's apt repository — cleaner to control, and no manual ISO step.

pbs_defaults:
  proxmox:
    type: vm
    vm:
      cores: 2
      memory: 2048              # MB — PBS wants headroom for deduplication
      disk_size: 64             # GB — the OS disk; the datastore path can be separate
      agent: 1
      onboot: true
      description: "Proxmox Backup Server, created by homelab-infra"
      # Boot tier 60 — backups start after the guests they back up, and a backup that
      # begins mid-ascent competes with them for the same disks.
      boot_order: 60
      tags:
        - homelab-infra
        - pbs
    network: default

    # The cloud-init template every VM clones from. One per Proxmox node — Proxmox
    # refuses to clone across non-shared storage — and each node keeps exactly one:
    # changing image_url below replaces the node's template in place rather than adding
    # a second one beside it.
    #
    # PINNED, not `latest`. The three templates in the live lab were built from `latest`
    # seventeen days apart and were therefore three different images, which is invisible
    # until a cluster node behaves unlike its peers. A dated snapshot is the identity the
    # template is stamped with, so `bump this URL` is the entire update gesture.
    #
    # Debian prunes old snapshot directories after a few weeks. When this URL 404s, pick
    # the newest directory from https://cloud.debian.org/images/cloud/bookworm/ and put it
    # here; the next deploy rebuilds each node's template from it.
    #
    # vmid is deliberately absent: a free slot in 9000-9099 is chosen on the target node,
    # and a template this platform already built is adopted wherever it sits. Set
    # `vmid:` only to demand a particular slot.
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    port: 8007                  # PBS web UI and REST API (HTTPS, self-signed by default)
    datastore_name: homelab
    api_token_name: ansible     # token id becomes root@pam!ansible
    service_name: proxmox-backup-proxy   # systemd unit — the unit name is not the app
                                         # name; playbooks/apps/remove.yml stops this

  routing:
    proxy: internal
    access: internal            # LAN-only: PBS holds every backup
    identity: catalog           # catalog tile only — PBS has its own login and API tokens
