---
# Homepage is a stateless, lab-wide dashboard. Its service entries are generated from the
# topology facts that deployments already write; this file deliberately contains no URLs.
homepage_defaults:
  hosting:
    method: kubernetes
    supported: [kubernetes, docker-lxc, docker-vm, native-lxc, native-vm]
    impossible: {}
  cluster: k3s-cluster

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type). The source build needs the memory.
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 2048
    disk_volume:
      size: 8
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # Docker and Kubernetes run the image of the same release the native install builds
    # from source (https://gethomepage.dev/installation/source/) with the pinned toolchain.
    image: "ghcr.io/gethomepage/homepage:v1.8.0"
    native_version: "1.8.0"
    native_node_version: "22.11.0"
    native_node_sha256: 83bf07dd343002a26211cf1fcd46a9d9534219aad42ee02847816940bf610a72
    native_pnpm_version: "10.34.9"
    native_pnpm_sha256: 3ec79240658f0ee4e8977f21ee2c598c7a8b8d06b86dc564f2ec6cb099fd8ac2
    port: 3000

  routing:
    subdomain: homepage
    proxy: internal
    access: internal
    identity: catalog

  # This is the complete operator override boundary. These fields affect only how entries
  # look; endpoints, names, and membership always come from generated topology facts.
  presentation:
    title: Homelab
    theme: dark
    color: slate
    platform_group: Platform
    media_group: Media
    layout: {}

  # Homepage owns no user data. ConfigMaps are regenerated on every deploy from facts, so
  # a backup would contain only reconstructible configuration and a restore would add no
  # recovery capability. The catalog excludes the corresponding day-2 actions.
  backup:
    enabled: false
