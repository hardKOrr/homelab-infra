---
n8n_defaults:
  stack: services

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    image: docker.n8n.io/n8nio/n8n:1.104.2
    port: 5678
    data_path: "/opt/{{ instance }}/data"
    database:
      provider: postgresql
      instance: postgresql-n8n
      version: "16"
      name: n8n
      role: n8n
  routing:
    subdomain: n8n
    proxy: internal
    access: internal
    identity: catalog
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
    # n8n's tracked PostgreSQL major is 16. The dump client is separate from the
    # shared PostgreSQL guest and is used only for this named application database.
    postgres_client_image: "postgres:16-alpine"
