---
# Plane's object-storage contract is deliberately explicit: this recovery unit owns a
# named MinIO service and its bind-mounted object-storage path. The database and Redis
# remain independently managed platform backends; no credentials belong in this file.
plane_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  proxmox:
    # Used only when hosting.method is native (the guest type comes from the instance's
    # proxmox.guest_type); the frontend build needs the memory and disk.
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 4
    memory: 12288
    disk_volume:
      size: 60
    vm:
      cores: 4
      memory: 12288
      disk_size: 60
      agent: 1
      onboot: true
      description: "Plane, created by homelab-infra"
      tags: [_+lab, _-debian]
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    release: v1.4.2
    # Native: the v1.4.2 source built on the guest, with the Node version its Dockerfiles
    # use, and the S3 server (the Silo release the Docker image is pinned to).
    native_source_sha256: 99c69e67d5c06e6c78eca690aaecba36a7f5d1c0d9184d3283c743d9b2e5da05
    node_version: "22.23.4"
    native_object_storage_release: "2026-09-16T00-00-00Z"
    native_object_storage_version: "20260916000000.0.0"
    native_object_storage_sha256: 381e745510a8fb64323d7bb3207f95984b7f4ed826f4fcad318f97683c420c73
    port: 8093
    data_path: "/opt/{{ instance }}/data"
    object_storage_path: "/opt/{{ instance }}/object-storage"
    # Kubernetes volumes use the cluster's default StorageClass. These requests keep
    # server data, object storage and the registered Redis recovery staging volume apart.
    data_storage: 10
    object_storage_storage: 20
    redis_recovery_storage: 2
    object_storage:
      provider: minio
      instance: plane-minio
      bucket: plane
    database:
      provider: postgresql
      instance: postgresql-plane
      version: "16"
      name: plane
      role: plane
    redis:
      provider: redis
      instance: redis-plane
      service_name: redis-server
      data_path: /var/lib/redis
    rabbitmq:
      host: plane-mq
      port: 5672
      user: plane
      vhost: plane
  # Kubernetes pods reach both registered data backends through the cluster-node alias.
  # Docker deployments keep their existing guest access path.
  firewall:
    egress:
      - name: postgresql
        protocol: TCP
        port: "{{ app_config.app.database_port | default(5432) }}"
        destination: "{{ app_config.app.database_host | default('') }}"
      - name: redis
        protocol: TCP
        port: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.redis.instance | default(''), {}).port | default(6379) }}
        destination: >-
          {{ (homelabinfra_infra.databases | default({})).get(
               app_config.app.redis.instance | default(''), {}).host | default('') }}
  routing:
    subdomain: plane
    proxy: internal
    access: internal
    identity: catalog
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timeout_seconds: 3600
    scratch_size: 10
    client:
      image: python:3.12-bookworm
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
    redis_client_image: "redis:7-alpine"
