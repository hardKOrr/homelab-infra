---
# Official-ISO appliance: no cloud-init image, guest agent, or unattended install.
proxmox_datacenter_manager_defaults:
  # This native-vm guest is ISO-installed: no cloud-init, SSH, or guest-agent contract.
  hosting:
    method: native
    supported: [native-vm]
    impossible:
      docker-lxc: >-
        The official ISO installer boots a complete appliance OS, which Proxmox LXC cannot boot or host as a Docker guest.
      docker-vm: >-
        This deploy installs an appliance VM from its official ISO; it does not install Docker or deploy an OCI workload.
      kubernetes: >-
        The official ISO installs a standalone appliance VM; this product has no supported Kubernetes workload installer.
      native-lxc: >-
        The official ISO installer requires a complete VM boot environment and appliance network devices, which an LXC container does not provide.
  install: {method: official-iso, iso: ''}
  proxmox:
    vm: {cores: 2, memory: 4096, disk_size: 40, tags: [_+lab]}
  app: {port: 8443}
  routing: {subdomain: pdm, proxy: internal, access: internal, identity: catalog}
  # The VM backup contains /etc/proxmox-datacenter-manager/remotes.cfg. This names an
  # existing PBS-backed Proxmox storage; PDM does not configure backup storage.
  backup: {storage: ''}
  # Complete remote allow-list; authority defaults to read-only when omitted.
  remotes: []
  # Keep this exact node/port exception ahead of broad private-network deny rules.
  firewall: {proxmox_api_sequence: 250}
