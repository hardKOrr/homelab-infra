---
# Default configuration for Deemix — the media stack's Deezer download client
# for Lidarr's plugins-branch integration (ansible/vars/media-wiring.yml,
# `deemix` kind: role download_client, implementation Deemix, auth arl). The
# ARL is intentionally absent here: it is a per-lab Deezer login session
# cookie, not a platform-generated credential, so it is stored as the hidden
# `arl` field of Vaultwarden item homelab-infra/apps/<instance> before the
# first deploy — the same shape as Plex's claim_token
# (ansible/roles/plex/tasks/main.yml, vars/app-defaults/plex.yml).
deemix_defaults:
  stack: media

  app:
    # The key ansible/vars/media-wiring.yml is looked up by. It is already
    # declared there as a download client that speaks the `deemix` protocol.
    media_kind: deemix

    # registry.gitlab.com/bockiii/deemix-docker is the actively maintained
    # continuation of the original deemix web UI. DEEMIX_SINGLE_USER (set
    # unconditionally in the Compose template) is what makes the ARL seeded
    # below apply server-wide without an interactive per-visitor login.
    image: "registry.gitlab.com/bockiii/deemix-docker:latest"
    port: 6595
    container_port: 6595

    config_path: "/opt/{{ instance }}/config"

    # Where completed downloads land, as the container sees it. It MUST be
    # inside a media_storage mount (config/infrastructure.yml): Lidarr imports
    # from here into the library, and that import is a hardlink rather than a
    # copy only when both are on one filesystem. The role refuses a path
    # outside the declared mounts — see roles/sabnzbd for the same rule.
    download_path: >-
      {{ ((homelabinfra_config.infrastructure.media_storage | default({})).mounts
          | default([], true) | map(attribute='path') | list
          | first | default('/mnt', true)) | regex_replace('/+$', '') }}/downloads

    # The ARL is never authored here and never generated by this platform: it
    # is a Deezer login session cookie the operator captures from their own
    # Deezer account, expires every 3-6 months, and must be stored as the
    # hidden `arl` field of Vaultwarden item homelab-infra/apps/<instance>.
    # roles/deemix/tasks/main.yml fails loudly, naming that item, when it is
    # absent — arl: ""

    puid: 1313
    pgid: 1313

  routing:
    subdomain: deemix
    proxy: internal
    access: internal
    # forward_auth, NOT catalog — the opposite of SABnzbd and qBittorrent, and
    # deliberately. Those two stay on `catalog` because their OWN credential
    # is what the *arr apps authenticate to them with, and a forward_auth
    # proxy would intercept that traffic. Deemix has no such credential of
    # its own once DEEMIX_SINGLE_USER is set: that mode is what makes the
    # seeded ARL apply without a login prompt, which also means it removes
    # the app's login screen entirely. Lidarr never reaches this app through
    # Caddy anyway — roles/deemix exports deemix_media_host as the stack
    # host's bare address, and ansible/tasks/app-wiring/arr-download-client.yml
    # registers that address directly in Lidarr — so gating the human-facing
    # browser route with Authentik costs the *arr wiring nothing.
    identity: forward_auth
