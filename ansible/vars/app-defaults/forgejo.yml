---
forgejo_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # One exact upstream version for both methods: the image tag and the release binary
    # (https://forgejo.org/docs/latest/admin/installation/binary/). The native method
    # verifies native_sha256 (amd64 only), the published .sha256 of that binary.
    image: codeberg.org/forgejo/forgejo:16.0.7
    native_version: "16.0.7"
    native_sha256: ca8ecb37da9210d5730c878308bf31e25b6b526a7294b263d07f6c8718af07b7
    storage: 10
    port: 3000
    ssh_port: 2222
    # Kubernetes Git SSH uses a node address and this cluster-wide port.
    ssh_node_port: 30222
    # Forgejo reserves `admin`; Deploy creates this administrator with the generated
    # password in homelab-infra/apps/<instance>.
    admin_user: homelab
    admin_email: homelab@example.invalid
    data_path: "/opt/{{ instance }}/data"
    database:
      provider: postgresql
      instance: postgresql-forgejo
      name: forgejo
      role: forgejo
  # Used only when hosting.method is native.
  proxmox:
    guest_type: lxc
    cores: 2
    memory: 2048
    disk_volume:
      size: 16

  routing:
    subdomain: forgejo
    proxy: internal
    access: internal
    identity: catalog
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
  # Direct Git-over-SSH is separate from the HTTP route. Publish it to the WAN only
  # when an instance config explicitly enables this forward.
  firewall:
    inbound:
      - name: forgejo-ssh
        protocol: TCP
        port: 2222
        enabled: false
