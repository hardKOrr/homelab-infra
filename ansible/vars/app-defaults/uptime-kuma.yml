---
# Default stack and app configuration for Uptime Kuma — uptime monitoring.
# Users override specific values in config/apps/uptime-kuma.yml.
# This file is git-managed — git pull may update these defaults.

uptime_kuma_defaults:
  hosting:
    method: docker
    supported: [docker-vm]
    impossible: {}
  # Uptime Kuma owns the monitor database, login account and settings for every app.
  # Its complete data directory is quiesced as one native recovery unit.
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  # Docker app: no `proxmox:` block. The stack host is found or created by tag on
  # first deploy and reused afterwards (tasks/stack/find-or-create-host.yml).
  stack: monitoring

  app:
    port: 3001
    data_path: "/opt/{{ instance }}/data"

    # Uptime Kuma 2.x. Neither version has a REST API for monitors — the wiring drives
    # socket.io either way — so what the 2.x pin buys is the scripted database setup.
    # See slice 404 notes.md. Pin a patch tag here to freeze upgrades.
    image_tag: "2"

    # Signs the socket in: this is the credential the wiring authenticates with.
    admin_user: admin

    # Paste an API key created under Profile -> API Keys in the Uptime Kuma UI to skip
    # the scripted key provisioning. The key authorises /metrics and the badge endpoints
    # only — monitor registration does not use it. Leave empty for the normal path.
    api_key: ""

    monitor_interval: 60          # seconds between checks, applied to every monitor

  routing:
    subdomain: uptime-kuma                 # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal            # LAN-only: an uptime dashboard maps the whole estate
    identity: catalog             # catalog tile only — Uptime Kuma has its own login;
                                  # forward_auth would block the socket.io session the
                                  # wiring signs in with to register monitors

  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    client:
      # Install PBS in a one-shot helper container per operation. Kuma shares its
      # Compose host with unrelated apps, so recovery does not change host packages.
      image: buildpack-deps:bookworm-curl
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
