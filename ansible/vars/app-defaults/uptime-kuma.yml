---
# Default stack and app configuration for Uptime Kuma — uptime monitoring.
# Users override specific values in config/apps/uptime-kuma.yml.
# This file is git-managed — git pull may update these defaults.

uptime_kuma_defaults:
  # Docker app: no `proxmox:` block. The stack host is found or created by tag on
  # first deploy and reused afterwards (tasks/stack/find-or-create-host.yml).
  stack: monitoring_stack

  app:
    port: 3001
    data_path: /opt/uptime-kuma/data

    # Uptime Kuma 2.x. Version 1 exposes no REST API at all (socket.io only), and
    # tasks/wiring/uptime-kuma.yml registers monitors over REST — see slice 404
    # notes.md for the decision record. Pin a patch tag here to freeze upgrades.
    image_tag: "2"

    admin_user: admin

    # Paste an API key created under Profile -> API Keys in the Uptime Kuma UI to
    # skip the scripted key provisioning entirely. Leave empty for the normal path.
    api_key: ""

    monitor_interval: 60          # seconds between checks, applied to every monitor

  routing:
    proxy: internal
    identity: catalog             # catalog tile only — Uptime Kuma has its own login;
                                  # forward_auth would block the REST calls that
                                  # register monitors
