---
# Default stack and app configuration for Authentik — the SSO provider.
# Users override specific values in config/apps/authentik.yml.
# This file is git-managed — git pull may update these defaults.

authentik_defaults:
  # Docker app: no `proxmox:` block. The stack host is found or created by tag on
  # first deploy and reused afterwards (tasks/stack/find-or-create-host.yml).
  # Authentik gets its own stack: it carries a database, and a shared host would
  # couple every co-tenant's restarts to the platform's login path.
  stack: sso_stack

  app:
    port: 9000                  # Authentik HTTP listener (the API + UI)
    https_port: 9443            # Authentik HTTPS listener, unused behind the proxy
    data_path: "/opt/{{ instance }}/data"
    admin_email: "admin@example.com"   # akadmin's address; change to reach password resets

    # Image tag. Empty means "resolve the latest GitHub release at deploy time",
    # which is how this app stays current — see the role header for why Authentik
    # is not left to Watchtower like other containers.
    image_tag: ""
    postgres_image: "docker.io/library/postgres:16-alpine"
    redis_image: "docker.io/library/redis:7-alpine"

  update:
    github_repo: goauthentik/authentik

  routing:
    proxy: internal
    access: internal            # LAN-only by default. Set public only when remote users
                                # must sign in from off-LAN — it is the front door to SSO
    identity: none              # Authentik IS the SSO provider — never wrap it in itself
    subdomain: auth             # default hostname auth.<domain>; override per instance

  # ── Directory as code ────────────────────────────────────────────────────────
  # Groups and accounts this deploy creates and keeps correct through the API
  # (roles/authentik/tasks/directory.yml). What is declared here is managed; what
  # is not declared is never touched and never deleted.
  #
  # The default is the one group the platform itself needs: every app playbook
  # sets wiring_auth_group: homelab-users, and the Authentik wiring binds it to
  # each published application. Declaring it here means it exists from the SSO
  # deploy onward rather than appearing when the first app happens to wire.
  #
  # NOTE — config layering replaces lists, it does not append to them. A
  # config/apps/<instance>.yml that declares directory.groups replaces this
  # entry, so keep homelab-users in your own list unless you also change
  # wiring_auth_group everywhere.
  directory:
    groups:
      - name: homelab-users
        is_superuser: false
    # Accounts are yours to declare — the platform ships none. See
    # config.example/apps/authentik.example.yml for the shape.
    users: []

  # ── The rest of the identity surface ─────────────────────────────────────────
  # Flows, authenticator/MFA stages, OAuth login sources and brands, all applied
  # through the API by the task file named after each key. Empty by default and
  # deliberately so: a fresh Authentik ships a complete working set of flows,
  # stages and one catch-all brand, and a platform default here would overwrite a
  # choice the operator may have made in the UI. Declare only what the lab wants
  # different — see config.example/apps/authentik.example.yml for worked examples
  # of enforced MFA and a Google login source.
  #
  # Undeclared objects are never touched, so leaving these empty is not "unmanaged
  # drift" — it is the installer's defaults, intact.
  flows: []
  authenticators: {}
  sources:
    oauth: []
  brands: []
