---
# InfluxDB OSS v2 is an independently managed, instanced time-series backend.
# It runs outside application Compose files so its data and credentials remain
# explicit recovery units. Version 2 is selected because its stable HTTP API,
# setup endpoint, and package-managed service are supported by upstream.
influxdb_defaults:
  hosting:
    method: native
    # Docker runs the official image on a stack host, whose stack guest_type picks the LXC or VM.
    supported: [native-lxc, native-vm, docker-lxc, docker-vm]
    impossible: {}
  # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or vm).
  stack: ""
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    guest_type: lxc
    boot_order: 40
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 2
    memory: 2048
    disk_volume:
      size: 32
    tags: [_+lab, _-debian]
  app:
    image: "influxdb:2.7"
    port: 8086
    service_name: influxdb
    # Native only (Docker uses /opt/<instance>/data). The Debian package stores its Bolt
    # database and engine beneath this path. Keep native backup, restore and Remove
    # aligned with the existing package data.
    data_path: /var/lib/influxdb
    admin_user: homelab
    organization: homelab
    bucket: default

  routing:
    subdomain: influxdb
    proxy: internal
    access: internal
    # InfluxDB keeps its native login; Authentik adds a catalog tile without gating Caddy.
    identity: catalog

  backup:
    enabled: true
    application_consistent: true
    retention_days: 14
    datastore: ""
    backup_id: ""
