---
# MariaDB is an instanced, shared backend. Applications select it through the
# backend-independent `database` configuration; it is never a Compose sidecar.
mariadb_defaults:
  hosting:
    method: native
    supported: [native-lxc, native-vm]
    impossible: {}
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  proxmox:
    guest_type: lxc
    boot_order: 40
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 2
    memory: 2048
    disk_volume:
      size: 32
    tags: [_+lab, _-debian]
  app:
    port: 3306
    data_path: /var/lib/mysql
    service_name: mariadb
    # MariaDB account-host patterns allowed to connect to this backend. Keep
    # these within lab networks; `%` would permit any source address.
    client_hosts: ["10.%"]
  routing:
    proxy: none
    identity: none

  # A consistent logical export captures all databases, users and grants together.
  backup:
    enabled: true
    application_consistent: true
    retention_days: 14
    datastore: ""
    backup_id: ""
    client:
      repository: http://download.proxmox.com/debian/pbs-client
      component: main
