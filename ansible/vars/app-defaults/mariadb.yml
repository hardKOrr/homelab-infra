---
# MariaDB is an instanced, shared backend. Applications select it through the
# backend-independent `database` configuration; it is never a Compose sidecar.
mariadb_defaults:
  hosting:
    method: native
    # Native uses the same apt/systemd service path on either guest type. Docker runs the
    # official image on a stack host, whose stack guest_type picks the LXC or VM.
    supported: [native-lxc, native-vm, docker-lxc, docker-vm]
    impossible: {}
  # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or vm).
  stack: ""
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  proxmox:
    guest_type: lxc
    boot_order: 40
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 2
    memory: 2048
    disk_volume:
      size: 32
    tags: [_+lab, _-debian]
  app:
    port: 3306
    image: mariadb:11.8       # Docker only
    data_path: /var/lib/mysql  # native; Docker keeps data in /opt/<instance>/data
    service_name: mariadb
    # MariaDB account-host patterns allowed to connect to this backend. Keep
    # these within lab networks; `%` would permit any source address.
    client_hosts: ["10.%"]
  routing:
    proxy: none
    identity: none

  # A consistent logical export captures all databases, users and grants together.
  backup:
    enabled: true
    application_consistent: true
    retention_days: 14
    datastore: ""
    backup_id: ""
