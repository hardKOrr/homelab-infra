---
# Frigate defaults to a one-tenant Docker-on-VM stack. A declared GPU can route it to the
# stack that owns that device; its recordings stay on the existing external storage mount.
frigate_defaults:
  stack: frigate

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    image: "ghcr.io/blakeblackshear/frigate:stable"
    # app.port is the per-instance base host port. Blank auxiliary values derive from
    # it (+1 for RTSP and +2 for WebRTC) so a second instance only needs a new app.port.
    port: 8971
    rtsp_port: ""
    webrtc_port: ""
    config_path: "/opt/{{ instance }}/config"
    recordings_path: "/mnt/frigate-recordings"
    # The host path and free-space floor are operator decisions. The playbook checks the
    # floor before attaching the existing mount; it never formats or creates storage.
    minimum_free_gb: 256
    retention_days: 7
    shm_size: "256m"
    # A deployment must name the dedicated GPU declaration from proxmox.devices.
    # The render node is a path inside the VM after PCI passthrough, not a host bind.
    gpu_device: ""
    igpu_render_node: /dev/dri/renderD128
    # The exact dedicated Proxmox USB mapping is an operator-owned declaration.
    coral_usb_mapping: ""
    # Existing hardware deployments use Coral. CPU-only deployments explicitly select
    # cpu and leave all device declarations and hardware decode disabled.
    detector: coral
    hwaccel_args: "preset-intel-qsv-h264"
    # Camera endpoint metadata is not a credential. Per-camera username/password pairs
    # are the hidden camera_credentials JSON field in Vaultwarden.
    cameras: {}
    mqtt:
      host: ""
      port: 1883
      username: ""

  routing:
    subdomain: frigate
    proxy: internal
    access: internal
    identity: catalog

  # The LXC's config and Compose project are covered by the guest PBS snapshot. The
  # recording mount is external and needs the storage owner's own snapshot/backup
  # before live binding.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""

    client:
      image: buildpack-deps:bookworm-curl
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
