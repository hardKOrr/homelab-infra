---
# Frigate defaults to a one-tenant Docker-on-VM stack. A declared GPU can route it to the
# stack that owns that device; its recordings stay on the existing external storage mount.
frigate_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: frigate

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # One exact upstream version for both methods: the image tag and the native build of
    # the source release (https://github.com/blakeblackshear/frigate). native_sha256
    # verifies that tag's source archive; native_assets are the prebuilt pieces the
    # upstream image build downloads (docker/main/Dockerfile and install_deps.sh at the tag).
    image: "ghcr.io/blakeblackshear/frigate:0.18.2"
    native_version: "0.18.2"
    native_sha256: e6af192d610f6f5fd26677aa509412620b2bc60216f6105b509ad57ec8dcf0c0
    native_assets:
      python:
        url: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.11.18%2B20261026-x86_64-unknown-linux-gnu-install_only.tar.gz
        sha256: a87ee63646c8f8438b7af3954b2135ed2af91d033c631f12a8f20af903046d06
      node:
        url: https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz
        sha256: df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d
      go2rtc:
        url: https://github.com/AlexxIT/go2rtc/releases/download/v1.9.14/go2rtc_linux_amd64
        sha256: 32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6
      tempio:
        url: https://github.com/home-assistant/tempio/releases/download/2021.09.0/tempio_amd64
        sha256: b7b93ebfd24c1161cec7aecfad62ab51f2241149358cef354b86cdbc6a60546f
      yq:
        url: https://github.com/mikefarah/yq/releases/download/v4.48.2/yq_linux_amd64
        sha256: 0ffc35320180d4911bc3a772934da508715e08af444cb33d4d43660065e25bcc
      ffmpeg:
        url: https://github.com/NickM-27/FFmpeg-Builds/releases/download/autobuild-2026-06-02-14-20/ffmpeg-n8.1.1-9-g58d4114d36-linux64-gpl-8.1.tar.xz
        sha256: 9bac85054d351cdc89c0a4f45c8ea5c44df94009aabd964b719bbadd56aedae9
      cpu_model:
        url: https://github.com/google-coral/test_data/raw/release-frogfish/ssdlite_mobiledet_coco_qat_postprocess.tflite
        sha256: 90bb33a634e041914cc1819aa5df99818e6c396c4d2db952c0fd7a9cffc4724f
    # app.port is the per-instance base host port. Blank auxiliary values derive from
    # it (+1 for RTSP and +2 for WebRTC) so a second instance only needs a new app.port.
    port: 8971
    rtsp_port: ""
    webrtc_port: ""
    config_path: "/opt/{{ instance }}/config"
    recordings_path: "/mnt/frigate-recordings"
    # The host path and free-space floor are operator decisions. The playbook checks the
    # floor before attaching the existing mount; it never formats or creates storage.
    minimum_free_gb: 256
    retention_days: 7
    shm_size: "256m"
    # Kubernetes claims on the default StorageClass (GiB): the config and database volume
    # that native recovery archives, and the recording volume it does not.
    config_storage: 2
    media_storage: 20
    # A deployment must name the dedicated GPU declaration from proxmox.devices.
    # The render node is a path inside the VM after PCI passthrough, not a host bind.
    gpu_device: ""
    igpu_render_node: /dev/dri/renderD128
    # The exact dedicated Proxmox USB mapping is an operator-owned declaration.
    coral_usb_mapping: ""
    # Existing hardware deployments use Coral. CPU-only deployments explicitly select
    # cpu and leave all device declarations and hardware decode disabled.
    detector: coral
    hwaccel_args: "preset-intel-qsv-h264"
    # Camera endpoint metadata is not a credential. Per-camera username/password pairs
    # are the hidden camera_credentials JSON field in Vaultwarden.
    cameras: {}
    mqtt:
      host: ""
      port: 1883
      username: ""

  # Used only when hosting.method is native (CPU-only, no cameras or recording mount).
  proxmox:
    guest_type: lxc
    cores: 4
    memory: 4096
    disk_volume:
      size: 32

  routing:
    subdomain: frigate
    proxy: internal
    access: internal
    identity: catalog

  # The LXC's config and Compose project are covered by the guest PBS snapshot. The
  # recording mount is external and needs the storage owner's own snapshot/backup
  # before live binding.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
