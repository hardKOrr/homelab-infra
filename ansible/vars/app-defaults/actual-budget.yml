---
# Default configuration for Actual Budget — a local-first personal finance application
# on the services Docker stack by default, with native and Kubernetes alternatives.
# Users override specific values in
# config/apps/<instance>.yml.
#
# Actual keeps both its server account database and its budget blobs below /data. There is
# deliberately no PostgreSQL, MariaDB, Redis, or other platform backend in this contract.
# The role generates the Actual server password once and keeps its canonical copy in the
# Vaultwarden item homelab-infra/apps/<instance>.
actual_budget_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    native_version: "26.10.0"
    node_version: "24.21.0"
    image: docker.io/actualbudget/actual-server:latest
    port: 5006
    container_port: 5006
    data_path: "/opt/{{ instance }}/data"
    service_name: actual_server
    # Used only by the Kubernetes backend. Omitting storageClassName selects the
    # cluster's default StorageClass, whose volumes are node-pinned and retained.
    storage: 5

  proxmox:
    guest_type: lxc
    cores: 2
    memory: 2048
    disk_volume:
      size: 16

  routing:
    subdomain: actual-budget
    proxy: internal
    access: internal
    identity: catalog

  # Actual's server password and all budget files are application-native state. The role
  # stops its Compose or systemd service before archiving the data path, so account.sqlite and the budget
  # blobs are captured as one recovery unit rather than as a live filesystem copy.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timeout_seconds: 3600
    scratch_size: 2
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
