---
# Immich defaults to the photos Docker stack. A declared GPU selects the stack that owns
# that device instead. PostgreSQL and Redis are platform backends, not Compose sidecars.
# The media mount is deliberately empty here: an instance must name the exact existing host
# directory it owns in config/apps/<instance>.yml.
immich_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: photos
  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type). Building the web client and installing the machine-learning wheels
  # need the memory and disk below; the build tree is removed afterwards.
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 4
    memory: 6144
    disk_volume:
      size: 32
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"
  # The item records deployed backend/device metadata, not authored app settings.
  # Recovery reads its credentials directly; replaying it would pin an old GPU stack.
  vault:
    methods: []
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  app:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    machine_learning_image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino
    port: 2283
    # Native (https://github.com/immich-app/immich, built from the v3.1.0 source archive;
    # upstream documents only Docker): the image tags above and this version are one
    # release. Machine learning runs on the CPU (onnxruntime extra `cpu`): the shared
    # native guest has no PCI passthrough for the dedicated iGPU, and an LXC's shared
    # Haswell iGPU has no OpenVINO, so it serves only the server's VAAPI transcoding.
    native_version: "3.1.0"
    native_source_sha256: af0fba69cc5830093392de4f5576eeb7f2ccf28ba55154b7598e10f596fdfb40
    native_node_version: "24.15.0"
    native_node_sha256: 472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6
    native_pnpm_version: "11.13.1"
    native_uv_version: "0.8.15"
    native_uv_sha256: be9878e9d08ebcb621a683aba52e7fb8bbf92b2532e0d759026ffcc067673042
    native_ml_extra: cpu
    native_ffmpeg_version: "7.1.3-6"
    native_ffmpeg_sha256: 39e99a7927468a6abec5f65d00f55010e8ff2ae3c2605294f179c94f6ae21af2
    native_countries_sha256: 239eec57ac17f100a11e2536cffc56752c318b50ae765b0918ff7aab4ce8f255
    database:
      provider: postgresql
      instance: postgresql-immich
      version: "16"
      name: immich
      role: immich
      postgresql_superuser: true
      extensions: [vector, earthdistance]
    redis:
      provider: redis
      instance: redis-immich
    # The operator declares one dedicated GPU mapping in proxmox.devices. Its stack owns
    # the PCI device; the ML container uses its /dev/dri render node.
    gpu_device: ""
    gpu_render_node: /dev/dri/renderD128
    # On a Docker LXC stack the iGPU is shared instead: leave gpu_device empty and list the
    # host's render nodes here (each an identifier of a proxmox.devices entry with
    # mode: shared). They are bound into the LXC and into the ML container.
    devices: []
    # Kubernetes: size in Gi of the claim holding originals and thumbnails (default
    # StorageClass). The machine-learning pod runs on the k3s node whose
    # cluster.nodes[].gpu_device equals gpu_device (with it empty, on any node, on the CPU).
    storage: 20
    # The ML model cache is disposable and stays on the selected stack host rootfs.
    model_cache_path: "/opt/{{ instance }}/model-cache"
  # Kubernetes pods reach both registered backends through the cluster-node alias. The
  # Docker guest keeps its own access path.
  firewall:
    methods: [kubernetes]
    egress:
      - name: postgresql
        protocol: TCP
        backend: database
      - name: redis
        protocol: TCP
        backend: redis
  # No global media_storage is inherited. Immich must not adopt an existing photo
  # library: the instance config names one new durable mount and its ownership.
  media_storage:
    mounts: []
    owner:
      user: homelab-infra
      uid: 1313
      gid: 1313
  routing:
    subdomain: immich
    proxy: internal
    monitor_path: /api/server/ping
    access: internal
    # Mobile clients authenticate to Immich and cannot complete a browser-only proxy
    # challenge. Authentik supplies a catalog tile; Immich remains the auth boundary.
    identity: catalog
  # The app-owned recovery path archives the named PostgreSQL database and the durable
  # originals/thumbnails mount together. PBS guest snapshots alone do not include a bind
  # mount, so this is deliberately application-consistent.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: '{{ homelabinfra_config.timezone | default(''UTC'') }}'
    timeout_seconds: 3600
    scratch_size: 2
    client:
      image: python:3.12-bookworm
      key_url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
      repository: http://download.proxmox.com/debian/pbs-client
      suite: bookworm
      component: main
