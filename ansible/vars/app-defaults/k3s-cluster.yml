---
# Default topology and resource contract for the k3s cluster — slice 204's hosting
# backend. Users override specific values in config/apps/k3s-cluster.yml.
# This file is git-managed — git pull may update these defaults.
#
# The cluster is deployed by one job like any other app, but it is not an app: it is a
# hosting backend that later `kind: kubernetes` applications land on. Nothing here
# deploys a workload.
#
# WHY THE NODE LIST IS EXPLICIT AND STATIC
#
# Nodes carry no template_vmid. Each Proxmox node does need its own copy of the
# cloud-init template — Proxmox will not clone across non-shared storage — but which vmid
# holds it is not a decision worth asking an operator to make and then keep in step with
# reality. tasks/proxmox/ensure-cloud-template.yml adopts the template this platform
# already built on the target node, and otherwise picks a free slot in 9000-9099.
#
# Every other guest in this repo takes its address from tasks/network/generate-ip.yml
# and its VMID from that address. Cluster members cannot: etcd peers identify each
# other by address, a node that comes back on a different IP is a new member and not a
# recovered one, and the operator has to be able to say which physical machine holds
# which failure domain. So each node names its Proxmox node and its address, and the
# VMID is still derived from the address by the usual 168<oct3><oct4> rule.
#
# See docs/meta/done/204-kubernetes-hosting-backend/notes.md for the reasoning behind the
# sizes, the taint, the ingress choice and the storage class.

k3s_cluster_defaults:

  # ── Cluster topology ────────────────────────────────────────────────────────
  cluster:
    # Pinned, not floating. An unpinned installer means two nodes provisioned a month
    # apart join at different minor versions, which is the one thing etcd will not
    # forgive. Raising this is the upgrade: change it, re-run the job, and the role
    # rolls the servers one at a time.
    version: "v1.31.5+k3s1"

    # Upgrade policy — `manual` re-runs this job to move every node to `version`.
    # Automated upgrade waves are a recorded later nicety, not this slice.
    upgrade_policy: manual

    # Every server runs etcd. Three of them across three physical nodes is what makes
    # "tolerates one node failure" true; see failure_domain_mode below.
    datastore: etcd

    # Declared, not inferred. `distinct-nodes` asserts that every server sits on a
    # different Proxmox node and fails the run when it does not, so the UI can never
    # claim high availability the placement does not provide. Set `single` to
    # deliberately run a non-HA cluster.
    failure_domain_mode: distinct-nodes

    # Nodes. Order matters only for the first entry: it is the one that runs
    # `--cluster-init` and the one the others join. A re-run detects an existing
    # cluster and never re-inits.
    nodes:
      - name: k3s-1
        proxmox_node: pve-host-1
        ip_address: 192.168.0.21
        cores: 2
        memory: 2048
        disk_size: 20
        # Quorum only. pve-host-1 also carries the CARP BACKUP firewall peer, so no
        # workload may schedule beside it. The taint is applied by the role and
        # asserted on every re-run.
        taints:
          - "homelab-infra.io/quorum-only=true:NoSchedule"

      - name: k3s-2
        proxmox_node: pve-host-2
        ip_address: 192.168.0.22
        cores: 4
        memory: 16384
        disk_size: 100
        taints: []

      - name: k3s-3
        proxmox_node: pve-host-3
        ip_address: 192.168.0.23
        cores: 4
        memory: 12288
        disk_size: 60
        taints: []

  # ── Ingress ─────────────────────────────────────────────────────────────────
  ingress:
    # k3s bundles Traefik and installs it by default. It is kept: without an ingress
    # controller an Ingress resource means nothing, and this slice requires one stable
    # internal ingress address. It terminates plain HTTP on a private address only —
    # public TLS stays at the platform Caddy.
    controller: traefik

    # ServiceLB (klipper-lb) is disabled instead. It binds the port on every node's own
    # address, which yields three addresses and none of them move when a node fails.
    # MetalLB in L2 mode gives one VIP that a surviving node claims in seconds, which is
    # the declared answer to "how the ingress address moves on node failure".
    load_balancer: metallb
    metallb_version: "v0.14.9"

    # The single stable internal ingress address. The platform Caddy is pointed here
    # once and never again. Must be OUTSIDE any DHCP range and outside the addresses
    # assigned to the nodes above.
    vip: 192.168.0.30

    # MetalLB needs a pool, even for one address. Widen it when more LoadBalancer
    # services than Traefik are wanted.
    address_pool:
      - 192.168.0.30-192.168.0.34

  # ── Persistent storage ──────────────────────────────────────────────────────
  storage:
    # The local-path provisioner, on the VM's own SSD-backed disk — deployed and owned by
    # this platform rather than by k3s. `local-storage` is on the disable list in the node
    # configuration, so the addon k3s ships is not running here at all.
    #
    # NODE-PINNED, DELIBERATELY. A PVC is a directory on one node's disk and pins its
    # pod to that node for life. Losing the node leaves the pod Pending until the node
    # returns; it does NOT reschedule. No workload on this StorageClass may be
    # described as application-highly-available, whatever the control plane does.
    #
    # Longhorn — replicated volumes that do reschedule — is wanted and has its own
    # queue row. It buys availability, not backup, and does not replace the dump below.
    #
    # WHY THE PLATFORM OWNS THE PROVISIONER AND NOT JUST THE CLASS
    #
    # reclaimPolicy is immutable once a StorageClass exists, so Retain could never be
    # applied to the bundled class and the platform has always declared its own. What did
    # not work was leaving the bundled addon in place and demoting its class: k3s re-stages
    # its packaged manifests on every start of the service, and that manifest marks its own
    # class default. A restart — not merely an upgrade — restored a second default class,
    # and which one an unqualified PVC landed on was decided by creationTimestamp order.
    # The addon is therefore disabled outright and the provisioner Deployment, its RBAC and
    # its ConfigMap are declared by roles/k3s_cluster. Exactly one thing in this cluster
    # declares a default StorageClass now, and the deploy asserts that is still true.
    class: homelab-local-path
    # k3s's historical default path, kept deliberately. Volumes this cluster already holds
    # live here, and the setup and teardown scripts the provisioner runs are k3s's, so a
    # directory made before the switch and one made after are the same thing. Moving this
    # path strands every existing volume.
    path: /var/lib/rancher/k3s/storage
    # Retain, not Delete: an operator who deletes a namespace by hand does not thereby
    # consent to losing its data. Deliberate deletion goes through the removal job's
    # explicit delete_data option, which is the only thing that removes a PVC.
    reclaim_policy: Retain
    # Pinned like cluster.version and ingress.metallb_version, and for the same reason: the
    # storage controller is now this platform's to upgrade, and a floating tag means the
    # component holding every application's data changes underneath the lab on whichever
    # day a node happened to pull a new image.
    #
    # v0.0.30 and this busybox tag are the exact pair k3s v1.31.5+k3s1 ships in its own
    # local-storage addon, so the provisioner serving these volumes is the one they were
    # created by. Raise them together with cluster.version, after checking what the new k3s
    # release pins in its manifests/local-storage.yaml — the provisioner name
    # `rancher.io/local-path` must not change, or every existing PersistentVolume stops
    # being claimed by anything.
    provisioner_image: "rancher/local-path-provisioner:v0.0.30"
    helper_image: "rancher/mirrored-library-busybox:1.36.1"

  # ── Backup ──────────────────────────────────────────────────────────────────
  backup:
    # PBS snapshots the k3s VMs on the lab's normal schedule; that is the node rebuild
    # path and nothing more. A whole-VM image is crash-consistent only and cannot see
    # inside a PVC, so it is not acceptance for application data.
    #
    # The application-consistent artifact is produced in-cluster: a CronJob runs a
    # quiesced dump and pushes it into the same PBS datastore with
    # proxmox-backup-client. One destination, one retention policy, one restore tool.
    provider: pbs
    schedule: "0 3 * * *"
    retention_days: 14
    # Resolved from homelabinfra_infra.backups at deploy time when left empty.
    datastore: ""

  # ── Proxmox provisioning ────────────────────────────────────────────────────
  proxmox:
    type: vm
    network: default
    # Mirrored SSD ZFS pool, present under this name on all three nodes.
    storage: friends-pool-zfs
    vm:
      # NOT Proxmox's default. `kvm64` is a 2003-era baseline with no SSE4.2 and no
      # POPCNT — below x86-64-v2 — and modern container images are increasingly built
      # against v2 and abort on sight of anything older:
      #
      #   Fatal glibc error: CPU does not support x86-64-v2
      #
      # MySQL 8.4 did exactly that on the first app deployed to this cluster, in a
      # CrashLoopBackOff whose cause was invisible from Kubernetes — the API only knew the
      # container kept exiting. A Kubernetes node runs whatever image an app ships, so its
      # CPU baseline has to be current.
      #
      # `x86-64-v2-AES` rather than `host`: it is a portable model, so a node can still be
      # migrated between Proxmox hosts with different silicon, while satisfying the
      # baseline. Raise it to x86-64-v3 if every host in the lab supports it and a
      # workload benefits.
      cpu: x86-64-v2-AES
      agent: 1
      onboot: true
      description: "k3s cluster node, created by homelab-infra"
      # Boot tier 45 — after the platform services a workload wires to, before ordinary
      # apps. All three nodes share one tier deliberately: embedded etcd needs its peers
      # to come up together, so staggering them only delays quorum.
      boot_order: 45
      boot_up: 0
      tags:
        - homelab-infra
        - k3s
    # The cloud-init template every VM clones from. One per Proxmox node — Proxmox
    # refuses to clone across non-shared storage — and each node keeps exactly one:
    # changing image_url below replaces the node's template in place rather than adding
    # a second one beside it.
    #
    # PINNED, not `latest`. The three templates in the live lab were built from `latest`
    # seventeen days apart and were therefore three different images, which is invisible
    # until a cluster node behaves unlike its peers. A dated snapshot is the identity the
    # template is stamped with, so `bump this URL` is the entire update gesture.
    #
    # Debian prunes old snapshot directories after a few weeks. When this URL 404s, pick
    # the newest directory from https://cloud.debian.org/images/cloud/bookworm/ and put it
    # here; the next deploy rebuilds each node's template from it.
    #
    # vmid is deliberately absent: a free slot in 9000-9099 is chosen on the target node,
    # and a template this platform already built is adopted wherever it sits. Set
    # `vmid:` only to demand a particular slot.
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  # ── Routing ─────────────────────────────────────────────────────────────────
  # The cluster itself publishes nothing. The Kubernetes API, the node addresses and
  # the ingress VIP stay on named private networks and must never become alternate
  # public entry points — applications are published individually, through the
  # platform Caddy, by their own deploy jobs.
  routing:
    subdomain: k3s-cluster             # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal
    identity: none
