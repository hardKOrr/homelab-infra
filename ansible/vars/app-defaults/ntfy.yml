---
# Default Proxmox and app configuration for Ntfy — the platform notification hub.
# It remains a native LXC by default; a VM or Kubernetes is selected per instance.
# Users override specific values in config/apps/ntfy.yml.
# This file is git-managed — git pull may update these defaults.

ntfy_defaults:
  hosting:
    method: native
    supported: [native-lxc, native-vm, kubernetes]
    impossible: {}
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    guest_type: lxc             # lxc or vm — single Go binary, no Docker needed
    # Boot tier 30 — notifications come up before the things that report to them, so
    # an ascent that goes wrong is able to say so.
    boot_order: 30
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 1
    memory: 512                 # MB — Ntfy is very lightweight
    disk_volume:
      size: 8                   # GB
    # No `network:` here on purpose. Which network a guest is addressed on follows from
    # its SCOPE — tasks/network/resolve-network.yml puts a `scope: lab` application on the
    # shared network and an estate-scoped one on its estate's — and a name pinned in
    # git-managed defaults would override that resolution in every lab at once. A lab that
    # declares only `networks.default` is unaffected either way. Set `network:` in
    # config/apps/<instance>.yml to override one instance.
    # Ownership plus the declared machine fact. The application tag is NOT listed here:
    # the deploy appends `_<instance>`, so a second instance under another name is tagged
    # with the name it was actually deployed as. See inventory/proxmox.yml for the grammar.
    tags:
      - _+lab
      - _-debian

  app:
    port: 80                    # HTTP listener (publish + subscribe + web UI)
    image: binwiederhier/ntfy:latest
    storage: 4                   # GB — auth database, message cache and attachments
    data_path: /var/lib/ntfy    # auth database lives here
    service_name: ntfy          # systemd unit — playbooks/apps/remove.yml stops this
    cache_path: /var/cache/ntfy # message cache + attachments
    topic: homelab              # the topic every homelab-infra tool publishes to
    user: homelab               # the account homelab-infra publishes as
    attachment_total_size_limit: 2G
    message_retention: 12h      # how long cached messages stay fetchable

  update:
    github_repo: binwiederhier/ntfy
    binary_path: /usr/bin/ntfy

  routing:
    subdomain: ntfy                        # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal            # LAN-only by default; publish it if you want phone
                                # notifications off-LAN without a VPN
    identity: catalog           # catalog tile only — Ntfy has its own token/user auth;
                                # forward_auth would break every publisher's token POST

  # Ntfy's auth database and cached messages/attachments form one recovery point.
  # The app is stopped while both directories are archived to PBS.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
