---
# MySQL is an instanced, shared backend. Applications select it through the
# backend-independent `database` configuration; it is never a Compose sidecar.
mysql_defaults:
  hosting:
    method: native
    # Docker runs the official image on a stack host, whose stack guest_type picks the LXC or VM.
    supported: [native-lxc, native-vm, docker-lxc, docker-vm]
    impossible: {}
  # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or vm).
  stack: ""
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
  proxmox:
    guest_type: lxc
    boot_order: 40
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 2
    memory: 2048
    disk_volume:
      size: 32
    tags: [_+lab, _-debian]
  app:
    port: 3306
    image: mysql:8.4  # Docker only
    # Remove with delete_data=true deletes it; Deploy initializes it again. Native; Docker
    # keeps data in /opt/<instance>/data.
    data_path: /var/lib/mysql
    service_name: mysql
    # MySQL account-host patterns allowed to connect to this backend. Keep
    # these within lab networks; `%` would permit any source address.
    client_hosts: ["10.%"]
  routing:
    proxy: none
    identity: none
  # A complete MySQL logical dump includes the mysql grant tables as well as
  # application databases. mysqldump holds a global read lock for the dump so
  # engines and user grants share one consistent recovery point.
  backup:
    enabled: true
    application_consistent: true
    retention_days: 14
    datastore: ""
    backup_id: ""
