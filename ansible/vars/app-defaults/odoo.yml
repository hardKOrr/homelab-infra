---
odoo_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 4096
    disk_volume:
      size: 24
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    image: docker.io/odoo:18.0
    # Native: Odoo's nightly Debian repository for the same 18.0 series
    # (https://www.odoo.com/documentation/18.0/administration/on_premise/packages.html).
    native_repository: https://nightly.odoo.com/18.0/nightly/deb/
    native_repository_key_url: https://nightly.odoo.com/odoo.key
    port: 8069
    storage: 10
    # The official Odoo 18 image runs as uid 100, gid 101. Keep its filestore and
    # private configuration owned by that container account.
    puid: 100
    pgid: 101
    database:
      provider: postgresql
      instance: postgresql-odoo
      version: "16"
      name: odoo
      role: odoo
    filestore_path: "/opt/odoo/{{ instance }}/filestore"
    admin_user: admin
  routing:
    subdomain: odoo
    proxy: internal
    access: internal
    identity: catalog
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: buildpack-deps:bookworm-curl
      key_url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
      repository: http://download.proxmox.com/debian/pbs-client
      suite: bookworm
      component: main
  crm:
    modules: [crm]
