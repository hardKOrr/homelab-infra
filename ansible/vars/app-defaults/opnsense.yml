---
# OPNsense is an ISO-installed appliance, not a Debian guest.
opnsense_defaults:
  # This native-vm guest is ISO-installed and has no guest-agent or SSH contract.
  hosting:
    method: native
    supported: [native-vm]
    impossible:
      docker-lxc: >-
        The official ISO installer boots a complete appliance OS, which Proxmox LXC cannot boot or host as a Docker guest.
      docker-vm: >-
        This deploy installs an appliance VM from its official ISO; it does not install Docker or deploy an OCI workload.
      kubernetes: >-
        The official ISO installs a standalone appliance VM; this product has no supported Kubernetes workload installer.
      native-lxc: >-
        The official ISO installer requires a complete VM boot environment and appliance network devices, which an LXC container does not provide.
  proxmox:
    vm:
      cores: 2
      memory: 4096
      disk_size: 120
      agent: 0
      onboot: true
      description: "OPNsense firewall appliance, created by homelab-infra"
      tags: [_+lab, _-opnsense]
    installer:
      # Update URL, ISO name and checksum together from OPNsense's official release.
      iso_url: "https://pkg.opnsense.org/releases/26.7/OPNsense-26.7.r1-dvd-amd64.iso.bz2"
      iso_sha256: "6b8430921316bd1d912a7bf71d02f2e354cd82b644c3fbf2646ab55382b9a758"
      iso_name: "OPNsense-26.7.r1-dvd-amd64.iso"
  routing:
    identity: none
