---
# Default configuration for Plex Media Server on the estate-resolved media stack.
# The claim token is intentionally absent: store it as the hidden `claim_token`
# field of Vaultwarden item homelab-infra/apps/<instance> before the first deploy.
plex_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: media
  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 2048
    disk_volume:
      size: 16
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    image: "plexinc/pms-docker:1.43.5.11079-b3b13e506"
    # Native: the same Plex release from the Plex Media Server APT repository
    # (https://repo.plex.tv/deb). A VM cannot reach the iGPU (see deploy-prepare.yml); an
    # LXC binds the shared one.
    native_version: "1.43.5.11079-b3b13e506"
    port: 32400
    container_port: 32400
    config_path: "/opt/{{ instance }}/config"
    # Config PVC size in Gi on Kubernetes (the cluster's default StorageClass).
    storage: 20
    transcode_path: "/opt/{{ instance }}/transcode"
    puid: 1313
    pgid: 1313
    # Optional dedicated GPU declaration from proxmox.devices. A configured GPU pins
    # the shared media stack VM to that device's node and grants Plex the DRI device groups.
    # The role enables Plex hardware decoding and encoding when /dev/dri is declared,
    # and disables both settings when no /dev/dri device is configured.
    # On a Docker LXC stack the iGPU is shared instead: leave gpu_device empty and list
    # the host's render nodes in devices (each an identifier of a proxmox.devices entry
    # with mode: shared). Deploy binds them into the LXC and into the container.
    # On Kubernetes gpu_device names the iGPU of one k3s node (cluster.nodes[].gpu_device)
    # and pins the pod there; the pod mounts the node's /dev/dri.
    gpu_device: ""
    devices: []
    mounts: >-
      {{ (homelabinfra_config.infrastructure.media_storage | default({})).mounts
         | default([], true) }}
    # This is the URL Plex gives its clients in bridge-network mode. The port is
    # deliberate: Plex's custom access URL is not complete without it, even for
    # HTTPS's conventional port.
    advertise_url: ""
  # Opened on the firewall before Deploy (tasks/wiring/firewall-opnsense.yml).
  # Remote access outside the lab is an opt-in WAN forward of app.port: copy this
  # list into config/apps/<instance>.yml with `enabled: true` to publish it, and
  # back to `enabled: false` to withdraw it.
  firewall:
    inbound:
      - name: plex-remote-access
        protocol: TCP
        port: 32400
        enabled: false
  routing:
    monitor_path: /identity
    subdomain: plex
    proxy: internal
    access: internal
    identity: none
    # Plex clients authenticate against Plex itself; an interactive proxy gate
    # would prevent televisions and mobile clients from completing their API flow.

  # One stopped-service PBS archive; library mounts and transcode stay external.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
