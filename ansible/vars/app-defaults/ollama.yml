---
# Ollama is Docker on its own Debian VM, or CPU-mode Kubernetes once its drill passes; a stack with guest_type: lxc runs CPU mode on an LXC. A dedicated PCIe GPU is optional; when configured,
# the guest owns that device exclusively. CPU deployments use ordinary floating-VM
# placement.
# The VM root disk is intentionally large enough for local model downloads. The role
# exposes one persistent model-storage mount to Compose so model blobs and Ollama's
# metadata survive image replacement and are covered by the application archive.
ollama_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    # Used only when hosting.method is native (the guest type comes from the instance's
    # proxmox.guest_type): CPU mode, models on the guest's own disk.
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 4
    memory: 16384
    disk_volume:
      size: 128
    vm:
      cores: 8
      memory: 32768
      disk_size: 1024
      agent: 1
      onboot: true
      description: "Ollama, created by homelab-infra"
      tags: [_+lab, _-debian]
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    image: ollama/ollama:0.40.15
    # Native: the same release's ollama-linux-amd64 archive, installed as in Ollama's manual
    # Linux install (https://github.com/ollama/ollama/blob/main/docs/linux.mdx).
    native_version: "0.40.15"
    native_archive_sha256: 628c018404a4206493efd38e46251c154ede5141b8b8dc85c659b3b027c47379
    port: 11434
    service_name: ollama
    # Empty selects CPU mode. GPU mode requires naming a dedicated device declared in
    # proxmox.devices; no device is selected automatically.
    gpu_device: ""
    # Kubernetes only: size in Gi of the default-StorageClass claim holding the models.
    storage: 50
    storage_path: "/opt/{{ instance }}/models"
    models_path: "/opt/{{ instance }}/models"
    # The application archive covers storage_path, including downloaded models and
    # Ollama metadata. The model store is not treated as disposable for this recovery
    # contract.

  routing:
    subdomain: ollama
    proxy: internal
    access: internal
    identity: catalog

  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
