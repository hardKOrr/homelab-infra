---
# Default configuration for Open WebUI — a persistent chat interface on the AI Docker
# stack. Open WebUI does not deploy an inference backend of its own: every instance must
# explicitly name at least one already-deployed Ollama and/or LiteLLM instance in its
# config/apps/<instance>.yml file.
open_webui_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: ai

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    # Used only when hosting.method is native (the guest type comes from the instance's
    # proxmox.guest_type); the Python package and its dependencies need room.
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 4
    memory: 8192
    disk_volume:
      size: 40
    vm:
      cores: 4
      memory: 8192
      disk_size: 40
      agent: 1
      onboot: true
      description: "Open WebUI, created by homelab-infra"
      tags: [_+lab, _-debian]
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # Pin a published release instead of a moving upstream branch/tag image.
    image: ghcr.io/open-webui/open-webui:v0.11.4
    # Native: the same release from PyPI (https://docs.openwebui.com/getting-started/quick-start/).
    native_version: "0.11.4"
    port: 3000
    container_port: 8080
    service_name: open-webui
    # Open WebUI stores users, chats, documents, uploads and its embedded database here.
    data_path: "/opt/{{ instance }}/data"
    data_mount_path: /app/backend/data
    # Kubernetes uses the cluster's default StorageClass for this persistent data claim.
    storage: 10   # GB
    # Keep the first-run account creation path open. Disable later from this app's admin
    # settings, or override this value in config/apps/<instance>.yml.
    enable_signup: true
    upstreams:
      # Empty by design: selecting a name is mandatory in the instance configuration.
      ollama: ""
      litellm: ""

  routing:
    subdomain: open-webui
    proxy: internal
    access: internal
    # Open WebUI has its own accounts and session boundary. Authentik supplies a catalog
    # tile but is not placed in front of the app's first-run login.
    identity: catalog

  # The data directory is quiesced and archived as one application-consistent PBS
  # recovery point. The selected Ollama/LiteLLM services are never part of this backup.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
