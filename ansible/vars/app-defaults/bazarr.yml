---
bazarr_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: media
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    media_kind: bazarr
    # One exact upstream version for both methods: the Docker image tag and the native
    # bazarr.zip release.
    image: "lscr.io/linuxserver/bazarr:v1.6.2-ls370"
    native_version: "1.6.2"
    port: 6767
    # Config PVC size in Gi on Kubernetes (the cluster's default StorageClass).
    storage: 2
    config_path: "/opt/{{ instance }}/config"
    puid: 1313
    pgid: 1313
    mounts: >-
      {{ (homelabinfra_config.infrastructure.media_storage | default({})).mounts
         | default([], true) }}
  # Used only when hosting.method is native.
  proxmox:
    guest_type: lxc
    cores: 2
    memory: 1024
    disk_volume:
      size: 8

  routing:
    subdomain: bazarr
    proxy: internal
    access: internal
    identity: forward_auth

  # Stop the one service and archive config, excluding disposable logs and cache.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
