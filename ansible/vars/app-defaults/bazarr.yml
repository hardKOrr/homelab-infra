---
bazarr_defaults:
  hosting:
    method: docker
    supported: [docker-vm]
    impossible: {}
  stack: media
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    media_kind: bazarr
    image: "lscr.io/linuxserver/bazarr:latest"
    port: 6767
    config_path: "/opt/{{ instance }}/config"
    puid: 1313
    pgid: 1313
    mounts: >-
      {{ (homelabinfra_config.infrastructure.media_storage | default({})).mounts
         | default([], true) }}
  routing:
    subdomain: bazarr
    proxy: internal
    access: internal
    identity: forward_auth

  # Stop the one service and archive config, excluding disposable logs and cache.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
