---
redis_defaults:
  # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
  proxmox: {type: lxc, boot_order: 40, cores: 2, memory: 1024, disk_volume: {size: 16}, tags: [_+lab, _-debian]}
  app: {port: 6379, service_name: redis-server, data_path: /var/lib/redis}
  routing: {proxy: none, identity: none}
