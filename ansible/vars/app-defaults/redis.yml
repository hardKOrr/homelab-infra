---
redis_defaults:
  hosting:
    method: native
    # Docker runs the official image on a stack host, whose stack guest_type picks the LXC or VM.
    supported: [native-lxc, native-vm, docker-lxc, docker-vm, kubernetes]
    impossible: {}
  # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or vm).
  stack: ""
  # Kubernetes method: `hosting.method: kubernetes` runs one Deployment on the k3s cluster,
  # its data on a default-StorageClass volume, behind a LoadBalancer Service on the cluster's
  # ingress address (`app.port`; two backends on one cluster need different ports).
  kubernetes: {}
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  proxmox:
    guest_type: lxc
    boot_order: 40
    cores: 2
    memory: 1024
    disk_volume: {size: 16}
    tags: [_+lab, _-debian]
  # Native paths; Docker keeps data and the ACL file in /opt/<instance>/data. image: the
  # Docker server and the Kubernetes server and recovery client. storage: Kubernetes only, Gi.
  app: {image: "redis:7", port: 6379, service_name: redis-server, data_path: /var/lib/redis, acl_path: /var/lib/redis/users.acl, storage: 2}
  routing: {proxy: none, identity: none}
  backup:
    enabled: true
    application_consistent: true
    retention_days: 14
    datastore: ""
    backup_id: ""
    # Kubernetes method only: the shared backup CronJob (tasks/kubernetes/recovery-backup.yml).
    schedule: "0 3 * * *"
    timeout_seconds: 3600
    scratch_size: 2
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
