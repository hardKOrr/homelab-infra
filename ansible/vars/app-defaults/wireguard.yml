---
# Inbound WireGuard uses upstream's package-supported wg-quick service.  It is a
# UDP endpoint, deliberately outside routing.proxy and Caddy.
wireguard_defaults:
  hosting:
    method: native
    supported: [native-lxc, docker-lxc, docker-vm, kubernetes]
    impossible: {}
  # Docker method: `hosting.method: docker` plus `stack: <name>` (guest_type lxc or vm) runs the
  # image below on that stack host. The native default is unchanged.
  stack: ""
  # Kubernetes method: `hosting.method: kubernetes` runs the same image as a Deployment on the
  # k3s cluster, with a UDP LoadBalancer Service on the ingress VIP (the WAN forward targets it).

  proxmox:
    type: lxc
    boot_order: 30
    # Inherit the lab's proxmox.lxc.ostemplate; only instance config may override it.
    cores: 1
    memory: 512
    disk_volume: {size: 8}
    tags: [_+lab, _-debian]
  app:
    interface: wg0
    port: 51820
    image: "linuxserver/wireguard:1.0.20260223" # Docker and Kubernetes methods
    # Kubernetes method only: config volume size (default StorageClass) and the init image
    # that sets the pod's network sysctls and installs the rendered config.
    storage: 1                  # Gi
    init_image: "busybox:1.37.0"
    vpn_cidr: 10.66.66.0/24
    vpn_address: 10.66.66.1/24
    client_allowed_ips: 0.0.0.0/0, ::/0
    dns: ''
    peers: []
  inbound:
    # A public DNS name or address is intentionally required in the instance config.
    public_endpoint: ''
  # Opened on the firewall before Deploy (tasks/wiring/firewall-opnsense.yml): the WAN
  # forward of the listen port to this guest. On by default, because the server has no
  # use without it. Keep `port` equal to app.port.
  firewall:
    inbound:
      - name: wireguard
        protocol: UDP
        port: 51820
        enabled: true
  routing:
    proxy: none
    identity: none
  backup:
    enabled: true
    application_consistent: true
    datastore: ""
    backup_id: ""
    # Kubernetes method only: the shared backup CronJob (tasks/kubernetes/recovery-backup.yml).
    schedule: "0 3 * * *"
    timeout_seconds: 3600
    scratch_size: 2
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml
      restore_role_task: restore
