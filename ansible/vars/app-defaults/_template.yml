---
# App defaults template.
# Copy to vars/app-defaults/APP_NAME.yml and fill in values for your app.
# Replace APP_NAME throughout this file.
#
# These are the defaults every user gets. Only expose knobs that make sense
# to change. Users override specific values in config/apps/<instance>.yml.
# This file is git-managed — improvements here benefit all users on git pull.

APP_NAME_defaults:

  # ── Proxmox resources ───────────────────────────────────────────────────────
  # NATIVE LXC apps: fill in the full block below.
  # DOCKER apps: replace with a single `stack:` key (see Docker section below).
  proxmox:
    type: lxc
    ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
    cores: 1             # increase if app is CPU-bound (check Grafana after deploy)
    memory: 512          # MB — increase if app logs OOM or slows under load
    disk_volume:
      size: 8            # GB — data path is separate, this is just the OS disk
    network: default     # references a network name in config/proxmox.yml
    tags:
      - homelab-infra
      - APP_NAME

  # ── DOCKER APPS: replace the proxmox block above with this ──────────────────
  # stack: media_stack   # which stack host to deploy on
  #                      # stack host is created if it does not exist

  # ── App config ──────────────────────────────────────────────────────────────
  app:
    port: 8080           # port the app listens on inside the container/LXC
    data_path: "/opt/{{ instance }}/data"
    config_path: "/opt/{{ instance }}/config"
    # NATIVE LXC apps: the systemd unit playbooks/apps/remove.yml stops. Set it
    # whenever the unit name differs from the instance name.
    # service_name: APP_NAME

  # ── Native LXC update checking ──────────────────────────────────────────────
  # Only needed for apps installed from GitHub binary releases (not apt, not Docker).
  # Used by playbooks/maintenance/check-native-updates.yml to notify when behind.
  # update:
  #   github_repo: owner/APP_NAME    # e.g. dani-garcia/vaultwarden
  #   binary_path: /usr/local/bin/APP_NAME

  # ── Routing ─────────────────────────────────────────────────────────────────
  routing:
    subdomain: APP_NAME  # the published hostname on the estate domain. DECLARE IT, do not
                         #   leave it to fall through: the fallback is the INSTANCE name, so
                         #   an estate-scoped app named radarr-personal would otherwise
                         #   publish radarr-personal.<domain>. Naming it here is what keeps
                         #   the instance name (filename, guest hostname, Proxmox tag) free
                         #   to carry identity without the URL following it around.
    proxy: internal      # internal | external — WHICH reverse proxy handles this app
    access: internal     # internal | public — WHO may reach it. internal restricts the
                         #   route to reverse_proxy.internal_cidrs; public opens it to
                         #   every source address, i.e. the internet on a WAN-facing proxy
    identity: catalog    # none | catalog | oidc | forward_auth — how Authentik fronts this app
                         #   none         — no Authentik object at all (platform infrastructure)
                         #   catalog      — Authentik Application tile only; the app keeps its own login
                         #   oidc         — OAuth2 provider + Application; the app consumes client_id/secret
                         #   forward_auth — proxy provider; the reverse proxy enforces Authentik login
    # NO `estate:` KEY HERE — the renderer rejects one. An estate name belongs to one
    # lab, and this file ships to every lab, so a name declared here is one the next
    # clone has never heard of and its config-doctor refuses. The estate is authored in
    # config/apps/<instance>.yml, which is that lab's own statement.
