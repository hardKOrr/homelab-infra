---
# Default stack and app configuration for Readarr — book management.
# Users override specific values in config/apps/readarr.yml.
# This file is git-managed — git pull may update these defaults.
#
# Shares the `servarr` role with Sonarr, Radarr, Lidarr and Prowlarr; see
# vars/app-defaults/sonarr.yml for the annotated copy of these keys.

readarr_defaults:
  stack: media_stack

  app:
    media_kind: readarr

    # Pinned, and permanently so. Readarr is retired: upstream archived the project
    # and LinuxServer stopped publishing `develop` and `latest`, so the tag this
    # file used to carry no longer resolves for linux/amd64 at all — the deploy dies
    # at `docker compose pull` with `no matching manifest` (execution 63,
    # 2026-08-09). This is the last multi-arch build LinuxServer produced. It will
    # never move, and neither Watchtower nor a re-deploy has anything to update it
    # to. Deploy Readarr only if you want that frozen build.
    image: "lscr.io/linuxserver/readarr:nightly-0.1.0.1225-ls85"
    port: 8787
    container_port: 8787

    config_path: "/opt/{{ instance }}/config"
    # Which subdirectory of media_storage.library this app owns. The library
    # itself is configured once for the lab in config/infrastructure.yml — an app
    # says what part of it is its own, not where storage lives.
    library_subpath: books

    # Matches media_storage.owner in infrastructure.yml, and must: this is the
    # id the app writes the library as, and the guest maps exactly that one id
    # straight through to the node. A lab that changes the owner changes both.
    puid: 1313
    pgid: 1313

  routing:
    proxy: internal
    access: internal
    # Coupled to AuthenticationMethod External — the reverse proxy is the only
    # authentication in front of this UI. See sonarr.yml.
    identity: forward_auth
