---
# Default configuration for Mixpost — the first application deployed on the Kubernetes
# hosting backend (slice 204's pilot).
# Users override specific values in config/apps/mixpost.yml.
# This file is git-managed — git pull may update these defaults.
#
# Mixpost is a self-hosted social-media scheduling tool. It was chosen as the pilot
# because it exercises the whole backend contract without depending on anything
# undecided: a database that needs an application-consistent dump, a real persistent
# volume, plain HTTP ingress, its own login, and no SMTP requirement.
#
# WHAT MAKES THIS A KUBERNETES APP
#
# `hosting: kubernetes` is the only hosting kind that must be declared rather than
# inferred. Native LXC and Docker are told apart by the presence of `stack:`; this one
# has neither a stack nor a guest of its own, because its resources live in a namespace
# on a cluster that outlives any single deployment of it.

mixpost_defaults:

  hosting: kubernetes

  # Which cluster deployment to land on. Matches the `instance` of the k3s cluster job,
  # so a lab running two clusters points each app at the one it belongs to.
  cluster: k3s-cluster

  app:
    # Mixpost Lite. The Pro image is a paid product with a different registry path; a lab
    # entitled to it overrides `image` here.
    image: "inovector/mixpost:latest"
    port: 80

    # The database and cache run as pods in this instance's own namespace, owned by it and
    # deleted with it. That keeps the pilot self-contained and is what exercises the
    # owned-resource and delete_data contracts. It does not pre-empt slice 408's standalone
    # postgresql/mariadb backends: an app may later name an external backend instead.
    database:
      image: "mysql:8.4"
      name: mixpost
      user: mixpost
      storage: 8          # GB — the database volume
    cache:
      image: "redis:7-alpine"

    # The application's own uploads and generated media.
    storage: 10           # GB

    # No worker or scheduler Deployment. Mixpost Lite's image runs Laravel's queue and
    # scheduler inside the application container itself — upstream's compose file has one
    # service, not three — so splitting them here would mean running processes the image
    # already starts.

  routing:
    subdomain: mixpost                     # hostname on the estate domain, independent of the instance name
    proxy: internal

    # THE ACCESS CLASS. One field, three values, and deliberately not the same question as
    # routing.identity below:
    #
    #   internal      — private. No public DNS record and no WAN route; reachable from the
    #                   lab network or an approved VPN only.
    #   public        — publicly resolvable and reachable with no platform identity gate.
    #                   The app may still own its own login, as Mixpost does.
    #   authenticated — publicly resolvable, but a platform identity check stands in front
    #                   of it. Requires routing.identity: forward_auth or oidc; the Caddy
    #                   wiring refuses the combination that would publish an open route
    #                   while claiming a gate.
    #
    # `internal` for the pilot: this is the class provable on this lab today, since the
    # foxglove estate resolves through a LAN-only OPNsense override. Proving `public` and
    # `authenticated` end to end is hi-events' job, in its own slice.
    access: internal

    # WHERE authentication happens — a different question from WHO may reach the app.
    # `catalog` gives Mixpost an Authentik launch tile and leaves Mixpost's own login in
    # charge, which is correct for an app that owns its user model.
    identity: catalog

    estate: foxglove

  # Application-consistent backup. A PBS snapshot of a cluster node is a crash-consistent
  # disk image and cannot see inside a volume, so it is the cluster rebuild path and not a
  # backup of this database. The artifact that matters is a quiesced dump, produced in the
  # namespace on this schedule and pushed into the lab's existing PBS datastore.
  #
  # THE WHOLE CONTRACT, IN ONE BLOCK
  #
  #   quiesce      mysqldump --single-transaction, run against the instance's own MySQL
  #                from a pod in the instance's own namespace. See the CronJob template
  #                for why that is the right quiesce for this application.
  #   contents     the database dump AND the application's storage volume. Mixpost's
  #                uploads are not reconstructible from the database — a restored row
  #                pointing at a missing file is a broken post, not a recovered one.
  #   destination  the lab's existing PBS datastore, reached with proxmox-backup-client.
  #                One destination, one retention policy, one restore tool.
  #   schedule     `schedule` below, as a Kubernetes CronJob in the app's namespace.
  #   retention    `retention_days` below, applied by the client's own prune after each
  #                successful push.
  #   encryption   `encryption` below. See the comment on it.
  #   restore      `playbooks/maintenance/restore-app.yml`, whose header is the procedure.
  #   owner        the lab operator. Nothing restores automatically; a restore replaces
  #                live data and is always a decision somebody makes.
  backup:
    enabled: true

    # Cron in the CronJob's own timezone (see `timezone` below), not in UTC-by-default.
    schedule: "0 3 * * *"

    # Applied as `proxmox-backup-client prune --keep-daily`, which is exactly this many
    # days for the daily schedule above. Pruning marks snapshots for removal; the disk
    # space comes back when PBS runs its own garbage collection, which PBS schedules
    # itself and this platform does not drive.
    retention_days: 14

    # Blank means "the datastore this lab's PBS already serves", read from
    # homelabinfra_infra.backups at deploy time. Set it only for a lab that keeps
    # application dumps in a different datastore from its VM snapshots.
    datastore: ""

    # The PBS backup-id this instance's snapshots are filed under, as `host/<id>`.
    # Blank means the instance name, which keeps one app's history in one group and
    # cannot collide with the `vm/<vmid>` groups the nightly vzdump job writes.
    backup_id: ""

    # Cron interprets this. Left unset the CronJob would run in the controller
    # manager's timezone — UTC on this cluster — and "03:00" would not be 03:00 to
    # the operator reading the job history.
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"

    # Hard stop for one run. A backup that hangs holds the storage volume's mount and
    # blocks the next night's run under concurrencyPolicy: Forbid, so it is better to
    # fail loudly after an hour than to wedge the schedule silently.
    timeout_seconds: 3600

    # GB. Scratch space for the SQL dump before it is pushed, as an emptyDir on the
    # node. Sized to the database volume: a dump is smaller than the InnoDB files it
    # came from, so this has headroom. Exceeding it evicts the pod, which is a clear
    # failure rather than a node that quietly fills up.
    scratch_size: 8

    # DECLARED, AND DELIBERATELY OFF.
    #
    # proxmox-backup-client can encrypt client-side with a key file, and the key is then
    # the only thing that can read the backup. In this lab that trades one risk for a
    # worse one: the datastore already sits on lab-controlled storage behind the lab's
    # own network, while a lost key makes every snapshot unreadable forever, and the
    # only safe home for that key is Vaultwarden — which would make reading a Mixpost
    # backup depend on Vaultwarden being up first, in exactly the disaster where it
    # might not be.
    #
    # `none` is therefore a decision, not an omission: the snapshots are protected by
    # the datastore's own access control and by PBS's API token, not by a client key.
    # A lab that wants client-side encryption needs a key-custody decision of its own
    # first — where the key lives, who can read it, and how a restore gets it before
    # anything else is running — which is a slice, not a flag.
    encryption: none

    # HOW proxmox-backup-client GETS INTO A POD.
    #
    # There is no official Proxmox-published container image for the backup client, and
    # this lab has no private registry to build one into. The three options were:
    #
    #   1. a community image (fdrake/proxmox-backup-client and friends) — one more
    #      third-party maintainer in the path of the container that holds the PBS
    #      credential, updated on somebody else's schedule.
    #   2. build our own and push it — needs a registry the lab does not have.
    #   3. a stock Debian image that installs the client from Proxmox's own signed apt
    #      repository on each run.
    #
    # Option 3 is taken. The bytes come from Proxmox and Debian over TLS, signed by the
    # Proxmox release key that ansible/roles/pbs/defaults/main.yml already trusts for
    # the server itself — so client and server are installed from the same source, on
    # the same release train, with no new party to trust.
    #
    # The cost is real and is stated rather than hidden: THE BACKUP JOB NEEDS OUTBOUND
    # NETWORK ACCESS TO deb.debian.org AND download.proxmox.com EVERY TIME IT RUNS. A
    # lab that is offline at 03:00, or a Debian mirror having a bad night, is a failed
    # backup — which notifies, rather than passing silently. A lab that wants that
    # dependency gone points `image` at its own prebuilt image carrying the client, and
    # nothing else in this block changes.
    #
    # THE IMAGE MUST ALREADY CARRY curl, AND THAT IS NOT A DETAIL.
    #
    # The job's failure notification is a curl POST to Ntfy. `debian:12-slim`, which this
    # was until 2026-08-20, ships no curl and no package lists, so the script had to
    # `apt-get update && apt-get install curl` before it could notify about anything — and
    # that apt step is precisely the thing that fails on the night the WAN is down. The
    # trap fired, curl was not there, the `|| true` swallowed it, and the one failure mode
    # the notification exists for was the one it could not report. `buildpack-deps` is the
    # official Debian image with curl and ca-certificates already in it, on the same
    # bookworm train as everything else here, so the notifier works before the first
    # network-dependent line runs. Any replacement image must ship curl for the same
    # reason.
    #
    # `suite` and `key_url` track the PBS the platform installs (Debian 12 / bookworm,
    # see roles/pbs). Client and server should move together: raise both or neither.
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
