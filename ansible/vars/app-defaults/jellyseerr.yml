---
# Default configuration for Jellyseerr — the media stack's request front end, on the
# Kubernetes hosting backend (slice 204's second workload after Mixpost).
# Users override specific values in config/apps/jellyseerr.yml.
# This file is git-managed — git pull may update these defaults.
#
# WHAT MAKES THIS A KUBERNETES APP
#
# `hosting.method: kubernetes` records its namespace-based path. Jellyseerr has neither
# a stack nor a guest of its own — its config volume and web front end live in a namespace
# on a cluster that outlives any single deployment of it.
#
# SIMPLER THAN MIXPOST, DELIBERATELY
#
# Jellyseerr keeps its settings and its own SQLite database in one directory
# (`/app/config`) and needs no external database or cache: there is one PersistentVolume,
# one Deployment, no StatefulSet, no second Secret for component credentials.
#
# WHAT THIS ROW DOES NOT DO YET
#
# Jellyseerr's own first-run wizard is how it is pointed at a Jellyfin or Plex server and
# at Sonarr/Radarr — see https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/408-app-catalog/README.md's jellyseerr row and this
# app's own role for why that step is not automated here. The deploy brings up a
# persisted, backed-up, reverse-proxied, monitored, empty Jellyseerr; the operator signs
# in once to connect it to the rest of the media stack.

jellyseerr_defaults:

  hosting:
    method: kubernetes
    supported: [kubernetes, docker-lxc, docker-vm, native-lxc, native-vm]
    impossible: {}

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  # NO `cluster:` HERE, DELIBERATELY.
  #
  # tasks/kubernetes/resolve-cluster.yml — the adapter every Kubernetes app role,
  # including this one, delegates kubectl through — always resolves the single
  # `homelabinfra_infra.kubernetes` registry entry. It has no per-app selector input, so a
  # `cluster:` key here would name a value nothing reads: a lab running two clusters would
  # see this deploy land on whichever cluster the registry currently holds regardless of
  # what was configured, silently. That is worse than not offering the option. Multi-cluster
  # targeting is unimplemented platform-wide (see the same resolver Mixpost's role uses);
  # this file will not claim otherwise until the resolver actually reads a selector.

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type). The source build needs the memory.
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 4096
    disk_volume:
      size: 8
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  app:
    # Docker and Kubernetes run the image of the same Seerr release the native install
    # builds from source (https://github.com/seerr-team/seerr/blob/develop/docs/getting-started/buildfromsource.mdx).
    image: "ghcr.io/seerr-team/seerr:v3.5.1"
    native_version: "3.5.1"
    native_node_version: "22.19.0"
    native_node_sha256: c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2
    native_pnpm_version: "10.24.0"
    native_pnpm_sha256: 985824ae016db3c7bbd7b39dcb4e6f5740b11cce79f5c43d5e5e640768fd4806
    port: 5055

    # Docker and native methods: the config directory on the guest (Docker: owned by the
    # image's `node` user; native: by the service user). Kubernetes uses the PersistentVolume below instead.
    config_path: "/opt/{{ instance }}/config"
    puid: 1000
    pgid: 1000

    # Settings, cached images and the application's own SQLite database. Small — this is
    # not a media library — but not disposable: it is the only copy of every request,
    # every user account and every Sonarr/Radarr connection this app holds.
    storage: 2   # GB

  routing:
    subdomain: jellyseerr                  # hostname on the estate domain, independent of the instance name
    proxy: internal
    access: internal

    # `catalog`, not `forward_auth`. Jellyseerr signs its own users in against the media
    # server it is connected to (Jellyfin or Plex) — the same reasoning as Jellyfin's own
    # `identity: catalog` and Tautulli's. A forward-auth gate in front of it would demand
    # an Authentik session before Jellyseerr's own sign-in page is ever reached.
    identity: catalog

    # No `estate:` here, deliberately. Estate names are one lab's, and this file ships to
    # every lab — a name declared here is one the next clone has never heard of, and its
    # config-doctor rejects it. Author the estate in config/apps/<instance>.yml, where it
    # is that lab's own statement. The renderer enforces this.

  # Application-consistent backup, on the same contract Mixpost proved: a snapshot pushed
  # into the lab's existing PBS datastore, not the crash-consistent image a PBS snapshot of
  # a cluster node would produce.
  #
  # UNLIKE MIXPOST, THIS IS A FILESYSTEM ARCHIVE, NOT A DATABASE DUMP.
  #
  # Jellyseerr's SQLite database lives inside the same volume this archives. A plain
  # filesystem copy of a SQLite file that the application may be writing to at the same
  # moment can capture a torn write — SQLite's own online-backup mechanism exists
  # specifically to avoid that, and nothing here invokes it. Stated plainly rather than
  # silently assumed safe: this backup is better than no backup and is what the PVC-only
  # shape of this application allows without adding an exec hook into the running
  # container; it is not proven application-consistent the way Mixpost's
  # --single-transaction dump is. Restoring into a fresh instance and verifying is the way
  # to find out whether a given nightly snapshot came out clean.
  backup:
    enabled: true

    # Docker method: the service is stopped for the PBS upload, so the SQLite file and
    # settings share one recovery point (roles/jellyseerr/tasks/backup.yml).
    application_consistent: true

    # Cron in the CronJob's own timezone (see `timezone` below), not in UTC-by-default.
    schedule: "0 3 * * *"

    # Applied as `prune --keep-daily` (plus `--keep-last 2`), which is exactly this many
    # days for the daily schedule above.
    retention_days: 14

    # Blank means "the datastore this lab's PBS already serves", read from
    # homelabinfra_infra.backups at deploy time.
    datastore: ""

    # The PBS backup-id this instance's snapshots are filed under, as `host/<id>`. Blank
    # means the instance name.
    backup_id: ""

    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"

    # Hard stop for one run. See vars/app-defaults/mixpost.yml's comment on the same field
    # for why this fails loudly rather than wedging the schedule.
    timeout_seconds: 3600

    # GB. Scratch headroom is generous relative to the 2 GB config volume this archives.
    scratch_size: 2

    # Declared, and deliberately off — the same reasoning as vars/app-defaults/mixpost.yml.
    encryption: none

    # HOW proxmox-backup-client GETS INTO A POD. Same image and same signed-apt-repository
    # install path as Mixpost's backup job; see that file's `client` comment for the three
    # options considered and the outbound-network cost this one carries.
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
