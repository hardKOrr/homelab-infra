---
# Default configuration for Mautic — the marketing-automation platform, on the
# services_stack Docker host. Users override specific values in config/apps/mautic.yml.
# This file is git-managed — git pull may update these defaults.
#
# Mail and database backends are named instances, not private sidecars.
# roles/mautic/tasks/main.yml provisions its database on the named
# MariaDB backend through tasks/database/provision.yml, and reads outbound mail through
# tasks/mail/resolve-mail.yml — the same two seams roles/odoo/tasks/main.yml already
# proved for PostgreSQL.
mautic_defaults:
  stack: services

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # `apache`, not `fpm`: the upstream README says plainly to prefer it — the FPM
    # variant's exemplified nginx.conf has known issues. Pinned to a point release, the
    # same reasoning as vars/app-defaults/odoo.yml's `odoo:18.0`.
    image: docker.io/mautic/mautic:6.0.6-apache

    database:
      provider: mariadb
      instance: mariadb-mautic
      name: mautic
      role: mautic

    port: 8091

    # Mautic's config (config/local.php), logs, uploaded files and images. The native
    # recovery task pairs this tree with the named MariaDB database in one PBS archive.
    # The four subdirectories mirror the upstream mautic/docker-mautic example's volume
    # list (see roles/mautic/defaults/main.yml).
    data_path: "/opt/mautic/{{ instance }}/data"

    admin_user: admin

  routing:
    subdomain: mautic
    proxy: internal
    access: internal
    identity: catalog

  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    datastore: ""
    backup_id: ""
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main

  # Recovery boundary: restore the Mautic database and this instance's complete data
  # directory from the same recovery point. The shared MariaDB guest stays in place when
  # Remove App deletes only this application's database and login.
