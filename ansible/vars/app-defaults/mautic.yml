---
# Default configuration for Mautic — the marketing-automation platform, on the
# services_stack Docker host, as a pod on the k3s cluster, or natively on its own LXC or VM
# (hosting.method: native and an explicit proxmox.guest_type). Users override specific values in config/apps/mautic.yml.
# This file is git-managed — git pull may update these defaults.
#
# Mail and database backends are named instances, not private sidecars.
# playbooks/apps/mautic.yml provisions its database on the named MariaDB backend through
# tasks/database/provision.yml and reads outbound mail through tasks/mail/resolve-mail.yml
# — the same two seams Odoo already proved for PostgreSQL.
mautic_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type).
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 2
    memory: 3072
    disk_volume:
      size: 16
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    # `apache`, not `fpm`: the upstream README says plainly to prefer it — the FPM
    # variant's exemplified nginx.conf has known issues. Pinned to a point release, the
    # same reasoning as vars/app-defaults/odoo.yml's `odoo:18.0`.
    image: docker.io/mautic/mautic:6.0.6-apache
    # Native: Mautic's release package at the same version as the image
    # (https://docs.mautic.org/en/latest/getting_started/how_to_install_mautic.html).
    native_version: "6.0.6"
    native_sha256: 2feadc198a711e05ced68c829d677d8569e77c368ffc04353d8b1e34cecb3236

    database:
      provider: mariadb
      instance: mariadb-mautic
      name: mautic
      role: mautic

    port: 8091

    # Mautic's config (config/local.php), logs, uploaded files and images. The native
    # recovery task pairs this tree with the named MariaDB database in one PBS archive.
    # The four subdirectories mirror the upstream mautic/docker-mautic example's volume
    # list (see roles/mautic/defaults/main.yml).
    data_path: "/opt/mautic/{{ instance }}/data"
    storage: 10

    admin_user: admin

  routing:
    subdomain: mautic
    proxy: internal
    access: internal
    identity: catalog

  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    datastore: ""
    backup_id: ""
    retention_days: 14
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main

  # Recovery boundary: restore the Mautic database and this instance's complete data
  # directory from the same recovery point. The shared MariaDB guest stays in place when
  # Remove App deletes only this application's database and login.
