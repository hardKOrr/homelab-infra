---
# Default configuration for Karakeep — the self-hosted bookmark and read-later
# application on the services Docker stack, as a pod on the k3s cluster, or natively on
# its own LXC or VM (hosting.method: native, stack: "" and an explicit
# proxmox.guest_type). Karakeep owns its SQLite database and Meilisearch index; it does
# not need a platform database backend.
karakeep_defaults:
  hosting:
    method: docker
    supported: [docker-vm, docker-lxc, kubernetes, native-lxc, native-vm]
    impossible: {}
  stack: services

  # Used only when hosting.method is native (the guest type comes from the instance's
  # proxmox.guest_type). The production Next.js build needs the memory.
  proxmox:
    ostemplate: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
    cores: 4
    memory: 6144
    disk_volume:
      size: 32
    cloud_template:
      name: debian-12-cloud
      image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"

  recovery:
    methods: [native]
    native:
      backup_playbook: backup-app.yml
      restore_playbook: restore-app.yml

  app:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    # Native: Karakeep's Debian 12/Ubuntu 24.04 install script
    # (https://docs.karakeep.com/installation/debuntu) at the same release as the image.
    # The script always installs the latest release, so Deploy pins its release and
    # Meilisearch lookups with native_script_sha256 verifying the script.
    native_version: "0.33.2"
    native_script_sha256: 42904f6ee981bf518a5b93a4d868e73cdcc81111757ea6532f96c2c9bab74d18
    native_meilisearch_version: "v1.41.0"
    chrome_image: ghcr.io/karakeep-app/karakeep-chrome:release
    meilisearch_image: getmeili/meilisearch:v1.41.0
    port: 3005
    # One default-StorageClass claim keeps the SQLite/assets directory and Meilisearch
    # index together in the same data.pxar layout as the existing Docker recovery points.
    storage: 10
    # SQLite database, uploaded assets and crawled archives. The role binds this path
    # into the application container as /data.
    data_path: "/opt/{{ instance }}/data"
    # Allow the first operator to create the initial Karakeep account. Operators can
    # disable further local signups after that account exists.
    disable_signups: false
    # The application uses SQLite. WAL mode is appropriate for the local filesystem on
    # the Docker stack guest and avoids readers blocking normal crawler writes.
    db_wal_mode: true

  routing:
    subdomain: karakeep
    proxy: internal
    access: internal
    # Karakeep owns its user accounts and password authentication. Authentik provides a
    # catalog tile but does not become an authentication dependency for the app.
    identity: catalog

  # Link previews may fetch ordinary HTTP URLs as well as HTTPS ones.
  firewall:
    egress:
      - name: bookmark-fetch-http
        protocol: TCP
        port: 80

  # Backup App stops this instance's three Compose services and archives the SQLite
  # database, assets and Meilisearch index together as one application-consistent point.
  backup:
    enabled: true
    application_consistent: true
    schedule: "0 3 * * *"
    retention_days: 14
    datastore: ""
    backup_id: ""
    timezone: "{{ homelabinfra_config.timezone | default('UTC') }}"
    timeout_seconds: 3600
    scratch_size: 2
    encryption: none
    client:
      image: "buildpack-deps:bookworm-curl"
      key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
      repository: "http://download.proxmox.com/debian/pbs-client"
      suite: bookworm
      component: main
