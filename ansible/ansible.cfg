[defaults]
inventory            = inventory/
roles_path           = roles/
host_key_checking    = False
retry_files_enabled  = False
callback_plugins     = callback_plugins
stdout_callback      = homelab
callback_result_format = yaml
interpreter_python   = auto_silent

# An operator reads one Rundeck "Log Output" pane, so the log must be mostly signal.
# These two drop the silent `ok: [host]` and `skipping: [host]` result lines only;
# callback_plugins/homelab.py keeps every TASK banner, every changed/failed line and
# every debug/assert message regardless. Restore the full stream for one run with
# ANSIBLE_DISPLAY_OK_HOSTS=1 / ANSIBLE_DISPLAY_SKIPPED_HOSTS=1.
display_ok_hosts      = False
display_skipped_hosts = False

[privilege_escalation]
become        = False
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
