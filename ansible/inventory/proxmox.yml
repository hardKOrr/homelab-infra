---
# community.proxmox templates its connection options (url/user/token_*) with a Templar that never
# receives -e extra vars (proven: .claude/plans/done/fix-inventory-url-and-extra-vars.md Run log),
# so these options read PROXMOX_API_* from the process environment via lookup('env', ...), which the
# same Templar DOES evaluate (no host/extra vars needed). Populate them with
# scripts/with-proxmox-env.sh (bare CLI / fresh clone) or export them in the Rundeck/Semaphore job
# step. Playbooks still receive homelabinfra_config via -e @user-vars.yml for task-time vars; only
# this inventory file is env-driven.
plugin: community.proxmox.proxmox
# Derive a full URL (scheme + host + port) from the same bare host the provisioning modules consume,
# so users configure the host in exactly one place. community.proxmox's inventory `url` option
# expects a scheme (its default is http://localhost:8006); port falls back to 8006.
url: "https://{{ lookup('env', 'PROXMOX_API_HOST') }}:{{ lookup('env', 'PROXMOX_API_PORT') | default('8006', true) }}"
user: "{{ lookup('env', 'PROXMOX_API_USER') | default('root@pam', true) }}"
token_id: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') }}"
token_secret: "{{ lookup('env', 'PROXMOX_API_TOKEN_SECRET') }}"
# Homelab Proxmox nodes use self-signed TLS certs; skip verification deliberately.
validate_certs: false
want_facts: true
# The plugin namespaces every fact it publishes as `proxmox_*`, and these expressions are
# evaluated against those hostvars. Bare `type` and `tags` do not exist, so the previous
# `type == 'node'` / `key: tags` matched nothing and silently produced no groups at all —
# no `proxmox_clients`, and not one `tag_*`. `proxmox_nodes` still appeared only because the
# plugin creates a group of that name itself, which is what made the breakage invisible.
#
# What depended on the groups that were never created:
#   tag_<instance>   — every app playbook's "reuse the existing guest" check, so re-running
#                      a deploy would provision a SECOND guest instead of converging
#   tag_<stack>      — stack/find-or-create-host.yml locating a shared Docker host
#   tag_homelab_infra— status.yml and check-native-updates.yml's host pattern
#
# Group names are sanitised by Ansible: a hyphen in a Proxmox tag becomes an underscore, so
# the tag `homelab-infra` yields the group `tag_homelab_infra`. Consumers must look up the
# sanitised name — `hosts: tag_homelab-infra` silently matches nothing, which is exactly
# what status.yml and check-native-updates.yml did.
#   proxmox_clients  — network/generate-ip.yml's in-use address list, so allocation never
#                      excluded an address already held by a guest
#
# Nodes are distinguished from guests by `proxmox_node`: the plugin sets it on every guest
# (the node hosting it) and publishes no hostvars at all for node entries.
# Give every guest an address to connect to. The plugin does NOT set ansible_host for
# guests from their configured address — it only does so via the QEMU guest agent, which an
# LXC does not have — so without this a guest reached through the inventory has an EMPTY
# ansible_host and the connection fails with "Could not resolve hostname :". That is what
# stopped the first re-run that successfully reused an existing guest.
#
# Shape comes from the plugin's own documented example: net0 (LXC) and ipconfig0 (VM) are
# parsed into dicts, so .ip is "192.168.0.10/20" and the prefix is stripped here. A DHCP
# guest yields an empty string rather than the literal "dhcp", so it fails as a missing
# value instead of as a bogus hostname; DHCP guests are resolved at create time by
# lxc-create.yml's lease discovery.
compose:
  ansible_host: >-
    (proxmox_ipconfig0.ip
      | default(proxmox_net0.ip, true)
      | default('', true)
      | regex_replace('^dhcp.*$', '')
      | regex_replace('/.*$', ''))

groups:
  proxmox_nodes: "proxmox_node is not defined"
  proxmox_clients: "proxmox_node is defined"
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"
