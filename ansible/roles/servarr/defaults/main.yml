---
# Role-internal defaults for the servarr role. Everything a user would tune lives
# in vars/app-defaults/<app>.yml instead — these are paths and timings the role
# needs and nobody overrides.

servarr_project_dir: "/opt/{{ instance }}"

# How long to wait for the container to write its config.xml. A Servarr app
# generates that file on first start, several seconds after the port opens.
servarr_config_retries: 30
servarr_config_delay: 5

# Native: Lidarr installed from its release tarball under systemd, on its own LXC or VM.
servarr_native: "{{ app_config.hosting.method | default('docker') == 'native' }}"
servarr_service: "{{ app_config.app.media_kind }}"
servarr_native_dir: "{{ servarr_project_dir }}/bin"
# Debian 12 and Ubuntu 24.04: the ICU runtime package the .NET app needs.
servarr_native_icu:
  bookworm: libicu72
  noble: libicu74
