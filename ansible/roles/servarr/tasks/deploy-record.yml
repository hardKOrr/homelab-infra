---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before wiring). Docker and native:
# record the instance-keyed `media` registry entry (ansible/vars/CONTRACT.md §3) that
# playbooks/stacks/wire-media-stack.yml reads to find this app. Topology only: the API key
# is in homelab-infra/media/<instance>, written by main.yml. A Kubernetes instance has no
# entry, so Wire Media Stack does not discover it.
- name: Servarr | Record the media registry entry
  ansible.builtin.include_tasks: ../../../tasks/bootstrap/write-generated-facts.yml
  vars:
    _servarr_guest: "{{ hostvars[groups['deploy_' ~ instance][0]] }}"
    generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
    generated_facts_service: media
    # An expression, never a literal `"{{ instance }}":` key: Ansible does not template a
    # mapping key, so every app would overwrite one nameless entry.
    generated_facts_data: >-
      {{ {instance: {'app': _servarr_guest.servarr_media_kind,
                     'host': _servarr_guest.servarr_media_host,
                     'config_path': _servarr_guest.servarr_media_config_path}} }}
  when: app_config.hosting.method in ['docker', 'native']
