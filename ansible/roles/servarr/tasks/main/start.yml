---
# Phase of main.yml: create the config directory and deploy the Compose project. Imported in
# place; inputs are listed in main.yml.

# ── Directories ───────────────────────────────────────────────────────────────
# Owned by the container's uid, not root: the app writes its own config.xml and
# database here on first start.
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}"
    state: directory
    owner: "{{ app_config.app.puid | default(1000) }}"
    group: "{{ app_config.app.pgid | default(1000) }}"
    mode: "0750"

# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot.
# Its render stays out of the log: the Compose file carries the API key. Images are pulled
# only when missing; Watchtower moves them forward and reports it.
- name: Deploy the Compose project
  ansible.builtin.include_tasks: ../../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ servarr_project_dir }}"
    compose_secrets: ["{{ _servarr_api_key }}"]
