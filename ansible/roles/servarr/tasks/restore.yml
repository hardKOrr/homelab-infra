---
- name: Servarr restore | Use the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: Servarr restore | Use the Docker restore swap
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'docker'

- name: Servarr restore | Reject an unsupported restore hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('docker')) in ['docker', 'kubernetes']
    fail_msg: >-
      Servarr recovery supports hosting.method docker or kubernetes; refusing to mutate a
      target hosted by an unsupported method.
