---
# servarr role — one Servarr application (Sonarr, Radarr, Lidarr, Readarr or
# Prowlarr) as a Docker container on a stack host. Called from Play 2 of
# playbooks/apps/<app>.yml. Target: the media_stack host.
#
# ONE ROLE, FIVE APPS. These five are the same program with a different media
# type: same image family, same /config layout, same config.xml, same
# /api/<v>/system/status contract. What differs between them — API version,
# Prowlarr implementation name, download-client category field — is already a
# table in ansible/vars/media-wiring.yml, which slice 504's wiring reads. Copying
# the role five times would mean five places to fix every Servarr behaviour and a
# second table describing the same apps. Each app still has its own playbook, its
# own app-defaults file and its own one-click job, which is what the platform's
# "one click per app" rule is about. Decision record:
# docs/meta/505-app-servarr/notes.md.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name (e.g. sonarr, sonarr-anime)
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the `media` registry key):
#   servarr_media_kind, servarr_media_host, servarr_media_config_path

- name: Load the media wiring table
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/media-wiring.yml"

- name: Resolve the app kind
  ansible.builtin.set_fact:
    _servarr_kind: "{{ app_config.app.media_kind }}"
    # Servarr reads configuration overrides from <APPNAME>__SECTION__KEY.
    _servarr_prefix: "{{ app_config.app.media_kind | upper }}"

# The kind is not decoration: slice 504 refuses to wire an app whose kind is not
# in this table, so a typo here would deploy an app that silently never joins the
# media stack. Failing at deploy time names the problem where it was made.
- name: Assert the app kind is known to the media wiring table
  ansible.builtin.assert:
    that: _servarr_kind in media_wiring.kinds
    fail_msg: >-
      app.media_kind is "{{ _servarr_kind }}", which ansible/vars/media-wiring.yml
      does not define. Known kinds:
      {{ media_wiring.kinds.keys() | list | join(', ') }}.
      wire-media-stack.yml would skip this instance.

- name: Resolve the app's API version from the wiring table
  ansible.builtin.set_fact:
    _servarr_api: "{{ media_wiring.kinds[_servarr_kind].api }}"
    _servarr_rootfolder_needs_profiles: >-
      {{ media_wiring.kinds[_servarr_kind].rootfolder_needs_profiles
         | default(false) | bool }}

# Storage is configured once for the lab in config/infrastructure.yml under
# media_storage, not restated by every app. An app contributes one thing: which
# subdirectory of the library it owns.
- name: Resolve the storage this app uses
  ansible.builtin.set_fact:
    # An app that owns no part of the library has no reason to see it: Prowlarr
    # declares no library_subpath and therefore gets no mounts at all. app.mounts
    # overrides both ways, which is how an app that needs the downloads directory
    # without owning a library subpath would ask for it.
    _servarr_mounts: >-
      {{ app_config.app.mounts
         | default([] if (app_config.app.library_subpath | default('') | length == 0)
                   else ((app_config.media_storage | default({})).mounts | default([])),
                   true) }}
    _servarr_root_folders: >-
      {{ [((app_config.media_storage | default({})).library | default('') ~ '/'
           ~ (app_config.app.library_subpath | default('')))]
         if ((app_config.media_storage | default({})).library | default('') | length > 0
             and app_config.app.library_subpath | default('') | length > 0)
         else (app_config.app.root_folders | default([])) }}

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create project directory
  ansible.builtin.file:
    path: "{{ servarr_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Owned by the container's uid, not root: the app writes its own config.xml and
# database here on first start.
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}"
    state: directory
    owner: "{{ app_config.app.puid | default(1000) }}"
    group: "{{ app_config.app.pgid | default(1000) }}"
    mode: "0750"

# ── Storage the lab already provides ──────────────────────────────────────────
# The library and download directories are not this platform's to create. They are
# mounted on the Proxmox node, attached to the stack host as mountpoints by Play 1,
# and mounted into the container at the SAME path they have on the host. Identical
# paths on both sides are what let an app database migrated from another machine
# keep resolving its files without a single path rewrite.
#
# This checks they arrived. A container started against a missing bind source gets
# an empty directory, the root folder below is created inside it, and the app
# reports its entire library missing — which reads like data loss and is not.
- name: Verify the declared mounts are present on the stack host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: _servarr_mount_check
  loop: "{{ _servarr_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Assert every declared mount is present on the stack host
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: >-
      {{ item.item.path }} is not present on this stack host. It is declared in
      media_storage.mounts and Play 1 attaches it as a Proxmox mountpoint, so
      either the attach did not happen or the guest has not restarted since. This
      platform attaches storage the lab already provides; it never creates it.
  loop: "{{ _servarr_mount_check.results }}"
  loop_control:
    label: "{{ item.item.path }}"

# ── API key continuity ────────────────────────────────────────────────────────
# The key is declared by this deploy rather than discovered after it, so the
# credential exists before the container that uses it. On a re-run the key
# already in config.xml wins: it is what the app answers to today and what every
# Prowlarr Application and Bazarr connection in the lab was wired with, so
# regenerating it would break wiring this platform itself created.
- name: Read the existing config.xml (key continuity across re-runs)
  ansible.builtin.slurp:
    src: "{{ app_config.app.config_path }}/config.xml"
  register: _servarr_config_existing
  failed_when: false
  no_log: true

# Three sources, in the order of what the app actually answers to.
#
# config.xml only carries <ApiKey> when the APP wrote one. A key this platform
# supplies through the environment never appears there — measured on the live lab
# 2026-08-12: prowlarr's config.xml has no ApiKey element at all. With config.xml
# as the only continuity source, every re-deploy therefore minted a NEW key,
# rewrote the Compose file and bounced the container (executions 114-116, three
# consecutive runs, three different keys), which is precisely the breakage the
# comment above says must not happen: the Prowlarr Applications, Bazarr
# connections and media-registry entries this platform created all still hold the
# previous key.
#
# The vault item is the platform's own record of the key it issued, and it
# survives container recreation, so it is the continuity source when the app has
# not written one. roles/qbittorrent and roles/jellyfin already read their
# password back the same way.
- name: Resolve the API key
  ansible.builtin.set_fact:
    _servarr_api_key: >-
      {{ (_servarr_config_existing.content | default('') | b64decode
          | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1') | default([], true) | join(''))
         | default(_servarr_vault_key, true)
         | default(lookup('password', '/dev/null length=32 chars=ascii_lowercase,digits'), true) }}
  vars:
    _servarr_vault_key: >-
      {{ ((homelabinfra_vault.media | default({}))[instance] | default({})).api_key
         | default('', true) }}
  no_log: true

# ── Configuration ─────────────────────────────────────────────────────────────
- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ servarr_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true      # the compose file carries the API key
  notify: Restart servarr

# ── Run ───────────────────────────────────────────────────────────────────────
# policy: missing, matching roles/observability — a deploy ensures the image is
# present, Watchtower is what moves it forward and reports it. Re-pulling :latest
# on every deploy would make each run a silent, unreviewed upgrade.
- name: Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ servarr_project_dir }}"
    policy: missing
  changed_when: false

- name: Start the app
  community.docker.docker_compose_v2:
    project_src: "{{ servarr_project_dir }}"
    state: present
    remove_orphans: true

- name: Apply pending restarts before the checks
  ansible.builtin.meta: flush_handlers

# ── Prove the app is USABLE, not merely alive ─────────────────────────────────
# A Servarr container opens its port well before it is configured, and a v4 app
# that never had an authentication method chosen serves its setup screen on every
# UI path while looking perfectly healthy from outside.
#
# THE APP IS ASKED, NOT ITS CONFIG FILE. Measured live 2026-08-09 against
# lscr.io/linuxserver/prowlarr:latest: the `<APP>__AUTH__APIKEY` and
# `<APP>__AUTH__METHOD` overrides are honoured — the declared key authenticates
# and an unkeyed call is refused — and yet config.xml contains NEITHER element.
# Servarr treats environment overrides as runtime configuration and persists only
# what its own setup writes, so "config.xml has no ApiKey" does not mean "the app
# has no API key". Asserting on the file failed a deploy of an app that was
# working correctly.
#
# config.xml keeps exactly one job, above: key continuity. An app with a key of
# its own — migrated, or set up by hand — is adopted rather than overwritten,
# because that key is what every Prowlarr Application and Bazarr connection in
# the lab was wired with.
#
# Three checks, each failing a state the port alone cannot distinguish:
#
#   1. /api/<v>/system/status answers with the app's own name, authenticated with
#      the key that is in force. That proves the key is live, which is the one
#      thing every piece of media wiring depends on — and a first-run app with no
#      key configured fails it, because nothing authenticates.
#   2. the same call WITHOUT the key is refused. Without this, an app configured
#      DisabledForLocalAddresses looks identical to a secured one from the stack
#      host, and the lab ships an unauthenticated API on the LAN.
#   3. the app reports an authentication method it actually chose, read from
#      /api/<v>/config/host — the setup-page state that config.xml used to be
#      asked about, asked of the running app instead.
- name: Re-read config.xml after start (an app may have written its own key)
  ansible.builtin.slurp:
    src: "{{ app_config.app.config_path }}/config.xml"
  register: _servarr_config
  until: _servarr_config.content is defined
  retries: "{{ servarr_config_retries }}"
  delay: "{{ servarr_config_delay }}"
  failed_when: false
  no_log: true

- name: Resolve the key that is in force
  ansible.builtin.set_fact:
    # A key in config.xml wins: the app wrote it, so it is what the app answers
    # to. Otherwise the declared key is in force through the environment, which
    # the status call below proves rather than assumes.
    _servarr_effective_key: >-
      {{ (_servarr_config.content | default('') | b64decode
          | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1') | default([], true) | join(''))
         | default(_servarr_api_key, true) }}
  no_log: true

- name: Assert a key exists to authenticate with
  ansible.builtin.assert:
    that: _servarr_effective_key | length > 0
    fail_msg: >-
      {{ instance }} has no API key from either source — none in config.xml at
      {{ app_config.app.config_path }}, and none declared by this deploy. Without
      one, nothing can wire this app.

- name: Query the app's own status endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/system/status"
    headers:
      X-Api-Key: "{{ _servarr_effective_key }}"
    # 401 is accepted here so the retry loop owns the wait and the assert below
    # owns the explanation. Letting uri fail on it produces "Status code was 401",
    # which says nothing about what to do next.
    status_code: [200, 401]
  register: _servarr_status
  until: _servarr_status.status | default(0) == 200
  retries: 30
  delay: 5
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert the key in force actually authenticates
  ansible.builtin.assert:
    that: _servarr_status.status | default(0) == 200
    fail_msg: >-
      {{ instance }} refused the key this deploy holds. Either the app generated
      a key of its own after start and did not write it to
      {{ app_config.app.config_path }}/config.xml, or it never accepted
      {{ _servarr_prefix }}__AUTH__APIKEY and is sitting on its first-run setup
      page — which answers the port normally and serves the setup screen on every
      UI path. `docker logs {{ instance }}` shows which.

- name: Assert the app identifies itself as {{ _servarr_kind }}
  ansible.builtin.assert:
    that: (_servarr_status.json.appName | default('') | lower) == _servarr_kind
    fail_msg: >-
      {{ app_config.app.port }} answered the {{ _servarr_kind }} status endpoint
      as "{{ _servarr_status.json.appName | default('nothing') }}". Either
      app.image and app.media_kind disagree, or another container already holds
      that port on this stack host.

- name: Call the status endpoint with no API key
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/system/status"
    status_code: [200, 401]
  register: _servarr_unauthenticated
  changed_when: false

- name: Assert the API refuses an unauthenticated caller
  ansible.builtin.assert:
    that: _servarr_unauthenticated.status == 401
    fail_msg: >-
      {{ instance }} served its API to a caller with no key. Its
      AuthenticationRequired is "{{ app_config.app.auth_required | default('Enabled') }}"
      as this deploy asked, but the running app answered anyway — anything on the
      LAN can read and rewrite this app's library. `docker inspect {{ instance }}`
      shows whether {{ _servarr_prefix }}__AUTH__REQUIRED reached the container.

# The question config.xml used to be asked, put to the running app: an app still
# on its setup screen reports no authentication method here, however healthy the
# port looks.
- name: Read the authentication the app reports for itself
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/config/host"
    headers:
      X-Api-Key: "{{ _servarr_effective_key }}"
    status_code: 200
  register: _servarr_host_config
  changed_when: false
  no_log: true

- name: Assert the app has chosen an authentication method
  ansible.builtin.assert:
    that:
      - (_servarr_host_config.json.authenticationMethod | default('') | length) > 0
      - (_servarr_host_config.json.authenticationMethod | default('') | lower) != 'none'
    fail_msg: >-
      {{ instance }} reports authenticationMethod
      "{{ _servarr_host_config.json.authenticationMethod | default('nothing') }}".
      An app in that state serves its first-run setup page on every UI path while
      the port answers normally, and the reverse proxy in front of it would be
      publishing a setup wizard. Check that
      {{ _servarr_prefix }}__AUTH__METHOD is a spelling this image honours.

# ── Point the app at its library ──────────────────────────────────────────────
# A Servarr app with no root folder accepts nothing: every add, every import and
# every search needs somewhere to put the result. Configuring it here is the
# difference between a deployed app and a usable one.
#
# The LIBRARY is the lab's and is only ever asserted — attach-host-mounts refuses
# to run against a library that is not already mounted on the node. This app's own
# subdirectory of it is a different thing: app.library_subpath is the platform's
# declaration of the one folder this instance owns, so creating it, and owning it,
# is this deploy finishing its own job rather than inventing storage on somebody's
# NFS. It is created empty, next to whatever else the library already holds.
#
# Ownership is the point, not existence. A Servarr app refuses a root folder it
# cannot write — `Folder '...' is not writable by user 'abc'` — so an unwritable
# directory fails the deploy just as surely as a missing one.
- name: Ensure this app owns its root folder
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_config.app.puid }}"
    group: "{{ app_config.app.pgid }}"
    mode: "0775"
  register: _servarr_root_check
  loop: "{{ _servarr_root_folders }}"
  failed_when: false

- name: Assert the root folder is usable before configuring it
  ansible.builtin.assert:
    that: not (item.failed | default(false))
    fail_msg: >-
      {{ instance }} cannot own {{ item.item }} ({{ item.msg | default('') }}).
      It is media_storage.library plus app.library_subpath. On an unprivileged
      stack host this is what an unmapped owner looks like: a directory whose
      host uid falls outside the guest's id range appears as nobody:nogroup and
      not even root inside the guest can chown it. Check that the library and
      everything under it belongs to media_storage.owner
      ({{ app_config.media_storage.owner.user | default('unset') }}) on the
      Proxmox node.
  loop: "{{ _servarr_root_check.results }}"
  loop_control:
    label: "{{ item.item }}"

# Lidarr and Readarr refuse a root folder that does not name a quality profile and
# a metadata profile, so the ids have to be read from the app that is about to be
# asked. The first of each is the app's own freshly-seeded default; nothing here
# creates or reconciles profiles, and an operator's own choice in the UI stands.
- name: Read the profiles a v1 root folder has to name
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/{{ item }}"
    headers:
      X-Api-Key: "{{ _servarr_effective_key }}"
    status_code: 200
  register: _servarr_profiles
  loop: [qualityprofile, metadataprofile]
  changed_when: false
  no_log: true
  when:
    - _servarr_root_folders | length > 0
    - _servarr_rootfolder_needs_profiles

- name: Assert the app seeded the profiles a root folder needs
  ansible.builtin.assert:
    that: item.json | default([]) | length > 0
    fail_msg: >-
      {{ instance }} reports no {{ item.item }}. A freshly started Lidarr or Readarr
      seeds its own defaults, so an empty list means the app came up without
      initialising its database — check the container's log before re-running.
  loop: "{{ _servarr_profiles.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when: _servarr_rootfolder_needs_profiles

- name: Resolve the root folder payload this app accepts
  ansible.builtin.set_fact:
    _servarr_rootfolder_extra: >-
      {{ {} if not _servarr_rootfolder_needs_profiles else
         {'defaultQualityProfileId':
            (_servarr_profiles.results[0].json | first).id,
          'defaultMetadataProfileId':
            (_servarr_profiles.results[1].json | first).id} }}
  when: _servarr_root_folders | length > 0

- name: Read the root folders the app already has
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/rootfolder"
    headers:
      X-Api-Key: "{{ _servarr_effective_key }}"
    status_code: 200
  register: _servarr_rootfolders
  changed_when: false
  no_log: true
  when: _servarr_root_folders | length > 0

# Added, never reconciled: an operator who adds a second root folder in the UI
# keeps it. This deploy owns the one it configures and nothing else — the same
# fire-and-forget rule the rest of the platform follows.
- name: Configure the root folder
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/{{ _servarr_api }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ _servarr_effective_key }}"
    body_format: json
    # A bare path for Radarr and Sonarr — exactly what they took before — plus the
    # name and profile ids only where the app validates them. Nothing extra is sent
    # to an app that never asked for it.
    body: >-
      {{ {'path': item}
         | combine({'name': item | basename} if _servarr_rootfolder_needs_profiles
                   else {})
         | combine(_servarr_rootfolder_extra | default({})) }}
    status_code: 201
  loop: "{{ _servarr_root_folders }}"
  when:
    - _servarr_root_folders | length > 0
    - item not in (_servarr_rootfolders.json | default([]) | map(attribute='path') | list)
  # The key is in the request headers, so the call cannot report itself. The
  # failure is re-raised below from the RESPONSE alone, which carries no
  # credential — a refusal here is a storage-permission answer worth reading.
  no_log: true
  register: _servarr_rootfolder_add
  failed_when: false

# Without this, `no_log` swallowed the reason and a deploy failed with nothing
# but "censored". Radarr answering `Folder '/mnt/data/media/movies' is not
# writable by user 'abc'` (execution 57, 2026-08-09) is the whole diagnosis, and
# it cost a hand-run curl against the container to read it. Only `status` and the
# decoded body are quoted; neither holds the API key.
- name: Report a refused root folder
  ansible.builtin.fail:
    msg: >-
      {{ instance }} refused the root folder {{ item.item }}
      (HTTP {{ item.status | default('no response') }}):
      {{ _servarr_rf_reason }}
      A Servarr app must be able to WRITE its root folder. On an unprivileged
      LXC the library is visible but owned by an unmapped host uid, so check
      that the mount's owner maps to app.puid/app.pgid inside the guest.
  vars:
    # A Servarr validation failure is a list of records; anything else answers
    # with an object or nothing at all.
    _servarr_rf_body: "{{ item.json | default('', true) }}"
    _servarr_rf_reason: >-
      {{ (_servarr_rf_body | map(attribute='errorMessage') | join('; '))
         if (_servarr_rf_body is sequence and _servarr_rf_body is not string
             and _servarr_rf_body is not mapping)
         else (_servarr_rf_body.message | default(_servarr_rf_body, true)) }}
  loop: "{{ _servarr_rootfolder_add.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - not (item.skipped | default(false))
    - item.status | default(0) != 201

# ── Store the credential ──────────────────────────────────────────────────────
# Written under the same canonical item name wire-media-stack.yml reads, so the
# stack wiring finds the key without the config.xml discovery pass. Stored after
# the app has proven the key works, never before.
- name: Store and verify the API key
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      api_key: "{{ _servarr_effective_key }}"
    vault_item_secret_fields: [api_key]

# ── Hand the endpoint back to the playbook ────────────────────────────────────
# config_path is the HOST path, not the container's /config: it is what
# wire-media-stack.yml slurps config.xml from when it falls back to discovery.
- name: Export the media registry entry to the playbook
  ansible.builtin.set_fact:
    servarr_media_kind: "{{ _servarr_kind }}"
    servarr_media_host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
    servarr_media_config_path: "{{ app_config.app.config_path }}"
