---
# restore-swap.yml replaced hook. Preserve the project's mounts and configuration,
# changing only the key overrides that would otherwise mask the restored config.xml.
- name: Servarr restore | Adopt the archived key in Compose
  ansible.builtin.replace:
    path: "{{ servarr_project_dir }}/docker-compose.yml"
    regexp: "(^\\s*- {{ app_config.app.media_kind | upper }}__(?:AUTH__)?APIKEY=).*$"
    replace: '\g<1>{{ _servarr_restored_key }}'
  no_log: true
