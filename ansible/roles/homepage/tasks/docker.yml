---
# Homepage on Docker on a stack host (hosting.method: docker). Included by main.yml.
- name: Homepage | Generate the dashboard configuration
  ansible.builtin.include_tasks: dashboard.yml

- name: Homepage | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/opt/{{ instance }}"
    - "/opt/{{ instance }}/config"

- name: Homepage | Write the generated configuration
  ansible.builtin.copy:
    content: "{{ item.content | to_nice_yaml(indent=2, width=120) }}"
    dest: "/opt/{{ instance }}/config/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { name: services.yaml, content: "{{ homepage_service_groups }}" }
    - { name: settings.yaml, content: "{{ homepage_settings }}" }
  register: _homepage_config_written

# The shared Compose deploy recreates the container when the Compose file or the generated
# configuration changed, in the same up that creates it, so a new install is never
# restarted mid first boot.
- name: Homepage | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "/opt/{{ instance }}"
    compose_project_mode: "0755"
    compose_recreate: "{{ _homepage_config_written.changed }}"
    compose_health:
      url: "http://127.0.0.1:{{ app_config.app.port }}/"
      headers:
        Host: "{{ homepage_fqdn }}"
