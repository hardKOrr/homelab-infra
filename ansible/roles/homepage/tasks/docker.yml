---
# Homepage on Docker on a stack host (hosting.method: docker). Included by main.yml.
- name: Homepage | Generate the dashboard configuration
  ansible.builtin.include_tasks: dashboard.yml

- name: Homepage | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/opt/{{ instance }}"
    - "/opt/{{ instance }}/config"

- name: Homepage | Write the generated configuration
  ansible.builtin.copy:
    content: "{{ item.content | to_nice_yaml(indent=2, width=120) }}"
    dest: "/opt/{{ instance }}/config/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { name: services.yaml, content: "{{ homepage_service_groups }}" }
    - { name: settings.yaml, content: "{{ homepage_settings }}" }
  notify: Restart homepage

- name: Homepage | Write the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ instance }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart homepage

- name: Homepage | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "/opt/{{ instance }}"
    policy: missing
  changed_when: false

- name: Homepage | Start the container
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ instance }}"
    state: present
    remove_orphans: true

- name: Homepage | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Homepage | Wait for the dashboard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_config.app.port }}/"
    headers:
      Host: "{{ homepage_fqdn }}"
    status_code: 200
  register: _homepage_health
  retries: 30
  delay: 5
  until: _homepage_health.status | default(0) == 200
  changed_when: false
