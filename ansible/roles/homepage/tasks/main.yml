---
# Homepage on a guest: Docker on a stack host, or native on its own LXC or VM. Stateless:
# the two configuration files are regenerated from topology facts on every run, so there is
# nothing to back up or restore.
- name: Homepage | Derive the published hostname
  ansible.builtin.set_fact:
    homepage_fqdn: >-
      {{ (app_config.routing.subdomain | default(instance, true)) }}.{{ homelabinfra_infra.domain }}

- name: Homepage | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: Homepage | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'
