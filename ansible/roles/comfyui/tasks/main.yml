---
# One storage tree and one health probe for every hosting method; docker.yml and
# native.yml install and start the service.
- name: ComfyUI | Assert the storage paths are inside the application storage root
  ansible.builtin.assert:
    that:
      - (app_config.app.models_path | regex_replace('/+$', '')) is match(
          ('^' ~ (app_config.app.storage_path | regex_replace('/+$', '') | regex_escape) ~ '(/|$)')
        )
      - (app_config.app.config_path | regex_replace('/+$', '')) is match(
          ('^' ~ (app_config.app.storage_path | regex_replace('/+$', '') | regex_escape) ~ '(/|$)')
        )
      - (app_config.app.custom_nodes_path | regex_replace('/+$', '')) is match(
          ('^' ~ (app_config.app.storage_path | regex_replace('/+$', '') | regex_escape) ~ '(/|$)')
        )
      - (app_config.app.input_path | regex_replace('/+$', '')) is match(
          ('^' ~ (app_config.app.storage_path | regex_replace('/+$', '') | regex_escape) ~ '(/|$)')
        )
      - (app_config.app.output_path | regex_replace('/+$', '')) is match(
          ('^' ~ (app_config.app.storage_path | regex_replace('/+$', '') | regex_escape) ~ '(/|$)')
        )
    fail_msg: >-
      ComfyUI storage paths must remain below app.storage_path so model files and
      configuration share one owned recovery unit.

- name: ComfyUI | Deploy the Docker service
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: ComfyUI | Deploy the native service
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'

- name: ComfyUI | Wait for the system stats endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/system_stats"
    follow_redirects: none
    status_code: [200, 302]
  register: _comfyui_health
  until: _comfyui_health.status | default(0) in [200, 302]
  retries: >-
    {{ comfyui_cpu_http_retries
       if app_config.app.accelerator | default('cuda') == 'cpu'
       else comfyui_http_retries }}
  delay: "{{ comfyui_http_delay }}"
  changed_when: false

- name: ComfyUI | Assert the health response includes system information
  ansible.builtin.assert:
    that:
      - >-
        _comfyui_health.status | int == 302 or
        (_comfyui_health.json is defined and _comfyui_health.json.system is defined)
    fail_msg: >-
      ComfyUI did not return its system information or the expected AI-Dock login redirect.
