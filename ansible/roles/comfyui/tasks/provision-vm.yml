---
# Provision ComfyUI's own VM (the default, standalone form): reuse the owned guest or
# clone a new one, then attach the dedicated GPU. Stack-hosted ComfyUI skips this file.
- name: Refresh inventory to get current Proxmox state
  ansible.builtin.meta: refresh_inventory

- name: Resolve the tagged or uniquely named owned ComfyUI VM
  ansible.builtin.include_tasks: ../../../tasks/proxmox/resolve-instance-guest.yml
  vars:
    resolve_guest_instance: "{{ instance }}"

- name: Record the resolved ComfyUI VM candidates
  ansible.builtin.set_fact:
    _comfyui_existing_hosts: "{{ resolve_guest_hosts }}"
    _comfyui_needs_identity_record: "{{ resolve_guest_needs_tag | bool }}"

- name: Resolve the existing ComfyUI VM node
  ansible.builtin.set_fact:
    _comfyui_existing_node: "{{ hostvars[_comfyui_existing_hosts[0]].proxmox_node | default('') }}"
  when: _comfyui_existing_hosts | length > 0

- name: Require the existing ComfyUI guest to be a VM with a known node
  ansible.builtin.assert:
    that:
      - hostvars[_comfyui_existing_hosts[0]].proxmox_vmtype | default('') == 'qemu'
      - _comfyui_existing_node | length > 0
    fail_msg: >-
      Existing ComfyUI guest must be a VM with a known Proxmox node. This deployment
      does not convert an existing guest in place.
  when: _comfyui_existing_hosts | length > 0

- name: Use the existing ComfyUI VM node for device operations
  ansible.builtin.set_fact:
    homelabinfra_config: >-
      {{ homelabinfra_config | combine({'proxmox': {'node': _comfyui_existing_node}}, recursive=True) }}
  when: _comfyui_existing_hosts | length > 0

- name: Add the existing VM to the deploy group
  ansible.builtin.add_host:
    name: "{{ _comfyui_existing_hosts[0] }}"
    groups: "deploy_{{ instance }}"
    ansible_host: >-
      {{ hostvars[_comfyui_existing_hosts[0]].ansible_host
         | default(hostvars[_comfyui_existing_hosts[0]].ansible_default_ipv4.address | default('')) }}
    ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
    proxmox_vmtype: qemu
    proxmox_node: "{{ _comfyui_existing_node }}"
    proxmox_name: "{{ hostvars[_comfyui_existing_hosts[0]].proxmox_name | default(instance, true) }}"
    proxmox_vmid: "{{ hostvars[_comfyui_existing_hosts[0]].proxmox_vmid }}"
    app_config: "{{ app_config }}"
    homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
  when: _comfyui_existing_hosts | length > 0
  changed_when: false

- name: Ensure the existing VM is running
  ansible.builtin.include_tasks: ../../../tasks/proxmox/ensure-guest-running.yml
  vars:
    ensure_guest_host: "{{ _comfyui_existing_hosts[0] }}"
  when: _comfyui_existing_hosts | length > 0

- name: Set the existing VM guest name
  ansible.builtin.set_fact:
    _comfyui_guest: "{{ _comfyui_existing_hosts[0] }}"
  when: _comfyui_existing_hosts | length > 0

- name: Provision a new ComfyUI VM
  when: _comfyui_existing_hosts | length == 0
  block:
    - name: Resolve the ComfyUI network
      ansible.builtin.include_tasks: ../../../tasks/network/resolve-network.yml
      vars:
        resolve_network_app: comfyui
        resolve_network_estate: "{{ app_config.routing.estate | default('', true) }}"
        resolve_network_requested: "{{ app_config.proxmox.network | default('', true) }}"

    - name: Set the ComfyUI VM identity and ownership tags
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config | combine({'proxmox': {'vm':
               app_config.proxmox.vm | combine({
                 'name': instance,
                 'tags': ((app_config.proxmox.vm.tags | default(['_+lab', '_-debian']))
                          + ['_' ~ instance]) | unique
               }, recursive=True)
             }}, recursive=True) }}

    - name: Ensure the Debian cloud-init template exists
      ansible.builtin.include_tasks: ../../../tasks/proxmox/ensure-cloud-template.yml
      vars:
        proxmox_placement_class: >-
          {{ 'gpu_vm' if app_config.app.accelerator | default('cuda') == 'cuda'
             else 'floating_vm' }}
        proxmox_placement_device: "{{ app_config.app.gpu_device }}"
        cloud_template_vmid: "{{ app_config.proxmox.cloud_template.vmid | default('', true) }}"
        cloud_template_name: "{{ app_config.proxmox.cloud_template.name }}"
        cloud_template_image_url: "{{ app_config.proxmox.cloud_template.image_url }}"
        cloud_template_storage: >-
          {{ app_config.proxmox.cloud_template.storage
             | default(homelabinfra_config.proxmox.storage, true) }}
        cloud_template_bridge: "{{ network_effective.bridge | default('vmbr0') }}"

    - name: Generate the ComfyUI VM address
      ansible.builtin.import_tasks: ../../../tasks/network/generate-ip.yml
      vars:
        network_name: "{{ app_config.proxmox.network | default('', true) }}"
        pool_name: "{{ app_config.proxmox.pool | default('') }}"
        requested_ip_address: "{{ app_config.proxmox.ip_address | default('') }}"

    - name: Set the VM address in the platform config
      ansible.builtin.set_fact:
        homelabinfra_config: >-
          {{ homelabinfra_config | combine({
            'proxmox': {'vm': {'ip_address': homelabinfra_instance.network.ip_address}}
          }, recursive=True) }}

    - name: Derive the ComfyUI VMID
      ansible.builtin.import_tasks: ../../../tasks/proxmox/ip-to-vmid.yml

    - name: Clone the ComfyUI VM from the cloud-init template
      ansible.builtin.include_tasks: ../../../tasks/proxmox/vm-clone.yml
      vars:
        proxmox_placement_class: >-
          {{ 'gpu_vm' if app_config.app.accelerator | default('cuda') == 'cuda'
             else 'floating_vm' }}
        proxmox_placement_device: "{{ app_config.app.gpu_device }}"
        proxmox_placement_node: "{{ _guest_placement.node }}"

    - name: Add the new VM to the deploy group
      ansible.builtin.add_host:
        name: "{{ instance }}"
        groups: "deploy_{{ instance }}"
        ansible_host: "{{ homelabinfra_instance.vm_ansible_host }}"
        ansible_user: "{{ homelabinfra_config.ansible.ssh_user }}"
        proxmox_vmtype: qemu
        proxmox_node: "{{ homelabinfra_config.proxmox.node }}"
        proxmox_vmid: "{{ homelabinfra_instance.vm.vmid }}"
        app_config: "{{ app_config }}"
        homelabinfra_infra: "{{ homelabinfra_infra | default({}) }}"
      changed_when: false

    - name: Set the new VM guest name
      ansible.builtin.set_fact:
        _comfyui_guest: "{{ instance }}"

- name: Record ComfyUI VM identity before application deployment
  ansible.builtin.include_tasks: ../../../tasks/proxmox/record-app-on-guest.yml
  vars:
    record_guest_kind: docker
    record_guest_require_success: true
  when: _comfyui_needs_identity_record

# PCIe passthrough is not hotplugged. The shared task preflights the exact declaration,
# ownership tag, node presence, and exclusive conflict before qm set, and restores a
# previously running VM if assignment fails.
- name: Attach the named ComfyUI PCI device
  ansible.builtin.include_tasks: ../../../tasks/proxmox/attach-pci-passthrough.yml
  vars:
    pci_passthrough_guest: "{{ _comfyui_guest }}"
    pci_passthrough_device:
      id: >-
        {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].identifiers
           | select('match', '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}[.][0-7]$')
           | list | first }}
      mapping: >-
        {{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pci_mapping
           | default(app_config.app.gpu_device) }}
      pcie: "{{ homelabinfra_config.proxmox.devices[app_config.app.gpu_device].pcie | default(false) | bool }}"
  when: app_config.app.accelerator | default('cuda') == 'cuda'
