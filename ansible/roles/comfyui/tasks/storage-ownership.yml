---
# Compose mounts each of these into the container, where ComfyUI runs unprivileged; the
# native service reads the same directories as its own account.
- name: ComfyUI storage | Give the mounted directories to the app's runtime user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ comfyui_owner_uid }}"
    group: "{{ comfyui_owner_gid }}"
    mode: "u=rwX,g=rX,o="
    recurse: true
  loop:
    - "{{ app_config.app.models_path }}"
    - "{{ app_config.app.config_path }}"
    - "{{ app_config.app.custom_nodes_path }}"
    - "{{ app_config.app.input_path }}"
    - "{{ app_config.app.output_path }}"
