---
# The storage tree contains models, custom nodes, workflows, inputs, outputs, and the
# ComfyUI user configuration. Stop the service before archiving it so model metadata and
# the user database are captured as one application-consistent recovery unit.
- name: ComfyUI backup | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      ComfyUI needs its application-consistent backup contract and a configured PBS before
      an on-demand backup can run.

- name: ComfyUI backup | Require the model/config storage tree
  ansible.builtin.stat:
    path: "{{ app_config.app.storage_path }}"
  register: _comfyui_backup_storage
  changed_when: false

- name: ComfyUI backup | Refuse an incomplete recovery point
  ansible.builtin.assert:
    that:
      - _comfyui_backup_storage.stat.exists
      - _comfyui_backup_storage.stat.isdir
    fail_msg: >-
      ComfyUI storage path {{ app_config.app.storage_path }} is missing; refusing to create
      a backup that would omit model storage and configuration.

- name: ComfyUI backup | Quiesce ComfyUI and archive models and configuration to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ comfyui_project_dir }}"
    pbs_client_stop_services: [comfyui]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.storage_path }}"

- name: ComfyUI backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
