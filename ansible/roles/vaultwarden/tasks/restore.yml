---
# Restore the complete data directory from one PBS point. The replacement is staged
# beside the live path, and the original remains there until the restored vault passes
# health checks. Any failure after the move puts the original directory back.
- name: Vaultwarden restore | Resolve source and target identities
  ansible.builtin.set_fact:
    _vw_restore_data_path: "{{ app_config.app.data_path | default('') }}"
    _vw_restore_service_name: "{{ app_config.app.service_name | default(vaultwarden_service_name) }}"
    _vw_restore_source_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _vw_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}
    _vw_restore_snapshot: "{{ restore_snapshot | default('') }}"
    _application_restore_complete: false
    _vw_restore_old_data_moved: false
    _vw_restore_replacement_installed: false
    _vw_restore_rollback_complete: false

- name: Vaultwarden restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _vw_restore_data_path is match('^/[^/].*')
      - _vw_restore_data_path != '/'
      - _vw_restore_source_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - _vw_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_overwrite is defined
      - (_vw_restore_snapshot | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Vaultwarden restore needs its application-consistent contract, safe source and target
      backup ids, and a selected recovery point when overwrite=true.

- name: Vaultwarden restore | Validate the selected source group
  ansible.builtin.assert:
    that:
      - _vw_restore_snapshot.startswith('host/' ~ _vw_restore_source_backup_id ~ '/')
      - _vw_restore_snapshot | length > ('host/' ~ _vw_restore_source_backup_id ~ '/') | length
    fail_msg: >-
      The selected Vaultwarden recovery point must belong to
      host/{{ _vw_restore_source_backup_id }}/.
  when: _vw_restore_snapshot | length > 0

- name: Vaultwarden restore | Validate the independent pre-restore group
  ansible.builtin.assert:
    that:
      - restore_pre_restore_point is defined
      - restore_pre_restore_point.startswith('host/' ~ _vw_restore_target_backup_id ~ '/')
      - restore_pre_restore_point != _vw_restore_snapshot
      - restore_pre_restore_point | length > ('host/' ~ _vw_restore_target_backup_id ~ '/') | length
    fail_msg: >-
      Existing-target Vaultwarden restore needs an independent pre-restore point in
      host/{{ _vw_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Vaultwarden restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Vaultwarden restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Vaultwarden. Deploy PBS before listing or restoring
      application data.

- name: Vaultwarden restore | Require the installed PBS client
  ansible.builtin.stat:
    path: /usr/bin/proxmox-backup-client
  register: _vw_restore_client
  changed_when: false

- name: Vaultwarden restore | Require the client binary
  ansible.builtin.assert:
    that: _vw_restore_client.stat.exists and _vw_restore_client.stat.isreg
    fail_msg: >-
      Vaultwarden has no installed PBS client. Deploy the instance with the current
      Vaultwarden role before requesting an application restore.

- name: Vaultwarden restore | List source recovery points
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - list
      - "host/{{ _vw_restore_source_backup_id }}"
      - --output-format
      - text
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _vw_restore_snapshots
  failed_when: false
  changed_when: false
  no_log: true

- name: Vaultwarden restore | Report a failed snapshot listing
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _vw_restore_snapshots }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Vaultwarden restore | PBS snapshot listing failed

- name: Vaultwarden restore | Show source recovery points in plan mode
  ansible.builtin.debug:
    msg: "PBS recovery points for host/{{ _vw_restore_source_backup_id }}:\n{{ _vw_restore_snapshots.stdout }}"
  when:
    - not (restore_overwrite | bool)
    - _vw_restore_snapshot | length == 0

- name: Vaultwarden restore | Verify the selected archive
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _vw_restore_snapshot }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _vw_restore_source_files
  failed_when: false
  changed_when: false
  no_log: true
  when: _vw_restore_snapshot | length > 0

- name: Vaultwarden restore | Report an unavailable source archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _vw_restore_source_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Vaultwarden restore | selected PBS point is unavailable
  when: _vw_restore_snapshot | length > 0

- name: Vaultwarden restore | Require the full data archive
  ansible.builtin.assert:
    that: "'data.pxar' in _vw_restore_source_files.stdout"
    fail_msg: >-
      Recovery point {{ _vw_restore_snapshot }} has no data.pxar archive for Vaultwarden.
  when: _vw_restore_snapshot | length > 0

- name: Vaultwarden restore | Verify the independent pre-restore point
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ restore_pre_restore_point }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _vw_restore_prepoint_files
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Vaultwarden restore | Report an unavailable pre-restore archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _vw_restore_prepoint_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Vaultwarden restore | pre-restore point is unavailable
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Vaultwarden restore | Require the independent safety archive
  ansible.builtin.assert:
    that: "'data.pxar' in _vw_restore_prepoint_files.stdout"
    fail_msg: >-
      Pre-restore point {{ restore_pre_restore_point }} has no data.pxar archive for the
      target Vaultwarden instance.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Vaultwarden restore | Explain the selected read-only plan
  ansible.builtin.debug:
    msg: >-
      No Vaultwarden data was changed. Re-run with overwrite=true and
      pre_restore_point=<independent target recovery point> to replace
      {{ _vw_restore_data_path }} from {{ _vw_restore_snapshot }}.
  when:
    - not (restore_overwrite | bool)
    - _vw_restore_snapshot | length > 0

- name: Vaultwarden restore | Check the target data directory
  ansible.builtin.stat:
    path: "{{ _vw_restore_data_path }}"
  register: _vw_restore_target_data
  changed_when: false
  when: restore_overwrite | bool

- name: Vaultwarden restore | Refuse an unsafe target data path
  ansible.builtin.assert:
    that:
      - not _vw_restore_target_data.stat.exists or _vw_restore_target_data.stat.isdir
      - not (_vw_restore_target_data.stat.islnk | default(false))
    fail_msg: >-
      Vaultwarden restore target {{ _vw_restore_data_path }} is not a real directory.
  when: restore_overwrite | bool

- name: Vaultwarden restore | Create private staging and rollback directories
  ansible.builtin.tempfile:
    state: directory
    path: "{{ _vw_restore_data_path | dirname }}"
    prefix: .vaultwarden-restore-
  register: _vw_restore_stage
  changed_when: true
  when: restore_overwrite | bool

- name: Vaultwarden restore | Prepare the staging data directory
  ansible.builtin.file:
    path: "{{ _vw_restore_stage.path }}/data"
    state: directory
    mode: "0700"
  when: restore_overwrite | bool

- name: Vaultwarden restore | Replace and verify the data directory
  when: restore_overwrite | bool
  block:
    - name: Vaultwarden restore | Stop only this instance
      ansible.builtin.systemd_service:
        name: "{{ _vw_restore_service_name }}"
        state: stopped

    - name: Vaultwarden restore | Extract the selected PBS archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _vw_restore_snapshot }}"
          - data.pxar
          - "{{ _vw_restore_stage.path }}/data"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _vw_restore_extract
      failed_when: false
      changed_when: true
      no_log: true

    - name: Vaultwarden restore | Report an invalid or unreadable archive
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _vw_restore_extract }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: Vaultwarden restore | PBS archive extraction failed

    - name: Vaultwarden restore | Check the staged SQLite database
      ansible.builtin.stat:
        path: "{{ _vw_restore_stage.path }}/data/db.sqlite3"
      register: _vw_restore_staged_database
      changed_when: false

    - name: Vaultwarden restore | Require a complete staged vault
      ansible.builtin.assert:
        that:
          - _vw_restore_staged_database.stat.exists
          - _vw_restore_staged_database.stat.isreg
        fail_msg: >-
          The selected Vaultwarden archive did not restore db.sqlite3; the current data
          directory has not been replaced.

    - name: Vaultwarden restore | Create private rollback space beside the data directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ _vw_restore_data_path | dirname }}"
        prefix: .vaultwarden-pre-restore-
      register: _vw_restore_previous
      changed_when: true

    - name: Vaultwarden restore | Move the original data aside on the same filesystem
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _vw_restore_data_path }}"
          - "{{ _vw_restore_previous.path }}/data"
      register: _vw_restore_move_original
      changed_when: _vw_restore_move_original.rc == 0
      when: _vw_restore_target_data.stat.exists

    - name: Vaultwarden restore | Record the original data move
      ansible.builtin.set_fact:
        _vw_restore_old_data_moved: true
      when: _vw_restore_target_data.stat.exists

    - name: Vaultwarden restore | Move the staged data into place
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _vw_restore_stage.path }}/data"
          - "{{ _vw_restore_data_path }}"
      register: _vw_restore_install
      changed_when: _vw_restore_install.rc == 0

    - name: Vaultwarden restore | Record the replacement installation
      ansible.builtin.set_fact:
        _vw_restore_replacement_installed: true

    - name: Vaultwarden restore | Restore system-user ownership
      ansible.builtin.command:
        argv:
          - chown
          - -R
          - "{{ vaultwarden_user }}:{{ vaultwarden_user }}"
          - "{{ _vw_restore_data_path }}"
      changed_when: true

    - name: Vaultwarden restore | Set the data-directory permissions
      ansible.builtin.file:
        path: "{{ _vw_restore_data_path }}"
        state: directory
        owner: "{{ vaultwarden_user }}"
        group: "{{ vaultwarden_user }}"
        mode: "0750"

    - name: Vaultwarden restore | Start only this instance
      ansible.builtin.systemd_service:
        name: "{{ _vw_restore_service_name }}"
        state: started

    - name: Vaultwarden restore | Wait for the restored API
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/alive"
        status_code: 200
      register: _vw_restore_health
      until: _vw_restore_health.status | default(0) == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Vaultwarden restore | Verify the restored web vault
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/"
        status_code: 200
        return_content: true
      register: _vw_restore_web_vault
      failed_when: >-
        _vw_restore_web_vault.status | default(0) != 200
        or 'Vaultwarden Web' not in (_vw_restore_web_vault.content | default(''))
      changed_when: false

    - name: Vaultwarden restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Vaultwarden restore | Stop the service after a failed replacement
      ansible.builtin.systemd_service:
        name: "{{ _vw_restore_service_name }}"
        state: stopped

    - name: Vaultwarden restore | Remove the failed replacement data
      ansible.builtin.file:
        path: "{{ _vw_restore_data_path }}"
        state: absent
      when: _vw_restore_replacement_installed | bool

    - name: Vaultwarden restore | Put the original data back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _vw_restore_previous.path }}/data"
          - "{{ _vw_restore_data_path }}"
      changed_when: true
      when: _vw_restore_old_data_moved | bool

    - name: Vaultwarden restore | Mark the rollback complete
      ansible.builtin.set_fact:
        _vw_restore_rollback_complete: true

    - name: Vaultwarden restore | Restart the service after a successful rollback
      ansible.builtin.systemd_service:
        name: "{{ _vw_restore_service_name }}"
        state: started
      when: _vw_restore_rollback_complete | bool

    - name: Vaultwarden restore | Report the failed restore
      ansible.builtin.fail:
        msg: >-
          Vaultwarden restore failed. Rollback completed and the service was restarted.
          If rollback itself failed, inspect the retained directory beside
          {{ _vw_restore_data_path }} before retrying.
  always:
    - name: Vaultwarden restore | Remove rollback data after success or rollback
      ansible.builtin.file:
        path: "{{ _vw_restore_previous.path }}"
        state: absent
      when:
        - _vw_restore_previous.path is defined
        - >-
          (_application_restore_complete | bool)
          or (_vw_restore_rollback_complete | bool)
          or not (_vw_restore_old_data_moved | bool)

    - name: Vaultwarden restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _vw_restore_stage.path }}"
        state: absent
      when: _vw_restore_stage.path is defined
