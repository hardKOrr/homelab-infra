---
# Restore the complete data directory from one PBS point through the shared swap. The
# original stays beside the live path until the restored vault passes its health checks.
- name: Vaultwarden restore | Resolve the target identity
  ansible.builtin.set_fact:
    _vw_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}

- name: Vaultwarden restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - app_config.app.data_path | default('') is match('^/[^/].*')
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Vaultwarden restore needs its application-consistent contract, an absolute data path,
      and a selected recovery point when overwrite=true.

- name: Vaultwarden restore | Validate the independent pre-restore group
  ansible.builtin.assert:
    that:
      - restore_pre_restore_point is defined
      - restore_pre_restore_point.startswith('host/' ~ _vw_restore_target_backup_id ~ '/')
      - restore_pre_restore_point != restore_snapshot
      - restore_pre_restore_point | length > ('host/' ~ _vw_restore_target_backup_id ~ '/') | length
    fail_msg: >-
      Existing-target Vaultwarden restore needs an independent pre-restore point in
      host/{{ _vw_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Vaultwarden restore | Preview or replace the data directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: native
    recovery_swap_pre_restore_backup_id: "{{ _vw_restore_target_backup_id }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.data_path }}"
        owner: "{{ vaultwarden_user }}"
        group: "{{ vaultwarden_user }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ app_config.app.service_name | default(vaultwarden_service_name) }}"]
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/alive"
    recovery_swap_health_retries: 30
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"
