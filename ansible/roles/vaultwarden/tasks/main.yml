---
# vaultwarden role — native LXC deployment (static binary + web-vault).
# Called from Play 2 of playbooks/apps/vaultwarden.yml. Target: dedicated LXC.
#
# Install channel: upstream publishes NO prebuilt binary assets on GitHub releases
# (source archives only) — the container image is the canonical binary channel.
# vaultwarden-fetch extracts the statically linked musl binary and the matching
# web-vault from the official Alpine image via skopeo. No container runtime is
# installed; skopeo is just a downloader. See docs/meta/400-app-vaultwarden/notes.md.
#
# Admin token (spec: docs/specs/secrets-handling.md — server-control credentials
# remain outside the item vault to avoid a recovery circle):
#   source order: VAULTWARDEN_ADMIN_TOKEN env var
#              -> homelabinfra_config.infrastructure.vaultwarden.admin_token
#              -> the controller-side token sink (tasks/vaultwarden/token-sink.yml)
#              -> hash already present on the guest (token continuity across re-runs)
#              -> first bootstrap: generate and WRITE TO THE TEMPORARY SEED SINK
#                 before the human account-enrollment ceremony (slice 013).
# Only the hash ever touches the guest filesystem; the plaintext goes to the sink on
# the controller and nowhere else. A failed sink write stops before Vaultwarden is
# configured, so a generated token is never exposed in a job log or silently lost.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)

# ── Install ───────────────────────────────────────────────────────────────────
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - skopeo # image download for vaultwarden-fetch
      - jq # manifest parsing in vaultwarden-fetch
      - argon2 # admin token hashing
      - curl # lab-update-check
      - ca-certificates
    state: present
    update_cache: true

- name: Check installed vaultwarden version
  ansible.builtin.command:
    cmd: "{{ app_config['update'].binary_path }} --version"
  register: _vw_installed
  failed_when: false
  changed_when: false

- name: Get latest release info
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ app_config['update'].github_repo }}/releases/latest"
    return_content: true
  register: _release
  changed_when: false

- name: Set version facts
  ansible.builtin.set_fact:
    _installed_version: >-
      {{ (_vw_installed.stdout | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
         if _vw_installed.rc == 0 else 'none' }}
    _latest_version: "{{ _release.json.tag_name | regex_replace('^v', '') }}"

- name: Install vaultwarden-fetch
  ansible.builtin.copy:
    src: vaultwarden-fetch
    dest: /usr/local/bin/vaultwarden-fetch
    mode: "0755"

- name: Fetch vaultwarden {{ _latest_version }} (binary + web-vault)
  ansible.builtin.command:
    cmd: "/usr/local/bin/vaultwarden-fetch {{ _latest_version }}"
  when: _installed_version != _latest_version
  changed_when: true
  notify: Restart vaultwarden

# ── User and directories ──────────────────────────────────────────────────────
- name: Create vaultwarden system user
  ansible.builtin.user:
    name: "{{ vaultwarden_user }}"
    system: true
    home: "{{ app_config.app.data_path | dirname }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "{{ vaultwarden_user }}"
    group: "{{ vaultwarden_user }}"
    mode: "0750"

# ── Admin token ───────────────────────────────────────────────────────────────
- name: Read current environment file (token continuity across re-runs)
  ansible.builtin.slurp:
    src: "{{ vaultwarden_env_file }}"
  register: _vw_env_current
  failed_when: false
  no_log: true

- name: Extract existing admin token hash
  ansible.builtin.set_fact:
    _existing_admin_hash: >-
      {{ ((_vw_env_current.content | b64decode).splitlines()
          | select('match', '^ADMIN_TOKEN=')
          | map('regex_replace', '^ADMIN_TOKEN=', '')
          | first | default(''))
         if _vw_env_current.content is defined else '' }}
  no_log: true

# role_path anchors config/ deterministically. playbook_dir would not: it is
# ansible/playbooks for a bootstrap run and ansible/playbooks/apps for a standalone
# `ansible-playbook playbooks/apps/vaultwarden.yml`.
- name: Resolve the controller-side token sink
  ansible.builtin.import_tasks: ../../../tasks/vaultwarden/token-sink.yml
  vars:
    vaultwarden_token_config_dir: "{{ role_path }}/../../../config"

- name: Resolve configured admin token (env var, then config file, then the sink)
  ansible.builtin.set_fact:
    _admin_token_plain: >-
      {{ lookup('env', 'VAULTWARDEN_ADMIN_TOKEN')
         | default(homelabinfra_config.infrastructure.vaultwarden.admin_token
                   | default(''), true)
         | default(vaultwarden_token_stored, true) }}
  no_log: true

- name: Generate admin token (first bootstrap only)
  ansible.builtin.set_fact:
    _admin_token_plain: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
    _admin_token_generated: true
  when:
    - _admin_token_plain | length == 0
    - _existing_admin_hash | length == 0
  no_log: true

# ── Persist the generated token (slice 013) ───────────────────────────────────
# This is what collapses the two-pass bootstrap. The token is written to the
# controller, not the guest, because the controller is what needs to read it back:
# the bootstrap gate two plays later, and every later job through lab-run.sh.
#
# Writes only on the run that GENERATED the token. A token supplied from the env or
# the config file already has a durable home and must not be copied into a second one.
- name: Ensure the token sink directory exists
  ansible.builtin.file:
    path: "{{ vaultwarden_token_sink | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  failed_when: false
  when: _admin_token_generated | default(false)

- name: Write the admin token to the sink
  ansible.builtin.copy:
    dest: "{{ vaultwarden_token_sink }}"
    mode: "0600"
    content: |
      # Vaultwarden admin token, written by roles/vaultwarden on first deploy.
      # Sourced by ansible/scripts/lab-run.sh into every job's environment.
      # This is the platform's durable copy — back it up, or lose /admin access.
      VAULTWARDEN_ADMIN_TOKEN={{ _admin_token_plain }}
  delegate_to: localhost
  become: false
  register: _vw_sink_write
  # Preserve the module result long enough to emit a secret-free actionable failure.
  ignore_errors: true  # noqa: ignore-errors
  no_log: true
  when: _admin_token_generated | default(false)

- name: Report where the admin token was stored
  ansible.builtin.debug:
    msg:
      - "Vaultwarden admin token generated and stored at:"
      - "  {{ vaultwarden_token_sink }}"
      - "Bootstrap reads it from there — no paste step, no re-run."
      - "Only its argon2id hash is on the guest. Back this file up."
  when:
    - _admin_token_generated | default(false)
    - not (_vw_sink_write.failed | default(true))

- name: Stop before deployment when the generated token cannot be persisted
  ansible.builtin.assert:
    that:
      - not (_vw_sink_write.failed | default(true))
    fail_msg: >-
      Vaultwarden was not configured because its generated admin token could not be
      written to the controller-side recovery sink. Correct permissions for
      {{ vaultwarden_token_sink }} and retry; no secret was printed or installed.
  when:
    - _admin_token_generated | default(false)
  no_log: false

# Deterministic salt (derived from the token itself) keeps the PHC string stable
# across runs, so the env template stays idempotent — a random salt would rewrite
# the file and bounce the service on every deploy.
- name: Hash admin token (argon2id, OWASP parameters)
  ansible.builtin.shell: >-
    set -o pipefail;
    salt="$(printf '%s' "$VW_TOKEN" | sha256sum | cut -c1-32)";
    printf '%s' "$VW_TOKEN" | argon2 "$salt" -id -e -m 16 -t 3 -p 4
  args:
    executable: /bin/bash
  environment:
    VW_TOKEN: "{{ _admin_token_plain }}"
  register: _argon2
  changed_when: false
  no_log: true
  when: _admin_token_plain | length > 0

- name: Select admin token hash for the environment file
  ansible.builtin.set_fact:
    _admin_token_hash: >-
      {{ (_argon2.stdout | trim)
         if _admin_token_plain | length > 0 else _existing_admin_hash }}
  no_log: true

# ── Configure ─────────────────────────────────────────────────────────────────
- name: Write environment file
  ansible.builtin.template:
    src: vaultwarden.env.j2
    dest: "{{ vaultwarden_env_file }}"
    owner: root
    group: "{{ vaultwarden_user }}"
    mode: "0640"
  no_log: true
  notify: Restart vaultwarden

- name: Write systemd unit
  ansible.builtin.template:
    src: vaultwarden.service.j2
    dest: "/etc/systemd/system/{{ vaultwarden_service_name }}.service"
    mode: "0644"
  notify: Restart vaultwarden

# ── Service ───────────────────────────────────────────────────────────────────
- name: Enable and start vaultwarden service
  ansible.builtin.systemd:
    name: "{{ vaultwarden_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before health check
  ansible.builtin.meta: flush_handlers

- name: Wait for vaultwarden to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/alive"
    status_code: 200
  register: _health
  until: _health.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Prove the instance is usable, not merely alive ────────────────────────────
# /alive answers from the API process alone. It is 200 on an instance whose
# web-vault extraction failed, and on one still running the previous binary under
# the environment file this run replaced — both indistinguishable from a working
# server to a liveness check, and both leave a human unable to use the vault.
# See "A deploy must assert usability, not liveness" in docs/meta/LESSONS.md.
#
# Verified live against 1.37.1: an unmatched path returns 404, so a 200 on / is a
# real signal and not the catch-all route that made Uptime Kuma look healthy.
- name: Verify the web vault is served
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: 200
    return_content: true
  register: _vw_web_vault
  failed_when: >-
    _vw_web_vault.status | default(0) != 200
    or 'Vaultwarden Web' not in (_vw_web_vault.content | default(''))
  changed_when: false

- name: Read the running server configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/config"
    status_code: 200
    return_content: true
  register: _vw_api_config
  changed_when: false

# `version` here is the bundled WEB-VAULT version (2026.6.0 while the server binary
# reports 1.37.1) — it is not the server version and must never be compared with
# _latest_version. Its presence proves the API layer serves JSON, which /alive alone
# does not distinguish from a server that lost its web vault.
- name: Assert the API layer is serving
  ansible.builtin.assert:
    that: _vw_api_config.json.version | default('') | length > 0
    fail_msg: >-
      Vaultwarden answered /alive but /api/config carries no version. The API
      layer is not serving; check `journalctl -u {{ vaultwarden_service_name }}`
      on the guest.

# environment.vault is DOMAIN as the RUNNING process read it, so this compares the
# environment file this run wrote against the one the process actually loaded — the
# "my change had no effect" class that a restart-less deploy produces silently.
- name: Assert the running server loaded this deploy's domain
  ansible.builtin.assert:
    that: _vw_api_config.json.environment.vault | default('') == _vw_expected_domain
    fail_msg: >-
      Vaultwarden is serving DOMAIN
      '{{ _vw_api_config.json.environment.vault | default('') }}', but this deploy
      configured '{{ _vw_expected_domain }}'. The running process is still on an
      older environment file — restart {{ vaultwarden_service_name }} on the guest.
  vars:
    _vw_expected_domain: "https://{{ instance }}.{{ homelabinfra_infra.domain | default('') }}"
  when: homelabinfra_infra.domain is defined

# ── Lab maintenance scripts ───────────────────────────────────────────────────
- name: Install lab maintenance scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - lab-update-check
    - lab-restart-app
    - lab-tail-applog

# ── Record installed version ──────────────────────────────────────────────────
# Local fact file so check-native-updates.yml / status.yml can read the version
# without executing the binary.
- name: Ensure facts.d directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Record installed version
  ansible.builtin.copy:
    content: '{"version": "{{ _latest_version }}"}'
    dest: /etc/ansible/facts.d/vaultwarden.fact
    mode: "0644"
