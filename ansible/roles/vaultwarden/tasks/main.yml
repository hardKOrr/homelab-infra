---
# vaultwarden role — native LXC deployment (static binary + web-vault), or the official
# image on Docker (hosting.method: docker, docker.yml).
# Called from Play 2 of playbooks/apps/vaultwarden.yml. Target: dedicated LXC.
#
# Install channel: upstream publishes NO prebuilt binary assets on GitHub releases
# (source archives only) — the container image is the canonical binary channel.
# vaultwarden-fetch extracts the statically linked musl binary and the matching
# web-vault from the official Alpine image via skopeo. No container runtime is
# installed; skopeo is just a downloader. See https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/done/400-app-vaultwarden/notes.md.
#
# Admin token (server-control credentials remain outside the item vault to avoid
# a recovery circle):
#   source order: VAULTWARDEN_ADMIN_TOKEN env var
#              -> homelabinfra_config.infrastructure.vaultwarden.admin_token
#              -> the controller-side token sink (tasks/vaultwarden/token-sink.yml)
#              -> hash already present on the guest (token continuity across re-runs)
#              -> first bootstrap: generate and WRITE TO THE TEMPORARY SEED SINK
#                 before Vaultwarden Enrollment registers the accounts.
# Only the hash ever touches the guest filesystem; the plaintext goes to the sink on
# the controller and nowhere else. A failed sink write stops before Vaultwarden is
# configured, so a generated token is never exposed in a job log or silently lost.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)


- name: Install the pinned PBS client when this lab declares application backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0


# Common dependencies: argon2 hashes the admin token on either method.
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - argon2 # admin token hashing
      - curl # lab-update-check
      - ca-certificates
    state: present
    update_cache: true

- name: Resolve the admin token
  ansible.builtin.include_tasks: token.yml

- name: Deploy Vaultwarden on Docker
  ansible.builtin.include_tasks: docker.yml
  when: vaultwarden_docker | bool

- name: Deploy Vaultwarden natively
  ansible.builtin.include_tasks: native.yml
  when: not (vaultwarden_docker | bool)

- name: Verify the web vault and API
  ansible.builtin.include_tasks: verify.yml

- name: Record the native install
  ansible.builtin.include_tasks: native-record.yml
  when: not (vaultwarden_docker | bool)
