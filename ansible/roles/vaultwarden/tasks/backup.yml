---
# Capture the complete Vaultwarden data directory while its one systemd service is
# stopped. This keeps SQLite, encryption keys, attachments, sends and config.json in one
# application-consistent PBS recovery point.
- name: Vaultwarden backup | Resolve the instance paths and recovery identity
  ansible.builtin.set_fact:
    _vw_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _vw_backup_service_name: "{{ app_config.app.service_name | default(vaultwarden_service_name) }}"
    _vw_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: Vaultwarden backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _vw_backup_data_path is match('^/[^/].*')
      - _vw_backup_data_path != '/'
      - _vw_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Vaultwarden backup needs its application-consistent contract, a non-root data path,
      a safe backup id and a configured PBS target.

- name: Vaultwarden backup | Check the complete data directory
  ansible.builtin.stat:
    path: "{{ _vw_backup_data_path }}"
  register: _vw_backup_data
  changed_when: false

- name: Vaultwarden backup | Check the SQLite database
  ansible.builtin.stat:
    path: "{{ _vw_backup_data_path }}/db.sqlite3"
  register: _vw_backup_database
  changed_when: false

- name: Vaultwarden backup | Require a real data directory and SQLite database
  ansible.builtin.assert:
    that:
      - _vw_backup_data.stat.exists
      - _vw_backup_data.stat.isdir
      - not _vw_backup_data.stat.islnk
      - _vw_backup_database.stat.exists
      - _vw_backup_database.stat.isreg
    fail_msg: >-
      Vaultwarden data path {{ _vw_backup_data_path }} is missing, linked or has no
      db.sqlite3; refusing to create an incomplete application recovery point.

# The shared backup stops the service for the upload and restarts it when it was running.
- name: Vaultwarden backup | Quiesce and archive the application
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: native
    pbs_client_backup_id: "{{ _vw_backup_id }}"
    pbs_client_stop_services: ["{{ _vw_backup_service_name }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ _vw_backup_data_path }}"

- name: Vaultwarden backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
