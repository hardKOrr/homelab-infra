---
# Docker hosting: the official image under Compose on the stack host. The image carries
# the web vault, so there is no fetch step; the admin token is the same argon2id hash.
# The shared Compose deploy renders the environment file with the project and recreates
# the container when either changed, in the same up that creates it, so a new install is
# never restarted mid first boot.
- name: Vaultwarden | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ vaultwarden_project_dir }}"
    compose_dirs: ["{{ app_config.app.data_path }}"]
    compose_files:
      - src: vaultwarden.env.j2
        dest: "{{ vaultwarden_env_file }}"
        mode: "0600"
    compose_secrets: ["{{ _admin_token_hash }}"]
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/alive"
