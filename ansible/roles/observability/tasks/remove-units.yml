---
# Shared native removal stops Prometheus and Grafana; no unit is named after the instance.
- name: Observability remove | Load the native service names
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../roles/observability/defaults/main.yml"

- name: Observability remove | Select every native service
  ansible.builtin.set_fact:
    _rm_service_names: "{{ observability_native_services }}"
