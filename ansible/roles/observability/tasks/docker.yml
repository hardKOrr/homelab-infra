---
# Docker: the Compose project on the stack host. The shared Compose deploy starts the stack
# once, recreating it in that up when the Compose file, the env file or Grafana's
# provisioning (main.yml) changed. Images are pulled only when missing: Prometheus and
# Grafana run at `:latest`, and moving them forward is Watchtower's job, so a re-run is
# never a silent upgrade and a converged re-run reaches changed=0.
- name: Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ observability_project_dir }}"
    compose_recreate: >-
      {{ _obs_env_written.changed | default(false)
         or _obs_datasource_written.changed | default(false)
         or _obs_dashboards_written.changed | default(false)
         or _obs_dashboard_written.changed | default(false) }}
