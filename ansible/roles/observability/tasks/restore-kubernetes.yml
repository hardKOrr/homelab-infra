---
# Restore Grafana's database and Prometheus's TSDB into the target's two volumes through
# the shared Kubernetes recovery Job. Configuration is regenerated by Deploy, not restored.
- name: Observability Kubernetes restore | Restore through the shared recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Observability
      archives:
        - name: grafana
          claim: "{{ restore_target }}-grafana"
          owner: "472:472"
        - name: prometheus
          claim: "{{ restore_target }}-prometheus"
          owner: "65534:472"
      stop:
        - "{{ restore_target }}"
      describe: >-
        the {{ restore_target }}-grafana and {{ restore_target }}-prometheus volumes
        (Grafana's database and Prometheus's TSDB)
      verify:
        - >-
          Open https://{{ restore_target }}.<estate domain>/, sign in with the canonical
          credential for {{ restore_target }}, and verify the expected dashboards, users
          and Prometheus history.
