---
# observability role — Prometheus + Grafana via Docker Compose, or as native services
# (hosting.method native: the Grafana APT package and the Prometheus release binary, see
# native-install.yml and native-run.yml) on the instance's own guest. node_exporter is NOT part
# of this stack: it is a package on every guest, installed by tasks/guest-bootstrap.yml.
# Called from Play 2 of playbooks/apps/observability.yml. Target: the
# monitoring host.
#
# ONE APP, NOT TWO — Grafana's only datasource is Prometheus and neither is useful
# alone, so they deploy together under a single instance name and a single job in
# Rundeck. Decision record: https://github.com/hardKOrr/homelab-infra/blob/056d836/docs/meta/done/405-app-grafana/notes.md.
#
# WHAT IS EXPOSED — only Grafana. Prometheus binds the stack host's loopback: it
# has no authentication of its own, so publishing it would hand every metric in
# the lab to anything on the LAN.
#
# SCRAPE TARGETS — generated from the Proxmox dynamic inventory at deploy time
# (every guest tagged `_+lab`). It is a snapshot, not live discovery:
# re-running this deploy is what picks up newly added guests, which matches the
# platform's fire-and-forget model. Guests get node_exporter from
# tasks/guest-bootstrap.yml; this stack host runs it as a container instead.
#
# SECRETS — the Grafana admin password is generated once and reused from the
# registry on re-run. It lives in the compose environment file (0600, root-owned)
# because the container reads it, and in gitignored config/.generated/facts.yml so
# the operator can sign in. Same narrow exception documented in roles/authentik.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the metrics registry key):
#   observability_grafana_url, observability_prometheus_url,
#   observability_admin_username, observability_admin_password

- name: Set domain fact for the Grafana root URL
  ansible.builtin.set_fact:
    _observability_domain: >-
      {{ homelabinfra_infra.domain
         | default(homelabinfra_config.infrastructure.domain, true) }}

# ── Scrape targets ────────────────────────────────────────────────────────────
- name: Collect the node scrape targets
  ansible.builtin.include_tasks: scrape-targets.yml

# ── Native install (packages and service users come before the data directories) ─
- name: Install Grafana and Prometheus natively
  ansible.builtin.include_tasks: native-install.yml
  when: observability_native | bool

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create project directory
  ansible.builtin.file:
    path: "{{ observability_project_dir }}"
    state: directory
    owner: root
    group: root
    # Natively the service users reach config/ and data/ through this directory (execute
    # only, no listing); the root-only .env inside keeps its own 0600.
    mode: "{{ '0711' if observability_native | bool else '0750' }}"

- name: Create config directories
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - dashboards
    - prometheus
    - provisioning/datasources
    - provisioning/dashboards

# The service-owned children must not implicitly create their shared parent with
# the first service's ownership and mode, preventing the other service's access.
- name: Create the shared native data parent
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  when: observability_native | bool

- name: Create data directories
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}/{{ item }}"
    state: directory
    # Each service writes its own tree, so these are not root-owned like the config tree.
    owner: "{{ (item == 'grafana') | ternary(observability_grafana_uid, observability_prometheus_uid) }}"
    mode: "0750"
  loop:
    - prometheus
    - grafana

# ── Secrets ───────────────────────────────────────────────────────────────────
- name: Read the existing compose environment (secret continuity across re-runs)
  ansible.builtin.slurp:
    src: "{{ observability_env_file }}"
  register: _observability_env_current
  failed_when: false
  no_log: true

- name: Parse the existing compose environment
  ansible.builtin.set_fact:
    _observability_env_existing: >-
      {{ dict((_observability_env_current.content | b64decode).splitlines()
              | select('match', '^[A-Z_]+=')
              | map('split', '=', 1))
         if _observability_env_current.content is defined else {} }}
  no_log: true

- name: Resolve the Grafana admin password
  ansible.builtin.set_fact:
    _observability_admin_password: >-
      {{ homelabinfra_infra.metrics.admin_password
         | default(_observability_env_existing.GF_ADMIN_PASSWORD
                   | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true),
                   true) }}
  no_log: true

- name: Store the Grafana password before applying it
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/metrics
    vault_item_fields:
      provider: prometheus_grafana
      instance: "{{ instance }}"
      host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
      prometheus_host: "http://127.0.0.1:{{ app_config.app.prometheus_port }}"
      admin_user: "{{ app_config.app.admin_user | default('admin') }}"
      admin_password: "{{ _observability_admin_password }}"
    vault_item_secret_fields: [admin_password]

# ── Configuration ─────────────────────────────────────────────────────────────
- name: Write the compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ observability_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart observability

# Written into its own directory, which is what the compose file bind-mounts.
# Mounting the FILE instead silently breaks every config change after the first:
# `template` writes a temp file and renames it into place, so the path gets a new
# inode while the container's mount stays bound to the old one. The container then
# reads a file that no longer exists at that path, the reload below succeeds, and
# Prometheus loads the config it already had. Observed live 2026-08-08 — Prometheus
# had been scraping a five-day-old target list, missing the PBS guest, while the
# file on the host had listed it the whole time. Mounting the directory means a
# replaced file inside it is visible immediately.
- name: Write the Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ app_config.app.config_path }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: Reload prometheus

# The single-file mount above lived at config_path/prometheus.yml. Left behind it is
# a file that looks authoritative and is not read by anything.
- name: Remove the pre-directory Prometheus config
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}/prometheus.yml"
    state: absent

- name: Write the Grafana datasource provisioning
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ app_config.app.config_path }}/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Restart observability

- name: Write the Grafana dashboard provisioning
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ app_config.app.config_path }}/provisioning/dashboards/homelab-infra.yml"
    mode: "0644"
  notify: Restart observability

- name: Install the default homelab dashboard
  ansible.builtin.copy:
    src: homelab-nodes.json
    dest: "{{ app_config.app.config_path }}/dashboards/homelab-nodes.json"
    mode: "0644"
  notify: Restart observability

# ── Run ───────────────────────────────────────────────────────────────────────
- name: Run the stack on Docker
  ansible.builtin.include_tasks: docker.yml
  when: not (observability_native | bool)

- name: Run Prometheus and Grafana as native services
  ansible.builtin.include_tasks: native-run.yml
  when: observability_native | bool

- name: Apply pending restarts and reloads before the health checks
  ansible.builtin.meta: flush_handlers

- name: Verify Prometheus and Grafana
  ansible.builtin.include_tasks: verify.yml

# ── Hand the endpoints back to the playbook ───────────────────────────────────
- name: Export the observability endpoints to the playbook
  ansible.builtin.set_fact:
    observability_grafana_url: "http://{{ _observability_host }}:{{ app_config.app.port }}"
    # Loopback-bound on purpose — recorded for humans and for on-host debugging,
    # not as something other services can reach.
    observability_prometheus_url: "http://127.0.0.1:{{ app_config.app.prometheus_port }}"
    observability_admin_username: "{{ app_config.app.admin_user | default('admin') }}"
    observability_admin_password: "{{ _observability_admin_password }}"
    observability_scrape_target_count: "{{ _observability_node_targets | length }}"
  vars:
    _observability_host: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
  no_log: true
