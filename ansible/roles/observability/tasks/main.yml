---
# observability role — Prometheus + Grafana via Docker Compose. node_exporter is NOT part
# of this stack: it is a package on every guest, installed by tasks/guest-bootstrap.yml.
# Called from Play 2 of playbooks/apps/observability.yml. Target: the
# monitoring_stack host.
#
# ONE APP, NOT TWO — Grafana's only datasource is Prometheus and neither is useful
# alone, so they deploy together under a single instance name and a single job in
# Semaphore/Rundeck. Decision record: .claude/meta/405-app-grafana/notes.md.
#
# WHAT IS EXPOSED — only Grafana. Prometheus binds the stack host's loopback: it
# has no authentication of its own, so publishing it would hand every metric in
# the lab to anything on the LAN.
#
# SCRAPE TARGETS — generated from the Proxmox dynamic inventory at deploy time
# (every homelab-infra-tagged guest). It is a snapshot, not live discovery:
# re-running this deploy is what picks up newly added guests, which matches the
# platform's fire-and-forget model. Guests get node_exporter from
# tasks/guest-bootstrap.yml; this stack host runs it as a container instead.
#
# SECRETS — the Grafana admin password is generated once and reused from the
# registry on re-run. It lives in the compose environment file (0600, root-owned)
# because the container reads it, and in gitignored config/.generated/facts.yml so
# the operator can sign in. Same narrow exception documented in roles/authentik.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the metrics registry key):
#   observability_grafana_url, observability_prometheus_url,
#   observability_admin_username, observability_admin_password

- name: Set domain fact for the Grafana root URL
  ansible.builtin.set_fact:
    _observability_domain: >-
      {{ homelabinfra_infra.domain
         | default(homelabinfra_config.infrastructure.domain, true) }}

# ── Scrape targets ────────────────────────────────────────────────────────────
# Guests with no resolvable address (never booted, inventory mid-refresh) are
# skipped rather than written as an empty target Prometheus would reject.
- name: Collect node scrape targets
  ansible.builtin.set_fact:
    _observability_node_targets: >-
      {{ (_observability_node_targets | default([]))
         + [{'name': item,
             'address': hostvars[item].ansible_host
                        | default(hostvars[item].ansible_default_ipv4.address | default(''))}] }}
  # Sorted, because the dynamic inventory does not promise a stable order for a group and
  # this list is rendered straight into prometheus.yml. Unsorted, a no-op re-run produced a
  # file that differed only in the ORDER of its scrape targets, which marked the template
  # changed and fired the handler — so every bootstrap pass restarted Prometheus and put a
  # gap in the metrics it exists to collect. Sorting makes the render a pure function of
  # which guests exist, not of how the inventory happened to enumerate them.
  loop: "{{ groups['tag_homelab_infra'] | default([]) | sort }}"
  when: >-
    hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address | default(''))
    | length > 0

- name: Default the scrape target list when the inventory is empty
  ansible.builtin.set_fact:
    _observability_node_targets: "{{ _observability_node_targets | default([]) }}"

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create project directory
  ansible.builtin.file:
    path: "{{ observability_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create config directories
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - dashboards
    - prometheus
    - provisioning/datasources
    - provisioning/dashboards

- name: Create data directories
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}/{{ item }}"
    state: directory
    # Grafana runs as uid 472 and Prometheus as uid 65534 (nobody); both need to
    # write their own volume, so these are not root-owned like the config tree.
    owner: "{{ (item == 'grafana') | ternary('472', '65534') }}"
    mode: "0750"
  loop:
    - prometheus
    - grafana

# ── Secrets ───────────────────────────────────────────────────────────────────
- name: Read the existing compose environment (secret continuity across re-runs)
  ansible.builtin.slurp:
    src: "{{ observability_env_file }}"
  register: _observability_env_current
  failed_when: false
  no_log: true

- name: Parse the existing compose environment
  ansible.builtin.set_fact:
    _observability_env_existing: >-
      {{ dict((_observability_env_current.content | b64decode).splitlines()
              | select('match', '^[A-Z_]+=')
              | map('split', '=', 1))
         if _observability_env_current.content is defined else {} }}
  no_log: true

- name: Resolve the Grafana admin password
  ansible.builtin.set_fact:
    _observability_admin_password: >-
      {{ homelabinfra_infra.metrics.admin_password
         | default(_observability_env_existing.GF_ADMIN_PASSWORD
                   | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true),
                   true) }}
  no_log: true

- name: Store the Grafana password before applying it
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/metrics
    vault_item_fields:
      provider: prometheus_grafana
      instance: "{{ instance }}"
      host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
      prometheus_host: "http://127.0.0.1:{{ app_config.app.prometheus_port }}"
      admin_user: "{{ app_config.app.admin_user | default('admin') }}"
      admin_password: "{{ _observability_admin_password }}"
    vault_item_secret_fields: [admin_password]

# ── Configuration ─────────────────────────────────────────────────────────────
- name: Write the compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ observability_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart observability

# Written into its own directory, which is what the compose file bind-mounts.
# Mounting the FILE instead silently breaks every config change after the first:
# `template` writes a temp file and renames it into place, so the path gets a new
# inode while the container's mount stays bound to the old one. The container then
# reads a file that no longer exists at that path, the reload below succeeds, and
# Prometheus loads the config it already had. Observed live 2026-08-08 — Prometheus
# had been scraping a five-day-old target list, missing the PBS guest, while the
# file on the host had listed it the whole time. Mounting the directory means a
# replaced file inside it is visible immediately.
- name: Write the Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ app_config.app.config_path }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: Reload prometheus

# The single-file mount above lived at config_path/prometheus.yml. Left behind it is
# a file that looks authoritative and is not read by anything.
- name: Remove the pre-directory Prometheus config
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}/prometheus.yml"
    state: absent

- name: Write the Grafana datasource provisioning
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ app_config.app.config_path }}/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Restart observability

- name: Write the Grafana dashboard provisioning
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ app_config.app.config_path }}/provisioning/dashboards/homelab-infra.yml"
    mode: "0644"
  notify: Restart observability

- name: Install the default homelab dashboard
  ansible.builtin.copy:
    src: homelab-nodes.json
    dest: "{{ app_config.app.config_path }}/dashboards/homelab-nodes.json"
    mode: "0644"
  notify: Restart observability

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ observability_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart observability

# ── Run ───────────────────────────────────────────────────────────────────────
# Prometheus and Grafana are pulled at `:latest`, so the default `always` policy
# re-pulls whatever the tag points at today and recreates the containers under it.
# That makes every re-run of a deploy a silent, unreviewed upgrade of the monitoring
# stack, and it is Watchtower's job in this platform (see the day-2 model in
# AGENTS.md) — a deploy ensures the images are present, Watchtower moves them
# forward and reports it. `missing` also lets a converged re-run reach changed=0.
- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ observability_project_dir }}"
    policy: missing
  # Under `missing` this task can only make images exist locally — it never touches a
  # running container, and "Start the observability stack" below reports any container
  # that actually moved. Its own changed flag is not trustworthy anyway: with images
  # already present, `docker compose pull` emits the same Pulling/Pulled events here as
  # it does for the pinned-tag roles, yet the module calls this one changed and those
  # not. Reporting on the container, once, is the honest signal.
  changed_when: false

- name: Start the observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ observability_project_dir }}"
    state: present
    remove_orphans: true

- name: Apply pending restarts and reloads before the health checks
  ansible.builtin.meta: flush_handlers

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.prometheus_port }}/-/ready"
    status_code: 200
  register: _prometheus_health
  until: _prometheus_health.status == 200
  retries: 30
  delay: 5
  changed_when: false

# /-/ready answers from whatever config Prometheus last loaded, which is not
# necessarily the file this run wrote — exactly the failure the single-file bind
# mount produced above, where a replaced inode left Prometheus scraping a five-day-old
# target list while /-/ready stayed 200 the whole time. Comparing the ACTIVE target
# set against the list this run rendered is what makes that visible.
#
# Target HEALTH is deliberately not asserted for every target: a guest that happens
# to be down is not a reason to fail this deploy. One target scraping successfully is
# enough to prove Prometheus is collecting at all.
- name: Read the active Prometheus targets
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.prometheus_port }}/api/v1/targets?state=active"
    status_code: 200
  register: _prometheus_targets
  until: >-
    (_prometheus_targets.json.data.activeTargets | default([]))
    | selectattr('labels.job', 'equalto', 'nodes') | list | length
    == (_observability_node_targets | length)
  retries: 10
  delay: 3
  failed_when: false
  changed_when: false

- name: Assert Prometheus is scraping the targets this deploy rendered
  ansible.builtin.assert:
    that:
      - (_prometheus_scraped | sort) == (_observability_node_targets | map(attribute='name') | list | sort)
      - _prometheus_active | selectattr('health', 'equalto', 'up') | list | length > 0
    fail_msg: >-
      Prometheus is scraping {{ _prometheus_scraped | sort }} but this deploy
      rendered {{ _observability_node_targets | map(attribute='name') | list | sort }}.
      A Prometheus that never picked up the new config keeps collecting the old
      target list indefinitely, and every dashboard still looks populated.
  vars:
    _prometheus_active: "{{ _prometheus_targets.json.data.activeTargets | default([]) }}"
    _prometheus_scraped: >-
      {{ _prometheus_active | selectattr('labels.job', 'equalto', 'nodes')
         | map(attribute='labels.instance') | list }}

- name: Wait for Grafana to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/health"
    status_code: 200
  register: _grafana_health
  until: _grafana_health.status == 200
  retries: 30
  delay: 5
  changed_when: false

# Proves the provisioning actually landed — a datasource that failed to load
# leaves every dashboard panel blank, which is easy to miss until someone looks.
- name: Verify the Prometheus datasource is provisioned
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/datasources/uid/prometheus"
    user: "{{ app_config.app.admin_user | default('admin') }}"
    password: "{{ _observability_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _grafana_datasource
  until: _grafana_datasource.status | default(0) == 200
  retries: 10
  delay: 3
  changed_when: false
  no_log: true

# The check above proves the datasource EXISTS. This one proves Grafana can actually
# query it: a datasource whose URL is unreachable from inside the container — a
# loopback address, a renamed compose service — provisions perfectly and leaves every
# panel on every dashboard blank, which nobody notices until they open a dashboard.
# Verified against Grafana 13.1.3:
#   {"status":"OK","message":"Successfully queried the Prometheus API."}
#
# no_log because the admin password is a task argument; the assert below reads the
# registered result, which carries the server's message but not the credential.
- name: Query the Prometheus datasource health from Grafana
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/datasources/uid/prometheus/health"
    user: "{{ app_config.app.admin_user | default('admin') }}"
    password: "{{ _observability_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _grafana_datasource_health
  until: (_grafana_datasource_health.json.status | default('')) == 'OK'
  retries: 10
  delay: 3
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert Grafana can query Prometheus
  ansible.builtin.assert:
    that: (_grafana_datasource_health.json.status | default('')) == 'OK'
    fail_msg: >-
      Grafana cannot query its Prometheus datasource —
      {{ _grafana_datasource_health.json.message | default('no response') }}.
      The datasource is provisioned but unusable, so every dashboard renders blank.

# ── Hand the endpoints back to the playbook ───────────────────────────────────
- name: Export the observability endpoints to the playbook
  ansible.builtin.set_fact:
    observability_grafana_url: "http://{{ _observability_host }}:{{ app_config.app.port }}"
    # Loopback-bound on purpose — recorded for humans and for on-host debugging,
    # not as something other services can reach.
    observability_prometheus_url: "http://127.0.0.1:{{ app_config.app.prometheus_port }}"
    observability_admin_username: "{{ app_config.app.admin_user | default('admin') }}"
    observability_admin_password: "{{ _observability_admin_password }}"
    observability_scrape_target_count: "{{ _observability_node_targets | length }}"
  vars:
    _observability_host: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
  no_log: true
