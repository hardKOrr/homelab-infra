---
# Grafana's SQLite database and Prometheus's TSDB form one application recovery unit.
# Stop both writers before archiving the complete persistent data directory.

- name: Observability backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Observability needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Observability backup | Check the Grafana database
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}/grafana/grafana.db"
  register: _observability_backup_grafana_db
  changed_when: false

- name: Observability backup | Check the Prometheus data directory
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}/prometheus"
  register: _observability_backup_prometheus_data
  changed_when: false

- name: Observability backup | Require persistent application state
  ansible.builtin.assert:
    that:
      - _observability_backup_grafana_db.stat.exists
      - _observability_backup_grafana_db.stat.isreg
      - _observability_backup_grafana_db.stat.size | int > 0
      - _observability_backup_prometheus_data.stat.exists
      - _observability_backup_prometheus_data.stat.isdir
    fail_msg: >-
      Observability's Grafana database or Prometheus data directory is missing or empty;
      refusing to publish an incomplete recovery point.

- name: Observability backup | Stop Prometheus and Grafana and archive the data directory
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ observability_project_dir }}"
    pbs_client_stop_services: [prometheus, grafana]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.data_path }}"

- name: Observability backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
