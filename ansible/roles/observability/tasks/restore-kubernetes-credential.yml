---
# recovery-restore.yml calls this while the target Deployment is stopped, after the Grafana
# volume was replaced and before the Deployment starts. Grafana keeps the administrator
# password in its database (GF_SECURITY_ADMIN_PASSWORD only seeds a first run), so the
# restored database carries the SOURCE's password. Reset it to the target's canonical one,
# which the target's Secret already holds.
- name: Observability Kubernetes restore | Require a login that is safe to write into SQL
  ansible.builtin.assert:
    that: restore_target_config.app.admin_user | default('admin') is match('^[A-Za-z0-9_.-]+$')
    fail_msg: app.admin_user may only contain letters, digits, dot, dash and underscore.

- name: Observability Kubernetes restore | Reapply the target's canonical administrator password
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/run-job.yml
  vars:
    k8s_job_name: "{{ restore_target }}-reset-admin"
    k8s_job_manifest: "{{ lookup('ansible.builtin.template', 'reset-admin-job.yaml.j2') }}"
    k8s_job_timeout: 300
    k8s_job_report_changed: false
