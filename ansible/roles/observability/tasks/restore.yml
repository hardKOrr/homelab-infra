---
# Restore one complete Prometheus and Grafana data archive through the shared swap.
# Configuration and provisioning are regenerated by Deploy; only an explicit overwrite
# replaces data. Each tree keeps the uid its container runs as.

- name: Observability restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_destination | default('existing')) in ['existing', 'new']
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Observability restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list recovery points before selecting one.

- name: Observability restore | Resolve the target backup identity
  ansible.builtin.set_fact:
    _observability_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
  no_log: true

- name: Observability restore | Resolve the target recovery-point group
  ansible.builtin.set_fact:
    _observability_restore_target_group: "host/{{ _observability_restore_target_backup_id }}"
  when: restore_overwrite | bool
  no_log: true

- name: Observability restore | Require an independent pre-restore point for an existing target
  ansible.builtin.assert:
    that:
      - _observability_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_pre_restore_point | default('') | length > 0
      - restore_pre_restore_point.startswith(_observability_restore_target_group ~ '/')
      - restore_pre_restore_point.split('/') | length == 3
      - restore_pre_restore_point != restore_snapshot
    fail_msg: >-
      Replacing an existing Observability instance requires a separate pre_restore_point
      from host/{{ _observability_restore_target_backup_id }}/. Back it up before overwrite.
  when:
    - restore_overwrite | bool
    - restore_destination | default('existing') == 'existing'

- name: Observability restore | Preview or replace the Prometheus and Grafana data
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_pre_restore_backup_id: "{{ _observability_restore_target_backup_id }}"
    recovery_swap_archives: [data.pxar]
    # Grafana runs as uid 472 and Prometheus as 65534 (nobody), as Deploy creates them.
    recovery_swap_paths:
      - path: "{{ app_config.app.data_path }}/prometheus"
        source: data/prometheus
        owner: 65534
        group: 0
        mode: "0750"
      - path: "{{ app_config.app.data_path }}/grafana"
        source: data/grafana
        owner: 472
        group: 0
        mode: "0750"
    # Beside data_path, so staging kept after a failure stays out of the next backup.
    recovery_swap_staging_parent: "{{ app_config.app.data_path | dirname }}"
    recovery_swap_stop_services: [prometheus, grafana]
    recovery_swap_compose_project: "{{ observability_project_dir }}"
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.prometheus_port }}/-/ready"
    recovery_swap_health_retries: 30
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"

- name: Observability restore | Explain the read-only selected-point plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with overwrite=true and a separate pre_restore_point
      for an existing target to restore {{ restore_snapshot }} into
      {{ app_config.app.data_path }}.
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length > 0)
