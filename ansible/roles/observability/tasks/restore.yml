---
# Restore one complete Prometheus and Grafana data archive. Configuration and
# provisioning are regenerated by Deploy; only an explicit overwrite replaces data.

- name: Observability restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_destination | default('existing')) in ['existing', 'new']
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Observability restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list recovery points before selecting one.

- name: Observability restore | Resolve the source and target backup identities
  ansible.builtin.set_fact:
    _observability_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _observability_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _application_restore_complete: false
    _observability_restore_rolled_back: false
    _observability_restore_moved: {rc: 1}
    _observability_restore_stopped: false
  no_log: true

- name: Observability restore | Validate the source snapshot group
  ansible.builtin.assert:
    that:
      - _observability_restore_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_snapshot.startswith('host/' ~ _observability_restore_backup_id ~ '/')
      - restore_snapshot.split('/') | length == 3
      - restore_snapshot | length > ('host/' ~ _observability_restore_backup_id ~ '/') | length
    fail_msg: >-
      The selected Observability recovery point must belong to
      host/{{ _observability_restore_backup_id }}/; refusing another backup group's archive.
  when: restore_snapshot | default('') | length > 0

- name: Observability restore | List or verify the recovery point without changing Observability
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-restore.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_backup_id: "{{ _observability_restore_backup_id }}"
    pbs_client_archives: [{name: data.pxar}]
  when: not (restore_overwrite | bool)

- name: Observability restore | Explain the read-only selected-point plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with overwrite=true and a separate pre_restore_point
      for an existing target to restore {{ restore_snapshot }} into
      {{ app_config.app.data_path }}.
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length > 0)

- name: Observability restore | Resolve the target recovery-point group
  ansible.builtin.set_fact:
    _observability_restore_target_group: "host/{{ _observability_restore_target_backup_id }}"
  when: restore_overwrite | bool
  no_log: true

- name: Observability restore | Require an independent pre-restore point for an existing target
  ansible.builtin.assert:
    that:
      - _observability_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_pre_restore_point | default('') | length > 0
      - restore_pre_restore_point.startswith(_observability_restore_target_group ~ '/')
      - restore_pre_restore_point.split('/') | length == 3
      - restore_pre_restore_point != restore_snapshot
    fail_msg: >-
      Replacing an existing Observability instance requires a separate pre_restore_point
      from host/{{ _observability_restore_target_backup_id }}/. Back it up before overwrite.
  when:
    - restore_overwrite | bool
    - restore_destination | default('existing') == 'existing'

# The shared restore proves the selected point and the pre-restore point each hold
# data.pxar before it extracts anything.

- name: Observability restore | Check the existing target data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _observability_restore_existing_data
  changed_when: false
  when: restore_overwrite | bool

- name: Observability restore | Require existing data before an in-place overwrite
  ansible.builtin.assert:
    that:
      - _observability_restore_existing_data.stat.exists
      - _observability_restore_existing_data.stat.isdir
      - not (_observability_restore_existing_data.stat.islnk | default(false))
    fail_msg: >-
      Observability overwrite was requested for an existing target, but its data directory
      is missing or is not a real directory. Refusing to replace an unverified target.
  when:
    - restore_overwrite | bool
    - restore_destination | default('existing') == 'existing'

- name: Observability restore | Create a private staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ app_config.app.data_path | dirname }}"
    prefix: "{{ instance }}-observability-restore-"
  register: _observability_restore_tmp
  when: restore_overwrite | bool

- name: Observability restore | Stop and replace the application data
  when: restore_overwrite | bool
  block:
    # Keep the rollback copy beside data_path so the move is an atomic rename on the
    # same filesystem. This private directory is outside the application archive.
    - name: Observability restore | Create private rollback space beside the data directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ app_config.app.data_path | dirname }}"
        prefix: .observability-pre-restore-
      register: _observability_restore_previous

    - name: Observability restore | Create the extraction directory
      ansible.builtin.file:
        path: "{{ _observability_restore_tmp.path }}/data"
        state: directory
        mode: "0700"

    - name: Observability restore | Extract the selected archive into staging
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-restore.yml
      vars:
        pbs_client_runtime: docker
        pbs_client_backup_id: "{{ _observability_restore_backup_id }}"
        pbs_client_pre_restore_backup_id: "{{ _observability_restore_target_backup_id }}"
        pbs_client_archives:
          - name: data.pxar
            path: "{{ _observability_restore_tmp.path }}/data"

    - name: Observability restore | Check the staged Grafana database
      ansible.builtin.stat:
        path: "{{ _observability_restore_tmp.path }}/data/grafana/grafana.db"
      register: _observability_restore_staged_grafana_db
      changed_when: false

    - name: Observability restore | Check the staged Prometheus data directory
      ansible.builtin.stat:
        path: "{{ _observability_restore_tmp.path }}/data/prometheus"
      register: _observability_restore_staged_prometheus_data
      changed_when: false

    - name: Observability restore | Refuse an incomplete archive
      ansible.builtin.assert:
        that:
          - _observability_restore_staged_grafana_db.stat.exists
          - _observability_restore_staged_grafana_db.stat.isreg
          - _observability_restore_staged_grafana_db.stat.size | int > 0
          - _observability_restore_staged_prometheus_data.stat.exists
          - _observability_restore_staged_prometheus_data.stat.isdir
        fail_msg: >-
          The selected archive does not contain both Grafana's database and Prometheus's
          data directory; the existing Observability state was not moved.

    - name: Observability restore | Stop only Prometheus and Grafana
      community.docker.docker_compose_v2:
        project_src: "{{ observability_project_dir }}"
        state: stopped
        services: [prometheus, grafana]

    - name: Observability restore | Record the stopped services
      ansible.builtin.set_fact:
        _observability_restore_stopped: true

    - name: Observability restore | Move the original data into rollback space
      ansible.builtin.command:
        argv:
          - mv
          - "{{ app_config.app.data_path }}"
          - "{{ _observability_restore_previous.path }}/data"
      register: _observability_restore_moved
      changed_when: _observability_restore_moved.rc == 0
      when: _observability_restore_existing_data.stat.exists | default(false)
      no_log: true

    - name: Observability restore | Recreate the data directory
      ansible.builtin.file:
        path: "{{ app_config.app.data_path }}"
        state: directory
        owner: root
        group: root
        # The Prometheus and Grafana containers use different unprivileged UIDs.
        # Keep the parent traversable so they can reach their separately owned data dirs.
        mode: "0755"

    - name: Observability restore | Copy the archived application state into place
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ _observability_restore_tmp.path }}/data/."
          - "{{ app_config.app.data_path }}/"
      changed_when: true
      no_log: true

    - name: Observability restore | Start only Prometheus and Grafana
      community.docker.docker_compose_v2:
        project_src: "{{ observability_project_dir }}"
        state: present
        services: [prometheus, grafana]

    - name: Observability restore | Wait for Prometheus
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.prometheus_port }}/-/ready"
        status_code: 200
      register: _observability_restore_prometheus_health
      until: _observability_restore_prometheus_health.status | default(0) == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Observability restore | Wait for Grafana
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/api/health"
        status_code: 200
      register: _observability_restore_grafana_health
      until: _observability_restore_grafana_health.status | default(0) == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Observability restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Observability restore | Stop only Prometheus and Grafana after failure
      community.docker.docker_compose_v2:
        project_src: "{{ observability_project_dir }}"
        state: stopped
        services: [prometheus, grafana]
      when: _observability_restore_stopped | bool

    - name: Observability restore | Remove failed replacement data
      ansible.builtin.file:
        path: "{{ app_config.app.data_path }}"
        state: absent
      when: >-
        _observability_restore_moved.rc | default(1) == 0
        or (restore_destination | default('existing') == 'new' and _observability_restore_stopped | bool)

    - name: Observability restore | Put the original data back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _observability_restore_previous.path }}/data"
          - "{{ app_config.app.data_path }}"
      changed_when: true
      no_log: true
      when: _observability_restore_moved.rc | default(1) == 0

    - name: Observability restore | Record that rollback completed
      ansible.builtin.set_fact:
        _observability_restore_rolled_back: true

    - name: Observability restore | State that the service remains stopped
      ansible.builtin.fail:
        msg: >-
          Observability restore failed. {{ 'Prometheus and Grafana were left stopped rather
          than serving partial state.' if _observability_restore_stopped | bool else
          'Prometheus and Grafana kept running; the point failed its checks before anything
          stopped.' }} The original data was retained or put back; inspect the job output
          and rerun the restore after correcting the failure.
  always:
    - name: Observability restore | Remove rollback space only after success or rollback
      ansible.builtin.file:
        path: "{{ _observability_restore_previous.path }}"
        state: absent
      when:
        - _observability_restore_previous.path is defined
        - >-
          (_application_restore_complete | bool) or (_observability_restore_rolled_back | bool)
          or (_observability_restore_moved.rc | default(1) != 0)

    - name: Observability restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _observability_restore_tmp.path }}"
        state: absent
      when: _observability_restore_tmp.path is defined
