---
# Included by main.yml (native only): install Uptime Kuma, write the systemd unit, start it
# and install the helpers. The unit's DATA_DIR is app.data_path, so one backup and restore
# serves both methods.

- name: Uptime Kuma native | Install the pinned release
  ansible.builtin.include_tasks: native-install.yml

- name: Uptime Kuma native | Write the systemd unit
  ansible.builtin.template:
    src: native.service.j2
    dest: "/etc/systemd/system/{{ uptime_kuma_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart uptime-kuma

- name: Uptime Kuma native | Enable and start the service
  ansible.builtin.systemd:
    name: "{{ uptime_kuma_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Uptime Kuma native | Install the restart and log helpers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart {{ uptime_kuma_service }}
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        exec journalctl -u {{ uptime_kuma_service }} -n "${1:-50}" --no-pager
  loop_control:
    label: "{{ item.name }}"
