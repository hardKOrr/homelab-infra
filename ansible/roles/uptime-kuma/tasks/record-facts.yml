---
# Record the `monitoring` registry key (ansible/vars/CONTRACT.md §3) from what the role
# exported in uptime_kuma_exports (the guest's or localhost's hostvars), re-resolve the
# estate so the rest of this run reads it, and say where the admin password is. Called by
# deploy-record.yml (Docker, native) and deploy-wire.yml (Kubernetes).
- name: Uptime Kuma | Record the monitoring registry key
  ansible.builtin.include_tasks: ../../../tasks/bootstrap/write-generated-facts.yml
  vars:
    generated_facts_file: "{{ playbook_dir }}/../../../config/.generated/facts.yml"
    generated_facts_service: monitoring
    generated_facts_data: >-
      {{ {
           'provider': 'uptime_kuma',
           'instance': instance,
           'host': uptime_kuma_exports.kuma_url,
           'admin_user': uptime_kuma_exports.kuma_admin_username,
         }
         | combine({'notification_id': uptime_kuma_exports.kuma_notification_id}
                   if uptime_kuma_exports.kuma_notification_id | string | length > 0
                   else {}) }}

- name: Uptime Kuma | Resolve the estate with the new key
  ansible.builtin.include_tasks: ../../../tasks/resolve-estate.yml
  vars:
    resolve_estate_name: "{{ app_config.routing.estate | default('') }}"

- name: Uptime Kuma | Say where the admin password is
  ansible.builtin.set_fact:
    deploy_notify_note: >-
      Signed in as {{ uptime_kuma_exports.kuma_admin_username }} (password in Vaultwarden
      item homelab-infra/monitoring). Apps register their monitors automatically from
      their next deploy onward.
