---
# uptime-kuma role — Docker Compose on a stack host (docker.yml) or natively on its own
# LXC or VM (native-install.yml, native.yml).
# Called from Play 2 of playbooks/apps/uptime-kuma.yml. Target: the monitoring host.
#
# VERSION — Uptime Kuma 2.x, locked by slice 404. Full record in that slice's notes.md.
# The version choice is no longer about a REST API: NEITHER version has one for monitors,
# notifications or accounts. Everything below that mutates Uptime Kuma is a socket.io
# event carried over engine.io long polling with plain `uri` calls — see
# tasks/kuma/call.yml. What the 2.x pin actually buys is the database-setup step.
#
# CREDENTIALS — the admin password is generated once and reused from the registry on
# re-run, and it is what signs a socket in. The REST API key is a separate thing that
# authorises /metrics and the badge endpoints; nothing in the wiring path needs it.
#
# DEGRADED PATH — an Uptime Kuma that will not answer, will not sign in, or refuses the
# notification channel produces a warning and a recorded gap, never a failed deploy.
# Monitoring is an add-on and must never be the thing that fails an app deploy. The one
# thing this role does fail on is an admin account it was told to create and could not:
# reading an error as success is what let this app sit unusable for five days.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the monitoring registry key):
#   kuma_url, kuma_api_key, kuma_admin_username, kuma_admin_password,
#   kuma_notification_id

- name: Docker on the stack host
  ansible.builtin.include_tasks: docker.yml
  when: not (uptime_kuma_native | bool)

- name: Native install and service
  ansible.builtin.include_tasks: native.yml
  when: uptime_kuma_native | bool

- name: Apply pending restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Wait for Uptime Kuma to answer
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: 200
  register: _kuma_up
  until: _kuma_up.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Admin account ─────────────────────────────────────────────────────────────
- name: Resolve Uptime Kuma API and registry endpoints
  ansible.builtin.set_fact:
    _kuma_base: "http://localhost:{{ app_config.app.port }}"
    _kuma_registry_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"

- name: Configure Uptime Kuma
  ansible.builtin.include_tasks: configure.yml
