---
# uptime-kuma role — Docker Compose deployment on a stack host.
# Called from Play 2 of playbooks/apps/uptime-kuma.yml. Target: the monitoring_stack host.
#
# VERSION — Uptime Kuma 2.x, locked by slice 404. Version 1 has no REST API at all
# (socket.io only) and tasks/wiring/uptime-kuma.yml registers monitors over REST.
# Full decision record in .claude/meta/404-app-uptime-kuma/notes.md.
#
# CREDENTIALS — the admin password is generated once and reused from the registry
# on re-run; it is recorded in gitignored config/.generated/facts.yml so the
# operator can sign in. The REST API key is what the wiring tasks authenticate
# with.
#
# DEGRADED PATH — every REST call below tolerates a non-2xx answer and reports it
# instead of failing the deploy. If the scripted setup cannot obtain a working API
# key, the role records everything it does know, prints the exact manual step, and
# leaves monitoring.token empty; tasks/wiring/uptime-kuma.yml already probes the
# API and skips monitor registration with a warning when it is unusable (slice 303).
# Monitoring is an add-on and must never be the thing that fails an app deploy.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the monitoring registry key):
#   kuma_url, kuma_api_key, kuma_admin_username, kuma_admin_password,
#   kuma_notification_id

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create project directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    mode: "0750"

# ── Compose ───────────────────────────────────────────────────────────────────
- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart uptime-kuma

- name: Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ uptime_kuma_project_dir }}"

- name: Start Uptime Kuma
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_project_dir }}"
    state: present
    remove_orphans: true

- name: Apply pending restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Wait for Uptime Kuma to answer
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: 200
  register: _kuma_up
  until: _kuma_up.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Admin account ─────────────────────────────────────────────────────────────
- name: Resolve admin credentials
  ansible.builtin.set_fact:
    _kuma_user: "{{ app_config.app.admin_user | default('admin') }}"
    _kuma_password: >-
      {{ homelabinfra_infra.monitoring.admin_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    _kuma_base: "http://localhost:{{ app_config.app.port }}"
  no_log: true

# ── Database backend ──────────────────────────────────────────────────────────
# Uptime Kuma 2 will not start its real server until it is told which database to
# use. Until that happens it runs a stub that serves its setup page for EVERY path,
# which is why an uninitialised instance answers 200 on / and 200 text/html on
# /api/monitors — it looks healthy and has no API at all. A deploy that only checks
# the container is up cannot tell the difference, and one sat like this for five days.
#
# `/api/entry-page` is the honest probe: {"type":"setup-database"} until the choice
# is made, {"type":"entryPage",...} afterwards.
- name: Determine which stage Uptime Kuma is at
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/api/entry-page"
    return_content: true
  register: _kuma_stage
  changed_when: false

# sqlite because this role gives Kuma no other database and the alternative
# (embedded MariaDB) is a second thing to back up for a monitor that holds no data
# worth restoring. The payload shape is exact: {} and {"dbType":"sqlite"} are both
# rejected as "Invalid dbConfig". Verified against 2.5.0.
- name: Choose the database backend
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/setup-database"
    method: POST
    body_format: json
    body:
      dbConfig:
        type: sqlite
    status_code: 200
  when: _kuma_stage.json.type | default('') == 'setup-database'
  changed_when: true

# Kuma restarts itself into the real server once the choice lands, so the port stops
# answering for a few seconds before it comes back on the other side of the stub.
- name: Wait for the real server to replace the setup stub
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/api/entry-page"
    return_content: true
  register: _kuma_stage_after
  until: _kuma_stage_after.json.type | default('') != 'setup-database'
  retries: 30
  delay: 5
  changed_when: false

# Stored BEFORE the account below is created, so a generated password is never applied
# without being recorded first. Merges rather than replaces, for the same reason as
# ntfy's pre-apply write: the API key is stored by a second write further down, this one
# does not know it, and a canonical write here would delete the key a previous run
# recorded. That matters more here than for ntfy — only a human can mint that key, so
# deleting it is not self-healing.
- name: Store the monitoring password before first-time setup
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/monitoring
    vault_item_merge: true
    vault_item_fields:
      provider: uptime_kuma
      instance: "{{ instance }}"
      host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
      admin_user: "{{ _kuma_user }}"
      admin_password: "{{ _kuma_password }}"
    vault_item_secret_fields: [admin_password]

# ── Admin account, over socket.io ─────────────────────────────────────────────
# There is no POST /setup in Kuma 2 — the route does not exist ("Cannot POST /setup"),
# and the previous implementation read that 404 as a benign "already initialised"
# signal, so every run reported success while no account was ever created.
#
# Account creation is a socket.io event. That does NOT require a socket.io client:
# engine.io v4's long-polling transport is plain HTTP, and the four requests below are
# the whole conversation. Keeping it in `uri` avoids putting a Python socket.io library
# on the controller, which is what slice 303 rejected v1 to avoid.
- name: Open a socket.io session
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling"
    return_content: true
  register: _kuma_sio_open
  changed_when: false

- name: Resolve the socket.io session id
  ansible.builtin.set_fact:
    _kuma_sid: >-
      {{ (_kuma_sio_open.content | regex_search('"sid":"([^"]+)"', '\1') | first) | default('') }}

- name: Assert the socket.io session opened
  ansible.builtin.assert:
    that: _kuma_sid | length > 0
    fail_msg: "Uptime Kuma did not return a socket.io session id; it may still be starting."

- name: Attach to the default socket.io namespace
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling&sid={{ _kuma_sid }}"
    method: POST
    body: "40"
    body_format: raw
    headers:
      Content-Type: "text/plain;charset=UTF-8"
  changed_when: false

# On connect Kuma announces which state it is in: `42["setup"]` when no account
# exists, `42["loginRequired"]` when one does. That is the idempotency signal, and it
# is read rather than inferred from an error code.
- name: Read what Uptime Kuma asks for on connect
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling&sid={{ _kuma_sid }}"
    return_content: true
  register: _kuma_sio_hello
  changed_when: false

- name: Record whether an admin account still has to be created
  ansible.builtin.set_fact:
    _kuma_needs_setup: "{{ _kuma_sio_hello.content is search('42\\[\"setup\"\\]') }}"

# `42` is an event, `0` is the acknowledgement id the reply comes back on. The
# password reaches the server only inside this body, so this one task is no_log.
- name: Create the admin account
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling&sid={{ _kuma_sid }}"
    method: POST
    body: '420{{ ["setup", _kuma_user, _kuma_password] | to_json }}'
    body_format: raw
    headers:
      Content-Type: "text/plain;charset=UTF-8"
  when: _kuma_needs_setup | bool
  changed_when: true
  no_log: true

# The acknowledgement carries no credential — `430[{"ok":true}]` or an error such as
# `430[{"ok":false,"msg":"passwordTooWeak"}]` — so it is safe to surface, and it is the
# only thing that distinguishes an account that was created from one that was not.
- name: Read the setup acknowledgement
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling&sid={{ _kuma_sid }}"
    return_content: true
  register: _kuma_sio_ack
  when: _kuma_needs_setup | bool
  changed_when: false

- name: Assert the admin account was created
  ansible.builtin.assert:
    that: _kuma_sio_ack.content is search('"ok":true')
    fail_msg: >-
      Uptime Kuma refused to create its admin account:
      {{ _kuma_sio_ack.content | default('no acknowledgement') | trim }}
  when: _kuma_needs_setup | bool

- name: Report the admin account state
  ansible.builtin.debug:
    msg: >-
      {{ 'Uptime Kuma admin account created — credentials are in the vault under
          homelab-infra/monitoring.' if _kuma_needs_setup | bool
         else 'Uptime Kuma already has an admin account; using the recorded password.' }}

# ── REST API key ──────────────────────────────────────────────────────────────
- name: Resolve the API key
  ansible.builtin.set_fact:
    # Order: an explicitly pasted key wins, then whatever the registry already
    # holds from an earlier deploy.
    _kuma_api_key: >-
      {{ app_config.app.api_key
         | default(homelabinfra_infra.monitoring.token | default(''), true) }}
  no_log: true

# Minting the first key was the one step this role could not do, on the belief that
# Kuma issues keys only to a browser session. It issues them to an authenticated
# SOCKET, and the long-polling transport used for account creation above reaches it
# just as well. Only runs when nothing already holds a key, so the key minted here is
# found in the vault on the next run and never duplicated.
#
# Every step tolerates failure: if any of it does not work the key stays empty and the
# manual instruction at the end of this block prints exactly as it did before. This is
# an attempt to remove a manual step, never a new way for a deploy to fail.
- name: Mint the first REST API key
  when: _kuma_api_key | length == 0
  block:
    - name: Open a socket.io session for the API key
      ansible.builtin.uri:
        url: "{{ _kuma_base }}/socket.io/?EIO=4&transport=polling"
        return_content: true
      register: _kuma_key_open
      changed_when: false

    - name: Resolve the API key socket.io session id
      ansible.builtin.set_fact:
        _kuma_key_sid: >-
          {{ (_kuma_key_open.content | regex_search('"sid":"([^"]+)"', '\1') | first)
             | default('') }}

    - name: Attach to the default namespace for the API key
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        method: POST
        body: "40"
        body_format: raw
        headers:
          Content-Type: "text/plain;charset=UTF-8"
      changed_when: false

    - name: Drain the connect events
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        return_content: true
      changed_when: false

    # Authenticates the socket itself; the ack carries a JWT that nothing here needs,
    # because every later event on this same socket is already authorised.
    - name: Sign in over the socket
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        method: POST
        body: >-
          420{{ ["login", {"username": _kuma_user, "password": _kuma_password}] | to_json }}
        body_format: raw
        headers:
          Content-Type: "text/plain;charset=UTF-8"
      changed_when: false
      no_log: true

    - name: Read the sign-in acknowledgement
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        return_content: true
      register: _kuma_login_ack
      changed_when: false

    - name: Assert the sign-in succeeded
      ansible.builtin.assert:
        that: _kuma_login_ack.content is search('"ok":true')
        fail_msg: >-
          Uptime Kuma rejected the recorded admin credentials:
          {{ _kuma_login_ack.content | default('no acknowledgement') | trim }}

    # `expires: null` because a key that silently expires takes monitor registration
    # down months later with no deploy to correlate it against.
    - name: Create the API key
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        method: POST
        body: >-
          421{{ ["addAPIKey", {"name": uptime_kuma_api_key_name,
                               "expires": None, "active": true}] | to_json }}
        body_format: raw
        headers:
          Content-Type: "text/plain;charset=UTF-8"
      changed_when: true

    - name: Read the API key acknowledgement
      ansible.builtin.uri:
        url: "{{ _kuma_key_url }}"
        return_content: true
      register: _kuma_key_ack
      changed_when: false
      no_log: true

    # Kuma reveals the key exactly once, at creation — like a PBS token. If it is not
    # captured here it cannot be read back, and the only recovery is to delete the key
    # in the UI and re-run.
    # Captured under its own name, not straight into _kuma_api_key. A block-level
    # `when` is evaluated per task at that task's runtime, so assigning the variable
    # the condition tests would switch off every remaining task in this block.
    - name: Capture the minted key
      ansible.builtin.set_fact:
        _kuma_minted_key: >-
          {{ (_kuma_key_ack.content | regex_search('"key":"([^"]+)"', '\1') | first)
             | default('') }}
      no_log: true
  rescue:
    - name: Report that minting the API key did not work
      ansible.builtin.debug:
        msg: >-
          Could not mint an Uptime Kuma API key automatically; falling back to the
          manual step below. The deploy is unaffected.
  vars:
    _kuma_key_url: >-
      {{ _kuma_base }}/socket.io/?EIO=4&transport=polling&sid={{ _kuma_key_sid | default('') }}

- name: Adopt a freshly minted key
  ansible.builtin.set_fact:
    _kuma_api_key: "{{ _kuma_minted_key }}"
  when: _kuma_minted_key | default('') | length > 0
  no_log: true

- name: Report the key's provenance
  ansible.builtin.debug:
    msg: >-
      {{ 'Uptime Kuma REST API key minted this run and recorded in the vault.'
         if _kuma_minted_key | default('') | length > 0
         else ('Using the Uptime Kuma API key already on record.'
               if _kuma_api_key | length > 0
               else 'Uptime Kuma has no API key; see the one-time step below.') }}

- name: Probe the REST API with the resolved key
  ansible.builtin.uri:
    url: "{{ _kuma_base }}/api/monitors"
    method: GET
    headers:
      Authorization: "Bearer {{ _kuma_api_key }}"
      Accept: "application/json"
    status_code: [200, 401, 403, 404]
    timeout: 10
  register: _kuma_probe
  failed_when: false
  changed_when: false
  no_log: true
  when: _kuma_api_key | length > 0

# The content type is load-bearing, not belt-and-braces: Uptime Kuma serves its Vue front
# end from a catch-all route, so every unmatched path answers 200 with index.html. Checking
# the status alone reports a REST API that is not there. Verified on 2.5.0 — GET
# /api/monitors is 200 text/html and POST /api/monitors is "404 Cannot POST".
- name: Record whether the REST API is usable
  ansible.builtin.set_fact:
    _kuma_api_usable: >-
      {{ (_kuma_probe.status | default(0)) == 200
         and 'json' in (_kuma_probe.content_type | default('')) }}

- name: Store and verify the monitoring API key
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/monitoring
    vault_item_fields:
      provider: uptime_kuma
      instance: "{{ instance }}"
      host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
      token: "{{ _kuma_api_key }}"
      admin_user: "{{ _kuma_user }}"
      admin_password: "{{ _kuma_password }}"
    vault_item_secret_fields: [token, admin_password]
  when: _kuma_api_key | length > 0

# Only when minting genuinely did not produce a key. It is NOT conditioned on the REST
# probe: that probe fails even with a perfectly good key, because the monitor REST API
# it looks for does not exist in any Uptime Kuma version. Telling an operator to go and
# create a key they already have is worse than saying nothing.
- name: Report the manual API key step
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════════"
      - "Uptime Kuma is deployed but has no API key, and minting one automatically"
      - "did not work. App deploys will skip monitor registration until it has one."
      - ""
      - "One-time step:"
      - "  1. Open https://{{ instance }}.{{ _kuma_domain }} and sign in as"
      - "     {{ _kuma_user }} (password is in homelab-infra/monitoring)."
      - "  2. Profile -> API Keys -> Add API Key, name it '{{ uptime_kuma_api_key_name }}'."
      - "  3. Add it as field token in Vaultwarden item homelab-infra/monitoring and"
      - "     re-run this deploy."
      - "════════════════════════════════════════════════════════════════════"
  vars:
    _kuma_domain: >-
      {{ homelabinfra_infra.domain
         | default(homelabinfra_config.infrastructure.domain, true) }}
  when: _kuma_api_key | length == 0

# Separate from the key: Uptime Kuma exposes no REST endpoint for monitor CRUD in any
# version, so a valid key still cannot register a monitor. Monitors are a socket.io
# event, the same transport this role now uses for setup and for the key. Reworking
# tasks/wiring/uptime-kuma.yml onto it is slice 303.
- name: Report that monitor registration is not yet wired
  ansible.builtin.debug:
    msg: >-
      Uptime Kuma has a working API key, but monitor registration still skips: its
      monitor API is socket.io-only, and the wiring tasks speak REST. Monitors must be
      added in the UI until slice 303 moves that wiring onto socket.io.
  when:
    - _kuma_api_key | length > 0
    - not (_kuma_api_usable | bool)

# ── Ntfy notification channel ─────────────────────────────────────────────────
# Attached to every monitor the wiring tasks create, so a DOWN event reaches the
# same Ntfy topic as everything else (CLAUDE.md feedback loop).
- name: Provision the Ntfy notification channel
  when:
    - _kuma_api_usable | bool
    - homelabinfra_infra.notifications is defined
    - homelabinfra_infra.notifications.provider | default('none') == 'ntfy'
  vars:
    _kuma_headers:
      Authorization: "Bearer {{ _kuma_api_key }}"
      Accept: "application/json"
  block:
    - name: List existing notification channels
      ansible.builtin.uri:
        url: "{{ _kuma_base }}/api/notifications"
        method: GET
        headers: "{{ _kuma_headers }}"
        status_code: [200, 404]
      register: _kuma_notifications
      failed_when: false
      changed_when: false
      no_log: true

    - name: Select the existing homelab-infra channel
      ansible.builtin.set_fact:
        _kuma_existing_notification: >-
          {{ ((_kuma_notifications.json.notifications
               | default(_kuma_notifications.json | default([]), true))
              | selectattr('name', 'defined')
              | selectattr('name', 'equalto', uptime_kuma_notification_name)
              | list | first | default({})) }}

    - name: Build the notification payload
      ansible.builtin.set_fact:
        # One dict expression keeps bools as bools in the JSON body
        # (.claude/specs/jinja-string-typing.md). Kuma nests provider settings in
        # `config` as a JSON string.
        _kuma_notification_payload: >-
          {{ {
               'name': uptime_kuma_notification_name,
               'type': 'ntfy',
               'isDefault': true,
               'applyExisting': true,
               'config': {
                 'name': uptime_kuma_notification_name,
                 'type': 'ntfy',
                 'ntfyserverurl': homelabinfra_infra.notifications.host,
                 'ntfytopic': homelabinfra_infra.notifications.topic | default('homelab'),
                 'ntfyPriority': 5,
                 'ntfyAuthenticationMethod': 'token',
                 'ntfyaccesstoken': homelabinfra_infra.notifications.token | default(''),
               } | to_json,
             } }}
      no_log: true

    - name: Create the notification channel
      ansible.builtin.uri:
        url: "{{ _kuma_base }}/api/notifications"
        method: POST
        headers: "{{ _kuma_headers }}"
        body_format: json
        body: "{{ _kuma_notification_payload }}"
        status_code: [200, 201]
      register: _kuma_notification_create
      when: _kuma_existing_notification.id is not defined
      failed_when: false
      changed_when: _kuma_notification_create.status | default(0) in [200, 201]
      no_log: true

    - name: Resolve the notification channel id
      ansible.builtin.set_fact:
        _kuma_notification_id: >-
          {{ _kuma_existing_notification.id
             | default(_kuma_notification_create.json.id
                       | default(_kuma_notification_create.json.notificationID | default('')),
                       true) }}

    - name: Report an unprovisioned notification channel
      ansible.builtin.debug:
        msg: >-
          Could not create the '{{ uptime_kuma_notification_name }}' notification
          channel (status
          {{ _kuma_notification_create.status | default('not attempted') }}).
          Monitors will still be registered; they just will not notify until the
          channel is added in the Uptime Kuma UI.
      when: _kuma_notification_id | default('') | string | length == 0

# ── Hand the endpoint and credentials back to the playbook ────────────────────
- name: Export the monitoring endpoint to the playbook
  ansible.builtin.set_fact:
    # Direct LAN URL, not https://<instance>.<domain>: during bootstrap neither DNS
    # nor a certificate exists for the public name yet, and the wiring tasks call
    # this API from the controller on every subsequent app deploy.
    kuma_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
    kuma_api_key: "{{ _kuma_api_key }}"
    kuma_admin_username: "{{ _kuma_user }}"
    kuma_admin_password: "{{ _kuma_password }}"
    kuma_notification_id: "{{ _kuma_notification_id | default('') }}"
  no_log: true
