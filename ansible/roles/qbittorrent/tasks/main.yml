---
# qbittorrent role — qBittorrent as a Docker container on a stack host. Called
# from Play 2 of playbooks/apps/qbittorrent.yml. Target: the media host.
#
# The media stack's torrent download client. Until this existed, the stack could
# find releases and could not fetch any of them: tasks/app-wiring/arr-download-client.yml
# has been complete since slice 504 and had nothing to wire.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name (e.g. qbittorrent)
#   homelabinfra_infra — infrastructure facts + the in-memory vault contract
#
# Exports (read by Play 3 to write the `media` registry key):
#   qbittorrent_media_kind, qbittorrent_media_host
#
# WHY THIS IS NOT THE servarr ROLE. qBittorrent is not a Servarr app: no
# config.xml, no API key, no <APP>__ environment overrides, and its API
# authenticates with a username and password over a session cookie. What it has
# in common with them is the deploy shape, which is the playbook's, not the
# role's.

- name: Resolve the app kind and storage
  ansible.builtin.import_tasks: main/resolve.yml

- name: Create directories and check the lab's storage
  ansible.builtin.import_tasks: main/storage.yml

- name: Resolve the WebUI credential and start the app
  ansible.builtin.import_tasks: main/start.yml

- name: Prove the WebUI credential works and repair it if not
  ansible.builtin.import_tasks: main/verify.yml

# ── Store the credential ──────────────────────────────────────────────────────
# Written under the same canonical item name wire-media-stack.yml reads, and with
# the field names tasks/app-wiring/arr-download-client.yml expects for a `userpass`
# client (ansible/vars/media-wiring.yml). Stored after the app has proven the
# credential works, never before.
- name: Store and verify the WebUI credentials
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      username: "{{ _qbt_user }}"
      password: "{{ _qbt_password }}"
    vault_item_secret_fields: [password]

# ── Hand the endpoint back to the playbook ────────────────────────────────────
- name: Export the media registry entry to the playbook
  ansible.builtin.set_fact:
    qbittorrent_media_kind: "{{ _qbt_kind }}"
    qbittorrent_media_host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
