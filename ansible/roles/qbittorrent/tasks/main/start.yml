---
# Phase of main.yml (Docker only): seed the config, enforce the peer port settings, start the
# app and wait for it. Imported in place; inputs are listed in main.yml.

# ── Configuration ─────────────────────────────────────────────────────────────
# force: false — seeded once, then qBittorrent's. See the template's header for
# why this file is not managed on every run.
- name: Seed qBittorrent.conf on first deploy
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ _qbt_conf }}"
    owner: "{{ app_config.app.puid | default(1000) }}"
    group: "{{ app_config.app.pgid | default(1000) }}"
    mode: "0640"
    force: false
  no_log: true      # the file carries the password hash

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qbittorrent_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart qbittorrent

# ── Run ───────────────────────────────────────────────────────────────────────
# policy: missing, matching roles/servarr and roles/observability — a deploy
# ensures the image is present, Watchtower is what moves it forward and reports
# it. Re-pulling :latest on every deploy would make each run a silent, unreviewed
# upgrade.
- name: Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ qbittorrent_project_dir }}"
    policy: missing
  changed_when: false

# qBittorrent owns its config after the initial seed, so a template edit alone
# would never update an existing instance. Check the two firewall-dependent
# settings before the first start: a legacy config must not run with unbounded
# peer source ports while this deploy is converging. Only stop an already-running
# app when one of the settings has drifted; the normal start below applies the
# corrected file before the playbook updates firewall access.
- name: Check qBittorrent's outgoing peer port settings
  community.general.ini_file:
    path: "{{ _qbt_conf }}"
    section: BitTorrent
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
    no_extra_spaces: true
  loop:
    - option: 'Session\OutgoingPortsMin'
      value: "{{ qbittorrent_peer_outgoing_ports_min }}"
    - option: 'Session\OutgoingPortsMax'
      value: "{{ qbittorrent_peer_outgoing_ports_max }}"
  loop_control:
    label: "{{ item.option }}"
  check_mode: true
  register: _qbt_peer_ports_check
  no_log: true

- name: Enforce qBittorrent's outgoing peer port settings when they drift
  when: _qbt_peer_ports_check.results | selectattr('changed') | list | length > 0
  block:
    - name: Stop qBittorrent before editing its configuration
      community.docker.docker_compose_v2:
        project_src: "{{ qbittorrent_project_dir }}"
        state: stopped

    - name: Write qBittorrent's outgoing peer port settings
      community.general.ini_file:
        path: "{{ _qbt_conf }}"
        section: BitTorrent
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
        owner: "{{ app_config.app.puid | default(1000) }}"
        group: "{{ app_config.app.pgid | default(1000) }}"
        mode: "0640"
        no_extra_spaces: true
      loop:
        - option: 'Session\OutgoingPortsMin'
          value: "{{ qbittorrent_peer_outgoing_ports_min }}"
        - option: 'Session\OutgoingPortsMax'
          value: "{{ qbittorrent_peer_outgoing_ports_max }}"
      loop_control:
        label: "{{ item.option }}"
      no_log: true

- name: Start the app
  community.docker.docker_compose_v2:
    project_src: "{{ qbittorrent_project_dir }}"
    state: present
    remove_orphans: true

- name: Apply pending restarts before the WebUI checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the WebUI to answer
  ansible.builtin.uri:
    url: "{{ _qbt_base }}/"
    status_code: [200, 401, 403]
  register: _qbt_up
  until: _qbt_up.status | default(0) in [200, 401, 403]
  retries: "{{ qbittorrent_webui_retries }}"
  delay: "{{ qbittorrent_webui_delay }}"
  changed_when: false
