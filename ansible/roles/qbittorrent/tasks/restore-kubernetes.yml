---
# Replace the target's config PVC through the shared Kubernetes recovery Job. The NFS
# media shares are not part of the archive; the target's init container writes its own
# WebUI credential into the restored config on the next start.
- name: qBittorrent Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: qBittorrent
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "{{ restore_target_config.app.puid }}:{{ restore_target_config.app.pgid }}"
      stop:
        - "{{ restore_target }}"
      describe: >-
        qBittorrent's configuration and resume data from its config volume; downloads are
        not included
      verify:
        - Open the qBittorrent URL, sign in with the vault credential and verify the restored torrents and settings.
