---
# Quiesce qBittorrent so its resume data and settings share one recovery point.
# Logs and download payloads never enter the application archive.

- name: qBittorrent backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      qBittorrent needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: qBittorrent backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _qbittorrent_backup_data
  changed_when: false

- name: qBittorrent backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _qbittorrent_backup_data.stat.exists
      - _qbittorrent_backup_data.stat.isdir
    fail_msg: >-
      qBittorrent data path {{ app_config.app.config_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: qBittorrent backup | Quiesce qBittorrent and archive its config to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ qbittorrent_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_backup_args: [--exclude, /qBittorrent/logs, --exclude, /logs, --exclude, /downloads]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: qBittorrent backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
