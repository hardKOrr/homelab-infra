---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before provisioning). Docker and
# native: hand deploy.yml the storage this app needs (app.mounts, default all of
# media_storage so imports hardlink) to attach to the guest. Kubernetes: resolve the same
# paths as the lab's existing NFS shares.
- name: qBittorrent | Hand deploy.yml the storage to attach to the guest
  ansible.builtin.set_fact:
    deploy_host_mounts: >-
      {{ app_config.app.mounts
         | default((app_config.media_storage | default({})).mounts | default([]), true) }}
    deploy_host_mounts_owner: "{{ (app_config.media_storage | default({})).owner | default({}) }}"
    # The forward named bittorrent-listen must target the port the client listens on.
    firewall_inbound_ports:
      bittorrent-listen: "{{ app_config.app.torrenting_port }}"
  when: app_config.hosting.method in ['docker', 'native']

- name: qBittorrent | Resolve the media shares for Kubernetes
  ansible.builtin.include_tasks: resolve-kubernetes-media.yml
  when: app_config.hosting.method == 'kubernetes'

- name: qBittorrent | Refuse an enabled BitTorrent inbound forward, which Kubernetes does not serve
  ansible.builtin.assert:
    that: >-
      app_config.firewall.inbound | default([]) | selectattr('enabled', 'defined')
      | selectattr('enabled') | list | length == 0
    fail_msg: Kubernetes serves only the WebUI; disable the firewall.inbound forward or use Docker.
    quiet: true
  when: app_config.hosting.method == 'kubernetes'
