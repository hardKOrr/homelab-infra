---
- name: qBittorrent restore | Use the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: qBittorrent restore | Use the config directory swap
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'docker'

- name: qBittorrent restore | Reject an unsupported restore hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('docker')) in ['docker', 'kubernetes']
    fail_msg: qBittorrent recovery supports hosting.method docker or kubernetes.
