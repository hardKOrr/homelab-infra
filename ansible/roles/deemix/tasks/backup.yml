---
# Quiesce Deemix and capture its settings and ARL as one recovery point.
# Downloads live outside config_path and never enter this application archive.

- name: Deemix backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Deemix needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Deemix backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _deemix_backup_data
  changed_when: false

- name: Deemix backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _deemix_backup_data.stat.exists
      - _deemix_backup_data.stat.isdir
    fail_msg: >-
      Deemix data path {{ app_config.app.config_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Deemix backup | Quiesce Deemix and archive its config to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ deemix_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: Deemix backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
