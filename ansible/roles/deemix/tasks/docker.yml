---
# The shared Compose deploy recreates the container when the Compose file or the Deezer
# ARL (main.yml) changed, in the same up that creates it, so a new install is never
# restarted mid first boot. Images are pulled only when missing; Watchtower moves them
# forward and reports it.
- name: Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ deemix_project_dir }}"
    compose_recreate: "{{ _dmx_arl_written.changed | default(false) }}"
