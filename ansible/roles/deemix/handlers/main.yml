---
- name: Restart deemix
  community.docker.docker_compose_v2:
    project_src: "{{ deemix_project_dir }}"
    state: present
    recreate: always
  when: app_config.hosting.method == 'docker'

- name: Restart native deemix
  ansible.builtin.systemd:
    name: "{{ instance }}"
    state: restarted
    daemon_reload: true
  listen: Restart deemix
  when: app_config.hosting.method == 'native'
