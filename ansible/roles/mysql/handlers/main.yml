---
- name: Restart MySQL
  ansible.builtin.systemd:
    name: "{{ app_config.app.service_name }}"
    state: restarted
  when: not (mysql_docker | bool)

- name: Restart MySQL container
  community.docker.docker_compose_v2:
    project_src: "{{ mysql_project_dir }}"
    state: restarted
  when: mysql_docker | bool
