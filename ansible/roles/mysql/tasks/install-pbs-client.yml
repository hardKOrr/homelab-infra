---
# Native MySQL recovery runs proxmox-backup-client on the database guest. The
# repository is signed with Proxmox's published release key.
- name: MySQL PBS client | Require a supported Debian release
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_release in ['bookworm', 'trixie']
    fail_msg: >-
      MySQL's PBS client repository supports Debian Bookworm and Trixie guests;
      this guest reports {{ ansible_distribution }} {{ ansible_distribution_release }}.

- name: MySQL PBS client | Select the Debian Bookworm signing key
  ansible.builtin.set_fact:
    _mysql_pbs_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
    _mysql_pbs_keyring: /usr/share/keyrings/proxmox-release-bookworm.gpg
  when: ansible_distribution_release == 'bookworm'

- name: MySQL PBS client | Select the Debian Trixie signing key
  ansible.builtin.set_fact:
    _mysql_pbs_key_url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg"
    _mysql_pbs_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when: ansible_distribution_release == 'trixie'

- name: MySQL PBS client | Install the Proxmox repository key
  ansible.builtin.get_url:
    url: "{{ _mysql_pbs_key_url }}"
    dest: "{{ _mysql_pbs_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: MySQL PBS client | Configure the signed client repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox-backup-client.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [signed-by={{ _mysql_pbs_keyring }}]
      {{ app_config.backup.client.repository }} {{ ansible_distribution_release }}
      {{ app_config.backup.client.component }}
