---
- name: MySQL restore | Resolve recovery identities and selected points
  ansible.builtin.set_fact:
    _mysql_restore_source_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _mysql_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}
    _mysql_restore_snapshot: "{{ restore_snapshot | default('') }}"
    _mysql_restore_prepoint: "{{ restore_pre_restore_point | default('') }}"
    _application_restore_complete: false

- name: MySQL restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mysql_restore_source_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - _mysql_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_overwrite is defined
      - (_mysql_restore_snapshot | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      MySQL restore needs its application-consistent recovery contract, safe backup ids,
      PBS, and a selected recovery point for overwrite=true.

- name: MySQL restore | Require the source point to belong to its backup group
  ansible.builtin.assert:
    that:
      - _mysql_restore_snapshot.startswith('host/' ~ _mysql_restore_source_backup_id ~ '/')
      - _mysql_restore_snapshot | length > ('host/' ~ _mysql_restore_source_backup_id ~ '/') | length
    fail_msg: >-
      The selected MySQL recovery point must belong to
      host/{{ _mysql_restore_source_backup_id }}/.
  when: _mysql_restore_snapshot | length > 0

- name: MySQL restore | Require the existing-target point to belong to its backup group
  ansible.builtin.assert:
    that:
      - _mysql_restore_prepoint.startswith('host/' ~ _mysql_restore_target_backup_id ~ '/')
      - _mysql_restore_prepoint | length > ('host/' ~ _mysql_restore_target_backup_id ~ '/') | length
    fail_msg: >-
      The independent MySQL pre-restore point must belong to
      host/{{ _mysql_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: MySQL restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: MySQL restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for MySQL. Deploy PBS before listing or restoring
      application data.

- name: MySQL restore | Require the installed PBS client
  ansible.builtin.stat:
    path: /usr/bin/proxmox-backup-client
  register: _mysql_restore_client
  changed_when: false

- name: MySQL restore | Require the PBS client binary
  ansible.builtin.assert:
    that: _mysql_restore_client.stat.exists and _mysql_restore_client.stat.isreg
    fail_msg: >-
      MySQL has no installed PBS client. Deploy the instance with the current MySQL role
      before requesting an application restore.

- name: MySQL restore | List source recovery points in plan mode
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - list
      - "host/{{ _mysql_restore_source_backup_id }}"
      - --output-format
      - text
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _mysql_restore_snapshots
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - not (restore_overwrite | bool)
    - _mysql_restore_snapshot | length == 0

- name: MySQL restore | Report a failed snapshot listing
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _mysql_restore_snapshots }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: MySQL restore | PBS snapshot listing failed
  when:
    - _mysql_restore_snapshots is defined
    - not (_mysql_restore_snapshots.skipped | default(false) | bool)

- name: MySQL restore | Show source recovery points in plan mode
  ansible.builtin.debug:
    msg: >-
      PBS recovery points for host/{{ _mysql_restore_source_backup_id }}:
      {{ _mysql_restore_snapshots.stdout }}
  when:
    - not (restore_overwrite | bool)
    - _mysql_restore_snapshot | length == 0

- name: MySQL restore | Verify the selected recovery archive
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _mysql_restore_snapshot }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _mysql_restore_source_files
  failed_when: false
  changed_when: false
  no_log: true
  when: _mysql_restore_snapshot | length > 0

- name: MySQL restore | Report an unavailable source archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _mysql_restore_source_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: MySQL restore | selected PBS point is unavailable
  when: _mysql_restore_source_files is defined

- name: MySQL restore | Require the selected logical archive
  ansible.builtin.assert:
    that: "'mysql.pxar' in _mysql_restore_source_files.stdout"
    fail_msg: >-
      Recovery point {{ _mysql_restore_snapshot }} lacks MySQL's logical archive; the
      current instance has not been changed.
  when: _mysql_restore_snapshot | length > 0

- name: MySQL restore | Verify the independent pre-restore archive
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _mysql_restore_prepoint }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _mysql_restore_prepoint_files
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: MySQL restore | Report an unavailable pre-restore archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _mysql_restore_prepoint_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: MySQL restore | independent pre-restore point is unavailable
  when:
    - _mysql_restore_prepoint_files is defined
    - not (_mysql_restore_prepoint_files.skipped | default(false) | bool)

- name: MySQL restore | Require the pre-restore logical archive
  ansible.builtin.assert:
    that: "'mysql.pxar' in _mysql_restore_prepoint_files.stdout"
    fail_msg: >-
      The independent MySQL pre-restore point lacks its logical archive; the current
      instance has not been changed.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: MySQL restore | Explain the selected recovery point in plan mode
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with overwrite=true and
      pre_restore_point={{ _mysql_restore_prepoint }} to apply
      {{ _mysql_restore_snapshot }} to this MySQL instance.
  when:
    - not (restore_overwrite | bool)
    - _mysql_restore_snapshot | length > 0

- name: MySQL restore | Create private restore staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-mysql-restore-"
  register: _mysql_restore_tmp
  when: restore_overwrite | bool

- name: MySQL restore | Apply the selected point with rollback protection
  when: restore_overwrite | bool
  block:
    - name: MySQL restore | Install the shared server recovery script
      ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/database/install-server-recovery.yml"

    - name: MySQL restore | Create private archive directories
      ansible.builtin.file:
        path: "{{ _mysql_restore_tmp.path }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [source, safety]

    - name: MySQL restore | Download the selected recovery archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _mysql_restore_snapshot }}"
          - mysql.pxar
          - "{{ _mysql_restore_tmp.path }}/source"
          - --allow-existing-dirs
          - "true"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_restore_source_download
      no_log: true
      changed_when: true

    - name: MySQL restore | Download the pre-restore safety archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _mysql_restore_prepoint }}"
          - mysql.pxar
          - "{{ _mysql_restore_tmp.path }}/safety"
          - --allow-existing-dirs
          - "true"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_restore_safety_download
      no_log: true
      changed_when: true
      when:
        - restore_destination | default('existing') == 'existing'
        - _mysql_restore_prepoint | length > 0

    - name: MySQL restore | Import the point and retain rollback state until verified
      ansible.builtin.command:
        argv: >-
          {{ ['python3', database_server_recovery_script, 'mysql', 'restore',
              _mysql_restore_tmp.path ~ '/source']
             + ([_mysql_restore_tmp.path ~ '/safety']
                if restore_destination | default('existing') == 'existing'
                   and _mysql_restore_prepoint | length > 0 else []) }}
      register: _mysql_restore_import
      changed_when: true

    - name: MySQL restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  always:
    - name: MySQL restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _mysql_restore_tmp.path }}"
        state: absent
      when: _mysql_restore_tmp.path is defined
