---
# Debian default-mysql-server is MariaDB; Ghost requires Oracle MySQL 8. The native server
# and the Docker host's client both come from the Oracle MySQL 8.4 LTS APT repository.
- name: MySQL | Require a supported Debian release
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_release in ['bookworm', 'trixie']
    fail_msg: >-
      The Oracle MySQL APT repository is configured for Debian Bookworm and Trixie;
      this guest reports {{ ansible_distribution }} {{ ansible_distribution_release }}.

- name: MySQL | Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: MySQL | Install APT repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg]
    state: present
    update_cache: false

- name: MySQL | Install Oracle repository signing key
  ansible.builtin.get_url:
    url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
    dest: /etc/apt/keyrings/mysql.asc
    mode: "0644"

- name: MySQL | Configure Oracle MySQL 8.4 LTS APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/mysql.asc]
      https://repo.mysql.com/apt/debian/ {{ ansible_distribution_release }} mysql-8.4-lts
    filename: mysql
    state: present
    update_cache: true

