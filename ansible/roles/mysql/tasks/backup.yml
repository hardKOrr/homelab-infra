---
# mysqldump holds MySQL's global read lock for one logical export of all schemas,
# including the grant tables. This makes every database and user grant one recovery unit.
- name: MySQL backup | Resolve the backup identity
  ansible.builtin.set_fact:
    _mysql_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: MySQL backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mysql_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      MySQL backup needs its application-consistent recovery contract, a safe backup id,
      and a configured PBS target.

- name: MySQL backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: MySQL backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for MySQL. Deploy PBS and retry; no local archive is
      treated as a recovery point.

- name: MySQL backup | Require the installed PBS client
  ansible.builtin.stat:
    path: /usr/bin/proxmox-backup-client
  register: _mysql_backup_client
  changed_when: false

- name: MySQL backup | Require the PBS client binary
  ansible.builtin.assert:
    that: _mysql_backup_client.stat.exists and _mysql_backup_client.stat.isreg
    fail_msg: >-
      MySQL has no installed PBS client. Deploy the instance with the current MySQL role
      before requesting an application backup.

- name: MySQL backup | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-mysql-backup-"
  register: _mysql_backup_tmp

- name: MySQL backup | Create and verify the logical recovery point
  block:
    - name: MySQL backup | Export all databases and grants consistently
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/sbin/homelab-mysql-recovery
          - backup
          - "{{ _mysql_backup_tmp.path }}"
      changed_when: true

    - name: MySQL backup | Read the existing recovery points
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - snapshot
          - list
          - "host/{{ _mysql_backup_id }}"
          - --output-format
          - json
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_backup_snapshots_before
      failed_when: false
      changed_when: false
      no_log: true

    - name: MySQL backup | Report an unreadable baseline recovery point listing
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mysql_backup_snapshots_before }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: MySQL backup | baseline recovery points could not be verified

    - name: MySQL backup | Validate the baseline recovery point listing
      ansible.builtin.assert:
        that:
          - (_mysql_backup_snapshots_before.stdout | from_json | type_debug) == 'list'
        fail_msg: MySQL backup could not parse the baseline PBS recovery point list.
      no_log: true

    - name: MySQL backup | Upload the logical archive to PBS
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - backup
          - "mysql.pxar:{{ _mysql_backup_tmp.path }}"
          - --backup-id
          - "{{ _mysql_backup_id }}"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_backup_upload
      failed_when: false
      changed_when: true
      no_log: true

    - name: MySQL backup | Report a failed PBS upload
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mysql_backup_upload }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: MySQL backup | PBS archive upload failed

    - name: MySQL backup | Verify and list the recovery points
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - snapshot
          - list
          - "host/{{ _mysql_backup_id }}"
          - --output-format
          - json
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_backup_snapshots
      failed_when: false
      changed_when: false
      no_log: true

    - name: MySQL backup | Report an unreadable recovery point listing
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mysql_backup_snapshots }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: MySQL backup | recovery points could not be verified

    - name: MySQL backup | Resolve the new recovery point
      ansible.builtin.set_fact:
        _mysql_backup_new_points: >-
          {{ (_mysql_backup_snapshots.stdout | from_json)
             | rejectattr('backup-time', 'in',
                 (_mysql_backup_snapshots_before.stdout | from_json
                  | map(attribute='backup-time') | map('int') | list)) | list }}
      no_log: true

    - name: MySQL backup | Require a new recovery point
      ansible.builtin.assert:
        that:
          - (_mysql_backup_snapshots.stdout | from_json | type_debug) == 'list'
          - _mysql_backup_new_points | length > 0
        fail_msg: >-
          MySQL backup completed without adding a recovery point to
          host/{{ _mysql_backup_id }}.
      no_log: true

    - name: MySQL backup | Record the verified recovery point
      ansible.builtin.set_fact:
        _mysql_backup_recovery_point: >-
          {{ 'host/' ~ _mysql_backup_id ~ '/' ~
             ('%Y-%m-%dT%H:%M:%SZ' | strftime(
               (_mysql_backup_new_points | sort(attribute='backup-time') | last)['backup-time'] | int,
               utc=true)) }}
      no_log: true

    - name: MySQL backup | Verify that PBS stored the logical archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - snapshot
          - files
          - "{{ _mysql_backup_recovery_point }}"
          - --output-format
          - json
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_backup_files
      failed_when: false
      changed_when: false
      no_log: true

    - name: MySQL backup | Report an unavailable recovery archive
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mysql_backup_files }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: MySQL backup | the new PBS recovery point is unavailable

    - name: MySQL backup | Require the logical archive in the recovery point
      ansible.builtin.assert:
        that: "'mysql.pxar' in _mysql_backup_files.stdout"
        fail_msg: >-
          Recovery point {{ _mysql_backup_recovery_point }} does not contain the MySQL
          logical archive.
      no_log: true

    - name: MySQL backup | Retain the two newest points and daily history
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - prune
          - "host/{{ _mysql_backup_id }}"
          - --keep-last
          - "2"
          - --keep-daily
          - "{{ app_config.backup.retention_days | default(14) | int }}"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _mysql_backup_prune
      failed_when: false
      changed_when: true
      no_log: true

    - name: MySQL backup | Report a failed retention update
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mysql_backup_prune }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: MySQL backup | PBS retention update failed

    - name: MySQL backup | Report the verified recovery point
      ansible.builtin.debug:
        msg: "MySQL recovery point {{ _mysql_backup_recovery_point }} is verified."

    - name: MySQL backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: MySQL backup | Remove private staging data
      ansible.builtin.file:
        path: "{{ _mysql_backup_tmp.path }}"
        state: absent
      when: _mysql_backup_tmp.path is defined
