---
# mysqldump holds MySQL's global read lock for one logical export of all schemas,
# including the grant tables. This makes every database and user grant one recovery unit.
- name: MySQL backup | Resolve the backup identity
  ansible.builtin.set_fact:
    _mysql_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: MySQL backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mysql_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      MySQL backup needs its application-consistent recovery contract, a safe backup id,
      and a configured PBS target.

# /var/tmp, because the PBS client's private tmpfs covers /tmp while it archives.
- name: MySQL backup | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: "{{ instance }}-mysql-backup-"
  register: _mysql_backup_tmp

- name: MySQL backup | Install the shared server recovery script
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/database/install-server-recovery.yml"

- name: MySQL backup | Create and verify the logical recovery point
  block:
    - name: MySQL backup | Export all databases and grants consistently
      ansible.builtin.command:
        argv:
          - python3
          - "{{ database_server_recovery_script }}"
          - mysql
          - backup
          - "{{ _mysql_backup_tmp.path }}"
      changed_when: true

    - name: MySQL backup | Upload the logical archive to PBS
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: native
        pbs_client_backup_id: "{{ _mysql_backup_id }}"
        pbs_client_archives:
          - name: mysql.pxar
            path: "{{ _mysql_backup_tmp.path }}"

    - name: MySQL backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: MySQL backup | Remove private staging data
      ansible.builtin.file:
        path: "{{ _mysql_backup_tmp.path }}"
        state: absent
      when: _mysql_backup_tmp.path is defined
