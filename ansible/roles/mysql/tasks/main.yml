---
# MySQL is a standalone backend, deliberately independent of application Compose files so
# its data, recovery path, and credentials remain explicit. It runs natively by default, or
# as the official image on a stack host (hosting.method: docker).
- name: MySQL | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: mysql_docker | bool

- name: MySQL | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: not (mysql_docker | bool)
