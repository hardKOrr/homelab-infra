---
# Debian default-mysql-server is MariaDB; Ghost requires Oracle MySQL 8.
- name: MySQL | Resolve configured guest memory
  ansible.builtin.import_tasks: ../../../tasks/database/resolve-guest-memory.yml

- name: MySQL | Resolve database memory settings
  ansible.builtin.import_tasks: resolve-memory.yml

- name: MySQL | Require a supported Debian release
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_release in ['bookworm', 'trixie']
    fail_msg: >-
      The Oracle MySQL APT repository is configured for Debian Bookworm and Trixie;
      this guest reports {{ ansible_distribution }} {{ ansible_distribution_release }}.

- name: MySQL | Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: MySQL | Install APT repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg]
    state: present
    update_cache: false

- name: MySQL | Install Oracle repository signing key
  ansible.builtin.get_url:
    url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
    dest: /etc/apt/keyrings/mysql.asc
    mode: "0644"

- name: MySQL | Configure Oracle MySQL 8.4 LTS APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/mysql.asc]
      https://repo.mysql.com/apt/debian/ {{ ansible_distribution_release }} mysql-8.4-lts
    filename: mysql
    state: present
    update_cache: true

# MySQL is a standalone backend, deliberately independent of application
# Compose files so its data, recovery path, and credentials remain explicit.
- name: MySQL | Install server and Python client
  ansible.builtin.apt:
    name: [mysql-server, python3-pymysql]
    state: present
    update_cache: true

- name: MySQL | Install the PBS client repository when this lab declares app backups
  ansible.builtin.include_tasks: install-pbs-client.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: MySQL | Install the PBS backup client
  ansible.builtin.apt:
    name: proxmox-backup-client
    state: present
    update_cache: true
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: MySQL | Install the shared server recovery script
  ansible.builtin.include_tasks: ../../../tasks/database/install-server-recovery.yml

- name: MySQL | Permit application-network listeners
  ansible.builtin.template:
    src: homelab-infra.cnf.j2
    dest: /etc/mysql/mysql.conf.d/z-homelab-infra.cnf
    mode: "0644"
  notify: Restart MySQL

- name: MySQL | Enable and start service
  ansible.builtin.systemd:
    name: "{{ app_config.app.service_name }}"
    state: started
    enabled: true

- name: MySQL | Apply listener changes before health check
  ansible.builtin.meta: flush_handlers

- name: MySQL | Verify local server readiness
  ansible.builtin.command:
    argv: [mysqladmin, "--socket=/var/run/mysqld/mysqld.sock", ping]
  changed_when: false
