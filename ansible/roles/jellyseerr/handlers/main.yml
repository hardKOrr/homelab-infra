---
- name: Restart jellyseerr
  community.docker.docker_compose_v2:
    project_src: "{{ jellyseerr_project_dir }}"
    state: present
    recreate: always
  when: not (jellyseerr_native | bool)

- name: Restart jellyseerr service
  ansible.builtin.systemd:
    name: "{{ instance }}"
    state: restarted
    daemon_reload: true
  when: jellyseerr_native | bool
