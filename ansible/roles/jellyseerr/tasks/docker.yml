---
# Jellyseerr on a Docker stack host (hosting.method: docker); Kubernetes has its own entry
# (kubernetes.yml) and native its own (native.yml). The role does not complete Jellyseerr's
# first-run wizard (see kubernetes.yml), so the deploy brings up an empty, persisted,
# backed-up app.

- name: Jellyseerr | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ jellyseerr_project_dir }}"
    compose_owner: "{{ app_config.app.puid }}"
    compose_group: "{{ app_config.app.pgid }}"
    compose_dirs:
      - "{{ app_config.app.config_path }}"
    compose_health:
      url: "http://127.0.0.1:{{ app_config.app.port }}/api/v1/status"
      retries: "{{ jellyseerr_http_retries }}"
      delay: "{{ jellyseerr_http_delay }}"
