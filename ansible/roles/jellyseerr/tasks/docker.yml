---
# Jellyseerr on a Docker stack host (hosting.method: docker); Kubernetes has its own entry
# (kubernetes.yml) and native its own (native.yml). The role does not complete Jellyseerr's first-run wizard — see
# kubernetes.yml for why — so the deploy brings up an empty, persisted, backed-up app.

- name: Jellyseerr | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_config.app.puid }}"
    group: "{{ app_config.app.pgid }}"
    mode: "0750"
  loop:
    - "{{ jellyseerr_project_dir }}"
    - "{{ app_config.app.config_path }}"

- name: Jellyseerr | Write the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyseerr_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart jellyseerr

- name: Jellyseerr | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ jellyseerr_project_dir }}"
    policy: missing
  changed_when: false

- name: Jellyseerr | Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ jellyseerr_project_dir }}"
    state: present
    remove_orphans: true

- name: Jellyseerr | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Jellyseerr | Wait for the application
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_config.app.port }}/api/v1/status"
    status_code: 200
  register: _jellyseerr_health
  retries: "{{ jellyseerr_http_retries }}"
  delay: "{{ jellyseerr_http_delay }}"
  until: _jellyseerr_health.status | default(0) == 200
  changed_when: false
