---
# Jellyseerr (Seerr) on a guest: Docker on a stack host (docker.yml) or natively on its own
# LXC or VM (native.yml). Kubernetes is kubernetes.yml, run from the playbook's localhost play.
- name: Jellyseerr | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('kubernetes') == 'docker'

- name: Jellyseerr | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method | default('kubernetes') == 'native'
