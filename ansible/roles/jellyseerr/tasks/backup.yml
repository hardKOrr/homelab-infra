---
# Stop Jellyseerr so its SQLite database and settings share one recovery point, and archive
# the config directory through the shared PBS client. Docker only; Kubernetes runs its CronJob.

- name: Jellyseerr backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Jellyseerr needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Jellyseerr backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _jellyseerr_backup_data
  changed_when: false

- name: Jellyseerr backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _jellyseerr_backup_data.stat.exists
      - _jellyseerr_backup_data.stat.isdir
    fail_msg: >-
      Jellyseerr data path {{ app_config.app.config_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Jellyseerr backup | Quiesce Jellyseerr and archive its config to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: "{{ 'native' if jellyseerr_native | bool else 'docker' }}"
    pbs_client_compose_project: "{{ jellyseerr_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: Jellyseerr backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
