---
# WordPress's application-consistent backup on a guest, run by
# playbooks/maintenance/backup-app.yml (Kubernetes runs the deployed CronJob instead). Docker
# runs the recovery helper the nightly cron runs (files/wordpress-recovery), so the
# on-demand point and the scheduled one come from one definition; native runs
# backup-native.yml. Both write database.pxar and content.pxar, so restore.yml serves either.
- name: WordPress backup | Run the scheduled recovery helper on Docker
  when: not (wordpress_native | bool)
  block:
    - name: WordPress backup | Run the recovery helper
      ansible.builtin.command:
        argv: ["{{ wordpress_recovery_script }}", --backup]
      environment:
        WORDPRESS_INSTANCE: "{{ instance }}"
      changed_when: true

    - name: WordPress backup | Mark the application backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true

- name: WordPress backup | Back up the native guest
  ansible.builtin.include_tasks: backup-native.yml
  when: wordpress_native | bool
