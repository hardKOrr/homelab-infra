---
# WordPress URLs and the administrator are target identity. Repair them through WP-CLI
# after the shared restore Job has loaded the database and replaced wp-content.
- name: WordPress Kubernetes restore | Re-key the restored site to the target
  ansible.builtin.include_tasks: kubernetes-cli-job.yml
  vars:
    wordpress_k8s_cli_mode: restore
    wordpress_k8s_instance: "{{ restore_target }}"
    wordpress_k8s_config: "{{ restore_target_config }}"
