---
# Remove App hook, run after the Compose project stops. WordPress's backup schedule and root-only
# recovery configuration live outside /opt/<instance>. Remove both on every removal, even
# when delete_data is false, so an unwired application cannot keep stopping the stack host
# and writing snapshots after it was removed.
- name: Remove WordPress recovery schedule
  ansible.builtin.cron:
    name: "homelab-infra WordPress backup {{ instance }}"
    cron_file: "homelab-infra-wordpress-{{ instance }}"
    state: absent

- name: Remove WordPress recovery configuration
  ansible.builtin.file:
    path: "/etc/homelab-infra/wordpress/{{ instance }}.env"
    state: absent
