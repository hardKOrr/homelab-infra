---
# Native method on an LXC or a VM: WordPress's release archive from wordpress.org
# (https://developer.wordpress.org/advanced-administration/before-install/howto-install/)
# under Apache with mod_php, and the pinned WP-CLI phar for first boot and restore repair.
# The release tree is replaced whole on a version change; its wp-content is a link to the
# durable directory under app.data_path and its wp-config.php is rendered here, so the
# recovery point (wp-content plus the database) matches the Docker method's.
- name: WordPress native | Assert the supported guest
  ansible.builtin.assert:
    that: ansible_facts.distribution_release in ['bookworm', 'noble']
    fail_msg: Native WordPress supports Debian 12 and Ubuntu 24.04 (PHP 8.2 or 8.3).

- name: WordPress native | Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - wordpress_pbs_available | default(false) | bool

- name: WordPress native | Install Apache, PHP and the extensions WordPress recommends
  ansible.builtin.apt:
    name: [ca-certificates, apache2, libapache2-mod-php, php-cli, php-mysql, php-curl, php-gd, php-intl, php-mbstring, php-xml, php-zip]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: WordPress native | Read the installed PHP version
  ansible.builtin.command:
    argv: [php, -r, "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"]
  register: _wordpress_php_version
  changed_when: false

- name: WordPress native | Configure PHP
  ansible.builtin.copy:
    dest: "/etc/php/{{ _wordpress_php_version.stdout }}/{{ item }}/conf.d/90-wordpress.ini"
    content: |
      date.timezone={{ homelabinfra_config.timezone | default('UTC') }}
      upload_max_filesize=64M
      post_max_size=64M
      memory_limit=256M
      expose_php=Off
    owner: root
    group: root
    mode: "0644"
  loop: [apache2, cli]
  notify: Restart WordPress

- name: WordPress native | Install the pinned WP-CLI
  ansible.builtin.get_url:
    url: "https://github.com/wp-cli/wp-cli/releases/download/v{{ app_config.app.native_cli_version }}/wp-cli-{{ app_config.app.native_cli_version }}.phar"
    dest: "{{ wordpress_native_cli }}"
    checksum: "sha256:{{ app_config.app.native_cli_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: WordPress native | Read the installed release
  ansible.builtin.slurp:
    src: "{{ wordpress_native_root }}/.release"
  register: _wordpress_native_release
  failed_when: false

- name: WordPress native | Install the pinned release
  when: >-
    _wordpress_native_release.content is not defined
    or (_wordpress_native_release.content | b64decode | trim) != app_config.app.native_version
  block:
    - name: WordPress native | Create the download directory
      ansible.builtin.file:
        path: "{{ wordpress_native_work_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: WordPress native | Download the release archive
      ansible.builtin.get_url:
        url: "https://wordpress.org/wordpress-{{ app_config.app.native_version }}.tar.gz"
        dest: "{{ wordpress_native_work_dir }}/wordpress-{{ app_config.app.native_version }}.tar.gz"
        checksum: "sha256:{{ app_config.app.native_sha256 }}"
        mode: "0600"

    - name: WordPress native | Clear a partial stage
      ansible.builtin.file:
        path: "{{ wordpress_native_root }}.stage"
        state: absent

    - name: WordPress native | Create the stage directory beside the install
      ansible.builtin.file:
        path: "{{ wordpress_native_root }}.stage"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: WordPress native | Extract the release into the stage
      ansible.builtin.unarchive:
        src: "{{ wordpress_native_work_dir }}/wordpress-{{ app_config.app.native_version }}.tar.gz"
        dest: "{{ wordpress_native_root }}.stage"
        remote_src: true
        extra_opts: [--strip-components=1]
        owner: www-data
        group: www-data

    - name: WordPress native | Mark the stage with its release
      ansible.builtin.copy:
        content: "{{ app_config.app.native_version }}\n"
        dest: "{{ wordpress_native_root }}.stage/.release"
        owner: www-data
        group: www-data
        mode: "0644"

    # The running install stays until the stage is complete; Apache stops only for the two
    # renames. State is not in the tree: wp-content is relinked and wp-config.php rewritten below.
    - name: WordPress native | Stop Apache for the swap
      ansible.builtin.systemd:
        name: apache2
        state: stopped

    - name: WordPress native | Swap the staged release into place
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          rm -rf "{{ wordpress_native_root }}.previous"
          if [ -e "{{ wordpress_native_root }}" ]; then mv "{{ wordpress_native_root }}" "{{ wordpress_native_root }}.previous"; fi
          mv "{{ wordpress_native_root }}.stage" "{{ wordpress_native_root }}"
        executable: /bin/bash
      changed_when: true

    - name: WordPress native | Drop the previous release
      ansible.builtin.file:
        path: "{{ wordpress_native_root }}.previous"
        state: absent

# The release's own wp-content (default themes) seeds the durable directory once; an
# existing one, such as a restored point, is never overwritten.
- name: WordPress native | Link wp-content to the durable directory
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      link="{{ wordpress_native_root }}/wp-content"
      target="{{ wordpress_content_path }}"
      if [ -L "$link" ]; then
        [ "$(readlink "$link")" = "$target" ] && exit 0
        rm "$link"
      elif [ -e "$link" ]; then
        mkdir -p "$target"
        cp -an "$link"/. "$target"/
        rm -rf "$link"
      fi
      mkdir -p "$target"
      chown -R www-data:www-data "$target"
      ln -s "$target" "$link"
      chown -h www-data:www-data "$link"
      echo changed
    executable: /bin/bash
  register: _wordpress_native_link
  changed_when: "'changed' in _wordpress_native_link.stdout"

# One-time random keys outside the release tree, so a version change keeps sessions.
- name: WordPress native | Generate the authentication keys once
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 027
      php -r '$o="<?php\n"; foreach(["AUTH_KEY","SECURE_AUTH_KEY","LOGGED_IN_KEY","NONCE_KEY","AUTH_SALT","SECURE_AUTH_SALT","LOGGED_IN_SALT","NONCE_SALT"] as $k) $o.="define(\"$k\", \"".bin2hex(random_bytes(32))."\");\n"; echo $o;' > "{{ wordpress_native_keys }}"
      chown root:www-data "{{ wordpress_native_keys }}"
    creates: "{{ wordpress_native_keys }}"
    executable: /bin/bash
  no_log: true

- name: WordPress native | Render wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wordpress_native_root }}/wp-config.php"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true
  notify: Restart WordPress

- name: WordPress native | Listen on the application port only
  ansible.builtin.copy:
    dest: /etc/apache2/ports.conf
    content: "Listen {{ app_config.app.port }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart WordPress

- name: WordPress native | Render the Apache site
  ansible.builtin.template:
    src: wordpress-apache.conf.j2
    dest: /etc/apache2/sites-available/wordpress.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart WordPress

- name: WordPress native | Enable the rewrite and headers modules and the site; drop the default site
  ansible.builtin.file:
    path: "/etc/apache2/{{ item.path }}"
    src: "{{ item.src | default(omit) }}"
    state: "{{ item.state }}"
  loop:
    - {path: mods-enabled/rewrite.load, state: link, src: ../mods-available/rewrite.load}
    - {path: mods-enabled/headers.load, state: link, src: ../mods-available/headers.load}
    - {path: sites-enabled/wordpress.conf, state: link, src: ../sites-available/wordpress.conf}
    - {path: sites-enabled/000-default.conf, state: absent}
  loop_control:
    label: "{{ item.path }}"
  notify: Restart WordPress

- name: WordPress native | Enable and start Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true

- name: WordPress native | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: WordPress native | Install the restart and log helpers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart apache2
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        exec tail -n "${1:-50}" /var/log/apache2/error.log
  loop_control:
    label: "{{ item.name }}"
