---
# Docker method: the Compose project, its environment file and the first start.
# The shared Compose deploy renders the environment file with the project and recreates
# it when either changed, in the same up that creates it, so a new install's first core
# extraction is never interrupted by a restart.
- name: WordPress | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ wordpress_project_dir }}"
    compose_files:
      - src: wordpress.env.j2
        dest: "{{ wordpress_env_file }}"
        mode: "0600"
    compose_secrets: "{{ [app_config.app.database_password | default('')] | select | list }}"
