---
# Restore App hook, run on localhost once the restore target is resolved: the app_config
# the guest restore gets, with data_path (wp-content's parent) rebased onto the target.
# `instance` stays the source there, so restore-guest.yml names target paths explicitly.
- name: WordPress restore | Rebase the target's data_path
  ansible.builtin.include_tasks: ../../../tasks/recovery/rebase-target-path.yml
  vars:
    restore_rebase_key: data_path
    restore_rebase_instance: true
