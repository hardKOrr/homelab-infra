---
- name: WordPress | Create project and durable data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # Natively the web user must traverse it to reach the data path below it.
    - {path: "{{ wordpress_project_dir }}", owner: root, group: root, mode: "{{ '0755' if wordpress_native | bool else '0750' }}"}
    # The pinned Apache image serves PHP as www-data (uid/gid 33). The bind-mounted
    # WordPress tree must let that user read core files and write uploads.
    - {path: "{{ app_config.app.data_path }}", owner: "33", group: "33", mode: "0750"}
