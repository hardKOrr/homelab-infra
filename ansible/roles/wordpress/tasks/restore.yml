---
# Restore WordPress's named database and wp-content from one PBS point (database.pxar,
# content.pxar), possibly another instance's. Run by playbooks/maintenance/restore-app.yml.
# On Kubernetes the shared recovery Job replaces them (restore-kubernetes.yml); on the
# Docker host or the native guest the shared swap does (restore-guest.yml). WordPress core
# and wp-config.php come from the target's pinned image and environment, never the point,
# so a point from another instance is safe; the target's URL and administrator are then
# repaired. A plan lists or previews the point and changes nothing; an overwrite needs a
# distinct pre-restore point of the target, taken within the last hour, and a failure
# after the stop puts the original wp-content and database back and starts WordPress.
#
# restore-inputs.yml resolves restore_target_fqdn, the target's published name.

- name: WordPress restore | Use the Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method | default('docker') == 'kubernetes'

- name: WordPress restore | Use the Docker or native swap
  ansible.builtin.include_tasks: restore-guest.yml
  when: app_config.hosting.method | default('docker') in ['docker', 'native']
