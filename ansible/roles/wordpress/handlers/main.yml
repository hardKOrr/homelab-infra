---
- name: Restart WordPress
  community.docker.docker_compose_v2:
    project_src: "{{ wordpress_project_dir }}"
    state: restarted
  # A container Start service just created or recreated already runs the new files, and
  # restarting it would interrupt a new install's first core extraction.
  when:
    - not (wordpress_native | bool)
    - not (_wordpress_start.changed | default(false))

- name: Restart native WordPress
  ansible.builtin.systemd:
    name: apache2
    state: restarted
  listen: Restart WordPress
  when: wordpress_native | bool
