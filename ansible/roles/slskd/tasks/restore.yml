---
# Kubernetes replaces the /app PVC through the shared Job; Docker and native replace the
# app directory through the shared swap (restore-guest.yml).
- name: slskd restore | Require a supported hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('docker')) in ['docker', 'native', 'kubernetes']
    fail_msg: slskd application recovery supports hosting.method docker, native or kubernetes.

- name: slskd restore | Use the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: slskd restore | Use the shared guest swap
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) in ['docker', 'native']
