---
# Included by main.yml for hosting.method docker: write the Compose project and start it.
# storage.yml has already prepared the directories and the lab storage. Inputs are set in
# main.yml.

# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot. Its
# render stays out of the log: the file carries the Soulseek password and the API key.
# policy missing, as everywhere: Watchtower moves the image forward and reports it.
- name: Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ slskd_project_dir }}"
    compose_secrets: >-
      {{ [_slskd_soulseek_password, _slskd_api_key, _slskd_web_password | default('')]
         | select | list }}
