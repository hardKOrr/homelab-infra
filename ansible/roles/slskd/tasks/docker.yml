---
# Included by main.yml for hosting.method docker: write the Compose project and start it.
# storage.yml has already prepared the directories and the lab storage. Inputs are set in
# main.yml.

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ slskd_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart slskd
  no_log: true   # the rendered file carries the Soulseek password and the API key

# ── Run ───────────────────────────────────────────────────────────────────────
# policy: missing, matching roles/deemix and roles/sabnzbd — a deploy ensures
# the image is present, Watchtower is what moves it forward and reports it.
- name: Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ slskd_project_dir }}"
    policy: missing
  changed_when: false

- name: Start the app
  community.docker.docker_compose_v2:
    project_src: "{{ slskd_project_dir }}"
    state: present
    remove_orphans: true

- name: Apply pending restarts before the checks
  ansible.builtin.meta: flush_handlers

