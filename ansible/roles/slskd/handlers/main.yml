---
- name: Restart slskd
  community.docker.docker_compose_v2:
    project_src: "{{ slskd_project_dir }}"
    state: present
    recreate: always
  when: not (slskd_native | bool)

- name: Restart native slskd
  ansible.builtin.systemd:
    name: "{{ slskd_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart slskd
  when: slskd_native | bool
