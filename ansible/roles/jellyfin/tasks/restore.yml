---
# Restore the complete Jellyfin config directory, one application-consistent recovery unit,
# through the shared swap. The restored database must authenticate the source account and
# answer the library API before the restore completes.
- name: Jellyfin restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - >-
        not (restore_overwrite | bool)
        or restore_source_jellyfin_user | default('') | length > 0
      - >-
        not (restore_overwrite | bool)
        or restore_source_jellyfin_password | default('') | length > 0
      - >-
        not (restore_overwrite | bool)
        or (restore_destination | default('existing') != 'existing')
        or (restore_pre_restore_point | default('', true) | length > 0
            and restore_pre_restore_point != restore_snapshot)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Jellyfin restore needs its PBS-backed recovery contract and source account.
      Keep overwrite=false to list snapshots; replacing an existing target also
      requires an independent pre_restore_point.

- name: Jellyfin restore | Preview or replace the config directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.config_path }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ instance }}"]
    recovery_swap_compose_project: "{{ jellyfin_project_dir }}"
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/System/Info/Public"
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"
