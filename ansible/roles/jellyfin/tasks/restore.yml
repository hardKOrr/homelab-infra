---
# Restore the complete Jellyfin config, one application-consistent recovery unit: the target's
# config PVC through the shared Kubernetes recovery Job, or its config directory through
# the shared swap. The restored database must authenticate the source account and answer
# the library API before the restore completes.
- name: Jellyfin restore | Use the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: Jellyfin restore | Use the Docker restore swap
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'docker'

- name: Jellyfin restore | Reject an unsupported restore hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('docker')) in ['docker', 'kubernetes']
    fail_msg: >-
      Jellyfin recovery supports hosting.method docker or kubernetes; refusing to mutate a
      target hosted by an unsupported method.
