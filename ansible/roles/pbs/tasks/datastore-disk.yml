---
# Mount one explicitly declared PBS datastore volume. Only create mode may initialise
# a blank managed disk. Reuse requires snapshot data; attach requires an existing
# filesystem but allows a newly enabled second copy to be empty before its first sync.

- name: PBS datastore disk | Resolve and initialise the device
  ansible.builtin.import_tasks: datastore-disk/device.yml

- name: PBS datastore disk | Check the paths and stage the disk
  ansible.builtin.import_tasks: datastore-disk/stage.yml

- name: PBS datastore disk | Copy the old datastore to the disk
  ansible.builtin.import_tasks: datastore-disk/copy.yml

- name: PBS datastore disk | Mount the disk at the datastore path
  ansible.builtin.import_tasks: datastore-disk/mount.yml
