---
# Restore PBS's configuration volume (users, tokens, certificate, datastore registration)
# from one PBS recovery point through the shared Kubernetes recovery Job. The datastore
# volume holds the backups themselves and is never archived or replaced.
#
# Carry the current platform token and TLS identity into the restored configuration
# before replacing the volume. PVE, Vaultwarden and backup clients keep using them.
- name: PBS Kubernetes restore | Restore through the shared recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Proxmox Backup Server
      archives:
        - name: config
          claim: "{{ restore_target }}-config"
          owner: "{{ pbs_backup_uid }}:{{ pbs_backup_uid }}"
      # The recovery point lives in this PBS: stage it before the pod stops.
      stage_first: true
      before_replace: |
        test -f /volumes/config/.restore-stage/user.cfg
        apt-get install -y -qq --no-install-recommends python3 >/dev/null
        python3 - /volumes/config /volumes/config/.restore-stage {{ homelabinfra_infra.backups.api_token_id | quote }} <<'PBS_PRESERVE_AUTH'
        {{ lookup('ansible.builtin.file', role_path ~ '/files/preserve-auth.py') }}
        PBS_PRESERVE_AUTH
      stop:
        - "{{ restore_target }}"
      describe: >-
        the {{ restore_target }}-config volume (users, API tokens, certificate and datastore
        registration); the datastore volume is kept
      verify:
        - Open https://{{ restore_target }}.<estate domain>/ and check that the datastore lists its existing backups.
