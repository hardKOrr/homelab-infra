---
# Docker PBS: archive the configuration directory (users, tokens, certificates, datastore
# registration) live. PBS is not stopped, because the backup target may be this very PBS;
# its config files are replaced atomically. The datastore holds the backups and is retained.
- name: PBS backup | Resolve the recovery identity
  ansible.builtin.set_fact:
    _pbs_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: PBS backup | Assert the Docker recovery contract
  ansible.builtin.assert:
    that:
      - app_config.hosting.method | default('native') == 'docker'
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _pbs_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      PBS application backup is the Docker method's configuration archive and needs a
      configured PBS target and a safe backup id.

- name: PBS backup | Require the configuration directory
  ansible.builtin.stat:
    path: "{{ pbs_project_dir }}/etc/user.cfg"
  register: _pbs_backup_user_cfg
  changed_when: false

- name: PBS backup | Require the user configuration
  ansible.builtin.assert:
    that: _pbs_backup_user_cfg.stat.isreg | default(false)
    fail_msg: PBS user.cfg is missing; refusing to create an incomplete recovery point.

- name: PBS backup | Archive the configuration to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_backup_id: "{{ _pbs_backup_id }}"
    pbs_client_archives:
      - name: config.pxar
        path: "{{ pbs_project_dir }}/etc"

- name: PBS backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
