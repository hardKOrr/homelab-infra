---
# Docker only: the community image ships admin@pbs with a publicly documented password.
# Replace it with a generated one kept in Vaultwarden (homelab-infra/apps/<instance>)
# before anything else uses the API. A repeat Deploy reuses the stored password, finds it
# already authenticates and changes nothing.
- name: PBS admin | Resolve the managed password
  ansible.builtin.set_fact:
    _pbs_admin_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).admin_password
         | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: PBS admin | Check whether the managed password already authenticates
  delegate_to: "{{ pbs_exec_host | default(omit) }}"
  ansible.builtin.uri:
    url: "{{ pbs_api_base }}/api2/json/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ pbs_admin_id }}"
      password: "{{ _pbs_admin_password }}"
    validate_certs: false
    status_code: [200, 401]
  register: _pbs_admin_check
  changed_when: false
  no_log: true

- name: PBS admin | Store the managed password in Vaultwarden before applying it
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: pbs
      instance: "{{ instance }}"
      username: "{{ pbs_admin_id }}"
      admin_password: "{{ _pbs_admin_password }}"
    vault_item_secret_fields: [admin_password]
  when: _pbs_admin_check.status != 200
  no_log: true

- name: PBS admin | Authenticate with the image's default password for rotation
  delegate_to: "{{ pbs_exec_host | default(omit) }}"
  ansible.builtin.uri:
    url: "{{ pbs_api_base }}/api2/json/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ pbs_admin_id }}"
      password: pbspbs
    validate_certs: false
  register: _pbs_admin_default_ticket
  when: _pbs_admin_check.status != 200
  changed_when: false
  no_log: true

# PBS 4.2 ignores user update --password. Changing a password requires a ticket and
# confirmation with the current password when the authenticated user is admin@pbs.
- name: PBS admin | Replace the image's default password
  delegate_to: "{{ pbs_exec_host | default(omit) }}"
  ansible.builtin.uri:
    url: "{{ pbs_api_base }}/api2/json/access/password"
    method: PUT
    headers:
      Cookie: "PBSAuthCookie={{ _pbs_admin_default_ticket.json.data.ticket }}"
      CSRFPreventionToken: "{{ _pbs_admin_default_ticket.json.data.CSRFPreventionToken }}"
    body_format: form-urlencoded
    body:
      userid: "{{ pbs_admin_id }}"
      password: "{{ _pbs_admin_password }}"
      confirmation-password: pbspbs
    validate_certs: false
  when: _pbs_admin_check.status != 200
  changed_when: true
  no_log: true

- name: PBS admin | Verify the managed password after rotation
  delegate_to: "{{ pbs_exec_host | default(omit) }}"
  ansible.builtin.uri:
    url: "{{ pbs_api_base }}/api2/json/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ pbs_admin_id }}"
      password: "{{ _pbs_admin_password }}"
    validate_certs: false
  when: _pbs_admin_check.status != 200
  changed_when: false
  no_log: true

- name: PBS admin | Require the default password to be refused
  delegate_to: "{{ pbs_exec_host | default(omit) }}"
  ansible.builtin.uri:
    url: "{{ pbs_api_base }}/api2/json/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ pbs_admin_id }}"
      password: pbspbs
    validate_certs: false
    status_code: [401]
  changed_when: false
  no_log: true
