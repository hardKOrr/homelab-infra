---
# Bind a redeployed PBS to the volumes an earlier Remove retained for it. Remove clears the
# retained PV's claimRef, so a plain claim would bind any compatible Available volume or
# provision an empty one, and only the provisioner's directory name
# (`pvc-<uuid>_<namespace>_<claim>`) still says whose volume it was. Each claim that does
# not exist yet is matched to the one retained volume carrying its name; two candidates
# fail the Deploy rather than guess. A claim that already exists keeps its bound volume in the
# manifest: volumeName is immutable, and an apply that omitted it would try to clear it.
# Sets pbs_retained_volumes ({config|state|datastore: pv}).

- name: PBS Kubernetes volumes | Read the instance's existing claims
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace, "{{ k8s_namespace }}", get, pvc, -o, json]
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _pbs_k8s_claims
  changed_when: false

- name: PBS Kubernetes volumes | Note the volumes the existing claims are bound to
  ansible.builtin.set_fact:
    _pbs_k8s_bound: >-
      {{ dict((_pbs_k8s_claims.stdout | from_json)['items']
              | selectattr('spec.volumeName', 'defined')
              | map(attribute='metadata.name') | map('regex_replace', '^' ~ instance ~ '-', '')
              | zip((_pbs_k8s_claims.stdout | from_json)['items']
                    | selectattr('spec.volumeName', 'defined') | map(attribute='spec.volumeName'))) }}
    _pbs_k8s_claim_names: >-
      {{ (_pbs_k8s_claims.stdout | from_json)['items'] | map(attribute='metadata.name')
         | map('regex_replace', '^' ~ instance ~ '-', '') | list }}

- name: PBS Kubernetes volumes | Read the retained volumes
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/list-orphan-volumes.yml

- name: PBS Kubernetes volumes | Match each missing claim to its retained volume
  ansible.builtin.set_fact:
    _pbs_k8s_matches: >-
      {{ _pbs_k8s_matches | default({}) | combine({item: (k8s_orphan_volumes
           | selectattr('phase', 'in', ['Available', 'Released'])
           | selectattr('path', 'search', '_' ~ k8s_namespace ~ '_' ~ instance ~ '-' ~ item ~ '$')
           | map(attribute='name') | list)}) }}
  loop: "{{ ['config', 'state', 'datastore'] | reject('in', _pbs_k8s_claim_names) | list }}"

- name: PBS Kubernetes volumes | Refuse an ambiguous retained volume
  ansible.builtin.assert:
    that: item.value | length <= 1
    fail_msg: >-
      {{ item.value | length }} retained volumes ({{ item.value | join(', ') }}) match claim
      {{ instance }}-{{ item.key }}; PBS will not guess which holds its data. Reclaim the
      ones that are not wanted (playbooks/maintenance/reclaim-volume.yml) and Deploy again.
  loop: "{{ _pbs_k8s_matches | default({}) | dict2items }}"

# Remove clears the claimRef and returns; the PV controller makes the volume Available
# separately. A claim rendered in that gap would bind or provision another disk, so wait for
# the matching volume, and fail rather than bind past one that never becomes bindable.
- name: PBS Kubernetes volumes | Wait for a matching volume that is still being released
  ansible.builtin.command:
    argv: [k3s, kubectl, wait, "--for=jsonpath={.status.phase}=Available", "pv/{{ item.1 }}", --timeout=120s]
  delegate_to: "{{ k8s_api_host }}"
  become: true
  loop: "{{ _pbs_k8s_matches | default({}) | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}: {{ item.1 }}"
  changed_when: false

- name: PBS Kubernetes volumes | Require the retained datastore when the config says reuse
  ansible.builtin.assert:
    that: >-
      app_config.app.datastore_mode | default('create') != 'reuse'
      or 'datastore' not in (_pbs_k8s_matches | default({}))
      or _pbs_k8s_matches.datastore | length == 1
    fail_msg: datastore_mode is reuse, but no retained volume for {{ instance }}-datastore exists.

- name: PBS Kubernetes volumes | Name the volumes to bind
  ansible.builtin.set_fact:
    pbs_retained_volumes: >-
      {{ _pbs_k8s_bound | combine(dict(_pbs_k8s_matches | default({}) | dict2items | selectattr('value', 'ne', [])
              | map(attribute='key') | zip(_pbs_k8s_matches | default({}) | dict2items | selectattr('value', 'ne', [])
              | map(attribute='value') | map('first')))) }}
    _pbs_k8s_matches: {}
