---
# Restore the PBS configuration: Kubernetes through the shared recovery Job, Docker through
# the shared swap of its configuration directory.
- name: PBS restore | Use the Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) == 'kubernetes'

- name: PBS restore | Use the Docker configuration swap
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) == 'docker'
