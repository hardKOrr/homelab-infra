---
# Role-internal defaults — not user-facing. User-facing knobs live in
# vars/app-defaults/pbs.yml and config/apps/<instance>.yml.
pbs_service_name: proxmox-backup-proxy
pbs_apt_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
pbs_apt_keyring: /etc/apt/keyrings/proxmox-release.gpg
pbs_apt_repo_url: "http://download.proxmox.com/debian/pbs"
pbs_native: "{{ app_config.hosting.method | default('native') == 'native' }}"
# The API token belongs to root@pam on both methods, so backup groups written by one method
# stay writable by the other (PBS checks group ownership). The Docker image has no PAM; its
# only login is admin@pbs, whose password Deploy replaces (tasks/admin-password.yml).
pbs_auth_id: root@pam
pbs_admin_id: admin@pbs
pbs_project_dir: "/opt/{{ instance }}"
# proxmox-backup-manager runs inside the container on Docker, and in the pod on Kubernetes
# (kubectl on the cluster's API node: tasks/kubernetes.yml sets pbs_exec_host there, and
# the shared task files delegate their PBS commands and API calls to it).
pbs_manager_argv: >-
  {{ ['proxmox-backup-manager'] if pbs_native | bool
     else ['k3s', 'kubectl', '--namespace', k8s_namespace, 'exec', 'deployment/' ~ instance, '--',
           'proxmox-backup-manager']
     if app_config.hosting.method | default('native') == 'kubernetes'
     else ['docker', 'exec', instance, 'proxmox-backup-manager'] }}
# Where this task's PBS API is reached from (the guest itself, or the cluster node, which
# reaches the pod's Service address) and the address clients use.
pbs_api_base: "https://localhost:{{ app_config.app.port }}"
pbs_endpoint: "https://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
# The `backup` user's numeric id in the PBS image (and Debian), owner of the datastore.
pbs_backup_uid: 34
# The port PBS listens on inside the container; app.port is only the Service's.
pbs_container_port: 8007
