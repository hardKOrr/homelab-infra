---
# The Docker deployment remains n8n's default; native runs the n8n npm package on its own
# guest (native.yml). Both share the data layout, credentials and environment file.
- name: n8n | Create project directory
  ansible.builtin.file:
    path: "{{ n8n_project_dir }}"
    state: directory
    owner: root
    group: root
    # Natively the service user must traverse it: the default data path sits below it.
    # The environment file keeps its own 0600 mode.
    mode: "{{ '0755' if n8n_native | bool else '0750' }}"

- name: n8n | Create the native service user
  ansible.builtin.include_tasks: native-user.yml
  when: n8n_native | bool

- name: n8n | Create writable application data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "{{ n8n_native_user if n8n_native | bool else '1000' }}"
    group: "{{ n8n_native_user if n8n_native | bool else '1000' }}"
    mode: "0750"

- name: n8n | Link the native user folder's .n8n to the durable data path
  ansible.builtin.file:
    path: "{{ n8n_native_home }}/.n8n"
    src: "{{ app_config.app.data_path }}"
    state: link
    owner: "{{ n8n_native_user }}"
    group: "{{ n8n_native_user }}"
    follow: false
  when: n8n_native | bool

- name: n8n | Generate or reuse the encryption key
  ansible.builtin.set_fact:
    _n8n_encryption_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).encryption_key
         | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: n8n | Store application and database credentials in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: n8n
      instance: "{{ instance }}"
      encryption_key: "{{ _n8n_encryption_key }}"
      database_provider: "{{ app_config.app.database.provider }}"
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [encryption_key, database_password]
  no_log: true

- name: n8n | Render environment file
  ansible.builtin.template:
    src: n8n.env.j2
    dest: "{{ n8n_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: _n8n_env_written
  notify: Restart n8n

# The shared Compose deploy recreates the container when the Compose file or the
# environment file (written above for both methods) changed, in the same up that creates
# it, so a new install's first schema migration is never interrupted by a restart.
- name: n8n | Deploy on Docker
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ n8n_project_dir }}"
    compose_recreate: "{{ _n8n_env_written.changed }}"
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/healthz"
      retries: 60
  when: not (n8n_native | bool)

- name: n8n | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: n8n_native | bool
