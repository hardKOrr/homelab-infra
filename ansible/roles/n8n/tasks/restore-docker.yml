---
# Restore n8n's application-consistent PostgreSQL database and .n8n data tree through the
# shared swap. The restored database needs the source's encryption key, so the replaced
# hook gives it to the target; a failure after the stop puts the original data, database
# and key back and starts n8n.

- name: n8n restore | Resolve target database, backend, credential and key
  ansible.builtin.set_fact:
    _n8n_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _n8n_restore_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _n8n_restore_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _n8n_restore_database_name: "{{ app_config.app.database.name | default('') }}"
    _n8n_restore_data_path: "{{ app_config.app.data_path | default('') }}"
    _n8n_restore_target_encryption_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).encryption_key
         | default(app_config.app.encryption_key | default(''), true) }}
    _n8n_restore_source_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           (restore_source_database | default({})).get('instance', ''), {}) }}
  no_log: true

- name: n8n restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - _n8n_restore_database_backend.provider | default('') == 'postgresql'
      - _n8n_restore_database_backend.host | default('') | length > 0
      - _n8n_restore_database_backend.port | default(0) | int > 0
      - _n8n_restore_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _n8n_restore_database_user | length > 0
      - _n8n_restore_database_password | length > 0
      - restore_source_encryption_key | default('') | length > 0
      - _n8n_restore_target_encryption_key | length > 0
      - _n8n_restore_data_path is match('^/[^/].*')
      - _n8n_restore_data_path != '/'
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      n8n restore needs a target, named PostgreSQL backend, target database credential,
      source and target encryption keys, non-root data path, and a snapshot when
      overwrite=true.
  no_log: true

- name: n8n restore | Require a separate target database for a new destination
  ansible.builtin.assert:
    that:
      - restore_source_database is mapping
      - restore_source_database.instance | default('') | length > 0
      - restore_source_database.name | default('') | length > 0
      - _n8n_restore_source_backend.host | default('') | length > 0
      - _n8n_restore_source_backend.port | default(0) | int > 0
      - >-
        not (
          restore_source_database.name == _n8n_restore_database_name
          and _n8n_restore_source_backend.host == _n8n_restore_database_backend.host
          and (_n8n_restore_source_backend.port | int) == (_n8n_restore_database_backend.port | int)
        )
    fail_msg: >-
      A new n8n restore must use a target database name or PostgreSQL backend distinct from
      the source. Never let an isolated instance overwrite the source's named database.
  when: restore_destination == 'new'
  no_log: true

- name: n8n restore | Preview or replace the data directory and database
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [database.pxar, data.pxar]
    recovery_swap_paths:
      - path: "{{ _n8n_restore_data_path }}"
        source: data
        owner: 1000
        group: 1000
        mode: "0750"
    recovery_swap_database:
      config: "{{ app_config.app.database }}"
      dump: database/n8n.dump
    recovery_swap_stop_services: [n8n]
    recovery_swap_compose_project: "{{ n8n_project_dir }}"
    recovery_swap_replaced_hook: "{{ role_path }}/tasks/restore-replaced.yml"
    recovery_swap_rollback_hook: "{{ role_path }}/tasks/restore-rollback.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/healthz"

- name: n8n restore | Explain the read-only plan
  ansible.builtin.debug:
    msg:
      - "PLAN ONLY — nothing was changed."
      - >-
        A selected n8n snapshot contains database.pxar (named PostgreSQL database
        {{ _n8n_restore_database_name }}) and data.pxar ({{ _n8n_restore_data_path }}).
      - "Re-run with recovery_point=<snapshot> and overwrite=true only after verifying the target."
  when: not (restore_overwrite | bool)
