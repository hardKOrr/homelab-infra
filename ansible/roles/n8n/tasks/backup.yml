---
# Application-consistent n8n recovery artifact.
#
# n8n stores workflows, encrypted credentials, users and execution metadata in its named
# PostgreSQL database. The mounted .n8n tree remains part of the documented PostgreSQL
# deployment even with an external database, so capture it beside the logical dump. The
# encryption key is a Vaultwarden dependency and is verified independently; it is never
# printed or copied into the PBS artifact as evidence.

- name: n8n backup | Resolve the named PostgreSQL backend and credential
  ansible.builtin.set_fact:
    _n8n_backup_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _n8n_backup_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _n8n_backup_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _n8n_backup_database_name: "{{ app_config.app.database.name | default('') }}"
    _n8n_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _n8n_backup_encryption_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).encryption_key
         | default(app_config.app.encryption_key | default(''), true) }}
  no_log: true

- name: n8n backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _n8n_backup_database_backend.provider | default('') == 'postgresql'
      - _n8n_backup_database_backend.host | default('') | length > 0
      - _n8n_backup_database_backend.port | default(0) | int > 0
      - _n8n_backup_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _n8n_backup_database_user | length > 0
      - _n8n_backup_database_password | length > 0
      - _n8n_backup_encryption_key | length > 0
      - _n8n_backup_data_path is match('^/[^/].*')
      - _n8n_backup_data_path != '/'
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      n8n needs its named PostgreSQL backend, database credential, Vaultwarden encryption
      key, non-root data path, and a configured PBS target before an application-consistent
      backup can run.
  no_log: true

- name: n8n backup | Check the instance data path
  ansible.builtin.stat:
    path: "{{ _n8n_backup_data_path }}"
  register: _n8n_backup_data
  changed_when: false

- name: n8n backup | Require a complete data path
  ansible.builtin.assert:
    that:
      - _n8n_backup_data.stat.exists
      - _n8n_backup_data.stat.isdir
    fail_msg: >-
      n8n data path {{ _n8n_backup_data_path }} is missing; refusing to create a recovery
      point that would omit instance assets and source-control state.

# The dump directory is outside /tmp, which the client's tmpfs replaces.
- name: n8n backup | Allocate private scratch space
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: n8n-backup-
  register: _n8n_backup_scratch
  changed_when: true

- name: n8n backup | Quiesce n8n and archive database plus data
  block:
    # PostgreSQL and every other service on the shared services guest stay untouched.
    - name: n8n backup | Stop n8n, dump its database and push both archives
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: docker
        pbs_client_compose_project: "/opt/{{ instance }}"
        pbs_client_stop_services: [n8n]
        pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
        pbs_client_archives:
          - name: database.pxar
            path: "{{ _n8n_backup_scratch.path }}"
          - name: data.pxar
            path: "{{ _n8n_backup_data_path }}"

    - name: n8n backup | Mark the paired recovery artifact complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: n8n backup | Remove private scratch data
      ansible.builtin.file:
        path: "{{ _n8n_backup_scratch.path }}"
        state: absent
