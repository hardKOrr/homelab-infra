---
# restore-swap.yml replaced hook. A new target was provisioned with its own generated key;
# the restored database's encrypted credentials need the source key, so record it against
# the target and render the environment n8n starts with.
- name: n8n restore | Record that the target key is being replaced
  ansible.builtin.set_fact:
    _n8n_restore_key_replaced: true

- name: n8n restore | Record the source encryption key against the target
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      encryption_key: "{{ restore_source_encryption_key }}"
    vault_item_secret_fields: [encryption_key]
  no_log: true

- name: n8n restore | Render the target environment with the restored key
  ansible.builtin.template:
    src: n8n.env.j2
    dest: "{{ n8n_env_file }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    n8n_fqdn: "{{ app_config.routing.subdomain | default(instance, true) }}.{{ homelabinfra_infra.domain }}"
    _n8n_encryption_key: "{{ restore_source_encryption_key }}"
  no_log: true
