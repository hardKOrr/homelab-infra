---
- name: n8n restore | Use the Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: restore_target_config.hosting.method | default('docker') == 'kubernetes'

- name: n8n restore | Use the Docker guest restore path
  ansible.builtin.include_tasks: restore-docker.yml
  when: restore_target_config.hosting.method | default('docker') == 'docker'
