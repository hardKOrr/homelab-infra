# Deploy n8n into the instance namespace. Its workflows and credentials stay in the
# named PostgreSQL backend; the PVC holds the instance's /home/node/.n8n data directory.

- name: n8n | Resolve the cluster and its API host
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: n8n | Ensure the instance namespace exists
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/ensure-namespace.yml

- name: n8n | Generate or reuse the encryption key
  ansible.builtin.set_fact:
    _n8n_encryption_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).encryption_key
         | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: n8n | Store application and database credentials in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: n8n
      instance: "{{ instance }}"
      encryption_key: "{{ _n8n_encryption_key }}"
      database_provider: "{{ app_config.app.database.provider }}"
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [encryption_key, database_password]
  no_log: true

- name: n8n | Sync runtime environment into the namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ instance }}-env"
    k8s_secret_data:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "{{ app_config.app.database_host }}"
      DB_POSTGRESDB_PORT: "{{ app_config.app.database_port }}"
      DB_POSTGRESDB_DATABASE: "{{ app_config.app.database.name }}"
      DB_POSTGRESDB_USER: "{{ app_config.app.database_user }}"
      DB_POSTGRESDB_PASSWORD: "{{ app_config.app.database_password }}"
      N8N_ENCRYPTION_KEY: "{{ _n8n_encryption_key }}"
      N8N_HOST: "{{ n8n_fqdn }}"
      N8N_PROTOCOL: http
      N8N_PORT: "{{ app_config.app.port }}"
      N8N_EDITOR_BASE_URL: "https://{{ n8n_fqdn }}/"
      WEBHOOK_URL: "https://{{ n8n_fqdn }}/"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"

- name: n8n | Render the Kubernetes workload
  ansible.builtin.set_fact:
    _n8n_k8s_manifest: "{{ lookup('ansible.builtin.template', 'manifest.yaml.j2') }}"

- name: n8n | Apply the Kubernetes workload
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/apply-manifest.yml
  vars:
    k8s_manifest: "{{ _n8n_k8s_manifest }}"

- name: n8n | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"
  when: app_config.backup.enabled | default(false) | bool

- name: n8n | Configure the application backup CronJob
  when:
    - app_config.backup.enabled | default(false) | bool
    - k8s_pbs_available | default(false) | bool
  block:
    - name: n8n | Resolve the PostgreSQL client major version
      ansible.builtin.set_fact:
        _n8n_pg_client_version: >-
          {{ app_config.app.database.version
             | default((homelabinfra_infra.databases | default({})).get(
                 app_config.app.database.instance, {}).version | default(''), true)
             | string }}

    - name: n8n | Require a matching PostgreSQL client version
      ansible.builtin.assert:
        that: _n8n_pg_client_version is match('^[0-9]+$')
        fail_msg: >-
          n8n needs the registered PostgreSQL backend's major version to create a
          compatible application recovery point.

    - name: n8n | Resolve the backup identity and destination
      ansible.builtin.set_fact:
        _n8n_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
        _n8n_backup_timezone: >-
          {{ app_config.backup.timezone | default('', true)
             or homelabinfra_config.timezone | default('UTC') }}
        _n8n_backup_repository: "{{ k8s_pbs_repository }}"
        _n8n_backup_datastore: "{{ k8s_pbs_datastore }}"
      no_log: true

    - name: n8n | Sync backup credentials into the namespace
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
      vars:
        k8s_secret_name: "{{ instance }}-backup"
        k8s_secret_data:
          pbs-password: "{{ k8s_pbs_password }}"
          db-password: "{{ app_config.app.database_password }}"

    - name: n8n | Render the backup CronJob
      ansible.builtin.set_fact:
        _n8n_backup_manifest: "{{ lookup('ansible.builtin.template', 'backup-cronjob.yaml.j2') }}"

    - name: n8n | Apply the backup CronJob
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/apply-manifest.yml
      vars:
        k8s_manifest: "{{ _n8n_backup_manifest }}"

    - name: n8n | State the recovery contract
      ansible.builtin.debug:
        msg:
          - "Backup: the named PostgreSQL database and /home/node/.n8n volume are paired in one PBS snapshot under host/{{ _n8n_backup_id }}."
          - "Schedule: {{ app_config.backup.schedule }} ({{ _n8n_backup_timezone }}); retention: {{ app_config.backup.retention_days }} daily snapshots."
          - "Run one now with playbooks/maintenance/backup-app.yml -e instance={{ instance }}."

- name: n8n | Remove the backup CronJob if backups are unavailable or disabled
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - delete
      - "cronjob/{{ instance }}-backup"
      - --ignore-not-found=true
  delegate_to: "{{ k8s_api_host }}"
  become: true
  changed_when: false
  when: >-
    not (app_config.backup.enabled | default(false) | bool)
    or not (k8s_pbs_available | default(false) | bool)

- name: n8n | State that application backups need a deployed PBS
  ansible.builtin.debug:
    msg: >-
      n8n is deployed, but no usable PBS target is recorded, so its backup CronJob was
      removed. Deploy PBS and re-run this Deploy to enable the recovery path.
  when:
    - app_config.backup.enabled | default(false) | bool
    - not (k8s_pbs_available | default(false) | bool)

- name: n8n | Wait for the Deployment to become ready
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - rollout
      - status
      - "deployment/{{ instance }}"
      - --timeout=300s
  delegate_to: "{{ k8s_api_host }}"
  become: true
  changed_when: false
