# Deploy n8n into the instance namespace. Its workflows and credentials stay in the
# named PostgreSQL backend; the PVC holds the instance's /home/node/.n8n data directory.

- name: n8n | Resolve the cluster and its API host
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: n8n | Ensure the instance namespace exists
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/ensure-namespace.yml

- name: n8n | Generate or reuse the encryption key
  ansible.builtin.set_fact:
    _n8n_encryption_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).encryption_key
         | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: n8n | Store application and database credentials in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: n8n
      instance: "{{ instance }}"
      encryption_key: "{{ _n8n_encryption_key }}"
      database_provider: "{{ app_config.app.database.provider }}"
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [encryption_key, database_password]
  no_log: true

- name: n8n | Sync runtime environment into the namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ instance }}-env"
    k8s_secret_data:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "{{ app_config.app.database_host }}"
      DB_POSTGRESDB_PORT: "{{ app_config.app.database_port }}"
      DB_POSTGRESDB_DATABASE: "{{ app_config.app.database.name }}"
      DB_POSTGRESDB_USER: "{{ app_config.app.database_user }}"
      DB_POSTGRESDB_PASSWORD: "{{ app_config.app.database_password }}"
      N8N_ENCRYPTION_KEY: "{{ _n8n_encryption_key }}"
      N8N_HOST: "{{ n8n_fqdn }}"
      N8N_PROTOCOL: http
      N8N_PORT: "{{ app_config.app.port }}"
      N8N_EDITOR_BASE_URL: "https://{{ n8n_fqdn }}/"
      WEBHOOK_URL: "https://{{ n8n_fqdn }}/"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"

- name: n8n | Render the Kubernetes workload
  ansible.builtin.set_fact:
    _n8n_k8s_manifest: "{{ lookup('ansible.builtin.template', 'manifest.yaml.j2') }}"

- name: n8n | Apply the Kubernetes workload
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/apply-manifest.yml
  vars:
    k8s_manifest: "{{ _n8n_k8s_manifest }}"

- name: n8n | Describe the database step of the backup
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_engine: postgresql
    k8s_database_step_config: "{{ app_config }}"
    k8s_database_step_instance: "{{ instance }}"
  when: app_config.backup.enabled | default(false) | bool

- name: n8n | Schedule the application backup
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-backup.yml
  vars:
    k8s_recovery:
      archives:
        - name: data
          claim: "{{ instance }}-storage"
      database: "{{ k8s_database_step | default({}) }}"
      describe: >-
        the named PostgreSQL database and the /home/node/.n8n volume, paired in one
        snapshot

- name: n8n | Wait for the Deployment to become ready
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - rollout
      - status
      - "deployment/{{ instance }}"
      - --timeout=300s
  delegate_to: "{{ k8s_api_host }}"
  become: true
  changed_when: false
