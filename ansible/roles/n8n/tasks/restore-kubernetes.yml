---
# Restore one paired n8n PostgreSQL and PVC recovery point into an already deployed
# Kubernetes instance, through tasks/kubernetes/recovery-restore.yml. The target stays
# stopped if the destructive restore fails, so the same point can be retried after fixing
# the cause.

- name: n8n restore | Assert the Kubernetes recovery inputs
  ansible.builtin.assert:
    that:
      - restore_source_encryption_key | default('') | length > 0
    fail_msg: >-
      n8n Kubernetes restore needs the source instance's encryption key.
  no_log: true

- name: n8n restore | Describe the target's database step
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_engine: postgresql
    k8s_database_step_config: "{{ restore_target_config }}"
    k8s_database_step_instance: "{{ restore_target }}"

- name: n8n restore | Restore n8n through the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: n8n
      archives:
        - name: data
          claim: "{{ restore_target }}-storage"
          # The image runs as the `node` user.
          owner: "1000:1000"
      database: "{{ k8s_database_step }}"
      stop:
        - "{{ restore_target }}"
      after_restore_tasks: "{{ role_path }}/tasks/restore-kubernetes-key.yml"
      describe: >-
        the {{ k8s_database_step.describe }} and the {{ restore_target }}-storage volume
      verify:
        - >-
          Open https://{{ restore_target }}.<estate domain>/, sign in with the owner account
          from {{ instance }}, and check that workflows and their credentials are present.
