---
# The native service's restart (tasks/native.yml). On Docker, tasks/main.yml recreates the
# project itself when the Compose or environment file changes.
- name: Restart n8n
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ n8n_native_service }}"]
  when: n8n_native | bool
