---
- name: Restart n8n
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_project_dir }}"
    state: restarted
  # A container Start service just created or recreated already runs the new files, and
  # restarting it would interrupt a new install's first schema migration.
  when:
    - not (n8n_native | bool)
    - not (_n8n_start.changed | default(false))

- name: Restart native n8n
  ansible.builtin.systemd:
    name: "{{ n8n_native_service }}"
    state: restarted
  listen: Restart n8n
  when: n8n_native | bool
