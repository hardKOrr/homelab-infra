---
# Shared by both hosting methods: validate the credential and model references, resolve
# the stable master/salt keys and the provider keys from Vaultwarden, and build the
# database URL. Sets _litellm_master_key, _litellm_salt_key, _litellm_provider_secrets and
# _litellm_database_url.

- name: LiteLLM | Validate credential references
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Z][A-Z0-9_]*$')
      - item.value is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      LiteLLM credential {{ item.key | quote }} must map to a safe Vaultwarden field name;
      values are never accepted from config/apps/{{ instance }}.yml.
  loop: "{{ app_config.app.credentials | default({}) | dict2items }}"

- name: LiteLLM | Resolve the stable application keys
  ansible.builtin.set_fact:
    _litellm_vault_app: "{{ (homelabinfra_vault.apps | default({})).get(instance, {}) }}"
    _litellm_master_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).master_key
         | default(lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits'), true) }}
    _litellm_salt_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).salt_key
         | default(lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: LiteLLM | Store stable application keys in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      master_key: "{{ _litellm_master_key }}"
      salt_key: "{{ _litellm_salt_key }}"
    vault_item_secret_fields: [master_key, salt_key]
  no_log: true

- name: LiteLLM | Resolve provider keys from the canonical Vaultwarden item
  ansible.builtin.set_fact:
    _litellm_provider_secrets: >-
      {{ _litellm_provider_secrets | default({})
         | combine({item.key: _litellm_vault_app[item.value] | default('', true)}) }}
  loop: "{{ app_config.app.credentials | default({}) | dict2items }}"
  no_log: true

- name: LiteLLM | Require every named provider key in Vaultwarden
  ansible.builtin.assert:
    that: _litellm_provider_secrets[item.key] | default('') | length > 0
    fail_msg: >-
      Vaultwarden item homelab-infra/apps/{{ instance }} is missing the hidden field
      {{ item.value }} required by LiteLLM environment reference {{ item.key }}. Store the
      provider key with the Store Secret job; it must not be added to config/apps.
  loop: "{{ app_config.app.credentials | default({}) | dict2items }}"
  no_log: true

- name: LiteLLM | Reject inline provider credentials
  ansible.builtin.assert:
    that: item.litellm_params.api_key is not defined
    fail_msg: >-
      Model {{ item.model_name }} contains an inline api_key. Provider credentials must
      use api_key_env and a hidden Vaultwarden field; they are never accepted in config/apps.
  loop: "{{ app_config.app.models | default([]) }}"
  no_log: true

- name: LiteLLM | Require model credential references to be declared
  ansible.builtin.assert:
    that:
      - item.litellm_params.api_key_env in (app_config.app.credentials | default({}))
    fail_msg: >-
      Model {{ item.model_name }} references {{ item.litellm_params.api_key_env | default('') }}
      but app.credentials does not map that environment name to a Vaultwarden field.
  loop: "{{ app_config.app.models | default([]) }}"
  when: item.litellm_params.api_key_env | default('') | length > 0

- name: LiteLLM | Build the database connection URL
  ansible.builtin.set_fact:
    _litellm_database_url: "postgresql://{{ app_config.app.database_user }}:{{ app_config.app.database_password }}@{{ app_config.app.database_host }}:{{ app_config.app.database_port }}/{{ app_config.app.database_name }}"
  no_log: true
