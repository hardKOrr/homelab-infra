---
# LiteLLM as a Compose project on a stack host (hosting.method: docker). The shared Compose
# deploy recreates the container when the Compose file, the routing config or the env file
# (main.yml) changed, in the same up that creates it, so a new install is never restarted
# mid first boot.
- name: LiteLLM | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ litellm_project_dir }}"
    compose_project_mode: "0755"
    compose_recreate: >-
      {{ _litellm_config_written.changed | default(false)
         or _litellm_env_written.changed | default(false) }}
