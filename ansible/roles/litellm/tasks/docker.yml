---
# LiteLLM as a Compose project on a stack host (hosting.method: docker).

- name: LiteLLM | Write the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ litellm_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart litellm

- name: LiteLLM | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ litellm_project_dir }}"
    policy: missing
  changed_when: false

- name: LiteLLM | Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ litellm_project_dir }}"
    state: present
    remove_orphans: true
