---
# LiteLLM Proxy on Docker on a stack host (hosting.method: docker, LXC or VM). Kubernetes
# is kubernetes.yml. The proxy keeps no files of its own: its routing config is rendered
# below, its keys are in Vaultwarden, and virtual keys, spend and usage are in the named
# PostgreSQL database that playbooks/apps/litellm.yml provisions before this role.

- name: LiteLLM | Resolve credentials, keys and the database URL
  ansible.builtin.include_tasks: prepare.yml

- name: LiteLLM | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ litellm_project_dir }}"
    - "{{ litellm_config_dir }}"

- name: LiteLLM | Write the routing configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ litellm_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart litellm

- name: LiteLLM | Assemble the runtime environment
  ansible.builtin.set_fact:
    _litellm_env: >-
      {{ {'LITELLM_MASTER_KEY': _litellm_master_key,
          'LITELLM_SALT_KEY': _litellm_salt_key,
          'DATABASE_URL': _litellm_database_url}
         | combine(_litellm_provider_secrets | default({})) }}
  no_log: true

- name: LiteLLM | Write the environment file
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ litellm_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart litellm

- name: LiteLLM | Write the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ litellm_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart litellm

- name: LiteLLM | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ litellm_project_dir }}"
    policy: missing
  changed_when: false

- name: LiteLLM | Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ litellm_project_dir }}"
    state: present
    remove_orphans: true

- name: LiteLLM | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: LiteLLM | Wait until the proxy is ready
  ansible.builtin.include_tasks: verify.yml
