---
# Restore LiteLLM's external PostgreSQL state and the exact routing ConfigMap captured
# beside it by the application backup CronJob. Called by maintenance/restore-app.yml.
#
# Provider credentials and stable master/salt keys are deliberately not in the PBS
# artifact. The target must already have its own Vaultwarden item, so a restored database
# remains decryptable and provider access remains Vaultwarden-only.

- name: Restore | Assert the LiteLLM restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_target_config is defined
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
    fail_msg: >-
      A LiteLLM restore needs a deployed target and, to actually run, a PBS snapshot.
      Run it once without a recovery point to list what PBS holds, then run it again with
      overwrite=true and the selected identifier.

- name: Restore | Resolve the cluster and target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: Restore | Derive the target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/derive-namespace.yml
  vars:
    k8s_namespace_for: "{{ restore_target }}"

- name: Restore | Require a deployed target namespace
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - namespace
      - "{{ k8s_namespace }}"
      - -o
      - jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _litellm_r_owner
  changed_when: false
  failed_when: false

- name: Restore | Refuse an absent or foreign target namespace
  ansible.builtin.assert:
    that:
      - _litellm_r_owner.rc == 0
      - (_litellm_r_owner.stdout | trim) == 'homelab-infra'
    fail_msg: >-
      Namespace {{ k8s_namespace }} is absent or is not owned by homelab-infra. Deploy
      LiteLLM with instance={{ restore_target }} first; the clean restore drill uses a
      second instance and never mutates the live namespace before this point.

- name: Restore | Require matching PostgreSQL state contracts
  ansible.builtin.assert:
    that:
      - app_config.app.database_name == restore_target_config.app.database_name
      - (app_config.app.database_provider | default(app_config.app.database.provider))
        == (restore_target_config.app.database_provider
            | default(restore_target_config.app.database.provider))
    fail_msg: >-
      Source and target LiteLLM instances must use the same database name and provider.
      A PostgreSQL dump must land in the target's named LiteLLM database, not a silently
      different backend.

- name: Restore | Resolve the lab's PBS target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Restore | Require a PBS to restore from
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No Proxmox Backup Server is recorded in config/.generated/facts.yml, so LiteLLM has
      no application recovery artifact to restore from.

- name: Restore | Read source and target database connections
  ansible.builtin.set_fact:
    _litellm_r_source_host: "{{ app_config.app.database_host }}"
    _litellm_r_source_port: "{{ app_config.app.database_port }}"
    _litellm_r_source_name: "{{ app_config.app.database_name }}"
    _litellm_r_source_user: "{{ app_config.app.database_user }}"
    _litellm_r_source_password: "{{ app_config.app.database_password }}"
    _litellm_r_target_host: "{{ restore_target_config.app.database_host }}"
    _litellm_r_target_port: "{{ restore_target_config.app.database_port }}"
    _litellm_r_target_name: "{{ restore_target_config.app.database_name }}"
    _litellm_r_target_user: "{{ restore_target_config.app.database_user }}"
    _litellm_r_target_password: "{{ restore_target_config.app.database_password }}"
    _litellm_r_mode: "{{ 'restore' if restore_overwrite | bool else 'plan' }}"
    _litellm_r_snapshot: "{{ restore_snapshot | default('') }}"
    _litellm_r_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _litellm_r_secret: "{{ restore_target }}-restore"
    _litellm_r_job_name: "{{ restore_target }}-restore-{{ 'plan' if not (restore_overwrite | bool) else 'run' }}"
    _litellm_r_timeout: >-
      {{ 900 if not (restore_overwrite | bool)
         else (app_config.backup.timeout_seconds | default(3600) | int) }}
  no_log: true

- name: Restore | Require the target's Vaultwarden-backed database fields
  ansible.builtin.assert:
    that:
      - item.value | default('') | length > 0
    fail_msg: >-
      LiteLLM target {{ restore_target }} is missing its {{ item.key }} database field in
      Vaultwarden. Deploy the target first so its named external database connection is
      recorded before restoring into it.
  loop:
    - { key: database_host, value: "{{ _litellm_r_target_host }}" }
    - { key: database_port, value: "{{ _litellm_r_target_port }}" }
    - { key: database_name, value: "{{ _litellm_r_target_name }}" }
    - { key: database_user, value: "{{ _litellm_r_target_user }}" }
    - { key: database_password, value: "{{ _litellm_r_target_password }}" }
  no_log: true

- name: Restore | Sync restore credentials into the target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ _litellm_r_secret }}"
    k8s_secret_data:
      pbs-password: "{{ k8s_pbs_password }}"
      db-password: "{{ _litellm_r_target_password }}"
  no_log: true

- name: Restore | Render the restore Job
  ansible.builtin.set_fact:
    _litellm_r_manifest: "{{ lookup('ansible.builtin.template', 'restore-job.yaml.j2') }}"

- name: Restore | Run the read-only plan
  when: not (restore_overwrite | bool)
  block:
    - name: Restore | Run LiteLLM restore plan
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ _litellm_r_job_name }}"
        k8s_job_manifest: "{{ _litellm_r_manifest }}"
        k8s_job_timeout: "{{ _litellm_r_timeout }}"

    - name: Restore | State what the LiteLLM plan would replace
      ansible.builtin.debug:
        msg:
          - "PLAN ONLY — nothing was changed."
          - "Source: PBS group host/{{ _litellm_r_backup_id }} in datastore {{ k8s_pbs_datastore }}, snapshot {{ _litellm_r_snapshot | default('(none named)') }}."
          - "Target: PostgreSQL database {{ _litellm_r_target_name }} and the {{ restore_target }}-config ConfigMap."
          - "To do it: re-run this job with the same recovery point and overwrite=true."
  always:
    - name: Restore | Remove plan credentials
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - "secret/{{ _litellm_r_secret }}"
          - --ignore-not-found=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true
      when: not (restore_overwrite | bool)

- name: Restore | Replace LiteLLM state from PBS
  when: restore_overwrite | bool
  block:
    - name: Restore | Stop the target proxy before replacing its database
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - scale
          - "deployment/{{ restore_target }}"
          - --replicas=0
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Wait for the target proxy pod to terminate
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - wait
          - --for=delete
          - pod
          - "--selector=app.kubernetes.io/instance={{ restore_target }},app.kubernetes.io/component=web"
          - --timeout=300s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false

    - name: Restore | Run the LiteLLM restore Job
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ _litellm_r_job_name }}"
        k8s_job_manifest: "{{ _litellm_r_manifest }}"
        k8s_job_timeout: "{{ _litellm_r_timeout }}"

    # The Job prints the restored route file as base64. It contains model routing only —
    # credentials are environment references — so this is safe to carry back to the
    # control task and write as the target's ConfigMap. This keeps restore useful for a
    # renamed disposable target whose config/apps file did not have the source routes.
    - name: Restore | Extract the archived routing ConfigMap
      ansible.builtin.set_fact:
        _litellm_restored_config_b64: >-
          {{ k8s_job_log | regex_search('ROUTING_CONFIG_B64=([A-Za-z0-9+/=]+)', '\\1')
             | first | default('') }}

    - name: Restore | Require archived routing configuration
      ansible.builtin.assert:
        that: _litellm_restored_config_b64 | length > 0
        fail_msg: >-
          LiteLLM's database was restored, but the PBS artifact did not return its routing
          ConfigMap. The target is left stopped; inspect the failed restore Job before retrying.

    - name: Restore | Apply the archived routing ConfigMap
      ansible.builtin.command:
        argv: [k3s, kubectl, --namespace, "{{ k8s_namespace }}", apply, -f, -]
        stdin: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ restore_target }}-config
            labels:
              app.kubernetes.io/instance: {{ restore_target }}
              app.kubernetes.io/managed-by: homelab-infra
          data:
            config.yaml: {{ _litellm_restored_config_b64 | b64decode | to_json }}
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Start the target proxy
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - scale
          - "deployment/{{ restore_target }}"
          - --replicas=1
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Wait for the target proxy to become ready
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - rollout
          - status
          - "deployment/{{ restore_target }}"
          - --timeout=600s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false

    - name: Restore | State how to verify restored LiteLLM
      ansible.builtin.debug:
        msg:
          - "Restored {{ _litellm_r_snapshot }} into PostgreSQL database {{ _litellm_r_target_name }} and ConfigMap {{ restore_target }}-config."
          - "Verify /health/readiness, the configured model route, virtual keys and usage records before removing a disposable target."
  rescue:
    - name: Restore | Leave the proxy stopped after a failed restore
      ansible.builtin.fail:
        msg: >-
          LiteLLM restore {{ _litellm_r_snapshot }} did not complete. The target deployment
          is LEFT SCALED TO 0; its database or ConfigMap may be partially replaced. Inspect
          the restore Job, then either retry or start it deliberately with kubectl scale.
  always:
    - name: Restore | Remove restore credentials
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - "secret/{{ _litellm_r_secret }}"
          - --ignore-not-found=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true
