---
# The native service's restart. On Docker, tasks/docker.yml recreates the project itself
# when the Compose file, routing config or env file changes.
- name: Restart litellm
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ instance }}"]
  when: litellm_native | bool
