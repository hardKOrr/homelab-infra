---
# Role-internal defaults — not user-facing. User-facing knobs live in
# vars/app-defaults/caddy.yml and config/apps/<instance>.yml.
caddy_service_name: caddy
caddy_config_file: /etc/caddy/caddy.json
caddy_apt_key_url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
caddy_apt_repo_url: "https://dl.cloudsmith.io/public/caddy/stable/deb/debian"
caddy_apt_keyring: /etc/apt/keyrings/caddy-stable.gpg
