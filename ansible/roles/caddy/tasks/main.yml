---
# caddy role — native LXC deployment from the official Cloudsmith apt repository, or (with
# hosting.method: docker) a host-network container on a stack host.
# Called from Play 2 of playbooks/apps/caddy.yml. Target: dedicated LXC or stack host.
#
# With hosting.method: kubernetes the role runs on localhost and the pod replaces the guest.
#
# CONFIGURATION MODEL — read this before changing anything here.
#
# Caddy is configured as JSON through its admin API, not by a Caddyfile. An empty
# Caddyfile adapts to a config with NO http servers at all, and the route wiring
# (tasks/wiring/caddy.yml, slice 300) POSTs to
# /config/apps/http/servers/srv0/routes — so `srv0` must exist with an empty route
# table before the first app is wired. A JSON base config guarantees exactly that.
#
# Persistence: the unit runs `caddy run --config <base> --resume`. On first start
# there is no autosave, so the base config applies. Afterwards Caddy replays its
# autosaved running config, so routes added through the admin API survive restarts
# and reboots. That is why the handler restarts and never reloads — `caddy reload`
# re-applies the base file and would drop every wired route.
#
# Drift: per CLAUDE.md ("fire-and-forget provisioning — we do not police drift")
# this role does not rewrite a healthy running config. It creates the base config
# when no srv0 exists, and otherwise reconciles only the subtrees it owns (srv0
# listeners, TLS automation policies, automated certificate names, and public DNS
# app configuration) in place, never touching routes.
#
# Certificates: one wildcard per estate, requested through the `automate` loader and
# issued by that estate's DNS-01 policy. Apps are served from it and issue nothing of
# their own — see the comment above "Collect the estate wildcards to automate"
# (main/tls.yml).
#
# Updating: re-running this playbook IS the update mechanism — apt state: latest
# upgrades Caddy in place and reports changed only when it actually moves.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the reverse_proxy registry key):
#   caddy_admin_host, caddy_admin_port

- name: Preflight public DNS
  ansible.builtin.import_tasks: main/preflight.yml

- name: Install Caddy natively
  when: caddy_native | bool
  block:
    - name: Install Caddy from its apt repository
      ansible.builtin.import_tasks: main/install.yml

- name: Resolve the DNS-challenge TLS policies
  ansible.builtin.import_tasks: main/tls.yml

# The DNS modules a container image or pod must compile in; native adds them with apt.
- name: Resolve the modules to compile into the image
  when: not (caddy_native | bool)
  block:
    - name: Resolve the image modules and tag
      ansible.builtin.import_tasks: main/modules.yml

- name: Prepare the Kubernetes namespace and Service
  when: caddy_kubernetes | bool
  block:
    - name: Resolve the cluster, give Caddy its address and schedule its backup
      ansible.builtin.import_tasks: main/kubernetes.yml

- name: Prepare the Docker project
  when: caddy_docker | bool
  block:
    - name: Lay out the Compose project and image build
      ansible.builtin.import_tasks: main/docker.yml

- name: Write and apply the base configuration
  ansible.builtin.import_tasks: main/config.yml

- name: Reconcile the public DNS apps
  ansible.builtin.import_tasks: main/public-dns.yml

- name: Reconcile the owned subtrees and the wildcard certificates
  ansible.builtin.import_tasks: main/routes.yml

# ── Hand the admin endpoint back to the playbook ──────────────────────────────
- name: Export the admin endpoint to the playbook
  ansible.builtin.set_fact:
    caddy_admin_host: "http://{{ _caddy_bind_ip }}"
    caddy_admin_port: "{{ app_config.app.port | int }}"

# Native only: the update-check and restart helpers drive apt and systemd, and the version
# record is read from the host binary. A container is updated by changing its pinned image.
- name: Record the native install
  when: caddy_native | bool
  block:
    - name: Install lab maintenance scripts and record the version
      ansible.builtin.import_tasks: main/native-record.yml
