---
# caddy role — native LXC deployment from the official Cloudsmith apt repository.
# Called from Play 2 of playbooks/apps/caddy.yml. Target: dedicated LXC.
#
# CONFIGURATION MODEL — read this before changing anything here.
#
# Caddy is configured as JSON through its admin API, not by a Caddyfile. An empty
# Caddyfile adapts to a config with NO http servers at all, and the route wiring
# (tasks/wiring/caddy.yml, slice 300) POSTs to
# /config/apps/http/servers/srv0/routes — so `srv0` must exist with an empty route
# table before the first app is wired. A JSON base config guarantees exactly that.
#
# Persistence: the unit runs `caddy run --config <base> --resume`. On first start
# there is no autosave, so the base config applies. Afterwards Caddy replays its
# autosaved running config, so routes added through the admin API survive restarts
# and reboots. That is why the handler restarts and never reloads — `caddy reload`
# re-applies the base file and would drop every wired route.
#
# Drift: per CLAUDE.md ("fire-and-forget provisioning — we do not police drift")
# this role does not rewrite a healthy running config. It creates the base config
# when no srv0 exists, and otherwise reconciles only the two subtrees it owns
# (srv0 listeners, TLS automation policies) in place, never touching routes.
#
# Updating: re-running this playbook IS the update mechanism — apt state: latest
# upgrades Caddy in place and reports changed only when it actually moves.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the reverse_proxy registry key):
#   caddy_admin_host, caddy_admin_port

# ── Install ───────────────────────────────────────────────────────────────────
- name: Install apt repository prerequisites
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install the Caddy apt signing key
  ansible.builtin.get_url:
    url: "{{ caddy_apt_key_url }}"
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
  register: _caddy_key

- name: Dearmor the Caddy apt signing key
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ caddy_apt_keyring }} /etc/apt/keyrings/caddy-stable.asc"
  when: _caddy_key is changed
  changed_when: true

- name: Add the Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ caddy_apt_keyring }}] {{ caddy_apt_repo_url }} any-version main"
    filename: caddy-stable
    state: present
    update_cache: true

# state: latest is deliberate — re-running the deploy is the documented update path
# for native apps (CLAUDE.md "Native LXC App Update Path").
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: latest    # noqa package-latest — re-running the deploy IS the update mechanism
  notify: Restart caddy

# ── DNS-challenge TLS (per-estate) ────────────────────────────────────────────
# Estates declared in config/infrastructure.yml `domains:` may carry a
# dns_challenge block (provider + api_token); single-domain labs put the same
# block in app.dns_challenge. Each token is referenced only from its own domain's
# TLS automation policy — the sanctioned per-estate separation. The stock apt
# binary ships no DNS provider modules, so the matching caddy-dns package is
# installed with `caddy add-package` (which swaps the binary in place; an apt
# upgrade on a later deploy replaces it again, and this task re-adds the module).
- name: Collect DNS-challenge domains
  ansible.builtin.set_fact:
    _caddy_dns_domains: >-
      {{ ((homelabinfra_config.infrastructure.domains | default({})).values()
          | selectattr('dns_challenge', 'defined') | list)
         + ([{'domain': homelabinfra_config.infrastructure.domain | default(''),
              'dns_challenge': app_config.app.dns_challenge}]
            if app_config.app.dns_challenge is defined else []) }}
  no_log: true   # entries carry API tokens

- name: List installed Caddy modules
  ansible.builtin.command:
    cmd: caddy list-modules
  register: _caddy_modules
  changed_when: false
  when: _caddy_dns_domains | length > 0

- name: Install missing DNS provider modules
  ansible.builtin.command:
    cmd: "caddy add-package github.com/caddy-dns/{{ item }}"
  loop: >-
    {{ _caddy_dns_domains | map(attribute='dns_challenge.provider')
       | unique | list }}
  when:
    - _caddy_dns_domains | length > 0
    - ('dns.providers.' ~ item) not in _caddy_modules.stdout | default('')
  changed_when: true
  notify: Restart caddy

# One policy per estate, ahead of the catch-all: subjects pin it to that estate's
# domain tree, so its token never issues for another estate's names.
- name: Build per-estate DNS-challenge TLS policies
  ansible.builtin.set_fact:
    _caddy_dns_policies: >-
      {{ _caddy_dns_policies | default([]) + [ {
           'subjects': ['*.' ~ item.domain, item.domain],
           'issuers': [ {'module': 'acme',
                         'challenges': {'dns': {'provider':
                            {'name': item.dns_challenge.provider,
                             'api_token': item.dns_challenge.api_token}}}}
                        | combine({'email': app_config.app.acme_email}
                                  if app_config.app.acme_email | default('') | length > 0
                                  else {}) ]
         } ] }}
  loop: "{{ _caddy_dns_domains }}"
  no_log: true   # policy bodies carry API tokens

# ── Base configuration ────────────────────────────────────────────────────────
- name: Resolve the admin API bind address
  ansible.builtin.set_fact:
    # The wiring tasks reach the admin API from the Ansible controller, so it must
    # bind the LXC's own interface rather than the localhost default.
    _caddy_bind_ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

- name: Build the desired base configuration
  ansible.builtin.set_fact:
    # One dict expression keeps ports as ints in the JSON body
    # (.claude/specs/jinja-string-typing.md). srv0 starts with an empty route
    # table — every route is added later through the admin API by the wiring tasks.
    _caddy_base_config: >-
      {{ {
           'admin': {'listen': _caddy_bind_ip ~ ':' ~ (app_config.app.port | int)},
           'apps': {
             'http': {
               'servers': {
                 'srv0': {
                   'listen': [':' ~ (app_config.app.https_port | default(443) | int),
                              ':' ~ (app_config.app.http_port | default(80) | int)],
                   'routes': [],
                 },
               },
             },
             'tls': {'automation': {'policies':
               (_caddy_dns_policies | default([])) + [{'issuers': [_caddy_issuer]}]}},
           },
         } }}
  vars:
    _caddy_issuer: >-
      {{ {'module': 'internal'}
         if app_config.app.tls_mode | default('acme') == 'internal'
         else ({'module': 'acme'}
               | combine({'email': app_config.app.acme_email}
                         if app_config.app.acme_email | default('') | length > 0 else {})) }}

- name: Write the base configuration
  ansible.builtin.copy:
    content: "{{ _caddy_base_config | to_nice_json }}"
    dest: "{{ caddy_config_file }}"
    owner: root
    group: caddy
    mode: "0640"
  # The config embeds per-estate DNS tokens when any dns_challenge is declared —
  # keep them out of logs/diffs (the 0640 root:caddy file itself is the narrow
  # guest-held-credential exception, as with the authentik compose env).
  no_log: "{{ _caddy_dns_domains | length > 0 }}"

# The packaged unit runs a Caddyfile; remove it so nothing can silently apply an
# empty server set over the JSON config.
- name: Remove the packaged Caddyfile
  ansible.builtin.file:
    path: /etc/caddy/Caddyfile
    state: absent

- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ caddy_service_name }}.service.d"
    state: directory
    mode: "0755"

- name: Point the service at the JSON config with autosave resume
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ caddy_service_name }}.service.d/homelab-infra.conf"
    mode: "0644"
    content: |
      # Managed by homelab-infra. Overrides the packaged Caddyfile invocation.
      # --resume replays the autosaved running config so admin-API routes survive
      # restarts; the --config file is only the first-boot seed.
      [Service]
      ExecStart=
      ExecStart=/usr/bin/caddy run --config {{ caddy_config_file }} --resume
      ExecReload=
      ExecReload=/usr/bin/caddy reload --config {{ caddy_config_file }} --force
  notify: Restart caddy

# ── Make sure the base configuration can actually be applied ──────────────────
# `--resume` does not merely prefer the autosave, it makes Caddy IGNORE --config
# outright whenever an autosave exists:
#
#   --config and --resume flags were used together; ignoring --config and
#   resuming from last configuration
#
# The packaged caddy service starts on install with its stock Caddyfile and autosaves
# that — a file_server on :80 with no `admin` key, so the admin endpoint stays on its
# localhost default. The base config written above, including the admin bind the
# wiring tasks depend on, was therefore never applied on a first deploy: the deploy
# then failed waiting for an admin API that was only ever listening on loopback.
# "--config is the first-boot seed" was the intent; with an autosave already on disk
# it seeded nothing.
#
# So an autosave that does not already carry the admin bind we want is discarded,
# which lets --config apply on the next start; Caddy immediately autosaves the result.
# An autosave that DOES carry it is left alone, which is the steady state and is what
# keeps admin-API routes across restarts — the property --resume exists for.
- name: Check for an autosaved running configuration
  ansible.builtin.slurp:
    src: "{{ caddy_autosave_file }}"
  register: _caddy_autosave
  failed_when: false

- name: Discard an autosave that predates this role's base configuration
  ansible.builtin.file:
    path: "{{ caddy_autosave_file }}"
    state: absent
  when:
    - _caddy_autosave.content is defined
    - ((_caddy_autosave.content | b64decode | from_json).admin | default({})).listen | default('')
      != (_caddy_bind_ip ~ ':' ~ (app_config.app.port | int))
  notify: Restart caddy

- name: Enable and start caddy service
  ansible.builtin.systemd:
    name: "{{ caddy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before touching the admin API
  ansible.builtin.meta: flush_handlers

- name: Wait for the admin API to answer
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/config/"
    status_code: 200
  register: _caddy_admin
  until: _caddy_admin.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Reconcile the subtrees this role owns ─────────────────────────────────────
- name: Read the running http server config
  ansible.builtin.uri:
    url: "{{ _caddy_admin_url }}/config/apps/http/servers/srv0"
    status_code: [200, 404, 500]
    return_content: true
  register: _caddy_srv0
  changed_when: false
  vars:
    _caddy_admin_url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}"

# Fresh install, or an autosave that lost the server — load the base config whole.
# Safe here precisely because there are no routes to lose.
- name: Load the base configuration
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/load"
    method: POST
    body_format: json
    body: "{{ _caddy_base_config }}"
    status_code: 200
  when: _caddy_srv0.status != 200 or (_caddy_srv0.json | default(None)) is none
  changed_when: true
  no_log: "{{ _caddy_dns_domains | length > 0 }}"   # body may embed DNS tokens

- name: Reconcile the subtrees this role owns
  when:
    - _caddy_srv0.status == 200
    - (_caddy_srv0.json | default(None)) is not none
  vars:
    _caddy_admin_url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}"
    _caddy_desired_listen: "{{ _caddy_base_config.apps.http.servers.srv0.listen }}"
    _caddy_desired_policies: "{{ _caddy_base_config.apps.tls.automation.policies }}"
  block:
    # PATCH, not PUT on the parent: replacing srv0 wholesale would take its routes
    # with it.
    - name: Update drifted srv0 listeners
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/http/servers/srv0/listen"
        method: PATCH
        body_format: json
        body: "{{ _caddy_desired_listen }}"
        status_code: 200
      when: _caddy_srv0.json.listen | default([]) != _caddy_desired_listen
      changed_when: true

    - name: Read the running TLS automation policies
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/automation/policies"
        status_code: [200, 404, 500]
        return_content: true
      register: _caddy_policies
      changed_when: false
      no_log: "{{ _caddy_dns_domains | length > 0 }}"   # response may embed DNS tokens

    - name: Update drifted TLS automation policies
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/automation/policies"
        method: PATCH
        body_format: json
        body: "{{ _caddy_desired_policies }}"
        status_code: 200
      when: >-
        _caddy_policies.status != 200
        or (_caddy_policies.json | default([])) != _caddy_desired_policies
      changed_when: true
      no_log: "{{ _caddy_dns_domains | length > 0 }}"   # body may embed DNS tokens

- name: Verify the route table is reachable
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/config/apps/http/servers/srv0/routes"
    status_code: 200
  changed_when: false

# ── Hand the admin endpoint back to the playbook ──────────────────────────────
- name: Export the admin endpoint to the playbook
  ansible.builtin.set_fact:
    caddy_admin_host: "http://{{ _caddy_bind_ip }}"
    caddy_admin_port: "{{ app_config.app.port | int }}"

# ── Lab maintenance scripts ───────────────────────────────────────────────────
- name: Install lab maintenance scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - lab-update-check
    - lab-restart-app
    - lab-tail-applog

# ── Record installed version ──────────────────────────────────────────────────
- name: Read the installed Caddy version
  ansible.builtin.command:
    cmd: caddy version
  register: _caddy_version
  changed_when: false

- name: Ensure facts.d directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Record installed version
  ansible.builtin.copy:
    content: '{"version": "{{ _caddy_version.stdout | regex_search(''[0-9]+\.[0-9]+\.[0-9]+'') }}"}'
    dest: /etc/ansible/facts.d/caddy.fact
    mode: "0644"
