---
# caddy role — native LXC deployment from the official Cloudsmith apt repository.
# Called from Play 2 of playbooks/apps/caddy.yml. Target: dedicated LXC.
#
# CONFIGURATION MODEL — read this before changing anything here.
#
# Caddy is configured as JSON through its admin API, not by a Caddyfile. An empty
# Caddyfile adapts to a config with NO http servers at all, and the route wiring
# (tasks/wiring/caddy.yml, slice 300) POSTs to
# /config/apps/http/servers/srv0/routes — so `srv0` must exist with an empty route
# table before the first app is wired. A JSON base config guarantees exactly that.
#
# Persistence: the unit runs `caddy run --config <base> --resume`. On first start
# there is no autosave, so the base config applies. Afterwards Caddy replays its
# autosaved running config, so routes added through the admin API survive restarts
# and reboots. That is why the handler restarts and never reloads — `caddy reload`
# re-applies the base file and would drop every wired route.
#
# Drift: per CLAUDE.md ("fire-and-forget provisioning — we do not police drift")
# this role does not rewrite a healthy running config. It creates the base config
# when no srv0 exists, and otherwise reconciles only the three subtrees it owns
# (srv0 listeners, TLS automation policies, and the automated certificate names)
# in place, never touching routes.
#
# Certificates: one wildcard per estate, requested through the `automate` loader and
# issued by that estate's DNS-01 policy. Apps are served from it and issue nothing of
# their own — see the comment above "Collect the estate wildcards to automate".
#
# Updating: re-running this playbook IS the update mechanism — apt state: latest
# upgrades Caddy in place and reports changed only when it actually moves.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the reverse_proxy registry key):
#   caddy_admin_host, caddy_admin_port

# ── Install ───────────────────────────────────────────────────────────────────
- name: Install apt repository prerequisites
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install the Caddy apt signing key
  ansible.builtin.get_url:
    url: "{{ caddy_apt_key_url }}"
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
  register: _caddy_key

- name: Dearmor the Caddy apt signing key
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ caddy_apt_keyring }} /etc/apt/keyrings/caddy-stable.asc"
  when: _caddy_key is changed
  changed_when: true

- name: Add the Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ caddy_apt_keyring }}] {{ caddy_apt_repo_url }} any-version main"
    filename: caddy-stable
    state: present
    update_cache: true

# state: latest is deliberate — re-running the deploy is the documented update path
# for native apps (CLAUDE.md "Native LXC App Update Path").
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: latest    # noqa package-latest — re-running the deploy IS the update mechanism
  notify: Restart caddy

# ── DNS-challenge TLS (per-estate) ────────────────────────────────────────────
# Estates declared in config/infrastructure.yml `domains:` may carry a
# dns_challenge block (provider + provider-specific options); single-domain labs declare the
# provider under infrastructure.reverse_proxy.dns_challenge. The token is supplied
# temporarily by CLOUDFLARE_API_TOKEN in Seed mode and by the canonical
# homelab-infra/reverse_proxy Vaultwarden item after cutover. app.dns_challenge is
# retained as a backwards-compatible input. Each token is referenced only from its own domain's
# TLS automation policy — the sanctioned per-estate separation. The stock apt
# binary ships no DNS provider modules, so the matching caddy-dns package is
# installed with `caddy add-package` (which swaps the binary in place; an apt
# upgrade on a later deploy replaces it again, and this task re-adds the module).
- name: Collect DNS-challenge domains
  ansible.builtin.set_fact:
    _caddy_dns_domains: >-
      {{ ((homelabinfra_config.infrastructure.domains | default({})).values()
          | selectattr('dns_challenge', 'defined') | list)
         + ([{'domain': homelabinfra_config.infrastructure.domain | default(''),
              'dns_challenge': _caddy_default_dns_challenge}]
            if _caddy_default_dns_challenge.provider | default('') | length > 0 else []) }}
  vars:
    _caddy_infra_challenge: >-
      {{ homelabinfra_config.infrastructure.reverse_proxy.dns_challenge | default({}) }}
    _caddy_legacy_challenge: "{{ app_config.app.dns_challenge | default({}) }}"
    _caddy_default_dns_challenge: >-
      {{ _caddy_legacy_challenge | combine(_caddy_infra_challenge, recursive=True) }}
  no_log: true   # entries carry API tokens

- name: Validate DNS-challenge configuration
  ansible.builtin.assert:
    that:
      - item.domain | default('') | length > 0
      - item.dns_challenge.provider | default('') | length > 0
      - _caddy_provider_options | length > 0
    fail_msg: >-
      Caddy DNS-01 needs a domain, provider, and that provider's configuration
      fields. The guided Cloudflare path receives api_token from
      CLOUDFLARE_API_TOKEN in Seed mode and homelab-infra/reverse_proxy after
      cutover; other modules retain their own option names.
  loop: "{{ _caddy_dns_domains }}"
  vars:
    _caddy_challenge_option_names:
      - resolvers
      - ttl
      - propagation_delay
      - propagation_timeout
      - override_domain
    _caddy_provider_options: >-
      {{ item.dns_challenge | dict2items
         | rejectattr('key', 'in', ['provider'] + _caddy_challenge_option_names)
         | list | items2dict }}
  no_log: true

- name: List installed Caddy modules
  ansible.builtin.command:
    cmd: caddy list-modules
  register: _caddy_modules
  changed_when: false
  when: _caddy_dns_domains | length > 0

- name: Install missing DNS provider modules
  ansible.builtin.command:
    cmd: "caddy add-package github.com/caddy-dns/{{ item }}"
  loop: >-
    {{ _caddy_dns_domains | map(attribute='dns_challenge.provider')
       | unique | list }}
  when:
    - _caddy_dns_domains | length > 0
    - ('dns.providers.' ~ item) not in _caddy_modules.stdout | default('')
  changed_when: true
  notify: Restart caddy

# One policy per estate, ahead of the catch-all: subjects pin it to that estate's
# domain tree, so its token never issues for another estate's names.
- name: Build per-estate DNS-challenge TLS policies
  ansible.builtin.set_fact:
    _caddy_dns_policies: >-
      {{ _caddy_dns_policies | default([]) + [ {
           'subjects': ['*.' ~ item.domain, item.domain],
           'issuers': [ {'module': 'acme',
                         'challenges': {'dns': {
                           'provider': ({'name': item.dns_challenge.provider}
                                        | combine(_caddy_provider_options, recursive=True))}
                           | combine(_caddy_challenge_options, recursive=True)}}
                        | combine({'email': app_config.app.acme_email}
                                  if app_config.app.acme_email | default('') | length > 0
                                  else {}) ]
         } ] }}
  loop: "{{ _caddy_dns_domains }}"
  vars:
    _caddy_challenge_option_names:
      - resolvers
      - ttl
      - propagation_delay
      - propagation_timeout
      - override_domain
    _caddy_provider_options: >-
      {{ item.dns_challenge | dict2items
         | rejectattr('key', 'in', ['provider'] + _caddy_challenge_option_names)
         | list | items2dict }}
    # Propagation checking is off by default, and `resolvers` therefore only takes
    # effect for a lab that turns it back on with a positive propagation_timeout.
    #
    # The check asks a resolver whether the TXT record it just wrote is visible, and a
    # homelab is the one place that question cannot be answered honestly: the lab domain
    # is typically captured by the local resolver — split-horizon, so app hostnames stay
    # on the LAN — which makes that resolver authoritative for a zone whose real records
    # live at the public provider. It answers NODATA for `_acme-challenge` and caches
    # that negative for the zone's SOA minimum, which is routinely longer than the whole
    # propagation window. Firewalls that redirect all outbound :53 make `resolvers`
    # cosmetic on top of that — the query is answered locally whatever address it names.
    #
    # Skipping the check costs nothing real: Let's Encrypt validates from the public
    # internet, where the record genuinely is. The delay is what the check was standing
    # in for. Set a positive propagation_timeout per estate to restore it, and give it
    # resolvers your network does not intercept.
    _caddy_challenge_options: >-
      {{ {'resolvers': ['1.1.1.1:53', '1.0.0.1:53'],
          'propagation_delay': '30s',
          'propagation_timeout': -1}
         | combine(item.dns_challenge | dict2items
                   | selectattr('key', 'in', _caddy_challenge_option_names)
                   | list | items2dict, recursive=True) }}
  no_log: true   # policy bodies carry API tokens

# A policy's `subjects` selects which managed names that policy governs; it does not
# ask for a certificate. Caddy manages a certificate for each name it is told to serve,
# so naming every app's own hostname as a site address yields one certificate per app —
# a DNS-01 challenge on every deploy, and a slow walk toward Let's Encrypt's
# 50-certificates-per-registered-domain-per-week limit (slice 015).
#
# The `automate` certificate loader is what asks for a name. Listing `*.<domain>` there
# obtains one wildcard per estate, and Caddy 2.10+ then serves every subdomain from it:
# TLS.Manage skips issuing for a subject already covered by a managed wildcard, and the
# automate list is one of the three sources it consults for that coverage. The wildcard
# is matched by the estate's own DNS-01 policy above, so each estate's token issues only
# for its own tree.
#
# The apex is deliberately absent — a wildcard does not cover it, nothing in the baseline
# serves it, and each automate name is a separate certificate. The policy subjects still
# carry the apex, so a future apex route issues under the same DNS-01 token.
- name: Collect the estate wildcards to automate
  ansible.builtin.set_fact:
    _caddy_automate_names: >-
      {{ _caddy_dns_domains | map(attribute='domain')
         | map('regex_replace', '^', '*.') | unique | list }}

# ── Base configuration ────────────────────────────────────────────────────────
- name: Resolve the admin API bind address
  ansible.builtin.set_fact:
    # The wiring tasks reach the admin API from the Ansible controller, so it must
    # bind the LXC's own interface rather than the localhost default.
    _caddy_bind_ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

- name: Build the desired base configuration
  ansible.builtin.set_fact:
    # One dict expression keeps ports as ints in the JSON body
    # (.claude/specs/jinja-string-typing.md). srv0 starts with an empty route
    # table — every route is added later through the admin API by the wiring tasks.
    _caddy_base_config: >-
      {{ {
           'admin': {'listen': _caddy_bind_ip ~ ':' ~ (app_config.app.port | int)},
           'apps': {
             'http': {
               'servers': {
                 'srv0': {
                   'listen': [':' ~ (app_config.app.https_port | default(443) | int),
                              ':' ~ (app_config.app.http_port | default(80) | int)],
                   'routes': [],
                 },
               },
             },
             'tls': {'automation': {'policies':
               (_caddy_dns_policies | default([])) + [{'issuers': [_caddy_issuer]}]}}
               | combine(_caddy_certificates),
           },
         } }}
  vars:
    _caddy_certificates: >-
      {{ {'certificates': {'automate': _caddy_automate_names}}
         if _caddy_automate_names | length > 0 else {} }}
    _caddy_issuer: >-
      {{ {'module': 'internal'}
         if app_config.app.tls_mode | default('acme') == 'internal'
         else ({'module': 'acme'}
               | combine({'email': app_config.app.acme_email}
                         if app_config.app.acme_email | default('') | length > 0 else {})) }}

- name: Write the base configuration
  ansible.builtin.copy:
    content: "{{ _caddy_base_config | to_nice_json }}"
    dest: "{{ caddy_config_file }}"
    owner: root
    group: caddy
    mode: "0640"
  # The config embeds per-estate DNS tokens when any dns_challenge is declared —
  # keep them out of logs/diffs (the 0640 root:caddy file itself is the narrow
  # guest-held-credential exception, as with the authentik compose env).
  no_log: "{{ _caddy_dns_domains | length > 0 }}"

# The packaged unit runs a Caddyfile; remove it so nothing can silently apply an
# empty server set over the JSON config.
- name: Remove the packaged Caddyfile
  ansible.builtin.file:
    path: /etc/caddy/Caddyfile
    state: absent

- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ caddy_service_name }}.service.d"
    state: directory
    mode: "0755"

- name: Point the service at the JSON config with autosave resume
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ caddy_service_name }}.service.d/homelab-infra.conf"
    mode: "0644"
    content: |
      # Managed by homelab-infra. Overrides the packaged Caddyfile invocation.
      # --resume replays the autosaved running config so admin-API routes survive
      # restarts; the --config file is only the first-boot seed.
      [Service]
      ExecStart=
      ExecStart=/usr/bin/caddy run --config {{ caddy_config_file }} --resume
      ExecReload=
  notify: Restart caddy

# ── Make sure the base configuration can actually be applied ──────────────────
# `--resume` does not merely prefer the autosave, it makes Caddy IGNORE --config
# outright whenever an autosave exists:
#
#   --config and --resume flags were used together; ignoring --config and
#   resuming from last configuration
#
# The packaged caddy service starts on install with its stock Caddyfile and autosaves
# that — a file_server on :80 with no `admin` key, so the admin endpoint stays on its
# localhost default. The base config written above, including the admin bind the
# wiring tasks depend on, was therefore never applied on a first deploy: the deploy
# then failed waiting for an admin API that was only ever listening on loopback.
# "--config is the first-boot seed" was the intent; with an autosave already on disk
# it seeded nothing.
#
# So an autosave that does not already carry the admin bind we want is discarded,
# which lets --config apply on the next start; Caddy immediately autosaves the result.
# An autosave that DOES carry it is left alone, which is the steady state and is what
# keeps admin-API routes across restarts — the property --resume exists for.
- name: Check for an autosaved running configuration
  ansible.builtin.slurp:
    src: "{{ caddy_autosave_file }}"
  register: _caddy_autosave
  failed_when: false

- name: Discard an autosave that predates this role's base configuration
  ansible.builtin.file:
    path: "{{ caddy_autosave_file }}"
    state: absent
  when:
    - _caddy_autosave.content is defined
    - ((_caddy_autosave.content | b64decode | from_json).admin | default({})).listen | default('')
      != (_caddy_bind_ip ~ ':' ~ (app_config.app.port | int))
  notify: Restart caddy

- name: Enable and start caddy service
  ansible.builtin.systemd:
    name: "{{ caddy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before touching the admin API
  ansible.builtin.meta: flush_handlers

- name: Wait for the admin API to answer
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/config/"
    status_code: 200
  register: _caddy_admin
  until: _caddy_admin.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Reconcile the subtrees this role owns ─────────────────────────────────────
- name: Read the running http server config
  ansible.builtin.uri:
    url: "{{ _caddy_admin_url }}/config/apps/http/servers/srv0"
    status_code: [200, 404, 500]
    return_content: true
  register: _caddy_srv0
  changed_when: false
  vars:
    _caddy_admin_url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}"

# A pre-015 Caddy manages one certificate for every route hostname. Replacing that
# implicit set with only the wildcard unloads those certificates before the wildcard
# has finished issuing, taking an already-serving estate offline. Find which desired
# wildcards are not present before changing the loader, then keep the affected route
# hostnames in `tls.certificates.automate` for the transition. The pins are removed only
# after the wildcard gate below succeeds. Fresh installs have no routes to preserve;
# converged installs already have every wildcard and therefore skip the transition.
- name: Check which estate wildcard certificates already exist
  ansible.builtin.find:
    paths: "{{ caddy_cert_dir }}"
    patterns: "{{ item | regex_replace('^\\*\\.', 'wildcard_.') }}.crt"
    recurse: true
  loop: "{{ _caddy_automate_names }}"
  register: _caddy_existing_wildcard_cert
  changed_when: false

- name: Collect estate wildcards still awaiting issuance
  ansible.builtin.set_fact:
    _caddy_pending_wildcards: >-
      {{ _caddy_existing_wildcard_cert.results | default([])
         | selectattr('matched', 'equalto', 0)
         | map(attribute='item') | list }}

- name: Collect route hostnames to preserve during wildcard migration
  ansible.builtin.set_fact:
    _caddy_migration_names: >-
      {%- set result = [] -%}
      {%- for route in (_caddy_srv0.json | default({})).routes | default([]) -%}
        {%- for matcher_set in route.match | default([]) -%}
          {%- for host in matcher_set.host | default([]) -%}
            {%- for wildcard in _caddy_pending_wildcards -%}
              {%- if host.endswith(wildcard[1:]) and host not in result -%}
                {%- set _ = result.append(host) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

# Fresh install, or an autosave that lost the server — load the base config whole.
# Safe here precisely because there are no routes to lose.
- name: Load the base configuration
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/load"
    method: POST
    body_format: json
    body: "{{ _caddy_base_config }}"
    status_code: 200
  when: _caddy_srv0.status != 200 or (_caddy_srv0.json | default(None)) is none
  changed_when: true
  no_log: "{{ _caddy_dns_domains | length > 0 }}"   # body may embed DNS tokens

- name: Reconcile the subtrees this role owns
  when:
    - _caddy_srv0.status == 200
    - (_caddy_srv0.json | default(None)) is not none
  vars:
    _caddy_admin_url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}"
    _caddy_desired_listen: "{{ _caddy_base_config.apps.http.servers.srv0.listen }}"
    _caddy_desired_policies: "{{ _caddy_base_config.apps.tls.automation.policies }}"
    _caddy_desired_certificates: >-
      {{ _caddy_base_config.apps.tls.certificates | default({}) }}
    _caddy_transition_certificates: >-
      {{ {'automate': (_caddy_automate_names + _caddy_migration_names)
                        | unique | list} }}
  block:
    # PATCH, not PUT on the parent: replacing srv0 wholesale would take its routes
    # with it.
    - name: Update drifted srv0 listeners
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/http/servers/srv0/listen"
        method: PATCH
        body_format: json
        body: "{{ _caddy_desired_listen }}"
        status_code: 200
      when: _caddy_srv0.json.listen | default([]) != _caddy_desired_listen
      changed_when: true

    - name: Read the running TLS automation policies
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/automation/policies"
        status_code: [200, 404, 500]
        return_content: true
      register: _caddy_policies
      changed_when: false
      no_log: "{{ _caddy_dns_domains | length > 0 }}"   # response may embed DNS tokens

    - name: Update drifted TLS automation policies
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/automation/policies"
        method: PATCH
        body_format: json
        body: "{{ _caddy_desired_policies }}"
        status_code: 200
      when: >-
        _caddy_policies.status != 200
        or (_caddy_policies.json | default([])) != _caddy_desired_policies
      changed_when: true
      no_log: "{{ _caddy_dns_domains | length > 0 }}"   # body may embed DNS tokens

    # A running Caddy from before slice 015 has no `certificates` key at all, so this
    # creates as well as replaces — POST is the only method that does both (PATCH
    # requires the path to exist, PUT requires it not to).
    - name: Read the running automated certificate names
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/certificates"
        status_code: [200, 404, 500]
        return_content: true
      register: _caddy_certificates_running
      changed_when: false
      when: _caddy_desired_certificates | length > 0

    - name: Stage wildcard certificates without unloading serving hostnames
      ansible.builtin.uri:
        url: "{{ _caddy_admin_url }}/config/apps/tls/certificates"
        method: POST
        body_format: json
        body: "{{ _caddy_transition_certificates }}"
        status_code: 200
      when:
        - _caddy_desired_certificates | length > 0
        - >-
          _caddy_certificates_running.status != 200
          or (_caddy_certificates_running.json | default({})) != _caddy_transition_certificates
      changed_when: true

- name: Verify the route table is reachable
  ansible.builtin.uri:
    url: "http://{{ _caddy_bind_ip }}:{{ app_config.app.port }}/config/apps/http/servers/srv0/routes"
    status_code: 200
  changed_when: false

# ── Gate the deploy on the wildcard actually existing ─────────────────────────
# Under the per-hostname model each app deploy carried its own issuance, so a broken
# DNS-01 credential surfaced on that app. Under the wildcard model nothing issues at
# wire time — every app is served from this certificate — so an estate whose challenge
# never completes produces routes that no certificate can serve, and the failure would
# otherwise appear as an unexplained TLS error on the next app's deploy.
#
# Caddy sanitizes `*.<domain>` to `wildcard_.<domain>` on disk and files it under the
# issuer's directory, so the name is matched rather than a full path assembled.
- name: Wait for each estate wildcard certificate to be issued
  ansible.builtin.find:
    paths: "{{ caddy_cert_dir }}"
    patterns: "{{ item | regex_replace('^\\*\\.', 'wildcard_.') }}.crt"
    recurse: true
  loop: "{{ _caddy_automate_names }}"
  register: _caddy_wildcard_cert
  until: _caddy_wildcard_cert.matched | default(0) > 0
  retries: 30
  delay: 10
  changed_when: false
  # The assert below reports which estate failed and why; a bare retry timeout does not.
  failed_when: false

- name: Assert every estate wildcard was issued
  ansible.builtin.assert:
    that:
      - item.matched | default(0) > 0
    fail_msg: >-
      Caddy never obtained a certificate for {{ item.item }} after five minutes.
      The DNS-01 challenge for that estate did not complete — check the estate's
      dns_challenge provider and token, and `journalctl -u {{ caddy_service_name }}`
      on this host for the ACME error. No app can be served over HTTPS on this
      estate until the wildcard exists.
  loop: "{{ _caddy_wildcard_cert.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove temporary per-hostname certificate pins
  ansible.builtin.uri:
    url: >-
      http://{{ _caddy_bind_ip }}:{{ app_config.app.port
      }}/config/apps/tls/certificates
    method: POST
    body_format: json
    body: "{{ _caddy_base_config.apps.tls.certificates }}"
    status_code: 200
  when: _caddy_migration_names | length > 0
  changed_when: true

# ── Hand the admin endpoint back to the playbook ──────────────────────────────
- name: Export the admin endpoint to the playbook
  ansible.builtin.set_fact:
    caddy_admin_host: "http://{{ _caddy_bind_ip }}"
    caddy_admin_port: "{{ app_config.app.port | int }}"

# ── Lab maintenance scripts ───────────────────────────────────────────────────
- name: Install lab maintenance scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - lab-update-check
    - lab-restart-app
    - lab-tail-applog

# ── Record installed version ──────────────────────────────────────────────────
- name: Read the installed Caddy version
  ansible.builtin.command:
    cmd: caddy version
  register: _caddy_version
  changed_when: false

- name: Ensure facts.d directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Record installed version
  ansible.builtin.copy:
    content: '{"version": "{{ _caddy_version.stdout | regex_search(''[0-9]+\.[0-9]+\.[0-9]+'') }}"}'
    dest: /etc/ansible/facts.d/caddy.fact
    mode: "0644"
