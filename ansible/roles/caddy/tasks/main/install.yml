---
# Phase of main.yml (native only): install Caddy from its apt repository. Imported in
# place; inputs are listed in main.yml.

# ── Install ───────────────────────────────────────────────────────────────────
- name: Install apt repository prerequisites
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install the Caddy apt signing key
  ansible.builtin.get_url:
    url: "{{ caddy_apt_key_url }}"
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
  register: _caddy_key

- name: Dearmor the Caddy apt signing key
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ caddy_apt_keyring }} /etc/apt/keyrings/caddy-stable.asc"
  when: _caddy_key is changed
  changed_when: true

- name: Add the Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ caddy_apt_keyring }}] {{ caddy_apt_repo_url }} any-version main"
    filename: caddy-stable
    state: present
    update_cache: true

# state: latest is deliberate — re-running the deploy is the documented update path
# for native apps (CLAUDE.md "Native LXC App Update Path").
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: latest    # noqa package-latest — re-running the deploy IS the update mechanism
  notify: Restart caddy
