---
# Resolve the modules to compile into the image and the tag that names the result. Shared
# by the Docker image build (docker.yml) and the Kubernetes init-container build
# (kubernetes.yml); both run it after tls.yml has resolved the DNS providers.

# The stock image ships no DNS provider modules; compile exactly the ones the config
# needs. The tag hashes the module list and base image so a changed list rebuilds.
- name: Resolve the modules to compile into the image
  ansible.builtin.set_fact:
    _caddy_modules_wanted: >-
      {{ (_caddy_dns_provider_names | map('regex_replace', '^', 'github.com/caddy-dns/') | list)
         + ([caddy_dynamicdns_module] if _caddy_public_dns_enabled_estates | length > 0 else [])
         + ([caddy_dnsrec_module] if _caddy_dns_records_enabled | bool else []) }}

- name: Derive the image tag
  ansible.builtin.set_fact:
    _caddy_image_tag: "{{ (app_config.app.image ~ _caddy_modules_wanted | sort | join(',')) | hash('sha1') | truncate(12, true, '') }}"
