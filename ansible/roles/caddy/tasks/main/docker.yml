---
# Phase of main.yml (Docker only): lay out the project directory and render the image
# build and Compose files. Caddy is started by main/config.yml once its base configuration
# is on disk. Imported in place; inputs are listed in main.yml.

- name: Create the project, data and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ caddy_project_dir }}", mode: "0750"}
    - {path: "{{ caddy_project_dir }}/build", mode: "0750"}
    - {path: "{{ caddy_data_dir }}", mode: "0750"}
    - {path: "{{ caddy_config_dir }}", mode: "0750"}

- name: Write the image build file
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ caddy_project_dir }}/build/Dockerfile"
    owner: root
    group: root
    mode: "0640"
  when: _caddy_modules_wanted | length > 0

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart caddy

# The image is built by `docker compose up` in config.yml when absent.
# policy: missing — re-running the deploy never moves a pinned image.
- name: Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ caddy_project_dir }}"
    policy: missing
  when: _caddy_modules_wanted | length == 0
  changed_when: false

