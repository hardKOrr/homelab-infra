---
# Restart, never reload: `caddy reload` re-applies the base config file and would
# drop every route the wiring tasks added through the admin API. A restart with
# --resume replays the autosaved running config instead. See tasks/main.yml. On Docker,
# main/config.yml recreates the container itself (the same --resume restart).
- name: Restart caddy
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ caddy_service_name }}"]
  when: caddy_native | bool
