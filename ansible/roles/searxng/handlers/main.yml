---
- name: Restart searxng
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ instance }}"
    state: present
    recreate: always
  when: app_config.hosting.method == 'docker'

- name: Restart searxng service
  ansible.builtin.systemd:
    name: "{{ searxng_service }}"
    state: restarted
    daemon_reload: true
  when: app_config.hosting.method == 'native'
