---
# SearXNG as a Compose project on a stack host (hosting.method: docker). Stateless like the
# Kubernetes method: secret_key and the limiter's Redis password live in Vaultwarden, the
# limiter Redis has no volume, so there is nothing to back up or restore.
#
# Inputs: instance, app_config, searxng_fqdn (from the localhost play).

- name: SearXNG | Resolve and store the application secrets
  ansible.builtin.include_tasks: secrets.yml

# The shared Compose deploy renders the settings file with the project and recreates the
# containers when either changed, in the same up that creates them, so a new install is
# never restarted mid first boot. The settings file is owned by the image's searxng user
# so the container can read a file that carries secrets.
- name: SearXNG | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "/opt/{{ instance }}"
    compose_file_mode: "0600"
    compose_files:
      - src: settings.yml.j2
        dest: "/opt/{{ instance }}/settings.yml"
        owner: "{{ app_config.app.uid }}"
        group: "{{ app_config.app.uid }}"
        mode: "0400"
    compose_secrets: ["{{ _sx_secret_key }}", "{{ _sx_redis_password }}"]
    compose_health:
      url: "http://127.0.0.1:{{ app_config.app.port }}/healthz"
