---
- name: Home Assistant | Prepare inputs, credentials and directories
  ansible.builtin.include_tasks: prepare.yml

- name: Home Assistant | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('docker') == 'docker'

- name: Home Assistant | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method | default('docker') == 'native'
