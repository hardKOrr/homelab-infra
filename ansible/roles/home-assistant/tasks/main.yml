---
- name: Home Assistant | Resolve hidden integration credentials
  ansible.builtin.set_fact:
    _ha_vault_item: "{{ (homelabinfra_vault.apps | default({})).get(instance, {}) }}"
  no_log: true

- name: Home Assistant | Parse the Vaultwarden integration credential object
  ansible.builtin.set_fact:
    _ha_integration_credentials: >-
      {{ _ha_vault_item.integration_credentials
         if (_ha_vault_item.integration_credentials | default('{}', true)) is mapping
         else (_ha_vault_item.integration_credentials | default('{}', true) | from_json) }}
  no_log: true

- name: Home Assistant | Assert the optional VM device contract reached the role
  ansible.builtin.assert:
    that:
      - >-
        (app_config.app.usb_mapping | default('') | length == 0)
        or (app_config.app.usb_device_path | default('') is match('^/dev/'))
      - _ha_integration_credentials is mapping
    fail_msg: >-
      When configured, Home Assistant's Proxmox USB mapping requires its guest serial
      device path. Integration credentials must be a JSON object from Vaultwarden; raw
      vendor:product identities and credential values in config/apps are not accepted.
  no_log: true

- name: Home Assistant | Resolve the declared reverse proxy
  ansible.builtin.set_fact:
    _ha_reverse_proxy_provider: >-
      {{ (homelabinfra_infra | default({})).get('reverse_proxy', {}).get('provider', 'none') }}
    _ha_trusted_proxy_host: >-
      {{ (homelabinfra_infra | default({})).get('reverse_proxy', {}).get('host', '')
         | urlsplit('hostname') }}
  no_log: true

- name: Home Assistant | Assert the reverse proxy has a trusted IP address
  ansible.builtin.assert:
    that:
      - _ha_trusted_proxy_host is ansible.utils.ipv4_address
    fail_msg: >-
      Home Assistant is behind a reverse proxy, but its registered address is not an
      IPv4 address. Set homelabinfra_infra.reverse_proxy.host to the proxy's direct
      address before deploying.
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ home_assistant_project_dir }}"
    - "{{ app_config.app.config_path }}"

- name: Home Assistant | Seed default YAML configuration when a proxy is registered
  ansible.builtin.copy:
    dest: "{{ app_config.app.config_path }}/configuration.yaml"
    content: "default_config:\n"
    force: false
    owner: root
    group: root
    mode: "0640"
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Read existing YAML configuration privately
  ansible.builtin.slurp:
    src: "{{ app_config.app.config_path }}/configuration.yaml"
  register: _ha_configuration_file
  no_log: true
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Exclude the managed proxy block from authored configuration
  ansible.builtin.set_fact:
    _ha_authored_configuration: >-
      {{ _ha_configuration_file.content | b64decode
         | regex_replace('(?ms)^# BEGIN ANSIBLE MANAGED HOME ASSISTANT REVERSE PROXY\n.*?^# END ANSIBLE MANAGED HOME ASSISTANT REVERSE PROXY\n?', '') }}
  no_log: true
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Refuse to duplicate a user-owned HTTP integration
  ansible.builtin.assert:
    that:
      - _ha_authored_configuration | regex_search('(?m)^http\s*:') is none
    fail_msg: >-
      Home Assistant configuration.yaml already defines the HTTP integration. Merge
      the registered reverse proxy into that user-owned block before deploying again.
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Trust the registered reverse proxy
  ansible.builtin.blockinfile:
    path: "{{ app_config.app.config_path }}/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED HOME ASSISTANT REVERSE PROXY"
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - {{ _ha_trusted_proxy_host | to_json }}
    owner: root
    group: root
    mode: "0640"
  notify: Restart Home Assistant
  when: _ha_reverse_proxy_provider in ['caddy', 'nginx']

- name: Home Assistant | Store integration credentials in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: home-assistant
      instance: "{{ instance }}"
      integration_credentials: "{{ _ha_integration_credentials | to_json }}"
    vault_item_secret_fields: [integration_credentials]
  no_log: true

- name: Home Assistant | Render the hidden integration secrets
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ home_assistant_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Home Assistant

- name: Home Assistant | Render the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ home_assistant_compose_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Home Assistant

- name: Home Assistant | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ home_assistant_project_dir }}"

- name: Home Assistant | Start the application
  community.docker.docker_compose_v2:
    project_src: "{{ home_assistant_project_dir }}"
    state: present
    remove_orphans: true

- name: Home Assistant | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Home Assistant | Wait for the health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: 200
  register: _ha_health
  until: _ha_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Home Assistant | Export the application URL
  ansible.builtin.set_fact:
    home_assistant_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
