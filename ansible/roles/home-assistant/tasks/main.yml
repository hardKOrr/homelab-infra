---
- name: Home Assistant | Resolve integration credentials
  ansible.builtin.include_tasks: credentials.yml

- name: Home Assistant | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ home_assistant_project_dir }}"
    - "{{ app_config.app.config_path }}"

# Home Assistant owns this file after initialization, including after a restore.
- name: Home Assistant | Seed optional initial configuration
  ansible.builtin.copy:
    content: "{{ app_config.app.initial_configuration | to_nice_yaml }}"
    dest: "{{ app_config.app.config_path }}/configuration.yaml"
    owner: root
    group: root
    mode: "0640"
    force: false
  when: app_config.app.initial_configuration | default({}) | length > 0
  notify: Restart Home Assistant

- name: Home Assistant | Render the hidden integration secrets
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ home_assistant_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Home Assistant

- name: Home Assistant | Render the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ home_assistant_compose_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Home Assistant

- name: Home Assistant | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ home_assistant_project_dir }}"

- name: Home Assistant | Start the application
  community.docker.docker_compose_v2:
    project_src: "{{ home_assistant_project_dir }}"
    state: present
    remove_orphans: true

- name: Home Assistant | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Home Assistant | Wait for the health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: 200
  register: _ha_health
  until: _ha_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Home Assistant | Export the application URL
  ansible.builtin.set_fact:
    home_assistant_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
