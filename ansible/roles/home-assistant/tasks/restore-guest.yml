---
# Restore the config directory through the shared swap, on a Docker guest or a native one.
- name: Home Assistant restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Home Assistant restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Home Assistant restore | Preview or replace the config directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: "{{ app_config.hosting.method }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.config_path }}"
        owner: 0
        group: 0
        mode: "0750"
    recovery_swap_stop_services: "{{ ['homeassistant'] if app_config.hosting.method == 'docker' else [instance] }}"
    recovery_swap_compose_project: "{{ home_assistant_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/"
    # A native start may reinstall integration requirements before it answers.
    recovery_swap_health_retries: 180
    recovery_swap_health_delay: 5
