---
# The shared Compose deploy recreates the container when the Compose file, the seed
# configuration or the integration secrets (prepare.yml) changed, in the same up that
# creates it, so a new install is never restarted mid first boot.
- name: Home Assistant | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ home_assistant_project_dir }}"
    compose_recreate: >-
      {{ _ha_seed_written.changed | default(false) or _ha_secrets_written.changed | default(false) }}
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/"
      retries: 60

- name: Home Assistant | Export the application URL
  ansible.builtin.set_fact:
    home_assistant_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
