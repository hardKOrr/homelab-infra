---
# Remove App hook, run after the app's data is removed. Home Assistant's USB coordinator is
# a dedicated VM mapping, or a shared-mode bind on the stack LXC. The USB seams detach it
# only when they can prove this platform created it; an untagged operator assignment
# remains in place for manual recovery.
- name: Detach Home Assistant's project-owned Zigbee USB mapping
  ansible.builtin.include_tasks: ../../../tasks/proxmox/detach-usb-passthrough.yml
  vars:
    usb_passthrough_guest: "{{ inventory_hostname }}"
    usb_passthrough_device:
      mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
  when: >-
    app_config.app.usb_mapping | default('', true) | length > 0
    and app_config.stack | default('', true) | length == 0

- name: Detach Home Assistant's project-owned USB bind from the stack LXC
  ansible.builtin.include_tasks: ../../../tasks/proxmox/detach-usb-passthrough-lxc.yml
  vars:
    usb_lxc_guest: "{{ inventory_hostname }}"
    usb_lxc_device:
      mapping: "{{ app_config.app.usb_mapping | default('', true) }}"
  when:
    - app_config.app.usb_mapping | default('', true) | length > 0
    - app_config.stack | default('', true) | length > 0
    - not (hostvars['localhost']._rm_stack_has_other_apps | default(false) | bool)
