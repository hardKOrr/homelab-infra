---
- name: Home Assistant restore | Use the shared Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: Home Assistant restore | Use the restore swap on a Docker guest
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'docker'

- name: Home Assistant restore | Reject an unsupported restore hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('docker')) in ['docker', 'kubernetes']
    fail_msg: >-
      Home Assistant restore supports hosting.method docker or kubernetes; refusing to
      mutate a target hosted by an unsupported method.
