---
- name: Home Assistant restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Home Assistant restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Home Assistant restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Home Assistant restore | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Home Assistant. Deploy PBS before listing or restoring
      application data.

- name: Home Assistant restore | Resolve the backup identity
  ansible.builtin.set_fact:
    _ha_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
  no_log: true

- name: Home Assistant restore | List available snapshots in plan mode
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - BACKUP_ID
      - --env
      - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
      - --env
      - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  register: _ha_restore_snapshots
  changed_when: false
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _ha_restore_backup_id }}"
  no_log: true

- name: Home Assistant restore | Report the read-only plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. PBS snapshots for host/{{ _ha_restore_backup_id }}:
      {{ _ha_restore_snapshots.stdout | default('provide snapshot=<id> to select one') }}
  when: not (restore_overwrite | bool)

- name: Home Assistant restore | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-home-assistant-restore-"
  register: _ha_restore_tmp
  when: restore_overwrite | bool

- name: Home Assistant restore | Replace the application config from PBS
  when: restore_overwrite | bool
  block:
    - name: Home Assistant restore | Stop Home Assistant
      community.docker.docker_compose_v2:
        project_src: "{{ home_assistant_project_dir }}"
        state: stopped
        services: [homeassistant]

    - name: Home Assistant restore | Extract the selected archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _ha_restore_tmp.path }}:/restore"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - SNAPSHOT
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client restore "$SNAPSHOT" data.pxar /restore
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        SNAPSHOT: "{{ restore_snapshot }}"
      no_log: true
      changed_when: true

    - name: Home Assistant restore | Replace the config directory after archive validation
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: absent

    - name: Home Assistant restore | Recreate the config directory
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Home Assistant restore | Copy the archived state into place
      ansible.builtin.command:
        argv: [cp, -a, "{{ _ha_restore_tmp.path }}/.", "{{ app_config.app.config_path }}/"]
      changed_when: true
      no_log: true

    - name: Home Assistant restore | Start Home Assistant
      community.docker.docker_compose_v2:
        project_src: "{{ home_assistant_project_dir }}"
        state: present
        services: [homeassistant]

    - name: Home Assistant restore | Wait for the restored service
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/"
        status_code: 200
      register: _ha_restore_health
      until: _ha_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Home Assistant restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Home Assistant restore | Leave the service stopped after a failed restore
      ansible.builtin.fail:
        msg: >-
          Home Assistant restore did not complete. The service is intentionally left
          stopped; inspect the recovered config and retry after correcting the failure.
  always:
    - name: Home Assistant restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _ha_restore_tmp.path }}"
        state: absent
      when: _ha_restore_tmp.path is defined
