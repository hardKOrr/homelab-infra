---
# Home Assistant's config directory contains its SQLite state, integrations, generated
# secrets, and registry. Quiescing the one Compose service makes the directory an
# application-consistent recovery unit rather than relying only on a crash-consistent VM
# snapshot.
- name: Home Assistant backup | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Home Assistant needs its application-consistent backup contract and a configured PBS
      before an on-demand backup can run.

- name: Home Assistant backup | Verify the config directory exists
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _ha_backup_config
  changed_when: false

- name: Home Assistant backup | Refuse an incomplete recovery point
  ansible.builtin.assert:
    that:
      - _ha_backup_config.stat.exists
      - _ha_backup_config.stat.isdir
    fail_msg: >-
      Home Assistant config path {{ app_config.app.config_path }} is missing; refusing to
      create a backup without application state.

- name: Home Assistant backup | Quiesce Home Assistant and archive its config directory to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ home_assistant_project_dir }}"
    pbs_client_stop_services: [homeassistant]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: Home Assistant backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
