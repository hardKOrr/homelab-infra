---
# Inputs shared by every guest method: credentials, directories, seed config and secrets.
# Their writes notify the native restart; on Docker, docker.yml recreates the project
# instead, from the registered results.
- name: Home Assistant | Resolve integration credentials
  ansible.builtin.include_tasks: credentials.yml

- name: Home Assistant | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ home_assistant_project_dir }}"
    - "{{ app_config.app.config_path }}"

- name: Home Assistant | Resolve the reverse proxy's source addresses
  ansible.builtin.include_tasks: ../../../tasks/wiring/proxy-sources.yml

# Home Assistant owns this file after initialization, including after a restore. The seed
# trusts the platform reverse proxy (configuration.yaml.j2).
- name: Home Assistant | Seed the initial configuration
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.template', 'configuration.yaml.j2',
                template_vars={'_ha_trusted_proxies': wiring_proxy_sources}) }}
    dest: "{{ app_config.app.config_path }}/configuration.yaml"
    owner: root
    group: root
    mode: "0640"
    force: false
  register: _ha_seed_written

# The default seed includes the automation editor's file, which must exist before start.
- name: Home Assistant | Create the automation editor's file
  ansible.builtin.copy:
    content: "[]\n"
    dest: "{{ app_config.app.config_path }}/automations.yaml"
    owner: root
    group: root
    mode: "0640"
    force: false
  notify: Restart Home Assistant

- name: Home Assistant | Render the hidden integration secrets
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ home_assistant_secrets_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: _ha_secrets_written
  notify: Restart Home Assistant
