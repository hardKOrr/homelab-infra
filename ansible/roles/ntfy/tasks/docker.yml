---
# Docker hosting: the official image under Compose on the stack host. State and config are
# bind-mounted at the same paths the server config names; the container runs as root, so
# the directories are root-owned.
# The shared Compose deploy renders the server config with the project and recreates the
# container when either changed, in the same up that creates it, so a new install is never
# restarted mid first boot; credentials are provisioned only after it answers.
- name: Ntfy | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ ntfy_project_dir }}"
    compose_dirs: ["{{ ntfy_data_dir }}", "{{ ntfy_cache_dir }}"]
    compose_files:
      - src: server.yml.j2
        dest: "{{ ntfy_config_file }}"
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/v1/health"
