---
# Restore Ntfy's auth database and message cache as one application recovery unit.
# Both replacements are staged and validated first; live directories stay available
# for rollback until the restored service passes health and auth-database checks.
- name: Ntfy restore | Resolve source, target, paths and recovery identity
  ansible.builtin.set_fact:
    _ntfy_restore_data_path: "{{ app_config.app.data_path | default('') }}"
    _ntfy_restore_cache_path: "{{ app_config.app.cache_path | default('') }}"
    _ntfy_restore_auth_file: "{{ ntfy_auth_file }}"
    _ntfy_restore_cache_file: "{{ ntfy_cache_file }}"
    _ntfy_restore_auth_relative: >-
      {{ ntfy_auth_file | replace((app_config.app.data_path | default('')).rstrip('/') ~ '/', '') }}
    _ntfy_restore_service_name: "{{ app_config.app.service_name | default(ntfy_service_name) }}"
    _ntfy_restore_source_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _ntfy_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}
    _ntfy_restore_snapshot: "{{ restore_snapshot | default('') }}"
    _application_restore_complete: false
    _ntfy_restore_data_moved: false
    _ntfy_restore_cache_moved: false
    _ntfy_restore_data_installed: false
    _ntfy_restore_cache_installed: false
    _ntfy_restore_rollback_complete: false

- name: Ntfy restore | Assert the recovery contract and safe paths
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _ntfy_restore_data_path is match('^/[^/].*')
      - _ntfy_restore_cache_path is match('^/[^/].*')
      - _ntfy_restore_data_path != '/'
      - _ntfy_restore_cache_path != '/'
      - _ntfy_restore_data_path != _ntfy_restore_cache_path
      - not _ntfy_restore_data_path.startswith(_ntfy_restore_cache_path.rstrip('/') ~ '/')
      - not _ntfy_restore_cache_path.startswith(_ntfy_restore_data_path.rstrip('/') ~ '/')
      - _ntfy_restore_auth_file.startswith(_ntfy_restore_data_path.rstrip('/') ~ '/')
      - _ntfy_restore_cache_file.startswith(_ntfy_restore_cache_path.rstrip('/') ~ '/')
      - _ntfy_restore_auth_relative | length > 0
      - _ntfy_restore_source_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - _ntfy_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_overwrite is defined
      - (_ntfy_restore_snapshot | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Ntfy restore needs its application-consistent contract, separate data/cache paths,
      safe backup identities, PBS, and a selected recovery point for overwrite=true.

- name: Ntfy restore | Require the source point to belong to its backup group
  ansible.builtin.assert:
    that:
      - _ntfy_restore_snapshot.startswith('host/' ~ _ntfy_restore_source_backup_id ~ '/')
      - _ntfy_restore_snapshot | length > ('host/' ~ _ntfy_restore_source_backup_id ~ '/') | length
    fail_msg: >-
      The selected Ntfy recovery point must belong to
      host/{{ _ntfy_restore_source_backup_id }}/.
  when: _ntfy_restore_snapshot | length > 0

- name: Ntfy restore | Require the existing-target point to belong to its backup group
  ansible.builtin.assert:
    that:
      - restore_pre_restore_point.startswith('host/' ~ _ntfy_restore_target_backup_id ~ '/')
      - restore_pre_restore_point | length > ('host/' ~ _ntfy_restore_target_backup_id ~ '/') | length
    fail_msg: >-
      The independent Ntfy pre-restore point must belong to
      host/{{ _ntfy_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Ntfy restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Ntfy restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Ntfy. Deploy PBS before listing or restoring
      application data.

- name: Ntfy restore | Require the installed PBS client
  ansible.builtin.stat:
    path: /usr/bin/proxmox-backup-client
  register: _ntfy_restore_client
  changed_when: false

- name: Ntfy restore | Require the PBS client binary
  ansible.builtin.assert:
    that: _ntfy_restore_client.stat.exists and _ntfy_restore_client.stat.isreg
    fail_msg: >-
      Ntfy has no installed PBS client. Deploy the instance with the current Ntfy role
      before requesting an application restore.

- name: Ntfy restore | List source recovery points in plan mode
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - list
      - "host/{{ _ntfy_restore_source_backup_id }}"
      - --output-format
      - text
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _ntfy_restore_snapshots
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - not (restore_overwrite | bool)
    - _ntfy_restore_snapshot | length == 0

- name: Ntfy restore | Report a failed snapshot listing
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _ntfy_restore_snapshots }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Ntfy restore | PBS snapshot listing failed
  when:
    - _ntfy_restore_snapshots is defined
    - not (_ntfy_restore_snapshots.skipped | default(false) | bool)

- name: Ntfy restore | Show source recovery points in plan mode
  ansible.builtin.debug:
    msg: >-
      PBS recovery points for host/{{ _ntfy_restore_source_backup_id }}:
      {{ _ntfy_restore_snapshots.stdout }}
  when:
    - not (restore_overwrite | bool)
    - _ntfy_restore_snapshot | length == 0

- name: Ntfy restore | Verify the selected recovery point archives
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _ntfy_restore_snapshot }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _ntfy_restore_source_files
  failed_when: false
  changed_when: false
  no_log: true
  when: _ntfy_restore_snapshot | length > 0

- name: Ntfy restore | Report an unavailable source archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _ntfy_restore_source_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Ntfy restore | selected PBS point is unavailable
  when: _ntfy_restore_source_files is defined

- name: Ntfy restore | Require both application archives
  ansible.builtin.assert:
    that:
      - "'data.pxar' in _ntfy_restore_source_files.stdout"
      - "'cache.pxar' in _ntfy_restore_source_files.stdout"
    fail_msg: >-
      Recovery point {{ _ntfy_restore_snapshot }} lacks Ntfy's auth database or cache
      archive; the current instance has not been changed.
  when: _ntfy_restore_snapshot | length > 0

- name: Ntfy restore | Verify the independent pre-restore archives
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ restore_pre_restore_point }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _ntfy_restore_prepoint_files
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Ntfy restore | Report an unavailable pre-restore archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _ntfy_restore_prepoint_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Ntfy restore | pre-restore point is unavailable
  when: _ntfy_restore_prepoint_files is defined

- name: Ntfy restore | Require both independent safety archives
  ansible.builtin.assert:
    that:
      - "'data.pxar' in _ntfy_restore_prepoint_files.stdout"
      - "'cache.pxar' in _ntfy_restore_prepoint_files.stdout"
    fail_msg: >-
      Pre-restore point {{ restore_pre_restore_point }} lacks Ntfy's auth database or
      cache archive for the target instance.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: Ntfy restore | Explain the selected read-only plan
  ansible.builtin.debug:
    msg: >-
      No Ntfy data was changed. Re-run with overwrite=true and
      pre_restore_point=<independent target recovery point> to replace the auth database
      and message cache from {{ _ntfy_restore_snapshot }}.
  when:
    - not (restore_overwrite | bool)
    - _ntfy_restore_snapshot | length > 0

- name: Ntfy restore | Check the live data and cache directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _ntfy_restore_data_path }}"
    - "{{ _ntfy_restore_cache_path }}"
  register: _ntfy_restore_targets
  changed_when: false
  when: restore_overwrite | bool

- name: Ntfy restore | Refuse unsafe live state paths
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
    fail_msg: >-
      Ntfy restore target {{ item.item }} is missing, linked or not a directory.
  loop: "{{ _ntfy_restore_targets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: restore_overwrite | bool

- name: Ntfy restore | Replace and verify both state directories
  when: restore_overwrite | bool
  block:
    - name: Ntfy restore | Create private staging directories beside each live path
      ansible.builtin.tempfile:
        state: directory
        path: "{{ item.path | dirname }}"
        prefix: "{{ item.prefix }}"
      loop:
        - path: "{{ _ntfy_restore_data_path }}"
          prefix: .ntfy-restore-data-
        - path: "{{ _ntfy_restore_cache_path }}"
          prefix: .ntfy-restore-cache-
      register: _ntfy_restore_stages

    - name: Ntfy restore | Create private rollback directories beside each live path
      ansible.builtin.tempfile:
        state: directory
        path: "{{ item.path | dirname }}"
        prefix: "{{ item.prefix }}"
      loop:
        - path: "{{ _ntfy_restore_data_path }}"
          prefix: .ntfy-pre-restore-data-
        - path: "{{ _ntfy_restore_cache_path }}"
          prefix: .ntfy-pre-restore-cache-
      register: _ntfy_restore_previous

    - name: Ntfy restore | Create auth and cache staging targets
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ _ntfy_restore_stages.results[0].path }}/data"
        - "{{ _ntfy_restore_stages.results[1].path }}/cache"

    - name: Ntfy restore | Stop only this instance
      ansible.builtin.systemd_service:
        name: "{{ _ntfy_restore_service_name }}"
        state: stopped

    - name: Ntfy restore | Record that the service is stopped
      ansible.builtin.set_fact:
        _ntfy_restore_service_stopped: true

    - name: Ntfy restore | Extract the selected auth database archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _ntfy_restore_snapshot }}"
          - data.pxar
          - "{{ _ntfy_restore_stages.results[0].path }}/data"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _ntfy_restore_data_extract
      failed_when: false
      changed_when: true
      no_log: true

    - name: Ntfy restore | Report an invalid auth database archive
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _ntfy_restore_data_extract }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: Ntfy restore | auth database extraction failed

    - name: Ntfy restore | Extract the selected cache archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _ntfy_restore_snapshot }}"
          - cache.pxar
          - "{{ _ntfy_restore_stages.results[1].path }}/cache"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _ntfy_restore_cache_extract
      failed_when: false
      changed_when: true
      no_log: true

    - name: Ntfy restore | Report an invalid cache archive
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _ntfy_restore_cache_extract }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
        scrub_failure_context: Ntfy restore | cache extraction failed

    - name: Ntfy restore | Check the staged auth database
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ _ntfy_restore_stages.results[0].path }}/data/{{ _ntfy_restore_auth_relative }}"
      register: _ntfy_restore_staged_auth_database
      changed_when: false
      no_log: true

    - name: Ntfy restore | Require the staged auth database
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk
        fail_msg: >-
          The selected Ntfy recovery point is missing its auth database; live state has
          not been replaced. An empty message cache is a valid recovery point.
      loop: "{{ _ntfy_restore_staged_auth_database.results }}"
      no_log: true

    - name: Ntfy restore | Move the original auth data aside on the same filesystem
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_data_path }}"
          - "{{ _ntfy_restore_previous.results[0].path }}/state"
      register: _ntfy_restore_move_data
      changed_when: _ntfy_restore_move_data.rc == 0

    - name: Ntfy restore | Record the original auth data move
      ansible.builtin.set_fact:
        _ntfy_restore_data_moved: true

    - name: Ntfy restore | Move the original cache aside on the same filesystem
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_cache_path }}"
          - "{{ _ntfy_restore_previous.results[1].path }}/state"
      register: _ntfy_restore_move_cache
      changed_when: _ntfy_restore_move_cache.rc == 0

    - name: Ntfy restore | Record the original cache move
      ansible.builtin.set_fact:
        _ntfy_restore_cache_moved: true

    - name: Ntfy restore | Move the staged auth data into place
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_stages.results[0].path }}/data"
          - "{{ _ntfy_restore_data_path }}"
      register: _ntfy_restore_install_data
      changed_when: _ntfy_restore_install_data.rc == 0

    - name: Ntfy restore | Record the auth data replacement
      ansible.builtin.set_fact:
        _ntfy_restore_data_installed: true

    - name: Ntfy restore | Move the staged cache into place
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_stages.results[1].path }}/cache"
          - "{{ _ntfy_restore_cache_path }}"
      register: _ntfy_restore_install_cache
      changed_when: _ntfy_restore_install_cache.rc == 0

    - name: Ntfy restore | Record the cache replacement
      ansible.builtin.set_fact:
        _ntfy_restore_cache_installed: true

    - name: Ntfy restore | Restore application data ownership
      ansible.builtin.command:
        argv:
          - chown
          - -R
          - ntfy:ntfy
          - "{{ _ntfy_restore_data_path }}"
          - "{{ _ntfy_restore_cache_path }}"
      changed_when: true

    - name: Ntfy restore | Set data and cache directory permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ntfy
        group: ntfy
        mode: "0750"
      loop:
        - "{{ _ntfy_restore_data_path }}"
        - "{{ _ntfy_restore_cache_path }}"

    - name: Ntfy restore | Start only this instance
      ansible.builtin.systemd_service:
        name: "{{ _ntfy_restore_service_name }}"
        state: started

    - name: Ntfy restore | Wait for the restored service
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/v1/health"
        status_code: 200
      register: _ntfy_restore_health
      until: _ntfy_restore_health.status | default(0) == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Ntfy restore | Read the restored auth database
      ansible.builtin.command:
        argv: [ntfy, user, list]
      register: _ntfy_restore_users
      changed_when: false

    - name: Ntfy restore | Require the auth database to be readable
      ansible.builtin.assert:
        that: _ntfy_restore_users.rc == 0
        fail_msg: Ntfy's restored auth database could not be read by the ntfy CLI.

    - name: Ntfy restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Ntfy restore | Stop the service after a failed replacement
      ansible.builtin.systemd_service:
        name: "{{ _ntfy_restore_service_name }}"
        state: stopped

    - name: Ntfy restore | Remove the failed auth replacement
      ansible.builtin.file:
        path: "{{ _ntfy_restore_data_path }}"
        state: absent
      when: _ntfy_restore_data_installed | bool

    - name: Ntfy restore | Remove the failed cache replacement
      ansible.builtin.file:
        path: "{{ _ntfy_restore_cache_path }}"
        state: absent
      when: _ntfy_restore_cache_installed | bool

    - name: Ntfy restore | Put the original auth data back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_previous.results[0].path }}/state"
          - "{{ _ntfy_restore_data_path }}"
      changed_when: true
      when: _ntfy_restore_data_moved | bool

    - name: Ntfy restore | Put the original cache back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _ntfy_restore_previous.results[1].path }}/state"
          - "{{ _ntfy_restore_cache_path }}"
      changed_when: true
      when: _ntfy_restore_cache_moved | bool

    - name: Ntfy restore | Record the completed rollback
      ansible.builtin.set_fact:
        _ntfy_restore_rollback_complete: true

    - name: Ntfy restore | Restart the service after rollback
      ansible.builtin.systemd_service:
        name: "{{ _ntfy_restore_service_name }}"
        state: started
      when: _ntfy_restore_rollback_complete | bool

    - name: Ntfy restore | Report the failed restore
      ansible.builtin.fail:
        msg: >-
          Ntfy restore failed. The original auth database and cache were restored and the
          service restarted. If rollback itself failed, inspect the retained directories
          beside {{ _ntfy_restore_data_path }} and {{ _ntfy_restore_cache_path }} before
          retrying.
  always:
    - name: Ntfy restore | Remove auth rollback data after success or rollback
      ansible.builtin.file:
        path: "{{ _ntfy_restore_previous.results[0].path }}"
        state: absent
      when:
        - _ntfy_restore_previous.results is defined
        - >-
          (_application_restore_complete | bool)
          or (_ntfy_restore_rollback_complete | bool)
          or not (_ntfy_restore_data_moved | bool)

    - name: Ntfy restore | Remove cache rollback data after success or rollback
      ansible.builtin.file:
        path: "{{ _ntfy_restore_previous.results[1].path }}"
        state: absent
      when:
        - _ntfy_restore_previous.results is defined
        - >-
          (_application_restore_complete | bool)
          or (_ntfy_restore_rollback_complete | bool)
          or not (_ntfy_restore_cache_moved | bool)

    - name: Ntfy restore | Remove private staging data after success or rollback
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ntfy_restore_stages.results | default([]) }}"
      when:
        - item.path is defined
        - >-
          (_application_restore_complete | bool)
          or (_ntfy_restore_rollback_complete | bool)
          or not (_ntfy_restore_data_moved | bool and _ntfy_restore_cache_moved | bool)
