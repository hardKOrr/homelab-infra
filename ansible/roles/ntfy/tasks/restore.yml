---
- name: Ntfy restore | Use the shared Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) == 'kubernetes'

- name: Ntfy restore | Use the restore swap on a native or Docker guest
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) in ['native', 'docker']

- name: Ntfy restore | Reject an unsupported hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('native')) in ['native', 'docker', 'kubernetes']
    fail_msg: >-
      Ntfy restore supports hosting.method native, docker or kubernetes; refusing to mutate a
      target hosted by an unsupported method.
