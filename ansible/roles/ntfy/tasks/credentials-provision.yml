---
# CLI commands use `ntfy` directly on an LXC or kubectl exec on the cluster node. The
# database and CLI behavior stay the same across hosting methods.
- name: List existing ntfy users
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['user', 'list'] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  register: _ntfy_user_list
  changed_when: false

- name: Create publish account
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['user', 'add', '--role=user', _ntfy_user] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  environment:
    NTFY_PASSWORD: "{{ _ntfy_password }}"
  when: _ntfy_user_list.stdout is not search(_ntfy_user_re, multiline=True)
  changed_when: true
  no_log: true

- name: Reset publish account password after creating its vault value
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['user', 'change-pass', _ntfy_user] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  environment:
    NTFY_PASSWORD: "{{ _ntfy_password }}"
  when:
    - not (_ntfy_password_known | bool)
    - _ntfy_user_list.stdout is search(_ntfy_user_re, multiline=True)
  changed_when: true
  no_log: true

- name: Read the publish account's current topic access
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['access', _ntfy_user] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  register: _ntfy_access_list
  changed_when: false

- name: Grant read-write access on the homelab topic
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['access', _ntfy_user, app_config.app.topic, 'rw'] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  vars:
    _ntfy_access_re: >-
      ^-\s+read-write access to topic {{ app_config.app.topic | regex_escape }}\s*$
  when: not (_ntfy_access_list.stdout is search(_ntfy_access_re, multiline=True))
  changed_when: true

- name: List existing access tokens
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['token', 'list', _ntfy_user] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  register: _ntfy_token_list
  changed_when: false
  no_log: true

- name: Recover the homelab-infra token from Ntfy
  ansible.builtin.set_fact:
    _ntfy_existing_token: >-
      {{ (_ntfy_token_list.stdout_lines | default([])
          | select('search', ntfy_token_label)
          | map('regex_search', 'tk_[A-Za-z0-9]+')
          | select('string') | list | first | default('')) }}
  no_log: true

- name: Create access token
  ansible.builtin.command:
    argv: "{{ ntfy_cli_prefix + ['token', 'add', '--label', ntfy_token_label, _ntfy_user] }}"
  delegate_to: "{{ ntfy_cli_delegate }}"
  become: true
  register: _ntfy_token_add
  when: _ntfy_existing_token | length == 0
  changed_when: true
  no_log: true

- name: Select the effective access token
  ansible.builtin.set_fact:
    _ntfy_token: >-
      {{ _ntfy_existing_token if _ntfy_existing_token | length > 0
         else (_ntfy_token_add.stdout | default('')
               | regex_search('tk_[A-Za-z0-9]+') | default('', true)) }}
  no_log: true

- name: Assert a publish token is available
  ansible.builtin.assert:
    that: _ntfy_token | length > 0
    fail_msg: "Could not obtain an Ntfy access token for {{ _ntfy_user }}."

- name: Store and verify the effective publish credentials
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/notifications
    vault_item_fields:
      provider: ntfy
      instance: "{{ instance }}"
      host: "{{ ntfy_publish_host_url }}"
      topic: "{{ app_config.app.topic }}"
      user: "{{ _ntfy_user }}"
      password: "{{ _ntfy_password }}"
      token: "{{ _ntfy_token }}"
    vault_item_secret_fields: [password, token]

- name: Verify authenticated publish succeeds
  ansible.builtin.uri:
    url: "{{ ntfy_http_base_url }}/{{ app_config.app.topic }}"
    method: POST
    headers: >-
      {{ {'Authorization': 'Bearer ' ~ _ntfy_token, 'Title': 'Ntfy deployed'}
         | combine({'Host': ntfy_http_host_header}
                   if ntfy_http_host_header | default('') | length > 0 else {}) }}
    body: "{{ instance }} is up — homelab-infra notifications route to this topic."
    body_format: raw
    status_code: 200
  changed_when: false
  no_log: true

- name: Verify anonymous publish is denied
  ansible.builtin.uri:
    url: "{{ ntfy_http_base_url }}/{{ app_config.app.topic }}"
    method: POST
    headers: >-
      {{ {'Host': ntfy_http_host_header}
         if ntfy_http_host_header | default('') | length > 0 else {} }}
    body: "anonymous publish probe"
    body_format: raw
    status_code: [401, 403]
  changed_when: false

- name: Export publish credentials to the playbook
  ansible.builtin.set_fact:
    ntfy_publish_user: "{{ _ntfy_user }}"
    ntfy_publish_password: "{{ _ntfy_password }}"
    ntfy_publish_token: "{{ _ntfy_token }}"
    ntfy_publish_host: "{{ ntfy_publish_host_url }}"
  no_log: true
