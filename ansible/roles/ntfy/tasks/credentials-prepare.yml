---
- name: Resolve publish credentials
  ansible.builtin.set_fact:
    _ntfy_user: "{{ app_config.app.user | default('homelab') }}"
    # Reuse credentials recorded during bootstrap; generate only on a first deploy.
    _ntfy_password: >-
      {{ ((homelabinfra_infra | default({})).get('notifications', {}).get('password', ''))
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    _ntfy_password_known: >-
      {{ ((homelabinfra_infra | default({})).get('notifications', {}).get('password', '')
          | length) > 0 }}
    # Match the user line prefix while keeping a similarly named account distinct.
    _ntfy_user_re: >-
      {{ '^user ' ~ (app_config.app.user | default('homelab') | regex_escape) ~ '(\s|$)' }}
  no_log: true

# Merge this value before applying it so a failed first deploy cannot leave an unrecorded
# password. The second write in credentials-provision.yml adds the token.
- name: Store publish account secret before applying it
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: homelab-infra/notifications
    vault_item_merge: true
    vault_item_fields:
      provider: ntfy
      instance: "{{ instance }}"
      host: "{{ ntfy_publish_host_url }}"
      topic: "{{ app_config.app.topic }}"
      user: "{{ _ntfy_user }}"
      password: "{{ _ntfy_password }}"
    vault_item_secret_fields: [password]
