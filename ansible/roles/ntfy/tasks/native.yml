---
# Native hosting: the official .deb under systemd on a dedicated LXC.
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl # lab-update-check
      - ca-certificates
    state: present
    update_cache: true

- name: Check installed ntfy version
  ansible.builtin.command:
    cmd: "{{ app_config['update'].binary_path }} --version"
  register: _ntfy_installed
  failed_when: false
  changed_when: false

- name: Get latest release info
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ app_config['update'].github_repo }}/releases/latest"
    return_content: true
  register: _ntfy_release
  changed_when: false

- name: Set version facts
  ansible.builtin.set_fact:
    _ntfy_installed_version: >-
      {{ (_ntfy_installed.stdout | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
         if _ntfy_installed.rc == 0 else 'none' }}
    _ntfy_latest_version: "{{ _ntfy_release.json.tag_name | regex_replace('^v', '') }}"

- name: Select the amd64 Debian package for {{ _ntfy_latest_version }}
  ansible.builtin.set_fact:
    _ntfy_deb_url: >-
      {{ _ntfy_release.json.assets
         | selectattr('name', 'search', '_linux_amd64\.deb$')
         | map(attribute='browser_download_url')
         | first | default('') }}

- name: Assert a Debian package was published for this release
  ansible.builtin.assert:
    that: _ntfy_deb_url | length > 0
    fail_msg: >-
      Release {{ _ntfy_latest_version }} of {{ app_config['update'].github_repo }}
      publishes no *_linux_amd64.deb asset. Pin an older version in
      config/apps/{{ instance }}.yml or install manually.

- name: Install ntfy {{ _ntfy_latest_version }} from the official package
  ansible.builtin.apt:
    deb: "{{ _ntfy_deb_url }}"
  when: _ntfy_installed_version != _ntfy_latest_version
  notify: Restart ntfy

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create ntfy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ntfy
    group: ntfy
    mode: "0750"
  loop:
    - "{{ ntfy_data_dir }}"
    - "{{ ntfy_cache_dir }}"

# ── Configure ─────────────────────────────────────────────────────────────────
- name: Write server config
  ansible.builtin.template:
    src: server.yml.j2
    dest: "{{ ntfy_config_file }}"
    owner: root
    group: ntfy
    mode: "0640"
  notify: Restart ntfy

- name: Enable and start ntfy service
  ansible.builtin.systemd:
    name: "{{ ntfy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before provisioning credentials
  ansible.builtin.meta: flush_handlers

- name: Wait for ntfy to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/v1/health"
    status_code: 200
  register: _ntfy_health
  until: _ntfy_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
