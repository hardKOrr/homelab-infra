---
# Stop Ntfy so its SQLite auth database and message cache share one recovery point.
# The generated server config stays managed by Deploy; only app-owned mutable state is
# archived here.
- name: Ntfy backup | Resolve state paths and recovery identity
  ansible.builtin.set_fact:
    _ntfy_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _ntfy_backup_cache_path: "{{ app_config.app.cache_path | default('') }}"
    _ntfy_backup_auth_file: "{{ ntfy_auth_file }}"
    _ntfy_backup_cache_file: "{{ ntfy_cache_file }}"
    _ntfy_backup_service_name: "{{ app_config.app.service_name | default(ntfy_service_name) }}"
    _ntfy_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: Ntfy backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _ntfy_backup_data_path is match('^/[^/].*')
      - _ntfy_backup_cache_path is match('^/[^/].*')
      - _ntfy_backup_data_path != '/'
      - _ntfy_backup_cache_path != '/'
      - _ntfy_backup_data_path != _ntfy_backup_cache_path
      - not _ntfy_backup_data_path.startswith(_ntfy_backup_cache_path.rstrip('/') ~ '/')
      - not _ntfy_backup_cache_path.startswith(_ntfy_backup_data_path.rstrip('/') ~ '/')
      - _ntfy_backup_auth_file.startswith(_ntfy_backup_data_path.rstrip('/') ~ '/')
      - _ntfy_backup_cache_file.startswith(_ntfy_backup_cache_path.rstrip('/') ~ '/')
      - _ntfy_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Ntfy backup needs its application-consistent contract, separate data/cache paths,
      an auth database and a safe backup id, plus a configured PBS target.

- name: Ntfy backup | Check the data and cache directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _ntfy_backup_data_path }}"
    - "{{ _ntfy_backup_cache_path }}"
  register: _ntfy_backup_directories
  changed_when: false

- name: Ntfy backup | Require real data and cache directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
    fail_msg: "Ntfy recovery path {{ item.item }} is missing, linked, or not a directory."
  loop: "{{ _ntfy_backup_directories.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ntfy backup | Check the auth database
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _ntfy_backup_auth_file }}"
  register: _ntfy_backup_auth_database
  changed_when: false
  no_log: true

- name: Ntfy backup | Require the auth database
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: >-
      Ntfy's auth database is missing; refusing to create an incomplete application
      recovery point. The cache directory itself is still archived when empty.
  loop: "{{ _ntfy_backup_auth_database.results }}"
  no_log: true

- name: Ntfy backup | Quiesce Ntfy and archive auth and cache state to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: native
    pbs_client_backup_id: "{{ _ntfy_backup_id }}"
    pbs_client_stop_services: ["{{ _ntfy_backup_service_name }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ _ntfy_backup_data_path }}"
      - name: cache.pxar
        path: "{{ _ntfy_backup_cache_path }}"

- name: Ntfy backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
