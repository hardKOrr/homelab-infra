---
# Shared native Deploy/Restore credential reconciliation. The live auth database
# supplies the effective token, including when a prior recovery point is restored.
- name: Set native credential command inputs
  ansible.builtin.set_fact:
    ntfy_cli_prefix: [ntfy]
    ntfy_cli_delegate: "{{ inventory_hostname }}"
    ntfy_publish_host_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
    ntfy_http_base_url: "http://localhost:{{ app_config.app.port }}"
    ntfy_http_host_header: ""

- name: Provision the publish account and token
  ansible.builtin.include_tasks: credentials.yml

# Deploy and Restore can both change the effective token. Refresh the guest-local
# notification hook from that token before returning, so the next Deploy is a no-op.
- name: Merge the current Ntfy credentials into guest infrastructure facts
  ansible.builtin.set_fact:
    homelabinfra_infra: >-
      {{ (homelabinfra_infra | default({}))
         | combine({
             'notifications': ((homelabinfra_infra | default({})).get('notifications', {})
               | combine({
                   'provider': 'ntfy',
                   'instance': instance,
                   'host': 'http://' ~ (ansible_host | default(ansible_default_ipv4.address))
                           ~ ':' ~ (app_config.app.port | string),
                   'topic': app_config.app.topic,
                   'token': ntfy_publish_token
                 }, recursive=True))
           }, recursive=True) }}

  no_log: true

# Use the same OS-update setup as bootstrap; keep its token file in sync with Ntfy.
- name: Configure OS update notifications
  ansible.builtin.import_tasks: ../../../tasks/bootstrap/configure-unattended-upgrades.yml
