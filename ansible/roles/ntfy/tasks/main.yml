---
# ntfy role — native LXC deployment (official .deb from GitHub releases).
# The opt-in Kubernetes path is in kubernetes.yml and uses the official upstream image.
# Called from Play 2 of playbooks/apps/ntfy.yml. Target: dedicated LXC.
#
# Install channel: upstream publishes a Debian package per release
# (ntfy_<ver>_linux_amd64.deb), so there is no image-extraction dance here —
# contrast roles/vaultwarden, which has no binary assets upstream.
#
# Credentials: the publish account's
# password and access token are generated on first deploy and stored in the
# canonical `homelab-infra/notifications` item. The guest keeps a
# bcrypt hash in ntfy's own auth database — no plaintext secret is written to the
# guest filesystem. On re-run the existing values come from Vaultwarden, so the
# credentials every other tool was configured with stay valid.
#
# A new password is stored and verified before apply; an API-returned token is stored
# immediately after creation.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the notifications registry key):
#   ntfy_publish_user, ntfy_publish_password, ntfy_publish_token

- name: Set domain fact for the server config
  ansible.builtin.set_fact:
    _ntfy_domain: >-
      {{ homelabinfra_infra.domain
         | default(homelabinfra_config.infrastructure.domain, true) }}

# ── Install ───────────────────────────────────────────────────────────────────
- name: Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl # lab-update-check
      - ca-certificates
    state: present
    update_cache: true

- name: Check installed ntfy version
  ansible.builtin.command:
    cmd: "{{ app_config['update'].binary_path }} --version"
  register: _ntfy_installed
  failed_when: false
  changed_when: false

- name: Get latest release info
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ app_config['update'].github_repo }}/releases/latest"
    return_content: true
  register: _ntfy_release
  changed_when: false

- name: Set version facts
  ansible.builtin.set_fact:
    _ntfy_installed_version: >-
      {{ (_ntfy_installed.stdout | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
         if _ntfy_installed.rc == 0 else 'none' }}
    _ntfy_latest_version: "{{ _ntfy_release.json.tag_name | regex_replace('^v', '') }}"

- name: Select the amd64 Debian package for {{ _ntfy_latest_version }}
  ansible.builtin.set_fact:
    _ntfy_deb_url: >-
      {{ _ntfy_release.json.assets
         | selectattr('name', 'search', '_linux_amd64\.deb$')
         | map(attribute='browser_download_url')
         | first | default('') }}

- name: Assert a Debian package was published for this release
  ansible.builtin.assert:
    that: _ntfy_deb_url | length > 0
    fail_msg: >-
      Release {{ _ntfy_latest_version }} of {{ app_config['update'].github_repo }}
      publishes no *_linux_amd64.deb asset. Pin an older version in
      config/apps/{{ instance }}.yml or install manually.

- name: Install ntfy {{ _ntfy_latest_version }} from the official package
  ansible.builtin.apt:
    deb: "{{ _ntfy_deb_url }}"
  when: _ntfy_installed_version != _ntfy_latest_version
  notify: Restart ntfy

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create ntfy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ntfy
    group: ntfy
    mode: "0750"
  loop:
    - "{{ app_config.app.data_path }}"
    - "{{ app_config.app.cache_path }}"

# ── Configure ─────────────────────────────────────────────────────────────────
- name: Write server config
  ansible.builtin.template:
    src: server.yml.j2
    dest: "{{ ntfy_config_file }}"
    owner: root
    group: ntfy
    mode: "0640"
  notify: Restart ntfy

- name: Enable and start ntfy service
  ansible.builtin.systemd:
    name: "{{ ntfy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before provisioning credentials
  ansible.builtin.meta: flush_handlers

- name: Wait for ntfy to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/v1/health"
    status_code: 200
  register: _ntfy_health
  until: _ntfy_health.status == 200
  retries: 30
  delay: 5
  changed_when: false

# ── Publish account ───────────────────────────────────────────────────────────
- name: Set native credential command inputs
  ansible.builtin.set_fact:
    ntfy_cli_prefix: [ntfy]
    ntfy_cli_delegate: "{{ inventory_hostname }}"
    ntfy_publish_host_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
    ntfy_http_base_url: "http://localhost:{{ app_config.app.port }}"
    ntfy_http_host_header: ""

- name: Provision the publish account and token
  ansible.builtin.include_tasks: credentials.yml

# ── Lab maintenance scripts ───────────────────────────────────────────────────
- name: Install lab maintenance scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - lab-update-check
    - lab-restart-app
    - lab-tail-applog

# ── Record installed version ──────────────────────────────────────────────────
- name: Ensure facts.d directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Record installed version
  ansible.builtin.copy:
    content: '{"version": "{{ _ntfy_latest_version }}"}'
    dest: /etc/ansible/facts.d/ntfy.fact
    mode: "0644"
