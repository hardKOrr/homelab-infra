---
# Do not rotate a partial or existing pair: bootstrap must agree with stored keys.
- name: OPNsense | Require complete saved {{ opnsense_service }} credentials
  ansible.builtin.assert:
    that:
      - >-
        ((_opn_saved.api_key | default('', true) | length > 0)
         == (_opn_saved.api_secret | default('', true) | length > 0))
    fail_msg: "The saved {{ opnsense_service }} key pair is incomplete; restore it before Deploy."
  vars:
    _opn_saved: "{{ homelabinfra_vault[opnsense_service] | default({}) }}"

- name: OPNsense | Capture one stable bootstrap key pair
  ansible.builtin.set_fact:
    _opn_bootstrap_pair:
      api_key: >-
        {{ (homelabinfra_vault[opnsense_service] | default({})).api_key
           | default(lookup('ansible.builtin.password', '/dev/null', length=80, chars=['hexdigits']), true) }}
      api_secret: >-
        {{ (homelabinfra_vault[opnsense_service] | default({})).api_secret
           | default(lookup('ansible.builtin.password', '/dev/null', length=80, chars=['hexdigits']), true) }}
  no_log: true

- name: OPNsense | Store or confirm the {{ opnsense_service }} bootstrap key
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/{{ opnsense_service }}"
    vault_item_merge: true
    vault_item_fields: "{{ _opn_bootstrap_pair }}"
    vault_item_secret_fields: [api_key, api_secret]
