---
# Included by main.yml (Docker only): the Compose project on the media stack host.
# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot.
# Its render stays out of the log: the Compose file carries the Arr API keys.
- name: Deploy the Unpackerr Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "/opt/{{ instance }}"
    compose_secrets: >-
      {{ _unpackerr_arrs | map(attribute='value.api_key', default='') | select | list }}

- name: Read the Unpackerr container state
  community.docker.docker_container_info:
    name: "{{ instance }}"
  register: _unpackerr_container
  changed_when: false
- name: Assert Unpackerr is running after Arr credential preflight
  ansible.builtin.assert:
    that:
      - _unpackerr_container.exists
      - _unpackerr_container.container.State.Running | default(false) | bool
    fail_msg: >-
      Unpackerr did not remain running after its Arr credential preflight. Check docker logs {{ instance }} on the media stack host.
