---
# Unpackerr on Docker (docker.yml) or natively on its own LXC or VM (native*.yml). Arr
# discovery and the download-path check are shared with the Kubernetes method (arrs.yml).
- name: Resolve and verify the registered Arr applications
  ansible.builtin.include_tasks: arrs.yml
- name: Verify the declared media mounts are present on the stack host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ _unpackerr_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: _unpackerr_mount_checks
- name: Assert every declared media mount is usable
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: >-
      {{ item.item.path }} is not present on the media stack host. It is declared in media_storage.mounts and must be attached before Unpackerr can extract files where the Arr applications expect them.
  loop: "{{ _unpackerr_mount_checks.results }}"
  loop_control:
    label: "{{ item.item.path }}"
- name: Docker on the stack host
  ansible.builtin.include_tasks: docker.yml
  when: not (unpackerr_native | bool)
- name: Native package and service
  ansible.builtin.include_tasks: native.yml
  when: unpackerr_native | bool
