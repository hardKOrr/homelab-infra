---
# Unpackerr consumes the media registry rather than joining it: every Arr endpoint and its API key is rendered into the container at deploy time. Credentials remain in Vaultwarden and in the root-readable Compose file only.
- name: Load the media wiring table
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/media-wiring.yml"
- name: Resolve the media registry and its Arr kinds
  ansible.builtin.set_fact:
    _unpackerr_registry: >-
      {{ (homelabinfra_infra.media | default({}, true)) | combine(homelabinfra_vault.media | default({}, true), recursive=True) }}
    _unpackerr_arr_kinds: >-
      {{ media_wiring.kinds | dict2items | selectattr('value.role', 'equalto', 'arr') | map(attribute='key') | list }}
    _unpackerr_mounts: "{{ app_config.app.mounts | default([], true) }}"
- name: Select registered Arr applications
  ansible.builtin.set_fact:
    _unpackerr_arrs: >-
      {{ _unpackerr_registry | dict2items | selectattr('value.app', 'defined') | selectattr('value.app', 'in', _unpackerr_arr_kinds) | sort(attribute='key') | list }}
  no_log: true
- name: Assert at least one Arr application is registered
  ansible.builtin.assert:
    that: _unpackerr_arrs | length > 0
    fail_msg: >-
      No Arr application is registered in generated media facts. Deploy Sonarr, Radarr, or Lidarr first, then rerun Unpackerr so its configuration can be assembled from the media registry.
- name: Assert every registered Arr has a usable endpoint and API key
  ansible.builtin.assert:
    that:
      - item.value.host | default('', true) | length > 0
      - item.value.api_key | default('', true) | length > 0
    fail_msg: >-
      Media registry entry {{ item.key }} lacks its endpoint or API key. Rerun that Arr deployment, or store its API key in Vaultwarden item homelab-infra/media/{{ item.key }}, before deploying Unpackerr.
  loop: "{{ _unpackerr_arrs }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
- name: Verify every Arr accepts its registered API key
  ansible.builtin.uri:
    url: "{{ item.value.host }}/api/{{ media_wiring.kinds[item.value.app].api }}/system/status"
    headers:
      X-Api-Key: "{{ item.value.api_key }}"
    status_code: 200
  register: _unpackerr_arr_status
  until: _unpackerr_arr_status.status | default(0) == 200
  retries: 12
  delay: 5
  changed_when: false
  loop: "{{ _unpackerr_arrs }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
- name: Verify the declared media mounts are present on the stack host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ _unpackerr_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: _unpackerr_mount_checks
- name: Assert every declared media mount is usable
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: >-
      {{ item.item.path }} is not present on the media stack host. It is declared in media_storage.mounts and must be attached before Unpackerr can extract files where the Arr applications expect them.
  loop: "{{ _unpackerr_mount_checks.results }}"
  loop_control:
    label: "{{ item.item.path }}"
- name: Assert the download directory is inside the lab's media storage
  ansible.builtin.assert:
    that: >-
      _unpackerr_mounts | map(attribute='path') | map('regex_replace', '/+$', '') | select('in', _unpackerr_download_ancestors) | list | length > 0
    fail_msg: >-
      app.download_path is {{ app_config.app.download_path }}, which is not inside a declared media_storage mount. Unpackerr must extract on the shared media filesystem so the Arr application can import its completed download.
  vars:
    _unpackerr_download_ancestors_json: >-
      {%- set parts = (app_config.app.download_path | regex_replace('/+$', '')).split('/') -%}{%- set out = [] -%}{%- for index in range(1, parts | length + 1) -%}{%- set _ = out.append(parts[:index] | join('/')) -%}{%- endfor -%}{{ out | to_json }}
    _unpackerr_download_ancestors: "{{ _unpackerr_download_ancestors_json | from_json }}"
- name: Create the Unpackerr project directory
  ansible.builtin.file:
    path: "/opt/{{ instance }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
- name: Write the Unpackerr Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ instance }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart unpackerr
  no_log: true
- name: Pull the Unpackerr image
  community.docker.docker_compose_v2_pull:
    project_src: "/opt/{{ instance }}"
    policy: missing
  changed_when: false
- name: Start Unpackerr
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ instance }}"
    state: present
    remove_orphans: true
  no_log: true
- name: Apply pending Unpackerr restarts
  ansible.builtin.meta: flush_handlers
- name: Read the Unpackerr container state
  community.docker.docker_container_info:
    name: "{{ instance }}"
  register: _unpackerr_container
  changed_when: false
- name: Assert Unpackerr is running after Arr credential preflight
  ansible.builtin.assert:
    that:
      - _unpackerr_container.exists
      - _unpackerr_container.container.State.Running | default(false) | bool
    fail_msg: >-
      Unpackerr did not remain running after its Arr credential preflight. Check docker logs {{ instance }} on the media stack host.
