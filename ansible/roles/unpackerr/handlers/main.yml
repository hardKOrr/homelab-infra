---
# The native service's restart. On Docker, tasks/stack/compose-deploy.yml recreates the
# project itself when the Compose file changes.
- name: Restart unpackerr
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ unpackerr_service }}"]
  when: unpackerr_native | bool
