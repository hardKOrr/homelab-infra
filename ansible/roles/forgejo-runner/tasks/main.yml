---
- name: Forgejo Runner | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_runner_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo Runner | Create runner data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Forgejo Runner | Reconcile and record the registration
  ansible.builtin.include_tasks: registration.yml

- name: Forgejo Runner | Render registration environment
  ansible.builtin.template:
    src: runner.env.j2
    dest: "{{ forgejo_runner_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Forgejo Runner

- name: Forgejo Runner | Install idempotent registration entrypoint
  ansible.builtin.copy:
    src: register-and-run.sh
    dest: "{{ forgejo_runner_entrypoint }}"
    owner: "1000"
    group: "1000"
    mode: "0550"
  notify: Restart Forgejo Runner

- name: Forgejo Runner | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_runner_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: Restart Forgejo Runner

- name: Forgejo Runner | Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_runner_project_dir }}"

- name: Forgejo Runner | Start and register the runner
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_runner_project_dir }}"
    state: present
    remove_orphans: true

- name: Forgejo Runner | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Forgejo Runner | Check that the runner service is running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ forgejo_runner_project_dir }}"
      - ps
      - --status
      - running
      - --services
  register: _forgejo_runner_services
  changed_when: false
  retries: 12
  delay: 5
  until: >-
    _forgejo_runner_services.rc == 0
    and 'runner' in (_forgejo_runner_services.stdout_lines | default([]))
