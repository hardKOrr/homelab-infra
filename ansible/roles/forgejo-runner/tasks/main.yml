---
# Deploy on the guest (playbooks/apps/deploy.yml play 2): the Compose project on Docker,
# the systemd runner on a native guest.
- name: Forgejo Runner | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: Forgejo Runner | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'
