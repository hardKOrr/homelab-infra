---
# Docker install, included from main.yml.
- name: Forgejo Runner | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_runner_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo Runner | Create runner data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Forgejo Runner | Reconcile and record the registration
  ansible.builtin.include_tasks: registration.yml

- name: Forgejo Runner | Install idempotent registration entrypoint
  ansible.builtin.copy:
    src: register-and-run.sh
    dest: "{{ forgejo_runner_entrypoint }}"
    owner: "1000"
    group: "1000"
    mode: "0550"
  register: _forgejo_runner_entrypoint_file

# The shared Compose deploy renders the registration environment with the project and
# recreates the runner when either, the entrypoint or the registration changed, in the same
# up that creates it, so a new runner is never restarted mid registration.
- name: Forgejo Runner | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ forgejo_runner_project_dir }}"
    compose_files:
      - src: runner.env.j2
        dest: "{{ forgejo_runner_env_file }}"
        mode: "0600"
    compose_secrets: "{{ [_forgejo_runner_token | default('')] | select | list }}"
    # A cleared registration (reconcile-registration.yml) re-registers on this recreate.
    compose_recreate: >-
      {{ _forgejo_runner_entrypoint_file.changed
         or _forgejo_runner_registration_needs_reset | default(false) | bool }}

# A crash-looping runner shows as running between restarts, so the check reads its restart
# count, waits, and requires it running with the same count.
- name: Forgejo Runner | Read the runner's state
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Running}} {{.RestartCount}}' }}", "{{ instance }}-forgejo-runner"]
  register: _forgejo_runner_state
  changed_when: false
  retries: 12
  delay: 5
  until: _forgejo_runner_state.rc == 0 and _forgejo_runner_state.stdout.split()[0] == 'true'

- name: Forgejo Runner | Give a failing runner time to restart
  ansible.builtin.wait_for:
    timeout: 15

- name: Forgejo Runner | Read the runner's state again
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Running}} {{.RestartCount}}' }}", "{{ instance }}-forgejo-runner"]
  register: _forgejo_runner_state_after
  changed_when: false

- name: Forgejo Runner | Assert the runner stayed up
  ansible.builtin.assert:
    that:
      - _forgejo_runner_state_after.stdout.split()[0] == 'true'
      - _forgejo_runner_state_after.stdout.split()[1] == _forgejo_runner_state.stdout.split()[1]
    fail_msg: >-
      The Forgejo runner restarted while Deploy watched it (running/restarts before
      {{ _forgejo_runner_state.stdout }}, after {{ _forgejo_runner_state_after.stdout }}).
      Read `docker logs {{ instance }}-forgejo-runner` on the stack host.
    quiet: true
