---
- name: Plane restore | Select Kubernetes recovery for a Kubernetes target
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method | default(
      app_config.hosting.method | default('docker')) == 'kubernetes'

- name: Plane restore | Keep the shared-swap Docker recovery for a Docker target
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    restore_target_config.hosting.method | default(
      app_config.hosting.method | default('docker')) == 'docker'

- name: Plane restore | Reject an unsupported destination method
  ansible.builtin.fail:
    msg: >-
      Plane restore supports a Docker or Kubernetes target; refusing to restore into
      {{ restore_target_config.hosting.method | default(app_config.hosting.method | default('undefined')) }}.
  when: >-
    restore_target_config.hosting.method | default(
      app_config.hosting.method | default('docker')) not in ['docker', 'kubernetes']
