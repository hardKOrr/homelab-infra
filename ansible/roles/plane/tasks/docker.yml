---
- name: Plane | Create project directory
  ansible.builtin.file:
    path: "{{ plane_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Plane | Create persistent service directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ app_config.app.data_path }}"
    - "{{ app_config.app.data_path }}/api"
    - "{{ app_config.app.data_path }}/worker"
    - "{{ app_config.app.data_path }}/beat"
    - "{{ app_config.app.data_path }}/migrator"
    - "{{ app_config.app.data_path }}/proxy"
    - "{{ app_config.app.object_storage_path }}"

- name: Plane | Resolve secrets and backends
  ansible.builtin.include_tasks: prepare.yml

- name: Plane | Render Compose recovery unit
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ plane_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: Restart Plane

- name: Plane | Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ plane_project_dir }}"

- name: Plane | Start the recovery unit
  community.docker.docker_compose_v2:
    project_src: "{{ plane_project_dir }}"
    state: present
    remove_orphans: true

- name: Plane | Apply database migrations
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --profile
      - init
      - --project-directory
      - "{{ plane_project_dir }}"
      - run
      - --rm
      - --no-deps
      - plane-migrator
  register: _plane_migrator
  changed_when: false
  no_log: true

- name: Plane | Ensure the named object-storage bucket exists
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --profile
      - init
      - --project-directory
      - "{{ plane_project_dir }}"
      - run
      - --rm
      - --no-deps
      - plane-minio-init
  register: _plane_storage_init
  changed_when: false
  no_log: true

- name: Plane | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Plane | Wait for the recovery unit health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    headers:
      Host: "{{ plane_fqdn }}"
    # Plane may redirect its HTTP origin to WEB_URL before the later Wire play
    # publishes that hostname. Keep this probe local and treat the redirect as ready.
    follow_redirects: none
    status_code: [200, 301, 302, 303, 307, 308]
  register: _plane_health
  until: _plane_health.status | default(0) in [200, 301, 302, 303, 307, 308]
  retries: 90
  delay: 5
  changed_when: false


- name: Plane | Schedule recovery
  ansible.builtin.include_tasks: recovery-timer.yml
