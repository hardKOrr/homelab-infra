---
# Remove App hook, run after the Compose project stops. Plane's backup schedule and root-only
# recovery configuration live outside /opt/<instance>. Remove both on every removal, even
# when delete_data is false, so an unwired application cannot keep stopping the stack host
# and writing snapshots after it was removed.
- name: Remove Plane recovery schedule
  ansible.builtin.cron:
    name: "homelab-infra Plane backup {{ instance }}"
    cron_file: "homelab-infra-plane-{{ instance }}"
    state: absent

- name: Remove Plane recovery configuration
  ansible.builtin.file:
    path: "/etc/homelab-infra/plane/{{ instance }}.env"
    state: absent
