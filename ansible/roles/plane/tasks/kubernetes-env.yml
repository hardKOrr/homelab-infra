---
# Plane stores its runtime values in the instance's namespace Secret. The same map is
# rendered on Deploy and after a restore so the database and Redis endpoints belong to
# the target while the restored Plane keys come from the backup source.
- name: Plane Kubernetes | Require the target identity and published hostname
  ansible.builtin.assert:
    that:
      - plane_k8s_env_instance | default('') | length > 0
      - plane_k8s_env_fqdn | default('') | length > 0

- name: Plane Kubernetes | Build the runtime environment
  ansible.builtin.set_fact:
    # Resolve the caller's lazy `plane_k8s_env_instance: "{{ instance }}"` now, before
    # the nested sync-secret include defines its own `instance` variable.
    _plane_k8s_env_target_instance: "{{ plane_k8s_env_instance }}"
    _plane_k8s_env:
      APP_RELEASE: "{{ _plane_k8s_env_config.app.release }}"
      APP_DOMAIN: "{{ plane_k8s_env_fqdn }}"
      GUNICORN_WORKERS: "1"
      WEB_URL: "https://{{ plane_k8s_env_fqdn }}"
      CORS_ALLOWED_ORIGINS: "https://{{ plane_k8s_env_fqdn }}"
      API_BASE_URL: "http://api:8000"
      DATABASE_URL: "postgresql://{{ _plane_k8s_env_config.app.database_user }}:{{ _plane_k8s_env_config.app.database_password }}@{{ _plane_k8s_env_config.app.database_host }}:{{ _plane_k8s_env_config.app.database_port }}/{{ _plane_k8s_env_config.app.database.name }}"
      REDIS_URL: "redis://:{{ _plane_k8s_env_redis_password }}@{{ _plane_k8s_env_redis_backend.host }}:{{ _plane_k8s_env_redis_backend.port }}/0"
      AMQP_URL: "amqp://{{ _plane_k8s_env_config.app.rabbitmq.user }}:{{ _plane_k8s_env_secrets.rabbitmq_password }}@{{ _plane_k8s_env_instance }}-mq:{{ _plane_k8s_env_config.app.rabbitmq.port }}/{{ _plane_k8s_env_config.app.rabbitmq.vhost }}"
      SECRET_KEY: "{{ _plane_k8s_env_secrets.secret_key }}"
      LIVE_SERVER_SECRET_KEY: "{{ _plane_k8s_env_secrets.live_server_secret_key }}"
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: "{{ _plane_k8s_env_secrets.object_storage_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ _plane_k8s_env_secrets.object_storage_secret_key }}"
      AWS_S3_ENDPOINT_URL: "http://{{ plane_k8s_env_instance }}-minio:9000"
      AWS_S3_BUCKET_NAME: "{{ _plane_k8s_env_config.app.object_storage.bucket }}"
      BUCKET_NAME: "{{ _plane_k8s_env_config.app.object_storage.bucket }}"
      MINIO_ENDPOINT_SSL: "0"
      MINIO_ROOT_USER: "{{ _plane_k8s_env_secrets.object_storage_access_key }}"
      MINIO_ROOT_PASSWORD: "{{ _plane_k8s_env_secrets.object_storage_secret_key }}"
      RABBITMQ_DEFAULT_USER: "{{ _plane_k8s_env_config.app.rabbitmq.user }}"
      RABBITMQ_DEFAULT_PASS: "{{ _plane_k8s_env_secrets.rabbitmq_password }}"
      RABBITMQ_DEFAULT_VHOST: "{{ _plane_k8s_env_config.app.rabbitmq.vhost }}"
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: "{{ _plane_k8s_env_config.app.file_size_limit | default(5242880) }}"
  vars:
    _plane_k8s_env_config: "{{ plane_k8s_env_config | default(app_config) }}"
    _plane_k8s_env_instance: "{{ plane_k8s_env_instance }}"
    _plane_k8s_env_redis_backend: "{{ plane_k8s_env_redis_backend | default(_plane_redis_backend) }}"
    _plane_k8s_env_redis_password: "{{ plane_k8s_env_redis_password | default(_plane_redis_password) }}"
    _plane_k8s_env_secrets: >-
      {{ plane_k8s_env_secrets | default({
           'secret_key': _plane_secret_key,
           'live_server_secret_key': _plane_live_server_secret_key,
           'rabbitmq_password': _plane_rabbitmq_password,
           'object_storage_access_key': _plane_object_storage_access_key,
           'object_storage_secret_key': _plane_object_storage_secret_key
         }) }}
  no_log: true

- name: Plane Kubernetes | Sync the runtime environment
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    instance: "{{ _plane_k8s_env_target_instance }}"
    k8s_secret_name: "{{ _plane_k8s_env_target_instance }}-env"
    k8s_secret_data: "{{ _plane_k8s_env }}"
  no_log: true
