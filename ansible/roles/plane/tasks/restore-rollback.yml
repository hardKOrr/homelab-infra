---
# The original database and paths are back. Restore the external Redis data and keys too.
- name: Plane restore | Restore the original Redis dataset
  ansible.builtin.include_tasks: restore-redis-rollback.yml

- name: Plane restore | Give the target its own Plane keys back
  ansible.builtin.include_tasks: restore-keys.yml
  vars:
    _plane_restore_keys: "{{ _plane_restore_target_secrets }}"
  when: _plane_restore_keys_replaced | default(false) | bool
