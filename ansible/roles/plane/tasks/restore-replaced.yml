---
# restore-swap.yml replaced hook. Redis replacement itself is shared with the Kubernetes
# after-restore path; only the source RDB transfer and the target environment update differ.
- name: Plane restore | Fetch the point's Redis RDB to private controller staging
  ansible.builtin.fetch:
    src: "{{ recovery_swap_stage }}/redis/dump.rdb"
    dest: "{{ _plane_restore_controller.path }}/restored.rdb"
    flat: true
  no_log: true

- name: Plane restore | Install the point's Redis dataset
  ansible.builtin.include_tasks: restore-redis-install.yml

- name: Plane restore | Record that Plane keys are being replaced
  ansible.builtin.set_fact:
    _plane_restore_keys_replaced: true

- name: Plane restore | Give the target the source's Plane keys
  ansible.builtin.include_tasks: restore-keys.yml
  vars:
    _plane_restore_keys: "{{ restore_source_plane_secrets }}"
