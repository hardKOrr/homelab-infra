---
# The named Redis backend answers PONG to the target's own credential.
- name: Plane restore | Ping the target Redis backend
  ansible.builtin.command:
    argv: >-
      {{ ([] if plane_native | bool else
          ['docker', 'run', '--rm', '--network', 'host', '--env', 'REDISCLI_AUTH',
           app_config.backup.redis_client_image])
         + ['redis-cli', '--no-auth-warning', '-h', _plane_restore_redis_backend.host,
            '-p', _plane_restore_redis_backend.port | string, 'ping'] }}
  environment:
    REDIS_HOST: "{{ _plane_restore_redis_backend.host }}"
    REDIS_PORT: "{{ _plane_restore_redis_backend.port }}"
    REDISCLI_AUTH: "{{ _plane_restore_redis_password }}"
  register: _plane_restore_redis_ping
  until:
    - _plane_restore_redis_ping.rc == 0
    - _plane_restore_redis_ping.stdout | trim == 'PONG'
  retries: 12
  delay: 5
  changed_when: false
  no_log: true
