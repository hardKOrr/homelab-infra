---
- name: WordPress Kubernetes Restore | Resolve the cluster
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: WordPress Kubernetes Restore | Derive and verify the owned namespace
  ansible.builtin.include_tasks: namespace.yml

- name: WordPress Kubernetes Restore | Set the target instance
  ansible.builtin.set_fact:
    restore_target: "{{ instance }}"
    restore_target_config: "{{ app_config }}"

- name: WordPress Kubernetes Restore | Set the source recovery group
  ansible.builtin.set_fact:
    app_config: >-
      {{ app_config | combine({'backup': {
        'backup_id': wordpress_restore_backup_id | default('', true)
      }}, recursive=True) }}

- name: WordPress Kubernetes Restore | Require a recent target safety point
  ansible.builtin.include_tasks: ../../../tasks/recovery/require-recent-pre-restore-point.yml
  vars:
    recovery_pre_restore_backup_id: >-
      {{ restore_target_config.backup.backup_id | default('', true) or restore_target }}
  when: restore_overwrite | bool

- name: WordPress Kubernetes Restore | Describe the target database recovery step
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_source: registered
    k8s_database_step_config: "{{ restore_target_config }}"
    k8s_database_step_instance: "{{ restore_target }}"

- name: WordPress Kubernetes Restore | Restore through the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: WordPress
      archives:
        - name: content
          claim: "{{ restore_target }}-content"
          owner: "33:33"
      database: "{{ k8s_database_step }}"
      stop:
        - "{{ restore_target }}"
      after_restore_tasks: "{{ role_path }}/tasks/after-restore.yml"
      describe: >-
        the {{ k8s_database_step.describe }} and the wp-content volume containing WordPress
        uploads, themes and plugins
      verify:
        - >-
          Open https://{{ restore_target }}.<lab-domain>/, sign in as the WordPress
          administrator, and check the restored post, uploaded media and site tagline.

- name: WordPress Kubernetes Restore | Record success for the dispatcher
  ansible.builtin.set_fact:
    wordpress_restore_result: {rc: 0}
