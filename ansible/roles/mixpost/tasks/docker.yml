---
# Mixpost on Docker on a stack host (hosting.method: docker, LXC or VM): the application
# image plus a password-protected Redis, with the database on the named MariaDB backend
# (playbooks/apps/deploy.yml provisions it before this role). Kubernetes is
# kubernetes.yml, run from the playbook's localhost play, with its own namespaced MySQL.
- name: Mixpost | Create the project directory
  ansible.builtin.file:
    path: "{{ mixpost_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The image's start.sh chowns /var/www/html to www-data (UID/GID 33). Match that
# ownership on the mounted storage so later Deploy runs do not change it back.
- name: Mixpost | Create the storage directory
  ansible.builtin.file:
    path: "{{ mixpost_data_path }}"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"

- name: Mixpost | Resolve and store the application secrets
  ansible.builtin.include_tasks: secrets.yml

# The shared Compose deploy renders the environment file with the project and recreates
# the project when either changed, in the same up that creates it, so a new install is
# never restarted mid first boot.
- name: Mixpost | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ mixpost_project_dir }}"
    compose_files:
      - src: mixpost.env.j2
        dest: "{{ mixpost_env_file }}"
        mode: "0600"
    compose_secrets: >-
      {{ [_mp_app_key, _mp_redis_password, app_config.app.database_password | default('')]
         | select | list }}
