---
# Mixpost's Docker-method secrets. Generated once, then read back from the canonical
# Vaultwarden item on every later run: regenerating APP_KEY would make every value Laravel
# encrypted with the old key (connected-account OAuth tokens) unreadable. The database
# password belongs to the named backend (tasks/database/provision.yml), not to this role.
- name: Mixpost | Resolve application secrets
  ansible.builtin.set_fact:
    _mp_app_key: >-
      {{ app_config.app.app_key
         | default('base64:' ~ (lookup('password', '/dev/null length=32 chars=ascii_letters,digits')
                                | b64encode), true) }}
    _mp_redis_password: >-
      {{ app_config.app.redis_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Mixpost | Store the canonical application secrets
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      app_key: "{{ _mp_app_key }}"
      redis_password: "{{ _mp_redis_password }}"
    vault_item_secret_fields:
      - app_key
      - redis_password
