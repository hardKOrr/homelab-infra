---
# Restore one Mixpost instance's database and storage volume from a PBS recovery point,
# into the namespace of a Mixpost instance that is already deployed. Called by
# playbooks/maintenance/restore-app.yml, whose header is the operator procedure;
# tasks/kubernetes/recovery-restore.yml is the mechanism.

- name: Restore | Require both instances to use the same database name
  ansible.builtin.assert:
    that: app_config.app.database.name == restore_target_config.app.database.name
    fail_msg: >-
      {{ instance }} keeps its data in database `{{ app_config.app.database.name }}` and
      {{ restore_target }} uses `{{ restore_target_config.app.database.name }}`. A dump
      names the database it came from, so restoring across the two would populate the wrong
      one. Give the target the same `app.database.name` and re-deploy it first.

- name: Restore | Describe the target's database step
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_engine: mysql
    k8s_database_step_config: "{{ restore_target_config }}"
    k8s_database_step_instance: "{{ restore_target }}"
    k8s_database_step_root_password: "{{ restore_target_config.app.db_root_password | default('') }}"

- name: Restore | Restore Mixpost through the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Mixpost
      archives:
        - name: storage
          claim: "{{ restore_target }}-storage"
      database: "{{ k8s_database_step }}"
      stop:
        - "{{ restore_target }}"
      # Redis holds the cache and queue and has no volume. Restarted so the application
      # does not answer from values built from the data that was replaced.
      restart:
        - "{{ restore_target }}-redis"
      after_restore_tasks: "{{ role_path }}/tasks/restore-app-key.yml"
      describe: >-
        the {{ k8s_database_step.describe }} and the {{ restore_target }}-storage volume. A
        real run DROPS that database and empties that volume
      verify:
        - >-
          Now verify the application, not the artifact: open
          https://{{ restore_target }}.<estate domain>/mixpost, sign in with the
          credentials that worked on {{ instance }}, and check that the posts, their media
          and the connected accounts are all present.
        - >-
          {{ 'The source application key was carried across, so encrypted columns
             (connected-account tokens) are readable in the target.'
             if restore_target != instance
             else 'Restored in place, so the application key is unchanged.' }}
