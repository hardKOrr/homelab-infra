---
# Mixpost native: Redis, the migration, PHP-FPM, nginx and the two systemd units.
# Included by native.yml after the release is built and storage is linked.
- name: Mixpost native | Configure Redis as a private, password-protected queue backend
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {regexp: '^#?\s*bind\s', line: "bind 127.0.0.1 -::1"}
    - {regexp: '^#?\s*requirepass\s', line: "requirepass {{ _mp_redis_password }}"}
  loop_control:
    label: "{{ item.regexp }}"
  no_log: true
  register: _mp_native_redis

# Restarted here, not by the handler, whose units do not exist yet on a first deploy.
- name: Mixpost native | Start Redis, restarting it when its configuration changed
  ansible.builtin.systemd:
    name: redis-server
    state: "{{ 'restarted' if _mp_native_redis.changed else 'started' }}"
    enabled: true

# Done here, before the services run, so a failed migration fails the deploy.
- name: Mixpost native | Migrate the database
  ansible.builtin.command:
    argv: ["{{ mixpost_artisan }}", migrate, --force]
  register: _mp_native_migrate
  changed_when: "'Nothing to migrate' not in _mp_native_migrate.stdout"

- name: Mixpost native | Create the PHP-FPM unit drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/php{{ mixpost_php_version }}-fpm.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mixpost native | Let PHP-FPM read the application environment
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - path: "/etc/php/{{ mixpost_php_version }}/fpm/pool.d/zz-mixpost.conf"
      content: |
        [www]
        clear_env = no
    - path: "/etc/php/{{ mixpost_php_version }}/fpm/conf.d/90-mixpost.ini"
      content: |
        date.timezone={{ homelabinfra_config.timezone | default('UTC') }}
        upload_max_filesize=64M
        post_max_size=64M
        memory_limit=256M
        expose_php=Off
    - path: "/etc/systemd/system/php{{ mixpost_php_version }}-fpm.service.d/mixpost.conf"
      content: |
        [Service]
        EnvironmentFile={{ mixpost_env_file }}
  loop_control:
    label: "{{ item.path }}"
  notify: Restart mixpost

- name: Mixpost native | Render the nginx site and the systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: nginx-site.conf.j2, dest: "/etc/nginx/sites-available/{{ instance }}.conf"}
    - {src: native.service.j2, dest: "/etc/systemd/system/{{ instance }}-horizon.service"}
    - {src: native.service.j2, dest: "/etc/systemd/system/{{ instance }}-scheduler.service"}
  loop_control:
    label: "{{ item.dest }}"
  vars:
    _mp_unit: "{{ item.dest | regex_replace('^.*-(horizon|scheduler)[.]service$', '\\1') }}"
  notify: Restart mixpost

- name: Mixpost native | Enable the site and drop nginx's default
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ item.name }}"
    src: "{{ item.src | default(omit) }}"
    state: "{{ item.state }}"
  loop:
    - {name: "{{ instance }}.conf", state: link, src: "/etc/nginx/sites-available/{{ instance }}.conf"}
    - {name: default, state: absent}
  loop_control:
    label: "{{ item.name }}"
  notify: Restart mixpost

- name: Mixpost native | Reload systemd and start PHP-FPM
  ansible.builtin.systemd:
    name: "php{{ mixpost_php_version }}-fpm"
    state: started
    enabled: true
    daemon_reload: true

- name: Mixpost native | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Mixpost native | Enable and start the application
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ mixpost_native_app_services }}"

- name: Mixpost native | Install the restart and log helpers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart {{ mixpost_native_restore_services | join(' ') }}
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        exec journalctl --no-pager -n "${1:-50}" -u {{ instance }}-horizon -u {{ instance }}-scheduler -u nginx
  loop_control:
    label: "{{ item.name }}"
