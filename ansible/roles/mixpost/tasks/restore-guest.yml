---
# Restore Mixpost's application-consistent MariaDB database and storage directory on
# Docker through the shared swap. The restored database was written under the source's
# application keys, so the replaced hook gives them to the target; a failure after the
# stop puts the original storage, database and keys back and starts the application.

- name: Mixpost restore | Resolve the target's keys and database identity
  ansible.builtin.set_fact:
    _mp_restore_target_keys:
      app_key: "{{ app_config.app.app_key | default('') }}"
    _mp_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _mp_restore_source_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           (restore_source_database | default({})).get('instance', ''), {}) }}
  no_log: true

- name: Mixpost restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - _mp_restore_database_backend.provider | default('') == 'mariadb'
      - _mp_restore_database_backend.host | default('') | length > 0
      - app_config.app.database.name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - restore_source_mixpost_secrets.app_key | default('') | length > 0
      - _mp_restore_target_keys.app_key | length > 0
      - mixpost_data_path is match('^/[^/].*')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Mixpost restore needs a target, its named MariaDB backend, the source and target
      application keys, a non-root storage path, and a snapshot when overwrite=true.
  no_log: true

- name: Mixpost restore | Require a separate target database for a new destination
  ansible.builtin.assert:
    that:
      - restore_source_database is mapping
      - restore_source_database.name | default('') | length > 0
      - _mp_restore_source_backend.host | default('') | length > 0
      - >-
        not (
          restore_source_database.name == app_config.app.database.name
          and _mp_restore_source_backend.host == _mp_restore_database_backend.host
          and (_mp_restore_source_backend.port | int) == (_mp_restore_database_backend.port | int)
        )
    fail_msg: >-
      A new Mixpost restore must use a target database name or MariaDB backend distinct
      from the source. Never let an isolated instance overwrite the source's database.
  when: restore_destination == 'new'
  no_log: true

- name: Mixpost restore | Preview or replace the storage directory and database
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [database.pxar, data.pxar]
    recovery_swap_paths:
      - path: "{{ mixpost_data_path }}"
        source: data
        owner: live
        group: live
        mode: "0755"
        allow_empty: true
    recovery_swap_database:
      config: "{{ app_config.app.database }}"
      dump: database/mixpost.sql
    recovery_swap_stop_services: >-
      {{ mixpost_stop_services }}
    recovery_swap_compose_project: "{{ mixpost_project_dir }}"
    recovery_swap_replaced_hook: "{{ role_path }}/tasks/restore-replaced.yml"
    recovery_swap_rollback_hook: "{{ role_path }}/tasks/restore-rollback.yml"
    recovery_swap_verified_hook: "{{ role_path }}/tasks/verify.yml"

- name: Mixpost restore | Explain the read-only plan
  ansible.builtin.debug:
    msg:
      - "PLAN ONLY — nothing was changed."
      - >-
        A selected Mixpost snapshot contains database.pxar (named MariaDB database
        {{ app_config.app.database.name }}) and data.pxar ({{ mixpost_data_path }}).
      - "Re-run with recovery_point=<snapshot> and overwrite=true only after verifying the target."
  when: not (restore_overwrite | bool)
