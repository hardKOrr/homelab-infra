---
# Mixpost on a guest: Docker on a stack host (docker.yml) or natively on its own LXC or VM
# (native.yml). Kubernetes is kubernetes.yml, run from the playbook's localhost play.
- name: Mixpost | Run on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('kubernetes') == 'docker'

- name: Mixpost | Run natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method | default('kubernetes') == 'native'

- name: Mixpost | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Mixpost | Wait for the login page
  ansible.builtin.include_tasks: verify.yml
