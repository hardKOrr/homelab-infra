---
# Application-consistent Mixpost recovery point on Docker: a SQL dump of the named MariaDB
# database plus the storage directory (uploaded media), taken while the application is
# stopped. Only the application and its Redis are stopped; the MariaDB backend and the
# host's other apps stay untouched.

- name: Mixpost backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - mixpost_data_path is match('^/[^/].*')
      - app_config.app.database.name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Mixpost needs its application-consistent backup contract, a non-root storage path,
      a named database and a configured PBS before a backup can run.

- name: Mixpost backup | Check the storage directory
  ansible.builtin.stat:
    path: "{{ mixpost_data_path }}"
  register: _mp_backup_data
  changed_when: false

- name: Mixpost backup | Require a complete storage directory
  ansible.builtin.assert:
    that:
      - _mp_backup_data.stat.exists
      - _mp_backup_data.stat.isdir
    fail_msg: >-
      Mixpost storage {{ mixpost_data_path }} is missing; refusing to create a
      recovery point that would omit uploaded media.

# The dump directory is outside /tmp, which the client's tmpfs replaces.
- name: Mixpost backup | Allocate private scratch space
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: mixpost-backup-
  register: _mp_backup_scratch
  changed_when: true

- name: Mixpost backup | Stop the application, dump its database and push both archives
  block:
    - name: Mixpost backup | Run the shared PBS backup
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: "{{ 'native' if mixpost_native | bool else 'docker' }}"
        pbs_client_compose_project: "{{ mixpost_project_dir }}"
        pbs_client_stop_services: "{{ mixpost_stop_services }}"
        pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
        pbs_client_archives:
          - name: database.pxar
            path: "{{ _mp_backup_scratch.path }}"
          - name: data.pxar
            path: "{{ mixpost_data_path }}"

    - name: Mixpost backup | Mark the paired recovery artifact complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Mixpost backup | Remove private scratch data
      ansible.builtin.file:
        path: "{{ _mp_backup_scratch.path }}"
        state: absent
