---
# Restore App hook, run on localhost once the restore target is resolved: the app_config
# this role's restore task gets, with an explicit data_path rebased onto the target
# instance (an empty one follows the instance, see defaults/main.yml).
- name: Rebase the target's data_path
  ansible.builtin.include_tasks: ../../../tasks/recovery/rebase-target-path.yml
  vars:
    restore_rebase_key: data_path
    restore_rebase_instance: true
