---
# The native services' restart. On Docker, tasks/stack/compose-deploy.yml recreates the
# project itself when the Compose or environment file changes.
- name: Restart mixpost
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: "{{ ['php' ~ mixpost_php_version ~ '-fpm'] + mixpost_native_app_services }}"
  when: mixpost_native | bool
