---
# Stop only Plex, then capture its identity, library databases, Metadata and Media
# as one data.pxar. External library mounts and transcode are never archive sources.
# Disposable Plex state is excluded explicitly below.

- name: Plex backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Plex needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Plex backup | Keep external media outside recovery state
  ansible.builtin.assert:
    that:
      - plex_state_path != item.path
      - not plex_state_path.startswith(item.path ~ '/')
      - not item.path.startswith(plex_state_path ~ '/')
    fail_msg: "Plex recovery state must not overlap declared media or the transcode path."
  loop: "{{ app_config.app.mounts | default([], true) }}"

- name: Plex backup | Keep transcode outside recovery state
  ansible.builtin.assert:
    that:
      - app_config.app.transcode_path != plex_state_path
      - not app_config.app.transcode_path.startswith(plex_state_path ~ '/')
      - not plex_state_path.startswith(app_config.app.transcode_path ~ '/')
    fail_msg: "Plex recovery state must not overlap the transcode path."

- name: Plex backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ plex_state_path }}"
  register: _plex_backup_data
  changed_when: false

- name: Plex backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _plex_backup_data.stat.exists
      - _plex_backup_data.stat.isdir
    fail_msg: >-
      Plex data path {{ plex_state_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Plex backup | Check the identity and library databases
  ansible.builtin.stat:
    path: "{{ plex_state_path }}/{{ item }}"
  loop:
    - Preferences.xml
    - Plug-in Support/Databases
  register: _plex_backup_checks
  no_log: true

- name: Plex backup | Refuse an incomplete recovery unit
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Plex identity or library databases are missing; refusing an incomplete backup."
  loop: "{{ _plex_backup_checks.results }}"
  no_log: true

- name: Plex backup | Stop only Plex and archive the quiesced data directory to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ plex_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_backup_args: [--exclude, /Cache, --exclude, /Codecs, --exclude, /Crash Reports, --exclude, /Logs]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ plex_state_path }}"

- name: Plex backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
