---
# Replace the target's config PVC through the shared Kubernetes recovery Job, then prove the
# restored server like the Docker path does: its token must work against Plex before it is
# published for media consumers. The NFS media shares are not part of the archive.
- name: Plex Kubernetes restore | Assert the recovery contract before changing the target
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Plex restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Plex Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Plex
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "{{ restore_target_config.app.puid | default(1313) }}:{{ restore_target_config.app.pgid | default(1313) }}"
      stop:
        - "{{ restore_target }}"
      describe: >-
        Plex's server identity, library databases and metadata from its config volume; the
        shared media and the transcode scratch space are not included
      verify:
        - >-
          Open the Plex URL and check that the restored libraries are present and that the
          server is still signed in to the same Plex account.

- name: Plex Kubernetes restore | Verify the restored server and publish its token
  when: _application_restore_complete | default(false) | bool
  block:
    - name: Plex Kubernetes restore | Read the restored server token
      ansible.builtin.include_tasks: read-preferences.yml
      vars:
        _plex_k8s_target: "{{ restore_target }}"
        _plex_k8s_prefs_path: "{{ plex_k8s_state_path }}/Preferences.xml"
        _plex_prefs_expect: ['PlexOnlineToken="']

    - name: Plex Kubernetes restore | Resolve the restored server token
      ansible.builtin.set_fact:
        _plex_restored_token: >-
          {{ (_plex_prefs_text | regex_findall('PlexOnlineToken="([^"]+)"') | first | default('')) }}
      no_log: true

    - name: Plex Kubernetes restore | Require the restored server token
      ansible.builtin.assert:
        that: _plex_restored_token | length > 0
        fail_msg: "Restored Preferences.xml lacks PlexOnlineToken; authenticated recovery cannot continue."

    - name: Plex Kubernetes restore | Verify the restored token through Plex
      ansible.builtin.uri:
        url: "http://{{ k8s_cluster_facts.ingress_vip }}/library/sections"
        headers:
          Host: >-
            {{ restore_target_config.routing.subdomain | default(restore_target, true) }}.{{ homelabinfra_infra.domain }}
          X-Plex-Token: "{{ _plex_restored_token }}"
        status_code: 200
      register: _plex_restored_check
      until: _plex_restored_check.status | default(0) == 200
      retries: "{{ plex_http_retries }}"
      delay: "{{ plex_http_delay }}"
      no_log: true
      changed_when: false

    - name: Plex Kubernetes restore | Publish the restored token for media consumers
      ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
      vars:
        vault_item_name: "homelab-infra/media/{{ restore_target }}"
        vault_item_fields:
          token: "{{ _plex_restored_token }}"
        vault_item_secret_fields: [token]
      no_log: true
