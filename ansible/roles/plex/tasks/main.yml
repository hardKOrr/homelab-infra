---
- name: Resolve Plex paths and claim state
  ansible.builtin.set_fact:
    _plex_base: "http://localhost:{{ app_config.app.port }}"
    _plex_preferences: "{{ app_config.app.config_path }}/Library/Application Support/Plex Media Server/Preferences.xml"
    _plex_mounts: "{{ app_config.app.mounts | default([], true) }}"
    _plex_media_network: "homelabinfra-{{ app_config.stack }}"
    _plex_claim_token: "{{ app_config.app.claim_token | default('', true) }}"
    _plex_advertise_url: >-
      {{ app_config.app.advertise_url | default('', true)
         or ('https://' ~ (app_config.routing.subdomain | default(instance, true))
             ~ '.' ~ (homelabinfra_infra.domain | default('')) ~ ':443') }}
  no_log: true

- name: Assert the advertised Plex URL includes a port
  ansible.builtin.assert:
    that: _plex_advertise_url is match('^https?://[^/]+:[0-9]+/?$')
    fail_msg: "app.advertise_url must be a complete HTTP(S) URL with an explicit port."

- name: Check whether Plex has already been claimed
  ansible.builtin.stat:
    path: "{{ _plex_preferences }}"
  register: _plex_preferences_stat

- name: Read existing Plex preferences
  ansible.builtin.slurp:
    src: "{{ _plex_preferences }}"
  register: _plex_preferences_contents
  when: _plex_preferences_stat.stat.exists
  no_log: true

- name: Resolve whether Plex has a server token
  ansible.builtin.set_fact:
    _plex_claimed: >-
      {{ _plex_preferences_stat.stat.exists and
         ((_plex_preferences_contents.content | default('') | b64decode)
          is search('PlexOnlineToken="[^"]+"')) }}
  no_log: true

- name: Remember whether this run claims Plex
  ansible.builtin.set_fact:
    _plex_claimed_before: "{{ _plex_claimed }}"

- name: Require a Vaultwarden claim token for an unclaimed Plex server
  ansible.builtin.assert:
    that: _plex_claim_token | length > 0
    fail_msg: >-
      {{ instance }} is not claimed. Store a fresh Plex claim token as hidden field
      claim_token in Vaultwarden item homelab-infra/apps/{{ instance }}, then rerun.
  when: not _plex_claimed

- name: Create Plex project and persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_config.app.puid | default(1313) }}"
    group: "{{ app_config.app.pgid | default(1313) }}"
    mode: "0750"
  loop: ["{{ plex_project_dir }}", "{{ app_config.app.config_path }}", "{{ app_config.app.transcode_path }}"]
  when: not (plex_native | bool)

- name: Ensure media applications share a Docker network
  community.docker.docker_network:
    name: "{{ _plex_media_network }}"
    state: present
  when: not (plex_native | bool)

- name: Verify media paths are present on the stack host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ _plex_mounts }}"
  register: _plex_mount_checks

- name: Assert declared media paths are usable
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: "{{ item.item.path }} is not present on the media stack host."
  loop: "{{ _plex_mount_checks.results }}"

- name: Configure Plex access to declared DRI devices
  ansible.builtin.include_tasks: configure-devices.yml

# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot (and never
# spends its one-use claim token on a start that is then thrown away).
- name: Deploy the Plex Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ plex_project_dir }}"
    compose_owner: "{{ app_config.app.puid | default(1313) }}"
    compose_group: "{{ app_config.app.pgid | default(1313) }}"
    compose_files: >-
      {{ [{'src': 'device-groups.sh.j2', 'dest': plex_project_dir ~ '/device-groups.sh', 'mode': '0755'}]
         if _plex_dri_device_declared | bool else [] }}
    compose_secrets: "{{ [_plex_claim_token | default('')] | select | list }}"
  when: not (plex_native | bool)

- name: Deploy Plex natively
  ansible.builtin.include_tasks: native.yml
  when: plex_native | bool

- name: Prove the native Plex iGPU path as its service user
  ansible.builtin.include_tasks: native-gpu.yml
  when:
    - plex_native | bool
    - _plex_dri_device_declared | bool

- name: Wait for Plex to answer its identity endpoint
  ansible.builtin.uri:
    url: "{{ _plex_base }}/identity"
    return_content: true
    status_code: 200
  register: _plex_identity
  until: _plex_identity.status | default(0) == 200
  retries: "{{ plex_http_retries }}"
  delay: "{{ plex_http_delay }}"
  changed_when: false

- name: Assert the service identifies itself as Plex
  ansible.builtin.assert:
    that: _plex_identity.content is search('MediaContainer')
    fail_msg: "{{ app_config.app.port }} did not return a Plex identity document."

- name: Read Plex preferences after startup
  ansible.builtin.slurp:
    src: "{{ _plex_preferences }}"
  register: _plex_preferences_after
  until: _plex_preferences_after.content is defined
  retries: "{{ plex_http_retries }}"
  delay: "{{ plex_http_delay }}"
  changed_when: false
  no_log: true

- name: Extract the Plex server token for media consumers
  ansible.builtin.set_fact:
    _plex_server_token: >-
      {{ (_plex_preferences_after.content | b64decode
          | regex_findall('PlexOnlineToken="([^"]+)"') | first | default('')) }}
  no_log: true

- name: Assert Plex exchanged the claim token for a server token
  ansible.builtin.assert:
    that: _plex_server_token | length > 0
    fail_msg: >-
      Plex started but Preferences.xml lacks PlexOnlineToken. Obtain a fresh claim
      token, update homelab-infra/apps/{{ instance }} in Vaultwarden, and rerun.

- name: Configure Plex hardware transcoding from its declared device
  ansible.builtin.include_tasks: configure-transcoder.yml

- name: Save the advertised URL and transcode directory of a native Plex
  ansible.builtin.include_tasks: native-prefs.yml
  when: plex_native | bool

- name: Store and verify the Plex server token
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      token: "{{ _plex_server_token }}"
    vault_item_secret_fields: [token]
  no_log: true

# Apply the claimed Compose project in this run, so the container leaves the claim
# environment now and a repeat Deploy finds nothing to change.
- name: Remove the consumed claim token from the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ plex_project_dir }}"
    compose_owner: "{{ app_config.app.puid | default(1313) }}"
    compose_group: "{{ app_config.app.pgid | default(1313) }}"
    # The file being replaced still holds the token; keep it masked in the diff.
    compose_secrets: "{{ [_plex_claim_token | default('')] | select | list }}"
    _plex_claimed: true
  when:
    - not (plex_native | bool)
    - not (_plex_claimed_before | bool)
