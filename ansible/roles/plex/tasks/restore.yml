---
# Restore one Plex data.pxar archive. The generic Restore App playbook only
# dispatches here for applications that explicitly declare this path; ordinary Docker
# applications remain covered by their whole-guest PBS snapshots.

- name: Plex restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Plex restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Plex restore | Keep external media outside recovery state
  ansible.builtin.assert:
    that:
      - plex_state_path != item.path
      - not plex_state_path.startswith(item.path ~ '/')
      - not item.path.startswith(plex_state_path ~ '/')
    fail_msg: "Plex recovery state must not overlap declared media or the transcode path."
  loop: "{{ app_config.app.mounts | default([], true) }}"

- name: Plex restore | Keep transcode outside recovery state
  ansible.builtin.assert:
    that:
      - app_config.app.transcode_path != plex_state_path
      - not app_config.app.transcode_path.startswith(plex_state_path ~ '/')
      - not plex_state_path.startswith(app_config.app.transcode_path ~ '/')
    fail_msg: "Plex recovery state must not overlap the transcode path."

- name: Plex restore | Resolve the source backup identity
  ansible.builtin.set_fact:
    _application_restore_complete: false
    _plex_restore_rolled_back: false
    _plex_restore_moved: {rc: 1}
    _plex_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
  no_log: true

- name: Plex restore | Require the selected backup group
  ansible.builtin.assert:
    that: >-
      (restore_snapshot | default('') | length == 0) or
      restore_snapshot.startswith('host/' ~ _plex_restore_backup_id ~ '/')
    fail_msg: "The selected Plex snapshot must belong to the requested host backup group."

# Runs on every restore, before the stop below: a point from another group, an
# unreachable PBS or a point without data.pxar fails while Plex still serves.
- name: Plex restore | List or verify the recovery point before changing Plex
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-restore.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_backup_id: "{{ _plex_restore_backup_id }}"
    pbs_client_archives: [{name: data.pxar}]
    pbs_client_overwrite: false

- name: Plex restore | Create a private staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ app_config.app.config_path }}"
    prefix: "{{ instance }}-plex-restore-"
  register: _plex_restore_tmp
  when: restore_overwrite | bool

- name: Plex restore | Stop and replace application state
  when: restore_overwrite | bool
  block:
    # A sibling on the state filesystem keeps the original move an atomic rename,
    # including Metadata and Media, without copying the library or entering backups.
    - name: Plex restore | Create private rollback space beside the data directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ plex_state_path | dirname }}"
        prefix: .plex-pre-restore-
      register: _plex_restore_previous

    - name: Plex restore | Stop only Plex
      community.docker.docker_compose_v2:
        project_src: "{{ plex_project_dir }}"
        state: stopped
        services:
          - "{{ instance }}"

    - name: Plex restore | Extract the selected archive
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-restore.yml
      vars:
        pbs_client_runtime: docker
        pbs_client_backup_id: "{{ _plex_restore_backup_id }}"
        pbs_client_archives:
          - name: data.pxar
            path: "{{ _plex_restore_tmp.path }}"

    - name: Plex restore | Check the staged recovery unit
      ansible.builtin.stat:
        path: "{{ _plex_restore_tmp.path }}/{{ item }}"
      loop:
        - Preferences.xml
        - Plug-in Support/Databases
      register: _plex_restore_checks
      no_log: true

    - name: Plex restore | Refuse an incomplete archive
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "The archive lacks Plex identity or library databases; live state was preserved."
      loop: "{{ _plex_restore_checks.results }}"
      no_log: true

    # Retain the original until the replacement token is verified and published.
    - name: Plex restore | Move the original data into rollback space
      ansible.builtin.command:
        argv:
          - mv
          - "{{ plex_state_path }}"
          - "{{ _plex_restore_previous.path }}/state"
      register: _plex_restore_moved
      changed_when: _plex_restore_moved.rc == 0
      no_log: true

    - name: Plex restore | Recreate the data directory
      ansible.builtin.file:
        path: "{{ plex_state_path }}"
        state: directory
        owner: "{{ app_config.app.puid | default(1313) }}"
        group: "{{ app_config.app.pgid | default(1313) }}"
        mode: "0750"

    - name: Plex restore | Copy the archived application state into place
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ _plex_restore_tmp.path }}/."
          - "{{ plex_state_path }}/"
      changed_when: true
      no_log: true

    - name: Plex restore | Restore application data ownership
      ansible.builtin.command:
        argv: [chown, -R, "{{ app_config.app.puid | default(1313) }}:{{ app_config.app.pgid | default(1313) }}", "{{ plex_state_path }}"]
      changed_when: true
      no_log: true

    - name: Plex restore | Start only Plex
      community.docker.docker_compose_v2:
        project_src: "{{ plex_project_dir }}"
        state: present
        services:
          - "{{ instance }}"

    - name: Plex restore | Wait for the restored service
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/identity"
        status_code: 200
      register: _plex_restore_health
      until: _plex_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Plex restore | Read the restored server identity and token
      ansible.builtin.slurp:
        src: "{{ plex_state_path }}/Preferences.xml"
      register: _plex_restored_preferences
      no_log: true

    - name: Plex restore | Resolve the restored server token
      ansible.builtin.set_fact:
        _plex_restored_token: >-
          {{ (_plex_restored_preferences.content | b64decode
              | regex_findall('PlexOnlineToken="([^"]+)"') | first | default('')) }}
      no_log: true

    - name: Plex restore | Require the restored server token
      ansible.builtin.assert:
        that: _plex_restored_token | length > 0
        fail_msg: "Restored Preferences.xml lacks PlexOnlineToken; authenticated recovery cannot continue."

    - name: Plex restore | Verify the restored token through Plex
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/library/sections"
        headers:
          X-Plex-Token: "{{ _plex_restored_token }}"
        status_code: 200
      no_log: true
      changed_when: false

    - name: Plex restore | Publish the restored token for media consumers
      ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
      vars:
        vault_item_name: "homelab-infra/media/{{ instance }}"
        vault_item_fields:
          token: "{{ _plex_restored_token }}"
        vault_item_secret_fields: [token]
      no_log: true

    - name: Plex restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Plex restore | Stop Plex after a failed recovery
      community.docker.docker_compose_v2:
        project_src: "{{ plex_project_dir }}"
        state: stopped
        services: ["{{ instance }}"]

    - name: Plex restore | Remove the failed replacement data
      ansible.builtin.file:
        path: "{{ plex_state_path }}"
        state: absent
      when: _plex_restore_moved.rc | default(1) == 0

    - name: Plex restore | Put the original data back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ _plex_restore_previous.path }}/state"
          - "{{ plex_state_path }}"
      changed_when: true
      no_log: true
      when: _plex_restore_moved.rc | default(1) == 0

    - name: Plex restore | Record that rollback completed
      ansible.builtin.set_fact:
        _plex_restore_rolled_back: true

    - name: Plex restore | State that the service remains stopped
      ansible.builtin.fail:
        msg: >-
          Plex restore failed. The service was left stopped rather than serving
          partial state. The original data was retained or put back; inspect the job
          output and rerun the restore after correcting it.
  always:
    - name: Plex restore | Remove rollback space only after recovery or rollback succeeded
      ansible.builtin.file:
        path: "{{ _plex_restore_previous.path }}"
        state: absent
      when:
        - _plex_restore_previous.path is defined
        - >-
          (_application_restore_complete | bool) or (_plex_restore_rolled_back | bool)
          or (_plex_restore_moved.rc | default(1) != 0)

    - name: Plex restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _plex_restore_tmp.path }}"
        state: absent
      when: _plex_restore_tmp.path is defined
