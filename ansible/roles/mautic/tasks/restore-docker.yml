---
# Restore Mautic's MariaDB database and file tree from one data.pxar through the shared
# swap. The point is extracted and checked while Mautic still runs; any failure after the
# stop puts the original file tree and database back and starts Mautic.

- name: Mautic restore | Resolve the target database and paths
  ansible.builtin.set_fact:
    _mautic_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _mautic_restore_database_name: "{{ app_config.app.database.name | default('') }}"
    _mautic_restore_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _mautic_restore_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _mautic_restore_data_path: "{{ app_config.app.data_path | default('') }}"
    _mautic_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true) or restore_target, true) }}
    _mautic_restore_source_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           (restore_source_database | default({})).get('instance', ''), {}) }}
  no_log: true

- name: Mautic restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mautic_restore_database_backend.provider | default('') == 'mariadb'
      - _mautic_restore_database_backend.host | default('') | length > 0
      - _mautic_restore_database_backend.port | default(0) | int > 0
      - _mautic_restore_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_restore_database_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_restore_database_password | length > 0
      - _mautic_restore_data_path is match('^/[^/].*')
      - _mautic_restore_data_path != '/'
      - _mautic_restore_target_backup_id is match('^[A-Za-z0-9_.-]+$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Mautic restore needs its target, named MariaDB backend, database credential,
      non-root data path and configured PBS target.
  no_log: true

- name: Mautic restore | Require a separate database for a new destination
  ansible.builtin.assert:
    that:
      - restore_source_database is mapping
      - restore_source_database.instance | default('') | length > 0
      - restore_source_database.name | default('') | length > 0
      - _mautic_restore_source_backend.host | default('') | length > 0
      - _mautic_restore_source_backend.port | default(0) | int > 0
      - >-
        not (
          restore_source_database.name == _mautic_restore_database_name
          and _mautic_restore_source_backend.host == _mautic_restore_database_backend.host
          and (_mautic_restore_source_backend.port | int) == (_mautic_restore_database_backend.port | int)
        )
    fail_msg: >-
      A new Mautic restore must use a database name or MariaDB backend distinct from the
      source. Never restore an isolated instance into the source database.
  when: restore_destination == 'new'
  no_log: true

- name: Mautic restore | Verify the independent pre-restore point
  when:
    - restore_overwrite | bool
    - restore_destination == 'existing'
  block:
    - name: Mautic restore | Require a distinct target recovery point
      ansible.builtin.assert:
        that:
          - restore_pre_restore_point | default('') | length > 0
          - restore_pre_restore_point.startswith('host/' ~ _mautic_restore_target_backup_id ~ '/')
          - restore_pre_restore_point != restore_snapshot
        fail_msg: >-
          Replacing Mautic needs a separate pre_restore_point from
          host/{{ _mautic_restore_target_backup_id }}/. Back up the exact target and
          verify that point before retrying.

- name: Mautic restore | Preview or replace the file tree and database
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_pre_restore_backup_id: "{{ _mautic_restore_target_backup_id }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ _mautic_restore_data_path }}"
        source: data/mautic
        owner: www-data
        group: www-data
        mode: "0750"
    recovery_swap_database:
      config: "{{ app_config.app.database }}"
      dump: data/database/mautic.sql
    recovery_swap_stop_services: [mautic_web, mautic_cron, mautic_worker]
    recovery_swap_compose_project: "{{ mautic_project_dir }}"
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_replaced_hook: "{{ role_path }}/tasks/restore-replaced.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/"
    recovery_swap_health_status: [200, 302]

- name: Mautic restore | Explain the selected read-only plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. Snapshot {{ restore_snapshot }} contains one data.pxar with
      the named MariaDB database and Mautic's complete data path
      {{ _mautic_restore_data_path }}. Re-run with overwrite=true only after verifying an
      independent pre_restore_point for the exact target.
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length > 0)
