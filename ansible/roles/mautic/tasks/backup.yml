---
# Capture Mautic's named MariaDB database and its complete persistent file tree as one
# application-consistent PBS archive. Only this instance's web, cron and worker services
# stop; the shared database guest and every sibling application stay available.

- name: Mautic backup | Resolve the named database and credentials
  ansible.builtin.set_fact:
    _mautic_backup_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _mautic_backup_database_name: "{{ app_config.app.database.name | default('') }}"
    _mautic_backup_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _mautic_backup_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _mautic_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _mautic_backup_id: >-
      {{ app_config.backup.backup_id | default('', true) or instance }}
    _mautic_backup_root: "{{ app_config.app.data_path | default('') | dirname }}/.pbs-backup-root"
    _application_backup_complete: false
  no_log: true

- name: Mautic backup | Assert the native recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mautic_backup_database_backend.provider | default('') == 'mariadb'
      - _mautic_backup_database_backend.host | default('') | length > 0
      - _mautic_backup_database_backend.port | default(0) | int > 0
      - _mautic_backup_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_backup_database_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_backup_database_password | length > 0
      - _mautic_backup_data_path is match('^/[^/].*')
      - _mautic_backup_data_path != '/'
      - _mautic_backup_id is match('^[A-Za-z0-9_.-]+$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Mautic backup needs its named MariaDB backend, application database credential,
      non-root data path and a configured PBS target.
  no_log: true

- name: Mautic backup | Inspect persistent file state
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _mautic_backup_data_path }}"
    - "{{ mautic_config_file }}"
    - "{{ mautic_media_files_dir }}"
    - "{{ mautic_media_images_dir }}"
  register: _mautic_backup_paths
  changed_when: false

- name: Mautic backup | Require the full configuration and media state
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - not item.stat.islnk
      - >-
        (item.item == mautic_config_file and item.stat.isreg and item.stat.size | int > 0)
        or (item.item != mautic_config_file and item.stat.isdir)
    fail_msg: >-
      Mautic persistent path {{ item.item }} is missing or has the wrong type; refusing
      to create a recovery point without local.php and the uploaded media directories.
  loop: "{{ _mautic_backup_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

# data.pxar holds database/ and mautic/. The archive root sits beside the data directory,
# outside /tmp (the client's tmpfs), and exists only for the backup; the data directory is
# mounted read-only at mautic/ inside the client container.
- name: Mautic backup | Create the empty archive root
  ansible.builtin.file:
    path: "{{ _mautic_backup_root }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [database, mautic]

- name: Mautic backup | Quiesce Mautic and publish one paired recovery point
  block:
    - name: Mautic backup | Stop this instance, dump its database and push one data archive
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: docker
        pbs_client_compose_project: "{{ mautic_project_dir }}"
        pbs_client_stop_services: [mautic_web, mautic_cron, mautic_worker]
        pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
        pbs_client_backup_id: "{{ _mautic_backup_id }}"
        # Mautic keeps exactly the two newest points.
        pbs_client_keep_daily: ""
        pbs_client_backup_args: [--all-file-systems, "true"]
        pbs_client_archives:
          - name: data.pxar
            path: "{{ _mautic_backup_root }}"
        pbs_client_backup_mounts:
          - path: "{{ _mautic_backup_data_path }}"
            target: "{{ _mautic_backup_root }}/mautic"

    - name: Mautic backup | Mark the recovery artifact complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Mautic backup | Remove the database dump
      ansible.builtin.file:
        path: "{{ _mautic_backup_root }}/database"
        state: absent

    # rmdir removes only the empty mount point and root, never data.
    - name: Mautic backup | Remove the empty archive root
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ _mautic_backup_root }}/mautic"
          - "{{ _mautic_backup_root }}"
      changed_when: true
