---
# Capture Mautic's named MariaDB database and its complete persistent file tree as one
# application-consistent PBS archive. Only this instance's web, cron and worker services
# stop; the shared database guest and every sibling application stay available.

- name: Mautic backup | Resolve the named database and credentials
  ansible.builtin.set_fact:
    _mautic_backup_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _mautic_backup_database_name: "{{ app_config.app.database.name | default('') }}"
    _mautic_backup_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _mautic_backup_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _mautic_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _mautic_backup_id: >-
      {{ app_config.backup.backup_id | default('', true) or instance }}
    _mautic_backup_restart_failed: false
    _application_backup_complete: false
  no_log: true

- name: Mautic backup | Assert the native recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _mautic_backup_database_backend.provider | default('') == 'mariadb'
      - _mautic_backup_database_backend.host | default('') | length > 0
      - _mautic_backup_database_backend.port | default(0) | int > 0
      - _mautic_backup_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_backup_database_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _mautic_backup_database_password | length > 0
      - _mautic_backup_data_path is match('^/[^/].*')
      - _mautic_backup_data_path != '/'
      - _mautic_backup_id is match('^[A-Za-z0-9_.-]+$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Mautic backup needs its named MariaDB backend, application database credential,
      non-root data path and a configured PBS target.
  no_log: true

- name: Mautic backup | Resolve PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Mautic backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Mautic. Deploy PBS and retry; a local dump is not a
      recovery point.

- name: Mautic backup | Inspect persistent file state
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _mautic_backup_data_path }}"
    - "{{ mautic_config_file }}"
    - "{{ mautic_media_files_dir }}"
    - "{{ mautic_media_images_dir }}"
  register: _mautic_backup_paths
  changed_when: false

- name: Mautic backup | Require the full configuration and media state
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - not item.stat.islnk
      - >-
        (item.item == mautic_config_file and item.stat.isreg and item.stat.size | int > 0)
        or (item.item != mautic_config_file and item.stat.isdir)
    fail_msg: >-
      Mautic persistent path {{ item.item }} is missing or has the wrong type; refusing
      to create a recovery point without local.php and the uploaded media directories.
  loop: "{{ _mautic_backup_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Mautic backup | Allocate private archive space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-mautic-backup-"
  register: _mautic_backup_scratch
  changed_when: true

- name: Mautic backup | Create the archive layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ _mautic_backup_scratch.path }}/payload"
    - "{{ _mautic_backup_scratch.path }}/payload/database"
    - "{{ _mautic_backup_scratch.path }}/payload/mautic"

- name: Mautic backup | Create a private database client file
  ansible.builtin.copy:
    dest: "{{ _mautic_backup_scratch.path }}/client.cnf"
    content: |
      [client]
      user={{ _mautic_backup_database_user }}
      password={{ _mautic_backup_database_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Mautic backup | Quiesce Mautic and publish one paired recovery point
  block:
    - name: Mautic backup | Stop only this instance's services
      community.docker.docker_compose_v2:
        project_src: "{{ mautic_project_dir }}"
        state: stopped
        services: [mautic_web, mautic_cron, mautic_worker]

    - name: Mautic backup | Dump the stopped instance's MariaDB database
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _mautic_backup_scratch.path }}:/work"
          - --env
          - DB_HOST
          - --env
          - DB_PORT
          - --env
          - DB_NAME
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends mariadb-client >/dev/null
            mariadb-dump --defaults-extra-file=/work/client.cnf \
              --host="$DB_HOST" --port="$DB_PORT" \
              --single-transaction --quick --skip-lock-tables --hex-blob --triggers \
              --no-create-db --databases "$DB_NAME" \
              > /work/payload/database/mautic.sql
            test -s /work/payload/database/mautic.sql
            grep -q '^CREATE TABLE ' /work/payload/database/mautic.sql
        expand_argument_vars: false
      environment:
        DB_HOST: "{{ _mautic_backup_database_backend.host }}"
        DB_PORT: "{{ _mautic_backup_database_backend.port }}"
        DB_NAME: "{{ _mautic_backup_database_name }}"
      no_log: true
      register: _mautic_backup_database_dump
      failed_when: false
      changed_when: true

    - name: Mautic backup | Report a failed database dump
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mautic_backup_database_dump }}"
        scrub_failure_secrets:
          - "{{ _mautic_backup_database_password }}"
          - "{{ _mautic_backup_database_backend.host }}"
          - "{{ _mautic_backup_database_name }}"
          - "{{ _mautic_backup_id }}"
        scrub_failure_context: Mautic backup | MariaDB database dump failed

    - name: Mautic backup | Push one database and file archive to PBS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _mautic_backup_scratch.path }}:/work"
          - --volume
          - "{{ _mautic_backup_data_path }}:/work/payload/mautic:ro"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - BACKUP_ID
          - --env
          - PBS_KEY_URL
          - --env
          - PBS_APT_REPO
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            test -s /work/payload/database/mautic.sql
            test -s /work/payload/mautic/config/local.php
            test -d /work/payload/mautic/media/files
            test -d /work/payload/mautic/media/images
            proxmox-backup-client backup data.pxar:/work/payload \
              --all-file-systems true --backup-id "$BACKUP_ID"
            # Keep exactly the two newest snapshots in host/<instance>.
            proxmox-backup-client prune "host/$BACKUP_ID" \
              --keep-last 2
            echo "Mautic backup complete: host/$BACKUP_ID (database and file state in data.pxar)"
        expand_argument_vars: false
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        BACKUP_ID: "{{ _mautic_backup_id }}"
        PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
        PBS_APT_REPO: >-
          {{ app_config.backup.client.repository }}
          {{ app_config.backup.client.suite }}
          {{ app_config.backup.client.component }}
      no_log: true
      register: _mautic_backup_pbs_upload
      failed_when: false
      changed_when: true

    - name: Mautic backup | Report a failed PBS archive upload
      ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
      vars:
        scrub_failure_result: "{{ _mautic_backup_pbs_upload }}"
        scrub_failure_secrets:
          - "{{ k8s_pbs_password }}"
          - "{{ k8s_pbs_fingerprint }}"
          - "{{ k8s_pbs_repository }}"
          - "{{ app_config.backup.client.key_url }}"
          - "{{ app_config.backup.client.repository }}"
          - "{{ homelabinfra_infra.backups.host }}"
          - "host/{{ _mautic_backup_id }}"
        scrub_failure_context: Mautic backup | PBS archive upload failed

    - name: Mautic backup | Mark the recovery artifact complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Mautic backup | Restart only this instance after backup
      block:
        - name: Mautic backup | Start this instance's services
          community.docker.docker_compose_v2:
            project_src: "{{ mautic_project_dir }}"
            state: present
            services: [mautic_web, mautic_cron, mautic_worker]
      rescue:
        - name: Mautic backup | Record a failed service restart
          ansible.builtin.set_fact:
            _mautic_backup_restart_failed: true

    - name: Mautic backup | Remove private scratch files
      ansible.builtin.file:
        path: "{{ _mautic_backup_scratch.path }}"
        state: absent

- name: Mautic backup | Fail if Mautic did not restart
  ansible.builtin.fail:
    msg: >-
      Mautic's backup attempt ended, but its services did not restart. Check the Compose
      project at {{ mautic_project_dir }} before retrying.
  when: _mautic_backup_restart_failed | bool
