---
# Mautic natively on an LXC or a VM: the pinned release package
# (https://docs.mautic.org/en/latest/getting_started/how_to_install_mautic.html) under Apache
# with mod_php, plus a messenger worker and a cron loop as separate systemd services. The
# release tree is replaced whole on a version change; its config, log and media directories
# are links to app.data_path, which the recovery archive covers. main.yml has already
# created the data directories and written local.php, the one configuration file.
- name: Mautic native | Assert the supported guest
  ansible.builtin.assert:
    that: ansible_facts.distribution_release in ['bookworm', 'noble']
    fail_msg: Native Mautic supports Debian 12 and Ubuntu 24.04 (PHP 8.2 or 8.3).

- name: Mautic native | Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: Mautic native | Install Apache, PHP and the extensions Mautic requires
  ansible.builtin.apt:
    name: [ca-certificates, unzip, apache2, libapache2-mod-php, php-cli, php-bcmath, php-curl, php-gd, php-imap, php-intl, php-mbstring, php-mysql, php-xml, php-zip]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Mautic native | Read the installed PHP version
  ansible.builtin.command:
    argv: [php, -r, "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"]
  register: _mautic_php_version
  changed_when: false

- name: Mautic native | Configure PHP for Mautic
  ansible.builtin.copy:
    dest: "/etc/php/{{ _mautic_php_version.stdout }}/{{ item }}/conf.d/90-mautic.ini"
    content: |
      date.timezone=UTC
      upload_max_filesize=512M
      post_max_size=512M
      memory_limit=512M
      max_execution_time=300
      expose_php=Off
    owner: root
    group: root
    mode: "0644"
  loop: [apache2, cli]
  notify: Restart mautic

- name: Mautic native | Read the installed release
  ansible.builtin.slurp:
    src: "{{ mautic_native_root }}/.release"
  register: _mautic_native_release
  failed_when: false

- name: Mautic native | Install the pinned release
  when: >-
    _mautic_native_release.content is not defined
    or (_mautic_native_release.content | b64decode | trim) != app_config.app.native_version
  block:
    - name: Mautic native | Create the download directory
      ansible.builtin.file:
        path: "{{ mautic_native_work_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Mautic native | Download the release package
      ansible.builtin.get_url:
        url: "https://github.com/mautic/mautic/releases/download/{{ app_config.app.native_version }}/{{ app_config.app.native_version }}.zip"
        dest: "{{ mautic_native_work_dir }}/mautic-{{ app_config.app.native_version }}.zip"
        checksum: "sha256:{{ app_config.app.native_sha256 }}"
        mode: "0600"

    - name: Mautic native | Clear a partial stage
      ansible.builtin.file:
        path: "{{ mautic_native_root }}.stage"
        state: absent

    - name: Mautic native | Create the stage directory beside the install
      ansible.builtin.file:
        path: "{{ mautic_native_root }}.stage"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Mautic native | Extract the release into the stage
      ansible.builtin.unarchive:
        src: "{{ mautic_native_work_dir }}/mautic-{{ app_config.app.native_version }}.zip"
        dest: "{{ mautic_native_root }}.stage"
        remote_src: true
        owner: www-data
        group: www-data

    - name: Mautic native | Mark the stage with its release
      ansible.builtin.copy:
        content: "{{ app_config.app.native_version }}\n"
        dest: "{{ mautic_native_root }}.stage/.release"
        owner: www-data
        group: www-data
        mode: "0644"

    # The running install stays until the stage is complete; the services stop only for
    # the two renames. State is not in the tree, only links to it.
    - name: Mautic native | Stop the services for the swap
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ mautic_native_services }}"
      failed_when: false

    - name: Mautic native | Swap the staged release into place
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          rm -rf "{{ mautic_native_root }}.previous"
          if [ -e "{{ mautic_native_root }}" ]; then mv "{{ mautic_native_root }}" "{{ mautic_native_root }}.previous"; fi
          mv "{{ mautic_native_root }}.stage" "{{ mautic_native_root }}"
        executable: /bin/bash
      register: _mautic_native_swap
      changed_when: true

    - name: Mautic native | Drop the previous release
      ansible.builtin.file:
        path: "{{ mautic_native_root }}.previous"
        state: absent

# The release's own state directories give way to links; anything already in them (the
# release's media .htaccess files) is kept in the durable directory.
- name: Mautic native | Link the release's state directories to the durable ones
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      link="{{ mautic_native_root }}/{{ item.link }}"
      target="{{ item.target }}"
      if [ -L "$link" ]; then
        [ "$(readlink "$link")" = "$target" ] && exit 0
        rm "$link"
      elif [ -e "$link" ]; then
        cp -an "$link"/. "$target"/
        chown -R www-data:www-data "$target"
        rm -rf "$link"
      fi
      mkdir -p "$(dirname "$link")"
      ln -s "$target" "$link"
      chown -h www-data:www-data "$link"
      echo changed
    executable: /bin/bash
  loop:
    - {link: config, target: "{{ mautic_config_dir }}"}
    - {link: var/logs, target: "{{ mautic_logs_dir }}"}
    - {link: media/files, target: "{{ mautic_media_files_dir }}"}
    - {link: media/images, target: "{{ mautic_media_images_dir }}"}
  loop_control:
    label: "{{ item.link }}"
  register: _mautic_native_links
  changed_when: "'changed' in _mautic_native_links.stdout"

- name: Mautic native | Verify the web user can use its configuration
  ansible.builtin.command:
    argv: [runuser, -u, www-data, --, sh, -c, "test -r {{ mautic_native_root }}/config/local.php && test -w {{ mautic_native_root }}/config/local.php"]
  changed_when: false

# Apache serves the release root; Mautic's own .htaccess rewrites need AllowOverride.
- name: Mautic native | Listen on the application port only
  ansible.builtin.copy:
    dest: /etc/apache2/ports.conf
    content: "Listen {{ app_config.app.port }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart mautic

- name: Mautic native | Render the Apache site
  ansible.builtin.template:
    src: mautic-apache.conf.j2
    dest: /etc/apache2/sites-available/mautic.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mautic

- name: Mautic native | Enable the rewrite and headers modules and the site; drop the default site
  ansible.builtin.file:
    path: "/etc/apache2/{{ item.path }}"
    src: "{{ item.src | default(omit) }}"
    state: "{{ item.state }}"
  loop:
    - {path: mods-enabled/rewrite.load, state: link, src: ../mods-available/rewrite.load}
    - {path: mods-enabled/headers.load, state: link, src: ../mods-available/headers.load}
    - {path: sites-enabled/mautic.conf, state: link, src: ../sites-available/mautic.conf}
    - {path: sites-enabled/000-default.conf, state: absent}
  loop_control:
    label: "{{ item.path }}"
  notify: Restart mautic

- name: Mautic native | Check whether the application is already installed
  ansible.builtin.stat:
    path: "{{ mautic_project_dir }}/.installed"
  register: _mautic_installed_marker

# Mautic's schema and admin user are created once through its console installer, as on
# Docker. A new release over an installed database migrates the schema instead.
- name: Mautic native | Run the non-interactive installer
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - www-data
      - --
      - php
      - bin/console
      - mautic:install
      - "https://{{ mautic_fqdn }}"
      - "--admin_email={{ app_config.app.admin_user }}@{{ homelabinfra_infra.domain | default('invalid') }}"
      - "--admin_password={{ _mautic_admin_password }}"
      - --force
    chdir: "{{ mautic_native_root }}"
  no_log: true
  when: not _mautic_installed_marker.stat.exists

- name: Mautic native | Record installation complete
  ansible.builtin.copy:
    dest: "{{ mautic_project_dir }}/.installed"
    content: "{{ ansible_date_time.iso8601 }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not _mautic_installed_marker.stat.exists

- name: Mautic native | Migrate the schema after a release change
  ansible.builtin.command:
    argv: [runuser, -u, www-data, --, php, bin/console, doctrine:migrations:migrate, --no-interaction, --allow-no-migration]
    chdir: "{{ mautic_native_root }}"
  when:
    - _mautic_installed_marker.stat.exists
    - _mautic_native_swap is changed
  changed_when: true
  notify: Restart mautic

- name: Mautic native | Install the cron loop
  ansible.builtin.template:
    src: mautic-cron.sh.j2
    dest: /usr/local/bin/mautic-cron
    owner: root
    group: root
    mode: "0755"
  notify: Restart mautic

- name: Mautic native | Install the worker and cron services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: [mautic-worker, mautic-cron]
  register: _mautic_native_units
  notify: Restart mautic

- name: Mautic native | Reload systemd after a unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: _mautic_native_units is changed

- name: Mautic native | Enable and start the services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ mautic_native_services | reverse | list }}"

- name: Mautic native | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Mautic native | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: [200, 302]
  register: _mautic_health
  until: _mautic_health.status | default(0) in [200, 302]
  retries: 60
  delay: 5
  changed_when: false

- name: Mautic native | Install the restart and log helpers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart apache2 mautic-worker mautic-cron
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        journalctl -u mautic-worker -u mautic-cron -n "${1:-50}" --no-pager
        tail -n "${1:-50}" /var/log/apache2/error.log
  loop_control:
    label: "{{ item.name }}"
