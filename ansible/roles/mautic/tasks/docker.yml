---
# Mautic on Docker: the official image's web, cron and worker services. main.yml has
# already created the directories and written local.php.
# The shared Compose deploy starts the web service once, recreating it in that up when the
# Compose file (which embeds MAUTIC_DB_PASSWORD, so its render stays out of the log) or
# local.php (config.yml) changed. Cron and the worker start after web answers, recreated
# when this deploy changed anything, so a changed local.php reaches them too.
- name: Mautic | Deploy the web service
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ mautic_project_dir }}"
    compose_services: [mautic_web]
    compose_secrets: ["{{ app_config.app.database_password }}"]
    compose_recreate: >-
      {{ _mautic_local_php_seeded.changed | default(false)
         or mautic_converge_result.changed | default(false) }}
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/"
      status: [200, 302]
      retries: 60

- name: Mautic | Verify the web runtime can access its configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ mautic_project_dir }}"
      - exec
      - -T
      - --user
      - www-data
      - mautic_web
      - sh
      - -c
      - test -r /var/www/html/config/local.php && test -w /var/www/html/config/local.php
  changed_when: false

- name: Mautic | Start background services
  community.docker.docker_compose_v2:
    project_src: "{{ mautic_project_dir }}"
    state: present
    services: [mautic_cron, mautic_worker]
    recreate: "{{ 'always' if compose_deploy_changed | bool else 'auto' }}"

# Mautic's schema and admin user are created once, non-interactively, through its own
# console installer rather than the browser-based setup wizard — the same reasoning as
# roles/odoo's `--init`: this role has no way to drive a web wizard, and re-running an
# installer against an already-installed database is destructive rather than idempotent,
# so a marker file is what makes a second run a no-op instead of a second attempt.
# (`_mautic_installed_marker` was resolved earlier in this file, ahead of the local.php
# tasks that also need to know whether installation has happened yet.)
- name: Mautic | Run the non-interactive installer
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ mautic_project_dir }}"
      - exec
      - -T
      - --user
      - www-data
      - --workdir
      - /var/www/html
      - mautic_web
      - php
      - bin/console
      - mautic:install
      - "https://{{ mautic_fqdn }}"
      - "--admin_email={{ app_config.app.admin_user }}@{{ homelabinfra_infra.domain | default('invalid') }}"
      - "--admin_password={{ _mautic_admin_password }}"
      - --force
  no_log: true
  when: not _mautic_installed_marker.stat.exists

- name: Mautic | Record installation complete
  ansible.builtin.copy:
    dest: "{{ mautic_project_dir }}/.installed"
    content: "{{ ansible_date_time.iso8601 }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not _mautic_installed_marker.stat.exists
