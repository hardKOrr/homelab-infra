---
# The Docker deployment remains Mautic's default. Kubernetes is selected explicitly in
# the instance config and takes a separate adapter path through the same app role.
- name: Mautic | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('docker') == 'docker'

- name: Mautic | Deploy on Kubernetes
  ansible.builtin.include_tasks: kubernetes.yml
  when: app_config.hosting.method | default('docker') == 'kubernetes'
