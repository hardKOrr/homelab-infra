---
- name: Mautic | Create project directory
  ansible.builtin.file:
    path: "{{ mautic_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Mautic | Create writable volume directories for the official image user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "www-data"
    group: "www-data"
    mode: "0750"
  loop:
    - "{{ mautic_config_dir }}"
    - "{{ mautic_logs_dir }}"
    - "{{ mautic_media_files_dir }}"
    - "{{ mautic_media_images_dir }}"

- name: Mautic | Resolve platform mail
  ansible.builtin.include_tasks: ../../../tasks/mail/resolve-mail.yml

# `wiring_mail.encryption` normalized here, once, rather than at every point this role
# reads it: tasks/mail/resolve-mail.yml resolves it with a bare
# `default('starttls')` (no boolean mode), which only substitutes when the key is
# UNDEFINED. config-doctor.sh explicitly accepts `mail.encryption: ""` as valid
# authored config, so an authored blank survives resolve-mail.yml as the empty string,
# not as `starttls` — and an empty string is not a key in the scheme-mapping dict this
# role's local.php tasks index below, which would otherwise fail templating on an
# entirely valid configuration.
- name: Mautic | Normalize a blank mail.encryption to its documented default
  ansible.builtin.set_fact:
    wiring_mail: "{{ wiring_mail | combine({'encryption': wiring_mail.encryption | default('starttls', true)}) }}"
  no_log: true

# Symfony Mailer's `smtp://` scheme (the one both `starttls` and `none` select — see
# the comment in templates/local.php.j2) only ATTEMPTS StartTLS when the server
# advertises it in its EHLO response; it never refuses to send credentials over a
# connection that didn't get it, and the pinned symfony/mailer 6.4.13 has no DSN option
# to require and abort instead (confirmed against Transport/Smtp/EsmtpTransport.php:
# `executeEhloCommand`'s STARTTLS branch has no failure path for "not offered").
# `mail.encryption: starttls` is the operator asking for that encryption, not merely
# hinting at it — CONTRACT.md draws that line for `routing.access: authenticated` for
# the same reason (tasks/wiring/caddy.yml asserts identity actually gates the route
# rather than trusting the label). This preflight is that same assertion for mail: it
# connects to the configured relay from the guest that will actually run Mautic, and
# refuses to deploy rather than silently downgrading to a connection that will send the
# relay password in the clear if the relay's STARTTLS support is ever missing,
# misconfigured, or stripped in transit.
- name: Mautic | Check whether the mail relay actually advertises STARTTLS
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import smtplib, sys
        with smtplib.SMTP("{{ wiring_mail.host }}", {{ wiring_mail.port }}, timeout=10) as smtp:
            smtp.ehlo()
            sys.exit(0 if smtp.has_extn("starttls") else 1)
  register: _mautic_starttls_check
  failed_when: false
  changed_when: false
  when:
    - wiring_mail.enabled | default(false) | bool
    - wiring_mail.encryption == 'starttls'

- name: Mautic | Refuse to deploy when the relay cannot actually enforce STARTTLS
  ansible.builtin.fail:
    msg: >-
      infrastructure.yml declares mail.encryption: starttls, but
      {{ wiring_mail.host }}:{{ wiring_mail.port }} did not advertise STARTTLS support
      in its EHLO response (or could not be reached). Deploying anyway would let
      Mautic's mail transport send the relay password over an unencrypted connection
      the moment STARTTLS is unavailable, which is exactly the outcome
      mail.encryption: starttls exists to prevent. Fix the relay's STARTTLS support,
      or set mail.encryption to tls (implicit TLS, typically port 465) if the relay
      supports it, or to the explicit none if plaintext is genuinely acceptable here.
  when:
    - wiring_mail.enabled | default(false) | bool
    - wiring_mail.encryption == 'starttls'
    - _mautic_starttls_check.rc | default(1) != 0

- name: Mautic | Generate or reuse administrator password
  ansible.builtin.set_fact:
    _mautic_admin_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).admin_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Mautic | Store credentials in the canonical Vaultwarden item
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: mautic
      instance: "{{ instance }}"
      admin_user: "{{ app_config.app.admin_user }}"
      admin_password: "{{ _mautic_admin_password }}"
      database_provider: mariadb
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [admin_password, database_password]
  no_log: true

- name: Mautic | Check whether the configuration already exists
  ansible.builtin.stat:
    path: "{{ mautic_config_file }}"
  register: _mautic_local_php_stat

# Moved ahead of the config tasks below, because they need it: whether `db_driver` and
# `site_url` belong in local.php at all depends on whether the installer has run yet.
- name: Mautic | Check whether the application is already installed
  ansible.builtin.stat:
    path: "{{ mautic_project_dir }}/.installed"
  register: _mautic_installed_marker

# Seeds a brand-new file only. See the header comment in templates/local.php.j2: Mautic
# writes its own keys into this same file — most importantly `secret_key`, minted during
# `mautic:install` below — that this role does not generate and would otherwise silently
# delete by re-templating the whole file on every converge.
- name: Mautic | Seed configuration on first deploy
  ansible.builtin.template:
    src: local.php.j2
    dest: "{{ mautic_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not _mautic_local_php_stat.stat.exists
  notify: Restart mautic

# The converge path for every later run: update only the keys this role actually owns,
# by exact line replacement, and leave every other key already in the file — secret_key
# above all — untouched. Idempotent against the seed task above: the line this task
# looks for and the line the seed template writes are byte-identical, so a first deploy
# converges here with no change.
#
# `db_driver` and `site_url` are DELIBERATELY EXCLUDED until `.installed` exists.
# mautic/docker-mautic's own entrypoints (common/startup/wait_for_mautic_install.sh,
# common/entrypoint_mautic_web.sh) treat "both of these are non-empty in local.php" as
# their only signal that Mautic is already installed: mautic_web runs
# `doctrine:migrations:migrate` instead of waiting the moment it sees them, and
# mautic_cron/mautic_worker block on that same check before starting at all. Writing
# them before this role's own `mautic:install` task below has run would make the image's
# entrypoint apply raw schema migrations to an empty database — skipping the seed data,
# roles and admin user `mautic:install` creates — and then have this role's installer
# run second, against a database in a state it was never designed to see. `site_url` is
# supplied to `mautic:install` as its own CLI argument and `db_driver` needs no value
# from this role at all; both end up in local.php because Mautic's installer, like its
# web wizard, writes them there itself once installation actually succeeds.
#
# Every value is escaped twice before it reaches `line:`, in this order:
#   1. `replace('%', '%%')` — this file is loaded as Symfony DI container parameters
#      (confirmed against the pinned mautic/mautic 6.0.6 tag's own
#      app/bundles/ConfigBundle/Form/Type/EscapeTransformer.php, which the config UI's
#      own save path runs before writing this same file), and Symfony treats a single
#      `%` as the start of a `%parameter.name%` reference — an unescaped one (which
#      `mailer_dsn`'s own urlencoding introduces below even when nothing else would)
#      can make the container fail to compile with a missing-parameter error.
#   2. `replace('\\', '\\\\') | replace("'", "\\'")` — PHP single-quoted string
#      escaping, so an unescaped `'` or `\` in a database or mail credential cannot
#      terminate the PHP string early and corrupt this file.
# `line:` is a block scalar, deliberately, not a quoted string: a double-quoted YAML
# string applies its OWN backslash escaping before Jinja ever sees the content, which
# collapses the `replace(...)` chain below into something Jinja can't even parse. A
# block scalar carries every backslash and quote through to Jinja untouched.
- name: Mautic | Converge platform-owned configuration fields
  ansible.builtin.lineinfile:
    path: "{{ mautic_config_file }}"
    regexp: "^\\s*'{{ item.key }}'\\s*=>.*,$"
    line: >-
      '{{ item.key }}' => '{{ item.value | replace('%', '%%') | replace('\\', '\\\\') | replace("'", "\\'") }}',
    # Without this, a key absent from a mail-disabled deploy's local.php (or from a
    # pre-install one) is inserted at end-of-file by lineinfile's own default — AFTER
    # the closing `);` of the PHP array, which is not valid PHP. Every new key this
    # task adds must land inside the array instead.
    insertbefore: '^\);$'
  loop: "{{ _mautic_local_php_fields }}"
  loop_control:
    label: "{{ item.key }}"
  # `_mautic_local_php_fields`'s mail branch converges a single `mailer_dsn` key, not
  # the discrete mailer_transport/host/port/user/password/encryption/auth_mode keys
  # this role wrote before. Confirmed against the pinned mautic/mautic 6.0.6 tag's own
  # source, not assumed: app/bundles/EmailBundle/Config/config.php's `parameters`
  # array declares only `mailer_dsn` (default `smtp://localhost:25`) plus
  # `mailer_from_name`/`mailer_from_email` — the seven transport-specific keys appear
  # nowhere in that file or in EmailBundle's ConfigType form, and
  # app/migrations/Version20230615101328.php is the migration that combined exactly
  # those keys into one DSN string for every Mautic install upgrading from an older
  # release. Writing the old keys converges nothing: Mautic keeps mailing through
  # whatever `mailer_dsn` already holds — its own shipped default, `smtp://
  # localhost:25`, on a fresh install — regardless of what this role wrote elsewhere.
  # `mailer_dsn`'s scheme follows `mail.encryption` (CONTRACT.md, config-doctor.sh:
  # `starttls | tls | none`, never `ssl`). `tls` means implicit TLS from the first byte
  # of the connection and is the one value that needs its own scheme, `smtps` —
  # confirmed against the pinned symfony/mailer 6.4.13's own
  # Transport/Smtp/EsmtpTransportFactory.php (`$tls = 'smtps' === $dsn->getScheme()`)
  # and EsmtpTransport.php (`port ?: 465`). `starttls` and `none` both map to plain
  # `smtp`: stock Symfony Mailer has no DSN option that forces a connection to refuse
  # an opportunistic STARTTLS upgrade the server offers — `smtp://` negotiates it
  # automatically whenever available (EsmtpTransport.php's `executeEhloCommand`), for
  # both of these configured states alike. `none` cannot be made stronger than
  # "unencrypted unless the server insists otherwise" without a transport this
  # platform does not ship; the mapping is written as an explicit three-entry lookup
  # instead of a two-way branch so that fact is a decision on the page, not an
  # assumption buried in an else.
  #
  # user/password are urlencoded (with `/` additionally replaced — Jinja's
  # `urlencode` deliberately leaves it unescaped for path segments, which a DSN's
  # userinfo is not) because a DSN is a URI: any of `@`, `:` or `/` in either would
  # otherwise be parsed as a DSN delimiter rather than a literal credential character
  # — independent of, and applied before, the generic %/PHP-string escaping the
  # `line:` template above applies to every field's value.
  #
  # This is also an explicit disabled path, not merely an empty one:
  # `wiring_mail.enabled` turning false — infrastructure.mail.provider set back to
  # `none` after a deployment that had it configured — must actively replace the
  # relay/credentials already converged into `mailer_dsn`, not leave `lineinfile` with
  # nothing in its loop and the old DSN untouched. Resetting to Mautic's own shipped
  # default (`smtp://localhost:25`, the same value app.bundles/EmailBundle/Config/
  # config.php ships) is the supported no-delivery state: no local MTA exists in this
  # container, so this DSN fails outbound send rather than reaching a stale relay
  # under credentials this role no longer manages. This comment lives up here, not
  # inside the block scalar below: a `#` line inside a `>-` block is literal content,
  # not a YAML or Jinja comment, and would corrupt the expression Jinja parses.
  vars:
    _mautic_local_php_fields: >-
      {{ ([
           {'key': 'db_driver', 'value': 'pdo_mysql'},
           {'key': 'site_url', 'value': 'https://' ~ mautic_fqdn},
         ] if _mautic_installed_marker.stat.exists else [])
         + [
           {'key': 'db_host', 'value': app_config.app.database_host},
           {'key': 'db_port', 'value': app_config.app.database_port},
           {'key': 'db_name', 'value': app_config.app.database.name},
           {'key': 'db_user', 'value': app_config.app.database_user},
           {'key': 'db_password', 'value': app_config.app.database_password},
         ]
         + ([
           {'key': 'mailer_from_name',
            'value': wiring_mail.from_name | default(app_config.app.name | default('Mautic'), true)},
           {'key': 'mailer_from_email', 'value': wiring_mail.from_address},
           {'key': 'mailer_dsn',
            'value': ({'starttls': 'smtp', 'tls': 'smtps', 'none': 'smtp'}[wiring_mail.encryption])
                     ~ '://' ~ (wiring_mail.username | urlencode | replace('/', '%2F'))
                     ~ ':' ~ (wiring_mail.password | urlencode | replace('/', '%2F'))
                     ~ '@' ~ (wiring_mail.host | urlencode) ~ ':' ~ wiring_mail.port},
         ] if wiring_mail.enabled | default(false) | bool else [
           {'key': 'mailer_dsn', 'value': 'smtp://localhost:25'},
         ]) }}
  no_log: true
  notify: Restart mautic

- name: Mautic | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mautic_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  # The rendered file embeds MAUTIC_DB_PASSWORD in plain text (docker-compose.yml.j2's
  # x-mautic-env anchor) — a diff or failure output would otherwise print it, contrary
  # to docs/specs/secrets-handling.md.
  no_log: true
  notify: Restart mautic

- name: Mautic | Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ mautic_project_dir }}"

- name: Mautic | Start service
  community.docker.docker_compose_v2:
    project_src: "{{ mautic_project_dir }}"
    state: present
    remove_orphans: true

- name: Mautic | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Mautic | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/"
    status_code: [200, 302]
  register: _mautic_health
  until: _mautic_health.status | default(0) in [200, 302]
  retries: 60
  delay: 5
  changed_when: false

# Mautic's schema and admin user are created once, non-interactively, through its own
# console installer rather than the browser-based setup wizard — the same reasoning as
# roles/odoo's `--init`: this role has no way to drive a web wizard, and re-running an
# installer against an already-installed database is destructive rather than idempotent,
# so a marker file is what makes a second run a no-op instead of a second attempt.
# (`_mautic_installed_marker` was resolved earlier in this file, ahead of the local.php
# tasks that also need to know whether installation has happened yet.)
- name: Mautic | Run the non-interactive installer
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ mautic_project_dir }}"
      - exec
      - -T
      - --user
      - www-data
      - --workdir
      - /var/www/html
      - mautic_web
      - php
      - bin/console
      - mautic:install
      - "https://{{ mautic_fqdn }}"
      - "--admin_email={{ app_config.app.admin_user }}@{{ homelabinfra_infra.domain | default('invalid') }}"
      - "--admin_password={{ _mautic_admin_password }}"
      - --force
  no_log: true
  when: not _mautic_installed_marker.stat.exists

- name: Mautic | Record installation complete
  ansible.builtin.copy:
    dest: "{{ mautic_project_dir }}/.installed"
    content: "{{ ansible_date_time.iso8601 }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not _mautic_installed_marker.stat.exists
