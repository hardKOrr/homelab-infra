---
# The Docker deployment remains Mautic's default. Native runs Mautic's release package on
# its own guest; Kubernetes takes a separate adapter path through the same app role. Docker
# and native share the data layout, credentials and local.php handling.
- name: Mautic | Prepare and configure the Docker or native guest
  when: app_config.hosting.method | default('docker') in ['docker', 'native']
  block:
    - name: Mautic | Create project directory
      ansible.builtin.file:
        path: "{{ mautic_project_dir }}"
        state: directory
        owner: root
        group: root
        # Natively the web user must traverse it: for the instance `mautic` the default
        # data path sits below it. Its credential-bearing files keep their own modes.
        mode: "{{ '0755' if mautic_native | bool else '0750' }}"

    - name: Mautic | Create writable volume directories for the web user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0750"
      loop:
        - "{{ mautic_config_dir }}"
        - "{{ mautic_logs_dir }}"
        - "{{ mautic_media_files_dir }}"
        - "{{ mautic_media_images_dir }}"

    - name: Mautic | Resolve credentials
      ansible.builtin.include_tasks: credentials.yml

    - name: Mautic | Write the configuration
      ansible.builtin.include_tasks: config.yml

- name: Mautic | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('docker') == 'docker'

- name: Mautic | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method | default('docker') == 'native'

- name: Mautic | Deploy on Kubernetes
  ansible.builtin.include_tasks: kubernetes.yml
  when: app_config.hosting.method | default('docker') == 'kubernetes'

# The installer writes `db_driver` and `site_url` into local.php itself, after config.yml
# converged it without them. Converge once more on the Deploy that installed Mautic, so that
# Deploy ends in the state a repeat Deploy finds and the repeat changes nothing.
# kubernetes.yml does the same with its own converge.
# config.yml registers the marker again, so the fact holds this Deploy's answer.
- name: Mautic | Record whether this Deploy installed Mautic
  ansible.builtin.set_fact:
    _mautic_installed_now: "{{ not _mautic_installed_marker.stat.exists }}"
  when: app_config.hosting.method | default('docker') in ['docker', 'native']

- name: Mautic | Converge the configuration the installer completed
  when:
    - app_config.hosting.method | default('docker') in ['docker', 'native']
    - _mautic_installed_now | bool
  block:
    - name: Mautic | Converge local.php after installation
      ansible.builtin.include_tasks: config.yml

    # Native restarts through the role's handler, which config.yml notifies.
    - name: Mautic | Recreate the Docker services after a converged change
      ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
      vars:
        restart_runtime: docker
        restart_compose_project: "{{ mautic_project_dir }}"
      when:
        - app_config.hosting.method | default('docker') == 'docker'
        - mautic_converge_result.changed | default(false)
