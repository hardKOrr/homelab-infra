---
# restore-swap.yml replaced hook: the restored local.php names the source's database and
# URL; point it at the target's MariaDB database and public hostname before Mautic starts.
- name: Mautic restore | Load the target domain declaration
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../config/infrastructure.yml"
    name: _mautic_restore_domain_config
  failed_when: false
  no_log: true

- name: Mautic restore | Resolve the target public hostname
  ansible.builtin.set_fact:
    _mautic_restore_domain: >-
      {{ _mautic_restore_domains.get(
           _mautic_restore_estate, {}).domain
         | default((_mautic_restore_domain_config | default({})).domain
           | default(homelabinfra_infra.domain | default('')), true) }}
    _mautic_restore_fqdn: >-
      {{ (app_config.routing.subdomain | default(restore_target, true)) ~ '.' ~
         (_mautic_restore_domains.get(
           _mautic_restore_estate, {}).domain
           | default((_mautic_restore_domain_config | default({})).domain
             | default(homelabinfra_infra.domain | default('')), true)) }}
  vars:
    _mautic_restore_domains: >-
      {{ (_mautic_restore_domain_config | default({})).domains | default({}) }}
    _mautic_restore_default_estates: >-
      {{ _mautic_restore_domains | dict2items
         | selectattr('value.default', 'defined')
         | selectattr('value.default') | map(attribute='key') | list }}
    _mautic_restore_estate: >-
      {{ app_config.routing.estate | default('', true)
         or (_mautic_restore_default_estates | first
             | default(_mautic_restore_domains.keys() | first | default(''), true)) }}

- name: Mautic restore | Require the target hostname
  ansible.builtin.assert:
    that:
      - _mautic_restore_domain | length > 0
      - _mautic_restore_fqdn | length > 0
    fail_msg: >-
      Mautic restore cannot set the target's public URL because its domain is missing.

- name: Mautic restore | Converge the target database connection and URL
  ansible.builtin.lineinfile:
    path: "{{ _mautic_restore_data_path }}/config/local.php"
    # The restored archive may predate the runtime-readable config permissions.
    owner: "www-data"
    group: "www-data"
    mode: "0640"
    regexp: "^\\s*'{{ item.key }}'\\s*=>.*,$"
    line: >-
      '{{ item.key }}' => {{ lookup('template', 'php-string.j2', template_vars={'value': item.value}) | trim }},
    insertbefore: "^\\);$"
  loop:
    - key: db_driver
      value: pdo_mysql
    - key: db_host
      value: "{{ _mautic_restore_database_backend.host }}"
    - key: db_port
      value: "{{ _mautic_restore_database_backend.port }}"
    - key: db_name
      value: "{{ _mautic_restore_database_name }}"
    - key: db_user
      value: "{{ _mautic_restore_database_user }}"
    - key: db_password
      value: "{{ _mautic_restore_database_password }}"
    - key: site_url
      value: "https://{{ _mautic_restore_fqdn }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
