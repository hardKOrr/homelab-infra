---
# restore-swap.yml replaced hook: the restored local.php names the source's database, URL
# and mail settings; converge it to the target's before Mautic starts.
- name: Mautic restore | Load the target domain declaration
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../config/infrastructure.yml"
    name: _mautic_restore_domain_config
  failed_when: false
  no_log: true

- name: Mautic restore | Resolve the target public hostname
  ansible.builtin.set_fact:
    _mautic_restore_domain: >-
      {{ _mautic_restore_domains.get(
           _mautic_restore_estate, {}).domain
         | default((_mautic_restore_domain_config | default({})).domain
           | default(homelabinfra_infra.domain | default('')), true) }}
    _mautic_restore_fqdn: >-
      {{ (app_config.routing.subdomain | default(restore_target, true)) ~ '.' ~
         (_mautic_restore_domains.get(
           _mautic_restore_estate, {}).domain
           | default((_mautic_restore_domain_config | default({})).domain
             | default(homelabinfra_infra.domain | default('')), true)) }}
  vars:
    _mautic_restore_domains: >-
      {{ (_mautic_restore_domain_config | default({})).domains | default({}) }}
    _mautic_restore_default_estates: >-
      {{ _mautic_restore_domains | dict2items
         | selectattr('value.default', 'defined')
         | selectattr('value.default') | map(attribute='key') | list }}
    _mautic_restore_estate: >-
      {{ app_config.routing.estate | default('', true)
         or (_mautic_restore_default_estates | first
             | default(_mautic_restore_domains.keys() | first | default(''), true)) }}

- name: Mautic restore | Require the target hostname
  ansible.builtin.assert:
    that:
      - _mautic_restore_domain | length > 0
      - _mautic_restore_fqdn | length > 0
    fail_msg: >-
      Mautic restore cannot set the target's public URL because its domain is missing.

- name: Mautic restore | Resolve platform mail
  ansible.builtin.include_tasks: mail.yml

# The same keys Deploy converges, so the restored file does not keep the source's mail
# settings until the next Deploy. Restore-swap starts the services after this hook.
- name: Mautic restore | Converge the target's platform-owned configuration fields
  ansible.builtin.include_tasks: converge-local-php.yml
  vars:
    mautic_converge_file: "{{ _mautic_restore_data_path }}/config/local.php"
    mautic_converge_installed: true
    mautic_converge_fqdn: "{{ _mautic_restore_fqdn }}"
    mautic_converge_database:
      host: "{{ _mautic_restore_database_backend.host }}"
      port: "{{ _mautic_restore_database_backend.port }}"
      name: "{{ _mautic_restore_database_name }}"
      user: "{{ _mautic_restore_database_user }}"
      password: "{{ _mautic_restore_database_password }}"

# Mautic compiles local.php into its cache; the restored file must not meet the old one.
- name: Mautic restore | Clear the native cache
  ansible.builtin.command:
    argv: [find, "{{ mautic_native_root }}/var/cache", -mindepth, "1", -delete]
    removes: "{{ mautic_native_root }}/var/cache"
  when: mautic_native | default(false) | bool
