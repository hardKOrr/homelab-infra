---
# Mail and administrator credentials every hosting method needs before it writes local.php.
- name: Mautic | Resolve platform mail
  ansible.builtin.include_tasks: ../../../tasks/mail/resolve-mail.yml

# `wiring_mail.encryption` normalized here, once, rather than at every point this role
# reads it: tasks/mail/resolve-mail.yml resolves it with a bare
# `default('starttls')` (no boolean mode), which only substitutes when the key is
# UNDEFINED. config-doctor.sh explicitly accepts `mail.encryption: ""` as valid
# authored config, so an authored blank survives resolve-mail.yml as the empty string,
# not as `starttls` — and an empty string is not a key in the scheme-mapping dict this
# role's local.php tasks index below, which would otherwise fail templating on an
# entirely valid configuration.
- name: Mautic | Normalize a blank mail.encryption to its documented default
  ansible.builtin.set_fact:
    wiring_mail: "{{ wiring_mail | combine({'encryption': wiring_mail.encryption | default('starttls', true)}) }}"
  no_log: true

# Symfony Mailer's `smtp://` scheme only ATTEMPTS StartTLS when the server advertises
# it in that particular connection's EHLO response; it never refuses to send
# credentials over a connection that didn't get it, and the pinned symfony/mailer
# 6.4.13 has no DSN option to require and abort instead (confirmed against
# Transport/Smtp/EsmtpTransport.php: `executeEhloCommand`'s STARTTLS branch has no
# failure path for "not offered"). A deploy-time EHLO probe was tried here and
# rejected: it can only observe ONE connection at the moment this role happens to run,
# and Mautic's own worker/cron processes open a fresh connection for every batch of
# mail after that — a relay config change, a failover target, or a STARTTLS-stripping
# path introduced any time after this deploy would silently restore exactly the
# plaintext-credential exposure the probe claimed to have ruled out. A one-time check
# is not enforcement, and reporting it as though it were would be worse than having
# no check at all.
#
# `tls` (implicit TLS, EsmtpTransport.php: `$tls = 'smtps' === $dsn->getScheme()`)
# does not have this gap: the very first byte of every single connection is wrapped in
# TLS by PHP's own `stream_socket_client('ssl://...')`, and that call throws
# immediately if the handshake fails — there is no plaintext fallback to slip into,
# on this connection or the next one. `starttls` is therefore rejected for this app
# outright, rather than accepted and only partially enforced.
- name: Mautic | Refuse a mail.encryption this app cannot actually enforce
  ansible.builtin.assert:
    that: wiring_mail.encryption != 'starttls'
    fail_msg: >-
      infrastructure.yml declares mail.encryption: starttls, but Mautic's mail
      transport (Symfony Mailer, pinned to 6.4.13 in mautic/mautic 6.0.6) has no way
      to require StartTLS and refuse a connection that doesn't get it — every
      connection its worker and cron processes open is independently opportunistic,
      so no deploy-time check can enforce this setting for the life of the
      deployment. Set mail.encryption to tls (implicit TLS from the first byte of
      every connection, hard-enforced by the transport itself — typically port 465)
      if the relay supports it, or to the explicit none if plaintext is genuinely
      acceptable here.
  when: wiring_mail.enabled | default(false) | bool

- name: Mautic | Generate or reuse administrator password
  ansible.builtin.set_fact:
    _mautic_admin_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).admin_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Mautic | Store credentials in the canonical Vaultwarden item
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  # Check mode can use the already-loaded credential snapshot, but must not run a
  # mutating Vaultwarden upsert (or its command-based readback sequence).
  when: not ansible_check_mode
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: mautic
      instance: "{{ instance }}"
      admin_user: "{{ app_config.app.admin_user }}"
      admin_password: "{{ _mautic_admin_password }}"
      database_provider: mariadb
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [admin_password, database_password]
  no_log: true
