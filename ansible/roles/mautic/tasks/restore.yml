---
- name: Mautic restore | Restore Docker state through the existing native path
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    (restore_target_config | default(app_config, true)).hosting.method
    | default('docker') == 'docker'

- name: Mautic restore | Restore Kubernetes state through shared recovery Jobs
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    (restore_target_config | default(app_config, true)).hosting.method
    | default('docker') == 'kubernetes'
