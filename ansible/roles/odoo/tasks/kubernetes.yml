---
- name: Odoo Kubernetes | Resolve the cluster
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: Odoo Kubernetes | Ensure the owned namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/ensure-namespace.yml

- name: Odoo Kubernetes | Add the registered database firewall destination
  ansible.builtin.set_fact:
    app_config: >-
      {{ app_config | combine({'firewall': {
           'egress': ((app_config.firewall | default({})).egress | default([])
                      | rejectattr('name', 'equalto', 'odoo-database') | list)
                     + [{'name': 'odoo-database', 'protocol': 'TCP',
                         'port': app_config.app.database_port | string,
                         'destination': app_config.app.database_host}]}}, recursive=True) }}
  no_log: true

- name: Odoo Kubernetes | Open database and mail egress through the cluster node alias
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/open-app-access.yml
  vars:
    firewall_sends_mail: true

- name: Odoo | Assert the supported Community CRM baseline
  ansible.builtin.assert:
    that:
      - app_config.crm.modules | default(['crm']) is iterable
      - "'crm' in (app_config.crm.modules | default(['crm']))"
      - (app_config.crm.modules | default(['crm']) | intersect(['studio', 'voip', 'iap', 'lead_mining'])) | length == 0
    fail_msg: >-
      The supported baseline must include Community crm. Enterprise-only modules are not
      deployment dependencies; add other Community modules explicitly in instance config.

- name: Odoo | Resolve platform mail
  ansible.builtin.include_tasks: ../../../tasks/mail/resolve-mail.yml

- name: Odoo | Generate or reuse administrator password
  ansible.builtin.set_fact:
    _odoo_admin_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).admin_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Odoo | Store credentials in the canonical Vaultwarden item
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: odoo-community
      instance: "{{ instance }}"
      admin_user: "{{ app_config.app.admin_user }}"
      admin_password: "{{ _odoo_admin_password }}"
      database_provider: postgresql
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
      filestore_path: "{{ app_config.app.filestore_path }}"
    vault_item_secret_fields: [admin_password, database_password]
  no_log: true

- name: Odoo | Validate requested Community modules
  ansible.builtin.assert:
    that:
      - app_config.crm.modules | default(['crm']) is sequence
      - (app_config.crm.modules | default(['crm']) | select('match', '^[a-z][a-z0-9_]*$') | list | length) == (app_config.crm.modules | default(['crm']) | length)
    fail_msg: "crm.modules must be a list of safe Odoo module names."

- name: Odoo | Resolve requested Community modules
  ansible.builtin.set_fact:
    _odoo_modules: "{{ app_config.crm.modules | default(['crm']) | unique | sort | join(',') }}"

- name: Odoo Kubernetes | Render private runtime configuration
  ansible.builtin.set_fact:
    _odoo_k8s_config: "{{ lookup('ansible.builtin.template', 'odoo.conf.j2') }}"
  no_log: true

- name: Odoo Kubernetes | Sync private runtime configuration
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ instance }}-config"
    k8s_secret_data:
      odoo.conf: "{{ _odoo_k8s_config }}"
  no_log: true

- name: Odoo Kubernetes | Apply the workload
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/apply-manifest.yml
  vars:
    k8s_manifest: "{{ lookup('ansible.builtin.template', 'manifest.yaml.j2') }}"
    k8s_wait_for: ["deployment/{{ instance }}"]
    k8s_wait_timeout: 900

- name: Odoo Kubernetes | Describe the registered database recovery step
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_source: registered
    k8s_database_step_config: "{{ app_config }}"
    k8s_database_step_instance: "{{ instance }}"
  when: app_config.backup.enabled | default(false) | bool

# Docker recovery points use odoo.dump even for a differently named database.
- name: Odoo Kubernetes | Schedule the paired database and filestore backup
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-backup.yml
  vars:
    k8s_recovery:
      archives:
        - name: filestore
          claim: "{{ instance }}-filestore"
          owner: "{{ app_config.app.puid }}:{{ app_config.app.pgid }}"
      database: >-
        {{ k8s_database_step | default({}) | combine({'dump':
           'sh /etc/recovery-credentials/database-client.sh dump "${DUMP_DIR}/odoo.dump"'}) }}
      stop: ["{{ instance }}"]
      describe: the named PostgreSQL database and Odoo data_dir including attachments
