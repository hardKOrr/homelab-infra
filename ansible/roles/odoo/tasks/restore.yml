---
# Restore Odoo's application-consistent PostgreSQL database and filestore snapshot.
#
# Plan mode only lists snapshots. Overwrite mode validates both pxar members before stopping
# Odoo, then replaces the target's named database and data_dir/filestore tree. A failure
# leaves only this Odoo service stopped; the shared PostgreSQL guest and source artifact
# remain available for inspection and retry.

- name: Odoo restore | Resolve target database, backend and credential
  ansible.builtin.set_fact:
    _odoo_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _odoo_restore_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _odoo_restore_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _odoo_restore_database_name: "{{ app_config.app.database.name | default('') }}"
    _odoo_restore_filestore_path: "{{ app_config.app.filestore_path | default('') }}"
    _odoo_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _odoo_restore_source_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           (restore_source_database | default({})).get('instance', ''), {}) }}
  no_log: true

- name: Odoo restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - _odoo_restore_database_backend.provider | default('') == 'postgresql'
      - _odoo_restore_database_backend.host | default('') | length > 0
      - _odoo_restore_database_backend.port | default(0) | int > 0
      - _odoo_restore_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _odoo_restore_database_user | length > 0
      - _odoo_restore_database_password | length > 0
      - _odoo_restore_filestore_path is match('^/[^/].*')
      - _odoo_restore_filestore_path != '/'
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Odoo restore needs a target, named PostgreSQL backend, target database credential,
      non-root filestore path, and a snapshot when overwrite=true.
  no_log: true

- name: Odoo restore | Require a separate target database for a new destination
  ansible.builtin.assert:
    that:
      - restore_source_database is mapping
      - restore_source_database.instance | default('') | length > 0
      - restore_source_database.name | default('') | length > 0
      - _odoo_restore_source_backend.host | default('') | length > 0
      - _odoo_restore_source_backend.port | default(0) | int > 0
      - >-
        not (
          restore_source_database.name == _odoo_restore_database_name
          and _odoo_restore_source_backend.host == _odoo_restore_database_backend.host
          and (_odoo_restore_source_backend.port | int) == (_odoo_restore_database_backend.port | int)
        )
    fail_msg: >-
      A new Odoo restore must use a target database name or PostgreSQL backend distinct from
      the source. Never let an isolated instance overwrite the source's named database.
  when: restore_destination == 'new'
  no_log: true

- name: Odoo restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Odoo restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Odoo. Deploy PBS before listing or restoring the
      paired database and filestore artifact.

- name: Odoo restore | List available snapshots
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - BACKUP_ID
      - --env
      - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
      - --env
      - >-
        PBS_APT_REPO={{ app_config.backup.client.repository }}
        {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _odoo_restore_backup_id }}"
  register: _odoo_restore_snapshots
  changed_when: false
  no_log: true
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)

- name: Odoo restore | Print available snapshots
  ansible.builtin.debug:
    msg: "PBS snapshots for host/{{ _odoo_restore_backup_id }}:\n{{ _odoo_restore_snapshots.stdout }}"
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)

- name: Odoo restore | Explain the read-only plan
  ansible.builtin.debug:
    msg:
      - "PLAN ONLY — nothing was changed."
      - >-
        A selected Odoo snapshot contains database.pxar (named PostgreSQL database
        {{ _odoo_restore_database_name }}) and filestore.pxar
        ({{ _odoo_restore_filestore_path }}).
      - "Re-run with recovery_point=<snapshot> and overwrite=true only after verifying the target."
  when: not (restore_overwrite | bool)

- name: Odoo restore | Allocate private staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: odoo-restore-
  register: _odoo_restore_scratch
  changed_when: true
  when: restore_overwrite | bool

- name: Odoo restore | Fetch and validate the paired artifact
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --volume
      - "{{ _odoo_restore_scratch.path }}:/restore"
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - SNAPSHOT
      - --env
      - PBS_KEY_URL
      - --env
      - PBS_APT_REPO
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings /restore/database /restore/filestore
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client restore "$SNAPSHOT" database.pxar /restore/database
        proxmox-backup-client restore "$SNAPSHOT" filestore.pxar /restore/filestore
        test -s /restore/database/odoo.dump
        test -d /restore/filestore
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    SNAPSHOT: "{{ restore_snapshot }}"
    PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
    PBS_APT_REPO: >-
      {{ app_config.backup.client.repository }}
      {{ app_config.backup.client.suite }}
      {{ app_config.backup.client.component }}
  no_log: true
  changed_when: true
  when: restore_overwrite | bool

- name: Odoo restore | Replace the target database and filestore
  when: restore_overwrite | bool
  block:
    - name: Odoo restore | Stop only the target Odoo service
      community.docker.docker_compose_v2:
        project_src: "{{ odoo_project_dir }}"
        state: stopped
        services: [odoo]

    - name: Odoo restore | Remove the target data_dir
      ansible.builtin.file:
        path: "{{ _odoo_restore_filestore_path }}"
        state: absent

    - name: Odoo restore | Recreate the target data_dir
      ansible.builtin.file:
        path: "{{ _odoo_restore_filestore_path }}"
        state: directory
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
        mode: "0750"

    - name: Odoo restore | Restore the filestore tree
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ _odoo_restore_scratch.path }}/filestore/."
          - "{{ _odoo_restore_filestore_path }}/"
      changed_when: true
      no_log: true

    - name: Odoo restore | Restore the named PostgreSQL database
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _odoo_restore_scratch.path }}/database:/restore:ro"
          - --env
          - DB_HOST
          - --env
          - DB_PORT
          - --env
          - DB_NAME
          - --env
          - DB_USER
          - --env
          - DB_PASSWORD
          - "{{ app_config.backup.postgres_client_image }}"
          - /bin/sh
          - -ceu
          - >-
            PGPASSWORD="$DB_PASSWORD" pg_restore --clean --if-exists --no-owner --no-acl
            --exit-on-error --host="$DB_HOST" --port="$DB_PORT" --username="$DB_USER"
            --dbname="$DB_NAME" /restore/odoo.dump
      environment:
        DB_HOST: "{{ _odoo_restore_database_backend.host }}"
        DB_PORT: "{{ _odoo_restore_database_backend.port }}"
        DB_NAME: "{{ _odoo_restore_database_name }}"
        DB_USER: "{{ _odoo_restore_database_user }}"
        DB_PASSWORD: "{{ _odoo_restore_database_password }}"
      no_log: true
      changed_when: true

    - name: Odoo restore | Start only the target Odoo service
      community.docker.docker_compose_v2:
        project_src: "{{ odoo_project_dir }}"
        state: present
        services: [odoo]

    - name: Odoo restore | Wait for the restored Odoo health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/web/health"
        status_code: 200
      register: _odoo_restore_health
      until: _odoo_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Odoo restore | Mark the paired recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Odoo restore | Leave the target Odoo service stopped after failure
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ odoo_project_dir }}"
          - stop
          - odoo
      changed_when: false
      failed_when: false

    - name: Odoo restore | Report the failed restore
      ansible.builtin.fail:
        msg: >-
          Odoo restore {{ restore_snapshot }} did not complete. The target service is
          intentionally left stopped because its database or filestore may be partially
          replaced. Inspect the target and retry from the retained recovery point.
  always:
    - name: Odoo restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _odoo_restore_scratch.path }}"
        state: absent
      when: _odoo_restore_scratch.path is defined
