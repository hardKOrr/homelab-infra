---
- name: Odoo | Create project directory
  ansible.builtin.file:
    path: "{{ odoo_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Odoo | Create writable filestore for the official image user
  ansible.builtin.file:
    path: "{{ app_config.app.filestore_path }}"
    state: directory
    owner: "{{ app_config.app.puid }}"
    group: "{{ app_config.app.pgid }}"
    mode: "0750"

- name: Odoo | Remove obsolete unused environment secret file
  ansible.builtin.file:
    path: "{{ odoo_project_dir }}/.env"
    state: absent

- name: Odoo | Render configuration
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ odoo_config_file }}"
    # The config contains database and master-password secrets. The official image runs
    # as the configured Odoo UID, so that account must own the private, read-only file.
    owner: "{{ app_config.app.puid }}"
    group: "{{ app_config.app.pgid }}"
    mode: "0400"
  no_log: true
  notify: Restart odoo

- name: Odoo | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ odoo_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart odoo

- name: Odoo | Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ odoo_project_dir }}"

- name: Odoo | Start service
  community.docker.docker_compose_v2:
    project_src: "{{ odoo_project_dir }}"
    state: present
    remove_orphans: true

- name: Odoo | Read completed module set
  ansible.builtin.slurp:
    src: "{{ odoo_project_dir }}/.crm-modules"
  register: _odoo_modules_current
  failed_when: false
  changed_when: false

# A prior Docker deployment can leave its marker behind while another hosting method
# removes the registered database. Check the database before trusting that marker.
- name: Odoo | Read database module readiness
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ odoo_project_dir }}"
      - exec
      - -T
      - odoo
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/database-module-readiness.py') }}"
      - "{{ app_config.app.database.name }}"
      - "{{ _odoo_modules }}"
  register: _odoo_database_modules
  changed_when: false
  no_log: true

- name: Odoo | Initialize or extend the CRM module set
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ odoo_project_dir }}"
      - run
      - --rm
      - odoo
      - odoo
      - --config=/etc/odoo/odoo.conf
      - "--database={{ app_config.app.database.name }}"
      - "--init={{ _odoo_modules }}"
      - --without-demo=all
      - --stop-after-init
  when: >-
    _odoo_database_modules.stdout | trim != 'ready'
    or _odoo_modules_current.content is not defined
    or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules
  no_log: true

- name: Odoo | Record completed module set
  ansible.builtin.copy:
    dest: "{{ odoo_project_dir }}/.crm-modules"
    content: "{{ _odoo_modules }}\n"
    owner: root
    group: root
    mode: "0600"
  when: _odoo_modules_current.content is not defined or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules

- name: Odoo | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Odoo | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/web/health"
    status_code: 200
  register: _odoo_health
  until: _odoo_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false
