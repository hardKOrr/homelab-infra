---
- name: Odoo | Remove obsolete unused environment secret file
  ansible.builtin.file:
    path: "{{ odoo_project_dir }}/.env"
    state: absent

# The shared Compose deploy renders odoo.conf (a single-file bind mount Compose cannot see
# change) with the project and recreates the container when either changed, in the same up
# that creates it. The config holds database and master-password secrets; the official
# image runs as the configured Odoo UID, so that account owns the private, read-only file.
- name: Odoo | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ odoo_project_dir }}"
    compose_dirs:
      - path: "{{ app_config.app.filestore_path }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
    compose_files:
      - src: odoo.conf.j2
        dest: "{{ odoo_config_file }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
        mode: "0400"
    compose_secrets: >-
      {{ [app_config.app.database_password | default(''), _odoo_admin_password | default(''),
          (wiring_mail | default({})).password | default('')] | select | list }}

- name: Odoo | Read completed module set
  ansible.builtin.slurp:
    src: "{{ odoo_project_dir }}/.crm-modules"
  register: _odoo_modules_current
  failed_when: false
  changed_when: false

# A prior Docker deployment can leave its marker behind while another hosting method
# removes the registered database. Check the database before trusting that marker.
- name: Odoo | Read database module readiness
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ odoo_project_dir }}"
      - exec
      - -T
      - odoo
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/database-module-readiness.py') }}"
      - "{{ app_config.app.database.name }}"
      - "{{ _odoo_modules }}"
  register: _odoo_database_modules
  changed_when: false
  no_log: true

- name: Odoo | Initialize or extend the CRM module set
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ odoo_project_dir }}"
      - run
      - --rm
      - odoo
      - odoo
      - --config=/etc/odoo/odoo.conf
      - "--database={{ app_config.app.database.name }}"
      - "--init={{ _odoo_modules }}"
      - --without-demo=all
      - --stop-after-init
  when: >-
    _odoo_database_modules.stdout | trim != 'ready'
    or _odoo_modules_current.content is not defined
    or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules
  no_log: true

- name: Odoo | Record completed module set
  ansible.builtin.copy:
    dest: "{{ odoo_project_dir }}/.crm-modules"
    content: "{{ _odoo_modules }}\n"
    owner: root
    group: root
    mode: "0600"
  when: _odoo_modules_current.content is not defined or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules

- name: Odoo | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/web/health"
    status_code: 200
  register: _odoo_health
  until: _odoo_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Odoo | Give the admin user the recorded admin_password
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ instance }}-odoo"
      - odoo
      - shell
      - --config=/etc/odoo/odoo.conf
      - "--database={{ app_config.app.database.name }}"
      - --no-http
      - --log-level=warn
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/admin-login.py') }}"
  register: _odoo_admin_login
  changed_when: _odoo_admin_login.stdout_lines[-1:] == ['changed']
  failed_when: _odoo_admin_login.rc != 0 or _odoo_admin_login.stdout_lines[-1:] not in [['changed'], ['kept']]
