---
# Odoo natively on an LXC or a VM: the `odoo` package from Odoo's nightly Debian repository
# for 18.0 (https://www.odoo.com/documentation/18.0/administration/on_premise/packages.html),
# under the unit it ships. The named PostgreSQL backend stays outside the guest. data_dir is
# the filestore's parent so a recovery point moves between hosting methods.
- name: Odoo native | Assert the supported guest
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - app_config.app.filestore_path | basename == 'filestore'
    fail_msg: >-
      Native Odoo supports Debian-family guests, and app.filestore_path must end in
      /filestore (its parent becomes Odoo's data_dir).

- name: Odoo native | Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: Odoo native | Install the repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Odoo native | Create the keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Odoo native | Fetch the repository signing key
  ansible.builtin.get_url:
    url: "{{ app_config.app.native_repository_key_url }}"
    dest: /etc/apt/keyrings/odoo.asc
    owner: root
    group: root
    mode: "0644"
  register: _odoo_native_key

- name: Odoo native | Add the pinned 18.0 nightly repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/odoo.list
    content: "deb [signed-by=/etc/apt/keyrings/odoo.asc] {{ app_config.app.native_repository }} ./\n"
    owner: root
    group: root
    mode: "0644"
  register: _odoo_native_repository

- name: Odoo native | Install Odoo
  ansible.builtin.apt:
    name: odoo
    state: present
    install_recommends: false
    update_cache: "{{ _odoo_native_repository.changed or _odoo_native_key.changed }}"
    lock_timeout: 300
  notify: Restart odoo

- name: Odoo native | Create the data directory and filestore
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ odoo_native_user }}"
    group: "{{ odoo_native_user }}"
    mode: "0750"
  loop:
    - "{{ odoo_native_data_dir }}"
    - "{{ app_config.app.filestore_path }}"

- name: Odoo native | Render configuration
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ odoo_native_config }}"
    owner: "{{ odoo_native_user }}"
    group: "{{ odoo_native_user }}"
    mode: "0400"
  vars:
    odoo_data_dir: "{{ odoo_native_data_dir }}"
  no_log: true
  notify: Restart odoo

- name: Odoo native | Enable and start Odoo
  ansible.builtin.systemd:
    name: "{{ odoo_native_service }}"
    state: started
    enabled: true

- name: Odoo native | Read completed module set
  ansible.builtin.slurp:
    src: "{{ odoo_native_data_dir }}/.crm-modules"
  register: _odoo_modules_current
  failed_when: false
  changed_when: false

# A prior deployment can leave its marker behind while the database is gone; check the
# database before trusting the marker.
- name: Odoo native | Read database module readiness
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/database-module-readiness.py') }}"
      - "{{ app_config.app.database.name }}"
      - "{{ _odoo_modules }}"
  register: _odoo_database_modules
  changed_when: false
  no_log: true

- name: Odoo native | Initialize or extend the CRM module set
  ansible.builtin.command:
    argv:
      - /usr/bin/odoo
      - "--config={{ odoo_native_config }}"
      - "--database={{ app_config.app.database.name }}"
      - "--init={{ _odoo_modules }}"
      - --without-demo=all
      - --stop-after-init
  become_user: "{{ odoo_native_user }}"
  when: >-
    _odoo_database_modules.stdout | trim != 'ready'
    or _odoo_modules_current.content is not defined
    or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules
  no_log: true

- name: Odoo native | Record completed module set
  ansible.builtin.copy:
    dest: "{{ odoo_native_data_dir }}/.crm-modules"
    content: "{{ _odoo_modules }}\n"
    owner: root
    group: root
    mode: "0600"
  when: _odoo_modules_current.content is not defined or (_odoo_modules_current.content | b64decode | trim) != _odoo_modules

- name: Odoo native | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Odoo native | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/web/health"
    status_code: 200
  register: _odoo_health
  until: _odoo_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Odoo native | Install lab maintenance scripts
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart {{ odoo_native_service }}
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        exec journalctl -u {{ odoo_native_service }} -n "${1:-50}" --no-pager
  loop_control:
    label: "{{ item.name }}"
