---
# The native service's restart (tasks/native.yml). On Docker, tasks/stack/compose-deploy.yml
# recreates the project itself when the Compose or environment file changes.
- name: Restart Open WebUI
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ open_webui_native_service }}"]
  when: open_webui_native | bool
