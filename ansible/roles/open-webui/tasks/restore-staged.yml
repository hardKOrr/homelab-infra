---
# restore-swap.yml staged hook: the pinned Open WebUI image's own Python checks the
# database it will open, while the live instance still serves.
- name: Open WebUI restore | Check the staged webui.db
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --volume
      - "{{ recovery_swap_stage }}/data:/source:ro"
      - --entrypoint
      - python3
      - "{{ app_config.app.image }}"
      - -c
      - |
        import os, sqlite3, sys
        if not os.path.getsize("/source/webui.db"):
            sys.exit("webui.db is empty")
        result = sqlite3.connect("file:/source/webui.db?mode=ro", uri=True).execute("PRAGMA integrity_check").fetchone()[0]
        sys.exit(0 if result == "ok" else "webui.db failed its SQLite integrity check: " + result)
  changed_when: false
