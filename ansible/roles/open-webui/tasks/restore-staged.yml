---
# restore-swap.yml staged hook: the pinned Open WebUI's own Python (its image, or the
# native virtualenv) checks the database it will open, while the live instance still serves.
- name: Open WebUI restore | Check the staged webui.db in the pinned image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --volume
      - "{{ recovery_swap_stage }}/data:/source:ro"
      - --entrypoint
      - python3
      - "{{ app_config.app.image }}"
      - -c
      - "{{ open_webui_staged_check }}"
      - /source
  changed_when: false
  when: not (open_webui_native | bool)

- name: Open WebUI restore | Check the staged webui.db in the virtualenv
  ansible.builtin.command:
    argv:
      - "{{ open_webui_native_venv }}/bin/python"
      - -c
      - "{{ open_webui_staged_check }}"
      - "{{ recovery_swap_stage }}/data"
  changed_when: false
  when: open_webui_native | bool
