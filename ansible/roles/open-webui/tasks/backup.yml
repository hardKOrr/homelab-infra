---
# Open WebUI's database, users, chats, documents, uploads and cache all live below its
# application data directory. Stop only this Compose service before archiving it so a
# recovery point never pairs a live SQLite database with a partially copied data tree.

- name: Open WebUI backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Open WebUI needs its declared application-consistent backup contract and a configured
      PBS before an on-demand backup can run.

- name: Open WebUI backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Open WebUI backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Open WebUI. Deploy PBS and re-run this backup; no local
      archive is treated as a recovery point.

- name: Open WebUI backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _open_webui_backup_data
  changed_when: false

- name: Open WebUI backup | Require the application data directory
  ansible.builtin.assert:
    that:
      - _open_webui_backup_data.stat.exists
      - _open_webui_backup_data.stat.isdir
    fail_msg: >-
      Open WebUI data path {{ app_config.app.data_path }} is missing; refusing to create a
      backup that would omit the application's persistent state.

- name: Open WebUI backup | Stop only Open WebUI
  community.docker.docker_compose_v2:
    project_src: "{{ open_webui_project_dir }}"
    state: stopped
    services:
      - "{{ app_config.app.service_name }}"

- name: Open WebUI backup | Archive the quiesced data directory to PBS
  block:
    - name: Open WebUI backup | Push one application archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ app_config.app.data_path }}:/source:ro"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - BACKUP_ID
          - --env
          - RETENTION_DAYS
          - --env
          - PBS_KEY_URL
          - --env
          - PBS_APT_REPO
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/proxmox-backup-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client backup data.pxar:/source --backup-id "$BACKUP_ID"
            proxmox-backup-client prune "host/$BACKUP_ID" --keep-daily "$RETENTION_DAYS"
            echo "backup complete: host/$BACKUP_ID"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        BACKUP_ID: "{{ app_config.backup.backup_id | default('', true) or instance }}"
        RETENTION_DAYS: "{{ app_config.backup.retention_days | default(14) | int }}"
        PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
        PBS_APT_REPO: "{{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      no_log: true
      changed_when: true

    - name: Open WebUI backup | Mark the application backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    # A failed PBS upload must not leave the application down. The failure still
    # propagates, while this service restart is limited to Open WebUI itself.
    - name: Open WebUI backup | Start only Open WebUI after the attempt
      community.docker.docker_compose_v2:
        project_src: "{{ open_webui_project_dir }}"
        state: present
        services:
          - "{{ app_config.app.service_name }}"
