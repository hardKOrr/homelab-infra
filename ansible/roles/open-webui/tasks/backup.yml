---
# Manual Backup App and the installed recurring cron entry call the same helper, so they
# share the Open WebUI quiesce/SQLite/PBS contract and artifact identity.

- name: Open WebUI backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Open WebUI needs its declared application-consistent backup contract and a configured
      PBS before an on-demand backup can run.

- name: Open WebUI backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Open WebUI backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Open WebUI. Deploy PBS and re-run this backup; no local
      archive is treated as a recovery point.

- name: Open WebUI backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _open_webui_backup_data
  changed_when: false

- name: Open WebUI backup | Require the application data directory
  ansible.builtin.assert:
    that:
      - _open_webui_backup_data.stat.exists
      - _open_webui_backup_data.stat.isdir
      - not _open_webui_backup_data.stat.islnk | default(false)
    fail_msg: >-
      Open WebUI data path {{ app_config.app.data_path }} is missing or not a real directory;
      refusing to create a recovery point that omits application state.

- name: Open WebUI backup | Require the deployed shared recovery helper
  ansible.builtin.stat:
    path: "{{ open_webui_recovery_script }}"
  register: _open_webui_backup_helper
  changed_when: false

- name: Open WebUI backup | Require the deployed root-only recovery configuration
  ansible.builtin.stat:
    path: "{{ open_webui_recovery_config }}"
  register: _open_webui_backup_config
  changed_when: false

- name: Open WebUI backup | Require a configured schedule helper
  ansible.builtin.assert:
    that:
      - _open_webui_backup_helper.stat.exists
      - _open_webui_backup_helper.stat.executable
      - _open_webui_backup_config.stat.exists
      - _open_webui_backup_config.stat.mode == '0600'
    fail_msg: >-
      Open WebUI's recurring recovery helper/config is missing. Re-run Deploy Open WebUI
      with backup enabled and an available PBS before requesting Backup App.

- name: Open WebUI backup | Capture the application-consistent data point
  ansible.builtin.command:
    argv:
      - "{{ open_webui_recovery_script }}"
      - --backup
  environment:
    OPEN_WEBUI_INSTANCE: "{{ instance }}"
  register: _open_webui_backup_run
  changed_when: true

- name: Open WebUI backup | Mark the application backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
