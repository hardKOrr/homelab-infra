---
# Shared recovery Job hook: the restored database was written under the source key. Carry
# that canonical key to the target and refresh its dedicated Kubernetes Secret while the
# Deployment is still stopped.

- name: Open WebUI Kubernetes restore | Carry the source key into the target Vaultwarden item
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ restore_target }}"
    vault_item_merge: true
    vault_item_fields:
      provider: open-webui
      instance: "{{ restore_target }}"
      secret_key: "{{ restore_source_open_webui_secret_key }}"
    vault_item_secret_fields: [secret_key]
  no_log: true

- name: Open WebUI Kubernetes restore | Sync the carried key into the target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    instance: "{{ restore_target }}"
    k8s_secret_name: "{{ restore_target }}-key"
    k8s_secret_data:
      WEBUI_SECRET_KEY: "{{ restore_source_open_webui_secret_key }}"
  no_log: true
