- name: Open WebUI restore | Restore Kubernetes data through the shared recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method | default('docker') == 'kubernetes'

- name: Open WebUI restore | Restore Docker data through the shared swap
  ansible.builtin.include_tasks: restore-docker.yml
  when: app_config.hosting.method | default('docker') == 'docker'
