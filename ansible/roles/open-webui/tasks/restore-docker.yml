---
# Restore one Open WebUI data.pxar point through the shared swap. The restored webui.db
# needs the source's application key, so the replaced hook gives it to the target; a
# failure after the stop puts the original data and key back and starts Open WebUI. The
# guest's backup timer takes the same lock, so a backup never archives a half-swapped tree.

- name: Open WebUI restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Open WebUI restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Open WebUI restore | Resolve source and target backup groups and keys
  ansible.builtin.set_fact:
    _open_webui_restore_target: "{{ restore_target | default(instance, true) }}"
    _open_webui_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _open_webui_target_backup_id: >-
      {{ restore_target_backup_id | default(
           app_config.backup.backup_id | default('', true) or
           (restore_target | default(instance, true)), true) }}
    _open_webui_restore_target_secret_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target | default(instance, true), {}).secret_key
         | default('', true) }}
  no_log: true

- name: Open WebUI restore | Validate backup group identifiers
  ansible.builtin.assert:
    that:
      - _open_webui_restore_backup_id is match('^[A-Za-z0-9_.-]+$')
      - _open_webui_target_backup_id is match('^[A-Za-z0-9_.-]+$')
    fail_msg: Open WebUI recovery requires safe source and target PBS backup IDs.
  no_log: true

- name: Open WebUI restore | Require the source and target application keys
  ansible.builtin.assert:
    that:
      - restore_source_open_webui_secret_key | default('') | length > 0
      - _open_webui_restore_target_secret_key | length > 0
    fail_msg: >-
      The source or target Open WebUI application key is missing or unreadable in
      Vaultwarden. Restore that canonical key before retrying; no target data was replaced.
  no_log: true
  when: restore_overwrite | bool

- name: Open WebUI restore | Require the target environment file
  ansible.builtin.stat:
    path: "{{ open_webui_env_file }}"
  register: _open_webui_restore_env
  changed_when: false
  when: restore_overwrite | bool

- name: Open WebUI restore | Require the target environment file to be readable
  ansible.builtin.assert:
    that:
      - _open_webui_restore_env.stat.exists
      - _open_webui_restore_env.stat.isreg
      - _open_webui_restore_env.stat.readable
    fail_msg: >-
      The Open WebUI target environment file is missing or unreadable. Rebuild the isolated
      target configuration before attempting recovery.
  when: restore_overwrite | bool

- name: Open WebUI restore | Validate selected A and independent B identities
  ansible.builtin.assert:
    that:
      - restore_snapshot is match('^host/' ~ (_open_webui_restore_backup_id | regex_escape) ~ '/.+$')
      - >-
        restore_destination | default('existing') != 'existing'
        or
        (restore_pre_restore_point | default('') is match(
          '^host/' ~ (_open_webui_target_backup_id | regex_escape) ~ '/.+$')
         and restore_pre_restore_point != restore_snapshot)
    fail_msg: >-
      The selected A point must belong to the source backup group; an existing target also
      requires a different, exact-target B point from its own backup group. No target data
      was replaced.
  no_log: true
  when: restore_overwrite | bool

- name: Open WebUI restore | Ensure the lock directory exists
  ansible.builtin.file:
    path: /run/lock
    state: directory
    mode: "0755"
  when: restore_overwrite | bool

- name: Open WebUI restore | Acquire the shared backup/restore lock
  ansible.builtin.command:
    argv:
      - mkdir
      - -m
      - "0700"
      - "/run/lock/homelab-infra-open-webui-{{ _open_webui_restore_target }}.lock"
  register: _open_webui_restore_lock
  changed_when: _open_webui_restore_lock.rc == 0
  when: restore_overwrite | bool

- name: Open WebUI restore | Preview or replace the data directory under the lock
  block:
    - name: Open WebUI restore | Preview or replace the data directory
      ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
      vars:
        recovery_swap_runtime: docker
        recovery_swap_backup_id: "{{ _open_webui_restore_backup_id }}"
        recovery_swap_pre_restore_backup_id: "{{ _open_webui_target_backup_id }}"
        recovery_swap_archives: [data.pxar]
        recovery_swap_paths:
          - path: "{{ app_config.app.data_path }}"
            owner: root
            group: root
            mode: "0750"
        recovery_swap_stop_services: ["{{ app_config.app.service_name }}"]
        recovery_swap_compose_project: "{{ open_webui_project_dir }}"
        recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
        recovery_swap_replaced_hook: "{{ role_path }}/tasks/restore-replaced.yml"
        recovery_swap_rollback_hook: "{{ role_path }}/tasks/restore-rollback.yml"
        recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/health"
  always:
    - name: Open WebUI restore | Release the shared backup/restore lock
      ansible.builtin.file:
        path: "/run/lock/homelab-infra-open-webui-{{ _open_webui_restore_target }}.lock"
        state: absent
      when: _open_webui_restore_lock is changed
