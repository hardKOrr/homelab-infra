---
# Restore App hook, run on localhost before the target identity checks. Open WebUI
# encrypts application-owned credential state with its generated key. Carry the source key
# through the protected Ansible variable path; restore.yml upserts it into the target
# Vaultwarden item and rendered env before starting the restore.
- name: Resolve the source Open WebUI application key without exposing it
  ansible.builtin.set_fact:
    restore_source_open_webui_secret_key: "{{ app_config.app.secret_key | default('') }}"
  no_log: true
