---
# Actual's own reset utility needs a terminal. For a normal Deploy, exec it in the ready
# workload pod only when the persistent marker does not match the canonical password. A
# restore hook uses a short-lived pod with the same PVC because the shared recovery Job
# keeps the application Deployment stopped until the hook finishes.
- name: Actual Budget Kubernetes password | Resolve target and fingerprint
  ansible.builtin.set_fact:
    actual_budget_reset_instance: "{{ actual_budget_reset_instance | default(instance) }}"
    actual_budget_reset_image: "{{ actual_budget_reset_image | default(app_config.app.image) }}"
    _actual_budget_reset_fingerprint: "{{ actual_budget_reset_password | hash('sha256') }}"
    _actual_budget_reset_temporary_pod: "{{ actual_budget_reset_use_temporary_pod | default(false) | bool }}"
  no_log: true

- name: Actual Budget Kubernetes password | Check that a password was provided
  ansible.builtin.assert:
    that:
      - actual_budget_reset_password is defined
      - actual_budget_reset_password | string | length > 0
      - k8s_namespace is defined
      - k8s_api_host is defined
    fail_msg: Actual Budget Kubernetes password setup needs its canonical password and namespace.
  no_log: true

- name: Actual Budget Kubernetes password | Find the running workload pod
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - get
      - pods
      - --selector=app.kubernetes.io/instance={{ actual_budget_reset_instance }},app.kubernetes.io/component=web
      - -o
      - jsonpath={.items[0].metadata.name}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _actual_budget_reset_live_pod
  changed_when: false
  failed_when: false
  when: not _actual_budget_reset_temporary_pod

- name: Actual Budget Kubernetes password | Require the running pod
  ansible.builtin.assert:
    that:
      - _actual_budget_reset_live_pod.rc == 0
      - _actual_budget_reset_live_pod.stdout | trim | length > 0
    fail_msg: >-
      Actual Budget's Kubernetes password cannot be checked because the workload pod was
      not found in {{ k8s_namespace }}.
  when: not _actual_budget_reset_temporary_pod

- name: Actual Budget Kubernetes password | Read the initialized marker
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace
      - "{{ k8s_namespace }}"
      - exec
      - "{{ _actual_budget_reset_live_pod.stdout }}"
      - --container
      - actual-budget
      - --
      - cat
      - /data/.homelab-infra-password-initialized
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _actual_budget_reset_marker
  changed_when: false
  failed_when: false
  no_log: true
  when: not _actual_budget_reset_temporary_pod

- name: Actual Budget Kubernetes password | Decide whether reset is needed
  ansible.builtin.set_fact:
    _actual_budget_reset_needed: >-
      {{ _actual_budget_reset_temporary_pod
         or (actual_budget_reset_force | default(false) | bool)
         or (_actual_budget_reset_marker.rc | default(1) | int != 0)
         or (_actual_budget_reset_marker.stdout | default('') | trim
             != _actual_budget_reset_fingerprint) }}
  no_log: true

- name: Actual Budget Kubernetes password | Reset through the upstream utility
  when: _actual_budget_reset_needed | bool
  block:
    - name: Actual Budget Kubernetes password | Remove a leftover reset pod
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - pod
          - "{{ actual_budget_reset_instance }}-password-reset"
          - --ignore-not-found=true
          - --wait=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _actual_budget_reset_stale_pod
      changed_when: "'deleted' in (_actual_budget_reset_stale_pod.stdout | default(''))"
      when: _actual_budget_reset_temporary_pod

    - name: Actual Budget Kubernetes password | Render the temporary reset pod
      ansible.builtin.set_fact:
        _actual_budget_reset_pod_manifest: >-
          {{ lookup('ansible.builtin.template',
                    role_path ~ '/templates/kubernetes/password-reset-pod.yaml.j2') }}
      when: _actual_budget_reset_temporary_pod

    - name: Actual Budget Kubernetes password | Apply the temporary reset pod
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/apply-manifest.yml
      vars:
        k8s_manifest: "{{ _actual_budget_reset_pod_manifest }}"
      when: _actual_budget_reset_temporary_pod

    - name: Actual Budget Kubernetes password | Wait for the temporary pod
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - wait
          - --for=condition=Ready
          - "pod/{{ actual_budget_reset_instance }}-password-reset"
          - --timeout=300s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false
      when: _actual_budget_reset_temporary_pod

    - name: Actual Budget Kubernetes password | Select the reset pod
      ansible.builtin.set_fact:
        _actual_budget_reset_pod: >-
          {{ actual_budget_reset_instance ~ '-password-reset'
             if _actual_budget_reset_temporary_pod
             else _actual_budget_reset_live_pod.stdout | trim }}

    - name: Actual Budget Kubernetes password | Install the terminal helper on the cluster node
      ansible.builtin.copy:
        src: "{{ role_path }}/../../files/actual-budget-reset-password.py"
        dest: "/tmp/actual-budget-reset-{{ actual_budget_reset_instance }}.py"
        owner: root
        group: root
        mode: "0700"
      delegate_to: "{{ k8s_api_host }}"
      become: true

    - name: Actual Budget Kubernetes password | Reset the password with the official script
      ansible.builtin.command:
        argv:
          - python3
          - "/tmp/actual-budget-reset-{{ actual_budget_reset_instance }}.py"
          - kubernetes
          - "{{ k8s_namespace }}"
          - "{{ _actual_budget_reset_pod }}"
          - actual-budget
        stdin: "{{ actual_budget_reset_password }}"
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true
      no_log: true

    - name: Actual Budget Kubernetes password | Save the canonical password fingerprint
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - exec
          - "{{ _actual_budget_reset_pod }}"
          - --container
          - actual-budget
          - --stdin
          - --
          - sh
          - -c
          - "umask 077; cat > /data/.homelab-infra-password-initialized"
        stdin: "{{ _actual_budget_reset_fingerprint }}"
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true
      no_log: true

    - name: Actual Budget Kubernetes password | Verify the saved fingerprint
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - exec
          - "{{ _actual_budget_reset_pod }}"
          - --container
          - actual-budget
          - --
          - cat
          - /data/.homelab-infra-password-initialized
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _actual_budget_reset_verified_marker
      changed_when: false
      no_log: true

    - name: Actual Budget Kubernetes password | Require the expected fingerprint
      ansible.builtin.assert:
        that:
          - _actual_budget_reset_verified_marker.rc == 0
          - _actual_budget_reset_verified_marker.stdout | trim == _actual_budget_reset_fingerprint
        fail_msg: Actual Budget's canonical password fingerprint was not saved on its data volume.
      no_log: true

  always:
    - name: Actual Budget Kubernetes password | Remove the temporary reset pod
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - pod
          - "{{ actual_budget_reset_instance }}-password-reset"
          - --ignore-not-found=true
          - --wait=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      register: _actual_budget_reset_removed_pod
      changed_when: "'deleted' in (_actual_budget_reset_removed_pod.stdout | default(''))"
      failed_when: false
      when: _actual_budget_reset_temporary_pod

    - name: Actual Budget Kubernetes password | Remove the terminal helper from the cluster node
      ansible.builtin.file:
        path: "/tmp/actual-budget-reset-{{ actual_budget_reset_instance }}.py"
        state: absent
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false
