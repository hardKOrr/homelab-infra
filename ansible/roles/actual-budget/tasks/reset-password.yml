---
- name: Actual Budget | Install the native password terminal helper
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/actual-budget-reset-password.py"
    dest: "{{ actual_budget_project_dir }}/reset-password.py"
    owner: root
    group: root
    mode: "0700"

- name: Actual Budget | Set the password through the native utility
  ansible.builtin.command:
    argv:
      - python3
      - "{{ actual_budget_project_dir }}/reset-password.py"
      - "{{ actual_budget_project_dir }}"
      - "{{ app_config.app.service_name }}"
    stdin: "{{ actual_budget_reset_password }}"
  no_log: true
  changed_when: true
