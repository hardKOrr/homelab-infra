---
# Application-consistent backup for Actual Budget.
#
# The official image keeps account.sqlite (including the hashed server password and
# session state), config.json, server-files, and user-files below /data. Stopping only this
# Compose service quiesces all of that state while the PBS client archives it. The archive
# is one data.pxar in host/<instance>, so a restore cannot accidentally pair a password
# database from one point with budget blobs from another.

- name: Actual Budget backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Actual Budget needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Actual Budget backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _actual_budget_backup_data
  changed_when: false

- name: Actual Budget backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _actual_budget_backup_data.stat.exists
      - _actual_budget_backup_data.stat.isdir
    fail_msg: >-
      Actual Budget data path {{ app_config.app.data_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Actual Budget backup | Quiesce Actual Budget and archive its data to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ actual_budget_project_dir }}"
    pbs_client_stop_services: ["{{ app_config.app.service_name }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.data_path }}"

- name: Actual Budget backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
