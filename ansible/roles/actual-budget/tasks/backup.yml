---
# Application-consistent backup for Actual Budget.
#
# The official image keeps account.sqlite (including the hashed server password and
# session state), config.json, server-files, and user-files below /data. Stopping only this
# Compose service quiesces all of that state while the PBS client archives it. The archive
# is one data.pxar in host/<instance>, so a restore cannot accidentally pair a password
# database from one point with budget blobs from another.

- name: Actual Budget backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Actual Budget needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Actual Budget backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Actual Budget backup | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Actual Budget. Deploy PBS and re-run this backup;
      no local archive is treated as a recovery point.

- name: Actual Budget backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _actual_budget_backup_data
  changed_when: false

- name: Actual Budget backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _actual_budget_backup_data.stat.exists
      - _actual_budget_backup_data.stat.isdir
    fail_msg: >-
      Actual Budget data path {{ app_config.app.data_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Actual Budget backup | Stop only Actual Budget
  community.docker.docker_compose_v2:
    project_src: "{{ actual_budget_project_dir }}"
    state: stopped
    services:
      - "{{ app_config.app.service_name }}"

- name: Actual Budget backup | Archive the quiesced data directory to PBS
  block:
    - name: Actual Budget backup | Push one application archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ app_config.app.data_path }}:/source:ro"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - BACKUP_ID
          - --env
          - "RETENTION_DAYS={{ app_config.backup.retention_days | default(14) | int }}"
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client backup data.pxar:/source --backup-id "$BACKUP_ID"
            proxmox-backup-client prune "host/$BACKUP_ID" --keep-daily "$RETENTION_DAYS"
            echo "backup complete: host/$BACKUP_ID"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        BACKUP_ID: "{{ app_config.backup.backup_id | default('', true) or instance }}"
        RETENTION_DAYS: "{{ app_config.backup.retention_days | default(14) | int }}"
      no_log: true
      changed_when: true

    - name: Actual Budget backup | Mark the backup complete
      ansible.builtin.set_fact:
        _actual_budget_backup_complete: true
  always:
    # A failed PBS upload must not leave the application down. The backup task's failure
    # still propagates, while this service restart is limited to Actual Budget itself.
    - name: Actual Budget backup | Start only Actual Budget
      community.docker.docker_compose_v2:
        project_src: "{{ actual_budget_project_dir }}"
        state: present
        services:
          - "{{ app_config.app.service_name }}"
