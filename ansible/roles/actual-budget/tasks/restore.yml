---
- name: Actual Budget restore | Use the Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'kubernetes'

- name: Actual Budget restore | Use the Docker guest restore path
  ansible.builtin.include_tasks: restore-docker.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('docker')) == 'docker'
