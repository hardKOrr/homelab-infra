---
# recovery-restore.yml calls this while the target Deployment is stopped, after the
# application's /data archive has been restored and before the Deployment is started.
- name: Actual Budget Kubernetes restore | Reapply the target's canonical server password
  ansible.builtin.include_tasks: reset-password-kubernetes.yml
  vars:
    actual_budget_reset_instance: "{{ restore_target }}"
    actual_budget_reset_image: "{{ restore_target_config.app.image }}"
    actual_budget_reset_password: "{{ restore_target_config.app.server_password }}"
    actual_budget_reset_use_temporary_pod: true
    actual_budget_reset_force: true
  when: restore_target_config.app.server_password | default('') | length > 0
  no_log: true
