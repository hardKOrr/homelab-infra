---
- name: Restart Actual Budget
  community.docker.docker_compose_v2:
    project_src: "{{ actual_budget_project_dir }}"
    state: restarted
    services:
      - "{{ app_config.app.service_name }}"

- name: Restart native Actual Budget
  ansible.builtin.systemd:
    name: "{{ app_config.app.service_name }}"
    state: restarted
    daemon_reload: true
