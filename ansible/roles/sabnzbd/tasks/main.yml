---
# sabnzbd role — SABnzbd as a Docker container on a stack host. Called from Play 2
# of playbooks/apps/sabnzbd.yml. Target: the media host.
#
# The media stack's USENET download client, the counterpart to roles/qbittorrent.
# Until this existed the stack could find usenet releases through Prowlarr and had
# nothing to fetch them with: tasks/app-wiring/arr-download-client.yml has carried
# the `sabnzbd` kind since slice 504 and had no instance to wire.
#
# Variables available:
#   app_config           — merged defaults + user config (from Play 1)
#   instance             — the instance name (e.g. sabnzbd)
#   homelabinfra_config  — merged input config, including infrastructure.*
#   homelabinfra_infra   — infrastructure facts (may be absent pre-bootstrap)
#   homelabinfra_vault   — the in-memory Vaultwarden contract
#
# Exports (read by Play 3 to write the `media` registry key):
#   sabnzbd_media_kind, sabnzbd_media_host
#
# WHY THIS IS NOT THE servarr ROLE, and not roles/qbittorrent either. SABnzbd is
# not a Servarr app: no config.xml, no <APP>__ environment overrides, no
# /api/v3/system/status. It is not qBittorrent either: its API authenticates with
# an API key rather than a username and password over a session cookie, which is
# exactly what ansible/vars/media-wiring.yml records as `auth: api_key`. What the
# three share is the deploy shape, which belongs to the playbook, not the role.

# Kubernetes: the app runs in its own namespace (kubernetes.yml deploys the workload and the
# playbook's prepare play ran resolve-kubernetes-media.yml); the API key proof and the vault
# item are shared with Docker.
- name: Resolve the cluster the app deploys to
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml
  when: app_config.hosting.method == 'kubernetes'

- name: Resolve the app kind, storage and download directories
  ansible.builtin.import_tasks: main/resolve.yml

- name: Docker on the stack host
  when: app_config.hosting.method == 'docker'
  block:
    - name: Create directories and check the lab's storage
      ansible.builtin.import_tasks: main/storage.yml

    - name: Resolve the API key and start the app
      ansible.builtin.import_tasks: main/start.yml

- name: Kubernetes workload
  ansible.builtin.include_tasks: kubernetes.yml
  when: app_config.hosting.method == 'kubernetes'

- name: Prove the API key works and repair it if not
  ansible.builtin.import_tasks: main/verify.yml

# ── Store the credential ──────────────────────────────────────────────────────
# Written under the same canonical item name wire-media-stack.yml reads, and with
# the field name tasks/app-wiring/arr-download-client.yml expects for an `api_key`
# client (ansible/vars/media-wiring.yml, ansible/vars/CONTRACT.md §3). Stored after
# the app has proven the key works, never before.
- name: Store and verify the API key
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      api_key: "{{ _sab_effective_key }}"
    vault_item_secret_fields: [api_key]

# ── Hand the endpoint back to the playbook ────────────────────────────────────
- name: Export the media registry entry to the playbook
  when: app_config.hosting.method == 'docker'
  ansible.builtin.set_fact:
    sabnzbd_media_kind: "{{ _sab_kind }}"
    sabnzbd_media_host: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
