---
# restore-swap.yml verified hook: the restored server answers its queue API with the
# archived key, which then replaces the stored one.
- name: SABnzbd restore | Verify the authenticated queue API
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api?mode=queue&output=json&apikey={{ _sabnzbd_api_key | urlencode }}"
    return_content: true
    status_code: 200
  register: _sabnzbd_queue
  until: >-
    (_sabnzbd_queue.status | default(0) == 200)
    and (_sabnzbd_queue.json | default({})).queue is defined
  retries: 60
  delay: 5
  changed_when: false
  no_log: true

- name: SABnzbd restore | Store and verify the restored API key
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      api_key: "{{ _sabnzbd_api_key }}"
    vault_item_secret_fields: [api_key]
  no_log: true
