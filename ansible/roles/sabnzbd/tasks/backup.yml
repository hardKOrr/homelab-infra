---
# Quiesce SABnzbd so its history and settings share one recovery point.
# Logs and downloads never enter the application archive; media mounts stay outside it.

- name: SABnzbd backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      SABnzbd needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: SABnzbd backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _sabnzbd_backup_data
  changed_when: false

- name: SABnzbd backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _sabnzbd_backup_data.stat.exists
      - _sabnzbd_backup_data.stat.isdir
    fail_msg: >-
      SABnzbd data path {{ app_config.app.config_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: SABnzbd backup | Quiesce SABnzbd and archive its config to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ sabnzbd_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_backup_args: [--exclude, /logs, --exclude, /incomplete, --exclude, /complete, --exclude, /downloads]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: SABnzbd backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
