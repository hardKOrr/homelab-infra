---
# Phase of main.yml (Docker only): deploy the Compose project and wait for it. Imported in
# place; inputs are listed in main.yml.

# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot. Images are
# pulled only when missing; Watchtower moves them forward and reports it.
- name: Deploy the Compose project
  ansible.builtin.include_tasks: ../../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ sabnzbd_project_dir }}"

- name: Wait for the web interface to answer
  ansible.builtin.uri:
    url: "{{ _sab_base }}/api?mode=version&output=json"
    status_code: [200, 401, 403]
  register: _sab_up
  until: _sab_up.status | default(0) in [200, 401, 403]
  retries: "{{ sabnzbd_webui_retries }}"
  delay: "{{ sabnzbd_webui_delay }}"
  changed_when: false
