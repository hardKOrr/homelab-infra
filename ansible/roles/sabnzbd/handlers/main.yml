---
- name: Restart sabnzbd
  community.docker.docker_compose_v2:
    project_src: "{{ sabnzbd_project_dir }}"
    state: present
    recreate: always
  when: not (sabnzbd_native | bool)

- name: Restart native sabnzbd
  ansible.builtin.systemd:
    name: "{{ sabnzbd_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart sabnzbd
  when: sabnzbd_native | bool
