---
# Deploy hook (playbooks/apps/deploy.yml, localhost, provisioning). Docker Ollama without a
# stack runs on its own VM, with the dedicated GPU attached when it uses one; a stack or
# native instance takes deploy.yml's shared steps.
- name: Ollama | Provision its own VM
  ansible.builtin.include_tasks: ../../../tasks/proxmox/provision-app-vm.yml
  vars:
    app_vm_display: Ollama
    app_vm_network_app: ollama
    app_vm_gpu: "{{ app_config.app.gpu_device | default('', true) | trim | length > 0 }}"
  when: &own_vm
    - app_config.hosting.method == 'docker'
    - app_config.stack | default('', true) | length == 0

- name: Ollama | Skip deploy.yml's stack host
  ansible.builtin.set_fact:
    deploy_guest_provided: true
  when: *own_vm
