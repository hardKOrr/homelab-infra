---
# Restore one Ollama archive. Plan mode lists snapshots without changing the target;
# overwrite mode validates into private staging, replaces only this app's storage tree,
# and leaves the service stopped if anything after extraction fails.
- name: Ollama restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Ollama restore needs a PBS-backed application recovery contract. Keep overwrite=false
      to list snapshots before selecting one.

- name: Ollama restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Ollama restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Ollama. Deploy PBS before listing or restoring model
      storage and configuration.

- name: Ollama restore | Resolve the source backup identity
  ansible.builtin.set_fact:
    _ollama_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
  no_log: true

- name: Ollama restore | List available snapshots
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - BACKUP_ID
      - --env
      - PBS_KEY_URL
      - --env
      - PBS_APT_REPO
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/proxmox-backup-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  register: _ollama_restore_snapshots
  changed_when: false
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _ollama_restore_backup_id }}"
    PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
    PBS_APT_REPO: "{{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
  no_log: true
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)

- name: Ollama restore | Print available snapshots
  ansible.builtin.debug:
    msg: "PBS snapshots for host/{{ _ollama_restore_backup_id }}:\n{{ _ollama_restore_snapshots.stdout }}"
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)

- name: Ollama restore | Explain the read-only plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with recovery_point=<PBS snapshot ID> and overwrite=true
      to replace {{ app_config.app.storage_path }}, including models and user config.
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length > 0)

- name: Ollama restore | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-ollama-restore-"
  register: _ollama_restore_tmp
  changed_when: true
  when: restore_overwrite | bool

- name: Ollama restore | Replace application model/config state
  when: restore_overwrite | bool
  block:
    - name: Ollama restore | Stop Ollama
      community.docker.docker_compose_v2:
        project_src: "{{ ollama_project_dir }}"
        state: stopped
        services: [ollama]

    - name: Ollama restore | Extract and validate the selected archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _ollama_restore_tmp.path }}:/restore"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - SNAPSHOT
          - --env
          - PBS_KEY_URL
          - --env
          - PBS_APT_REPO
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/proxmox-backup-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client restore "$SNAPSHOT" data.pxar /restore
            test -n "$(find /restore -mindepth 1 -print -quit)"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        SNAPSHOT: "{{ restore_snapshot }}"
        PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
        PBS_APT_REPO: "{{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      no_log: true
      changed_when: true

    - name: Ollama restore | Replace storage after archive validation
      ansible.builtin.file:
        path: "{{ app_config.app.storage_path }}"
        state: absent

    - name: Ollama restore | Recreate the storage root
      ansible.builtin.file:
        path: "{{ app_config.app.storage_path }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Ollama restore | Copy archived models and configuration into place
      ansible.builtin.command:
        argv: [cp, -a, "{{ _ollama_restore_tmp.path }}/.", "{{ app_config.app.storage_path }}/"]
      changed_when: true
      no_log: true

    - name: Ollama restore | Start Ollama
      community.docker.docker_compose_v2:
        project_src: "{{ ollama_project_dir }}"
        state: present
        services: [ollama]

    - name: Ollama restore | Wait for the restored service
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/api/tags"
        status_code: 200
      register: _ollama_restore_health
      until: _ollama_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Ollama restore | Mark the application restore complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Ollama restore | Leave the service stopped after a failed restore
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ ollama_project_dir }}", stop, ollama]
      changed_when: false
      failed_when: false

    - name: Ollama restore | Report the failed restore
      ansible.builtin.fail:
        msg: >-
          Ollama restore did not complete. The service is intentionally left stopped;
          inspect the recovered model/config tree and retry after correcting the failure.
  always:
    - name: Ollama restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _ollama_restore_tmp.path }}"
        state: absent
      when: _ollama_restore_tmp.path is defined
