---
# Deploy on the guest (playbooks/apps/deploy.yml play 2): Docker on its own VM or a stack,
# or the systemd service on a native guest.
- name: Ollama | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: Ollama | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'
