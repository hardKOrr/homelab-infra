---
# Restore one Ollama archive (models and configuration) through the shared swap.
- name: Ollama restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Ollama restore needs a PBS-backed application recovery contract. Keep overwrite=false
      to list snapshots before selecting one.

- name: Ollama restore | Preview or replace the storage tree
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.storage_path }}"
        owner: 0
        group: 0
        mode: "0750"
    recovery_swap_stop_services: [ollama]
    recovery_swap_compose_project: "{{ ollama_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/api/tags"
