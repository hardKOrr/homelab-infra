---
- name: Restart BookStack
  community.docker.docker_compose_v2:
    project_src: "{{ bookstack_project_dir }}"
    state: restarted
  # A container Start service just created or recreated already runs the new files, and
  # restarting it would interrupt a new install's first schema migration.
  when: not (_bookstack_start.changed | default(false))

- name: Restart native BookStack
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ bookstack_native_services }}"
