---
- name: BookStack | Validate administrator email
  ansible.builtin.assert:
    that:
      - app_config.app.admin_user is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
    fail_msg: "app.admin_user must be a valid email address for the initial BookStack administrator."

- name: BookStack | Resolve platform mail
  ansible.builtin.include_tasks: ../../../tasks/mail/resolve-mail.yml

- name: BookStack | Resolve and store application credentials
  ansible.builtin.include_tasks: resolve-credentials.yml

- name: BookStack | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: BookStack | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'
