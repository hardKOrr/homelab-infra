---
# Restore BookStack from one PBS point, run by playbooks/maintenance/restore-app.yml. On
# Kubernetes the shared recovery Job replaces the database and /config PVC
# (restore-kubernetes.yml). On the Docker host or the native guest the shared swap replaces
# the named database and /config tree (database.pxar, storage.pxar). A plan lists or
# previews the point and changes nothing; an overwrite needs a distinct pre-restore point
# of this instance, taken within the last hour, and a failure after the stop puts the
# original tree and database back and starts BookStack.

- name: BookStack restore | Use the Kubernetes recovery Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method == 'kubernetes'

- name: BookStack restore | Use the Docker or native swap
  ansible.builtin.include_tasks: restore-guest.yml
  when: app_config.hosting.method in ['docker', 'native']
