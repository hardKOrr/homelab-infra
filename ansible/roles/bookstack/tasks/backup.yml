---
# Application-consistent native BookStack backup: stop the web services, dump the named
# database through the shared database dump, and push the dump and the durable data
# directory as database.pxar and storage.pxar in ONE PBS point. Docker and Kubernetes keep
# their own helpers (files/bookstack-recovery, the bookstack-kubernetes role).
- name: BookStack backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.hosting.method == 'native'
      - app_config.backup.enabled | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      A native BookStack backup needs hosting.method native, backup.enabled and a
      configured PBS.

- name: BookStack backup | Check the durable data directory
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _bookstack_backup_data
  changed_when: false

- name: BookStack backup | Require the data directory
  ansible.builtin.assert:
    that:
      - _bookstack_backup_data.stat.exists
      - _bookstack_backup_data.stat.isdir
    fail_msg: >-
      BookStack data path {{ app_config.app.data_path }} is missing; refusing a backup that
      would omit the uploads.

- name: BookStack backup | Name the quiesced services
  ansible.builtin.include_tasks: php-version.yml

# The dump directory is outside /tmp, which the PBS client's tmpfs replaces.
- name: BookStack backup | Allocate private scratch space
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: bookstack-backup-
  register: _bookstack_backup_scratch
  changed_when: true

- name: BookStack backup | Archive the database and uploads to PBS
  block:
    - name: BookStack backup | Stop BookStack, dump its database and push both archives
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: native
        pbs_client_stop_services: "{{ bookstack_native_services }}"
        pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
        pbs_client_archives:
          - name: database.pxar
            path: "{{ _bookstack_backup_scratch.path }}"
          - name: storage.pxar
            path: "{{ app_config.app.data_path }}"

    - name: BookStack backup | Mark the application backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: BookStack backup | Remove private scratch space
      ansible.builtin.file:
        path: "{{ _bookstack_backup_scratch.path }}"
        state: absent
