---
# BookStack's application-consistent backup on a guest, run by
# playbooks/maintenance/backup-app.yml (Kubernetes runs the deployed CronJob instead). Docker
# runs the recovery helper the nightly cron runs, so the on-demand point and the scheduled
# one come from one definition; native runs backup-native.yml. Both write database.pxar and
# storage.pxar in one point.
- name: BookStack backup | Run the scheduled recovery helper on Docker
  when: not (bookstack_native | bool)
  block:
    - name: BookStack backup | Run the recovery helper
      ansible.builtin.command:
        argv: ["{{ bookstack_recovery_script }}", --backup]
      environment:
        BOOKSTACK_INSTANCE: "{{ instance }}"
      changed_when: true

    - name: BookStack backup | Mark the application backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true

- name: BookStack backup | Back up the native guest
  ansible.builtin.include_tasks: backup-native.yml
  when: bookstack_native | bool
