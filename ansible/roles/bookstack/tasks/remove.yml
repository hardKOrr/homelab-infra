---
# Remove App hook, run after the Compose project stops. BookStack's backup schedule and root-only
# recovery configuration live outside /opt/<instance>. Remove both on every removal, even
# when delete_data is false, so an unwired application cannot keep stopping the stack host
# and writing snapshots after it was removed.
- name: Remove BookStack recovery schedule
  ansible.builtin.cron:
    name: "homelab-infra BookStack backup {{ instance }}"
    cron_file: "homelab-infra-bookstack-{{ instance }}"
    state: absent

- name: Remove BookStack recovery configuration
  ansible.builtin.file:
    path: "/etc/homelab-infra/bookstack/{{ instance }}.env"
    state: absent
