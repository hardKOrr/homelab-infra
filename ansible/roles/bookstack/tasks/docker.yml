---
# BookStack on Docker (Compose). Native hosting is native.yml.

# The shared Compose deploy renders the environment file with the project and recreates
# the container when either changed, in the same up that creates it, so a new install's
# first schema migration is never interrupted by a restart.
- name: BookStack | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ bookstack_project_dir }}"
    compose_dirs:
      - path: "{{ app_config.app.data_path }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
    compose_files:
      - src: bookstack.env.j2
        dest: "{{ bookstack_env_file }}"
        mode: "0600"
    compose_secrets: >-
      {{ [_bookstack_app_key, app_config.app.database_password | default(''),
          (wiring_mail | default({})).password | default('')] | select | list }}
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/login"
      retries: 60

- name: BookStack | Initialize the administrator
  ansible.builtin.include_tasks: admin.yml

- name: BookStack | Report backup provider no-op
  ansible.builtin.debug:
    msg: >-
      BookStack backup is enabled but this lab has no usable PBS target; deployment will
      continue without a recovery timer. Deploy PBS and rerun BookStack to enable the
      application-consistent database plus /config recovery path.
  when:
    - app_config.backup.enabled | default(false) | bool
    - not (bookstack_pbs_available | default(false) | bool)

- name: BookStack | Install the shared PBS client and this instance's settings
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-script.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_config_state: >-
      {{ 'present' if bookstack_pbs_available | default(false) | bool
         and app_config.backup.enabled | default(false) | bool else 'absent' }}
    k8s_pbs_available: "{{ bookstack_pbs_available | default(false) }}"
    k8s_pbs_repository: "{{ bookstack_pbs_repository | default('') }}"
    k8s_pbs_fingerprint: "{{ bookstack_pbs_fingerprint | default('') }}"
    k8s_pbs_password: "{{ bookstack_pbs_password | default('') }}"

- name: BookStack | Resolve the server-matched database client
  ansible.builtin.include_tasks: ../../../tasks/database/resolve-app-database.yml
  vars:
    database_app_instance: "{{ instance }}"
    database_app_config: "{{ app_config.app.database }}"

- name: BookStack | Install the shared database client
  ansible.builtin.include_tasks: ../../../tasks/database/install-client.yml

- name: BookStack | Install recovery helper
  ansible.builtin.copy:
    src: bookstack-recovery
    dest: "{{ bookstack_recovery_script }}"
    owner: root
    group: root
    mode: "0750"

- name: BookStack | Create recovery configuration directory
  ansible.builtin.file:
    path: "{{ bookstack_recovery_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: BookStack | Validate backup schedule
  ansible.builtin.assert:
    that:
      - (app_config.backup.schedule | string).split() | length == 5
      - app_config.backup.schedule is match('^[0-9*/,-]+ [0-9*/,-]+ [0-9*/,-]+ [0-9*/,-]+ [0-9*/,-]+$')
      - app_config.backup.retention_days | int > 0
    fail_msg: "BookStack backup.schedule must be a five-field cron expression and retention_days must be positive."
  when: app_config.backup.enabled | default(false) | bool

- name: BookStack | Write recovery configuration
  ansible.builtin.template:
    src: bookstack-recovery.env.j2
    dest: "{{ bookstack_recovery_config }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool

- name: BookStack | Install cron for recovery scheduling
  ansible.builtin.apt:
    name: cron
    state: present
  when: bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool

- name: BookStack | Ensure cron is running for recovery scheduling
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true
  when: bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool

- name: BookStack | Schedule application-consistent backup
  ansible.builtin.cron:
    name: "homelab-infra BookStack backup {{ instance }}"
    cron_file: "homelab-infra-bookstack-{{ instance }}"
    user: root
    minute: "{{ (app_config.backup.schedule.split())[0] }}"
    hour: "{{ (app_config.backup.schedule.split())[1] }}"
    day: "{{ (app_config.backup.schedule.split())[2] }}"
    month: "{{ (app_config.backup.schedule.split())[3] }}"
    weekday: "{{ (app_config.backup.schedule.split())[4] }}"
    job: "BOOKSTACK_INSTANCE={{ instance }} {{ bookstack_recovery_script }} --backup"
  when: bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool

- name: BookStack | Remove stale recovery schedule when backup is unavailable
  ansible.builtin.cron:
    name: "homelab-infra BookStack backup {{ instance }}"
    cron_file: "homelab-infra-bookstack-{{ instance }}"
    state: absent
  when: not (bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool)

- name: BookStack | Remove stale recovery configuration when backup is unavailable
  ansible.builtin.file:
    path: "{{ bookstack_recovery_config }}"
    state: absent
  when: not (bookstack_pbs_available | default(false) | bool and app_config.backup.enabled | default(false) | bool)
