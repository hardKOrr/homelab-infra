---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before provisioning). Resolve the lab
# PBS target for application-consistent recovery; the role reads it as bookstack_pbs_*
# (defaults/main.yml).
- name: BookStack | Resolve the lab PBS target for application-consistent recovery
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('', true) }}"
  when: app_config.backup.enabled | default(false) | bool
