frigate_project_dir: "/opt/{{ instance }}"
frigate_http_retries: 60
frigate_http_delay: 5
# Native: upstream's install tree and config/media paths are fixed (/opt/frigate, /config,
# /media/frigate), so a native guest is dedicated to one Frigate. With the default instance
# name /opt/frigate is also the project and config directory, so build inputs live apart
# in frigate_native_build and the install replaces only upstream's code under /opt/frigate.
# The stamp names the version the tree was built from.
frigate_native_build: /var/lib/frigate-native
frigate_native_src: "{{ frigate_native_build }}/src"
frigate_native_venv: "{{ frigate_native_build }}/venv"
frigate_native_node: "{{ frigate_native_build }}/node"
frigate_native_stamp: "/opt/frigate/.built-{{ app_config.app.native_version | default('') }}"
