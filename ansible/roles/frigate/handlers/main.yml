---
# The native services' restart (tasks/native.yml, native-install.yml), skipped when this run
# just started them. On Docker, tasks/stack/compose-deploy.yml recreates the project itself
# when a rendered file changes.
- name: Restart Frigate
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ instance }}-go2rtc", "{{ instance }}-nginx", "{{ instance }}"]
  when:
    - app_config.hosting.method | default('docker') == 'native'
    - not (_frigate_start.changed | default(false))
