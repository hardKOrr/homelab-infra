---
# Restore one Frigate config/database archive. The original directory stays on its
# filesystem until the replacement is healthy, and is put back after any later failure.

- name: Frigate restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - not (restore_overwrite | bool) or restore_pre_restore_point | default('', true) | length > 0
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Frigate restore needs its PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots; overwrite requires a fresh target recovery point.

- name: Frigate restore | Resolve source and rollback state
  ansible.builtin.set_fact:
    _frigate_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
    _application_restore_complete: false
    _frigate_restore_rolled_back: false
    _frigate_restore_moved: {rc: 1}
  no_log: true

- name: Frigate restore | Require the selected snapshot to belong to the source group
  ansible.builtin.assert:
    that:
      - restore_snapshot.startswith('host/' ~ _frigate_restore_backup_id ~ '/')
      - restore_snapshot | length > ('host/' ~ _frigate_restore_backup_id ~ '/') | length
    fail_msg: >-
      The selected Frigate snapshot must belong to host/{{ _frigate_restore_backup_id }}/;
      refusing to replace application state with another backup group's archive.
  when: restore_snapshot | default('') | length > 0

- name: Frigate restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Frigate restore | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Frigate. Deploy PBS before listing or restoring
      application data.

- name: Frigate restore | List available snapshots
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - BACKUP_ID
      - --env
      - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
      - --env
      - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  register: _frigate_restore_snapshots
  changed_when: false
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _frigate_restore_backup_id }}"
  no_log: true

- name: Frigate restore | Print available snapshots
  ansible.builtin.debug:
    msg: "PBS snapshots for host/{{ _frigate_restore_backup_id }}:\n{{ _frigate_restore_snapshots.stdout }}"
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)

- name: Frigate restore | Explain the read-only plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with recovery_point=<PBS snapshot ID> and overwrite=true
      to replace {{ app_config.app.config_path }} from one Frigate data.pxar archive.
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length > 0)

- name: Frigate restore | Create a private staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-frigate-restore-"
  register: _frigate_restore_tmp
  when: restore_overwrite | bool

- name: Frigate restore | Stop and replace application state
  when: restore_overwrite | bool
  block:
    - name: Frigate restore | Create private rollback space beside the config directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ app_config.app.config_path | dirname }}"
        prefix: .frigate-pre-restore-
      register: _frigate_restore_previous

    - name: Frigate restore | Stop only Frigate
      community.docker.docker_compose_v2:
        project_src: "{{ frigate_project_dir }}"
        state: stopped
        services: ["{{ instance }}"]

    - name: Frigate restore | Extract the selected archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _frigate_restore_tmp.path }}:/restore"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - SNAPSHOT
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client restore "$SNAPSHOT" data.pxar /restore
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        SNAPSHOT: "{{ restore_snapshot }}"
      no_log: true
      changed_when: true

    - name: Frigate restore | Validate the staged configuration and database
      ansible.builtin.stat:
        path: "{{ _frigate_restore_tmp.path }}/{{ item }}"
      loop: [config.yml, frigate.db]
      register: _frigate_restore_state

    - name: Frigate restore | Require a complete application archive
      ansible.builtin.assert:
        that:
          - _frigate_restore_state.results[0].stat.isreg | default(false)
          - _frigate_restore_state.results[1].stat.isreg | default(false)
        fail_msg: >-
          The selected Frigate archive must contain config.yml and frigate.db under its
          data.pxar root; no target state has been replaced.

    - name: Frigate restore | Check the archived database integrity
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import sqlite3,sys;
            c=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True);
            result=c.execute('PRAGMA integrity_check').fetchone()[0];
            c.close();
            sys.exit(0 if result == 'ok' else 1)
          - "{{ _frigate_restore_tmp.path }}/frigate.db"
      changed_when: false
      no_log: true

    - name: Frigate restore | Move the original config into rollback space
      ansible.builtin.command:
        argv: [mv, "{{ app_config.app.config_path }}", "{{ _frigate_restore_previous.path }}/config"]
      register: _frigate_restore_moved
      changed_when: _frigate_restore_moved.rc == 0
      no_log: true

    - name: Frigate restore | Recreate the config directory
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Frigate restore | Copy the archived application state into place
      ansible.builtin.command:
        argv: [cp, -a, "{{ _frigate_restore_tmp.path }}/.", "{{ app_config.app.config_path }}/"]
      changed_when: true
      no_log: true

    - name: Frigate restore | Start only Frigate
      community.docker.docker_compose_v2:
        project_src: "{{ frigate_project_dir }}"
        state: present
        services: ["{{ instance }}"]

    - name: Frigate restore | Wait for the restored version endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/api/version"
        return_content: true
        status_code: 200
      register: _frigate_restore_health
      until: _frigate_restore_health.status | default(0) == 200
      retries: "{{ frigate_http_retries | default(60) }}"
      delay: "{{ frigate_http_delay | default(5) }}"
      changed_when: false
      no_log: true

    - name: Frigate restore | Require a version response
      ansible.builtin.assert:
        that: _frigate_restore_health.content | default('') is search('version')
        fail_msg: Frigate restored but did not return a valid version response.

    - name: Frigate restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Frigate restore | Stop only Frigate after failure
      community.docker.docker_compose_v2:
        project_src: "{{ frigate_project_dir }}"
        state: stopped
        services: ["{{ instance }}"]

    - name: Frigate restore | Remove the failed replacement config
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: absent
      when: _frigate_restore_moved.rc | default(1) == 0

    - name: Frigate restore | Put the original config back
      ansible.builtin.command:
        argv: [mv, "{{ _frigate_restore_previous.path }}/config", "{{ app_config.app.config_path }}"]
      changed_when: true
      no_log: true
      when: _frigate_restore_moved.rc | default(1) == 0

    - name: Frigate restore | Record that rollback completed
      ansible.builtin.set_fact:
        _frigate_restore_rolled_back: true

    - name: Frigate restore | State that the service remains stopped
      ansible.builtin.fail:
        msg: >-
          Frigate restore failed. The service was left stopped rather than serving partial
          state. The original config was retained or put back; inspect the job output and
          rerun the restore after correcting it.
  always:
    - name: Frigate restore | Remove rollback space only after health or rollback succeeded
      ansible.builtin.file:
        path: "{{ _frigate_restore_previous.path }}"
        state: absent
      when:
        - _frigate_restore_previous.path is defined
        - >-
          (_application_restore_complete | bool) or (_frigate_restore_rolled_back | bool)
          or (_frigate_restore_moved.rc | default(1) != 0)

    - name: Frigate restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _frigate_restore_tmp.path }}"
        state: absent
      when: _frigate_restore_tmp.path is defined
