---
# Docker-on-VM/LXC deployment: the Compose project, then the pulled image.

# The shared Compose deploy recreates the container when a rendered file changed, in the
# same up that creates it, so a new install is never restarted mid first boot. config.yml
# is written once; the app owns it afterwards.
- name: Frigate | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ frigate_project_dir }}"
    compose_files:
      - {src: config.yml.j2, dest: "{{ app_config.app.config_path }}/config.yml", mode: "0600", force: false}
    compose_secrets: "{{ [_frigate_mqtt_password] + (_frigate_rtsp_urls | default({}) | dict2items | map(attribute='value') | list) }}"
    compose_health:
      # Port 8971 is authenticated; Frigate keeps this onboarding endpoint public.
      url: "http://localhost:{{ app_config.app.port }}/api/auth/first_time_login"
      retries: "{{ frigate_http_retries }}"
      delay: "{{ frigate_http_delay }}"
