---
# Stop Frigate so its SQLite database and UI-managed configuration form one PBS point.
# The external recording mount stays outside this application recovery unit.

- name: Frigate backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Frigate needs its declared application-consistent backup contract and a configured
      PBS before an on-demand backup can run.

- name: Frigate backup | Check the application configuration directory
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _frigate_backup_data
  changed_when: false

- name: Frigate backup | Check the persisted database and configuration
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}/{{ item }}"
  loop: [config.yml, frigate.db]
  register: _frigate_backup_files
  changed_when: false

- name: Frigate backup | Require the application state before backup
  ansible.builtin.assert:
    that:
      - _frigate_backup_data.stat.exists
      - _frigate_backup_data.stat.isdir
      - _frigate_backup_files.results[0].stat.isreg | default(false)
      - _frigate_backup_files.results[1].stat.isreg | default(false)
    fail_msg: >-
      Frigate needs both config.yml and frigate.db under {{ app_config.app.config_path }};
      refusing to publish an incomplete recovery point.

- name: Frigate backup | Quiesce Frigate and archive its configuration and database to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ frigate_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: Frigate backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
