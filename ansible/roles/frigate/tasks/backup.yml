---
# Stop Frigate so its SQLite database and UI-managed configuration form one PBS point.
# The external recording mount stays outside this application recovery unit.

- name: Frigate backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Frigate needs its declared application-consistent backup contract and a configured
      PBS before an on-demand backup can run.

- name: Frigate backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Frigate backup | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Frigate. Deploy PBS and re-run this backup; no local
      archive is treated as a recovery point.

- name: Frigate backup | Check the application configuration directory
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _frigate_backup_data
  changed_when: false

- name: Frigate backup | Check the persisted database and configuration
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}/{{ item }}"
  loop: [config.yml, frigate.db]
  register: _frigate_backup_files
  changed_when: false

- name: Frigate backup | Require the application state before backup
  ansible.builtin.assert:
    that:
      - _frigate_backup_data.stat.exists
      - _frigate_backup_data.stat.isdir
      - _frigate_backup_files.results[0].stat.isreg | default(false)
      - _frigate_backup_files.results[1].stat.isreg | default(false)
    fail_msg: >-
      Frigate needs both config.yml and frigate.db under {{ app_config.app.config_path }};
      refusing to publish an incomplete recovery point.

- name: Frigate backup | Stop only Frigate
  community.docker.docker_compose_v2:
    project_src: "{{ frigate_project_dir }}"
    state: stopped
    services: ["{{ instance }}"]

- name: Frigate backup | Archive the quiesced configuration and database to PBS
  block:
    - name: Frigate backup | Check the stopped database integrity
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import sqlite3,sys;
            c=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True);
            result=c.execute('PRAGMA integrity_check').fetchone()[0];
            c.close();
            sys.exit(0 if result == 'ok' else 1)
          - "{{ app_config.app.config_path }}/frigate.db"
      changed_when: false
      no_log: true

    - name: Frigate backup | Push one application archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ app_config.app.config_path }}:/source:ro"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - BACKUP_ID
          - --env
          - "RETENTION_DAYS={{ app_config.backup.retention_days | default(14) | int }}"
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client backup data.pxar:/source --backup-id "$BACKUP_ID"
            proxmox-backup-client prune "host/$BACKUP_ID" --keep-last 2 --keep-daily "$RETENTION_DAYS"
            echo "backup complete: host/$BACKUP_ID"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        BACKUP_ID: "{{ app_config.backup.backup_id | default('', true) or instance }}"
        RETENTION_DAYS: "{{ app_config.backup.retention_days | default(14) | int }}"
      no_log: true
      changed_when: true

    - name: Frigate backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Frigate backup | Start only Frigate
      community.docker.docker_compose_v2:
        project_src: "{{ frigate_project_dir }}"
        state: present
        services: ["{{ instance }}"]
