---
# Frigate natively on an LXC or a VM: upstream's pieces (Frigate, go2rtc, nginx) as three
# systemd units, in place of the s6 services the image runs. Upstream fixes /config and
# /media/frigate, so /config links to this instance's config path. The playbook limits
# the method to CPU-only without cameras or a recording mount.
- name: Frigate native | Assert the native build's architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture == 'x86_64'
    fail_msg: The native Frigate build downloads amd64 assets only.

- name: Frigate native | Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: Frigate native | Build and install the pinned release
  ansible.builtin.include_tasks: native-install.yml

- name: Frigate native | Link upstream's fixed config and media paths
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - {src: "{{ app_config.app.config_path }}", dest: /config}

- name: Frigate native | Create the media directory
  ansible.builtin.file:
    path: /media/frigate
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Frigate native | Seed the application config once
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ app_config.app.config_path }}/config.yml"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true
  notify: Restart Frigate

- name: Frigate native | Install the service launchers
  ansible.builtin.template:
    src: "native-{{ item }}.sh.j2"
    dest: "{{ frigate_project_dir }}/{{ item }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: [frigate, go2rtc, nginx]
  notify: Restart Frigate

- name: Frigate native | Render the services
  ansible.builtin.template:
    src: native.service.j2
    dest: "/etc/systemd/system/{{ item.unit }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {unit: "{{ instance }}-go2rtc", name: go2rtc, after: "", needs: ""}
    - {unit: "{{ instance }}-nginx", name: nginx, after: "", needs: ""}
    - {unit: "{{ instance }}", name: frigate, after: "{{ instance }}-go2rtc.service {{ instance }}-nginx.service", needs: "{{ instance }}-go2rtc.service {{ instance }}-nginx.service"}
  loop_control:
    label: "{{ item.unit }}"
  notify: Restart Frigate

- name: Frigate native | Enable and start the services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: ["{{ instance }}-go2rtc", "{{ instance }}-nginx", "{{ instance }}"]
  register: _frigate_start

- name: Frigate native | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Frigate native | Wait for the public API endpoint
  ansible.builtin.uri:
    # Port 8971 is authenticated; Frigate keeps this onboarding endpoint public.
    url: "http://localhost:{{ app_config.app.port }}/api/auth/first_time_login"
    return_content: false
    status_code: 200
  register: _frigate_health
  until: _frigate_health.status | default(0) == 200
  retries: "{{ frigate_http_retries }}"
  delay: "{{ frigate_http_delay }}"
  changed_when: false

- name: Frigate native | Install the restart and log helpers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - name: lab-restart-app
      content: |
        #!/bin/sh
        set -eu
        exec systemctl restart {{ instance | quote }}
    - name: lab-tail-applog
      content: |
        #!/bin/sh
        set -eu
        exec journalctl -u {{ instance | quote }} -u {{ (instance ~ '-nginx') | quote }} -u {{ (instance ~ '-go2rtc') | quote }} -n "${1:-50}" --no-pager
  loop_control:
    label: "{{ item.name }}"
