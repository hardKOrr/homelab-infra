---
# Build Frigate from the pinned source release the way docker/main/Dockerfile does, minus
# the hardware stacks (Coral, GPU, OpenVINO, TensorRT): CPU detector only. Upstream's own
# build scripts run unmodified from the downloaded source; each step is skipped once its
# product exists, and the final stamp ties /opt/frigate to native_version.
- name: Frigate native | Install build and runtime packages
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - jq
      - libgl1
      - libglib2.0-0
      - libgomp1
      - libusb-1.0-0
      - libxml2
      - locales
      - lsof
      - openssl
      - procps
      - python3
      - python3-dev
      - python3-h2
      - python3-pip
      - python3-venv
      - tzdata
      - unzip
      - wget
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Frigate native | Create the build directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["{{ frigate_native_src }}", "{{ frigate_native_node }}", /usr/local/go2rtc/bin, /usr/local/tempio/bin, /usr/lib/ffmpeg/8.0]

- name: Frigate native | Download the pinned source release
  ansible.builtin.get_url:
    url: "https://github.com/blakeblackshear/frigate/archive/refs/tags/v{{ app_config.app.native_version }}.tar.gz"
    dest: "{{ frigate_project_dir }}/frigate-{{ app_config.app.native_version }}.tar.gz"
    checksum: "sha256:{{ app_config.app.native_sha256 }}"
    mode: "0644"

- name: Frigate native | Unpack the source
  ansible.builtin.unarchive:
    src: "{{ frigate_project_dir }}/frigate-{{ app_config.app.native_version }}.tar.gz"
    dest: "{{ frigate_native_src }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ frigate_native_src }}/docker/main/Dockerfile"

- name: Frigate native | Download the pinned prebuilt assets
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ frigate_project_dir }}/{{ item.value.url | basename }}"
    checksum: "sha256:{{ item.value.sha256 }}"
    mode: "0644"
  loop: "{{ app_config.app.native_assets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Frigate native | Place the single-file assets
  ansible.builtin.copy:
    src: "{{ frigate_project_dir }}/{{ app_config.app.native_assets[item.asset].url | basename }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {asset: go2rtc, dest: /usr/local/go2rtc/bin/go2rtc, mode: "0755"}
    - {asset: tempio, dest: /usr/local/tempio/bin/tempio, mode: "0755"}
    - {asset: yq, dest: /usr/local/bin/yq, mode: "0755"}
    - {asset: cpu_model, dest: /cpu_model.tflite, mode: "0644"}
  loop_control:
    label: "{{ item.dest }}"

- name: Frigate native | Unpack the pinned ffmpeg
  ansible.builtin.unarchive:
    src: "{{ frigate_project_dir }}/{{ app_config.app.native_assets.ffmpeg.url | basename }}"
    dest: /usr/lib/ffmpeg/8.0
    remote_src: true
    extra_opts: [--strip-components=1]
    include: [amd64/bin/ffmpeg, amd64/bin/ffprobe]
    creates: /usr/lib/ffmpeg/8.0/bin/ffmpeg

- name: Frigate native | Unpack the pinned Node.js used only for the web build
  ansible.builtin.unarchive:
    src: "{{ frigate_project_dir }}/{{ app_config.app.native_assets.node.url | basename }}"
    dest: "{{ frigate_native_node }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ frigate_native_node }}/bin/node"

# Upstream's nginx build (vod and secure-token modules, patched) and sqlite-vec scripts.
- name: Frigate native | Build the pinned nginx with Frigate's modules
  ansible.builtin.command:
    cmd: bash {{ frigate_native_src }}/docker/main/build_nginx.sh
    chdir: /tmp
    creates: /usr/local/nginx/sbin/nginx
  async: 3600
  poll: 15

- name: Frigate native | Build the sqlite-vec extension
  ansible.builtin.command:
    cmd: bash {{ frigate_native_src }}/docker/main/build_sqlite_vec.sh
    chdir: /tmp
    creates: /usr/local/lib/vec0.so
  async: 3600
  poll: 15

- name: Frigate native | Install the Python environment and the pinned pysqlite3
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      python3 -m venv {{ frigate_native_venv }}
      export PATH={{ frigate_native_venv }}/bin:$PATH
      pip install --upgrade pip wheel setuptools
      pip install -r {{ frigate_native_src }}/docker/main/requirements.txt
      pip install -r {{ frigate_native_src }}/docker/main/requirements-wheels.txt
      mkdir -p {{ frigate_project_dir }}/pysqlite && cd {{ frigate_project_dir }}/pysqlite
      bash {{ frigate_native_src }}/docker/main/build_pysqlite3.sh
      pip install /wheels/pysqlite3*.whl
      touch {{ frigate_native_venv }}/.frigate-{{ app_config.app.native_version }}
    executable: /bin/bash
    creates: "{{ frigate_native_venv }}/.frigate-{{ app_config.app.native_version }}"
  async: 7200
  poll: 30

- name: Frigate native | Build the web UI and install the Frigate tree
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export PATH={{ frigate_native_node }}/bin:$PATH
      cd {{ frigate_native_src }}/web
      npm install
      npm run build
      mv dist/BASE_PATH/monacoeditorwork/* dist/assets/
      rm -rf dist/BASE_PATH
      rm -rf /opt/frigate
      mkdir -p /opt/frigate
      cp -a {{ frigate_native_src }}/frigate {{ frigate_native_src }}/migrations /opt/frigate/
      cp -a dist /opt/frigate/web
      cp {{ frigate_native_src }}/labelmap.txt /labelmap.txt
      cp {{ frigate_native_src }}/audio-labelmap.txt /audio-labelmap.txt
      cp -a {{ frigate_native_src }}/docker/main/rootfs/labelmap /labelmap
      cp -a {{ frigate_native_src }}/docker/main/rootfs/usr/local/. /usr/local/
      touch {{ frigate_native_stamp }}
    executable: /bin/bash
    creates: "{{ frigate_native_stamp }}"
  async: 3600
  poll: 15
  notify: Restart Frigate
