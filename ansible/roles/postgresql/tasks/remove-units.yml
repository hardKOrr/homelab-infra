---
# Remove App hook, run on a native guest before the service stops; it resolves
# _rm_service_names. PostgreSQL's instantiated unit is derived from the cluster
# configuration and is not reliably listed by systemctl list-unit-files. Discover the
# cluster first so a legacy PostgreSQL 15 guest is stopped before delete_data can remove
# its files.
- name: Discover PostgreSQL clusters
  ansible.builtin.command:
    argv:
      - pg_lsclusters
      - --no-header
  register: _rm_postgresql_clusters
  failed_when: false
  changed_when: false

- name: Resolve every PostgreSQL cluster removal unit
  ansible.builtin.set_fact:
    _rm_service_names: "{{ _rm_service_names | default([]) + ['postgresql@' ~ _rm_postgresql_cluster[0] ~ '-' ~ _rm_postgresql_cluster[1]] }}"
  vars:
    _rm_postgresql_cluster: "{{ item | split() }}"
  loop: >-
    {{ _rm_postgresql_clusters.stdout_lines | default([])
       | select('match', '^[0-9]+[ ]+') | list }}

- name: Fall back to the configured PostgreSQL removal unit
  ansible.builtin.set_fact:
    _rm_service_names:
      - "postgresql@{{ app_config.app.version | default('16') }}-main"
  when:
    - _rm_service_names | default([]) | length == 0
