---
# PostgreSQL backend. It is deliberately independent of application Compose files so its
# lifecycle, backup coverage and credentials are explicit and independently recoverable.
# It runs from packages by default, or as the official image on a stack host
# (hosting.method: docker).
- name: PostgreSQL | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: postgresql_docker | bool

- name: PostgreSQL | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: not (postgresql_docker | bool)
