---
# Restore the whole PostgreSQL server (every database, role and grant) from one PBS
# recovery point into the namespace of a PostgreSQL instance that is already deployed. The
# server keeps running: the shared Job loads the point over the pod network as the
# superuser, after dropping every database and role the point does not hold, and keeps the
# target's own postgres password (database-client.sh server-load). Stop the server's
# consumers first. Called by restore.yml; recovery-restore.yml is the mechanism.
- name: PostgreSQL restore | Read the target's superuser credential
  ansible.builtin.set_fact:
    _postgresql_target_password: >-
      {{ ((homelabinfra_vault.apps | default({})).get(restore_target, {})).superuser_password | default('', true) }}
  no_log: true

- name: PostgreSQL restore | Describe the target's server step
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_source: namespace-server
    k8s_database_step_config: "{{ restore_target_config }}"
    k8s_database_step_instance: "{{ restore_target }}"
    k8s_database_step_root_password: "{{ _postgresql_target_password }}"

- name: PostgreSQL restore | Restore the server through the shared Kubernetes recovery Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: PostgreSQL
      archives:
        - name: config
          config_map: "{{ restore_target }}-config"
      database: "{{ k8s_database_step }}"
      # The server is the restore's target, so nothing is stopped; the shared Job's
      # loops over `stop` then run zero times.
      stop: []
      live_server: true
      # The point's access list replaces the target's ConfigMap after the load, and the
      # server reads pg_hba.conf at start: restart it, and the shared Job waits for
      # readiness, so the restored list is the one in force.
      restart: ["{{ restore_target }}"]
      describe: >-
        {{ k8s_database_step.describe }} and its access list
      verify:
        - >-
          Connect one registered consumer to the restored server and read its data.
