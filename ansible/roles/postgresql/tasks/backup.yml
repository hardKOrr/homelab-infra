---
# pg_basebackup puts the running cluster into backup mode and streams the required WAL,
# keeping databases, roles and grants in one PostgreSQL-native recovery point.
- name: PostgreSQL backup | Resolve the backup identity
  ansible.builtin.set_fact:
    _postgresql_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _application_backup_complete: false

- name: PostgreSQL backup | Assert the native recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _postgresql_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      PostgreSQL backup needs its application-consistent recovery contract, a safe
      backup id and a configured PBS target.

- name: PostgreSQL backup | Require the installed recovery helper
  ansible.builtin.stat:
    path: /usr/local/sbin/homelab-postgresql-recovery
  register: _postgresql_backup_helper
  changed_when: false

- name: PostgreSQL backup | Assert the recovery helper is installed
  ansible.builtin.assert:
    that: _postgresql_backup_helper.stat.exists | default(false)
    fail_msg: >-
      The PostgreSQL recovery helper is missing. Deploy the instance with the current
      PostgreSQL role before requesting an application backup.

- name: PostgreSQL backup | Discover the registered cluster
  ansible.builtin.command:
    argv: [pg_lsclusters, --no-header]
  register: _postgresql_backup_clusters
  changed_when: false

- name: PostgreSQL backup | Resolve the main cluster
  ansible.builtin.set_fact:
    _postgresql_backup_cluster_lines: >-
      {{ _postgresql_backup_clusters.stdout_lines | default([])
         | select('match', '^[0-9]+[ ]+') | list }}
    _postgresql_backup_main_lines: >-
      {{ _postgresql_backup_clusters.stdout_lines | default([])
         | select('match', '^' ~ (app_config.app.version | string) ~ '[ ]+main[ ]+') | list }}

- name: PostgreSQL backup | Require one main cluster on the configured port
  ansible.builtin.assert:
    that:
      - _postgresql_backup_cluster_lines | length == 1
      - _postgresql_backup_main_lines | length == 1
      - (_postgresql_backup_main_lines[0].split()[2] | int) == (app_config.app.port | int)
    fail_msg: >-
      PostgreSQL backup requires exactly the configured main cluster and port; no data
      has been changed.

- name: PostgreSQL backup | Refuse unsupported external tablespaces
  ansible.builtin.command:
    argv:
      - psql
      - --no-psqlrc
      - --host=/var/run/postgresql
      - "--port={{ app_config.app.port }}"
      - --username=postgres
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT spcname FROM pg_tablespace WHERE spcname NOT IN ('pg_default', 'pg_global') ORDER BY spcname
  become_user: postgres
  register: _postgresql_backup_tablespaces
  changed_when: false

- name: PostgreSQL backup | Require the complete cluster to use its standard tablespaces
  ansible.builtin.assert:
    that: _postgresql_backup_tablespaces.stdout | trim == ''
    fail_msg: >-
      PostgreSQL native recovery currently supports the standard pg_default and pg_global
      tablespaces only. No recovery point was created.

# /var/tmp, because the PBS client's private tmpfs covers /tmp while it archives.
- name: PostgreSQL backup | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: "{{ instance }}-postgresql-backup-"
  register: _postgresql_backup_tmp

- name: PostgreSQL backup | Create and verify a native physical backup
  block:
    - name: PostgreSQL backup | Set private staging ownership
      ansible.builtin.file:
        path: "{{ _postgresql_backup_tmp.path }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: PostgreSQL backup | Export the full cluster through the local superuser socket
      ansible.builtin.command:
        argv:
          - pg_basebackup
          - --host=/var/run/postgresql
          - "--port={{ app_config.app.port }}"
          - --username=postgres
          - --no-password
          - --format=plain
          - --wal-method=stream
          - --checkpoint=fast
          - "--pgdata={{ _postgresql_backup_tmp.path }}/cluster"
      become_user: postgres
      changed_when: true

    - name: PostgreSQL backup | Verify the native backup manifest and checksums
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/homelab-postgresql-recovery
          - verify
          - "{{ _postgresql_backup_tmp.path }}"
          - "{{ app_config.app.version }}"
      changed_when: false

    - name: PostgreSQL backup | Upload the physical archive to PBS
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: native
        pbs_client_backup_id: "{{ _postgresql_backup_id }}"
        pbs_client_archives:
          - name: postgresql.pxar
            path: "{{ _postgresql_backup_tmp.path }}"

    - name: PostgreSQL backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: PostgreSQL backup | Remove private staging data
      ansible.builtin.file:
        path: "{{ _postgresql_backup_tmp.path }}"
        state: absent
      when: _postgresql_backup_tmp.path is defined
