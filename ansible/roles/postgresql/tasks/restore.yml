---
- name: PostgreSQL restore | Resolve recovery identities and selected points
  ansible.builtin.set_fact:
    _postgresql_restore_source_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_source_instance | default(instance, true), true) }}
    _postgresql_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}
    _postgresql_restore_snapshot: "{{ restore_snapshot | default('') }}"
    _postgresql_restore_prepoint: "{{ restore_pre_restore_point | default('') }}"
    _application_restore_complete: false

- name: PostgreSQL restore | Assert the native recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _postgresql_restore_source_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - _postgresql_restore_target_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_overwrite is defined
      - (_postgresql_restore_snapshot | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      PostgreSQL restore needs its application-consistent recovery contract, safe backup
      ids, PBS and a selected recovery point for overwrite=true.

- name: PostgreSQL restore | Require the source point to belong to its backup group
  ansible.builtin.assert:
    that:
      - _postgresql_restore_snapshot.startswith('host/' ~ _postgresql_restore_source_backup_id ~ '/')
      - _postgresql_restore_snapshot | length > ('host/' ~ _postgresql_restore_source_backup_id ~ '/') | length
    fail_msg: >-
      The selected PostgreSQL recovery point must belong to
      host/{{ _postgresql_restore_source_backup_id }}/.
  when: _postgresql_restore_snapshot | length > 0

- name: PostgreSQL restore | Require the independent existing-target point
  ansible.builtin.assert:
    that:
      - _postgresql_restore_prepoint.startswith('host/' ~ _postgresql_restore_target_backup_id ~ '/')
      - _postgresql_restore_prepoint | length > ('host/' ~ _postgresql_restore_target_backup_id ~ '/') | length
    fail_msg: >-
      The independent PostgreSQL pre-restore point must belong to
      host/{{ _postgresql_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: PostgreSQL restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: PostgreSQL restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for PostgreSQL. Deploy PBS before listing or restoring
      application data.

- name: PostgreSQL restore | Require the installed PBS client and recovery helper
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/proxmox-backup-client
    - /usr/local/sbin/homelab-postgresql-recovery
  register: _postgresql_restore_tools
  changed_when: false

- name: PostgreSQL restore | Assert the recovery tools are installed
  ansible.builtin.assert:
    that: _postgresql_restore_tools.results | selectattr('stat.exists') | list | length == 2
    fail_msg: >-
      PostgreSQL recovery tools are missing. Deploy the instance with the current
      PostgreSQL role before requesting an application restore.

- name: PostgreSQL restore | List source points in plan mode
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - list
      - "host/{{ _postgresql_restore_source_backup_id }}"
      - --output-format
      - text
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _postgresql_restore_snapshots
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - not (restore_overwrite | bool)
    - _postgresql_restore_snapshot | length == 0

- name: PostgreSQL restore | Report a failed snapshot listing
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _postgresql_restore_snapshots }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: PostgreSQL restore | PBS snapshot listing failed
  when:
    - _postgresql_restore_snapshots is defined
    - not (_postgresql_restore_snapshots.skipped | default(false) | bool)

- name: PostgreSQL restore | Show source points in plan mode
  ansible.builtin.debug:
    msg: >-
      PBS recovery points for host/{{ _postgresql_restore_source_backup_id }}:
      {{ _postgresql_restore_snapshots.stdout }}
  when:
    - not (restore_overwrite | bool)
    - _postgresql_restore_snapshot | length == 0

- name: PostgreSQL restore | Verify the selected recovery archive
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _postgresql_restore_snapshot }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _postgresql_restore_source_files
  failed_when: false
  changed_when: false
  no_log: true
  when: _postgresql_restore_snapshot | length > 0

- name: PostgreSQL restore | Report an unavailable source archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _postgresql_restore_source_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: PostgreSQL restore | selected PBS point is unavailable
  when: _postgresql_restore_source_files is defined

- name: PostgreSQL restore | Require the selected native archive
  ansible.builtin.assert:
    that: "'postgresql.pxar' in _postgresql_restore_source_files.stdout"
    fail_msg: >-
      Recovery point {{ _postgresql_restore_snapshot }} lacks PostgreSQL's native archive;
      the current instance has not been changed.
  when: _postgresql_restore_snapshot | length > 0

- name: PostgreSQL restore | Verify the independent pre-restore archive
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - files
      - "{{ _postgresql_restore_prepoint }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _postgresql_restore_prepoint_files
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: PostgreSQL restore | Report an unavailable pre-restore archive
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _postgresql_restore_prepoint_files }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: PostgreSQL restore | independent pre-restore point is unavailable
  when:
    - _postgresql_restore_prepoint_files is defined
    - not (_postgresql_restore_prepoint_files.skipped | default(false) | bool)

- name: PostgreSQL restore | Require the pre-restore native archive
  ansible.builtin.assert:
    that: "'postgresql.pxar' in _postgresql_restore_prepoint_files.stdout"
    fail_msg: >-
      The independent PostgreSQL pre-restore point lacks the native archive; the current
      instance has not been changed.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: PostgreSQL restore | Explain the selected point in plan mode
  ansible.builtin.debug:
    msg: >-
      No data was changed. Re-run with overwrite=true and
      pre_restore_point={{ _postgresql_restore_prepoint }} to apply
      {{ _postgresql_restore_snapshot }} to this PostgreSQL instance.
  when:
    - not (restore_overwrite | bool)
    - _postgresql_restore_snapshot | length > 0

- name: PostgreSQL restore | Discover the target cluster before mutation
  ansible.builtin.command:
    argv: [pg_lsclusters, --no-header]
  register: _postgresql_restore_clusters
  changed_when: false
  when: restore_overwrite | bool

- name: PostgreSQL restore | Resolve the target data directory
  ansible.builtin.set_fact:
    _postgresql_restore_cluster_lines: >-
      {{ _postgresql_restore_clusters.stdout_lines | default([])
         | select('match', '^[0-9]+[ ]+') | list }}
    _postgresql_restore_main_lines: >-
      {{ _postgresql_restore_clusters.stdout_lines | default([])
         | select('match', '^' ~ (app_config.app.version | string) ~ '[ ]+main[ ]+') | list }}
  when: restore_overwrite | bool

- name: PostgreSQL restore | Require one target main cluster and its existing data directory
  when: restore_overwrite | bool
  block:
    - name: PostgreSQL restore | Validate the target cluster identity
      ansible.builtin.assert:
        that:
          - _postgresql_restore_cluster_lines | length == 1
          - _postgresql_restore_main_lines | length == 1
          - (_postgresql_restore_main_lines[0].split()[2] | int) == (app_config.app.port | int)
        fail_msg: >-
          PostgreSQL restore requires exactly the configured main cluster and port;
          the current instance has not been changed.

    - name: PostgreSQL restore | Set target service and data directory
      ansible.builtin.set_fact:
        _postgresql_restore_service: >-
          postgresql@{{ app_config.app.version }}-main
        _postgresql_restore_data_directory: "{{ _postgresql_restore_main_lines[0].split()[5] }}"

    - name: PostgreSQL restore | Inspect the target data directory
      ansible.builtin.stat:
        path: "{{ _postgresql_restore_data_directory }}"
      register: _postgresql_restore_data_stat
      changed_when: false

    - name: PostgreSQL restore | Require a real target data directory
      ansible.builtin.assert:
        that:
          - _postgresql_restore_data_stat.stat.isdir | default(false)
          - not (_postgresql_restore_data_stat.stat.islnk | default(false))
        fail_msg: >-
          PostgreSQL restore requires a real existing cluster data directory; the target
          has not been changed.

- name: PostgreSQL restore | Create private same-filesystem staging space
  ansible.builtin.tempfile:
    path: "{{ _postgresql_restore_data_directory | dirname }}"
    state: directory
    prefix: .homelab-postgresql-restore-
  register: _postgresql_restore_tmp
  when: restore_overwrite | bool

- name: PostgreSQL restore | Apply the selected point with same-filesystem rollback
  when: restore_overwrite | bool
  block:
    - name: PostgreSQL restore | Create the private source directory
      ansible.builtin.file:
        path: "{{ _postgresql_restore_tmp.path }}/source"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: PostgreSQL restore | Download the selected native archive
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - proxmox-backup-client
          - restore
          - "{{ _postgresql_restore_snapshot }}"
          - postgresql.pxar
          - "{{ _postgresql_restore_tmp.path }}/source"
          - --allow-existing-dirs
          - "true"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
      register: _postgresql_restore_download
      no_log: true
      changed_when: true

    - name: PostgreSQL restore | Verify and apply the point transactionally
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/homelab-postgresql-recovery
          - restore
          - "{{ _postgresql_restore_tmp.path }}/source"
          - "{{ _postgresql_restore_data_directory }}"
          - "{{ _postgresql_restore_service }}"
          - "{{ app_config.app.port }}"
          - "{{ app_config.app.version }}"
      register: _postgresql_restore_apply
      changed_when: true

    - name: PostgreSQL restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  always:
    - name: PostgreSQL restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _postgresql_restore_tmp.path }}"
        state: absent
      when: _postgresql_restore_tmp.path is defined
