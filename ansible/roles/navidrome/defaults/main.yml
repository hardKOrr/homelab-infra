---
navidrome_project_dir: "/opt/{{ instance }}"
navidrome_http_retries: 30
navidrome_http_delay: 5

# Native: Navidrome runs from the upstream .deb as this user (uid/gid app.puid/pgid, which
# match media_storage.owner so it can read the music library) under the package's unit.
navidrome_native: "{{ app_config.hosting.method | default('docker') == 'native' }}"
navidrome_native_user: navidrome
navidrome_native_service: navidrome
navidrome_native_config: /etc/navidrome/navidrome.toml
