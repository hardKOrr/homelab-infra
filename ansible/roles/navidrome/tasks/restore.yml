---
# Restore Navidrome's data directory through the shared swap. The external music library
# is never part of the archive or the swap.
- name: Navidrome restore | Assert data stays inside its named project
  ansible.builtin.assert:
    that:
      - app_config.app.data_path | default('') | length > 0
      - app_config.app.data_path.startswith(navidrome_project_dir.rstrip('/') ~ '/')
      - app_config.app.data_path is not search('(^|/)\.\.?(/|$)')
    fail_msg: >-
      Navidrome restore refuses a data path outside {{ navidrome_project_dir }};
      destructive recovery must not replace the external music library.

- name: Navidrome restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Navidrome restore needs PBS, an explicit snapshot for overwrite=true, and
      overwrite=false for a read-only plan.

# The stack host is an unprivileged LXC's nested Docker: the archive's file modes cannot
# be applied there, so the swap assigns the container user's ownership and the mode.
- name: Navidrome restore | Preview or replace the data directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_ignore_permissions: true
    recovery_swap_paths:
      - path: "{{ app_config.app.data_path }}"
        owner: "{{ app_config.app.puid | default(1313) | int }}"
        group: "{{ app_config.app.pgid | default(1313) | int }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ instance }}"]
    recovery_swap_compose_project: "{{ navidrome_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/ping"
