---
- name: Navidrome backup | Assert data stays inside its named project
  ansible.builtin.assert:
    that:
      - app_config.app.data_path | default('') | length > 0
      - app_config.app.data_path.startswith(navidrome_project_dir.rstrip('/') ~ '/')
      - app_config.app.data_path is not search('(^|/)\.\.?(/|$)')
    fail_msg: >-
      Navidrome backup refuses a data path outside {{ navidrome_project_dir }};
      application recovery must not archive the external music library.

# Navidrome stores its SQLite database, users, playlists and generated state in
# /data. Quiescing the named Compose service before archiving makes that directory
# one application-consistent recovery unit. The music bind is external and is not
# included in the archive.
- name: Navidrome backup | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Navidrome needs its application-consistent backup contract and a configured PBS
      before an on-demand backup can run.

- name: Navidrome backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Navidrome backup | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Navidrome. Deploy PBS and re-run this backup;
      no local archive is treated as a recovery point.

- name: Navidrome backup | Verify the data directory exists
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _navidrome_backup_data
  changed_when: false

- name: Navidrome backup | Refuse an incomplete recovery point
  ansible.builtin.assert:
    that:
      - _navidrome_backup_data.stat.exists
      - _navidrome_backup_data.stat.isdir
    fail_msg: >-
      Navidrome data path {{ app_config.app.data_path }} is missing; refusing to
      create a backup without application state.

- name: Navidrome backup | Stop the named Compose service
  community.docker.docker_compose_v2:
    project_src: "{{ navidrome_project_dir }}"
    state: stopped
    services: ["{{ instance }}"]

- name: Navidrome backup | Archive the quiesced data directory to PBS
  block:
    - name: Navidrome backup | Push one application archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ app_config.app.data_path }}:/source:ro"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - BACKUP_ID
          - --env
          - "RETENTION_DAYS={{ app_config.backup.retention_days | default(14) | int }}"
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client backup data.pxar:/source --backup-id "$BACKUP_ID"
            proxmox-backup-client prune "host/$BACKUP_ID" --keep-daily "$RETENTION_DAYS"
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        BACKUP_ID: "{{ app_config.backup.backup_id | default('', true) or instance }}"
      no_log: true
      changed_when: true

    - name: Navidrome backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Navidrome backup | Start Navidrome after the attempt
      community.docker.docker_compose_v2:
        project_src: "{{ navidrome_project_dir }}"
        state: present
        services: ["{{ instance }}"]
