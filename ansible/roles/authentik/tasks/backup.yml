---
- name: Authentik backup | Back up the registered database
  ansible.builtin.include_tasks: backup-registered.yml
  when: app_config.app.database.instance | default('') | length > 0

- name: Authentik backup | Back up the embedded database
  ansible.builtin.include_tasks: backup-docker.yml
  when: app_config.app.database.instance | default('') | length == 0
