---
# Authentik: Docker Compose on a stack host or Kubernetes with registered PostgreSQL.
# Called from Play 2 of playbooks/apps/authentik.yml. Target: the sso host,
# which already has Docker installed (playbooks/apps/authentik.yml Play 2).
#
# SECRETS — four values, generated once and never regenerated:
#   PG_PASS                     PostgreSQL password
#   AUTHENTIK_SECRET_KEY        session/cookie signing key
#   AUTHENTIK_BOOTSTRAP_PASSWORD  akadmin's password (first start only)
#   AUTHENTIK_BOOTSTRAP_TOKEN     akadmin's API token (first start only) — this is
#                                 what tasks/wiring/authentik.yml authenticates with
#
# The role deploys Authentik and hands back its endpoint and API token, then applies
# the identity surface declared in config/apps/<instance>.yml: groups and accounts
# (directory.yml), flows and their stage bindings (flows.yml, flow-bindings.yml),
# authenticator and MFA stages (authenticators.yml), OAuth login sources
# (sources.yml) and brands (brands.yml). Every one of them is a no-op when its key is
# absent, and none of them touches an object config does not declare.
#
# Continuity: the existing .env is read back before anything is generated, so a
# re-run reuses the same values. Regenerating PG_PASS would lock the server out of
# its own database, and regenerating the API token would strand every wired app.
#
# Guest-held credentials: a containerised database and its client must
# both read the password, so the compose environment file has to exist on the stack
# host. It is 0600 root-owned in a 0750 directory, and is the only file on that host
# holding these values. The API token additionally reaches the controller, where it
# is recorded in gitignored config/.generated/facts.yml for the wiring tasks.
#
# UPDATES — no Watchtower label on this stack. An Authentik upgrade runs database
# migrations and needs server and worker to move together; letting Watchtower pull
# them independently risks a half-migrated cluster. Re-running this playbook is the
# upgrade path: it re-resolves the newest GitHub release and recreates the stack.
#
# Variables available:
#   app_config         — merged defaults + user config (from Play 1)
#   instance           — the instance name
#   homelabinfra_infra — infrastructure facts (may be absent pre-bootstrap)
#
# Exports (read by Play 3 to write the sso registry key):
#   authentik_api_url, authentik_api_token

- name: Resolve Authentik request headers
  ansible.builtin.set_fact:
    _authentik_request_headers:
      Host: >-
        {{ (app_config.routing.subdomain | default(instance, true)) ~ '.' ~ homelabinfra_infra.domain
           if app_config.hosting.method | default('docker') == 'kubernetes' else 'localhost' }}

- name: Resolve Authentik transport and database mode
  ansible.builtin.set_fact:
    _authentik_external_database: "{{ app_config.app.database.instance | default('') | length > 0 }}"
    _authentik_local_url: >-
      {{ 'http://' ~ homelabinfra_infra.kubernetes.ingress_vip
         if app_config.hosting.method | default('docker') == 'kubernetes'
         else 'http://localhost:' ~ app_config.app.port | string }}
    _authentik_public_api_url: >-
      {{ 'https://' ~ (app_config.routing.subdomain | default(instance, true)) ~ '.' ~ homelabinfra_infra.domain
         if app_config.hosting.method | default('docker') == 'kubernetes'
         else 'http://' ~ (ansible_host | default(ansible_default_ipv4.address)) ~ ':' ~ app_config.app.port | string }}

- name: Resolve the image tag and create the directories
  ansible.builtin.import_tasks: main/install.yml

- name: Resolve and store the instance secrets
  ansible.builtin.import_tasks: main/secrets.yml

- name: Deploy the workload and verify its API token
  ansible.builtin.import_tasks: main/workload.yml

# ── Directory as code ─────────────────────────────────────────────────────────
# Groups, accounts and membership declared in config/apps/<instance>.yml. Runs
# here because everything it needs is now proven: the service answers, and the
# token authenticates as an account that can write to the directory. See
# directory.yml for what is and is not managed — in one line, what is declared is
# created and kept correct, and what is not declared is never touched or deleted.
- name: Apply the declared directory
  ansible.builtin.include_tasks: directory.yml

# ── Identity surface as code ──────────────────────────────────────────────────
# Flows, authenticator/MFA stages, stage bindings, OAuth sources and brands. Each
# file is a no-op when its key is absent from config, which is the common case —
# the installer's defaults are a working identity provider on their own.
#
# The order is a dependency chain and is not arbitrary:
#   flows          create the flow instances first — everything below names one
#   authenticators stages may name a configure_flow created above
#   flow-bindings  a binding names both a flow and a stage, so both exist by now
#   sources        name an authentication and an enrolment flow
#   brands         name up to six flows, including ones created in this same run
- name: Apply the declared flows
  ansible.builtin.include_tasks: flows.yml

- name: Apply the declared authenticator and MFA stages
  ansible.builtin.include_tasks: authenticators.yml

- name: Bind the declared stages into their flows
  ansible.builtin.include_tasks: flow-bindings.yml

- name: Apply the declared OAuth sources
  ansible.builtin.include_tasks: sources.yml

- name: Apply the declared brands
  ansible.builtin.include_tasks: brands.yml

# ── Hand the endpoint and token back to the playbook ──────────────────────────
- name: Export the API endpoint to the playbook
  ansible.builtin.set_fact:
    # Direct LAN URL, not https://<instance>.<domain>: during bootstrap neither DNS
    # nor a certificate exists for the public name yet, and the wiring tasks call
    # this API from the controller on every subsequent app deploy.
    authentik_api_url: "{{ _authentik_public_api_url }}"
    authentik_api_token: "{{ _authentik_api_token }}"
    # Deliberately not named authentik_admin_user — a set_fact that reuses the
    # role default's own name is a recursive reference and fails at runtime.
    authentik_admin_username: "{{ authentik_admin_user }}"
    authentik_admin_password: "{{ _authentik_admin_password }}"
  no_log: true

# ── Record the deployed version ───────────────────────────────────────────────
- name: Ensure facts.d directory exists
  when: app_config.hosting.method | default('docker') == 'docker'
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Record deployed version
  when: app_config.hosting.method | default('docker') == 'docker'
  ansible.builtin.copy:
    content: '{"version": "{{ _authentik_tag }}"}'
    dest: /etc/ansible/facts.d/authentik.fact
    mode: "0644"
