---
- name: Authentik restore | Require an existing registered-database target
  ansible.builtin.assert:
    that:
      - restore_destination | default('existing') == 'existing'
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - app_config.app.database.provider == 'postgresql'
      - app_config.app.data_path.startswith('/opt/' ~ instance ~ '/')
      - "'..' not in app_config.app.data_path.split('/')"
    fail_msg: Deploy the intended Authentik target first; new-name recovery is unsupported.

- name: Authentik restore | Swap files and the registered database together
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_pbs_runtime: native
    recovery_swap_archives: [data.pxar, database.pxar]
    recovery_swap_database:
      config: "{{ app_config.app.database }}"
      dump: "database/{{ app_config.app.database.name }}.dump"
    recovery_swap_paths:
      - {path: "{{ app_config.app.data_path }}/media", source: data/media, owner: 1000, group: 1000, mode: "0750", allow_empty: true}
      - {path: "{{ app_config.app.data_path }}/certs", source: data/certs, owner: 1000, group: 1000, mode: "0750", allow_empty: true}
      - {path: "{{ app_config.app.data_path }}/custom-templates", source: data/custom-templates, owner: 1000, group: 1000, mode: "0750", allow_empty: true}
    recovery_swap_stop_services: [server, worker, redis]
    recovery_swap_compose_project: "{{ authentik_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/-/health/ready/"
    recovery_swap_health_status: [200, 204]
