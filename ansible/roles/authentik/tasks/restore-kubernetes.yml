---
- name: Authentik restore | Require an existing target
  ansible.builtin.assert:
    that: restore_destination == 'existing'
    fail_msg: Deploy the intended Authentik target first; new-name recovery is unsupported.

- name: Authentik restore | Require a recent target safety point
  ansible.builtin.include_tasks: ../../../tasks/recovery/require-recent-pre-restore-point.yml
  vars:
    recovery_pre_restore_backup_id: >-
      {{ restore_target_config.backup.backup_id | default('', true) or restore_target }}
  when: restore_overwrite | bool

- name: Authentik restore | Describe the registered target database
  ansible.builtin.include_tasks: ../../../tasks/database/kubernetes-recovery-step.yml
  vars:
    k8s_database_step_source: registered
    k8s_database_step_config: "{{ restore_target_config }}"
    k8s_database_step_instance: "{{ restore_target }}"

- name: Authentik restore | Restore through the shared Kubernetes Job
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Authentik
      archives:
        - {name: data, claim: "{{ restore_target }}-data", owner: "1000:1000"}
      database: "{{ k8s_database_step }}"
      stop: ["{{ restore_target }}"]
      describe: Authentik PostgreSQL database, media, certificates and custom templates
      verify:
        - Sign in with the retained administrator credential and verify both drill canaries.
