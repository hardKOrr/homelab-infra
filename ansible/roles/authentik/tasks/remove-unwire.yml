---
# Remove hook (playbooks/apps/remove.yml, Play 1 on localhost): removing an estate's
# Authentik withdraws its endpoint from homelab-infra/estates/<estate>/sso, when that item
# names this instance. Left in place, the item still points every later app on the estate
# at an Authentik that is gone (its address may by then belong to another guest), and that
# app's Deploy fails in its SSO wiring. With provider none, tasks/resolve-estate.yml gives
# the estate no SSO until its Authentik is deployed again. The secrets stay in the item:
# a redeploy, or a Restore of a recovery point, needs them. The default estate's
# homelab-infra/sso is a platform item every run reads, so it is left alone.
- name: Authentik remove | Resolve the estate's SSO item
  ansible.builtin.set_fact:
    _ak_rm_estate: "{{ app_config.routing.estate | default('', true) }}"
    _ak_rm_instance: >-
      {{ (((homelabinfra_vault.estates | default({}))[app_config.routing.estate | default('', true)]
          | default({})).sso | default({})).instance | default('') }}

- name: Authentik remove | Withdraw the estate's SSO endpoint, keeping its secrets
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/estates/{{ _ak_rm_estate }}/sso"
    vault_item_merge: true
    vault_item_fields:
      provider: none
      host: ""
    vault_item_secret_fields: []
  when:
    - _ak_rm_estate | length > 0
    - _ak_rm_instance == instance
