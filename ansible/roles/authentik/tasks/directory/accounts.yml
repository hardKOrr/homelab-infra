---
# Phase of directory.yml: create and update the declared accounts and set their generated
# passwords. Imported in place; inputs are listed in directory.yml.

# ── Accounts ──────────────────────────────────────────────────────────────
- name: Directory | Assert every membership names a group that will exist
  ansible.builtin.assert:
    that:
      - >-
        _ak_dir_users | map(attribute='groups', default=[]) | flatten
        | reject('in', _ak_dir_group_index.keys() | list)
        | list | length == 0
    fail_msg: >-
      A directory.users entry names a group that does not exist in Authentik and
      is not declared under directory.groups. Declare the group or fix the name.

- name: Directory | List existing accounts
  ansible.builtin.uri:
    url: "{{ _ak_dir_api }}/core/users/?page_size=1000"
    method: GET
    headers: "{{ _ak_dir_headers }}"
    status_code: 200
  register: _ak_dir_user_list
  changed_when: false
  no_log: true

- name: Directory | Index existing accounts by username
  ansible.builtin.set_fact:
    _ak_dir_user_index: >-
      {{ dict((_ak_dir_user_list.json.results | default([]) | map(attribute='username') | list)
              | zip(_ak_dir_user_list.json.results | default([]))) }}
  no_log: true

# Accounts needing a password: the ones being created, plus the ones whose
# declaration asks for a rotation. An existing account nobody asked to rotate
# keeps whatever password its owner set.
- name: Directory | Select the accounts needing a password
  ansible.builtin.set_fact:
    _ak_dir_missing_users: >-
      {{ _ak_dir_users | rejectattr('username', 'in', _ak_dir_user_index.keys() | list) | list }}
    _ak_dir_password_targets: >-
      {{ (_ak_dir_users | rejectattr('username', 'in', _ak_dir_user_index.keys() | list) | list)
         + (_ak_dir_users | selectattr('username', 'in', _ak_dir_user_index.keys() | list)
            | selectattr('rotate_password', 'defined')
            | selectattr('rotate_password') | list) }}
  no_log: true

- name: Directory | Generate a password for each of them
  ansible.builtin.set_fact:
    _ak_dir_passwords: >-
      {{ _ak_dir_passwords | default({})
         | combine({item: lookup('password', '/dev/null length=28 chars=ascii_letters,digits')}) }}
  loop: "{{ _ak_dir_password_targets | map(attribute='username') | list }}"
  no_log: true

# Stored before it is applied, and merged into the estate's canonical item so
# the token, admin password and database credentials already there survive.
- name: Directory | Store the generated passwords before applying them
  ansible.builtin.include_tasks: ../../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "{{ _authentik_vault_item }}"
    vault_item_fields: "{{ {'user_' ~ item.key ~ '_password': item.value} }}"
    vault_item_secret_fields: ["user_{{ item.key }}_password"]
    vault_item_merge: true
  loop: "{{ _ak_dir_passwords | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Directory | Create declared accounts
  ansible.builtin.uri:
    url: "{{ _ak_dir_api }}/core/users/"
    method: POST
    headers: "{{ _ak_dir_headers }}"
    body_format: json
    body: >-
      {{ {'username': item.username,
          'name': item.name | default(item.username, true),
          'email': item.email | default(''),
          'is_active': item.is_active | default(true) | bool,
          'type': item.type | default('internal'),
          'path': item.path | default('users'),
          'attributes': item.attributes | default({}, true),
          'groups': item.groups | default([]) | map('extract', _ak_dir_group_index, 'pk') | list} }}
    status_code: 201
  loop: "{{ _ak_dir_missing_users }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: true
  no_log: true

- name: Directory | Update declared accounts that drifted
  ansible.builtin.uri:
    url: "{{ _ak_dir_api }}/core/users/{{ _ak_dir_user_index[item.username].pk }}/"
    method: PATCH
    headers: "{{ _ak_dir_headers }}"
    body_format: json
    # username is deliberately absent from the body: it identifies the account
    # being patched, and this file has no way to tell a rename from a different
    # person.
    body: >-
      {{ {'name': item.name | default(item.username, true),
          'email': item.email | default(''),
          'is_active': item.is_active | default(true) | bool,
          'type': item.type | default('internal'),
          'attributes': item.attributes | default({}, true),
          'groups': item.groups | default([]) | map('extract', _ak_dir_group_index, 'pk') | list} }}
    status_code: 200
  loop: "{{ _ak_dir_users | selectattr('username', 'in', _ak_dir_user_index.keys() | list) | list }}"
  loop_control:
    label: "{{ item.username }}"
  when: >-
    (_ak_dir_user_index[item.username].name | default('')) != (item.name | default(item.username, true))
    or (_ak_dir_user_index[item.username].email | default('')) != (item.email | default(''))
    or (_ak_dir_user_index[item.username].is_active | default(true) | bool)
       != (item.is_active | default(true) | bool)
    or (_ak_dir_user_index[item.username].attributes | default({}, true))
       != (item.attributes | default({}, true))
    or (_ak_dir_user_index[item.username].groups | default([]) | map('string') | sort | list)
       != (item.groups | default([]) | map('extract', _ak_dir_group_index, 'pk')
           | map('string') | sort | list)
  changed_when: true
  no_log: true

# Re-read so the password calls below address accounts created moments ago.
- name: Directory | Re-list accounts after creating them
  ansible.builtin.uri:
    url: "{{ _ak_dir_api }}/core/users/?page_size=1000"
    method: GET
    headers: "{{ _ak_dir_headers }}"
    status_code: 200
  register: _ak_dir_user_list
  changed_when: false
  no_log: true
  when: _ak_dir_passwords | default({}) | length > 0

- name: Directory | Re-index accounts by username
  ansible.builtin.set_fact:
    _ak_dir_user_index: >-
      {{ dict((_ak_dir_user_list.json.results | default([]) | map(attribute='username') | list)
              | zip(_ak_dir_user_list.json.results | default([]))) }}
  no_log: true
  when: _ak_dir_passwords | default({}) | length > 0

# 204 is the documented answer; 200 is accepted because older releases returned it.
- name: Directory | Apply the generated passwords
  ansible.builtin.uri:
    url: "{{ _ak_dir_api }}/core/users/{{ _ak_dir_user_index[item.key].pk }}/set_password/"
    method: POST
    headers: "{{ _ak_dir_headers }}"
    body_format: json
    body: "{{ {'password': item.value} }}"
    status_code: [200, 204]
  loop: "{{ _ak_dir_passwords | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true
  no_log: true
