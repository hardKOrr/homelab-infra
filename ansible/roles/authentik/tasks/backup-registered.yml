---
- name: Authentik backup | Require application-consistent recovery
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - app_config.app.database.provider == 'postgresql'
      - app_config.app.data_path.startswith('/opt/' ~ instance ~ '/')
      - "'..' not in app_config.app.data_path.split('/')"

- name: Authentik backup | Allocate database dump staging
  ansible.builtin.tempfile:
    state: directory
    path: /var/tmp
    prefix: authentik-backup-
  register: _authentik_backup_scratch

- name: Authentik backup | Archive database and application files together
  block:
    - name: Authentik backup | Quiesce writers and push the paired archives
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: native
        pbs_client_compose_project: "{{ authentik_project_dir }}"
        pbs_client_stop_services: [server, worker, redis]
        pbs_client_quiesced_hook: "{{ role_path }}/tasks/backup-quiesced.yml"
        pbs_client_archives:
          - {name: database.pxar, path: "{{ _authentik_backup_scratch.path }}"}
          - {name: data.pxar, path: "{{ app_config.app.data_path }}"}

    - name: Authentik backup | Mark the paired backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    - name: Authentik backup | Remove private database dump staging
      ansible.builtin.file:
        path: "{{ _authentik_backup_scratch.path }}"
        state: absent
