---
# Phase of main.yml: resolve the estate-scoped SSO item, refuse to replace credentials of
# an initialized database, reuse or generate the secrets and store them. Imported in
# place; inputs are listed in main.yml.

# ── Secrets ───────────────────────────────────────────────────────────────────
# ESTATE SCOPE. An estate's Authentik is an ordinary app deploy carrying
# routing.estate (slice 008), and its credentials belong to that estate alone. Both
# the canonical vault item and the continuity read below are therefore scoped by it:
#
#   default estate   homelab-infra/sso                  -> homelabinfra_infra.sso
#   named estate     homelab-infra/estates/<name>/sso   -> ...infra.estates.<name>.sso
#
# The fixed name cost a live run to find, 2026-08-15. Deploying the second estate's
# Authentik (execution 151) wrote its host, admin password, Postgres password and
# secret key over the PLATFORM's homelab-infra/sso item, and the continuity read
# below — pointed at the unscoped fact — handed the new instance the platform
# Authentik's own API token, so two independent identity providers accepted one
# credential. `resolve-estate.yml` then found no token under estates.<name>.sso and
# the estate app's wiring failed its contract assert (execution 152). The name that
# `write-generated-facts.yml` already scopes by estate has to be scoped here too.

- name: Resolve the estate this instance belongs to
  ansible.builtin.set_fact:
    _authentik_estate: "{{ app_config.routing.estate | default('', true) }}"

- name: Resolve the estate-scoped SSO names
  ansible.builtin.set_fact:
    _authentik_vault_item: >-
      {{ 'homelab-infra/sso' if _authentik_estate | length == 0
         else 'homelab-infra/estates/' ~ _authentik_estate ~ '/sso' }}
    # The recorded facts for THIS instance — never another estate's, so a second
    # estate cannot inherit the first's token through a re-run.
    _authentik_recorded_sso: >-
      {{ (homelabinfra_infra.sso | default({}))
         if _authentik_estate | length == 0
         else ((homelabinfra_infra.estates | default({}))[_authentik_estate]
               | default({})).sso | default({}) }}

- name: Read the existing compose environment (secret continuity across re-runs)
  when: app_config.hosting.method | default('docker') == 'docker'
  ansible.builtin.slurp:
    src: "{{ authentik_env_file }}"
  register: _authentik_env_current
  failed_when: false
  no_log: true

- name: Parse the existing compose environment
  when: app_config.hosting.method | default('docker') == 'docker'
  ansible.builtin.set_fact:
    _authentik_env_existing: >-
      {{ dict((_authentik_env_current.content | b64decode).splitlines()
              | select('match', '^[A-Z_]+=')
              | map('split', '=', 1))
         if _authentik_env_current.content is defined else {} }}
  no_log: true

- name: Check whether this instance already has a PostgreSQL database
  when: app_config.hosting.method | default('docker') == 'docker'
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}/database/PG_VERSION"
  register: _authentik_database_marker
  changed_when: false

# Remove with delete_data=true deletes /opt/<instance>, including the local compose
# environment. A later Deploy must therefore recover every database and signing
# credential from this estate's canonical Vaultwarden SSO item. If both copies of an
# initialized instance's credentials are missing, fail before writing new ones.

- name: Refuse to replace credentials for an initialized database
  ansible.builtin.assert:
    that:
      - >-
        ((_authentik_env_existing | default({})).PG_PASS | default('', true) | length > 0)
        or (_authentik_recorded_sso.postgres_password | default('', true) | length > 0)
      - >-
        ((_authentik_env_existing | default({})).AUTHENTIK_SECRET_KEY | default('', true) | length > 0)
        or (_authentik_recorded_sso.secret_key | default('', true) | length > 0)
      - >-
        ((_authentik_env_existing | default({})).AUTHENTIK_BOOTSTRAP_PASSWORD | default('', true) | length > 0)
        or (_authentik_recorded_sso.admin_password | default('', true) | length > 0)
      - >-
        ((_authentik_env_existing | default({})).AUTHENTIK_BOOTSTRAP_TOKEN | default('', true) | length > 0)
        or (_authentik_recorded_sso.token | default('', true) | length > 0)
    fail_msg: >-
      Authentik {{ instance }} already has a PostgreSQL database but one or more
      credentials are missing from both its compose environment and its estate-scoped
      Vaultwarden SSO item. Restore that item before deploying; generating replacements
      would strand the database and every credential-dependent client.
  when: _authentik_database_marker.stat.exists | default(false)
  no_log: true

# Registered PostgreSQL has no local PG_VERSION marker. Inspect the backend before
# generating anything: bootstrap variables never replace credentials in an existing schema.
- name: Resolve the registered database for credential continuity
  ansible.builtin.include_tasks: ../../../../tasks/database/resolve-app-database.yml
  vars:
    database_app_instance: "{{ instance }}"
    database_app_config: "{{ app_config.app.database }}"
  when: _authentik_external_database | bool

- name: Check the registered database for the Authentik schema
  ansible.builtin.command:
    argv:
      - psql
      - --tuples-only
      - --no-align
      - --username=postgres
      - "--dbname={{ database_app_target.name }}"
      - "--port={{ database_app_target.port }}"
      - "--command=SELECT to_regclass('public.authentik_core_user') IS NOT NULL"
  delegate_to: database_app_target
  become: true
  become_user: postgres
  register: _authentik_registered_schema
  changed_when: false
  when: _authentik_external_database | bool

- name: Require a definitive registered database schema check
  ansible.builtin.assert:
    that: _authentik_registered_schema.stdout | trim in ['t', 'f']
    fail_msg: Could not determine whether the registered Authentik database is initialized.
  when: _authentik_external_database | bool

- name: Refuse to replace credentials for an initialized registered database
  ansible.builtin.assert:
    that:
      - _authentik_recorded_sso.secret_key | default('', true) | length > 0
      - _authentik_recorded_sso.admin_password | default('', true) | length > 0
      - _authentik_recorded_sso.token | default('', true) | length > 0
    fail_msg: >-
      Authentik {{ instance }} already has a schema on its registered PostgreSQL backend
      but its estate-scoped Vaultwarden SSO credentials are incomplete. Restore that
      item before deploying; generating replacements would strand encrypted data and
      credential-dependent clients. The database login is managed separately.
  when:
    - _authentik_external_database | bool
    - _authentik_registered_schema.stdout | trim == 't'
  no_log: true

- name: Resolve secrets (reuse what exists, generate only what is missing)
  ansible.builtin.set_fact:
    _authentik_pg_pass: >-
      {{ (app_config.app.database_password if _authentik_external_database
          else (_authentik_env_existing | default({})).PG_PASS)
         | default(_authentik_recorded_sso.postgres_password | default(''), true)
         | default(lookup('password', '/dev/null length=40 chars=ascii_letters,digits'), true) }}
    _authentik_secret_key: >-
      {{ (_authentik_env_existing | default({})).AUTHENTIK_SECRET_KEY
         | default(_authentik_recorded_sso.secret_key | default(''), true)
         | default(lookup('password', '/dev/null length=60 chars=ascii_letters,digits'), true) }}
    _authentik_admin_password: >-
      {{ (_authentik_env_existing | default({})).AUTHENTIK_BOOTSTRAP_PASSWORD
         | default(_authentik_recorded_sso.admin_password | default(''), true)
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
    _authentik_api_token: >-
      {{ _authentik_recorded_sso.token
         | default((_authentik_env_existing | default({})).AUTHENTIK_BOOTSTRAP_TOKEN
                   | default(lookup('password', '/dev/null length=60 chars=ascii_letters,digits'), true),
                   true) }}
  no_log: true

- name: Store Authentik secrets before applying them
  ansible.builtin.include_tasks: ../../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "{{ _authentik_vault_item }}"
    # directory.yml stores generated account passwords in this same item.
    vault_item_merge: true
    vault_item_fields:
      provider: authentik
      instance: "{{ instance }}"
      host: "{{ _authentik_public_api_url if _authentik_public_api_url is defined else 'http://' ~ (ansible_host | default(ansible_default_ipv4.address)) ~ ':' ~ app_config.app.port | string }}"
      token: "{{ _authentik_api_token }}"
      admin_user: "{{ authentik_admin_user }}"
      admin_password: "{{ _authentik_admin_password }}"
      postgres_password: "{{ _authentik_pg_pass }}"
      secret_key: "{{ _authentik_secret_key }}"
    vault_item_secret_fields:
      - token
      - admin_password
      - postgres_password
      - secret_key
