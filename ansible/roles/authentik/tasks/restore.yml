---
- name: Authentik restore | Dispatch Kubernetes recovery
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method | default('docker') == 'kubernetes'

- name: Authentik restore | Dispatch registered database recovery on Docker
  ansible.builtin.include_tasks: restore-registered.yml
  when:
    - app_config.hosting.method | default('docker') == 'docker'
    - app_config.app.database.instance | default('') | length > 0

- name: Authentik restore | Restore the embedded database
  ansible.builtin.include_tasks: restore-docker.yml
  when:
    - app_config.hosting.method | default('docker') == 'docker'
    - app_config.app.database.instance | default('') | length == 0
