---
- name: Restart InfluxDB
  ansible.builtin.systemd:
    name: "{{ app_config.app.service_name }}"
    state: restarted
  when: not (influxdb_docker | bool)
- name: Restart InfluxDB container
  community.docker.docker_compose_v2:
    project_src: "{{ influxdb_project_dir }}"
    state: present
    recreate: always
  when: influxdb_docker | bool
