---
# Restore one complete InfluxDB data directory through the shared swap. The previous
# directory stays beside the live path until the health and operator-token checks pass.
- name: InfluxDB restore | Resolve the service and credentials
  ansible.builtin.set_fact:
    _influxdb_restore_service_name: "{{ app_config.app.service_name | default('influxdb') }}"
    _influxdb_restore_source_instance: "{{ restore_source_instance | default(instance, true) }}"
    _influxdb_restore_target_backup_id: >-
      {{ restore_target_backup_id | default(app_config.backup.backup_id | default('', true)
         or restore_target | default(instance, true), true) }}
    _influxdb_restore_source_credentials: >-
      {{ (homelabinfra_vault.apps | default({})).get(
           restore_source_instance | default(instance, true), {}) }}
    _influxdb_restore_target_credentials: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}) }}
  no_log: true

- name: InfluxDB restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - app_config.app.data_path | default('') is match('^/[^/].*')
      - _influxdb_restore_source_instance is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      InfluxDB restore needs its application-consistent contract, an absolute data path, a
      safe source identity, PBS, and a selected recovery point for overwrite=true.

- name: InfluxDB restore | Require a source credential set
  ansible.builtin.assert:
    that:
      - _influxdb_restore_source_credentials.admin_user | default('') | length > 0
      - _influxdb_restore_source_credentials.admin_password | default('') | length > 0
      - _influxdb_restore_source_credentials.operator_token | default('') | length > 0
      - _influxdb_restore_source_credentials.organization | default('') | length > 0
      - _influxdb_restore_source_credentials.bucket | default('') | length > 0
    fail_msg: >-
      InfluxDB restore cannot authenticate the restored state because the source
      credentials are missing from homelab-infra/apps/{{ _influxdb_restore_source_instance }}.
  no_log: true

- name: InfluxDB restore | Require target credentials for rollback
  ansible.builtin.assert:
    that:
      - _influxdb_restore_target_credentials.admin_user | default('') | length > 0
      - _influxdb_restore_target_credentials.admin_password | default('') | length > 0
      - _influxdb_restore_target_credentials.operator_token | default('') | length > 0
      - _influxdb_restore_target_credentials.organization | default('') | length > 0
      - _influxdb_restore_target_credentials.bucket | default('') | length > 0
    fail_msg: >-
      InfluxDB restore cannot protect the target because its current credentials are
      missing from homelab-infra/apps/{{ instance }}.
  when: restore_overwrite | bool
  no_log: true

- name: InfluxDB restore | Require an independent existing-target point
  ansible.builtin.assert:
    that:
      - restore_pre_restore_point is defined
      - restore_pre_restore_point.startswith('host/' ~ _influxdb_restore_target_backup_id ~ '/')
      - restore_pre_restore_point | length > ('host/' ~ _influxdb_restore_target_backup_id ~ '/') | length
      - restore_pre_restore_point != restore_snapshot
    fail_msg: >-
      Existing-target InfluxDB restore needs a distinct pre_restore_point from
      host/{{ _influxdb_restore_target_backup_id }}/.
  when:
    - restore_destination | default('existing') == 'existing'
    - restore_overwrite | bool

- name: InfluxDB restore | Require the service to be active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ _influxdb_restore_service_name }}"]
  register: _influxdb_restore_service_state
  failed_when: false
  changed_when: false
  when: restore_overwrite | bool

- name: InfluxDB restore | Refuse an inactive target
  ansible.builtin.assert:
    that: _influxdb_restore_service_state.stdout | trim == 'active'
    fail_msg: >-
      InfluxDB service {{ _influxdb_restore_service_name }} is not active; restore the
      service before replacing its data.
  when: restore_overwrite | bool

- name: InfluxDB restore | Preview or replace the data directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: native
    recovery_swap_pre_restore_backup_id: "{{ _influxdb_restore_target_backup_id }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.data_path }}"
        owner: influxdb
        group: influxdb
        mode: "0750"
    recovery_swap_stop_services: ["{{ _influxdb_restore_service_name }}"]
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_health_url: "http://127.0.0.1:{{ app_config.app.port }}/health"
    recovery_swap_health_retries: 30
    recovery_swap_health_delay: 2
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"
    recovery_swap_rollback_hook: "{{ role_path }}/tasks/restore-rollback.yml"
