---
# recovery-restore.yml after-restore hook. A full restore replaces the target's operator
# token with the point's, so the copies the isolated Deploy made in the namespace go stale:
# the workload's setup Secret and the backup CronJob's login. Without this the next
# scheduled (or on-demand) backup would authenticate with a token the server no longer has.
# Only a new target holds credentials that differ; an existing one restores its own.
- name: InfluxDB restore | Sync the restored credentials into the workload Secret
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ restore_target }}"
    k8s_secret_data:
      admin-password: "{{ _influxdb_restore_source_credentials.admin_password }}"
      operator-token: "{{ _influxdb_restore_source_credentials.operator_token }}"
  when: restore_destination | default('existing') == 'new'
  no_log: true

- name: InfluxDB restore | Look for the target's backup login
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace, "{{ k8s_namespace }}", get, secret, "{{ restore_target }}-backup", -o, name]
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _influxdb_backup_secret
  failed_when: false
  changed_when: false
  when: restore_destination | default('existing') == 'new'

# Only the database login changes; the PBS and notification keys stay as Deploy wrote them.
- name: InfluxDB restore | Point the backup login at the restored token
  ansible.builtin.command:
    argv: [k3s, kubectl, --namespace, "{{ k8s_namespace }}", patch, secret, "{{ restore_target }}-backup",
           --type, merge, --patch-file, /dev/stdin]
    stdin: >-
      {{ {'data': {'db-password': _influxdb_restore_source_credentials.operator_token | b64encode}} | to_json }}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  changed_when: true
  no_log: true
  when:
    - restore_destination | default('existing') == 'new'
    - _influxdb_backup_secret.rc == 0
