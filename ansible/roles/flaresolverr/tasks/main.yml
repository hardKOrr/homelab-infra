---
# FlareSolverr on a guest: Docker on a stack host, or native on its own LXC or VM.
# Stateless: nothing to back up or restore.
- name: FlareSolverr | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method == 'docker'

- name: FlareSolverr | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method == 'native'
