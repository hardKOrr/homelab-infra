---
# FlareSolverr on Docker on a stack host (hosting.method: docker). Prowlarr reaches it at
# http://<stack host address>:<app.port>.
# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot.
- name: FlareSolverr | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "/opt/{{ instance }}"
    compose_health:
      url: "http://127.0.0.1:{{ app_config.app.port }}/"
