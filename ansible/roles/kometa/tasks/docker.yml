---
# Kometa on a Docker stack host (hosting.method: docker). Kubernetes has its own entry
# (kubernetes.yml), native on its own guest is native.yml. Kometa keeps only a cache and logs under /config; its credentials-bearing
# config.yml stays canonical in Vaultwarden and is rewritten each deploy, so there is no
# data to back up or restore.

- name: Kometa | Read and validate the operator-owned configuration
  ansible.builtin.include_tasks: config.yml

- name: Kometa | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ kometa_project_dir }}"
    - "{{ app_config.app.config_path }}"

- name: Kometa | Write the operator-owned configuration files
  ansible.builtin.include_tasks: files.yml
  vars:
    _kometa_files_owner: root

# The shared Compose deploy recreates the container when the Compose file or a written
# configuration file changed, in the same up that creates it, so a new install is never
# restarted mid first run.
- name: Kometa | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ kometa_project_dir }}"
    compose_recreate: >-
      {{ _kometa_files_written.changed | default(false)
         or _kometa_collections_removed.changed | default(false) }}

- name: Kometa | Read the container state
  community.docker.docker_container_info:
    name: "{{ instance }}"
  register: _kometa_container
  changed_when: false
  retries: 6
  delay: 5
  until: _kometa_container.container.State.Running | default(false) | bool

- name: Kometa | Assert Kometa is running
  ansible.builtin.assert:
    that: _kometa_container.container.State.Running | default(false) | bool
    fail_msg: Kometa is not running. Check docker logs {{ instance }} on the stack host.
