---
- name: Restart kometa
  community.docker.docker_compose_v2:
    project_src: "{{ kometa_project_dir }}"
    state: present
    recreate: always
  when: not (kometa_native | bool)

- name: Restart kometa service
  ansible.builtin.systemd:
    name: "{{ instance }}"
    state: restarted
    daemon_reload: true
  when: kometa_native | bool
  listen: Restart kometa
