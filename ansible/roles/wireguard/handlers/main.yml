---
- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ app_config.app.interface }}"
    state: restarted
  when: not (wireguard_docker | bool)

- name: Restart WireGuard container
  community.docker.docker_compose_v2:
    project_src: "{{ wireguard_project_dir }}"
    state: restarted
  when: wireguard_docker | bool
