---
# The native wg-quick unit's restart. On Docker, tasks/stack/compose-deploy.yml recreates
# the project itself when the Compose file or wg-quick config changes.
- name: Restart WireGuard
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["wg-quick@{{ app_config.app.interface }}"]
  when: not (wireguard_docker | bool)
