---
- name: WireGuard restore | Require Docker recovery
  ansible.builtin.assert:
    that:
      - restore_target_config.hosting.method | default('native') == 'docker'
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined

- name: WireGuard restore | Preview or swap the tunnel configuration
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ wireguard_project_dir }}/config"
        owner: root
        group: root
        mode: "0700"
    recovery_swap_stop_services: ["{{ app_config.app.service_name | default('wireguard') }}"]
    recovery_swap_compose_project: "{{ wireguard_project_dir }}"
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"
