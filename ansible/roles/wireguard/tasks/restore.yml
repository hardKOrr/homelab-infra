---
- name: WireGuard restore | Use the shared Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) == 'kubernetes'

- name: WireGuard restore | Use the restore swap on a Docker guest
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('native')) != 'kubernetes'
