---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before provisioning). The WAN forward
# targets app.port, and a Docker WireGuard needs a stack of its own: it takes the guest's
# UDP port and kernel module settings, which no other app on a stack should share.
# Every other app's default stack, read from its defaults file as text (the defaults hold
# templates this hook cannot render).
- name: WireGuard | Refuse a stack another app deploys to
  ansible.builtin.assert:
    that: _wg_shared_with | length == 0
    fail_msg: >-
      WireGuard on Docker needs its own stack, but {{ app_config.stack }} is the default
      stack of {{ _wg_shared_with | join(', ') }}. Name a stack no other app uses.
    quiet: true
  vars:
    _wg_shared_with: >-
      {%- set out = [] -%}
      {%- for path in query('ansible.builtin.fileglob', _wg_defaults_dir ~ '/*.yml') | sort -%}
      {%- set name = path | basename | splitext | first -%}
      {%- if not name.startswith('_') and name != 'wireguard'
            and app_config.stack in (lookup('ansible.builtin.file', path)
                                     | regex_findall('(?m)^  stack: *["\']?([A-Za-z0-9_.-]+)')) -%}
      {%- set _ = out.append(name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _wg_defaults_dir: "{{ playbook_dir }}/../../vars/app-defaults"
  when: app_config.hosting.method == 'docker'

- name: WireGuard | Hand deploy.yml the forwarded port
  ansible.builtin.set_fact:
    firewall_inbound_ports:
      wireguard: "{{ app_config.app.port }}"
