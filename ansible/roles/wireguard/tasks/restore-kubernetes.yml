---
# The shared restore Job replaces the whole config volume. The pod's init step then
# re-renders the managed interface from the Deployed Secret (declared peers, Vaultwarden
# keys), so keep those consistent with the recovery point as on the guest methods.
- name: WireGuard Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: WireGuard
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "0:0"
      stop:
        - "{{ restore_target }}"
      describe: >-
        the {{ restore_target }}-config volume with WireGuard's wg_confs tunnel configuration
      verify:
        - >-
          Check `wg show {{ app_config.app.interface }}` in the restored pod, then connect a
          peer through the endpoint and reach the lab.
