---
# The config tree contains tunnel keys and persistent wg-quick configuration.
- name: WireGuard backup | Require Docker recovery
  ansible.builtin.assert:
    that:
      - wireguard_docker | bool
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined

- name: WireGuard backup | Archive the stopped tunnel configuration
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "{{ wireguard_project_dir }}"
    pbs_client_stop_services: ["{{ app_config.app.service_name | default('wireguard') }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ wireguard_project_dir }}/config"

- name: WireGuard backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
