---
- name: Read Emby's current encoding settings
  ansible.builtin.uri:
    url: "{{ _emby_base }}/System/Configuration/encoding"
    headers:
      X-Emby-Token: "{{ _emby_token_header }}"
    return_content: true
    status_code: 200
  register: _emby_encoding_options_before
  changed_when: false
  no_log: true

- name: Resolve Emby's desired hardware encoding settings
  ansible.builtin.set_fact:
    _emby_hardware_acceleration_type: >-
      {{ 'vaapi' if _emby_dri_device_declared | bool else 'none' }}
    _emby_hardware_encoding_enabled: "{{ _emby_dri_device_declared | bool }}"
    _emby_hardware_decoding_codecs: >-
      {{ ((_emby_encoding_options_before.json.HardwareDecodingCodecs
           | default([], true) | list)
          + (['hevc'] if _emby_dri_device_declared | bool else [])) | unique | list }}

- name: Resolve Emby's complete desired encoding options
  ansible.builtin.set_fact:
    _emby_encoding_options_desired: >-
      {{ _emby_encoding_options_before.json
         | combine(
             {
               'HardwareAccelerationType': 'vaapi' if _emby_dri_device_declared | bool else 'none',
               'EnableHardwareEncoding': _emby_dri_device_declared | bool
             }
             | combine(
                 {'HardwareDecodingCodecs': _emby_hardware_decoding_codecs}
                 if _emby_dri_device_declared | bool else {},
                 recursive=True
               ),
             recursive=True
           ) }}
  no_log: true

- name: Save Emby's hardware encoding settings
  ansible.builtin.uri:
    url: "{{ _emby_base }}/System/Configuration/encoding"
    method: POST
    headers:
      X-Emby-Token: "{{ _emby_token_header }}"
    body_format: json
    body: "{{ _emby_encoding_options_desired }}"
    status_code: [200, 204]
  when: _emby_encoding_options_desired != _emby_encoding_options_before.json
  changed_when: true
  no_log: true

- name: Read Emby's encoding settings back
  ansible.builtin.uri:
    url: "{{ _emby_base }}/System/Configuration/encoding"
    headers:
      X-Emby-Token: "{{ _emby_token_header }}"
    return_content: true
    status_code: 200
  register: _emby_encoding_options_after
  until: >-
    (_emby_encoding_options_after.json.HardwareAccelerationType | default('none') | lower)
      == _emby_hardware_acceleration_type
    and
    (_emby_encoding_options_after.json.EnableHardwareEncoding | default(false) | bool)
      == (_emby_hardware_encoding_enabled | bool)
    and
    (not (_emby_dri_device_declared | bool)
     or 'hevc' in (_emby_encoding_options_after.json.HardwareDecodingCodecs | default([], true)))
  retries: 10
  delay: 1
  changed_when: false
  no_log: true

- name: Assert Emby applied the requested hardware transcoding settings
  ansible.builtin.assert:
    that:
      - (_emby_encoding_options_after.json.HardwareAccelerationType | default('none') | lower) == _emby_hardware_acceleration_type
      - (_emby_encoding_options_after.json.EnableHardwareEncoding | default(false) | bool) == (_emby_hardware_encoding_enabled | bool)
      - not (_emby_dri_device_declared | bool) or 'hevc' in (_emby_encoding_options_after.json.HardwareDecodingCodecs | default([], true))
    fail_msg: >-
      Emby encoding settings did not match the declared DRI device: expected
      {{ _emby_hardware_acceleration_type }} acceleration and hardware encoding
      {{ 'enabled' if _emby_hardware_encoding_enabled | bool else 'disabled' }}.
