---
# Replace the target's config PVC through the shared Kubernetes recovery Job, then prove the
# restored server like the Docker path does. The NFS media shares are not part of the archive.
- name: Emby Kubernetes restore | Assert the recovery contract before changing the target
  ansible.builtin.include_tasks: restore-contract.yml

- name: Emby Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Emby
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "{{ restore_target_config.app.puid | default(1313) }}:{{ restore_target_config.app.pgid | default(1313) }}"
      stop:
        - "{{ restore_target }}"
      describe: >-
        Emby's complete config database (its users, library definitions and settings) from
        its config volume; the shared media is not included
      verify:
        - >-
          Open the Emby URL and sign in with the source instance's Emby account, then
          check that its libraries are present.

- name: Emby Kubernetes restore | Verify the restored server and record its account
  ansible.builtin.include_tasks: restore-verified.yml
  vars:
    _emby_restore_instance: "{{ restore_target }}"
    _emby_restore_base: "http://{{ k8s_cluster_facts.ingress_vip }}/emby"
    _emby_restore_headers:
      Host: >-
        {{ restore_target_config.routing.subdomain | default(restore_target, true) }}.{{ homelabinfra_infra.domain }}
  when: _application_restore_complete | default(false) | bool
