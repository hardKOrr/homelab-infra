---
# Emby on Docker on the stack host, or natively on its own guest (native.yml). The Kubernetes
# path is kubernetes.yml.
- name: Resolve Emby's API base on the stack host
  ansible.builtin.set_fact:
    _emby_base: "http://localhost:{{ app_config.app.port }}/emby"
    _emby_host_headers: {}

- name: Resolve Emby's storage paths and libraries
  ansible.builtin.include_tasks: resolve.yml

- name: Configure Emby access to declared DRI devices
  ansible.builtin.include_tasks: configure-devices.yml

- name: Create Emby project directory
  ansible.builtin.file:
    path: "{{ emby_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: not (emby_native | bool)

- name: Create Emby config directory
  ansible.builtin.file:
    path: "{{ app_config.app.config_path }}"
    state: directory
    owner: "{{ app_config.app.puid | default(1313) }}"
    group: "{{ app_config.app.pgid | default(1313) }}"
    mode: "0750"
  when: not (emby_native | bool)

- name: Verify media mounts are present on the stack host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: _emby_mount_checks
  loop: "{{ _emby_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Assert every declared media mount is present
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir
    fail_msg: >-
      {{ item.item.path }} is not present on this stack host. It is declared by
      media_storage.mounts, so verify that the existing Proxmox mount was attached.
  loop: "{{ _emby_mount_checks.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Ensure each Emby library path exists
  ansible.builtin.file:
    path: "{{ item._root }}/{{ item.subpath }}"
    state: directory
    owner: "{{ app_config.app.puid | default(1313) }}"
    group: "{{ app_config.app.pgid | default(1313) }}"
    mode: "0775"
  loop: "{{ _emby_libraries }}"
  loop_control:
    label: "{{ item._root }}/{{ item.subpath }}"
  register: _emby_library_dirs
  failed_when: false

- name: Assert Emby can use its library paths
  ansible.builtin.assert:
    that: not (_emby_library_dirs.results | selectattr('failed', 'defined')
               | selectattr('failed') | list | length > 0)
    fail_msg: >-
      Emby cannot create one of its library paths under {{ _emby_library_root }}. Check
      the ownership of the existing media mount against media_storage.owner.

- name: Resolve and save Emby's admin credentials
  ansible.builtin.include_tasks: credentials.yml

# The shared Compose deploy recreates the container when the Compose file changed, in the
# same up that creates it, so a new install is never restarted mid first boot. The checks
# below wait for Emby's full system information, not only a 200.
- name: Deploy Emby's Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ emby_project_dir }}"
  when: not (emby_native | bool)

- name: Deploy Emby natively
  ansible.builtin.include_tasks: native.yml
  when: emby_native | bool

- name: Apply pending Emby restarts
  ansible.builtin.meta: flush_handlers

- name: Configure Emby through its API
  ansible.builtin.include_tasks: configure.yml

- name: Export Emby's endpoint for platform wiring
  ansible.builtin.set_fact:
    emby_url: "http://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ app_config.app.port }}"
