---
# Emby creates its first administrator without a password. Use this helper during
# first-run setup and when resuming an interrupted setup to set the role-owned password.
- name: Emby | Authenticate the initial administrator without a password
  ansible.builtin.uri:
    url: "{{ _emby_base }}/Users/AuthenticateByName"
    method: POST
    headers:
      X-Emby-Authorization: >-
        MediaBrowser Client="{{ emby_client_name }}", Device="{{ emby_device_name }}",
        DeviceId="{{ emby_client_name }}-{{ instance }}", Version="1.0.0"
    body_format: json
    body:
      Username: "{{ _emby_user }}"
      Pw: ""
    status_code: [200, 401]
  register: _emby_bootstrap_auth
  changed_when: false
  no_log: true

- name: Emby | Assert the initial administrator is passwordless and available
  ansible.builtin.assert:
    that:
      - _emby_bootstrap_auth.status == 200
      - (_emby_bootstrap_auth.json.AccessToken | default('')) | length > 0
      - (_emby_bootstrap_auth.json.User.Id | default('')) | length > 0
    fail_msg: >-
      The initial passwordless administrator could not authenticate. Its /config may not
      be new or Startup/User did not apply.
  no_log: true

- name: Emby | Set the app-owned administrator password through its API
  ansible.builtin.uri:
    url: "{{ _emby_base }}/Users/{{ _emby_bootstrap_auth.json.User.Id }}/Password"
    method: POST
    headers:
      X-Emby-Token: "{{ _emby_bootstrap_auth.json.AccessToken }}"
    body_format: json
    body:
      Id: "{{ _emby_bootstrap_auth.json.User.Id }}"
      NewPw: "{{ _emby_password }}"
      ResetPassword: true
    status_code: [200, 204]
  no_log: true
