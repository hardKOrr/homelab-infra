---
- name: Emby restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
      - not (restore_overwrite | bool) or restore_source_emby_user | default('') | length > 0
      - not (restore_overwrite | bool) or restore_source_emby_password | default('') | length > 0
    fail_msg: >-
      Emby restore needs PBS, an explicit snapshot for overwrite=true, and the source
      Emby app-owned credentials in Vaultwarden. Keep overwrite=false to list snapshots.

- name: Emby restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Emby restore | Assert PBS is available
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Emby. Deploy PBS before listing or restoring
      application data.

- name: Emby restore | Resolve the backup identity
  ansible.builtin.set_fact:
    _emby_restore_backup_id: >-
      {{ restore_backup_id | default(app_config.backup.backup_id | default('', true) or instance, true) }}
  no_log: true

- name: Emby restore | List available snapshots in plan mode
  when: not (restore_overwrite | bool) and (restore_snapshot | default('') | length == 0)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - --env
      - BACKUP_ID
      - --env
      - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
      - --env
      - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  register: _emby_restore_snapshots
  changed_when: false
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _emby_restore_backup_id }}"
  no_log: true

- name: Emby restore | Report the read-only plan
  ansible.builtin.debug:
    msg: >-
      No data was changed. PBS snapshots for host/{{ _emby_restore_backup_id }}:
      {{ _emby_restore_snapshots.stdout | default('provide snapshot=<id> to select one') }}
  when: not (restore_overwrite | bool)

- name: Emby restore | Create private staging space
  ansible.builtin.tempfile:
    state: directory
    prefix: "{{ instance }}-emby-restore-"
  register: _emby_restore_tmp
  when: restore_overwrite | bool

- name: Emby restore | Replace the application config from PBS
  when: restore_overwrite | bool
  block:
    - name: Emby restore | Stop Emby
      community.docker.docker_compose_v2:
        project_src: "{{ emby_project_dir }}"
        state: stopped
        services: ["{{ instance }}"]

    - name: Emby restore | Extract the selected archive
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _emby_restore_tmp.path }}:/restore"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - SNAPSHOT
          - --env
          - "PBS_KEY_URL={{ app_config.backup.client.key_url }}"
          - --env
          - "PBS_APT_REPO={{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client restore "$SNAPSHOT" data.pxar /restore
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        SNAPSHOT: "{{ restore_snapshot }}"
      no_log: true
      changed_when: true

    - name: Emby restore | Require a non-empty recovered Emby config archive
      ansible.builtin.command:
        argv: [find, "{{ _emby_restore_tmp.path }}", -mindepth, "1", -maxdepth, "1", -print, -quit]
      register: _emby_restore_archive_entry
      changed_when: false

    - name: Emby restore | Assert the selected snapshot contains Emby state
      ansible.builtin.assert:
        that: _emby_restore_archive_entry.stdout | length > 0
        fail_msg: "The selected PBS snapshot contains no Emby config; refusing to replace the target."

    - name: Emby restore | Replace the config directory after archive validation
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: absent

    - name: Emby restore | Recreate the config directory
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: directory
        owner: "{{ app_config.app.puid | default(1313) }}"
        group: "{{ app_config.app.pgid | default(1313) }}"
        mode: "0750"

    - name: Emby restore | Copy the archived state into place
      ansible.builtin.command:
        argv: [cp, -a, "{{ _emby_restore_tmp.path }}/.", "{{ app_config.app.config_path }}/"]
      changed_when: true
      no_log: true

    - name: Emby restore | Set config ownership for the container user
      ansible.builtin.file:
        path: "{{ app_config.app.config_path }}"
        state: directory
        owner: "{{ app_config.app.puid | default(1313) }}"
        group: "{{ app_config.app.pgid | default(1313) }}"
        recurse: true

    - name: Emby restore | Start Emby
      community.docker.docker_compose_v2:
        project_src: "{{ emby_project_dir }}"
        state: present
        services: ["{{ instance }}"]

    - name: Emby restore | Wait for the restored service
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/emby/System/Info/Public"
        status_code: 200
      register: _emby_restore_health
      until: _emby_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Emby restore | Assert the restored service is Emby
      ansible.builtin.assert:
        that: (_emby_restore_health.json.ProductName | default('')) is search('Emby')
        fail_msg: "The restored endpoint did not identify as Emby."

    - name: Emby restore | Authenticate with the source app-owned account
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/emby/Users/AuthenticateByName"
        method: POST
        headers:
          X-Emby-Authorization: >-
            MediaBrowser Client="{{ emby_client_name }}", Device="{{ emby_device_name }}",
            DeviceId="{{ emby_client_name }}-{{ instance }}", Version="1.0.0"
        body_format: json
        body:
          Username: "{{ restore_source_emby_user }}"
          Pw: "{{ restore_source_emby_password }}"
        status_code: [200, 401]
      register: _emby_restore_auth
      changed_when: false
      no_log: true

    - name: Emby restore | Assert the restored Emby account authenticates
      ansible.builtin.assert:
        that:
          - _emby_restore_auth.status == 200
          - (_emby_restore_auth.json.AccessToken | default('')) | length > 0
        fail_msg: >-
          The restored Emby database did not accept its source credentials. The service is
          stopped by the failure handler so the incomplete restore is not presented as healthy.

    - name: Emby restore | Verify the restored database has a media library
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/emby/Library/VirtualFolders/Query"
        headers:
          X-Emby-Token: "{{ _emby_restore_auth.json.AccessToken }}"
        return_content: true
        status_code: 200
      register: _emby_restore_libraries
      changed_when: false
      no_log: true

    - name: Emby restore | Assert at least one library was restored
      ansible.builtin.assert:
        that: (_emby_restore_libraries.json.Items | default([]) | length) > 0
        fail_msg: "The restored Emby account has no configured media libraries."

    - name: Emby restore | Record the source credentials for the target instance
      ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
      vars:
        vault_item_name: "homelab-infra/media/{{ instance }}"
        vault_item_fields:
          username: "{{ restore_source_emby_user }}"
          password: "{{ restore_source_emby_password }}"
        vault_item_secret_fields: [password]
      no_log: true

    - name: Emby restore | Mark the recovery complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Emby restore | Stop the named service after a failed restore
      community.docker.docker_compose_v2:
        project_src: "{{ emby_project_dir }}"
        state: stopped
        services: ["{{ instance }}"]

    - name: Emby restore | Report the failed restore
      ansible.builtin.fail:
        msg: >-
          Emby restore did not complete. The named service is intentionally left
          stopped; inspect the recovered config and retry after correcting the failure.
  always:
    - name: Emby restore | Remove private staging data
      ansible.builtin.file:
        path: "{{ _emby_restore_tmp.path }}"
        state: absent
      when: _emby_restore_tmp.path is defined
