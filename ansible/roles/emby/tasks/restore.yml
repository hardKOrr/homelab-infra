---
# Restore Emby's config directory through the shared swap; the restored server must accept
# the source instance's app-owned account and hold its media libraries.
- name: Emby restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
      - not (restore_overwrite | bool) or restore_source_emby_user | default('') | length > 0
      - not (restore_overwrite | bool) or restore_source_emby_password | default('') | length > 0
    fail_msg: >-
      Emby restore needs PBS, an explicit snapshot for overwrite=true, and the source
      Emby app-owned credentials in Vaultwarden. Keep overwrite=false to list snapshots.

- name: Emby restore | Preview or replace the config directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.config_path }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ instance }}"]
    recovery_swap_compose_project: "{{ emby_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/emby/System/Info/Public"
    recovery_swap_verified_hook: "{{ role_path }}/tasks/restore-verified.yml"
