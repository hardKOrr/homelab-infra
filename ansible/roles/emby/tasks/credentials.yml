---
# Resolve Emby's app-owned admin credentials and save the generated password before setup.
# Shared by the Docker and Kubernetes paths.
- name: Resolve Emby's app-owned admin credentials
  ansible.builtin.set_fact:
    _emby_user: >-
      {{ ((homelabinfra_vault.media | default({}))[instance] | default({})).username
         | default(app_config.app.admin_user | default('admin'), true) }}
    _emby_password: >-
      {{ ((homelabinfra_vault.media | default({}))[instance] | default({})).password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

# Save the generated password before setup. The first-run wizard replaces the
# provisional username with Emby's server-assigned administrator name and updates
# this canonical item before setting that user's password.
- name: Persist Emby's app-owned admin credentials before setup
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/media/{{ instance }}"
    vault_item_fields:
      username: "{{ _emby_user }}"
      password: "{{ _emby_password }}"
    vault_item_secret_fields: [password]
  no_log: true

