---
- name: Restart tautulli
  community.docker.docker_compose_v2:
    project_src: "{{ tautulli_project_dir }}"
    state: present
    recreate: always
  when: not (tautulli_native | bool)

- name: Restart native tautulli
  ansible.builtin.systemd:
    name: "{{ tautulli_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart tautulli
  when: tautulli_native | bool
