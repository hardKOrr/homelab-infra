---
# Tautulli on a Docker stack host (docker.yml) or natively on its own LXC or VM (native*.yml);
# Kubernetes has its own entry (kubernetes.yml). The Plex endpoint and the API proof are shared.

- name: Ensure Docker is available for Tautulli deployment
  ansible.builtin.include_role:
    name: docker
  when: not (tautulli_native | bool)

- name: Resolve the Plex endpoint and credentials
  ansible.builtin.include_tasks: plex.yml

- name: Resolve the API endpoint
  ansible.builtin.set_fact:
    _tautulli_base: "http://localhost:{{ app_config.app.port }}"
    _tautulli_host_headers: {}

- name: Native service account and release
  ansible.builtin.include_tasks: native-install.yml
  when: tautulli_native | bool

- name: Docker on the stack host
  ansible.builtin.include_tasks: docker.yml
  when: not (tautulli_native | bool)

- name: Native service
  ansible.builtin.include_tasks: native.yml
  when: tautulli_native | bool

- name: Verify the Tautulli API and store its key
  ansible.builtin.include_tasks: verify.yml
