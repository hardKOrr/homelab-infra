---
# Resolve the selected Plex instance's token, endpoint and machine identifier, shared by
# the Docker and Kubernetes paths. Inputs: app_config, homelabinfra_vault. The Plex token
# comes from the Plex role's verified Vaultwarden item; this role never reads another
# app's on-disk configuration.
- name: Resolve Plex credentials and the API key
  ansible.builtin.set_fact:
    _tautulli_plex_instance: "{{ app_config.app.plex_instance | default('plex', true) }}"
    _tautulli_plex_token: >-
      {{ ((homelabinfra_vault.media | default({}))[app_config.app.plex_instance | default('plex', true)] | default({})).token | default('', true) }}
    _tautulli_api_key: >-
      {{ ((homelabinfra_vault.media | default({}))[instance] | default({})).api_key | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Require the selected Plex server token
  ansible.builtin.assert:
    that: _tautulli_plex_token | length > 0
    fail_msg: >-
      Plex instance {{ _tautulli_plex_instance }} has no server token in Vaultwarden. Deploy or converge that Plex instance first, then rerun {{ instance }}.
  no_log: true

- name: Resolve a reachable endpoint for the selected Plex instance
  ansible.builtin.include_tasks: plex-endpoint.yml

- name: Read the selected Plex server identity without changing Plex
  ansible.builtin.uri:
    url: "{{ _tautulli_plex_discovery_url }}"
    headers:
      X-Plex-Token: "{{ _tautulli_plex_token }}"
    return_content: true
    timeout: 30
  register: _tautulli_plex_discovery
  until:
    - _tautulli_plex_discovery.status | default(0) == 200
    - >-
      (_tautulli_plex_discovery.content | default('')
       | regex_findall('machineIdentifier="([a-zA-Z0-9_-]+)"')) | length == 1
  retries: "{{ tautulli_http_retries }}"
  delay: "{{ tautulli_http_delay }}"
  changed_when: false
  no_log: true

- name: Resolve the verified Plex machine identifier for Tautulli
  ansible.builtin.set_fact:
    _tautulli_plex_identifier: >-
      {{ (_tautulli_plex_discovery.content
          | regex_findall('machineIdentifier="([a-zA-Z0-9_-]+)"')) | first }}
  no_log: true
