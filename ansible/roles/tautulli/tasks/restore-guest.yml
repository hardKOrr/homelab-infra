---
# Restore one application-consistent Tautulli config archive into a Docker or native guest through the shared swap.

- name: Tautulli restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Tautulli restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Tautulli restore | Resolve the guest runtime
  ansible.builtin.set_fact:
    _tautulli_restore_runtime: >-
      {{ restore_target_config.hosting.method | default(app_config.hosting.method | default('docker')) }}

- name: Tautulli restore | Preview or replace the config directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: "{{ _tautulli_restore_runtime }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.config_path }}"
        owner: "{{ app_config.app.puid }}"
        group: "{{ app_config.app.pgid }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ tautulli_service if _tautulli_restore_runtime == 'native' else instance }}"]
    recovery_swap_compose_project: "{{ tautulli_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}"
