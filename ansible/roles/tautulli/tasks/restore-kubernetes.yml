---
# Restore Tautulli's /config volume from one PBS point through the shared recovery Job.
- name: Tautulli Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Tautulli
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "{{ app_config.app.puid }}:{{ app_config.app.pgid }}"
      stop:
        - "{{ restore_target }}"
      describe: >-
        the {{ restore_target }}-config volume with Tautulli's settings and history database
      verify:
        - >-
          Open the instance URL, sign in with Plex, and verify the expected users and
          watch history.
