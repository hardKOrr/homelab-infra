---
# Included by main.yml (Docker only): the Compose project on the media stack host.

- name: Resolve the Docker network
  ansible.builtin.set_fact:
    _tautulli_media_network: "homelabinfra-{{ app_config.stack }}"

# The Compose file carries the Plex token and API key.
- name: Deploy the Tautulli Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ tautulli_project_dir }}"
    compose_owner: "{{ app_config.app.puid | default(1313) }}"
    compose_group: "{{ app_config.app.pgid | default(1313) }}"
    compose_dirs:
      - "{{ app_config.app.config_path }}"
    compose_networks:
      - "{{ _tautulli_media_network }}"
    compose_secrets:
      - "{{ _tautulli_plex_token }}"
      - "{{ _tautulli_api_key }}"

- name: Verify Tautulli can reach the selected Plex container
  community.docker.docker_container_exec:
    container: "{{ instance }}"
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --connect-timeout
      - "10"
      - --max-time
      - "30"
      - --header
      - "X-Plex-Token:{{ _tautulli_plex_token }}"
      - "{{ _tautulli_plex_url }}/identity"
  register: _tautulli_plex_identity
  until:
    - _tautulli_plex_identity.rc | default(1) == 0
    - _tautulli_plex_identity.stdout is search('MediaContainer')
  retries: "{{ tautulli_http_retries }}"
  delay: "{{ tautulli_http_delay }}"
  changed_when: false
  no_log: true
