---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before wiring): the MariaDB entry in
# the databases registry. Body: tasks/database/deploy-record.yml.
- name: MariaDB | Record the backend
  ansible.builtin.include_tasks: ../../../tasks/database/deploy-record.yml
  vars:
    database_record_fields: "{{ {'client_hosts': app_config.app.client_hosts} }}"
