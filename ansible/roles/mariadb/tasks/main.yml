---
# MariaDB is a standalone backend, deliberately independent of application Compose files so
# its data, recovery path, and credentials remain explicit. It runs natively by default, or
# as the official image on a stack host (hosting.method: docker).
- name: MariaDB | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: mariadb_docker | bool

- name: MariaDB | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: not (mariadb_docker | bool)
