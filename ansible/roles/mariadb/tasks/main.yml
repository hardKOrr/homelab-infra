---
# MariaDB is a standalone backend, deliberately independent of application
# Compose files so its data, recovery path, and credentials remain explicit.
- name: MariaDB | Resolve configured guest memory
  ansible.builtin.import_tasks: ../../../tasks/database/resolve-guest-memory.yml

- name: MariaDB | Resolve database memory settings
  ansible.builtin.import_tasks: resolve-memory.yml

- name: MariaDB | Install server and Python client
  ansible.builtin.apt:
    name: [mariadb-server, mariadb-client, python3-pymysql]
    state: present
    update_cache: true

- name: MariaDB | Install the PBS client repository when application backups are enabled
  ansible.builtin.include_tasks: install-pbs-client.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: MariaDB | Install the PBS backup client
  ansible.builtin.apt:
    name: proxmox-backup-client
    state: present
    update_cache: true
  when:
    - app_config.backup.enabled | default(false) | bool
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: MariaDB | Install the shared server recovery script
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/database/install-server-recovery.yml"

- name: MariaDB | Permit application-network listeners
  ansible.builtin.template:
    src: homelab-infra.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/z-homelab-infra.cnf
    mode: "0644"
  notify: Restart MariaDB

- name: MariaDB | Enable and start service
  ansible.builtin.systemd:
    name: "{{ app_config.app.service_name }}"
    state: started
    enabled: true

- name: MariaDB | Apply listener changes before health check
  ansible.builtin.meta: flush_handlers

- name: MariaDB | Verify local server readiness
  ansible.builtin.command:
    argv: [mariadb-admin, "--socket=/run/mysqld/mysqld.sock", ping]
  changed_when: false
