---
# The native service's restart (tasks/native.yml). On Docker, tasks/stack/compose-deploy.yml
# recreates the project itself when the Compose file or server tuning changes.
- name: Restart MariaDB
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ app_config.app.service_name }}"]
  when: not (mariadb_docker | bool)
