---
# The native service's restart (tasks/native.yml). On Docker, tasks/stack/compose-deploy.yml
# recreates the project itself when a rendered file changes.
- name: Restart maintainerr service
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: "{{ 'native' if maintainerr_native | bool else 'docker' }}"
    restart_compose_project: "{{ maintainerr_project_dir }}"
    restart_services: ["{{ instance }}"]
