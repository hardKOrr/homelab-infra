---
# Stop Maintainerr so its SQLite database and settings share one recovery point, and archive
# the data directory through the shared PBS client. Docker or native; Kubernetes runs its CronJob.

- name: Maintainerr backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Maintainerr needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Maintainerr backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.data_path }}"
  register: _maintainerr_backup_data
  changed_when: false

- name: Maintainerr backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _maintainerr_backup_data.stat.exists
      - _maintainerr_backup_data.stat.isdir
    fail_msg: >-
      Maintainerr data path {{ app_config.app.data_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Maintainerr backup | Quiesce Maintainerr and archive its data to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: "{{ 'native' if maintainerr_native | bool else 'docker' }}"
    pbs_client_compose_project: "{{ maintainerr_project_dir }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.data_path }}"

- name: Maintainerr backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
