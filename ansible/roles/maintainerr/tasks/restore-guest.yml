---
# Restore one application-consistent Maintainerr data archive into a Docker or native guest through the shared swap.

- name: Maintainerr restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Maintainerr restore needs a PBS-backed application recovery contract. Keep
      overwrite=false to list snapshots before selecting one.

- name: Maintainerr restore | Preview or replace the data directory
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: "{{ 'native' if maintainerr_native | bool else 'docker' }}"
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ app_config.app.data_path }}"
        owner: "{{ maintainerr_native_user if maintainerr_native | bool else app_config.app.puid }}"
        group: "{{ maintainerr_native_user if maintainerr_native | bool else app_config.app.pgid }}"
        mode: "0750"
    recovery_swap_stop_services: ["{{ instance }}"]
    recovery_swap_compose_project: "{{ maintainerr_project_dir }}"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/api/health/ready"
