---
# Maintainerr on a guest: Docker on a stack host (docker.yml) or natively on its own LXC or
# VM (native.yml); Kubernetes has its own entry (kubernetes.yml). The role does not complete
# Maintainerr's first-run wizard — see kubernetes.yml for why — so the deploy brings up an
# empty, persisted, backed-up app.

- name: Maintainerr | Run on Docker
  ansible.builtin.include_tasks: docker.yml
  when: app_config.hosting.method | default('kubernetes') == 'docker'

- name: Maintainerr | Run natively
  ansible.builtin.include_tasks: native.yml
  when: app_config.hosting.method | default('kubernetes') == 'native'

- name: Maintainerr | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Maintainerr | Wait for the application
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_config.app.port }}/api/health/ready"
    status_code: 200
  register: _maintainerr_health
  retries: "{{ maintainerr_http_retries }}"
  delay: "{{ maintainerr_http_delay }}"
  until: _maintainerr_health.status | default(0) == 200
  changed_when: false
