---
# Maintainerr on a Docker stack host (hosting.method: docker); Kubernetes has its own entry
# (kubernetes.yml). The role does not complete Maintainerr's first-run wizard — see
# kubernetes.yml for why — so the deploy brings up an empty, persisted, backed-up app.

- name: Maintainerr | Create the project and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_config.app.puid }}"
    group: "{{ app_config.app.pgid }}"
    mode: "0750"
  loop:
    - "{{ maintainerr_project_dir }}"
    - "{{ app_config.app.data_path }}"

- name: Maintainerr | Write the Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ maintainerr_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart maintainerr

- name: Maintainerr | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ maintainerr_project_dir }}"
    policy: missing
  changed_when: false

- name: Maintainerr | Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ maintainerr_project_dir }}"
    state: present
    remove_orphans: true

- name: Maintainerr | Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Maintainerr | Wait for the application
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_config.app.port }}/api/health/ready"
    status_code: 200
  register: _maintainerr_health
  retries: "{{ maintainerr_http_retries }}"
  delay: "{{ maintainerr_http_delay }}"
  until: _maintainerr_health.status | default(0) == 200
  changed_when: false
