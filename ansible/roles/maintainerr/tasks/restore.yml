---
- name: Maintainerr restore | Use the shared Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('kubernetes')) == 'kubernetes'

- name: Maintainerr restore | Use the restore swap on a Docker guest
  ansible.builtin.include_tasks: restore-guest.yml
  when: >-
    restore_target_config.hosting.method
    | default(app_config.hosting.method | default('kubernetes')) == 'docker'

- name: Maintainerr restore | Reject an unsupported restore hosting method
  ansible.builtin.assert:
    that: >-
      restore_target_config.hosting.method
      | default(app_config.hosting.method | default('kubernetes')) in ['docker', 'kubernetes']
    fail_msg: >-
      Maintainerr restore supports hosting.method docker or kubernetes; refusing to mutate
      a target hosted by an unsupported method.
