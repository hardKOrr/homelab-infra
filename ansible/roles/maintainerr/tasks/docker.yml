---
# Maintainerr on Docker on a stack host (hosting.method: docker). Native is native.yml,
# Kubernetes is kubernetes.yml. main.yml waits for the app on both guest methods.

- name: Maintainerr | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ maintainerr_project_dir }}"
    compose_owner: "{{ app_config.app.puid }}"
    compose_group: "{{ app_config.app.pgid }}"
    compose_dirs:
      - "{{ app_config.app.data_path }}"
