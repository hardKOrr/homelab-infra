---
# Replace the target's config PVC through the shared Kubernetes recovery Job. The NFS
# media shares are not part of the archive. Publish the restored API key after the shared restore starts the target.
- name: Bazarr Kubernetes restore | Restore the config volume
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/recovery-restore.yml
  vars:
    k8s_recovery:
      app: Bazarr
      archives:
        - name: data
          claim: "{{ restore_target }}-config"
          owner: "{{ restore_target_config.app.puid | default(1313) }}:{{ restore_target_config.app.pgid | default(1313) }}"
      stop:
        - "{{ restore_target }}"
      describe: >-
        Bazarr's configuration, API key, language profiles and database from its config
        volume; the shared media is not included
      verify:
        - >-
          Open the Bazarr URL and verify the restored settings and language profiles, then
          confirm the restored API key works.

- name: Bazarr Kubernetes restore | Verify and publish the restored API key
  ansible.builtin.include_tasks: kubernetes-key.yml
  vars:
    bazarr_key_instance: "{{ restore_target }}"
    bazarr_key_fqdn: >-
      {{ restore_target_config.routing.subdomain | default(restore_target, true) }}.{{ homelabinfra_infra.domain }}
  when: _application_restore_complete | default(false) | bool
