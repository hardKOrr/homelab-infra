---
# Quiesce Bazarr so its SQLite data and settings share one recovery point.
# Logs and cache are disposable and never enter the application archive.

- name: Bazarr backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Bazarr needs its declared application-consistent backup contract and a
      configured PBS before an on-demand backup can run.

- name: Bazarr backup | Check the application data path
  ansible.builtin.stat:
    path: "{{ app_config.app.config_path }}"
  register: _bazarr_backup_data
  changed_when: false

- name: Bazarr backup | Assert the data path is a directory
  ansible.builtin.assert:
    that:
      - _bazarr_backup_data.stat.exists
      - _bazarr_backup_data.stat.isdir
    fail_msg: >-
      Bazarr data path {{ app_config.app.config_path }} is missing; refusing to
      create a backup that would not contain the application's persistent state.

- name: Bazarr backup | Quiesce Bazarr and archive its config to PBS
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
  vars:
    pbs_client_runtime: docker
    pbs_client_compose_project: "/opt/{{ instance }}"
    pbs_client_stop_services: ["{{ instance }}"]
    pbs_client_backup_args: [--exclude, /log, --exclude, /cache]
    pbs_client_archives:
      - name: data.pxar
        path: "{{ app_config.app.config_path }}"

- name: Bazarr backup | Mark the backup complete
  ansible.builtin.set_fact:
    _application_backup_complete: true
