---
# Defaults are deliberately thin. The real contract lives in
# ansible/vars/app-defaults/k3s-cluster.yml and arrives as k8s_cluster_config; these
# only cover what the role needs when a caller omits the optional halves.

# Where the k3s installer is fetched from. Overridable for an air-gapped lab that
# mirrors it internally.
k3s_install_url: "https://get.k3s.io"

# Node paths k3s owns. Named here so the removal and verification tasks agree with the
# install tasks about what "the cluster's state" means.
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_server_token_path: /var/lib/rancher/k3s/server/token

# How long to wait for a joining server to report Ready. Three minutes is generous for a
# LAN join and short enough that a genuinely stuck node fails the job rather than
# hanging it.
k3s_ready_timeout: 180
