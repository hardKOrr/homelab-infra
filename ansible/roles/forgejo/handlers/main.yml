---
# The native service's restart, skipped when native.yml just started it. On Docker,
# tasks/stack/compose-deploy.yml recreates the project itself when the Compose or
# environment file changes.
- name: Restart Forgejo
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ instance }}"]
  when:
    - app_config.hosting.method | default('docker') == 'native'
    - not (_forgejo_start.changed | default(false))
