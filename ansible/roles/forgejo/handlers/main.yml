---
- name: Restart Forgejo
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_project_dir }}"
    state: restarted
  # A container Start service just created or recreated already runs the new files, and
  # restarting it would interrupt a new install's first schema creation.
  when: not (_forgejo_start.changed | default(false))
