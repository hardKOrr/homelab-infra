---
- name: Forgejo | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo | Create writable application data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Forgejo | Store database connection fields in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: forgejo
      instance: "{{ instance }}"
      database_provider: "{{ app_config.app.database.provider }}"
      database_host: "{{ app_config.app.database_host }}"
      database_port: "{{ app_config.app.database_port }}"
      database_name: "{{ app_config.app.database.name }}"
      database_user: "{{ app_config.app.database_user }}"
      database_password: "{{ app_config.app.database_password }}"
    vault_item_secret_fields: [database_password]
  no_log: true

- name: Forgejo | Render environment file
  ansible.builtin.template:
    src: forgejo.env.j2
    dest: "{{ forgejo_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Forgejo

- name: Forgejo | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Forgejo

- name: Forgejo | Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_project_dir }}"

- name: Forgejo | Start service
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_project_dir }}"
    state: present
    remove_orphans: true

- name: Forgejo | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Forgejo | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/-/health"
    status_code: 200
  register: _forgejo_health
  until: _forgejo_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false
