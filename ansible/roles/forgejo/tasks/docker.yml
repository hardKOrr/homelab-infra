---
- name: Forgejo | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo | Prepare data, credentials and configuration
  ansible.builtin.include_tasks: prepare.yml

# The shared Compose deploy renders the environment file with the project and recreates
# it when either changed, in the same up that creates it, so a new install's first schema
# creation is never interrupted by a restart.
- name: Forgejo | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ forgejo_project_dir }}"
    compose_files:
      - src: forgejo.env.j2
        dest: "{{ forgejo_env_file }}"
        mode: "0600"
    compose_secrets: "{{ [app_config.app.database_password | default('')] | select | list }}"

- name: Forgejo | Administrator and sign-in
  ansible.builtin.include_tasks: admin.yml
  vars:
    forgejo_cli: [docker, exec, -u, git, "{{ instance }}-forgejo", forgejo]
