---
- name: Forgejo | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo | Create writable application data directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Forgejo | Resolve and store application credentials
  ansible.builtin.include_tasks: credentials.yml

# INSTALL_LOCK (forgejo.env) skips the web installer. Forgejo then generates and saves its
# internal tokens itself, but an empty SECRET_KEY falls back to a fixed public default, so
# a new install gets a key in app.ini before Forgejo first starts. An existing app.ini,
# including a restored one, keeps whatever key it has, even an empty one: the key
# encrypts stored secrets, and replacing it would make them unreadable.
- name: Forgejo | Create the configuration directory
  ansible.builtin.file:
    path: "{{ app_config.app.data_path }}/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop: [gitea, gitea/conf]

- name: Forgejo | Look for an existing configuration
  ansible.builtin.stat:
    path: "{{ forgejo_app_ini }}"
  register: _forgejo_app_ini

- name: Forgejo | Seed a new install's secret key
  community.general.ini_file:
    path: "{{ forgejo_app_ini }}"
    section: security
    option: SECRET_KEY
    value: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
    create: true
    owner: "1000"
    group: "1000"
    mode: "0640"
  when: not _forgejo_app_ini.stat.exists
  no_log: true

- name: Forgejo | Render environment file
  ansible.builtin.template:
    src: forgejo.env.j2
    dest: "{{ forgejo_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Forgejo

- name: Forgejo | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Forgejo

- name: Forgejo | Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_project_dir }}"

- name: Forgejo | Start service
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_project_dir }}"
    state: present
    remove_orphans: true
  register: _forgejo_start

- name: Forgejo | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Forgejo | Wait for health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/healthz"
    status_code: 200
  register: _forgejo_health
  until: _forgejo_health.status | default(0) == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Forgejo | List the administrators
  ansible.builtin.command:
    argv: [docker, exec, -u, git, "{{ instance }}-forgejo", forgejo, admin, user, list, --admin]
  register: _forgejo_admins
  changed_when: false

- name: Forgejo | Create the administrator
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - git
      - "{{ instance }}-forgejo"
      - forgejo
      - admin
      - user
      - create
      - --admin
      - --username
      - "{{ app_config.app.admin_user }}"
      - --email
      - "{{ app_config.app.admin_email }}"
      - --password
      - "{{ _forgejo_admin_password }}"
      - --must-change-password=false
  changed_when: true
  no_log: true
  # `admin user list` prints one "ID Username Email ..." row per administrator.
  when: >-
    _forgejo_admins.stdout is not search('(?m)^\d+\s+' ~ (app_config.app.admin_user | regex_escape) ~ '\s')

- name: Forgejo | Sign in as the administrator
  ansible.builtin.uri:
    url: "http://localhost:{{ app_config.app.port }}/api/v1/user"
    url_username: "{{ app_config.app.admin_user }}"
    url_password: "{{ _forgejo_admin_password }}"
    force_basic_auth: true
    status_code: 200
  changed_when: false
  no_log: true
