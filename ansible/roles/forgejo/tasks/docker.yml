---
- name: Forgejo | Create project directory
  ansible.builtin.file:
    path: "{{ forgejo_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Forgejo | Prepare data, credentials and configuration
  ansible.builtin.include_tasks: prepare.yml

- name: Forgejo | Render environment file
  ansible.builtin.template:
    src: forgejo.env.j2
    dest: "{{ forgejo_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Forgejo

- name: Forgejo | Render Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Forgejo

- name: Forgejo | Pull image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_project_dir }}"

- name: Forgejo | Start service
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_project_dir }}"
    state: present
    remove_orphans: true
  register: _forgejo_start

- name: Forgejo | Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Forgejo | Administrator and sign-in
  ansible.builtin.include_tasks: admin.yml
  vars:
    forgejo_cli: [docker, exec, -u, git, "{{ instance }}-forgejo", forgejo]
