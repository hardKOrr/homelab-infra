---
# Restore Forgejo's PostgreSQL database and full local data tree from one data.pxar
# through the shared swap. On any failure after the stop the swap puts the original data
# directory and database back and starts Forgejo.

- name: Forgejo restore | Resolve target database and persistent data
  ansible.builtin.set_fact:
    _forgejo_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           app_config.app.database.instance | default(''), {}) }}
    _forgejo_restore_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_user
         | default(app_config.app.database_user
           | default(app_config.app.database.role | default('')), true) }}
    _forgejo_restore_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _forgejo_restore_database_name: "{{ app_config.app.database.name | default('') }}"
    _forgejo_restore_data_path: >-
      {{ app_config.app.data_path
         | replace('/opt/' ~ instance ~ '/', '/opt/' ~ restore_target ~ '/')
         | replace('{{ instance }}', restore_target) }}
    _forgejo_restore_source_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(
           (restore_source_database | default({})).get('instance', ''), {}) }}
  no_log: true

- name: Forgejo restore | Assert the recovery contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - _forgejo_restore_database_backend.provider | default('') == 'postgresql'
      - _forgejo_restore_database_backend.host | default('') | length > 0
      - _forgejo_restore_database_backend.port | default(0) | int > 0
      - _forgejo_restore_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _forgejo_restore_database_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _forgejo_restore_database_password | length > 0
      - _forgejo_restore_data_path is match('^/[^/].*')
      - _forgejo_restore_data_path != '/'
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Forgejo restore needs a target, named PostgreSQL backend, target database credential,
      non-root data path, and a selected recovery point when overwrite=true.

- name: Forgejo restore | Require a separate database for a new destination
  ansible.builtin.assert:
    that:
      - restore_source_database is mapping
      - restore_source_database.instance | default('') | length > 0
      - restore_source_database.name | default('') | length > 0
      - _forgejo_restore_source_backend.host | default('') | length > 0
      - _forgejo_restore_source_backend.port | default(0) | int > 0
      - >-
        not (
          restore_source_database.name == _forgejo_restore_database_name
          and _forgejo_restore_source_backend.host == _forgejo_restore_database_backend.host
          and (_forgejo_restore_source_backend.port | int) == (_forgejo_restore_database_backend.port | int)
        )
    fail_msg: >-
      A new Forgejo restore must use a target database name or PostgreSQL backend distinct
      from the source. Never let an isolated instance overwrite the source database.
  when: restore_destination == 'new'

- name: Forgejo restore | Preview or replace the data directory and database
  ansible.builtin.include_tasks: ../../../tasks/recovery/restore-swap.yml
  vars:
    recovery_swap_runtime: docker
    recovery_swap_archives: [data.pxar]
    recovery_swap_paths:
      - path: "{{ _forgejo_restore_data_path }}"
        source: data/forgejo
        owner: 1000
        group: 1000
        mode: "0750"
    recovery_swap_database:
      config: "{{ app_config.app.database }}"
      dump: data/database/forgejo.dump
    recovery_swap_stop_services: [forgejo]
    recovery_swap_compose_project: "{{ forgejo_project_dir }}"
    recovery_swap_staged_hook: "{{ role_path }}/tasks/restore-staged.yml"
    recovery_swap_health_url: "http://localhost:{{ app_config.app.port }}/api/healthz"
