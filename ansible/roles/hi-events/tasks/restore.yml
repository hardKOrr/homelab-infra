---
- name: Hi.Events restore | Use the Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method | default('kubernetes') == 'kubernetes'

- name: Hi.Events restore | Use the Docker restore path
  ansible.builtin.include_tasks: restore-docker.yml
  when: app_config.hosting.method | default('kubernetes') == 'docker'
