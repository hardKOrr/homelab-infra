---
# Restore one Hi.Events instance's named PostgreSQL database and storage volume from one
# PBS snapshot, into the namespace of a Hi.Events instance that is already deployed.
#
# Called by playbooks/maintenance/restore-app.yml, whose header carries the operator-facing
# procedure. Same shape as roles/jellyseerr/tasks/restore.yml, restoring the storage
# volume and its application database. The PostgreSQL backend guest remains in place; this
# role touches only the database and role declared for the target instance.
#
# Inputs:
#   instance               — the instance that OWNS the backup (the PBS backup-id)
#   app_config             — the source instance's merged config
#   restore_target         — the instance whose namespace receives the restore
#   restore_target_config  — the target instance's merged config
#   restore_snapshot       — a PBS snapshot identifier, or '' to just list what exists
#   restore_overwrite      — false: plan only, write nothing. true: perform the restore.

- name: Restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - restore_target is defined and restore_target | length > 0
      - restore_target_config is defined
      - restore_overwrite is defined
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
    fail_msg: >-
      A restore needs a target instance and, to actually run, a snapshot to restore from.
      Run it once without `snapshot` to list what PBS holds for this application, then
      again naming one of the identifiers it printed.

- name: Restore | Resolve the cluster and its API host
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-cluster.yml

- name: Restore | Derive the target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/derive-namespace.yml
  vars:
    k8s_namespace_for: "{{ restore_target }}"

- name: Restore | Read the target namespace's ownership label
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - namespace
      - "{{ k8s_namespace }}"
      - -o
      - jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}
  delegate_to: "{{ k8s_api_host }}"
  become: true
  register: _he_r_owner
  failed_when: false
  changed_when: false

- name: Restore | Require a deployed target
  ansible.builtin.assert:
    that:
      - _he_r_owner.rc == 0
      - (_he_r_owner.stdout | trim) == 'homelab-infra'
    fail_msg: >-
      Namespace {{ k8s_namespace }} does not exist, or is not labelled
      `app.kubernetes.io/managed-by: homelab-infra`. Deploy the target instance first —
      `Deploy Hi.Events` with instance={{ restore_target }} — and run the restore against
      the namespace it creates.

- name: Restore | Resolve the lab's PBS target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Restore | Require a PBS to restore from
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No Proxmox Backup Server is recorded in config/.generated/facts.yml, so there is
      nothing to restore from. This platform's application backups live in the lab's PBS
      datastore and nowhere else.

- name: Restore | Resolve the target database connection
  ansible.builtin.set_fact:
    _he_r_database_config: "{{ restore_target_config.app.database | default({}) }}"
    _he_r_database_host: "{{ restore_target_config.app.database_host | default('') }}"
    _he_r_database_port: "{{ restore_target_config.app.database_port | default(0) }}"
    _he_r_database_name: >-
      {{ restore_target_config.app.database_name
         | default(restore_target_config.app.database.name | default(''), true) }}
    _he_r_database_user: >-
      {{ restore_target_config.app.database_user
         | default(restore_target_config.app.database.role | default(''), true) }}
    _he_r_database_password: "{{ restore_target_config.app.database_password | default('', true) }}"
    _he_r_pg_client_version: >-
      {{ restore_target_config.app.database.version
         | default((homelabinfra_infra.databases | default({})).get(
             restore_target_config.app.database.instance, {}).version | default(''), true)
         | string }}
  no_log: true

- name: Restore | Require the target's named PostgreSQL database
  ansible.builtin.assert:
    that:
      - _he_r_database_config.provider | default('') == 'postgresql'
      - _he_r_database_host | length > 0
      - _he_r_database_port | int > 0
      - _he_r_database_name is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _he_r_database_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - _he_r_database_password | length > 0
      - _he_r_pg_client_version is match('^[0-9]+$')
    fail_msg: >-
      Hi.Events restore needs the deployed target's registered PostgreSQL database,
      credentials and major version.
  no_log: true

- name: Restore | Resolve the restore's identity
  ansible.builtin.set_fact:
    _he_r_mode: "{{ 'restore' if restore_overwrite | bool else 'plan' }}"
    _he_r_target: "{{ restore_target }}"
    _he_r_snapshot: "{{ restore_snapshot | default('') }}"
    _he_r_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _he_r_secret: "{{ restore_target }}-restore"
    _he_r_job_name: "{{ restore_target }}-restore-{{ 'plan' if not (restore_overwrite | bool) else 'run' }}"
    _he_r_timeout: >-
      {{ 900 if not (restore_overwrite | bool)
         else (app_config.backup.timeout_seconds | default(3600) | int) }}

- name: Restore | Sync the restore credentials into the target namespace
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/sync-secret.yml
  vars:
    k8s_secret_name: "{{ _he_r_secret }}"
    k8s_secret_data: >-
      {{ {'pbs-password': k8s_pbs_password,
          'db-password': _he_r_database_password} }}

- name: Restore | Render the restore job
  ansible.builtin.set_fact:
    _he_r_manifest: "{{ lookup('ansible.builtin.template', 'restore-job.yaml.j2') }}"

# ── Plan: read-only, and the default ──────────────────────────────────────────
- name: Restore | Show what a restore would do
  when: not (restore_overwrite | bool)
  block:
    - name: Restore | Run the plan job
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ _he_r_job_name }}"
        k8s_job_manifest: "{{ _he_r_manifest }}"
        k8s_job_timeout: "{{ _he_r_timeout }}"

    - name: Restore | State what a real run would replace
      ansible.builtin.debug:
        msg:
          - "PLAN ONLY — nothing was changed."
          - "Source: PBS group host/{{ _he_r_backup_id }} in datastore
             {{ k8s_pbs_datastore }}{{ ', snapshot ' ~ _he_r_snapshot
                if _he_r_snapshot | length > 0 else ' (no snapshot named)' }}."
          - "Target: namespace {{ k8s_namespace }} — the {{ _he_r_database_name }} database
             and {{ restore_target }}-storage volume. A real run replaces both from the
             same snapshot."
          - "To do it: re-run this job with the same snapshot and overwrite=true."

  always:
    - name: Restore | Remove the plan's credentials from the namespace
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - "secret/{{ _he_r_secret }}"
          - --ignore-not-found=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

# ── Restore: the destructive path ─────────────────────────────────────────────
- name: Restore | Restore the snapshot into the target
  when: restore_overwrite | bool
  block:
    - name: Restore | Stop the target application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - scale
          - "deployment/{{ restore_target }}"
          - --replicas=0
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Wait for the application pod to go away
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - wait
          - --for=delete
          - pod
          - "--selector=app.kubernetes.io/instance={{ restore_target }},app.kubernetes.io/component=web"
          - --timeout=300s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false

    - name: Restore | Run the restore job
      ansible.builtin.include_tasks: ../../../tasks/kubernetes/run-job.yml
      vars:
        k8s_job_name: "{{ _he_r_job_name }}"
        k8s_job_manifest: "{{ _he_r_manifest }}"
        k8s_job_timeout: "{{ _he_r_timeout }}"

    # Redis is disposable and has no persistent volume. Restart it after replacing the
    # database so stale cached organizer settings and queued work are not reused.
    - name: Restore | Restart the disposable Redis cache
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - rollout
          - restart
          - "deployment/{{ restore_target }}-redis"
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Wait for the Redis cache to be ready
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - rollout
          - status
          - "deployment/{{ restore_target }}-redis"
          - --timeout=300s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false

    - name: Restore | Start the target application again
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - scale
          - "deployment/{{ restore_target }}"
          - --replicas=1
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true

    - name: Restore | Wait for the target application to come back
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - rollout
          - status
          - "deployment/{{ restore_target }}"
          - --timeout=600s
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: false

    - name: Restore | State how to verify the restored application
      ansible.builtin.debug:
        msg:
          - "Restored {{ _he_r_snapshot }} into namespace {{ k8s_namespace }}."
          - "The database dump and storage archive came from the same recovery point."
          - "Now verify the application, not the artifact: open
             https://{{ restore_target }}.<estate domain>/, sign in as an organizer, and
             check that event cover images and previously generated tickets are present."

  rescue:
    - name: Restore | Report a failed restore and leave the target stopped
      ansible.builtin.fail:
        msg: >-
          The restore of {{ _he_r_snapshot }} into {{ k8s_namespace }} did not complete,
          and {{ restore_target }} has been LEFT SCALED TO 0 rather than started again —
          its storage volume may be partially replaced. The Job's own output is above.
          When you have decided what to do, either re-run this restore, or start the
          application as it stands with:
          k3s kubectl -n {{ k8s_namespace }} scale deployment/{{ restore_target }}
          --replicas=1

  always:
    - name: Restore | Remove the restore credentials from the namespace
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - "{{ k8s_namespace }}"
          - delete
          - "secret/{{ _he_r_secret }}"
          - --ignore-not-found=true
      delegate_to: "{{ k8s_api_host }}"
      become: true
      changed_when: true
