---
- name: Hi.Events restore | Use the Kubernetes restore Job
  ansible.builtin.include_tasks: restore-kubernetes.yml
  when: app_config.hosting.method | default('kubernetes') == 'kubernetes'

- name: Hi.Events restore | Use the Docker or native restore path
  ansible.builtin.include_tasks: restore-guest.yml
  when: app_config.hosting.method | default('kubernetes') in ['docker', 'native']
