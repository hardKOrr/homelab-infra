---
# Hi.Events on Docker on a stack host (hosting.method: docker, LXC or VM): the all-in-one
# image plus a password-protected Redis, with the database on the named PostgreSQL backend
# (playbooks/apps/deploy.yml provisions it before this role). Kubernetes is
# kubernetes.yml. Both share secrets.yml and env.yml.
- name: Hi.Events | Create the project directory
  ansible.builtin.file:
    path: "{{ hi_events_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Hi.Events | Create the storage directory
  # The Alpine image's startup.sh owns storage as www-data (82) and chmods it 0775.
  # Match it so deploy preserves write access and converges after container startup.
  ansible.builtin.file:
    path: "{{ hi_events_data_path }}"
    state: directory
    owner: "82"
    group: "82"
    mode: "0775"

- name: Hi.Events | Resolve and store the application secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Hi.Events | Assemble the application environment
  ansible.builtin.include_tasks: env.yml

# The shared Compose deploy renders the environment file with the project and recreates
# the project when either changed, in the same up that creates it, so a new install is
# never restarted mid first boot (its first start runs the migrations).
- name: Hi.Events | Deploy the Compose project
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ hi_events_project_dir }}"
    compose_files:
      - src: hi-events.env.j2
        dest: "{{ hi_events_env_file }}"
        mode: "0600"
    compose_secrets: >-
      {{ [_he_app_key, _he_jwt_secret, _he_database_url, _he_redis_password,
          app_config.app.database_password | default(''),
          (wiring_mail | default({})).password | default('')] | select | list }}

# The first start runs the database migrations before the application is ready.
- name: Hi.Events | Wait until the application is ready
  ansible.builtin.include_tasks: verify.yml
