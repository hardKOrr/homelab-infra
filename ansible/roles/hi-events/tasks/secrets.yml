---
# Hi.Events' application secrets, shared by the Kubernetes and Docker methods.
# Generated once, then read back from the canonical Vaultwarden item on every later run —
# the same idiom as roles/mixpost. Regenerating APP_KEY on a converged run would silently
# invalidate every value the application has already encrypted with the old one.
- name: Hi.Events | Resolve application secrets
  ansible.builtin.set_fact:
    _he_app_key: >-
      {{ app_config.app.app_key
         | default('base64:' ~ (lookup('password', '/dev/null length=32 chars=ascii_letters,digits')
                                | b64encode), true) }}
    # No 'base64:' prefix, deliberately — unlike APP_KEY, the image's own setup guide
    # (docker/all-in-one/README.md) generates this as a bare `openssl rand -base64 32`
    # and reads it as a plain JWT signing secret, not a prefixed Laravel cipher key.
    _he_jwt_secret: >-
      {{ app_config.app.jwt_secret
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits')
                    | b64encode, true) }}
    _he_redis_password: >-
      {{ app_config.app.redis_password
         | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Hi.Events | Store the canonical application secrets
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      app_key: "{{ _he_app_key }}"
      jwt_secret: "{{ _he_jwt_secret }}"
      redis_password: "{{ _he_redis_password }}"
    vault_item_secret_fields:
      - app_key
      - jwt_secret
      - redis_password
