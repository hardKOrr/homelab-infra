---
# The application environment both methods hand to the container: a Kubernetes Secret
# or the Docker or native env file. Needs secrets.yml's facts, app_config, hi_events_fqdn and
# wiring_mail (tasks/mail/resolve-mail.yml).
- name: Hi.Events | Resolve platform mail
  ansible.builtin.include_tasks: ../../../tasks/mail/resolve-mail.yml

# Order confirmations and ticket delivery ARE the application — see the header comment in
# vars/app-defaults/hi-events.yml. A ticketing platform that silently degrades to sending
# no email is worse than one that refuses to deploy without it.
- name: Hi.Events | Assert the platform mail contract is configured
  ansible.builtin.assert:
    that: wiring_mail.enabled | default(false) | bool
    fail_msg: >-
      Hi.Events sends order confirmations and tickets by email and has no fallback
      channel. Configure infrastructure.mail (CONTRACT.md's platform mail contract)
      before deploying this instance.

# One DATABASE_URL, not the DB_CONNECTION/DB_HOST/... split roles/odoo and roles/mautic
# use — this image's own production docker-compose.yml
# (HiEventsDev/hi.events:docker/all-in-one/docker-compose.yml) reads exactly this shape,
# and its .env.example carries no DB_HOST-style keys at all.
- name: Hi.Events | Build the database connection URL
  ansible.builtin.set_fact:
    _he_database_url: >-
      postgresql://{{ app_config.app.database_user }}:{{ app_config.app.database_password }}@{{
      app_config.app.database_host }}:{{ app_config.app.database_port }}/{{ app_config.app.database.name }}
  no_log: true

- name: Hi.Events | Assemble the application environment
  ansible.builtin.set_fact:
    _he_env:
      APP_KEY: "{{ _he_app_key }}"
      JWT_SECRET: "{{ _he_jwt_secret }}"
      APP_ENV: production
      APP_DEBUG: "false"
      # Laravel's own base URL (config/app.php, read by the `url()`/`asset()` helpers)
      # and, specifically, the public-disk URL builder
      # (backend/config/filesystems.php: 'url' => env('APP_URL').'/storage') — without
      # it Laravel falls back to its 'http://localhost' default and every uploaded
      # event/ticket image link breaks for anyone off this host.
      APP_URL: "https://{{ hi_events_fqdn }}"
      APP_FRONTEND_URL: "https://{{ hi_events_fqdn }}"
      APP_CDN_URL: "https://{{ hi_events_fqdn }}/storage"
      APP_DISABLE_REGISTRATION: "false"
      APP_SAAS_MODE_ENABLED: "false"
      # The frontend Node process (docker/all-in-one/supervisor/supervisord.conf's
      # `[program:nodejs]`) reads these three through supervisord's own
      # `%(ENV_VAR)s` expansion, not a build-time argument — CLIENT is what the
      # attendee's browser calls, SERVER is this container calling its own backend over
      # loopback for anything rendered server-side, and both share one origin because
      # the all-in-one image serves frontend and API from the same nginx on port 80.
      VITE_FRONTEND_URL: "https://{{ hi_events_fqdn }}"
      VITE_API_URL_CLIENT: "https://{{ hi_events_fqdn }}/api"
      # Native: the same nginx, on the application port instead of the container's 80.
      VITE_API_URL_SERVER: "http://localhost:{{ app_config.app.port if hi_events_native | bool else 80 }}/api"
      VITE_APP_NAME: "Hi.Events"
      # supervisord's `%(ENV_VITE_STRIPE_PUBLISHABLE_KEY)s` expansion is unconditional —
      # an ABSENT variable (not merely an empty one) fails supervisord's own config
      # parse and the container never starts any of its processes, Stripe or not. This
      # platform has no payment-provider contract yet, so it is always present and
      # empty; a lab wanting ticket sales sets app.stripe_publishable_key.
      VITE_STRIPE_PUBLISHABLE_KEY: "{{ app_config.app.stripe_publishable_key | default('', true) }}"
      LOG_CHANNEL: stderr
      QUEUE_CONNECTION: redis
      WEBHOOK_QUEUE_NAME: webhook-queue
      FILESYSTEM_PUBLIC_DISK: public
      FILESYSTEM_PRIVATE_DISK: local
      DATABASE_URL: "{{ _he_database_url }}"
      REDIS_HOST: "{{ '127.0.0.1' if hi_events_native | bool else instance ~ '-redis' }}"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "{{ _he_redis_password }}"
      MAIL_MAILER: smtp
      MAIL_DRIVER: smtp
      MAIL_HOST: "{{ wiring_mail.host }}"
      MAIL_PORT: "{{ wiring_mail.port | string }}"
      MAIL_USERNAME: "{{ wiring_mail.username }}"
      MAIL_PASSWORD: "{{ wiring_mail.password }}"
      MAIL_ENCRYPTION: "{{ wiring_mail.encryption }}"
      MAIL_AUTO_TLS: "true"
      MAIL_VERIFY_PEER: "true"
      MAIL_FROM_ADDRESS: "{{ wiring_mail.from_address }}"
      MAIL_FROM_NAME: "{{ wiring_mail.from_name | default('Hi.Events', true) }}"
  no_log: true
