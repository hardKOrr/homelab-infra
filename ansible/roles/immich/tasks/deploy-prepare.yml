---
# Deploy hook (playbooks/apps/deploy.yml, localhost, before provisioning). Immich needs its
# one declared durable media mount and its iGPU mapping; the mount is attached to
# the stack host on that host's own node only.
- name: Immich | Require exactly one new durable media mount
  ansible.builtin.assert:
    that:
      - app_config.media_storage.mounts is sequence
      - app_config.media_storage.mounts | length == 1
      - app_config.media_storage.mounts[0].host | default('') is match('^/')
      - app_config.media_storage.mounts[0].path | default('') is match('^/')
      - app_config.media_storage.owner.user | default('') is match('^[a-z_][a-z0-9_-]*$')
      - app_config.media_storage.owner.uid | default(0) | int > 0
      - app_config.media_storage.owner.gid | default(0) | int > 0
    fail_msg: >-
      Immich needs exactly one explicitly declared media_storage.mounts entry for
      originals/thumbnails plus media_storage.owner. The platform will attach that
      existing host directory and will not adopt global media storage.
    quiet: true
  when: app_config.hosting.method in ['docker', 'native']

- name: Immich | Require the dedicated iGPU mapping on a VM stack host
  ansible.builtin.assert:
    that:
      - app_config.app.gpu_device | default('') | length > 0
      - app_config.app.gpu_render_node | default('') is match('^/dev/dri/renderD[0-9]+$')
    fail_msg: >-
      Immich machine learning requires a dedicated iGPU mapping in proxmox.devices and
      a render node path inside the VM.
    quiet: true
  when:
    - app_config.hosting.method == 'docker'
    - _hosting_guest_type | default('vm') != 'lxc'

# A native VM has no iGPU: the shared native guest has no PCI passthrough step, and a Proxmox
# host's /dev/dri cannot be shared into a VM. Machine learning runs on its CPU. An LXC binds
# the shared nodes below, which serve the server's VAAPI transcoding.
- name: Immich | Refuse a GPU declaration for native Immich on a VM
  ansible.builtin.assert:
    that:
      - app_config.app.gpu_device | default('', true) | trim | length == 0
      - app_config.app.devices | default([]) | select('match', '^/dev/dri(?:/|$)') | list | length == 0
    fail_msg: >-
      Native Immich on a VM cannot reach the iGPU. Clear app.gpu_device and the /dev/dri
      entries of app.devices, or run Immich on an LXC (shared iGPU) or on Kubernetes.
    quiet: true
  when:
    - app_config.hosting.method == 'native'
    - _hosting_guest_type | default('vm') != 'lxc'

# On Kubernetes app.gpu_device is optional: it names the dedicated iGPU of the k3s node
# that runs machine learning, and without it machine learning runs on the CPU.
- name: Immich | Check the GPU placement declaration on Kubernetes
  ansible.builtin.include_tasks: ../../../tasks/proxmox/assert-dedicated-igpu.yml
  vars:
    igpu_app_display: Immich
  when: app_config.hosting.method == 'kubernetes'

# On an LXC the iGPU is optional and shared: without app.devices, machine learning runs on
# the CPU.
- name: Immich | Validate the shared iGPU declaration on an LXC
  ansible.builtin.include_tasks: ../../../tasks/proxmox/assert-dedicated-igpu.yml
  vars:
    igpu_app_display: Immich
  when:
    - app_config.hosting.method in ['docker', 'native']
    - _hosting_guest_type | default('vm') == 'lxc'

- name: Immich | Name the shared DRI nodes to bind into the LXC
  ansible.builtin.set_fact:
    deploy_host_shared_devices: >-
      {{ app_config.app.devices | default([])
         | select('match', '^/dev/dri/') | map('community.general.dict_kv', 'host') | list }}
  when:
    - app_config.hosting.method in ['docker', 'native']
    - _hosting_guest_type | default('vm') == 'lxc'

- name: Immich | Name the originals and thumbnails mount for the stack host
  ansible.builtin.set_fact:
    deploy_host_mounts: "{{ app_config.media_storage.mounts }}"
    deploy_host_mounts_owner: "{{ app_config.media_storage.owner }}"
    deploy_host_mounts_own_node: true
  when: app_config.hosting.method in ['docker', 'native']
