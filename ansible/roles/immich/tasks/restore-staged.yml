---
# restore-swap.yml staged hook: the point must hold a database dump. The media owner may
# traverse staging to copy media out of it, so the dump's directory is closed to it.
- name: Immich restore | Keep the database dump private from the media owner
  ansible.builtin.file:
    path: "{{ recovery_swap_stage }}/database"
    state: directory
    mode: "0700"

- name: Immich restore | Check the archived database dump
  ansible.builtin.stat:
    path: "{{ recovery_swap_stage }}/database/immich.dump"
  register: _immich_restore_dump
  changed_when: false

- name: Immich restore | Refuse an archive without a database dump
  ansible.builtin.assert:
    that: _immich_restore_dump.stat.size | default(0) | int > 0
    fail_msg: >-
      The selected Immich point holds no database dump; Immich keeps running unchanged.
