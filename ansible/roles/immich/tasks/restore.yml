---
# Restore Immich's application-consistent database and durable media artifact.
#
# Plan mode only lists the source snapshots. Overwrite mode is deliberately destructive:
# services stop, the PBS archives are fetched and validated, then the media mount and named
# database are replaced. A failed restore leaves services stopped for operator recovery.
- name: Immich restore | Require one declared durable media mount
  ansible.builtin.assert:
    that:
      - app_config.media_storage.mounts is sequence
      - app_config.media_storage.mounts | length == 1
      - app_config.media_storage.mounts[0].path | default('') is match('^/')
    fail_msg: >-
      Immich restore requires the deployed target's one explicitly declared media_storage.mounts entry.

- name: Immich restore | Resolve the target backend and credential
  ansible.builtin.set_fact:
    _immich_restore_database_backend: >-
      {{ (homelabinfra_infra.databases | default({})).get(app_config.app.database.instance, {}) }}
    _immich_restore_database_password: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_password
         | default(app_config.app.database_password | default(''), true) }}
    _immich_restore_database_user: >-
      {{ (homelabinfra_vault.apps | default({})).get(restore_target, {}).database_user
         | default(app_config.app.database.role | default(''), true) }}
    _immich_restore_media_path: "{{ (app_config.media_storage.mounts | first).path }}"
    _immich_restore_backup_id: "{{ restore_backup_id | default(instance, true) }}"
  no_log: true

- name: Immich restore | Assert the restore contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - restore_target is defined and restore_target | length > 0
      - (restore_snapshot | default('') | length > 0) or not (restore_overwrite | bool)
      - _immich_restore_database_backend.provider | default('') == 'postgresql'
      - _immich_restore_database_backend.host | default('') | length > 0
      - _immich_restore_database_backend.port | default(0) | int > 0
      - app_config.app.database.name | default('') | length > 0
      - _immich_restore_database_user | length > 0
      - _immich_restore_database_password | length > 0
    fail_msg: >-
      Immich restore needs a deployed target, a named PostgreSQL backend, its Vaultwarden
      credential, and a snapshot when overwrite=true.
  no_log: true

- name: Immich restore | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/kubernetes/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Immich restore | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Immich. Restore cannot proceed without the declared
      recovery provider.

- name: Immich restore | List available snapshots in plan mode
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - host
      - --env
      - PBS_REPOSITORY
      - --env
      - PBS_FINGERPRINT
      - --env
      - PBS_PASSWORD
      - "{{ app_config.backup.client.image }}"
      - /bin/sh
      - -ceu
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "{{ app_config.backup.client.key_url }}" -o /etc/apt/keyrings/proxmox-release.gpg
        echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] {{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}" \
          > /etc/apt/sources.list.d/pbs-client.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
        proxmox-backup-client snapshot list "host/$BACKUP_ID"
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
    BACKUP_ID: "{{ _immich_restore_backup_id }}"
  register: _immich_restore_snapshots
  changed_when: false
  no_log: true
  when: not (restore_overwrite | bool)

- name: Immich restore | Report the read-only plan
  ansible.builtin.debug:
    msg:
      - "PLAN ONLY — nothing was changed."
      - "Available snapshots for host/{{ _immich_restore_backup_id }} were queried from PBS."
      - "A real restore replaces {{ _immich_restore_media_path }} and database {{ app_config.app.database.name }}."
      - "Re-run with snapshot=<snapshot-id> and overwrite=true only after verifying the target."
  when: not (restore_overwrite | bool)

- name: Immich restore | Allocate private scratch space
  ansible.builtin.tempfile:
    state: directory
    prefix: immich-restore-
  register: _immich_restore_scratch
  changed_when: true
  when: restore_overwrite | bool

- name: Immich restore | Replace the application-consistent artifact
  when: restore_overwrite | bool
  block:
    - name: Immich restore | Stop Immich services
      community.docker.docker_compose_v2:
        project_src: "{{ immich_project_dir }}"
        state: stopped
        services:
          - immich-server
          - immich-machine-learning

    - name: Immich restore | Fetch the database and durable media archives
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _immich_restore_scratch.path }}:/restore"
          - --env
          - PBS_REPOSITORY
          - --env
          - PBS_FINGERPRINT
          - --env
          - PBS_PASSWORD
          - --env
          - PBS_SNAPSHOT
          - --env
          - PBS_KEY_URL
          - --env
          - PBS_APT_REPO
          - "{{ app_config.backup.client.image }}"
          - /bin/sh
          - -ceu
          - |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings /restore/database /restore/media
            curl -fsSL "$PBS_KEY_URL" -o /etc/apt/keyrings/proxmox-release.gpg
            echo "deb [signed-by=/etc/apt/keyrings/proxmox-release.gpg] $PBS_APT_REPO" \
              > /etc/apt/sources.list.d/pbs-client.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends proxmox-backup-client >/dev/null
            proxmox-backup-client restore "$PBS_SNAPSHOT" database.pxar /restore/database
            proxmox-backup-client restore "$PBS_SNAPSHOT" media.pxar /restore/media
            test -s /restore/database/immich.dump
      environment:
        PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
        PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
        PBS_PASSWORD: "{{ k8s_pbs_password }}"
        PBS_SNAPSHOT: "{{ restore_snapshot }}"
        PBS_KEY_URL: "{{ app_config.backup.client.key_url }}"
        PBS_APT_REPO: "{{ app_config.backup.client.repository }} {{ app_config.backup.client.suite }} {{ app_config.backup.client.component }}"
      no_log: true
      changed_when: true

    - name: Immich restore | Empty the durable media mount after archive validation
      ansible.builtin.shell: >-
        find "{{ _immich_restore_media_path }}" -mindepth 1 -maxdepth 1
        -exec rm -rf -- {} +
      changed_when: true
      no_log: true

    - name: Immich restore | Restore durable originals and thumbnails
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ _immich_restore_scratch.path }}/media/."
          - "{{ _immich_restore_media_path }}/"
      changed_when: true

    - name: Immich restore | Restore the named PostgreSQL database
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - host
          - --volume
          - "{{ _immich_restore_scratch.path }}/database:/restore:ro"
          - --env
          - DB_HOST
          - --env
          - DB_PORT
          - --env
          - DB_NAME
          - --env
          - DB_USER
          - --env
          - DB_PASSWORD
          - "{{ app_config.backup.postgres_client_image }}"
          - /bin/sh
          - -ceu
          - >-
            PGPASSWORD="$DB_PASSWORD" pg_restore --clean --if-exists --no-owner --no-acl
            --exit-on-error --host="$DB_HOST" --port="$DB_PORT" --username="$DB_USER"
            --dbname="$DB_NAME" /restore/immich.dump
      environment:
        DB_HOST: "{{ _immich_restore_database_backend.host }}"
        DB_PORT: "{{ _immich_restore_database_backend.port }}"
        DB_NAME: "{{ app_config.app.database.name }}"
        DB_USER: "{{ _immich_restore_database_user }}"
        DB_PASSWORD: "{{ _immich_restore_database_password }}"
      no_log: true
      changed_when: true

    - name: Immich restore | Start Immich services
      community.docker.docker_compose_v2:
        project_src: "{{ immich_project_dir }}"
        state: present
        services:
          - immich-server
          - immich-machine-learning

    - name: Immich restore | Wait for the restored server
      ansible.builtin.uri:
        url: "http://localhost:{{ app_config.app.port }}/api/server/ping"
        status_code: 200
      register: _immich_restore_health
      until: _immich_restore_health.status | default(0) == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Immich restore | Mark the restore complete
      ansible.builtin.set_fact:
        _application_restore_complete: true
  rescue:
    - name: Immich restore | Stop Immich after a failed restore attempt
      community.docker.docker_compose_v2:
        project_src: "{{ immich_project_dir }}"
        state: stopped
        services:
          - immich-server
          - immich-machine-learning
      failed_when: false

    - name: Immich restore | Leave the application stopped after a failed restore
      ansible.builtin.fail:
        msg: >-
          Immich restore {{ restore_snapshot }} did not complete. Immich is intentionally
          left stopped because its database or durable media may be partially replaced.
          Resolve the failed restore or start the Compose project only after inspection.
  always:
    - name: Immich restore | Remove private scratch space
      ansible.builtin.file:
        path: "{{ _immich_restore_scratch.path }}"
        state: absent
      when: _immich_restore_scratch.path is defined
