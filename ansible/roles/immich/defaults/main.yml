---
immich_project_dir: "/opt/{{ instance }}"
immich_compose_file: "{{ immich_project_dir }}/docker-compose.yml"
immich_env_file: "{{ immich_project_dir }}/immich.env"

# Kubernetes method (kubernetes.yml): the media claim and the uid:gid the server runs as
# and the claim is owned by, the media owner of the Docker method.
immich_k8s_media_claim: "{{ instance }}-media"
immich_k8s_owner: "{{ app_config.media_storage.owner.uid | int }}:{{ app_config.media_storage.owner.gid | int }}"
immich_k8s_ml_port: 3003
