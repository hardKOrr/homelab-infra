---
# One quiesced archive contains Karakeep's SQLite/assets volume and Meilisearch index.

- name: Karakeep backup | Assert the backup contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Karakeep needs its declared application-consistent backup contract and a configured
      PBS before an on-demand backup can run.

- name: Karakeep backup | Resolve its persistent paths
  ansible.builtin.set_fact:
    _karakeep_backup_data_path: "{{ app_config.app.data_path }}"
    _karakeep_backup_search_path: "{{ karakeep_meilisearch_data_path }}"

- name: Karakeep backup | Assert the data paths do not overlap
  ansible.builtin.assert:
    that:
      - _karakeep_backup_data_path is match('^/[^/].*')
      - _karakeep_backup_data_path != '/'
      - _karakeep_backup_search_path is match('^/[^/].*')
      - _karakeep_backup_search_path != '/'
      - _karakeep_backup_data_path != _karakeep_backup_search_path
      - not _karakeep_backup_data_path.startswith(_karakeep_backup_search_path.rstrip('/') ~ '/')
      - not _karakeep_backup_search_path.startswith(_karakeep_backup_data_path.rstrip('/') ~ '/')
    fail_msg: >-
      Karakeep's data and Meilisearch paths must be separate absolute directories; refusing
      to archive an overlapping or root path.

- name: Karakeep backup | Inspect persistent paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _karakeep_backup_data_path }}"
    - "{{ _karakeep_backup_search_path }}"
  register: _karakeep_backup_paths
  changed_when: false

- name: Karakeep backup | Require existing persistent directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
    fail_msg: >-
      Karakeep persistent path {{ item.item }} is not an existing directory; refusing to
      create a recovery point without all application state.
  loop: "{{ _karakeep_backup_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Karakeep backup | Inspect the SQLite database
  ansible.builtin.stat:
    path: "{{ _karakeep_backup_data_path }}/db.db"
  register: _karakeep_backup_sqlite_database
  changed_when: false

- name: Karakeep backup | Require a non-empty SQLite database before backup
  ansible.builtin.assert:
    that:
      - _karakeep_backup_sqlite_database.stat.exists
      - _karakeep_backup_sqlite_database.stat.isreg
      - not _karakeep_backup_sqlite_database.stat.islnk
      - _karakeep_backup_sqlite_database.stat.size | int > 0
    fail_msg: >-
      No non-empty Karakeep SQLite database exists in the configured data volume; refusing
      to create an incomplete recovery point.

# data.pxar holds data/ and meilisearch/. Both directories appear inside an empty
# archive root that exists only for the backup, so the point keeps that layout.
- name: Karakeep backup | Create the empty archive root
  ansible.builtin.file:
    path: "{{ karakeep_project_dir }}/.pbs-backup-root/{{ item }}"
    state: directory
    mode: "0700"
  loop: [data, meilisearch]

- name: Karakeep backup | Archive the quiesced application state to PBS
  block:
    - name: Karakeep backup | Stop only this instance's services and push one data archive
      ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-backup.yml
      vars:
        pbs_client_runtime: docker
        pbs_client_compose_project: "{{ karakeep_project_dir }}"
        pbs_client_stop_services: [web, chrome, meilisearch]
        pbs_client_backup_args: [--all-file-systems, "true"]
        pbs_client_archives:
          - name: data.pxar
            path: "{{ karakeep_project_dir }}/.pbs-backup-root"
        pbs_client_backup_mounts:
          - path: "{{ _karakeep_backup_data_path }}"
            target: "{{ karakeep_project_dir }}/.pbs-backup-root/data"
          - path: "{{ _karakeep_backup_search_path }}"
            target: "{{ karakeep_project_dir }}/.pbs-backup-root/meilisearch"

    - name: Karakeep backup | Mark the backup complete
      ansible.builtin.set_fact:
        _application_backup_complete: true
  always:
    # rmdir removes only the empty mount points, never data.
    - name: Karakeep backup | Remove the empty archive root
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ karakeep_project_dir }}/.pbs-backup-root/data"
          - "{{ karakeep_project_dir }}/.pbs-backup-root/meilisearch"
          - "{{ karakeep_project_dir }}/.pbs-backup-root"
      changed_when: true
