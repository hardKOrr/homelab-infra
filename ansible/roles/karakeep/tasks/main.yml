---
# Karakeep is a three-container application-native recovery unit (Docker), or the same
# web, workers, browser and Meilisearch services under systemd (native). The web
# service owns the SQLite database and assets; Meilisearch owns its index; the browser is
# disposable runtime support with no persistent state.

- name: Karakeep | Create project directory
  ansible.builtin.file:
    path: "{{ karakeep_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Karakeep | Resolve canonical application credentials
  ansible.builtin.include_tasks: credentials.yml

- name: Karakeep | Deploy on Docker
  ansible.builtin.include_tasks: docker.yml
  when: not (karakeep_native | bool)

- name: Karakeep | Deploy natively
  ansible.builtin.include_tasks: native.yml
  when: karakeep_native | bool
