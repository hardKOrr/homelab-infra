---
- name: Karakeep | Create persistent application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ karakeep_data_uid }}"
    group: "{{ karakeep_data_gid }}"
    mode: "0750"
  loop:
    - "{{ karakeep_data_path }}"
    - "{{ karakeep_meilisearch_data_path }}"

# The shared Compose deploy renders the environment file with the project and recreates
# the project when either changed, in the same up that creates it, so a new install is
# never restarted mid first boot.
- name: Karakeep | Deploy the Compose recovery unit
  ansible.builtin.include_tasks: ../../../tasks/stack/compose-deploy.yml
  vars:
    compose_project_dir: "{{ karakeep_project_dir }}"
    compose_files:
      - src: karakeep.env.j2
        dest: "{{ karakeep_env_file }}"
        mode: "0600"
    compose_secrets: ["{{ _karakeep_meili_master_key }}", "{{ _karakeep_nextauth_secret }}"]
    compose_health:
      url: "http://localhost:{{ app_config.app.port }}/api/health"
      retries: 60
