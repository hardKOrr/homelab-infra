---
- name: Karakeep | Generate or reuse application credentials
  ansible.builtin.set_fact:
    _karakeep_nextauth_secret: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).nextauth_secret
         | default(lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits'), true) }}
    _karakeep_meili_master_key: >-
      {{ (homelabinfra_vault.apps | default({})).get(instance, {}).meili_master_key
         | default(lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits'), true) }}
  no_log: true

- name: Karakeep | Store application credentials in Vaultwarden
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields:
      provider: karakeep
      instance: "{{ instance }}"
      nextauth_secret: "{{ _karakeep_nextauth_secret }}"
      meili_master_key: "{{ _karakeep_meili_master_key }}"
    vault_item_secret_fields: [nextauth_secret, meili_master_key]
  no_log: true
