---
karakeep_native: "{{ app_config.hosting.method | default('docker') == 'native' }}"
# Natively the install script owns /opt/karakeep and chowns it to its service user, so the
# role's working directory (installer copy, backup mount root) lives beside it, never in it.
karakeep_project_dir: "{{ '/opt/homelab-' ~ instance if karakeep_native | bool else '/opt/' ~ instance }}"
karakeep_env_file: "{{ karakeep_project_dir }}/karakeep.env"
# Persistent state: Docker binds these paths into the containers; the native install
# script fixes the first and its Meilisearch package the second.
karakeep_data_path: "{{ '/var/lib/karakeep' if karakeep_native | bool else app_config.app.data_path }}"
karakeep_meilisearch_data_path: >-
  {{ '/var/lib/meilisearch/data' if karakeep_native | bool else karakeep_project_dir ~ '/meilisearch' }}
# Numeric owner of the data and Meilisearch directories on Docker; Deploy and restore both
# apply it. Natively the install script's karakeep and meilisearch users own them.
karakeep_data_uid: 1000
karakeep_data_gid: 1000
karakeep_native_env_file: /etc/karakeep/karakeep.env
karakeep_native_meili_config: /etc/meilisearch.toml
karakeep_native_script_dir: "{{ karakeep_project_dir }}/native"
