---
# The native services' restart (tasks/native.yml). On Docker, tasks/stack/compose-deploy.yml
# recreates the project itself when the Compose or environment file changes.
- name: Restart Karakeep
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: [meilisearch, karakeep-workers, karakeep-web]
  when: karakeep_native | bool
