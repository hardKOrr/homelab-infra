---
- name: Redis | Resolve configured guest memory
  ansible.builtin.import_tasks: ../../../tasks/database/resolve-guest-memory.yml
  when: not (redis_docker | bool)

- name: Redis | Resolve database memory settings
  ansible.builtin.import_tasks: resolve-memory.yml

- name: Redis | Install the pinned PBS client when this lab declares app backups
  ansible.builtin.include_tasks: ../../../tasks/backup/pbs-client-install.yml
  when:
    - app_config.backup.enabled | default(false) | bool
    - not (redis_docker | bool)
    - >-
      ((homelabinfra_infra | default({})).get('backups', {}).get('host', '')
       | length) > 0

- name: Redis | Refresh apt metadata when stale
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  changed_when: false

- name: Redis | Install server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: false
  when: not (redis_docker | bool)

# Docker: the server runs in the image; the host needs only its client tools (redis-cli,
# redis-check-rdb), which the shared recovery tasks run against the published port.
- name: Redis | Install the host client tools for Docker
  ansible.builtin.apt:
    name: redis-tools
    state: present
    update_cache: false
  when: redis_docker | bool

- name: Redis | Create the Docker project directory
  ansible.builtin.file:
    path: "{{ redis_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: redis_docker | bool

- name: Redis | Resolve backend password
  ansible.builtin.set_fact:
    _redis_password: "{{ app_config.app.password | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"
    _redis_credentials_known: "{{ app_config.app.password | default('') | length > 0 }}"
  no_log: true

- name: Redis | Resolve the ACL file path
  ansible.builtin.set_fact:
    _redis_acl_path: "{{ redis_acl_path }}"

- name: Redis | Ensure the data directory exists
  ansible.builtin.file:
    path: "{{ redis_data_path }}"
    state: directory
    owner: "{{ redis_owner }}"
    group: "{{ redis_owner }}"
    mode: "0750"

- name: Redis | Inspect the ACL file before managing it
  ansible.builtin.stat:
    path: "{{ _redis_acl_path }}"
  register: _redis_acl_file
  changed_when: false

- name: Redis | Refuse to manage a linked or non-file ACL path
  ansible.builtin.assert:
    that:
      - not _redis_acl_file.stat.exists or (not _redis_acl_file.stat.islnk and _redis_acl_file.stat.isreg)
    fail_msg: "Redis ACL path {{ _redis_acl_path }} is linked or is not a regular file."

- name: Redis | Create the ACL file without replacing existing users
  ansible.builtin.copy:
    dest: "{{ _redis_acl_path }}"
    content: ""
    force: false
    owner: "{{ redis_owner }}"
    group: "{{ redis_owner }}"
    mode: "0600"
  when: not _redis_acl_file.stat.exists

- name: Redis | Manage the ACL file ownership and mode
  ansible.builtin.file:
    path: "{{ _redis_acl_path }}"
    state: file
    owner: "{{ redis_owner }}"
    group: "{{ redis_owner }}"
    mode: "0600"

- name: Redis | Check for existing managed configuration
  ansible.builtin.stat:
    path: "{{ redis_conf_path }}"
    get_checksum: false
    get_mime: false
  register: _redis_config_file

- name: Redis | Read existing managed configuration
  ansible.builtin.slurp: {src: "{{ redis_conf_path }}"}
  register: _redis_config
  changed_when: false
  when: _redis_config_file.stat.exists
- name: Redis | Refuse to replace an unavailable existing password
  ansible.builtin.assert:
    that: _redis_credentials_known | bool
    fail_msg: "Redis instance {{ instance }} has a managed password but its Vaultwarden credential is unavailable."
  when: "'Managed by homelab-infra' in (_redis_config.content | default('') | b64decode) and not (_redis_credentials_known | bool)"
  no_log: true
- name: Redis | Store initial backend password before configuration
  ansible.builtin.include_tasks: ../../../tasks/bitwarden/upsert-item.yml
  vars:
    vault_item_name: "homelab-infra/apps/{{ instance }}"
    vault_item_merge: true
    vault_item_fields: {password: "{{ _redis_password }}"}
    vault_item_secret_fields: [password]
  when: not (_redis_credentials_known | bool)
  no_log: true
- name: Redis | Make backend password available to the template
  ansible.builtin.set_fact:
    app_config: "{{ app_config | combine({'app': {'password': _redis_password}}, recursive=True) }}"
  no_log: true

- name: Redis | Reconcile the default ACL login with Vaultwarden
  ansible.builtin.import_tasks: reconcile-default-user.yml

- name: Redis | Configure protected application listener
  ansible.builtin.template:
    src: "{{ 'redis-docker.conf.j2' if redis_docker | bool else 'redis.conf.j2' }}"
    dest: "{{ redis_conf_path }}"
    mode: "{{ '0644' if redis_docker | bool else '0640' }}"
    owner: "{{ 'root' if redis_docker | bool else 'redis' }}"
    group: "{{ 'root' if redis_docker | bool else 'redis' }}"
  notify: "{{ 'Restart Redis container' if redis_docker | bool else 'Restart Redis' }}"
- name: Redis | Enable and start service
  ansible.builtin.systemd: {name: "{{ app_config.app.service_name }}", state: started, enabled: true}
  when: not (redis_docker | bool)

- name: Redis | Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ redis_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Redis container
  when: redis_docker | bool

- name: Redis | Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ redis_project_dir }}"
    policy: missing
  when: redis_docker | bool

- name: Redis | Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ redis_project_dir }}"
    state: present
    remove_orphans: true
  when: redis_docker | bool
- ansible.builtin.meta: flush_handlers
- name: Redis | Verify authenticated local server readiness
  ansible.builtin.command:
    argv:
      - redis-cli
      - --no-auth-warning
      - -h
      - 127.0.0.1
      - -p
      - "{{ app_config.app.port | int }}"
      - ping
  environment:
    REDISCLI_AUTH: "{{ _redis_password }}"
  register: _redis_ready
  until: _redis_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  no_log: true
