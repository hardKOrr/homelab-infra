---
# CLIENT PAUSE WRITE holds the dataset still while Redis's own replication protocol
# creates a consistent RDB export and ACL SAVE persists the matching user file.
- name: Redis backup | Resolve paths and the recovery identity
  ansible.builtin.set_fact:
    _redis_backup_data_path: "{{ app_config.app.data_path | default('') }}"
    _redis_backup_acl_path: "{{ app_config.app.acl_path | default(app_config.app.data_path ~ '/users.acl') }}"
    _redis_backup_service_name: "{{ app_config.app.service_name | default('redis-server') }}"
    _redis_backup_id: "{{ app_config.backup.backup_id | default('', true) or instance }}"
    _redis_backup_password: "{{ (homelabinfra_vault.apps | default({})).get(instance, {}).get('password', '') }}"
    _redis_backup_writes_paused: false
    _application_backup_complete: false
  no_log: true

- name: Redis backup | Require the backend password in Vaultwarden
  ansible.builtin.assert:
    that: _redis_backup_password | length > 0
    fail_msg: Redis native backup needs the backend password stored in Vaultwarden.
  no_log: true

- name: Redis backup | Assert the application recovery contract
  ansible.builtin.assert:
    that:
      - app_config.backup.enabled | default(false) | bool
      - app_config.backup.application_consistent | default(false) | bool
      - _redis_backup_data_path is match('^/[^/].*')
      - _redis_backup_data_path != '/'
      - _redis_backup_acl_path | dirname == _redis_backup_data_path
      - _redis_backup_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - app_config.backup.retention_days | default(14) | int > 0
      - homelabinfra_infra.backups is defined
    fail_msg: >-
      Redis backup needs its application-consistent contract, a safe data path and backup
      id, and a configured PBS target.

- name: Redis backup | Resolve the PBS client target
  ansible.builtin.include_tasks: ../../../tasks/backup/resolve-pbs-target.yml
  vars:
    k8s_pbs_datastore_override: "{{ app_config.backup.datastore | default('') }}"

- name: Redis backup | Require PBS
  ansible.builtin.assert:
    that: k8s_pbs_available | bool
    fail_msg: >-
      No usable PBS is recorded for Redis. Deploy PBS and retry; a local file is not a
      recovery point.

- name: Redis backup | Require the installed PBS client
  ansible.builtin.stat:
    path: /usr/bin/proxmox-backup-client
  register: _redis_backup_client
  changed_when: false

- name: Redis backup | Assert the PBS client is installed
  ansible.builtin.assert:
    that: _redis_backup_client.stat.exists and _redis_backup_client.stat.isreg
    fail_msg: Deploy Redis with the current role before requesting an application backup.

- name: Redis backup | Check the data and ACL paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _redis_backup_data_path }}"
    - "{{ _redis_backup_acl_path }}"
  register: _redis_backup_paths
  changed_when: false

- name: Redis backup | Require complete native state
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - not item.stat.islnk
      - >-
        (item.item == _redis_backup_data_path and item.stat.isdir)
        or (item.item == _redis_backup_acl_path and item.stat.isreg)
    fail_msg: >-
      Redis recovery path {{ item.item }} is missing, linked or has the wrong type; refusing
      to create an incomplete recovery point.
  loop: "{{ _redis_backup_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Redis backup | Require the Redis service to be active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ _redis_backup_service_name }}"]
  register: _redis_backup_service_state
  failed_when: false
  changed_when: false

- name: Redis backup | Refuse to snapshot an inactive service
  ansible.builtin.assert:
    that: _redis_backup_service_state.stdout | trim == 'active'
    fail_msg: Start and verify Redis before creating an application recovery point.

- name: Redis backup | Read the existing recovery points
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - proxmox-backup-client
      - snapshot
      - list
      - "host/{{ _redis_backup_id }}"
      - --output-format
      - json
  environment:
    PBS_REPOSITORY: "{{ k8s_pbs_repository }}"
    PBS_FINGERPRINT: "{{ k8s_pbs_fingerprint }}"
    PBS_PASSWORD: "{{ k8s_pbs_password }}"
  register: _redis_backup_snapshots_before
  failed_when: false
  changed_when: false
  no_log: true

- name: Redis backup | Report an unreadable baseline listing
  ansible.builtin.include_tasks: ../../../tasks/fail-with-scrubbed-output.yml
  vars:
    scrub_failure_result: "{{ _redis_backup_snapshots_before }}"
    scrub_failure_secrets:
      - "{{ k8s_pbs_password }}"
      - "{{ k8s_pbs_fingerprint }}"
      - "{{ k8s_pbs_repository }}"
    scrub_failure_context: Redis backup | baseline recovery points could not be verified

- name: Redis backup | Validate the baseline listing
  ansible.builtin.assert:
    that: (_redis_backup_snapshots_before.stdout | from_json | type_debug) == 'list'
    fail_msg: Redis backup could not parse the baseline PBS recovery point list.
  no_log: true

- name: Redis backup | Export and upload the recovery point
  block:
    - name: Redis backup | Create private export staging
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: .redis-recovery-
      register: _redis_backup_stage

    - ansible.builtin.include_tasks: backup-export.yml
  always:
    - name: Redis backup | Remove the private export staging
      ansible.builtin.file:
        path: "{{ _redis_backup_stage.path }}"
        state: absent
      when: _redis_backup_stage is defined
