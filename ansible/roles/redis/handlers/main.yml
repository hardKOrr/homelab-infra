---
# The native service's restart. On Docker, tasks/main.yml recreates the project itself
# when the Compose file, listener config or ACL file changes.
- name: Restart Redis
  ansible.builtin.include_tasks: ../../../tasks/apps/restart.yml
  vars:
    restart_runtime: native
    restart_services: ["{{ app_config.app.service_name }}"]
  when: not (redis_docker | bool)
