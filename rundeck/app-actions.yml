schema_version: 2

# Day-2 actions that exist once per application instead of once for the whole lab.
#
# Each entry names a template in rundeck/jobs/. The renderer expands one template into one
# job per application it applies to, filed under that application's own Maintenance folder
# with the instance, app name and stack tag already answered. A template is never imported
# as itself.
#
# `actions` are the standard verbs. Every catalog application gets each one unless a fact
# its defaults or catalog entry already states rules it out (`requires`):
#
#   recovery   ansible/vars/app-defaults/<app>.yml declares recovery.methods
#   docker     hosting.supported lists a Docker form (docker-lxc or docker-vm)
#   guest      the app is not an ISO-installed appliance, which has no SSH or guest-agent
#              interface to restart it or read its log through
#   removable  the catalog entry is not `essential` and names no app-specific remove verb
#
# A catalog `exclude:` withholds a standard verb one application cannot implement
# truthfully, with its reason beside it. An instance whose hosting method does not
# implement a verb it was offered refuses it in the playbook's first resolving task, in
# one sentence (tasks/maintenance/resolve-app-target.yml).
#
# `app_actions` belong to one application and render only where its catalog `extra:` names
# them. `replaces: remove` marks one as that application's Remove.

actions:
  backup:
    template: backup-app.yaml
    requires: [recovery]

  configure:
    template: configure-app.yaml

  remove:
    template: remove-app.yaml
    requires: [removable]

  restart:
    template: restart-app.yaml
    requires: [guest]

  restore:
    template: restore-app.yaml
    requires: [recovery]

  rollback:
    template: rollback-container.yaml
    requires: [docker]

  tail:
    template: tail-applog.yaml
    requires: [guest]

app_actions:
  migrate:
    template: migrate-servarr.yaml

  pdm_backup:
    template: backup-pdm.yaml

  pdm_restore:
    template: restore-pdm.yaml

  pdm_remove:
    template: remove-pdm.yaml
    replaces: remove

  remove_k3s_cluster:
    template: remove-k3s-cluster.yaml
    replaces: remove

  wireguard_remove:
    template: remove-wireguard.yaml
    replaces: remove
