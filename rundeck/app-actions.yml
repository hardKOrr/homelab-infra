schema_version: 1

# Day-2 actions that exist once per application instead of once for the whole lab.
#
# Each entry names a template in rundeck/jobs/. The renderer expands one template into one
# job per application it applies to, filed under that application's own Maintenance folder
# with the instance, app name and stack tag already answered. A template is never imported
# as itself.
#
# APPLICABILITY is the hosting kind the action is actually implemented for, derived from
# ansible/vars/app-defaults/<slug>.yml, then narrowed by a catalog `exclude:` when one
# application cannot implement the generic action truthfully. An action absent from an
# application's folder is absent deliberately: offering a Rollback for a Kubernetes
# workload, or for a multi-image Compose project when the seam pins one image, would put a
# misleading button in front of the operator. `appliance` is an ISO-installed VM without
# an SSH/guest-agent contract; its Remove action stops the VM through Proxmox.
#
#   hosting             hosting kinds this action is implemented for
#   essential_excluded  true withholds the action from applications marked essential
#   opt_in              true means hosting never selects it; only a catalog `extra:` does

actions:
  backup:
    template: backup-app.yaml
    hosting: [kubernetes]

  pdm_backup:
    template: backup-pdm.yaml
    hosting: [appliance]
    opt_in: true

  configure:
    template: configure-app.yaml
    hosting: [native, docker, kubernetes]

  migrate:
    template: migrate-servarr.yaml
    hosting: []
    opt_in: true

  remove:
    template: remove-app.yaml
    hosting: [native, docker, kubernetes, appliance]
    essential_excluded: true

  restart:
    template: restart-app.yaml
    hosting: [native, docker]

  restore:
    template: restore-app.yaml
    hosting: [kubernetes]

  pdm_restore:
    template: restore-pdm.yaml
    hosting: [appliance]
    opt_in: true

  pdm_remove:
    template: remove-pdm.yaml
    hosting: [appliance]
    opt_in: true

  wireguard_remove:
    template: remove-wireguard.yaml
    hosting: []
    opt_in: true

  rollback:
    template: rollback-container.yaml
    hosting: [docker]

  tail:
    template: tail-applog.yaml
    hosting: [native, docker]
