# Get Config — read config/ back out, redacted to the log and whole to an archive.
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 786ded77-68eb-5b3e-bb11-bca0edaea79c
  uuid: 786ded77-68eb-5b3e-bb11-bca0edaea79c
  name: Get Config
  group: Manage/Configuration/Files
  description: |-
    Read the lab configuration from the runner without an SSH session.

    - **One instance:** Prints that instance file.
    - **No instance:** Prints `proxmox.yml`, `infrastructure.yml`, and every app instance.
    - **Job log:** Always redacted and safe to copy into a Configure job.
    - **Archive:** Can write an unredacted `tar.gz` restore point under `artifacts/`.

    Rundeck OSS does not provide artifact download. Use `scp` to retrieve the archive, or
    rely on PBS protection of the runner.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: true
  options:
  - name: instance
    description: App instance to print, such as `radarr-4k`. **Blank:** Return the complete
      authored configuration.
    required: false
  - name: archive
    description: Write an unredacted `tar.gz` restore point under `artifacts/`. Defaults to
      `true` when no instance is selected.
    required: false
    values: ['', 'true', 'false']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/get-config.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          if [ -n "${RD_OPTION_INSTANCE:-}" ]; then
            ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          fi
          if [ -n "${RD_OPTION_ARCHIVE:-}" ]; then
            ARGS+=(-e "archive=$RD_OPTION_ARCHIVE")
          fi

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          #
          # LAB_DOCTOR=0: reading a broken config back out is exactly how you diagnose
          # it, so this job must run even when the doctor is unhappy.
          export LAB_DOCTOR=0
          exec lab-run playbooks/maintenance/get-config.yml "${ARGS[@]}"
