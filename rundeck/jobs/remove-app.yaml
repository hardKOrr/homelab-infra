# Remove App — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Remove <App>" job per application that
# can be removed, filed under that application's own Maintenance folder. Applications
# marked `essential:` in catalog/applications.yml get no Remove job at all — the platform
# does not offer a one-click removal of the reverse proxy or the vault it depends on.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Remove %NAME%
  group: '%GROUP%'
  description: |-
    Stop this %NAME% instance and unwire it from the reverse proxy, Authentik, Uptime Kuma
    and DNS. config/apps/<instance>.yml is kept as the restore point; no guest is
    destroyed. Re-running Deploy %NAME% brings it back.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: Which %NAME% instance to remove. Leave it as it is unless this lab runs
      more than one — the list is every config/apps/<instance>.yml file that belongs to
      %SLUG%.
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: delete_data
    description: false keeps volumes and data paths so a re-deploy restores the app; true wipes them
    required: true
    value: 'false'
    values: ['false', 'true']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/remove.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          #
          # `app` is not an option: this job exists once per application, so which app the
          # instance belongs to is already known. A second instance named radarr-4k is
          # still app radarr, and that used to be a question the operator had to answer.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          : "${RD_OPTION_DELETE_DATA:?delete_data is required}"
          ARGS+=(-e "delete_data=$RD_OPTION_DELETE_DATA")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/remove.yml "${ARGS[@]}"
