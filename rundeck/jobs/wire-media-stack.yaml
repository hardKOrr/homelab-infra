# Wire Media Stack — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/wire-media-stack.yaml
#
# Paths match rundeck/bootstrap-rundeck.sh: the repo at /var/lib/rundeck/homelab-infra
# and ansible-core in the venv at /opt/homelab-ansible. Change REPO/VENV below if you
# installed elsewhere.

- id: 970eed1e-229e-5348-8338-5019b9c502a6
  uuid: 970eed1e-229e-5348-8338-5019b9c502a6
  name: Wire Media Stack
  group: Maintenance
  description: |-
    Wire the media stack's app-to-app connections: every *arr registered in Prowlarr for indexer sync, every download client registered in the apps that speak its protocol, and Bazarr pointed at Sonarr and Radarr. Idempotent — safe to re-run. Notifies via Ntfy.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/stacks/wire-media-stack.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          REPO=/var/lib/rundeck/homelab-infra
          VENV=/opt/homelab-ansible/bin
          cd "$REPO/ansible"

          # with-proxmox-env.sh exports the PROXMOX_API_* environment the community.proxmox
          # dynamic inventory reads (it cannot take -e extra vars) from config/proxmox.yml,
          # the same gitignored file the playbooks load their connection details from.
          exec bash scripts/with-proxmox-env.sh ../config/proxmox.yml \
            "$VENV/ansible-playbook" -i inventory/ playbooks/stacks/wire-media-stack.yml
