# Deploy SABnzbd — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-sabnzbd.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 2fad81ab-4d7d-5eac-89f2-0a0fa7862e9b
  uuid: 2fad81ab-4d7d-5eac-89f2-0a0fa7862e9b
  name: Deploy SABnzbd
  group: Apps
  description: |-
    Deploy or update SABnzbd — the media stack's usenet download client (Docker on
    media_stack). Registers the app in the media registry; run Wire Media Stack
    afterwards to register it as a download client in every *arr.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/sabnzbd.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          ARGS+=(-e "instance=sabnzbd")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/sabnzbd.yml "${ARGS[@]}"
