# Restore App — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Restore <App>" job per Kubernetes-hosted
# application, filed under that application's own Maintenance folder next to its Backup
# job. A restore belongs beside the backup that produced the snapshot, not in a separate
# recovery branch the operator has to go and find under pressure.
#
# The full procedure — find a snapshot, choose where it lands, check the plan, restore,
# verify — is in the header of ansible/playbooks/maintenance/restore-app.yml.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Restore %NAME%
  group: '%GROUP%'
  description: |-
    Restore this %NAME% instance's data from the lab's Proxmox Backup Server: the quiesced
    database dump and storage volume its own backup job pushes there, not a whole-VM
    snapshot.

    Run it with overwrite=false first. With no snapshot named it lists what PBS holds for
    the instance; with one named it proves that snapshot is readable and prints exactly
    what the target holds today. Neither writes anything.

    overwrite=true then replaces the target's database and storage volume with the
    snapshot's contents. That is destructive and deliberate: the target application is
    stopped first, and if the restore fails it is left stopped rather than started in front
    of half-replaced data.

    To rehearse without touching the live application, deploy a second instance under a new
    name and restore into it with target=<that name>.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: The %NAME% instance that OWNS the backup — its snapshots are filed in PBS
      under host/<instance>. Leave it as it is unless this lab runs more than one.
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: target
    description: The instance whose namespace receives the data. Leave blank to restore the
      application over itself. Set it to a second, already-deployed instance to rehearse a
      clean restore without touching the live one.
    required: false
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: snapshot
    description: PBS snapshot identifier, e.g. host/%SLUG%/2026-08-19T03:00:00Z. Leave
      blank to list what PBS holds and change nothing.
    required: false
  - name: overwrite
    description: false plans and writes nothing; true replaces the target's database and
      storage volume
    required: true
    value: 'false'
    values: ['false', 'true']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/restore-app.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          if [ -n "${RD_OPTION_TARGET:-}" ]; then
            ARGS+=(-e "target=$RD_OPTION_TARGET")
          fi
          if [ -n "${RD_OPTION_SNAPSHOT:-}" ]; then
            ARGS+=(-e "snapshot=$RD_OPTION_SNAPSHOT")
          fi
          : "${RD_OPTION_OVERWRITE:?overwrite is required}"
          ARGS+=(-e "overwrite=$RD_OPTION_OVERWRITE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/restore-app.yml "${ARGS[@]}"
