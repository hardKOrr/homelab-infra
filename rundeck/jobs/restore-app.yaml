# Restore App — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Restore <App>" job for each catalog
# application that explicitly owns an application-consistent recovery path, filed under
# that application's own Maintenance folder next to its Backup job. A restore belongs
# beside the backup that produced the snapshot, not in a separate recovery branch.
#
# The full procedure — find a snapshot, choose where it lands, check the plan, restore,
# verify — is in the header of ansible/playbooks/maintenance/restore-app.yml.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Restore %NAME%
  group: '%GROUP%'
  description: |-
    Restore %NAME% application-owned state from PBS: its application-consistent recovery
    artifact and complete persistent storage, not a whole-VM snapshot.

    ### Safe first run

    Keep **Overwrite** set to `false`. With no snapshot, the job lists available backups.
    With a snapshot, it verifies readability and reports the target's current state. Neither
    operation writes anything.

    ### Restore

    Setting **Overwrite** to `true` stops the target and replaces its application-owned
    state. If restoration fails, the target stays stopped to avoid serving partial data.

    > To rehearse safely, deploy a second instance and select it as the **Target**.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '%NAME% instance that owns the backup. PBS files its snapshots under
      `host/<instance>`. **Default:** Keep the selected instance.'
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: method
    description: 'Recovery method: `native` for this application-owned path. The playbook
      also accepts `pbs_guest` and `project_managed` for shared dispatch.'
    required: false
    value: native
    values: [pbs_guest, native, project_managed]
    enforced: false
  - name: destination
    description: 'This native restore entry point supports `existing` only and replaces
      the selected target. Isolated `new` restores are owned by the #78 orchestration path.'
    required: true
    value: existing
    values: [existing]
    enforced: true
  - name: target
    description: 'Instance whose application-owned state receives the data. **Blank:**
      Restore over the source instance. Select a second deployed instance for a rehearsal.'
    required: false
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: recovery_point
    description: 'Artifact identifier for the selected method. **Blank:** list available
      recovery points and change nothing.'
    required: false
  - name: snapshot
    description: 'Compatibility alias for the PBS recovery point, such as
      `host/%SLUG%/2026-08-19T03:00:00Z`. **Blank:** list available snapshots and change nothing.'
    required: false
  - name: overwrite
    description: '**`false` (safe):** Plan only. **`true` (destructive):** Replace the
      target application state and persistent storage.'
    required: true
    value: 'false'
    values: ['false', 'true']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/restore-app.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          if [ -n "${RD_OPTION_METHOD:-}" ]; then
            ARGS+=(-e "method=$RD_OPTION_METHOD")
          fi
          : "${RD_OPTION_DESTINATION:?destination is required}"
          ARGS+=(-e "destination=$RD_OPTION_DESTINATION")
          if [ -n "${RD_OPTION_TARGET:-}" ]; then
            ARGS+=(-e "target=$RD_OPTION_TARGET")
          fi
          if [ -n "${RD_OPTION_RECOVERY_POINT:-}" ]; then
            ARGS+=(-e "recovery_point=$RD_OPTION_RECOVERY_POINT")
          fi
          # Keep the old option additive for callers and imported jobs during transition.
          if [ -n "${RD_OPTION_SNAPSHOT:-}" ]; then
            ARGS+=(-e "snapshot=$RD_OPTION_SNAPSHOT")
          fi
          : "${RD_OPTION_OVERWRITE:?overwrite is required}"
          ARGS+=(-e "overwrite=$RD_OPTION_OVERWRITE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/restore-app.yml "${ARGS[@]}"
