# Deploy Authentik — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-authentik.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 8a71d987-b7cc-5b46-969b-4c54033676d4
  uuid: 8a71d987-b7cc-5b46-969b-4c54033676d4
  name: Deploy Authentik
  group: Platform/Access and Identity/Authentik
  description: |-
    Deploy or converge **Authentik**, the lab's single sign-on provider.

    - **Hosting:** Docker on the dedicated `sso` stack host
    - **Re-run:** Applies configuration and image updates without creating another instance
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Authentik instance. The value identifies its config file, guest, and
      route.'
    required: true
    value: authentik
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/authentik.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/authentik.yml "${ARGS[@]}"
