# Rollback Container — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Rollback <App>" job per Docker-hosted
# application, filed under that application's own Maintenance folder. The playbook resolves
# the effective stack from the selected instance's config over the application defaults, so
# an instance-level stack override still reaches the correct host.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Rollback %NAME%
  group: '%GROUP%'
  description: |-
    Pin %NAME% to an earlier image tag and recreate its container.

    Use the prior version named in the Watchtower notification. The pin prevents Watchtower
    from updating this container again until **Deploy %NAME%** is re-run. The result is
    published through Ntfy.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '%NAME% instance to roll back. Its Compose project is
      `/opt/<instance>` on the resolved stack host. **Default:** Keep the selected instance.'
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: image_tag
    description: 'Image tag to restore, such as `5.1.3`. **Blank:** Re-pin the current
      Compose tag. If that tag is `latest`, the container is not effectively frozen.'
    required: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/stacks/rollback-container.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          #
          # `stack` is not an option: the playbook resolves the effective instance config,
          # including a per-instance stack override, through resolve-app-target.yml.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "container=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          if [ -n "${RD_OPTION_IMAGE_TAG:-}" ]; then
            ARGS+=(-e "image_tag=$RD_OPTION_IMAGE_TAG")
          fi

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/stacks/rollback-container.yml "${ARGS[@]}"
