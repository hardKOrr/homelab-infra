# Rollback Container — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/rollback-container.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 17be5a66-0344-519d-9b0a-c5b3795c7365
  uuid: 17be5a66-0344-519d-9b0a-c5b3795c7365
  name: Rollback Container
  group: Maintenance
  description: |-
    Pin a Docker app to an earlier image tag and recreate it. Run this when a Watchtower update breaks something. Notifies via Ntfy.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: stack
    description: Stack tag the container runs on, e.g. media_stack
    required: true
  - name: container
    description: App instance name — its Compose project is /opt/<instance>
    required: true
  - name: image_tag
    description: Tag to roll back to, e.g. 5.1.3. Leave blank to re-pin the tag already in the Compose file.
    required: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/stacks/rollback-container.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          : "${RD_OPTION_STACK:?stack is required}"
          ARGS+=(-e "stack=$RD_OPTION_STACK")
          : "${RD_OPTION_CONTAINER:?container is required}"
          ARGS+=(-e "container=$RD_OPTION_CONTAINER")
          if [ -n "${RD_OPTION_IMAGE_TAG:-}" ]; then
            ARGS+=(-e "image_tag=$RD_OPTION_IMAGE_TAG")
          fi

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/stacks/rollback-container.yml "${ARGS[@]}"
