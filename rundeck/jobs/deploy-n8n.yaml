    - **Database:** named external PostgreSQL backend `postgresql-n8n` by default.
    - **Secrets:** the n8n encryption key and database password are generated or reused
      from Vaultwarden; credentials are never read from tracked configuration.
    - **Recovery:** the named PostgreSQL database and this instance's `/opt/<instance>/data`
      directory are one recovery unit. The Docker guest backup includes the Compose project.
    - **Rerun:** the same encryption key and database role are reused on every converge.
