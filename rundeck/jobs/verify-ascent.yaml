# Verify Lab Ascent — the read-only companion to Arm Lab Descent (slice 205).
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
#
# Unlike Lab Status this job goes RED when something did not come back. Status is a pull
# action whose red would teach nothing; this one is asked a single yes-or-no question
# after an outage and has to answer it honestly enough to be worth watching.

- id: 4c758158-4124-4104-94e9-453be1ae784e
  uuid: 4c758158-4124-4104-94e9-453be1ae784e
  name: Verify Lab Ascent
  group: Manage/Lab/Health
  description: |-
    Verify recovery after a planned lab descent or an unplanned outage.

    - Reports tagged guests that are not running
    - Reports running guests that do not answer SSH
    - Confirms every Kubernetes node is `Ready`

    This job is **read-only**: it starts nothing and changes nothing. It fails when the
    ascent is incomplete so the execution remains visible for investigation.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/verify-ascent.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/verify-ascent.yml
