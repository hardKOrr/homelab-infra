# Backup App — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Backup <App>" job for each catalog
# application that explicitly owns an application-consistent recovery path, filed under
# that application's Maintenance folder. Most Docker and native applications rely on the
# guest's PBS backup; Actual Budget is the explicit Docker exception.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Backup %NAME%
  group: '%GROUP%'
  description: |-
    Run an **on-demand backup** of this %NAME% instance.

    ### What it captures

    - The application-consistent state owned by this instance
    - The instance's complete persistent storage
    - One snapshot in the lab's PBS datastore

    This runs the application's own recovery procedure, waits for it to finish, and reports
    the result. Use it before a risky change, after repairing a failed scheduled backup, or
    before a restore rehearsal. It never snapshots sibling applications on a shared host.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected %NAME% instance. Choose another only when
      this lab runs more than one; the list comes from matching `config/apps/<instance>.yml`
      files.'
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/backup-app.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/backup-app.yml "${ARGS[@]}"
