# Deploy Uptime Kuma — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-uptime-kuma.yaml
#
# Paths match rundeck/bootstrap-rundeck.sh: the repo at /var/lib/rundeck/homelab-infra
# and ansible-core in the venv at /opt/homelab-ansible. Change REPO/VENV below if you
# installed elsewhere.

- id: a2035f11-a8dc-5574-b9de-7411820c51ba
  uuid: a2035f11-a8dc-5574-b9de-7411820c51ba
  name: Deploy Uptime Kuma
  group: Apps
  description: |-
    Deploy or update Uptime Kuma. Every later app deploy registers its own monitor here.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/uptime-kuma.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          REPO=/var/lib/rundeck/homelab-infra
          VENV=/opt/homelab-ansible/bin
          cd "$REPO/ansible"
          ARGS=()
          ARGS+=(-e "instance=uptime-kuma")

          # with-proxmox-env.sh exports the PROXMOX_API_* environment the community.proxmox
          # dynamic inventory reads (it cannot take -e extra vars) from config/proxmox.yml,
          # the same gitignored file the playbooks load their connection details from.
          exec bash scripts/with-proxmox-env.sh ../config/proxmox.yml \
            "$VENV/ansible-playbook" -i inventory/ playbooks/apps/uptime-kuma.yml "${ARGS[@]}"
