# Deploy Uptime Kuma — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-uptime-kuma.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: a2035f11-a8dc-5574-b9de-7411820c51ba
  uuid: a2035f11-a8dc-5574-b9de-7411820c51ba
  name: Deploy Uptime Kuma
  group: Platform/Monitoring and Notifications/Uptime Kuma
  description: |-
    Deploy or converge **Uptime Kuma**, the platform uptime monitor.

    Each later application deployment registers its own monitor automatically.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Uptime Kuma instance. The value identifies its config file, guest, and
      route.'
    required: true
    value: uptime-kuma
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/uptime-kuma.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/uptime-kuma.yml "${ARGS[@]}"
