# Reimport Jobs — re-import rundeck/jobs/*.yaml from the refreshed checkout.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/reimport-jobs.yaml
#
# This job exists because lab-run's checkout refresh solves only half of "the runner runs
# current master". The refresh keeps the PLAYBOOKS current; job DEFINITIONS live in
# Rundeck's database and only change when something imports them. The Rundeck git SCM
# plugin is deliberately not used — it syncs job definitions and nothing else, it makes
# UI edits and repo imports fight each other, and it was never going to refresh the
# working tree the steps execute. One-way import from the repo is the only path, and this
# job is that path once the bootstrap script has run.
#
# Job UUIDs in the repo are stable, so this updates jobs in place rather than duplicating
# them. UUIDs listed in rundeck/retired-jobs.yml are then deleted; any failed deletion
# fails this job so the UI cannot remain wrong behind a green execution.

- id: f3acdc9f-1104-5df0-add8-5cc5f5f7481b
  uuid: f3acdc9f-1104-5df0-add8-5cc5f5f7481b
  name: Reimport Jobs
  group: Setup/Automation
  description: |-
    Refresh Rundeck from the repository-owned job definitions.

    ### Run this after

    - Adding or removing a job
    - Changing a job name, option, group, or description

    Playbook-only changes do **not** need reimporting; every execution refreshes the checkout.
    Jobs update in place by UUID. Definitions in `rundeck/retired-jobs.yml` are removed, and
    a failed removal fails this job.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Import rundeck/jobs/*.yaml over the REST API
      script: |-
          #!/bin/bash
          set -euo pipefail

          # Read the same paths lab-run reads, so this file carries no path either.
          # shellcheck disable=SC1091
          . /etc/homelab-infra/lab-run.env
          RUNDECK_API_TOKEN="${RD_OPTION_RUNDECK_API_TOKEN:-}"
          : "${RUNDECK_API_TOKEN:?Rundeck API token was not supplied by secure Key Storage}"
          RUNDECK_URL="${RUNDECK_URL:-http://localhost:4440}"
          RUNDECK_PROJECT="${RUNDECK_PROJECT:-homelab-infra}"

          # Refresh the checkout first: importing the job definitions that are already on
          # disk would defeat the point of the job.
          if [ "${LAB_REFRESH:-1}" != "0" ]; then
            git -C "$LAB_REPO" fetch --quiet --prune origin "${LAB_BRANCH:-master}"
            git -C "$LAB_REPO" reset --hard --quiet "origin/${LAB_BRANCH:-master}"
          fi
          echo "[reimport] revision $(git -C "$LAB_REPO" log --oneline -1)"

          imported=0; failed=0
          "$LAB_VENV/bin/python3" "$LAB_REPO/rundeck/render-job.py" --check "$LAB_REPO/rundeck/jobs"
          for job in "$LAB_REPO"/rundeck/jobs/*.yaml; do
            [ -f "$job" ] || continue
            resp="$("$LAB_VENV/bin/python3" "$LAB_REPO/rundeck/render-job.py" "$job" | curl -s -m 60 -X POST \
              -H "X-Rundeck-Auth-Token: $RUNDECK_API_TOKEN" \
              -H "Accept: application/json" -H "Content-Type: application/yaml" \
              --data-binary @- \
              "$RUNDECK_URL/api/47/project/$RUNDECK_PROJECT/jobs/import?fileformat=yaml&dupeOption=update&uuidOption=preserve")"
            if printf '%s' "$resp" | grep -q '"succeeded"'; then
              imported=$((imported + 1))
              echo "[reimport] ok      $(basename "$job")"
            else
              failed=$((failed + 1))
              echo "[reimport] FAILED  $(basename "$job"): $resp"
            fi
          done
          echo "[reimport] $imported imported, $failed failed"

          # Import is additive: a job the repo stopped generating survives in Rundeck's
          # database as a clickable orphan. rundeck/retired-jobs.yml names the UUIDs this
          # repository has withdrawn, and deleting them here is what makes a reorganization
          # in the repo look the same in the UI. A UUID that is already gone is not an
          # error.
          retired=0; retire_failed=0
          while read -r uuid; do
            [ -n "$uuid" ] || continue
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X DELETE \
              -H "X-Rundeck-Auth-Token: $RUNDECK_API_TOKEN" -H "Accept: application/json" \
              "$RUNDECK_URL/api/47/job/$uuid")"
            case "$code" in
              204) retired=$((retired + 1)); echo "[reimport] retired $uuid" ;;
              404) : ;;
              *)   retire_failed=$((retire_failed + 1));
                   echo "[reimport] FAILED to retire $uuid (HTTP $code)" ;;
            esac
          done < <("$LAB_VENV/bin/python3" -c "import sys,yaml;print('\n'.join((yaml.safe_load(open(sys.argv[1],encoding='utf-8')) or {}).get('jobs') or {}))" "$LAB_REPO/rundeck/retired-jobs.yml")
          echo "[reimport] $retired retired job(s) deleted, $retire_failed failed"

          [ "$failed" -eq 0 ] && [ "$retire_failed" -eq 0 ]
