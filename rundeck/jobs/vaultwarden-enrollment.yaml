- id: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  uuid: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  name: Vaultwarden Enrollment
  group: Setup/Credentials
  description: |-
    Enroll the Vaultwarden owner and automation accounts with no operator input.

    - Invites both accounts and registers them with generated master passwords
    - Creates organization `homelab-infra` and confirms the automation account as Admin
    - Stages the automation API key and master password in Key Storage

    Uses the preserved config/infrastructure.yml vaultwarden.owner_email and
    vaultwarden.automation_email (default homelab-infra@<domain>). Conflicting
    VAULTWARDEN_OWNER_EMAIL or VAULTWARDEN_AUTOMATION_EMAIL inputs fail before
    invitations; unset them or align them with the declaration before retrying.
    Enrollment does not rewrite identity declarations or existing machine entries.

    Safe to re-run with unchanged identities. The generated passwords are imported
    into the vault by Vaultwarden Cutover, which runs next.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Enroll both accounts and stage the automation credentials
      script: |-
          #!/bin/bash
          set -euo pipefail
          export LAB_SEED_MODE=1
          exec lab-run playbooks/maintenance/vaultwarden-enroll.yml
