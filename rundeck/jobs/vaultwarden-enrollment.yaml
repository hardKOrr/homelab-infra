- id: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  uuid: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  name: Vaultwarden Enrollment
  group: Setup/Credentials
  description: |-
    Register the owner and automation accounts, create the `homelab-infra` organization,
    confirm the automation account as an Admin, and stage its API credentials in encrypted
    Rundeck Key Storage. Random master passwords remain in the temporary Seed file until
    **Vaultwarden Cutover** imports them into `homelab-infra/vaultwarden`.

    This operation is safe to retry: an existing account, organization, confirmed Admin,
    or matching Key Storage value is reused without being rewritten.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Register accounts and enroll the automation Admin
      script: |-
          #!/bin/bash
          set -euo pipefail
          export LAB_SEED_MODE=1
          exec lab-run playbooks/maintenance/vaultwarden-enroll.yml
