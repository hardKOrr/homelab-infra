- id: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  uuid: 9fa6c03f-72db-5baf-8d8d-3b98774e4f74
  name: Vaultwarden Enrollment
  group: Setup/Credentials
  description: |-
    Re-send the configured Vaultwarden invitations for the owner and automation accounts.

    The job reads the server admin token from encrypted Rundeck Key Storage and needs no
    operator input. Its output identifies both accounts and lists the remaining web-vault
    enrollment steps.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Invite enrollment identities
      script: |-
          #!/bin/bash
          set -euo pipefail
          export LAB_SEED_MODE=1
          exec lab-run playbooks/maintenance/vaultwarden-enroll.yml
