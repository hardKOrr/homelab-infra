# Deploy Mixpost — source job definition; one job, one playbook.
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.
#
# Requires the `Deploy k3s Cluster` job to have run: Mixpost has no guest of its own and
# deploys into a namespace on that cluster.

- id: 0816fdee-48a4-5f9a-b0d3-20e8bccfacbc
  uuid: 0816fdee-48a4-5f9a-b0d3-20e8bccfacbc
  name: Deploy Mixpost
  group: Applications/Content & Publishing/Social Publishing/Mixpost
  description: |-
    Deploy or converge **Mixpost**, the self-hosted social-media scheduler.

    - **Hosting:** Kubernetes, with MySQL and Redis in the instance namespace
    - **Route:** `mixpost.<estate domain>`, restricted to internal sources
    - **Identity:** Mixpost keeps its own login; Authentik supplies a launch tile

    Generated credentials are minted once and reused from Vaultwarden. A re-run never
    rotates `APP_KEY`, because that would invalidate stored OAuth tokens.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Mixpost instance. The value identifies its config file, `app-<instance>`
      namespace, route, and Vaultwarden item.'
    required: true
    value: mixpost
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/mixpost.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/mixpost.yml "${ARGS[@]}"
