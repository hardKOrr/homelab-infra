  name: Deploy Forgejo
  group: Applications/Developer Tools/Source Control/Forgejo
  description: |-
    Deploy or converge an instanced **Forgejo** source-control service.

    - **Database:** named external PostgreSQL backend `postgresql-forgejo` by default.
    - **Git SSH:** published directly on the explicit `ssh_port` (2222 by default); SSH is
      not sent through Caddy or the HTTP reverse proxy.
    - **Recovery:** restore the named PostgreSQL database and Forgejo's `/opt/<instance>/data`
      directory together. The shared backend is never removed with the app.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected Forgejo instance. Enter another name for a second deployment.'
    required: true
    value: forgejo
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/forgejo.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          : "${RD_OPTION_INSTANCE:?instance is required}"
          exec lab-run playbooks/apps/forgejo.yml -e "instance=$RD_OPTION_INSTANCE"
