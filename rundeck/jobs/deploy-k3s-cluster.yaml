# Deploy k3s Cluster — source job definition; one job, one playbook.
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.
#
# This job builds the Kubernetes hosting backend, not an application. It is safe to
# re-run: a converged cluster reports no change, and raising `cluster.version` in
# config/apps/k3s-cluster.yml turns a re-run into a rolling upgrade, one server at a time.

- id: 5dae403a-1c28-522c-a083-41f7b1984c17
  uuid: 5dae403a-1c28-522c-a083-41f7b1984c17
  name: Deploy k3s Cluster
  group: Platform/Hosting/k3s Cluster
  description: |-
    Build or converge the **k3s cluster** used by Kubernetes-hosted applications.

    ### Topology

    - Three servers with embedded etcd, one per Proxmox node
    - Traefik behind one MetalLB VIP for internal ingress
    - Platform Caddy remains the sole public TLS edge

    > **Storage boundary:** The default StorageClass is node-pinned. The control plane
    > tolerates one node failure, but a pod whose volume is on an unavailable node remains
    > `Pending`; its application data does not fail over.

    Re-run to converge, replace a lost node, or roll all servers after changing
    `cluster.version`.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  # A second cluster is a legitimate thing to want, but two runs of THIS job at once
  # would race the etcd founder against itself.
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected cluster. Enter another name only to build
      an additional cluster. The value identifies its config file and Vaultwarden item for
      the join token and administrative kubeconfig.'
    required: true
    value: k3s-cluster
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/k3s-cluster.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/k3s-cluster.yml "${ARGS[@]}"
