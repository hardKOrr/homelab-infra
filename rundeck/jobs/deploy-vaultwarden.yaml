# Deploy Vaultwarden — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-vaultwarden.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 9cddd873-1100-5656-b827-567cd642f709
  uuid: 9cddd873-1100-5656-b827-567cd642f709
  name: Deploy Vaultwarden
  group: Platform/Access and Identity
  description: |-
    Deploy or update Vaultwarden (native LXC). Re-running is the update path.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: Leave this as it is for the normal deployment. Change it only to run a
      SECOND instance of this app alongside the first — a second estate's SSO, for example.
      The value is the config/apps/<instance>.yml filename, the guest hostname and the
      subdomain.
    required: true
    value: vaultwarden
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/vaultwarden.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/vaultwarden.yml "${ARGS[@]}"
