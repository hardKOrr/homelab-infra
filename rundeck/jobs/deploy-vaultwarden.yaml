# Deploy Vaultwarden — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-vaultwarden.yaml
#
# Paths match rundeck/bootstrap-rundeck.sh: the repo at /var/lib/rundeck/homelab-infra
# and ansible-core in the venv at /opt/homelab-ansible. Change REPO/VENV below if you
# installed elsewhere.

- id: 9cddd873-1100-5656-b827-567cd642f709
  uuid: 9cddd873-1100-5656-b827-567cd642f709
  name: Deploy Vaultwarden
  group: Apps
  description: |-
    Deploy or update Vaultwarden (native LXC). Re-running is the update path.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/vaultwarden.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          REPO=/var/lib/rundeck/homelab-infra
          VENV=/opt/homelab-ansible/bin
          cd "$REPO/ansible"
          ARGS=()
          ARGS+=(-e "instance=vaultwarden")

          # with-proxmox-env.sh exports the PROXMOX_API_* environment the community.proxmox
          # dynamic inventory reads (it cannot take -e extra vars) from config/proxmox.yml,
          # the same gitignored file the playbooks load their connection details from.
          exec bash scripts/with-proxmox-env.sh ../config/proxmox.yml \
            "$VENV/ansible-playbook" -i inventory/ playbooks/apps/vaultwarden.yml "${ARGS[@]}"
