- id: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  uuid: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  name: Bootstrap Platform
  group: Setup/Platform
  description: |-
    Build the lab's baseline platform in dependency order.

    1. Vaultwarden
    2. Ntfy and the reverse proxy
    3. Authentik and Uptime Kuma
    4. Prometheus + Grafana
    5. Proxmox Backup Server (PBS)

    Run this after **Vaultwarden Cutover**. After the first successful bootstrap, use each
    application's own Deploy and Maintenance jobs for day-2 work.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/bootstrap.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/bootstrap.yml
