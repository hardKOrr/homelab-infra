# Bootstrap Platform — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/bootstrap.yaml
#
# Paths match rundeck/bootstrap-rundeck.sh: the repo at /var/lib/rundeck/homelab-infra
# and ansible-core in the venv at /opt/homelab-ansible. Change REPO/VENV below if you
# installed elsewhere.

- id: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  uuid: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  name: Bootstrap Platform
  group: Bootstrap
  description: |-
    One-time platform setup: Vaultwarden, Ntfy, the reverse proxy, Authentik, Uptime Kuma, Prometheus + Grafana and PBS, in that order. Run it once, then use the per-app jobs.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/bootstrap.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          REPO=/var/lib/rundeck/homelab-infra
          VENV=/opt/homelab-ansible/bin
          cd "$REPO/ansible"

          # with-proxmox-env.sh exports the PROXMOX_API_* environment the community.proxmox
          # dynamic inventory reads (it cannot take -e extra vars) from config/proxmox.yml,
          # the same gitignored file the playbooks load their connection details from.
          exec bash scripts/with-proxmox-env.sh ../config/proxmox.yml \
            "$VENV/ansible-playbook" -i inventory/ playbooks/bootstrap.yml
