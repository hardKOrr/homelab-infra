# Bootstrap Platform — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/bootstrap.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  uuid: f4ff3c34-28da-5509-92fa-6e5c60c70f3d
  name: Bootstrap Platform
  group: Setup/Platform
  description: |-
    One-time platform setup: Vaultwarden, Ntfy, the reverse proxy, Authentik, Uptime Kuma, Prometheus + Grafana and PBS, in that order. Run it once, then use the per-app jobs.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/bootstrap.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/bootstrap.yml
