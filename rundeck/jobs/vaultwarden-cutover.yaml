- id: e04bfd76-e7c9-5bec-979e-7335b76b460d
  uuid: e04bfd76-e7c9-5bec-979e-7335b76b460d
  name: Vaultwarden Cutover
  group: Setup/Credentials
  description: |-
    Complete the one-time transition from bootstrap seed credentials to Vaultwarden.

    - Imports and verifies every seed credential
    - Removes secrets from generated facts
    - Writes the durable Vault-mode marker
    - Deletes temporary seed files

    > Run only after both human and automation accounts are enrolled and the automation API
    > key is staged in Rundeck Key Storage.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Verify imports and activate Vault mode
      script: |-
          #!/bin/bash
          set -euo pipefail
          export LAB_SEED_MODE=1
          export LAB_VAULT_PREFLIGHT=1
          exec lab-run playbooks/maintenance/vaultwarden-cutover.yml
