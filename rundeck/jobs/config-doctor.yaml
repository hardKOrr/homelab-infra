# Config Doctor — validate config/ and report every problem in one pass.
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 56f42991-4bd0-5459-81b3-58310393b225
  uuid: 56f42991-4bd0-5459-81b3-58310393b225
  name: Config Doctor
  group: Manage/Configuration/Validation
  description: |-
    Validate the complete authored configuration without starting a deployment.

    ### Checked files

    - `config/proxmox.yml`
    - `config/infrastructure.yml`
    - Every `config/apps/*.yml` instance file

    The report identifies each missing or malformed value by file and key path. This job is
    **read-only**, contacts no service, and is safe to run at any time. The same validation
    runs before every operational job.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/config-doctor.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          #
          # LAB_DOCTOR=0 suppresses lab-run's own pre-flight check for this job only:
          # the playbook IS the check, and failing in the wrapper would hide the report
          # this job exists to print.
          export LAB_DOCTOR=0
          exec lab-run playbooks/maintenance/config-doctor.yml
