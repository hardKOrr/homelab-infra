- id: 22ff2c37-1b28-5205-bb38-8361c65e5c78
  uuid: 22ff2c37-1b28-5205-bb38-8361c65e5c78
  name: Lab Status
  group: Manage/Lab/Health
  description: |-
    Show a **read-only** health summary of the lab:

    - Proxmox guests and application containers
    - Pending native application updates
    - Uptime Kuma monitors
    - PBS snapshots

    This job changes nothing and sends no notification.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/status.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/status.yml
