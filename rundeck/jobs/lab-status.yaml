# Lab Status — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/lab-status.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 22ff2c37-1b28-5205-bb38-8361c65e5c78
  uuid: 22ff2c37-1b28-5205-bb38-8361c65e5c78
  name: Lab Status
  group: Manage/Lab/Health
  description: |-
    Read-only overview: guests, containers, pending native app updates, uptime monitors and PBS snapshots. Changes nothing and sends no notification.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/status.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/status.yml
