---
# WordPress Restore — a per-application action selected by catalog extra.
- id: '%UUID%'
  uuid: '%UUID%'
  name: Restore %NAME%
  group: '%GROUP%'
  description: |-
    Plan or perform a restore of this WordPress instance. Set source_instance or
    source_backup_id when restoring a snapshot made by another WordPress instance.

    overwrite=false (recommended) lists and validates the selected snapshot without
    changing anything. Set overwrite=true only after confirming the snapshot; the named
    WordPress service is stopped, its wp-content and named database are replaced, target
    URLs/admin access are repaired, then it is started again. No shared backend guest or
    other stack application is touched.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: 'Default: Keep the selected WordPress instance.'
    required: true
    value: '%SLUG%'
  - name: source_instance
    description: 'WordPress instance that produced the snapshot; defaults to this target instance.'
    required: true
    value: '%SLUG%'
  - name: source_backup_id
    description: 'Optional PBS backup id when the source used backup.backup_id; otherwise source_instance is used.'
    required: false
    value: ''
  - name: snapshot
    description: 'Optional PBS snapshot identifier, for example host/wordpress/2026-09-09T03:00:00Z. Blank lists snapshots and changes nothing.'
    required: false
    value: ''
  - name: overwrite
    description: 'false (recommended): plan only. true: replace this instance from the selected snapshot.'
    required: true
    value: 'false'
    values: ['false', 'true']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run the WordPress restore playbook
      script: |-
          #!/bin/bash
          set -euo pipefail
          : "${RD_OPTION_INSTANCE:?instance is required}"
          : "${RD_OPTION_OVERWRITE:?overwrite option is required}"
          : "${RD_OPTION_SOURCE_INSTANCE:?source instance option is required}"
          ARGS=(-e "instance=${RD_OPTION_INSTANCE}" -e "source_instance=${RD_OPTION_SOURCE_INSTANCE}" -e "overwrite=${RD_OPTION_OVERWRITE}")
          if [ -n "${RD_OPTION_SOURCE_BACKUP_ID:-}" ]; then
            ARGS+=(-e "source_backup_id=${RD_OPTION_SOURCE_BACKUP_ID}")
          fi
          if [ -n "${RD_OPTION_SNAPSHOT:-}" ]; then
            ARGS+=(-e "snapshot=${RD_OPTION_SNAPSHOT}")
          fi
          exec lab-run playbooks/maintenance/wordpress-restore.yml "${ARGS[@]}"
