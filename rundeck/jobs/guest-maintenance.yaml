# Guest Maintenance — Tier 1 of slice 205.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/guest-maintenance.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.
#
# NEVER SCHEDULED, and that is load-bearing. The schedule is already a schedule: each guest
# owns a systemd timer set to its own resolved window and reboots itself when that window
# opens. A job polling hourly to ask "is it time yet" would re-implement the primitive on
# top of itself, bury Rundeck's execution history under thousands of no-op runs a year, and
# enforce drift in a platform that deliberately does not. This job is what an OPERATOR runs:
# show me what is pending, or apply the schedules now.

- id: a1af8186-7694-4977-b2bc-b55562422b23
  uuid: a1af8186-7694-4977-b2bc-b55562422b23
  name: Guest Maintenance
  group: Manage/Lab/Maintenance
  description: |-
    Operator-triggered. Re-applies every guest's maintenance timer from the current config, and reports which guests are waiting on a reboot and when their window next opens. Routine reboots need no job at all — each guest owns a systemd timer for its own window. Use force=true to reboot everything pending right now. Never reboots a Proxmox node or the runner; the Kubernetes cluster is cordoned, drained and rebooted as one unit.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: dry_run
    description: Report what would happen and change nothing.
    value: 'false'
    values:
    - 'false'
    - 'true'
    required: true
  - name: force
    description: Reboot everything that is waiting, ignoring the window. Still never reboots a Proxmox node or the runner.
    value: 'false'
    values:
    - 'false'
    - 'true'
    required: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/guest-maintenance.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          ARGS+=(-e "dry_run=${RD_OPTION_DRY_RUN:-false}")
          ARGS+=(-e "force=${RD_OPTION_FORCE:-false}")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/guest-maintenance.yml "${ARGS[@]}"
