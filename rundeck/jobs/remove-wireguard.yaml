- id: '%UUID%'
  uuid: '%UUID%'
  name: Remove %NAME%
  group: '%GROUP%'
  description: Destroy only the exact-tag-managed WireGuard LXC and its project-owned Vaultwarden peer material. The external router forward is preserved.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - {name: instance, required: true, value: '%SLUG%', valuesUrl: 'file:/var/lib/rundeck/app-instances/%SLUG%.json', enforced: false}
  - {name: confirm, required: true, value: '', description: 'Type REMOVE-WIREGUARD.'}
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - script: |-
        #!/bin/bash
        set -euo pipefail
        exec lab-run playbooks/maintenance/remove-wireguard.yml -e "instance=${RD_OPTION_INSTANCE:?instance is required}" -e "confirm=${RD_OPTION_CONFIRM:?confirm is required}"
