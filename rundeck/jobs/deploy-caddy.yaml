# Deploy Caddy — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-caddy.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: e39eb614-b1c0-5cb4-a739-cc8bee4cee48
  uuid: e39eb614-b1c0-5cb4-a739-cc8bee4cee48
  name: Deploy Caddy
  group: Platform/Access and Identity/Caddy
  description: |-
    Deploy or converge **Caddy**, the platform's public TLS edge.

    - Configures Cloudflare DNS-01 certificate issuance
    - Uses the temporary encrypted Cloudflare input before Vaultwarden Cutover
    - Reads the canonical reverse-proxy credential from Vaultwarden after cutover
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Caddy instance. The value identifies its config file, guest, and route.'
    required: true
    value: caddy
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/caddy.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # Caddy is deliberately one of the few playbooks allowed before the
          # Vaultwarden marker exists: it must provide HTTPS for enrollment.
          if [ ! -f /etc/homelab-infra/state/vault-mode ]; then
            export LAB_SEED_MODE=1
          fi

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/caddy.yml "${ARGS[@]}"
