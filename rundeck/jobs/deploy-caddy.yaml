# Deploy Caddy — source job definition; one job, one playbook.
# Rendered and imported by rundeck/render-job.py. Use the Reimport Jobs job rather than a
# raw import: the renderer injects this job's Key Storage options and validates its group.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It validates config/ and runs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: e39eb614-b1c0-5cb4-a739-cc8bee4cee48
  uuid: e39eb614-b1c0-5cb4-a739-cc8bee4cee48
  name: Deploy Caddy
  group: Platform/Access and Identity/Caddy
  description: |-
    Deploy or converge **Caddy**, the platform's public TLS edge.

    - Configures Cloudflare DNS-01 certificate issuance
    - Uses the temporary encrypted Cloudflare input before Vaultwarden Cutover
    - Reads the canonical reverse-proxy credential from Vaultwarden after cutover
    - With the Ansible Vault password, deploys from the edge copy in
      `config/vaultwarden.yml` when Caddy is down and Vaultwarden is unreachable behind it

    **Recovery:** Caddy is the lab-wide shared TLS edge. Use **Backup Guest** and
    **Restore Guest** with the exact Caddy LXC VMID; these are whole-guest PBS operations,
    not application-only archives. Restore Guest supports an isolated stopped new target
    and exact existing-target replacement with an independent pre-restore point. Replacing
    Caddy interrupts every routed application while backend guests remain untouched.
    No Caddy-specific Backup/Restore action is exposed.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Caddy instance. The value identifies its config file, guest, and route.'
    required: true
    value: caddy
  - name: ansible_vault_password
    description: '**Optional.** The operator''s Ansible Vault password. Given, a run that
      reaches Vaultwarden refreshes the edge copy in `config/vaultwarden.yml`, and a run
      that cannot reach it (Caddy is down) deploys from that copy. Masked; never stored.'
    required: false
    secure: true
    valueExposed: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/caddy.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          if [ -n "${RD_OPTION_ANSIBLE_VAULT_PASSWORD:-}" ]; then
            export LAB_VAULT_PASSWORD="$RD_OPTION_ANSIBLE_VAULT_PASSWORD"
          fi

          # Caddy is deliberately one of the few playbooks allowed before the
          # Vaultwarden marker exists: it must provide HTTPS for enrollment.
          if [ ! -f /etc/homelab-infra/state/vault-mode ]; then
            export LAB_SEED_MODE=1
          fi

          # lab-run runs config-doctor and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/caddy.yml "${ARGS[@]}"
