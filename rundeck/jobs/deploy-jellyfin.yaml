# Deploy Jellyfin — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-jellyfin.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: d4ef9a86-ba44-4fa3-99b0-468b3e541f32
  uuid: d4ef9a86-ba44-4fa3-99b0-468b3e541f32
  name: Deploy Jellyfin
  group: Applications/Media & Entertainment/Media Servers/Jellyfin
  description: |-
    Deploy or converge **Jellyfin**, the media stack's media server.

    - **Hosting:** Docker on the `media` stack
    - Completes the first-run setup and stores the admin account in Vaultwarden
    - Creates a library for each path written by the *arr applications

    No separate media wiring step is required for Jellyfin.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Jellyfin instance. The value identifies its config file, Compose
      project, and route.'
    required: true
    value: jellyfin
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/jellyfin.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/jellyfin.yml "${ARGS[@]}"
