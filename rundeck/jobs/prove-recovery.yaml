- id: 88bfce90-6e10-49b9-aa21-14d6dbfe8e44
  uuid: 88bfce90-6e10-49b9-aa21-14d6dbfe8e44
  name: Prove Recovery
  group: Recover/Drills
  description: |-
    Plan or execute a repeatable pbs_guest proof on an explicitly owned disposable VM/LXC.
    The recovery unit is the entire guest. Review every shared workload and external-data
    boundary before execute=true. Native/project_managed, rebuild-only, Kubernetes/cluster,
    appliance, runner, vault and PBS recovery are refused before mutations.

    Plan (default) reads scope only; it creates no fixtures or artifacts. Execute deploys
    twice and requires zero changes on the second deployment, writes/reads declared fixture A,
    creates and identifies a new A artifact, writes/reads B and captures independent B.
    Restore Guest plans and then restores A, verifying both artifacts with destination
    credentials before replacement. Retain both points through acceptance. Existing targets
    must return running with the original identity, interfaces and onboot; serving and declared
    A-present/B-absent assertions follow. Without an adapter, evidence is serving-only and
    explicitly incomplete for durable data; PBS excludes external mounts/devices/dependencies.

    New uses the same Restore Guest route with an unused VMID and target-owned name/tags/net0.
    Require distinct unused address/MAC/name, target-only workload tags and a single LXC interface; multiple
    interfaces and VM cloud-init address layouts are refused by this bounded dispatcher.
    Require link_down=1; destination stays stopped with onboot=0. No activation, routing,
    writer cutover or source reads follow this restore. Application/data checks remain pending
    until a separately authorized isolated observation; new mode never claims a complete proof.

    On failure, output names the failed stage and captured artifact identities, without backup
    contents or credentials. Inspect the exact failed/partial target and retained independent
    B point. Use Recover/Guests/Restore Guest with B and overwrite=false to plan recovery,
    then execute only with the exact reviewed target; retry A after inspection. Do not remove
    partial targets or artifacts automatically. Fixture topics and both points are retained;
    cleanup is separately scoped. Record redacted execution evidence on the product observation
    issue. This dispatcher is not required for ordinary install/function/convergence checks.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: app
    required: true
    description: Catalog product slug; its owning defaults select the method.
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: instance
    required: true
    description: Exact installed application instance.
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: vmid
    required: true
    description: Exact owned running disposable whole-guest recovery unit.
    regex: ^[1-9][0-9]*$
  - name: method
    required: true
    description: auto resolves the owning declaration; pbs_guest cannot override native or rebuild.
    value: auto
    values:
    - auto
    - pbs_guest
    enforced: true
  - name: execute
    required: true
    description: false reads inventory and reports the plan; true deploys, writes fixtures, backs up and
      restores.
    value: 'false'
    values:
    - 'false'
    - 'true'
    enforced: true
  - name: disposable
    required: true
    description: Explicit authority for the exact disposable guest and all its workloads. Required in
      plan and execute.
    value: 'false'
    values:
    - 'false'
    - 'true'
    enforced: true
  - name: workloads
    required: false
    description: Blank in plan discovers all affected workload tags. Execute needs their exact comma-separated
      list without leading underscores. Review plan disclosure first.
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*(,[A-Za-z0-9][A-Za-z0-9_.-]*)*$
  - name: destination
    required: true
    description: existing proves serving/data after replacement; new restores stopped/isolated and reports
      activation/data checks pending.
    value: existing
    values:
    - existing
    - new
    enforced: true
  - name: backup_storage
    required: true
    description: PVE PBS storage available to source and destination.
    value: pbs-homelab
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: target_storage
    required: true
    description: Active destination guest disk/rootfs storage.
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: target_vmid
    required: false
    description: 'New only: distinct unused VMID.'
    regex: ^[1-9][0-9]*$
  - name: target_node
    required: false
    description: 'New only: configured destination node.'
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: target_name
    required: false
    description: 'New only: target-owned guest name.'
    regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  - name: target_network
    required: false
    description: 'New only: single LXC net0 with link_down=1, distinct explicit ip and hwaddr; no source
      cutover.'
    regex: ^[A-Za-z0-9:=.,_/-]+$
  - name: target_tags
    required: false
    description: 'New only: _+lab and _<target_name>; exclude source workload, stack and cluster selectors.'
    regex: ^_[A-Za-z0-9+_.;-]+$
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run the repository-owned bounded recovery proof
      script: |-
        #!/bin/bash
        set -euo pipefail
        ARGS=(
          -e "app=${RD_OPTION_APP:?app is required}"
          -e "instance=${RD_OPTION_INSTANCE:?instance is required}"
          -e "vmid=${RD_OPTION_VMID:?vmid is required}"
          -e "method=${RD_OPTION_METHOD:?method is required}"
          -e "execute=${RD_OPTION_EXECUTE:?execute is required}"
          -e "disposable=${RD_OPTION_DISPOSABLE:?disposable is required}"
          -e "destination=${RD_OPTION_DESTINATION:?destination is required}"
          -e "backup_storage=${RD_OPTION_BACKUP_STORAGE:?backup_storage is required}"
          -e "target_storage=${RD_OPTION_TARGET_STORAGE:?target_storage is required}"
        )
        if [ -n "${RD_OPTION_WORKLOADS:-}" ]; then
          ARGS+=(-e "workloads=$RD_OPTION_WORKLOADS")
        fi
        if [ -n "${RD_OPTION_TARGET_VMID:-}" ]; then
          ARGS+=(-e "target_vmid=$RD_OPTION_TARGET_VMID")
        fi
        if [ -n "${RD_OPTION_TARGET_NODE:-}" ]; then
          ARGS+=(-e "target_node=$RD_OPTION_TARGET_NODE")
        fi
        if [ -n "${RD_OPTION_TARGET_NAME:-}" ]; then
          ARGS+=(-e "target_name=$RD_OPTION_TARGET_NAME")
        fi
        if [ -n "${RD_OPTION_TARGET_NETWORK:-}" ]; then
          ARGS+=(-e "target_network=$RD_OPTION_TARGET_NETWORK")
        fi
        if [ -n "${RD_OPTION_TARGET_TAGS:-}" ]; then
          ARGS+=(-e "target_tags=$RD_OPTION_TARGET_TAGS")
        fi
        exec lab-run playbooks/maintenance/prove-recovery.yml "${ARGS[@]}"
