# Configure App — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Configure <App>" job per application,
# filed under that application's own Maintenance folder. It writes
# config/apps/<instance>.yml from this survey.
#
# ONE JOB PER APPLICATION, reversing the earlier single generic job. The generic job was
# argued for on the grounds that which app an instance belongs to is decided by the Deploy
# job, so this job need not know. True — and it still meant the operator arrived at a form
# with an empty instance box and no indication of which app it was about to configure. The
# expansion prefills the instance, files the job beside that app's Deploy job, and the job
# list grows by generated entries rather than by hand-written ones.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Configure %NAME%
  group: '%GROUP%'
  description: |-
    Create or edit this %NAME% instance's `config/apps/<instance>.yml` from Rundeck.

    ### How values are applied

    - Every supplied field is an **override**.
    - A blank field keeps the current value.
    - A key absent from the file inherits the %NAME% default.
    - **Extra YAML** is deep-merged last and can set keys not shown in this form.

    The job saves the previous file under `config/apps/.backups/` and prints a unified diff of
    the change. No SSH session is required.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Identity:** This value is the config filename and guest hostname. Enter
      a new lowercase, hyphenated name such as `%SLUG%-4k` to create another instance.'
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: stack
    description: '**Docker only.** Shared stack name, such as `media`. Leave blank to keep
      the current value. Native LXC apps ignore this field.'
    required: false
  - name: network
    description: '**Native LXC only.** Network name from `config/proxmox.yml`. Leave blank
      to keep the current value.'
    required: false
  - name: vmid
    description: Explicit Proxmox VMID. Required only on a `dhcp` network; otherwise leave
      blank so the platform allocates one.
    required: false
  - name: cores
    description: 'vCPU count. **Blank:** Keep the current value or inherit the app default.'
    required: false
  - name: memory
    description: 'RAM in MB. **Blank:** Keep the current value or inherit the app default.'
    required: false
  - name: disk
    description: 'Root disk in GB. **Blank:** Keep the current value or inherit the app default.'
    required: false
  - name: port
    description: Listening port. Set this only when multiple instances of this app share
      one stack host.
    required: false
  - name: subdomain
    description: 'Hostname on the lab domain. **Blank:** Use the instance name.'
    required: false
  - name: identity
    description: '**Authentik mode:** `none` skips registration; `catalog` adds a launch
      tile; `oidc` delegates sign-in; `forward_auth` enforces Authentik at the proxy.
      **Blank:** Keep the current value.'
    required: false
    values: ['', 'none', 'catalog', 'oidc', 'forward_auth']
    enforced: true
  - name: proxy
    description: 'Reverse proxy that publishes this app. **Blank:** Keep the current value.'
    required: false
    values: ['', 'internal', 'external']
    enforced: true
  - name: access
    description: '**Route access:** `internal` permits only `reverse_proxy.internal_cidrs`;
      `public` permits every source address. On a WAN-facing proxy, `public` means the
      internet. **Blank:** Keep the current value.'
    required: false
    values: ['', 'internal', 'public']
    enforced: true
  - name: estate
    description: '**Multi-estate labs only.** Estate name from `infrastructure.yml`.
      **Blank:** Use the default estate.'
    required: false
  - name: extra_yaml
    description: |-
      Additional instance keys as YAML. **Deep-merged last**, so they win over the fields
      above. Example:

      ```yaml
      app:
        root_folder: /media/movies
      ```
    required: false
  - name: reset
    description: '**`false` (normal):** Merge into the current file. **`true`:** Replace it
      with only the values in this form. The previous file remains in
      `config/apps/.backups/`.'
    required: true
    value: 'false'
    values: ['false', 'true']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/configure-app.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          # Blank options are omitted entirely rather than passed as empty strings, so
          # the playbook can tell "not supplied" from "supplied as empty".
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          ARGS+=(-e "app_scope=%SCOPE%")
          for opt in stack network vmid cores memory disk port subdomain identity proxy access estate; do
            var="RD_OPTION_$(printf '%s' "$opt" | tr '[:lower:]' '[:upper:]')"
            value="${!var:-}"
            [ -n "$value" ] && ARGS+=(-e "$opt=$value")
          done
          # extra_yaml is multi-line free text, so it goes through a file rather than a
          # -e string: newlines in an --extra-vars argument are not survivable.
          if [ -n "${RD_OPTION_EXTRA_YAML:-}" ]; then
            EXTRA="$(mktemp)"
            trap 'rm -f "$EXTRA"' EXIT
            printf 'extra_yaml: |\n' > "$EXTRA"
            printf '%s\n' "$RD_OPTION_EXTRA_YAML" | sed 's/^/  /' >> "$EXTRA"
            ARGS+=(-e "@$EXTRA")
          fi
          : "${RD_OPTION_RESET:?reset is required}"
          ARGS+=(-e "reset=$RD_OPTION_RESET")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          #
          # LAB_DOCTOR=0: this job is how an operator FIXES a config the doctor is
          # complaining about, so it must not refuse to run because the doctor complains.
          export LAB_DOCTOR=0
          exec lab-run playbooks/maintenance/configure-app.yml "${ARGS[@]}"
