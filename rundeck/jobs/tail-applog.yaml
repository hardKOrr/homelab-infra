# Tail App Log — a PER-APPLICATION TEMPLATE, not a job.
#
# rundeck/render-job.py expands this file into one "Tail <App> Log" job per application
# whose hosting kind implements a log tail (see rundeck/app-actions.yml), filed under that
# application's own Maintenance folder. The %TOKEN% placeholders are substituted per
# application; id, uuid and group are assigned by the renderer.
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: '%UUID%'
  uuid: '%UUID%'
  name: Tail %NAME% Log
  group: '%GROUP%'
  description: |-
    Stream recent %NAME% log lines into this job's console. A native LXC app is read
    through its lab-tail-applog script; a Docker app's Compose service logs are read on
    the stack host it runs on. Read-only.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: Which %NAME% instance. Leave it as it is unless this lab runs more than
      one — the list is every config/apps/<instance>.yml file that belongs to %SLUG%.
    required: true
    value: '%SLUG%'
    valuesUrl: file:/var/lib/rundeck/app-instances/%SLUG%.json
    enforced: false
  - name: lines
    description: How many log lines to show
    required: true
    value: '50'
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/tail-applog.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          ARGS=()
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")
          ARGS+=(-e "app=%SLUG%")
          : "${RD_OPTION_LINES:?lines is required}"
          ARGS+=(-e "lines=$RD_OPTION_LINES")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/tail-applog.yml "${ARGS[@]}"
