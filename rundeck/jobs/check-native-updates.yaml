# Check Native App Updates — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/check-native-updates.yaml
#
# Paths match rundeck/bootstrap-rundeck.sh: the repo at /var/lib/rundeck/homelab-infra
# and ansible-core in the venv at /opt/homelab-ansible. Change REPO/VENV below if you
# installed elsewhere.

- id: 2b6794f5-63ed-58ec-95fb-5c45db5ca06a
  uuid: 2b6794f5-63ed-58ec-95fb-5c45db5ca06a
  name: Check Native App Updates
  group: Maintenance
  description: |-
    Compare installed vs latest release for every native LXC app and notify via Ntfy. Notifies only — re-run an app's deploy job to update it. Scheduled Mondays at 06:00.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  nodeFilterEditable: false
  multipleExecutions: false
  schedule:
    crontab: '0 0 6 ? * MON *'
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/check-native-updates.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          REPO=/var/lib/rundeck/homelab-infra
          VENV=/opt/homelab-ansible/bin
          cd "$REPO/ansible"

          # with-proxmox-env.sh exports the PROXMOX_API_* environment the community.proxmox
          # dynamic inventory reads (it cannot take -e extra vars) from config/proxmox.yml,
          # the same gitignored file the playbooks load their connection details from.
          exec bash scripts/with-proxmox-env.sh ../config/proxmox.yml \
            "$VENV/ansible-playbook" -i inventory/ playbooks/maintenance/check-native-updates.yml
