# Check Native App Updates — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/check-native-updates.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 2b6794f5-63ed-58ec-95fb-5c45db5ca06a
  uuid: 2b6794f5-63ed-58ec-95fb-5c45db5ca06a
  name: Check Native App Updates
  group: Maintenance
  description: |-
    Compare installed vs latest release for every native LXC app and notify via Ntfy. Notifies only — re-run an app's deploy job to update it. Scheduled Mondays at 06:00.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  nodeFilterEditable: false
  multipleExecutions: false
  schedule:
    crontab: '0 0 6 ? * MON *'
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/check-native-updates.yml
      script: |-
          #!/bin/bash
          set -euo pipefail

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/check-native-updates.yml
