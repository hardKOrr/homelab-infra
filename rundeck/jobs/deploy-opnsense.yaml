---
- id: 1a6e263e-3393-5e79-8a08-a62f4fcd46cf
  uuid: 1a6e263e-3393-5e79-8a08-a62f4fcd46cf
  name: Deploy OPNsense
  group: Platform/Network/OPNsense
  description: |-
    Deploy a new **OPNsense** appliance from its checksum-pinned nano image.

    - Seeds interfaces and API accounts offline before the first boot.
    - Waits for the saved admin API key to authenticate; no console, SSH or guest agent is needed.
    - Separate from an existing infrastructure firewall; configure the new instance LAN address and bridges.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
    - name: instance
      description: Enter the appliance instance configured in config/apps/<instance>.yml.
      required: true
      value: opnsense
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - description: Run playbooks/apps/opnsense.yml
        script: |-
          #!/bin/bash
          set -euo pipefail
          : "${RD_OPTION_INSTANCE:?instance is required}"
          exec lab-run playbooks/apps/opnsense.yml -e "instance=$RD_OPTION_INSTANCE"
