# Reclaim Volume — the operator path for a PersistentVolume no claim is using.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/reclaim-volume.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.
#
# `action` defaults to `report`, the read-only choice, for the same reason Remove App's
# `delete_data` defaults to false: the destructive value must be one somebody picked.

- id: 70da9222-d3df-5714-b67c-3a260083386f
  uuid: 70da9222-d3df-5714-b67c-3a260083386f
  name: Reclaim Volume
  group: Maintenance
  description: |-
    Report on, release or destroy one Kubernetes PersistentVolume that no claim is using. Lab Status lists them under RETAINED VOLUMES. A retained volume is a restore point, not litter — nothing removes one on its own, and this job acts on exactly the volume you name.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: volume
    description: PersistentVolume name, exactly as Lab Status prints it under RETAINED VOLUMES — the full pvc-<uuid> form, not the claim or directory name.
    required: true
  - name: action
    description: 'report changes nothing and prints what the other two would do. release clears a stale claim reference so a Released volume becomes Available and reusable — the data is untouched. delete destroys the directory on the node and then the PersistentVolume object — the data is gone and there is no copy.'
    required: true
    value: report
    values: ['report', 'release', 'delete']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/reclaim-volume.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_VOLUME:?volume is required}"
          : "${RD_OPTION_ACTION:?action is required}"

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/maintenance/reclaim-volume.yml \
            -e "volume=$RD_OPTION_VOLUME" \
            -e "action=$RD_OPTION_ACTION"
