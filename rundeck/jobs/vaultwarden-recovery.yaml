- id: 54cfeee4-12c4-510e-bd42-1fe069de55f9
  uuid: 54cfeee4-12c4-510e-bd42-1fe069de55f9
  name: Vaultwarden Recovery
  group: Recover/Credentials
  description: |-
    > **Break glass only.** Re-establish automation access to Vaultwarden from restored seed
    > inputs.

    Complete `rundeck/VAULTWARDEN-RECOVERY.md` before running this job.

    **Enrollment succeeded but Cutover cannot unlock:** retain the staged machine
    credentials, Seed inputs, runtime configuration, external recovery material and
    Vaultwarden data. A failed preflight changes neither marker. Bitwarden CLI 2026.9.1
    fails its user-key-ID migration against Vaultwarden 1.37.3 after decrypting the
    account; this does not require account reconstruction. Use the supported bootstrap
    rerun with unchanged inputs to install the repository-pinned CLI 2026.8.0, then
    retry Cutover through its owning job. Coordinate any live rerun and verify its
    target/recovery scope first. Do not run this marker-removal job solely for that
    client incompatibility, replace credentials, or fabricate markers. If the verified
    client still fails, retain state and investigate before any account reconstruction.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: confirm
    description: Type **`ENTER-SEED-RECOVERY`** only after completing every recovery runbook
      prerequisite.
    required: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Show the guarded recovery requirements
      script: |-
          #!/bin/bash
          set -euo pipefail
          export LAB_SEED_MODE=1
          exec lab-run playbooks/maintenance/vaultwarden-recovery.yml \
            -e vault_recovery_confirm='@option.confirm@'
