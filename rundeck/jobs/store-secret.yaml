# Store Secret — write one field of one canonical Vaultwarden item.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/store-secret.yaml
#
# This is the platform's ONLY post-cutover secret-delivery route. Vaultwarden Cutover is
# a one-time Seed-mode job and lab-run refuses Seed mode once the vault-mode marker
# exists, so before this job a credential authored after the cutover could reach the lab
# only as a file hand-written onto the runner's disk. See the header of
# ansible/playbooks/maintenance/store-secret.yml.
#
# `value` is a secure option with no storagePath: Rundeck prompts for it, masks it in
# the form and the log, and it is never written to Key Storage or to this file.

- id: 87b09642-c9b0-5f3b-aa3d-63adbde555d0
  uuid: 87b09642-c9b0-5f3b-aa3d-63adbde555d0
  name: Store Secret
  group: Config
  description: |-
    Put a credential into Vaultwarden without touching a file on the runner. Use it for anything authored after the one-time Vaultwarden Cutover: a second estate's ACME DNS-01 token, a firewall API key, a rotated password. One field per run — run it twice with the same Item to store a key and its secret, and the second run keeps the first.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: vault_item
    description: 'Canonical item name WITHOUT the homelab-infra/ prefix. Examples: dns (the lab DNS provider credential), estates/foxglove/dns (one estate''s DNS provider credential), estates/foxglove/reverse_proxy (one estate''s ACME DNS-01 token, field dns_api_token), media/sonarr.'
    required: true
  - name: vault_field
    description: 'Field name inside that item, exactly as ansible/vars/CONTRACT.md names it — e.g. api_key, api_secret, dns_api_token, token, password.'
    required: true
  - name: value
    description: The secret itself. Masked in this form and in the job log, passed to the play through the environment, and stored as a hidden field.
    required: true
    secure: true
    valueExposed: true
  - name: merge
    description: true keeps the item's other fields (the normal case — this is how a two-field credential is stored in two runs). false replaces the item with this one field.
    required: true
    value: 'true'
    values: ['true', 'false']
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/maintenance/store-secret.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          # The secret goes through the environment, never through argv: an -e argument
          # is visible in /proc to every local account for the life of the run.
          : "${RD_OPTION_VAULT_ITEM:?vault_item is required}"
          : "${RD_OPTION_VAULT_FIELD:?vault_field is required}"
          : "${RD_OPTION_VALUE:?value is required}"
          export LAB_SECRET_VALUE="$RD_OPTION_VALUE"

          # LAB_DOCTOR=0: storing a secret is a step an operator may need precisely
          # BECAUSE the config doctor is complaining about a missing credential, so this
          # job must not refuse to run on the doctor's verdict.
          export LAB_DOCTOR=0
          exec lab-run playbooks/maintenance/store-secret.yml \
            -e "vault_item=$RD_OPTION_VAULT_ITEM" \
            -e "vault_field=$RD_OPTION_VAULT_FIELD" \
            -e "merge=${RD_OPTION_MERGE:-true}"
