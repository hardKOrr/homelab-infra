# Deploy Radarr — generated companion to the Semaphore template of the same name.
# Load with:  rd jobs load --project homelab-infra --format yaml --file rundeck/jobs/deploy-radarr.yaml
#
# The step calls `lab-run`, the single entry point installed by
# rundeck/bootstrap-rundeck.sh (a symlink to ansible/scripts/lab-run.sh in the checkout).
# It refreshes the checkout to origin/<branch>, validates config/ and execs
# ansible-playbook. Paths live in /etc/homelab-infra/lab-run.env, never in this file.

- id: 7218f07d-24d2-547a-96d8-146bbbf2ab8f
  uuid: 7218f07d-24d2-547a-96d8-146bbbf2ab8f
  name: Deploy Radarr
  group: Applications/Media & Entertainment/Library Automation/Radarr
  description: |-
    Deploy or converge **Radarr** for film library automation.

    - **Hosting:** Docker on the `media` stack
    - Registers the instance in the media application registry

    Run **Wire Media Stack** afterward to connect indexers and download clients.
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  nodeFilterEditable: false
  multipleExecutions: false
  options:
  - name: instance
    description: '**Default:** Keep the selected instance. Enter another name only to deploy
      an additional Radarr instance. The value identifies its config file, Compose project,
      and route.'
    required: true
    value: radarr
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: Run playbooks/apps/radarr.yml
      script: |-
          #!/bin/bash
          set -euo pipefail
          ARGS=()
          # Job options arrive as RD_OPTION_* environment variables — Rundeck's
          # ${option.x} tokens would collide with shell expansion in a script step.
          : "${RD_OPTION_INSTANCE:?instance is required}"
          ARGS+=(-e "instance=$RD_OPTION_INSTANCE")

          # lab-run refreshes the checkout, runs config-doctor, and execs
          # ansible-playbook through with-proxmox-env.sh. See ansible/scripts/lab-run.sh.
          exec lab-run playbooks/apps/radarr.yml "${ARGS[@]}"
