schema_version: 1

# Classification for jobs that act on the lab as a whole rather than on one application.
#
# Everything that is scoped to a single application — its Deploy job and every day-2 action
# in its Maintenance folder — is classified in catalog/applications.yml and expanded from
# the templates named in rundeck/app-actions.yml. Do not add a per-application job here.
jobs:
  bootstrap.yaml: Setup/Platform
  check-native-updates.yaml: Manage/Lab/Updates
  config-doctor.yaml: Manage/Configuration/Validation
  get-config.yaml: Manage/Configuration/Files
  guest-maintenance.yaml: Manage/Lab/Maintenance
  lab-descent.yaml: Manage/Lab/Maintenance
  lab-status.yaml: Manage/Lab/Health
  reclaim-volume.yaml: Manage/Storage/Volumes
  reimport-jobs.yaml: Setup/Automation
  store-secret.yaml: Manage/Configuration/Secrets
  vaultwarden-cutover.yaml: Setup/Credentials
  vaultwarden-enrollment.yaml: Setup/Credentials
  vaultwarden-recovery.yaml: Recover/Credentials
  verify-ascent.yaml: Manage/Lab/Health
  wire-media-stack.yaml: Manage/Integrations
