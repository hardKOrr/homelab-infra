name: Live-lab observation
description: Record what actually happened on the running lab — a scheduled window firing, an acceptance criterion being watched, a defect surfaced only by live behavior.
title: "[Observation] "
labels: ["observation"]
body:
  - type: markdown
    attributes:
      value: |
        See [`CONTRIBUTING.md`](../../CONTRIBUTING.md) for the full issue-to-PR lifecycle.
        Gate-green repository work and live-lab acceptance are different things — this
        template is for the second one. If the observation reveals a defect that needs a
        code change, open a separate Defect issue and link it here rather than expanding
        this one into implementation work.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will be observed, and against which source issue?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: >-
        The source implementation issue this evidences, and the exact live target:
        instance, guest, VMID, or job.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions
      description: What this observation does not confirm.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        The exact live criteria this observation must satisfy, stated in full so the
        issue stands on its own.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: The maintenance window, credential, or prior issue this observation depends on.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How the observation was captured — logs, timestamps, job output, screenshot.
    validations:
      required: true
  - type: textarea
    id: live-system-authority
    attributes:
      label: Live-system authority
      description: The exact live guest, container, or Proxmox resource observed.
    validations:
      required: true
  - type: textarea
    id: recovery-needs
    attributes:
      label: Recovery needs
      description: >-
        If the observation revealed a problem, what recovery was performed or is still
        needed? Write "None" if the observation confirmed expected behavior.
    validations:
      required: true
