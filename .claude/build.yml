# .claude/build.yml — per-repo manifest read by the sdlc skills and agents.

lang: [ansible, yaml]

# Gate toolchain lives in a WSL venv at ~/.venvs/homelab-ansible. One-time bootstrap (interactive
# sudo, run once on a fresh WSL distro):
#   sudo apt-get update && sudo apt-get install -y python3-venv python3-pip
#   python3 -m venv ~/.venvs/homelab-ansible
#   ~/.venvs/homelab-ansible/bin/pip install --upgrade pip
#   ~/.venvs/homelab-ansible/bin/pip install -r .claude/gate/requirements-dev.txt
#   ~/.venvs/homelab-ansible/bin/ansible-galaxy collection install -r ansible/requirements.yml
# Both gates are thin wrappers around committed scripts (.claude/gate/lint.sh,
# .claude/gate/test.sh) that carry the ANSIBLE_CONFIG/ANSIBLE_INVENTORY/lint-target rationale —
# see those scripts. Wrapping in a script (rather than an inline shell one-liner with $, $(...),
# or nested quotes) avoids shell-relay quoting hazards: a bare $(...)/"$var" one-liner mis-expands
# under some Windows-side shells (PowerShell native-arg quoting; one Bash-tool relay observed
# expanding $(find ...) on the Windows side before it reached WSL) and can silently run zero
# iterations while still exiting 0. Related: when passing absolute POSIX paths (/mnt/c/...) as
# arguments through a Windows-side Git Bash relay, prepend MSYS_NO_PATHCONV=1 — Git Bash otherwise
# rewrites leading-slash arguments to Windows paths before they reach WSL (observed on a
# value-proof command during the 006 run). Second trigger of the same hazard class (observed
# fix-adhoc-playbook-env run, 2026-07-06): an inline VAR=val prefix immediately before a
# ~-prefixed command path inside the single-quoted -lc string also trips MSYS path conversion
# (`bash: ~C:/Program: No such file or directory`); same fix — prepend MSYS_NO_PATHCONV=1 to the
# whole wsl invocation. .gitattributes forces these two scripts to LF so `bash`
# never chokes on a CRLF shebang line.
# No hardcoded repo path: `wsl` inherits the Windows cwd of the invoking shell (the repo root,
# where gates always run from), so the same command works on any machine/checkout location. The
# scripts derive their own absolute paths from $PWD inside WSL.
lint: wsl bash -lc 'bash .claude/gate/lint.sh'
test: wsl bash -lc 'bash .claude/gate/test.sh'
# No build: — nothing compiles; syntax-check IS the test gate.

# Deliberately empty. The whole toolchain (ansible-lint, ansible-playbook, ansible-galaxy) lives
# inside WSL behind the `wsl bash -lc '<inner string>'` relay, and that relay must NEVER be an
# allow: prefix: guard-git's simple-command check treats the single-quoted inner string as
# literal, so `wsl bash -lc 'x && anything'` would ride through an allowed lead — the relay is a
# bare interpreter in disguise. The two gate strings above are auto-approved by exact match,
# which covers construction's routine loop; anything else prompts. When runs stall on per-file
# iteration prompts, the fix is an argv-form wrapper (`wsl bash .claude/gate/<x>.sh <path>` — no
# inner shell string, so chaining chars stay unquoted and fail the simple-command check) declared
# here as a prefix — see plans/concept/sdlc-gate-iteration-wrappers.md.
allow: []

conventions:
  - .claude/CLAUDE.md
  - .claude/specs/framework.md
architecture: .claude/architecture.md
specs: .claude/specs/

