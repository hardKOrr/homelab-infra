  prowlarr:
    name: Prowlarr
    summary: indexer manager for the *arrs; run Wire Media Stack afterward.
    deploy_uuid: 8fa8c215-104e-50d2-ab75-6ce219aac208
    root: Applications
    category: Media & Entertainment
    type: Indexer Management
    scope: estate
    extra: [migrate]

  qbittorrent:
