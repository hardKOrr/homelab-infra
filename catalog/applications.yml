schema_version: 2

# Human-facing classification of everything this platform deploys. It is independent of
# hosting kind, stack assignment and Rundeck: those are execution details, not how an
# operator finds an application.
#
# The Rundeck renderer projects each entry to a leaf folder named after the application:
#
#     <root>/<category>[/<type>]/<name>            <- the Deploy job
#     <root>/<category>[/<type>]/<name>/Maintenance <- every day-2 job for that instance
#
# WHY A LEAF FOLDER PER APPLICATION. The day-2 jobs used to be one generic job per verb,
# each asking the operator to type an instance name, an app name and a stack tag that the
# platform already knows. That is the opposite of one-click. Expanding one template per
# application answers those questions from this file and from the app's own defaults, so
# the normal case is a click and the second-instance case is a dropdown.
#
# FIELDS
#   name      display name; the Deploy job is "Deploy <name>" and the leaf folder is <name>
#   job       the deploy job file in rundeck/jobs/
#   root      Applications (optional software) | Platform (capabilities the lab runs on)
#   category  first group segment under the root
#   type      second group segment; omit for Platform entries, which have no type axis
#   essential true withholds the Remove job — the platform cannot function without it
#   extra     day-2 actions beyond the ones the hosting kind implies (see rundeck/app-actions.yml)
#   exclude   derived actions this application cannot implement safely
#   scope     REQUIRED. estate = one deployment per estate, so its instances are named
#             <app>-<estate>[-<variant>]. lab = one deployment serves every estate.
#             There is no default: the shared side of the estate boundary is a deliberate,
#             named exception, not whatever nobody got round to classifying.
#   actions   explicit action list, replacing derivation entirely. Use only when the
#             hosting kind genuinely does not describe the thing (the k3s cluster).
#
# HOSTING IS NOT DECLARED HERE. Which day-2 actions exist is derived from
# ansible/vars/app-defaults/<slug>.yml — `hosting:` when present, otherwise the presence of
# `stack:` tells Docker from native, exactly as the rest of the platform decides it. That
# keeps one source of truth. Deriving the ACTION SET from hosting is not the same thing as
# grouping by hosting, which this file still forbids.

applications:
  authentik:
    name: Authentik
    job: deploy-authentik.yaml
    root: Platform
    category: Access and Identity
    scope: estate
    # Authentik is a four-service Compose project. The generic rollback seam can only
    # select and pin one image, so presenting Rollback Authentik would actually roll back
    # PostgreSQL (the first service) and then claim the application was rolled back.
    exclude: [rollback]

  caddy:
    name: Caddy
    job: deploy-caddy.yaml
    root: Platform
    category: Access and Identity
    scope: lab                          # the platform's single TLS edge fronts every estate
    essential: true

  postgresql:
    name: PostgreSQL
    job: deploy-postgresql.yaml
    root: Platform
    category: Data Services
    # Backends are deliberately instanced but serve applications across estates.
    scope: lab

  mysql:
    name: MySQL
    job: deploy-mysql.yaml
    root: Platform
    category: Data Services
    # Backends are deliberately instanced but serve applications across estates.
    scope: lab

  influxdb:
    name: InfluxDB
    job: deploy-influxdb.yaml
    root: Platform
    category: Data Services
    # Backends are deliberately instanced but serve applications across estates.
    scope: lab

  redis:
    name: Redis
    job: deploy-redis.yaml
    root: Platform
    category: Data Services
    scope: lab
  opnsense:
    name: OPNsense
    job: deploy-opnsense.yaml
    root: Platform
    category: Network
    scope: lab

  bazarr:
    name: Bazarr
    job: deploy-bazarr.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Automation
    scope: estate

  deemix:
    name: Deemix
    job: deploy-deemix.yaml
    root: Applications
    category: Media & Entertainment
    type: Download Clients
    scope: estate

  jellyfin:
    name: Jellyfin
    job: deploy-jellyfin.yaml
    root: Applications
    category: Media & Entertainment
    type: Media Servers
    scope: estate

  plex:
    name: Plex
    job: deploy-plex.yaml
    root: Applications
    category: Media & Entertainment
    type: Media Servers
    scope: estate

  tautulli:
    name: Tautulli
    job: deploy-tautulli.yaml
    root: Applications
    category: Media & Entertainment
    type: Media Analytics
    scope: estate

  jellyseerr:
    name: Jellyseerr
    job: deploy-jellyseerr.yaml
    root: Applications
    category: Media & Entertainment
    type: Request Management
    scope: estate

  kometa:
    name: Kometa
    job: deploy-kometa.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Management
    scope: estate
    exclude: [backup, restore]

  maintainerr:
    name: Maintainerr
    job: deploy-maintainerr.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Management
    scope: estate

  flaresolverr:
    name: FlareSolverr
    job: deploy-flaresolverr.yaml
    root: Applications
    category: Media & Entertainment
    type: Indexer Management
    # lab, not estate: FlareSolverr holds no domain, no identity and no per-estate
    # secret — nothing about it differs between estates, so every estate's Prowlarr
    # shares the one instance. This also keeps its NodePort (cluster-wide, unlike an
    # estate-routed app's per-instance subdomain) from needing one allocation per
    # estate — see ansible/vars/app-defaults/flaresolverr.yml.
    scope: lab
    # Stateless — no config, no database, nothing a backup would recover that a redeploy
    # does not already give back. See vars/app-defaults/flaresolverr.yml.
    exclude: [backup, restore]

  unpackerr:
    name: Unpackerr
    job: deploy-unpackerr.yaml
    root: Applications
    category: Media & Entertainment
    type: Download Clients
    scope: estate
    # Unpackerr is a stateless daemon. Its Arr settings are reconstructed from
    # the media registry and Vaultwarden at every deploy, so backup/restore
    # would not recover application state.
    exclude: [backup, restore]

  k3s-cluster:
    name: k3s Cluster
    job: deploy-k3s-cluster.yaml
    root: Platform
    category: Hosting
    scope: lab                          # one cluster hosts workloads from every estate
    # The cluster is a hosting backend, not an app instance: it has no container to
    # restart, no compose project to tail and no removal path. Re-running Deploy is the
    # whole of its day-2 story, so only its config file is separately editable.
    actions: [configure]

  lidarr:
    name: Lidarr
    job: deploy-lidarr.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Automation
    scope: estate
    extra: [migrate]

  mixpost:
    name: Mixpost
    job: deploy-mixpost.yaml
    root: Applications
    category: Content & Publishing
    type: Social Publishing
    scope: estate

  ntfy:
    name: Ntfy
    job: deploy-ntfy.yaml
    root: Platform
    category: Monitoring and Notifications
    scope: lab                          # one notification hub for the whole lab

  observability:
    name: Observability
    job: deploy-observability.yaml
    root: Platform
    category: Monitoring and Notifications
    scope: lab                          # one metrics and dashboard stack covers every guest
    # Prometheus and Grafana are separate services. The generic rollback seam cannot
    # truthfully roll this application back as one unit.
    exclude: [rollback]

  pbs:
    name: PBS
    job: deploy-pbs.yaml
    root: Platform
    category: Backup
    scope: lab                          # one backup server holds every estate's snapshots

  prowlarr:
    name: Prowlarr
    job: deploy-prowlarr.yaml
    root: Applications
    category: Media & Entertainment
    type: Indexer Management
    scope: estate
    extra: [migrate]

  qbittorrent:
    name: qBittorrent
    job: deploy-qbittorrent.yaml
    root: Applications
    category: Media & Entertainment
    type: Download Clients
    scope: estate

  radarr:
    name: Radarr
    job: deploy-radarr.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Automation
    scope: estate
    extra: [migrate]

  sabnzbd:
    name: SABnzbd
    job: deploy-sabnzbd.yaml
    root: Applications
    category: Media & Entertainment
    type: Download Clients
    scope: estate

  slskd:
    name: slskd
    job: deploy-slskd.yaml
    root: Applications
    category: Media & Entertainment
    type: Download Clients
    scope: estate

  sonarr:
    name: Sonarr
    job: deploy-sonarr.yaml
    root: Applications
    category: Media & Entertainment
    type: Library Automation
    scope: estate
    extra: [migrate]

  uptime-kuma:
    name: Uptime Kuma
    job: deploy-uptime-kuma.yaml
    root: Platform
    category: Monitoring and Notifications
    scope: lab                          # one status view of the whole lab

  vaultwarden:
    name: Vaultwarden
    job: deploy-vaultwarden.yaml
    root: Platform
    category: Access and Identity
    scope: lab                          # one vault is the platform's root of trust
    essential: true

  mariadb:
    name: MariaDB
    job: deploy-mariadb.yaml
    root: Platform
    category: Data Services
    scope: lab
