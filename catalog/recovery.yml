schema_version: 1

# Product recovery ownership and inventory metadata. Method mechanics remain in product
# defaults and roles; this file answers the separate question "which issue owns the
# method decision and what was known when the inventory was made?" It contains no live
# instance names, credentials, artifact contents, or claimed restore results.
#
# Every catalog product must appear exactly once. The coverage collector derives hosting,
# recovery units, shared-guest effects, and method declarations from this map plus the
# catalog/defaults. `deployment_issue` points at the existing implementation issue for
# products added after the original recovery queue; `recovery_issue` is the focused owner.

