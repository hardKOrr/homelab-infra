schema_version: 1

# Product recovery ownership and inventory metadata. Method mechanics remain in product
# defaults and roles; this file answers the separate question "which current observation
# issue covers this product's recovery proof, and what was known when the inventory was
# made?" It contains no live instance names, credentials, artifact contents, or claimed
# restore results.
#
# Every catalog product must appear exactly once. The coverage collector derives hosting,
# recovery units, shared-guest effects, and method declarations from this map plus the
# catalog/defaults. `recovery_issue` points at the current open per-product observation
# issue in the GitHub Issues fan. `deployment_issue`, where present, is historical context
# only and points at the already-closed implementation issue that introduced the product;
# neither field is a queue or a priority signal.

