# The PR #81 live note names one legacy source that was actually sampled. Its instance
# identity and version were intentionally not committed. It is preserved as an explicit
# pending selection, not treated as a must-keep choice and not adopted by the catalog.
legacy_sources:
  - id: legacy-sonarr-sample
    product: sonarr
    source: "legacy Sonarr sampled by the PR #81 audit; instance identity/version not recorded"
    recovery_issue: 90
    disposition: "preserve source and its existing native backup; do not adopt or mutate until the user selects it"
