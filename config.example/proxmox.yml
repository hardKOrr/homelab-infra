---
# Proxmox connection and global network config.
#
# YOU USUALLY DO NOT WRITE THIS FILE. `rundeck/bootstrap-rundeck.sh`, run as root on a
# Proxmox node, discovers most of it (`hostname`, `pvesm status`, `ip -o link`), prompts
# for the handful it cannot know, and writes config/proxmox.yml into the runner's
# checkout. This example is the reference for what it writes, and the template for anyone
# authoring by hand — copy it to config/proxmox.yml if you are doing it yourself.
#
# config/ is gitignored — neither git pull nor the runner's own `git reset --hard`
# refresh will ever overwrite it.
#
# Where these keys land (see ansible/vars/CONTRACT.md §2): the loader injects the three
# top-level keys below directly into homelabinfra_config, unwrapped —
#   proxmox:  → homelabinfra_config.proxmox.*
#   networks: → homelabinfra_config.networks.*
#   ansible:  → homelabinfra_config.ansible.*

proxmox:
  api_host: ""          # Proxmox IP or hostname (required)
  api_port: 8006
  node: ""              # Proxmox node name to deploy on (required, e.g. pve)
  api_user: homelab-infra@pve   # bootstrap-rundeck.sh creates this user with a scoped role
  api_token_id: automation      # the token bootstrap-rundeck.sh mints for that user

  # Storage every guest lands on. bootstrap-rundeck.sh discovers this as the first active
  # storage advertising content type 'rootdir' — the type a container rootfs requires. A
  # stock Proxmox `local` is vztmpl/iso/backup and will NOT hold a container.
  #
  # Lab-wide on purpose: which pool holds a guest is a fact about your node, not about the
  # app, so no app-default pins it. Override per app in config/apps/<instance>.yml with
  # proxmox.disk_volume.storage (LXC) or proxmox.vm.storage (VM).
  storage: ""           # e.g. local-lvm, tank-zfs (required — bootstrap fills this in)

  # Node name -> address, for every node in the cluster. bootstrap-rundeck.sh discovers this
  # from `pvesh get /cluster/status`.
  #
  # Why it is needed: guest creation uses the API, but the readiness checks that follow run
  # node-local `pct`/`qm` over SSH via `delegate_to: <node name>`. A Proxmox node name does
  # not resolve on its own — the dynamic inventory gives nodes no ansible_host, and your
  # resolver has no reason to know them. tasks/proxmox/register-nodes.yml turns this map
  # into addressable hosts. Omit it on a single-node lab and api_host is used instead.
  # nodes:
  #   pve: 192.168.1.10

  # Verify the Proxmox API's TLS certificate. Defaults to false, because a stock Proxmox
  # node serves a self-signed certificate and every guest-creating task would otherwise
  # fail with CERTIFICATE_VERIFY_FAILED. The dynamic inventory makes the same assumption
  # (ansible/inventory/proxmox.yml). Set to true once the node serves a trusted cert.
  # validate_certs: false

  # ── The secret is deliberately NOT here ──────────────────────────────────────
  # RECOMMENDED SHAPE: leave api_token_secret out of this file entirely and supply the
  # secret as the PROXMOX_API_TOKEN environment variable — from Rundeck Key Storage
  # (keys/proxmox/api-token, injected by lab-run.sh) or the Semaphore `Homelab`
  # environment. Both with-proxmox-env.sh and ansible/tasks/load-user-vars.yml read it
  # from there, and the environment wins over the file when both are present.
  #
  # Why: this file is shape, not secret. Keeping them apart is what lets the shape be
  # read, diffed, copied, reviewed and handed around by the Get Config job, while the one
  # genuinely privileged value stays in exactly one place. Fusing them imposes the
  # secret's constraints on the shape and gives the shape the secret's invisibility.
  #
  # api_token_secret: ""   # still supported, but prefer the env var above

# Network definitions. Add as many as you need.
#
# WHICH NETWORK A GUEST LANDS ON FOLLOWS FROM ITS SCOPE. You do not repeat a name in every
# instance file. ansible/tasks/network/resolve-network.yml answers, in order:
#
#   1. `network:` in config/apps/<instance>.yml, or `network:` on the stack — explicit,
#      and it must name one of the networks below or the run fails
#   2. `shared`, for an application marked `scope: lab` in catalog/applications.yml (the
#      TLS edge, the vault, PBS, Ntfy, the metrics stack, the cluster) and for any stack
#      declaring `shared: true`
#   3. the app's estate — `domains.<estate>.network` in infrastructure.yml if declared,
#      otherwise a network named after the estate itself
#   4. `default`, below
#
# Steps 2 and 3 apply ONLY if you have declared a network of that name. A lab with one flat
# `default` behaves exactly as it always did, and you segment one band at a time: declare
# `shared`, redeploy, and the lab-wide services move onto it; declare a network per estate
# and each estate's own apps follow. See the commented examples at the end of this block.
#
# ONE NETWORK PER VLAN, and this platform does not create the VLAN. The tag, the subnet and
# the gateway travel together, so `which network` and `which VLAN` are one question — but
# the VLAN itself, its bridge, its routes, and the firewall rules that let `shared` reach
# each estate are yours, exactly like the gateway and your router's DHCP range. Declare
# here only what already exists on the wire.
#
# Addressing is static. Every guest this platform creates is given an address it
# chose, so it can wire, route and monitor that guest afterwards. DHCP happens only
# where you write the literal 'dhcp' below, and then you must supply the VMID
# yourself, because the VMID is otherwise derived from the address.
networks:
  default:
    cidr: "192.168.1.0/24"   # set to 'dhcp' for DHCP (VMID must be provided manually)
    gateway: "192.168.1.1"   # never allocated, whether or not it is listed under reserved
    dns_servers:
      - "192.168.1.1"
    bridge: "vmbr0"
    vlan: 0             # 0 = no VLAN tag

    # Spans this platform must never hand out: your NAS, switches, printers, the
    # DHCP range your router serves, anything Proxmox does not know about. Each
    # entry is an address, an "a-b" range, or a CIDR.
    reserved:
      - "192.168.1.200-192.168.1.254"   # the router's DHCP range

    # ── Pools: address by function ────────────────────────────────────────────
    # Optional. Without pools, allocation walks the whole subnet from ip_offset —
    # which is fine for a small flat lab and wrong for one that groups guests by
    # function. A pool is a named span inside this network; a guest allocated into
    # a pool never lands outside it.
    #
    # An app reaches a pool two ways: it inherits the pool named after its stack
    # (a Docker app on `stack: media` uses a pool called media if one
    # is defined here), or it names one outright with `pool:` in its instance file
    # — config/apps/<instance>.yml, so two instances of the same app can sit in
    # different pools. A pool named there must exist; an inherited one that does
    # not is simply not used.
    #
    # pools:
    #   infra:         {range: "192.168.1.10-192.168.1.39"}
    #   apps:          {range: "192.168.1.40-192.168.1.99"}
    #   media:   {range: "192.168.1.100-192.168.1.149"}
    # default_pool: apps   # what a guest naming no pool uses

    # Used only when no pool applies. At a /24 `ip_offset: 10` means .10, which is
    # what most labs read it as — but it is an index into the whole host range, so
    # at a /20 the same 10 means x.0.10 and a /20's guests can run to x.15.254.
    # Pools express the same intent unambiguously at any prefix length.
    ip_offset: 10
    max_hosts: 200      # optional: cap on how far past ip_offset allocation walks

  # ── Bands now, VLANs later ──────────────────────────────────────────────────
  # Keys you do not repeat are inherited from `default` above — really inherited:
  # generate-ip.yml merges `default` under the selected network, and config-doctor
  # judges the merged result, so a band may legitimately carry one key.
  #
  # That is what lets the split start before the VLANs do. Declare `shared` and your
  # estate NOW with nothing but an `ip_offset` each, and the two sets are addressed out
  # of different bands of one flat subnet from the first deploy — same bridge, same
  # broadcast domain, no router change. Segmenting later is then adding cidr/gateway/vlan
  # to a band that already exists, and no guest already deployed changes address.
  # bootstrap-rundeck.sh writes exactly this shape from two addresses it asks for.
  #
  #   shared:   {ip_offset: 2826, max_hosts: 32}   # 192.168.11.10 in a 192.168.0.0/20
  #   personal: {ip_offset: 2858}                  # 192.168.11.42
  #
  # `max_hosts` on the lower band is what stops allocation walking into the upper one.
  #
  # Uncomment the fuller forms below when the VLANs exist on your switch and router.

  # The lab-scoped services every estate depends on, and the runner itself. Named
  # exactly `shared` — that name is what `scope: lab` and `shared: true` resolve to.
  # shared:
  #   cidr: "10.10.13.0/24"
  #   gateway: "10.10.13.1"
  #   dns_servers: ["10.10.13.1"]
  #   vlan: 13

  # One per estate, named after the estate in infrastructure.yml's `domains:` map. An
  # estate whose VLAN is not called after it sets `domains.<estate>.network` to point
  # at whatever you named it here instead.
  # personal:
  #   cidr: "10.10.20.0/24"
  #   gateway: "10.10.20.1"
  #   dns_servers: ["10.10.20.1"]
  #   vlan: 20
  # foxglove:
  #   cidr: "10.10.21.0/24"
  #   gateway: "10.10.21.1"
  #   dns_servers: ["10.10.21.1"]
  #   vlan: 21

  # An ordinary extra network, reached by naming it in an instance file. Nothing
  # resolves to it by scope.
  # iot:
  #   cidr: "10.10.30.0/24"
  #   gateway: "10.10.30.1"
  #   dns_servers: ["10.10.30.1"]
  #   vlan: 30
  #   ip_offset: 10

ansible:
  ssh_user: root
  ssh_public_key: ""    # paste your public key here — deployed to all created guests
