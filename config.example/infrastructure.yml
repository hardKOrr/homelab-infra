---
# Platform infrastructure declarations.
# Copy this to config/infrastructure.yml and fill in your values.
# This file is gitignored — git pull will never overwrite it.
#
# Where these keys land (see ansible/vars/CONTRACT.md §2): the loader places this WHOLE file
# under homelabinfra_config.infrastructure — e.g. domain → homelabinfra_config.infrastructure.domain,
# reverse_proxy.provider → homelabinfra_config.infrastructure.reverse_proxy.provider.
#
# This file declares roles, provider choices, and non-secret connection shape. Seed
# credentials may be supplied during initial runner bootstrap but are removed after
# verified Vaultwarden cutover. The durable file should contain no secret.
# Two non-secret/control-plane details need special mention:
#   1. Connection details for hosts NOT in the Proxmox inventory (e.g. dns.host for an
#      external OPNsense) — homelab-infra cannot resolve them, so you supply the IP here.
#   2. Vaultwarden's admin token is external because it controls the server; Rundeck
#      injects it from AES-GCM Key Storage for enrollment/cutover/recovery.
# Everything else (connection details for managed services) is written automatically to
# config/.generated/facts.yml by the bootstrap playbook after each service is deployed.

# Your homelab domain. All app routes will be subdomains of this.
domain: "homelab.example.com"

# ── Estates (optional — most labs skip this) ───────────────────────────────────
# A second domain is an ESTATE: its own domain and its own Authentik instance
# (deployed as a normal app with routing.estate: <name>), optionally its own DNS
# and its own ACME DNS-challenge token — sharing one reverse proxy, Ntfy, Uptime
# Kuma, metrics and PBS with the rest of the lab. `domain:` above stays valid as
# shorthand for a single default estate. Apps pick an estate with routing.estate
# in config/apps/<instance>.yml; unset means the default estate.
# domains:
#   personal:
#     domain: "homelab.example.com"
#     default: true                # exactly one default; else the first entry wins
#   foxglove:
#     domain: "second-domain.example.com"
#     dns_challenge:               # optional — public certs without opening port 80
#       provider: cloudflare       # any github.com/caddy-dns/<provider> module
#       # Provider-specific fields stay flat in this block. For Cloudflare,
#       # api_token is read from homelab-infra/estates/foxglove/dns after cutover.

# ── Reverse Proxy ──────────────────────────────────────────────────────────────
# provider: caddy | nginx | none
# instance: the Proxmox hostname of your reverse proxy LXC (used for inventory lookup)
#
# If you run two proxies (e.g. nginx external, caddy internal), declare both:
#   internal: { provider: caddy, instance: caddy }
#   external: { provider: nginx, instance: nginx-ext }
# Apps default to 'internal'. Override per-app with routing.proxy: external
reverse_proxy:
  provider: caddy
  instance: caddy
  # Caddy enforces these source networks for every app whose routing.proxy is
  # internal. Split DNS alone is not treated as an access control.
  internal_cidrs:
    - "192.168.1.0/24"
  # DNS-01 obtains publicly trusted certificates without public A/AAAA records or
  # inbound WAN ports. Store only the provider here; the token belongs in
  # homelab-infra/reverse_proxy field dns_api_token.
  dns_challenge:
    provider: cloudflare
    # Provider-specific fields stay flat beside provider. The guided Cloudflare
    # path injects api_token; other caddy-dns modules keep their native field names.
    # Public resolvers keep ACME propagation checks independent of local Unbound
    # overrides in a split-horizon lab.
    resolvers:
      - "1.1.1.1:53"
      - "1.0.0.1:53"

# ── SSO ────────────────────────────────────────────────────────────────────────
# provider: authentik | none
# Set to none to skip SSO wiring for all apps.
sso:
  provider: authentik
  instance: authentik

# ── Notifications ──────────────────────────────────────────────────────────────
# provider: ntfy | gotify | discord | none
# ntfy/gotify: self-hosted — deploy via bootstrap, instance is Proxmox hostname
# discord: external — provide webhook_url instead of instance
notifications:
  provider: ntfy
  instance: ntfy
  # topic: homelab           # ntfy topic to publish to (default: homelab)
  # webhook_url: ""          # for discord/slack (instead of instance)

# ── DNS ────────────────────────────────────────────────────────────────────────
# provider: pihole | adguard | opnsense | none
# pihole/adguard: managed by homelab-infra, instance is Proxmox hostname
# opnsense: external — provide host IP (OPNsense has a REST API for host overrides)
# none: no automatic DNS record creation
dns:
  provider: opnsense
  host: "192.168.1.1"       # OPNsense/external DNS host IP
  # api_key is read from homelab-infra/dns after cutover
  # instance: pihole        # for pihole/adguard: Proxmox hostname

# ── Backups ────────────────────────────────────────────────────────────────────
# PBS is deployed as a VM by bootstrap. Configure the datastore path here.
# Bootstrap will configure the backup schedule — PBS runs backups autonomously.
backups:
  datastore_path: "/mnt/backup"   # path on the PBS VM where backups are stored
  schedule: "daily"               # daily | weekly | custom cron
  retention:
    keep_last: 3
    keep_daily: 7
    keep_weekly: 4

# ── Vaultwarden ────────────────────────────────────────────────────────────────
# Vaultwarden is enforced — it is always deployed as the platform secrets store.
#
vaultwarden:
  instance: vaultwarden # Proxmox hostname

# ── Stack host sizing (optional) ───────────────────────────────────────────────
# Docker apps share a host per stack, created by whichever app on that stack deploys
# first. Sizing lives with the STACK rather than with any one app, so the host does not
# end up sized by deploy order — ansible/vars/stack-defaults.yml holds the git-managed
# values, and anything here is deep-merged over them.
#
# These apply when the stack host is CREATED. Resizing a host that already exists is a
# Proxmox operation; changing a number here does not move a running guest.
#
# Omit this block entirely unless a stack needs more than the default:
#   sso_stack         4 cores / 4096 MB / 32 GB   Authentik, on its own by design
#   monitoring_stack  4 cores / 4096 MB / 64 GB   Uptime Kuma + Prometheus + Grafana
#   media_stack       4 cores / 4096 MB / 32 GB   the *arr suite
#   anything else     2 cores / 2048 MB / 16 GB
#
# stacks:
#   monitoring_stack:
#     memory: 8192
#     disk_volume:
#       size: 64
