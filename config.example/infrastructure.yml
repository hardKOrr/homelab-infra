---
# Platform infrastructure declarations.
# Copy this to config/infrastructure.yml and fill in your values.
# This file is gitignored — git pull will never overwrite it.
#
# Where these keys land (see ansible/vars/CONTRACT.md §2): the loader places this WHOLE file
# under homelabinfra_config.infrastructure — e.g. domain → homelabinfra_config.infrastructure.domain,
# reverse_proxy.provider → homelabinfra_config.infrastructure.reverse_proxy.provider.
#
# This file declares roles, provider choices, and non-secret connection shape. Seed
# credentials may be supplied during initial runner bootstrap but are removed after
# verified Vaultwarden cutover. The durable file should contain no secret.
# Two non-secret/control-plane details need special mention:
#   1. Connection details for hosts NOT in the Proxmox inventory (e.g. dns.host for an
#      external OPNsense) — homelab-infra cannot resolve them, so you supply the IP here.
#   2. Vaultwarden's admin token is external because it controls the server; Rundeck
#      injects it from AES-GCM Key Storage for enrollment/cutover/recovery.
# Everything else (connection details for managed services) is written automatically to
# config/.generated/facts.yml by the bootstrap playbook after each service is deployed.

# Your homelab domain. All app routes will be subdomains of this.
domain: "homelab.example.com"

# ── Estates (optional — most labs skip this) ───────────────────────────────────
# A second domain is an ESTATE: its own domain and its own Authentik instance
# (deployed as a normal app with routing.estate: <name>), optionally its own DNS
# and its own ACME DNS-challenge token — sharing one reverse proxy, Ntfy, Uptime
# Kuma, metrics and PBS with the rest of the lab. `domain:` above stays valid as
# shorthand for a single default estate. Apps pick an estate with routing.estate
# in config/apps/<instance>.yml. With two or more estates, exactly one must declare
# `default: true`, and estate-scoped instances name every estate explicitly:
# `<app>-<estate>[-<variant>]` (for example, radarr-personal and radarr-foxglove-4k).
# domains:
#   personal:
#     domain: "homelab.example.com"
#     default: true                # required when two or more estates exist
#   foxglove:
#     domain: "second-domain.example.com"
#     network: "foxglove"          # optional — which network (and therefore which VLAN)
#                                  # this estate's guests are addressed on, keyed into
#                                  # `networks:` in config/proxmox.yml. Omit it and a
#                                  # network named after the estate is used if you declared
#                                  # one, otherwise `default`. Name it only when the VLAN
#                                  # is not called after the estate. The lab-scoped
#                                  # services — proxy, vault, PBS, Ntfy, metrics, cluster —
#                                  # go on `shared` instead and belong to no estate.
#     dns_challenge:               # optional — public certs without opening port 80
#       provider: cloudflare       # any github.com/caddy-dns/<provider> module
#       # Provider-specific fields stay flat in this block. For Cloudflare, api_token
#       # is read from homelab-infra/estates/foxglove/reverse_proxy field
#       # dns_api_token after cutover — the same shape as the lab-wide token below.
#     dns:                         # optional — which DNS provider serves THIS estate
#       provider: opnsense         # pihole | adguard | opnsense | none
#       host: "192.168.1.1"
#       # NON-SECRET HALF ONLY. The estate inherits the credential stored under
#       # homelab-infra/dns, so one firewall serving two estates is ONE stored
#       # key, not a copy per estate. Store a key here only when this estate uses
#       # a DIFFERENT DNS server — then it goes in
#       # homelab-infra/estates/foxglove/dns (fields api_key, api_secret).
#       #
#       # This block is why `dns.provider` below can stay `none`: it selects DNS
#       # per estate, so a lab whose default estate already has hand-built records
#       # can manage a second estate's zone without rewriting the first. It works
#       # on the default estate too — `dns: {provider: none}` holds it out.

# ── Reverse Proxy ──────────────────────────────────────────────────────────────
# provider: caddy | nginx | none
# instance: the Proxmox hostname of your reverse proxy LXC (used for inventory lookup)
#
# If you run two proxies (e.g. nginx external, caddy internal), declare both:
#   internal: { provider: caddy, instance: caddy }
#   external: { provider: nginx, instance: nginx-ext }
# Apps default to 'internal'. Override per-app with routing.proxy: external
#
# routing.proxy picks WHICH proxy. It says nothing about who may reach the app:
# that is routing.access (internal | public, default internal), set per app in
# config/apps/<instance>.yml. Nothing an app declares about its proxy can publish it.
reverse_proxy:
  provider: caddy
  instance: caddy
  # Caddy enforces these source networks for every app whose routing.access is
  # internal. Split DNS alone is not treated as an access control. Apps with
  # routing.access: public get no source matcher and are reachable from anywhere
  # this proxy is.
  internal_cidrs:
    - "192.168.1.0/24"
  # DNS-01 obtains publicly trusted certificates without public A/AAAA records or
  # inbound WAN ports. Store only the provider here; the token belongs in
  # homelab-infra/reverse_proxy field dns_api_token.
  dns_challenge:
    provider: cloudflare
    # Provider-specific fields stay flat beside provider. The guided Cloudflare
    # path injects api_token; other caddy-dns modules keep their native field names.
    #
    # Caddy's propagation check ("can I see the TXT record I just wrote?") is
    # disabled by default, because a split-horizon lab cannot answer it: the local
    # resolver is authoritative for the lab domain and never learns the ACME record,
    # and a firewall that redirects outbound :53 makes naming a public resolver
    # cosmetic. Let's Encrypt validates from the public internet, where the record
    # really is, so nothing is lost. Restore the check with a positive
    # propagation_timeout plus resolvers your network does not intercept.
    propagation_delay: 30s
    propagation_timeout: -1

# ── SSO ────────────────────────────────────────────────────────────────────────
# provider: authentik | none
# Set to none to skip SSO wiring for all apps.
sso:
  provider: authentik
  instance: authentik

# ── Notifications ──────────────────────────────────────────────────────────────
# provider: ntfy | gotify | discord | none
# ntfy/gotify: self-hosted — deploy via bootstrap, instance is Proxmox hostname
# discord: external — provide webhook_url instead of instance
notifications:
  provider: ntfy
  instance: ntfy
  # topic: homelab           # ntfy topic to publish to (default: homelab)
  # webhook_url: ""          # for discord/slack (instead of instance)

# ── DNS ────────────────────────────────────────────────────────────────────────
# provider: pihole | adguard | opnsense | none
# pihole/adguard: managed by homelab-infra, instance is Proxmox hostname
# opnsense: external — provide host IP (OPNsense has a REST API for host overrides)
# none: no automatic DNS record creation
dns:
  provider: opnsense
  host: "192.168.1.1"       # OPNsense/external DNS host IP
  # api_key is read from homelab-infra/dns after cutover
  # instance: pihole        # for pihole/adguard: Proxmox hostname

# ── Media storage ──────────────────────────────────────────────────────────────
# Where the media apps find the library and the downloads. Configured once here
# for the whole lab; an app says only which subdirectory of the library it owns
# (app.library_subpath in vars/app-defaults/<app>.yml).
#
# This platform does NOT create, export, format or manage this storage. Your node
# already has it mounted — an NFS export from a NAS, a ZFS dataset, a disk. All
# this does is attach those existing directories to the media stack host as
# Proxmox mountpoints, and mount them into the app containers.
#
# `host` is the path on the Proxmox node. `path` is where the guest and the
# containers see it. KEEP THEM IDENTICAL unless you have a reason not to: an app
# database records absolute file paths, so identical paths on both sides are what
# lets an app migrated from another machine keep resolving its library with
# nothing rewritten, and what keeps imports as hardlinks instead of copies.
#
# Omit the whole block on a lab with no media apps.
# media_storage:
#   library: /mnt/data/media      # the root the app libraries live under, as the
#                                 # containers see it. app.library_subpath hangs
#                                 # off this: movies, tv, movies/4k, and so on
#   mounts:
#     - host: /mnt/media          # the NFS export mounted on the node
#       path: /mnt/data/media
#     - host: /mnt/downloads      # where the download clients put things
#       path: /mnt/downloads
#   owner:                        # who owns this storage, on BOTH sides
#     user: homelab-infra         # created on the node if it is not there
#     uid: 1313
#     gid: 1313
#
# About `owner`. Media apps run on an unprivileged stack host, which maps its
# whole id range into the node's 100000+ block — so a library owned by an id
# outside that block is visible inside the guest as nobody:nogroup and every
# write to it is refused. The platform gives the guest a passthrough entry for
# this one id, making it the same identity on the node and in the container, and
# gives the mount roots to that account.
#
# Pick an id nothing else on the node uses. Linux has no registry of local uids:
# /etc/login.defs reserves 0 for root, 1-999 for system accounts and hands
# UID_MIN-UID_MAX (1000-60000 by default) to useradd's automatic allocation.
# Creating this account is what claims the id against that allocator. An id above
# UID_MAX can never be auto-assigned at all, if you would rather not rely on that.
#
# Do NOT point this at an existing human or service account. The default was 1000
# once, which on a Debian node is usually the first account ever created there —
# the platform ended up sharing an id with an unrelated file server.

# ── Maintenance (optional) ─────────────────────────────────────────────────────
# Boot order. Proxmox starts guests with onboot=1 in ascending `order`, waiting
# `up` seconds after each one before starting the next. This platform sets onboot
# on everything it creates, so without an order the whole lab races back after a
# reboot and apps reach for Caddy, Vaultwarden or DNS before those exist.
#
# The ordering is written onto the guest at the hypervisor, so it holds for ANY
# reboot — a maintenance run, a power cut, someone rebooting a node by hand.
#
# These are the values a guest that declares nothing of its own receives. The
# platform services claim tiers below the default already:
#
#   10 reverse proxy        40 SSO stack           60 backups
#   20 secrets              45 cluster nodes       70 uptime monitoring
#   30 notifications        50 apps and stacks
#
# Uptime Kuma is last deliberately — it must not page about services that are
# still on their way up. An individual app overrides its own tier with
# `proxmox.boot_order` in config/apps/<instance>.yml; a stack host's tier belongs
# to the stack, in the `stacks:` block below.
#
# Omit the block to accept the defaults. Set `order: none` to switch boot ordering
# off lab-wide and leave every guest exactly as Proxmox would have had it.
# maintenance:
#   boot:
#     order: 50    # default tier for a guest that declares none | none to disable
#     up: 15       # seconds to wait after a guest before starting the next tier
#
# ── When the lab may be disrupted ──────────────────────────────────────────────
# One schedule governs every disruptive action: guest reboots, node reboots and
# container restarts. Update CADENCE is not scheduled — packages and images are
# still fetched as often as possible. Only the disruptive half waits.
#
# This exists because reboots otherwise never happen. unattended-upgrades installs
# kernel and libc updates on every guest and deliberately does not reboot, so
# without a window the lab runs unpatched code it believes it patched.
#
# Three forms, and nothing else to learn:
#
#   schedule: always              reboot and restart whenever something needs it
#   schedule: never               never disrupt automatically; notify only
#   schedule:                     a maintenance window
#     days: [Sun]                 day names, or `any`
#     start: "03:00"              on the lab's own clock (see `timezone` in
#                                 config/proxmox.yml)
#     duration: 120               minutes; the window may run past midnight
#
# The default is nightly 04:00 for two hours, which is exactly when container
# restarts already happened before this key existed.
#
# An estate narrows it under `domains.<name>.maintenance.schedule`, a stack under
# `stacks.<name>.maintenance.schedule`, and one app under `maintenance.schedule` in
# its own config/apps/<instance>.yml. A narrower layer REPLACES the wider one whole.
#
# Two estates keep independent clocks — a schedule is never inherited across them.
#
# Apps sharing one stack host INTERSECT: the host may only reboot inside every one
# of their windows, and one app set to `never` holds the whole host. Two windows
# that never overlap are reported as a conflict, not settled by picking a winner.
#
#   schedule:
#     days: [Sun]
#     start: "03:00"
#     duration: 120

# ── Backups ────────────────────────────────────────────────────────────────────
# PBS is deployed as a VM by bootstrap. Configure the datastore path here.
# Bootstrap will configure the backup schedule — PBS runs backups autonomously.
backups:
  datastore_path: "/mnt/backup"   # path on the PBS VM where backups are stored
  schedule: "daily"               # daily | weekly | custom cron
  retention:
    keep_last: 3
    keep_daily: 7
    keep_weekly: 4

# ── Vaultwarden ────────────────────────────────────────────────────────────────
# Vaultwarden is enforced — it is always deployed as the platform secrets store.
#
vaultwarden:
  instance: vaultwarden # Proxmox hostname

# ── Stack host sizing (optional) ───────────────────────────────────────────────
# Docker apps share a host per stack, created by whichever app on that stack deploys
# first. Sizing lives with the STACK rather than with any one app, so the host does not
# end up sized by deploy order — ansible/vars/stack-defaults.yml holds the git-managed
# values, and anything here is deep-merged over them.
#
# These apply when the stack host is CREATED. Resizing a host that already exists is a
# Proxmox operation; changing a number here does not move a running guest.
#
# Omit this block entirely unless a stack needs more than the default:
#   sso         4 cores / 4096 MB / 32 GB   Authentik, on its own by design
#   monitoring  4 cores / 4096 MB / 64 GB   Uptime Kuma + Prometheus + Grafana
#   media       4 cores / 4096 MB / 32 GB   the *arr suite
#   anything else     2 cores / 2048 MB / 16 GB
#
# The same block chooses where the stack host is ADDRESSED, for the same reason it
# sizes it: the host is shared and the first app to deploy creates it, so an address
# declared per app would depend on deploy order.
#
#   pool:       a pool from config/proxmox.yml this host allocates in. A stack whose
#               name matches a pool name needs nothing here — that pool is inherited.
#               Naming a pool the network does not define fails the run.
#   ip_address: pin this host to an exact address. Honoured as written or refused
#               with the conflict named, never quietly replaced.
#   shared:     true means this stack host deliberately serves EVERY estate. Default
#               false, and false is what an ordinary stack should stay.
#
# ESTATE ISOLATION. A stack is a concept, not a host. In a lab that declares two or more
# estates under `domains:` below, an estate-scoped app resolves to its own host — `media`
# is the guest `stack-media-personal` for one estate and `stack-media-foxglove` for the
# other, tagged `_.stack+media-personal` and `_.stack+media-foxglove`. An app can never
# silently reuse another estate's host, because the identity it looks the host up by
# already carries its estate.
#
# `shared: true` is the only way across that boundary. It makes one host serve every
# estate and stamps `_.shared` on it, which is a DECLARATION and never an inference: no
# code concludes after the fact that a host became shared because two estates landed on
# it. Caddy (the single TLS edge) and the k3s cluster are the platform's own deliberate
# shared substrates; they declare it in their own defaults, not here.
#
# Being lab-wide is not the same as being shared. PBS, Ntfy and the metrics stack each
# serve the whole lab and are none of them `_.shared` — the tag means cross-estate
# HOSTING, not importance.
#
# stacks:
#   monitoring:
#     memory: 8192
#   media:
#     pool: media
#   sso:
#     ip_address: "192.168.1.50"
#     disk_volume:
#       size: 64
