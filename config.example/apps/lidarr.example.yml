---
# Example instance configuration for Lidarr. Copy to config/apps/<instance>.yml.
# Defaults (including the shared Servarr settings) are in
# ansible/vars/app-defaults/lidarr.yml and annotated in sonarr.example.yml.

# To use Docker on an LXC, uncomment these instance overrides and set
# infrastructure.stacks.media-lxc.guest_type: lxc in config/infrastructure.yml.
# hosting:
#   method: docker
# stack: media-lxc
# To run on the Kubernetes cluster instead, set hosting.method: kubernetes (and drop the
# stack line). The library and download mounts come from their existing NFS exports at the
# same paths.

# To run Lidarr natively on its own LXC (or set guest_type: vm for a VM), set these
# instance overrides. Deploy installs the pinned release as a systemd service; app.port
# still sets the web port, and the library mounts attach to the guest like on the stack host.
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc
