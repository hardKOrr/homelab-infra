---
# Ntfy instance config.
# Copy to config/apps/ntfy.yml. Only set values that differ from defaults
# in vars/app-defaults/ntfy.yml. This file persists after removal — it is
# your restore point for re-deploying.
#
# Filename = instance name. The filename you choose becomes the hostname,
# Caddy subdomain (ntfy.yourdomain.com), and Uptime Kuma monitor name.
#
# Ntfy usually needs no overrides at all — an empty file (or no file) is fine.
#
# Credentials are NOT set here. The publish account's password and access token
# are generated on first deploy and recorded in config/.generated/facts.yml
# (gitignored, mode 0600). Every homelab-infra tool that sends notifications
# reads them from there.

# ── Proxmox resource overrides ─────────────────────────────────────────────────
# proxmox:
#   cores: 2
#   memory: 1024    # MB — default 512 is plenty; raise only for heavy attachment use

# ── App-specific config ────────────────────────────────────────────────────────
# app:
#   port: 80                          # port Ntfy listens on inside the LXC
#   topic: homelab                    # topic every homelab-infra tool publishes to
#   user: homelab                     # publish account name
#   message_retention: 12h            # how long cached messages stay fetchable
#   attachment_total_size_limit: 2G   # disk budget for attachments

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal  # internal | external
#   access: internal # internal | public. public is the usual reason to change this — it
#                    # is what gets phone notifications off-LAN without a VPN.
#   # auth stays false — Ntfy has its own token auth; Authentik in front would
#   # break every tool that publishes with a bearer token.
