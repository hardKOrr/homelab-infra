# Frigate is a dedicated Docker-on-VM stack, not a tenant of media/services.
# Copy this to config/apps/<instance>.yml after declaring its recording-storage mount.
# For a camera-less CPU-only instance, select detector: cpu and leave device paths,
# hwaccel_args and recordings_path blank.
# Store camera credentials as one JSON value in hidden Vaultwarden field
# camera_credentials on homelab-infra/apps/<instance>, for example:
#   {"front":{"username":"camera-user","password":"..."}}
# Store the optional MQTT password in hidden field mqtt_password. Never put either secret
# in this file or in a camera URL.
# Deploy seeds config.yml only when it is absent. Later changes to cameras, detector or
# MQTT here, or camera/MQTT credentials in Vaultwarden, do not update Frigate's existing
# config. Make those edits in Frigate's UI/API, or remove the instance config.yml before
# Deploy to seed it again; reseeding replaces UI-managed settings.

app:
  detector: coral # Use cpu when no Coral is deployed.
  # CPU-only: set detector to cpu and set gpu_device, igpu_render_node,
  # coral_usb_mapping and hwaccel_args to empty strings.
  # The key of a proxmox.devices declaration with kind: igpu, mode: dedicated and a
  # matching PCI resource mapping on its declared node.
  gpu_device: intel-igpu
  # This is the render node inside the VM after full PCI passthrough.
  igpu_render_node: /dev/dri/renderD128
  # The exact Proxmox USB resource mapping declared dedicated under proxmox.devices.
  coral_usb_mapping: frigate-coral
  # A second instance on the shared frigate guest needs a distinct app.port. Auxiliary
  # host ports default to app.port + 1 (RTSP) and +2 (WebRTC); override them if needed.
  # rtsp_port: 8972
  # webrtc_port: 8973
  # Must equal the path of one frigate_storage.mounts entry in config/infrastructure.yml. Keep this mount
  # on storage sized for retention_days; recordings are continuously written.
  recordings_path: /mnt/frigate-recordings
  minimum_free_gb: 256
  retention_days: 7
  cameras:
    front:
      host: camera.example.test
      port: 554
      path: /stream1
      roles: [detect, record]
      detect:
        width: 1920
        height: 1080
        fps: 5
  mqtt:
    host: mqtt.example.test
    port: 1883
    username: frigate

routing:
  identity: catalog

backup:
  enabled: true
  schedule: "0 3 * * *"

# Recovery: the VM PBS snapshot covers config; the external recording-storage owner must
# snapshot/restore its mount separately before Frigate is redeployed. See
# ansible/roles/frigate/README.md.
