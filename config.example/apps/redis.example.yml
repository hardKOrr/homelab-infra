---
# Redis backend instance configuration. Its generated password is stored in
# Vaultwarden item homelab-infra/apps/<instance>; do not put it in this file.
# Redis defaults to an LXC. Choose vm or lxc and optional node/storage per instance;
# Deploy refuses a guest type that differs from an existing guest.
# proxmox:
#   guest_type: lxc        # lxc (default) or vm
#   node: <pve-node-2>     # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
# app:
#   port: 6379
#   # Optional per-instance overrides, in MiB. The default maxmemory is 50% of
#   # proxmox.memory. noeviction preserves existing keys and rejects writes at the limit.
#   memory:
#     maxmemory: 512
#     maxmemory_policy: noeviction
