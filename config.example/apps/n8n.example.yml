---
# n8n workflow automation. Deploy the named PostgreSQL backend first.
# To host this instance on the Kubernetes cluster, uncomment:
# hosting:
#   method: kubernetes
#
# To use Docker on an LXC, set infrastructure.stacks.services-lxc.guest_type: lxc in
# config/infrastructure.yml and uncomment:
# hosting:
#   method: docker
# stack: services-lxc
#
# To run n8n natively on its own LXC (or set guest_type: vm for a VM), uncomment:
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc
app:
  database:
    instance: postgresql-n8n
    version: "16"
    name: n8n
    role: n8n
routing:
  access: internal
  identity: catalog
backup:
  enabled: true
  application_consistent: true
  schedule: "0 3 * * *"

# Recovery boundary: the named PostgreSQL database and either the Docker data directory or
# the Kubernetes /home/node/.n8n volume are captured together. The n8n encryption key stays
# in Vaultwarden and is carried to a new isolated target during restore; provider/execution
# credentials remain independent recovery dependencies.

# The n8n encryption key is generated once and stored in Vaultwarden under
# homelab-infra/apps/<instance>. Credentials and workflow data are application state;
# this example deliberately contains no credential values or tokens.
