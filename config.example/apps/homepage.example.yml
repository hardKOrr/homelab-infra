# Homepage — a stateless, lab-wide dashboard on Kubernetes.
#
# Copy to config/apps/homepage.yml. Entries are generated on every deploy from the approved
# topology fields in config/.generated/facts.yml. Do not add service URLs or credentials here:
# this file controls presentation only, and generated facts are not a secret store.

cluster: k3s-cluster

routing:
  access: internal
  identity: catalog
  # subdomain: homepage
  # estate: <name>  # required in a multi-estate lab; Homepage remains one lab-wide instance

presentation:
  title: Homelab
  theme: dark
  color: slate
  # platform_group: Platform
  # media_group: Media
  # layout: {}      # Homepage layout settings only; it cannot define service entries

# ── Docker on an LXC or a VM ───────────────────────────────────────────────────
# hosting:
#   method: docker
# stack: homepage          # a stack with guest_type: vm (the default), or
# # stack: homepage-lxc    # one declared guest_type: lxc under
# #                        # infrastructure.stacks in config/infrastructure.yml.

# ── Native on its own LXC or VM ────────────────────────────────────────────────
# Deploy builds the release pinned in app.native_version from Homepage's source with
# pnpm and runs it as a systemd service.
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc            # or vm
