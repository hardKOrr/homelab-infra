---
# BookStack documentation wiki on the services Docker stack.
# Deploy the named MariaDB/MySQL backend first. The database role, APP_KEY and initial
# administrator password are generated and stored in Vaultwarden; do not add credentials
# to this file.
app:
  database:
    instance: mariadb-bookstack
    name: bookstack
    role: bookstack
  data_path: /opt/bookstack/data
  # Initial administrator only; changing this after deployment is rejected by the role.
  admin_user: admin@example.invalid
  admin_name: Homelab Admin

routing:
  access: internal
  identity: catalog

backup:
  enabled: true
  schedule: "0 3 * * *"
  retention_days: 14

# Recovery is one named PBS snapshot containing a quiesced SQL dump and BookStack's
# /config data (page attachments, images, themes and generated state). Use the generated
# Backup BookStack and Restore BookStack jobs; neither operation changes the shared
# backend guest or any other database.

# To use Docker on an LXC, uncomment these instance overrides and set
# infrastructure.stacks.services-lxc.guest_type: lxc in config/infrastructure.yml.
# hosting:
#   method: docker
# stack: services-lxc

# To run BookStack natively (nginx and PHP-FPM, from BookStack's manual install) on its own
# guest instead of Docker, drop the stack line and set:
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc     # or vm; both use the same install
# Native backups are on-demand (Backup BookStack) and cover the same database dump and data.
