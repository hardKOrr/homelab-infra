---
# Proxmox Backup Server instance config.
# Copy to config/apps/pbs.yml. Only set values that differ from defaults
# in vars/app-defaults/pbs.yml. This file persists after removal — it is
# your restore point for re-deploying.
#
# Filename = instance name. The filename you choose becomes the VM name, the Caddy
# subdomain (pbs.yourdomain.com), and the Uptime Kuma monitor name.
#
# PBS is the only baseline service that is a VM. It ships as an ISO installer, so
# homelab-infra clones a Debian cloud-init template instead and installs the PBS
# packages from Proxmox's apt repository. The template is built automatically the
# first time a VM is needed — there is no manual step.
#
# The datastore PATH and retention live in config/infrastructure.yml under
# `backups:`, not here — they are platform-level settings.
#
# The API token is generated on first deploy and immediately stored and verified in
# `homelab-infra/backups`. Generated facts retain only its non-secret token ID.

# ── VM resources ───────────────────────────────────────────────────────────────
# proxmox:
#   vm:
#     cores: 4
#     memory: 4096        # MB — raise for large datastores; deduplication is memory-hungry
#     disk_size: 128      # GB — the OS disk. Add a second disk in Proxmox for the
#                         # datastore itself if you want backups on separate storage,
#                         # then point infrastructure.yml backups.datastore_path at it.
#     storage: local-lvm  # storage the cloned disk lands on
#   network: default    # OVERRIDE ONLY. PBS is `scope: lab`, so it resolves to the
#                       # network named `shared` when your lab declares one.

# ── Cloud-init template ────────────────────────────────────────────────────────
# Shared by every VM app on the same Proxmox node, and built once per node — Proxmox
# refuses to clone a VM across storage that is not shared, so a template on one node
# cannot provision a VM on another.
#
# Each node keeps exactly ONE. Changing image_url replaces that node's template in place
# on the next deploy instead of leaving a second one beside it; the image it was built
# from is stamped on the template, which is how the replacement is decided. Deleting the
# template VM in Proxmox also forces a rebuild.
#
# Pin image_url to a dated snapshot rather than `latest`. Templates built from `latest`
# on different days are different images, and nothing tells you until a guest behaves
# unlike its peers. When a pinned URL 404s — Debian prunes old snapshot directories after
# a few weeks — take the newest directory from
# https://cloud.debian.org/images/cloud/bookworm/ and put it here.
#
# vmid is optional and normally omitted: a free slot in 9000-9099 is chosen on the target
# node, and a template this platform already built there is adopted wherever it sits. Set
# it only to demand a particular slot.
# proxmox:
#   cloud_template:
#     name: debian-12-cloud
#     image_url: "https://cloud.debian.org/images/cloud/bookworm/20260821-2577/debian-12-genericcloud-amd64-20260821-2577.qcow2"
#     storage: local-lvm
#     vmid: 9000
#     vmid_range: [9000, 9099]

# ── App-specific config ────────────────────────────────────────────────────────
# app:
#   port: 8007              # PBS web UI and REST API
#   datastore_name: homelab # datastore created at infrastructure.yml backups.datastore_path
#   api_token_name: ansible # token id becomes root@pam!ansible
#
#   # Use pbs-enterprise instead if this lab has a Proxmox subscription.
#   apt_repo_component: pbs-no-subscription

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal
#   access: internal
#   # auth stays false — PBS has its own login, and forward-auth would also
#   # intercept the API that the backup configuration and PVE storage backend use.
