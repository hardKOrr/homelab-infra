---
# Uptime Kuma instance config.
# Copy to config/apps/uptime-kuma.yml. Only set values that differ from defaults
# in vars/app-defaults/uptime-kuma.yml. This file persists after removal — it is
# your restore point for re-deploying.
#
# Filename = instance name. The filename you choose becomes the Caddy subdomain
# (uptime-kuma.yourdomain.com) and the monitor name.
#
# The admin password and API key are generated into `homelab-infra/monitoring`; generated
# facts retain only topology and the non-secret notification ID.

# ── The one field worth setting ────────────────────────────────────────────────
# Uptime Kuma issues REST API keys only to a signed-in browser session, so the
# first key cannot be scripted. Until one exists, app deploys skip monitor
# registration (with a warning) rather than failing.
#
# One-time setup:
#   1. Open https://uptime-kuma.yourdomain.com and sign in as admin.
#   2. Profile -> API Keys -> Add API Key. Name it "homelab-infra".
#   3. Paste it below and re-run the Uptime Kuma deploy job.
#
# app:
#   api_key: "uk1_..."

# ── Stack placement ────────────────────────────────────────────────────────────
# stack: monitoring
#   To use Docker on an LXC, set stack: monitoring-lxc and
#   infrastructure.stacks.monitoring-lxc.guest_type: lxc in config/infrastructure.yml,
#   with hosting.method: docker.

# ── Other app config ───────────────────────────────────────────────────────────
# app:
#   port: 3001
#   admin_user: admin
#   monitor_interval: 60     # seconds between checks, applied to every monitor
#
#   # Pinned to an exact 2.x release (Docker image tag and native git tag alike).
#   # Version 1 has no REST API and cannot be used here.
#   image_tag: "2.5.9"

# ── Native on its own LXC or VM ───────────────────────────────────────────────
# Drop the stack line and set these; Deploy clones the pinned release and runs
# `npm run setup` (set guest_type: vm for a VM). Back up and restore first to keep monitors.
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal  # internal | external
#   access: internal # internal | public
#   # auth stays false — forward-auth in front would also intercept /api, which is
#   # how every app registers its monitor.
