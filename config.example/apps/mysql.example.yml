---
# MySQL backend instance configuration. Filename is the backend instance;
# for example, mysql.yml creates the `mysql` backend.
#
# Applications refer to it with:
#   database:
#     provider: mysql
#     instance: mysql
#     name: application_database
#     role: application_role

# proxmox:
#   guest_type: lxc        # lxc (default) or vm
#   node: <pve-node-2>     # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
#   cores: 4
#   memory: 4096
#
# app:
#   # MySQL account-host patterns for application guests. Never use `%`.
#   client_hosts: ["10.%"]
#   # Optional per-instance override in MiB. The default is 50% of proxmox.memory,
#   # the lower end of MySQL's 50–75% InnoDB buffer-pool guidance.
#   memory:
#     innodb_buffer_pool_size: 1024

# ── Docker on an LXC or a VM ───────────────────────────────────────────────────
# Runs the official image on a stack host; the stack's guest_type, lxc or vm, sets the
# guest. app.port is then the host port published for the container, and the buffer pool
# defaults to 512 MiB unless app.memory.innodb_buffer_pool_size is set.
# hosting:
#   method: docker
# stack: mysql          # set guest_type under infrastructure.stacks

# ── Kubernetes ─────────────────────────────────────────────────────────────────
# One Deployment of the same image on the k3s cluster; app.storage (Gi) sizes its
# default-StorageClass volume. app.port is the LoadBalancer port on the cluster's ingress
# address, so a second MySQL on one cluster needs a different port. Deploy opens that port
# on the firewall for each registered consumer. root gets a generated password, kept in
# this instance's Vaultwarden item, and may connect only from the pod network.
# hosting:
#   method: kubernetes
# app:
#   port: 3306
#   storage: 8
