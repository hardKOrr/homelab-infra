---
# MySQL backend instance configuration. Filename is the backend instance;
# for example, mysql.yml creates the `mysql` backend.
#
# Applications refer to it with:
#   database:
#     provider: mysql
#     instance: mysql
#     name: application_database
#     role: application_role

# proxmox:
#   cores: 4
#   memory: 4096
#
# app:
#   # MySQL account-host patterns for application guests. Never use `%`.
#   client_hosts: ["10.%"]
