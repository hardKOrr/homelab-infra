---
# APP_NAME instance config.
# Copy to config/apps/APP_NAME.yml (or APP_NAME-secondary.yml for a second instance).
# Only set values that differ from defaults in vars/app-defaults/APP_NAME.yml.
# This file persists after removal — it is your restore point for re-deploying.
#
# Filename = instance name. The filename you choose becomes the hostname,
# Caddy subdomain (APP_NAME.yourdomain.com), and Authentik app name.

# ── Proxmox resource overrides ─────────────────────────────────────────────────
# Uncomment and change only what you need. All values have sensible defaults.
# proxmox:
#   cores: 2
#   memory: 2048    # MB
#   network: default  # which `networks:` entry in config/proxmox.yml — one per VLAN
#   pool: apps        # which pool inside that network to allocate from. Must be
#                     # declared there; a Docker app otherwise inherits the pool
#                     # named after its stack, if one exists
#   ip_address: ""    # pin this instance to an exact address. Honoured as written or
#                     # refused with the conflict named — never quietly replaced.
#                     # Leave unset unless something outside the lab points at it

# ── Stack override (Docker apps only) ──────────────────────────────────────────
# stack: media_stack   # override which stack host this app runs on

# ── App-specific config ────────────────────────────────────────────────────────
# app:
#   port: 8080         # only needed if running multiple instances on the same stack host

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal        # internal | external — WHICH reverse proxy handles this app
#   access: internal       # internal | public — who may reach it. internal keeps the
#                          # route inside reverse_proxy.internal_cidrs; public opens it to
#                          # every source address, i.e. the internet on a WAN-facing proxy
#   identity: catalog      # none | catalog | oidc | forward_auth
#                          #   none         — no Authentik object at all
#                          #   catalog      — Authentik launch tile; app keeps its own login
#                          #   oidc         — OAuth2 provider; app consumes client_id/secret
#                          #   forward_auth — Authentik login enforced at the reverse proxy
#   subdomain: APP_NAME    # hostname on the domain (default: the instance name)
#   estate: personal       # which `domains:` estate this app belongs to (multi-domain labs)
