---
# Copy to config/apps/plex.yml (or plex-<estate>.yml). The filename is the
# deployment instance. Store a fresh Plex claim token before first deploy with
# Store Secret: item homelab-infra/apps/<instance>, field claim_token. Do not put
# that short-lived secret in this file.

# app:
#   # Optional: key of a proxmox.devices declaration with kind: igpu and mode: dedicated.
#   # It selects the device's stack VM and adds /dev/dri to Plex's container. The device
#   # declaration's optional `stack` defaults to its key; an explicit top-level stack here
#   # must match that effective stack.
#   gpu_device: intel-igpu
#   # Plex tells clients this route in bridge-network mode. Keep the explicit
#   # port: Plex rejects an incomplete custom access URL.
#   advertise_url: https://plex.example.test:443

# routing:
#   identity: catalog  # Plex owns client authentication; do not use forward_auth.
