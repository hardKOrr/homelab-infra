---
# Copy to config/apps/tautulli.yml (or tautulli-<estate>.yml). The selected
# Plex instance must already be deployed: its server token is stored in
# Vaultwarden by the Plex role and is never written here.

# app:
#   plex_instance: plex  # a different deployed Plex instance to observe

# routing:
#   identity: catalog    # Tautulli signs users in with Plex; do not use forward_auth.

# To use Docker on an LXC, set stack: media-lxc and
# infrastructure.stacks.media-lxc.guest_type: lxc in config/infrastructure.yml, with
# hosting.method: docker.

# To run on the Kubernetes cluster instead, set hosting.method: kubernetes (and drop the
# stack line). Tautulli mounts no media shares; it reaches Plex's published port.
