---
# MariaDB backend instance configuration. Filename is the backend instance;
# for example, mariadb.yml creates the `mariadb` backend.
#
# Applications refer to it with:
#   database:
#     provider: mariadb
#     instance: mariadb
#     name: application_database
#     role: application_role

# proxmox:
#   guest_type: lxc        # lxc (default) or vm
#   node: <pve-node-2>     # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
#   cores: 4
#   memory: 4096
#
# app:
#   # MariaDB account-host patterns for application guests. Never use `%`.
#   client_hosts: ["10.%"]
#   # Optional per-instance override in MiB. The default is 50% of proxmox.memory,
#   # the lower end of MariaDB's 50–75% InnoDB buffer-pool guidance.
#   memory:
#     innodb_buffer_pool_size: 1024

# ── Docker on an LXC or a VM ───────────────────────────────────────────────────
# Runs the official image on a stack host; the stack's guest_type, lxc or vm, sets the
# guest. app.port is then the host port published for the container, and the buffer pool
# defaults to 512 MiB unless app.memory.innodb_buffer_pool_size is set.
# hosting:
#   method: docker
# stack: mariadb          # set guest_type under infrastructure.stacks
