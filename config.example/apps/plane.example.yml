---
# Plane planning and collaboration. Deploy postgresql-plane and redis-plane first.
app:
  database:
    instance: postgresql-plane
    version: "16"
    name: plane
    role: plane
  redis:
    instance: redis-plane
routing:
  access: internal
  identity: catalog
backup:
  enabled: true
  application_consistent: true
  schedule: "0 3 * * *"

# Recovery boundary: Plane's PostgreSQL database, named Redis data, server/worker Compose
# state and the named local MinIO object-storage path are captured as one native PBS point.
# Plane application keys and backend credentials remain in Vaultwarden and are required
# independently during restore; this example deliberately contains no secret values.
