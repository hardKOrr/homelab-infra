---
# Replace all example values. Deploy only creates this tagged VM and attaches the ISO.
install: {method: official-iso, iso: local:iso/proxmox-datacenter-manager_<version>.iso}
proxmox:
  node: REPLACE_WITH_EXACT_PROXMOX_NODE
  storage: local-lvm
  vmid: 420
  ip_address: 192.0.2.42
  fqdn: pdm.example.internal
  bridge: vmbr0
  vlan: 0 # set the guest VLAN tag when the selected bridge is a trunk
remotes:
  - id: lab-pve
    type: pve
    nodes: [pve1.example.internal]
    authority: read-only
    vaultwarden: {item: homelab-infra/pdm-lab-pve, authid_field: authid, token_field: token}
# The exact TCP 8006 rules to these nodes must precede broad private-network denies.
# Set this below the relevant deny rule sequence when your firewall policy requires it.
firewall: {proxmox_api_sequence: 250}
# The configured Proxmox PBS storage that stores this VM's backups. The PDM VM backup
# includes /etc/proxmox-datacenter-manager/remotes.cfg; credentials remain in Vaultwarden.
backup: {storage: REPLACE_WITH_PBS_STORAGE_ID}
