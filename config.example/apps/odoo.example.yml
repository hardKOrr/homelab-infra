---
# Odoo Community CRM. Deploy the named PostgreSQL backend first.
# Odoo 18 Community is paired with PostgreSQL 16 (Odoo supports PostgreSQL 12+).
# Community CRM includes leads, opportunities, pipeline stages, activities and reporting.
# Enterprise-only features such as Studio, VoIP, lead mining and advanced support are not
# enabled or required by this baseline.
# Default: Docker on the services VM. Select Kubernetes explicitly after deploying
# the cluster; the named PostgreSQL backend stays outside Kubernetes.
hosting:
  method: docker  # kubernetes is also supported
app:
  # Kubernetes data_dir claim size in GiB, using the cluster's default StorageClass.
  # storage: 10
  database:
    instance: postgresql-odoo
    version: "16"
    name: odoo
    role: odoo
  filestore_path: /opt/odoo/odoo/filestore
routing:
  access: internal
  identity: catalog
backup:
  enabled: true
  application_consistent: true
  schedule: "0 3 * * *"
  # datastore: REPLACE_WITH_PBS_DATASTORE
  # backup_id: ""       # blank uses the instance name

# Recovery boundary: restore the PostgreSQL-odoo database and this instance's
# filestore from the same recovery point. The PostgreSQL backend is shared and
# must not be removed as part of Odoo removal. Both hosting methods use database.pxar
# (odoo.dump) and filestore.pxar, so their recovery points can move between methods.
