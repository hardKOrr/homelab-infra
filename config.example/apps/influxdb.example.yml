---
# InfluxDB OSS v2 backend instance configuration. Filename is the backend
# instance; for example, influxdb.yml creates the `influxdb` backend.
#
# The initial operator token and admin password are generated on first deploy
# and stored in Vaultwarden as homelab-infra/apps/<instance>. Do not put either
# secret in this file.

# proxmox:
#   guest_type: lxc        # lxc (default) or vm
#   node: <pve-node-2>     # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
#   cores: 4
#   memory: 4096
#
# app:
#   # These are setup-time identities. Change them only before the first deploy;
#   # InfluxDB does not rename an existing organization, bucket, or admin user.
#   organization: homelab
#   bucket: default
#   admin_user: homelab

# The native UI is served at https://influxdb.<lab-domain> through an internal
# Caddy route. InfluxDB keeps its own login; Authentik provides a catalog tile.
# routing:
#   subdomain: influxdb
#   proxy: internal
#   access: internal
#   identity: catalog

# The complete InfluxDB data directory is archived application-consistently to
# PBS while the service is stopped. Deploy includes the PBS client when the lab
# has a configured backup provider.
# backup:
#   enabled: true
#   application_consistent: true
#   retention_days: 14
