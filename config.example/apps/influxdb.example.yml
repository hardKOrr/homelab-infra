---
# InfluxDB OSS v2 backend instance configuration. Filename is the backend
# instance; for example, influxdb.yml creates the `influxdb` backend.
#
# The initial operator token and admin password are generated on first deploy
# and stored in Vaultwarden as homelab-infra/apps/<instance>. Do not put either
# secret in this file.

# Docker instead of a native guest: the stack's guest_type picks the LXC or VM.
# hosting:
#   method: docker
# stack: influxdb
#
# proxmox:
#   guest_type: lxc        # lxc (default) or vm
#   node: <pve-node-2>     # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
#   cores: 4
#   memory: 4096
#
# app:
#   # These are setup-time identities. Change them only before the first deploy;
#   # InfluxDB does not rename an existing organization, bucket, or admin user.
#   organization: homelab
#   bucket: default
#   admin_user: homelab
#   # Optional per-instance cache overrides, in MiB. The cache maximum is per shard;
#   # defaults allocate 1/32 of proxmox.memory per shard and snapshot at 1/40 of that.
#   memory:
#     storage_cache_max_memory_size_mib: 128
#     storage_cache_snapshot_memory_size_mib: 4

# Kubernetes instead: one Deployment on the k3s cluster, its data on a default-StorageClass
# volume of app.storage Gi. app.port is the LoadBalancer port on the cluster's ingress
# address, so a second InfluxDB on one cluster needs a different port. Deploy opens that
# port on the firewall for each registered consumer (`influxdb_host` and `influxdb_port` in
# the consumer's item). Caddy, DNS and the monitor are wired as on the other methods.
# hosting:
#   method: kubernetes
# app:
#   port: 8086
#   storage: 8

# The native UI is served at https://influxdb.<lab-domain> through an internal
# Caddy route. InfluxDB keeps its own login; Authentik provides a catalog tile.
# routing:
#   subdomain: influxdb
#   proxy: internal
#   access: internal
#   identity: catalog

# The complete InfluxDB data directory is archived application-consistently to
# PBS while the service is stopped. Deploy includes the PBS client when the lab
# has a configured backup provider.
# backup:
#   enabled: true
#   application_consistent: true
#   retention_days: 14
