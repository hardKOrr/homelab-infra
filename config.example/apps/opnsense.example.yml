---
# OPNsense appliance instance. Copy to config/apps/opnsense.yml before deploying.
# This creates a NEW firewall VM; it never adopts infrastructure.dns.provider: opnsense.
proxmox:
  vm:
    # Pick an unused Proxmox VMID. No guest agent means it cannot be derived from IP.
    vmid: 500
    # storage: local-lvm
  installer:
    # Attach these to distinct Proxmox bridges. WAN and LAN must never be the same.
    wan_bridge: vmbr0
    lan_bridge: vmbr1
    # To change release, override image_url, image_sha256 and image_name together
    # from the official nano release. Its imported disk uses proxmox.vm.storage.
bootstrap:
  # The runner must reach the new VM here; use isolated bridges for a drill.
  lan_address: 192.0.2.1
  lan_prefix: 24
