---
# Forgejo source control. Deploy the named PostgreSQL backend first.
app:
  database:
    instance: postgresql-forgejo
    version: "16"
    name: forgejo
    role: forgejo
  # Git-over-SSH is a direct publication and is intentionally not a Caddy route.
  ssh_port: 2222
routing:
  access: internal
  identity: catalog
backup:
  enabled: true
  schedule: "0 3 * * *"

# Forgejo Runner removal reads runner_api_token for user-scoped registrations or
# admin_api_token for global registrations from the Forgejo Vaultwarden item. Neither
# credential belongs in this file.
