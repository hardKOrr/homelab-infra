---
# Authentik instance config.
# Copy to config/apps/authentik.yml. Only set values that differ from defaults
# in vars/app-defaults/authentik.yml. This file persists after removal — it is
# your restore point for re-deploying.
#
# Filename = instance name; it must match sso.instance in config/infrastructure.yml.
# The hostname defaults to auth.yourdomain.com (routing.subdomain: auth in
# app-defaults) — override routing.subdomain below to use anything else.
#
# Authentik usually needs no overrides. Credentials are NOT set here: the admin
# Passwords, the bootstrap token, and OIDC client secrets are generated into canonical
# Vaultwarden items before use. Sign in as akadmin with the password in
# `homelab-infra/sso`.

# ── Stack placement ────────────────────────────────────────────────────────────
# Which stack host these containers run on. Authentik gets its own by default
# because it carries a database and every login in the lab depends on it.
# stack: sso_stack

# ── App-specific config ────────────────────────────────────────────────────────
# app:
#   port: 9000                    # HTTP listener published on the stack host
#   https_port: 9443              # HTTPS listener, unused behind the reverse proxy
#   admin_email: "you@example.com"   # akadmin's address — set this to reach password resets
#
#   # Image tag. Leave empty to track the latest GitHub release, which is what a
#   # re-run of this deploy installs. Pin a version here to freeze upgrades:
#   image_tag: "2025.10.1"
#
#   postgres_image: "docker.io/library/postgres:16-alpine"
#   redis_image: "docker.io/library/redis:7-alpine"

# ── Resource sizing ────────────────────────────────────────────────────────────
# Authentik is the heaviest baseline service (server + worker + PostgreSQL + Redis).
# Size the STACK HOST, not this app — see config/apps/<stack>.yml if you pin one,
# or let find-or-create-host provision the default. 4 GB RAM is a comfortable floor.

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal    # internal | external
#   access: internal   # internal | public. Authentik is the front door to SSO — make it
#                      # public only when people must sign in from off-LAN
#   subdomain: auth    # hostname is <subdomain>.<domain>; default auth
#   estate: foxglove   # deploy a second estate's Authentik: set its estate name
#                      # and its sso facts land under estates.<name>
#   # identity stays none — putting Authentik behind its own forward-auth
#   # deadlocks the login flow.

# ── Directory: groups and accounts ─────────────────────────────────────────────
# Declared here, created and kept correct through the Authentik API on every
# deploy. This is the answer to "who can sign in": an account reaches a published
# app only through a group bound to it, and every app playbook binds the group
# named homelab-users.
#
# What is declared is managed. What is NOT declared is never touched: an account
# you make in the UI keeps working, and deleting an entry from this file stops
# managing it rather than deleting the person. Deletion stays a deliberate act in
# the UI.
#
# Passwords are generated (28 characters), stored in the Vaultwarden item
# `homelab-infra/sso` as `user_<username>_password`, and set once — at creation.
# Change one in the UI and a re-deploy will not overwrite it. To rotate from here,
# set rotate_password: true on that account for one run.
#
# LISTS REPLACE, they do not merge. Declaring `groups:` below replaces the default
# list from vars/app-defaults/authentik.yml — which is exactly the homelab-users
# entry shown here, so keep it.
#
# directory:
#   groups:
#     - name: homelab-users        # bound to every published app by the wiring
#       is_superuser: false
#     - name: homelab-admins       # full administrative rights over Authentik
#       is_superuser: true
#
#   users:
#     - username: you
#       name: Your Name
#       email: you@example.com
#       groups: [homelab-users, homelab-admins]
#     - username: housemate
#       name: A Housemate
#       email: housemate@example.com
#       groups: [homelab-users]     # can reach the apps, cannot administer Authentik
#     - username: kiosk
#       name: Living room kiosk
#       type: service_account       # internal | service_account
#       groups: [homelab-users]
#
# Optional per account: is_active (default true), attributes (a free-form mapping
# Authentik exposes to policies and property mappings), path (default `users`),
# rotate_password (default false).
#
# Not managed from here: social login sources, MFA/authenticator stages and flow
# doctrine. Those are Authentik objects with no config surface in this repo yet —
# set them in the UI until there is one.
