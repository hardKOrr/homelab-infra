---
# Authentik instance config.
# Copy to config/apps/authentik.yml. Only set values that differ from defaults
# in vars/app-defaults/authentik.yml. This file persists after removal — it is
# your restore point for re-deploying.
#
# Filename = instance name; it must match sso.instance in config/infrastructure.yml.
# The hostname defaults to auth.yourdomain.com (routing.subdomain: auth in
# app-defaults) — override routing.subdomain below to use anything else.
#
# Authentik usually needs no overrides. Credentials are NOT set here: the admin
# Passwords, the bootstrap token, and OIDC client secrets are generated into canonical
# Vaultwarden items before use. Sign in as akadmin with the password in
# `homelab-infra/sso`.

# ── Stack placement ────────────────────────────────────────────────────────────
# Which stack host these containers run on. Authentik gets its own by default
# because it carries a database and every login in the lab depends on it.
# stack: sso_stack

# ── App-specific config ────────────────────────────────────────────────────────
# app:
#   port: 9000                    # HTTP listener published on the stack host
#   https_port: 9443              # HTTPS listener, unused behind the reverse proxy
#   admin_email: "you@example.com"   # akadmin's address — set this to reach password resets
#
#   # Image tag. Leave empty to track the latest GitHub release, which is what a
#   # re-run of this deploy installs. Pin a version here to freeze upgrades:
#   image_tag: "2025.10.1"
#
#   postgres_image: "docker.io/library/postgres:16-alpine"
#   redis_image: "docker.io/library/redis:7-alpine"

# ── Resource sizing ────────────────────────────────────────────────────────────
# Authentik is the heaviest baseline service (server + worker + PostgreSQL + Redis).
# Size the STACK HOST, not this app — see config/apps/<stack>.yml if you pin one,
# or let find-or-create-host provision the default. 4 GB RAM is a comfortable floor.

# ── Routing overrides ──────────────────────────────────────────────────────────
# routing:
#   proxy: internal    # internal | external
#   access: internal   # internal | public. Authentik is the front door to SSO — make it
#                      # public only when people must sign in from off-LAN
#   subdomain: auth    # hostname is <subdomain>.<domain>; default auth
#   estate: foxglove   # deploy a second estate's Authentik: set its estate name
#                      # and its sso facts land under estates.<name>
#   # identity stays none — putting Authentik behind its own forward-auth
#   # deadlocks the login flow.

# ── Directory: groups and accounts ─────────────────────────────────────────────
# Declared here, created and kept correct through the Authentik API on every
# deploy. This is the answer to "who can sign in": an account reaches a published
# app only through a group bound to it, and every app playbook binds the group
# named homelab-users.
#
# What is declared is managed. What is NOT declared is never touched: an account
# you make in the UI keeps working, and deleting an entry from this file stops
# managing it rather than deleting the person. Deletion stays a deliberate act in
# the UI.
#
# Passwords are generated (28 characters), stored in the Vaultwarden item
# `homelab-infra/sso` as `user_<username>_password`, and set once — at creation.
# Change one in the UI and a re-deploy will not overwrite it. To rotate from here,
# set rotate_password: true on that account for one run.
#
# LISTS REPLACE, they do not merge. Declaring `groups:` below replaces the default
# list from vars/app-defaults/authentik.yml — which is exactly the homelab-users
# entry shown here, so keep it.
#
# directory:
#   groups:
#     - name: homelab-users        # bound to every published app by the wiring
#       is_superuser: false
#     - name: homelab-admins       # full administrative rights over Authentik
#       is_superuser: true
#
#   users:
#     - username: you
#       name: Your Name
#       email: you@example.com
#       groups: [homelab-users, homelab-admins]
#     - username: housemate
#       name: A Housemate
#       email: housemate@example.com
#       groups: [homelab-users]     # can reach the apps, cannot administer Authentik
#     - username: kiosk
#       name: Living room kiosk
#       type: service_account       # internal | service_account
#       groups: [homelab-users]
#
# Optional per account: is_active (default true), attributes (a free-form mapping
# Authentik exposes to policies and property mappings), path (default `users`),
# rotate_password (default false).

# ── MFA: authenticator stages ──────────────────────────────────────────────────
# A fresh Authentik OFFERS multi-factor and does not require it: the validation
# stage in the login flow is set to `not_configured_action: skip`, so an account
# with no second factor signs in on a password alone. Two declarations turn that
# into enforcement.
#
# `configure` is the setting that makes this painless — a user with no factor is
# sent into the named setup stage on their next login instead of being refused, so
# enrolment happens by itself and nobody has to be chased. `deny` refuses the login
# outright; declare it only once everybody has enrolled, or you lock the lab out.
#
# The keys under `authenticators` are Authentik's own stage kinds — totp, static,
# webauthn, duo, sms, email, validate — and every field each kind accepts is passed
# straight through, so anything the UI can set is settable here.
#
# authenticators:
#   validate:
#     - name: default-authentication-mfa-validation   # the stage the login flow runs
#       device_classes: [totp, webauthn, static]      # which factors count
#       not_configured_action: configure              # skip | deny | configure
#       configuration_stages:                         # where `configure` sends them
#         - default-authenticator-totp-setup
#   totp:
#     - name: default-authenticator-totp-setup
#       friendly_name: Authenticator app              # what the login page calls it
#       digits: "6"
#   static:
#     - name: default-authenticator-static-setup      # printable recovery codes
#       token_count: 6

# ── Flows and stage bindings ───────────────────────────────────────────────────
# Only for a lab that wants a different login experience than the shipped one — a
# second authentication flow for one estate, a passwordless flow, an enrolment flow
# for a public source. A flow is identified by its slug; `stages` binds existing
# stages into it in `order` sequence.
#
# Declared bindings are added and corrected; bindings you made in the UI on the same
# flow are left alone unless the flow sets `stages_exact: true`, which deletes every
# binding this file does not list — the one destructive option in this role, and it
# can make a login flow unusable if the list is incomplete.
#
# flows:
#   - slug: lab-authentication
#     designation: authentication
#     name: Lab login
#     title: Sign in to the lab
#     stages:
#       - stage: default-authentication-identification
#         order: 10
#       - stage: default-authentication-password
#         order: 20
#       - stage: default-authentication-mfa-validation
#         order: 30
#       - stage: default-authentication-login
#         order: 100

# ── OAuth login sources ────────────────────────────────────────────────────────
# "Sign in with Google / GitHub / …" — Authentik as the client of somebody else's
# identity provider. You register the lab with that provider first and it gives you
# a client id and a client secret.
#
# The client id goes here; THE CLIENT SECRET DOES NOT. Store it in the Vaultwarden
# item `homelab-infra/sso` (or `homelab-infra/estates/<estate>/sso`) under the field
# name `source_<slug>_secret` using the Store Secret job, exactly as Caddy's DNS
# challenge token is stored. The deploy fails with the missing field named if it is
# not there.
#
# `user_matching_mode: email_link` links a Google login to the existing account with
# the same e-mail address, which is what makes a source an additional way into an
# account rather than a second account.
#
# sources:
#   oauth:
#     - slug: google                  # also the callback URL segment
#       provider_type: google         # google, github, gitlab, discord, okta,
#                                     #   entraid, apple, openidconnect, ...
#       name: Google
#       consumer_key: "1234567890-abcdef.apps.googleusercontent.com"
#       user_matching_mode: email_link
#       enrollment_flow: default-source-enrollment
#       authentication_flow: default-source-authentication
#
#     # A provider with no built-in profile needs its endpoints named:
#     - slug: work-idp
#       provider_type: openidconnect
#       name: Work SSO
#       consumer_key: "homelab"
#       oidc_well_known_url: https://idp.example.com/.well-known/openid-configuration
#       authorization_url: https://idp.example.com/authorize
#       access_token_url: https://idp.example.com/token
#       profile_url: https://idp.example.com/userinfo

# ── Brands ─────────────────────────────────────────────────────────────────────
# What the login page calls itself, and which flows it runs. A brand is matched by
# the domain the browser asked for, so a two-estate lab can present two sign-in
# pages — and point each at its own flows. The installer's catch-all brand
# `authentik-default` is left alone unless you declare it, and it should be: it
# answers every domain no declared brand matches.
#
# Logo and favicon are paths Authentik serves, not local files. Put your own under
# the instance's media directory and reference them as /media/public/<file>.
#
# brands:
#   - domain: auth.example.com
#     branding_title: Example Lab
#     branding_logo: /media/public/logo.svg
#     branding_favicon: /media/public/favicon.png
#     flow_authentication: default-authentication-flow
#     flow_invalidation: default-invalidation-flow
#     flow_user_settings: default-user-settings-flow
#     flow_recovery: ""              # empty string = no password reset link
#
# LISTS REPLACE here too: declaring any of the four keys above replaces the default
# from vars/app-defaults/authentik.yml, which is an empty list in each case.
