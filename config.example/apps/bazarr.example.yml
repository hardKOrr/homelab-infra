---
# Copy to config/apps/bazarr.yml (or bazarr-<estate>.yml).
# The filename is the deployment instance; the published URL stays bazarr.<domain>.
# app.mounts overrides media_storage.mounts only when Bazarr needs different paths.
# routing.identity defaults to forward_auth for the browser UI.
# To use Docker on an LXC, uncomment these instance overrides and set
# infrastructure.stacks.media-lxc.guest_type: lxc in config/infrastructure.yml.
# Keep other media apps on their existing stack.
# hosting:
#   method: docker
# stack: media-lxc
# To run on the Kubernetes cluster instead, set hosting.method: kubernetes (and drop the
# stack line). app.mounts are mounted from their existing NFS exports at the same paths.
# To run Bazarr natively on its own guest instead of Docker, set:
# hosting:
#   method: native
# proxmox:
#   guest_type: lxc     # or vm; both use the same install and systemd service
# Native installation uses upstream's Linux release:
# https://wiki.bazarr.media/Getting-Started/Installation/Linux/linux/
