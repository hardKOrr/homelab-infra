---
# Kometa's secret-bearing config.yml belongs in Vaultwarden field config_yml of
# homelab-infra/apps/kometa. Optional custom collection definitions belong in the same
# item's collections_yml field. Reference that file from config_yml with:
#
#   libraries:
#     P2 Canary:
#       collection_files:
#         - file: config/collections.yml
#
# Both values are mounted from a Kubernetes Secret, never written to config/ or job output.
# This file controls the scheduled runtime.
# app:
#   image: "kometateam/kometa:latest"
#   storage: 1
#   schedule: "0 5 * * *"
#   timeout_seconds: 7200

# ── Docker on an LXC or a VM ───────────────────────────────────────────────────
# hosting:
#   method: docker
# stack: kometa             # a stack with guest_type: vm (the default), or
# # stack: kometa-lxc       # one declared guest_type: lxc under
# #                         # infrastructure.stacks in config/infrastructure.yml.
# # On Docker Kometa's own scheduler runs it daily at app.run_times (default "05:00").
# # app:
# #   run_times: "05:00"
