---
# SABnzbd instance config.
# Copy to config/apps/sabnzbd.yml (or sabnzbd-4k.yml, etc.).
# The filename you choose IS the instance name: it becomes the hostname,
# Caddy subdomain (sabnzbd.yourdomain.com), and Authentik app name.
#
# Only set values that differ from the defaults in vars/app-defaults/sabnzbd.yml.
# This file persists after removal — it is your restore point.
#
# Your news server is NOT configured here and never will be: the provider and its
# credentials are yours. Add it once in the SABnzbd web interface after the first
# deploy. The deploy seeds sabnzbd.ini and then leaves it alone, so the server
# survives every re-deploy.

# ── Stack assignment (Docker app) ──────────────────────────────────────────────
stack: media     # which Docker stack host this app runs on

# ── App config ─────────────────────────────────────────────────────────────────
app:
  # Where downloads land, as the container sees it. The deploy creates `incomplete`
  # and `complete` subdirectories under it. It must be inside a media_storage mount
  # declared in config/infrastructure.yml: the *arr apps import from the completed
  # directory into the library, and that import is a hardlink rather than a copy
  # only when both are on one filesystem. The deploy refuses a path outside them.
  #
  # Left unset it defaults to <first media_storage mount>/downloads — the same
  # place qBittorrent writes, which is intended. Override it for a SECOND SABnzbd
  # instance: two of them sharing one incomplete directory fight over the same
  # partial files.
  download_path: /mnt/downloads

  # port: 8085                 # the web port the stack host publishes. 8085 and
  #                            # not 8080 because qBittorrent already holds 8080
  #                            # on this stack. Change it if something else does.
  # container_port: 8080       # the port SABnzbd listens on inside the image. The
  #                            # deploy writes it into sabnzbd.ini; change both or
  #                            # neither.
  # host_whitelist:            # which Host headers SABnzbd will answer. Derived
  #   - sabnzbd.example.com    # from the subdomain and domain when unset. Set it
  #                            # only if you publish this app under another name —
  #                            # SABnzbd refuses a request naming a host it does
  #                            # not know, which looks like a broken proxy.
  #
  # The API key is generated by the deploy, proven against the running app and
  # stored in Vaultwarden under homelab-infra/media/<instance> — never set here.
  # A re-deploy keeps the key the app already answers to.

# ── Routing ────────────────────────────────────────────────────────────────────
# routing:
#   proxy: internal            # internal | external (WHICH reverse proxy handles this app)
#   access: internal           # internal | public (WHO may reach it — public means the
#                              # internet on a WAN-facing proxy)
#   identity: catalog          # none | catalog | oidc | forward_auth.
#                              # catalog is the default and the right one: unlike the
#                              # *arr apps, SABnzbd keeps its own authentication,
#                              # because its API key is what they authenticate to it
#                              # with. forward_auth would intercept /api and break
#                              # every download client entry in the lab.
