---
# Forgejo Actions runner. Deploy Forgejo first and create a token for this named runner.
app:
  forgejo:
    instance: forgejo
  runner_name: forgejo-runner
  labels: "docker:docker://docker.io/library/alpine:3.20"
routing:
  proxy: none
  access: internal
  identity: none
backup:
  enabled: true
  schedule: "0 3 * * *"

# Store runner_token only in Vaultwarden item homelab-infra/apps/<instance>. Runner
# deregistration uses runner_api_token for a user-scoped registration or admin_api_token
# for a global registration from the named Forgejo Vaultwarden item; neither credential
# is accepted from tracked configuration.

# To use Docker on an LXC, uncomment these instance overrides and set
# infrastructure.stacks.forgejo-runner-lxc.guest_type: lxc in config/infrastructure.yml.
# hosting:
#   method: docker
# stack: forgejo-runner-lxc

# To run on the Kubernetes cluster instead, use the cluster method. The runner keeps its
# registration on a default-StorageClass volume and runs Docker as a privileged sidecar.
# hosting:
#   method: kubernetes
