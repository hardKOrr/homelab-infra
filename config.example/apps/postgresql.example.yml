---
# PostgreSQL backend instance configuration. Filename is the backend instance;
# for example, postgresql.yml creates the `postgresql` backend.
#
# This backend has no route. Applications refer to it with:
#   database:
#     provider: postgresql
#     instance: postgresql
#     name: application_database
#     role: application_role
#
# The default backend is PostgreSQL 16. Keep application/database version pairings
# explicit when an application requires a particular major version.
# PostgreSQL defaults to a native LXC. Choose vm or lxc per instance; Deploy refuses
# a configured guest type that differs from an existing guest.

# proxmox:
#   guest_type: lxc       # lxc (default) or vm
#   node: <pve-node-2>    # optional; defaults to config/proxmox.yml proxmox.node
#   storage: <pve-storage> # optional; defaults to config/proxmox.yml proxmox.storage
#   cores: 4
#   memory: 4096
#
# app:
#   # Restrict this to the CIDRs that contain application guests. Do not expose
#   # PostgreSQL directly to the internet.
#   client_cidrs: ["10.0.0.0/8"]
#   # Optional per-instance memory overrides, in MiB. Defaults derive from proxmox.memory:
#   # shared_buffers is 25%, effective_cache_size is 75%, and work_mem is RAM / 800.
#   memory:
#     shared_buffers: 1024
#     effective_cache_size: 3072
#     work_mem: 4
