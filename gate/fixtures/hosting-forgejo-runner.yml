---
- name: Resolve Forgejo runner's default VM and opt-in LXC stack
  hosts: localhost
  gather_facts: false
  vars:
    instance: forgejo-runner
    hosting_app_slug: forgejo-runner
    hosting_app_defaults_file: "{{ playbook_dir }}/../../ansible/vars/app-defaults/forgejo-runner.yml"
    hosting_stack_defaults_file: "{{ playbook_dir }}/../../ansible/vars/stack-defaults.yml"
    _forgejo_runner_defaults: >-
      {{ (lookup('ansible.builtin.file', hosting_app_defaults_file) | from_yaml).forgejo_runner_defaults }}
    homelabinfra_config:
      infrastructure:
        stacks:
          forgejo-runner-lxc:
            guest_type: lxc
  tasks:
    - name: Validate the default configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: "{{ _forgejo_runner_defaults }}"

    - name: Require the unchanged VM default
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-vm'
          - _hosting_stack_name == 'services'

    - name: Validate the drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _forgejo_runner_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'forgejo-runner-lxc'}, recursive=True) }}

    - name: Require the selected LXC stack
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-lxc'
          - _hosting_stack_name == 'forgejo-runner-lxc'
