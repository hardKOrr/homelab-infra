---
- name: Resolve Observability's default VM and opt-in LXC stack
  hosts: localhost
  gather_facts: false
  vars:
    instance: observability
    hosting_app_slug: observability
    hosting_app_defaults_file: "{{ playbook_dir }}/../../ansible/vars/app-defaults/observability.yml"
    hosting_stack_defaults_file: "{{ playbook_dir }}/../../ansible/vars/stack-defaults.yml"
    _observability_defaults: >-
      {{ (lookup('ansible.builtin.file', hosting_app_defaults_file) | from_yaml).observability_defaults }}
    homelabinfra_config:
      infrastructure:
        stacks:
          monitoring-lxc:
            guest_type: lxc
  tasks:
    - name: Validate the default configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: "{{ _observability_defaults }}"

    - name: Require the unchanged VM default
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-vm'
          - _hosting_stack_name == 'monitoring'

    - name: Validate the drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _observability_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'monitoring-lxc'}, recursive=True) }}

    - name: Require the selected LXC stack
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-lxc'
          - _hosting_stack_name == 'monitoring-lxc'
