---
- name: Resolve Lidarr's default VM and opt-in LXC stack
  hosts: localhost
  gather_facts: false
  vars:
    instance: lidarr
    hosting_app_slug: lidarr
    hosting_app_defaults_file: "{{ playbook_dir }}/../../ansible/vars/app-defaults/lidarr.yml"
    hosting_stack_defaults_file: "{{ playbook_dir }}/../../ansible/vars/stack-defaults.yml"
    _lidarr_defaults: >-
      {{ (lookup('ansible.builtin.file', hosting_app_defaults_file) | from_yaml).lidarr_defaults }}
    homelabinfra_config:
      infrastructure:
        stacks:
          media-lxc:
            guest_type: lxc
  tasks:
    - name: Validate the default configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: "{{ _lidarr_defaults }}"

    - name: Require the unchanged VM default
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-vm'
          - _hosting_stack_name == 'media'

    - name: Write a capability declaration that lists Docker on an LXC
      ansible.builtin.tempfile:
        state: file
        suffix: .yml
      register: _tmp
    - name: Fill it
      ansible.builtin.copy:
        dest: "{{ _tmp.path }}"
        content: >-
          {{ {'lidarr_defaults': _lidarr_defaults
              | combine({'hosting': {'supported': ['docker-vm', 'docker-lxc']}}, recursive=True)}
             | to_nice_yaml }}
        mode: "0600"
      register: _patched

    - name: Validate the drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _lidarr_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'media-lxc'}, recursive=True) }}
        # Lidarr lists docker-lxc only once its drill passes; validate against a copy that does.
        hosting_app_defaults_file: "{{ _patched.dest }}"

    - name: Require the selected LXC stack
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-lxc'
          - _hosting_stack_name == 'media-lxc'

    - name: Remove the temporary declaration
      ansible.builtin.file:
        path: "{{ _tmp.path }}"
        state: absent
