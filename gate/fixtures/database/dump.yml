---
# Gate stand-in for ansible/tasks/database/dump.yml. A role test puts a `database-fixture`
# stub on PATH that plays the database; it receives the same inputs the shared file gets.
- name: Database fixture | dump
  ansible.builtin.command:
    argv:
      - database-fixture
      - dump
      - "{{ database_dump_file }}"
      - "{{ database_app_instance }}"
      - "{{ database_app_config.name }}"
  changed_when: true
