---
- name: Resolve Jellyseerr's Kubernetes default and opt-in Docker stacks
  hosts: localhost
  gather_facts: false
  vars:
    instance: jellyseerr
    hosting_app_slug: jellyseerr
    hosting_app_defaults_file: "{{ playbook_dir }}/../../ansible/vars/app-defaults/jellyseerr.yml"
    hosting_stack_defaults_file: "{{ playbook_dir }}/../../ansible/vars/stack-defaults.yml"
    _jellyseerr_defaults: >-
      {{ (lookup('ansible.builtin.file', hosting_app_defaults_file) | from_yaml).jellyseerr_defaults }}
    homelabinfra_config:
      infrastructure:
        stacks:
          jellyseerr-lxc:
            guest_type: lxc
  tasks:
    - name: Validate the default configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: "{{ _jellyseerr_defaults }}"

    - name: Require the unchanged Kubernetes default
      ansible.builtin.assert:
        that: _hosting_combination == 'kubernetes'

    - name: Validate the VM drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _jellyseerr_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'jellyseerr'}, recursive=True) }}

    - name: Require the VM combination
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-vm'
          - _hosting_stack_name == 'jellyseerr'

    - name: Validate the LXC drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _jellyseerr_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'jellyseerr-lxc'}, recursive=True) }}

    - name: Require the LXC combination
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-lxc'
          - _hosting_stack_name == 'jellyseerr-lxc'

    - name: Validate the native LXC drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _jellyseerr_defaults
             | combine({'hosting': {'method': 'native'}, 'stack': '',
                        'proxmox': {'guest_type': 'lxc'}}, recursive=True) }}

    - name: Require the native LXC combination
      ansible.builtin.assert:
        that: _hosting_combination == 'native-lxc'

    - name: Validate the native VM drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _jellyseerr_defaults
             | combine({'hosting': {'method': 'native'}, 'stack': '',
                        'proxmox': {'guest_type': 'vm'}}, recursive=True) }}

    - name: Require the native VM combination
      ansible.builtin.assert:
        that: _hosting_combination == 'native-vm'
