---
- name: Resolve Mixpost's Kubernetes default and opt-in Docker stacks
  hosts: localhost
  gather_facts: false
  vars:
    instance: mixpost
    hosting_app_slug: mixpost
    hosting_app_defaults_file: "{{ playbook_dir }}/../../ansible/vars/app-defaults/mixpost.yml"
    hosting_stack_defaults_file: "{{ playbook_dir }}/../../ansible/vars/stack-defaults.yml"
    _mixpost_defaults: >-
      {{ (lookup('ansible.builtin.file', hosting_app_defaults_file) | from_yaml).mixpost_defaults }}
    homelabinfra_config:
      infrastructure:
        stacks:
          mixpost-lxc:
            guest_type: lxc
  tasks:
    - name: Validate the default configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: "{{ _mixpost_defaults }}"

    - name: Require the unchanged Kubernetes default
      ansible.builtin.assert:
        that: _hosting_combination == 'kubernetes'

    - name: Validate the VM drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _mixpost_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'mixpost'}, recursive=True) }}

    - name: Require the VM combination
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-vm'
          - _hosting_stack_name == 'mixpost'

    - name: Validate the LXC drill configuration
      ansible.builtin.include_tasks: ../../ansible/tasks/hosting/validate-app.yml
      vars:
        hosting_app_config: >-
          {{ _mixpost_defaults
             | combine({'hosting': {'method': 'docker'}, 'stack': 'mixpost-lxc'}, recursive=True) }}

    - name: Require the LXC combination
      ansible.builtin.assert:
        that:
          - _hosting_combination == 'docker-lxc'
          - _hosting_stack_name == 'mixpost-lxc'
